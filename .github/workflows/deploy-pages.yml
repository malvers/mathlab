# Publishes the static site from HTML/ as the GitHub Pages site root (apex URL).
# Requires: Repo Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      simulate_hang:
        description: "Test the retry: the first deploy gives up at its first status check, as if Pages hung"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Keep FALSE for Pages (GitHub's recommended setting): cancelling an in-flight Pages deploy reports the
  # run as a FAILURE and can jam the Pages backend so later deploys fail with "Deployment failed, try again
  # later". Flipping this to true (1814ad2, 2026-07-05) caused exactly that on 2026-07-06 — reverted (Doc).
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Pages artifact is only HTML/; screenshots live in repo-root resources/screenshots (tracked).
      # Copy them into the site tree so intro.html / universe.html paths resolve online.
      - name: Copy screenshots into HTML bundle
        run: |
          mkdir -p HTML/resources/screenshots
          cp resources/screenshots/*.png HTML/resources/screenshots/ 2>/dev/null || true

      # Lines-of-code counter in the intro (Doc 2026-10-27: it must follow every change, not a manual run).
      # The runner only has this repo; Doc's other projects come from loc-extern.json, which every local
      # run of the script refreshes. A failed count keeps the committed loc.js instead of failing the deploy.
      - name: Count lines of code
        run: python3 HTML/resources/scripts/update_loc.py || echo "LOC count failed - keeping the committed loc.js"

      # Keep the Pages artifact lean: HTML/ grew to ~288 MB and the deploy step then timed out
      # (Doc 2026-07-01, "All jobs have failed" after 10 min). Stage the site WITHOUT the source-only
      # full-res originals in resources/screenshots_original/ (~77 MB, referenced only by posterstudio.html)
      # — they stay in git, they're just not published. Live pages use the downscaled resources/screenshots/.
      - name: Stage site (drop heavy source-only assets)
        run: |
          rsync -a --delete --exclude 'resources/screenshots_original/' HTML/ _site/
          echo "Staged site size:"; du -sh _site

      # The tab icon in the repo is the RED lambda, so every local server shows red, whatever port or
      # worktree (Doc 2026-10-27: localhost "zwingend rot", only docalvers.de may be orange). Only here,
      # for the live site, the orange one goes over it. No `|| true`: a missing file fails the deploy
      # instead of putting the red icon online.
      - name: Orange tab icon for the live site
        run: |
          cp HTML/resources/favicon-live.svg _site/resources/favicon.svg
          cp HTML/resources/favicon-live.png _site/resources/favicon.png
          # root favicon.ico: what a browser asks for when a page links no icon (red in the repo too)
          cp HTML/resources/favicon-live.ico _site/favicon.ico

      # EXPERIMENT (Doc 2026-07-06): the "Stamp build id into every page" step (13a6e0d, 2026-07-03) is
      # REMOVED. It appended a <!-- build SHA --> to ALL ~103 HTML files on every deploy, forcing GitHub to
      # re-sync every page each time. Pages deploy failures escalated exactly from 2026-07-03 (≈0% for
      # months → 20→33%), every one failing at the "syncing_files" stage — prime suspect. Watching whether
      # the failure rate falls back to ~0% without it. Trade-off while removed: a CSS/JS-only deploy may keep
      # a stale ?v= cache-bust (document.lastModified only bumps when the HTML's bytes change). Restore or
      # replace with a lighter version-bump (touch only the few ?v= pages) via: git show 13a6e0d.

      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # Auto-retry (Doc, 2026-11-07: "Ja, bau das bitte so", the idea parked since 2026-07-06). Pages now and
      # then hangs in "syncing_files" until deploy-pages gives up after 10 min ("Timeout reached, aborting!",
      # 3 of 21 deploys on 06./07.11.2026) - GitHub's side: the same artifact synced in 13 s an hour before.
      # Instead of failing and mailing Doc, wait and deploy the same artifact again, up to two times.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          # Normally the 10-min maximum. The manual test switch (Run workflow → simulate_hang) makes it give
          # up and cancel at its first status check, which is exactly what a hang ends in.
          timeout: ${{ github.event.inputs.simulate_hang == 'true' && '1' || '600000' }}

      # The first version of this retry (01107822) ran deploy-pages again and never worked: deploy-pages
      # always names the deployment after the commit SHA, so the retry re-attached to the deployment it had
      # just cancelled, saw an empty status for 10 min and failed (c7c66b46, 2026-11-07: 35 min, mail anyway).
      # So the retries talk to the Pages API directly, with a build version of their own per attempt.
      - name: Deploy to GitHub Pages (retry with a fresh deployment)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/github-script@v8
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            const FINAL = ['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost'];
            const WAITS = [60, 120]; // seconds before retry 1 and retry 2
            const LIMIT = 10 * 60 * 1000; // same 10 min as deploy-pages

            for (let n = 1; n <= WAITS.length; n++) {
              core.info(`Waiting ${WAITS[n - 1]} s before retry ${n} ...`);
              await sleep(WAITS[n - 1] * 1000);

              // Unique per run, run attempt and retry, so it never meets an earlier deployment
              const version = `${context.sha}-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}-${n}`;
              let deployment;
              try {
                const { data } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
                  owner, repo,
                  artifact_id: Number(process.env.ARTIFACT_ID),
                  pages_build_version: version,
                  oidc_token: await core.getIDToken()
                });
                deployment = data;
              } catch (error) {
                core.warning(`Retry ${n}: could not create the deployment (${error.status ?? ''} ${error.message})`);
                continue;
              }
              const id = deployment.id || deployment.status_url?.split('/').pop() || version;
              core.info(`Retry ${n}: created deployment ${id}`);

              const start = Date.now();
              let status = '';
              while (Date.now() - start < LIMIT) {
                await sleep(10000);
                let now;
                try {
                  ({ data: { status: now } } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{id}', { owner, repo, id }));
                } catch (error) {
                  now = `unreadable (${error.status ?? error.message})`;
                }
                if (now !== status) core.info(`Current status: ${now}`);
                status = now;
                if (status === 'succeed' || FINAL.includes(status)) break;
              }

              if (status === 'succeed') {
                core.setOutput('page_url', deployment.page_url);
                core.info(`Deployed on retry ${n}: ${deployment.page_url}`);
                return;
              }
              if (!FINAL.includes(status)) {
                await github.request('POST /repos/{owner}/{repo}/pages/deployments/{id}/cancel', { owner, repo, id })
                  .catch(error => core.warning(`Retry ${n}: cancel failed (${error.status ?? error.message})`));
              }
              core.warning(`Retry ${n} failed, last status: "${status}"`);
            }
            core.setFailed('Pages deployment failed on the first try and on both retries');
