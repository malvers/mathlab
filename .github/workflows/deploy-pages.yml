# Publishes the static site from HTML/ as the GitHub Pages site root (apex URL).
# Requires: Repo Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Keep FALSE for Pages (GitHub's recommended setting): cancelling an in-flight Pages deploy reports the
  # run as a FAILURE and can jam the Pages backend so later deploys fail with "Deployment failed, try again
  # later". Flipping this to true (1814ad2, 2026-07-05) caused exactly that on 2026-07-06 — reverted (Doc).
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Pages artifact is only HTML/; screenshots live in repo-root resources/screenshots (tracked).
      # Copy them into the site tree so intro.html / universe.html paths resolve online.
      - name: Copy screenshots into HTML bundle
        run: |
          mkdir -p HTML/resources/screenshots
          cp resources/screenshots/*.png HTML/resources/screenshots/ 2>/dev/null || true

      # Keep the Pages artifact lean: HTML/ grew to ~288 MB and the deploy step then timed out
      # (Doc 2026-07-01, "All jobs have failed" after 10 min). Stage the site WITHOUT the source-only
      # full-res originals in resources/screenshots_original/ (~77 MB, referenced only by posterstudio.html)
      # — they stay in git, they're just not published. Live pages use the downscaled resources/screenshots/.
      - name: Stage site (drop heavy source-only assets)
        run: |
          rsync -a --delete --exclude 'resources/screenshots_original/' HTML/ _site/
          echo "Staged site size:"; du -sh _site

      # EXPERIMENT (Doc 2026-07-06): the "Stamp build id into every page" step (13a6e0d, 2026-07-03) is
      # REMOVED. It appended a <!-- build SHA --> to ALL ~103 HTML files on every deploy, forcing GitHub to
      # re-sync every page each time. Pages deploy failures escalated exactly from 2026-07-03 (≈0% for
      # months → 20→33%), every one failing at the "syncing_files" stage — prime suspect. Watching whether
      # the failure rate falls back to ~0% without it. Trade-off while removed: a CSS/JS-only deploy may keep
      # a stale ?v= cache-bust (document.lastModified only bumps when the HTML's bytes change). Restore or
      # replace with a lighter version-bump (touch only the few ?v= pages) via: git show 13a6e0d.

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
