<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOC ALVERS MATHE-LABORE | ANN</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="resources/favicon.png">
    <link rel="stylesheet" href="js/cyber-layout.css">
    <link rel="stylesheet" href="js/buttons-ultra.css">
    <link rel="stylesheet" href="js/cyber-lab-overrides.css">
    <link rel="stylesheet" href="js/branding.styles.extracted.css">
    <link rel="stylesheet" href="js/lab-shell-minimal.css">
</head>

<body>
    <nav id="mini-rail">
        <div class="nav-btn" onclick="toggleSidebar()" title="Toggle Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </div>
    </nav>

    <aside id="side-panel">
        <header id="sidebar-header"></header>
        <div id="ui-container"></div>
    </aside>

    <main id="main-content">
        <div id="canvas-container">
            <div class="cyber-grid"></div>
            <div id="math-coach-box">
                <div class="coach-title" id="coach-title-slot"></div>
                <div id="coach-content" class="coach-message"></div>
            </div>
            <canvas id="canvas"></canvas>
        </div>
    </main>

    <script src="js/cyber-left-chrome.js"></script>
    <script src="js/branding/briefings.js"></script>
    <script src="js/branding/overlays.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/i18n-de.js"></script>
    <script src="js/i18n-en.js"></script>
    <script src="js/i18n-es.js"></script>
    <script src="js/i18n-fr.js"></script>
    <script src="js/i18n-it.js"></script>
    <script src="js/i18n-pt.js"></script>
    <script src="js/i18n-sw.js"></script>
    <script src="js/i18n-tr.js"></script>
    <script src="js/i18n-nl.js"></script>
    <script src="js/branding.js"></script>
    <script src="js/ui.js"></script>
    <script>
        function toggleSidebar() {
            const panel = document.getElementById('side-panel');
            panel.classList.toggle('collapsed');
            if (window.CyberLeftChrome && typeof CyberLeftChrome.publishResolvedScale === 'function') {
                CyberLeftChrome.publishResolvedScale();
            }
            setTimeout(() => {
                window.dispatchEvent(new Event('resize'));
                if (typeof init === 'function') init();
                if (window.CyberLeftChrome && typeof CyberLeftChrome.publishResolvedScale === 'function') {
                    CyberLeftChrome.publishResolvedScale();
                }
            }, 400);
        }

        CyberBranding.init({
            useExternalStyles: true,
            title: CyberI18n.get('ui.coach_title'),
            subtitle: 'ANN',
        });
        CyberUI.init();

        (function setCoachTitleFromI18n() {
            const el = document.getElementById('coach-title-slot');
            if (el && typeof CyberI18n !== 'undefined' && typeof CyberI18n.get === 'function') {
                el.textContent = CyberI18n.get('ui.description');
            }
        })();

        if (window.CyberLeftChrome && typeof CyberLeftChrome.configure === 'function') {
            CyberLeftChrome.configure({ viewportOnlyZoom: true });
        }

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');

        function resizeCanvasToContainer() {
            const dpr = window.devicePixelRatio || 1;
            const rect = container.getBoundingClientRect();
            const w = Math.max(1, rect.width);
            const h = Math.max(1, rect.height);
            canvas.width = Math.floor(w * dpr);
            canvas.height = Math.floor(h * dpr);
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
        }

        const _saved = localStorage.getItem('ann_layers');
        let LAYERS = _saved ? JSON.parse(_saved) : [2, 10, 10, 10, 1];
        const NODE_RADIUS = 14;
        const LAYER_LABELS = ['Input', 'Hidden 1', 'Hidden 2', 'Hidden 3', 'Output'];
        let INPUT_VALUES = [2.57, 4.72];

        // --- normalization ---
        const INORM = 5;
        const ONORM = { add: 10, sub: 10, mul: 25, div: 10 };
        const normIn = inputs => inputs.map(x => x / INORM);
        const denormOut = y => y * (ONORM[selectedOp.id] || 10);
        function getNormTarget(x1, x2) {
            return selectedOp.id === 'add' ? (x1+x2)/ONORM.add
                 : selectedOp.id === 'sub' ? (x1-x2)/ONORM.sub
                 : selectedOp.id === 'mul' ? (x1*x2)/ONORM.mul
                 : Math.max(-1, Math.min(1, x1/x2/ONORM.div));
        }

        // --- TF.js model ---
        let model = null, intermediateModel = null, optimizer = null;
        let learningRate = 0.01;

        function buildModel() {
            try {
                if (intermediateModel) intermediateModel.dispose();
                if (model) model.dispose();
                optimizer = tf.train.adam(learningRate);
                model = tf.sequential();
                for (let l = 1; l < LAYERS.length; l++) {
                    model.add(tf.layers.dense({
                        units: LAYERS[l],
                        activation: l < LAYERS.length - 1 ? 'tanh' : 'linear',
                        kernelInitializer: 'glorotNormal',
                        biasInitializer: 'zeros',
                        ...(l === 1 ? { inputShape: [LAYERS[0]] } : {})
                    }));
                }
                const denseOutputs = model.layers
                    .filter(l => l.getClassName() === 'Dense')
                    .map(l => l.output);
                intermediateModel = tf.model({ inputs: model.inputs, outputs: denseOutputs });
            } catch(e) {
                console.error('buildModel failed:', e);
                model = null; intermediateModel = null;
            }
        }

        function forwardPass(normalizedInputs) {
            if (!intermediateModel) {
                return LAYERS.map(n => new Array(n).fill(0.5));
            }
            try {
                return tf.tidy(() => {
                    const x = tf.tensor2d([normalizedInputs]);
                    const raw = intermediateModel.predict(x);
                    const outs = Array.isArray(raw) ? raw : [raw];
                    const acts = [normalizedInputs];
                    for (const o of outs) acts.push(Array.from(o.dataSync()));
                    return acts;
                });
            } catch(e) {
                console.error('forwardPass failed:', e);
                return LAYERS.map(n => new Array(n).fill(0.5));
            }
        }

        // --- training ---
        let isTraining = false;
        let trainEpoch = 0;
        let lossHistory = [];
        let rafId = null;

        function resetTraining() {
            stopTraining();
            trainEpoch = 0;
            lossHistory = [];
        }

        function trainStep() {
            const BS = 32;
            const xs = [], ys = [];
            let count = 0;
            while (count < BS) {
                const x1 = (Math.random() * 10) - 5;
                const x2 = (Math.random() * 10) - 5;
                if (selectedOp.id === 'div' && Math.abs(x2) < 0.5) continue;
                xs.push([x1 / INORM, x2 / INORM]);
                ys.push([getNormTarget(x1, x2)]);
                count++;
            }
            let lossVal = 0;
            tf.tidy(() => {
                const xT = tf.tensor2d(xs);
                const yT = tf.tensor2d(ys);
                optimizer.minimize(() => {
                    const pred = model.predict(xT);
                    const loss = tf.losses.meanSquaredError(yT, pred);
                    lossVal = loss.dataSync()[0];
                    return loss;
                });
            });
            return lossVal;
        }

        function trainingLoop() {
            if (!isTraining) return;
            const loss = trainStep();
            trainEpoch++;
            lossHistory.push(Math.log10(Math.max(loss, 1e-10)));
            if (lossHistory.length > 300) lossHistory.shift();
            draw();
            rafId = requestAnimationFrame(trainingLoop);
        }

        function startTraining() {
            if (isTraining) return;
            isTraining = true; trainingLoop();
            document.getElementById('train-btn').textContent = 'STOP';
        }

        function stopTraining() {
            isTraining = false;
            if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
            const btn = document.getElementById('train-btn');
            if (btn) btn.textContent = 'TRAIN';
        }

        buildModel();

        const OPS = [
            { id: 'add', label: '+ Addition',      sym: '+' },
            { id: 'sub', label: '− Subtraktion',   sym: '−' },
            { id: 'mul', label: '× Multiplikation',sym: '×' },
            { id: 'div', label: '÷ Division',       sym: '÷' },
        ];
        let selectedOp = OPS[0];

        // hit zones for canvas triangles
        let triangleZones = [];

        function drawTriangle(x, y, size, up) {
            ctx.beginPath();
            if (up) {
                ctx.moveTo(x, y - size);
                ctx.lineTo(x + size, y + size * 0.6);
                ctx.lineTo(x - size, y + size * 0.6);
            } else {
                ctx.moveTo(x, y + size);
                ctx.lineTo(x + size, y - size * 0.6);
                ctx.lineTo(x - size, y - size * 0.6);
            }
            ctx.closePath();
        }

        function changeHidden(idx, delta) {
            LAYERS[idx] = Math.max(1, Math.min(20, LAYERS[idx] + delta));
            localStorage.setItem('ann_layers', JSON.stringify(LAYERS));
            buildModel();
            resetTraining();
            draw();
        }

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            for (const z of triangleZones) {
                if (Math.abs(mx - z.x) < z.hit && Math.abs(my - z.y) < z.hit) {
                    changeHidden(z.layer, z.dir);
                    return;
                }
            }
        });

        CyberUI.createCard('ui-container', 'Eingabe', `
            <div id="input0-slider"></div>
            <div id="input1-slider"></div>
        `, 'var(--neon-blue)');
        CyberUI.createSlider('input0-slider', 'Input 1', -10, 10, INPUT_VALUES[0], 0.01, (v) => { INPUT_VALUES[0] = v; draw(); }, 'var(--neon-blue)');
        CyberUI.createSlider('input1-slider', 'Input 2', -10, 10, INPUT_VALUES[1], 0.01, (v) => { INPUT_VALUES[1] = v; draw(); }, 'var(--neon-blue)');

        CyberUI.createCard('ui-container', 'Operation', `<div id="op-drop"></div>`, 'var(--neon-blue)');
        CyberUI.createDropdown('op-drop', OPS, (id) => {
            selectedOp = OPS.find(o => o.id === id);
            resetTraining();
            draw();
        }, selectedOp.id);

        CyberUI.createCard('ui-container', 'Training', `
            <div style="display:flex;gap:8px;margin-bottom:8px;">
                <button id="train-btn" class="cyber-btn" style="flex:1" onclick="isTraining ? stopTraining() : startTraining()">TRAIN</button>
                <button class="cyber-btn" onclick="buildModel();resetTraining();draw()">RESET</button>
            </div>
            <div id="lr-slider"></div>
            <div id="train-info" style="font-family:Orbitron,sans-serif;font-size:10px;color:rgba(200,220,255,0.6);margin-top:6px;"></div>
        `, 'var(--neon-pink)');
        CyberUI.createSlider('lr-slider', 'Lernrate', 0.0001, 0.05, learningRate, 0.0001, (v) => { learningRate = v; optimizer = tf.train.adam(v); }, 'var(--neon-pink)');

        function getNodePositions(w, h) {
            const positions = [];
            const marginY = 60;
            const vShift = h * 0.06;
            const usableW = (w - 160) * 0.8;
            const offsetX = (w - usableW) / 2;
            const usableH = h - marginY * 2;
            const layerSpacing = usableW / (LAYERS.length - 1);

            for (let l = 0; l < LAYERS.length; l++) {
                const n = LAYERS[l];
                const x = offsetX + l * layerSpacing;
                const nodeSpacing = usableH / (n + 1);
                positions.push([]);
                for (let i = 0; i < n; i++) {
                    const y = marginY + vShift + nodeSpacing * (i + 1);
                    positions[l].push({ x, y });
                }
            }
            return positions;
        }

        function draw() {
            const rect = container.getBoundingClientRect();
            const w = rect.width;
            const h = rect.height;
            ctx.clearRect(0, 0, w, h);

            const positions = getNodePositions(w, h);

            // forward pass
            const activations = forwardPass(normIn(INPUT_VALUES));

            function layerRGB(l) {
                const t = l / (LAYERS.length - 1);
                if (t <= 0.5) {
                    const s = t * 2;
                    return [Math.round(0   + 255 * s), Math.round(200 + 55 * s), 255];
                } else {
                    const s = (t - 0.5) * 2;
                    return [Math.round(255 - 95  * s), Math.round(255 - 155 * s), 255];
                }
            }

            // draw connections
            for (let l = 0; l < LAYERS.length - 1; l++) {
                const [r0,g0,b0] = layerRGB(l);
                const [r1,g1,b1] = layerRGB(l + 1);
                for (const src of positions[l]) {
                    for (const dst of positions[l + 1]) {
                        const grad = ctx.createLinearGradient(src.x, src.y, dst.x, dst.y);
                        grad.addColorStop(0, `rgba(${r0},${g0},${b0},0.25)`);
                        grad.addColorStop(1, `rgba(${r1},${g1},${b1},0.25)`);
                        ctx.beginPath();
                        ctx.moveTo(src.x, src.y);
                        ctx.lineTo(dst.x, dst.y);
                        ctx.strokeStyle = grad;
                        ctx.lineWidth = 0.8;
                        ctx.stroke();
                    }
                }
            }

            // draw nodes
            for (let l = 0; l < LAYERS.length; l++) {
                const isInput = l === 0;
                const isOutput = l === LAYERS.length - 1;
                const layerActs = activations[l];
                const actMin = Math.min(...layerActs);
                const actMax = Math.max(...layerActs);
                const actRange = actMax - actMin || 1;

                for (let i = 0; i < positions[l].length; i++) {
                    const { x, y } = positions[l][i];
                    const t = (layerActs[i] - actMin) / actRange;

                    const [r, g, b] = layerRGB(l);

                    const alpha = 0.15 + t * 0.7;

                    // glow
                    const grd = ctx.createRadialGradient(x, y, 2, x, y, NODE_RADIUS * 2);
                    grd.addColorStop(0, `rgba(${r},${g},${b},${(0.2 + t * 0.5).toFixed(2)})`);
                    grd.addColorStop(1, `rgba(${r},${g},${b},0)`);
                    ctx.beginPath();
                    ctx.arc(x, y, NODE_RADIUS * 2, 0, Math.PI * 2);
                    ctx.fillStyle = grd;
                    ctx.fill();

                    // circle
                    ctx.beginPath();
                    ctx.arc(x, y, NODE_RADIUS, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(${r},${g},${b},1)`;
                    ctx.fillStyle = `rgba(${r},${g},${b},${alpha.toFixed(2)})`;
                    ctx.lineWidth = 1.5;
                    ctx.fill();
                    ctx.stroke();
                }
            }

            // operator symbol between input nodes
            if (positions[0].length === 2) {
                const p0 = positions[0][0];
                const p1 = positions[0][1];
                const textX = p0.x - NODE_RADIUS - 18;
                const oy = (p0.y + p1.y) / 2;
                ctx.font = '700 26px Orbitron, sans-serif';
                const symW = ctx.measureText(selectedOp.sym).width;
                const cx = textX - symW / 2;
                const r = 20;
                ctx.beginPath();
                ctx.arc(cx, oy, r, 0, Math.PI * 2);
                ctx.strokeStyle = '#00c8ff';
                ctx.lineWidth = 1.5;
                ctx.fillStyle = 'rgba(0,200,255,0.1)';
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#00c8ff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(selectedOp.sym, cx, oy);
                ctx.textBaseline = 'alphabetic';
            }

            // input values
            ctx.font = '700 15px Orbitron, sans-serif';
            ctx.textAlign = 'right';
            for (let i = 0; i < INPUT_VALUES.length; i++) {
                const { x, y } = positions[0][i];
                ctx.fillStyle = '#00c8ff';
                ctx.fillText(INPUT_VALUES[i].toFixed(2), x - NODE_RADIUS - 18, y + 5);
            }

            // layer labels + triangles for hidden layers
            triangleZones = [];
            ctx.font = '600 18px Orbitron, sans-serif';
            ctx.textAlign = 'center';
            const labelY = 34 + h * 0.06;
            const countY = 68 + h * 0.06;
            const triSize = 10;
            const triUp = labelY - 22;
            const triDown = labelY + 12;

            for (let l = 0; l < LAYERS.length; l++) {
                const x = positions[l][0].x;
                const isInput = l === 0;
                const isOutput = l === LAYERS.length - 1;
                const isHidden = !isInput && !isOutput;

                const [lr,lg,lb] = layerRGB(l);
                const layerColor = `rgb(${lr},${lg},${lb})`;

                if (isHidden) {
                    const countStr = `${LAYERS[l]}`;
                    ctx.font = '700 17px Orbitron, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillStyle = layerColor;
                    ctx.fillText(countStr, x, labelY);
                } else {
                    ctx.font = '600 17px Orbitron, sans-serif';
                    ctx.fillStyle = layerColor;
                    ctx.textAlign = 'center';
                    ctx.fillText(LAYER_LABELS[l], x, labelY);
                }

                if (isHidden) {
                    const atMax = LAYERS[l] >= 20;
                    const atMin = LAYERS[l] <= 1;

                    drawTriangle(x, triUp, triSize, true);
                    ctx.fillStyle = atMax ? layerColor.replace('rgb', 'rgba').replace(')', ',0.2)') : layerColor;
                    ctx.fill();
                    if (!atMax) triangleZones.push({ layer: l, dir: +1, x, y: triUp, hit: triSize + 4 });

                    drawTriangle(x, triDown, triSize, false);
                    ctx.fillStyle = atMin ? layerColor.replace('rgb', 'rgba').replace(')', ',0.2)') : layerColor;
                    ctx.fill();
                    if (!atMin) triangleZones.push({ layer: l, dir: -1, x, y: triDown, hit: triSize + 4 });
                }
            }

            // loss curve
            if (lossHistory.length > 1) {
                const cw = 220, ch = 70, cx = w - cw - 20, cy = h - ch - 20;
                ctx.fillStyle = 'rgba(0,0,0,0.45)';
                ctx.strokeStyle = 'rgba(255,100,200,0.3)';
                ctx.lineWidth = 1;
                ctx.beginPath(); ctx.rect(cx, cy, cw, ch); ctx.fill(); ctx.stroke();
                ctx.font = '9px Orbitron, sans-serif';
                ctx.fillStyle = 'rgba(255,100,200,0.6)';
                ctx.textAlign = 'left';
                ctx.fillText('LOG LOSS', cx + 6, cy + 13);
                ctx.fillText(`Epoch ${trainEpoch}`, cx + cw - 70, cy + 13);
                const minL = Math.min(...lossHistory), maxL = Math.max(...lossHistory);
                const rng = maxL - minL || 1;
                ctx.beginPath();
                ctx.strokeStyle = '#ff64c8';
                ctx.lineWidth = 1.5;
                lossHistory.forEach((v, i) => {
                    const px = cx + (i / (lossHistory.length - 1)) * cw;
                    const py = cy + ch - ((v - minL) / rng) * (ch - 20) - 6;
                    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
                });
                ctx.stroke();
                const info = document.getElementById('train-info');
                if (info) info.textContent = `Epoch ${trainEpoch} · Loss ${Math.pow(10, lossHistory[lossHistory.length-1]).toExponential(2)}`;
            }

            // output value + target + delta
            const outVal = activations[activations.length - 1][0];
            const outPos = positions[positions.length - 1][0];
            const predRaw = denormOut(outVal);
            const [v1, v2] = INPUT_VALUES;
            const targetRaw = selectedOp.id === 'add' ? v1 + v2
                            : selectedOp.id === 'sub' ? v1 - v2
                            : selectedOp.id === 'mul' ? v1 * v2
                            : v2 !== 0 ? v1 / v2 : 0;
            const delta = predRaw - targetRaw;
            const tx = outPos.x + NODE_RADIUS + 18;
            const lineH = 18;

            ctx.font = '700 15px Orbitron, sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';

            ctx.fillStyle = '#ff64c8';
            ctx.fillText(`ŷ  ${predRaw.toFixed(3)}`, tx, outPos.y - lineH);

            ctx.fillStyle = 'rgba(200,220,255,0.7)';
            ctx.fillText(`y  ${targetRaw.toFixed(3)}`, tx, outPos.y);

            const absDelta = Math.abs(delta);
            ctx.fillStyle = absDelta < 0.05 ? '#00ffb4' : absDelta < 0.5 ? '#ffcc00' : '#ff4466';
            ctx.fillText(`Δ  ${delta >= 0 ? '+' : ''}${delta.toFixed(3)}`, tx, outPos.y + lineH);

            ctx.textBaseline = 'alphabetic';
        }

        function init() {
            resizeCanvasToContainer();
            draw();
        }

        window.addEventListener('resize', init);
        let mouseLeft = false;
        document.documentElement.addEventListener('mouseleave', () => { mouseLeft = true; });
        document.documentElement.addEventListener('mouseenter', () => { if (mouseLeft) location.reload(); });
        document.fonts.ready.then(init);
    </script>
</body>

</html>
