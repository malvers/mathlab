<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOC ALVERS MATHE-LABORE | ANN</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="resources/favicon.png">
    <link rel="stylesheet" href="js/cyber-layout.css">
    <link rel="stylesheet" href="js/buttons-ultra.css">
    <link rel="stylesheet" href="js/cyber-lab-overrides.css">
    <link rel="stylesheet" href="js/branding.styles.extracted.css">
    <link rel="stylesheet" href="js/lab-shell-minimal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <style>
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        #input0-field, #input1-field { background-image: none !important; padding-right: 15px; text-align: left; font-size: 1rem; }
        #input0-field { color: #ff3c3c !important; }
        #input1-field { color: #00dc64 !important; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
</head>

<body>
    <nav id="mini-rail">
        <div class="nav-btn" onclick="toggleSidebar()" title="Toggle Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </div>
    </nav>

    <aside id="side-panel">
        <header id="sidebar-header"></header>
        <div id="ui-container"></div>
    </aside>

    <main id="main-content">
        <div id="canvas-container">
            <div class="cyber-grid"></div>
            <div id="math-coach-box">
                <div class="coach-title" id="coach-title-slot"></div>
                <div id="coach-content" class="coach-message"></div>
            </div>
            <canvas id="canvas"></canvas>
            <div id="output-latex" style="position:absolute;pointer-events:none;display:none;font-size:15px;line-height:2"></div>
        </div>
    </main>

    <script src="js/cyber-left-chrome.js"></script>
    <script src="js/branding/briefings.js"></script>
    <script src="js/branding/overlays.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/i18n-de.js"></script>
    <script src="js/i18n-en.js"></script>
    <script src="js/i18n-es.js"></script>
    <script src="js/i18n-fr.js"></script>
    <script src="js/i18n-it.js"></script>
    <script src="js/i18n-pt.js"></script>
    <script src="js/i18n-sw.js"></script>
    <script src="js/i18n-tr.js"></script>
    <script src="js/i18n-nl.js"></script>
    <script src="js/branding.js"></script>
    <script src="js/ui.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
    <script>
        function toggleSidebar() {
            const panel = document.getElementById('side-panel');
            panel.classList.toggle('collapsed');
            if (window.CyberLeftChrome && typeof CyberLeftChrome.publishResolvedScale === 'function') {
                CyberLeftChrome.publishResolvedScale();
            }
            setTimeout(() => {
                window.dispatchEvent(new Event('resize'));
                if (typeof init === 'function') init();
                if (window.CyberLeftChrome && typeof CyberLeftChrome.publishResolvedScale === 'function') {
                    CyberLeftChrome.publishResolvedScale();
                }
            }, 400);
        }

        CyberBranding.init({
            useExternalStyles: true,
            title: CyberI18n.get('ui.coach_title'),
            subtitle: 'ANN',
        });
        CyberUI.init();

        (function setCoachTitleFromI18n() {
            const el = document.getElementById('coach-title-slot');
            if (el && typeof CyberI18n !== 'undefined' && typeof CyberI18n.get === 'function') {
                el.textContent = CyberI18n.get('ui.description');
            }
        })();

        if (window.CyberLeftChrome && typeof CyberLeftChrome.configure === 'function') {
            CyberLeftChrome.configure({ viewportOnlyZoom: true });
        }

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');

        function resizeCanvasToContainer() {
            const dpr = window.devicePixelRatio || 1;
            const rect = container.getBoundingClientRect();
            const w = Math.max(1, rect.width);
            const h = Math.max(1, rect.height);
            canvas.width = Math.floor(w * dpr);
            canvas.height = Math.floor(h * dpr);
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
        }

        const _saved = localStorage.getItem('ann_layers');
        let LAYERS = _saved ? JSON.parse(_saved) : [2, 10, 10, 10, 1];
        const NODE_RADIUS = 14;
        const _savedVals = localStorage.getItem('ann_inputs');
        let INPUT_VALUES = _savedVals ? JSON.parse(_savedVals) : [2.57, 4.72];
        function getLayerLabel(l) {
            if (l === 0) return 'Input';
            if (l === LAYERS.length - 1) return 'Output';
            return 'Hidden ' + l;
        }
        // --- normalization ---
        const INORM = 5;
        const ONORM = { add: 10, sub: 10, mul: 25, div: 10 };
        const normIn = inputs => inputs.map(x => x / INORM);
        const denormOut = y => y * (ONORM[selectedOp.id] || 10);
        function getNormTarget(x1, x2) {
            return selectedOp.id === 'add' ? (x1+x2)/ONORM.add
                 : selectedOp.id === 'sub' ? (x1-x2)/ONORM.sub
                 : selectedOp.id === 'mul' ? (x1*x2)/ONORM.mul
                 : Math.max(-1, Math.min(1, x1/x2/ONORM.div));
        }

        // --- TF.js model ---
        let model = null, intermediateModel = null, optimizer = null;
        let learningRate = 0.01;

        function buildModel() {
            try {
                try { if (intermediateModel) intermediateModel.dispose(); } catch(e) {}
                try { if (model) model.dispose(); } catch(e) {}
                intermediateModel = null;
                model = null;
                optimizer = tf.train.adam(learningRate);
                model = tf.sequential();
                for (let l = 1; l < LAYERS.length; l++) {
                    model.add(tf.layers.dense({
                        units: LAYERS[l],
                        activation: l < LAYERS.length - 1 ? 'tanh' : 'linear',
                        kernelInitializer: 'glorotNormal',
                        biasInitializer: 'zeros',
                        ...(l === 1 ? { inputShape: [LAYERS[0]] } : {})
                    }));
                }
                const denseOutputs = model.layers
                    .filter(l => l.getClassName() === 'Dense')
                    .map(l => l.output);
                intermediateModel = tf.model({ inputs: model.inputs, outputs: denseOutputs });
            } catch(e) {
                console.error('buildModel failed:', e);
                model = null; intermediateModel = null;
            }
        }

        function forwardPass(normalizedInputs) {
            if (!intermediateModel) {
                return LAYERS.map(n => new Array(n).fill(0.5));
            }
            try {
                return tf.tidy(() => {
                    const x = tf.tensor2d([normalizedInputs]);
                    const raw = intermediateModel.predict(x);
                    const outs = Array.isArray(raw) ? raw : [raw];
                    const acts = [normalizedInputs];
                    for (const o of outs) acts.push(Array.from(o.dataSync()));
                    return acts;
                });
            } catch(e) {
                console.error('forwardPass failed:', e);
                return LAYERS.map(n => new Array(n).fill(0.5));
            }
        }

        // --- training ---
        let isTraining = false;
        let trainEpoch = 0;
        let lossHistory = [];
        let rafId = null;
        let lastTrainSample = null;
        let lastSavedEpoch = 0;

        function saveWeights() {
            if (!model) return;
            try {
                const ws = model.getWeights();
                const data = { layers: LAYERS.slice(), w: ws.map(t => ({ shape: t.shape, data: Array.from(t.dataSync()) })) };
                localStorage.setItem('ann_weights_' + selectedOp.id, JSON.stringify(data));
                refreshOpButtons();
            } catch(e) { console.warn('saveWeights:', e); }
        }

        function refreshOpButtons() {
            OPS.forEach(o => {
                const btn = document.getElementById('op-btn-' + o.id);
                if (!btn) return;
                const active = o.id === selectedOp.id;
                const trained = !!localStorage.getItem('ann_weights_' + o.id);
                btn.style.filter = active ? `drop-shadow(0 0 8px ${opColors[o.id]})` : trained ? 'none' : 'grayscale(1)';
                btn.style.opacity = active ? '1' : trained ? '0.75' : '0.3';
            });
        }

        function loadWeights() {
            if (!model) return;
            try {
                const raw = localStorage.getItem('ann_weights_' + selectedOp.id);
                if (!raw) return;
                const data = JSON.parse(raw);
                if (JSON.stringify(data.layers) !== JSON.stringify(LAYERS)) return;
                const tensors = data.w.map(({ shape, data: d }) => tf.tensor(d, shape));
                model.setWeights(tensors);
                tensors.forEach(t => t.dispose());
            } catch(e) { console.warn('loadWeights:', e); }
        }

        function randomizeArchitecture() {
            stopTraining();
            const numHidden = Math.floor(Math.random() * 4) + 1;
            const newLayers = [2];
            for (let i = 0; i < numHidden; i++) {
                newLayers.push(Math.floor(Math.random() * 9) + 2);
            }
            newLayers.push(1);
            LAYERS = newLayers;
            buildModel();
            resetTraining();
            draw();
        }

        function resetTraining() {
            stopTraining();
            trainEpoch = 0;
            lossHistory = [];
        }

        function trainStep() {
            const BS = 32;
            const xs = [], ys = [];
            let count = 0;
            while (count < BS) {
                const x1 = (Math.random() * 10) - 5;
                const x2 = (Math.random() * 10) - 5;
                if (selectedOp.id === 'div' && Math.abs(x2) < 0.5) continue;
                xs.push([x1 / INORM, x2 / INORM]);
                ys.push([getNormTarget(x1, x2)]);
                lastTrainSample = [x1, x2];
                count++;
            }
            let lossVal = 0;
            const xT = tf.tensor2d(xs);
            const yT = tf.tensor2d(ys);
            optimizer.minimize(() => {
                const pred = model.predict(xT);
                const loss = tf.losses.meanSquaredError(yT, pred);
                lossVal = loss.dataSync()[0];
                return loss;
            });
            xT.dispose();
            yT.dispose();
            return lossVal;
        }

        let stepsPerFrame = 10;

        function trainingLoop() {
            if (!isTraining) return;
            try {
                let loss = 0;
                for (let i = 0; i < stepsPerFrame; i++) loss = trainStep();
                trainEpoch += stepsPerFrame;
                lossHistory.push(Math.log10(Math.max(loss, 1e-10)));
                if (lossHistory.length > 300) lossHistory.shift();
                if (trainEpoch - lastSavedEpoch >= 500) { saveWeights(); lastSavedEpoch = trainEpoch; }
                draw();
            } catch(e) {
                console.error('trainingLoop:', e);
                stopTraining();
                return;
            }
            rafId = requestAnimationFrame(trainingLoop);
        }

        function startTraining() {
            if (isTraining) return;
            if (!model) return;
            isTraining = true;
            document.getElementById('train-btn').textContent = 'STOP';
            trainingLoop();
        }

        function stopTraining() {
            isTraining = false;
            if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
            const btn = document.getElementById('train-btn');
            if (btn) btn.textContent = 'TRAIN';
        }

        // preload operator icons from labs-icons
        const OP_ICONS = {};
        {
            const svgs = {
                add: `<svg width="60" height="60" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="15" y="15" width="70" height="70" rx="10" fill="rgba(0,210,255,0.12)" stroke="#00d2ff" stroke-width="2"/><line x1="50" y1="33" x2="50" y2="67" stroke="#00d2ff" stroke-width="7" stroke-linecap="round"/><line x1="33" y1="50" x2="67" y2="50" stroke="#00d2ff" stroke-width="7" stroke-linecap="round"/></svg>`,
                sub: `<svg width="60" height="60" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="15" y="15" width="70" height="70" rx="10" fill="rgba(255,77,77,0.12)" stroke="#ff4d4d" stroke-width="2"/><line x1="32" y1="50" x2="68" y2="50" stroke="#ff4d4d" stroke-width="7" stroke-linecap="round"/></svg>`,
                mul: `<svg width="60" height="60" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="15" y="15" width="70" height="70" rx="10" fill="rgba(255,215,0,0.12)" stroke="#ffd700" stroke-width="2"/><circle cx="50" cy="50" r="8" fill="#ffd700"/></svg>`,
                div: `<svg width="60" height="60" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="15" y="15" width="70" height="70" rx="10" fill="rgba(173,255,47,0.12)" stroke="#adff2f" stroke-width="2"/><circle cx="50" cy="33" r="6" fill="#adff2f"/><line x1="33" y1="50" x2="67" y2="50" stroke="#adff2f" stroke-width="6" stroke-linecap="round"/><circle cx="50" cy="67" r="6" fill="#adff2f"/></svg>`
            };
            Object.entries(svgs).forEach(([id, svg]) => {
                const img = new Image();
                img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
                OP_ICONS[id] = img;
            });
        }

        const OPS = [
            { id: 'add', label: '+ Addition',      sym: '+' },
            { id: 'sub', label: '− Subtraktion',   sym: '−' },
            { id: 'mul', label: '× Multiplikation',sym: '×' },
            { id: 'div', label: '÷ Division',       sym: '÷' },
        ];
        let selectedOp = OPS[0];

        buildModel();
        loadWeights();

        // hit zones for canvas triangles + layer buttons
        let currentMouseX = -1;
        let currentMouseY = -1;
        let triangleZones = [];
        let layerBtnZones = [];

        function addLayer() {
            if (LAYERS.length - 2 >= 5) return;
            LAYERS.splice(LAYERS.length - 1, 0, 5);
            localStorage.setItem('ann_layers', JSON.stringify(LAYERS));
            buildModel(); resetTraining(); draw();
        }

        function removeLayer() {
            if (LAYERS.length - 2 <= 1) return;
            LAYERS.splice(LAYERS.length - 2, 1);
            localStorage.setItem('ann_layers', JSON.stringify(LAYERS));
            buildModel(); resetTraining(); draw();
        }

        function drawRoundRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.arcTo(x + w, y, x + w, y + r, r);
            ctx.lineTo(x + w, y + h - r);
            ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
            ctx.lineTo(x + r, y + h);
            ctx.arcTo(x, y + h, x, y + h - r, r);
            ctx.lineTo(x, y + r);
            ctx.arcTo(x, y, x + r, y, r);
            ctx.closePath();
        }

        function drawTriangle(x, y, size, up) {
            ctx.beginPath();
            if (up) {
                ctx.moveTo(x, y - size);
                ctx.lineTo(x + size, y + size * 0.6);
                ctx.lineTo(x - size, y + size * 0.6);
            } else {
                ctx.moveTo(x, y + size);
                ctx.lineTo(x + size, y - size * 0.6);
                ctx.lineTo(x - size, y - size * 0.6);
            }
            ctx.closePath();
        }

        function changeHidden(idx, delta) {
            LAYERS[idx] = Math.max(1, Math.min(20, LAYERS[idx] + delta));
            localStorage.setItem('ann_layers', JSON.stringify(LAYERS));
            buildModel();
            resetTraining();
            draw();
        }

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            let cursor = 'crosshair';
            let tooltip = '';

            for (const z of triangleZones) {
                if (Math.abs(mx - z.x) < z.hit && Math.abs(my - z.y) < z.hit) {
                    cursor = 'pointer';
                    tooltip = z.dir > 0 
                        ? (typeof CyberI18n !== 'undefined' ? CyberI18n.get('ui.increase_neurons') : 'Neuronen erhöhen')
                        : (typeof CyberI18n !== 'undefined' ? CyberI18n.get('ui.decrease_neurons') : 'Neuronen verringern');
                    break;
                }
            }
            if (!tooltip) {
                for (const z of layerBtnZones) {
                    if (mx >= z.x - z.hw && mx <= z.x + z.hw && my >= z.y - z.hh && my <= z.y + z.hh) {
                        cursor = 'pointer';
                        tooltip = z.tip;
                        break;
                    }
                }
            }
            currentMouseX = mx;
            currentMouseY = my;
            canvas.style.cursor = cursor;
            canvas.title = tooltip;
            draw();
        });

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            for (const z of triangleZones) {
                if (Math.abs(mx - z.x) < z.hit && Math.abs(my - z.y) < z.hit) {
                    changeHidden(z.layer, z.dir);
                    return;
                }
            }
            for (const z of layerBtnZones) {
                if (mx >= z.x - z.hw && mx <= z.x + z.hw && my >= z.y - z.hh && my <= z.y + z.hh) {
                    z.action();
                    return;
                }
            }
        });

        function updateInput(i, val) {
            const v = parseFloat(val.replace(',', '.'));
            if (!isNaN(v)) { INPUT_VALUES[i] = v; localStorage.setItem('ann_inputs', JSON.stringify(INPUT_VALUES)); draw(); }
        }

        let lbl1 = 'Summand 1';
        let lbl2 = 'Summand 2';
        let cardTitle = 'Eingabe';
        if (typeof CyberI18n !== 'undefined') {
            lbl1 = CyberI18n.get('ui.summand') + ' 1';
            lbl2 = CyberI18n.get('ui.summand') + ' 2';
            cardTitle = CyberI18n.currentLang === 'de' ? 'Eingabe' : 'Input';
        }

        CyberUI.createCard('ui-container', cardTitle, `
            <div class="cyber-control-group">
                <label class="cyber-label" id="label-op1">${lbl1}</label>
                <input type="number" id="input0-field" class="cyber-select" value="${INPUT_VALUES[0]}" step="0.01" oninput="updateInput(0, this.value)">
            </div>
            <div class="cyber-control-group" style="margin-top:20px">
                <label class="cyber-label" id="label-op2">${lbl2}</label>
                <input type="number" id="input1-field" class="cyber-select" value="${INPUT_VALUES[1]}" step="0.01" oninput="updateInput(1, this.value)">
            </div>
        `, 'var(--neon-blue)');

        const opIconSVGs = {
            add: `<svg width="44" height="44" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="15" y="15" width="70" height="70" rx="10" fill="rgba(0,210,255,0.12)" stroke="#00d2ff" stroke-width="2"/><line x1="50" y1="33" x2="50" y2="67" stroke="#00d2ff" stroke-width="7" stroke-linecap="round"/><line x1="33" y1="50" x2="67" y2="50" stroke="#00d2ff" stroke-width="7" stroke-linecap="round"/></svg>`,
            sub: `<svg width="44" height="44" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="15" y="15" width="70" height="70" rx="10" fill="rgba(255,77,77,0.12)" stroke="#ff4d4d" stroke-width="2"/><line x1="32" y1="50" x2="68" y2="50" stroke="#ff4d4d" stroke-width="7" stroke-linecap="round"/></svg>`,
            mul: `<svg width="44" height="44" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="15" y="15" width="70" height="70" rx="10" fill="rgba(255,215,0,0.12)" stroke="#ffd700" stroke-width="2"/><circle cx="50" cy="50" r="8" fill="#ffd700"/></svg>`,
            div: `<svg width="44" height="44" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="15" y="15" width="70" height="70" rx="10" fill="rgba(173,255,47,0.12)" stroke="#adff2f" stroke-width="2"/><circle cx="50" cy="33" r="6" fill="#adff2f"/><line x1="33" y1="50" x2="67" y2="50" stroke="#adff2f" stroke-width="6" stroke-linecap="round"/><circle cx="50" cy="67" r="6" fill="#adff2f"/></svg>`
        };
        const opColors = { add: '#00d2ff', sub: '#ff4d4d', mul: '#ffd700', div: '#adff2f' };

        function selectOp(id) {
            saveWeights();
            selectedOp = OPS.find(o => o.id === id);

            const l1 = document.getElementById('label-op1');
            const l2 = document.getElementById('label-op2');
            if (l1 && l2 && typeof CyberI18n !== 'undefined') {
                if (id === 'add') { l1.textContent = CyberI18n.get('ui.summand') + ' 1'; l2.textContent = CyberI18n.get('ui.summand') + ' 2'; }
                else if (id === 'sub') { l1.textContent = CyberI18n.get('ui.minuend'); l2.textContent = CyberI18n.get('ui.subtrahend'); }
                else if (id === 'mul') { l1.textContent = CyberI18n.get('ui.factor1'); l2.textContent = CyberI18n.get('ui.factor2'); }
                else if (id === 'div') { l1.textContent = CyberI18n.get('ui.dividend'); l2.textContent = CyberI18n.get('ui.divisor'); }
            }

            buildModel(); loadWeights(); resetTraining();
            refreshOpButtons();
            draw();
        }

        CyberUI.createCard('ui-container', 'Operation', `
            <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px">
                ${OPS.map(o => `<button id="op-btn-${o.id}" onclick="selectOp('${o.id}')"
                    style="background:none;border:none;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:filter 0.2s">
                    ${opIconSVGs[o.id].replace('width="44" height="44"', 'width="100%" height="auto" style="width:100%"')}
                </button>`).join('')}
            </div>
        `, 'var(--neon-blue)');
        selectOp(selectedOp.id);

        CyberUI.createCard('ui-container', 'Training', `
            <div style="display:flex;gap:6px;margin-bottom:8px;">
                <button id="train-btn" class="cyber-btn" style="flex:1" onclick="isTraining ? stopTraining() : startTraining()">TRAIN</button>
                <button class="cyber-btn" style="flex:1" onclick="buildModel();resetTraining();draw()">RESET</button>
                <button class="cyber-btn" style="flex:1" onclick="randomizeArchitecture()">ZUFALL</button>
            </div>
            <div id="lr-slider"></div>
            <div id="spf-slider"></div>
            <div id="train-info" style="font-family:Orbitron,sans-serif;font-size:10px;color:rgba(200,220,255,0.6);margin-top:6px;"></div>
        `, 'var(--neon-blue)');
        CyberUI.createSlider('lr-slider', 'Lernrate', 0.0001, 0.05, learningRate, 0.0001, (v) => { learningRate = v; optimizer = tf.train.adam(v); }, 'var(--neon-blue)');
        CyberUI.createSlider('spf-slider', 'Schritte/Frame', 1, 50, stepsPerFrame, 1, (v) => { stepsPerFrame = Math.round(v); }, 'var(--neon-blue)');

        function getNodePositions(w, h) {
            const positions = [];
            const marginY = 60;
            const vShift = h * 0.06;
            const usableW = (w - 160) * 0.8;
            const offsetX = (w - usableW) / 2;
            const usableH = h - marginY * 2;
            const layerSpacing = usableW / (LAYERS.length - 1);

            for (let l = 0; l < LAYERS.length; l++) {
                const n = LAYERS[l];
                const x = offsetX + l * layerSpacing;
                const nodeSpacing = usableH / (n + 1);
                positions.push([]);
                for (let i = 0; i < n; i++) {
                    const y = marginY + vShift + nodeSpacing * (i + 1) - h * 0.1;
                    positions[l].push({ x, y });
                }
            }
            return positions;
        }

        function draw() {
          try {
            const rect = container.getBoundingClientRect();
            const w = rect.width;
            const h = rect.height;
            ctx.clearRect(0, 0, w, h);

            if (typeof tf === 'undefined') {
                ctx.font = '14px Orbitron, sans-serif';
                ctx.fillStyle = '#ff4466';
                ctx.textAlign = 'center';
                ctx.fillText('TF.js nicht geladen', w / 2, h / 2);
                return;
            }

            const positions = getNodePositions(w, h);

            // forward pass: during training show training data, otherwise user input
            const currentInputs = (isTraining && lastTrainSample) ? lastTrainSample : INPUT_VALUES;
            const activations = forwardPass(normIn(currentInputs));

            function layerRGB(l) {
                const t = l / (LAYERS.length - 1);
                if (t <= 0.5) {
                    const s = t * 2;
                    return [Math.round(0   + 255 * s), Math.round(200 + 55 * s), 255];
                } else {
                    const s = (t - 0.5) * 2;
                    return [Math.round(255 - 95  * s), Math.round(255 - 155 * s), 255];
                }
            }

            // draw connections
            for (let l = 0; l < LAYERS.length - 1; l++) {
                const [r0,g0,b0] = layerRGB(l);
                const [r1,g1,b1] = layerRGB(l + 1);
                for (const src of positions[l]) {
                    for (const dst of positions[l + 1]) {
                        const grad = ctx.createLinearGradient(src.x, src.y, dst.x, dst.y);
                        grad.addColorStop(0, `rgba(${r0},${g0},${b0},0.25)`);
                        grad.addColorStop(1, `rgba(${r1},${g1},${b1},0.25)`);
                        ctx.beginPath();
                        ctx.moveTo(src.x, src.y);
                        ctx.lineTo(dst.x, dst.y);
                        ctx.strokeStyle = grad;
                        ctx.lineWidth = 0.8;
                        ctx.stroke();
                    }
                }
            }

            // draw nodes
            for (let l = 0; l < LAYERS.length; l++) {
                const isInput = l === 0;
                const isOutput = l === LAYERS.length - 1;
                const layerActs = activations[l];
                const actMin = Math.min(...layerActs);
                const actMax = Math.max(...layerActs);
                const actRange = actMax - actMin || 1;

                for (let i = 0; i < positions[l].length; i++) {
                    const { x, y } = positions[l][i];
                    const t = isInput ? 0.7 : (layerActs[i] - actMin) / actRange;

                    const [r, g, b] = layerRGB(l);

                    const alpha = 0.15 + t * 0.7;

                    // glow
                    const grd = ctx.createRadialGradient(x, y, 2, x, y, NODE_RADIUS * 1.8);
                    grd.addColorStop(0, `rgba(${r},${g},${b},${(0.15 + t * 0.4).toFixed(2)})`);
                    grd.addColorStop(1, `rgba(${r},${g},${b},0)`);
                    ctx.beginPath();
                    ctx.arc(x, y, NODE_RADIUS * 1.8, 0, Math.PI * 2);
                    ctx.fillStyle = grd;
                    ctx.fill();

                    // circle
                    ctx.beginPath();
                    ctx.arc(x, y, NODE_RADIUS, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(${r},${g},${b},1)`;
                    ctx.fillStyle = `rgba(${r},${g},${b},${alpha.toFixed(2)})`;
                    ctx.lineWidth = 1.5;
                    ctx.fill();
                    ctx.stroke();
                }
            }

            // operator icon between input nodes
            if (positions[0].length === 2) {
                const p0 = positions[0][0];
                const p1 = positions[0][1];
                const oy = (p0.y + p1.y) / 2;
                const iconSize = 80;
                const ix = p0.x - NODE_RADIUS - 14 - iconSize;
                const img = OP_ICONS[selectedOp.id];
                if (img && img.complete) ctx.drawImage(img, ix, oy - iconSize / 2, iconSize, iconSize);
            }

            // input labels drawn on canvas — no DOM overlap issues
            ctx.font = 'italic 700 22px Times New Roman, serif';
            ctx.textBaseline = 'middle';
            for (let i = 0; i < currentInputs.length; i++) {
                const { x, y } = positions[0][i];
                ctx.fillStyle = i === 0 ? '#ff3c3c' : '#00dc64';
                const sub = i === 0 ? '₁' : '₂';
                
                ctx.textAlign = 'right';
                ctx.fillText(`s${sub} =`, x - NODE_RADIUS - 69, y);
                ctx.fillText(currentInputs[i].toFixed(2), x - NODE_RADIUS - 8, y);
            }
            ctx.textBaseline = 'alphabetic';

            // layer labels + triangles for hidden layers
            triangleZones = [];
            layerBtnZones = [];
            ctx.font = '600 18px Orbitron, sans-serif';
            ctx.textAlign = 'center';
            const triSize = 14;

            for (let l = 0; l < LAYERS.length; l++) {
                const x = positions[l][0].x;
                const nodeY = positions[l][0].y;
                const labelY = nodeY - 65;
                const triUp = labelY - 34;
                const triDown = labelY + 16;
                const isInput = l === 0;
                const isOutput = l === LAYERS.length - 1;
                const isHidden = !isInput && !isOutput;

                const [lr,lg,lb] = layerRGB(l);
                const layerColor = `rgb(${lr},${lg},${lb})`;

                if (isHidden) {
                    const colW = w / (LAYERS.length + 1);
                    if (Math.abs(currentMouseX - x) < colW * 0.5) {
                        ctx.font = '700 26px Orbitron, sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillStyle = layerColor;
                        ctx.fillText(`${LAYERS[l]}`, x, labelY);

                        const atMax = LAYERS[l] >= 20;
                        const atMin = LAYERS[l] <= 1;

                        drawTriangle(x, triUp, triSize, true);
                        ctx.fillStyle = atMax ? layerColor.replace('rgb', 'rgba').replace(')', ',0.2)') : layerColor;
                        ctx.fill();
                        if (!atMax) triangleZones.push({ layer: l, dir: +1, x, y: triUp, hit: triSize + 4 });

                        drawTriangle(x, triDown, triSize, false);
                        ctx.fillStyle = atMin ? layerColor.replace('rgb', 'rgba').replace(')', ',0.2)') : layerColor;
                        ctx.fill();
                        if (!atMin) triangleZones.push({ layer: l, dir: -1, x, y: triDown, hit: triSize + 4 });
                    }
                }
            }

            // +/- Layer buttons at bottom center
            {
                const bW = 45, bH = 45, bGap = 12, bR = 8;
                const bY = h - 50;
                const canAdd = LAYERS.length - 2 < 5;
                const canRemove = LAYERS.length - 2 > 1;
                const plusX = w / 2 - bGap / 2 - bW / 2;
                const minusX = w / 2 + bGap / 2 + bW / 2;

                [[plusX, true, canAdd, addLayer], [minusX, false, canRemove, removeLayer]].forEach(([bx, isPlus, enabled, action]) => {
                    const col = enabled ? '#00c8ff' : 'rgba(0,200,255,0.18)';
                    const s = bW / 100;
                    const lx = bx - bW / 2, ly = bY - bH / 2;
                    ctx.save();
                    if (enabled) { ctx.shadowColor = '#00c8ff'; ctx.shadowBlur = 12; }
                    drawRoundRect(lx, ly, bW, bH, bR);
                    ctx.fillStyle = enabled ? 'rgba(0,200,255,0.10)' : 'rgba(0,0,0,0.08)';
                    ctx.fill();
                    ctx.strokeStyle = col;
                    ctx.lineWidth = 1.8;
                    ctx.stroke();
                    ctx.strokeStyle = col;
                    ctx.lineWidth = 7 * s;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(lx + 33 * s, ly + 50 * s);
                    ctx.lineTo(lx + 67 * s, ly + 50 * s);
                    ctx.stroke();
                    if (isPlus) {
                        ctx.beginPath();
                        ctx.moveTo(lx + 50 * s, ly + 33 * s);
                        ctx.lineTo(lx + 50 * s, ly + 67 * s);
                        ctx.stroke();
                    }
                    ctx.restore();
                    if (enabled) {
                        const tip = isPlus 
                            ? (typeof CyberI18n !== 'undefined' ? CyberI18n.get('ui.add_layer') : 'Layer hinzufügen')
                            : (typeof CyberI18n !== 'undefined' ? CyberI18n.get('ui.remove_layer') : 'Layer entfernen');
                        layerBtnZones.push({ x: bx, y: bY, hw: bW / 2, hh: bH / 2, action, tip });
                    }
                });
            }

            // Q box top-left — only when trained
            {
                const mse = lossHistory.length > 0 ? Math.pow(10, lossHistory[lossHistory.length - 1]) : null;
                const rmse = mse !== null ? Math.sqrt(mse) * (ONORM[selectedOp.id] || 10) : null;
                if (rmse !== null) {
                    const _outVal = activations[activations.length - 1][0];
                    const _pred = denormOut(_outVal);
                    const [_v1, _v2] = currentInputs;
                    const _target = selectedOp.id === 'add' ? _v1+_v2 : selectedOp.id === 'sub' ? _v1-_v2 : selectedOp.id === 'mul' ? _v1*_v2 : _v2 !== 0 ? _v1/_v2 : 0;
                    const absDelta = Math.abs(_pred - _target);

                    const bx = 16, by = 16, bw = 130, bh = 50, bR = 6;
                    drawRoundRect(bx, by, bw, bh, bR);
                    ctx.fillStyle = 'rgba(0,0,0,0.45)';
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(0,200,255,0.3)';
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    ctx.font = 'italic 700 18px Times New Roman, serif';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = '#ff2222';
                    ctx.textAlign = 'left';
                    ctx.fillText('Q', bx + 15, by + bh / 2);
                    ctx.font = 'italic 700 20px Times New Roman, serif';
                    ctx.textAlign = 'left';
                    ctx.fillStyle = '#ff2222';
                    ctx.fillText(rmse.toFixed(4), bx + 42, by + bh / 2);
                    ctx.textBaseline = 'alphabetic';
                }
            }

            // loss curve
            if (lossHistory.length > 1) {
                const cw = 220, ch = 70, cx = w - cw - 20, cy = h - ch - 20;
                ctx.fillStyle = 'rgba(0,0,0,0.45)';
                ctx.strokeStyle = 'rgba(255,34,34,0.3)';
                ctx.lineWidth = 1;
                ctx.beginPath(); ctx.rect(cx, cy, cw, ch); ctx.fill(); ctx.stroke();
                
                const minL = Math.min(...lossHistory), maxL = Math.max(...lossHistory);
                const rng = maxL - minL || 1;
                ctx.beginPath();
                ctx.strokeStyle = '#ff2222';
                ctx.lineWidth = 1.5;
                lossHistory.forEach((v, i) => {
                    const px = cx + (i / (lossHistory.length - 1)) * cw;
                    const py = cy + ch - ((v - minL) / rng) * (ch - 12) - 6;
                    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
                });
                ctx.stroke();
                const info = document.getElementById('train-info');
                if (info) info.textContent = `Epoch ${trainEpoch} · Loss ${Math.pow(10, lossHistory[lossHistory.length-1]).toExponential(2)}`;
            }

            // output value + target + delta
            const outVal = activations[activations.length - 1][0];
            const outPos = positions[positions.length - 1][0];
            const predRaw = denormOut(outVal);
            const [v1, v2] = currentInputs;
            const targetRaw = selectedOp.id === 'add' ? v1 + v2
                            : selectedOp.id === 'sub' ? v1 - v2
                            : selectedOp.id === 'mul' ? v1 * v2
                            : v2 !== 0 ? v1 / v2 : 0;
            const delta = predRaw - targetRaw;
            const tx = outPos.x + NODE_RADIUS + 18;
            const lineH = 18;

            const absDelta = Math.abs(delta);
            const renderSym = s => katex.renderToString(s, {throwOnError: false});
            const renderNum = (v, sign) => katex.renderToString('\\mathit{' + (sign && v >= 0 ? '+' : '') + v.toFixed(3) + '}', {throwOnError: false});
            const row = (sym, val, sign, color) =>
                `<div style="display:contents;color:${color}">` +
                    `<div style="text-align:right">${renderSym(sym)}</div>` +
                    `<div style="text-align:right">${renderNum(val, sign)}</div>` +
                `</div>`;
            const ol = document.getElementById('output-latex');
            ol.style.display = 'grid';
            ol.style.gridTemplateColumns = 'auto auto';
            ol.style.columnGap = '0.6em';
            ol.style.rowGap = '0.15em';
            const fs = 22;
            const rowH = fs * 2;
            const rowGapPx = Math.round(fs * 0.15);
            ol.style.fontSize = fs + 'px';
            ol.style.left = tx + 'px';
            ol.style.top = (outPos.y - (rowH + rowGapPx) - rowH / 2) + 'px';
            ol.innerHTML =
                row('y_{Ziel}', targetRaw, false, '#ffcc00') +
                row('y_{Netz}', predRaw, false, '#cc66ff') +
                row('|\\Delta|', Math.abs(delta), false, '#ff2222');
          } catch(e) { console.error('draw:', e); }
        }

        function init() {
            resizeCanvasToContainer();
            draw();
        }

        window.addEventListener('resize', init);
        // let mouseLeft = false;
        // document.documentElement.addEventListener('mouseleave', () => { mouseLeft = true; });
        // document.documentElement.addEventListener('mouseenter', () => { if (mouseLeft) location.reload(); });
        document.fonts.ready.then(init);
    </script>
</body>
