<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOC ALVERS MATHE-LABORE | Babylonische Zahlen</title>

        content="Babylonische Zahlen selbst legen: Keile und Winkelhaken im Sechzigersystem — und der Dezimalwert läuft mit.">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="morpheus/vendor/katex/katex.min.css">
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
    </script>

    <link rel="icon" type="image/png" sizes="256x256" href="resources/favicon.png">

    <link rel="stylesheet" href="js/buttons-ultra.css">
    <link rel="stylesheet" href="js/cyber-clock.css">
    <link rel="stylesheet" href="js/cyber-lab-overrides.css">

    <style>
        #bab-solution {
            padding-left: 0;
            padding-right: 0;
        }

        #bab-solution {
            font-size: 1.6rem;
            font-family: Arial, Helvetica, sans-serif;
        }

        #canvas {
            touch-action: none;
            cursor: default;
        }

        /* the number and the sum each sit on their own card over the stage;
           left and width come from the same block the places and the panel use */
        .bab-card {
            position: absolute;
            margin: 0;
            padding: 12px 18px;
            border-radius: 18px;
            background: rgba(10, 20, 40, 0.4);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(0, 210, 255, 0.2);
            text-align: center;
            pointer-events: none;
            box-sizing: border-box;
        }

        /* the die out of the Würfelspiel - the same WebGL die, js/dice3d.js */
        #bab-dice {
            pointer-events: auto;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        /* grey whenever the die has nothing to say - the die itself, not its card: the card
           keeps its glass and its edge, only the cube steps back */
        #bab-dice.dimmed #die-stage {
            filter: grayscale(1);
            opacity: 0.45;
        }

        /* while the number is being typed it takes no tap either - the first tap just
           leaves the number, it does not roll */
        #bab-dice.locked {
            pointer-events: none;
        }

        #die-stage {
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: grab;
            transition: filter 0.2s ease, opacity 0.2s ease;
        }

        #die-stage:active {
            cursor: grabbing;
        }

        /* KaTeX_Main has to be in use once, or the browser never loads it for the die faces */
        #font-probe {
            position: absolute;
            left: -999px;
            font-family: KaTeX_Main, serif;
        }

        #bab-head .bab-num {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            line-height: 1;
            min-height: 1em;           /* the box keeps its size while the digits are still arriving */
            color: rgb(245, 194, 66);
            font-size: clamp(2.2rem, 7.5vw, 6rem);
            /* the number is a field as well: tap it and type another one */
            pointer-events: auto;
            cursor: pointer;
            caret-color: rgb(245, 194, 66);
            outline: none;
        }

        #bab-head {
            transition: border-color 0.2s ease;
        }

        /* upright the number stands over two columns only, so it is smaller and never wraps */
        #bab-head.column .bab-num {
            font-size: clamp(1.4rem, 2.8vw, 2.9rem);
            white-space: nowrap;
        }

        /* two small triangles at the right edge, there only while the number is typed */
        .bab-spin {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: auto;
        }

        /* the left pair says how many places stand below - that one is always there */
        .bab-spin.left {
            display: flex;
            right: auto;
            left: 18px;
        }

        .bab-spin button {
            margin: 0;
            padding: 6px;
            border: 0;
            background: none;
            line-height: 0;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.3);
            transition: color 0.15s ease;
        }

        .bab-spin button:hover,
        .bab-spin button:active {
            color: rgb(245, 194, 66);
        }

        /* the two pairs do different things, so they wear different colours:
           left (how many places) a soft yellow, right (the number itself) green */
        .bab-spin.left button {
            color: rgba(245, 194, 66, 0.5);
        }

        .bab-spin.left button:hover,
        .bab-spin.left button:active {
            color: rgb(245, 194, 66);
        }

        .bab-spin:not(.left) button {
            color: rgba(121, 158, 49, 0.5);
        }

        .bab-spin:not(.left) button:hover,
        .bab-spin:not(.left) button:active {
            color: rgb(121, 158, 49);
        }

        .bab-spin svg {
            display: block;
            width: 18px;
            height: 11px;
            fill: currentColor;
        }

        /* stepping with the triangles or the arrow keys: no blinking caret in the way */
        #bab-num.no-caret {
            caret-color: transparent;
        }

        #bab-num::selection,
        #bab-num ::selection {
            background: rgba(245, 194, 66, 0.28);
        }

        #bab-head:hover,
        #bab-head.editing {
            border-color: rgba(245, 194, 66, 0.5);
        }

        /* a rolled number rides in from the right */
        #bab-head {
            overflow: hidden;
        }

        @keyframes bab-from-right {
            from { transform: translateX(45%); opacity: 0; }
            to   { transform: translateX(0);   opacity: 1; }
        }

        #bab-head .bab-num .num-ch {
            display: inline-block;
        }

        #bab-head .bab-num .num-ch.rolled-in {
            animation: bab-from-right 0.38s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* solved: the same treatment, in our green */
        #bab-head.solved .bab-num .num-ch {
            background-image: linear-gradient(180deg, #ffffff 0%, #e6f3cd 20%, #9ec44a 60%, #5c7a28 100%);
            filter: drop-shadow(0 0 25px rgba(121, 158, 49, 0.5));
        }



        /* the link between the number above and the board below: sits on the seam of the
           two cards, and set it lays the rolled number in cuneiform on the places */
        .bab-link {
            position: absolute;
            width: 46px;
            height: 46px;
            margin: 0;
            padding: 0;
            border-radius: 50%;
            border: 1px solid rgb(245, 194, 66);
            background: rgba(10, 20, 40, 0.85);
            backdrop-filter: blur(25px);
            color: rgb(245, 194, 66);
            box-shadow: 0 0 18px rgba(245, 194, 66, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: auto;
            z-index: 2;                /* over both cards - no card edge runs through it */
            transition: box-shadow 0.2s ease;
        }

        .bab-link:hover,
        .bab-link:focus-visible {
            box-shadow: 0 0 26px rgba(245, 194, 66, 0.6);
            outline: none;
        }

        /* the arrow itself is the state: down means the number lays the board, up means the
           board says what the number is - and the turn is what you see */
        .bab-link svg {
            transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
            transform: rotate(180deg);
        }

        .bab-link.down svg {
            transform: rotate(0deg);
        }

        /* upright the number stands to the right of the board, so the arrow lies on its
           side: right to the number when the board leads, left into the board when the
           number leads */
        .bab-link.sideways svg {
            transform: rotate(-90deg);
        }

        .bab-link.sideways.down svg {
            transform: rotate(90deg);
        }

        /* grey and pointing down: a number stands above and nothing lies below yet - that is
           the task. One click and it lays itself, which is the answer. */
        .bab-link.pending {
            border-color: rgba(255, 255, 255, 0.25);
            color: rgba(255, 255, 255, 0.4);
            box-shadow: none;
        }

        .bab-link.pending:hover {
            color: rgba(255, 255, 255, 0.75);
            border-color: rgba(255, 255, 255, 0.45);
            box-shadow: none;
        }

        .bab-link svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #bab-formula {
            position: relative;
        }

        #bab-solution.column #bab-formula {
            height: 100%;
        }

        .bab-term,
        .bab-plus {
            position: absolute;
            top: 0;
            transform: translateX(-50%);
            white-space: nowrap;
        }

        /* upright: the board is a column, so the sum is one term per row beside it */
        #bab-solution.column {
            padding: 12px 16px;
            text-align: left;
            font-size: 1.15rem;
        }

        #bab-solution.column .bab-term,
        #bab-solution.column .bab-plus {
            top: auto;
            left: 0;
            transform: translateY(-50%);
        }

        .bab-plus {
            opacity: 0.5;
        }

        .bab-row {
            display: flex;
            align-items: stretch;      /* the field takes the button's height, whatever it is */
            gap: 8px;
            margin-top: 8px;
        }

        .bab-row>* {
            flex: 1 1 0;               /* two equal halves, like the row below */
            min-width: 0;
        }

        /* the shared button carries a 10px top margin; inside a row it would make the
           field next to it that much taller, so the row spacing lives on .bab-row */
        #ui-container .bab-row .cyber-btn {
            margin-top: 0;
        }

        .bab-row input[type="number"] {
            text-align: center;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(245, 194, 66, 0.35);
            border-radius: 10px;
            color: rgb(245, 194, 66);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            line-height: 1;            /* Orbitron's line box would make the field taller */
            padding: 6px 10px;         /* than the button beside it */
        }

        .bab-row input[type="number"]:focus {
            outline: none;
            border-color: rgb(245, 194, 66);
        }

        /* the place value system sits in a popup - the stage itself stays clear */
        .bab-dlg {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(0, 0, 20, 0.6);
            backdrop-filter: blur(6px);
        }

        .bab-dlg[hidden] {
            display: none;
        }

        .bab-dlg-card {
            width: min(92vw, 420px);
            box-sizing: border-box;
            padding: 22px 24px 18px;
            border-radius: 18px;
            background: rgba(10, 20, 40, 0.92);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(121, 158, 49, 0.45);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
        }

        .bab-dlg .bab-dlg-h2 {
            margin-top: 18px;
        }

        .bab-dlg h2 {
            margin: 0 0 14px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.12em;
            color: rgb(121, 158, 49);
        }

        .bab-dlg .bab-note {
            margin-top: 10px;
        }

        .bab-dlg .cyber-btn {
            width: 100%;
        }

        .bab-note {
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            line-height: 1.5;
            opacity: 0.8;
        }

        .bab-task-target {
            display: flex;
            justify-content: center;
            margin: 6px 0 10px;
        }

        @media (max-width: 760px) {
            /* the die: a still cube in the lab's colours, it only turns when it is rolled */
        #bab-dice {
            pointer-events: auto;
            cursor: pointer;
            padding: 10px 18px;
        }

        .cube-stage {
            perspective: 300px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cube {
            position: relative;
            width: 44px;
            height: 44px;
            transform-style: preserve-3d;
            transform: rotateX(-24deg) rotateY(32deg);
            transition: transform 0.15s linear;
        }

        .cube-face {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 19px;
            color: rgb(238, 243, 250);
        }

        .cube-face:nth-child(1) { background: rgb(245, 194, 66); }
        .cube-face:nth-child(2) { background: rgb(0, 210, 255); }
        .cube-face:nth-child(3) { background: rgb(121, 158, 49); }
        .cube-face:nth-child(4) { background: rgb(176, 36, 24); }
        .cube-face:nth-child(5) { background: rgb(0, 210, 255); }
        .cube-face:nth-child(6) { background: rgb(245, 194, 66); }

        #bab-head .bab-num {
                font-size: clamp(1.8rem, 12vw, 3.2rem);
            }
        }
    </style>
</head>

    <script>
        // Debug output goes into the central DEBUG window, never into the console.
        if (/[?&]debug=1\b/.test(location.search)) {
            var s = document.createElement('script');
            s.src = 'js/debug-window.js';

    <script>

        const T = (k, fb) => (typeof CyberI18n !== 'undefined' && CyberI18n.getOr)
            ? CyberI18n.getOr('babylon.' + k, fb)
            : fb;

        function dbg(m) { if (window.DebugWindow) DebugWindow.log('[babylon] ' + m); }

        CyberBranding.init({
            useExternalStyles: true,
            title: CyberI18n.get('ui.coach_title'),
            subtitle: T('title', 'BABYLONISCHE ZAHLEN'),
        });
        CyberUI.init();

        if (window.CyberLeftChrome && typeof CyberLeftChrome.configure === 'function') {
            CyberLeftChrome.configure({ viewportOnlyZoom: true });
        }

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');

        // ---------------------------------------------------------------- palette ---
        const COL = {
            glyph: 'rgb(245, 194, 66)',   // wedges and corner wedges
            zero: 'rgb(245, 194, 66)',    // the two slanted wedges that hold an empty place
            ok: 'rgb(121, 158, 49)',      // right answer, carry done
            cyan: 'rgb(0, 210, 255)',
            warn: 'rgb(176, 36, 24)',
            dim: 'rgba(245, 194, 66, 0.55)',
            mute: 'rgba(255, 255, 255, 0.3)',   // the grey of the open link - out of play
            line: 'rgba(255, 255, 255, 0.13)',
            fill: 'rgba(255, 255, 255, 0.03)'
        };

        // ------------------------------------------------------------ number system ---
        // A Babylonian number is written from left to right, the highest place first, and every
        // place is worth sixty times the one to its right. Inside a place the digit is built
        // from two signs only: the upright wedge counts one, the corner wedge counts ten.
        // For most of their history there was no zero at all - an empty place was a gap, and
        // often not even that. Only late (Seleucid, from about 300 BC) two slanted wedges hold
        // an empty place in the middle of a number. Both ways are here; the values are the same.
        const SYSTEMS = {
            platzhalter: {
                label: 'mit Platzhalter',
                values: [1, 60, 3600, 216000, 12960000],
                limits: [60, 60, 60, 60, 60]
            },
            ohneNull: {
                label: 'ohne Null',
                values: [1, 60, 3600, 216000, 12960000],
                limits: [60, 60, 60, 60, 60]
            }
        };
        const DIGITS = 60;                // 0..59 in every place

        // Settings survive a reload. Storage can be blocked or empty, so every touch is guarded
        // and the lab works exactly the same when it gives nothing back.
        const store = {
            get(key, fallback) {
                try { const v = localStorage.getItem('babylon.' + key); return v === null ? fallback : v; }
                catch (e) { return fallback; }
            },
            set(key, value) {
                try { localStorage.setItem('babylon.' + key, value); } catch (e) { }
            }
        };

        // C gives every place its own colour - ours plus the cyan of the lab
        let colorMode = store.get('colour', '0') === '1';
        const PLACE_COLORS = [
            'rgb(245, 194, 66)', 'rgb(0, 210, 255)', 'rgb(121, 158, 49)',
            'rgb(176, 36, 24)', 'rgb(157, 80, 187)'   // the fifth its own, not the cyan again
        ];
        const placeColor = (place) =>
            (colorMode && place !== null && place !== undefined) ? PLACE_COLORS[place] : COL.glyph;

        let sysKey = store.get('system', 'platzhalter') === 'ohneNull' ? 'ohneNull' : 'platzhalter';
        let digits = [0, 0, 0, 0, 0];     // index 0 = ones, at the bottom of the board
        let task = null;                  // { target, done }
        // Which way the arrow points, and whether it has been followed yet:
        //   'up'   - the board leads, the number above says what lies there
        //   'down' - the number above leads, the board is its cuneiform
        //   'task' - the arrow points down but grey: a number stands above, the board is
        //            empty, and laying it is yours. One click lays it - that is the answer.
        // Whoever is worked on leads, so the arrow turns by itself.
        let flow = 'up';
        let editing = false;              // the big number is being typed over
        let before = null;                // what lay on the board before it was typed over
        let blank = false;                // nothing lies on the board - not even a zero
        // how many places stand there - three unless it is set otherwise, and never fewer than
        // the number needs
        let placeCount = Math.min(5, Math.max(1, parseInt(store.get('places', '3'), 10) || 3));
        // two ways to stand: flat, the places side by side the way the scribes wrote them, or
        // upright - a column with the highest place on top
        let upright = store.get('upright', '0') === '1';
        let flashes = [];                 // { place, color, until }
        let cards = [];                   // the places, side by side
        let glyphs = [];                  // every dot and every bar, for taking them away
        let palette = [];                 // the sixty digits to drag from
        let drag = null;                  // { digit, x, y, moved }
        let picked = null;                // digit tapped in the panel, waiting for a place
        let hoverPlace = null;            // the place a dragged digit is over

        const sys = () => SYSTEMS[sysKey];
        const value = () => digits.reduce((sum, d, i) => sum + d * sys().values[i], 0);
        const de = (n) => n.toLocaleString('de-DE');

        function places() {
            let top = placeCount - 1;     // as many as are set, more if the number needs them
            for (let i = digits.length - 1; i >= 0; i--) {
                if (digits[i] > 0) { top = Math.max(top, i); break; }
            }
            return top + 1;
        }

        // the left pair of triangles: one place more, one place less. Fewer than the number
        // needs is not possible - those places hold something.
        function setPlaces(n) {
            placeCount = Math.min(5, Math.max(1, n));
            store.set('places', String(placeCount));
            // a number that no longer fits has nowhere to go, so it goes: empty board, empty
            // number, and the arrow back up. Whatever fits simply stays.
            const room = maxValue(placeCount);
            if (value() > room || (task && task.target > room)) {
                digits = [0, 0, 0, 0, 0];
                blank = true;
                task = null;
                setFlow('up', true);
                say(T('places_clear', 'Zu wenig Stellen für diese Zahl - das Brett ist leer.'), COL.glyph);
            }
            changed();
        }

        // the largest number that fits into n places
        function maxValue(n) {
            const v = sys().values, lim = sys().limits;
            let m = 0;
            for (let i = 0; i < n; i++) m += (lim[i] - 1) * v[i];
            return m;
        }

        // the highest place that holds something, one-based

        // Lay a decimal number out over the places, highest first.
        function layout(n) {
            const v = sys().values;
            const maxValue = v[4] * (sys().limits[4] - 1) + v[4] - 1;
            n = Math.max(0, Math.min(Math.floor(n), maxValue));
            const out = [0, 0, 0, 0, 0];
            for (let i = v.length - 1; i >= 0; i--) {
                out[i] = Math.floor(n / v[i]);
                n -= out[i] * v[i];
            }
            digits = out;
            blank = false;
        }

        // ------------------------------------------------------------------ drawing ---
        function roundRect(x, y, w, h, r, fill, stroke) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
            if (fill) { ctx.fillStyle = fill; ctx.fill(); }
            if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
        }

        // The upright wedge, the "one": a triangular head pressed in with the corner of the
        // stylus, and the thin tail the edge leaves behind. x is its middle, y the top of the
        // head, u the width of the head.
        function wedgePath(x, y, u) {
            ctx.beginPath();
            ctx.moveTo(x - u / 2, y);
            ctx.lineTo(x + u / 2, y);
            ctx.lineTo(x + u * 0.11, y + u * 0.5);
            ctx.lineTo(x + u * 0.035, y + u * 1.5);
            ctx.lineTo(x - u * 0.035, y + u * 1.5);
            ctx.lineTo(x - u * 0.11, y + u * 0.5);
            ctx.closePath();
        }

        // The corner wedge, the "ten": the stylus pressed in sideways - an open angle with its
        // tip to the left. cx, cy is its middle.
        function cornerPath(cx, cy, u) {
            const w = u * 0.95, h = u * 1.2;
            ctx.beginPath();
            ctx.moveTo(cx + w / 2, cy - h / 2);
            ctx.lineTo(cx - w / 2, cy);
            ctx.lineTo(cx + w / 2, cy + h / 2);
            ctx.lineTo(cx + w * 0.02, cy);
            ctx.closePath();
        }

        // The late placeholder: two small wedges leaning over, parallel, side by side.
        function drawZero(cx, cy, u, col) {
            ctx.save();
            ctx.fillStyle = col || COL.zero;
            const w = u * 0.8;
            for (const k of [-1, 1]) {
                ctx.save();
                ctx.translate(cx + k * u * 0.45, cy + k * u * 0.15);
                ctx.rotate(-0.75);
                wedgePath(0, -w * 0.75, w);            // turned about its own middle
                ctx.fill();
                ctx.restore();
            }
            ctx.restore();
        }

        // How the wedges of one digit stand: the rows the scribes used, top row first.
        const ONES_ROWS = [[], [1], [2], [3], [2, 2], [3, 2], [3, 3], [4, 3], [4, 4], [3, 3, 3]];
        const TENS_ROWS = [[], [1], [2], [3], [2, 2], [3, 2]];

        // The place value as a power, drawn small at the top of its card: 60^0, 60^1, ...
        function drawPower(place, cx, y) {
            const base = '60', exp = place;
            ctx.save();
            ctx.fillStyle = colorMode ? placeColor(place) : 'rgba(255, 255, 255, 0.45)';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.font = "600 12px 'Orbitron', sans-serif";
            const bw = ctx.measureText(base).width;
            ctx.font = "600 9px 'Orbitron', sans-serif";
            const ew = ctx.measureText(String(exp)).width;
            const x = cx - (bw + 1 + ew) / 2;
            ctx.font = "600 12px 'Orbitron', sans-serif";
            ctx.fillText(base, x, y);
            ctx.font = "600 9px 'Orbitron', sans-serif";
            ctx.fillText(String(exp), x + bw + 1, y - 3);
            ctx.restore();
        }

        // One digit 0..59: the corner wedges (tens) on the left, the upright wedges (ones) on
        // the right. The wedge size depends only on the box, never on the digit - so a 1 and a
        // 59 in the same row of places are drawn with the same stylus.
        // place === null draws a loose digit (panel, drag ghost) and registers no targets.
        function paintDigit(d, cx, cy, bw, bh, place, colOverride) {
            if (d === null) return;               // an empty place shows nothing at all
            const col = colOverride || placeColor(place);
            // the widest digit (tens 3 across, ones 4 across) and the tallest (3 rows) fit
            const u = Math.min(bw * 0.85 / 7.7, bh * 0.85 / 4.6, 30);
            if (d === 0) {
                // without a zero the place stays empty - that was the whole trouble
                if (sysKey === 'platzhalter') drawZero(cx, cy, u * 1.2, colOverride || (colorMode ? col : COL.zero));
                return;
            }
            const tens = TENS_ROWS[Math.floor(d / 10)], ones = ONES_ROWS[d % 10];
            const colsOf = (rows) => rows.length ? Math.max(...rows) : 0;
            const tStep = u * 0.95, oStep = u * 1.05;
            const tW = tens.length ? (colsOf(tens) - 1) * tStep + u * 0.95 : 0;
            const oW = ones.length ? (colsOf(ones) - 1) * oStep + u : 0;
            const gap = tens.length && ones.length ? u * 0.55 : 0;
            let x0 = cx - (tW + gap + oW) / 2;
            ctx.fillStyle = col;

            if (tens.length) {
                const rowStep = u * 1.3;
                const h = u * 1.2 + (tens.length - 1) * rowStep;
                tens.forEach((cnt, r) => {
                    const yc = cy - h / 2 + u * 0.6 + r * rowStep;
                    const rowW = (cnt - 1) * tStep + u * 0.95;
                    const sx = x0 + (tW - rowW) / 2 + u * 0.475;
                    for (let k = 0; k < cnt; k++) {
                        cornerPath(sx + k * tStep, yc, u);
                        ctx.fill();
                    }
                });
                if (place !== null) glyphs.push({ place, type: 'ten', x: x0, y: cy - h / 2, w: tW, h });
                x0 += tW + gap;
            }
            if (ones.length) {
                const rowStep = u * 1.55;
                const h = u * 1.5 + (ones.length - 1) * rowStep;
                ones.forEach((cnt, r) => {
                    const yt = cy - h / 2 + r * rowStep;
                    const rowW = (cnt - 1) * oStep + u;
                    const sx = x0 + (oW - rowW) / 2 + u / 2;
                    for (let k = 0; k < cnt; k++) {
                        wedgePath(sx + k * oStep, yt, u);
                        ctx.fill();
                    }
                });
                if (place !== null) glyphs.push({ place, type: 'one', x: x0, y: cy - h / 2, w: oW, h });
            }
        }

        function flashColor(place) {
            const now = performance.now();
            const f = flashes.find(f => f.place === place && f.until > now);
            return f ? f.color : null;
        }

        // One cell of the digit panel: its number small in the top left corner, the digit in
        // cuneiform filling the rest. Sixty cells are small, so the label keeps out of the way.
        function paletteCell(k, cx0, cy0, cellW, cellH, panelCol) {
            const on = picked === k || (drag && drag.digit === k);
            roundRect(cx0 + 2, cy0 + 2, cellW - 4, cellH - 4, 8,
                on ? 'rgba(245, 194, 66, 0.12)' : 'rgba(255, 255, 255, 0.02)',
                on ? COL.glyph : 'rgba(255, 255, 255, 0.07)');
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.font = "600 9px 'Orbitron', sans-serif";
            ctx.fillStyle = on ? COL.glyph : 'rgba(255, 255, 255, 0.4)';
            ctx.fillText(String(k), cx0 + 6, cy0 + 5);
            paintDigit(k, cx0 + cellW / 2 + 3, cy0 + cellH * 0.56, cellW - 14, cellH * 0.72, null, panelCol);
            palette.push({ digit: k, x: cx0, y: cy0, w: cellW, h: cellH });
        }

        function draw() {
            const rect = container.getBoundingClientRect();
            const W = rect.width, H = rect.height;
            ctx.clearRect(0, 0, W, H);
            cards = [];
            glyphs = [];
            palette = [];
            if (W < 200 || H < 200) return;     // the chrome has not settled yet
            if (upright) { drawUpright(rect, W, H); return; }

            const pad = 16;
            const n = places();

            // places and panel share one width, so their edges line up. That width is fixed -
            // it is always the one four places take - so setting the number of places does not
            // move the number, the sum or the panel. Only the places themselves get wider or
            // narrower to fill it.
            const REF_PLACES = 4;
            const blockW = Math.min(W - 2 * pad, REF_PLACES * 200 + (REF_PLACES - 1) * 14);
            const blockX = (W - blockW) / 2;

            // where the places will stand - the sum's terms line up with these columns
            const cardW = (blockW - (n - 1) * 14) / n;
            const colCenter = (col) => blockX + col * (cardW + 14) + cardW / 2;

            // the number and the sum sit above the board as HTML cards -
            // measure them, then give the board what is left
            const diceEl = document.getElementById('bab-dice');
            const headEl = document.getElementById('bab-head');
            const solEl = document.getElementById('bab-solution');
            const linkEl = document.getElementById('bab-link');
            const titleEl = document.getElementById('lab-title');
            let top = 14, stackTopMin = 14, dH = 0, hH = 0, sH = 0, tH = 0;
            if (headEl && solEl) {
                for (const el of [diceEl, headEl, solEl]) {
                    if (!el) continue;
                    el.style.left = blockX + 'px';
                    el.style.width = blockW + 'px';
                }
                // the branding sits in the top right corner of the stage - stay below it
                const brand = document.querySelector('.canvas-branding');
                if (brand) {
                    const b = brand.getBoundingClientRect();
                    if (b.width && b.left - rect.left < blockX + blockW) {
                        stackTopMin = Math.max(stackTopMin, b.bottom - rect.top + 12);
                    }
                }
                solEl.classList.remove('column');
                headEl.classList.remove('column');
                if (linkEl) linkEl.classList.remove('sideways');
                solEl.style.height = '';
                solEl.querySelectorAll('.bab-term').forEach(el => {
                    const col = Number(el.dataset.col);
                    el.style.top = '';
                    el.style.right = '';
                    el.style.left = (colCenter(col) - blockX) + 'px';
                    // in colour mode every term takes the colour of its own place
                    el.style.color = colorMode ? placeColor(n - 1 - col) : '';
                });
                solEl.querySelectorAll('.bab-plus').forEach(el => {
                    const g = Number(el.dataset.gap);
                    el.style.top = '';
                    el.style.right = '';
                    el.style.left = ((colCenter(g) + colCenter(g + 1)) / 2 - blockX) + 'px';
                });
                if (titleEl) {
                    titleEl.style.left = blockX + 'px';
                    titleEl.style.width = blockW + 'px';
                    tH = titleEl.offsetHeight + 14;
                }
                // the die's box is exactly as high as the number's, the die fills it
                headEl.style.top = stackTopMin + 'px';
                hH = headEl.offsetHeight;
                if (diceEl) {
                    diceEl.style.height = hH + 'px';
                    diceEl.style.top = stackTopMin + 'px';
                    dH = hH + 14;
                    headEl.style.top = (stackTopMin + dH) + 'px';
                }
                solEl.style.top = (stackTopMin + dH + hH + 14) + 'px';
                sH = solEl.offsetHeight;
                top = stackTopMin + tH + dH + hH + 14 + sH + 14;
            }

            const avail = H - top - pad;
            if (avail < 200) return;

            // the panel: ten across and six down - every row one more ten, every column one more one
            const cols = 10;
            const rows = DIGITS / cols;
            const cellW = blockW / cols;
            const cellH = Math.min(cellW * 0.8, (avail * 0.55 - 26) / rows);
            const panelH = rows * cellH + 26;

            // the places above it
            const cardsH = Math.min(avail - panelH - 16, 280);
            const cardH = Math.max(90, cardsH - 24);
            const rowX = blockX;

            const gapH = 22, captionH = 28;
            const blockH = cardH + gapH + rows * cellH + captionH;

            // die, number, sum and board keep the same gap the places and the panel keep,
            // and the whole stack stands centred on the stage
            const stackGap = gapH;
            const diceH = diceEl ? diceEl.offsetHeight : 0;
            const titleH = titleEl ? titleEl.offsetHeight + stackGap : 0;
            const stackH = titleH + (diceEl ? diceH + stackGap : 0) + hH + stackGap + sH + stackGap + blockH;
            const DROP = 28;            // the whole block sits a little lower than centred
            const lowest = Math.max(stackTopMin, H - pad - stackH);
            const stackTop = Math.min(
                Math.max(stackTopMin, Math.min((H - stackH) / 2, H - pad - stackH)) + DROP,
                lowest);
            let y = stackTop;
            if (titleEl) { titleEl.style.top = y + 'px'; y += titleH; }
            if (diceEl) { diceEl.style.top = y + 'px'; y += diceH + stackGap; }
            if (headEl) headEl.style.top = y + 'px';
            y += hH + stackGap;
            if (solEl) solEl.style.top = y + 'px';
            if (linkEl) {
                const seam = y - stackGap / 2;        // the gap between the number and the sum
                linkEl.style.top = (seam - linkEl.offsetHeight / 2) + 'px';
                linkEl.style.left = (blockX + blockW / 2 - linkEl.offsetWidth / 2) + 'px';
            }
            const cardY = y + sH + stackGap;
            const panelY = cardY + cardH + gapH;

            // what the stage was measured to be, for the debug window
            window.__layout = { W, H, n, stackTopMin, top, avail, hH, sH, diceH, cellH, cardH, panelH, blockH, stackH, stackTop };

            for (let col = 0; col < n; col++) {
                const place = n - 1 - col;              // the highest place stands on the left
                const x = rowX + col * (cardW + 14);
                const flash = flashColor(place);
                const hot = hoverPlace === place;
                // the moment a digit is picked up, every place that cannot hold it goes grey -
                // in base sixty every place holds every digit, so nothing ever does
                const blocked = drag && drag.digit >= sys().limits[place];

                ctx.lineWidth = (flash || hot || colorMode) ? 2 : 1;
                roundRect(x, cardY, cardW, cardH, 16,
                    blocked ? 'rgba(255, 255, 255, 0.04)'
                        : (hot ? 'rgba(245, 194, 66, 0.10)' : (flash ? 'rgba(121, 158, 49, 0.10)' : COL.fill)),
                    blocked ? COL.mute
                        : (hot ? COL.glyph : (flash || (colorMode ? placeColor(place) : COL.line))));

                paintDigit(blank ? null : digits[place], x + cardW / 2, cardY + cardH / 2, cardW, cardH,
                    place, blocked ? COL.mute : null);

                drawPower(place, x + cardW / 2, cardY + 8);

                cards.push({ place, x, y: cardY, w: cardW, h: cardH });
            }

            // ---- the panel of all sixty digits ----
            const gridX = blockX;

            // with the link set the number lays the board, so the sixty digits are nothing
            // but a key down there - they step back into grey
            const panelCol = flow === 'down' ? COL.mute : null;

            for (let k = 0; k < DIGITS; k++) {
                const cx0 = gridX + (k % cols) * cellW;
                const cy0 = panelY + Math.floor(k / cols) * cellH;
                paletteCell(k, cx0, cy0, cellW, cellH, panelCol);
            }

            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.font = "400 13px 'Outfit', sans-serif";
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.fillText(T('panel', 'Die sechzig Ziffern — Zeile: Zehner, Spalte: Einer'),
                blockX + blockW / 2, panelY + rows * cellH + 8);

            // the digit being dragged hangs on the finger
            if (drag) {
                ctx.save();
                ctx.globalAlpha = 0.9;
                paintDigit(drag.digit, drag.x, drag.y, Math.min(cardW, 150), Math.min(cardH, 130), null);
                ctx.restore();
            }
        }

        // The upright board: the places stand in a column, the highest on top, and every term
        // of the sum stands beside its own place. The sixty digits move to the left, because
        // the column is tall. Nothing is rotated - wedges and every word stay heads up.
        function drawUpright(rect, W, H) {
            const pad = 16;
            const n = places();

            const diceEl = document.getElementById('bab-dice');
            const headEl = document.getElementById('bab-head');
            const solEl = document.getElementById('bab-solution');
            const linkEl = document.getElementById('bab-link');
            if (!diceEl || !headEl || !solEl) return;

            solEl.classList.add('column');
            headEl.classList.add('column');
            if (linkEl) linkEl.classList.add('sideways');

            // five columns from left to right: the sixty digits, the board, its sum, the
            // decimal number and the die - the whole stage turned on its side, but every
            // word, glyph and number still standing upright
            const gap = 18;
            const clamp = (lo, v, hi) => Math.max(lo, Math.min(hi, v));
            const groupW = Math.min(W - 2 * pad, 1500);
            const groupX = (W - groupW) / 2;
            const panelW = clamp(180, groupW * 0.2, 300);   // three columns of digits
            const boardW = clamp(120, groupW * 0.17, 230);
            const termW = boardW;                       // the sum box is as wide as the board
            const dieW = clamp(80, groupW * 0.096, 152);   // a fifth narrower than it was
            const numW = clamp(204, groupW * 0.26, 360);

            // everything together, centred on the stage
            const usedW = panelW + boardW + termW + numW + dieW + 4 * gap;
            const groupX2 = (W - usedW) / 2;

            const panelX = groupX2;
            const boardX = panelX + panelW + gap;
            const termX = boardX + boardW + gap;
            const numX = termX + termW + gap;
            const dieX = numX + numW + gap;

            headEl.style.left = numX + 'px';
            headEl.style.width = numW + 'px';
            diceEl.style.left = dieX + 'px';
            diceEl.style.width = dieW + 'px';

            let stackTopMin = 14;
            const brand = document.querySelector('.canvas-branding');
            if (brand) {
                const b = brand.getBoundingClientRect();
                if (b.width && b.left - rect.left < groupX + groupW) {
                    stackTopMin = Math.max(stackTopMin, b.bottom - rect.top + 12);
                }
            }

            // number and die stand on the right, halfway up the stage
            headEl.style.top = stackTopMin + 'px';
            const hH = headEl.offsetHeight;
            const midTop = Math.max(stackTopMin, (H - hH) / 2);
            headEl.style.top = midTop + 'px';
            diceEl.style.height = hH + 'px';
            diceEl.style.top = midTop + 'px';
            const titleUp = document.getElementById('lab-title');
            if (titleUp) {
                titleUp.style.left = numX + 'px';
                titleUp.style.width = (numW + gap + dieW) + 'px';
                titleUp.style.top = (midTop - titleUp.offsetHeight - gap) + 'px';
            }

            const colTop = stackTopMin;
            const boardBottom = H - pad;
            const availH = boardBottom - colTop;
            if (availH < 120) return;

            // board, sum and digits start and end on the same lines - flush top and bottom
            const rowGap = 10;
            const cardH = Math.max(40, (availH - (n - 1) * rowGap) / n);
            const boardH = availH;
            const boardTop = colTop;

            if (linkEl) {
                // on the seam between the sum and the number beside it
                linkEl.style.left = (numX - gap / 2 - linkEl.offsetWidth / 2) + 'px';
                linkEl.style.top = (midTop + hH / 2 - linkEl.offsetHeight / 2) + 'px';
            }

            // the sum stands beside the board, one term per place
            solEl.style.left = termX + 'px';
            solEl.style.width = termW + 'px';
            solEl.style.top = boardTop + 'px';
            solEl.style.height = boardH + 'px';
            const rowCenter = (col) => col * (cardH + rowGap) + cardH / 2;
            solEl.querySelectorAll('.bab-term').forEach(el => {
                const col = Number(el.dataset.col);
                el.style.top = rowCenter(col) + 'px';
                el.style.left = '0';
                el.style.right = 'auto';
                el.style.color = colorMode ? placeColor(n - 1 - col) : '';
            });
            solEl.querySelectorAll('.bab-plus').forEach(el => {
                const g = Number(el.dataset.gap);
                el.style.top = ((rowCenter(g) + rowCenter(g + 1)) / 2) + 'px';
                el.style.left = '0';
                el.style.right = 'auto';
            });

            // the terms take as much type as the box allows: measure the widest one at the
            // stylesheet's size, then scale everything to fit - always from the same base, so
            // the result does not creep from one draw to the next
            solEl.style.fontSize = '';
            let widest = 0;
            solEl.querySelectorAll('.bab-term').forEach(el => {
                widest = Math.max(widest, el.scrollWidth);
            });
            if (widest > 0) {
                const base = parseFloat(getComputedStyle(solEl).fontSize) || 18;
                const inner = termW - 32;
                solEl.style.fontSize = clamp(14, base * inner / widest, 40) + 'px';
            }

            // the places, highest on top
            for (let row = 0; row < n; row++) {
                const place = n - 1 - row;
                const y = boardTop + row * (cardH + rowGap);
                const flash = flashColor(place);
                const hot = hoverPlace === place;
                const blocked = drag && drag.digit >= sys().limits[place];

                ctx.lineWidth = (flash || hot || colorMode) ? 2 : 1;
                roundRect(boardX, y, boardW, cardH, 14,
                    blocked ? 'rgba(255, 255, 255, 0.04)'
                        : (hot ? 'rgba(245, 194, 66, 0.10)' : (flash ? 'rgba(121, 158, 49, 0.10)' : COL.fill)),
                    blocked ? COL.mute
                        : (hot ? COL.glyph : (flash || (colorMode ? placeColor(place) : COL.line))));

                drawPower(place, boardX + boardW / 2, y + 6);
                paintDigit(blank ? null : digits[place], boardX + boardW / 2, y + cardH / 2 + 4,
                    boardW, cardH - 14, place, blocked ? COL.mute : null);

                cards.push({ place, x: boardX, y, w: boardW, h: cardH });
            }

            // the sixty digits: three columns beside the board, 0-19, 20-39 and 40-59, over
            // the whole height
            const cols = 3, rows = DIGITS / cols;
            const cellW = panelW / cols;
            const cellH = availH / rows;                 // flush with the board, top and bottom
            const panelTop = colTop;
            const panelCol = flow === 'down' ? COL.mute : null;

            for (let k = 0; k < DIGITS; k++) {
                const cx0 = panelX + Math.floor(k / rows) * cellW;
                const cy0 = panelTop + (k % rows) * cellH;
                paletteCell(k, cx0, cy0, cellW, cellH, panelCol);
            }

            if (drag) {
                ctx.save();
                ctx.globalAlpha = 0.9;
                paintDigit(drag.digit, drag.x, drag.y, Math.min(boardW, 150), Math.min(cardH, 130), null);
                ctx.restore();
            }

            window.__layout = { modus: 'hochkant', W, H, n, boardW, termW, panelW, cardH, boardH, boardTop };
        }

        // ------------------------------------------------------------- interaction ---
        function inRect(p, r) {
            return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
        }

        function pos(e) {
            const r = canvas.getBoundingClientRect();
            return { x: e.clientX - r.left, y: e.clientY - r.top };
        }

        // What a message used to say on the stage - the board says it now by flashing,
        // so this only goes into the debug window.
        function say(text) {
            if (text) dbg(text);
        }

        function flashPlace(place, color) {
            flashes.push({ place, color: color || COL.ok, until: performance.now() + 900 });
            setTimeout(draw, 950);
        }

        // Adding beyond the last digit of a place carries into the place above — that is the
        // whole point of a place value system, so it gets said out loud.
        function addOne(place) {
            handBelow();
            blank = false;
            const lim = sys().limits;
            let k = place;
            digits[k]++;
            while (digits[k] >= lim[k]) {
                if (k + 1 >= digits.length) {
                    digits[k] = lim[k] - 1;
                    say(T('full', 'Das Brett ist voll — höher geht es hier nicht.'), COL.warn);
                    break;
                }
                digits[k] = 0;
                digits[k + 1]++;
                flashPlace(k + 1);
                say(lim[k] + ' × ' + de(sys().values[k]) + ' = ' + de(sys().values[k + 1])
                    + ' — ' + T('carry', 'das wandert eine Stelle nach oben.'));
                k++;
            }
            changed();
        }

        function removeGlyph(g) {
            handBelow();
            digits[g.place] = Math.max(0, digits[g.place] - (g.type === 'bar' ? 5 : 1));
            changed();
        }

        // A whole digit dropped on a place - every place takes 0..59, the check only guards
        // against a digit the place cannot hold.
        function applyDigit(place, d) {
            const lim = sys().limits[place];
            if (d >= lim) {
                flashPlace(place, COL.warn);
                say(T('too_big', 'Diese Stelle fasst nur bis ') + (lim - 1) + '.', COL.warn);
                draw();
                return false;
            }
            handBelow();
            blank = false;
            digits[place] = d;
            flashPlace(place, COL.ok);
            say('');
            changed();
            return true;
        }

        // A digit is dragged out of the panel onto a place - that is the one thing the mouse
        // does on the board. The places themselves take nothing: no dot on a tap, no glyph
        // taken away, and while a number is being typed the board is out of play altogether.
        canvas.addEventListener('pointerdown', (e) => {
            if (editing) return;
            const p = pos(e);
            const pal = palette.find(h => inRect(p, h));
            if (!pal) return;
            drag = { digit: pal.digit, x: p.x, y: p.y, moved: false };
            try { canvas.setPointerCapture(e.pointerId); } catch (err) { }
            draw();
        });

        canvas.addEventListener('pointermove', (e) => {
            if (editing || !drag) return;
            const p = pos(e);
            if (Math.abs(p.x - drag.x) > 4 || Math.abs(p.y - drag.y) > 4) drag.moved = true;
            drag.x = p.x;
            drag.y = p.y;
            const card = cards.find(h => inRect(p, h));
            hoverPlace = card ? card.place : null;
            draw();
        });

        function endDrag(e) {
            if (!drag) return;
            const p = pos(e);
            const card = cards.find(h => inRect(p, h));
            const d = drag.digit;
            drag = null;
            hoverPlace = null;
            if (card) {
                applyDigit(card.place, d);
                dbg('dropped ' + d + ' on place ' + card.place);
            }
            draw();
        }

        canvas.addEventListener('pointerup', endDrag);
        canvas.addEventListener('pointercancel', () => { drag = null; hoverPlace = null; draw(); });

        // The right button belongs to the lab, not to the browser: it opens the place values
        // instead of "Save Image As".
        container.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            openSystem();
        });

        // ------------------------------------------------------------------ readout ---
        // The sum stands column by column: every term over its place, every plus over
        // the gap between two places. draw() puts them where the cards are.
        function renderFormula() {
            const host = document.getElementById('bab-formula');
            if (!host) return;
            const n = places();
            let html = '';
            for (let i = 0; i < n; i++) {
                html += '<span class="bab-term" data-col="' + i + '"></span>';
                if (i < n - 1) html += '<span class="bab-plus" data-gap="' + i + '">+</span>';
            }
            host.innerHTML = html;
            host.querySelectorAll('.bab-term').forEach(el => {
                const place = n - 1 - Number(el.dataset.col);
                el.textContent = digits[place] + ' \u00b7 ' + de(sys().values[place]);
            });
            if (upright) { host.style.height = ''; return; }
            let h = 0;
            host.querySelectorAll('span').forEach(el => { h = Math.max(h, el.offsetHeight); });
            host.style.height = (h || 22) + 'px';
        }

        // A rolled number does not arrive in one piece: the ones come first, then the tens,
        // then the hundreds - each digit rides in from the right, a thousands dot with the
        // digit on its left.
        function updateHead(animate) {
            const num = document.getElementById('bab-num');
            const head = document.getElementById('bab-head');
            if (!num || !head) return;
            if (editing) return;              // what is being typed stays where it is
            head.classList.toggle('solved', !!(task && task.done));

            // a task shows its goal, otherwise the number says what lies on the board
            const text = de(flow === 'task' && task ? task.target : value());
            if (!animate && num.dataset.text === text && num.children.length) return;

            num.dataset.text = text;
            num.innerHTML = '';
            const cells = [...text].map(ch => {
                const el = document.createElement('span');
                el.className = 'num-ch cyber-bignum-gold';
                el.textContent = ch;
                if (animate) el.style.display = 'none';   // no placeholder: what is there stays centred
                num.appendChild(el);
                return el;
            });
            if (!animate) return;
            // the last digit lands as the die comes to rest: four digits keep the old
            // 0.5 s / 1.0 s / 1.5 s / 2.0 s, a longer number simply counts in faster
            const nDigits = text.replace(/\D/g, '').length || 1;
            const DIGIT_STEP = Math.max(140, Math.round(ROLL_IN_MS / nDigits));
            let wait = DIGIT_STEP;
            for (let i = cells.length - 1; i >= 0; i--) {
                const el = cells[i];
                setTimeout(() => {
                    el.style.display = 'inline-block';
                    el.classList.add('rolled-in');
                }, wait);
                if (/[0-9]/.test(el.textContent)) wait += DIGIT_STEP;   // a separator comes along
            }
        }

        // ------------------------------------------------------------------ typing ---
        // The big number can be typed over. Every keystroke rebuilds it as the same gold
        // characters - the gradient has to sit on each one, a gradient over the whole line
        // leaves ghosts behind - and the caret goes back to the end, where typing runs.
        function renderTyped() {
            const num = document.getElementById('bab-num');
            const raw = num.textContent.replace(/\D/g, '').slice(0, 9);
            const text = raw === '' ? '' : de(parseInt(raw, 10));
            num.innerHTML = '';
            for (const ch of text) {
                const el = document.createElement('span');
                el.className = 'num-ch cyber-bignum-gold';
                el.textContent = ch;
                num.appendChild(el);
            }
            const sel = window.getSelection();
            const r = document.createRange();
            r.selectNodeContents(num);
            r.collapse(false);
            sel.removeAllRanges();
            sel.addRange(r);

            // typing works on the number above, so the board follows at once
            task = null;
            layout(raw === '' ? 0 : parseInt(raw, 10));
            changed();
        }

        // One step on the number above - the two triangles on the right and the arrow keys.
        // Outside of typing it works just the same: the number is what is being worked on, so
        // the arrow turns down and the board follows.
        const MAX_TYPED = 999999999;
        function stepTyped(delta) {
            if (!editing) {
                const shown = (flow === 'task' && task) ? task.target : value();
                const n = Math.min(MAX_TYPED, Math.max(0, shown + delta));
                task = null;
                setFlow('down', true);
                layout(n);
                changed();
                return;
            }
            const num = document.getElementById('bab-num');
            const raw = num.textContent.replace(/\D/g, '');
            const n = Math.min(MAX_TYPED, Math.max(0, (raw === '' ? 0 : parseInt(raw, 10)) + delta));
            num.textContent = String(n);
            num.classList.add('no-caret');      // stepped, not typed - the caret stays away
            renderTyped();
            num.focus();
        }

        function startEdit() {
            const num = document.getElementById('bab-num');
            if (!num || editing) return;
            editing = true;
            before = { digits: digits.slice(), task, blank, flow };   // Escape puts this back
            task = null;                  // typing replaces whatever was set
            setFlow('down', true);        // the number is being worked on: it leads now
            document.getElementById('bab-head').classList.add('editing');
            updateDice();
            num.classList.remove('no-caret');
            try { num.contentEditable = 'plaintext-only'; } catch (e) { }
            if (num.contentEditable !== 'plaintext-only') num.contentEditable = 'true';
            num.focus();
            // no selection band over the number - the caret simply stands at its end
            const sel = window.getSelection();
            const r = document.createRange();
            r.selectNodeContents(num);
            r.collapse(false);
            sel.removeAllRanges();
            sel.addRange(r);
            say(T('edit_hint', 'Tipp eine Zahl ein — Enter übernimmt sie.'), COL.glyph);
        }

        // Enter takes the number: it lies down on the board at once, because typing turned
        // the arrow down. Escape puts back what was there before.
        function endEdit(commit) {
            const num = document.getElementById('bab-num');
            if (!num || !editing) return;
            const raw = num.textContent.replace(/\D/g, '');
            editing = false;
            document.getElementById('bab-head').classList.remove('editing');
            updateDice();
            num.contentEditable = 'false';
            num.dataset.text = '';           // whatever stands there now, draw it fresh
            try { window.getSelection().removeAllRanges(); } catch (e) { }
            const n = parseInt(raw, 10);
            if (!commit || isNaN(n)) {
                if (before) {
                    digits = before.digits;
                    task = before.task;
                    blank = before.blank;
                    setFlow(before.flow, true);
                }
                say('');
                changed();
                return;
            }
            task = null;                 // the board has been following all along
            layout(n);
            say('');
            changed();
        }

        function changed() {
            updateHead();
            renderFormula();
            // laid by hand and it matches: the task is done, and both sides now agree
            if (task && !task.done && !task.shown && !blank && value() === task.target) {
                task.done = true;
                setFlow('down', true);
                say(T('task_correct', 'Richtig! ') + de(task.target) + T('task_lies', ' liegt auf dem Brett.'));
                for (let i = 0; i < places(); i++) flashPlace(i);
                updateHead();
            }
            draw();
        }

        // Turn the arrow. keep = something else is doing the laying already, so lay nothing
        // here. Turning it down on a task is what shows the answer.
        function setFlow(next, keep) {
            flow = next;
            const el = document.getElementById('bab-link');
            if (el) {
                el.classList.toggle('down', flow !== 'up');
                el.classList.toggle('pending', flow === 'task');
                el.title = flow === 'task'
                    ? T('flow_task', 'Aufgabe — klicken legt die Zahl hin')
                    : (flow === 'down'
                        ? T('flow_down', 'Oben bestimmt unten — klicken dreht die Richtung um')
                        : T('flow_up', 'Unten bestimmt oben — klicken dreht die Richtung um'));
            }
            updateDice();
            if (flow === 'down' && !keep) {
                if (task) {
                    task.shown = true;      // shown is shown, this one no longer turns green
                    layout(task.target);
                    say(T('flow_show', 'Die Zahl liegt jetzt in Keilschrift auf dem Brett.'), COL.glyph);
                } else {
                    layout(value());        // zero has its sign too: an empty board fills up
                }
            }
            changed();
        }

        // One click on the arrow. Grey and pointing down, it lays the number - that is the
        // answer. Orange and pointing down, it takes the answer away again: the number stays
        // up there, the board is cleared, and that is a task to lay by hand. Pointing up, the
        // number lays itself. So the arrow shows and hides the cuneiform of what stands above.
        function turnFlow() {
            if (flow === 'down') {
                task = { target: value(), done: false };   // the number stays, as the goal
                digits = [0, 0, 0, 0, 0];
                blank = true;
                setFlow('task', true);
                say(T('flow_hide', 'Weg damit - leg die Zahl selbst.'), COL.glyph);
                return;
            }
            setFlow('down');
        }

        // whoever acts, leads: anything laid below turns the arrow up, and from then on the
        // number says what lies there. A rolled task stays alive in the background - lay it
        // right and it still turns green, you just have to keep the number in your head.
        function handBelow() {
            if (flow !== 'up') setFlow('up', true);
        }

        // The die names the number above, so it is awake wherever that number counts: while a
        // task stands and while the arrow points down. Pointing up the board leads and the die
        // has nothing to say - grey, though a tap still rolls. Typing takes it out altogether.
        function updateDice() {
            const el = document.getElementById('bab-dice');
            if (!el) return;
            el.classList.toggle('dimmed', flow === 'up' || editing);
            el.classList.toggle('locked', editing);
        }

        // A roll always fills the top place and fits the places there are: one place 1..59,
        // two 60..3599, three 3600..215999, and so on.
        const rollNumber = () => {
            const lo = placeCount === 1 ? 1 : sys().values[placeCount - 1];
            const hi = maxValue(placeCount);
            return lo + Math.floor(Math.random() * (hi - lo + 1));
        };
        const ROLL_IN_MS = 2000;     // the number is in when the die stops rolling

        // A roll sets a task: the number counts itself in above while the die is still
        // tumbling, the board stays empty, and the arrow points down but grey. Laying it is
        // yours from here - or one click on the grey arrow and it lays itself.
        function newTask(target) {
            const n = target || rollNumber();
            task = { target: n, done: false };
            digits = [0, 0, 0, 0, 0];
            blank = true;
            setFlow('task', true);
            say(T('task_hint', 'Lege die Zahl - zieh die Ziffern aus dem Panel auf die Stellen.'), COL.glyph);
            changed();
            updateHead(true);                      // ones first, one digit every half second
        }

        // --------------------------------------------------------------- side panel ---
        // Everything that used to stand in the side panel is gone - the number itself is
        // the field, the die makes the tasks. Only the place value system is left, and it
        // lives in the popup behind the gear.
        function buildUI() {
            CyberUI.createRadioGroup('bab-system', null, [
                { value: 'platzhalter', label: T('sys_zero', 'mit Platzhalter für die leere Stelle (spät, ab ca. 300 v. Chr.)') },
                { value: 'ohneNull', label: T('sys_nozero', 'ohne Null: die leere Stelle bleibt leer (altbabylonisch)') }
            ], sysKey, (v) => {
                sysKey = v;
                store.set('system', v);
                document.getElementById('bab-system-note').textContent = noteFor(v);
                changed();
            });
            document.getElementById('bab-system-note').textContent = noteFor(sysKey);

            CyberUI.createRadioGroup('bab-arrange', null, [
                { value: 'flat', label: T('arr_flat', 'waagerecht: die Stellen nebeneinander, wie auf der Tontafel') },
                { value: 'upright', label: T('arr_upright', 'hochkant: als Spalte, die höchste Stelle oben') }
            ], upright ? 'upright' : 'flat', (v) => {
                upright = v === 'upright';
                store.set('upright', upright ? '1' : '0');
                renderFormula();          // the terms are placed differently in each mode
                init();
            });
            document.getElementById('bab-dlg-close').onclick = closeSystem;
            document.getElementById('bab-dlg').addEventListener('pointerdown', (e) => {
                if (e.target.id === 'bab-dlg') closeSystem();     // a click beside the card closes it
            });

            const numEl = document.getElementById('bab-num');
            numEl.addEventListener('pointerdown', (e) => {
                if (!editing) { e.preventDefault(); startEdit(); }
            });
            numEl.addEventListener('input', () => {
                numEl.classList.remove('no-caret');   // a key was pressed, the caret is back
                renderTyped();
            });
            numEl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); endEdit(true); }
                else if (e.key === 'Escape') { e.preventDefault(); endEdit(false); }
                else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                    e.preventDefault();
                    stepTyped((e.key === 'ArrowUp' ? 1 : -1) * (e.shiftKey ? 10 : 1));
                }
            });
            numEl.addEventListener('blur', () => endEdit(true));

            document.querySelectorAll('#bab-places button').forEach((b) => {
                b.addEventListener('pointerdown', (e) => e.preventDefault());
                b.addEventListener('click', () => setPlaces(placeCount + (b.classList.contains('spin-up') ? 1 : -1)));
            });

            document.querySelectorAll('#bab-head > .bab-spin:not(.left) button').forEach((b) => {
                // the number has to keep the caret, so the triangle never takes the focus
                b.addEventListener('pointerdown', (e) => e.preventDefault());
                b.addEventListener('click', () => stepTyped(b.classList.contains('spin-up') ? 1 : -1));
            });

            const linkBtn = document.getElementById('bab-link');
            linkBtn.onclick = turnFlow;
            setFlow(flow, true);
        }

        function openSystem() {
            if (editing) endEdit(true);
            document.getElementById('bab-dlg').hidden = false;
        }

        function closeSystem() {
            document.getElementById('bab-dlg').hidden = true;
        }

        function noteFor(key) {
            return key === 'platzhalter'
                ? T('note_zero', 'Jede Stelle ist das Sechzigfache der rechten. Zwei schräge Keile halten eine leere Stelle fest — eine echte Null war das noch nicht, am Ende einer Zahl stand sie nie.')
                : T('note_nozero', 'So schrieben die Babylonier fast zweitausend Jahre lang: eine leere Stelle war eine Lücke. 1 und 60 sahen genau gleich aus — was gemeint war, sagte der Zusammenhang.');
        }

        // ---------------------------------------------------------------------- run ---
        function resizeCanvasToContainer() {
            const dpr = window.devicePixelRatio || 1;
            const rect = container.getBoundingClientRect();
            const w = Math.max(1, rect.width);
            const h = Math.max(1, rect.height);
            canvas.width = Math.floor(w * dpr);
            canvas.height = Math.floor(h * dpr);
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
        }

        function init() {
            resizeCanvasToContainer();
            draw();
        }

        window.addEventListener('keydown', (e) => {
            const t = e.target;
            if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
            if (e.key === 'Escape' && !document.getElementById('bab-dlg').hidden) {
                closeSystem();
                return;
            }
            if (e.key === 'c' || e.key === 'C') {
                colorMode = !colorMode;
                store.set('colour', colorMode ? '1' : '0');
                dbg('colour mode ' + (colorMode ? 'on' : 'off'));
                draw();
            }
        });

        window.addEventListener('resize', init);

        // The left chrome settles a moment after load and the coach box grows with the sum -
        // measure the stage again whenever that happens instead of trusting a timeout.
        // The branding in the top right corner counts too: the stack stands below it, and it
        // grows by about three pixels when Orbitron swaps in. Without watching it, that late
        // growth sits in nobody's measurement until the first click redraws - and then the
        // whole stage jumps down. It is injected after this script, so wait for it.
        if (window.ResizeObserver) {
            new ResizeObserver(() => init()).observe(container);
        }

        // The stack stands below the branding in the top right corner, and that branding keeps
        // moving for a while after load: branding.js throws it away and builds it again, its
        // font swaps in, and the left chrome scales it. A ResizeObserver does not catch all of
        // that - a transform changes where the thing sits without changing the box it reports.
        // So watch the measurement that actually matters until it stops moving. Without this
        // the last draw of the load keeps a branding that has since grown, and the whole stage
        // jumps down at the first redraw - the first click.
        function brandingBottom() {
            const brand = document.querySelector('.canvas-branding');
            if (!brand) return -1;
            const r = brand.getBoundingClientRect();
            return r.width ? Math.round(r.bottom * 100) / 100 : -1;
        }

        let lastBranding = brandingBottom();
        let brandingSteady = 0;
        (function settleBranding() {
            const now = brandingBottom();
            if (now !== lastBranding) { lastBranding = now; brandingSteady = 0; init(); }
            else brandingSteady++;
            if (brandingSteady < 15) setTimeout(settleBranding, 100);   // 1.5 s quiet = it stands
        })();

        window.addEventListener('cyber-left-chrome-zoom', () => init());
        window.addEventListener('load', () => init());

        buildUI();
        // an empty board and the arrow pointing up: lay something and the number counts it,
        // or roll and the die names one
        blank = true;
        say(T('start', 'Zieh Ziffern aus dem Panel auf die Stellen - oder würfle eine Aufgabe.'), COL.glyph);
        init();
        changed();
        document.fonts.ready.then(() => { init(); changed(); });
        dbg('lab ready');
    </script>
    <script type="module">
        // The die of the Würfelspiel, not a copy of it: js/dice3d.js, the same module
        // wuerfelspiel.html and wuerfel3d.html use. A tap rolls it and the roll sets a
        // new task; dragging turns it (the shared SGI trackball).
        import { DieView, refreshAllFaces } from './js/dice3d.js';

        // Six faces, ten digits: at every roll the faces are given the next digits of the
        // 0..9 round, while the die tumbles and nobody can read them. So the die shows any
        // digit from 0 to 9, although it only ever carries six at a time.
        const faces = [0, 1, 2, 3, 4, 5];
        let nextDigit = 6;
        // pastel faces, the light style of the Würfelspiel deck
        const tints = ['#FBEBBF', '#E6ECF8', '#DDE8C6', '#F3D2CE', '#CFEAF6', '#F1E3F6'];
        const ROLL_MS = 2000;      // the number counts itself in while the die is still rolling
        const st = { idx: 0, fin: 0, t0: 0 };

        function roll() {
            const target = typeof rollNumber === 'function' ? rollNumber() : 1000;
            const lead = Number(String(target)[0]);       // the die lands on the leading digit
            st.fin = Math.floor(Math.random() * 6);
            st.t0 = performance.now();
            for (let i = 0; i < faces.length; i++) {
                if (i === st.fin) { faces[i] = lead; continue; }
                while (nextDigit % 10 === lead) nextDigit++;   // no second copy of it on the die
                faces[i] = nextDigit % 10;
                nextDigit++;
            }
            refreshAllFaces();
            if (typeof newTask === 'function') newTask(target);
        }

        function source() {
            const now = performance.now();
            const rolling = st.t0 > 0 && now - st.t0 < ROLL_MS;
            if (!rolling && st.t0 > 0) { st.idx = st.fin; st.t0 = 0; }
            return {
                faces, tints,
                idx: rolling ? st.fin : st.idx,
                fin: st.fin,
                rolling,
                p: rolling ? (now - st.t0) / ROLL_MS : 1,
                anim: st.t0
            };
        }

        try {
            const view = new DieView(document.getElementById('die-stage'), { style: 'light', fill: true, source, onTap: roll });
            // the box is as high as the number's box, so a tighter lens is what makes the die big
            view.camera.fov = 24;
            view.camera.updateProjectionMatrix();
        } catch (err) {
            if (window.DebugWindow) DebugWindow.log('[babylon] kein WebGL: ' + err.message);
        }
        document.fonts.load('300px KaTeX_Main').then(refreshAllFaces).catch(() => { });
    </script>
</body>
