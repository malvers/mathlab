        <h2 class="board-dlg-h2">OHNE NULL?</h2>
        <div class="board-note board-story">
            <p>Die Babylonier hatten keine Null. Eine leere Stelle war einfach eine Lücke — oft
                nicht einmal das. Ein einzelner Keil konnte 1, 60, 3.600 oder sogar ein Sechzigstel
                bedeuten.</p>
            <p>Welche Zahl gemeint war, verriet der Zusammenhang: ein Preis, eine Fläche, eine Zeile
                in einer Tabelle. Man konnte also jede Zahl schreiben, aber nicht eindeutig lesen.</p>
            <p>Beim Rechnen störte das kaum: Mit Tabellen für Produkte und Kehrwerte rechnete man nur
                mit den Ziffern und dachte sich die Größenordnung dazu — wie später beim
                Rechenschieber.</p>
            <p>Erst spät, ab etwa 300 v. Chr., hielten zwei schräge Keile eine leere Stelle in der
                Mitte fest. Am Ende einer Zahl standen sie nie, und rechnen konnte man mit ihnen nicht.
                Die Null als eigene Zahl kam erst viel später, aus Indien.</p>
        </div>
    </template>

    <script>
        // Only what is Babylonian lives here - the board itself is js/stellenwert-brett.js. The
        // functions below draw with its helpers (ctx, COL, roundRect, placeColor, glyphs, palette),
        // which exist by the time anything is drawn.

        // A Babylonian number is written from left to right, the highest place first, and every
        // place is worth sixty times the one to its right. Inside a place the digit is built
        // from two signs only: the upright wedge counts one, the corner wedge counts ten.
        // For most of their history there was no zero at all - an empty place was a gap, and
        // often not even that. Only late (Seleucid, from about 300 BC) two slanted wedges hold
        // an empty place in the middle of a number. Both ways are here; the values are the same.
        const BOARD = {
            key: 'babylon',
            subtitle: 'BABYLONISCHE ZAHLEN',
            digits: 60,                   // 0..59 in every place
            defaultPlaces: 3,
            typedDigits: 9,
            rollFitsDecimals: false,      // one place 1..59, two 60..3599, three 3600..215999, ...
            systems: {
                platzhalter: {
                    values: [1, 60, 3600, 216000, 12960000],
                    limits: [60, 60, 60, 60, 60],
                    label: 'mit Platzhalter für die leere Stelle (spät, ab ca. 300 v. Chr.)',
                    note: 'Jede Stelle ist das Sechzigfache der rechten. Zwei schräge Keile halten eine leere Stelle in der Mitte fest — eine echte Null war das noch nicht: Am Ende einer Zahl standen sie nie, und die 0 allein ließ sich gar nicht schreiben.'
                },
                ohneNull: {
                    values: [1, 60, 3600, 216000, 12960000],
                    limits: [60, 60, 60, 60, 60],
                    label: 'ohne Null: die leere Stelle bleibt leer (altbabylonisch)',
                    note: 'So schrieben die Babylonier fast zweitausend Jahre lang: eine leere Stelle war eine Lücke. 1 und 60 sahen genau gleich aus — was gemeint war, sagte der Zusammenhang.'
                }
            },
            defaultSystem: 'platzhalter',
            arrange: {
                flat: 'waagerecht: die Stellen nebeneinander, wie auf der Tontafel',
                upright: 'hochkant: als Spalte, die höchste Stelle oben'
            },
            panelCaption: 'Die sechzig Ziffern — Zeile: Zehner, Spalte: Einer',
            // ten across and six down - every row one more ten, every column one more one
            panelFlat: () => ({ cols: 10, cellRatio: 0.8, share: 0.55 }),
            // upright: three columns of digits, 0-19, 20-39 and 40-59
            upright: { panel: [180, 0.2, 300], board: [120, 0.17, 230], num: [204, 0.26, 360], cols: 3, byColumn: true },
            fitTerms: false,
            // the place value as a power, drawn small at the top of its card: 60^0, 60^1, ...
            power: (place) => ({ pre: '', base: '60', exp: place }),
            paintDigit,
            // the wedges take the whole card - their size depends on the box, not on the label
            digitBox: (x, y, w, h, upright) => upright ? [x + w / 2, y + h / 2 + 4, w, h - 14] : [x + w / 2, y + h / 2, w, h],
            shownDigit,
            paletteCell
        };

        // What a place on the board shows. The late placeholder only ever stood inside a
        // number, between the highest and the lowest place that hold something: in front of a
        // number nobody writes an empty place, at its end the scribes never did, and 0 itself
        // could not be written at all. There the place stays empty.
        function shownDigit(place) {
            if (blank) return null;
            const d = digits[place];
            if (d !== 0) return d;
            let lo = -1, hi = -1;
            for (let i = 0; i < digits.length; i++) {
                if (digits[i] > 0) { if (lo < 0) lo = i; hi = i; }
            }
            return place > lo && place < hi ? 0 : null;
        }

        // The upright wedge, the "one": a triangular head pressed in with the corner of the
        // stylus, and the thin tail the edge leaves behind. x is its middle, y the top of the
        // head, u the width of the head.
        function wedgePath(x, y, u) {
            ctx.beginPath();
            ctx.moveTo(x - u / 2, y);
            ctx.lineTo(x + u / 2, y);
            ctx.lineTo(x + u * 0.11, y + u * 0.5);
            ctx.lineTo(x + u * 0.035, y + u * 1.5);
            ctx.lineTo(x - u * 0.035, y + u * 1.5);
            ctx.lineTo(x - u * 0.11, y + u * 0.5);
            ctx.closePath();
        }

        // The corner wedge, the "ten": the stylus pressed in sideways - an open angle with its
        // tip to the left. cx, cy is its middle.
        function cornerPath(cx, cy, u) {
            const w = u * 0.95, h = u * 1.2;
            ctx.beginPath();
            ctx.moveTo(cx + w / 2, cy - h / 2);
            ctx.lineTo(cx - w / 2, cy);
            ctx.lineTo(cx + w / 2, cy + h / 2);
            ctx.lineTo(cx + w * 0.02, cy);
            ctx.closePath();
        }

        // The late placeholder: two small wedges leaning over, parallel, side by side.
        function drawZero(cx, cy, u, col) {
            ctx.save();
            ctx.fillStyle = col || COL.zero;
            const w = u * 0.8;
            for (const k of [-1, 1]) {
                ctx.save();
                ctx.translate(cx + k * u * 0.45, cy + k * u * 0.15);
                ctx.rotate(-0.75);
                wedgePath(0, -w * 0.75, w);            // turned about its own middle
                ctx.fill();
                ctx.restore();
            }
            ctx.restore();
        }

        // How the wedges of one digit stand: the rows the scribes used, top row first.
        const ONES_ROWS = [[], [1], [2], [3], [2, 2], [3, 2], [3, 3], [4, 3], [4, 4], [3, 3, 3]];
        const TENS_ROWS = [[], [1], [2], [3], [2, 2], [3, 2]];

        // One digit 0..59: the corner wedges (tens) on the left, the upright wedges (ones) on
        // the right. The wedge size depends only on the box, never on the digit - so a 1 and a
        // 59 in the same row of places are drawn with the same stylus.
        // place === null draws a loose digit (panel, drag ghost) and registers no targets.
        function paintDigit(d, cx, cy, bw, bh, place, colOverride) {
            if (d === null) return;               // an empty place shows nothing at all
            const col = colOverride || placeColor(place);
            // the widest digit (tens 3 across, ones 4 across) and the tallest (3 rows) fit
            const u = Math.min(bw * 0.85 / 7.7, bh * 0.85 / 4.6, 30);
            if (d === 0) {
                // without a zero the place stays empty - that was the whole trouble
                if (sysKey === 'platzhalter') drawZero(cx, cy, u * 1.2, colOverride || (colorMode ? col : COL.zero));
                return;
            }
            const tens = TENS_ROWS[Math.floor(d / 10)], ones = ONES_ROWS[d % 10];
            const colsOf = (rows) => rows.length ? Math.max(...rows) : 0;
            const tStep = u * 0.95, oStep = u * 1.05;
            const tW = tens.length ? (colsOf(tens) - 1) * tStep + u * 0.95 : 0;
            const oW = ones.length ? (colsOf(ones) - 1) * oStep + u : 0;
            const gap = tens.length && ones.length ? u * 0.55 : 0;
            let x0 = cx - (tW + gap + oW) / 2;
            ctx.fillStyle = col;

            if (tens.length) {
                const rowStep = u * 1.3;
                const h = u * 1.2 + (tens.length - 1) * rowStep;
                tens.forEach((cnt, r) => {
                    const yc = cy - h / 2 + u * 0.6 + r * rowStep;
                    const rowW = (cnt - 1) * tStep + u * 0.95;
                    const sx = x0 + (tW - rowW) / 2 + u * 0.475;
                    for (let k = 0; k < cnt; k++) {
                        cornerPath(sx + k * tStep, yc, u);
                        ctx.fill();
                    }
                });
                if (place !== null) glyphs.push({ place, type: 'ten', x: x0, y: cy - h / 2, w: tW, h });
                x0 += tW + gap;
            }
            if (ones.length) {
                const rowStep = u * 1.55;
                const h = u * 1.5 + (ones.length - 1) * rowStep;
                ones.forEach((cnt, r) => {
                    const yt = cy - h / 2 + r * rowStep;
                    const rowW = (cnt - 1) * oStep + u;
                    const sx = x0 + (oW - rowW) / 2 + u / 2;
                    for (let k = 0; k < cnt; k++) {
                        wedgePath(sx + k * oStep, yt, u);
                        ctx.fill();
                    }
                });
                if (place !== null) glyphs.push({ place, type: 'one', x: x0, y: cy - h / 2, w: oW, h });
            }
        }

        // One cell of the digit panel: its number small in the top left corner, the digit in
        // cuneiform filling the rest. Sixty cells are small, so the label keeps out of the way.
        // The first cell is no digit: there was no 0. It is the empty place - the eraser for a
        // place, drawn as the placeholder where the system has one.
        function paletteCell(k, cx0, cy0, cellW, cellH, panelCol) {
            const on = picked === k || (drag && drag.digit === k);
            roundRect(cx0 + 2, cy0 + 2, cellW - 4, cellH - 4, 8,
                on ? 'rgba(245, 194, 66, 0.12)' : 'rgba(255, 255, 255, 0.02)',
                on ? COL.glyph : 'rgba(255, 255, 255, 0.07)');
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.font = "600 9px 'Orbitron', sans-serif";
            ctx.fillStyle = on ? COL.glyph : 'rgba(255, 255, 255, 0.4)';
            ctx.fillText(k === 0 ? T('empty_cell', 'leer') : String(k), cx0 + 6, cy0 + 5);
            paintDigit(k, cx0 + cellW / 2 + 3, cy0 + cellH * 0.56, cellW - 14, cellH * 0.72, null, panelCol);
            palette.push({ digit: k, x: cx0, y: cy0, w: cellW, h: cellH });
        }
    </script>
    <script src="js/stellenwert-brett.js"></script>
