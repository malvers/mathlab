<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOC ALVERS MATHE-LABORE | Batman</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="resources/favicon.png">
    <link rel="stylesheet" href="js/cyber-layout.css">
    <link rel="stylesheet" href="js/buttons-ultra.css">
    <link rel="stylesheet" href="js/cyber-lab-overrides.css">
    <link rel="stylesheet" href="js/branding.styles.extracted.css">
    <link rel="stylesheet" href="js/lab-shell-minimal.css">
    <!-- KaTeX for rendering the six factor equations as real math -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js"></script>
    <style>
        /* Central palette (CLAUDE.md): φ green = active, Υ red = out-of-domain */
        :root{
            --bat-green:  rgb(121,158, 49);
            --bat-green-d:rgb( 86,118, 30);
            --bat-red:    rgb(176, 36, 24);
            --bat-red-d:  rgb(120, 22, 14);
            --bat-orange: rgb(245,194, 66);
            /* LOCAL override (not central): widen the sidebar enough for the long Batman
               factors to fit on a single line. cyber-lab-overrides.css hard-caps the whole
               left chrome at --cyber-left-cap (390px by default) — we must lift that cap
               too, otherwise the sidebar variable is ignored. Final values are set by JS
               from the widest rendered formula (T6); these are sensible boot-time guesses. */
            --cyber-sidebar-w: 620px;
            --cyber-left-cap:  720px;   /* rail 66 + sidebar + small buffer */
        }
        #term-list{display:flex;flex-direction:column;gap:8px;padding:8px 10px 14px}
        /* Hide the whole left chrome until the JS first-fit has settled --cyber-sidebar-w. */
        body:not(.sb-fit-done) #cyber-left-chrome{visibility:hidden}
        /* Kill the cyber-left-chrome auto-scale entirely on this lab — we want the chrome at
           NATURAL size, never zoomed. Without these overrides the chrome would rescale every
           time --cyber-sidebar-w (or the viewport) changes, causing visible jumps after reload. */
        body.cyber-shell-grid{
            grid-template-columns: min(var(--cyber-left-natural-w), var(--cyber-left-cap)) minmax(0, 1fr) !important;
        }
        body.cyber-shell-grid > #cyber-left-chrome{
            width: min(var(--cyber-left-natural-w), var(--cyber-left-cap)) !important;
        }
        body.cyber-shell-grid #cyber-left-chrome-inner{
            transform: none !important;
            height: 100vh !important;
        }
        /* Background = full palette colors (CLAUDE.md): orange = out-of-domain, green = active.
           Text: dark gray for legibility on both warm backgrounds. */
        .term{position:relative;border:1px solid var(--bat-orange);border-radius:10px;padding:10px 12px;background:var(--bat-orange);transition:background .15s,border-color .15s;font-size:25px;line-height:1.45;overflow:hidden;color:#1f1f1f;height:126px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-around}
        .term.active{border-color:var(--bat-green);background:var(--bat-green)}
        /* white-space:nowrap is essential: it stops KaTeX inline tokens from line-breaking
           inside the box. Without it the .katex span wraps and scrollWidth would report the
           WRAPPED width — which is what we want to AVOID. With nowrap, the natural single-
           line width is exposed and the sidebar auto-fit can size correctly. */
        .term .eq{color:#1f1f1f;white-space:nowrap}
        /* KaTeX colors its tokens itself — force the dark-gray text color through */
        .term .eq .katex,.term .eq-y .katex,.term .eq .katex *,.term .eq-y .katex *{color:#1f1f1f !important}
        /* Solved-for-y line: full opacity, full black in both active and inactive states. */
        .term .eq-y{color:#1f1f1f;white-space:nowrap}
        /* LHS: always show "y" (.y-lhs); .nan-lhs is now unused. Inactive: tint the "y" red. */
        .term .eq-y .nan-lhs{display:none}
        .term:not(.active) .eq-y .y-lhs,
        .term:not(.active) .eq-y .y-lhs *{color:var(--bat-red) !important}
        /* .val line is redundant — eq-y already shows "y = ... = <value>" when active and
           "NaN = ..." when inactive. Hide it in both states. */
        .term .val{display:none}
        /* Inactive only: NaN-marked sqrts go red. Active (green) keeps everything dark. */
        .term:not(.active) .eq .nan-sqrt,
        .term:not(.active) .eq .nan-sqrt *,
        .term:not(.active) .eq-y .nan-sqrt,
        .term:not(.active) .eq-y .nan-sqrt *{color:var(--bat-red) !important}
        /* nan-suffix marks a "·NaN" inserted into texY where the indicator sqrt was
           simplified away (T3/T4/T5/T6), and the "(NaN)" appended to "nicht definiert".
           Hidden when active (only meaningful in inactive context), red when inactive. */
        .term.active .eq-y .nan-suffix{display:none}
        .term:not(.active) .eq-y .nan-suffix,
        .term:not(.active) .eq-y .nan-suffix *,
        .term:not(.active) .val .nan-suffix,
        .term:not(.active) .val .nan-suffix *{color:var(--bat-red) !important}
        /* Inactive RHS tail "= NaN" — mirrors the active "= <value>". Always red. */
        .term:not(.active) .eq-y .nan-rhs,
        .term:not(.active) .eq-y .nan-rhs *{color:var(--bat-red) !important}
        /* SB toggle strip — two checkboxes that flip the color schemes globally via body class. */
        #sb-toggles{display:flex;gap:14px;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.08);font-family:'Outfit',sans-serif;font-size:13px;color:rgba(255,255,255,.75)}
        #sb-toggles .tg{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
        #sb-toggles input[type=checkbox]{accent-color:var(--bat-orange);cursor:pointer}
        /* tone-flat: orange/green colours OFF → everything goes neutral gray (180,180,180). */
        body.tone-flat .term,
        body.tone-flat .term.active{background:rgb(220,220,220) !important;border-color:rgb(220,220,220) !important}
        body.tone-flat .full-factor,
        body.tone-flat .full-factor.active{background:rgb(220,220,220) !important}
        /* nan-mono: NaN red highlighting OFF → red NaN bits revert to default dark / cyan. */
        body.nan-mono .term:not(.active) .eq .nan-sqrt,
        body.nan-mono .term:not(.active) .eq .nan-sqrt *,
        body.nan-mono .term:not(.active) .eq-y .nan-sqrt,
        body.nan-mono .term:not(.active) .eq-y .nan-sqrt *,
        body.nan-mono .term:not(.active) .eq-y .nan-suffix,
        body.nan-mono .term:not(.active) .eq-y .nan-suffix *,
        body.nan-mono .term:not(.active) .eq-y .y-lhs,
        body.nan-mono .term:not(.active) .eq-y .y-lhs *,
        body.nan-mono .term:not(.active) .eq-y .nan-rhs,
        body.nan-mono .term:not(.active) .eq-y .nan-rhs *{color:#1f1f1f !important}
        /* Default colour for the inactive-brace NaN label — red. Toggled to cyan via body.nan-mono. */
        .full-brace .nan-label,
        .full-brace .nan-label *{color:var(--bat-red) !important}
        body.nan-mono .full-brace .nan-label,
        body.nan-mono .full-brace .nan-label *{color:#fff !important}
        /* Same red-off rule for the top-strip lozenge NaN-sqrts (inactive). */
        body.nan-mono .full-factor:not(.active) .nan-sqrt,
        body.nan-mono .full-factor:not(.active) .nan-sqrt *{color:#1f1f1f !important}
        /* hide-eq-y: 2nd-line "y = …" toggle OFF → drop the solved-for-y row entirely. */
        body.hide-eq-y .term .eq-y{display:none}
        /* hide-braces: drop the underbrace + y-value labels in the top equation strip,
           and also reclaim the wrap's brace-reservation padding so the strip tightens up. */
        body.hide-braces .full-brace{display:none}
        body.hide-braces .full-factor-wrap{padding-bottom:0}
        /* eq-white: "Equation" toggle OFF → the top-strip equation lozenges go background-less
           and the text turns white. Affects ONLY the top strip (#full-eq), NOT the SB term boxes. */
        body.eq-white .full-factor,
        body.eq-white .full-factor.active{background:transparent !important}
        body.eq-white .full-factor .katex,
        body.eq-white .full-factor .katex *{color:#fff !important}
        /* Slider strip at the top of the sidebar — all text rendered as KaTeX, so we keep
           only color/size on the host element and let KaTeX inherit them. */
        #x-strip{padding:14px 12px 6px;border-bottom:1px solid rgba(255,255,255,.08)}
        #x-strip .row{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
        #x-strip label{color:var(--bat-orange);font-size:15px}
        #x-strip label .katex,#x-strip label .katex *{color:var(--bat-orange) !important}
        #x-strip .xval{color:#fff;font-size:18px;margin-left:auto}
        #x-strip .xval .katex,#x-strip .xval .katex *{color:#fff !important}
        #x-strip input[type=range]{width:100%;accent-color:var(--bat-orange)}
        #x-strip .bounds{display:flex;justify-content:space-between;font-size:15px;color:rgba(255,255,255,.55)}
        #x-strip .bounds .katex,#x-strip .bounds .katex *{color:rgba(255,255,255,.55) !important}
        /* Tighten KaTeX inside narrow boxes */
        .term .katex{font-size:1em}
        /* Full-equation strip above the figure: sits 10% down. Render at a readable
           size, then JS scales (transform) it down to fit the available width — so
           the whole equation stays in ONE line no matter how narrow the window. */
        /* Hide the central cyber background grid (user prefers a plain backdrop here). */
        #canvas-container .cyber-grid{display:none}
        /* pointer-events:none so the equation strip never intercepts the canvas drag —
           mouse goes through to the canvas, the cursor stays ew-resize everywhere.
           overflow:visible so the lozenges + braces below them are NEVER clipped, even when
           the transform scales the row up. Batman is shifted dynamically so it sits below this strip. */
        #full-eq{position:absolute;top:7%;left:12px;right:12px;z-index:5;padding:8px 12px;background:transparent;overflow:visible;color:#fff;font-size:14px;text-align:left;pointer-events:none}
        /* Author credit — appended into .canvas-branding (top-right masthead),
           sits below the BATMAN/EQUATION title in the same right-aligned column. */
        .canvas-credit{font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.18em;color:var(--bat-orange);opacity:.85;text-transform:uppercase;text-align:right;margin-top:4px;line-height:1.1;white-space:nowrap}
        #canvas-container{cursor:ew-resize}
        /* Wrap = column: lozenge on top, underbrace + y-value below (only when active).
           inline-flex on the outer container keeps everything in one line; align-items:flex-start
           so wraps sit at the top and the brace hangs freely below the lozenges. */
        #full-eq-tex{display:inline-flex;align-items:flex-start;transform-origin:top left;white-space:nowrap;line-height:1.2}
        #full-eq .katex{font-size:1em;white-space:nowrap}
        /* Wrap reserves vertical space (padding-bottom) for the brace so the lozenge layout
           stays untouched even when the brace appears/disappears. Width is set purely by the
           lozenge — the brace is positioned absolutely, so it has ZERO influence on width.
           This kills the feedback loop where an active brace would stretch the lozenge wider. */
        .full-factor-wrap{position:relative;display:inline-flex;flex-direction:column;align-items:stretch;margin:0 2px;padding-bottom:34px}
        .full-factor{display:inline-flex;align-items:center;padding:3px 8px;border-radius:7px;background:var(--bat-orange);transition:background .15s}
        .full-factor.active{background:var(--bat-green)}
        .full-factor .katex,.full-factor .katex *{color:#1f1f1f !important}
        /* Same inactive-only rule for top-strip lozenges. */
        .full-factor:not(.active) .nan-sqrt,
        .full-factor:not(.active) .nan-sqrt *{color:var(--bat-red) !important}
        /* Brace area: absolutely positioned right under the lozenge (--lozenge-h set by JS),
           spanning its width via left/right. KaTeX renders \underbrace{\kern Wpt}_{label};
           with kern = lozenge width, the BRACE SYMBOL itself matches the lozenge exactly.
           The surrounding .katex container is a few px wider (KaTeX margins), so we flex-
           centre it — the small overflow goes equally left and right, the brace stays aligned. */
        .full-brace{position:absolute;left:0;right:0;top:calc(var(--lozenge-h, 100%) + 4px);color:#fff;overflow:visible;display:flex;flex-direction:column;align-items:center;pointer-events:none}
        /* Default brace tint — NO !important, so per-label \textcolor (red top / blue bot) wins. */
        .full-brace .katex,.full-brace .katex *{color:#fff}
        /* Seps and "= 0" align to the top of #full-eq-tex (same as the wraps) and get an
           explicit height matching the lozenges (set in JS), so their content's flex-centering
           lines them up with the lozenges' vertical centre instead of the wrap's centre. */
        .full-sep,.full-eq-equals{display:inline-flex;align-items:center;margin:0 4px;align-self:flex-start}
        .full-eq-equals{color:#fff}
        .full-eq-equals .katex,.full-eq-equals .katex *{color:#fff !important}
        /* Multiplication dot between factors: bigger and cyan (matches the BM fill colour). */
        .full-sep{color:rgb(0,210,255);font-size:2.4em}
        .full-sep .katex,.full-sep .katex *{color:rgb(0,210,255) !important}
    </style>
</head>

<body>
    <nav id="mini-rail">
        <div class="nav-btn" onclick="toggleSidebar()" title="Toggle Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </div>
    </nav>

    <aside id="side-panel">
        <header id="sidebar-header"></header>
        <div id="ui-container">
            <div id="x-strip">
                <div class="row">
                    <label id="x-label"></label>
                    <span class="xval" id="x-readout"></span>
                </div>
                <input type="range" id="x-slider" min="-7" max="7" step="0.01" value="0">
                <div class="bounds"><span id="x-bound-lo"></span><span id="x-bound-hi"></span></div>
            </div>
            <div id="sb-toggles">
                <label class="tg"><input type="checkbox" id="tg-color" checked> <span>orange/grün</span></label>
                <label class="tg"><input type="checkbox" id="tg-nan" checked> <span>NaN rot</span></label>
                <label class="tg"><input type="checkbox" id="tg-eqy" checked> <span>y = …</span></label>
                <label class="tg"><input type="checkbox" id="tg-braces" checked> <span>Klammern</span></label>
                <label class="tg"><input type="checkbox" id="tg-dash" checked> <span>dashed bar</span></label>
                <label class="tg"><input type="checkbox" id="tg-eq" checked> <span>Equation</span></label>
            </div>
            <div id="term-list"></div>
        </div>
    </aside>

    <main id="main-content">
        <div id="canvas-container">
            <div class="cyber-grid"></div>
            <!-- The whole Batman equation = product of all six factors = 0, in one (wide) line. -->
            <div id="full-eq">
                <div id="full-eq-tex"></div>
            </div>
            <canvas id="canvas"></canvas>
        </div>
    </main>

    <script src="js/cyber-left-chrome.js"></script>
    <script src="js/branding/briefings.js"></script>
    <script src="js/branding/overlays.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/i18n-de.js"></script>
    <script src="js/i18n-en.js"></script>
    <script src="js/i18n-es.js"></script>
    <script src="js/i18n-fr.js"></script>
    <script src="js/i18n-it.js"></script>
    <script src="js/i18n-pt.js"></script>
    <script src="js/i18n-sw.js"></script>
    <script src="js/i18n-tr.js"></script>
    <script src="js/i18n-nl.js"></script>
    <script src="js/branding/nav.js"></script>
    <script src="js/branding.js"></script>
    <script src="js/ui.js"></script>
    <script>
        function toggleSidebar() {
            const panel = document.getElementById('side-panel');
            panel.classList.toggle('collapsed');
            if (window.CyberLeftChrome && typeof CyberLeftChrome.publishResolvedScale === 'function') {
                CyberLeftChrome.publishResolvedScale();
            }
            setTimeout(() => {
                window.dispatchEvent(new Event('resize'));
                if (typeof init === 'function') init();
                if (window.CyberLeftChrome && typeof CyberLeftChrome.publishResolvedScale === 'function') {
                    CyberLeftChrome.publishResolvedScale();
                }
            }, 400);
        }

        CyberBranding.init({
            useExternalStyles: true,
            title: 'Batman',
            subtitle: 'J. Matthew Register Equation',
        });
        CyberUI.init();

        if (window.CyberLeftChrome && typeof CyberLeftChrome.configure === 'function') {
            // proportionalChrome:true glues the chrome at a fixed viewport fraction. Default 0.33
            // is too wide on phones (chrome eats the canvas) and too narrow on desktops (SB has
            // to scale down). Override per viewport so chrome ≈ 30% on phones, 40% tablet, 50%
            // desktop. Re-publish on resize so rotation / window resize honors the new fraction.
            CyberLeftChrome.configure({ viewportOnlyZoom: true });
            function applyChromeFractionForViewport() {
                const vw = window.innerWidth;
                const frac = vw < 600 ? 0.30 : (vw < 900 ? 0.40 : 0.50);
                if (window.CyberLeftChrome && CyberLeftChrome.configure) {
                    CyberLeftChrome.configure({ leftViewportFractionExpanded: frac });
                }
                if (window.CyberLeftChrome && CyberLeftChrome.publishResolvedScale) {
                    CyberLeftChrome.publishResolvedScale();
                }
            }
            applyChromeFractionForViewport();
            window.addEventListener('resize', applyChromeFractionForViewport);
        }

        // ===================================================================
        // The six factors of the Batman equation (J. Matthew Register form).
        // Each factor has a sqrt-trick whose argument is only ≥ 0 inside a
        // narrow x-window — that window IS the domain where the factor draws
        // a piece of the bat. Outside the window: "flies out" (rot).
        // ===================================================================
        const SQRT33 = Math.sqrt(33);
        const SQRT10 = Math.sqrt(10);

        // T1 — wings (ellipse). Domain in x: 3 < |x| ≤ 7. The original y-sqrt
        // also requires y > -3√33/7 ≈ -2.46, so the LOWER branch is only valid
        // for |x| > 4 (the wing-tip flare). In 3<|x|<4 only the upper branch lives.
        const Y_LOW_BOUND = -3 * SQRT33 / 7;     // ≈ -2.4595
        function term1(x) {
            const ax = Math.abs(x);
            if (!(ax > 3 && ax <= 7)) return { active:false };
            const r = 1 - (x/7)*(x/7);
            if (r < 0) return { active:false };
            const yUp = 3*Math.sqrt(r);
            const yLow = -yUp;
            const lowOk = yLow > Y_LOW_BOUND;     // y-domain filter from the original sqrt
            return { active:true, y: yUp, yLow: lowOk ? yLow : null, note:'±' };
        }
        // T2 — head outline. Domain: |x| ≤ 4 (inner sqrt non-negative).
        function term2(x) {
            const ax = Math.abs(x);
            if (ax > 4) return { active:false };
            const inner = 1 - Math.pow(Math.abs(ax - 2) - 1, 2);
            if (inner < 0) return { active:false };
            const y = Math.abs(x/2) - ((3*SQRT33 - 7)/112)*x*x - 3 + Math.sqrt(inner);
            return { active:true, y };
        }
        // T3 — inner ears. Domain: 0.75 < |x| < 1.
        function term3(x) {
            const ax = Math.abs(x);
            if (!(ax > 0.75 && ax < 1)) return { active:false };
            return { active:true, y: 9 - 8*ax };
        }
        // T4 — jaw lobes (small bumps below the ears). Domain: 0.5 < |x| < 0.75.
        function term4(x) {
            const ax = Math.abs(x);
            if (!(ax > 0.5 && ax < 0.75)) return { active:false };
            return { active:true, y: 3*ax + 0.75 };
        }
        // T5 — center cheek (flat top of the chin). Domain: |x| < 0.5.
        function term5(x) {
            if (!(Math.abs(x) < 0.5)) return { active:false };
            return { active:true, y: 2.25 };
        }
        // T6 — wing lower curve. Domain: 1 < |x| ≤ 3.
        function term6(x) {
            const ax = Math.abs(x);
            if (!(ax > 1 && ax <= 3)) return { active:false };
            const inner = 4 - (ax - 1)*(ax - 1);
            if (inner < 0) return { active:false };
            const y = (6*SQRT10)/7 + (1.5 - 0.5*ax) - (6*SQRT10)/14 * Math.sqrt(inner);
            return { active:true, y };
        }

        // LaTeX strings + meta for each term — order = visible bottom-up of the bat.
        // `texY` is the same factor solved for y (what we actually plot inside the domain).
        // \htmlClass{nan-sqrt}{...} marks ONLY the symbolic sign-indicator sqrts (the trick
        // sqrt((x-a)(x-b)/((a-x)(b-x))). Regular sqrts that happen to be real for most x
        // (\sqrt{10}, \sqrt{33}, half-circle sqrts) are NOT NaN-producers and stay plain.
        const TERMS = [
            { id:1, fn:term1, name:'Wings (upper ellipse)',
              tex: '\\left(\\tfrac{x}{7}\\right)^2\\htmlClass{nan-sqrt}{\\sqrt{\\tfrac{||x|-3|}{|x|-3}}} + \\left(\\tfrac{y}{3}\\right)^2\\htmlClass{nan-sqrt}{\\sqrt{\\tfrac{y+\\tfrac{3\\sqrt{33}}{7}}{|y|+\\tfrac{3\\sqrt{33}}{7}}}} - 1 = 0',
              texY: '\\htmlClass{y-lhs}{y}\\htmlClass{nan-lhs}{\\mathrm{NaN}}\\kern{1pt}=\\kern{1pt}\\pm 3\\sqrt{1 - \\left(\\tfrac{x}{7}\\right)^2}\\htmlClass{nan-suffix}{\\cdot \\mathrm{NaN} \\cdot \\mathrm{NaN}}' },
            { id:2, fn:term2, name:'Head outline',
              tex: '\\left|\\tfrac{x}{2}\\right| - \\tfrac{3\\sqrt{33}-7}{112}x^2 - 3 + \\htmlClass{nan-sqrt}{\\sqrt{1-(||x|-2|-1)^2}} - y = 0',
              texY: '\\htmlClass{y-lhs}{y}\\htmlClass{nan-lhs}{\\mathrm{NaN}}\\kern{1pt}=\\kern{1pt}\\left|\\tfrac{x}{2}\\right| - \\tfrac{3\\sqrt{33}-7}{112}x^2 - 3 + \\htmlClass{nan-sqrt}{\\sqrt{1-(||x|-2|-1)^2}}' },
            { id:3, fn:term3, name:'Inner ears',
              tex: '9\\htmlClass{nan-sqrt}{\\sqrt{\\tfrac{(|x|-1)(|x|-0.75)}{(1-|x|)(|x|-0.75)}}} - 8|x| - y = 0',
              texY: '\\htmlClass{y-lhs}{y}\\htmlClass{nan-lhs}{\\mathrm{NaN}}\\kern{1pt}=\\kern{1pt}9\\htmlClass{nan-suffix}{\\cdot \\mathrm{NaN}} - 8|x|' },
            { id:4, fn:term4, name:'Jaw lobes',
              tex: '3|x| + 0.75\\htmlClass{nan-sqrt}{\\sqrt{\\tfrac{(|x|-0.75)(|x|-0.5)}{(0.75-|x|)(|x|-0.5)}}} - y = 0',
              texY: '\\htmlClass{y-lhs}{y}\\htmlClass{nan-lhs}{\\mathrm{NaN}}\\kern{1pt}=\\kern{1pt}3|x| + 0.75\\htmlClass{nan-suffix}{\\cdot \\mathrm{NaN}}' },
            { id:5, fn:term5, name:'Center chin',
              tex: '2.25\\htmlClass{nan-sqrt}{\\sqrt{\\tfrac{(x-0.5)(x+0.5)}{(0.5-x)(0.5+x)}}} - y = 0',
              texY: '\\htmlClass{y-lhs}{y}\\htmlClass{nan-lhs}{\\mathrm{NaN}}\\kern{1pt}=\\kern{1pt}2.25\\htmlClass{nan-suffix}{\\cdot \\mathrm{NaN}}' },
            { id:6, fn:term6, name:'Wings (lower curve)',
              tex: '\\tfrac{6\\sqrt{10}}{7} + (1.5-0.5|x|)\\htmlClass{nan-sqrt}{\\sqrt{\\tfrac{||x|-1|}{|x|-1}}} - \\tfrac{6\\sqrt{10}}{14}\\sqrt{4-(|x|-1)^2} - y = 0',
              texY: '\\htmlClass{y-lhs}{y}\\htmlClass{nan-lhs}{\\mathrm{NaN}}\\kern{1pt}=\\kern{1pt}\\tfrac{6\\sqrt{10}}{7} + (1.5 - 0.5|x|)\\htmlClass{nan-suffix}{\\cdot \\mathrm{NaN}} - \\tfrac{6\\sqrt{10}}{14}\\sqrt{4-(|x|-1)^2}' },
        ];

        // Whole equation = product of all six factors = 0. Build each factor as a separate
        // inline lozenge so we can colour it (orange = out-of-domain, green = active) per x —
        // mirrors the sidebar live as you slide.
        function renderFullEquation() {
            const target = document.getElementById('full-eq-tex');
            if (!target || !window.katex) return;
            target.innerHTML = '';
            TERMS.forEach((t, i) => {
                if (i > 0) {
                    const sep = document.createElement('span');
                    sep.className = 'full-sep';
                    target.appendChild(sep);
                    try { katex.render('\\cdot', sep, { throwOnError:false, displayMode:false }); }
                    catch (_) { sep.textContent = ' · '; }
                }
                // Each factor lives in a vertical wrap: coloured lozenge on top, underbrace below.
                const wrap = document.createElement('span');
                wrap.className = 'full-factor-wrap';
                target.appendChild(wrap);
                const box = document.createElement('span');
                box.className = 'full-factor';
                box.id = 'ff-' + t.id;
                wrap.appendChild(box);
                const factorTex = '\\big(' + t.tex.replace(/\s*=\s*0\s*$/, '') + '\\big)';
                try { katex.render(factorTex, box, { throwOnError:false, displayMode:false, trust:(c)=>c.command==='\\htmlClass', strict:'ignore' }); }
                catch (_) { box.textContent = factorTex; }
                const brace = document.createElement('span');
                brace.className = 'full-brace';
                brace.id = 'brace-' + t.id;
                wrap.appendChild(brace);
            });
            const eq = document.createElement('span');
            eq.className = 'full-eq-equals';
            target.appendChild(eq);
            try { katex.render('= 0', eq, { throwOnError:false, displayMode:false }); }
            catch (_) { eq.textContent = ' = 0'; }

            // Refit + equalise heights once now, again on fonts.ready, again after short timeouts.
            const reflow = () => { equalizeFactorHeights(); fitFullEquation(); };
            reflow();
            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(() => requestAnimationFrame(reflow));
            }
            setTimeout(reflow, 250);
            setTimeout(reflow, 800);
        }
        // Calibrate KaTeX's typesetting slack around \underbrace (the few extra px it adds
        // either side of the kern). Done once with a probe of known kern width — same context
        // as the real braces, so the measurement is faithful. Cached afterwards.
        let braceSlackPx = 0, _braceCalibrated = false;
        function calibrateBraceSlack() {
            if (_braceCalibrated) return;
            const host = document.getElementById('full-eq-tex');
            if (!host || !window.katex) return;
            const probe = document.createElement('span');
            probe.style.cssText = 'position:absolute;visibility:hidden;left:-9999px;top:0';
            host.appendChild(probe);
            try { katex.render('\\underbrace{\\kern 100pt}_{}', probe, { throwOnError:false, displayMode:false }); }
            catch (_) {}
            const k = probe.querySelector('.katex');
            if (k) braceSlackPx = Math.max(0, k.offsetWidth - 100 * 4/3);   // 100pt = 133.33px
            host.removeChild(probe);
            _braceCalibrated = true;
        }

        // Make every top-strip lozenge as tall as the tallest one — measured pre-transform
        // (offsetHeight is layout, not visual), so the equal sizing survives the scale.
        // Also set the separator (·) and "= 0" heights to match, so they centre at the
        // lozenge's vertical mid (instead of being pulled low by the wrap's brace-padding).
        function equalizeFactorHeights() {
            let max = 0;
            for (const t of TERMS) {
                const ff = document.getElementById('ff-' + t.id);
                if (!ff) continue;
                ff.style.minHeight = '';
                if (ff.offsetHeight > max) max = ff.offsetHeight;
            }
            for (const t of TERMS) {
                const ff = document.getElementById('ff-' + t.id);
                if (ff) ff.style.minHeight = max + 'px';
            }
            document.querySelectorAll('#full-eq-tex .full-sep, #full-eq-tex .full-eq-equals').forEach(el => {
                el.style.height = max + 'px';
            });

            document.documentElement.style.setProperty('--lozenge-h', max + 'px');
        }
        // Scale the rendered TeX to fit the box width AND center it manually — text-align
        // doesn't center an inline-block that's wider than its container, so we compute the
        // left margin ourselves from (avail - scaledWidth)/2. Re-run on resize.
        function fitFullEquation() {
            const box = document.getElementById('full-eq');
            const tex = document.getElementById('full-eq-tex');
            if (!box || !tex) return;
            tex.style.transform = 'none';
            tex.style.height = '';
            tex.style.marginLeft = '';
            const cs = getComputedStyle(box);
            const avail = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
            const natural = tex.scrollWidth;
            if (natural <= 0 || avail <= 0) return;
            const k = avail / natural;   // grow when there's space, shrink when there isn't
            const scaledW = natural * k;
            tex.style.transform = `scale(${k})`;
            tex.style.marginLeft = ((avail - scaledW) / 2) + 'px';   // center the scaled box
            tex.style.height = (tex.scrollHeight * k) + 'px';        // reclaim layout space the transform leaves
        }

        // Build the sidebar entries once, then update color/value on slider change.
        const listEl = document.getElementById('term-list');
        const slider = document.getElementById('x-slider');
        const xReadout = document.getElementById('x-readout');
        const xLabelEl = document.getElementById('x-label');
        const xLoEl = document.getElementById('x-bound-lo');
        const xHiEl = document.getElementById('x-bound-hi');
        const cells = [];
        // Tiny wrapper so we always fall back to text on a render failure.
        function tex(target, src) {
            if (!target) return;
            if (window.katex) {
                try { katex.render(src, target, { throwOnError:false, displayMode:false, trust:(c)=>c.command==='\\htmlClass', strict:'ignore' }); return; }
                catch (_) {}
            }
            target.textContent = src;
        }
        // Replace every isolated math-variable x in a LaTeX string with the numeric value.
        // The lookarounds skip any "x" that's part of a command (\sqrt, \tfrac...) or an
        // identifier. No parens around negatives — bare value, even for x^2.
        function substituteX(texStr, xval) {
            return texStr.replace(/(?<![\\a-zA-Z])x(?![a-zA-Z])/g, xval.toFixed(2));
        }
        // For the inactive y-line: replace any \htmlClass{nan-sqrt}{...} block with \mathrm{NaN}
        // — if the sqrt is symbolically NaN, just write "NaN" there instead of the sqrt.
        // Hand-written brace-depth scan because the radicand contains nested {...}.
        function nanifyNanSqrts(texStr) {
            const marker = '\\htmlClass{nan-sqrt}{';
            let out = '', i = 0;
            while (i < texStr.length) {
                if (texStr.startsWith(marker, i)) {
                    let depth = 1, j = i + marker.length;
                    while (j < texStr.length && depth > 0) {
                        if (texStr[j] === '{') depth++;
                        else if (texStr[j] === '}') depth--;
                        if (depth > 0) j++;
                    }
                    out += '\\mathrm{NaN}';
                    i = j + 1;
                } else { out += texStr[i++]; }
            }
            return out;
        }
        // Render the static SB bits (slider label + bounds) once — values change in updateList.
        function renderXStripStatic() {
            tex(xLabelEl, 'x');
            tex(xLoEl, '-7');
            tex(xHiEl, '+7');
        }
        // SB toggles — each persists in localStorage so the user's choices survive reload.
        // Helper: read/write a boolean key (default = true = "checked").
        const LS_PREFIX = 'batman.toggle.';
        function readToggle(key) {
            const v = localStorage.getItem(LS_PREFIX + key);
            return v === null ? true : v === '1';
        }
        function writeToggle(key, on) {
            try { localStorage.setItem(LS_PREFIX + key, on ? '1' : '0'); } catch (_) {}
        }
        // bindToggle: hook checkbox id ↔ stored bool. `apply(on)` is called BOTH on init AND on
        // change so the visible state matches storage. `redraw` (optional) runs ONLY on user
        // change, never on init — because init may happen before `draw()` / `layout` are ready
        // (`layout` is a `let` declared further down → TDZ; even `typeof` on it would throw).
        function bindToggle(id, key, apply, redraw) {
            const el = document.getElementById(id);
            if (!el) return;
            const initial = readToggle(key);
            el.checked = initial;
            apply(initial);
            el.addEventListener('change', () => {
                writeToggle(key, el.checked);
                apply(el.checked);
                if (typeof redraw === 'function') redraw();
            });
        }
        // Dashed x-marker on the canvas is drawn in JS, not CSS — flag read by draw().
        let dashedBarOn = true;
        bindToggle('tg-color',  'color',  on => document.body.classList.toggle('tone-flat', !on));
        bindToggle('tg-nan',    'nan',    on => document.body.classList.toggle('nan-mono', !on));
        bindToggle('tg-eqy',    'eqy',    on => document.body.classList.toggle('hide-eq-y', !on));
        bindToggle('tg-braces', 'braces', on => document.body.classList.toggle('hide-braces', !on));
        bindToggle('tg-dash',   'dash',   on => { dashedBarOn = on; }, () => draw());
        bindToggle('tg-eq',     'eq',     on => document.body.classList.toggle('eq-white', !on));
        function buildList() {
            for (const t of TERMS) {
                const div = document.createElement('div');
                div.className = 'term';
                div.innerHTML = `<div class="eq" id="eq-${t.id}"></div><div class="eq-y" id="eqy-${t.id}"></div><span class="val" id="val-${t.id}">—</span>`;
                listEl.appendChild(div);
                const eqEl  = div.querySelector('.eq');
                const eqyEl = div.querySelector('.eq-y');
                if (window.katex) {
                    try { katex.render(t.tex,  eqEl,  { throwOnError:false, displayMode:false, trust:(c)=>c.command==='\\htmlClass', strict:'ignore' }); }
                    catch (_) { eqEl.textContent = t.tex; }
                    try { katex.render(t.texY, eqyEl, { throwOnError:false, displayMode:false, trust:(c)=>c.command==='\\htmlClass', strict:'ignore' }); }
                    catch (_) { eqyEl.textContent = t.texY; }
                } else {
                    eqEl.textContent  = t.tex;
                    eqyEl.textContent = t.texY;
                }
                cells.push({ root:div, val:div.querySelector('.val'), meta:t });
            }
        }

        // Locked-in upper bound for the SB width — captured on the first successful fit
        // (= "post-reload natural width"). Once set, all later resizes can SHRINK the SB but
        // never grow it past this initial value. Kept outside fitSidebarToFormulas so it
        // survives across calls.
        let lockedMaxSidebarW = null;
        // Measure the widest rendered formula (.eq + .eq-y across all 6 terms) and size
        // the sidebar so every box fits in one line. Local override only — no shared CSS touched.
        function fitSidebarToFormulas() {
            // Wait one frame so KaTeX has finished its layout pass before we read widths.
            requestAnimationFrame(() => {
                // CRITICAL: reset cells to base font BEFORE measuring, otherwise the previous
                // fit's downscaled font yields a smaller maxW → smaller target → smaller fit
                // → larger fontScale on the next call → maxW grows back → oscillation. This
                // made boxes literally widen on every resize (incl. height-only resizes).
                const BASE_FS = 25;
                for (const c of cells) c.root.style.fontSize = BASE_FS + 'px';
                let maxW = 0;
                // With .eq/.eq-y forced to white-space:nowrap their natural single-line
                // width is exposed via scrollWidth (reading scrollWidth forces a sync layout
                // so the just-set BASE_FS is honoured before measurement).
                for (const c of cells) {
                    c.root.querySelectorAll('.eq, .eq-y').forEach(el => {
                        maxW = Math.max(maxW, el.scrollWidth);
                    });
                    c.root.querySelectorAll('.eq > .katex, .eq-y > .katex').forEach(k => {
                        maxW = Math.max(maxW, k.getBoundingClientRect().width);
                    });
                }
                // Box chrome: term padding 12+12 = 24. #term-list padding (10+10) + #side-panel
                // padding (10+10) = 40. Total = 64. + 4px safety against sub-pixel rounding.
                const chrome = 64 + 4;
                const target = Math.ceil(maxW + chrome);
                // Responsive cap. The 420px floor was eating the whole screen on phones; we now
                // reserve canvas space proportional to viewport width.
                // Single responsive rule (no per-bracket cliffs that the old 900/600 branches
                // had). Without the chrome's transform-scale (we disabled it via CSS) the SB
                // width is LITERAL — so the cap must be a strict viewport fraction, otherwise
                // shrinking the window leaves the natural-formula-width SB blocking the screen.
                //   sbCap = vw * SB_FRAC  (clamped to a sane min so formulas stay measurable)
                //   sidebarW = min(naturalTarget, sbCap)
                // The shape this produces:
                //   small vw  → cap dominates → SB shrinks with viewport
                //   large vw  → target dominates → SB locks at formula natural width
                const vw = window.innerWidth;
                const railW = 66;
                const SB_FRAC = 0.40;      // ~40% of viewport for the SB column
                const SB_BUMP = 1.10;      // user-requested +10% global widening
                const cap = Math.max(120, Math.floor(vw * SB_FRAC));
                const vpBound = Math.max(60, vw - railW - 40);
                let sidebarW = Math.min(vpBound, Math.floor(Math.min(target, cap) * SB_BUMP));
                // First fit ever → that's the user's post-reload width, lock it as upper bound.
                if (lockedMaxSidebarW === null) lockedMaxSidebarW = sidebarW;
                // Subsequent fits may only SHRINK from the locked max (never grow past it).
                sidebarW = Math.min(sidebarW, lockedMaxSidebarW);
                const root = document.documentElement.style;
                root.setProperty('--cyber-sidebar-w', sidebarW + 'px');
                // The shared left-chrome hard cap (`--cyber-left-cap` in cyber-lab-overrides.css)
                // would clip our wider sidebar. Lift it locally to rail + sidebar + small buffer.
                root.setProperty('--cyber-left-cap', (railW + sidebarW + 20) + 'px');
                // If we hit the viewport cap, the formulas no longer fit at their natural width
                // → shrink the term font-size so KaTeX scales down and the formulas stay visible.
                // Phones get an even smaller floor so the formulas still fit horizontally.
                const baseFs = 25;
                const minFs  = vw < 600 ? 6 : 8;
                const availForFormulas = sidebarW - chrome;
                const fitScale = Math.min(1, availForFormulas / Math.max(1, maxW));
                const fs = Math.max(minFs, baseFs * fitScale);
                for (const c of cells) c.root.style.fontSize = fs + 'px';
                // The cyber-left-chrome MutationObserver only watches #side-panel.class changes,
                // not :root style mutations — so the --cyber-left-scale transform stays STALE
                // when we update --cyber-sidebar-w. Force a republish so the visual chrome width
                // recomputes from the new natural width. Without this, my SB cap is invisible.
                if (window.CyberLeftChrome && typeof CyberLeftChrome.publishResolvedScale === 'function') {
                    CyberLeftChrome.publishResolvedScale();
                }

                // so the user never sees the inline-guess → real-fit transition.
                document.body.classList.add('sb-fit-done');
                // Canvas needs to re-measure after the sidebar width changed.
                requestAnimationFrame(() => { init(); fitFullEquation(); equalizeBoxHeights(); });
            });
        }
        // After layout settles, make every term-box the same height as the tallest.
        function equalizeBoxHeights() {
            let max = 0;
            for (const c of cells) { c.root.style.minHeight = ''; max = Math.max(max, c.root.offsetHeight); }
            for (const c of cells) c.root.style.minHeight = max + 'px';
        }

        function updateList(x) {
            tex(xReadout, x.toFixed(2));
            // Collect every active y across all terms so we know which brace is at the
            // topmost (→ red) and bottommost (→ blue) of the current x slice. Matches the
            // canvas dot logic so brace colour and dot colour stay in sync.
            const allYs = [];
            for (const c of cells) {
                const r = c.meta.fn(x);
                if (!r.active) continue;
                allYs.push(r.y);
                if (c.meta.id === 1 && r.yLow !== null) allYs.push(r.yLow);
            }
            const yTopAll = allYs.length ? Math.max(...allYs) : null;
            const yBotAll = allYs.length ? Math.min(...allYs) : null;
            const RED    = '#b02418';   // palette Υ — top endpoint when there IS a vertical pair
            const BLUE   = '#50a0ff';   // bottom endpoint — brighter than pure blue for dark bg
            const PURPLE = '#aa64dc';   // top endpoint (swapped from palette green per user request)
            const GREEN  = PURPLE;      // alias so existing references downstream stay valid
            for (const c of cells) {
                const r = c.meta.fn(x);
                c.root.classList.toggle('active', !!r.active);
                // Re-render BOTH formula lines: active → substitute literal x in the LaTeX
                // (eq) and append "= <computed y>" (eq-y); inactive → keep abstract form,
                // collapse symbolic NaN-sqrts to "NaN" in eq-y and append "= NaN".
                const eqEl  = document.getElementById('eq-'  + c.meta.id);
                const eqyEl = document.getElementById('eqy-' + c.meta.id);
                if (window.katex) {
                    const renderOpts = { throwOnError:false, displayMode:false, trust:(ctx)=>ctx.command==='\\htmlClass', strict:'ignore' };
                    if (eqEl) {
                        const eqSrc = r.active ? substituteX(c.meta.tex, x) : c.meta.tex;
                        try { katex.render(eqSrc, eqEl, renderOpts); } catch (_) {}
                    }
                    if (eqyEl) {
                        let src;
                        if (r.active) {
                            const sign = r.note === '±' ? '\\pm ' : '';
                            const lhs = substituteX(c.meta.texY, x);
                            // Skip the "= <value>" tail if texY has no x (constant RHS like T5
                            // "y = 2.25") — otherwise it'd read "y = 2.25 = 2.25".
                            const hasX = /(?<![\\a-zA-Z])x(?![a-zA-Z])/.test(c.meta.texY);
                            src = hasX ? `${lhs} = ${sign}${r.y.toFixed(3)}` : lhs;
                        } else {
                            // Collapse symbolic NaN-sqrts to "NaN" text, mirror active tail.
                            src = nanifyNanSqrts(c.meta.texY) + ' = \\htmlClass{nan-rhs}{\\mathrm{NaN}}';
                        }
                        try { katex.render(src, eqyEl, renderOpts); } catch (_) {}
                    }
                }
                if (r.active) {
                    const yStr = r.y.toFixed(2);
                    const sign = r.note === '±' ? '\\pm ' : '';
                    tex(c.val, `\\text{bei } x = ${x.toFixed(2)} \\;\\to\\; y = \\mathbf{${sign}${yStr}}`);
                } else {
                    tex(c.val, '\\text{nicht definiert } \\htmlClass{nan-suffix}{(\\mathrm{NaN})}');
                }
                // Mirror the active/inactive colour on the top-strip factor lozenge.
                const ff = document.getElementById('ff-' + c.meta.id);
                if (ff) ff.classList.toggle('active', !!r.active);
                // Underbrace + y-value below the lozenge — only for active terms.
                // Render KaTeX \underbrace with kern = exact lozenge width: the brace SYMBOL
                // ends up the same width as the box. The .katex container's small KaTeX margins
                // overflow equally left & right (flex-centred), so the brace stays aligned.
                const brace = document.getElementById('brace-' + c.meta.id);
                if (brace) {
                    if (ff && window.katex) {
                        const innerK = ff.querySelector('.katex');
                        const innerW = innerK ? innerK.offsetWidth : (ff.offsetWidth - 16);
                        const wPx = Math.max(10, innerW + 16);
                        const kernPt = (wPx * 0.75).toFixed(1);
                        let yLabel;
                        if (r.active) {
                            const yStr = r.y.toFixed(3);
                            // Top endpoint colour = green, bottom = blue, in-between = default cyan.
                            // Matches the canvas dot colours so brace and dot read as a pair.
                            const yUpVal = r.y;
                            const yLowVal = (c.meta.id === 1 && r.yLow !== null) ? r.yLow : null;
                            const toneFor = (v) => (v === yTopAll) ? GREEN
                                             : (v === yBotAll && yTopAll !== yBotAll) ? BLUE
                                             : null;
                            const wrap = (v, core) => {
                                const t = toneFor(v);
                                return t ? `\\textcolor{${t}}{${core}}` : core;
                            };
                            if (r.note === '±' && c.meta.id === 1 && yLowVal !== null) {
                                const top = wrap(yUpVal,  `\\textstyle y \\; = \\; \\hphantom{-}${yStr}`);
                                const bot = wrap(yLowVal, `\\textstyle y \\; = \\; -${yStr}`);
                                yLabel = `\\substack{${top} \\\\ ${bot}}`;
                            } else {
                                const core = (r.note === '±')
                                    ? `\\textstyle y \\; = \\; \\pm ${yStr}`
                                    : `\\textstyle y \\; = \\; ${yStr}`;
                                yLabel = wrap(yUpVal, core);
                            }
                        } else {
                            // Inactive: same brace shape, label = "NaN" wrapped in .nan-label
                            // so the SB "NaN rot" toggle (body.nan-mono) can flip it via CSS.
                            yLabel = `\\htmlClass{nan-label}{\\textstyle \\mathrm{NaN}}`;
                        }
                        // \Large bumps the subscript label up — the kern (and therefore the brace
                        // shape) is in absolute pt, so it stays anchored to the lozenge width.
                        // scaleX clamp below catches any label overflow.
                        const tex = `\\underbrace{\\kern ${kernPt}pt}_{\\Large\\,${yLabel}\\,}`;
                        // trust+strict needed so \htmlClass passes through (for .nan-label).
                        try { katex.render(tex, brace, { throwOnError:false, displayMode:false, trust:(ctx)=>ctx.command==='\\htmlClass', strict:'ignore' }); }
                        catch (_) { brace.textContent = yLabel; }

                        // if the rendered brace exceeds the lozenge width.

                        if (bk) {
                            bk.style.transform = '';
                            bk.style.transformOrigin = 'top center';
                            const bw = bk.offsetWidth;
                            if (bw > wPx && bw > 0) {

                            }

                    }

        }

        // ===================================================================
        // Canvas — plot the bat silhouette, vertical x-marker, dots on active y.
        // ===================================================================
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');

        // World extent: a bit beyond the curve so it doesn't touch edges.
        const WX = 7.6, WY_TOP = 3.4, WY_BOT = -3.4;
        let layout = null;   // pixel mapping computed in resize

        function resizeCanvasToContainer() {
            const dpr = window.devicePixelRatio || 1;
            const rect = container.getBoundingClientRect();
            const w = Math.max(1, rect.width);
            const h = Math.max(1, rect.height);
            canvas.width = Math.floor(w * dpr);
            canvas.height = Math.floor(h * dpr);
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
            // square-ish drawing area centered in the canvas
            const pad = 24;
            const aspect = (2*WX) / (WY_TOP - WY_BOT);
            let dw = w - 2*pad, dh = h - 2*pad;
            if (dw / dh > aspect) dw = dh * aspect; else dh = dw / aspect;
            // Bias the figure down so it starts BELOW the full-equation strip (whose height
            // depends on the rendered formulas + braces). Fallback to 10% if not yet rendered.
            const eqEl = document.getElementById('full-eq');
            const cRect = container.getBoundingClientRect();
            const eqBottom = eqEl ? eqEl.getBoundingClientRect().bottom - cRect.top : h * 0.10;
            const desired = Math.max(eqBottom + 16, h * 0.10);   // 16px breathing room below the strip
            const ox = (w - dw) / 2, oy = Math.max(desired, (h - dh) / 2);
            const sx = dw / (2*WX), sy = dh / (WY_TOP - WY_BOT);
            layout = {
                w, h, ox, oy, dw, dh, sx, sy,
                X: u => ox + (u + WX) * sx,
                Y: v => oy + (WY_TOP - v) * sy,
            };
        }

        function draw() {
            if (!layout) return;
            const { w, h, X, Y } = layout;
            ctx.clearRect(0, 0, w, h);

            // Axes — drawn across the FULL canvas (not just the figure's drawable box).
            ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(0, Y(0)); ctx.lineTo(w, Y(0)); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(X(0), 0); ctx.lineTo(X(0), h); ctx.stroke();
            // Ticks every 0.5, labels at integers; extend across the FULL canvas (not just the figure box).
            const { sx, sy, ox, oy, dw, dh } = layout;
            const xLeft  = (0 - ox) / sx - WX;             // world-x at canvas left edge
            const xRight = (w - ox) / sx - WX;             // world-x at canvas right edge
            const yTopW    = WY_TOP - (0 - oy) / sy;       // world-y at canvas top edge
            const yBotW    = WY_TOP - (h - oy) / sy;       // world-y at canvas bottom edge
            ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.font = '11px Outfit,sans-serif';
            // X-axis ticks
            ctx.textAlign = 'center'; ctx.textBaseline = 'top';
            const xStart = Math.ceil(xLeft * 2) / 2, xEnd = Math.floor(xRight * 2) / 2;
            for (let t = xStart; t <= xEnd + 1e-9; t += 0.5) {
                if (Math.abs(t) < 1e-9) continue;
                const isMajor = Math.abs(t - Math.round(t)) < 1e-9;
                const len = isMajor ? 5 : 3;
                ctx.beginPath(); ctx.moveTo(X(t), Y(0) - len); ctx.lineTo(X(t), Y(0) + len); ctx.stroke();
                if (isMajor) ctx.fillText(t.toString(), X(t), Y(0) + 6);
            }
            // Y-axis ticks
            ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
            const yStart = Math.ceil(yBotW * 2) / 2, yEnd = Math.floor(yTopW * 2) / 2;
            for (let t = yStart; t <= yEnd + 1e-9; t += 0.5) {
                if (Math.abs(t) < 1e-9) continue;
                const isMajor = Math.abs(t - Math.round(t)) < 1e-9;
                const len = isMajor ? 5 : 3;
                ctx.beginPath(); ctx.moveTo(X(0) - len, Y(t)); ctx.lineTo(X(0) + len, Y(t)); ctx.stroke();
                if (isMajor) ctx.fillText(t.toString(), X(0) - 7, Y(t));
            }

            // Sample each branch and close the gaps at domain boundaries by bisecting
            // (where active→inactive flips) so adjacent pieces meet at the same point.
            const N = 1500;
            const cur = parseFloat(slider.value);
            // getY: x → y if active in this branch, else null.
            function bisectEdge(getY, xA, xB) {
                // Exactly one of getY(xA)/getY(xB) is null; tighten until they're ~1e-6 apart.
                let a = xA, b = xB;
                for (let k = 0; k < 30; k++) {
                    const m = (a + b) / 2;
                    if ((getY(m) === null) === (getY(a) === null)) a = m; else b = m;
                }
                return (getY(a) !== null) ? a : b;
            }
            function drawCurve(getY) {
                ctx.beginPath();
                let prevX = null, prevY = null;
                for (let i = 0; i <= N; i++) {
                    const xx = -WX + (2*WX) * (i / N);
                    const yy = getY(xx);
                    if (yy !== null) {
                        if (prevY === null && prevX !== null) {
                            // entering domain → bisect for the exact entry point
                            const xb = bisectEdge(getY, prevX, xx);
                            const yb = getY(xb);
                            if (yb !== null) { ctx.moveTo(X(xb), Y(yb)); ctx.lineTo(X(xx), Y(yy)); }
                            else ctx.moveTo(X(xx), Y(yy));
                        } else if (prevY === null) {
                            ctx.moveTo(X(xx), Y(yy));
                        } else {
                            ctx.lineTo(X(xx), Y(yy));
                        }
                    } else if (prevY !== null) {
                        // leaving domain → bisect for the exact exit point
                        const xb = bisectEdge(getY, xx, prevX);
                        const yb = getY(xb);
                        if (yb !== null) ctx.lineTo(X(xb), Y(yb));
                    }
                    prevX = xx; prevY = yy;
                }
                ctx.stroke();
            }
            // Bat silhouette as ONE closed path → transparent cyan fill + cyan outline.
            // The boundary is traced clockwise: top (left→right) then bottom (right→left).
            // Each piece comes from the term that's active in that sub-range; the curves all
            // meet at the analytically correct join points, so closing the path is continuous.
            const PERSEG = 220;
            ctx.beginPath();
            let started = false;
            function seg(getY, x0, x1) {
                for (let i = 0; i <= PERSEG; i++) {
                    const x = x0 + (x1 - x0) * i / PERSEG;
                    const y = getY(x);
                    if (y === null || isNaN(y)) continue;
                    if (!started) { ctx.moveTo(X(x), Y(y)); started = true; }
                    else ctx.lineTo(X(x), Y(y));
                }
            }
            // TOP boundary, left → right
            seg(x => { const r = term1(x); return r.active ? r.y : null; },     -7,    -3   );
            seg(x => { const r = term6(x); return r.active ? r.y : null; },     -3,    -1   );
            seg(x => { const r = term3(x); return r.active ? r.y : null; },     -1,    -0.75);
            seg(x => { const r = term4(x); return r.active ? r.y : null; },     -0.75, -0.5 );
            seg(x => 2.25,                                                       -0.5,  0.5 );  // T5 flat chin
            seg(x => { const r = term4(x); return r.active ? r.y : null; },      0.5,  0.75);
            seg(x => { const r = term3(x); return r.active ? r.y : null; },      0.75, 1   );
            seg(x => { const r = term6(x); return r.active ? r.y : null; },      1,    3   );
            seg(x => { const r = term1(x); return r.active ? r.y : null; },      3,    7   );
            // BOTTOM boundary, right → left
            seg(x => { const r = term1(x); return (r.active && r.yLow !== null) ? r.yLow : null; }, 7, 4);
            seg(x => { const r = term2(x); return r.active ? r.y : null; },                         4, -4);
            seg(x => { const r = term1(x); return (r.active && r.yLow !== null) ? r.yLow : null; }, -4, -7);
            ctx.closePath();
            ctx.fillStyle = 'rgba(0,210,255,.18)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(0,210,255,.95)';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Collect every currently active y at this x (T1 may contribute two).
            const activeYs = [];
            for (const t of TERMS) {
                const r = t.fn(cur);
                if (!r.active) continue;
                activeYs.push(r.y);
                if (t.id === 1 && r.yLow !== null) activeYs.push(r.yLow);
            }
            // Dashed x-marker — only BETWEEN the outermost active points, not over the full canvas.
            // Toggled off via SB checkbox (dashedBarOn flag).
            if (dashedBarOn && activeYs.length >= 2) {
                const yMin = Math.min(...activeYs), yMax = Math.max(...activeYs);
                ctx.strokeStyle = 'rgba(245,194,66,.9)'; ctx.lineWidth = 1.5;
                ctx.setLineDash([4, 4]);
                ctx.beginPath(); ctx.moveTo(X(cur), Y(yMax)); ctx.lineTo(X(cur), Y(yMin)); ctx.stroke();
                ctx.setLineDash([]);
            }
            // Dots on each currently active y for the slider x. The top and bottom of the
            // dashed marker line get bigger, palette-red / pure-blue end caps; intermediate
            // hits keep the orange dot.
            const yTop = activeYs.length ? Math.max(...activeYs) : null;
            const yBot = activeYs.length ? Math.min(...activeYs) : null;
            for (const t of TERMS) {
                const r = t.fn(cur);
                if (!r.active) continue;
                const ys = (t.id === 1)
                    ? (r.yLow !== null ? [r.y, r.yLow] : [r.y])
                    : [r.y];
                for (const yy of ys) {
                    const isTop = (yy === yTop);
                    const isBot = (yy === yBot && yTop !== yBot);
                    const radius = (isTop || isBot) ? 7.5 : 5;
                    // Top → purple, bottom → blue. Lone active point falls under isTop → purple.
                    const fill   = isTop ? 'rgb(170,100,220)'
                                 : isBot ? 'rgb(80,160,255)'
                                 :         'rgba(245,194,66,1)';
                    ctx.fillStyle = fill;
                    ctx.beginPath(); ctx.arc(X(cur), Y(yy), radius, 0, 2*Math.PI); ctx.fill();
                    ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 1.5; ctx.stroke();
                }
            }
        }

        function init() {
            resizeCanvasToContainer();
            draw();
        }

        slider.addEventListener('input', () => updateList(parseFloat(slider.value)));
        // Resize must also re-run the SB fit (viewport-aware cap) and re-apply the brace clamp.
        window.addEventListener('resize', () => {
            fitSidebarToFormulas();
            init();
            fitFullEquation();
            updateList(parseFloat(slider.value));
        });

        // -------- Mouse/touch drag on the canvas → move the dashed x-marker live --------
        let dragging = false;
        function setXFromClientX(clientX) {
            if (!layout) return;
            const rect = canvas.getBoundingClientRect();
            const px = clientX - rect.left;
            const u  = (px - layout.ox) / layout.sx - WX;
            const x  = Math.max(-7, Math.min(7, u));
            slider.value = x;
            updateList(x);
        }
        canvas.style.cursor = 'ew-resize';
        canvas.addEventListener('mousedown', e => { dragging = true; setXFromClientX(e.clientX); e.preventDefault(); });
        window.addEventListener('mousemove', e => { if (dragging) setXFromClientX(e.clientX); });
        window.addEventListener('mouseup',   ()  => { dragging = false; });
        canvas.addEventListener('touchstart', e => { dragging = true; setXFromClientX(e.touches[0].clientX); e.preventDefault(); }, { passive:false });
        window.addEventListener('touchmove',  e => { if (dragging && e.touches[0]) { setXFromClientX(e.touches[0].clientX); e.preventDefault(); } }, { passive:false });
        window.addEventListener('touchend',   ()  => { dragging = false; });

        // Build the list as soon as KaTeX is ready (it's loaded with `defer`).
        function whenReady(cb) {
            if (window.katex) return cb();
            const t = setInterval(() => { if (window.katex) { clearInterval(t); cb(); } }, 30);
        }
        document.fonts.ready.then(() => {
            init();
            whenReady(() => {
                renderFullEquation();
                renderXStripStatic();
                buildList();
                fitSidebarToFormulas();
                updateList(parseFloat(slider.value));
                // ONE re-fit after fonts.ready (covers KaTeX webfont load), then nothing else.
                // The 300/900ms timeouts were what made the chrome jump on reload — gone.
                const reUpdate = () => updateList(parseFloat(slider.value));
                if (document.fonts && document.fonts.ready) {
                    document.fonts.ready.then(() => requestAnimationFrame(() => {
                        fitSidebarToFormulas();
                        reUpdate();
                    }));
                }
            });
        });
    </script>
</body>

</html>
