<!-- DocBib favicon: three book spines on a shelf, drawn for DocBib - two gold, one dark with a gold rim - gold on navy (forloop palette).
     Tab icon only - same motif and colours as icon.svg, but cut to fill its square: navy plate with the
     rounded corners of the house lambda (resources/favicon.svg), motif at 96 % of the box. The app icon's round
     navy disc vanishes on Doc's navy tab strip and its motif is only half the box, so at 16 px only a dot
     was left (Doc, 19.11.2026: "mach DocBib, Kontakt und DocBooks auch so"). Manifest, maskable and
     apple-touch icons stay as they are. -->
