    <meta name="solita-about" content="Billard-Kette: Eine Reihe Billardkugeln mit Durchmesser d liegt mit gleichen Lücken a hintereinander. Die weiße Kugel startet mit einem winzigen Richtungsfehler alpha_0, trifft die nächste Kugel leicht seitlich, und diese läuft entlang der Verbindungslinie der Mittelpunkte weiter – schiefer als zuvor. Für kleine Winkel gilt x = a sin alpha_0 = d sin alpha_1, also alpha_1 ≈ (a/d) alpha_0 und nach n Stößen alpha_n ≈ alpha_0 (a/d)^n: exponentielle Instabilität (Vortrag Physik am Samstag, TU Dresden). Die Kette reißt ab, wenn der Versatz (a+d) sin alpha_n die Kugelgröße d erreicht, also nach etwa n ≈ ln(d/((a+d) alpha_0)) / ln(a/d) Stößen. Das Lab rechnet jeden Stoß exakt mit Kreisgeometrie, zeigt den Tisch in der Draufsicht (quer einstellbar überhöht), eine Tabelle und ein Diagramm mit logarithmischer Skala, exakt gegen Formel. Ist a/d kleiner als 1 (Lücke kleiner als eine Kugel, z. B. a = 4, d = 5), schrumpft der Fehler bei jedem Stoß; bei a = d bleibt er für kleine Winkel gleich; berühren sich die Kugeln (a = 0, Kugelstoßpendel), ist er nach dem ersten Stoß weg. Ein Knopf zeigt, wie genau man für 10, 20 oder 50 Stöße zielen müsste – bei a/d = 2 und echten Pool-Kugeln für 50 Stöße genauer als ein Proton.">
