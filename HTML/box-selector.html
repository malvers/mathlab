<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Formula Box Selector</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; color: #fff; font-family: monospace; display: flex; gap: 12px; padding: 12px; height: 100vh; overflow: hidden; }
#wrap { position: relative; flex-shrink: 0; overflow-y: auto; }
#img { display: block; height: auto; user-select: none; }
#overlay { position: absolute; top: 0; left: 0; cursor: crosshair; }
#panel { width: 320px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
h2 { color: #adff2f; font-size: 14px; }
.box-entry { background: #222; border: 1px solid #444; border-radius: 4px; padding: 6px 8px; font-size: 11px; display: flex; align-items: center; gap: 6px; }
.box-color { width: 14px; height: 14px; border-radius: 2px; flex-shrink: 0; }
.box-label { flex: 1; color: #adff2f; }
.box-coords { color: #888; font-size: 10px; }
.btn-del { background: #c00; border: none; color: #fff; border-radius: 3px; padding: 2px 6px; cursor: pointer; font-size: 10px; }
#output { background: #000; border: 1px solid #333; border-radius: 4px; padding: 8px; font-size: 10px; color: #0f0; white-space: pre; overflow-x: auto; flex-shrink: 0; }
button.main { background: #adff2f; color: #000; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-family: monospace; font-weight: bold; font-size: 12px; }
#hint { font-size: 11px; color: #888; line-height: 1.5; }
</style>
    <link rel="icon" type="image/svg+xml" href="resources/favicon.svg">
    <link rel="icon" type="image/png" sizes="256x256" href="resources/favicon.png">
</head>
<body>
<div id="wrap">
  <img id="img" src="morpheus/presets/KOMPLEXE_FORMELN.jpg" alt="Komplexe Formeln">
  <canvas id="overlay"></canvas>
</div>
<div id="panel">
  <h2>Formula Box Selector</h2>
  <div id="hint">Klick + zieh = neue Box<br>Rechtsklick auf Box = löschen<br>Reihenfolge = Formel-Index</div>
  <button class="main" onclick="copyJSON()">JSON kopieren</button>
  <div id="box-list"></div>
  <pre id="output">(noch keine Boxen)</pre>
</div>

<script>
const img     = document.getElementById('img');
const overlay = document.getElementById('overlay');
const ctx     = overlay.getContext('2d');

const COLORS = ['#ff3c3c','#3cb4ff','#ffd200','#3cff64','#ff7800','#b450ff',
                 '#00dcc8','#ff50a0','#a0ff3c','#5082ff','#ffb450','#3cffb4',
                 '#ff6e3c','#c8ff00','#ff3c96','#3c96ff'];

let boxes    = [];
let drawing  = false;
let startX   = 0, startY = 0;
let scaleX   = 1, scaleY  = 1;

function sync() {
    const r = img.getBoundingClientRect();
    overlay.width  = r.width;
    overlay.height = r.height;
    overlay.style.width  = r.width  + 'px';
    overlay.style.height = r.height + 'px';
    scaleX = img.naturalWidth  / r.width;
    scaleY = img.naturalHeight / r.height;
    redraw();
}

function toCanvas(ex, ey) {
    const r = overlay.getBoundingClientRect();
    return [ ex - r.left, ey - r.top ];
}

overlay.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    e.preventDefault();
    const [x, y] = toCanvas(e.clientX, e.clientY);
    drawing = true;
    startX = x; startY = y;
});
overlay.addEventListener('mousemove', e => {
    if (!drawing) return;
    const [x, y] = toCanvas(e.clientX, e.clientY);
    redraw();
    // draw in-progress rect
    ctx.save();
    ctx.strokeStyle = COLORS[boxes.length % COLORS.length];
    ctx.lineWidth = 2;
    ctx.setLineDash([4,3]);
    ctx.strokeRect(startX, startY, x - startX, y - startY);
    ctx.restore();
});
overlay.addEventListener('mouseup', e => {
    if (!drawing) return;
    drawing = false;
    const [x, y] = toCanvas(e.clientX, e.clientY);
    const rx = Math.min(startX, x), ry = Math.min(startY, y);
    const rw = Math.abs(x - startX), rh = Math.abs(y - startY);
    if (rw < 10 || rh < 10) { redraw(); return; }
    boxes.push({
        x: Math.round(rx * scaleX),
        y: Math.round(ry * scaleY),
        w: Math.round(rw * scaleX),
        h: Math.round(rh * scaleY),
        cx: rx, cy: ry, cw: rw, ch: rh
    });
    redraw();
    updatePanel();
});
overlay.addEventListener('contextmenu', e => {
    e.preventDefault();
    const [mx, my] = toCanvas(e.clientX, e.clientY);
    // Find which box was right-clicked
    for (let i = boxes.length - 1; i >= 0; i--) {
        const b = boxes[i];
        if (mx >= b.cx && mx <= b.cx + b.cw && my >= b.cy && my <= b.cy + b.ch) {
            boxes.splice(i, 1);
            // Re-index remaining
            redraw();
            updatePanel();
            return;
        }
    }
});

function redraw() {
    ctx.clearRect(0, 0, overlay.width, overlay.height);
    boxes.forEach((b, i) => {
        const col = COLORS[i % COLORS.length];
        ctx.save();
        ctx.strokeStyle = col;
        ctx.fillStyle   = col + '22';
        ctx.lineWidth   = 2;
        ctx.setLineDash([]);
        ctx.fillRect(b.cx, b.cy, b.cw, b.ch);
        ctx.strokeRect(b.cx, b.cy, b.cw, b.ch);
        ctx.fillStyle = col;
        ctx.font = 'bold 13px monospace';
        ctx.fillText(i, b.cx + 4, b.cy + 14);
        ctx.restore();
    });
}

function updatePanel() {
    const list = document.getElementById('box-list');
    list.innerHTML = boxes.map((b, i) => `
        <div class="box-entry">
            <div class="box-color" style="background:${COLORS[i%COLORS.length]}"></div>
            <span class="box-label">formula-${i}</span>
            <span class="box-coords">${b.x},${b.y} ${b.w}×${b.h}</span>
            <button class="btn-del" onclick="del(${i})">✕</button>
        </div>`).join('');

    const json = JSON.stringify(boxes.map((b,i) => ({index: i, x: b.x, y: b.y, w: b.w, h: b.h})), null, 2);
    document.getElementById('output').textContent = json;
}

function del(i) {
    boxes.splice(i, 1);
    redraw();
    updatePanel();
}

function copyJSON() {
    const json = JSON.stringify(boxes.map((b,i) => ({index: i, x: b.x, y: b.y, w: b.w, h: b.h})), null, 2);
    navigator.clipboard.writeText(json).then(() => alert('JSON kopiert!'));
}

img.addEventListener('load', sync);
window.addEventListener('resize', sync);
if (img.complete) sync();
</script>
</body>
</html>
