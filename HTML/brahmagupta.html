    <script>
        function toggleSidebar() {
            const panel = document.getElementById('side-panel');
            panel.classList.toggle('collapsed');
            if (window.CyberLeftChrome && typeof CyberLeftChrome.publishResolvedScale === 'function') {
                CyberLeftChrome.publishResolvedScale();
            }
            setTimeout(() => {
                window.dispatchEvent(new Event('resize'));
                if (window.CyberLeftChrome && typeof CyberLeftChrome.publishResolvedScale === 'function') {
                    CyberLeftChrome.publishResolvedScale();
                }
            }, 400);
        }

        window.addEventListener('load', () => {
            const T = (k, fb) => (typeof CyberI18n !== 'undefined' && CyberI18n.getOr)
                ? CyberI18n.getOr('brahma.' + k, fb)
                : fb;

            CyberBranding.init({
                useExternalStyles: true,
                title: CyberI18n.get('ui.coach_title'),
                subtitle: T('title', 'SATZ VON BRAHMAGUPTA')
            });
            CyberUI.init();

            if (window.CyberLeftChrome && typeof CyberLeftChrome.configure === 'function') {
                CyberLeftChrome.configure({ viewportOnlyZoom: true });
            }

            /* ————— Stage constants ————— */
            const CX = 300, CY = 300, R = 230;
            const UNIT = 5 / R;          // circle radius counts as 5 length units
            const GAP = 14;              // minimum arc between two vertices, in degrees
            const NAMES = ['A', 'B', 'C', 'D'];
            const SIDE_NAMES = ['AB', 'BC', 'CD', 'DA'];

            /* ————— Math helpers ————— */
            const rad = d => d * Math.PI / 180;
            const deg = r => r * 180 / Math.PI;
            const n360 = a => ((a % 360) + 360) % 360;
            const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
            /* Screen y grows downward, so the sine is negated: a rising angle then runs
               counter-clockwise and A, B, C, D are named the way mathematics does it. */
            const ptAt = a => ({ x: CX + R * Math.cos(rad(a)), y: CY - R * Math.sin(rad(a)) });
            const dist = (p, q) => Math.hypot(p.x - q.x, p.y - q.y);
            const mid = (p, q) => ({ x: (p.x + q.x) / 2, y: (p.y + q.y) / 2 });

            function lineIntersect(p1, p2, p3, p4) {
                const d = (p1.x - p2.x) * (p3.y - p4.y) - (p1.y - p2.y) * (p3.x - p4.x);
                if (Math.abs(d) < 1e-9) return null;
                const A = p1.x * p2.y - p1.y * p2.x;
                const B = p3.x * p4.y - p3.y * p4.x;
                return {
                    x: (A * (p3.x - p4.x) - (p1.x - p2.x) * B) / d,
                    y: (A * (p3.y - p4.y) - (p1.y - p2.y) * B) / d
                };
            }

            function footOfPerp(P, S1, S2) {
                const dx = S2.x - S1.x, dy = S2.y - S1.y;
                const l2 = dx * dx + dy * dy || 1;
                const t = ((P.x - S1.x) * dx + (P.y - S1.y) * dy) / l2;
                return { x: S1.x + t * dx, y: S1.y + t * dy };
            }

            function polygonArea(p) {
                let s = 0;
                for (let i = 0; i < p.length; i++) {
                    const q = p[(i + 1) % p.length];
                    s += p[i].x * q.y - q.x * p[i].y;
                }
                return Math.abs(s) / 2;
            }

            /* Interior angle at vertex v between the arms v->a and v->b, in degrees. */
            function vertexAngle(a, v, b) {
                const u1 = { x: a.x - v.x, y: a.y - v.y };
                const u2 = { x: b.x - v.x, y: b.y - v.y };
                const c = (u1.x * u2.x + u1.y * u2.y) / ((Math.hypot(u1.x, u1.y) || 1) * (Math.hypot(u2.x, u2.y) || 1));
                return deg(Math.acos(clamp(c, -1, 1)));
            }

            function isConvex(p) {
                let sign = 0;
                for (let i = 0; i < 4; i++) {
                    const a = p[i], b = p[(i + 1) % 4], c = p[(i + 2) % 4];
                    const cr = (b.x - a.x) * (c.y - b.y) - (b.y - a.y) * (c.x - b.x);
                    if (Math.abs(cr) < 1e-6) return false;
                    const s = Math.sign(cr);
                    if (sign === 0) sign = s;
                    else if (s !== sign) return false;
                }
                return true;
            }

            /* ————— State ————— */
            let mode = 'satz';           // satz | beweis | formel
            let showAll = false;         // theorem: draw all four perpendiculars
            let hotSide = 1;             // theorem: highlighted side index (0..3)
            let onCircle = true;         // formula: keep the vertices on the circle
            let step = 0;                // proof: current step, 0 .. PROOF_LAST
            let showSolution = false;    // proof: reveal the step that is left as an exercise

            /* Theorem mode is parametrised so that AC is always perpendicular to BD.
               With A at a0 and arcs u = arc(A,B), v = arc(A,C), the fourth vertex is
               forced to D = a0 + v - u + 180 — that is exactly arc(A,B) + arc(C,D) = 180. */
            const S = { a0: -125, u: 70, v: 160 };
            const DEFAULT_S = { ...S };

            /* Formula mode: four free angles on the circle (or four free points). */
            let ang = [-125, -40, 45, 150];
            const DEFAULT_ANG = [...ang];
            let free = null;

            function satzAngles() {
                return [S.a0, S.a0 + S.u, S.a0 + S.v, S.a0 + S.v - S.u + 180];
            }

            function currentPoints() {
                /* Theorem and proof share the perpendicular-diagonal parametrisation. */
                if (mode !== 'formel') return satzAngles().map(ptAt);
                if (!onCircle && free) return free.map(p => ({ ...p }));
                return ang.map(ptAt);
            }

            /* ————— SVG plumbing ————— */
            const svg = document.getElementById('lab-canvas');
            const layers = {
                back: document.getElementById('layer-back'),
                main: document.getElementById('layer-main'),
                hud: document.getElementById('layer-hud'),
                nodes: document.getElementById('layer-nodes')
            };

            function el(tag, attrs, text) {
                const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
                for (const k in attrs) e.setAttribute(k, attrs[k]);
                if (text !== undefined) e.textContent = text;
                return e;
            }

            function line(parent, p, q, cls, style) {
                const a = { x1: p.x, y1: p.y, x2: q.x, y2: q.y, class: cls };
                if (style) a.style = style;
                parent.appendChild(el('line', a));
            }

            /* ————— Drawing ————— */
            function draw() {
                layers.back.innerHTML = '';
                layers.main.innerHTML = '';
                layers.hud.innerHTML = '';
                layers.nodes.innerHTML = '';

                const P4 = currentPoints();
                const [A, B, C, D] = P4;

                /* Circumcircle */
                layers.back.appendChild(el('circle', {
                    cx: CX, cy: CY, r: R,
                    class: 'circum' + ((mode === 'formel' && !onCircle) ? ' faded' : '')
                }));

                /* Quadrilateral */
                layers.main.appendChild(el('polygon', {
                    points: P4.map(p => p.x + ',' + p.y).join(' '),
                    class: 'quad'
                }));

                /* Diagonals */
                line(layers.main, A, C, 'diagonal');
                line(layers.main, B, D, 'diagonal');

                const Pi = lineIntersect(A, C, B, D);

                if (mode === 'satz' && Pi) drawTheorem(P4, Pi);
                if (mode === 'beweis' && Pi) drawProof(P4, Pi);
                if (mode === 'formel') drawFormula(P4);

                /* Vertex handles + labels */
                const cen = { x: (A.x + B.x + C.x + D.x) / 4, y: (A.y + B.y + C.y + D.y) / 4 };
                P4.forEach((p, i) => {
                    const node = el('circle', { cx: p.x, cy: p.y, r: 8, class: 'vertex', 'data-idx': i });
                    layers.nodes.appendChild(node);
                    const ref = (mode === 'formel' && !onCircle) ? cen : { x: CX, y: CY };
                    const dx = p.x - ref.x, dy = p.y - ref.y;
                    const l = Math.hypot(dx, dy) || 1;
                    layers.hud.appendChild(el('text', {
                        x: p.x + dx / l * 28, y: p.y + dy / l * 28 + 6,
                        class: 'node-label', 'text-anchor': 'middle'
                    }, NAMES[i]));
                });

                updateReadout(P4, Pi);
            }

            function drawTheorem(P4, Pi) {
                const sides = showAll ? [0, 1, 2, 3] : [hotSide];

                /* Highlight the chosen side and its opposite */
                if (!showAll) {
                    const s1 = P4[hotSide], s2 = P4[(hotSide + 1) % 4];
                    const o1 = P4[(hotSide + 2) % 4], o2 = P4[(hotSide + 3) % 4];
                    layers.main.appendChild(el('line', { x1: s1.x, y1: s1.y, x2: s2.x, y2: s2.y, class: 'quad-side-hot' }));
                    layers.main.appendChild(el('line', { x1: o1.x, y1: o1.y, x2: o2.x, y2: o2.y, class: 'quad-side-opp' }));
                }

                sides.forEach(i => {
                    const s1 = P4[i], s2 = P4[(i + 1) % 4];
                    const o1 = P4[(i + 2) % 4], o2 = P4[(i + 3) % 4];
                    const E = footOfPerp(Pi, s1, s2);
                    const M = lineIntersect(Pi, E, o1, o2);
                    if (!M) return;
                    const dim = (showAll && i !== hotSide) ? ' dim' : '';
                    line(layers.main, E, M, 'perp' + dim);
                    layers.hud.appendChild(el('circle', { cx: E.x, cy: E.y, r: 4, class: 'foot-dot' }));
                    layers.hud.appendChild(el('circle', { cx: M.x, cy: M.y, r: 6, class: 'mid-dot' }));
                    if (!showAll) {
                        layers.hud.appendChild(el('text', {
                            x: M.x, y: M.y - 14, class: 'side-label', 'text-anchor': 'middle',
                            style: 'fill: rgb(121,158,49);'
                        }, 'M'));
                    }
                });

                /* Right-angle marker at the diagonal crossing */
                const u = { x: P4[2].x - P4[0].x, y: P4[2].y - P4[0].y };
                const w = { x: P4[3].x - P4[1].x, y: P4[3].y - P4[1].y };
                const lu = Math.hypot(u.x, u.y) || 1, lw = Math.hypot(w.x, w.y) || 1;
                const k = 16;
                const q1 = { x: Pi.x + u.x / lu * k, y: Pi.y + u.y / lu * k };
                const q2 = { x: Pi.x + w.x / lw * k, y: Pi.y + w.y / lw * k };
                const q3 = { x: q1.x + w.x / lw * k, y: q1.y + w.y / lw * k };
                layers.hud.appendChild(el('polyline', {
                    points: q1.x + ',' + q1.y + ' ' + q3.x + ',' + q3.y + ' ' + q2.x + ',' + q2.y,
                    class: 'right-angle'
                }));

                layers.hud.appendChild(el('circle', { cx: Pi.x, cy: Pi.y, r: 6, class: 'p-dot' }));
                layers.hud.appendChild(el('text', {
                    x: Pi.x + 16, y: Pi.y - 12, class: 'node-label',
                    style: 'fill: var(--neon-purple);'
                }, 'P'));
            }

            /* ————— Proof mode ————————————————————————————————————————
               Labels follow the classroom handout: M is the crossing of the
               diagonals, E the foot of the perpendicular on BC, F its second
               intersection with the opposite side AD. */
            const PROOF_LAST = 8;
            const C_HOT = 'rgb(245,194,66)';
            const C_OPP = 'rgb(121,158,49)';
            const C_PUR = '#be78ff';

            const degTxt = v => v.toFixed(1) + '°';

            function uvec(V, P) {
                const dx = P.x - V.x, dy = P.y - V.y;
                const l = Math.hypot(dx, dy) || 1;
                return { x: dx / l, y: dy / l };
            }

            /* Right-angle square at V, opening towards P1 and P2. */
            function rightAngleMark(parent, V, P1, P2, k) {
                const u = uvec(V, P1), w = uvec(V, P2);
                const q1 = { x: V.x + u.x * k, y: V.y + u.y * k };
                const q2 = { x: V.x + w.x * k, y: V.y + w.y * k };
                const q3 = { x: q1.x + w.x * k, y: q1.y + w.y * k };
                parent.appendChild(el('polyline', {
                    points: q1.x + ',' + q1.y + ' ' + q3.x + ',' + q3.y + ' ' + q2.x + ',' + q2.y,
                    class: 'right-angle'
                }));
            }

            /* Arc marking the angle at V between the rays V->P1 and V->P2. */
            function angleArc(parent, V, P1, P2, r, color, opts) {
                opts = opts || {};
                const u1 = uvec(V, P1), u2 = uvec(V, P2);
                const sweep = (u1.x * u2.y - u1.y * u2.x) > 0 ? 1 : 0;
                const radii = opts.double ? [r, r + 5] : [r];
                radii.forEach(rr => {
                    const a = { x: V.x + u1.x * rr, y: V.y + u1.y * rr };
                    const b = { x: V.x + u2.x * rr, y: V.y + u2.y * rr };
                    parent.appendChild(el('path', {
                        d: 'M ' + a.x + ' ' + a.y + ' A ' + rr + ' ' + rr + ' 0 0 ' + sweep + ' ' + b.x + ' ' + b.y,
                        class: 'angle-arc' + (opts.dim ? ' dim' : ''),
                        style: 'stroke:' + color
                    }));
                });
                if (opts.label) {
                    const bx = u1.x + u2.x, by = u1.y + u2.y;
                    const bl = Math.hypot(bx, by) || 1;
                    const d = r + (opts.double ? 22 : 17);
                    parent.appendChild(el('text', {
                        x: V.x + bx / bl * d, y: V.y + by / bl * d + 4,
                        class: 'angle-label', 'text-anchor': 'middle',
                        style: 'fill:' + color, opacity: opts.dim ? 0.5 : 1
                    }, opts.label));
                }
            }

            function triFill(parent, p, q, r, color) {
                parent.appendChild(el('polygon', {
                    points: [p, q, r].map(z => z.x + ',' + z.y).join(' '),
                    class: 'tri-hi', style: 'fill:' + color + ';stroke:' + color
                }));
            }

            /* Thick overlay plus a single hash mark — segments carrying the same
               colour and mark are the ones just proven equal. */
            function segEq(parent, hud, p, q, color) {
                parent.appendChild(el('line', {
                    x1: p.x, y1: p.y, x2: q.x, y2: q.y,
                    class: 'seg-eq', style: 'stroke:' + color
                }));
                const m = mid(p, q);
                const u = uvec(p, q);
                const n = { x: -u.y, y: u.x };
                hud.appendChild(el('line', {
                    x1: m.x + n.x * 8, y1: m.y + n.y * 8,
                    x2: m.x - n.x * 8, y2: m.y - n.y * 8,
                    class: 'eq-tick', style: 'stroke:#fff'
                }));
            }

            /* M, E, F for the current configuration; F is null in degenerate cases. */
            function proofPoints(P4, Pi) {
                const [A, B, C, D] = P4;
                const E = footOfPerp(Pi, B, C);
                const F = lineIntersect(Pi, E, D, A);
                return { A: A, B: B, C: C, D: D, M: Pi, E: E, F: F };
            }

            function drawProof(P4, Pi) {
                const g = proofPoints(P4, Pi);
                if (!g.F) return;
                const A = g.A, B = g.B, C = g.C, D = g.D, M = g.M, E = g.E, F = g.F;
                const main = layers.main, hud = layers.hud;
                const solved = (step !== 7) || showSolution;

                /* The construction itself — visible on every step. */
                line(main, B, C, 'quad-side-hot');
                line(main, D, A, 'quad-side-opp');
                line(main, E, F, 'perp');
                rightAngleMark(hud, M, A, B, 14);
                rightAngleMark(hud, E, M, C, 11);

                if (step === 1 || step === 5) line(main, D, C, 'chord-hi');
                if (step === 7 && solved) line(main, A, B, 'chord-hi');

                if (step === 1) {
                    angleArc(hud, A, D, C, 36, C_HOT, { label: degTxt(vertexAngle(D, A, C)) });
                    angleArc(hud, B, D, C, 36, C_HOT, { label: degTxt(vertexAngle(D, B, C)) });
                } else if (step === 2) {
                    triFill(main, C, M, B, C_PUR);
                    triFill(main, C, M, E, C_HOT);
                    angleArc(hud, B, D, C, 34, C_HOT, { label: degTxt(vertexAngle(D, B, C)) });
                    angleArc(hud, M, C, E, 26, C_HOT, { label: degTxt(vertexAngle(C, M, E)) });
                    angleArc(hud, C, M, B, 42, C_OPP, { label: degTxt(vertexAngle(M, C, B)) });
                } else if (step === 3) {
                    angleArc(hud, C, M, B, 42, C_OPP, { label: degTxt(vertexAngle(M, C, B)) });
                    angleArc(hud, B, D, C, 34, C_HOT, { label: degTxt(vertexAngle(D, B, C)), double: true });
                    angleArc(hud, M, C, E, 26, C_HOT, { label: degTxt(vertexAngle(C, M, E)), double: true });
                } else if (step === 4) {
                    angleArc(hud, M, C, E, 26, C_HOT, { label: degTxt(vertexAngle(C, M, E)), double: true });
                    angleArc(hud, M, A, F, 26, C_HOT, { label: degTxt(vertexAngle(A, M, F)), double: true });
                } else if (step === 5) {
                    angleArc(hud, A, D, C, 36, C_HOT, { label: degTxt(vertexAngle(D, A, C)) });
                    angleArc(hud, B, D, C, 34, C_HOT, { label: degTxt(vertexAngle(D, B, C)), dim: true });
                    angleArc(hud, M, C, E, 26, C_HOT, { label: degTxt(vertexAngle(C, M, E)), dim: true });
                    angleArc(hud, M, A, F, 26, C_HOT, { label: degTxt(vertexAngle(A, M, F)) });
                } else if (step === 6) {
                    triFill(main, A, F, M, C_HOT);
                    angleArc(hud, A, D, C, 36, C_HOT, { label: degTxt(vertexAngle(D, A, C)) });
                    angleArc(hud, M, A, F, 26, C_HOT, { label: degTxt(vertexAngle(A, M, F)) });
                    segEq(main, hud, F, A, C_HOT);
                    segEq(main, hud, F, M, C_HOT);
                } else if (step === 7) {
                    triFill(main, D, F, M, C_OPP);
                    if (solved) {
                        angleArc(hud, D, A, B, 36, C_OPP, { label: degTxt(vertexAngle(A, D, B)) });
                        angleArc(hud, M, F, D, 26, C_OPP, { label: degTxt(vertexAngle(F, M, D)) });
                        segEq(main, hud, F, D, C_OPP);
                        segEq(main, hud, F, M, C_OPP);
                    }
                } else if (step === 8) {
                    segEq(main, hud, A, F, C_HOT);
                    segEq(main, hud, F, D, C_HOT);
                }

                /* Construction points, drawn last so nothing covers them. */
                hud.appendChild(el('circle', { cx: E.x, cy: E.y, r: 5, class: 'foot-dot' }));
                hud.appendChild(el('circle', { cx: F.x, cy: F.y, r: 6, class: 'mid-dot' }));
                hud.appendChild(el('circle', { cx: M.x, cy: M.y, r: 6, class: 'p-dot' }));

                const outE = uvec(M, E), outF = uvec(M, F);
                /* The label goes into the quadrant between MC and MD — the angle
                   arcs live in the other two, the right-angle square in the fourth. */
                const ua = uvec(M, C), ub = uvec(M, D);
                const mb = { x: ua.x + ub.x, y: ua.y + ub.y };
                const mbl = Math.hypot(mb.x, mb.y) || 1;
                const lbl = (x, y, txt, color) => hud.appendChild(el('text', {
                    x: x, y: y + 5, class: 'node-label', 'text-anchor': 'middle',
                    style: 'fill:' + color
                }, txt));
                lbl(M.x + mb.x / mbl * 24, M.y + mb.y / mbl * 24, 'M', 'var(--neon-purple)');
                lbl(E.x + outE.x * 20, E.y + outE.y * 20, 'E', C_HOT);
                lbl(F.x + outF.x * 20, F.y + outF.y * 20, 'F', C_OPP);
            }

            function proofReadout(P4, Pi) {
                const g = proofPoints(P4, Pi);
                if (!g.F) return;
                const A = g.A, B = g.B, C = g.C, D = g.D, M = g.M, F = g.F, E = g.E;
                const AF = dist(A, F) * UNIT, FD = dist(F, D) * UNIT, FM = dist(F, M) * UNIT;
                const d = AF - FD;
                CyberUI.updateStatsGrid('data-container', [
                    { value: degTxt(vertexAngle(D, A, C)) },
                    { value: degTxt(vertexAngle(D, B, C)) },
                    { value: degTxt(vertexAngle(C, M, E)) },
                    { value: degTxt(vertexAngle(A, M, F)) },
                    { value: AF.toFixed(3) },
                    { value: FD.toFixed(3) }
                ]);
                const rows = document.getElementById('measure-rows');
                if (rows) {
                    rows.innerHTML =
                        '<tr><td>|FM|</td><td>' + FM.toFixed(3) + '</td></tr>' +
                        '<tr><td>|AF|</td><td>' + AF.toFixed(3) + '</td></tr>' +
                        '<tr><td>|FD|</td><td>' + FD.toFixed(3) + '</td></tr>' +
                        '<tr><td>|AD|</td><td>' + (dist(A, D) * UNIT).toFixed(3) + '</td></tr>' +
                        '<tr><td>|AF| − |FD|</td><td style="color:' +
                        (Math.abs(d) < 5e-4 ? 'rgb(121,158,49)' : 'rgb(176,36,24)') + '">' +
                        (Math.abs(d) < 5e-4 ? '0.000' : d.toFixed(3)) + '</td></tr>';
                }
            }

            /* Step texts. German is the fallback; translations live in brahma.* */
            const PROOF_DE = [
                {
                    short: 'VORAUSSETZUNG',
                    title: 'VORAUSSETZUNG & BEHAUPTUNG',

                {

                {

                },
                {

                    solution: 'Über der Sehne <b>AB</b> gilt ∠FDM = ∠ADB = ∠ACB = ∠MCB (Peripheriewinkelsatz). Weil die Diagonalen in M senkrecht stehen, ist ∠FMD = 90° − ∠FMA; nach Schritt 2 ist ∠MCB = 90° − ∠MBC. Mit ∠MBC = ∠FMA aus Schritt 5 folgt <b>∠FDM = ∠FMD</b> — auch △DFM ist gleichschenklig: <b>|FD| = |FM|</b>.'
                },
                {
                    short: 'q.e.d.',
                    title: 'q.e.d.',
                    body: '|AF| = |FM| aus Schritt 6 und |FD| = |FM| aus Schritt 7 — zusammen <b>|AF| = |FD|</b>. F ist die Mitte von AD.<br><br>Das Lot vom Schnittpunkt der Diagonalen auf eine Seite halbiert also die Gegenseite. <b>q.e.d.</b>'
                }
            ];

            const PROOF_TEX = [
                '\\begin{aligned} AC &\\perp BD \\;\\text{in } M \\\\ EF &\\perp BC,\\; M \\in EF \\\\ \\Rightarrow\\; |AF| &\\overset{?}{=} |FD| \\end{aligned}',
                '\\angle FAM = \\angle DAC = \\angle DBC = \\angle MBC',
                '\\begin{aligned} \\angle MBC + \\angle MCB &= 90^\\circ \\\\ \\angle CME + \\angle MCE &= 90^\\circ \\end{aligned}',
                '\\angle MCB = \\angle MCE \\;\\Rightarrow\\; \\angle MBC = \\angle CME',
                '\\angle CME = \\angle FMA',
                '\\angle FAM = \\angle MBC = \\angle CME = \\angle FMA',
                '\\angle FAM = \\angle FMA \\;\\Rightarrow\\; |FA| = |FM|',
                '\\angle FDM = \\angle FMD \\;\\Rightarrow\\; |FD| = |FM|',
                '|AF| = |FM| = |FD| \\quad \\square'
            ];

            const proofText = (i, field) => T('proof_' + field + '_' + i, PROOF_DE[i][field]);

            function gotoStep(i) {
                const next = clamp(i, 0, PROOF_LAST);
                if (next === step) return;
                step = next;
                if (step !== 7) showSolution = false;
                buildSidebar();
                draw();
            }

            function drawFormula(P4) {
                const letters = ['a', 'b', 'c', 'd'];
                const ref = onCircle
                    ? { x: CX, y: CY }
                    : { x: (P4[0].x + P4[1].x + P4[2].x + P4[3].x) / 4, y: (P4[0].y + P4[1].y + P4[2].y + P4[3].y) / 4 };
                for (let i = 0; i < 4; i++) {
                    const p = P4[i], q = P4[(i + 1) % 4];
                    const m = mid(p, q);
                    const dx = m.x - ref.x, dy = m.y - ref.y;
                    const l = Math.hypot(dx, dy) || 1;
                    layers.hud.appendChild(el('text', {
                        x: m.x + dx / l * 18, y: m.y + dy / l * 18 + 5,
                        class: 'side-label', 'text-anchor': 'middle'
                    }, letters[i]));
                }
            }

            /* ————— Numbers ————— */
            function measures(P4) {
                const s = [0, 1, 2, 3].map(i => dist(P4[i], P4[(i + 1) % 4]) * UNIT);
                const per = s.reduce((x, y) => x + y, 0);
                const half = per / 2;
                const prod = s.reduce((x, y) => x * (half - y), 1);
                const brahma = Math.sqrt(Math.max(0, prod));
                const alpha = vertexAngle(P4[3], P4[0], P4[1]);
                const gamma = vertexAngle(P4[1], P4[2], P4[3]);
                const corr = s[0] * s[1] * s[2] * s[3] * Math.pow(Math.cos(rad((alpha + gamma) / 2)), 2);
                const bret = Math.sqrt(Math.max(0, prod - corr));
                return { s, per, half, brahma, bret, alpha, gamma, real: polygonArea(P4) * UNIT * UNIT };
            }

            function setStatLabel(i, text) {
                const el = document.querySelector('#stats-card-data-container-' + i + ' .stats-label');
                if (el) el.textContent = text;
            }

            function updateReadout(P4, Pi) {
                const f2 = x => x.toFixed(2);
                const f3 = x => x.toFixed(3);

                if (mode === 'beweis') {
                    if (Pi) proofReadout(P4, Pi);
                    return;
                }

                if (mode === 'satz') {
                    if (!Pi) return;
                    const n1 = NAMES[(hotSide + 2) % 4], n2 = NAMES[(hotSide + 3) % 4];
                    setStatLabel(2, '|M' + n1 + '|');
                    setStatLabel(4, '|M' + n2 + '|');
                    setStatLabel(5, '|' + n1 + n2 + '|');
                    const o1 = P4[(hotSide + 2) % 4], o2 = P4[(hotSide + 3) % 4];
                    const E = footOfPerp(Pi, P4[hotSide], P4[(hotSide + 1) % 4]);
                    const M = lineIntersect(Pi, E, o1, o2) || mid(o1, o2);
                    const target = mid(o1, o2);
                    const dAC = { x: P4[2].x - P4[0].x, y: P4[2].y - P4[0].y };
                    const dBD = { x: P4[3].x - P4[1].x, y: P4[3].y - P4[1].y };
                    const cosang = (dAC.x * dBD.x + dAC.y * dBD.y) /
                        ((Math.hypot(dAC.x, dAC.y) || 1) * (Math.hypot(dBD.x, dBD.y) || 1));
                    const diagAngle = deg(Math.acos(clamp(Math.abs(cosang), -1, 1)));

                    CyberUI.updateStatsGrid('data-container', [
                        { value: (90 - diagAngle).toFixed(1) + '°' },
                        { value: f3(dist(M, target) * UNIT) },
                        { value: f2(dist(M, o1) * UNIT) },
                        { value: f2(dist(M, Pi) * UNIT) },
                        { value: f2(dist(M, o2) * UNIT) },
                        { value: f2(dist(o1, o2) * UNIT) }
                    ]);

                    const rows = document.getElementById('measure-rows');
                    if (rows) {
                        const a = satzAngles();
                        const arc = i => n360(a[(i + 1) % 4] - a[i]).toFixed(1) + '°';
                        rows.innerHTML =
                            '<tr><td>' + T('arc', 'Bogen') + ' AB</td><td>' + arc(0) + '</td></tr>' +
                            '<tr><td>' + T('arc', 'Bogen') + ' CD</td><td>' + arc(2) + '</td></tr>' +
                            '<tr><td>' + T('arc_sum', 'Summe') + '</td><td>' +
                            (n360(a[1] - a[0]) + n360(a[3] - a[2])).toFixed(1) + '°</td></tr>';
                    }
                    return;
                }

                const m = measures(P4);
                const gap = m.brahma - m.real;
                CyberUI.updateStatsGrid('data-container', [
                    { value: f3(m.brahma) },
                    { value: f3(m.real) },
                    {
                        value: Math.abs(gap) < 5e-4 ? '0.000' : (gap > 0 ? '+' : '') + f3(gap),
                        color: Math.abs(gap) < 0.005 ? 'rgb(121,158,49)' : 'rgb(176,36,24)'
                    },
                    { value: f3(m.bret) },
                    { value: (m.alpha + m.gamma).toFixed(1) + '°' },
                    { value: f2(m.half) }
                ]);

                const rows = document.getElementById('measure-rows');
                if (rows) {
                    rows.innerHTML = ['a = AB', 'b = BC', 'c = CD', 'd = DA']
                        .map((lbl, i) => '<tr><td>' + lbl + '</td><td>' + f2(m.s[i]) + '</td></tr>').join('') +
                        '<tr><td>' + T('perimeter', 'Umfang') + '</td><td>' + f2(m.per) + '</td></tr>';
                }
            }

            /* ————— Dragging ————— */
            let dragIdx = null;

            function svgPoint(e) {
                const pt = svg.createSVGPoint();
                const src = (e.touches && e.touches.length) ? e.touches[0] : e;
                pt.x = src.clientX;
                pt.y = src.clientY;
                return pt.matrixTransform(svg.getScreenCTM().inverse());
            }

            function applyDrag(idx, p) {
                if (mode === 'formel' && !onCircle) {
                    const cand = free.map(q => ({ ...q }));
                    cand[idx] = { x: clamp(p.x, 30, 570), y: clamp(p.y, 30, 570) };
                    if (!isConvex(cand)) return;
                    free = cand;
                    return;
                }

                const theta = deg(Math.atan2(CY - p.y, p.x - CX));   // inverse of ptAt

                if (mode === 'formel') {
                    const lo = ang[(idx + 3) % 4];
                    const span = n360(ang[(idx + 1) % 4] - lo);
                    let t = n360(theta - lo);
                    t = clamp(t, GAP, Math.max(GAP, span - GAP));
                    ang[idx] = n360(lo + t);
                    return;
                }

                /* Theorem mode: keep the diagonals perpendicular. */
                if (idx === 0) {                       // A rotates the whole figure
                    S.a0 = theta;
                } else if (idx === 1) {                // B moves the arc u
                    let u = n360(theta - S.a0);
                    const lo = Math.max(GAP, S.v - 180 + GAP);
                    const hi = Math.min(180 - GAP, S.v - GAP);
                    S.u = clamp(u, lo, Math.max(lo, hi));
                } else if (idx === 2) {                // C moves the arc v
                    S.v = clamp(n360(theta - S.a0), S.u + GAP, S.u + 180 - GAP);
                } else {                               // D is bound to A, B, C
                    S.v = clamp(n360(theta - S.a0 + S.u - 180), S.u + GAP, S.u + 180 - GAP);
                }
            }

            svg.addEventListener('mousedown', e => {
                const t = e.target;
                if (!t.classList || !t.classList.contains('vertex')) return;
                dragIdx = parseInt(t.getAttribute('data-idx'), 10);
                t.classList.add('dragging');
                e.preventDefault();
            });
            svg.addEventListener('touchstart', e => {
                const t = e.target;
                if (!t.classList || !t.classList.contains('vertex')) return;
                dragIdx = parseInt(t.getAttribute('data-idx'), 10);
                t.classList.add('dragging');
                e.preventDefault();
            }, { passive: false });

            function onMove(e) {
                if (dragIdx === null) return;
                applyDrag(dragIdx, svgPoint(e));
                draw();
                const node = layers.nodes.querySelector('[data-idx="' + dragIdx + '"]');
                if (node) node.classList.add('dragging');
                e.preventDefault();
            }

            window.addEventListener('mousemove', onMove);
            window.addEventListener('touchmove', onMove, { passive: false });
            window.addEventListener('mouseup', () => { dragIdx = null; draw(); });
            window.addEventListener('touchend', () => { dragIdx = null; draw(); });

            /* ————— Sidebar ————— */
            function statsForMode() {
                if (mode === 'satz') {
                    return [
                        { label: T('stat_perp', 'ABWEICHUNG VON 90°'), value: '0.0°', color: 'rgb(121,158,49)' },
                        { label: T('stat_dev', 'M ↔ MITTE'), value: '0.000', color: 'rgb(121,158,49)' },
                        { label: '|M–|', value: '0.00', color: 'var(--neon-blue)' },
                        { label: '|MP|', value: '0.00', color: 'var(--neon-purple)' },
                        { label: '|M–|', value: '0.00', color: 'var(--neon-blue)' },
                        { label: T('stat_opp', 'GEGENSEITE'), value: '0.00', color: 'rgb(121,158,49)' }
                    ];
                }
                if (mode === 'beweis') {
                    return [
                        { label: '∠FAM', value: '0.0°', color: 'rgb(245,194,66)' },
                        { label: '∠MBC', value: '0.0°', color: 'rgb(245,194,66)' },
                        { label: '∠CME', value: '0.0°', color: 'rgb(245,194,66)' },
                        { label: '∠FMA', value: '0.0°', color: 'rgb(245,194,66)' },
                        { label: '|AF|', value: '0.000', color: 'rgb(121,158,49)' },
                        { label: '|FD|', value: '0.000', color: 'rgb(121,158,49)' }
                    ];
                }
                return [
                    { label: T('stat_k', 'K (BRAHMAGUPTA)'), value: '0.000', color: 'rgb(245,194,66)' },
                    { label: T('stat_area', 'FLÄCHE (GAUSS)'), value: '0.000', color: 'var(--neon-blue)' },
                    { label: T('stat_diff', 'DIFFERENZ'), value: '0.000', color: 'rgb(121,158,49)' },
                    { label: T('stat_bret', 'BRETSCHNEIDER'), value: '0.000', color: 'var(--neon-purple)' },
                    { label: T('stat_angles', 'α + γ'), value: '180.0°', color: 'var(--neon-blue)' },
                    { label: 's', value: '0.00', color: 'rgba(255,255,255,0.8)' }
                ];
            }

            function renderFormula() {
                const box = document.getElementById('formula-slot');
                if (!box || typeof katex === 'undefined') return;
                const s1 = NAMES[hotSide] + NAMES[(hotSide + 1) % 4];
                const m1 = NAMES[(hotSide + 2) % 4], m2 = NAMES[(hotSide + 3) % 4];
                let tex;
                if (mode === 'satz') {
                    tex = '\\begin{aligned} AC &\\perp BD \\\\ \\Longrightarrow\\; PM &\\perp ' + s1 +
                        ' \\\\ |M' + m1 + '| &= |MP| = |M' + m2 + '| \\end{aligned}';
                } else if (mode === 'beweis') {
                    tex = (step === 7 && !showSolution)
                        ? '\\angle FDM \\overset{?}{=} \\angle FMD \\;\\Rightarrow\\; |FD| \\overset{?}{=} |FM|'
                        : PROOF_TEX[step];
                } else {
                    tex = '\\begin{aligned} K &= \\sqrt{(s-a)(s-b)(s-c)(s-d)} \\\\ s &= \\tfrac{a+b+c+d}{2} \\end{aligned}';
                }
                try { katex.render(tex, box, { throwOnError: false, displayMode: true }); } catch (err) { box.textContent = tex; }
            }

            function renderCoach() {
                const title = document.getElementById('coach-title-slot');
                const body = document.getElementById('coach-content');
                if (title) {
                    title.textContent = (mode === 'beweis')
                        ? proofText(step, 'title')
                        : (mode === 'satz')
                            ? T('coach_title_satz', 'SATZ VON BRAHMAGUPTA')
                            : T('coach_title_formel', 'FORMEL VON BRAHMAGUPTA');
                }
                if (mode === 'beweis' && body) {
                    body.innerHTML = (step === 7 && showSolution)
                        ? proofText(7, 'solution')
                        : proofText(step, 'body');
                    const bx = document.getElementById('math-coach-box');
                    if (bx) bx.classList.add('visible');
                    return;
                }
                if (body) {
                    body.innerHTML = (mode === 'satz')
                        ? T('coach_satz', 'Stehen die Diagonalen eines Sehnenvierecks <b>senkrecht</b> aufeinander, so trifft das Lot vom Diagonalenschnittpunkt <b>P</b> auf eine Seite die Gegenseite genau in ihrer <b>Mitte</b>. Grund: ∠APD ist rechtwinklig, also ist M der Umkreismittelpunkt von ΔAPD — daher |MA| = |MP| = |MD|.')
                        : T('coach_formel', 'Für ein <b>Sehnenviereck</b> mit den Seiten a, b, c, d gilt K = √((s−a)(s−b)(s−c)(s−d)). Schaltest Du den Kreis ab, ist das Viereck nicht mehr sehnentreu — K wird dann <b>zu groß</b>, und erst Bretschneider trifft die Fläche wieder.');
                }
                const boxEl = document.getElementById('math-coach-box');
                if (boxEl) boxEl.classList.add('visible');
            }

            function buildSidebar() {
                document.getElementById('data-container').innerHTML = '';
                document.getElementById('ui-container').innerHTML = '';

                CyberUI.createStatsGrid('data-container', statsForMode());

                CyberUI.createCard('ui-container', T('mode', 'MODUS'),
                    '<div id="mode-slot"></div>', 'var(--neon-blue)');
                CyberUI.createRadioGroup('mode-slot', null, [
                    { label: T('mode_satz', 'SATZ (LOT & MITTE)'), value: 'satz' },
                    { label: T('mode_beweis', 'BEWEIS (SCHRITT FÜR SCHRITT)'), value: 'beweis' },
                    { label: T('mode_formel', 'FORMEL (FLÄCHE)'), value: 'formel' }
                ], mode, val => { mode = val; buildSidebar(); draw(); });

                if (mode === 'beweis') {
                    CyberUI.createCard('ui-container', T('proof', 'BEWEIS'),
                        '<div class="step-nav">' +
                        '<button class="cyber-btn" id="step-prev" title="' + T('prev', 'Zurück') + '">◀</button>' +
                        '<div class="step-count" id="step-count"></div>' +
                        '<button class="cyber-btn" id="step-next" title="' + T('next', 'Weiter') + '">▶</button>' +
                        '</div>' +
                        '<div id="step-jump" style="margin-top:12px"></div>' +
                        '<div id="step-extra"></div>', 'rgb(245,194,66)');
                    document.getElementById('step-count').textContent =
                        (step + 1) + ' / ' + (PROOF_LAST + 1);
                    document.getElementById('step-prev').onclick = () => gotoStep(step - 1);
                    document.getElementById('step-next').onclick = () => gotoStep(step + 1);
                    CyberUI.createDropdown('step-jump',
                        PROOF_DE.map((s, i) => ({
                            id: String(i),
                            label: i + ' • ' + proofText(i, 'short')
                        })),
                        id => gotoStep(parseInt(id, 10)), String(step));
                    if (step === 7) {
                        CyberUI.createCheckbox('step-extra', T('show_solution', 'LÖSUNG ZEIGEN'), showSolution,
                            v => { showSolution = v; buildSidebar(); draw(); }, 'rgb(121,158,49)');
                    }
                } else if (mode === 'satz') {
                    CyberUI.createCard('ui-container', T('options', 'KONSTRUKTION'),
                        '<div id="opt-slot"></div>', 'rgb(245,194,66)');
                    CyberUI.createDropdown('opt-slot',
                        SIDE_NAMES.map((s, i) => ({
                            id: String(i),
                            label: T('side', 'SEITE') + ' ' + s + ' → ' + SIDE_NAMES[(i + 2) % 4]
                        })),
                        id => { hotSide = parseInt(id, 10); renderFormula(); draw(); },
                        String(hotSide));
                    CyberUI.createCheckbox('opt-slot', T('all_sides', 'ALLE VIER LOTE'), showAll,
                        v => { showAll = v; draw(); }, 'rgb(245,194,66)');
                } else {
                    CyberUI.createCard('ui-container', T('options', 'KONSTRUKTION'),
                        '<div id="opt-slot"></div>', 'rgb(245,194,66)');
                    CyberUI.createCheckbox('opt-slot', T('on_circle', 'ECKEN AUF DEM KREIS'), onCircle, v => {
                        onCircle = v;
                        if (!v) free = ang.map(ptAt);
                        draw();
                    }, 'rgb(245,194,66)');
                }

                CyberUI.createCard('ui-container', T('measures', 'MESSWERTE'),
                    '<table class="measure-table"><tbody id="measure-rows"></tbody></table>', 'var(--neon-purple)');

                CyberUI.createCard('ui-container', null,
                    '<div class="formula-box" id="formula-slot"></div>', 'var(--neon-blue)');

                CyberUI.createCard('ui-container', null,
                    '<button class="cyber-btn" style="width:100%" id="reset-btn">' +
                    T('reset', 'LABOR RESET') + '</button>', 'var(--neon-blue)');
                document.getElementById('reset-btn').onclick = () => {
                    Object.assign(S, DEFAULT_S);
                    ang = [...DEFAULT_ANG];
                    free = null;
                    onCircle = true;
                    showAll = false;
                    hotSide = 1;
                    step = 0;
                    showSolution = false;
                    buildSidebar();
                    draw();
                };

                /* Link to this lab's shooting script - opens in its own tab. */
                CyberUI.createCard('ui-container', 'Drehbuch', '<div id="doc-slot"></div>', 'rgb(245,194,66)');
                document.getElementById('doc-slot').insertAdjacentHTML('beforeend',
                    '<a class="cyber-btn" href="drehbuch/brahmagupta.html" target="_blank" rel="noopener"' +
                    ' style="text-decoration:none">DREHBUCH \u00d6FFNEN</a>');

                renderFormula();
                renderCoach();
            }

            /* Arrow keys step through the proof. Modifiers stay untouched so that
               Cmd-Shift-R keeps reloading the page. */
            window.addEventListener('keydown', e => {
                if (mode !== 'beweis') return;
                if (e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;
                const tag = ((e.target && e.target.tagName) || '').toLowerCase();
                if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
                if (e.key === 'ArrowRight') { gotoStep(step + 1); e.preventDefault(); }
                else if (e.key === 'ArrowLeft') { gotoStep(step - 1); e.preventDefault(); }
            });

            buildSidebar();
            draw();
            if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
            setTimeout(renderFormula, 600);
        });
    </script>
</body>

</html>
