    ich es nochmal erklären kann ... dass die Kinder sich nicht schämen, zum 25. Mal zu fragen". The code comes from
    the QR on the board (?c=1234) or is typed in. A tap writes one row into the table buzzer: the code, and the time the
    database adds - no device, no name, nothing stored here that could tell who it was. The teacher's page
    (js/buzzer.js) counts the rows of its code and shows them silently. No pause between two taps (Doc, 27.09.2026:
    "nimm die Minute raus ... Ich vertraue den Kids einfach"); only the database brakes, at 40 a minute per code.
-->

    <style>
        :root {
            --grund: #08142a;
            --text: #eaf0f7;
            --leise: #8a93a3;
            --orange: rgb(245, 194, 66);
            --gruen: rgb(121, 158, 49);
            --rot: rgb(176, 36, 24);
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; background: var(--grund); color: var(--text); }
        body {
            min-height: 100vh; min-height: 100dvh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 28px; padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
            font-family: 'Orbitron', sans-serif; text-align: center;
            -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
        }
        [hidden] { display: none !important; }

        /* the one button: a large ring, the question mark drawn (no font glyph) */
        #knopf {
            width: min(78vw, 58vh, 380px); aspect-ratio: 1; border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
            padding: 0 12%; cursor: pointer; touch-action: manipulation;
            font-family: inherit; font-size: clamp(1rem, 4.6vw, 1.35rem); letter-spacing: 0.06em; line-height: 1.35;
            color: var(--grund); background: var(--orange); border: none;
            box-shadow: 0 0 0 10px rgba(245, 194, 66, 0.18), 0 0 60px rgba(245, 194, 66, 0.35);
            transition: transform 0.12s ease, background 0.3s ease, box-shadow 0.3s ease;
        }
        #knopf:active { transform: scale(0.96); }
        #knopf:focus { outline: none; }
        #knopf svg { width: 34%; height: auto; }
        #knopf.angekommen { background: var(--gruen); color: #fff; box-shadow: 0 0 0 10px rgba(121, 158, 49, 0.2), 0 0 60px rgba(121, 158, 49, 0.35); }
        /* Doc, 29.09.: "mit dem weißen Ausrufezeichen. Vielen Dank für das Feedback" - arrived: the question mark
           turns into an exclamation mark (same dot), white on green */
        #knopf .ausruf, #knopf.angekommen .frage { display: none; }
        #knopf.angekommen .ausruf { display: inline; }
        #knopf.pause { background: #1c2c4a; color: var(--leise); box-shadow: none; cursor: default; }

        #hinweis { min-height: 1.4em; font-size: clamp(0.8rem, 3.6vw, 0.95rem); letter-spacing: 0.04em; color: var(--leise); }
        #hinweis.fehler { color: var(--rot); }

        /* the code, when no QR brought it */
        #code-feld { display: flex; flex-direction: column; align-items: center; gap: 16px; }
        #code-feld label { font-size: 0.9rem; letter-spacing: 0.1em; color: var(--leise); }
        #code {
            width: 7ch; padding: 10px 0; text-align: center;
            font-family: inherit; font-size: 2.4rem; letter-spacing: 0.3em; text-indent: 0.3em;
            color: var(--orange); background: transparent; border: 1px solid rgba(245, 194, 66, 0.5); border-radius: 12px;
        }
        #code:focus { outline: none; border-color: var(--orange); }
        #los {
            min-width: 160px; min-height: 48px; padding: 0 22px; cursor: pointer;
            font-family: inherit; font-size: 0.9rem; letter-spacing: 0.1em;
            color: var(--text); background: rgba(0, 210, 255, 0.08); border: 1px solid rgba(0, 210, 255, 0.4); border-radius: 10px;

        footer { font-size: 0.72rem; letter-spacing: 0.05em; line-height: 1.6; color: var(--leise); max-width: 34em; }

<body>
    <div id="code-feld" hidden>
        <label for="code">CODE VON DER TAFEL</label>
        <input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="Code von der Tafel">
        <button type="button" id="los">WEITER</button>
    </div>

    <button type="button" id="knopf" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path class="frage" d="M8.2 8.6 A3.9 3.9 0 1 1 13.6 12.2 C12.6 12.8 12 13.6 12 14.8 V15.6" fill="none" stroke="currentColor"
                stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
            <path class="ausruf" d="M12 4.6 V15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
            <circle cx="12" cy="19.6" r="1.5" fill="currentColor" />
        </svg>
        <span id="knopf-text">HAB ICH NICHT VERSTANDEN</span>
    </button>
    <div id="hinweis" role="status"></div>


    <script>
        (function () {
            'use strict';
            const DB_URL = 'https://fyfhxzyymmurlaenmzse.supabase.co';
            const DB_KEY = 'sb_publishable_ubQDiMD-X3N0vZvPVi229Q_-5Zootfk';   // publishable (public by design)
            const $ = id => document.getElementById(id);
            const knopf = $('knopf'), text = $('knopf-text'), hinweis = $('hinweis');
            let code = (new URLSearchParams(location.search).get('c') || '').trim();
            let zurueck = null;

            function sag(t, fehler) { hinweis.textContent = t; hinweis.classList.toggle('fehler', !!fehler); }

            async function buzz() {
                knopf.disabled = true;                 // only while the tap is on its way
                clearTimeout(zurueck);
                try {
                    const res = await fetch(DB_URL + '/rest/v1/buzzer', {
                        method: 'POST',
                        headers: { apikey: DB_KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
                        body: JSON.stringify({ code })
                    });
                    if (!res.ok) throw new Error(res.status === 400 ? 'Gerade drücken sehr viele – gleich nochmal.' : 'HTTP ' + res.status);
                } catch (e) {
                    knopf.disabled = false;
                    sag('Nicht angekommen – bitte nochmal tippen. ' + (e.message || ''), true);
                    return;
                }
                // arrived: green for a moment, and at once ready for the next tap
                knopf.disabled = false;
                knopf.className = 'angekommen';
                text.textContent = 'VIELEN DANK FÜR DAS FEEDBACK';
                sag('');
                if (navigator.vibrate) navigator.vibrate(40);
                zurueck = setTimeout(() => { knopf.className = ''; text.textContent = 'HAB ICH NICHT VERSTANDEN'; }, 1500);
            }

            function bereit() {
                $('code-feld').hidden = true;
                knopf.hidden = false;
            }

            knopf.addEventListener('click', buzz);
            // no QR, no code: type it from the board
            if (/^\d{4}$/.test(code)) bereit();
            else {
                $('code-feld').hidden = false;
                const feld = $('code');
                const weiter = () => {
                    const c = feld.value.replace(/\D/g, '');
                    if (!/^\d{4}$/.test(c)) { sag('Der Code hat vier Ziffern.', true); return; }
                    code = c;
                    history.replaceState(null, '', '?c=' + c);
                    sag('');
                    bereit();
                };
                $('los').addEventListener('click', weiter);
                feld.addEventListener('keydown', e => { if (e.key === 'Enter') weiter(); });
                feld.focus();
            }
        })();
    </script>
</body>

</html>
