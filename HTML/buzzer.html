<!DOCTYPE html>
<html lang="de">

<!--
    Buzzer - "nicht verstanden", for the class. One button, anonymous.

    Doc, 26.09.2026: "dass ich nur sehe, vorne bei mir ... dass irgendjemand gesagt hat, er versteht das nie. So dass
    ich es nochmal erklären kann ... dass die Kinder sich nicht schämen, zum 25. Mal zu fragen". The code comes from
    the QR on the board (?c=1234) or is typed in. A tap writes one row into the table buzzer: the code, and the time the
    database adds - no device, no name, nothing stored here that could tell who it was. The teacher's page
    (js/buzzer.js) counts the rows of its code and shows them silently. No pause between two taps (Doc, 27.09.2026:
    "nimm die Minute raus ... Ich vertraue den Kids einfach"); only the database brakes, at 40 a minute per code.
-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Buzzer | Doc Alvers Mathe-Labor</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="resources/favicon.svg">

    <meta name="theme-color" content="#08142a">
    <style>
        :root {
            --grund: #08142a;
            --text: #eaf0f7;
            --leise: #8a93a3;
            --orange: rgb(245, 194, 66);
            --gruen: rgb(121, 158, 49);
            --rot: rgb(176, 36, 24);
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; background: var(--grund); color: var(--text); }
        body {
            min-height: 100vh; min-height: 100dvh;
            /* Doc, 01.10.: "alles insgesamt ein Stück nach oben" - from the top with a little air, not centred */
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            gap: 28px; padding: clamp(28px, 6vh, 56px) 16px calc(24px + env(safe-area-inset-bottom));
            font-family: 'Orbitron', sans-serif; text-align: center;
            -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
        }
        [hidden] { display: none !important; }

        /* the one button: a large ring, the question mark drawn (no font glyph) */
        /* Doc, 02.10.: "verzerrt on pad" - a % padding counts from the page width, not the button's: on the wide pad
           the inner box shrank to ~100 px (text in three lines). Everything inside now counts from --knopf */
        #knopf {
            --knopf: min(78vw, 58vh, 380px);
            width: var(--knopf); aspect-ratio: 1; border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
            padding: 0 calc(var(--knopf) * 0.14); cursor: pointer; touch-action: manipulation;
            font-family: inherit; font-size: clamp(1rem, 4.6vw, 1.35rem); letter-spacing: 0.06em; line-height: 1.35;
            color: var(--grund); background: var(--orange); border: none;
            box-shadow: 0 0 0 10px rgba(245, 194, 66, 0.18), 0 0 60px rgba(245, 194, 66, 0.35);
            transition: transform 0.12s ease, background 0.3s ease, box-shadow 0.3s ease;
        }
        #knopf:active { transform: scale(0.96); }
        #knopf:focus { outline: none; }
        /* Doc, 01.10.: "Nehmen wir den Text nach oben, und mach da, wo das Fragezeichen ist ... diesen fragenden Smiley
           ... die Hand so am Kinn ... bitte die Apple-Smileys" - the words on top, under them Apple's face as an image
           (iamcal/emoji-data img-apple-160, as in the VGP and Vorrechnen), the same on every phone */
        /* Safari takes the face's natural 160 px as its height when the width is a % in a flex column - so a fixed
           square: width from the button, aspect-ratio 1, never stretched or shrunk by the flexbox */
        #knopf-bild { width: calc(var(--knopf) * 0.26); height: auto; aspect-ratio: 1; flex: none; object-fit: contain; pointer-events: none; -webkit-user-drag: none; }
        #knopf.angekommen { background: var(--gruen); color: #fff; box-shadow: 0 0 0 10px rgba(121, 158, 49, 0.2), 0 0 60px rgba(121, 158, 49, 0.35); }
        /* Doc, 01.10.: "Nicht Verstanden -> Danke fürs feedback ... kurz danach wird der button rot mit: drücken, wenn
           verstanden" - the open question in Doc's red; a tap tells the board it is understood
           ("wenn die Zahl wieder runter geht habe ich gut erklärt") */
        #knopf.offen { background: var(--rot); color: #fff; box-shadow: 0 0 0 10px rgba(176, 36, 24, 0.22), 0 0 60px rgba(176, 36, 24, 0.4); }
        #knopf.pause { background: #1c2c4a; color: var(--leise); box-shadow: none; cursor: default; }

        /* Doc, 01.10.: "Das soll mir Feedback geben, ob ich zu schnell erkläre oder zu langsam erkläre" - two quiet keys
           under the big one, as wide as it; a tap goes to the table buzzer_tempo, the teacher sees it beside her buzzer
           key. After a tap both rest for 20 s, so one phone cannot drown the class */
        /* Doc, 01.10.: "über die beiden Knöpfe ... Erklärung. Und rückt die ein Stück ... von der mittleren Taste nach
           unten" - a heading over them, and more room to the big key */
        #tempo { display: flex; flex-direction: column; gap: 10px; width: min(78vw, 58vh, 380px); margin-top: 18px; }
        #tempo-frage { font-size: clamp(0.8rem, 3.6vw, 0.95rem); letter-spacing: 0.12em; color: var(--leise); }   /* Doc: "einfach eine Überschrift Erklärung Punkt, Punkt, Punkt" */
        #tempo-knoepfe { display: flex; gap: 12px; }
        #tempo button {
            flex: 1; min-height: 52px; padding: 0 8px; cursor: pointer; touch-action: manipulation;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            font-family: inherit; font-size: clamp(0.72rem, 3.4vw, 0.9rem); letter-spacing: 0.08em;
            color: var(--text); background: rgba(0, 210, 255, 0.08); border: 1px solid rgba(0, 210, 255, 0.4); border-radius: 12px;
            transition: background 0.3s ease, border-color 0.3s ease, opacity 0.3s ease;
        }
        #tempo button:active { transform: scale(0.97); }
        #tempo button:focus { outline: none; }
        #tempo button img { width: 1.9em; height: 1.9em; flex: none; pointer-events: none; -webkit-user-drag: none; }
        #tempo button[data-art="schnell"] img { transform: scaleX(-1); }   /* Doc, 01.10.: "den Runner bitte spiegeln" */
        #tempo button.danke { background: var(--gruen); border-color: var(--gruen); color: #fff; }
        #tempo button:disabled:not(.danke) { opacity: 0.35; cursor: default; }

        /* Doc, 01.10.: "mach unten ein Feld. Für Feedback. Wo die mir also tatsächlich irgendwas schreiben können" -
           anonymous like the rest, at most 280 characters; only the teacher reads it (table buzzer_text) */
        #text-feld { display: flex; flex-direction: column; gap: 10px; width: min(78vw, 58vh, 380px); margin-top: 6px; }
        #text-feld label { font-size: clamp(0.8rem, 3.6vw, 0.95rem); letter-spacing: 0.12em; color: var(--leise); }
        #text {
            width: 100%; min-height: 88px; resize: none; padding: 10px 12px; border-radius: 12px; outline: none;
            -webkit-user-select: text; user-select: text;
            font: 400 1rem/1.4 Raleway, system-ui, sans-serif; color: var(--text); text-align: left;
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(0, 210, 255, 0.4);
        }
        #text:focus { border-color: rgba(0, 210, 255, 0.8); }
        #text::placeholder { color: rgba(138, 147, 163, 0.7); }
        #text-zeile { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        #text-rest { font-size: 0.75rem; letter-spacing: 0.06em; color: var(--leise); }
        #text-los {
            min-width: 130px; min-height: 44px; padding: 0 18px; cursor: pointer; touch-action: manipulation;
            font-family: inherit; font-size: 0.85rem; letter-spacing: 0.1em;
            color: var(--text); background: rgba(0, 210, 255, 0.08); border: 1px solid rgba(0, 210, 255, 0.4); border-radius: 10px;
            transition: background 0.3s ease, border-color 0.3s ease, opacity 0.3s ease;
        }
        #text-los:disabled:not(.danke) { opacity: 0.35; cursor: default; }
        #text-los.danke { background: var(--gruen); border-color: var(--gruen); color: #fff; }

        #hinweis { min-height: 1.4em; font-size: clamp(0.8rem, 3.6vw, 0.95rem); letter-spacing: 0.04em; color: var(--leise); }
        #hinweis.fehler { color: var(--rot); }

        /* the code, when no QR brought it */
        #code-feld { display: flex; flex-direction: column; align-items: center; gap: 16px; }
        #code-feld label { font-size: 0.9rem; letter-spacing: 0.1em; color: var(--leise); }
        #code {
            width: 7ch; padding: 10px 0; text-align: center;
            font-family: inherit; font-size: 2.4rem; letter-spacing: 0.3em; text-indent: 0.3em;
            color: var(--orange); background: transparent; border: 1px solid rgba(245, 194, 66, 0.5); border-radius: 12px;
        }
        #code:focus { outline: none; border-color: var(--orange); }
        #los {
            min-width: 160px; min-height: 48px; padding: 0 22px; cursor: pointer;
            font-family: inherit; font-size: 0.9rem; letter-spacing: 0.1em;
            color: var(--text); background: rgba(0, 210, 255, 0.08); border: 1px solid rgba(0, 210, 255, 0.4); border-radius: 10px;
        }

        footer { font-size: 0.72rem; letter-spacing: 0.05em; line-height: 1.6; color: var(--leise); max-width: 34em; }
        footer b { color: var(--text); font-weight: 400; }
    </style>
</head>

<body>
    <div id="code-feld" hidden>
        <label for="code">CODE VON DER TAFEL</label>
        <input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="Code von der Tafel">
        <button type="button" id="los">WEITER</button>
    </div>

    <button type="button" id="knopf" hidden>
        <span id="knopf-text">HAB ICH NICHT VERSTANDEN</span>
        <img id="knopf-bild" alt="" draggable="false" src="https://cdn.jsdelivr.net/gh/iamcal/emoji-data@master/img-apple-160/1f914.png">
    </button>
    <div id="tempo" hidden>
        <div id="tempo-frage">ERKLÄRUNGEN SIND …</div>
        <div id="tempo-knoepfe">
        <button type="button" data-art="schnell"><img alt="" draggable="false" src="https://cdn.jsdelivr.net/gh/iamcal/emoji-data@master/img-apple-160/1f3c3.png"><span>ZU SCHNELL</span></button>
        <button type="button" data-art="langsam"><img alt="" draggable="false" src="https://cdn.jsdelivr.net/gh/iamcal/emoji-data@master/img-apple-160/1f40c.png"><span>ZU LANGSAM</span></button>
        </div>
    </div>
    <div id="text-feld" hidden>
        <label for="text">DEIN ANONYMES FEEDBACK</label>
        <textarea id="text" maxlength="280" rows="3" placeholder="Was möchtest du mir sagen?"></textarea>
        <div id="text-zeile"><span id="text-rest">280</span><button type="button" id="text-los" disabled>SENDEN</button></div>
    </div>
    <div id="hinweis" role="status"></div>


    <!-- in a live tour (tours/vorrechnen.html) the taps go to a pretend class (js/buzzer-demo-backend.js), never to
         the real table - elsewhere this does nothing; it has to be the first script -->
    <script src="js/tour-hook.js"></script>
    <script>
        (function () {
            'use strict';
            const DB_URL = 'https://fyfhxzyymmurlaenmzse.supabase.co';
            const DB_KEY = 'sb_publishable_ubQDiMD-X3N0vZvPVi229Q_-5Zootfk';   // publishable (public by design)
            const $ = id => document.getElementById(id);
            const knopf = $('knopf'), text = $('knopf-text'), bild = $('knopf-bild'), hinweis = $('hinweis');
            // Apple's faces (Doc, 01.10.: "bitte die Apple-Smileys"): 🤔 asking, 🤗 thanks, 😃 "drücken, wenn
            // verstanden", 🥳 understood - all fetched once, so a state's face is there the moment it shows
            const APPLE = 'https://cdn.jsdelivr.net/gh/iamcal/emoji-data@master/img-apple-160/';
            const GESICHT = { frage: '1f914', danke: '1f917', offen: '1f603', super: '1f973' };
            Object.values(GESICHT).forEach(c => { new Image().src = APPLE + c + '.png'; });
            const gesicht = g => { bild.src = APPLE + GESICHT[g] + '.png'; };
            let code = (new URLSearchParams(location.search).get('c') || '').trim();
            let zurueck = null, zustand = 'frage';           // 'frage' (orange), 'danke' (green, a moment), 'offen' (red)
            // my "nicht verstanden" still open: {code, id, tag} - a reload or a locked phone keeps the red button
            const KEY_OFFEN = 'buzzer-offen', heute = () => new Date().toDateString();
            const lies = () => { try { return JSON.parse(localStorage.getItem(KEY_OFFEN) || 'null'); } catch (_) { return null; } };
            const merke = v => { try { if (v) localStorage.setItem(KEY_OFFEN, JSON.stringify(v)); else localStorage.removeItem(KEY_OFFEN); } catch (_) {} };
            function offeneFrage() { const o = lies(); return o && o.code === code && o.tag === heute() && o.id ? o : null; }

            function sag(t, fehler) { hinweis.textContent = t; hinweis.classList.toggle('fehler', !!fehler); }
            function zeige(z) {
                zustand = z;
                knopf.className = z === 'frage' ? '' : z === 'offen' ? 'offen' : 'angekommen';
                if (z === 'frage') { text.textContent = 'HAB ICH NICHT VERSTANDEN'; gesicht('frage'); }
                if (z === 'offen') { text.textContent = 'DRÜCKEN, WENN VERSTANDEN'; gesicht('offen'); }
            }
            function danke(t, danach, g) {
                zeige('danke');
                text.textContent = t;
                gesicht(g || 'danke');
                sag('');
                if (navigator.vibrate) navigator.vibrate(40);
                zurueck = setTimeout(() => zeige(danach), 1500);
            }
            async function senden(daten) {
                return fetch(DB_URL + '/rest/v1/buzzer?select=id', {
                    method: 'POST',
                    headers: { apikey: DB_KEY, 'Content-Type': 'application/json', Prefer: 'return=representation' },
                    body: JSON.stringify(daten)
                });
            }

            // "nicht verstanden": its row's id is kept for the "verstanden" that answers it
            async function buzz() {
                knopf.disabled = true;                 // only while the tap is on its way
                clearTimeout(zurueck);
                let id = null;
                try {
                    const res = await senden({ code });
                    if (!res.ok) throw new Error(res.status === 400 ? 'Gerade drücken sehr viele – gleich nochmal.' : 'HTTP ' + res.status);
                    try { const z = await res.json(); id = z && z[0] && z[0].id; } catch (_) { /* arrived all the same */ }
                } catch (e) {
                    knopf.disabled = false;
                    sag('Nicht angekommen – bitte nochmal tippen. ' + (e.message || ''), true);
                    return;
                }
                knopf.disabled = false;
                if (id) merke({ code, id, tag: heute() });
                // arrived: green for a moment, then red - unless the id did not come back (then orange as before)
                danke('VIELEN DANK FÜR DAS FEEDBACK', id ? 'offen' : 'frage');
            }
            // "verstanden": a row that refers to the open one - the board counts it down
            async function verstanden() {
                const o = offeneFrage();
                if (!o) { zeige('frage'); return; }
                knopf.disabled = true;
                clearTimeout(zurueck);
                let res;
                try { res = await senden({ code, bezug: o.id }); }
                catch (e) {
                    knopf.disabled = false;
                    sag('Nicht angekommen – bitte nochmal tippen.', true);
                    return;
                }
                knopf.disabled = false;
                let fehler = '';
                if (!res.ok && res.status !== 409) { try { fehler = (await res.json()).message || ''; } catch (_) {} }
                if (/zu viele/.test(fehler)) { sag('Gerade drücken sehr viele – gleich nochmal.', true); return; }
                merke(null);
                // 409: it was counted already; any other refusal (the question too old, ...): nothing left to answer
                if (res.ok || res.status === 409) danke('SUPER – DANKE!', 'frage', 'super');
                else { zeige('frage'); sag(''); }
            }

            // "zu schnell" / "zu langsam": a row of its own table (buzzer_tempo); the key says thanks, both rest 20 s
            const TEMPO_RUHE = 20000;
            const tempoKnoepfe = [...document.querySelectorAll('#tempo button')];
            async function tempo(b) {
                const art = b.dataset.art, schrift = b.querySelector('span'), wort = schrift.textContent;
                tempoKnoepfe.forEach(k => { k.disabled = true; });
                let res;
                try {
                    res = await fetch(DB_URL + '/rest/v1/buzzer_tempo', {
                        method: 'POST',
                        headers: { apikey: DB_KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
                        body: JSON.stringify({ code, art })
                    });
                } catch (_) { res = null; }
                if (!res || !res.ok) {
                    tempoKnoepfe.forEach(k => { k.disabled = false; });
                    sag(res && res.status === 400 ? 'Gerade drücken sehr viele – gleich nochmal.' : 'Nicht angekommen – bitte nochmal tippen.', true);
                    return;
                }
                sag('');
                if (navigator.vibrate) navigator.vibrate(40);
                b.classList.add('danke');
                schrift.textContent = 'DANKE!';
                setTimeout(() => { b.classList.remove('danke'); schrift.textContent = wort; }, 1500);
                setTimeout(() => tempoKnoepfe.forEach(k => { k.disabled = false; }), TEMPO_RUHE);
            }
            tempoKnoepfe.forEach(b => b.addEventListener('click', () => tempo(b)));

            // written feedback: a row of buzzer_text (code and text), read by the teacher alone; the field empties
            // and the key says thanks
            const textFeld = $('text'), los = $('text-los'), rest = $('text-rest');
            const TEXT_MAX = 280;
            function textStand() {
                const n = textFeld.value.length;
                rest.textContent = String(TEXT_MAX - n);
                if (!los.classList.contains('danke')) los.disabled = !textFeld.value.trim();
            }
            async function textSenden() {
                const t = textFeld.value.trim().slice(0, TEXT_MAX);
                if (!t) return;
                los.disabled = true;
                let res;
                try {
                    res = await fetch(DB_URL + '/rest/v1/buzzer_text', {
                        method: 'POST',
                        headers: { apikey: DB_KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
                        body: JSON.stringify({ code, text: t })
                    });
                } catch (_) { res = null; }
                if (!res || !res.ok) {
                    los.disabled = false;
                    sag(res && res.status === 400 ? 'Gerade schreiben sehr viele – gleich nochmal.' : 'Nicht angekommen – bitte nochmal senden.', true);
                    return;
                }
                sag('');
                textFeld.value = '';
                textFeld.blur();
                if (navigator.vibrate) navigator.vibrate(40);
                los.classList.add('danke');
                los.textContent = 'DANKE!';
                setTimeout(() => { los.classList.remove('danke'); los.textContent = 'SENDEN'; textStand(); }, 1800);
                textStand();
            }
            textFeld.addEventListener('input', textStand);
            los.addEventListener('click', textSenden);

            function bereit() {
                $('code-feld').hidden = true;
                $('text-feld').hidden = false;
                knopf.hidden = false;
                $('tempo').hidden = false;
                if (offeneFrage()) zeige('offen');
            }

            knopf.addEventListener('click', () => {
                if (zustand === 'offen') verstanden();
                else if (zustand === 'frage') buzz();           // the green moment takes no tap
            });
            // no QR, no code: type it from the board
            if (/^\d{4}$/.test(code)) bereit();
            else {
                $('code-feld').hidden = false;
                const feld = $('code');
                const weiter = () => {
                    const c = feld.value.replace(/\D/g, '');
                    if (!/^\d{4}$/.test(c)) { sag('Der Code hat vier Ziffern.', true); return; }
                    code = c;
                    history.replaceState(null, '', '?c=' + c);
                    sag('');
                    bereit();
                };
                $('los').addEventListener('click', weiter);
                feld.addEventListener('keydown', e => { if (e.key === 'Enter') weiter(); });
                feld.focus();
            }
        })();
    </script>
</body>

</html>
