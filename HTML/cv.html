<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Curriculum Vitae – Dr. Michael R. Alvers. Educator, technology entrepreneur, geophysicist. Available in DE, EN, ES, FR, IT.">
<title>Lebenslauf – Dr. Michael R. Alvers</title>
    <link rel="icon" type="image/svg+xml" href="resources/favicon.svg">
    <link rel="icon" type="image/png" sizes="256x256" href="resources/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Non-blocking font load: page renders instantly on bad networks, Orbitron swaps in when available -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet"></noscript>
<style>
  /* Monochrome "sleek" theme: graphite greys, hairlines, no colour */
  :root {
    --bg: #141518;
    --card: #1b1d21;
    --text: #e8eaed;
    --muted: #979da6;
    --hair: rgba(255, 255, 255, 0.10);
    --hair-strong: rgba(255, 255, 255, 0.28);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: radial-gradient(1100px 500px at 50% -20%, rgba(255, 255, 255, 0.045), transparent 65%),
                var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    padding: 28px 16px 52px;
  }
  ::selection { background: rgba(255, 255, 255, 0.18); }
  .wrap { max-width: 920px; margin: 0 auto; }

  /* ---------- top bar: language switcher + print ---------- */
  .topbar {
    display: flex; justify-content: flex-end; align-items: center; gap: 10px;
    flex-wrap: wrap; margin-bottom: 20px;
  }
  .langs { display: flex; gap: 7px; flex-wrap: wrap; }
  .lang-btn {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: "Orbitron", sans-serif; font-weight: 500; font-size: 0.8rem;
    letter-spacing: 0.1em; color: var(--muted);
    background: transparent; border: 1px solid var(--hair); border-radius: 999px;
    padding: 8px 15px; cursor: pointer; transition: all 0.18s ease;
  }
  .lang-btn:hover { color: var(--text); border-color: var(--hair-strong); }
  .lang-btn.active {
    color: #17181b; background: var(--text); border-color: var(--text);
    font-weight: 700;
  }
  .print-btn {
    font-family: "Orbitron", sans-serif; font-weight: 500; font-size: 0.8rem;
    letter-spacing: 0.1em; color: var(--text);
    background: transparent; border: 1px solid var(--hair-strong); border-radius: 999px;
    padding: 8px 15px; cursor: pointer; transition: all 0.18s ease;
  }
  .print-btn:hover { background: rgba(255, 255, 255, 0.08); }
  /* flag before the code – Apple's picture on every system via js/apple-emoji.js */
  .lang-flag { font-size: 1.35em; line-height: 1; }

  /* ---------- edit mode (?edit=1): login + save in the topbar ---------- */
  .editbar { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
  .editbar input {
    font: inherit; font-size: 0.85rem; color: var(--text);
    background: rgba(255, 255, 255, 0.05); border: 1px solid var(--hair);
    border-radius: 999px; padding: 7px 13px; max-width: 220px;
  }
  .editbar input:focus { outline: none; border-color: var(--hair-strong); }
  .edit-status { color: var(--muted); font-size: 0.8rem; letter-spacing: 0.03em; }
  /* busy state ("Übersetzen …", "Speichern …"): spinner + breathing text */
  .edit-status:not(:empty) {
    display: inline-flex; align-items: center;
    border: 1px solid var(--hair); border-radius: 999px;
    padding: 7px 13px; background: rgba(255, 255, 255, 0.05);
  }
  .login-dlg .edit-status:not(:empty) { justify-content: center; }
  .edit-status.busy { color: var(--text); animation: cv-breathe 1.2s ease-in-out infinite; }
  .edit-status.busy::before {
    content: ""; flex: none; width: 0.85em; height: 0.85em; margin-right: 7px;
    border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%;
    animation: cv-spin 0.8s linear infinite;
  }
  @keyframes cv-spin { to { transform: rotate(360deg); } }
  @keyframes cv-breathe { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }

  /* ---------- login dialog (pencil) ---------- */
  .login-overlay, .docs-overlay {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.55); backdrop-filter: blur(6px);
    padding: 16px;
  }
  .login-overlay[hidden], .docs-overlay[hidden] { display: none; }
  .login-dlg, .docs-dlg {
    position: relative; width: min(360px, 100%);
    display: flex; flex-direction: column; gap: 12px;
    background: linear-gradient(160deg, #2a2d34 0%, var(--card) 38%, #121316 100%);
    border: 1px solid var(--hair); border-radius: 18px;
    padding: 26px 24px 20px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
  }
  .login-dlg::before, .docs-dlg::before {
    content: ""; position: absolute; top: -1px; left: 12%; right: 12%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
  }
  .login-dlg h3, .docs-dlg h3 {
    font-family: "Orbitron", sans-serif; font-weight: 500;
    font-size: 0.95rem; color: #ffffff;
    letter-spacing: 0.22em; text-transform: uppercase;
    padding-bottom: 8px; margin-bottom: 2px;
    background: linear-gradient(90deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.12) 55%, transparent 95%)
                bottom left / 100% 2px no-repeat;
  }
  .login-dlg input, .docs-dlg input {
    font: inherit; font-size: 0.9rem; color: var(--text);
    background: rgba(255, 255, 255, 0.05); border: 1px solid var(--hair);
    border-radius: 999px; padding: 10px 16px; width: 100%;
  }
  .login-dlg input:focus, .docs-dlg input:focus { outline: none; border-color: var(--hair-strong); }
  .login-row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .login-go { color: #17181b; background: var(--text); border-color: var(--text); font-weight: 700; }
  .login-go:hover { background: #ffffff; }
  .login-dlg .edit-status { min-height: 1.2em; text-align: center; }
  /* Pencil pill button – toggles edit mode. Muted when off, English green when on.
     (scaleX(-1): glyph mirrored so the pencil points right) */
  .edit-toggle {
    font-size: 1.05rem; line-height: 1; color: var(--muted);
    background: transparent; border: 1px solid var(--hair); border-radius: 999px;
    padding: 7px 13px 8px; cursor: pointer; transition: all 0.18s ease;
  }
  .edit-toggle .g { display: inline-block; transform: scaleX(-1); }
  .edit-toggle:hover { color: var(--text); border-color: var(--hair-strong); }
  .edit-toggle.on, .edit-toggle.on:hover { color: #3fae6d; border-color: #3fae6d; }
  [contenteditable] { outline: 1px dashed var(--hair-strong); outline-offset: 3px; border-radius: 3px; }

  /* ---------- documents dialog: grid of first pages, then all pages of one document ---------- */
  html.docs-open { overflow: hidden; }
  .docs-dlg {
    width: min(800px, 100%);
    max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px);
    padding: 22px 0 0; gap: 14px;
  }
  .docs-dlg [hidden] { display: none !important; }
  .docs-head { display: flex; align-items: center; gap: 8px; padding: 0 22px; }
  .docs-head h3 { flex: 1; min-width: 0; margin-bottom: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .docs-body {
    overflow-y: auto; overscroll-behavior: contain; padding: 4px 22px 24px;
    scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.28) transparent;
  }
  .docs-body::-webkit-scrollbar { width: 8px; }
  .docs-body::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.28); border-radius: 999px; }
  .icon-btn {
    flex: none; display: inline-flex; align-items: center; justify-content: center;
    width: 38px; height: 38px; color: var(--muted);
    background: transparent; border: 1px solid var(--hair); border-radius: 999px;
    cursor: pointer; transition: all 0.18s ease;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--hair-strong); }
  .icon-btn svg { width: 18px; height: 18px; }
  /* copy link: the chain turns into a green tick for a moment */
  .icon-btn .ok, .icon-btn.done .ic { display: none; }
  .icon-btn.done .ok { display: block; }
  .icon-btn.done, .icon-btn.done:hover { color: #3fae6d; border-color: #3fae6d; }
  /* password form (locked documents) */
  .docs-lock {
    display: flex; flex-direction: column; gap: 12px;
    max-width: 340px; margin: 22px auto 14px; text-align: center;
  }
  .docs-lock .docs-note { margin-bottom: 4px; }
  .docs-lock input { font-size: 1rem; }  /* 16px: no zoom-on-focus on iPhone */
  .docs-lock .login-go { align-self: center; min-width: 150px; }
  .docs-lock .edit-status { align-self: center; }
  .docs-note { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; }
  .docs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px 20px; }
  .doc-card {
    display: flex; flex-direction: column; gap: 4px; text-align: left;
    font: inherit; color: var(--text); background: transparent; border: none; padding: 0;
    cursor: pointer;
  }
  .doc-card img {
    display: block; width: 100%; aspect-ratio: 210 / 297; margin-bottom: 6px;
    object-fit: cover; object-position: top; background: #fff;
    border: 1px solid var(--hair); border-radius: 6px;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45);
    transition: transform 0.18s ease, border-color 0.18s ease;
  }
  .doc-card:hover img, .doc-card:focus-visible img { transform: translateY(-3px); border-color: var(--hair-strong); }
  /* more than one page: a second sheet peeks out behind the first */
  .doc-card.multi img { box-shadow: 5px 5px 0 -1px #c9ccd1, 0 8px 22px rgba(0, 0, 0, 0.45); }
  .docs-group {
    font-family: "Orbitron", sans-serif; font-weight: 500; font-size: 0.78rem;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted);
    margin: 30px 0 14px;
  }
  .docs-group:first-child { margin-top: 0; }
  .doc-card:focus-visible { outline: none; }
  .docs-dlg .dt { display: block; font-weight: 600; font-size: 0.88rem; line-height: 1.35; }
  .docs-dlg .ds { display: block; color: var(--muted); font-size: 0.8rem; line-height: 1.35; }
  .docs-cap { margin-bottom: 14px; }
  .docs-cap .dt { font-size: 1rem; }
  .docs-cap .ds { font-size: 0.85rem; }
  .docs-pages { display: flex; flex-direction: column; gap: 16px; }
  .docs-pages a { display: block; cursor: zoom-in; }
  .docs-pages img:not([src]) { aspect-ratio: 210 / 297; }
  .docs-pages img {
    display: block; width: 100%; height: auto; background: #fff;
    border-radius: 6px; box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45);
  }
  [contenteditable]:focus { outline: 1px solid #fff; }

  /* ---------- card ---------- */
  .card {
    /* Diagonal sheen: lighter top-left fading into near-black bottom-right */
    background: linear-gradient(160deg, #2a2d34 0%, var(--card) 38%, #121316 100%);
    border: 1px solid var(--hair); border-radius: 18px;
    padding: clamp(24px, 4.5vw, 52px);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
    position: relative;
  }
  /* Polished top edge: bright highlight fading out to both sides */
  .card::before {
    content: ""; position: absolute; top: -1px; left: 8%; right: 8%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
  }

  /* ---------- header ---------- */
  header.cv-head {
    display: flex; gap: clamp(18px, 3vw, 36px); align-items: center;
    flex-wrap: wrap; margin-bottom: 6px;
  }
  .head-text { flex: 1 1 320px; min-width: 260px; }
  h1 {
    font-family: "Orbitron", sans-serif; font-weight: 700;
    font-size: clamp(1.4rem, 4.2vw, 2.2rem);
    color: #ffffff; letter-spacing: 0.06em; line-height: 1.18;
    margin-bottom: 13px;
    /* Brushed-metal gradient text (screen only; print resets to solid) */
    background: linear-gradient(180deg, #ffffff 0%, #e8ebef 32%, #9aa1ab 50%, #d4d9df 62%, #626973 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  /* Contact details stacked – one line per item, no separators needed */
  .contact { color: var(--muted); font-size: 0.94rem; }
  .contact .ci { display: block; margin: 2px 0; }
  .contact a { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--hair-strong); }
  .contact a:hover { color: #ffffff; border-bottom-color: #ffffff; }
  .photo {
    width: clamp(120px, 18vw, 164px); height: clamp(120px, 18vw, 164px);
    border-radius: 12px; object-fit: cover; object-position: center 20%;
    border: 1px solid var(--hair-strong);
    filter: grayscale(1) contrast(1.04);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
  }

  /* ---------- sections ---------- */
  section { margin-top: clamp(24px, 3.6vw, 38px); }
  h2 {
    font-family: "Orbitron", sans-serif; font-weight: 500;
    font-size: clamp(0.88rem, 2.2vw, 1rem);
    color: #ffffff; letter-spacing: 0.22em; text-transform: uppercase;
    padding-bottom: 8px; margin-bottom: 14px;
    /* Hairline that fades out to the right instead of a flat border */
    border-bottom: none;
    background: linear-gradient(90deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.12) 55%, transparent 95%)
                bottom left / 100% 2px no-repeat;
  }
  p.lead { text-align: justify; hyphens: auto; }
  ul.plain { list-style: none; }
  ul.plain li {
    padding-left: 20px; position: relative; margin-bottom: 8px;
    text-align: justify; hyphens: auto;
  }
  ul.plain li::before { content: "–"; position: absolute; left: 1px; color: var(--muted); }

  /* jobs */
  .job { margin-bottom: 17px; }
  .job-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
  .job-role { font-weight: 600; color: #ffffff; }
  .job-date { color: var(--muted); font-size: 0.85rem; white-space: nowrap; font-family: "Orbitron", sans-serif; font-weight: 500; letter-spacing: 0.05em; }
  .job-org { color: var(--muted); font-style: italic; font-size: 0.94rem; margin: 1px 0 4px; }
  .job ul.plain li { margin-bottom: 4px; }

  footer {
    text-align: center; color: var(--muted); font-size: 0.8rem;
    margin-top: 28px; letter-spacing: 0.03em;
  }
  footer a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--hair-strong); }
  footer a:hover { color: var(--text); }

  noscript { display: block; text-align: center; color: var(--muted); padding: 30px 0; }
  .print-footer { display: none; } /* print only */

  @media (max-width: 560px) {
    body { padding: 14px 8px 32px; }
    header.cv-head { flex-direction: column-reverse; text-align: center; }
    .photo { width: 148px; height: 148px; }
    .contact .row { line-height: 1.7; }
    .job-head { flex-direction: column; gap: 0; }
    p.lead, ul.plain li { text-align: left; }
    .docs-overlay { padding: 8px; }
    .docs-dlg { max-height: calc(100vh - 16px); max-height: calc(100dvh - 16px); padding-top: 16px; }
    .docs-head { padding: 0 14px; gap: 6px; }
    .docs-body { padding: 4px 14px 18px; }
    .docs-grid { grid-template-columns: repeat(2, 1fr); gap: 18px 14px; }
    /* phone: flags only, so all five fit in one row */
    .lang-code { display: none; }
    .lang-btn { padding: 7px 11px; }
  }

  /* ---------- print: clean light CV, greyscale, A4 ---------- */
  @media print {
    @page { size: A4; margin: 12mm 15mm 16mm; } /* extra bottom room for our own footer */
    body { background: #fff; color: #1c1e21; padding: 0; font-size: 10.5pt; line-height: 1.45; }
    .topbar, footer, noscript, .login-overlay, .docs-overlay { display: none !important; }
    [contenteditable] { outline: none !important; }
    .wrap { max-width: none; }
    .card { background: #fff; border: none; box-shadow: none; border-radius: 0; padding: 0; }
    .card::before { display: none; }
    /* PDF generator mode (?pdf=1): Chrome draws the footer into the real
       page margin via footerTemplate – hide the in-page fallback footer */
    html.pdfmode .print-footer { display: none !important; }
    /* Browser print: footer ONCE at the end of the document, in normal flow.
       A repeating fixed overlay per page inevitably masks or collides with
       the last text line on full pages (browser CSS cannot reserve per-page
       space) – the generated PDFs (scripts/make-cv-pdfs.mjs) carry the
       per-page footer with page numbers in the real margin instead. */
    .print-footer {
      display: block;
      text-align: center;
      border-top: 0.5pt solid #d5d8dc; padding-top: 2mm; margin-top: 8mm;
      font-family: "Orbitron", sans-serif; font-weight: 500;
      font-size: 7.5pt; letter-spacing: 0.16em; color: #9aa0a8;
      break-inside: avoid;
    }
    header.cv-head { gap: 8mm; margin-bottom: 1mm; }
    h1 {
      color: #111; font-size: 18.5pt; letter-spacing: 0.05em; margin-bottom: 7px;
      background: none; -webkit-text-fill-color: initial;
    }
    .contact { color: #55595f; font-size: 9.5pt; }
    .contact a { color: #1c1e21; border-bottom: none; }
    /* px instead of mm: Firefox drops the img from printouts when it is
       sized in physical units (verified 2026-08-06, FF on macOS) */
    .photo {
      width: 114px; height: 114px;
      box-shadow: none; border: 1px solid #d5d8dc; filter: grayscale(1);
    }
    section { margin-top: 5.5mm; }
    h2 {
      color: #111; border-bottom: 1px solid #111; background: none;
      font-size: 10pt; letter-spacing: 0.15em;
      padding-bottom: 4px; margin-bottom: 8px;
      break-after: avoid;
    }
    ul.plain li { margin-bottom: 4px; }
    ul.plain li::before { color: #9aa0a8; }
    .job { margin-bottom: 9px; break-inside: avoid; }
    .job-role { color: #111; }
    .job-date { color: #55595f; font-size: 8.5pt; }
    .job-org { color: #55595f; }
    /* NOTE: no break-inside:avoid on whole sections – long sections (experience)
       would otherwise jump to the next page and leave huge gaps */
    p.lead, ul.plain li { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <nav class="langs" id="langs" aria-label="Language selection"></nav>
    <button class="edit-toggle" id="editToggle" type="button" aria-label="Bearbeiten"
      aria-pressed="false" title="Bearbeiten"><span class="g">&#9998;</span></button>
    <div class="editbar" id="editBar" hidden>
      <span class="edit-status" id="editStatus"></span>
    </div>
    <button class="print-btn" id="docsBtn" type="button">Dokumente</button>
    <button class="print-btn" id="printBtn" type="button" onclick="window.print()">Drucken / PDF</button>
  </div>

  <div class="card">
    <header class="cv-head">
      <div class="head-text">
        <h1 id="cvName"></h1>
        <div class="contact" id="cvContact"></div>
      </div>
      <img class="photo" id="cvPhoto" src="resources/mra.jpg" alt="">
    </header>
    <main id="cvMain"></main>
  </div>

  <footer>© 2026 Dr. Michael R. Alvers · <a href="https://docalvers.de">docalvers.de</a> · <a href="cv-help.html">Hilfe</a></footer>
</div>

<!-- Login dialog (pencil click) – same sleek card look as the CV itself -->
<div class="login-overlay" id="loginOverlay" hidden>
  <div class="login-dlg" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
    <h3 id="loginTitle">Login</h3>
    <input id="editEmail" type="email" autocomplete="email" placeholder="E-Mail" aria-label="E-Mail">
    <input id="editPwd" type="password" autocomplete="current-password" placeholder="Passwort" aria-label="Passwort">
    <div class="login-row">
      <button class="print-btn" id="loginCancelBtn" type="button">Abbrechen</button>
      <button class="print-btn login-go" id="editLoginBtn" type="button">Login</button>
    </div>
    <span class="edit-status" id="dlgStatus"></span>
  </div>
</div>

<!-- Documents dialog (button left of print): scans of certificates and references -->
<div class="docs-overlay" id="docsOverlay" hidden>
  <div class="docs-dlg" role="dialog" aria-modal="true" aria-labelledby="docsTitle">
    <div class="docs-head">
      <button class="icon-btn" id="docsGridBtn" type="button" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
          <rect x="4" y="4" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1"/>
          <rect x="4" y="13.5" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1"/>
        </svg>
      </button>
      <h3 id="docsTitle">Dokumente</h3>
      <button class="icon-btn" id="docsPrev" type="button" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button class="icon-btn" id="docsNext" type="button" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <button class="icon-btn" id="docsLink" type="button">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

/* ============================================================
   Rendering – DOM built via createElement (no innerHTML for content)
   ============================================================ */
const LANG_ORDER = ["de", "en", "es", "fr", "it"];
const LANG_FLAGS = { de: "🇩🇪", en: "🇬🇧", es: "🇪🇸", fr: "🇫🇷", it: "🇮🇹" };

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

/* el() plus a data-path pointing into the current CV language object –
   the edit mode uses these paths to write edited text back */
function pathEl(tag, cls, text, path) {
  const n = el(tag, cls, text);
  n.dataset.path = path;
  return n;
}

function renderContact(container, items) {
  container.replaceChildren();
  const row = el("div", "row");
  items.forEach((it, i) => {
    const ci = el("span", "ci");
    ci.dataset.path = "contact." + i + ".t";
    if (it.href) {
      const a = document.createElement("a");
      a.href = it.href;
      a.textContent = it.t;
      if (it.href.startsWith("http")) { a.target = "_blank"; a.rel = "noopener"; }
      ci.appendChild(a);
    } else {
      ci.appendChild(document.createTextNode(it.t));
    }
    row.appendChild(ci);
  });
  container.appendChild(row);
}

function renderSections(main, sections) {
  main.replaceChildren();
  sections.forEach((s, si) => {
    const sp = "sections." + si;
    const sec = el("section");
    sec.appendChild(pathEl("h2", null, s.h, sp + ".h"));
    if (s.p) sec.appendChild(pathEl("p", "lead", s.p, sp + ".p"));
    if (s.items) {
      const ul = el("ul", "plain");
      s.items.forEach((t, ii) => ul.appendChild(pathEl("li", null, t, sp + ".items." + ii)));
      sec.appendChild(ul);
    }
    if (s.jobs) {
      s.jobs.forEach((j, ji) => {
        const jp = sp + ".jobs." + ji;
        const job = el("div", "job");
        const head = el("div", "job-head");
        head.appendChild(pathEl("span", "job-role", j.r, jp + ".r"));
        head.appendChild(pathEl("span", "job-date", j.d, jp + ".d"));
        job.appendChild(head);
        job.appendChild(pathEl("div", "job-org", j.o, jp + ".o"));
        if (j.b && j.b.length) {
          const ul = el("ul", "plain");
          j.b.forEach((t, bi) => ul.appendChild(pathEl("li", null, t, jp + ".b." + bi)));
          job.appendChild(ul);
        }
        sec.appendChild(job);
      });
    }
    main.appendChild(sec);
  });
}

function setLang(code, updateUrl) {
  const cv = CV[code];
  if (!cv) return;
  /* user switches language while holding unsaved edits → auto-save the old language
     first (sync DOM collect, async upsert) so the re-render cannot lose anything */
  if (updateUrl && window.CvEdit && CvEdit.active && CvEdit.dirty) CvEdit.autoSave();
  document.documentElement.lang = code;
  document.title = cv.title;
  const nameEl = document.getElementById("cvName");
  nameEl.textContent = cv.name;
  nameEl.dataset.path = "name";
  const photo = document.getElementById("cvPhoto");
  photo.alt = cv.photoAlt;
  photo.style.display = cv.photo === false ? "none" : "";
  document.getElementById("printBtn").textContent = cv.printLabel;
  document.getElementById("docsBtn").textContent = DOCS_UI[code].label;
  Docs.render();
  document.getElementById("printFooter").textContent = cv.docfoot;
  renderContact(document.getElementById("cvContact"), cv.contact);
  renderSections(document.getElementById("cvMain"), cv.sections);
  document.querySelectorAll(".lang-btn").forEach(b => {
    const active = b.dataset.lang === code;
    b.classList.toggle("active", active);
    b.setAttribute("aria-pressed", active ? "true" : "false");
  });
  try { localStorage.setItem("cv-lang", code); } catch (e) { /* private mode */ }
  if (updateUrl) {
    const url = new URL(location.href);
    url.searchParams.set("lang", code);
    history.replaceState(null, "", url);
  }
  /* re-render wiped the contenteditable flags → re-apply while editing */
  if (window.CvEdit && CvEdit.active) { CvEdit.applyEditable(); CvEdit.takeSnapshot(); }
}

function pickInitialLang() {
  const fromUrl = new URLSearchParams(location.search).get("lang");
  if (fromUrl && CV[fromUrl.toLowerCase()]) return fromUrl.toLowerCase();
  try {
    const stored = localStorage.getItem("cv-lang");
    if (stored && CV[stored]) return stored;
  } catch (e) { /* private mode */ }
  for (const l of (navigator.languages || [navigator.language || "en"])) {
    const c = String(l).slice(0, 2).toLowerCase();
    if (CV[c]) return c;
  }
  return "en";
}

/* PDF generator mode: footer comes from Chrome's footerTemplate instead */
if (new URLSearchParams(location.search).get("pdf") === "1") {
  document.documentElement.classList.add("pdfmode");
}

/* build language buttons */
const nav = document.getElementById("langs");
for (const code of LANG_ORDER) {
  const b = el("button", "lang-btn");
  const flag = el("span", "lang-flag", LANG_FLAGS[code]);
  flag.setAttribute("aria-hidden", "true");
  b.append(flag, el("span", "lang-code", CV[code].label));
  b.type = "button";
  b.dataset.lang = code;
  b.lang = code;
  b.title = CV[code].langName;
  b.setAttribute("aria-label", CV[code].langName);
  b.setAttribute("aria-pressed", "false");
  b.addEventListener("click", () => setLang(code, true));
  nav.appendChild(b);
}

/* documents dialog: grid of first pages ↔ all pages of one document.
   The scans are encrypted (scripts/cv-docs.mjs): key.json holds the data key
   wrapped with PBKDF2(password); every <page>.bin is "CVD1" | iv 12 | AES-GCM.
   The unwrapped key is remembered on the device as a non-extractable CryptoKey
   in IndexedDB – the password itself is never stored. Direct links:
   cv.html#docs (overview) and cv.html#docs/<first page> (one document). */
const Docs = (function () {
  const $ = (id) => document.getElementById(id);
  const overlay = $("docsOverlay");
  const body = $("docsBody");
  const note = $("docsNote");
  const grid = $("docsGrid");
  const view = $("docsView");
  const form = $("docsLock");
  const pwIn = $("docsPw");
  const goBtn = $("docsGo");
  const statusEl = $("docsStatus");
  const gridBtn = $("docsGridBtn");
  const prevBtn = $("docsPrev");
  const nextBtn = $("docsNext");
  const linkBtn = $("docsLink");
  const lockBtn = $("docsLockBtn");
  const closeBtn = $("docsClose");
  let current = -1;      /* -1 = grid, else index into DOCS */
  let dataKey = null;    /* AES-GCM CryptoKey of all scans, null = locked */
  let checking = false;  /* looking for a key remembered on this device */
  let urls = {};         /* page name -> promise of a blob: URL */
  let keyFileP = null;

  const code = () => DOCS_UI[document.documentElement.lang] ? document.documentElement.lang : "en";
  const docId = (d) => d.pages[0].replace(/-1$/, "");
  const b64 = (t) => Uint8Array.from(atob(t), (c) => c.charCodeAt(0));

  /* ---- crypto ---- */
  function keyFile() {
    keyFileP = keyFileP || fetch(DOCS_DIR + "key.json", { cache: "no-cache" }).then((r) => {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).catch((e) => { keyFileP = null; throw e; });
    return keyFileP;
  }

  async function keyFromPassword(pw) {
    const kf = await keyFile();
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const kek = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64(kf.salt), iterations: kf.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    let raw;
    try { raw = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(kf.iv) }, kek, b64(kf.key)); }
    catch (e) { const err = new Error(DOCS_UI[code()].wrong); err.pw = true; throw err; }
    return crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);  /* non-extractable */
  }

  /* a remembered key fits as long as the scans were sealed with it (new password = new key) */
  async function keyFits(key) {
    const c = b64((await keyFile()).check);
    try { await crypto.subtle.decrypt({ name: "AES-GCM", iv: c.subarray(0, 12) }, key, c.subarray(12)); return true; }
    catch (e) { return false; }
  }

  function blobUrl(name) {
    urls[name] = urls[name] || fetch(DOCS_DIR + name + ".bin").then(async (r) => {
      if (!r.ok) throw new Error("HTTP " + r.status);
      const bin = new Uint8Array(await r.arrayBuffer());
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bin.subarray(4, 16) }, dataKey, bin.subarray(16));
      return URL.createObjectURL(new Blob([plain], { type: "image/jpeg" }));
    }).catch((e) => { delete urls[name]; throw e; });
    return urls[name];
  }

  /* IndexedDB "cv-docs", store "keys", entry "data" – every access may fail (private mode) */
  function idb(mode, fn) {
    return new Promise((resolve, reject) => {
      const rq = indexedDB.open("cv-docs", 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore("keys");
      rq.onerror = () => reject(rq.error);
      rq.onsuccess = () => {
        const tx = rq.result.transaction("keys", mode);
        const req = fn(tx.objectStore("keys"));
        tx.oncomplete = () => { rq.result.close(); resolve(req.result); };
        tx.onerror = () => { rq.result.close(); reject(tx.error); };
      };
    });
  }
  const loadKey = () => idb("readonly", (st) => st.get("data")).catch(() => null);
  const saveKey = (key) => idb("readwrite", (st) => st.put(key, "data")).catch(() => {});
  const dropKey = () => idb("readwrite", (st) => st.delete("data")).catch(() => {});

  /* the dialog unlocks by script, so Chrome would not offer to save the password by itself */
  function rememberInChrome(pw) {
    if (!window.PasswordCredential || !navigator.credentials) return Promise.resolve();
    const store = navigator.credentials.store(
      new PasswordCredential({ id: "cv-dokumente", name: "Dokumente – Dr. Michael R. Alvers", password: pw })).catch(() => {});
    return Promise.race([store, new Promise((r) => setTimeout(r, 1500))]);
  }

  /* ---- rendering ---- */
  function caption(d) {
    const L = code();
    const sub = d.s[L] + (d.pages.length > 1 ? " · " + d.pages.length + " " + DOCS_UI[L].pages : "");
    return [el("span", "dt", d.t[L]), el("span", "ds", sub)];
  }

  function fill(img, name, alt) {
    blobUrl(name).then((u) => { img.src = u; img.alt = alt; }).catch(() => {});
  }

  function renderGrid() {
    grid.replaceChildren();
    let box = null, group = null;
    DOCS.forEach((d, i) => {
      if (d.g !== group) {
        group = d.g;
        grid.appendChild(el("h4", "docs-group", DOCS_GROUPS[group][code()]));
        box = grid.appendChild(el("div", "docs-grid"));
      }
      const b = el("button", d.pages.length > 1 ? "doc-card multi" : "doc-card");
      b.type = "button";
      const img = el("img");
      fill(img, d.pages[0] + "-thumb", "");
      b.append(img, ...caption(d));
      b.addEventListener("click", () => show(i));
      box.appendChild(b);
    });
  }

  function renderView() {
    const d = DOCS[current];
    const L = code();
    const cap = el("p", "docs-cap");
    cap.append(...caption(d));
    const pages = el("div", "docs-pages");
    d.pages.forEach((p, pi) => {
      const a = el("a");
      a.target = "_blank";
      a.rel = "noopener";
      const img = el("img");
      img.decoding = "async";
      blobUrl(p).then((u) => {
        a.href = img.src = u;
        img.alt = d.t[L] + (d.pages.length > 1 ? " – " + DOCS_UI[L].page + " " + (pi + 1) : "");
      }).catch(() => {});
      a.appendChild(img);
      pages.appendChild(a);
    });
    view.replaceChildren(cap, pages);
  }

  function status(t, busy) {
    statusEl.textContent = t;
    statusEl.classList.toggle("busy", !!busy);
  }

  /* the address bar always shows a link to what is open – that is what "copy link" sends */
  function syncHash() {
    const h = overlay.hidden ? "" : current >= 0 ? "#docs/" + docId(DOCS[current]) : "#docs";
    if (location.hash !== h) history.replaceState(null, "", location.pathname + location.search + h);
  }

  function render() {
    if (overlay.hidden) return;
    const ui = DOCS_UI[code()];
    $("docsTitle").textContent = ui.label;
    note.textContent = ui.note;
    $("docsLockNote").textContent = ui.locked;
    pwIn.placeholder = ui.pw;
    pwIn.setAttribute("aria-label", ui.pw);
    goBtn.textContent = ui.go;
    [[closeBtn, ui.close], [gridBtn, ui.grid], [prevBtn, ui.prev], [nextBtn, ui.next],
     [linkBtn, linkBtn.classList.contains("done") ? ui.linkDone : ui.link], [lockBtn, ui.lock]].forEach(([b, t]) => {
      b.title = t;
      b.setAttribute("aria-label", t);
    });
    const locked = !dataKey;
    const inView = !locked && current >= 0;
    form.hidden = !locked || checking;
    note.hidden = grid.hidden = locked || inView;
    view.hidden = !inView;
    gridBtn.hidden = prevBtn.hidden = nextBtn.hidden = !inView;
    lockBtn.hidden = locked || inView;
    if (inView) renderView(); else if (!locked) renderGrid();
    syncHash();
  }

  function show(i) {
    current = i;
    render();
    body.scrollTop = 0;
  }

  async function open(id) {
    const i = DOCS.findIndex((d) => docId(d) === id);
    current = i;
    overlay.hidden = false;
    document.documentElement.classList.add("docs-open");
    if (!dataKey) {
      checking = true;
      render();
      try {
        const key = await loadKey();
        if (key && await keyFits(key)) dataKey = key;
        else if (key) await dropKey();
      } catch (e) { /* offline or no IndexedDB → password form */ }
      checking = false;
    }
    show(current);
    (dataKey ? closeBtn : pwIn).focus();
  }

  function close() {
    overlay.hidden = true;
    document.documentElement.classList.remove("docs-open");
    syncHash();
    $("docsBtn").focus();
  }

  const step = (dir) => show((current + dir + DOCS.length) % DOCS.length);

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const pw = pwIn.value.trim();
    if (!pw) return;
    goBtn.disabled = true;
    status(DOCS_UI[code()].busy.replace(/\s*…$/, ""), true);
    try {
      dataKey = await keyFromPassword(pw);
      await saveKey(dataKey);
      await rememberInChrome(pw);
      pwIn.value = "";
      status("");
      show(current);
      closeBtn.focus();
    } catch (err) {
      status(err.pw ? err.message : "Fehler: " + err.message);
      pwIn.select();
    } finally {
      goBtn.disabled = false;
    }
  });

  lockBtn.addEventListener("click", () => {
    dataKey = null;
    dropKey();
    Object.values(urls).forEach((p) => p.then((u) => URL.revokeObjectURL(u)).catch(() => {}));
    urls = {};
    show(-1);
    pwIn.focus();
  });

  linkBtn.addEventListener("click", async () => {
    const url = new URL(location.href);
    url.searchParams.set("lang", code());  /* the recipient sees the same language */
    try { await navigator.clipboard.writeText(url.href); } catch (e) { return; }
    /* only the button changes – a full render would rebuild the open pages and lose the scroll position */
    const label = (t) => { linkBtn.title = t; linkBtn.setAttribute("aria-label", t); };
    linkBtn.classList.add("done");
    label(DOCS_UI[code()].linkDone);
    setTimeout(() => { linkBtn.classList.remove("done"); label(DOCS_UI[code()].link); }, 1600);
  });

  $("docsBtn").addEventListener("click", () => open());
  closeBtn.addEventListener("click", close);
  gridBtn.addEventListener("click", () => show(-1));
  prevBtn.addEventListener("click", () => step(-1));
  nextBtn.addEventListener("click", () => step(1));
  overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
  document.addEventListener("keydown", (e) => {
    if (overlay.hidden) return;
    const inView = dataKey && current >= 0;
    if (e.key === "Escape") { if (inView) show(-1); else close(); }
    else if (inView && e.key === "ArrowLeft") step(-1);
    else if (inView && e.key === "ArrowRight") step(1);
  });

  /* direct link: cv.html#docs or cv.html#docs/<first page> */
  const m = /^#docs(?:\/([\w-]+))?$/.exec(location.hash);
  if (m) open(m[1]);

  return { render };
})();

    });
    if (!res.ok) return;
    const rows = await res.json();
    let touched = false;
    for (const row of rows) {
      if (CV[row.lang] && row.data && typeof row.data === "object") {
        /* merge so newly baked-in fields survive an older DB row */
        CV[row.lang] = Object.assign({}, CV[row.lang], row.data);
        touched = true;
      }
    }
    if (touched) setLang(document.documentElement.lang, false);
  } catch (e) { /* offline → keep baked-in content */ }
}
const cvRemoteReady = loadRemoteCv();

/* ============================================================
   Edit mode (?edit=1) – login, contenteditable, save to DB
   ============================================================ */
const CvEdit = { active: false, dirty: false, snapshot: null, pending: {} };
window.CvEdit = CvEdit;

CvEdit.applyEditable = function () {
  document.querySelectorAll("[data-path]").forEach((n) => {
    n.contentEditable = "plaintext-only";
    if (!n.isContentEditable) n.contentEditable = "true"; /* browsers without plaintext-only */
  });
};

/* the save-diff (→ minimal translation set) is computed against this copy */
CvEdit.takeSnapshot = function () {
  CvEdit.snapshot = JSON.parse(JSON.stringify(CV[document.documentElement.lang]));
};

CvEdit.pendingCount = function () {
  return Object.values(CvEdit.pending).reduce((n, m) => n + Object.keys(m).length, 0);
};

function setByPath(obj, path, value) {
  const parts = path.split(".");
  let o = obj;
  for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
  o[parts[parts.length - 1]] = value;
}

function getByPath(obj, path) {
  let o = obj;
  for (const part of path.split(".")) {
    if (o === null || typeof o !== "object") return undefined;
    o = o[part];
  }
  return o;
}

(function initEdit() {
  const toggle = document.getElementById("editToggle");
  const bar = document.getElementById("editBar");
  const overlay = document.getElementById("loginOverlay");
  const email = document.getElementById("editEmail");
  const pwd = document.getElementById("editPwd");
  const loginBtn = document.getElementById("editLoginBtn");
  const cancelBtn = document.getElementById("loginCancelBtn");
  const statusEl = document.getElementById("editStatus");
  const dlgStatus = document.getElementById("dlgStatus");
  let sb = null;
  /* one status() feeds both places: dialog while logging in, topbar while saving.
     A trailing "…" marks a busy state -> spinner + pulse via .busy class */
  const status = (t) => {
    const busy = /…\s*$/.test(t);
    const txt = busy ? t.replace(/\s*…\s*$/, "") : t;
    [statusEl, dlgStatus].forEach((el) => {
      el.textContent = txt;
      el.classList.toggle("busy", busy);
    });
  };

  // ladeSkript: js/lade-skript.js

  async function ensureSb() {
    if (sb) return sb;
    if (!window.supabase) await ladeSkript("js/vendor/supabase.min.js");
    /* own storageKey: same-origin apps (tracker!) log in with their own Supabase
       users – without this the pencil would silently reuse THEIR session */
    sb = window.supabase.createClient(DB_URL, DB_KEY, { auth: { storageKey: "cv-auth" } });
    return sb;
  }

  function showLogin() {
    overlay.hidden = false;
    status("");
    email.focus();
  }

  function startEditing() {
    overlay.hidden = true;
    pwd.value = "";
    bar.hidden = false;
    CvEdit.active = true;
    CvEdit.applyEditable();
    CvEdit.takeSnapshot();
    toggle.classList.add("on");
    toggle.setAttribute("aria-pressed", "true");
    status("");
  }

  /* leave edit mode visually; the bar stays visible while save/translate report status */
  function exitEditingUi() {
    document.querySelectorAll("[data-path]").forEach((n) => n.removeAttribute("contenteditable"));
    CvEdit.active = false;
    toggle.classList.remove("on");
    toggle.setAttribute("aria-pressed", "false");
  }

  async function onToggle() {
    if (CvEdit.active) {
      /* pencil off = auto-save, then auto-translate whatever changed */
      const code = document.documentElement.lang;
      const hadEdits = CvEdit.dirty;
      collect(code); /* sync: DOM → CV object + pending, before the editable flags go away */
      exitEditingUi();
      try {
        if (hadEdits) {
          status("Speichern …");
          await persist(code);
          status("Gespeichert ✓ (" + code.toUpperCase() + ")");
        }
        if (CvEdit.pendingCount()) await translate();
      } catch (e) {
        CvEdit.dirty = true; /* next pencil-off retries the save */
        status("Fehler: " + e.message);
        return; /* keep the bar visible so the error is readable */
      }
      setTimeout(() => { if (!CvEdit.active) { bar.hidden = true; status(""); } }, 2500);
      return;
    }
    if (!overlay.hidden) { overlay.hidden = true; return; } /* dialog open → close it */
    try { /* valid session from last time? → skip the login form */
      const client = await ensureSb();
      const { data } = await client.auth.getSession();
      if (data && data.session) { startEditing(); return; }
    } catch (e) { /* fall through to login */ }
    showLogin();
  }

  async function login() {
    status("Login …");
    try {
      const client = await ensureSb();
      /* sign-in ONLY – no signUp here, the account is created in the Supabase dashboard */
      const { error } = await client.auth.signInWithPassword({
        email: email.value.trim(), password: pwd.value
      });
      if (error) { status("Login fehlgeschlagen: " + error.message); return; }
      startEditing();
    } catch (e) { status("Fehler: " + e.message); }
  }

  /* sync: pull every edited text node back into the CV object; the diff vs the snapshot
     becomes the minimal translation set (sections only – name/contact stay manual) */
  function collect(code) {
    document.querySelectorAll("[data-path]").forEach((n) => {
      const path = n.dataset.path;
      const txt = n.textContent.replace(/\s+/g, " ").trim();
      if (path.indexOf("sections.") === 0 && CvEdit.snapshot &&
          getByPath(CvEdit.snapshot, path) !== txt) {
        const p = CvEdit.pending[code] = CvEdit.pending[code] || {};
        p[path] = txt;
      }
      setByPath(CV[code], path, txt);
    });
    CvEdit.dirty = false;
    CvEdit.takeSnapshot();
  }

  async function persist(code) {
    const client = await ensureSb();
    const { error } = await client.from("cv_content").upsert(
      { lang: code, data: CV[code], updated_at: new Date().toISOString() });
    if (error) throw new Error(error.message);
  }

  /* language switch while editing (called from setLang BEFORE the re-render) */
  CvEdit.autoSave = function () {
    const code = document.documentElement.lang;
    collect(code);
    persist(code).then(() => status("Gespeichert ✓ (" + code.toUpperCase() + ")"))
      .catch((e) => { CvEdit.dirty = true; status("Fehler: " + e.message); });
  };

  async function translate() {
    status("Übersetzen …");
    const client = await ensureSb();
    const { data: sess } = await client.auth.getSession();
    if (!sess || !sess.session) throw new Error("Bitte neu einloggen");
    /* seed rows for languages not in the DB yet – the function only patches existing rows */
    const res = await fetch(DB_URL + "/rest/v1/cv_content?select=lang", {
      headers: { apikey: DB_KEY, Authorization: "Bearer " + DB_KEY }
    });
    const have = res.ok ? (await res.json()).map((r) => r.lang) : [];
    const missing = LANG_ORDER.filter((l) => have.indexOf(l) < 0);
    if (missing.length) {
      const { error } = await client.from("cv_content").upsert(missing.map((l) => (
        { lang: l, data: CV[l], updated_at: new Date().toISOString() })));
      if (error) throw new Error(error.message);
    }
    for (const src of Object.keys(CvEdit.pending)) {
      const changes = Object.keys(CvEdit.pending[src]).map((path) => (
        { path, text: CvEdit.pending[src][path] }));
      if (!changes.length) { delete CvEdit.pending[src]; continue; }
      const r = await fetch(DB_URL + "/functions/v1/cv-translate", {
        method: "POST",
        headers: {
          "Content-Type": "application/json", apikey: DB_KEY,
          Authorization: "Bearer " + sess.session.access_token
        },
        body: JSON.stringify({ src: src, changes: changes })
      });
      const out = await r.json().catch(() => ({}));
      if (!r.ok || !out.ok) throw new Error(out.error || ("HTTP " + r.status));
      delete CvEdit.pending[src];
    }
    await loadRemoteCv(); /* re-render with the fresh translations */
    status("Übersetzt ✓");
  }

  toggle.addEventListener("click", onToggle);
  loginBtn.addEventListener("click", login);
  pwd.addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
  cancelBtn.addEventListener("click", () => { overlay.hidden = true; });
  overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.hidden = true; });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !overlay.hidden) overlay.hidden = true;
  });
  document.addEventListener("input", (e) => {
    if (CvEdit.active && e.target.closest && e.target.closest("[data-path]")) CvEdit.dirty = true;
  });
  window.addEventListener("beforeunload", (e) => {
    if (CvEdit.dirty || CvEdit.pendingCount()) { e.preventDefault(); e.returnValue = ""; }
  });

  /* edit mode starts OFF – the pencil is the only way in; drop a stale ?edit=1 from the URL */
  if (new URLSearchParams(location.search).get("edit") === "1") {
    const url = new URL(location.href);
    url.searchParams.delete("edit");
    history.replaceState(null, "", url);
  }
})();
</script>
</body>
