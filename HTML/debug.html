<!DOCTYPE html>
<html lang="de">
<!-- Rain-radar palette debug: DWD original bins vs the calibrated RV recolour, on a shared mm/h axis.
     Standalone, no deps. Edit DWD_STOPS / RV_STOPS below to compare candidates. -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rain Radar — Palette Debug</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: rgb(8, 20, 42); --bg2: rgb(14, 36, 78); --orange: rgb(245, 194, 66); }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 24px; background: var(--bg); color: #fff;
            font-family: 'Orbitron', sans-serif;
        }
        h1 { font-size: 1.1rem; color: var(--orange); letter-spacing: 1px; margin: 0 0 4px; }
        .sub { font-size: 0.72rem; color: rgba(255,255,255,.55); margin: 0 0 22px; }
        h2 { font-size: 0.8rem; letter-spacing: 1px; margin: 26px 0 8px; color: rgba(255,255,255,.85); }
        .bar { height: 26px; border-radius: 6px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,.12); }
        .grid { display: grid; grid-template-columns: repeat(15, 1fr); gap: 2px; }
        .cell { display: flex; flex-direction: column; align-items: center; }
        .sw { width: 100%; height: 40px; border-radius: 4px; border: 1px solid rgba(255,255,255,.15); }
        .mm { font-size: 0.52rem; color: rgba(255,255,255,.7); margin-bottom: 4px; text-align: center;
              font-family: Arial, sans-serif; min-height: 22px; display: flex; align-items: center; }
        .rgb { font-size: 0.78rem; color: rgba(255,255,255,.85); margin-top: 6px;
               font-family: Arial, sans-serif; letter-spacing: 0; text-align: center; }
        .row { background: var(--bg2); padding: 12px; border-radius: 10px; margin-bottom: 8px; }
    </style>
    <link rel="icon" type="image/svg+xml" href="resources/favicon.svg">
    <link rel="icon" type="image/png" sizes="256x256" href="resources/favicon.png">
</head>

<body>
    <h1>Rain Radar — Palette Debug</h1>
    <p class="sub">DWD-Originalbins (mm/h) ↔ kalibrierter RV-Recolor. Gleiche mm/h-Achse. Werte zentral aus js/rain-palette.js.</p>
    <div id="out"></div>

    <!-- Palettes AND the recolour math come from the SAME central source as the live radar. -->
    <script src="js/rain-palette.js"></script>
    <script src="js/rain-recolor.js"></script>
    <script>
        // mm/h axis labels (debug-only; the colours live in rain-palette.js).
        const MMH = ['0.1–0.2', '0.2–0.4', '0.4–1', '1–2', '2–3', '3–5', '5–7.5', '7.5–10',
            '10–15', '15–30', '30–45', '45–75', '75–100', '100–150', '≥150'];
        const DWD_STOPS = (window.RainPalette && RainPalette.DWD_STOPS) || [];
        const RV_STOPS = (window.RainPalette && RainPalette.RV_STOPS) || [];

        const hex = c => '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
        const css = c => 'rgb(' + c.join(',') + ')';
        const gradient = stops => 'linear-gradient(90deg,' +
            stops.map((c, i) => css(c) + ' ' + (i / (stops.length - 1) * 100).toFixed(1) + '%').join(',') + ')';

        function block(title, stops, labels) {
            const cells = stops.map((c, i) =>
                '<div class="cell">'
                + '<div class="mm">' + labels[i] + '</div>'
                + '<div class="sw" style="background:' + css(c) + '"></div>'
                + '<div class="rgb">' + c.join(', ') + '</div>'
                + '</div>').join('');
            return '<h2>' + title + '</h2>'
                + '<div class="bar" style="background:' + gradient(stops) + '"></div>'
                + '<div class="row"><div class="grid">' + cells + '</div></div>';
        }

        const out = document.getElementById('out');
        out.innerHTML =
            block('DWD — Originalpalette · mm/h (gemessen aus der Legende)', DWD_STOPS, MMH)
            + block('RV — Output-Stops · mm/h (unsere Rampe, Hellblau am unteren Ende)', RV_STOPS, MMH);

        // ---- continuous strips: EXACTLY what the renderer draws (256+ steps), via the SAME
        //      RainRecolor functions the live radar uses. Shows every gradation, incl. the drizzle. ----
        const RR = window.RainRecolor;

        // RainViewer's NATIVE ramp incl. its warm sand→brown sub-drizzle (MEASURED 2026-06-09 from a
        // real tile). Debug-only reference, to demo rvToRv across every gradation.
        const RV_NATIVE = [
            [99, 97, 89], [127, 120, 103], [158, 147, 117], [194, 180, 130], [222, 208, 151], // sub-drizzle browns → light tan
            [136, 221, 238], [54, 186, 229], [0, 163, 224], [0, 119, 170], [0, 91, 142], [0, 78, 120], // light → deep blue
            [255, 224, 0], [255, 170, 0], [217, 27, 0], [255, 159, 255]                       // yellow → orange → red → magenta
        ];

        function alphaOver(c, bg) { // composite [r,g,b,af?] over an opaque bg [r,g,b]
            const a = c.length > 3 ? c[3] : 1;
            return [Math.round(c[0] * a + bg[0] * (1 - a)), Math.round(c[1] * a + bg[1] * (1 - a)), Math.round(c[2] * a + bg[2] * (1 - a))];
        }
        function sampleList(list, u) {
            const n = list.length; if (u <= 0) return list[0]; if (u >= 1) return list[n - 1];
            const f = u * (n - 1), i = f | 0, t = f - i, a = list[i], c = list[i + 1];
            return [a[0] + (c[0] - a[0]) * t, a[1] + (c[1] - a[1]) * t, a[2] + (c[2] - a[2]) * t];
        }
        function strip(fn, bg) { // 512×34 canvas: column x → fn(x/(W-1)) composited over bg
            const W = 512, H = 34, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
            cv.style.cssText = 'width:100%;height:34px;display:block;border-radius:6px;border:1px solid rgba(255,255,255,.12)';
            const ctx = cv.getContext('2d');
            for (let x = 0; x < W; x++) { const c = alphaOver(fn(x / (W - 1)), bg); ctx.fillStyle = 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; ctx.fillRect(x, 0, 1, H); }
            return cv;
        }
        function section(title, sub) {
            const h = document.createElement('h2'); h.textContent = title; out.appendChild(h);
            if (sub) { const p = document.createElement('div'); p.style.cssText = 'font-family:Arial,sans-serif;font-size:.62rem;color:rgba(255,255,255,.6);margin:0 0 8px'; p.textContent = sub; out.appendChild(p); }
        }
        function addStrip(fn, bg, note) {
            const row = document.createElement('div'); row.className = 'row';
            if (note) { const n = document.createElement('div'); n.style.cssText = 'font-family:Arial,sans-serif;font-size:.6rem;color:rgba(255,255,255,.55);margin-bottom:5px'; n.textContent = note; row.appendChild(n); }
            row.appendChild(strip(fn, bg)); out.appendChild(row);
        }

        if (RR) {
            // 1) the continuous OUTPUT ramp the DWD composite produces (rampAt over u), with alpha,
            //    shown over white (w-key) and dark (k-key) so the trace-drizzle transparency is visible.
            section('Output-Verlauf — kontinuierlich (was die Karte zeichnet)',
                'RainRecolor.rampAt(u): u=0 (0.1 mm/h) links … u=1 (≥150 mm/h) rechts · inkl. Alpha');
            addStrip(u => RR.rampAt(u), [255, 255, 255], 'über Weiß (w-Taste)');
            addStrip(u => RR.rampAt(u), [8, 20, 42], 'über Dunkel (k-Taste)');

            // 2) RainViewer NATIVE → our recolour (rvToRv) across EVERY gradation incl. the brown band.
            section('RainViewer nativ → unser Recolor (rvToRv)',
                'oben: RVs Originalfarben inkl. Sand/Braun-Niesel · darunter: unser Hellblau-Recolor (warmes Band → blau, echtes Blau/Gelb/Rot unberührt)');
            addStrip(u => sampleList(RV_NATIVE, u), [255, 255, 255], 'RV nativ (Eingang)');
            addStrip(u => { const s = sampleList(RV_NATIVE, u); return RR.rvToRv(s[0] | 0, s[1] | 0, s[2] | 0); }, [255, 255, 255], 'Recolor über Weiß');
            addStrip(u => { const s = sampleList(RV_NATIVE, u); return RR.rvToRv(s[0] | 0, s[1] | 0, s[2] | 0); }, [8, 20, 42], 'Recolor über Dunkel');
        }
    </script>
</body>

</html>
