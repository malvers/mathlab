<!DOCTYPE html>
<html lang="de">
<!--
  Tafel - the board of one lesson as a deck, for the class.

  Doc, 27.09.2026: "ich finde das eigentlich viel besser, wenn wir davon ein Deck machen ... weil die
  Schülerinnen und Schüler dann ... sich mit Solita nochmal zu den einzelnen Aufgaben gegebenenfalls
  Erklärungen holen können" - and: "wir lassen das PDF vollständig weg".

  vorrechnen.html sends what was worked out on the board ("Tafel senden") to the table svp_tafel: one
  row per plan page and day, the tasks and under each the lines of its working as LaTeX. Everyone reads
  it, only Doc's account writes. The plan shows the row as a pill "Tafel 26.09." (svp-plan-tafel.js);
  the pill opens this page: ?id=<row id>. The tasks of vorrechnen.html with their whole solution
  (js/vorrechnen-aufgaben*.js) come as decks too: ?kw=44 the block of that week (the week's pill in the plan), and
  for the blocks that belong to no week one deck by theme - ?aufgaben the levels (Umstellen), ?aufgaben=knobeln the
  Ziffernrätsel, ?aufgaben=kopfrechnen mental arithmetic. ?demo shows three tasks, to look at the page.

  The slides are built here from that row - a title, then one slide per task with its working set as on
  the board of vorrechnen.html (legeRechnung). Every line of the working is a click group and comes as it
  comes there (kommen), so the class can go through it step by step. The central deck.js does the rest:
  turning, the overview, and Solita, who reads the slide on screen with the formulas put back as LaTeX
  (data-tex) and can explain the step the class is stuck on.

  deck.js reads the slides when it runs, so it is loaded only after they are built; hooks it hangs on
  "load" are called by hand if the page has finished loading by then.
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tafel</title>
<meta name="description" content="Die Rechnung aus der Stunde als Deck - mit Solita zu jedem Schritt">
<link rel="icon" type="image/svg+xml" href="../resources/favicon.svg">
<link rel="icon" type="image/png" sizes="256x256" href="../resources/favicon.png">
<link rel="stylesheet" href="../morpheus/vendor/katex/katex.min.css">
<script src="../js/lade-skript.js"></script>
<script src="../js/formel-satz.js"></script>
<script defer src="../morpheus/vendor/katex/katex.min.js"></script>
<script defer src="../js/solita-listen.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Raleway:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="deck.css">
<link rel="stylesheet" href="../js/formel-satz.css">
<style>
/* Only what this deck adds - the slides, the marks and Solita come from deck.css. */

/* what the task is (block, solved for), small beside the heading */
.slide h3 .tf-dazu{margin-left:14px;font-size:15px;font-weight:600;color:var(--muted);letter-spacing:.3px}
.slide h3 .tf-var{color:var(--red)}               /* the variable solved for, red as in vorrechnen */
.slide h3 .tf-var .katex{font-size:1.35em}

/* The working as on the light board of vorrechnen.html (Doc, 30.09.2026: "die Optik in Tafel ist noch anders als
   Vorrechnen. Bitte angleichen (zu VR) ... auch ist der Platz auf den Slides nicht so gut ausgenutzt"): the room
   under the heading, every cell placed by legeRechnung (below) - ink royal blue, what was done to a row ("| -3x")
   and the numbers (1), (2), ... grey (js/vorrechnen.css, .hell). A line is ONE element (.tf-zeile) holding its
   cells, so a click group is the whole line; it has no box of its own, its cells stand where the layout puts them. */
.tf-rechnung{position:absolute;left:72px;top:146px;width:816px;height:350px;color:var(--formel)}   /* deck.css: the royal blue of vorrechnen */
.tf-rechnung:not(.tf-gelegt){visibility:hidden}     /* its cells still lie in the corner (a large deck lays out late) */
.tf-zeile{position:absolute;left:0;top:0;width:0;height:0}
.tf-zelle{position:absolute;left:0;top:0;white-space:nowrap;line-height:normal}
.tf-sonde{display:inline-block;width:0;height:0}          /* a probe on the cell's baseline */
/* the task's setting in a sentence, under the heading's rule (a week block's TEXTE) */
.tf-text{position:absolute;left:72px;top:132px;width:816px;margin:0;font-size:17px;line-height:1.35;color:var(--body)}
.tf-text .katex{font-size:1.08em}
.tf-op{color:#7a8294}
.tf-nr{color:#5d6678}
/* a Ziffernrätsel's place values over its letters (stellenSchraeg, below): small, rising at 45 degrees from the
   middle of the letter - found by their grey, the only \color #8a93a3 in the tasks (KaTeX writes it as rgb()).
   Turned about the box's bottom left corner, which stands over the letter's middle; the digits' baseline lies 0.3em
   above that bottom, so turned it would start 0.21em left of and above the corner - the shift brings the first digit
   over the letter's middle and down to the letter (measured, 30.09.2026) */
.tf-rechnung .katex .rlap:has([style*="138, 147, 163"], [style*="#8a93a3"]) > .inner{font-size:.62em;
  transform:translate(.44em,.45em) rotate(-45deg);transform-origin:0 100%}
/* two columns: the thin line between them, in the colour of the line above vorrechnen's squares */
.tf-trenner{position:absolute;width:0;border-left:1px solid rgba(31, 64, 150, .35);pointer-events:none}
/* exponents at 60 % instead of KaTeX's 70 %, as in vorrechnen (js/vorrechnen.css) */
.tf-rechnung .katex .msupsub > .vlist-t:not(.vlist-t2) > .vlist-r > .vlist > span > .sizing.reset-size6.size3,
.tf-rechnung .katex .msupsub > .vlist-t2 > .vlist-r > .vlist > span:nth-child(2) > .sizing.reset-size6.size3{font-size:.6em}

/* The lines of the working come as on the board of vorrechnen.html (Doc, 30.09.2026: "die gelbe Box weg und die
   Gleichungen wie in Vorrechnen kommen lassen"): a line is not there before its click, then it glides up from the
   bottom left onto its place (kommen, below) and stands in ink - no triangle, no box, nothing dimmed. What was done
   to a line ("| -5") comes with the line it leads to, once that has landed, never in advance; the result's "| 😊"
   a second after its landing, fading in over a second. Only on a live slide: the overview, editing and paper show
   the whole working. */
.slide .tf-zeile.step{opacity:1;transition:none}
@media screen{
  html:not(.deck-edit) :not(.ov-thumb) > .slide .tf-zeile.step:not(.on){visibility:hidden}
  html:not(.deck-edit) :not(.ov-thumb) > .slide .tf-zeile.step.now::after{content:none}
  html:not(.deck-edit) :not(.ov-thumb) > .slide .tf-zeile:not(:has(+ .tf-zeile.on)) > .tf-op:not(.tf-smiley),
  html:not(.deck-edit) :not(.ov-thumb) > .slide .tf-zeile:has(+ .tf-fliegt) > .tf-op,
  #deck .tf-fliegt > .tf-nr, #deck .tf-fliegt > .tf-op{visibility:hidden}
  html:not(.deck-edit) :not(.ov-thumb) > .slide .tf-zeile.on:not(.tf-fliegt) > .tf-smiley{animation:tf-smiley-ein 1s ease 1s both}
  /* the line between two columns comes with the first line of the second one */
  html:not(.deck-edit) :not(.ov-thumb) > .slide .tf-rechnung:not(:has(.tf-spalte2.on:not(.tf-fliegt))) > .tf-trenner{visibility:hidden}
}
@keyframes tf-smiley-ein{from{opacity:0}}

/* A task's explanation on the slide after it (erklaerFolie): the room of the working, the deck's text face, the
   formulas in the board's ink, what is done to an equation grey like "| -3x" beside the working. How an equation set
   off is laid out (.erkl-gl) comes from ../js/formel-satz.css, shared with the lab's explanation box; the size is
   set by legeErklaerung. */
.tf-erkl{position:absolute;left:72px;top:146px;width:816px;height:350px;overflow:hidden;
  font-size:24px;line-height:1.4;color:var(--body)}
.tf-erkl p{margin:0 0 .55em}
.tf-erkl p:last-child,.tf-erkl p.tf-vor{margin-bottom:0}   /* .tf-vor: cut for a slide's end, no new paragraph (erklTeilen) */
.tf-erkl .katex{font-size:1.08em;color:var(--formel)}
.tf-erkl .erkl-op .katex{color:#7a8294}

/* a message instead of the board (no id, gone, offline) */
.tf-meldung{position:absolute;left:72px;top:146px;width:816px;font-size:20px;line-height:1.4;color:var(--body)}

/* Doc only, on the title slide: take the board out of the plan again - two taps */
.tf-weg{position:absolute;left:72px;top:452px;padding:7px 16px;border-radius:6px;cursor:pointer;
  font:600 12px Orbitron,sans-serif;letter-spacing:1.5px;color:#AFBCD8;background:transparent;border:1px solid rgba(175,188,216,.5)}
.tf-weg:hover{color:#fff;border-color:#fff}
.tf-weg.wirklich{color:#E8604C;border-color:#E8604C}
</style>
</head>
<body>
<div id="stage"><div id="deck"></div></div>
<div id="bar"></div>
<div id="nav"><button id="nav-prev" type="button" title="Vorige Folie, fertig aufgebaut (Shift+←)" aria-label="Vorige Folie"></button><button id="nav-next" type="button" title="Nächste Folie, fertig aufgebaut (Shift+→)" aria-label="Nächste Folie"></button></div>
<div id="hud"><button id="play" title="Solita erklärt" aria-label="Solita erklärt" hidden></button><button id="full" title="Vollbild (f)" aria-label="Vollbild"></button></div>
<div id="ask">
  <div id="ask-panel" hidden>
    <div id="ask-head"><span>Frag Solita zur Folie oder Präsi<b id="ask-cost" title="Kosten der letzten Frage"></b></span><button id="ask-close" type="button" title="Schließen (Esc)" aria-label="Schließen">&times;</button></div>
    <div id="ask-out" aria-live="polite"></div>
    <label for="ask-in" hidden></label>
    <div id="ask-row"><button id="ask-mic" type="button" title="Frage sprechen" aria-label="Frage sprechen"></button><button id="ask-tts" type="button" title="Solita liest vor" aria-label="Vorlesen an/aus"></button><input id="ask-in" type="text" autocomplete="off" placeholder="Warum wird hier durch 3 geteilt?" aria-label="Deine Frage an Solita"><button id="ask-send" type="button" title="Abschicken (Enter)" aria-label="Abschicken">?</button></div>
  </div>
  <button id="ask-btn" class="invite" type="button" title="Frag Solita" aria-label="Frag Solita"><img src="../resources/solita-avatar.png" alt="Solita" width="46" height="46"></button>
</div>
<script id="narration" type="application/json"></script>
<script id="summary" type="application/json">{}</script>
<script src="../svp/svp-auth.js"></script>
<script>
(function () {
  'use strict';

  const deckEl = document.getElementById('deck');
  const params = new URLSearchParams(location.search);
  const id = params.get('id') || '';
  const FOOT = '<p class="foot">Nicht verzagen, Doc Alvers fragen!</p><p class="pageno"></p>';
  const TAGE = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
  // the working's largest and smallest size: px of the font around KaTeX (which sets itself 1.21 times that) - the
  // room it fills is .tf-rechnung (Doc, 30.09.2026: "der Platz auf den Slides nicht so gut ausgenutzt", was 36 at 1.0)
  const SCHRIFT = 52, KLEINSTE = 13;

  /* ?demo: three tasks of vorrechnen.html with their working, to look at the page without a board */
  const DEMO = {
    page: '', datum: null, kw: null, klasse: 'Demo-Klasse',
    aufgaben: [
      { nr: 4, block: 'Level 1', nach: 'x', latex: '7x-4=3x+8', rechenweg: ['4x-4=8', '4x=12', 'x=3'],
        umformungen: ['-3x', '+4', ':4'] },
      { nr: 9, block: 'Level 1', nach: 'x', latex: '\\frac{x}{2}+\\frac{x}{3}=10', rechenweg: ['3x+2x=60', '5x=60', 'x=12'],
        umformungen: ['\\cdot 6', '\\text{zusammenfassen}', ':5'] },
      { nr: 14, block: 'Level 1', nach: 'h', latex: 'A=\\frac{g\\cdot h}{2}', rechenweg: ['2A=g\\cdot h', 'h=\\frac{2A}{g}'],
        umformungen: ['\\cdot 2', ':g'] }
    ]
  };

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
  }

  /* ---- the working, set as on the board of vorrechnen.html ------------------------------ */
  /* The rules of zeigeRechenweg (js/vorrechnen-rechenweg.js) on its light board (Doc, 30.09.2026: "die Optik in Tafel
     ist noch anders als Vorrechnen. Bitte angleichen (zu VR)"); formulas in display style with tight fractions, the
     variable in colour and the smiley from js/formel-satz.js. */
  const ROT = '#B02418';                  // the variable solved for, red as vorrechnen colours it on light ground
  const KLAMMER = 0.85;                   // KaTeX's em is this share of a line (vorrechnen: rechenEm)
  const UMFORMUNG_GROESSE = 0.8, UMFORMUNG_LUFT = 1.0;   // "| -3x": this share of the row's size, after this much air (em)
  const NUMMER_GROESSE = 0.7, NUMMER_LUFT = 1.5;         // (1), (2), ...: the same
  const UNTER_EM = 0.12;                  // the result's double underline: this far under the ink, its lines this far apart (em)

  /* The first "=" outside any braces and \left ... \right: "\frac{a}{b=c}" is no split. A rounded step lines up on
     its "≈" the same way ("\approx 2{,}81", the week blocks, 30.09.2026): [left, right, the sign]. */
  function teileAmGleich(tex) {
    let tiefe = 0;
    for (let k = 0; k < tex.length; k++) {
      const c = tex[k];
      if (c === '\\') {
        const cmd = /^\\([a-zA-Z]+)/.exec(tex.slice(k));
        if (cmd && cmd[1] === 'left') tiefe++;
        else if (cmd && cmd[1] === 'right') tiefe--;
        else if (cmd && cmd[1] === 'approx' && tiefe === 0) return [tex.slice(0, k), tex.slice(k + cmd[0].length), '\\approx'];
        k += cmd ? cmd[0].length - 1 : 1;
        continue;
      }
      if (c === '{') tiefe++;
      else if (c === '}') tiefe--;
      else if (c === '=' && tiefe === 0) return [tex.slice(0, k), tex.slice(k + 1), '='];
    }
    return null;
  }

  function norm(tex) { return String(tex || '').replace(/\\(?:left|right|displaystyle|[,;:! ])|\s|\{\}/g, ''); }

  /* A cell: the formula in display style with a probe on its baseline at the end (vorrechnen's zelle) - placed by
     legeRechnung */
  function zelle(el, tex, klasse) {
    const d = document.createElement('div');
    d.className = 'tf-zelle ' + klasse;
    try { katex.render(alsDisplay(tex), d, { throwOnError: false }); } catch (e) { d.textContent = tex; }
    const sonde = document.createElement('span');
    sonde.className = 'tf-sonde';
    d.appendChild(sonde);
    el.appendChild(d);
    return d;
  }

  /* What was done to a line to get the next one, "| -3x" with the bar in front as on paper (Doc, 27.09.2026: "bitte
     den senkrechten Strich machen") - ":5", not ": 5": KaTeX sets a bare colon as a relation. Without an operation:
     the result's line, Apple's 😊 behind its bar. */
  function opZelle(el, op) {
    const d = zelle(el, '\\textstyle\\vert\\;\\; ' + (op ? op.replace(/^\s*:/, '{:}') : ''), op ? 'tf-op' : 'tf-op tf-smiley');
    if (!op) d.insertBefore(smileyIcon(), d.lastChild);
    return d;
  }

  /* A Ziffernrätsel carries each letter's place value over it, grey (js/vorrechnen-aufgaben-knobeln.js, stellen:
     "\overset{\color{#8a93a3}\scriptstyle 10^{\mathrlap{3}}}{...}", the easy ones "... 1000"). At a slide's size the
     powers ran into each other (Doc, 30.09.2026: "die 10er-Potenzen ... Mist. Vorschlag: Winkel 45 Grad, 1, 10, 100
     ... Dort" - the lab keeps its powers: "bitte mit Potenzen im Vorrechnen"): here every one is written out, 1, 10,
     100, ..., and turned by 45 degrees from the middle of its letter (the CSS above finds it by its grey); it takes
     no width (\mathrlap), so the letters stand as they do without it. A board sent from a lesson brings the lab's
     form too, so it is rewritten here, not in the tasks' file. */
  function stellenSchraeg(tex) {
    return String(tex).replace(/\\overset\{\\color\{#8a93a3\}\\scriptstyle (?:10\^\{\\mathrlap\{(\d+)\}\}|(\d+))\}/g,
      function (_, hoch, zahl) { return '\\overset{\\mathrlap{\\color{#8a93a3}' + (hoch !== undefined ? '1' + '0'.repeat(+hoch) : zahl) + '}}'; });
  }

  /* What Solita reads of such a task: the letters alone. The place values over them are for the eye - as TeX they
     made one line of her overview a thousand characters long, thirteen puzzles two thirds of what a question
     carried (measured 30.09.2026). */
  function ohneStellen(tex) {
    return String(tex).replace(/\\overset\{\\color\{#8a93a3\}\\scriptstyle (?:10\^\{\\mathrlap\{\d+\}\}|\d+)\}\{(\\(?:textrm|textup|mathrm)\{[A-Z0-9]\})\\vphantom\{\\mathrm\{A\}\}\}/g, '$1');
  }

  /* One task, one slide. The task itself stands from the start; every line of the working is a click group, ONE
     element (data-tex: the whole line and what is done to it, for Solita - deck.js puts it back as $...$ when she
     reads the slide). The last line "x = ..." (x = what is solved for, no x on the right) is the result, underlined
     twice. The lines as laid out go with the working (_zeilen): their cells, and which element each one comes with. */
  function aufgabeFolie(a, k) {
    const sl = document.createElement('section');
    sl.className = 'slide content';
    const titel = a.nr ? 'Aufgabe ' + a.nr : 'Rechnung ' + (k + 1);
    /* the variable it is solved for as a formula, in red - as vorrechnen.html colours it (variablenFarbe) */
    /* a term to simplify has '' instead of a variable (Doc, 28.09.2026), its block may say what to do instead
       (Knobeln: "Ziffern finden"), a variable alone on the left already says "ausrechnen" (aufgabenKopf,
       js/formel-satz.js) - a free board has none at all */
    const kopf = aufgabenKopf(a.latex || '', a.nach, a.kopf);
    const dazu = [a.block ? esc(a.block) : '', kopf ? esc(kopf) : a.nach ? 'umstellen nach <span class="tf-var"></span>' : '']
      .filter(Boolean).join(' · ');
    sl.innerHTML = '<h3>' + esc(titel) + (dazu ? '<span class="tf-dazu">' + dazu + '</span>' : '') + '</h3>' +
      '<div class="rules"></div>';
    const v = sl.querySelector('.tf-var');
    if (v) {
      v.dataset.tex = a.nach;                     // Solita reads it as $x$
      try { katex.render(a.nach, v, { throwOnError: false }); } catch (e) { v.textContent = a.nach; }
    }
    /* the task's setting in a sentence under the heading (TEXTE, js/vorrechnen-aufgaben.js: the urn, the taxi, the
       fence - a week block's bare term says nothing by itself), formulas between $...$; the working starts below it
       (einpassen) */
    if (a.text) {
      const p = document.createElement('p');
      p.className = 'tf-text';
      String(a.text).split(/\$([^$]+)\$/).forEach(function (teil, i) {
        if (i % 2 === 0) { p.appendChild(document.createTextNode(teil)); return; }
        const f = document.createElement('span');
        f.dataset.tex = teil;                     // Solita reads it as $...$
        try { katex.render(teil, f, { throwOnError: false }); } catch (e) { f.textContent = teil; }
        p.appendChild(f);
      });
      sl.appendChild(p);
    }
    const rechnung = document.createElement('div');
    rechnung.className = 'tf-rechnung';
    const farbig = function (tex) { return hebeVariable(tex, a.nach, ROT); };
    const weg = a.rechenweg || [];
    const texte = (a.latex ? [stellenSchraeg(a.latex)] : []).concat(weg);
    const gelesen = (a.latex ? [ohneStellen(a.latex)] : []).concat(weg);   // the same lines as Solita reads them
    const erste = a.latex ? 1 : 0;                // the task is no step - it stands from the start
    /* umformungen[k] made rechenweg[k] - it is written beside the line it is done to, the one before */
    const ops = a.umformungen || [];
    /* Doc, 30.09.2026: "bring die rechte Formel (immer) hoch" - a task without "=" (a term) whose first step starts
       with "=": the step stands beside the task on its line, the next ones under it on the same "=" column; that
       line's operation and number are the step's (the task's own gives way), as in vorrechnen */
    const neben = !!a.latex && !teileAmGleich(a.latex) && weg.length > 0 &&
      (function (t) { return !!t && norm(t[0]) === ''; })(teileAmGleich(weg[0]));
    const zeilen = [];
    texte.forEach(function (tex, z) {
      const schritt = z - erste;                  // -1: the task
      const op = ops[schritt + 1] || null;        // what is done to this line to get the next one
      const el = document.createElement('div');
      el.className = 'tf-zeile';
      el.dataset.tex = op ? gelesen[z] + ' \\quad \\big|\\; ' + op : gelesen[z];
      if (schritt >= 0) { el.classList.add('step'); el.dataset.g = schritt; }
      rechnung.appendChild(el);
      const letzte = z === texte.length - 1 && z > 0;
      const teile = teileAmGleich(tex);
      /* the right side without its commands: the "a" in \frac is no variable */
      /* the solution's last step is the result as well - two solutions side by side, "x_1=2\quad x_2=-3" (vorrechnen's
         ergebnisSchritt, 30.09.2026) */
      const ergebnis = letzte && (!!a.ende && norm(tex) === norm(a.ende) || a.nach !== '' &&
        !!a.nach && !!teile && norm(teile[0]) === a.nach && norm(teile[1]).replace(/\\[a-zA-Z]+/g, '').indexOf(a.nach) < 0);
      const rechts = teile ? zelle(el, '{}' + teile[2] + farbig(teile[1]), 'tf-rechts') : null;   // "{}=": the "=" with its air
      if (schritt === 0 && neben) {
        Object.assign(zeilen[0], { el: el, rechts: rechts, schritt: 0, ergebnis: ergebnis, neben: true });
        return;
      }
      const links = !teile ? zelle(el, farbig(tex), 'tf-links') : norm(teile[0]) ? zelle(el, farbig(teile[0]), 'tf-links') : null;
      zeilen.push({ el: el, links: links, rechts: rechts, schritt: schritt, ergebnis: ergebnis, aufgabe: schritt < 0 });
    });
    /* the step's number, and the operation that leads on (or the result's smiley), with the element the line comes
       with - the number shows with its line, the operation with the next one (the CSS above) */
    zeilen.forEach(function (z) {
      if (z.schritt >= 0) z.nr = zelle(z.el, '(' + (z.schritt + 1) + ')', 'tf-nr');
      const op = ops[z.schritt + 1];
      if (z.ergebnis) z.op = opZelle(z.el, null);
      else if (op) z.op = opZelle(z.el, op);
    });
    rechnung._zeilen = zeilen;
    sl.appendChild(rechnung);
    sl.insertAdjacentHTML('beforeend', FOOT);
    return sl;
  }

  /* A task's explanation as a slide of its own, right after the task (Doc, 30.09.2026: "bei manchen Aufgaben ... eine
     Erklärbox ... bitte jeweils in das Deck als Folie danach mit einbauen"): the text of the lab's explanation box
     (ERKLAERUNGEN, js/vorrechnen-aufgaben*.js), set by the same code as there (erklaerungSetzen, js/formel-satz.js) -
     paragraphs, formulas in the sentence, equations set off on one "=" column with what is done to them. It stands
     whole, no click groups; einpassen gives it the size that fits the room (legeErklaerung). */
  const ERKL_SCHRIFT = 24, ERKL_KLEINSTE = 18;    // px: the explanation's largest size, and the smallest a beamer still shows well
  const ERKL_NOT = 11;                            // px: one paragraph alone that is longer than a slide - down to this
  function erklaerFolie(a, k) {
    const sl = document.createElement('section');
    sl.className = 'slide content';
    const titel = a.nr ? 'Aufgabe ' + a.nr : 'Rechnung ' + (k + 1);
    /* .tf-seite: "1/3", when the explanation goes over several slides */
    sl.innerHTML = '<h3>' + esc(titel) + '<span class="tf-dazu">' + (a.block ? esc(a.block) + ' · ' : '') + 'Erklärung<span class="tf-seite"></span></span></h3>' +
      '<div class="rules"></div>';
    const e = document.createElement('div');
    e.className = 'tf-erkl';
    erklaerungSetzen(e, a.erklaerung);
    sl.appendChild(e);
    sl.insertAdjacentHTML('beforeend', FOOT);
    return sl;
  }
  /* The largest size at which the explanation fits its room, in height and in width (an equation set off never
     breaks). One that is too long even at the smallest size goes on on further slides, paragraph by paragraph, each
     slide filled as far as it goes, the heading counting "1/3" (the puzzles' explanations run to a page and more - at
     one slide's size nobody could read them). Called while every slide is laid out (einpassen). */
  function erklPasst(e) { return e.scrollHeight <= e.clientHeight + 1 && e.scrollWidth <= e.clientWidth + 1; }
  function erklGroesse(e, s) {
    e.style.fontSize = s + 'px';
    erklSpalte(e);                                // the operations in one column, at this size
    return erklPasst(e);
  }
  /* A paragraph may run "text, equations, text, equations, ...": it is cut after every run of equations, so a slide
     can end there - a sentence stays with the equations it leads to. The parts keep the distance they had (.tf-vor). */
  function erklTeilen(e) {
    const gl = function (n) { return !!n && n.nodeType === 1 && n.classList.contains('erkl-gl'); };
    [...e.children].forEach(function (p) {
      const knoten = [...p.childNodes];
      const schnitt = knoten.map(function (n, i) { return i > 0 && gl(knoten[i - 1]) && !gl(n); });
      let ziel = p;
      knoten.forEach(function (n, i) {
        if (schnitt[i]) {
          const neu = document.createElement('p');
          ziel.classList.add('tf-vor');
          ziel.parentNode.insertBefore(neu, ziel.nextSibling);
          ziel = neu;
        }
        if (ziel !== p) ziel.appendChild(n);
      });
    });
  }
  function legeErklaerung(e) {
    for (let s = ERKL_SCHRIFT; s >= ERKL_KLEINSTE; s--) if (erklGroesse(e, s)) return;
    erklTeilen(e);
    const seiten = [e];
    for (let seite = e; !erklPasst(seite) && seite.children.length > 1;) {
      const sl = seite.parentNode, neu = sl.cloneNode(true), weiter = neu.querySelector('.tf-erkl');
      weiter.textContent = '';
      neu._kurz = sl._kurz;                       // Solita's overview: the same line
      neu.style.display = 'block';                // laid out like the others, to be measured
      sl.parentNode.insertBefore(neu, sl.nextSibling);
      while (!erklPasst(seite) && seite.children.length > 1) weiter.insertBefore(seite.lastChild, weiter.firstChild);
      erklSpalte(seite);
      erklGroesse(weiter, ERKL_KLEINSTE);
      seiten.push(weiter);
      seite = weiter;
    }
    seiten.forEach(function (seite, i) {
      /* a single paragraph longer than a slide: that slide alone in smaller type */
      for (let s = ERKL_KLEINSTE - 1; s >= ERKL_NOT && !erklPasst(seite); s--) erklGroesse(seite, s);
      if (seiten.length > 1) seite.parentNode.querySelector('.tf-seite').textContent = ' ' + (i + 1) + '/' + seiten.length;
    });
  }

  function titelFolie(kicker, h1, sub) {
    const sl = document.createElement('section');
    sl.className = 'slide title';
    sl.innerHTML = '<div class="ring"></div><div class="ring-inner"></div><div class="orbit-dot"></div>' +
      '<div class="title-bar"></div><p class="kicker">' + esc(kicker) + '</p><h1>' + esc(h1) + '</h1>' +
      '<p class="sub">' + esc(sub) + '</p>' + FOOT;
    return sl;
  }

  function meldungFolie(text) {
    const sl = document.createElement('section');
    sl.className = 'slide content';
    sl.innerHTML = '<h3>Tafel</h3><div class="rules"></div><p class="tf-meldung">' + esc(text) + '</p>' + FOOT;
    return sl;
  }

  /* The working fills the room under the heading: measured at the largest size, then set to the size that fits.
     A slide is display:none until it is on - and a hidden formula loads no font, so all slides are laid out
     (invisibly) first, KaTeX's fonts come in, and only then is anything measured.
     A large deck - every task of the lab, 751 of them since 30.09.2026 - took 8 s that way, 10 ms a working (Doc:
     "das lädt sehr langsam"): from FAUL_AB slides on only the explanations are laid out at the start (they may add
     slides, and deck.js takes the slides as they are when it runs), a working when its slide comes on (legeNah, after
     every paint) and the rest behind the scenes, nearest first (legeRest). Until then a working does not show
     (.tf-gelegt, the CSS above). The presenter view copies its slides while it paints - it keeps the whole layout. */
  const FAUL_AB = 60;
  let faul = false;
  /* one slide's working; the browser must have laid the slide out (display: block) */
  function legeFolie(sl) {
    const r = sl.querySelector('.tf-rechnung');
    if (!r || r._gelegt) return;
    r._gelegt = true;
    /* a task with its setting in a sentence: the working's room starts under the text */
    const p = sl.querySelector('.tf-text');
    if (p) {
      const oben = p.offsetTop + p.offsetHeight + 14, unten = r.offsetTop + r.offsetHeight;
      r.style.top = oben + 'px';
      r.style.height = Math.max(120, unten - oben) + 'px';
    }
    legeRechnung(r);
    r.classList.add('tf-gelegt');
  }
  /* a slide that is not on: laid out unseen for the moment it is measured */
  function legeVersteckt(sl) {
    const r = sl.querySelector('.tf-rechnung');
    if (!r || r._gelegt) return;
    if (sl.classList.contains('on')) { legeFolie(sl); return; }
    sl.style.visibility = 'hidden'; sl.style.display = 'block';
    legeFolie(sl);
    sl.style.display = sl.style.visibility = '';
  }
  /* every font of KaTeX, so a working measured later finds its glyphs (a root, a brace, a bold letter come from
     files of their own, and only a formula on screen asks for them) */
  async function katexSchriften() {
    const lade = [];
    try { document.fonts.forEach(function (f) { if (/KaTeX/.test(f.family)) lade.push(f.load().catch(function () { })); }); } catch (e) { }
    await Promise.all(lade);
  }
  async function einpassen() {
    const alle = [...deckEl.querySelectorAll('.slide')];
    faul = alle.length > FAUL_AB && !/[?&]presenter(&|=|$)/.test(location.search);
    deckEl.style.visibility = 'hidden';
    deckEl.querySelectorAll('.tf-rechnung').forEach(function (r) { r.style.fontSize = SCHRIFT + 'px'; });
    if (faul) await katexSchriften();
    (faul ? alle.filter(function (sl) { return sl.querySelector('.tf-erkl'); }) : alle).forEach(function (sl) { sl.style.display = 'block'; });
    void deckEl.offsetHeight;                     // lay out now, so the fonts are asked for
    try { await document.fonts.ready; } catch (e) { }
    if (!faul) alle.forEach(legeFolie);
    deckEl.querySelectorAll('.tf-erkl').forEach(legeErklaerung);
    deckEl.querySelectorAll('.slide').forEach(function (sl) { sl.style.display = ''; });   // a long explanation added slides
    deckEl.style.visibility = '';
  }
  /* after every paint of a large deck: the slide on screen, and the ones around it - the next click finds them ready */
  function legeNah() {
    if (!faul) return;
    const alle = [...deckEl.querySelectorAll(':scope > .slide')], i = alle.findIndex(function (sl) { return sl.classList.contains('on'); });
    if (i < 0) return;
    legeFolie(alle[i]);
    [i + 1, i + 2, i - 1].forEach(function (j) { if (alle[j]) legeVersteckt(alle[j]); });
  }
  /* the rest of a large deck, from the slide on screen outwards, a few at a time between the frames. The overview
     copies every slide when it first opens (deck.js): copies taken before their working was laid out get it now. */
  function legeRest() {
    const alle = [...deckEl.querySelectorAll(':scope > .slide')];
    const hier = Math.max(0, alle.findIndex(function (sl) { return sl.classList.contains('on'); }));
    const offen = alle.map(function (sl, i) { return { sl: sl, fern: Math.abs(i - hier) }; })
      .filter(function (x) { const r = x.sl.querySelector('.tf-rechnung'); return r && !r._gelegt; })
      .sort(function (a, b) { return a.fern - b.fern; });
    let i = 0;
    (function weiter() {
      const t0 = performance.now();
      while (i < offen.length && performance.now() - t0 < 24) legeVersteckt(offen[i++].sl);
      if (i < offen.length) { setTimeout(weiter, 30); return; }
      document.querySelectorAll('.ov-thumb > .slide').forEach(function (kopie, k) {
        const alt = kopie.querySelector('.tf-rechnung:not(.tf-gelegt)'), neu = alle[k] && alle[k].querySelector('.tf-rechnung');
        if (alt && neu) alt.replaceWith(neu.cloneNode(true));
      });
    })();
  }

  /* One working laid out as zeigeRechenweg lays it out (js/vorrechnen-rechenweg.js), in the room of .tf-rechnung, in
     slide px: every cell measured once at SCHRIFT (s = 1), everything else scales with s. The "=" column is centred
     by the widest left and right sides with the column of operations and the numbers counted in; the lines go down
     half a line apart, ink to ink (legenFrei). All lines take one size, as large as the room's width allows; a
     working too tall for the room shrinks - or goes on in a second column, when that makes the writing clearly
     larger: the task on top across the room, the steps down the left half as far as it goes, the rest down the
     right half, each half with its own "=" column, a thin line between them, the two in the middle of the room
     below the task. */
  function legeRechnung(r) {
    const zeilen = r._zeilen || [];
    if (!zeilen.length) return;
    const k = r.getBoundingClientRect().width / r.offsetWidth || 1;     // the stage's scale, if it has one yet
    const W = r.offsetWidth, H = r.offsetHeight;
    const katexEl = r.querySelector('.katex');
    const E0 = katexEl ? parseFloat(getComputedStyle(katexEl).fontSize) : 1.21 * SCHRIFT;   // KaTeX's em at s = 1
    /* width, where the baseline lies in the cell, and how far the ink reaches above and below it */
    const mass = function (d) {
      if (!d) return { w: 0, auf: 0, hoch: 0, tief: 0 };
      const b = d.getBoundingClientRect(), y = d.lastChild.getBoundingClientRect().top;
      const t = tinte(d, k) || { o: y, u: y };
      return { w: b.width / k, auf: (y - b.top) / k, hoch: (y - t.o) / k, tief: (t.u - y) / k };
    };
    zeilen.forEach(function (z) { z.l = mass(z.links); z.r = mass(z.rechts); z.o = mass(z.op); z.n = mass(z.nr); });
    const dicke = function (em) { return Math.max(1.5, 0.05 * em); };
    const hoch = function (z, s) { return s * Math.max(z.l.hoch, z.r.hoch); };
    /* the result's double underline takes its room below the ink */
    const tief = function (z, s) { return s * Math.max(z.l.tief, z.r.tief) + (z.ergebnis ? 2 * UNTER_EM * s * E0 + dicke(s * E0) : 0); };
    /* the lines idx at size s, going on under vor (or from the top of the room) */
    const legen = function (s, idx, vor) {
      const abstand = s * E0 / KLAMMER / 2;       // half a line
      const lage = {};
      idx.forEach(function (i) {
        const z = zeilen[i];
        const basis = vor ? vor.basis + vor.tief + abstand + hoch(z, s) : hoch(z, s);
        vor = lage[i] = { basis: basis, tief: tief(z, s) };
      });
      return { lage: lage, vor: vor, ende: vor ? vor.basis + vor.tief : 0 };
    };
    /* the "=" column of the lines idx within [links, links + breite] */
    const spalteIn = function (s, idx, links, breite) {
      const max = function (f) { return Math.max(0, ...idx.map(function (i) { return f(zeilen[i]); })); };
      const lm = max(function (z) { return s * z.l.w; }), rm = max(function (z) { return s * z.r.w; });
      const ob = max(function (z) { return z.op ? s * (UMFORMUNG_LUFT * E0 + UMFORMUNG_GROESSE * z.o.w) : 0; });
      const nb = max(function (z) { return z.nr ? s * (NUMMER_LUFT * E0 + NUMMER_GROESSE * z.n.w) : 0; });
      return { rm: rm, ob: ob, nb: nb, breit: lm + rm + ob + nb, x: links + (breite - lm - rm - ob - nb) / 2 + lm };
    };
    const alle = zeilen.map(function (_, i) { return i; });
    const kopf = zeilen[0].aufgabe ? [0] : [];
    const schritte = alle.filter(function (i) { return kopf.indexOf(i) < 0; });
    const MIN = KLEINSTE / SCHRIFT, HALB = W / 2;
    const SPALT_RAND = 32;                        // air to the line between the columns and to the edge
    const ZWEI_VORZUG = 1.1;                      // two columns only when they make the writing a tenth larger
    let g = 1;
    while (g > MIN && spalteIn(g, alle, 0, W).breit > W) g -= 0.02;
    let t1 = g, einzeln = legen(t1, alle, null);
    while (einzeln.ende > H && t1 - 0.02 >= MIN) { t1 -= 0.02; einzeln = legen(t1, alle, null); }
    const zweiSpalten = function (s) {
      const oben = legen(s, kopf, null);
      let n = schritte.length - 1, l1 = legen(s, schritte.slice(0, n), oben.vor);
      while (n > 1 && l1.ende > H) { n--; l1 = legen(s, schritte.slice(0, n), oben.vor); }
      const l2 = legen(s, schritte.slice(n), oben.vor);
      return { lage: Object.assign({}, oben.lage, l1.lage, l2.lage), ende: Math.max(oben.ende, l1.ende, l2.ende),
        links: schritte.slice(0, n), rechts: schritte.slice(n) };
    };
    const passtHalb = function (s) { return spalteIn(s, schritte, 0, HALB).breit <= HALB - 2 * SPALT_RAND; };
    let s = t1, gelegt = einzeln, zwei = null;
    if (t1 < g && schritte.length >= 2) {
      let t = g;
      while (t > MIN && !passtHalb(t)) t -= 0.02;
      if (passtHalb(t)) {
        let versuch = zweiSpalten(t);
        while (versuch.ende > H && t - 0.02 >= MIN) { t -= 0.02; versuch = zweiSpalten(t); }
        if (versuch.ende <= H && t >= ZWEI_VORZUG * t1) { zwei = versuch; s = t; gelegt = versuch; }
      }
    }
    const setze = function (idx, sp) { idx.forEach(function (i) { zeilen[i].sp = sp; }); };
    if (zwei) {
      /* the columns in the middle of the room left under the task */
      let unten = -Infinity;
      schritte.forEach(function (i) { unten = Math.max(unten, gelegt.lage[i].basis + gelegt.lage[i].tief); });
      const schub = Math.max(0, (H - unten) / 2);
      schritte.forEach(function (i) { gelegt.lage[i].basis += schub; });
      setze(kopf, spalteIn(s, kopf, 0, W));
      setze(zwei.links, spalteIn(s, zwei.links, 0, HALB));
      setze(zwei.rechts, spalteIn(s, zwei.rechts, HALB, HALB));
      zeilen[zwei.rechts[0]].el.classList.add('tf-spalte2');
    } else setze(alle, spalteIn(s, alle, 0, W));
    const px = function (v) { return v.toFixed(2) + 'px'; };
    const em = s * E0;
    zeilen.forEach(function (z, i) {
      const sp = z.sp, basis = gelegt.lage[i].basis;
      z.basis = basis;
      if (z.links) { z.links.style.fontSize = px(s * SCHRIFT); z.links.style.left = px(sp.x - s * z.l.w); z.links.style.top = px(basis - s * z.l.auf); }
      if (z.rechts) { z.rechts.style.fontSize = px(s * SCHRIFT); z.rechts.style.left = px(sp.x); z.rechts.style.top = px(basis - s * z.r.auf); }
      if (z.op) {
        const os = s * UMFORMUNG_GROESSE;
        z.op.style.fontSize = px(os * SCHRIFT);
        z.op.style.left = px(sp.x + sp.rm + UMFORMUNG_LUFT * em);
        z.op.style.top = px(basis - os * z.o.auf);
      }
      if (z.nr) {
        const ns = s * NUMMER_GROESSE;
        z.nr.style.fontSize = px(ns * SCHRIFT);
        z.nr.style.left = px(sp.x + sp.rm + sp.ob + sp.nb - ns * z.n.w);
        z.nr.style.top = px(basis - ns * z.n.auf);
      }
      /* the double underline under the whole line (beside the task: under the step only); it comes with the line */
      if (z.ergebnis) {
        const d = dicke(em), lw = z.neben ? 0 : s * z.l.w;
        const u = document.createElement('div');
        u.style.cssText = 'position:absolute;left:' + px(sp.x - lw) + ';width:' + px(lw + s * z.r.w) + ';top:' +
          px(basis + s * Math.max(z.l.tief, z.r.tief) + UNTER_EM * em) + ';height:' + px(UNTER_EM * em + d) +
          ';box-sizing:border-box;border-top:' + d + 'px solid currentColor;border-bottom:' + d + 'px solid currentColor';
        z.el.appendChild(u);
      }
    });
    /* a second look: each cell exactly on its line (a cell may lay out a little differently at its size) */
    const oben = r.getBoundingClientRect().top;
    zeilen.forEach(function (z) {
      [z.links, z.rechts, z.op, z.nr].forEach(function (d) {
        if (!d) return;
        const ist = (d.lastChild.getBoundingClientRect().top - oben) / k;
        if (Math.abs(ist - z.basis) > 0.25) d.style.top = px(parseFloat(d.style.top) + z.basis - ist);
      });
    });
    /* two columns: the thin line between them, from the top of the highest step's ink to the bottom of the lowest */
    if (zwei) {
      let von = Infinity, bis = -Infinity;
      schritte.forEach(function (i) {
        const z = zeilen[i];
        von = Math.min(von, z.basis - hoch(z, s));
        bis = Math.max(bis, z.basis + s * Math.max(z.l.tief, z.r.tief));
      });
      const t = document.createElement('div');
      t.className = 'tf-trenner';
      t.style.left = px(HALB);
      t.style.top = px(von);
      t.style.height = px(Math.max(0, bis - von));
      r.appendChild(t);
    }
  }

  /* ---- the lines come as on the board of vorrechnen.html -------------------------------- */
  /* A click brings the next line: it glides up from the bottom left of the room, small, onto its place - as the grey
     step sent up with the arrow does there (schritteLanden: 0.7 s on the same curve); its number, the "| -5" that
     led to it and the line between two columns show once it has landed (the CSS above). A line taken back goes at
     once; a slide shown fully built (Shift+arrow, a jump, a reload) has everything standing. The beamer is turned
     by the presenter's paint and flies along. */
  const VON_X = 0, VON_Y = 322, VON_S = 0.6;    // where a line starts: the ink's top left in the room (slide px), its size
  let stand = null;                             // the slide that was on and how many of its lines stood, at the last paint
  function gelandet(z) {
    z.classList.remove('tf-fliegt');
    z.style.transition = z.style.transform = z.style.transformOrigin = '';
  }
  function fliegen(z, sl) {
    const k = sl.getBoundingClientRect().width / sl.offsetWidth || 1;
    gelandet(z);
    let x0 = Infinity, y0 = Infinity;
    z.querySelectorAll('.tf-links .katex-html, .tf-rechts .katex-html').forEach(function (e) {
      const b = e.getBoundingClientRect();
      if (b.width) { x0 = Math.min(x0, b.left); y0 = Math.min(y0, b.top); }
    });
    if (!isFinite(x0)) return;
    const o = z.getBoundingClientRect(), raum = z.parentNode.getBoundingClientRect();
    const flug = (z._flug || 0) + 1;
    z._flug = flug;
    z.classList.add('tf-fliegt');
    /* scaled about the ink's corner, so start and end are exact */
    z.style.transformOrigin = ((x0 - o.left) / k) + 'px ' + ((y0 - o.top) / k) + 'px';
    z.style.transform = 'translate(' + (VON_X - (x0 - raum.left) / k) + 'px, ' + (VON_Y - (y0 - raum.top) / k) + 'px) scale(' + VON_S + ')';
    void z.getBoundingClientRect();               // it starts there
    z.style.transition = 'transform 0.7s cubic-bezier(0.3, 0.7, 0.3, 1)';
    z.style.transform = 'none';
    z.ontransitionend = function (e) { if (e.target === z && z._flug === flug) gelandet(z); };
    setTimeout(function () { if (z._flug === flug) gelandet(z); }, 1000);
  }
  /* after every paint of deck.js: exactly one line more on the same slide - that one flies */
  function kommen() {
    legeNah();                                    // a large deck: this slide's working is laid out now
    const sl = deckEl.querySelector(':scope > .slide.on');
    const an = sl ? sl.querySelectorAll('.tf-zeile.step.on') : [];
    deckEl.querySelectorAll('.tf-fliegt:not(.on)').forEach(gelandet);     // taken back while in the air
    const eine = !!stand && stand.sl === sl && an.length === stand.n + 1;
    stand = { sl: sl, n: an.length };
    if (eine) fliegen(an[an.length - 1], sl);
  }

  /* ---- the class, from the plan index (the name the Fahrplan shows) ------------------ */
  function tailOf(p) {
    return String(p || '').split(/[?#]/)[0].split('/').filter(Boolean).slice(-2).join('/');
  }
  async function planName(page) {
    try {
      const idx = await (await fetch('../svp/plan-suchindex.json')).json();
      const p = (idx.plaene || []).find(function (q) { return tailOf(q.href) === tailOf(page); });
      if (p) return { kurz: p.kurz || '', lang: String(p.lang || p.kurz || '').replace(/\s*\([^)]*\)\s*$/, '').replace(/\bKlasse\s+/, '') };
    } catch (e) { /* without the index: the page name */ }
    return { kurz: tailOf(page), lang: tailOf(page) };
  }

  // ladeSkript: ../js/lade-skript.js

  /* ?aufgaben: every task of the Vorrechnen lab with its whole solution, from the same source the
     lab reads (js/vorrechnen-aufgaben.js) - Doc, 27.09.2026: "mach das ganze Deck fertig, also nicht
     nur das Demo-Deck". A collection, not a lesson: it has a name instead of a day.
     Only the blocks that belong to no week: the levels, the Ziffernrätsel and mental arithmetic, 88 tasks - what Doc
     can show at any time ("so ein extra Ding ... was ich immer zeigen könnte"). With the 33 week blocks in the same
     source the deck had grown to 751 tasks and 931 slides, slow to load and 6.8 ct a question; a week's tasks are in
     its own deck (Doc, 30.09.2026: "warum machen wir überhaupt ein riesengroßes Deck? ... wirklich aufsplitten").
     Those 88 were still 144 slides and 1.1 ct a question ("dieses eine Deck ... durchaus auch noch aufspalten"): one
     deck by theme now. ?aufgaben alone keeps the levels - the plan's pill "Gleichungen umstellen - alle Aufgaben" points
     there - and takes every block without a week that no other theme claims, so a new one is never lost. The themes
     stand in SAMMLUNGEN (js/vorrechnen-aufgaben.js) since 01.10.2026: the plan's pills and its Aufgabensammlung read
     them from there too. */
  function themaVon(b) {
    const name = Object.keys(SAMMLUNGEN).find(function (k) { return SAMMLUNGEN[k].block && SAMMLUNGEN[k].block.test(b.titel); });
    return name || '';
  }
  /* ?kw=44: the block of that week only - its deck, the pill in the plan's week (svp/svp-plan-tafel.js) (Doc,
     30.09.2026: "pro Woche Vorrechnen von 10 (20?) Aufgaben zum Thema ... und das Deck pro Woche").
     The task files are the ones vorrechnen.html loads, in its order: the list stands there only, a new block is
     entered once (the plan's pill reads it the same way). */
  async function aufgabenDateien() {
    try {
      const html = await (await fetch('../vorrechnen.html', { cache: 'no-cache' })).text();
      const dateien = [...html.matchAll(/<script\s+src="(js\/vorrechnen-aufgaben[\w-]*\.js)"/g)].map(function (m) { return '../' + m[1]; });
      if (dateien.length) return dateien;
    } catch (e) { /* without the page: at least the levels */ }
    return ['../js/vorrechnen-aufgaben.js'];
  }
  /* Slides in front of the tasks, right after the title (Doc, 02.10.2026: Marilyn vos Savant and the Ziegenproblem,
     "das Deck zum Vorrechnen ... machs da AUCH rein"): a file under vorspann/ holds the <section>s - the same ones
     the plain decks carry - and this list says which boards show it: a collection (?aufgaben=...) or a week (?kw=...).
     A board may show several files, in the order of the list (Doc, 03.10.2026: "The Calculus of Life" for Monday). */
  const VORSPANN = [
    { aufgaben: 'einmaleins', datei: 'vorspann/vos-savant.html' },   // Info 9, KW 40
    { kw: '41', datei: 'vorspann/vos-savant.html' },                 // Mathe 11, KW 41
    { kw: '41', datei: 'vorspann/calculus-of-life.html' },           // Mathe 11, KW 41
  ];
  async function vorspann() {
    const passend = VORSPANN.filter(function (e) {
      return e.aufgaben ? String(params.get('aufgaben') || '').toLowerCase() === e.aufgaben : params.get('kw') === e.kw;
    });
    const folien = [];
    for (const v of passend) {
      try {
        const res = await fetch(v.datei, { cache: 'no-cache' });
        if (!res.ok) continue;
        const t = document.createElement('template');
        t.innerHTML = await res.text();
        folien.push(...t.content.querySelectorAll('section.slide'));
      } catch (e) { /* without it the board still comes */ }
    }
    return folien;
  }
  /* A task's explanation without its setting: aufgabenTexte (js/vorrechnen-aufgaben.js) puts the task's text in front
     of it for the lab's box, and that text stands on the task's slide already - a task with nothing but its text has
     no explanation slide. */
  function erklaerungOhneText(schluessel) {
    const e = (typeof ERKLAERUNGEN !== 'undefined' && ERKLAERUNGEN[schluessel]) || '';
    const t = (typeof TEXTE !== 'undefined' && TEXTE[schluessel]) || '';
    return (t && e.indexOf(t) === 0 ? e.slice(t.length) : e).trim() || null;
  }
  async function ladeSammlung() {
    for (const datei of await aufgabenDateien()) await ladeSkript(datei);
    const kw = params.get('kw');
    const woche = kw ? BLOECKE.filter(function (b) { return String(b.kw) === kw; }) : null;
    if (woche && !woche.length) throw new Error('Für KW ' + kw + ' gibt es noch keine Vorrechnen-Aufgaben.');
    const name = woche ? null : String(params.get('aufgaben') || '').toLowerCase();
    const thema = woche ? null : SAMMLUNGEN[name];
    if (!woche && !thema) throw new Error('Das Aufgaben-Deck „' + name + '“ gibt es nicht – es gibt ' +
      Object.keys(SAMMLUNGEN).map(function (k) { return '?aufgaben' + (k ? '=' + k : ''); }).join(', ') + '.');
    return {
      sammlung: true,
      titel: woche ? woche.map(function (b) { return b.titel; }).join(' + ') : thema.titel,
      kicker: woche ? 'Vorrechnen · KW ' + kw : thema.kicker,
      aufgaben: AUFGABEN.map(function (t, i) {
        const b = aufgabenBlock(i), l = LOESUNGEN[t[0]] || [];
        // no week asked for: the blocks without one, those of the theme asked for
        if (woche ? woche.indexOf(b) < 0 : b.kw !== undefined || themaVon(b) !== name) return null;
        return { schluessel: t[0], nr: i - b.ab + 1, block: b.titel, kopf: (typeof KOEPFE !== 'undefined' && KOEPFE[t[0]]) || b.kopf || null, latex: t[1], nach: t[2], ende: l.length ? l[l.length - 1][0] : null,
          text: (typeof TEXTE !== 'undefined' && TEXTE[t[0]]) || null,
          erklaerung: erklaerungOhneText(t[0]),
          rechenweg: l.map(function (st) { return st[0]; }), umformungen: l.map(function (st) { return st[1]; }) };
      }).filter(Boolean)
    };
  }

  async function ladeZeile() {
    if (params.has('aufgaben') || params.has('kw')) return ladeSammlung();
    if (params.has('demo')) {
      const d = new Date();
      return Object.assign({}, DEMO, { datum: d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') });
    }
    if (!/^[0-9a-f-]{36}$/i.test(id)) throw new Error('Keine Tafel angegeben.');
    let rows;
    try {
      const res = await fetch(svpAuth.DB_URL + '/rest/v1/svp_tafel?id=eq.' + id + '&select=id,page,datum,kw,aufgaben',
        { headers: { apikey: svpAuth.DB_KEY } });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      rows = await res.json();
    } catch (e) {
      throw new Error('Die Tafel lässt sich gerade nicht laden (' + e.message + ').');
    }
    if (!rows.length) throw new Error('Diese Tafel gibt es nicht (mehr).');
    return rows[0];
  }

  /* Doc only (RLS decides, the button only shows with a session): two taps, no native dialog -
     the first one asks, the second one within four seconds deletes. */
  function wegKnopf(sl) {
    if (!id || !window.svpAuth || !svpAuth.hasSession()) return;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tf-weg';
    b.textContent = 'Aus dem Plan nehmen';
    let fragt = null;
    b.addEventListener('click', async function (e) {
      e.stopPropagation();                          // a tap here does not turn the page
      if (!fragt) {
        b.textContent = 'Wirklich aus dem Plan nehmen?';
        b.classList.add('wirklich');
        fragt = setTimeout(function () { fragt = null; b.textContent = 'Aus dem Plan nehmen'; b.classList.remove('wirklich'); }, 4000);
        return;
      }
      clearTimeout(fragt);
      fragt = null;
      b.disabled = true;
      try {
        const res = await svpAuth.api('svp_tafel?id=eq.' + id, { method: 'DELETE', headers: { Prefer: 'return=representation' } });
        const weg = res.ok ? await res.json() : [];
        if (!weg.length) throw new Error(res.ok ? 'nichts gelöscht - angemeldet als ' + (svpAuth.whoami() || '?') : 'HTTP ' + res.status);
        b.textContent = 'Aus dem Plan genommen';
        b.classList.remove('wirklich');
      } catch (err) {
        b.textContent = 'Nicht gelöscht: ' + err.message;
        b.disabled = false;
      }
    });
    sl.appendChild(b);
  }

  /* deck.js takes the slides as they are when it runs. Its "load" hooks (docking the buttons, the page number
     line) would never fire if the page has finished loading before the board came in - they are collected
     while it runs and called at once. If the page is still loading, the script holds the load event back
     and they get the real one. */
  function deckStarten() {
    const s = document.createElement('script');
    s.src = 'deck.js';
    const spaet = [];
    const add = window.addEventListener;
    if (document.readyState === 'complete') {
      window.addEventListener = function (typ, fn, opt) {
        if (typ === 'load') spaet.push(fn); else add.call(window, typ, fn, opt);
      };
    }
    s.onload = s.onerror = function () {
      delete window.addEventListener;              // back to the prototype's own
      spaet.forEach(function (fn) { try { fn.call(window, new Event('load')); } catch (e) { console.error(e); } });
      /* the lines come after every paint (deck.js's hooks, "painted"); the first paint was before this */
      if (typeof painted !== 'undefined') { painted.push(kommen); kommen(); }
      if (faul) legeRest();
    };
    document.body.appendChild(s);
  }

  /* A chapter slide where the block changes ("Level 2 · Anforderungsbereich II" -> "Level 2" and the rest
     below it), when the board holds tasks of more than one block. */
  function kapitelFolie(nr, block, anzahl) {
    const teile = String(block).split(' · ');
    const sl = document.createElement('section');
    sl.className = 'slide chapter';
    sl.innerHTML = '<div class="chapter-bar"></div><p class="kicker">Kapitel ' + String(nr).padStart(2, '0') + '</p>' +
      '<h2>' + esc(teile[0]) + '</h2><p class="sub">' + esc(teile.slice(1).concat(anzahl === 1 ? 'eine Aufgabe' : anzahl + ' Aufgaben').join(' · ')) +
      '</p><div class="hair"></div>' + FOOT;
    return sl;
  }

  async function bauen() {
    if (document.readyState === 'loading') await new Promise(function (ok) { document.addEventListener('DOMContentLoaded', ok); });
    /* Solita's overview counts by the slide's place in the deck: each slide keeps its line (_kurz), and the overview
       is written once the deck is laid out - a long explanation grows by slides there (legeErklaerung) */
    const dazu = function (sl, zeile) { sl._kurz = zeile; deckEl.appendChild(sl); };
    try {
      const zeile = await ladeZeile();
      const aufgaben = zeile.aufgaben || [];
      const wieviele = aufgaben.length === 1 ? 'eine Aufgabe' : aufgaben.length + ' Aufgaben';
      let titel;
      if (zeile.sammlung) {
        document.title = zeile.titel + ' - alle Aufgaben';
        titel = titelFolie(zeile.kicker, zeile.titel, wieviele + ' mit Musterlösung, Schritt für Schritt');
        dazu(titel, 'Titel: ' + zeile.titel + ', ' + wieviele + ' mit Musterlösung');
      } else {
        const d = new Date(zeile.datum + 'T12:00:00');
        const tag = String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + d.getFullYear();
        const name = zeile.klasse ? { kurz: zeile.klasse, lang: zeile.klasse } : await planName(zeile.page);
        document.title = 'Tafel ' + name.kurz + ' ' + tag;
        titel = titelFolie('Tafel' + (zeile.kw ? ' · KW ' + zeile.kw : ''), name.lang,
          TAGE[d.getDay()] + ', ' + tag + ' · ' + wieviele + ', gerechnet in der Stunde');
        wegKnopf(titel);
        dazu(titel, 'Titel: die Tafel der ' + name.lang + ' vom ' + tag + ', die Rechnungen aus der Stunde');
      }
      for (const sl of await vorspann()) dazu(sl, 'Vorspann: ' + ((sl.querySelector('h3') || {}).textContent || ''));
      if (!aufgaben.length) dazu(meldungFolie('Auf dieser Tafel steht nichts.'), 'leer');
      const bloecke = [...new Set(aufgaben.map(function (a) { return a.block || ''; }))];
      let block = null, kapitel = 0;
      aufgaben.forEach(function (a, k) {
        if (bloecke.length > 1 && a.block && a.block !== block) {
          block = a.block;
          const anzahl = aufgaben.filter(function (b) { return b.block === block; }).length;
          dazu(kapitelFolie(++kapitel, block, anzahl), 'Kapitel: ' + block);
        }
        const weg = a.rechenweg || [];
        dazu(aufgabeFolie(a, k), (a.nr ? 'Aufgabe ' + a.nr : 'Rechnung ' + (k + 1)) + (a.block ? ' (' + a.block + ')' : '') +
          (a.nach ? ', ' + (aufgabenKopf(a.latex || '', a.nach) || 'umstellen nach ' + a.nach) : '') + ': ' + (a.latex ? '$' + ohneStellen(a.latex) + '$' : '') +
          (weg.length ? ' - Ergebnis $' + weg[weg.length - 1] + '$' : ''));
        if (a.erklaerung) dazu(erklaerFolie(a, k), 'Erklärung zu ' + (a.nr ? 'Aufgabe ' + a.nr : 'Rechnung ' + (k + 1)) +
          (a.block ? ' (' + a.block + ')' : ''));
      });
    } catch (e) {
      dazu(meldungFolie(e.message), 'Meldung');
    }
    /* deck.js keeps the slide it was on per path - one path for every board here, so a board of its own
       must not open at the place of another one in the same tab ('deck-pos:' is deck.js's key) */
    try {
      if (sessionStorage.getItem('tafel-pos-von') !== location.search) {
        sessionStorage.removeItem('deck-pos:' + location.pathname);
        sessionStorage.removeItem('deck-pos:' + location.pathname + ':presenter');
        sessionStorage.setItem('tafel-pos-von', location.search);
      }
    } catch (e) { }
    await einpassen();
    const summary = {};
    deckEl.querySelectorAll(':scope > .slide').forEach(function (sl, n) { summary[String(n)] = sl._kurz || ''; });
    document.getElementById('summary').textContent = JSON.stringify(summary);
    deckStarten();
  }

  bauen();
})();
</script>
</body>
</html>
