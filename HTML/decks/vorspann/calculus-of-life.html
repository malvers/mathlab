<section class="slide content"><h3>The Calculus of Life</h3><div class="rules"></div><div class="body"><div class="hero-formel"><span class="tex" data-tex="\displaystyle \textit{Life} = \int_{\textcolor{#799E31}{\textit{birth}}}^{\textcolor{#B02418}{\textit{death}}} \frac{\textit{happiness}}{\textit{time}}\,\Delta\textit{time}"></span></div>
<p class="line l0 step" data-g="0">Glück pro Zeit mal Zeit ergibt Glück – die Einheiten kürzen sich wie bei <span class="tex" data-tex="\tfrac{\text{km}}{\text{h}}\cdot\text{h}=\text{km}"></span></p>
<p class="line l0 step" data-g="1">Das Integral sammelt alles Glück ein, von der Geburt bis zum Tod.</p>
<p class="quelle">Fundstück aus dem Netz, Urheber unbekannt · streng genommen <span class="tex" data-tex="\mathrm{d}\textit{time}"></span> statt <span class="tex" data-tex="\Delta\textit{time}"></span></p></div><p class="foot">Nicht verzagen, Doc Alvers fragen!</p><p class="pageno"></p></section>
