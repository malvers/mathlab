<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>DOCPAD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Raleway:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* password page of the encrypted DOCPAD (generated by docpad/tools/pack_web.mjs) */
  html, body { margin: 0; height: 100%; }
  body { background: #181818; color: #eaf0ff; display: grid; place-items: center; padding-inline: 16px;
    font-family: 'Raleway', 'Helvetica Neue', Arial, sans-serif; }
  form { width: min(360px, 100%); box-sizing: border-box; padding: 28px 26px 22px; border-radius: 14px;
    background: #313131; border: 1px solid #3c3c3c; box-shadow: 0 18px 40px rgba(0, 0, 0, .45); }
  h1 { margin: 0 0 4px; font: 700 30px 'Orbitron', 'Helvetica Neue', Arial, sans-serif; letter-spacing: .18em; color: #5bc8f5; }
  .sub { margin: 0 0 22px; font-size: 13px; color: #9d9d9d; }
  label { display: block; font-size: 12px; color: #9d9d9d; margin-bottom: 6px; }
  input { width: 100%; box-sizing: border-box; height: 40px; padding: 0 12px; border-radius: 9px; border: 1px solid #4a4a4a;
    background: #242424; color: #fff; font: 600 15px 'Raleway', sans-serif; outline: none; }
  input:focus { border-color: #5bc8f5; box-shadow: 0 0 0 3px rgba(91, 200, 245, .18); }
  button { margin-top: 14px; width: 100%; height: 42px; border: 0; border-radius: 9px; background: #1d3f93; color: #fff;
    font: 700 14px 'Orbitron', sans-serif; letter-spacing: .12em; cursor: pointer; }
  button:hover { background: #2552b8; }
  button:disabled { opacity: .6; cursor: default; }
  .msg { min-height: 18px; margin-top: 12px; font-size: 13px; color: #9d9d9d; }
  .msg.err { color: #ff8a80; }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>DOCPAD</h1>
  <p class="sub">Doc Alvers Mathe-Labor</p>
  <label for="pw">Passwort</label>
  <input id="pw" type="password" autocomplete="current-password" required autofocus>
  <button id="go" type="submit">ÖFFNEN</button>
  <div id="msg" class="msg"></div>
</form>
<script>
(function () {
  'use strict';
  const VERSION = '8ddbde8c5599', CACHE = 'docpad-' + VERSION, ITER = 600000;
  const $ = id => document.getElementById(id);
  const say = (t, err) => { $('msg').textContent = t; $('msg').className = 'msg' + (err ? ' err' : ''); };
  async function startSW() {                                // the worker that serves ./app/ from the cache
    const reg = await navigator.serviceWorker.register('sw.js', { scope: './app/' });
    const sw = reg.installing || reg.waiting || reg.active;
    if (sw.state !== 'activated') await new Promise(r => sw.addEventListener('statechange', () => { if (sw.state === 'activated') r(); }));
  }
  async function unlock(pw) {
    say('Lade …');
    const res = await fetch('docpad.bin?v=' + VERSION, { cache: 'no-cache' });
    if (!res.ok) throw new Error('Paket nicht gefunden (' + res.status + ')');
    const bin = new Uint8Array(await res.arrayBuffer());
    if (String.fromCharCode(...bin.slice(0, 4)) !== 'DPK1') throw new Error('Paket beschädigt');
    say('Entschlüssele …');
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bin.slice(4, 20), iterations: ITER, hash: 'SHA-256' }, base,
      { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    let plain;
    try { plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bin.slice(20, 32) }, key, bin.slice(32)); }
    catch (e) { const x = new Error('Passwort falsch'); x.pw = true; throw x; }
    const raw = new Uint8Array(await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
    const n = new DataView(raw.buffer, raw.byteOffset, 4).getUint32(0, true);
    const index = JSON.parse(new TextDecoder().decode(raw.subarray(4, 4 + n))), data = raw.subarray(4 + n);
    say('Richte ein …');
    for (const k of await caches.keys()) if (k.indexOf('docpad-') === 0) await caches.delete(k);   // older bundles
    const cache = await caches.open(CACHE), app = new URL('app/', location.href);
    await Promise.all(index.map(f => cache.put(new URL(f.p, app).href,
      new Response(data.slice(f.o, f.o + f.n), { headers: { 'Content-Type': f.t } }))));
    await startSW();
    location.replace('app/');
  }
  $('f').addEventListener('submit', async ev => {
    ev.preventDefault();
    $('go').disabled = true;
    try { await unlock($('pw').value); }
    catch (e) { say(e.message || 'Fehler', true); $('go').disabled = false; if (e.pw) { $('pw').select(); } }
  });
  if (!('serviceWorker' in navigator) || !window.caches || !window.DecompressionStream) {
    say('Dieser Browser kann DOCPAD nicht öffnen (bitte aktuelles Chrome, Safari oder Firefox).', true);
    $('go').disabled = true;
    return;
  }
  caches.has(CACHE).then(async ok => { if (ok) { say('Öffne …'); await startSW(); location.replace('app/'); } });   // unlocked before
})();
</script>
</body>
</html>
