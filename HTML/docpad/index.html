<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>DOCPAD</title>
<link rel="manifest" href="/docpad/manifest.webmanifest">
<link rel="apple-touch-icon" href="/docpad/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="DOCPAD">
<meta name="theme-color" content="#181818">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Raleway:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* password page of the encrypted DOCPAD (generated by docpad/tools/pack_web.mjs) */
  html, body { margin: 0; height: 100%; }
  body { background: #181818; color: #eaf0ff; display: grid; place-items: center; padding-inline: 16px;
    font-family: 'Raleway', 'Helvetica Neue', Arial, sans-serif; }
  form { width: min(360px, 100%); box-sizing: border-box; padding: 28px 26px 22px; border-radius: 14px;
    background: #313131; border: 1px solid #3c3c3c; box-shadow: 0 18px 40px rgba(0, 0, 0, .45); }
  h1 { margin: 0 0 4px; font: 700 30px 'Orbitron', 'Helvetica Neue', Arial, sans-serif; letter-spacing: .18em; color: #5bc8f5; }
  .sub { margin: 0 0 22px; font-size: 13px; color: #9d9d9d; }
  label { display: block; font-size: 12px; color: #9d9d9d; margin-bottom: 6px; }
  input { width: 100%; box-sizing: border-box; height: 40px; padding: 0 12px; border-radius: 9px; border: 1px solid #4a4a4a;
    background: #242424; color: #fff; font: 600 15px 'Raleway', sans-serif; outline: none; }
  input:focus { border-color: #5bc8f5; box-shadow: 0 0 0 3px rgba(91, 200, 245, .18); }
  button { margin-top: 14px; width: 100%; height: 42px; border: 0; border-radius: 9px; background: #1d3f93; color: #fff;
    font: 700 14px 'Orbitron', sans-serif; letter-spacing: .12em; cursor: pointer; }
  button:hover { background: #2552b8; }
  button:disabled { opacity: .6; cursor: default; }
  .msg { min-height: 18px; margin-top: 12px; font-size: 13px; color: #9d9d9d; }
  .msg.err { color: #ff8a80; }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>DOCPAD</h1>
  <p class="sub">Doc Alvers Mathe-Labor</p>
  <input id="user" name="username" autocomplete="username" value="docpad" hidden>   <!-- for the password manager -->
  <label for="pw">Passwort</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
  <button id="go" type="submit">ÖFFNEN</button>
  <div id="msg" class="msg"></div>
</form>
<script>
(function () {
  'use strict';
  const VERSION = 'e23ac67d7a12', KEY_URL = 'https://fyfhxzyymmurlaenmzse.supabase.co/functions/v1/docpad-key', STORE = 'https://fyfhxzyymmurlaenmzse.supabase.co/storage/v1/object/public/docpad/';
  const APP = new URL('app/', location.href).href, fileUrl = h => APP + '__f/' + h, META_URL = APP + '__meta';
  const $ = id => document.getElementById(id);
  const say = (t, err) => { $('msg').textContent = t; $('msg').className = 'msg' + (err ? ' err' : ''); };
  // "DPF1" | iv 12 | AES-GCM ciphertext -> the file's bytes, gunzipped where the list says z
  async function unseal(key, bin, z) {
    if (String.fromCharCode(...bin.subarray(0, 4)) !== 'DPF1') throw new Error('Datei beschädigt');
    let plain;
    try { plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bin.subarray(4, 16) }, key, bin.subarray(16)); }
    catch (e) { const x = new Error('Schlüssel passt nicht'); x.key = true; throw x; }
    return z ? new Uint8Array(await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer()) : new Uint8Array(plain);
  }
  // the key remembered on this device (IndexedDB "docpad", store "keys": 'data'; 'base' = PBKDF2 key before 17.09.)
  function idb(mode, fn) {
    return new Promise((res, rej) => {
      const rq = indexedDB.open('docpad', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('keys');
      rq.onerror = () => rej(rq.error);
      rq.onsuccess = () => {
        const db = rq.result, tx = db.transaction('keys', mode), r = fn(tx.objectStore('keys'));
        tx.oncomplete = () => { db.close(); res(r.result); };
        tx.onerror = tx.onabort = () => { db.close(); rej(tx.error); };
      };
    });
  }
  const loadKey = name => idb('readonly', s => s.get(name)).catch(() => null);
  // the cache "docpad-files" holds every file under its name, "docpad-meta" the list of the version on this device
  const FILES = 'docpad-files', META = 'docpad-meta';
  async function startSW() {                                // the worker that serves ./app/ from the cache
    const reg = await navigator.serviceWorker.register('sw.js', { scope: './app/' });
    await reg.update().catch(() => {});                     // a changed sw.js takes over now, not some visits later
    const sw = reg.installing || reg.waiting || reg.active;
    if (sw.state !== 'activated') await Promise.race([new Promise(r => setTimeout(r, 10000)),
      new Promise(r => sw.addEventListener('statechange', () => { if (sw.state === 'activated') r(); }))]);
  }
  // The doorman: the Supabase function "docpad-key" checks the password and hands out the key
  async function fetchKey(pw) {
    say('Prüfe Passwort …');
    let res;
    try { res = await fetch(KEY_URL, { method: 'POST', body: JSON.stringify({ pass: pw }) }); }   // simple request, no preflight
    catch (e) { throw new Error('Kein Netz - zum Entsperren bitte online sein'); }
    if (res.status === 401) { const x = new Error('Passwort falsch'); x.pw = true; throw x; }
    if (res.status === 429) throw new Error('Zu viele Versuche - bitte in ein paar Minuten noch einmal');
    const j = await res.json().catch(() => ({}));
    if (!res.ok || !j.key) throw new Error(j.error || 'Schlüssel nicht erhalten (' + res.status + ')');
    const raw = Uint8Array.from(atob(j.key), c => c.charCodeAt(0));
    return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);   // non-extractable
  }
  const ready = async () => {                               // this version set up on the device before
    const r = await caches.open(META).then(c => c.match(META_URL)).catch(() => null);
    return !!r && ((await r.json().catch(() => ({}))).v === VERSION);
  };
  async function unlock(key) {                            // key: the AES-GCM key of all files
    say('Lade …');
    const res = await fetch(STORE + 'm/' + VERSION + '.bin');   // the version's list - Supabase Storage, never changes
    if (!res.ok) throw new Error('Version nicht gefunden (' + res.status + ')');
    const list = JSON.parse(new TextDecoder().decode(await unseal(key, new Uint8Array(await res.arrayBuffer()), 1)));
    // only what the device does not hold from an earlier version; Solita's voice not even that (sw.js fetches it)
    const files = await caches.open(FILES), have = new Set((await files.keys()).map(r => r.url)), todo = new Map();
    for (const f of list.files) if (!f.l && !have.has(fileUrl(f.h))) todo.set(f.h, f);
    const need = [...todo.values()], mb = (need.reduce((s, f) => s + f.n, 0) / 1e6).toFixed(1).replace('.', ',');
    let done = 0, i = 0;
    const tell = () => say('Lade ' + done + ' von ' + need.length + (need.length === 1 ? ' Datei' : ' Dateien') + ' (' + mb + ' MB) …');
    if (need.length) tell();
    await Promise.all([0, 1, 2, 3, 4, 5].map(async () => {
      while (i < need.length) {
        const f = need[i++], r = await fetch(STORE + 'f/' + f.h + '.bin');
        if (!r.ok) throw new Error('Datei fehlt (' + r.status + ')');
        await files.put(fileUrl(f.h), new Response(await unseal(key, new Uint8Array(await r.arrayBuffer()), f.z), { headers: { 'Content-Type': f.t } }));
        done++; tell();
      }
    }));
    say('Richte ein …');
    await (await caches.open(META)).put(META_URL, new Response(JSON.stringify({ v: VERSION, files: list.files }), { headers: { 'Content-Type': 'application/json' } }));
    await startSW();
    // what no longer belongs: files only earlier versions had, and the whole bundles before 08.10.2026 - not the app's own caches
    const keep = new Set(list.files.map(f => fileUrl(f.h)));
    for (const r of await files.keys()) if (!keep.has(r.url)) await files.delete(r);
    for (const k of await caches.keys()) if (/^docpad-[0-9a-f]{12}$/.test(k)) await caches.delete(k);
  }
  // "Remember on this device" (Doc 15.09.: "ich möchte nicht immer dich fragen müssen"): the key stays in
  // IndexedDB - non-extractable, the password itself is never stored - so a new version opens without typing and
  // without the doorman. The decrypted app sits in this browser's Cache Storage anyway, so this exposes nothing new.
  const saveKey = key => idb('readwrite', s => s.put(key, 'data')).catch(() => {});
  const dropKey = name => idb('readwrite', s => s.delete(name)).catch(() => {});   // 'data'; 'base' = PBKDF2 key before 17.09.
  // Chrome's password manager: the page moves on by script, so Chrome would not notice the login by itself
  function rememberInChrome(pw) {
    if (!window.PasswordCredential || !navigator.credentials) return Promise.resolve();
    const store = navigator.credentials.store(new PasswordCredential({ id: 'docpad', name: 'DOCPAD', password: pw })).catch(() => {});
    return Promise.race([store, new Promise(r => setTimeout(r, 1500))]);
  }
  $('f').addEventListener('submit', async ev => {
    ev.preventDefault();
    $('go').disabled = true;
    try {
      const pw = $('pw').value;
      const key = await fetchKey(pw);
      await saveKey(key);                                 // before unlock: the worker fetches the voice with it
      await unlock(key);
      await dropKey('base');
      await rememberInChrome(pw);
      location.replace('app/');
    }
    catch (e) { say(e.message || 'Fehler', true); $('go').disabled = false; if (e.pw) { $('pw').select(); } }
  });
  if (!('serviceWorker' in navigator) || !window.caches || !window.DecompressionStream) {
    say('Dieser Browser kann DOCPAD nicht öffnen (bitte aktuelles Chrome, Safari oder Firefox).', true);
    $('go').disabled = true;
    return;
  }
  ready().then(async ok => {
    if (ok) { say('Öffne …'); await startSW(); location.replace('app/'); return; }   // this version set up before
    const key = await loadKey('data');                     // a new version: the key remembered on this device
    if (!key) {
      if (await loadKey('base')) say('DOCPAD hat ein neues Schloss - bitte einmal das Passwort eingeben');   // remembered before 17.09.
      else if (/[?&]v=/.test(location.search)) say('Neue DOCPAD-Version - bitte Passwort eingeben');   // sent here by sw.js
      return;
    }
    $('go').disabled = true;
    try { await unlock(key); location.replace('app/'); }
    catch (e) {
      if (e.key) { await dropKey('data'); say('Neuer Schlüssel - bitte Passwort eingeben', true); } else say(e.message || 'Fehler', true);
      $('go').disabled = false;
    }
  });
})();
</script>
</body>
</html>
