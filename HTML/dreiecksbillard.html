    <meta name="solita-about" content="Ein Laser wird in einem Dreieck immer wieder gespiegelt. Außen am Rand wächst eine Kurve mit den Treffern: Jeder Treffer legt seinem Stück des Randes etwas drauf. Der Lauf hält bei einer eingestellten Zahl von Treffern an (Standard 100.000); ist die Verteilung gleichmäßig, steht die Kurve dann überall gleich hoch. Im irrationalen Dreieck wird sie flach, beim 30-60-90-Dreieck hat sie Stufen. Eine Rose daneben zeigt die Flugrichtungen: Im rationalen Dreieck kennt der Laser nur wenige Richtungen (Stacheln), im irrationalen alle (ein runder Ring) – der eigentliche Unterschied, denn der Satz sagt, Ort und Richtung werden gleichmäßig durchmischt. Einschaltbar sind farbige Fenster auf dem Rand: Jedes zählt seine Treffer und hat außen einen Balken; ziehen verschiebt ein Fenster, die Enden ziehen ändert seine Breite, das Mausrad auch. Das Verhältnis Treffer durch erwartete Treffer geht gegen 1, wenn der Rand gleichmäßig getroffen wird. Satz (OpenAI-Preprint vom 25.09.2026): Ist ein Winkel ein irrationales Vielfaches von 180 Grad, ist das Billard ergodisch, die Treffer verteilen sich für fast jeden Startschuss gleichmäßig über den Rand. Ins Dreieck tippen und ziehen setzt einen neuen Laserschuss.">

    <script>
        function toggleSidebar() {
            const panel = document.getElementById('side-panel');
            panel.classList.toggle('collapsed');
            if (window.CyberLeftChrome && typeof CyberLeftChrome.publishResolvedScale === 'function') {
                CyberLeftChrome.publishResolvedScale();
            }
            setTimeout(() => {
                window.dispatchEvent(new Event('resize'));
                if (window.CyberLeftChrome && typeof CyberLeftChrome.publishResolvedScale === 'function') {
                    CyberLeftChrome.publishResolvedScale();
                }
            }, 400);
        }

        CyberBranding.init({
            useExternalStyles: true,
            title: CyberI18n.get('ui.coach_title'),
            subtitle: 'Dreiecks-Billard',
        });
        // responsive: the triangle fits any screen, so only a genuinely tiny one gets the warning
        CyberUI.init({ screenWarning: false });
        CyberUI.ensureScreenWarning({
            minWidth: 360, minHeight: 480,
            message: 'Für das Dreiecks-Billard ist der Bildschirm sehr klein – quer halten hilft.',
        });

        if (window.CyberLeftChrome && typeof CyberLeftChrome.configure === 'function') {
            CyberLeftChrome.configure({ viewportOnlyZoom: true });
        }
        // on a narrow screen the triangle needs the room more than the controls do (0 is no screen, see trigonometrie)
        if (window.innerWidth > 0 && window.innerWidth < 900) document.getElementById('side-panel').classList.add('collapsed');
    </script>
