    <title>DOC ALVERS MATHE-LABORE | 1 + 1 = 2</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;600&display=swap"

    <link rel="icon" type="image/png" href="resources/favicon.png">

    <style>
        #side-panel #ui-container {
            width: 100% !important;
            max-width: none !important;
            align-self: stretch !important;
        }

        #side-panel .instrument-card {
            background: rgba(255, 255, 255, 0.055);
            border: 1px solid rgba(245, 194, 66, 0.32);
            border-radius: 12px;
            padding: 12px;
            width: 100% !important;
            max-width: none !important;
            box-sizing: border-box !important;
            margin-bottom: 12px;
        }

        .card-head {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            letter-spacing: 1.6px;
            color: rgb(245, 194, 66);
            margin-bottom: 10px;
        }

        .num-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .num-row .lbl {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            color: #fff;
            width: 20px;
        }

        .stepbtn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 1px solid rgba(121, 158, 49, 0.7);
            background: rgba(121, 158, 49, 0.18);
            color: #fff;
            font-size: 19px;
            cursor: pointer;
            flex: 0 0 auto;
        }

        .stepbtn:active {
            background: rgba(121, 158, 49, 0.45);
        }

        .numval {
            flex: 1;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 21px;
            color: rgb(121, 158, 49);
            background: rgba(8, 20, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 10px;
            padding: 6px 0;
            min-width: 56px;
        }

        .act-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .actbtn {
            flex: 1;
            min-width: 96px;
            padding: 11px 8px;
            border-radius: 10px;
            border: 1px solid rgba(121, 158, 49, 0.8);
            background: rgba(121, 158, 49, 0.22);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            letter-spacing: 1.2px;
            cursor: pointer;
        }

        .actbtn:active {
            background: rgba(121, 158, 49, 0.5);
        }

        .actbtn.secondary {
            border-color: rgba(255, 255, 255, 0.28);
            background: rgba(255, 255, 255, 0.07);
        }

        .hinttext {
            font-family: Outfit, Arial, sans-serif;
            font-size: 12.5px;
            line-height: 1.45;
            color: rgba(255, 255, 255, 0.75);
        }

        label.chk {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: Outfit, Arial, sans-serif;
            font-size: 13px;
            color: #fff;
            cursor: pointer;
        }

        input[type="range"] {
            width: 100%;
            accent-color: rgb(121, 158, 49);
        }
    </style>
</head>

<body>
    <nav id="mini-rail">
        <div class="nav-btn" onclick="toggleSidebar()" title="Toggle Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </div>
    </nav>

    <aside id="side-panel">
        <header id="sidebar-header"></header>
        <div id="ui-container">
            <div class="instrument-card">
                <div class="card-head">EINGABE</div>
                <div class="num-row">
                    <span class="lbl">a</span>
                    <button class="stepbtn" id="a-minus" aria-label="a verringern">−</button>
                    <div class="numval" id="a-val">1</div>
                    <button class="stepbtn" id="a-plus" aria-label="a erhöhen">+</button>
                </div>
                <div class="num-row">
                    <span class="lbl">b</span>
                    <button class="stepbtn" id="b-minus" aria-label="b verringern">−</button>
                    <div class="numval" id="b-val">1</div>
                    <button class="stepbtn" id="b-plus" aria-label="b erhöhen">+</button>
                </div>
                <div class="hinttext">0…255 — oder unten im Addierwerk direkt auf die Bits tippen.</div>
            </div>

            <div class="instrument-card">
                <div class="card-head">ADDIERWERK</div>
                <div class="act-row" style="margin-bottom:10px;">
                    <button class="actbtn" id="btn-play">ABSPIELEN</button>
                    <button class="actbtn secondary" id="btn-step">SCHRITT</button>
                    <button class="actbtn secondary" id="btn-reset">RESET</button>
                </div>
                <label for="speed" class="hinttext" style="display:block;margin-bottom:4px;">Tempo</label>
                <input type="range" id="speed" min="1" max="10" value="4" aria-label="Animationstempo">
            </div>

            <div class="instrument-card">
                <div class="card-head">ANSICHT</div>
                <label class="chk"><input type="checkbox" id="chk-strom"> Strom-Epilog (Bit = Spannung)</label>
            </div>
        </div>
    </aside>

    <main id="main-content">
        <div id="canvas-container">
            <div class="cyber-grid"></div>
            <div id="math-coach-box">
                <div class="coach-title" id="coach-title-slot"></div>
                <div id="coach-content" class="coach-message"></div>
            </div>
            <canvas id="canvas"></canvas>
        </div>
    </main>

    <script src="js/cyber-left-chrome.js"></script>
    <script src="js/branding/briefings.js"></script>
    <script src="js/branding/overlays.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/i18n-de.js"></script>
    <script src="js/i18n-en.js"></script>
    <script src="js/i18n-es.js"></script>
    <script src="js/i18n-fr.js"></script>
    <script src="js/i18n-it.js"></script>
    <script src="js/i18n-pt.js"></script>
    <script src="js/i18n-sw.js"></script>
    <script src="js/i18n-tr.js"></script>
    <script src="js/i18n-nl.js"></script>
    <script src="js/branding/nav.js"></script>
    <script src="js/branding.js"></script>
    <script src="js/ui.js"></script>
    <script>
        function toggleSidebar() {
            const panel = document.getElementById('side-panel');
            panel.classList.toggle('collapsed');
            if (window.CyberLeftChrome && typeof CyberLeftChrome.publishResolvedScale === 'function') {
                CyberLeftChrome.publishResolvedScale();
            }
            setTimeout(() => {
                window.dispatchEvent(new Event('resize'));
                if (typeof init === 'function') init();
                if (window.CyberLeftChrome && typeof CyberLeftChrome.publishResolvedScale === 'function') {
                    CyberLeftChrome.publishResolvedScale();
                }
            }, 400);
        }

        CyberBranding.init({
            useExternalStyles: true,
            title: CyberI18n.get('ui.coach_title'),
            subtitle: '1 + 1 = 2',
        });
        CyberUI.init();

        (function setCoach() {
            const t = document.getElementById('coach-title-slot');
            if (t) t.textContent = 'Vom Code zu den Bits';
            const c = document.getElementById('coach-content');
            if (c) c.textContent = 'Eine einzige Rechnung, vier Ebenen tiefer: Hochsprache, Assembler, Maschinenbytes, Addierwerk. Auf jeder Ebene steckt dieselbe Information — nur eine Abstraktion tiefer. ABSPIELEN lässt den Übertrag durch die Gatter rieseln.';
        })();

        if (window.CyberLeftChrome && typeof CyberLeftChrome.configure === 'function') {
            CyberLeftChrome.configure({ viewportOnlyZoom: true });
        }

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');

        // ---------- palette ----------
        const ORANGE = 'rgb(245,194,66)';   // labels, opcodes
        const GREEN = 'rgb(121,158,49)';    // values, active signals
        const RED = 'rgb(176,36,24)';       // carry
        const DIM = 'rgba(255,255,255,0.55)';
        const WHITE = '#fff';
        const PANEL_BG = 'rgba(14,36,78,0.55)';
        const PANEL_BORDER = 'rgba(245,194,66,0.35)';

        // ---------- state ----------
        let A = 1, B = 1;
        const BITS = 8;
        let stepIdx = -1;          // -1 = nothing computed yet, 0..7 = bits done up to idx
        let playing = false, playT = 0;
        let showStrom = false;
        let bitHits = [];          // clickable bit boxes, rebuilt every frame

        function clamp(v) { return Math.max(0, Math.min(255, v)); }
        function bits(v) { const o = []; for (let i = 0; i < BITS; i++) o.push((v >> i) & 1); return o; }

        // full-adder chain with all intermediate signals per bit
        function adderTrace() {
            const a = bits(A), b = bits(B);
            const t = []; let cin = 0;
            for (let i = 0; i < BITS; i++) {
                const x1 = a[i] ^ b[i];         // XOR1
                const s = x1 ^ cin;             // XOR2 -> sum bit
                const a1 = a[i] & b[i];         // AND1
                const a2 = x1 & cin;            // AND2
                const co = a1 | a2;             // OR -> carry out
                t.push({ a: a[i], b: b[i], cin, x1, s, a1, a2, co });
                cin = co;
            }
            return t;
        }

        // real x86-64 encodings: mov eax, imm32 = B8 id | add eax, imm32 = 05 id
        function hex2(v) { return v.toString(16).toUpperCase().padStart(2, '0'); }
        function immLE(v) { return [v & 255, (v >> 8) & 255, (v >> 16) & 255, (v >> 24) & 255]; }

        // ---------- layout + drawing ----------
        function resizeCanvasToContainer() {
            const dpr = window.devicePixelRatio || 1;
            const rect = container.getBoundingClientRect();
            canvas.width = Math.max(1, Math.floor(rect.width * dpr));
            canvas.height = Math.max(1, Math.floor(rect.height * dpr));
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
        }

        function panel(x, y, w, h, title) {
            ctx.fillStyle = PANEL_BG;
            ctx.strokeStyle = PANEL_BORDER;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, 10);
            ctx.fill(); ctx.stroke();
            ctx.fillStyle = ORANGE;
            ctx.font = '700 ' + Math.round(S * 13) + 'px Orbitron';
            ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
            ctx.fillText(title, x + S * 12, y + S * 14);
        }

        let S = 1;   // global ui scale

        function draw() {
            const rect = container.getBoundingClientRect();
            const W = rect.width, H = rect.height;
            ctx.clearRect(0, 0, W, H);
            bitHits = [];

            const tr = adderTrace();
            const sum = A + B;
            const narrow = W < 720;

            // scale so the whole ladder fits
            const nPanels = showStrom ? 5 : 4;
            S = Math.max(0.55, Math.min(W / 900, H / (nPanels === 5 ? 940 : 840)));
            const M = S * 14;                       // outer margin
            const px = M, pw = W - 2 * M;
            const hCode = S * 96, hAsm = S * 132, hMach = S * 150, hAdd = S * 330, hStrom = S * 96;
            const gap = S * 12;
            let y = M;

            // ---- 1) HOCHSPRACHE ----
            panel(px, y, pw, hCode, 'HOCHSPRACHE');
            ctx.font = Math.round(S * 26) + 'px "Courier New", monospace';
            ctx.textAlign = 'left';
            let cx = px + S * 24;
            const cy1 = y + hCode * 0.62;
            const frag = [['let c = ', DIM], [String(A), GREEN], [' + ', WHITE], [String(B), GREEN], [';', DIM],
            ['   → c = ', DIM], [stepIdx >= BITS - 1 ? String(sum) : '?', stepIdx >= BITS - 1 ? ORANGE : DIM]];
            for (const [txt, col] of frag) { ctx.fillStyle = col; ctx.fillText(txt, cx, cy1); cx += ctx.measureText(txt).width; }
            y += hCode + gap;

            // ---- 2) ASSEMBLER ----
            panel(px, y, pw, hAsm, 'ASSEMBLER  (x86-64)');
            ctx.font = Math.round(S * 20) + 'px "Courier New", monospace';
            const asmLines = [
                [['mov ', ORANGE], ['eax', WHITE], [', ' + A, GREEN], ['      ; Register eax := ' + A, DIM]],
                [['add ', ORANGE], ['eax', WHITE], [', ' + B, GREEN], ['      ; eax := eax + ' + B, DIM]]
            ];
            asmLines.forEach((line, i) => {
                let lx = px + S * 24;
                const ly = y + S * 52 + i * S * 34;
                for (const [txt, col] of line) { ctx.fillStyle = col; ctx.fillText(txt, lx, ly); lx += ctx.measureText(txt).width; }
            });
            y += hAsm + gap;

            // ---- 3) MASCHINENCODE ----
            panel(px, y, pw, hMach, 'MASCHINENCODE  (Bytes, wie sie im Speicher liegen)');
            const rows = [
                { op: 'B8', imm: immLE(A), label: 'mov eax,' + A },
                { op: '05', imm: immLE(B), label: 'add eax,' + B }
            ];
            const byteW = Math.min(S * 92, (pw - S * 48) / 5.6);
            rows.forEach((r, i) => {
                const ry = y + S * 44 + i * S * 50;
                let bx = px + S * 24;
                const all = [r.op].concat(r.imm.map(hex2));
                all.forEach((hb, j) => {
                    const isOp = j === 0;
                    ctx.fillStyle = isOp ? 'rgba(245,194,66,0.16)' : 'rgba(121,158,49,0.14)';
                    ctx.strokeStyle = isOp ? ORANGE : GREEN;
                    ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.roundRect(bx, ry, byteW - S * 6, S * 38, 6); ctx.fill(); ctx.stroke();
                    ctx.fillStyle = isOp ? ORANGE : GREEN;
                    ctx.font = '700 ' + Math.round(S * 15) + 'px "Courier New", monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText(hb, bx + (byteW - S * 6) / 2, ry + S * 13);
                    ctx.fillStyle = DIM;
                    ctx.font = Math.round(S * 9.5) + 'px "Courier New", monospace';
                    ctx.fillText(parseInt(hb, 16).toString(2).padStart(8, '0'), bx + (byteW - S * 6) / 2, ry + S * 29);
                    bx += byteW;
                });
                ctx.fillStyle = DIM;
                ctx.font = Math.round(S * 11) + 'px Outfit, Arial';
                ctx.textAlign = 'left';
                if (!narrow) ctx.fillText(r.label + '   (Opcode + 4 Bytes, little endian)', bx + S * 8, ry + S * 19);
            });
            ctx.textAlign = 'left';
            y += hMach + gap;

            // ---- 4) ADDIERWERK ----
            panel(px, y, pw, hAdd, 'ADDIERWERK  —  8 Volladdierer, Übertrag rieselt von rechts nach links');
            const cols = BITS;
            const colW = Math.min(S * 96, (pw - S * 90) / cols);
            const x0 = px + pw - S * 30 - colW;      // bit 0 sits right
            const rowA = y + S * 56, rowB = rowA + S * 34;
            const rowGate = rowB + S * 52, rowSum = rowGate + S * 96;
            ctx.font = '700 ' + Math.round(S * 12) + 'px Orbitron';
            ctx.fillStyle = DIM;
            ctx.fillText('a', px + S * 16, rowA + S * 10);
            ctx.fillText('b', px + S * 16, rowB + S * 10);
            ctx.fillText('s', px + S * 16, rowSum + S * 10);

            for (let i = 0; i < cols; i++) {
                const cxm = x0 - i * colW + colW / 2;
                const t = tr[i];
                const done = stepIdx >= i;
                const activeNow = playing && stepIdx + 1 === i;

                // bit value boxes a & b (clickable)
                const drawBit = (val, ry, which) => {
                    const bw = S * 30;
                    const bxx = cxm - bw / 2, byy = ry - S * 6;
                    ctx.fillStyle = val ? 'rgba(121,158,49,0.30)' : 'rgba(255,255,255,0.06)';
                    ctx.strokeStyle = val ? GREEN : 'rgba(255,255,255,0.25)';
                    ctx.lineWidth = 1.4;
                    ctx.beginPath(); ctx.roundRect(bxx, byy, bw, S * 26, 6); ctx.fill(); ctx.stroke();
                    ctx.fillStyle = val ? WHITE : DIM;
                    ctx.font = '700 ' + Math.round(S * 15) + 'px "Courier New", monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText(String(val), cxm, byy + S * 13);
                    if (which) bitHits.push({ x: bxx, y: byy, w: bw, h: S * 26, which, i });
                };
                drawBit(t.a, rowA, 'a');
                drawBit(t.b, rowB, 'b');

                // full-adder gate box
                const gw = colW - S * 10, gh = S * 76;
                const gx = cxm - gw / 2, gy = rowGate - S * 8;
                ctx.fillStyle = activeNow ? 'rgba(245,194,66,0.20)' : (done ? 'rgba(121,158,49,0.12)' : 'rgba(255,255,255,0.05)');
                ctx.strokeStyle = activeNow ? ORANGE : (done ? GREEN : 'rgba(255,255,255,0.22)');
                ctx.lineWidth = activeNow ? 2 : 1.2;
                ctx.beginPath(); ctx.roundRect(gx, gy, gw, gh, 8); ctx.fill(); ctx.stroke();
                ctx.fillStyle = done || activeNow ? WHITE : DIM;
                ctx.font = '700 ' + Math.round(S * 10.5) + 'px Orbitron';
                ctx.fillText('VA ' + i, cxm, gy + S * 12);
                ctx.font = Math.round(S * 10) + 'px "Courier New", monospace';
                ctx.fillStyle = done ? DIM : 'rgba(255,255,255,0.3)';
                ctx.fillText('XOR XOR', cxm, gy + S * 30);
                ctx.fillText('AND AND OR', cxm, gy + S * 44);
                if (done) {
                    ctx.fillStyle = GREEN;
                    ctx.font = '700 ' + Math.round(S * 10) + 'px "Courier New", monospace';
                    ctx.fillText('s=' + t.s + ' c=' + t.co, cxm, gy + S * 62);
                }

                // carry arrow to the next column (leftwards)
                if (i < cols - 1) {
                    const fromX = cxm - gw / 2, toX = x0 - (i + 1) * colW + colW / 2 + gw / 2;
                    const cyA = gy + gh / 2;
                    const on = done && t.co === 1;
                    ctx.strokeStyle = on ? RED : 'rgba(255,255,255,0.18)';
                    ctx.lineWidth = on ? 2.4 : 1;
                    ctx.beginPath(); ctx.moveTo(fromX, cyA); ctx.lineTo(toX, cyA); ctx.stroke();
                    if (on) {
                        ctx.fillStyle = RED;
                        ctx.beginPath();
                        ctx.moveTo(toX, cyA); ctx.lineTo(toX + S * 8, cyA - S * 4.5); ctx.lineTo(toX + S * 8, cyA + S * 4.5);
                        ctx.closePath(); ctx.fill();
                    }
                }

                // sum bit
                if (done) {
                    const bw = S * 30;
                    ctx.fillStyle = t.s ? 'rgba(245,194,66,0.28)' : 'rgba(255,255,255,0.06)';
                    ctx.strokeStyle = t.s ? ORANGE : 'rgba(255,255,255,0.25)';
                    ctx.lineWidth = 1.4;
                    ctx.beginPath(); ctx.roundRect(cxm - bw / 2, rowSum - S * 6, bw, S * 26, 6); ctx.fill(); ctx.stroke();
                    ctx.fillStyle = t.s ? WHITE : DIM;
                    ctx.font = '700 ' + Math.round(S * 15) + 'px "Courier New", monospace';
                    ctx.fillText(String(t.s), cxm, rowSum + S * 7);
                }
            }
            // carry-out of the last column = bit 8
            if (stepIdx >= BITS - 1 && tr[BITS - 1].co === 1) {
                const cxm = x0 - (cols - 1) * colW + colW / 2 - colW * 0.85;
                ctx.fillStyle = RED;
                ctx.font = '700 ' + Math.round(S * 13) + 'px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('Übertrag: 1', cxm + S * 6, rowSum + S * 7);
            }
            // decimal readout
            ctx.textAlign = 'left';
            ctx.font = '700 ' + Math.round(S * 16) + 'px Orbitron';
            ctx.fillStyle = stepIdx >= BITS - 1 ? ORANGE : DIM;
            const sumBits = (sum > 255 ? '1' : '') + bits(sum & 255).slice().reverse().join('');
            ctx.fillText(stepIdx >= BITS - 1
                ? sumBits + '₂  =  ' + sum + '₁₀'
                : 'ABSPIELEN oder SCHRITT drücken …', px + S * 24, y + hAdd - S * 22);
            y += hAdd + gap;

            // ---- 5) STROM-EPILOG (optional) ----
            if (showStrom) {
                panel(px, y, pw, hStrom, 'UND PHYSISCH?  Ein Bit ist nur: Spannung an / aus');
                const t0 = tr[0];
                const lx = px + S * 30, lyy = y + hStrom * 0.62;
                ctx.font = Math.round(S * 15) + 'px Outfit, Arial';
                ctx.fillStyle = DIM;
                ctx.fillText('Bit 0 von a gerade:', lx, lyy);
                const swx = lx + S * 190;
                ctx.strokeStyle = t0.a ? GREEN : DIM;
                ctx.lineWidth = 2.5;
                ctx.beginPath(); ctx.moveTo(swx, lyy); ctx.lineTo(swx + S * 34, lyy - (t0.a ? 0 : S * 14)); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(swx + S * 34, lyy); ctx.lineTo(swx + S * 78, lyy); ctx.stroke();
                ctx.beginPath(); ctx.arc(swx + S * 100, lyy, S * 13, 0, 2 * Math.PI);
                ctx.fillStyle = t0.a ? 'rgba(245,194,66,0.85)' : 'rgba(255,255,255,0.08)';
                ctx.fill(); ctx.stroke();
                ctx.fillStyle = t0.a ? 'rgb(14,36,78)' : DIM;
                ctx.font = '700 ' + Math.round(S * 11) + 'px Orbitron';
                ctx.textAlign = 'center';
                ctx.fillText(String(t0.a), swx + S * 100, lyy + S * 1);
                ctx.textAlign = 'left';
                ctx.fillStyle = DIM;
                ctx.font = Math.round(S * 13) + 'px Outfit, Arial';
                ctx.fillText(t0.a ? '≈ 1 Volt → „1"' : '≈ 0 Volt → „0"', swx + S * 130, lyy);
            }
        }

        // ---------- interaction ----------
        function setVals(a, b) {
            A = clamp(a); B = clamp(b);
            document.getElementById('a-val').textContent = A;
            document.getElementById('b-val').textContent = B;
            stepIdx = -1; playing = false;
            draw();
        }
        document.getElementById('a-minus').onclick = () => setVals(A - 1, B);
        document.getElementById('a-plus').onclick = () => setVals(A + 1, B);
        document.getElementById('b-minus').onclick = () => setVals(A, B - 1);
        document.getElementById('b-plus').onclick = () => setVals(A, B + 1);

        document.getElementById('btn-step').onclick = () => {
            playing = false;
            if (stepIdx < BITS - 1) { stepIdx++; draw(); }
        };
        document.getElementById('btn-play').onclick = () => {
            if (stepIdx >= BITS - 1) stepIdx = -1;
            playing = true; playT = 0;
        };
        document.getElementById('btn-reset').onclick = () => { stepIdx = -1; playing = false; draw(); };
        document.getElementById('chk-strom').onchange = e => { showStrom = e.target.checked; draw(); };

        canvas.addEventListener('pointerdown', e => {
            const r = canvas.getBoundingClientRect();
            const mx = e.clientX - r.left, my = e.clientY - r.top;
            for (const h of bitHits) {
                if (mx >= h.x && mx <= h.x + h.w && my >= h.y && my <= h.y + h.h) {
                    if (h.which === 'a') setVals(A ^ (1 << h.i), B);
                    else setVals(A, B ^ (1 << h.i));
                    return;
                }
            }
        });

        // ---------- animation loop ----------
        let lastT = 0;
        function tick(ts) {
            requestAnimationFrame(tick);
            const dt = Math.min(100, ts - lastT); lastT = ts;
            if (playing) {
                playT += dt;
                const speed = Number(document.getElementById('speed').value);
                const stepMs = 1400 / speed;
                if (playT >= stepMs) {
                    playT = 0;
                    stepIdx++;
                    if (stepIdx >= BITS - 1) playing = false;
                    draw();
                } else if (stepIdx < BITS - 1) {
                    draw();   // keep the active-column highlight pulsing
                }
            }
        }
        requestAnimationFrame(tick);

        function init() {
            resizeCanvasToContainer();
            draw();
        }

        window.addEventListener('resize', init);
        document.fonts.ready.then(init);
    </script>
</body>

</html>
