<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOC ALVERS MATHE-LABORE | Filmkritik</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="resources/favicon.svg">
    <link rel="icon" type="image/png" sizes="256x256" href="resources/favicon.png">
    <link rel="stylesheet" href="js/cyber-layout.css">

    <link rel="stylesheet" href="js/lab-shell-minimal.css">
    <style>
        /* Only what the player needs - everything else comes from the central layout. */
        #stage-wrap {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* the film sits at the top, the free space is below it (Doc, 18.09.2026: "schieb den movie hoch und
               mach da unten Platz"); the 56px above it are the recording badge's place */
            justify-content: flex-start;
            gap: 14px;
            padding: 56px 24px 24px;
        }

        #film {
            max-width: 100%;
            /* bar (20) + text line (34) + two gaps (28) stay inside the stage - at 100% the text line fell out of
               the window at the bottom */
            max-height: calc(100% - 84px);
            border: 1px solid rgba(0, 210, 255, 0.35);
            border-radius: 10px;
            background: #06101f;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
        }

        /* Red frame and badge while a remark is being recorded */
        #stage-wrap.rec #film { border-color: rgb(176, 36, 24); box-shadow: 0 0 34px rgba(176, 36, 24, 0.55); }

        /* Sits ABOVE the film, centred on it - never on the picture, it could hide what the remark is about
           (Doc, 18.09.2026). placeOverlays() sets bottom/left from the film's box; these are the fallback. */
        #rec-badge {
            position: absolute;
            top: 48px;
            right: 24px;
            display: none;
            align-items: center;
            gap: 9px;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(176, 36, 24, 0.92);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.78rem;
            letter-spacing: 1.5px;
        }

        #stage-wrap.rec #rec-badge { display: flex; }
        #rec-badge i { width: 11px; height: 11px; border-radius: 50%; background: #fff; animation: pulse 1s infinite; }

        @keyframes pulse { 50% { opacity: 0.25; } }

        /* The film stands = the big microphone. Only a press on it records (Doc, 18.09.2026: "space start / stop ...
           zeig ein großes Mic so rot wie der Rahmen wenn rec ... erst wenn ich das drücke rec"). placeOverlays() puts
           it on the film's centre; the red is the recording frame's red. While recording it is gone again - the
           picture stays free, the badge above the film says that the microphone is live. */
        #k-mic {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: none;
            align-items: center;
            justify-content: center;
            width: clamp(88px, 16vmin, 168px);
            aspect-ratio: 1;
            padding: 0;
            border-radius: 50%;
            border: 2px solid rgb(176, 36, 24);
            background: rgba(6, 16, 31, 0.66);
            color: rgb(176, 36, 24);
            box-shadow: 0 0 34px rgba(176, 36, 24, 0.55);
            cursor: pointer;
        }

        #k-mic { flex-direction: column; gap: 5%; }
        #k-mic svg { width: 46%; height: 46%; }
        /* the key that does the same, under the microphone (Doc, 18.09.2026) */
        #k-mic span {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: clamp(0.62rem, 1.7vmin, 1.05rem);
            letter-spacing: 2px;
            margin-right: -2px;                /* the spacing after the last letter would push the word off centre */
            line-height: 1;
        }
        #k-mic:hover { background: rgba(176, 36, 24, 0.24); }
        #stage-wrap.mic #k-mic { display: flex; }

        /* f puts the whole stage on the screen, not the bare video - the microphone must stay in reach */
        #stage-wrap:fullscreen { background: #06101f; }

        /* ONE line, never a second (Doc, 18.09.2026: "keine zweite Zeile sondern Text shift left"). row-reverse makes
           the right edge the start: the line is centred while it fits (auto margins) and, once it is too long, keeps
           its END in sight and leaves to the left - the newest words of a running remark are the ones that count. */
        #live-box {
            display: flex;
            flex-direction: row-reverse;
            flex: 0 0 auto;
            width: min(1000px, 100%);
            min-height: 34px;
            overflow: hidden;
            white-space: nowrap;
        }

        #live {
            margin: 0 auto;
            flex: 0 0 auto;
            font-size: 1.02rem;
            line-height: 1.45;
            color: #cfe0f5;
        }

        #live.empty { color: #7d93b4; }

        #bar { display: flex; align-items: center; gap: 12px; width: min(1000px, 100%); color: #9fb4d6; font-size: 0.86rem; }
        #bar progress { flex: 1; height: 14px; accent-color: #00d2ff; }   /* twice as high (Doc, 18.09.2026) */

        /* The scrollbar sits half way between the remark boxes and the card's outer edge (Doc, 18.09.2026): 4px bar
           + 10px card padding = 14px between the two lines, so 5px on either side - the list reaches 5px into the
           card's padding and pads the boxes back by the same 5px (without a scrollbar the two cancel out). */
        .k-list { display: flex; flex-direction: column; gap: 7px; max-height: 42vh; overflow: auto; margin-right: -5px; padding-right: 5px; }

        .k-item {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 8px;
            align-items: start;
            padding: 8px 10px;
            border: 1px solid rgba(0, 210, 255, 0.22);
            border-radius: 9px;
            background: rgba(10, 24, 48, 0.72);
            cursor: pointer;
            font-size: 0.82rem;
            color: #dbe8f7;
        }

        .k-item:hover { border-color: #9de8ff; }
        .k-item b { font-family: 'Orbitron', sans-serif; color: rgb(245, 194, 66); font-size: 0.78rem; }
        .k-item .x { color: #e06a5e; padding: 0 4px; }
        .k-item .txt { line-height: 1.35; }
        .k-item .txt.leer { color: #9fb4d6; font-style: italic; }

        /* note text in cards: .lab-note, central in js/cyber-lab-overrides.css */

        .ws-btns { display: flex; flex-wrap: wrap; gap: 7px; }
        .ws-btns .cyber-btn { flex: 1 1 auto; width: auto; min-height: 40px; padding: 8px 12px !important; font-size: 0.66rem !important; }
    </style>
</head>

<body>
    <nav id="mini-rail">
        <div class="nav-btn" onclick="toggleSidebar()" title="Toggle Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </div>
    </nav>

    <aside id="side-panel">
        <header id="sidebar-header"></header>
        <div id="ui-container"></div>
    </aside>

    <main id="main-content">
        <div id="canvas-container">
            <div id="stage-wrap">
                <div id="rec-badge"><i></i> AUFNAHME — LEERTASTE BEENDET</div>
                <video id="film" src="/film.mp4" preload="metadata" playsinline></video>
                <button id="k-mic" type="button" title="Kommentar aufnehmen" aria-label="Kommentar aufnehmen">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="2.5" width="6" height="11.5" rx="3" fill="currentColor"></rect>
                        <path d="M5.5 11a6.5 6.5 0 0 0 13 0"></path>
                        <line x1="12" y1="17.5" x2="12" y2="21.5"></line>
                        <line x1="8.5" y1="21.5" x2="15.5" y2="21.5"></line>
                    </svg>
                    <span>ENTER</span>
                </button>
                <div id="bar">
                    <span id="t-now">0:00</span>
                    <progress id="t-bar" value="0" max="1"></progress>
                    <span id="t-all">–:––</span>
                </div>
                <div id="live-box"><span id="live" class="empty">Leertaste startet und stoppt den Film. Steht er, erscheint das rote Mikrofon: draufdrücken oder ENTER und sprechen.</span></div>
            </div>
        </div>
    </main>

    <script src="js/cyber-left-chrome.js"></script>
    <script src="js/branding/briefings.js"></script>
    <script src="js/branding/overlays.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/branding/nav.js"></script>
    <script src="js/branding.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/coach-box.js"></script>
    <script>
        function toggleSidebar() {
            const panel = document.getElementById('side-panel');
            panel.classList.toggle('collapsed');
            if (window.CyberLeftChrome && typeof CyberLeftChrome.publishResolvedScale === 'function') {
                CyberLeftChrome.publishResolvedScale();
            }
            setTimeout(() => window.dispatchEvent(new Event('resize')), 400);
        }

        // no masthead top right here (Doc, 18.09.2026) - the film gets the whole stage; central switch, as on index.html
        CyberBranding.init({ useExternalStyles: true, title: 'Doc Alvers Mathe-Labor', subtitle: 'Filmkritik', skipCanvasBranding: true });
        CyberUI.init();
        if (window.CyberLeftChrome && typeof CyberLeftChrome.configure === 'function') {
            CyberLeftChrome.configure({ viewportOnlyZoom: true });
        }

        function dbg(m) { try { if (window.DebugWindow) DebugWindow.log('🎬 ' + m); } catch (e) { } }

        const film = document.getElementById('film');
        const wrap = document.getElementById('stage-wrap');
        const live = document.getElementById('live');
        const mmss = (t) => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');

        /* ---------------------------------------------------------------- State */
        // One remark = the film time it belongs to, the audio, and what Chrome heard.
        // Live reload (tools/live_reload.py) asks this before reloading: never in the middle of a
        // remark, never while the film runs - the reload would drop the recording or the position.
        window.__liveReloadBusy = () => R.recording || !film.paused;

        const R = {
            recording: false,
            t: 0,                  // film time the remark belongs to
            t0: 0,                 // wall clock when recording started
            chunks: [],
            media: null,           // MediaRecorder
            stream: null,          // microphone, opened once and kept
            rec: null,             // SpeechRecognition
            text: '',              // final transcript of the running remark
            interim: '',
            items: [],
        };

        /* ------------------------------------------------------------ Microphone */
        async function mic() {
            if (R.stream) return R.stream;
            R.stream = await navigator.mediaDevices.getUserMedia({
                audio: { echoCancellation: true, noiseSuppression: true },
            });
            return R.stream;
        }

        // Chrome writes along while Doc speaks. The audio file is the ground truth -
        // the transcript is a convenience, and it is allowed to be wrong.
        function speechStart() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) { dbg('Diktat: dieser Browser kann es nicht — nur Ton'); return; }
            const rec = new SR();
            rec.lang = 'de-DE';
            rec.continuous = true;
            rec.interimResults = true;
            rec.onresult = (ev) => {
                let fin = '', mid = '';
                for (let i = ev.resultIndex; i < ev.results.length; i++) {
                    const r = ev.results[i];
                    if (r.isFinal) fin += r[0].transcript; else mid += r[0].transcript;
                }
                if (fin) R.text = (R.text + ' ' + fin).trim();
                R.interim = mid;
                showLive();
            };
            rec.onerror = (e) => dbg('Diktat: ' + e.error);
            try { rec.start(); R.rec = rec; } catch (e) { dbg('Diktat: ' + e.message); }
        }

        function speechStop() {
            if (!R.rec) return;
            try { R.rec.stop(); } catch (e) { }
            R.rec = null;
        }

        function showLive() {
            if (R.recording) {
                const s = (R.text + ' ' + R.interim).trim();
                live.classList.toggle('empty', !s);
                live.textContent = s || 'Ich höre zu ...';
            }
        }

        /* --------------------------------------------------------- Aufnahme an/aus */
        async function startRemark() {
            if (R.recording) return;
            reopen();                              // a remark after a submit: the review is not over
            film.pause();
            R.t = film.currentTime;
            R.text = ''; R.interim = ''; R.chunks = [];
            try {
                const stream = await mic();
                R.media = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                R.media.ondataavailable = (e) => { if (e.data.size) R.chunks.push(e.data); };
                R.media.start();
            } catch (err) {
                live.textContent = 'Kein Mikrofon: ' + err.message;
                dbg('Mikrofon: ' + err.message);
                return;
            }
            R.recording = true;
            R.t0 = performance.now();
            wrap.classList.add('rec');
            showMic();
            speechStart();
            showLive();
            refreshPanel();
            dbg('Aufnahme bei ' + mmss(R.t));
        }

        async function stopRemark(keep = true) {
            if (!R.recording) return;
            R.recording = false;
            wrap.classList.remove('rec');
            showMic();
            speechStop();
            const dauer = (performance.now() - R.t0) / 1000;
            const blob = await new Promise((done) => {
                R.media.onstop = () => done(new Blob(R.chunks, { type: 'audio/webm' }));
                try { R.media.stop(); } catch (e) { done(new Blob(R.chunks, { type: 'audio/webm' })); }
            });
            const text = (R.text + ' ' + R.interim).trim();
            if (!keep) {
                live.className = 'empty';
                live.textContent = 'Verworfen. Leertaste spielt weiter.';
                refreshPanel();
                return;
            }
            const audio = await new Promise((done) => {
                const fr = new FileReader();
                fr.onload = () => done(fr.result);
                fr.readAsDataURL(blob);
            });
            try {
                const res = await fetch('/__kritik/kommentar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ t: R.t, dauer, text, audio }),
                });
                const j = await res.json();
                R.items = j.items || R.items;
                R.savedAt = performance.now();     // finish() looks at this: a submit right on a save is not the end
            } catch (err) {
                live.textContent = 'Nicht gespeichert (läuft der Server?): ' + err.message;
                dbg('Speichern: ' + err.message);
                return;
            }
            live.className = 'empty';
            live.textContent = text ? '„' + text + '“ — gespeichert bei ' + mmss(R.t) : 'Ton gespeichert bei ' + mmss(R.t);
            refreshPanel();
            revealNewest();
        }

        // The list is longer than its box after a few remarks, and the server appends: the remark just saved sits
        // at the bottom, out of sight (Doc, 18.09.2026: "die Kommentarbox bitte mitscrollen").
        // Not smooth: play/pause rebuild the list (refreshPanel) and a running animation would stop half way.
        function revealNewest() {
            const list = document.getElementById('k-list');
            const last = list && list.querySelector('.k-item:last-of-type');
            if (last) last.scrollIntoView({ block: 'nearest', behavior: 'auto' });
        }

        async function drop(n) {
            const res = await fetch('/__kritik/loeschen', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ n }),
            });
            const j = await res.json();
            R.items = j.items || [];
            refreshPanel();
        }

        /* ------------------------------------------------------- Kommentare löschen */
        // All remarks at once (Doc, 18.09.2026) - behind a question, and the server only moves them into
        // kritik/geloescht-<date>-<time>/: a review is spoken work, one wrong click must not cost it.
        // The dialog is the central one (.cyber-overlay / .cyber-modal from js/ui.js).
        function askClear() {
            if (R.recording) { live.textContent = 'Erst den Kommentar beenden (Leertaste).'; return; }
            if (!R.items.length) { live.className = 'empty'; live.textContent = 'Es gibt keine Kommentare zu löschen.'; return; }
            let overlay = document.getElementById('k-clear-overlay');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.id = 'k-clear-overlay';
                overlay.className = 'cyber-overlay';
                overlay.innerHTML = `
                    <div class="cyber-modal cyber-modal--neon" onclick="event.stopPropagation()">
                        <h3 class="cyber-modal-adopt-title">Kommentare löschen?</h3>
                        <p id="k-clear-text"></p>
                        <div class="ws-btns">
                            <button class="cyber-btn" id="k-clear-yes">JA, ALLE LÖSCHEN</button>
                            <button class="cyber-btn" id="k-clear-no">ABBRECHEN</button>
                        </div>
                    </div>`;
                overlay.addEventListener('click', () => overlay.classList.remove('open'));
                document.body.appendChild(overlay);
                document.getElementById('k-clear-no').addEventListener('click', () => overlay.classList.remove('open'));
                document.getElementById('k-clear-yes').addEventListener('click', () => { overlay.classList.remove('open'); clearAll(); });
            }
            document.getElementById('k-clear-text').textContent = 'Alle ' + R.items.length + ' Kommentare verschwinden aus der Liste. '
                + 'Sie werden nicht vernichtet, sondern in einen Unterordner „geloescht-…“ neben dem Film verschoben.';
            overlay.classList.add('open');
        }

        async function clearAll() {
            try {
                const res = await fetch('/__kritik/leeren', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
                if (!res.ok) throw new Error('Server antwortet ' + res.status + ' — tools/filmkritik.py neu starten?');
                const j = await res.json();
                R.items = j.items || [];
                R.submitted = false;               // the submit flag went with the remarks
                live.className = 'empty';
                live.textContent = 'Liste geleert. ' + (j.ordner ? 'Alles liegt in ' + j.ordner : '');
                dbg('Kommentare verschoben nach ' + j.ordner);
            } catch (err) {
                live.textContent = 'Nicht gelöscht: ' + err.message;
            }
            refreshPanel();
        }

        /* ------------------------------------------------------------------- Tasten */
        // Space starts and stops the film. A remark starts only with a press on the microphone, which shows while
        // the film stands (Doc, 18.09.2026); space then saves the remark and the film plays on.
        window.addEventListener('keydown', (ev) => {
            if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
            const t = ev.target;
            if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
            // the delete question is open: no key reaches the film behind it, Esc closes the question
            const ask = document.getElementById('k-clear-overlay');
            if (ask && ask.classList.contains('open')) {
                ev.preventDefault();
                if (ev.key === 'Escape') ask.classList.remove('open');
                return;
            }
            if (ev.key === ' ') {
                ev.preventDefault();
                if (R.recording) { stopRemark(true).then(() => { if (!film.ended) film.play(); }); }
                // At the end the film must NOT start over (Doc, 17.09.2026): it stands, the microphone is there
                else if (film.ended) return;
                else if (film.paused) film.play();
                else film.pause();
            } else if (ev.key === 'Enter' && wrap.classList.contains('mic')) {
                // the microphone by key - only while it shows (Doc, 18.09.2026: "mic sichtbar enter -> rec")
                ev.preventDefault();
                startRemark();
            } else if (ev.key === 'Escape' && R.recording) {
                ev.preventDefault();
                stopRemark(false);
            } else if (ev.key === 'ArrowLeft') {
                ev.preventDefault(); film.currentTime = Math.max(0, film.currentTime - 10);
            } else if (ev.key === 'ArrowRight') {
                ev.preventDefault(); film.currentTime = Math.min(film.duration || 0, film.currentTime + 10);
            } else if (ev.key === 'f') {
                // the whole stage, not the bare video: the microphone has to stay in reach
                if (document.fullscreenElement) document.exitFullscreen();
                else if (wrap.requestFullscreen) wrap.requestFullscreen();
            }
        });

        film.addEventListener('click', () => { if (!R.recording && !film.ended) (film.paused ? film.play() : film.pause()); });

        /* ------------------------------------------------------------- Microphone button */
        const micBtn = document.getElementById('k-mic');
        const recBadge = document.getElementById('rec-badge');
        function placeOverlays() {
            // in #stage-wrap's own pixels (the chrome may scale the stage): the microphone on the film's centre,
            // the recording badge 8px above the film, centred on it (Doc, 18.09.2026: "oben mittig")
            const f = film.getBoundingClientRect(), w = wrap.getBoundingClientRect();
            const k = wrap.offsetWidth ? w.width / wrap.offsetWidth : 1;
            micBtn.style.left = ((f.left + f.width / 2 - w.left) / k) + 'px';
            micBtn.style.top = ((f.top + f.height / 2 - w.top) / k) + 'px';
            recBadge.style.top = 'auto';
            recBadge.style.right = 'auto';
            recBadge.style.bottom = ((w.bottom - f.top) / k + 8) + 'px';
            recBadge.style.left = ((f.left + f.width / 2 - w.left) / k) + 'px';
            recBadge.style.transform = 'translateX(-50%)';
        }
        function showMic() {
            // not at 0:00 before the first start - there is nothing to remark on yet; not while recording either
            const on = !R.recording && film.paused && (film.currentTime > 0 || film.ended);
            wrap.classList.toggle('mic', on);
            placeOverlays();
        }
        ['play', 'pause', 'ended', 'seeked', 'loadedmetadata'].forEach((e) => film.addEventListener(e, showMic));
        window.addEventListener('resize', showMic);
        document.addEventListener('fullscreenchange', showMic);
        // never the focus: a focused button is one space press away from recording by key
        micBtn.tabIndex = -1;
        micBtn.addEventListener('mousedown', (e) => e.preventDefault());
        micBtn.addEventListener('click', () => startRemark());
        film.addEventListener('pause', () => {
            if (R.recording || R.submitted || film.ended) return;
            live.className = 'empty';
            live.textContent = 'Angehalten. Mikrofon drücken oder Enter für einen Kommentar — Leertaste spielt weiter.';
        });

        /* --------------------------------------------------------------- Anzeige */
        const tNow = document.getElementById('t-now'), tAll = document.getElementById('t-all'), tBar = document.getElementById('t-bar');
        film.addEventListener('timeupdate', () => {
            tNow.textContent = mmss(film.currentTime);
            tBar.value = film.duration ? film.currentTime / film.duration : 0;
        });
        // A reload (live reload after an edit, or by hand) must not throw a running review back to 0:00: the
        // position stays in this tab, per film - the same port can serve another film tomorrow.
        const POS_KEY = 'filmkritik.pos';
        let posFilm = '';                          // known once /__kritik/liste has answered
        film.addEventListener('timeupdate', () => {
            if (!posFilm) return;
            try { sessionStorage.setItem(POS_KEY, JSON.stringify({ film: posFilm, t: film.currentTime })); } catch (e) { }
        });
        function restorePosition(name) {
            let saved = null;
            try { saved = JSON.parse(sessionStorage.getItem(POS_KEY) || 'null'); } catch (e) { }
            posFilm = name;
            if (!saved || saved.film !== name || !(saved.t > 0)) return;
            const seek = () => { film.currentTime = saved.t; dbg('Position wiederhergestellt: ' + mmss(saved.t)); };
            if (film.readyState >= 1) seek(); else film.addEventListener('loadedmetadata', seek, { once: true });
        }

        const showDuration = () => { if (film.duration) tAll.textContent = mmss(film.duration); };
        film.addEventListener('loadedmetadata', () => { showDuration(); refreshPanel(); });
        if (film.readyState >= 1) showDuration();

        film.addEventListener('ended', () => {
            live.className = 'empty';
            live.textContent = 'Film zu Ende · ' + R.items.length + ' Kommentare gespeichert. Mikrofon oder Enter nimmt noch einen auf, '
                + '„VON VORN“ startet neu, „KRITIK ABSCHICKEN“ schickt alles an die Sitzung.';
            refreshPanel();
        });

        // The explicit end of a review: the session waits for this instead of guessing.
        // 18.09.2026, class 9b: fertig.json was written twice in the very second a remark was saved (11:37:36,
        // 11:38:10) - Solita thanked after the FIRST remark, Doc's real submit came at 11:39:33 ("der Kommentar
        // von ihr kam zu zeitig"). Nothing in this page explains it (space does not press a focused button,
        // measured), so the guard does not care about the cause: no submit while a remark is being recorded, none
        // within 3 s of a saved one, none from the keyboard - and every submit tells the server how it came about.
        const SUBMIT_GUARD_MS = 3000;

        // Doc's answer the same day: he had pressed ABSCHICKEN himself after every remark. So a submit is only THE
        // END if nothing follows: when the film plays on or a new remark starts, the page takes the submit back
        // (the server drops fertig.json), and the watcher, which waits 20 s before Solita thanks, stays quiet.
        function reopen() {
            if (!R.submitted) return;
            R.submitted = false;
            fetch('/__kritik/weiter', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }).catch(() => { });
            dbg('Weiter nach dem Abschicken — das war noch nicht das Ende');
        }
        film.addEventListener('play', reopen);

        async function finish(ev) {
            const sinceSave = R.savedAt ? Math.round(performance.now() - R.savedAt) : null;
            const how = { via: ev ? ev.type : 'code', detail: ev ? ev.detail : null, pointer: (ev && ev.pointerType) || '',
                          trusted: ev ? ev.isTrusted : false, sinceSave: sinceSave };
            dbg('Abschicken: ' + JSON.stringify(how));
            live.className = 'empty';
            if (R.recording) { live.textContent = 'Erst den Kommentar beenden (Leertaste) — dann KRITIK ABSCHICKEN.'; return; }
            if (ev && ev.detail === 0) { live.textContent = 'KRITIK ABSCHICKEN geht nur per Klick, nicht per Taste.'; return; }
            if (sinceSave !== null && sinceSave < SUBMIT_GUARD_MS) {
                live.textContent = 'Kommentar gespeichert. KRITIK ABSCHICKEN erst ganz am Ende drücken.';
                return;
            }
            try {
                const res = await fetch('/__kritik/fertig', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(how) });
                const j = await res.json();
                R.submitted = true;                // reopen() takes it back if the review goes on after all
                // the end is the end: the film stops. On 18.09. Doc submitted while it ran on and the next remark
                // came 27 s later - only a stopped film makes "it goes on" an act (space) the page can see
                film.pause();
                live.className = 'empty';
                live.textContent = 'Abgeschickt · ' + (j.items || R.items).length
                    + ' Kommentare sind bei der Sitzung. Doch noch nicht fertig? Leertaste — das nimmt das Abschicken zurück.';
            } catch (err) {
                live.textContent = 'Konnte nicht abschließen (läuft der Server?): ' + err.message;
            }
        }

        function refreshPanel() {
            const list = document.getElementById('k-list');
            if (list) {
                list.innerHTML = R.items.length ? R.items.map((x) => `
                    <div class="k-item" data-t="${x.t}">
                        <b>${x.zeit}</b>
                        <span class="txt ${x.text ? '' : 'leer'}">${x.text ? x.text.replace(/</g, '&lt;') : '(nur Ton, ' + x.dauer + ' s)'}</span>
                        <span class="x" data-del="${x.n}" title="löschen">✕</span>
                    </div>`).join('') : '<div class="lab-note" style="margin:0">Noch keine Kommentare.</div>';
                list.querySelectorAll('.k-item').forEach((el) => {
                    el.addEventListener('click', (ev) => {
                        if (ev.target.dataset.del) { drop(Number(ev.target.dataset.del)); return; }
                        film.currentTime = Number(el.dataset.t);
                    });
                });
            }
            const st = document.getElementById('k-state');
            if (st) st.textContent = R.recording ? 'nimmt auf ...'
                : (film.ended ? 'Film zu Ende' : (film.paused ? 'angehalten' : 'läuft'));
            const cnt = document.getElementById('k-count');
            if (cnt) cnt.textContent = R.items.length + ' Kommentare';
        }

        function buildUI() {
            // No box top left any more (Doc, 18.09.2026: it lay over the menu in the video) - the film's name
            // stands in the Film card, the how-to in the Tasten card.
            CyberUI.createCard('ui-container', 'Film', `
                <div class="ws-btns">
                    <button class="cyber-btn" id="k-play">ABSPIELEN / ANHALTEN</button>
                    <button class="cyber-btn" id="k-start">VON VORN</button>
                </div>
                <div class="ws-btns" style="margin-top:7px">
                    <button class="cyber-btn" id="k-done">KRITIK ABSCHICKEN</button>
                </div>
                <div class="lab-note"><b id="k-state">angehalten</b> · <span id="k-count">0 Kommentare</span><br><span id="k-film"></span></div>`,
                'rgb(245, 194, 66)');
            CyberUI.createCard('ui-container', 'Kommentare', `<div class="k-list" id="k-list"></div>
                <div class="ws-btns" style="margin-top:9px">
                    <button class="cyber-btn" id="k-clear">KOMMENTARE LÖSCHEN</button>
                </div>`, 'rgb(121, 158, 49)');
            CyberUI.createCard('ui-container', 'Tasten', `<div class="lab-note" style="margin-top:0">
                <b>Leertaste</b> Film starten · anhalten<br>
                <b>Mikrofon</b> oder <b>Enter</b> (wenn der Film steht) Kommentar aufnehmen — <b>Leertaste</b> speichert, Film läuft weiter<br>
                <b>Esc</b> Kommentar verwerfen · <b>◀ ▶</b> 10 s · <b>f</b> Vollbild<br>
                Am Ende <b>KRITIK ABSCHICKEN</b> — die Sitzung liest dann alles aus und dreht nur die betroffenen Szenen neu.</div>`);

            document.getElementById('k-play').addEventListener('click', () => {
                if (R.recording) stopRemark(true).then(() => { if (!film.ended) film.play(); });
                else if (film.ended) return;            // the end stays the end
                else if (film.paused) film.play(); else film.pause();
            });
            document.getElementById('k-done').addEventListener('click', finish);
            document.getElementById('k-start').addEventListener('click', () => { film.currentTime = 0; film.play(); });
            document.getElementById('k-clear').addEventListener('click', askClear);
            // a clicked button must not keep the focus: space is the whole interface here, and a focused button is
            // one key press away from being pressed again (same rule as in the deck's presenter view)
            ['k-play', 'k-start', 'k-done', 'k-clear'].forEach((id) => {
                const b = document.getElementById(id);
                b.tabIndex = -1;
                b.addEventListener('mousedown', (e) => e.preventDefault());
            });
            film.addEventListener('play', refreshPanel);
            film.addEventListener('pause', refreshPanel);
        }

        buildUI();

        // What is already on disk (a review can be continued after a reload)
        fetch('/__kritik/liste').then((r) => r.json()).then((j) => {
            R.items = j.items || [];
            if (j.film) document.getElementById('k-film').textContent = j.film;
            refreshPanel();
            revealNewest();
            // the web font arrives later and makes the rows taller - what was the bottom is not the bottom any more
            if (document.fonts && document.fonts.ready) document.fonts.ready.then(revealNewest);
            restorePosition(j.film || '');
            dbg(R.items.length + ' Kommentare geladen aus ' + j.ordner);
        }).catch(() => dbg('Liste nicht erreichbar — läuft tools/filmkritik.py?'));
    </script>
</body>
