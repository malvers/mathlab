<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#08142a">
    <title>I'm grateful for</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Raleway:wght@400;600&display=swap" rel="stylesheet">
    <!-- Doc's own Supabase account (shared SVP login): only that uid may read or write table grateful (RLS) -->
    <script src="../svp/svp-gate.js"></script>
    <script src="../svp/svp-auth.js"></script>
    <!-- dictation: the shared tap-to-talk engine (listens through pauses, "bin fertig" ends) -->
    <script src="../js/solita-listen.js"></script>
    <style>
        /* --- plain standalone page (like vote.html), deliberately no lab shell CSS --- */
        :root {
            --bg: rgb(8, 20, 42);
            --card: rgb(14, 36, 78);
            --line: rgba(120, 160, 220, .22);
            --text: rgb(214, 226, 245);
            --muted: rgb(110, 128, 160);
            --lambda: rgb(245, 194, 66);
            --upsilon: rgb(176, 36, 24);
            --phi: rgb(121, 158, 49);
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; background: var(--bg); color: var(--text); }
        body {
            font-family: Orbitron, sans-serif;
            padding: max(20px, env(safe-area-inset-top)) 16px max(40px, env(safe-area-inset-bottom));
        }
        .wrap { max-width: 640px; margin: 0 auto; }
        h1 {
            font-size: clamp(22px, 6vw, 30px); font-weight: 700; margin: 0 0 18px; letter-spacing: .04em;
            display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
        }

        .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
        /* the entry panel takes half of the space below the heading (~76px: body padding + h1), the text field grows */
        .card.entry {
            display: flex; flex-direction: column;
            min-height: calc((100vh - 76px) / 2); min-height: calc((100dvh - 76px) / 2);
        }
        .card.entry textarea { flex: 1 1 auto; }
        label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 6px; letter-spacing: .03em; }

        .days { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 16px; }
        .day {
            height: 58px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg);
            padding: 0; cursor: pointer; color: var(--muted); line-height: 1.2;
            font: 600 15px Raleway, sans-serif; font-variant-numeric: lining-nums;
        }
        .day small { display: block; font-size: 11px; font-weight: 400; }
        .day.has { background: var(--phi); border-color: var(--phi); color: var(--bg); }
        .day.on { outline: 2px solid var(--lambda); outline-offset: 2px; }

        textarea {
            width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line);
            border-radius: 10px; padding: 12px; font: 20px/1.45 Raleway, sans-serif;
            min-height: 130px; resize: vertical;
        }
        textarea:focus { outline: 2px solid var(--lambda); outline-offset: 0; border-color: transparent; }

        .row { display: flex; gap: 10px; margin-top: 14px; }
        button.main, button.ghost {
            flex: 1; height: 58px; border-radius: 12px; cursor: pointer;
            font: 700 15px Orbitron, sans-serif; letter-spacing: .04em;
        }
        button.main { background: var(--lambda); color: var(--bg); border: 0; }
        button.mic {
            flex: 0 0 58px; height: 58px; border-radius: 12px; cursor: pointer; display: grid; place-items: center;
            background: transparent; color: var(--text); border: 1px solid var(--line);
        }
        button.mic svg { width: 26px; height: 26px; fill: currentColor; }
        button.mic.on { background: var(--upsilon); border-color: var(--upsilon); animation: pulse 1.2s ease-in-out infinite; }
        @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(176, 36, 24, .35); } }
        button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
        button:disabled { opacity: .5; cursor: default; }
        .status { min-height: 1.4em; margin-top: 10px; font: 14px Raleway, sans-serif; color: var(--muted); }
        .status:empty { min-height: 0; margin-top: 0; }   /* no gap while there is nothing to say - the text field gets it */
        .status.ok { color: var(--phi); }
        .status.err { color: var(--lambda); }

        a.cloudlink {
            display: flex; align-items: center; justify-content: center; gap: 10px; height: 58px; margin-top: 14px;
            border: 1px solid var(--line); border-radius: 12px; color: var(--text); text-decoration: none;
            font: 700 15px Orbitron, sans-serif; letter-spacing: .04em;
        }
        a.cloudlink svg { width: 26px; height: 26px; fill: var(--lambda); }
        ol.list { list-style: none; margin: 20px 0 0; padding: 0; }
        ol.list li {
            display: grid; grid-template-columns: 6.2em 1fr; gap: 10px; padding: 10px 4px;
            border-top: 1px solid var(--line); cursor: pointer; font: 15px/1.45 Raleway, sans-serif;
        }
        ol.list li:first-child { border-top: 0; }
        ol.list li:hover { background: rgba(120, 160, 220, .06); }
        ol.list time { color: var(--muted); font-variant-numeric: lining-nums tabular-nums; }

        .gate { text-align: center; padding: 30px 16px; }
        .gate p { font: 15px/1.5 Raleway, sans-serif; color: var(--muted); margin: 0 0 18px; }
        .gate button { max-width: 260px; }
        [hidden] { display: none !important; }
    </style>
</head>

<body>
    <div class="wrap">
        <!-- the year of the selected day; the day itself is the yellow frame in the strip -->
        <h1><span>I'm grateful for …</span><span id="year"></span></h1>

        <div class="card gate" id="gate" hidden>
            <p>Bitte einmal anmelden, danach merkt sich das Gerät die Anmeldung.</p>
            <button class="main" id="loginBtn" type="button">Anmelden</button>
        </div>

        <div id="app" hidden>
            <div class="card entry">
                <div class="days" id="days" role="group" aria-label="Letzte 5 Tage"></div>

                <textarea id="text" placeholder="Dass …" aria-label="Wofür bist du dankbar?"></textarea>

                <div class="row">
                    <button class="ghost" id="cancelBtn" type="button" hidden>Abbrechen</button>
                    <button class="main" id="saveBtn" type="button">Speichern</button>
                    <!-- mic: Material Icons "mic" (Apache 2.0) -->
                    <button class="mic" id="micBtn" type="button" aria-label="Diktieren">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
                    </button>
                </div>
                <div class="status" id="status" role="status"></div>
            </div>

            <!-- cloud: Material Symbols "cloud" (Apache 2.0) -->
            <a class="cloudlink" href="wolke.html"><svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M251-160q-88 0-149.5-61.5T40-371q0-78 50-137t127-71q20-97 94-158.5T482-799q112 0 189 81.5T748-522v24q72-2 122 46.5T920-329q0 69-50 119t-119 50H251Z"/></svg>Wortwolke</a>

            <!-- the latest entries; tap one to edit it (also older than the strip) -->
            <ol class="list" id="list" aria-label="Letzte Einträge"></ol>
        </div>
    </div>

    <script>
        (() => {
            const auth = window.svpAuth;
            const $ = id => document.getElementById(id);
            const DRAFT_KEY = 'grateful-draft';
            const WD = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
            const DAYS = 5;          // length of the day strip, today included

            let entries = [];        // newest first: { id, day, text }
            let selectedDay = null;  // YYYY-MM-DD the form is for - yellow frame in the strip, its year in the head
            let editing = null;      // id of the selected day's entry, null while the day is still empty
            let newTexts = {};       // day -> text typed for a day without entry, kept while other days are looked at

            /* local calendar date as YYYY-MM-DD (sv-SE formats exactly like that) */
            const iso = d => d.toLocaleDateString('sv-SE');
            const todayIso = () => iso(new Date());
            const shortDate = s => `${WD[new Date(s + 'T12:00:00').getDay()]} ${s.slice(8, 10)}.${s.slice(5, 7)}.`;
            const byId = id => entries.find(x => x.id === id);
            const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
            /* remember what is typed for an empty day (per day) */
            function keepNew() {
                if (editing) return;
                const t = $('text').value;
                if (t.trim()) newTexts[selectedDay] = t; else delete newTexts[selectedDay];
            }

            function status(msg, cls) {
                const el = $('status');
                el.textContent = msg || '';
                el.className = 'status' + (cls ? ' ' + cls : '');
            }

            /* the draft survives a failed save, a closed tab or a dead network */
            function saveDraft() {
                try {
                    localStorage.setItem(DRAFT_KEY, JSON.stringify({ day: selectedDay, editing, text: $('text').value, newTexts }));
                } catch (e) { }
            }
            function loadDraft() {
                try { return JSON.parse(localStorage.getItem(DRAFT_KEY)) || {}; } catch (e) { return {}; }
            }

            async function load() {
                const since = iso(new Date(Date.now() - 60 * 864e5));
                const res = await auth.api(`grateful?select=id,day,text&day=gte.${since}&order=day.desc,id.desc`);
                if (!res.ok) throw new Error(res.status === 401 || res.status === 403 ? 'Kein Zugriff mit diesem Konto' : 'HTTP ' + res.status);
                entries = await res.json();
            }

            /* Save button names what happens; "Abbrechen" only while a stored entry has unsaved changes (it reverts) */
            function buttons() {
                const e = editing && byId(editing);
                $('saveBtn').textContent = editing ? 'Ändern' : 'Speichern';
                $('cancelBtn').hidden = !(e && $('text').value !== e.text);
            }

            /* The form always shows the selected day: its stored entry, or the text typed for a new one */
            function fill(day, entry) {
                if (ear && ear.active) ear.stop();       // a running dictation belongs to the day it started on
                selectedDay = day;
                $('year').textContent = day.slice(0, 4);
                editing = entry ? entry.id : null;
                $('text').value = entry ? entry.text : (newTexts[day] || '');
                buttons();
                render();
                saveDraft();
            }
            const showDay = d => fill(d, entries.find(x => x.day === d));   // newest entry of that day
            const showEntry = id => { const e = byId(id); if (e) fill(e.day, e); };

            function render() {
                const byDay = new Set(entries.map(e => e.day));
                const days = $('days');
                days.innerHTML = '';
                for (let i = DAYS - 1; i >= 0; i--) {
                    const d = iso(new Date(Date.now() - i * 864e5));
                    const b = document.createElement('button');
                    b.type = 'button';
                    b.className = 'day' + (byDay.has(d) ? ' has' : '') + (d === selectedDay ? ' on' : '');
                    b.innerHTML = `<small>${WD[new Date(d + 'T12:00:00').getDay()]}</small>${d.slice(8, 10)}.${d.slice(5, 7)}.`;
                    b.setAttribute('aria-label', shortDate(d) + (byDay.has(d) ? ' – eingetragen' : ' – noch leer'));
                    b.onclick = () => { status(''); showDay(d); };
                    days.appendChild(b);
                }
                $('list').innerHTML = entries.slice(0, 30).map(e =>
                    `<li data-id="${e.id}"><time datetime="${e.day}">${shortDate(e.day)}</time><span>${esc(e.text)}</span></li>`
                ).join('');
            }

            async function save() {
                // still dictating: end it first, the final text is saved right after (onFinal)
                if (ear && ear.active) { saveAfterDictation = true; ear.stop(); return; }
                const day = selectedDay, text = $('text').value.trim();
                if (!text) { status('Bitte erst etwas schreiben.', 'err'); return; }
                saveDraft();
                $('saveBtn').disabled = true;
                status('Speichere …');
                try {
                    const wasEdit = !!editing;
                    const res = wasEdit
                        ? await auth.api(`grateful?id=eq.${editing}`, {
                            method: 'PATCH', headers: { Prefer: 'return=representation' }, body: JSON.stringify({ text })
                        })
                        : await auth.api('grateful', {
                            method: 'POST', headers: { Prefer: 'return=representation' }, body: JSON.stringify([{ day, text }])
                        });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const rows = await res.json();
                    if (!rows.length) throw new Error('nichts gespeichert');
                    if (!wasEdit) delete newTexts[day];
                    await load();
                    showEntry(rows[0].id);
                    status(wasEdit ? 'Geändert.' : 'Gespeichert. Schön!', 'ok');
                } catch (e) {
                    status('Nicht gespeichert (' + e.message + ') – der Text bleibt hier stehen.', 'err');
                } finally {
                    $('saveBtn').disabled = false;
                }
            }

            /* Dictation: the spoken text lands behind what is already typed, live while speaking */
            let ear = null, dictBase = '', dictDay = null, saveAfterDictation = false;
            const join = (a, b) => (a && b ? a + ' ' + b : a || b);
            const capital = t => t.charAt(0).toUpperCase() + t.slice(1);
            function setMic(on) {
                $('micBtn').classList.toggle('on', on);
                $('micBtn').setAttribute('aria-label', on ? 'Diktat beenden' : 'Diktieren');
            }
            function dictated(t) {
                if (selectedDay !== dictDay) return;    // the day was switched meanwhile
                $('text').value = join(dictBase, dictBase ? t : capital(t));
                keepNew();
                buttons();
            }
            function dictate() {
                if (ear && ear.active) { ear.stop(); return; }
                if (!window.SolitaListen) { status('Diktieren ist hier nicht geladen.', 'err'); return; }
                if (!ear) ear = window.SolitaListen({
                    lang: 'de-DE',
                    onState: st => {
                        if (st === 'unsupported') status('Diktieren geht in diesem Browser nicht – die Mikrofon-Taste der Tastatur geht immer.', 'err');
                        setMic(st === 'listening');
                    },
                    onPartial: t => { if (t) dictated(t); },
                    onFinal: t => {
                        dictated(t);
                        setMic(false);
                        saveDraft();
                        if (saveAfterDictation) { saveAfterDictation = false; save(); }
                    },
                    log: m => console.log('[grateful]', m)
                });
                dictBase = $('text').value.trim();
                dictDay = selectedDay;
                status('');
                ear.start();
            }

            async function showApp() {
                $('gate').hidden = true;
                $('app').hidden = false;
                try { await load(); } catch (e) { status(e.message, 'err'); }
                // back to where the last visit stopped, unsaved text included
                const d = loadDraft();
                newTexts = d.newTexts || {};
                if (d.editing && byId(d.editing)) showEntry(d.editing);
                else showDay(d.day && !d.editing ? d.day : todayIso());
                if (typeof d.text === 'string' && d.day === selectedDay && d.text !== $('text').value) {
                    $('text').value = d.text;
                    keepNew();
                    buttons();
                }
            }

            function init() {
                $('year').textContent = todayIso().slice(0, 4);
                $('text').addEventListener('input', () => {
                    keepNew();
                    buttons();
                    saveDraft();
                });
                $('text').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) save(); });
                $('saveBtn').onclick = save;
                $('micBtn').onclick = dictate;
                $('cancelBtn').onclick = () => {   // revert the stored entry
                    const e = editing && byId(editing);
                    if (e) { $('text').value = e.text; buttons(); saveDraft(); }
                    status('');
                };
                $('list').addEventListener('click', e => {
                    const li = e.target.closest('li[data-id]');
                    if (!li) return;
                    status('');
                    showEntry(Number(li.dataset.id));
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
                $('loginBtn').onclick = () => auth.loginDialog(showApp, 'Anmelden für dein Dankbarkeits-Tagebuch');

                if (auth.hasSession()) showApp(); else $('gate').hidden = false;
            }

            init();
        })();
    </script>
</body>

</html>
