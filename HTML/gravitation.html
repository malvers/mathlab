<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOC ALVERS MATHE-LABORE | Gravitation</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="resources/favicon.png">
    <link rel="stylesheet" href="js/cyber-layout.css">
    <link rel="stylesheet" href="js/buttons-ultra.css">
    <link rel="stylesheet" href="js/cyber-lab-overrides.css">
    <link rel="stylesheet" href="js/branding.styles.extracted.css">
    <link rel="stylesheet" href="js/lab-shell-minimal.css">
    <style>
        #side-panel .cyber-btn {
            min-height: unset !important;
            padding: 8px 10px !important;
            font-size: 0.7rem !important;
            letter-spacing: 1.5px !important;
        }

        .cyber-number-widget {
            display: inline-flex;
            gap: 3px;
            align-items: center;
            font-family: 'Orbitron', monospace;
        }

        .cyber-digit-box {
            width: 18px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 200, 255, 0.05);
            border: 1px solid rgba(0, 200, 255, 0.2);
            border-radius: 3px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #0a1628;
            letter-spacing: 1px;
        }

        .cyber-digit-box.separator {
            width: 10px;
            background: transparent;
            border: none;
            color: #0a1628;
        }
    </style>
</head>

<body>
    <nav id="mini-rail">
        <div class="nav-btn" onclick="toggleSidebar()" title="Toggle Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </div>
    </nav>

    <aside id="side-panel">
        <header id="sidebar-header"></header>
        <div id="sb-scene"><div id="ui-container"></div></div>
        <div id="sb-polyeder" style="display:none; overflow-y:auto; flex:1;"></div>
    </aside>

    <main id="main-content" style="display:flex; flex-direction:column;">
        <div id="tab-bar" style="
            display:flex; gap:0; padding:0 8px; align-items:stretch;
            background:#07111f; border-bottom:1px solid rgba(255,255,255,0.08);
            flex-shrink:0;">
            <button id="tab-btn-scene" onclick="switchTab('scene')" style="
                font-family:Orbitron; font-size:0.6rem; letter-spacing:1px;
                padding:11px 20px; border:none; border-radius:0; cursor:pointer;
                background:transparent; color:#eee;
                border-top:2px solid #f5a623;">SZENE</button>
            <button id="tab-btn-polyeder" onclick="switchTab('polyeder')" style="
                font-family:Orbitron; font-size:0.6rem; letter-spacing:1px;
                padding:11px 20px; border:none; border-radius:0; cursor:pointer;
                background:transparent; color:#555;
                border-top:2px solid transparent;">POLYEDER</button>
        </div>

        <div id="tab-scene" style="flex:1; position:relative;">
            <div id="canvas-container" style="width:100%; height:100%;"></div>
            <div id="gz-result" style="
                display:none; position:absolute; top:12px; left:12px;
                padding:6px 14px; border-radius:4px;
                background:#6b8e23; font-family:Orbitron; pointer-events:none;">
                <div id="gz-val" style="font-size:1rem; color:#0a1628; letter-spacing:1px;">—</div>
            </div>
        </div>

        <div id="tab-polyeder" style="flex:1; display:none; overflow:hidden;">
            <div id="poly-canvas-container" style="width:100%; height:100%; position:relative;"></div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TrackballControls.js"></script>
    <script src="js/cyber-left-chrome.js"></script>
    <script src="js/branding/briefings.js?v=542"></script>
    <script src="js/branding/overlays.js?v=542"></script>
    <script src="js/i18n.js"></script>
    <script src="js/i18n-de.js"></script>
    <script src="js/i18n-en.js"></script>
    <script src="js/i18n-es.js"></script>
    <script src="js/i18n-fr.js"></script>
    <script src="js/i18n-it.js"></script>
    <script src="js/i18n-pt.js"></script>
    <script src="js/i18n-sw.js"></script>
    <script src="js/i18n-tr.js"></script>
    <script src="js/i18n-nl.js"></script>
    <script src="js/branding/nav.js?v=542"></script>
    <script src="js/branding.js?v=542"></script>
    <script src="js/ui.js?v=544"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
    <script src="js/TS.js"></script>
    <script src="js/gotzelahmayer.js"></script>
    <script>window.MathJax = { tex: { inlineMath: [['\\(','\\)']] }, startup: { typeset: false } };</script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

    <script>
        function toggleSidebar() {
            const panel = document.getElementById('side-panel');
            panel.classList.toggle('collapsed');
            if (window.CyberLeftChrome && typeof CyberLeftChrome.publishResolvedScale === 'function') {
                CyberLeftChrome.publishResolvedScale();
            }
            setTimeout(() => {
                window.dispatchEvent(new Event('resize'));
                if (window.CyberLeftChrome && typeof CyberLeftChrome.publishResolvedScale === 'function') {
                    CyberLeftChrome.publishResolvedScale();
                }
            }, 400);
        }

        window.addEventListener('load', () => {
            CyberBranding.init({
                useExternalStyles: true,
                title: CyberI18n.get('ui.coach_title'),
                subtitle: 'Gravitation',
            });
            CyberUI.init();

            if (window.CyberLeftChrome && typeof CyberLeftChrome.configure === 'function') {
                CyberLeftChrome.configure({ viewportOnlyZoom: true });
            }

            // --- Three.js Scene ---
            const container = document.getElementById('canvas-container');

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050a14);

            const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
            camera.position.set(3.5, 4.0, 6.0);
            camera.lookAt(0, 0, 0);

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const controls = new THREE.TrackballControls(camera, renderer.domElement);
            controls.rotateSpeed = 1.3;
            controls.zoomSpeed = 1.05;
            controls.panSpeed = 0.32;
            controls.staticMoving = false;
            controls.dynamicDampingFactor = 0.14;
            controls.minDistance = 2;
            controls.maxDistance = 20;

            // Beleuchtung
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2);
            dirLight.position.set(3, 5, 4);
            scene.add(dirLight);

            const backLight = new THREE.DirectionalLight(0x4466ff, 0.4);
            backLight.position.set(-3, -2, -4);
            scene.add(backLight);

            // Transparente orange Kugel Radius 1
            const sphereGeo = new THREE.SphereGeometry(1, 64, 64);
            const sphereMat = new THREE.MeshPhongMaterial({
                color: 0xff6600,
                transparent: true,
                opacity: 0.15,
                shininess: 0,
                specular: new THREE.Color(0x000000),
                side: THREE.DoubleSide,
                depthWrite: false,
            });
            const sphere = new THREE.Mesh(sphereGeo, sphereMat);
            scene.add(sphere);

            // Wireframe Umriss
            const wireGeo = new THREE.SphereGeometry(1, 24, 16);
            const wireMat = new THREE.MeshBasicMaterial({
                color: 0xff8833,
                wireframe: true,
                transparent: true,
                opacity: 0.15,
            });
            const wireMesh = new THREE.Mesh(wireGeo, wireMat);
            scene.add(wireMesh);

            // Coordinate axes
            const axisLen = 2.5;
            const axisNegLen = axisLen;

            function makeAxisLine(from, to, color) {
                const geo = new THREE.BufferGeometry().setFromPoints([from, to]);
                return new THREE.Line(geo, new THREE.LineBasicMaterial({ color, linewidth: 1 }));
            }
            const headLen = 0.18, headWid = 0.04;
            scene.add(new THREE.ArrowHelper(new THREE.Vector3(1,0,0),  new THREE.Vector3(0,0,0), axisLen,    0xff4444, headLen, headWid));
            scene.add(new THREE.ArrowHelper(new THREE.Vector3(0,1,0),  new THREE.Vector3(0,0,0), axisLen,    0x44ff44, headLen, headWid));
            scene.add(new THREE.ArrowHelper(new THREE.Vector3(0,0,1),  new THREE.Vector3(0,0,0), axisLen,    0x4488ff, headLen, headWid));
            scene.add(new THREE.ArrowHelper(new THREE.Vector3(-1,0,0), new THREE.Vector3(0,0,0), axisNegLen, 0xff4444, headLen, headWid));
            scene.add(new THREE.ArrowHelper(new THREE.Vector3(0,-1,0), new THREE.Vector3(0,0,0), axisNegLen, 0x44ff44, headLen, headWid));
            scene.add(new THREE.ArrowHelper(new THREE.Vector3(0,0,-1), new THREE.Vector3(0,0,0), axisNegLen, 0x4488ff, headLen, headWid));

            // Axis labels — LaTeX-style sprites
            // axis letters: italic serif; numbers: upright serif (LaTeX math mode convention)
            function makeLabel(text, color, alpha = 1.0, isNumber = false) {
                const canvas = document.createElement('canvas');
                canvas.width = 128; canvas.height = 128;
                const ctx = canvas.getContext('2d');
                ctx.font = isNumber
                    ? '56px "Times New Roman", Georgia, serif'
                    : 'italic 72px "Times New Roman", Georgia, serif';
                ctx.fillStyle = color;
                ctx.globalAlpha = alpha;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, 64, 68);
                const tex = new THREE.CanvasTexture(canvas);
                const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
                const sprite = new THREE.Sprite(mat);
                sprite.renderOrder = 999;
                sprite.scale.set(0.22, 0.22, 1);
                return sprite;
            }

            // Axis name labels at tips
            const lx = makeLabel('x', '#ff6666'); lx.position.set(axisLen + 0.22, 0, 0); scene.add(lx);
            const ly = makeLabel('y', '#66ff66'); ly.position.set(0, axisLen + 0.22, 0); scene.add(ly);
            const lz = makeLabel('z', '#6699ff'); lz.position.set(0, 0, axisLen + 0.22); scene.add(lz);

            // Tick marks + number labels at integers up to 2 (and -1)
            function makeTick(pos, axis, color) {
                const t = 0.06;
                let a, b;
                if (axis === 'x') { a = new THREE.Vector3(pos, -t, 0); b = new THREE.Vector3(pos,  t, 0); }
                if (axis === 'y') { a = new THREE.Vector3(-t, pos, 0); b = new THREE.Vector3( t, pos, 0); }
                if (axis === 'z') { a = new THREE.Vector3(-t, 0, pos); b = new THREE.Vector3( t, 0, pos); }
                scene.add(makeAxisLine(a, b, color));
            }

            function addTicksForAxis(axis, color, hexColor) {
                const posVals = [1, 2];
                const negVals = [-1, -2];
                [...posVals, ...negVals].forEach(v => {
                    makeTick(v, axis, hexColor);
                    const lbl = makeLabel(String(v), color, 1.0, true);
                    lbl.scale.set(0.18, 0.18, 1);
                    const off = 0.22;
                    if (axis === 'x') lbl.position.set(v, -off, 0);
                    if (axis === 'y') lbl.position.set(-off, v, 0);
                    if (axis === 'z') lbl.position.set(-off, 0, v);
                    scene.add(lbl);
                });
            }

            addTicksForAxis('x', '#ff6666', 0xff4444);
            addTicksForAxis('y', '#66ff66', 0x44ff44);
            addTicksForAxis('z', '#6699ff', 0x4488ff);

            // Wireframe reference cube −2…+2
            const cubeEdges = new THREE.EdgesGeometry(new THREE.BoxGeometry(4, 4, 4));
            scene.add(new THREE.LineSegments(cubeEdges, new THREE.LineBasicMaterial({
                color: 0x224466, transparent: true, opacity: 0.5
            })));

            // Measurement point M
            const M = new THREE.Vector3(1.9, 1.9, 1.9);
            const mRadius = 0.05;

            const mCone = new THREE.Mesh(
                new THREE.SphereGeometry(mRadius, 16, 16),
                new THREE.MeshPhongMaterial({ color: 0xff2222, shininess: 60 })
            );
            mCone.position.set(M.x, M.y, M.z);
            scene.add(mCone);

            function updateM() {
                mCone.position.set(M.x, M.y, M.z);
                connectionLines.forEach(line => {
                    const pos = line.geometry.attributes.position;
                    pos.setXYZ(1, M.x, M.y, M.z);
                    pos.needsUpdate = true;
                });
                computeGz();
            }

            // --- Persistence ---
            const STORE = 'gravitation_view';
            const saved = JSON.parse(localStorage.getItem(STORE) || 'null');

            if (saved?.cam) {
                camera.position.set(saved.cam.x, saved.cam.y, saved.cam.z);
                camera.lookAt(0, 0, 0);
            }

            function saveState() {
                localStorage.setItem(STORE, JSON.stringify({
                    cam: { x: camera.position.x, y: camera.position.y, z: camera.position.z },
                    wire: wireMesh.visible,
                    m: { x: M.x, y: M.y, z: M.z },
                }));
            }

            controls.addEventListener('change', saveState);

            wireMesh.visible = true;

            // --- Sidebar UI ---
            function makeSwitch(id, label, checked) {
                const on = checked;
                return `
                <div style="display:flex; align-items:center; justify-content:space-between; padding:4px 0;">
                    <span style="font-family:Orbitron; font-size:0.7rem; color:var(--neon-blue); letter-spacing:1px;">${label}</span>
                    <label style="position:relative; display:inline-block; width:40px; height:22px; cursor:pointer;">
                        <input type="checkbox" id="${id}" ${on ? 'checked' : ''}
                               style="opacity:0; width:0; height:0; position:absolute;"
                               onchange="document.getElementById('${id}')._cb(this.checked)">
                        <span id="${id}-knob" style="
                            position:absolute; top:0; left:0; right:0; bottom:0;
                            background:${on ? 'rgba(0,210,255,0.25)' : 'rgba(255,255,255,0.05)'};
                            border:1px solid ${on ? 'rgba(0,210,255,0.5)' : 'rgba(255,255,255,0.2)'};
                            border-radius:11px; transition:background 0.2s;">
                            <span id="${id}-thumb" style="
                                position:absolute; top:3px; left:3px;
                                width:14px; height:14px;
                                background:${on ? '#00d2ff' : 'rgba(255,255,255,0.3)'};
                                border-radius:50%; transition:transform 0.2s;
                                transform:${on ? 'translateX(18px)' : 'translateX(0)'};
                            "></span>
                        </span>
                    </label>
                </div>`;
            }

            function applySwitch(id, on) {
                const knob = document.getElementById(id + '-knob');
                const thumb = document.getElementById(id + '-thumb');
                if (!knob) return;
                knob.style.background = on ? 'rgba(0,210,255,0.25)' : 'rgba(255,255,255,0.05)';
                knob.style.borderColor = on ? 'rgba(0,210,255,0.5)' : 'rgba(255,255,255,0.2)';
                thumb.style.background = on ? '#00d2ff' : 'rgba(255,255,255,0.3)';
                thumb.style.transform = on ? 'translateX(18px)' : 'translateX(0)';
            }

            // --- Dreieck state (early, needed by Ansicht card) ---
            let currentTriangle = [];
            let connectionLines = [];
            let connectionsOn = true;

            // --- Sidebar: Ansicht ---
            CyberUI.createCard('ui-container', 'Ansicht',
                makeSwitch('wire-toggle', 'GRADNETZ', true) +
                makeSwitch('conn-toggle', 'VERBINDUNGEN', true) + `
                <div style="margin-top:10px;">
                    <button class="cyber-btn" onclick="resetView()"
                            style="width:100%; padding:2px 8px; font-size:0.7rem;">
                        RESET VIEW
                    </button>
                </div>`,
                '#ffdd00'
            );

            wireMesh.visible = true;

            let _currentTab = 'scene';

            document.getElementById('wire-toggle')._cb = (on) => {
                if (_currentTab === 'scene') {
                    wireMesh.visible = on;
                    saveState();
                } else if (_currentTab === 'polyeder' && _polyWire) {
                    _polyWire.visible = on;
                }
                applySwitch('wire-toggle', on);
            };

            document.getElementById('conn-toggle')._cb = (on) => {
                if (_currentTab === 'scene') {
                    connectionsOn = on;
                    connectionLines.forEach(l => l.visible = on);
                } else if (_currentTab === 'polyeder' && _polyMCone) {
                    _polyMCone.visible = on;
                }
                applySwitch('conn-toggle', on);
            };

            window.resetView = function() {
                if (_currentTab === 'polyeder') {
                    if (!_polyCamera) return;
                    _polyCamera.position.set(3.5, 4.0, 6.0);
                    _polyCamera.lookAt(0, 0, 0);
                    _polyControls.target.set(0, 0, 0);
                    _polyControls.update();
                    if (_polyWire) _polyWire.visible = true;
                    document.getElementById('wire-toggle').checked = true;
                    applySwitch('wire-toggle', true);
                } else {
                    camera.position.set(3.5, 4.0, 6.0);
                    camera.lookAt(0, 0, 0);
                    controls.target.set(0, 0, 0);
                    controls.update();
                    wireMesh.visible = true;
                    document.getElementById('wire-toggle').checked = true;
                    applySwitch('wire-toggle', true);
                    saveState();
                }
            };

            // --- Sidebar: Geometrie ---
            window.newTriangle = function(fixedPts) {
                currentTriangle.forEach(o => scene.remove(o));
                connectionLines.forEach(o => scene.remove(o));
                currentTriangle = [];
                connectionLines = [];

                const pts = fixedPts || randomPointsOnSphere(3);
                const [a, b, c] = pts.map(p => new THREE.Vector3(...p));

                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.BufferAttribute(
                    new Float32Array([a.x,a.y,a.z, b.x,b.y,b.z, c.x,c.y,c.z]), 3
                ));
                geo.computeVertexNormals();
                const color = new THREE.Color(0xffdd00);
                const face = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
                    color, transparent: true, opacity: 0.35,
                    side: THREE.DoubleSide, depthWrite: false
                }));
                const edge = new THREE.Line(
                    new THREE.BufferGeometry().setFromPoints([a, b, c, a]),
                    new THREE.LineBasicMaterial({ color })
                );
                scene.add(face);
                scene.add(edge);
                currentTriangle.push(face, edge);
                _triVerts = [a, b, c];
                showTriangleCoords([a, b, c]);
                computeGz();

                // Verbindungslinien Ecken → M
                const lineMat = new THREE.LineBasicMaterial({
                    color: 0xffffff, transparent: true, opacity: 0.5
                });
                [a, b, c].forEach(pt => {
                    const line = new THREE.Line(
                        new THREE.BufferGeometry().setFromPoints([pt, M]),
                        lineMat
                    );
                    line.visible = connectionsOn;
                    scene.add(line);
                    connectionLines.push(line);
                });
            };

            window.clearTriangle = function() {
                currentTriangle.forEach(o => scene.remove(o));
                connectionLines.forEach(o => scene.remove(o));
                currentTriangle = [];
                connectionLines = [];
                _triVerts = null;
                showTriangleCoords(null);
                document.getElementById('gz-result').style.display = 'none';
            };

            CyberUI.createCard('ui-container', 'Geometrie', `

                <button class="cyber-btn" onclick="newTriangle()"
                        style="width:100%; padding:2px 8px; font-size:0.7rem;">
                    ERZEUGE DREIECK
                </button>
                <div style="margin-top:8px;">
                    <div style="padding:4px 8px 4px 10px;background:rgba(0,200,255,0.05);border:1px solid rgba(0,200,255,0.18);border-radius:4px;margin-bottom:6px;display:grid;grid-template-columns:16px 14px 56px 14px 56px 14px 56px;align-items:center;gap:2px 4px;font-family:Orbitron;font-size:0.75rem;letter-spacing:1px;">
                        <span style="color:#ffdd00;">A</span>
                        <span style="color:#ff4455;">X</span><span id="dk-x-A" style="color:#eee;">&#8212;</span>
                        <span style="color:#44ff88;">Y</span><span id="dk-y-A" style="color:#eee;">&#8212;</span>
                        <span style="color:#4499ff;">Z</span><span id="dk-z-A" style="color:#eee;">&#8212;</span>
                    </div>
                    <div style="padding:4px 8px 4px 10px;background:rgba(0,200,255,0.05);border:1px solid rgba(0,200,255,0.18);border-radius:4px;margin-bottom:6px;display:grid;grid-template-columns:16px 14px 56px 14px 56px 14px 56px;align-items:center;gap:2px 4px;font-family:Orbitron;font-size:0.75rem;letter-spacing:1px;">
                        <span style="color:#ffdd00;">B</span>
                        <span style="color:#ff4455;">X</span><span id="dk-x-B" style="color:#eee;">&#8212;</span>
                        <span style="color:#44ff88;">Y</span><span id="dk-y-B" style="color:#eee;">&#8212;</span>
                        <span style="color:#4499ff;">Z</span><span id="dk-z-B" style="color:#eee;">&#8212;</span>
                    </div>
                    <div style="padding:4px 8px 4px 10px;background:rgba(0,200,255,0.05);border:1px solid rgba(0,200,255,0.18);border-radius:4px;margin-bottom:6px;display:grid;grid-template-columns:16px 14px 56px 14px 56px 14px 56px;align-items:center;gap:2px 4px;font-family:Orbitron;font-size:0.75rem;letter-spacing:1px;">
                        <span style="color:#ffdd00;">C</span>
                        <span style="color:#ff4455;">X</span><span id="dk-x-C" style="color:#eee;">&#8212;</span>
                        <span style="color:#44ff88;">Y</span><span id="dk-y-C" style="color:#eee;">&#8212;</span>
                        <span style="color:#4499ff;">Z</span><span id="dk-z-C" style="color:#eee;">&#8212;</span>
                    </div>
                </div>
            `, '#ffdd00', { collapsible: true });

            let _triVerts = null;

            function computeGz() {
                if (!_triVerts) return;
                const [a, b, c] = _triVerts;
                const gz = calculateTriangleGz(
                    [a.x, a.y, a.z], [b.x, b.y, b.z], [c.x, c.y, c.z],
                    [M.x, M.y, M.z]
                );
                document.getElementById('gz-val').innerHTML = 'g<sub>z</sub> ' + gz.toFixed(4) + ' mGal';
                document.getElementById('gz-result').style.display = 'block';
                if (typeof updateNNPrediction === 'function') updateNNPrediction();
            }

            const fmtCoord = n => n < 0
                ? n.toFixed(2)
                : '<span style="visibility:hidden">-</span>' + n.toFixed(2);

            function showTriangleCoords(verts) {
                ['A','B','C'].forEach((l, i) => {
                    const v = verts ? verts[i] : null;
                    document.getElementById('dk-x-' + l).innerHTML = v ? fmtCoord(v.x) : '—';
                    document.getElementById('dk-y-' + l).innerHTML = v ? fmtCoord(v.y) : '—';
                    document.getElementById('dk-z-' + l).innerHTML = v ? fmtCoord(v.z) : '—';

            const TD_STRIDE = 13;
            const TD_TOTAL  = 100000;
            let _trainingData = null; // Float32Array when ready

            window.generateTrainingData = function() {
                _trainingData = new Float32Array(TD_TOTAL * TD_STRIDE);
                const CHUNK = 200;

                const btn  = document.getElementById('gen-td-btn');
                const wrap = document.getElementById('td-progress-wrap');
                const bar  = document.getElementById('td-bar');
                const cnt  = document.getElementById('td-count');

                btn.disabled = true;
                btn.textContent = 'LÄUFT…';
                wrap.style.display = 'block';
                bar.style.width = '0%';
                cnt.textContent = '0';

                const mx = M.x, my = M.y, mz = M.z;

                function runChunk(start) {
                    const end = Math.min(start + CHUNK, TD_TOTAL);
                    for (let i = start; i < end; i++) {
                        const [a, b, c] = randomPointsOnSphere(3);
                        const gz = calculateTriangleGz(a, b, c, [mx, my, mz]);
                        const o = i * TD_STRIDE;
                        _trainingData[o]   = a[0]; _trainingData[o+1] = a[1]; _trainingData[o+2] = a[2];
                        _trainingData[o+3] = b[0]; _trainingData[o+4] = b[1]; _trainingData[o+5] = b[2];
                        _trainingData[o+6] = c[0]; _trainingData[o+7] = c[1]; _trainingData[o+8] = c[2];
                        _trainingData[o+9] = mx;   _trainingData[o+10]= my;   _trainingData[o+11]= mz;
                        _trainingData[o+12]= gz;
                    }
                    bar.style.width = (end / TD_TOTAL * 100) + '%';
                    cnt.textContent = end;
                    if (end < TD_TOTAL) {
                        requestAnimationFrame(() => runChunk(end));
                    } else {
                        btn.disabled = false;
                        btn.textContent = 'ERZEUGE TRAININGSDATEN';
                    }
                }

                requestAnimationFrame(() => runChunk(0));
            };

            function drawLossCanvas(history) {
                const canvas = document.getElementById('nn-loss-canvas');
                if (!canvas || history.length < 2) return;
                const ctx = canvas.getContext('2d');
                const W = canvas.width, H = canvas.height;
                ctx.clearRect(0, 0, W, H);
                const mn = Math.min(...history), mx = Math.max(...history);
                const rng = mx - mn || 1;
                ctx.strokeStyle = '#ffdd00';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                history.forEach((v, i) => {
                    const x = (i / (history.length - 1)) * W;
                    const y = H - ((v - mn) / rng) * (H - 4) - 2;
                    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                });
                ctx.stroke();
            }

                const pred = GravTF.predict(inputs);

                document.getElementById('nn-pred-val').textContent = pred.toFixed(4)   + ' mGal';

                    </div>
                    <div style="font-size:0.5rem; color:#aaa; letter-spacing:1px; margin-bottom:4px; font-family:Orbitron;">NEWTON (exakt)</div>
                    <div style="background:#77b521; border-radius:4px; padding:10px 12px; margin-bottom:10px;">
                        <div id="poly-newton-val" style="font-family:'Times New Roman',serif; font-size:1.3rem; color:#0a1628;">—</div>
                    </div>
                    <div style="font-size:0.5rem; color:#aaa; letter-spacing:1px; margin-bottom:4px; font-family:Orbitron;">ABWEICHUNG</div>
                    <div style="background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); border-radius:4px; padding:10px 12px; margin-bottom:10px;">
                        <div id="poly-diff-val" style="font-family:'Times New Roman',serif; font-size:1.3rem; color:#ff4444;">—</div>
                    </div>
                </div>
            `, '#f5a623');

            // Tab-Wahl + Dreiecke-Auswahl wiederherstellen (nach Card-Erstellung)
            const _savedTab = localStorage.getItem('gravitation_tab');
            const _savedPolySegs = localStorage.getItem('gravitation_poly_segs');
            if (_savedPolySegs) {
                const segsEl = document.getElementById('poly-segs');
                if (segsEl) segsEl.value = _savedPolySegs;
            }
            if (_savedTab) switchTab(_savedTab);

            // --- Polyeder gz ---
            window.runPolyederGz = function() {
                const wSegs = parseInt(document.getElementById('poly-segs').value);
                const hSegs = wSegs / 2;
                const Rkm   = 1;
                const Rm    = Rkm * 1000;                               // scene unit → meters
                const mArr  = [M.x * Rm, M.y * Rm, M.z * Rm];         // M in meters

                const { vertices, faces } = makeSpherePolyhedron(1, wSegs, hSegs);
                const verticesM = vertices.map(([vx, vy, vz]) => [vx * Rm, vy * Rm, vz * Rm]);

                const gz     = calculatePolyhedronGz(verticesM, faces, mArr, _sphereRho);
                const gzNewt = calculateSphereNewton(Rm, _sphereRho, mArr);

                const newtInside = isNaN(gzNewt);
                const diff       = newtInside ? null : (gz - gzNewt) / Math.abs(gzNewt) * 100;

                _updatePolyWire(wSegs, hSegs);

                document.getElementById('poly-gz-val').innerHTML =
                    '\\(g_z = ' + gz.toFixed(3) + '\\,\\text{mGal}\\)';

                if (newtInside) {
                    document.getElementById('poly-newton-val').textContent = '(P innerhalb der Kugel)';
                } else {
                    document.getElementById('poly-newton-val').innerHTML =
                        '\\(g_z = ' + gzNewt.toFixed(3) + '\\,\\text{mGal}\\)';
                }

                const diffEl = document.getElementById('poly-diff-val');
                if (diff === null) {
                    diffEl.textContent = '—';
                } else {
                    diffEl.innerHTML = '\\(\\Delta = ' + Math.abs(diff).toFixed(2) + '\\,\\%\\)';
                }

                if (window.MathJax) MathJax.typesetPromise([
                    document.getElementById('poly-gz-val'),
                    document.getElementById('poly-newton-val'),
                    diffEl
                ]).catch(() => {});

                document.getElementById('poly-result').style.display = 'block';
            };

            runPolyederGz();

        });
    </script>
</body>
