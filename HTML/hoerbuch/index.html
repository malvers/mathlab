<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Hörbuch</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#08142a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Doc's login of the Stoffverteilungsplan (same site): the notes go to Supabase with it. The page works without it. -->
<script src="../svp/svp-auth.js"></script>
<script src="../js/solita-listen.js"></script>   <!-- speaking a note: the shared speech engine -->

<style>
/* Audiobook with karaoke: the sentence Solita is reading lights up. One page, two builds:
   - local (build_karaoke.py): text + sentence times inlined, MP3s next to the page - works opened as a file.
   - sealed (pack_hoerbuch.mjs, docalvers.de/hoerbuch/): no book content in the page at all. Text and sound come
     AES-GCM encrypted from the R2 bucket; the key is unwrapped with Doc's password and remembered on the device;
     "Offline laden" keeps every chapter (still encrypted) in this browser for the plane. */
:root {
  /* the three schemes of the Stoffverteilungsplan, values exactly as in HTML/svp/svp-tokens.css
     (Doc 15.10.2026: "wie beim Stoffverteilungsplan das graue Scheme und auch das helle") */
  --bg: rgb(8, 20, 42);            /* Blau (dark): nearly black navy - never pure black */
  --card: rgb(14, 36, 78);
  --panel: rgba(14, 36, 78, 0.55);
  --bar-bg: rgba(12, 30, 64, 0.97);
  --head-bg: rgba(8, 20, 42, 0.94);
  --drawer: rgb(12, 30, 64);
  --line: rgba(120, 160, 220, 0.22);
  --ink: rgba(225, 235, 250, 0.92);
  --muted: rgba(170, 190, 220, 0.65);
  --head: rgb(248, 251, 255);
  --accent: rgb(245, 194, 66);     /* lambda: forloop orange */
  --tint: 120, 160, 220;
  --input-bg: rgba(8, 20, 42, 0.7);
  --trough: rgba(8, 20, 42, 0.9);
  --thumb: rgba(120, 160, 220, 0.35);
  --shadow: rgba(0, 0, 0, 0.45);
  --green: rgb(121, 158, 49);
  --hl: 245, 194, 66;              /* karaoke: the group or sentence being read */
  --hl-a: 0.22;
  --cur-a: 0.28;                   /* the frame around it (sentence in Gruppe, group in Wort) - as visible as in Hell (Doc 17.10.) */
  --hl-ink: rgb(255, 255, 255);
  --orange: rgb(245, 194, 66);     /* the word being read, play button: filled orange, navy ink - in every scheme */
  --navy: rgb(14, 36, 78);
  --bar-h: 132px;
  --word-on: var(--accent);       /* the word being read (mode Wort) */
  --word-ink: var(--bg);
  --time: rgba(225, 235, 250, 0.85);   /* times in the bar and the menu: readable, not muted (Doc 21.10.2026) */
}
html.theme-grey {
  --bg: rgb(26, 26, 28);
  --card: rgb(37, 37, 40);
  --panel: rgba(37, 37, 40, 0.55);
  --bar-bg: rgba(31, 31, 34, 0.97);
  --head-bg: rgba(26, 26, 28, 0.94);
  --drawer: rgb(31, 31, 34);
  --line: rgba(205, 210, 220, 0.18);
  --ink: rgb(212, 212, 216);
  --muted: rgba(212, 212, 216, 0.62);
  --head: rgb(161, 161, 170);
  --accent: rgb(254, 215, 170);    /* --g-orange of the grey scheme (orange-200) */
  --tint: 190, 194, 202;
  --input-bg: rgba(18, 18, 20, 0.7);
  --trough: rgba(18, 18, 20, 0.9);
  --thumb: rgba(205, 210, 220, 0.3);
  --shadow: rgba(0, 0, 0, 0.4);
  --green: rgb(217, 249, 157);     /* --g-green (lime-200) */
  --hl: 254, 215, 170;
  --hl-a: 0.2;
  --cur-a: 0.26;
  --hl-ink: rgb(244, 244, 245);
  --time: rgba(228, 228, 231, 0.88);
}
html.theme-light {
  --bg: rgb(246, 248, 252);
  --card: rgb(255, 255, 255);
  --panel: rgba(255, 255, 255, 0.85);
  --bar-bg: rgba(232, 238, 248, 0.97);
  --head-bg: rgba(246, 248, 252, 0.94);
  --drawer: rgb(232, 238, 248);
  --line: rgba(40, 70, 120, 0.22);
  --ink: rgb(24, 34, 52);
  --muted: rgb(96, 112, 140);
  --head: rgb(96, 120, 160);
  --accent: rgb(30, 60, 120);      /* lambda of the light scheme: the blue */
  --tint: 40, 70, 120;
  --input-bg: rgb(255, 255, 255);
  --trough: rgba(220, 228, 240, 0.9);
  --thumb: rgba(60, 100, 160, 0.35);
  --shadow: rgba(30, 50, 90, 0.18);
  --green: rgb(92, 122, 32);       /* phi of the light scheme */
  --hl: 245, 194, 66;              /* pale amber on white needs more body (svp --edit-fill) */
  --hl-a: 0.38;
  --cur-a: 0.171;                  /* unchanged: Doc likes it in Hell */
  --hl-ink: rgb(24, 34, 52);
  --word-on: var(--orange);
  --word-ink: var(--navy);
  --time: rgb(52, 66, 92);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
html { touch-action: manipulation; }   /* no double-tap zoom: a double tap is full screen */
body {
  background: var(--bg); color: var(--ink);
  font-family: Raleway, "Helvetica Neue", Arial, sans-serif; font-size: 18px; line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
.orb { font-family: Orbitron, "Helvetica Neue", Arial, sans-serif; letter-spacing: .04em; }
.dots { font-family: "Times New Roman", Times, serif; }   /* Raleway draws the ellipsis as squares */
[hidden] { display: none !important; }

/* slim dark scrollbars like index.html - webkit and Firefox kept apart */
::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-track { background: var(--trough); border-radius: 999px; }
::-webkit-scrollbar-thumb { background: var(--thumb); border-radius: 999px; border: 2px solid var(--trough); }
@supports (-moz-appearance: none) { * { scrollbar-width: thin; scrollbar-color: var(--thumb) var(--trough); } }

header {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px;
  padding: 14px 20px; background: var(--head-bg); border-bottom: 1px solid var(--line);
  backdrop-filter: blur(8px);
}
header h1 { margin: 0; font-size: 19px; font-weight: 700; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header .by { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header .grow { flex: 1; min-width: 0; }
.iconbtn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 44px; min-width: 44px; padding: 0 14px; border-radius: 12px; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: 600 13px Orbitron, Arial, sans-serif;
}
.iconbtn:hover { border-color: rgba(var(--hl), .6); }
.iconbtn:disabled { opacity: .5; cursor: default; }
.iconbtn svg { width: 20px; height: 20px; fill: currentColor; flex: none; }
#offline.done { color: var(--green); border-color: var(--green); }
.wrap { display: grid; grid-template-columns: 320px 1fr; height: calc(100% - 73px); }
nav {
  overflow-y: auto; border-right: 1px solid var(--line); padding: 14px 10px calc(var(--bar-h) + 20px);
  touch-action: pan-y;                       /* sideways is ours: swiping the menu away */
}
@media (min-width: 861px) {                /* wide screen: the column swiped away, the menu button brings it back */
  body.toc-hidden .wrap { grid-template-columns: 1fr; }
  body.toc-hidden nav { display: none; }
}
nav button {
  display: block; width: 100%; text-align: left; margin: 0 0 6px; padding: 10px 12px; border-radius: 12px;
  border: 1px solid transparent; background: transparent; color: var(--ink); cursor: pointer; font: 500 15px/1.35 Raleway, Arial, sans-serif;
}
nav button:hover { background: var(--panel); }
nav button.on { background: var(--panel); border-color: rgba(var(--hl), .55); }
nav .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 6px; font-size: 13px; color: var(--time); }
nav .meta svg { width: 15px; height: 15px; fill: currentColor; vertical-align: -3px; }
nav .meta .have { color: var(--green); }
nav .prog { height: 3px; margin-top: 6px; border-radius: 3px; background: rgba(var(--tint), .15); overflow: hidden; }
nav .prog i { display: block; height: 100%; width: 0; background: var(--green); }
nav button.pdf { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; border-color: var(--line); }
nav button.pdf svg { width: 22px; height: 22px; fill: var(--accent); flex: none; }
nav button.pdf small { display: block; font-size: 12px; color: var(--muted); }

main { overflow-y: auto; padding: 28px 24px calc(var(--bar-h) + 40px); scroll-behavior: smooth; }
/* --fs: the reader's text size, one of five in the menu (Doc 18.10.2026); 1 = the size before */
article { max-width: 760px; margin: 0 auto; font-size: calc(var(--fs, 1) * 1em); }
article h2 { font: 700 calc(var(--fs, 1) * 22px)/1.4 Orbitron, Arial, sans-serif; color: var(--accent); margin: 0 0 26px; letter-spacing: .03em; }
/* the chapter in brief: a box under the title, open until it is closed (remembered) */
details.sum { margin: -6px 0 30px; padding: 4px 18px 10px; border: 1px solid var(--line); border-radius: 14px;
              background: rgba(var(--tint), .05); font-size: .9em; line-height: 1.6; }
details.sum summary { cursor: pointer; padding: 10px 0 6px; font: 700 15px Orbitron, Arial, sans-serif; letter-spacing: .06em;
                      color: var(--accent); }
details.sum p { margin: .55em 0; }
details.sum ul { margin: .2em 0 .7em; padding-left: 1.2em; }
details.sum li { margin: .25em 0; }
details.sum .sumh { font-size: .92em; opacity: .75; }
details.sum .sumplay { display: inline-flex; align-items: center; gap: 8px; width: auto; height: 40px; margin: 4px 0 6px; padding: 0 14px;
                       border-radius: 20px; border: 1px solid var(--line); background: transparent; color: var(--accent); cursor: pointer;
                       font: 700 13px Orbitron, Arial, sans-serif; letter-spacing: .04em; }
details.sum .sumplay svg { width: 18px; height: 18px; fill: currentColor; }
article h3 { font: 600 calc(var(--fs, 1) * 17px)/1.5 Orbitron, Arial, sans-serif; color: var(--head); margin: 34px 0 12px; letter-spacing: .03em; }
article p { margin: 0 0 18px; color: var(--ink); }
/* karaoke: sentence .s > word group .g > word .w; "on" = being read, "cur" = the frame around it */
.s, .g, .w { cursor: pointer; border-radius: 5px; transition: background .15s, color .15s; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.w { transition: none; }                  /* a word must switch at once, not fade */
.w:hover { background: rgba(var(--tint), .14); }
#text.mute .s, #text.mute .g, #text.mute .w { cursor: auto; }   /* text only: nothing to jump to */
#text.mute .w:hover { background: none; }
.s.on, .g.on { background: rgba(var(--hl), var(--hl-a)); color: var(--hl-ink); box-shadow: 0 0 0 1px rgba(var(--hl), .4); }
.s.cur, .g.cur { background: rgba(var(--hl), var(--cur-a)); }
/* the word being read: the accent, like the play button and the tabs (Doc 21.10.2026: in Grau it was still the loud
   orange); Hell keeps the orange - its accent is the blue */
.w.on { background: var(--word-on); color: var(--word-ink); box-shadow: 0 0 0 2px var(--word-on); }
h3 .on, h2 .on { color: var(--accent); }
h3 .w.on, h2 .w.on { color: var(--word-ink); }

#follow {
  position: fixed; right: 22px; bottom: calc(var(--bar-h) + 16px); z-index: 6; display: none;
  border-color: rgba(var(--hl), .7);
}

.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 7;
  padding: 4px 20px calc(10px + env(safe-area-inset-bottom)); background: var(--bar-bg);   /* compact (Doc 18.10.2026) */
  border-top: 1px solid var(--line); backdrop-filter: blur(8px);
  transition: transform .3s;
}
.bar.away { transform: translateY(110%); }   /* full screen: hidden after 5 s, one tap brings it back */
#follow:has(~ .bar.away) { bottom: 16px; }
/* the bar: the seek bar on top, under it title | buttons | time in one row (Doc 18.10.2026: "unter den Slider ... wenn es
   links nicht passt zwei Zeilen ... dann haben wir mehr Platz"); only when the title does not fit in two lines beside the
   buttons (or the time not beside them) title and time get a row of their own: .stack, set by barFit().
   --bar-h follows the bar's real height (ResizeObserver), so the text gets the room */
.bar { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; column-gap: 12px; }
.bar input[type=range] { grid-column: 1 / -1; grid-row: 1; }
.bar .now { display: contents; font-size: 13px; color: var(--muted); }
.bar .now b { grid-column: 1; grid-row: 2; justify-self: start; color: var(--ink); font: 600 13px/1.4 Orbitron, Arial, sans-serif;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; max-width: 100%; }
/* the time in the same font as the chapter title on the left (Doc 22.10.2026: Raleway was hard to read) */
.bar .now span { grid-column: 3; grid-row: 2; justify-self: end; text-align: right; color: var(--ink); font: 600 13px/1.4 Orbitron, Arial, sans-serif;
  max-width: 100%; overflow: hidden; white-space: nowrap; }
.bar .ctrls { grid-column: 2; grid-row: 2; }
.bar.stack { grid-template-columns: minmax(0, 1fr) auto; }
.bar.stack .now span { grid-column: 2; }
.bar.stack .ctrls { grid-column: 1 / -1; grid-row: 3; margin-top: 4px; }
/* the seek bar: thin and green like the chapters' progress in the menu (Doc 18.10.2026: "schmaler (y) und so grün");
   the touch area stays 22 px high, only the track is thin. --p = the part played, set by seekPaint() */
.bar input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; margin: 0; height: 20px;
  background: transparent; cursor: pointer; --p: 0%; }
.bar input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 3px;
  background: linear-gradient(var(--green), var(--green)) 0 0 / var(--p) 100% no-repeat, rgba(var(--tint), .15); }
.bar input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; margin-top: -5px;
  border: 0; border-radius: 50%; background: var(--green); }
.bar input[type=range]::-moz-range-track { height: 3px; border-radius: 3px; background: rgba(var(--tint), .15); }
.bar input[type=range]::-moz-range-progress { height: 3px; border-radius: 3px; background: var(--green); }
.bar input[type=range]::-moz-range-thumb { width: 13px; height: 13px; border: 0; border-radius: 50%; background: var(--green); }
.ctrls { display: flex; align-items: center; justify-content: center; gap: 10px; }
.ctrls .play { height: 50px; width: 50px; border-radius: 50%; background: var(--accent); color: var(--bg); border: none; }   /* like the tabs */
.ctrls .play svg { width: 25px; height: 25px; }   /* 58 -> 50 px, Doc 18.10.2026: "'n bissl kleiner" */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* the lock (sealed build only) */
/* every word: a long press opens our card, so the browser must not select anything in the text - no Google popup,
   Google is a button on the card (Doc 21.10.2026: "wir sollten unser eigenes Menü haben") */
#text { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.gl4 { text-decoration: underline dotted rgba(var(--tint), .6); text-decoration-thickness: 1.5px; text-underline-offset: 4px; }
.w.flash { background: rgba(var(--hl), .5); box-shadow: 0 0 0 3px rgba(var(--hl), .5); }
/* the card of one word: a sheet above the player bar */
#card {
  position: fixed; z-index: 9; left: 12px; right: 12px; bottom: calc(var(--bar-h) + 12px); margin: 0 auto; max-width: 560px;
  padding: 16px 18px 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line);
  box-shadow: 0 18px 50px var(--shadow); display: grid; gap: 8px;
}
.bar.away ~ #card { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
#card .top { display: flex; align-items: baseline; gap: 10px; }
#card .word { font: 700 22px/1.25 Raleway, Arial, sans-serif; color: var(--head); overflow-wrap: anywhere; }
#card .count { margin-left: auto; font-size: 13px; color: var(--muted); white-space: nowrap; }
#card .de { font-size: 18px; font-weight: 600; color: var(--ink); }
#card .x { font-size: 15px; line-height: 1.5; color: var(--muted); }
#card .btns, .grow-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.iconbtn.on-star { color: var(--accent); border-color: var(--accent); }
.iconbtn .lbl { margin-left: 2px; }
.iconbtn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
/* the whole-screen lists from the menu: the glossary and the notes (.dlg) */
.dlg { position: fixed; inset: 0; z-index: 10; background: var(--bg); display: grid; grid-template-rows: auto auto 1fr;
  padding: env(safe-area-inset-top, 0px) 0 0; }
.dlg .head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.dlg .grow { flex: 1; }
.dlg h2 { margin: 0; font: 700 20px Orbitron, Arial, sans-serif; letter-spacing: .06em; color: var(--accent); }
.dlg .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.dlg-q { flex: 1 1 200px; min-width: 0; height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid var(--line);
  background: var(--input-bg); color: var(--ink); font: 500 15px Raleway, Arial, sans-serif; }
.dlg .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.dlg .chips button { height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid var(--line); background: transparent;
  color: var(--ink); font: 600 13px Raleway, Arial, sans-serif; cursor: pointer; }
.dlg .chips button[aria-pressed="true"] { background: var(--orange); color: var(--navy); border-color: var(--orange); }
.dlg-n { font-size: 13px; color: var(--muted); }
.dlg-list { overflow-y: auto; padding: 4px 16px calc(40px + env(safe-area-inset-bottom, 0px)); }
.dlg-list .row { max-width: 820px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 14rem) minmax(0, 1fr); gap: 4px 20px;
  padding: 12px 0; border-bottom: 1px solid var(--line); }
.dlg-list .w0 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; min-width: 0; }
.dlg-list .w0 b { font-size: 17px; color: var(--head); overflow-wrap: anywhere; }
.dlg-list .w0 small { font-size: 13px; color: var(--time); }
.dlg-list .m { min-width: 0; display: grid; gap: 3px; }
.dlg-list .de { font-weight: 600; }
.dlg-list .x { color: var(--muted); font-size: 15px; }
.dlg-list .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.dlg-list .acts .iconbtn { height: 34px; padding: 0 10px; font-size: 13px; }
.dlg-list .empty { max-width: 820px; margin: 18px auto; color: var(--muted); }
@media (max-width: 560px) { .dlg-list .row { grid-template-columns: minmax(0, 1fr); } }
nav button.gloss, nav button.notesbtn { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; border-color: var(--line); }
nav button.gloss svg, nav button.notesbtn svg { width: 22px; height: 22px; fill: var(--accent); flex: none; }
nav button.gloss small, nav button.notesbtn small { display: block; font-size: 12px; color: var(--muted); }
nav button.pdf + button.gloss, nav button.gloss + button.notesbtn, nav button.pdf + button.notesbtn { margin-top: -6px; }
/* bookmarks and notes (Doc 21.10.2026: "ein kleines Zeichen rechts am Rand und oder das Wort durchgehend unterstreichen"):
   the word gets a solid underline, the sign sits in the right margin on its line (a float that hangs out into the
   padding, so the text keeps its width); a tap on the sign opens the note */
.w.noted { text-decoration: underline solid var(--accent); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.mk { float: right; display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; margin: 4px -32px 0 10px;
  padding: 0; border: 0; border-radius: 6px; background: rgba(var(--hl), .16); color: var(--accent); cursor: pointer; }
.mk svg { width: 15px; height: 15px; fill: currentColor; }
@media (max-width: 860px) { .mk { width: 16px; height: 18px; margin: 5px -16px 0 0; background: none; } .mk svg { width: 14px; height: 14px; } }
/* a short "done" under the header - free of the card and the player bar */
#toast { position: fixed; z-index: 12; left: 50%; top: calc(84px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); padding: 8px 16px;
  border-radius: 18px; background: var(--card); border: 1px solid var(--accent); color: var(--ink); font: 600 14px Raleway, Arial, sans-serif;
  box-shadow: 0 8px 24px var(--shadow); pointer-events: none; transition: opacity .25s; opacity: 0; }
#toast.on { opacity: 1; }
/* times: lining figures of equal width - Raleway's own old-style figures dip below the line and were hard to read */
.bar .now span, nav .meta, .dlg-list .w0 small, #note .top span, details.sum .sumplay span { font-variant-numeric: lining-nums tabular-nums; }
.s.flash { background: rgba(var(--hl), .45); box-shadow: 0 0 0 3px rgba(var(--hl), .45); }
/* the note: spoken (the browser's speech recognition writes along) or typed; on top, so the phone keyboard leaves it free */
#note { position: fixed; inset: 0; z-index: 11; background: rgba(0, 0, 0, .4); display: grid; align-items: start; justify-items: center;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 12px 12px; overflow-y: auto; }
#note .sheet { width: min(560px, 100%); margin-top: 6vh; padding: 16px 18px 14px; border-radius: 16px; background: var(--card);
  border: 1px solid var(--line); box-shadow: 0 18px 50px var(--shadow); display: grid; gap: 10px; }
#note .top { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; }

//          note, ts: made, up: last change, del: deleted (kept, so the delete reaches the other device), dirty: not sent yet }
const BOOK_ID = 'cn';
const ICON_MARK = '<svg viewBox="0 0 24 24"><path d="M17 3H7a2 2 0 0 0-2 2v16l7-3 7 3V5a2 2 0 0 0-2-2z"/></svg>';
const ICON_NOTE = '<svg viewBox="0 0 24 24"><path d="M22 4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14l4 4zm-4 10H6v-2h12zm0-3H6V9h12zm0-3H6V6h12z"/></svg>';
const notesAll = () => store.get('notes', []);
const notesLive = () => notesAll().filter(n => !n.del);
const checksum = s => { let h = 2166136261; for (let k = 0; k < s.length; k++) { h ^= s.charCodeAt(k); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); };
const flatS = c => c._flat || (c._flat = c.paras.flatMap(p => p.s));
const dateDe = ts => new Date(ts).toLocaleDateString('de-DE', { day: 'numeric', month: 'numeric' });
function noteS(n) {      // the entry's sentence in its chapter: by number, or by checksum when the text has moved
  const c = BOOK.find(b => b.key === n.ch); if (!c) return -1;
  const all = flatS(c), k = Math.min(n.s, all.length - 1);
  if (!n.sh || (all[k] && checksum(all[k][1]) === n.sh)) return k;
  const j = all.findIndex(x => checksum(x[1]) === n.sh);
  return j >= 0 ? j : k;
}
function noteQuote(n) {
  const c = BOOK.find(b => b.key === n.ch), k = noteS(n), t = c && k >= 0 ? flatS(c)[k][1] : '';
  return t.length > 180 ? t.slice(0, 177).replace(/\s+\S*$/, '') + ' …' : t;
}
const noteWhen = n => (n.at != null ? fmt(n.at) : 'Satz ' + (noteS(n) + 1)) + ' · ' + dateDe(n.ts);
function noteWhere(n) { const c = BOOK.find(b => b.key === n.ch); return (c ? c.short : n.ch) + ' · ' + noteWhen(n); }
function notesPut(n) {           // add or change one entry; Supabase gets it a moment later
  const list = notesAll(), k = list.findIndex(x => x.id === n.id);
  n.up = Date.now(); n.dirty = true; delete n.del;
  if (k >= 0) list[k] = n; else list.push(n);
  store.set('notes', list); notesChanged();
}
function notesDrop(id) {
  const list = notesAll(), n = list.find(x => x.id === id); if (!n) return;
  n.del = true; n.note = ''; n.up = Date.now(); n.dirty = true;
  store.set('notes', list); notesChanged();
}
function entryAt(el) {           // a new entry for the sentence of a word in the chapter
  const sEl = el.closest('.s'), c = BOOK[ch]; if (!sEl || !c) return null;
  const s = +sEl.dataset.i, x = S[s], sent = flatS(c)[s];
  return { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8), ch: c.key, s, sh: sent ? checksum(sent[1]) : '',
           wi: [...sEl.querySelectorAll('.w')].indexOf(el), at: c.text || !x ? null : Math.round(x.t * 100) / 100, note: '', ts: Date.now() };
}
const entriesHere = el => { const sEl = el.closest('.s'), c = BOOK[ch]; if (!sEl || !c) return [];
  const s = +sEl.dataset.i; return notesLive().filter(n => n.ch === c.key && noteS(n) === s); };
let syncLater = 0;
function notesChanged(push = true) {
  paintMarks();
  const b = toc.querySelector('button.notesbtn'); if (b) b.replaceWith(notesButton());
  if (!$('notes').hidden) renderNotes();
  if (!$('card').hidden) cardMarkState();
  if (push) { clearTimeout(syncLater); syncLater = setTimeout(syncNow, 1500); }
}
// the marks in the text: the word underlined, a sign in the right margin on its line
function paintMarks() {
  text.querySelectorAll('.mk').forEach(b => b.remove());
  text.querySelectorAll('.w.noted').forEach(w => w.classList.remove('noted'));
  const c = BOOK[ch]; if (!c) return;
  for (const n of notesLive()) {
    if (n.ch !== c.key) continue;
    const el = spans[noteS(n)]; if (!el) continue;
    const words = el.querySelectorAll('.w'), w = words[Math.min(Math.max(n.wi || 0, 0), words.length - 1)];
    if (w) w.classList.add('noted');
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'mk'; b.dataset.id = n.id; b.innerHTML = n.note ? ICON_NOTE : ICON_MARK;
    b.title = n.note ? n.note.slice(0, 140) : 'Lesezeichen'; b.setAttribute('aria-label', n.note ? 'Notiz' : 'Lesezeichen');
    (w || el).before(b);
  }
}
let toastTimer = 0;
function toast(t) {
  const el = $('toast'); el.textContent = t; el.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 1800);
}
text.addEventListener('click', e => {
  const b = e.target.closest('.mk'); if (!b) return;
  e.preventDefault();
  const n = notesLive().find(x => x.id === b.dataset.id); if (n) openNote(n, false);
});
// on the card: Lesezeichen sets or takes away the bookmark of the sentence (a note there opens instead);
// Notiz opens the sheet and listens at once - to the note already there, if there is one
function cardMarkState() {
  const here = cardFor && !cardFor.sum ? entriesHere(cardFor.el) : [];
  $('cardMark').classList.toggle('on-star', here.length > 0);
  $('cardMark').querySelector('.lbl').textContent = here.length ? 'Gesetzt' : 'Lesezeichen';
}
$('cardMark').onclick = () => {
  if (!cardFor || cardFor.sum) return;
  const here = entriesHere(cardFor.el), note = here.find(n => n.note);
  if (note) { closeCard(); openNote(note, false); return; }
  if (here.length) { here.forEach(n => notesDrop(n.id)); toast('Lesezeichen entfernt'); }
  else { const n = entryAt(cardFor.el); if (n) { notesPut(n); toast('Lesezeichen gesetzt'); } }
  cardMarkState();
};
$('cardNote').onclick = () => {
  if (!cardFor || cardFor.sum) return;
  const here = entriesHere(cardFor.el), n = here.find(x => x.note) || here[0] || entryAt(cardFor.el);
  closeCard();
  if (n) openNote(n, true);
};

// the sheet of one note: the reading pauses meanwhile and goes on after Speichern / Abbrechen
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const SR_ERR = { 'not-allowed': 'Mikrofon nicht erlaubt - in Chrome beim Schloss neben der Adresse freigeben.',
  'service-not-allowed': 'Diktieren ist hier gesperrt - bitte tippen.', network: 'Kein Netz - Diktieren braucht Internet. Bitte tippen.',
  'audio-capture': 'Kein Mikrofon gefunden.', 'language-not-supported': 'Deutsch wird hier nicht erkannt - bitte tippen.' };
let noteFor = null, noteResume = false, ear = null, earBase = '', earDone = null, earErr = false, earMute = false, delTimer = 0;
const noteSay = t => { $('noteSay').textContent = t || ''; };
function openNote(n, listen) {
  noteFor = { ...n };
  noteResume = !audio.paused;
  audio.pause(); if (!sumAudio.paused) { sumAudio.pause(); sumLabel(); }
  const exists = notesLive().some(x => x.id === n.id);
  $('noteKind').textContent = exists && !n.note ? 'LESEZEICHEN' : 'NOTIZ';
  $('noteWhere').textContent = noteWhere(n);
  $('noteQuote').textContent = '„' + noteQuote(n) + '“'; $('noteQuote').lang = langOf(BOOK.find(b => b.key === n.ch));
  $('noteText').value = n.note || '';
  $('noteDel').hidden = !exists; noteDelArm(false);
  $('noteMic').hidden = !SR;                       // no engine in this browser (Firefox): typing only
  noteSay(''); $('note').hidden = false;
  if (listen && SR) recStart(); else if (!SR) $('noteText').focus();
}
function noteHide() { noteFor = null; $('note').hidden = true; if (noteResume) audio.play().catch(() => {}); noteResume = false; }
async function closeNote(keep) {
  if (!noteFor) return;
  await recFinish();
  const n = noteFor;
  if (keep) { n.note = $('noteText').value.trim(); notesPut(n); toast(n.note ? 'Notiz gespeichert' : 'Lesezeichen gesetzt'); }   // nothing said: a bookmark
  noteHide();
}
function noteDelArm(on) {
  clearTimeout(delTimer);
  $('noteDel').classList.toggle('sure', on);
  if (on) { noteSay('Nochmal tippen: wirklich löschen'); delTimer = setTimeout(() => { noteDelArm(false); noteSay(''); }, 3000); }
}
$('noteDel').onclick = async () => {
  if (!$('noteDel').classList.contains('sure')) { noteDelArm(true); return; }
  const id = noteFor && noteFor.id;
  await recFinish(); noteHide();
  if (id) { notesDrop(id); toast('Gelöscht'); }
};
$('noteOk').onclick = () => closeNote(true);
$('noteCancel').onclick = () => closeNote(false);
$('noteText').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) closeNote(true); });
$('noteText').addEventListener('input', () => { if (ear && ear.active) { earMute = true; ear.stop(); } });   // typing: the microphone stops
// speaking: the shared engine js/solita-listen.js (like "Fehler melden" in the books) - it keeps listening through
// pauses and ends after 3.5 s of quiet or on "bin fertig"; what is heard goes live behind what stood there before
function earText(t) { if (earMute) return; const s = (earBase + ' ' + t).trim(); $('noteText').value = s.charAt(0).toUpperCase() + s.slice(1); }
function earState(s) {
  const on = s === 'listening';
  $('noteMic').classList.toggle('rec', on);
  $('noteMic').querySelector('.lbl').textContent = on ? 'Stopp' : 'Sprechen';
  if (on) { noteSay('Ich höre zu … Schluss mit „bin fertig“ oder kurz still sein.'); return; }
  if (!earErr && noteFor) noteSay('Fertig - für mehr nochmal aufs Mikrofon tippen.');
  const d = earDone; earDone = null; if (d) d();
}
function recStart() {
  if (!SR || !window.SolitaListen) { noteSay(SR ? 'Diktieren nicht geladen (offline?) - bitte tippen.' : 'Diktieren kann dieser Browser nicht - bitte tippen.'); $('noteText').focus(); return; }
  if (!ear) ear = window.SolitaListen({ lang: 'de-DE', silenceMs: 3500,
    onState: earState, onPartial: earText,
    onFinal: t => { if (t) earText(t); earState('idle'); },   // the engine hands over the text without an 'idle' of its own
    log: m => { const k = /STT-Fehler: (\S+)/.exec(m); if (k && SR_ERR[k[1]]) { earErr = true; noteSay(SR_ERR[k[1]]); } } });
  if (ear.active) return;
  earErr = false; earMute = false; earBase = $('noteText').value.trim();
  ear.start();
}
function recFinish() {               // stop, and wait for the last words (they come after the stop) - at most 1.5 s
  if (!ear || !ear.active) return Promise.resolve();
  return new Promise(res => { earDone = res; ear.stop(); setTimeout(() => { if (earDone === res) { earDone = null; res(); } }, 1500); });
}
$('noteMic').onclick = () => { if (ear && ear.active) recFinish(); else recStart(); };

// the list in the menu: every bookmark and note in the order of the book, searchable, with a jump to the place
let notesFilter = 'all';
function notesButton() {
  const b = document.createElement('button');
  b.className = 'notesbtn';
  const l = notesLive(), k = l.filter(n => n.note).length, m = l.length - k;
  const say = [k ? k + (k === 1 ? ' Notiz' : ' Notizen') : '', m ? m + ' Lesezeichen' : ''].filter(Boolean).join(' · ');
  b.innerHTML = `${ICON_NOTE}<span>Notizen<small>${say || 'lange auf ein Wort drücken'}</small></span>`;
  b.onclick = () => { toc.classList.remove('open'); openNotes(); };
  return b;
}
function openNotes() { $('notes').hidden = false; renderNotes(); syncNow(); }
const closeNotes = () => { $('notes').hidden = true; };
$('notesClose').onclick = closeNotes;
function notesSorted() {
  const order = new Map(BOOK.map((c, i) => [c.key, i]));
  return notesLive().sort((a, b) => (order.get(a.ch) ?? 1e9) - (order.get(b.ch) ?? 1e9) || noteS(a) - noteS(b) || a.ts - b.ts);
}
function renderNotes() {
  const q = fold($('notesQ').value.trim()), all = notesSorted();
  const list = all.filter(n => (notesFilter === 'all' || (notesFilter === 'note') === !!n.note)
    && (!q || fold(n.note + ' ' + noteWhere(n) + ' ' + noteQuote(n)).includes(q)));
  $('notesN').textContent = list.length === all.length ? all.length + (all.length === 1 ? ' Eintrag' : ' Einträge') : list.length + ' von ' + all.length;
  $('notesList').innerHTML = list.length ? list.map(n => {
    const c = BOOK.find(b => b.key === n.ch);
    return `<div class="row"><div class="w0"><b>${esc(c ? c.short : n.ch)}</b><small>${noteWhen(n)}</small></div>` +
      `<div class="m">${n.note ? `<span class="de note">${esc(n.note)}</span>` : '<span class="x">Lesezeichen</span>'}` +
      `<span class="x" lang="${langOf(c)}">„${esc(noteQuote(n))}“</span>` +
      `<div class="acts"><button class="iconbtn" data-go="${n.id}">Zur Stelle</button>` +
      `<button class="iconbtn" data-edit="${n.id}">${n.note ? 'Bearbeiten' : 'Notiz dazu'}</button></div></div></div>`;
  }).join('') : `<div class="empty">${all.length ? 'Kein Treffer.' : 'Noch nichts. Lange auf ein Wort im Text drücken, dann „Lesezeichen“ oder „Notiz“.'}</div>`;
}
$('notesQ').addEventListener('input', renderNotes);
document.querySelectorAll('#notes .chips button').forEach(b => b.onclick = () => {
  notesFilter = b.dataset.f;
  document.querySelectorAll('#notes .chips button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  renderNotes();
});
$('notesList').addEventListener('click', e => {
  const go = e.target.closest('[data-go]'), ed = e.target.closest('[data-edit]');
  const n = notesLive().find(x => x.id === (go ? go.dataset.go : ed ? ed.dataset.edit : '')); if (!n) return;
  if (go) goToNote(n); else openNote(n, !n.note);
});
async function goToNote(n) {
  const ci = BOOK.findIndex(c => c.key === n.ch); if (ci < 0) return;
  closeNotes();
  const c = BOOK[ci], other = ci !== ch;
  if (other) load(ci, n.at || 0, false);            // the text is there at once; the sound may still be loading
  else if (!c.text && audio.src && n.at != null) { audio.currentTime = n.at; follow = true; userScrollUntil = 0; tick(true); }
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));   // after load()'s own scrolling
  const el = spans[noteS(n)];
  if (el) { el.scrollIntoView({ block: 'center', behavior: other ? 'instant' : 'smooth' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 2500); }
}
// all notes as text: the share sheet on the Fon, the clipboard where there is none
$('notesShare').onclick = async () => {
  const l = notesSorted(); if (!l.length) return;
  const title = 'Notizen - ' + $('bookTitle').textContent;
  const body = title + '\n\n' + l.map(n => noteWhere(n) + '\n' + (n.note || '[Lesezeichen]') + '\n„' + noteQuote(n) + '“').join('\n\n');
  try { if (navigator.share) { await navigator.share({ title, text: body }); return; } } catch (e) { if (e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(body); $('notesN').textContent = 'in die Zwischenablage kopiert'; } catch (_) {}
};

// ---------- the notes in Supabase: one row per entry, only Doc sees his rows (RLS); the newer change wins ----------
const SYNC_TABLE = 'hoerbuch_notes';
let syncBusy = false, syncAgain = false;
const auth = () => window.svpAuth && svpAuth.hasSession() ? svpAuth : null;
function syncSay(t, login) { $('syncSay').textContent = t; $('syncGo').hidden = !login; if (!login) $('syncForm').hidden = true; }
const toRow = n => ({ id: n.id, book: BOOK_ID, ch: n.ch, s: n.s, sh: n.sh || '', wi: n.wi ?? null, pos: n.at ?? null, note: n.note || '',
  deleted: !!n.del, created_at: new Date(n.ts).toISOString(), updated_at: new Date(n.up || n.ts).toISOString() });
const fromRow = r => ({ id: r.id, ch: r.ch, s: r.s, sh: r.sh, wi: r.wi, at: r.pos, note: r.note || '', del: !!r.deleted,
  ts: Date.parse(r.created_at), up: Date.parse(r.updated_at) });
async function syncErr(res) {
  let j = {}; try { j = await res.json(); } catch (_) {}
  if (j.code === 'PGRST205' || res.status === 404) return new Error('Die Tabelle in Supabase fehlt noch - die Notizen bleiben so lange auf diesem Gerät.');
  return new Error('Supabase: ' + (j.message || 'HTTP ' + res.status));
}
async function syncNow() {
  if (!window.svpAuth) { syncSay('Abgleich nicht geladen (offline?) - die Notizen bleiben auf diesem Gerät.'); return; }
  const a = auth();
  if (!a) { syncSay('Nur auf diesem Gerät. Mit dem Login vom Stoffverteilungsplan zeigen Fon und Mac dieselben Notizen.', true); return; }
  if (!navigator.onLine) { syncSay('Offline - gleicht ab, sobald wieder Netz da ist.'); return; }
  if (syncBusy) { syncAgain = true; return; }
  syncBusy = true;
  try {
    const sent = notesAll().filter(n => n.dirty);
    if (sent.length) {
      const r = await a.api(SYNC_TABLE + '?on_conflict=id', { method: 'POST',
        headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify(sent.map(toRow)) });
      if (!r.ok) throw await syncErr(r);
    }
    const r2 = await a.api(SYNC_TABLE + '?book=eq.' + BOOK_ID + '&select=*', { method: 'GET' });
    if (!r2.ok) throw await syncErr(r2);
    const rows = await r2.json(), list = notesAll(), byId = new Map(list.map(n => [n.id, n])), upAt = new Map(sent.map(n => [n.id, n.up]));
    for (const n of list) if (n.dirty && upAt.get(n.id) === n.up) delete n.dirty;   // sent, and not changed since
    for (const row of rows) {
      const m = fromRow(row), l = byId.get(m.id);
      if (!l) { list.push(m); byId.set(m.id, m); }
      else if (!l.dirty && m.up > (l.up || 0)) Object.assign(l, m);
    }
    store.set('notes', list); notesChanged(false);
    syncSay('Abgeglichen mit Supabase · ' + new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }));
  } catch (e) { syncSay(e.message, /anmelden/i.test(e.message)); }
  syncBusy = false;
  if (syncAgain) { syncAgain = false; syncNow(); }
}
$('syncGo').onclick = () => { $('syncForm').hidden = false; $('syncMail').focus(); };
$('syncForm').onsubmit = async e => {
  e.preventDefault();
  const mail = $('syncMail').value.trim(), pw = $('syncPw').value.replace(/[\r\n]+$/, '');
  syncSay('Anmelden …');
  try { await svpAuth.login(mail, pw); }
  catch (err) { syncSay(err.message, true); $('syncForm').hidden = false; return; }
  if (window.PasswordCredential && navigator.credentials) {    // Chrome keeps it, so the Fon never asks again
    try { await Promise.race([navigator.credentials.store(new PasswordCredential({ id: mail, password: pw })), new Promise(r => setTimeout(r, 1500))]); } catch (_) {}
  }
  $('syncPw').value = '';
  syncNow();
};
addEventListener('online', () => syncNow());
document.addEventListener('visibilitychange', () => { if (!document.hidden && BOOK.length) syncNow(); });

(async function start() {
  const sp = store.get('speed', 1);
  if (SPEEDS.includes(sp)) { audio.playbackRate = audio.defaultPlaybackRate = sp; $('speed').textContent = speedLabel(sp); }
  if (!SEALED) {
    BOOK = LOCAL;
    AUTHOR = LOCALMETA.author; document.title = $('bookTitle').textContent = LOCALMETA.title;
    $('bookBy').textContent = AUTHOR + ' · Hörbuch, gelesen von Solita und Charon';
  } else {
    if (!window.crypto || !crypto.subtle || !window.caches || !window.DecompressionStream) {
      $('lock').hidden = false; $('msg').textContent = 'Dieser Browser kann das Hörbuch nicht öffnen (bitte aktuelles Chrome).'; $('go').disabled = true; return;
    }
    navigator.serviceWorker && navigator.serviceWorker.register('sw.js').catch(() => {});
    try { have = new Set((await (await caches.open(FILES)).keys()).map(r => r.url.replace(/^.*\/f\/|\.bin$/g, ''))); } catch (_) {}
    const key = await loadKey();
    try { BOOK = key ? await openBook(key) : await askPassword(''); }
    catch (e) {
      if (e.key) await dropKey();
      BOOK = await askPassword(e.key ? 'Neuer Schlüssel - bitte einmal das Passwort eingeben' : e.message);
    }
  }
  buildToc();
  offlineState();
  const startKey = store.get('ch', BOOK[0] && BOOK[0].key);
  const si = Math.max(0, BOOK.findIndex(c => c.key === startKey));
  if (BOOK[si]) load(si, store.get('pos.' + BOOK[si].key, 0), false);
  syncNow();
})();
</script>
