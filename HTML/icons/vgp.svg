<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- VGP app icon: a large padlock (encryption) with an oval chat bubble + typing dots (chat) inside. -->
  <rect width="512" height="512" fill="#020410"/>
  <rect x="28" y="28" width="456" height="456" rx="104" fill="#061226" stroke="#00d2ff" stroke-width="10" stroke-opacity="0.55"/>
  <!-- Shackle (raised) -->
  <path d="M180 212 v-58 a76 76 0 0 1 152 0 v58" fill="none" stroke="#00d2ff" stroke-width="34" stroke-linecap="round"/>
  <!-- Lock body (raised, so the whole lock sits centered) -->
  <rect x="120" y="206" width="272" height="216" rx="40" fill="#00d2ff"/>
  <!-- Oval chat bubble cut out of the body, with a tail at bottom-left -->
  <ellipse cx="256" cy="300" rx="92" ry="70" fill="#020410"/>
  <path d="M214 352 L196 404 L250 360 Z" fill="#020410"/>
  <!-- Typing dots -->
  <circle cx="222" cy="300" r="12" fill="#00d2ff"/>
  <circle cx="256" cy="300" r="12" fill="#00d2ff"/>
  <circle cx="290" cy="300" r="12" fill="#00d2ff"/>
</svg>
