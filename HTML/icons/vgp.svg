<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- VGP — very good privacy. Dark-blue field, cyan lock + wordmark. Full-bleed for maskable. -->
  <rect width="512" height="512" fill="#020410"/>
  <rect x="28" y="28" width="456" height="456" rx="96" fill="#061226" stroke="#00d2ff" stroke-width="10" stroke-opacity="0.55"/>
  <!-- Padlock -->
  <g fill="none" stroke="#00d2ff" stroke-width="22" stroke-linecap="round">
    <path d="M196 196 v-34 a60 60 0 0 1 120 0 v34"/>
  </g>
  <rect x="168" y="196" width="176" height="132" rx="26" fill="#00d2ff"/>
  <circle cx="256" cy="252" r="20" fill="#020410"/>
  <rect x="248" y="262" width="16" height="40" rx="8" fill="#020410"/>
  <!-- Wordmark -->
  <text x="256" y="416" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="104" letter-spacing="6" fill="#00d2ff">VGP</text>
</svg>
