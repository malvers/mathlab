<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>docalvers | Imaginary numbers</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="resources/favicon.png">
    <link rel="stylesheet" href="js/cyber-layout.css">
    <link rel="stylesheet" href="js/buttons-ultra.css">
    <link rel="stylesheet" href="js/cyber-lab-overrides.css">
    <link rel="stylesheet" href="js/branding.styles.extracted.css">
    <link rel="stylesheet" href="js/lab-shell-minimal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
    <style>
        /* Canvas overlay: larger KaTeX + pill frame (pointer-events none — canvas stays interactive). */
        #canvas-container {
            position: relative;
        }

        .cn-formula-row {
            position: absolute;
            top: clamp(10px, 2vmin, 18px);
            left: clamp(10px, 2vmin, 18px);
            z-index: 30;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            flex-wrap: nowrap;
            align-items: flex-start;
            gap: 10px;
            max-width: 100%;
            box-sizing: border-box;
        }

        /*
         * Einheitliche Breite: --cn-formula-unified-w (px), gesetzt per syncCnFormulaOverlayWidths()
         * nach KaTeX — so breit wie der breiteste Inhalt, ggf. an Canvas gekappt.
         */
        .cn-formula-row > .cn-formula-overlay {
            width: var(--cn-formula-unified-w, min(96vw, 820px));
            max-width: 100%;
            box-sizing: border-box;
            text-align: left;
            overflow-x: visible;
        }

        .cn-formula-overlay {
            position: relative;
            padding: 12px 22px;
            border-radius: 22px;
            background: rgba(5, 10, 26, 0.88);
            border: 1px solid rgba(var(--cn-var-z-rgb, 237, 28, 36), 0.55);
            box-shadow:
                0 0 0 1px rgba(var(--cn-var-z-rgb, 237, 28, 36), 0.1),
                0 8px 28px rgba(0, 0, 0, 0.45);
            overflow: visible;
            text-overflow: clip;
            white-space: normal;
        }

        /* |z| (Betrag) — eigene „Extra“-Box, dezenter Rand */
        .cn-formula-absz {
            border: 1px solid rgba(var(--cn-title-muted-rgb, 226, 232, 240), 0.35);
            box-shadow:
                0 0 0 1px rgba(var(--cn-title-muted-rgb, 226, 232, 240), 0.06),
                0 8px 28px rgba(0, 0, 0, 0.45);
            padding-top: 12px;
            padding-bottom: 12px;
        }

        /* |r| — zweite Extra-Box, Rand an VAR_R */
        .cn-formula-absr {
            border: 1px solid rgba(var(--cn-var-r-rgb, 146, 208, 80), 0.42);
            box-shadow:
                0 0 0 1px rgba(var(--cn-var-r-rgb, 146, 208, 80), 0.08),
                0 8px 28px rgba(0, 0, 0, 0.45);
            padding-top: 12px;
            padding-bottom: 12px;
        }

        /* Hauptwert √z: re(r), im(r) — Rand VAR_R */
        .cn-formula-magnitude {
            border: 1px solid rgba(var(--cn-var-r-rgb, 146, 208, 80), 0.55);
            box-shadow:
                0 0 0 1px rgba(var(--cn-var-r-rgb, 146, 208, 80), 0.1),
                0 8px 28px rgba(0, 0, 0, 0.45);
        }

        .cn-formula-magnitude .katex-display {
            margin: 0 !important;
            text-align: left !important;
        }

        .cn-formula-magnitude .katex {
            font-size: clamp(0.95rem, 0.82rem + 1.05vmin, 1.38rem) !important;
        }

        /* Base: + and i stay light; Re / Im blocks use \\textcolor in KaTeX. */
        .cn-formula-overlay .katex {
            font-size: clamp(1.12rem, 0.95rem + 1.35vmin, 1.55rem) !important;
            color: rgba(226, 232, 240, 0.96) !important;
        }

        /* KaTeX-Beschriftungen an z- und r-Punkt (Farben: PALETTE / --cn-*). */
        .cn-point-labels {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 28;
        }

        .cn-point-label {
            position: absolute;
            left: 0;
            top: 0;
            line-height: 1;
            filter: drop-shadow(0 0 2px rgba(5, 10, 26, 0.96)) drop-shadow(0 1px 4px rgba(0, 0, 0, 0.78));
        }

        .cn-point-label .katex {
            font-size: inherit !important;
        }

        #imaginarynumbers-coach {
            display: none !important;
        }

        /*
         * CyberUI (ui.js): .instrument-title { text-transform: uppercase }
         * würde KaTeX-Buchstaben zu „Z“, „R“ machen — hier unterbinden.
         */
        #side-panel #ui-container .instrument-title {
            text-transform: none !important;
            overflow: visible !important;
            text-overflow: clip !important;
            white-space: normal !important;
            max-width: 100%;
        }

        /* Karten-Titel z ∈ ℂ / r=√z: deutlich größer als bisher (nur Titelzeile) */
        #ui-container .instrument-title .katex {
            font-size: clamp(1.2rem, 1.05rem + 0.95vmin, 1.48rem) !important;
        }

        /* sqrt / z² — unter beiden Karten (#cn-map-mode-wrap), nicht in der z-Karte */
        #ui-container .cn-map-mode-wrap {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid rgba(148, 163, 184, 0.22);
        }

        #ui-container .cn-map-mode {
            display: flex;
            gap: 8px;
        }

        #ui-container .cn-map-mode-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 2.5rem;
            font-family: inherit;
            font-size: clamp(0.92rem, 0.82rem + 0.85vmin, 1.08rem);
            font-weight: 600;
            letter-spacing: 0.02em;
            padding: 8px 6px;
            border-radius: 11px;
            border: 1px solid rgba(148, 163, 184, 0.38);
            background: rgba(15, 23, 42, 0.55);
            color: rgba(226, 232, 240, 0.88);
            cursor: pointer;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }

        #ui-container .cn-map-mode-tex .katex {
            font-size: clamp(0.98rem, 0.86rem + 0.75vmin, 1.2rem) !important;
            color: rgba(248, 250, 252, 0.96) !important;
        }

        #ui-container .cn-map-mode-btn:hover {
            border-color: rgba(148, 163, 184, 0.55);
            color: rgba(248, 250, 252, 0.95);
        }

        #ui-container .cn-map-mode-btn--active {
            border-color: var(--cn-card-accent, #00b0f0);
            background: rgba(0, 176, 240, 0.14);
            box-shadow: 0 0 0 1px rgba(0, 176, 240, 0.22);
            color: rgba(248, 250, 252, 0.98);
        }

        /* z- und r-Readout: gleiches Layout (re/im Zeilen, KaTeX-Titel in .instrument-title) */
        #cn-z-readout,
        #cn-r-readout {
            margin-top: 0;
        }

        #cn-z-readout .cyber-label,
        #cn-r-readout .cyber-label {
            font-size: clamp(1.17rem, 1.02rem + 1.35vmin, 1.425rem) !important;
        }

        #cn-z-readout .val-display,
        #cn-r-readout .val-display {
            font-size: clamp(1.32rem, 1.17rem + 1.5vmin, 1.68rem) !important;
        }

        #cn-z-readout .cn-r-row:nth-child(1) .cyber-label,
        #cn-z-readout .cn-r-row:nth-child(1) .val-display,
        #cn-r-readout .cn-r-row:nth-child(1) .cyber-label,
        #cn-r-readout .cn-r-row:nth-child(1) .val-display {
            color: var(--cn-axis-re, #FFC000) !important;
        }

        #cn-z-readout .cn-r-row:nth-child(2) .cyber-label,
        #cn-z-readout .cn-r-row:nth-child(2) .val-display,
        #cn-r-readout .cn-r-row:nth-child(2) .cyber-label,
        #cn-r-readout .cn-r-row:nth-child(2) .val-display {
            color: var(--cn-axis-im, #00B0F0) !important;
        }

        #cn-z-readout .control-header,
        #cn-r-readout .control-header {
            margin-bottom: 1px !important;
            line-height: 1.15 !important;
            align-items: center;
        }
    </style>
</head>

<body>
    <nav id="mini-rail">
        <div class="nav-btn" onclick="toggleSidebar()" title="Toggle Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </div>
    </nav>

    <aside id="side-panel">
        <header id="sidebar-header"></header>
        <div id="ui-container"></div>
    </aside>

    <main id="main-content">
        <div id="canvas-container">
            <!-- Grid + axes: CyberCanvas.drawGrid (see js/cyber-canvas.js) -->
            <canvas id="main-canvas"></canvas>
            <div id="cn-formula-row" class="cn-formula-row">
                <div id="cn-formula-overlay" class="cn-formula-overlay" aria-live="polite">
                    <span id="cn-formula-tex"></span>
                </div>
                <div id="cn-formula-magnitude" class="cn-formula-overlay cn-formula-magnitude" aria-live="polite">
                    <span id="cn-formula-mag-tex"></span>
                </div>
                <div id="cn-formula-absz" class="cn-formula-overlay cn-formula-absz" aria-live="polite">
                    <span id="cn-formula-absz-tex"></span>
                </div>
                <div id="cn-formula-absr" class="cn-formula-overlay cn-formula-absr" aria-live="polite">
                    <span id="cn-formula-absr-tex"></span>
                </div>
            </div>
            <div id="cn-point-labels" class="cn-point-labels" aria-hidden="true">
                <span id="cn-label-z" class="cn-point-label"></span>
                <span id="cn-label-r" class="cn-point-label"></span>
            </div>
            <div id="imaginarynumbers-coach" class="math-coach-box">
                <div class="coach-title" id="coach-title-slot"></div>
                <div id="coach-content" class="coach-message"></div>
            </div>
        </div>
    </main>

    <script src="js/cyber-left-chrome.js"></script>
    <script src="js/branding/briefings.js"></script>
    <script src="js/branding/overlays.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/branding.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/cyber-canvas.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
    <script src="imaginarynumbers-controls.js"></script>
    <script>
        ImaginaryNumbersControls.applyPaletteCssVars();
        const P = ImaginaryNumbersControls.PALETTE;
        const rgbaFromHex = (hex, a) =>
            `rgba(${ImaginaryNumbersControls.hexToRgbComma(hex)}, ${a})`;

        function toggleSidebar() {
            const panel = document.getElementById('side-panel');
            panel.classList.toggle('collapsed');
            if (window.CyberLeftChrome && typeof CyberLeftChrome.publishResolvedScale === 'function') {
                CyberLeftChrome.publishResolvedScale();
            }
            setTimeout(() => {
                window.dispatchEvent(new Event('resize'));
                if (typeof CyberCanvasInstance !== 'undefined' && CyberCanvasInstance.isInitialized) {
                    CyberCanvasInstance.needsRedraw = true;
                }
            }, 400);
        }

        CyberBranding.init({
            useExternalStyles: true,
            title: CyberI18n.get('ui.coach_title'),
            subtitle: 'Imaginary numbers',
        });
        CyberUI.init();

        (function setCoachTitleFromI18n() {
            const el = document.getElementById('coach-title-slot');
            if (el && typeof CyberI18n !== 'undefined' && typeof CyberI18n.get === 'function') {
                el.textContent = CyberI18n.get('ui.description');
            }
        })();

        if (window.CyberLeftChrome && typeof CyberLeftChrome.configure === 'function') {
            CyberLeftChrome.configure({ viewportOnlyZoom: true });
        }

        /** Real part x, imaginary part y — same math space as CyberCanvas axis pair. */
        const state = { re: 1, im: 1, zMapMode: 'sqrt' };
        /** null | 'z' | 'r' — sqrt: r = √z, ziehen an r setzt z = r² | square: r = z², ziehen setzt z = Hauptwert-√r */
        let dragTarget = null;
        const Z_SLIDER_MIN = -20;
        const Z_SLIDER_MAX = 20;

        const LAB_STORAGE_KEY = 'forloop.imaginarynumbers.v1';
        let labPersistTimer = null;
        let labPersistDrawAt = 0;

        function clampToSliders(v) {
            return Math.max(Z_SLIDER_MIN, Math.min(Z_SLIDER_MAX, v));
        }

        function loadPersistedLab() {
            try {
                const raw = localStorage.getItem(LAB_STORAGE_KEY);
                if (!raw) return null;
                const d = JSON.parse(raw);
                if (!d || d.v !== 1 || typeof d.re !== 'number' || typeof d.im !== 'number') return null;
                if (!d.view) return null;
                const { minX, maxX, minY, maxY } = d.view;
                if (
                    [minX, maxX, minY, maxY].some((u) => typeof u !== 'number' || !Number.isFinite(u)) ||
                    maxX <= minX ||
                    maxY <= minY
                ) {
                    return null;
                }
                return d;
            } catch (_) {
                return null;
            }
        }

        /** r aus z: Hauptwert-Wurzel oder Quadrat — für Canvas, Overlays, Sidebar. */
        function mapRFromZ(re, im) {
            if (state.zMapMode === 'square') {
                return { re: re * re - im * im, im: 2 * re * im };
            }
            return principalComplexSqrt(re, im);
        }

        function invalidateCnOverlaysMemo() {
            cnFormulaMemoKey = '';
            cnMagnitudeMemoKey = '';
            cnAbsrMemoKey = '';
            document.querySelectorAll('.cn-point-label').forEach((el) => {
                delete el.dataset.cnPointKey;
            });
        }

        /** Sidebar sqrt / ^2 — visuell mit state.zMapMode synchron halten */
        function syncMapModeButtons() {
            const sqrtBtn = document.getElementById('cn-map-sqrt');
            const sqBtn = document.getElementById('cn-map-sq');
            if (!sqrtBtn || !sqBtn) return;
            const mode = state.zMapMode === 'square' ? 'square' : 'sqrt';
            sqrtBtn.setAttribute('aria-pressed', mode === 'sqrt' ? 'true' : 'false');
            sqBtn.setAttribute('aria-pressed', mode === 'square' ? 'true' : 'false');
            sqrtBtn.classList.toggle('cn-map-mode-btn--active', mode === 'sqrt');
            sqBtn.classList.toggle('cn-map-mode-btn--active', mode === 'square');
        }

        function setupMapModeButtons() {
            const sqrtBtn = document.getElementById('cn-map-sqrt');
            const sqBtn = document.getElementById('cn-map-sq');
            if (!sqrtBtn || !sqBtn || sqrtBtn.dataset.cnBound === '1') return;
            sqrtBtn.dataset.cnBound = '1';
            sqrtBtn.addEventListener('click', () => {
                if (state.zMapMode === 'sqrt') return;
                state.zMapMode = 'sqrt';
                syncMapModeButtons();
                invalidateCnOverlaysMemo();
                ImaginaryNumbersControls.renderValDisplays(state, fmtNum);
                if (typeof CyberCanvasInstance !== 'undefined' && CyberCanvasInstance.isInitialized) {
                    CyberCanvasInstance.needsRedraw = true;
                }
                schedulePersistLabState();
            });
            sqBtn.addEventListener('click', () => {
                if (state.zMapMode === 'square') return;
                state.zMapMode = 'square';
                syncMapModeButtons();
                invalidateCnOverlaysMemo();
                ImaginaryNumbersControls.renderValDisplays(state, fmtNum);
                if (typeof CyberCanvasInstance !== 'undefined' && CyberCanvasInstance.isInitialized) {
                    CyberCanvasInstance.needsRedraw = true;
                }
                schedulePersistLabState();
            });
            syncMapModeButtons();
        }

        function persistLabState() {
            const CC = typeof CyberCanvasInstance !== 'undefined' ? CyberCanvasInstance : null;
            if (!CC || !CC.isInitialized) return;
            try {
                localStorage.setItem(
                    LAB_STORAGE_KEY,
                    JSON.stringify({
                        v: 1,
                        re: state.re,
                        im: state.im,
                        zMapMode: state.zMapMode === 'square' ? 'square' : 'sqrt',
                        view: {
                            minX: CC.view.minX,
                            maxX: CC.view.maxX,
                            minY: CC.view.minY,
                            maxY: CC.view.maxY,
                        },
                    }),
                );
            } catch (_) {}
        }

        function schedulePersistLabState() {
            if (labPersistTimer) clearTimeout(labPersistTimer);
            labPersistTimer = setTimeout(() => {
                labPersistTimer = null;
                persistLabState();
            }, 200);
        }

        function maybePersistAfterDraw() {
            const t = Date.now();
            if (t - labPersistDrawAt < 450) return;
            labPersistDrawAt = t;
            persistLabState();
        }

        /** Immer zwei Nachkommastellen (z. B. 1.00, 0.00) — für Overlays und Sidebar. */
        function fmtNum(v) {
            if (typeof v !== 'number' || !Number.isFinite(v)) return '0.00';
            const n = Math.round(v * 100) / 100;
            return n.toFixed(2);
        }

        let cnFormulaMemoKey = '';
        let cnMagnitudeMemoKey = '';
        let cnAbszMemoKey = '';
        let cnAbsrMemoKey = '';
        let cnFormulaWidthResizeBound = false;

        /**
         * Principal branch of √(x + iy): Re(√z) ≥ 0; for negative real axis, Im(√z) > 0.
         */
        function principalComplexSqrt(re, im) {
            const r = Math.hypot(re, im);
            if (r === 0) return { re: 0, im: 0 };
            const u = Math.sqrt((r + re) / 2);
            let v;
            if (u > 1e-12) {
                v = im / (2 * u);
            } else {
                v = (im >= 0 ? 1 : -1) * Math.sqrt((r - re) / 2);
            }
            return { re: u, im: v };
        }

        function updateCnFormulaOverlay() {
            const host = document.getElementById('cn-formula-tex');
            if (!host || typeof katex === 'undefined') return;
            const x = fmtNum(state.re);
            const y = fmtNum(state.im);
            const et = ImaginaryNumbersControls.escapeTexText;

            let memoKey;
            let tex;
            const zm = state.zMapMode === 'square' ? 'sq' : 'sqrt';
            /* r ziehen: r = u + iv; z ziehen: r = √z bzw. r = z²; idle: z = x + iy */
            if (dragTarget === 'r') {
                const w = mapRFromZ(state.re, state.im);
                const ur = fmtNum(w.re);
                const vi = fmtNum(w.im);
                memoKey = `mode:r|${zm}|${ur}|${vi}`;
                tex = `\\textcolor{${P.VAR_R}}{r} \\,{=}\\, \\textcolor{${P.AXIS_RE}}{\\text{${et(ur)}}} + \\mathit{i}\\,\\textcolor{${P.AXIS_IM}}{\\text{${et(vi)}}}`;
            } else if (dragTarget === 'z') {
                memoKey = `mode:z|${zm}`;
                tex =
                    state.zMapMode === 'square'
                        ? ImaginaryNumbersControls.texZSquare()
                        : ImaginaryNumbersControls.texRSqrtZ();
            } else {
                memoKey = `mode:idle|${zm}|${x}|${y}`;
                tex = `\\textcolor{${P.VAR_Z}}{z} = \\textcolor{${P.AXIS_RE}}{\\text{${et(x)}}} + \\mathit{i}\\,\\textcolor{${P.AXIS_IM}}{\\text{${et(y)}}}`;
            }

            if (memoKey === cnFormulaMemoKey) return;
            cnFormulaMemoKey = memoKey;

            try {
                katex.render(tex, host, { throwOnError: false, displayMode: false });
            } catch (_) {
                if (dragTarget === 'r') {
                    const w = mapRFromZ(state.re, state.im);
                    host.textContent = `r = ${fmtNum(w.re)} + i ${fmtNum(w.im)}`;
                }
                else if (dragTarget === 'z') {
                    host.textContent = state.zMapMode === 'square' ? 'r = z²' : 'r = √z';
                }
                else host.textContent = `z = ${x} + i ${y}`;
            }
        }

        /** |z| allein (Extra-Box); unter √ keine großen Klammern um die Summanden — nur x² + y² eingefärbt. */
        function updateCnAbszOverlay() {
            const host = document.getElementById('cn-formula-absz-tex');
            if (!host || typeof katex === 'undefined') return;
            const xr = state.re;
            const yi = state.im;
            const xs = fmtNum(xr);
            const ys = fmtNum(yi);
            const memoKey = `absz|${xs}|${ys}`;
            if (memoKey === cnAbszMemoKey) return;
            cnAbszMemoKey = memoKey;
            const et = ImaginaryNumbersControls.escapeTexText;
            const rho = Math.hypot(xr, yi);
            const rhos = fmtNum(rho);
            /* \textstyle im Radikanden: niedrigere Wurzel („flacher“) als \displaystyle + großer \vphantom */
            const tex =
                `\\left|\\textcolor{${P.VAR_Z}}{z}\\right| \\,{=}\\, ` +
                `\\sqrt{\\textstyle\\textcolor{${P.AXIS_RE}}{\\text{${et(xs)}}}^{2}\\,+\\,\\textcolor{${P.AXIS_IM}}{\\text{${et(ys)}}}^{2}} ` +
                `\\,{=}\\, \\textcolor{${P.TITLE_MUTED}}{\\text{${et(rhos)}}}`;
            try {
                katex.render(tex, host, { throwOnError: false, displayMode: false });
            } catch (_) {
                host.textContent = `|z| = √((${xs})² + (${ys})²) = ${rhos}`;
            }
        }

        /** |r| mit re(r), im(r) aus Hauptwert-√z; gleiche flache \textstyle-Wurzel wie |z|. */
        function updateCnAbsrOverlay() {
            const host = document.getElementById('cn-formula-absr-tex');
            if (!host || typeof katex === 'undefined') return;
            const xr = state.re;
            const yi = state.im;
            const xs = fmtNum(xr);
            const ys = fmtNum(yi);
            const zm = state.zMapMode === 'square' ? 'sq' : 'sqrt';
            const memoKey = `absr|${zm}|${xs}|${ys}`;
            if (memoKey === cnAbsrMemoKey) return;
            cnAbsrMemoKey = memoKey;
            const et = ImaginaryNumbersControls.escapeTexText;
            const w = mapRFromZ(xr, yi);
            const us = fmtNum(w.re);
            const vs = fmtNum(w.im);
            const absr = Math.hypot(w.re, w.im);
            const absrs = fmtNum(absr);
            const tex =
                `\\left|\\textcolor{${P.VAR_R}}{r}\\right| \\,{=}\\, ` +
                `\\sqrt{\\textstyle\\textcolor{${P.AXIS_RE}}{\\text{${et(us)}}}^{2}\\,+\\,\\textcolor{${P.AXIS_IM}}{\\text{${et(vs)}}}^{2}} ` +
                `\\,{=}\\, \\textcolor{${P.TITLE_MUTED}}{\\text{${et(absrs)}}}`;
            try {
                katex.render(tex, host, { throwOnError: false, displayMode: false });
            } catch (_) {
                host.textContent = `|r| = √((${us})² + (${vs})²) = ${absrs}`;
            }
        }

        /**
         * Hauptwert √z: nur noch re(r)- und im(r)-Zeilen (ohne Ergebnispaar-Zeile, ohne |z| — die stehen Extra).
         */
        function updateCnMagnitudeOverlay() {
            const host = document.getElementById('cn-formula-mag-tex');
            if (!host || typeof katex === 'undefined') return;
            const xr = state.re;
            const yi = state.im;
            const xs = fmtNum(xr);
            const ys = fmtNum(yi);
            const zm = state.zMapMode === 'square' ? 'sq' : 'sqrt';
            const memoKey = `mag|${zm}|${xs}|${ys}`;
            if (memoKey === cnMagnitudeMemoKey) return;
            cnMagnitudeMemoKey = memoKey;
            const et = ImaginaryNumbersControls.escapeTexText;

            const rho = Math.hypot(xr, yi);
            const rhos = fmtNum(rho);
            const w = mapRFromZ(xr, yi);
            const us = fmtNum(w.re);
            const vs = fmtNum(w.im);

            let tex;
            if (state.zMapMode === 'square') {
                if (rho < 1e-14) {
                    tex =
                        `\\begin{aligned}` +
                        `&\\textcolor{${P.AXIS_RE}}{\\operatorname{re}(r)} \\,{=}\\, \\textcolor{${P.AXIS_RE}}{\\text{${et(xs)}}}^{2}-\\textcolor{${P.AXIS_IM}}{\\text{${et(ys)}}}^{2} \\,{=}\\, 0 \\\\[0.35em]` +
                        `&\\textcolor{${P.AXIS_IM}}{\\operatorname{im}(r)} \\,{=}\\, 2\\,\\textcolor{${P.AXIS_RE}}{\\text{${et(xs)}}}\\,\\textcolor{${P.AXIS_IM}}{\\text{${et(ys)}}} \\,{=}\\, 0` +
                        `\\end{aligned}`;
                } else {
                    tex =
                        `\\begin{aligned}` +
                        `&\\textcolor{${P.AXIS_RE}}{\\operatorname{re}(r)} \\quad \\textcolor{${P.AXIS_RE}}{\\text{${et(xs)}}}^{2}-\\textcolor{${P.AXIS_IM}}{\\text{${et(ys)}}}^{2} \\,{=}\\, \\textcolor{${P.AXIS_RE}}{\\text{${et(us)}}} \\\\[0.4em]` +
                        `&\\textcolor{${P.AXIS_IM}}{\\operatorname{im}(r)} \\quad 2\\,\\textcolor{${P.AXIS_RE}}{\\text{${et(xs)}}}\\,\\textcolor{${P.AXIS_IM}}{\\text{${et(ys)}}} \\,{=}\\, \\textcolor{${P.AXIS_IM}}{\\text{${et(vs)}}}` +
                        `\\end{aligned}`;
                }
            } else if (rho < 1e-14) {
                tex =
                    `\\begin{aligned}` +
                    `&\\textcolor{${P.AXIS_RE}}{\\operatorname{re}(r)} \\,{=}\\, 0 \\\\[0.35em]` +
                    `&\\textcolor{${P.AXIS_IM}}{\\operatorname{im}(r)} \\,{=}\\, 0` +
                    `\\end{aligned}`;
            } else if (Math.abs(w.re) > 1e-12) {
                tex =
                    `\\begin{aligned}` +
                    `&\\textcolor{${P.AXIS_RE}}{\\operatorname{re}(r)} \\quad \\sqrt{\\dfrac{\\textcolor{${P.TITLE_MUTED}}{\\text{${et(rhos)}}}+\\textcolor{${P.AXIS_RE}}{\\text{${et(xs)}}}}{2}} \\,{=}\\, \\textcolor{${P.AXIS_RE}}{\\text{${et(us)}}} \\\\[0.4em]` +
                    `&\\textcolor{${P.AXIS_IM}}{\\operatorname{im}(r)} \\quad \\dfrac{\\textcolor{${P.AXIS_IM}}{\\text{${et(ys)}}}}{2\\,\\cdot\\,\\textcolor{${P.AXIS_RE}}{\\text{${et(us)}}}} \\,{=}\\, \\textcolor{${P.AXIS_IM}}{\\text{${et(vs)}}}` +
                    `\\end{aligned}`;
            } else {
                tex =
                    `\\begin{aligned}` +
                    `&\\textcolor{${P.AXIS_RE}}{\\operatorname{re}(r)} \\,{=}\\, 0 \\\\[0.4em]` +
                    `&\\textcolor{${P.AXIS_IM}}{\\operatorname{im}(r)} \\quad \\operatorname{sgn}\\bigl(\\textcolor{${P.AXIS_IM}}{\\text{${et(ys)}}}\\bigr)\\,\\sqrt{\\dfrac{|\\textcolor{${P.VAR_Z}}{z}|-\\textcolor{${P.AXIS_RE}}{x}}{2}} \\,{=}\\, \\sqrt{\\dfrac{\\textcolor{${P.TITLE_MUTED}}{\\text{${et(rhos)}}}-\\textcolor{${P.AXIS_RE}}{\\text{${et(xs)}}}}{2}} \\,{=}\\, \\textcolor{${P.AXIS_IM}}{\\text{${et(vs)}}}` +
                    `\\end{aligned}`;
            }

            try {
                katex.render(tex, host, { throwOnError: false, displayMode: true });
            } catch (_) {
                host.textContent = `re(r)=${us}, im(r)=${vs}`;
            }
        }

        /**
         * Alle vier Formel-Pillen gleich breit: max. natürliche Breite + ggf. Korrektur via scrollWidth,
         * damit KaTeX in |z|/|r| nicht schmaler wird als der Inhalt (keine Scrollleisten).
         */
        function syncCnFormulaOverlayWidths() {
            const row = document.getElementById('cn-formula-row');
            const ids = ['cn-formula-overlay', 'cn-formula-magnitude', 'cn-formula-absz', 'cn-formula-absr'];
            const els = ids.map((id) => document.getElementById(id)).filter(Boolean);
            if (!row || !els.length) return;

            els.forEach((el) => {
                el.style.display = 'inline-block';
                el.style.width = 'max-content';
                el.style.maxWidth = 'none';
            });
            let maxW = 0;
            els.forEach((el) => {
                maxW = Math.max(maxW, el.getBoundingClientRect().width);
            });
            els.forEach((el) => {
                el.style.display = '';
                el.style.width = '';
                el.style.maxWidth = '';
            });

            /* Kein Canvas-Cap mehr: sonst wurde |z|/|r| schmaler als KaTeX → horizontale Scrollbalken. */
            let px = Math.max(120, Math.ceil(maxW));
            row.style.setProperty('--cn-formula-unified-w', `${px}px`);
            let need = px;
            els.forEach((el) => {
                need = Math.max(need, el.scrollWidth);
            });
            if (need > px) {
                px = Math.ceil(need);
                row.style.setProperty('--cn-formula-unified-w', `${px}px`);
            }
        }

        function ensureCnFormulaWidthResizeListener() {
            if (cnFormulaWidthResizeBound) return;
            cnFormulaWidthResizeBound = true;
            let resizeTimer = null;
            window.addEventListener('resize', () => {
                if (resizeTimer) clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    resizeTimer = null;
                    syncCnFormulaOverlayWidths();
                }, 120);
            });
        }

        /** Grab radius in math units (~finger-sized on screen). */
        function grabRadiusMath(CC) {
            const span = Math.max(CC.view.maxX - CC.view.minX, CC.view.maxY - CC.view.minY);
            return Math.max(0.06, span * 0.032);
        }

        function hitZ(CC, pos) {
            const r = grabRadiusMath(CC);
            return Math.hypot(pos.x - state.re, pos.y - state.im) <= r;
        }

        /** Wenn beide Punkte im Griff liegen: näherer gewinnt. */
        function pickDragTarget(CC, pos) {
            const rad = grabRadiusMath(CC);
            const zd = Math.hypot(pos.x - state.re, pos.y - state.im);
            const w = principalComplexSqrt(state.re, state.im);
            const rd = Math.hypot(pos.x - w.re, pos.y - w.im);
            const hz = zd <= rad;
            const hr = rd <= rad;
            if (!hz && !hr) return null;
            if (hz && !hr) return 'z';
            if (!hz && hr) return 'r';
            return zd <= rd ? 'z' : 'r';
        }

        /** z aus komplexem r (u+iv): z = (u+iv)² */
        function applyZFromSqrtPosition(u, v) {
            const ur = Math.max(Z_SLIDER_MIN, Math.min(Z_SLIDER_MAX, u));
            const vr = Math.max(Z_SLIDER_MIN, Math.min(Z_SLIDER_MAX, v));
            let zre = ur * ur - vr * vr;
            let zim = 2 * ur * vr;
            state.re = Math.max(Z_SLIDER_MIN, Math.min(Z_SLIDER_MAX, zre));
            state.im = Math.max(Z_SLIDER_MIN, Math.min(Z_SLIDER_MAX, zim));
        }

        /** r-Readout in der Sidebar nach z-Bewegung (keine Slider mehr). */
        function syncSlidersFromState() {
            ImaginaryNumbersControls.renderValDisplays(state, fmtNum);
            schedulePersistLabState();
        }

        function bindZPointDrag() {
            const CC = CyberCanvasInstance;

            CC.onMouseDown = (pos) => {
                const t = pickDragTarget(CC, pos);
                if (t) {
                    dragTarget = t;
                    CC.allowPan = false;
                    CC.canvas.style.cursor = 'grabbing';
                }
            };

            CC.onMouseMove = (pos) => {
                if (dragTarget === 'z') {
                    state.re = Math.max(Z_SLIDER_MIN, Math.min(Z_SLIDER_MAX, pos.x));
                    state.im = Math.max(Z_SLIDER_MIN, Math.min(Z_SLIDER_MAX, pos.y));
                    syncSlidersFromState();
                    CC.needsRedraw = true;
                    return;
                }
                if (dragTarget === 'r') {
                    applyZFromSqrtPosition(pos.x, pos.y);
                    syncSlidersFromState();
                    CC.needsRedraw = true;
                    return;
                }
                if (CC.isDragging) return;
                CC.canvas.style.cursor = pickDragTarget(CC, pos) ? 'grab' : 'crosshair';
            };

            CC.onMouseUp = () => {
                if (dragTarget !== null) {
                    dragTarget = null;
                    cnFormulaMemoKey = '';
                    CC.allowPan = true;
                    syncSlidersFromState();
                    CC.needsRedraw = true;
                }
                if (!CC.isDragging) CC.canvas.style.cursor = 'crosshair';
                schedulePersistLabState();
            };
        }

        function draw() {
            const CC = CyberCanvasInstance;
            if (!CC.isInitialized) return;

            CC.drawGrid({
                vignette: true,
                glow: true,
                mainColor: rgbaFromHex(P.CARD_ACCENT, 0.42),
            });

            const ctx = CC.ctx;
            const ox = CC.mapX(0);
            const oy = CC.mapY(0);
            const ax = CC.mapX(state.re);
            const ay = CC.mapY(state.im);
            const sqrtZ = principalComplexSqrt(state.re, state.im);
            const sx = CC.mapX(sqrtZ.re);
            const sy = CC.mapY(sqrtZ.im);
            const s = CC.getUiScale();

            /*
             * Gestrichelt: nur Lotfußpunkte auf reeller / imaginärer Achse (jeweils zwei Striche pro Punkt).
             * Keine Strecke auf der imaginären Achse von (0, im) nach (0, 0) — die war redundant „auf der y-Achse“.
             */
            ctx.setLineDash([6, 6]);
            ctx.lineWidth = Math.max(0.8, s);
            ctx.strokeStyle = P.AXIS_RE;
            ctx.beginPath();
            ctx.moveTo(ax, ay);
            ctx.lineTo(ox, ay);
            ctx.stroke();
            ctx.strokeStyle = P.AXIS_IM;
            ctx.beginPath();
            ctx.moveTo(ax, oy);
            ctx.lineTo(ax, ay);
            ctx.stroke();
            ctx.strokeStyle = P.AXIS_RE;
            ctx.beginPath();
            ctx.moveTo(sx, sy);
            ctx.lineTo(ox, sy);
            ctx.stroke();
            ctx.strokeStyle = P.AXIS_IM;
            ctx.beginPath();
            ctx.moveTo(sx, oy);
            ctx.lineTo(sx, sy);
            ctx.stroke();
            ctx.setLineDash([]);

            /* Vektoren O → r und O → z: beide weiß, dünn */
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.lineWidth = Math.max(0.45, 0.65 * s);
            ctx.beginPath();
            ctx.moveTo(ox, oy);
            ctx.lineTo(sx, sy);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(ox, oy);
            ctx.lineTo(ax, ay);
            ctx.stroke();

            ctx.fillStyle = rgbaFromHex(P.VAR_R, 0.98);
            ctx.beginPath();
            ctx.arc(sx, sy, 6 * s, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = rgbaFromHex(P.VAR_Z, 0.95);
            ctx.beginPath();
            ctx.arc(ax, ay, 6 * s, 0, Math.PI * 2);
            ctx.fill();

            updateCnPointLabelOverlays(CC, ax, ay, sx, sy, s);

            updateCnFormulaOverlay();
            updateCnAbszOverlay();
            updateCnAbsrOverlay();
            updateCnMagnitudeOverlay();
            requestAnimationFrame(() => syncCnFormulaOverlayWidths());
            maybePersistAfterDraw();
        }

        function ensureCnPointLabelsKatex() {
            if (typeof katex === 'undefined') return;
            const zEl = document.getElementById('cn-label-z');
            const rEl = document.getElementById('cn-label-r');
            const mode = dragTarget == null ? 'idle' : dragTarget;
            const key = `cn-pt-${mode}`;

            if (zEl && zEl.dataset.cnPointKey !== key) {
                zEl.innerHTML = '';
                const zTex =
                    mode === 'r'
                        ? `\\textcolor{${P.VAR_Z}}{z} \\,{=}\\, \\textcolor{${P.VAR_R}}{r}^{\\,2}`
                        : `\\textcolor{${P.VAR_Z}}{z}`;
                katex.render(zTex, zEl, { throwOnError: false, displayMode: false });
                zEl.dataset.cnPointKey = key;
            }
            if (rEl && rEl.dataset.cnPointKey !== key) {
                rEl.innerHTML = '';
                const rTex =
                    mode === 'r'
                        ? `\\textcolor{${P.VAR_R}}{r}`
                        : ImaginaryNumbersControls.texRSqrtZ();
                katex.render(rTex, rEl, { throwOnError: false, displayMode: false });
                rEl.dataset.cnPointKey = key;
            }
        }

        function updateCnPointLabelOverlays(CC, ax, ay, sx, sy, s) {
            ensureCnPointLabelsKatex();
            const canvas = CC.canvas;
            const zEl = document.getElementById('cn-label-z');
            const rEl = document.getElementById('cn-label-r');
            if (!canvas || !zEl || !rEl) return;
            const ox = canvas.offsetLeft;
            const oy = canvas.offsetTop;
            const pad = 3 * s;
            const longZ = dragTarget === 'r';
            const fz = (longZ ? Math.max(14, Math.round(17 * s)) : Math.max(18, Math.round(21 * s))) + 'px';
            zEl.style.fontSize = fz;
            rEl.style.fontSize = fz;
            zEl.style.left = `${ox + ax + pad}px`;
            zEl.style.top = `${oy + ay - pad}px`;
            zEl.style.transform = 'translateY(-100%)';
            rEl.style.left = `${ox + sx + pad}px`;
            rEl.style.top = `${oy + sy - pad}px`;
            rEl.style.transform = 'translateY(-100%)';
        }

        function setupLab() {
            const saved = loadPersistedLab();

            CyberCanvasInstance.init('main-canvas', {}, {
                showLabels: true,
                showTelemetry: false,
            });

            if (saved) {
                state.re = clampToSliders(saved.re);
                state.im = clampToSliders(saved.im);
                if (saved.zMapMode === 'sqrt' || saved.zMapMode === 'square') {
                    state.zMapMode = saved.zMapMode;
                }
                CyberCanvasInstance.view.minX = saved.view.minX;
                CyberCanvasInstance.view.maxX = saved.view.maxX;
                CyberCanvasInstance.view.minY = saved.view.minY;
                CyberCanvasInstance.view.maxY = saved.view.maxY;
                CyberCanvasInstance.resize();
            } else {
                CyberCanvasInstance.resetView(Z_SLIDER_MIN, Z_SLIDER_MAX);
            }

            cnFormulaMemoKey = '';
            cnAbszMemoKey = '';
            cnAbsrMemoKey = '';
            cnMagnitudeMemoKey = '';
            document.querySelectorAll('.cn-point-label').forEach((el) => {
                delete el.dataset.cnPointKey;
            });

            CyberCanvasInstance.onResize = draw;
            bindZPointDrag();

            window.addEventListener('beforeunload', persistLabState);
            window.addEventListener('pagehide', persistLabState);

            CyberCanvasInstance.onContextMenu = (e) => {
                CyberUI.showContextMenu(e.clientX, e.clientY, [
                    {
                        label: CyberI18n.get('lgs.view_reset'),
                        onclick: () => {
                            CyberCanvasInstance.resetView(Z_SLIDER_MIN, Z_SLIDER_MAX);
                            CyberCanvasInstance.needsRedraw = true;
                            schedulePersistLabState();
                        },
                    },
                    { divider: true },
                    {
                        label: CyberI18n.get('ui.show_axes'),
                        checked: CyberCanvasInstance.showAxes,
                        onchange: (val) => {
                            CyberCanvasInstance.showAxes = val;
                            CyberCanvasInstance.needsRedraw = true;
                        },
                    },
                    {
                        label: CyberI18n.get('ui.show_grid'),
                        checked: CyberCanvasInstance.showGrid,
                        onchange: (val) => {
                            CyberCanvasInstance.showGrid = val;
                            CyberCanvasInstance.needsRedraw = true;
                        },
                    },
                    {
                        label: CyberI18n.get('ui.show_labels'),
                        checked: CyberCanvasInstance.showLabels,
                        onchange: (val) => {
                            CyberCanvasInstance.showLabels = val;
                            CyberCanvasInstance.needsRedraw = true;
                        },
                    },
                ]);
            };

            ImaginaryNumbersControls.setupParameterCard({
                state,
                fmtNum,
                sqrtProvider: principalComplexSqrt,
            });

            setupMapModeButtons();

            syncSlidersFromState();
            updateCnFormulaOverlay();
            updateCnAbszOverlay();
            updateCnAbsrOverlay();
            updateCnMagnitudeOverlay();
            ensureCnFormulaWidthResizeListener();
            requestAnimationFrame(() => syncCnFormulaOverlayWidths());

            CyberCanvasInstance.needsRedraw = true;
        }

        document.fonts.ready.then(setupLab);
    </script>
</body>

</html>
