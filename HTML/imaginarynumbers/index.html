<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOC ALVERS MATHE-LABORE | Imaginäre Zahlen</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="../resources/favicon.svg">
    <link rel="icon" type="image/png" sizes="256x256" href="../resources/favicon.png">
    <link rel="stylesheet" href="../js/cyber-layout.css">
    <link rel="stylesheet" href="../js/buttons-ultra.css">
    <link rel="stylesheet" href="../js/cyber-lab-overrides.css">
    <link rel="stylesheet" href="../js/branding.styles.extracted.css">
    <link rel="stylesheet" href="../js/lab-shell-minimal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="imaginarynumbers.css">
</head>

<body>
    <nav id="mini-rail">
        <div class="nav-btn" onclick="toggleSidebar()" title="Toggle Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </div>
    </nav>

    <aside id="side-panel">
        <header id="sidebar-header"></header>
        <div id="ui-container"></div>
    </aside>

    <main id="main-content">
        <div id="canvas-container">
            <!-- Grid + axes: CyberCanvas.drawGrid (see js/cyber-canvas.js) -->
            <canvas id="main-canvas"></canvas>
            <div id="cn-formula-row" class="cn-formula-row">
                <div id="cn-formula-overlay" class="cn-formula-overlay" aria-live="polite">
                    <span id="cn-formula-tex"></span>
                </div>
                <div id="cn-formula-magnitude" class="cn-formula-overlay cn-formula-magnitude" aria-live="polite">
                    <span id="cn-formula-mag-tex"></span>
                </div>
                <div id="cn-formula-sum" class="cn-formula-overlay cn-formula-sum" aria-live="polite" style="display: none;">
                    <span id="cn-formula-sum-tex"></span>
                </div>
                <div id="cn-formula-diff" class="cn-formula-overlay cn-formula-diff" aria-live="polite" style="display: none;">
                    <span id="cn-formula-diff-tex"></span>
                </div>
                <div id="cn-formula-prod" class="cn-formula-overlay cn-formula-prod" aria-live="polite" style="display: none;">
                    <span id="cn-formula-prod-tex"></span>
                </div>
                <div id="cn-formula-quot" class="cn-formula-overlay cn-formula-quot" aria-live="polite" style="display: none;">
                    <span id="cn-formula-quot-tex"></span>
                </div>
            </div>
            <div id="cn-formula-row-bottom" class="cn-formula-row-bottom">
                <div id="cn-formula-absz" class="cn-formula-overlay cn-formula-absz" aria-live="polite">
                    <span id="cn-formula-absz-tex"></span>
                </div>
                <div id="cn-formula-absr" class="cn-formula-overlay cn-formula-absr" aria-live="polite">
                    <span id="cn-formula-absr-tex"></span>
                </div>
                <div id="cn-formula-absw" class="cn-formula-overlay cn-formula-absw" aria-live="polite" style="display: none;">
                    <span id="cn-formula-absw-tex"></span>
                </div>
                <div id="cn-formula-absd" class="cn-formula-overlay cn-formula-absd" aria-live="polite" style="display: none;">
                    <span id="cn-formula-absd-tex"></span>
                </div>
                <div id="cn-formula-absp" class="cn-formula-overlay cn-formula-absp" aria-live="polite" style="display: none;">
                    <span id="cn-formula-absp-tex"></span>
                </div>
                <div id="cn-formula-absq" class="cn-formula-overlay cn-formula-absq" aria-live="polite" style="display: none;">
                    <span id="cn-formula-absq-tex"></span>
                </div>
            </div>
            <div id="cn-point-labels" class="cn-point-labels" aria-hidden="true">
                <span id="cn-label-z" class="cn-point-label"></span>
                <span id="cn-label-r" class="cn-point-label"></span>
                <span id="cn-label-w" class="cn-point-label"></span>
                <span id="cn-label-d" class="cn-point-label"></span>
                <span id="cn-label-p" class="cn-point-label"></span>
                <span id="cn-label-q" class="cn-point-label"></span>
            </div>
            <div id="imaginarynumbers-coach" class="math-coach-box">
                <div class="coach-title" id="coach-title-slot"></div>
                <div id="coach-content" class="coach-message"></div>
            </div>
        </div>
    </main>

    <script src="../js/cyber-left-chrome.js"></script>
    <script src="../js/branding/briefings.js"></script>
    <script src="../js/branding/overlays.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/branding.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/cyber-canvas.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
    <script src="imaginarynumbers-math.js"></script>
    <script src="imaginarynumbers-controls.js"></script>
    <script src="imaginarynumbers-overlays.js"></script>
    <script>
        ImaginaryNumbersControls.applyPaletteCssVars();
        const P = ImaginaryNumbersControls.PALETTE;
        const rgbaFromHex = (hex, a) =>
            `rgba(${ImaginaryNumbersControls.hexToRgbComma(hex)}, ${a})`;
        
        const fmtNum = ImaginaryNumbersMath.fmtNum;
        const mapRFromZ = (re, im) =>
            state.zMapMode === 'free'
                ? { re: state.rRe, im: state.rIm }
                : ImaginaryNumbersMath.mapRFromZ(re, im, state.zMapMode);

        function toggleSidebar() {
            const panel = document.getElementById('side-panel');
            panel.classList.toggle('collapsed');
            if (window.CyberLeftChrome && typeof CyberLeftChrome.publishResolvedScale === 'function') {
                CyberLeftChrome.publishResolvedScale();
            }
            setTimeout(() => {
                window.dispatchEvent(new Event('resize'));
                if (typeof CyberCanvasInstance !== 'undefined' && CyberCanvasInstance.isInitialized) {
                    CyberCanvasInstance.needsRedraw = true;
                }
            }, 400);
        }

        CyberBranding.init({
            useExternalStyles: true,
            title: CyberI18n.get('ui.coach_title'),
            subtitle: (CyberI18n.getOr('ui.imaginary_numbers', 'Imaginary numbers')).toUpperCase(),
            briefingKey: 'imaginarynumbers'
        });
        CyberUI.init();

        (function setCoachTitleFromI18n() {
            const el = document.getElementById('coach-title-slot');
            if (el && typeof CyberI18n !== 'undefined' && typeof CyberI18n.get === 'function') {
                el.textContent = CyberI18n.get('ui.description');
            }
        })();

        if (window.CyberLeftChrome && typeof CyberLeftChrome.configure === 'function') {
            CyberLeftChrome.configure({ viewportOnlyZoom: true });
        }

        /** Real part x, imaginary part y — same math space as CyberCanvas axis pair. */

        const state = { re: 1, im: 1, zMapMode: 'sqrt', rRe: 1, rIm: 1, showSum: false, showDiff: false, showProd: false, showQuot: false, showDashedLines: true, showAbsBoxes: true };
        /** null | 'z' | 'r' — only point drag target; in free mode r moves independently of z. */
        let dragTarget = null;
        const Z_SLIDER_MIN = -20;
        const Z_SLIDER_MAX = 20;

        const LAB_STORAGE_KEY = 'forloop.imaginarynumbers.v1';
        let labPersistTimer = null;
        let labPersistDrawAt = 0;

        function clampToSliders(v) {
            return Math.max(Z_SLIDER_MIN, Math.min(Z_SLIDER_MAX, v));
        }

        function loadPersistedLab() {
            try {
                const raw = localStorage.getItem(LAB_STORAGE_KEY);
                if (!raw) return null;
                const d = JSON.parse(raw);
                if (!d || d.v !== 1 || typeof d.re !== 'number' || typeof d.im !== 'number') return null;
                if (!d.view) return null;
                const { minX, maxX, minY, maxY } = d.view;
                if (
                    [minX, maxX, minY, maxY].some((u) => typeof u !== 'number' || !Number.isFinite(u)) ||
                    maxX <= minX ||
                    maxY <= minY
                ) {
                    return null;
                }
                return d;
            } catch (_) {
                return null;
            }
        }

        /** Sidebar sqrt / ^2 — keep visually in sync with state.zMapMode */
        function syncMapModeButtons() {
            const sqrtCheck = document.getElementById('cn-map-sqrt');
            const sqCheck = document.getElementById('cn-map-sq');
            if (!sqrtCheck || !sqCheck) return;
            sqrtCheck.checked = state.zMapMode === 'sqrt';
            sqCheck.checked = state.zMapMode === 'square';
        }

        function setupMapModeButtons() {
            const sqrtCheck = document.getElementById('cn-map-sqrt');
            const sqCheck = document.getElementById('cn-map-sq');
            const sumCheck = document.getElementById('cn-check-sum');
            const diffCheck = document.getElementById('cn-check-diff');
            const dashedCheck = document.getElementById('cn-check-dashed');
            const absCheck = document.getElementById('cn-check-abs');
            
            if (sumCheck) {
                sumCheck.checked = state.showSum;
                sumCheck.addEventListener('change', (e) => {
                    state.showSum = e.target.checked;
                    ImaginaryNumbersOverlays.invalidateCnOverlaysMemo();
                    ImaginaryNumbersControls.renderMapModeKatex(state);
                    if (typeof CyberCanvasInstance !== 'undefined' && CyberCanvasInstance.isInitialized) {
                        CyberCanvasInstance.needsRedraw = true;
                    }
                    schedulePersistLabState();
                });
            }

            if (diffCheck) {
                diffCheck.checked = state.showDiff;
                diffCheck.addEventListener('change', (e) => {
                    state.showDiff = e.target.checked;
                    ImaginaryNumbersOverlays.invalidateCnOverlaysMemo();
                    ImaginaryNumbersControls.renderMapModeKatex(state);
                    if (typeof CyberCanvasInstance !== 'undefined' && CyberCanvasInstance.isInitialized) {
                        CyberCanvasInstance.needsRedraw = true;
                    }
                    schedulePersistLabState();
                });
            }

            const prodCheck = document.getElementById('cn-check-prod');
            if (prodCheck) {
                prodCheck.checked = state.showProd;
                prodCheck.addEventListener('change', (e) => {
                    state.showProd = e.target.checked;
                    ImaginaryNumbersOverlays.invalidateCnOverlaysMemo();
                    ImaginaryNumbersControls.renderMapModeKatex(state);
                    if (typeof CyberCanvasInstance !== 'undefined' && CyberCanvasInstance.isInitialized) {
                        CyberCanvasInstance.needsRedraw = true;
                    }
                    schedulePersistLabState();
                });
            }

            const quotCheck = document.getElementById('cn-check-quot');
            if (quotCheck) {
                quotCheck.checked = state.showQuot;
                quotCheck.addEventListener('change', (e) => {
                    state.showQuot = e.target.checked;
                    ImaginaryNumbersOverlays.invalidateCnOverlaysMemo();
                    ImaginaryNumbersControls.renderMapModeKatex(state);
                    if (typeof CyberCanvasInstance !== 'undefined' && CyberCanvasInstance.isInitialized) {
                        CyberCanvasInstance.needsRedraw = true;
                    }
                    schedulePersistLabState();
                });
            }

            if (dashedCheck) {
                dashedCheck.checked = state.showDashedLines;
                dashedCheck.addEventListener('change', (e) => {
                    state.showDashedLines = e.target.checked;
                    if (typeof CyberCanvasInstance !== 'undefined' && CyberCanvasInstance.isInitialized) {
                        CyberCanvasInstance.needsRedraw = true;
                    }
                    schedulePersistLabState();
                });
            }

            if (absCheck) {
                absCheck.checked = state.showAbsBoxes;
                absCheck.addEventListener('change', (e) => {
                    state.showAbsBoxes = e.target.checked;
                    ImaginaryNumbersOverlays.invalidateCnOverlaysMemo();
                    if (typeof CyberCanvasInstance !== 'undefined' && CyberCanvasInstance.isInitialized) {
                        CyberCanvasInstance.needsRedraw = true;
                    }
                    schedulePersistLabState();
                });
            }

            if (!sqrtCheck || !sqCheck || sqrtCheck.dataset.cnBound === '1') return;
            sqrtCheck.dataset.cnBound = '1';
            sqrtCheck.addEventListener('change', (e) => {
                if (e.target.checked) {
                    state.zMapMode = 'sqrt';
                    sqCheck.checked = false;
                } else if (!sqCheck.checked && state.zMapMode !== 'free') {
                    state.zMapMode = 'free';
                    const currentR = ImaginaryNumbersMath.mapRFromZ(state.re, state.im, 'sqrt');
                    state.rRe = currentR.re;
                    state.rIm = currentR.im;
                }
                syncMapModeButtons();
                ImaginaryNumbersOverlays.invalidateCnOverlaysMemo();
                ImaginaryNumbersControls.renderValDisplays(state, fmtNum);
                if (typeof CyberCanvasInstance !== 'undefined' && CyberCanvasInstance.isInitialized) {
                    CyberCanvasInstance.needsRedraw = true;
                }
                schedulePersistLabState();
            });
            sqCheck.addEventListener('change', (e) => {
                if (e.target.checked) {
                    state.zMapMode = 'square';
                    sqrtCheck.checked = false;
                } else if (!sqrtCheck.checked && state.zMapMode !== 'free') {
                    state.zMapMode = 'free';
                    const currentR = ImaginaryNumbersMath.mapRFromZ(state.re, state.im, 'square');
                    state.rRe = currentR.re;
                    state.rIm = currentR.im;
                }
                syncMapModeButtons();
                ImaginaryNumbersOverlays.invalidateCnOverlaysMemo();
                ImaginaryNumbersControls.renderValDisplays(state, fmtNum);
                if (typeof CyberCanvasInstance !== 'undefined' && CyberCanvasInstance.isInitialized) {
                    CyberCanvasInstance.needsRedraw = true;
                }
                schedulePersistLabState();
            });
            syncMapModeButtons();
        }

        function persistLabState() {
            const CC = typeof CyberCanvasInstance !== 'undefined' ? CyberCanvasInstance : null;
            if (!CC || !CC.isInitialized) return;
            try {
                localStorage.setItem(
                    LAB_STORAGE_KEY,
                    JSON.stringify({
                        v: 1,
                        re: state.re,
                        im: state.im,
                        zMapMode: state.zMapMode === 'square' ? 'square' : state.zMapMode === 'free' ? 'free' : 'sqrt',
                        rRe: state.rRe,
                        rIm: state.rIm,
                        showSum: !!state.showSum,
                        showDiff: !!state.showDiff,
                        showProd: !!state.showProd,
                        showQuot: !!state.showQuot,
                        showDashedLines: !!state.showDashedLines,
                        showAbsBoxes: !!state.showAbsBoxes,
                        view: {
                            minX: CC.view.minX,
                            maxX: CC.view.maxX,
                            minY: CC.view.minY,
                            maxY: CC.view.maxY,
                        },
                    }),
                );
            } catch (_) {}
        }

        function schedulePersistLabState() {
            if (labPersistTimer) clearTimeout(labPersistTimer);
            labPersistTimer = setTimeout(() => {
                labPersistTimer = null;
                persistLabState();
            }, 200);
        }

        function maybePersistAfterDraw() {
            const t = Date.now();
            if (t - labPersistDrawAt < 450) return;
            labPersistDrawAt = t;
            persistLabState();
        }

        /** Grab radius in math units (~finger-sized on screen). */
        function grabRadiusMath(CC) {
            const span = Math.max(CC.view.maxX - CC.view.minX, CC.view.maxY - CC.view.minY);
            return Math.max(0.06, span * 0.032);
        }

        /** Mouse point target: z or r in free mode. */
        function pickDragTarget(CC, pos) {
            const rad = grabRadiusMath(CC);
            const zd = Math.hypot(pos.x - state.re, pos.y - state.im);
            let closest = { target: zd <= rad ? 'z' : null, dist: zd };
            if (state.zMapMode === 'free') {
                const rd = Math.hypot(pos.x - state.rRe, pos.y - state.rIm);
                if (rd <= rad && (closest.target === null || rd < closest.dist)) {
                    closest = { target: 'r', dist: rd };
                }
            }
            return closest.target;
        }

        /** r-Readout in the sidebar after z-movement (no sliders anymore). */
        function syncSlidersFromState() {
            ImaginaryNumbersControls.renderValDisplays(state, fmtNum);
            schedulePersistLabState();
        }

        function bindZPointDrag() {
            const CC = CyberCanvasInstance;

            CC.onMouseDown = (pos) => {
                const t = pickDragTarget(CC, pos);
                if (t) {
                    dragTarget = t;
                    CC.allowPan = false;
                    CC.canvas.style.cursor = 'grabbing';
                }
            };

            CC.onMouseMove = (pos) => {
                if (dragTarget === 'z') {
                    state.re = Math.max(Z_SLIDER_MIN, Math.min(Z_SLIDER_MAX, pos.x));
                    state.im = Math.max(Z_SLIDER_MIN, Math.min(Z_SLIDER_MAX, pos.y));
                    syncSlidersFromState();
                    CC.needsRedraw = true;
                    return;
                }
                if (dragTarget === 'r') {
                    state.rRe = Math.max(Z_SLIDER_MIN, Math.min(Z_SLIDER_MAX, pos.x));
                    state.rIm = Math.max(Z_SLIDER_MIN, Math.min(Z_SLIDER_MAX, pos.y));
                    syncSlidersFromState();
                    CC.needsRedraw = true;
                    return;
                }
                if (CC.isDragging) return;
                CC.canvas.style.cursor = pickDragTarget(CC, pos) ? 'grab' : 'crosshair';
            };

            CC.onMouseUp = () => {
                if (dragTarget !== null) {
                    dragTarget = null;
                    ImaginaryNumbersOverlays.invalidateCnOverlaysMemo();
                    CC.allowPan = true;
                    syncSlidersFromState();
                    CC.needsRedraw = true;
                }
                if (!CC.isDragging) CC.canvas.style.cursor = 'crosshair';
                schedulePersistLabState();
            };
        }

        function draw() {
            const CC = CyberCanvasInstance;
            if (!CC.isInitialized) return;

            CC.drawGrid({
                vignette: true,
                glow: true,
                mainColor: rgbaFromHex(P.CARD_ACCENT, 0.42),
                axisReColor: rgbaFromHex(P.AXIS_RE, 0.88),
                axisImColor: rgbaFromHex(P.AXIS_IM, 0.88),
                axisLabelReColor: rgbaFromHex(P.AXIS_RE, 0.9),
                axisLabelImColor: rgbaFromHex(P.AXIS_IM, 0.9),
            });

            const ctx = CC.ctx;
            const ox = CC.mapX(0);
            const oy = CC.mapY(0);
            const ax = CC.mapX(state.re);
            const ay = CC.mapY(state.im);
            const rPt = mapRFromZ(state.re, state.im, state.zMapMode);
            const sx = CC.mapX(rPt.re);
            const sy = CC.mapY(rPt.im);
            const s = CC.getUiScale();

            let wx, wy, dx, dy, px, py, qx, qy;
            if (state.showSum) {
                wx = CC.mapX(state.re + rPt.re);
                wy = CC.mapY(state.im + rPt.im);
            }
            if (state.showDiff) {
                dx = CC.mapX(state.re - rPt.re);
                dy = CC.mapY(state.im - rPt.im);
            }
            if (state.showProd) {
                const prod = ImaginaryNumbersMath.multiplyComplex(state.re, state.im, rPt.re, rPt.im);
                px = CC.mapX(prod.re);
                py = CC.mapY(prod.im);
            }
            if (state.showQuot) {
                const quot = ImaginaryNumbersMath.divideComplex(state.re, state.im, rPt.re, rPt.im);
                qx = CC.mapX(quot.re);
                qy = CC.mapY(quot.im);
            }

            if (state.showDashedLines) {
                ctx.setLineDash([6, 6]);
                ctx.lineWidth = Math.max(0.4, 0.5 * s);
                ctx.strokeStyle = P.AXIS_RE;
                ctx.beginPath();
                ctx.moveTo(ax, ay);
                ctx.lineTo(ox, ay);
                ctx.stroke();
                ctx.strokeStyle = P.AXIS_IM;
                ctx.beginPath();
                ctx.moveTo(ax, oy);
                ctx.lineTo(ax, ay);
                ctx.stroke();
                ctx.strokeStyle = P.AXIS_RE;
                ctx.beginPath();
                ctx.moveTo(sx, sy);
                ctx.lineTo(ox, sy);
                ctx.stroke();
                ctx.strokeStyle = P.AXIS_IM;
                ctx.beginPath();
                ctx.moveTo(sx, oy);
                ctx.lineTo(sx, sy);
                ctx.stroke();
                
                if (state.showSum) {
                    ctx.strokeStyle = P.AXIS_RE;
                    ctx.beginPath();
                    ctx.moveTo(wx, wy);
                    ctx.lineTo(ox, wy);
                    ctx.stroke();
                    ctx.strokeStyle = P.AXIS_IM;
                    ctx.beginPath();
                    ctx.moveTo(wx, oy);
                    ctx.lineTo(wx, wy);
                    ctx.stroke();
                }
                if (state.showDiff) {
                    ctx.strokeStyle = P.AXIS_RE;
                    ctx.beginPath();
                    ctx.moveTo(dx, dy);
                    ctx.lineTo(ox, dy);
                    ctx.stroke();
                    ctx.strokeStyle = P.AXIS_IM;
                    ctx.beginPath();
                    ctx.moveTo(dx, oy);
                    ctx.lineTo(dx, dy);
                    ctx.stroke();
                }
                if (state.showProd) {
                    ctx.strokeStyle = P.AXIS_RE;
                    ctx.beginPath();
                    ctx.moveTo(px, py);
                    ctx.lineTo(ox, py);
                    ctx.stroke();
                    ctx.strokeStyle = P.AXIS_IM;
                    ctx.beginPath();
                    ctx.moveTo(px, oy);
                    ctx.lineTo(px, py);
                    ctx.stroke();
                }
                if (state.showQuot) {
                    ctx.strokeStyle = P.AXIS_RE;
                    ctx.beginPath();
                    ctx.moveTo(qx, qy);
                    ctx.lineTo(ox, qy);
                    ctx.stroke();
                    ctx.strokeStyle = P.AXIS_IM;
                    ctx.beginPath();
                    ctx.moveTo(qx, oy);
                    ctx.lineTo(qx, qy);
                    ctx.stroke();
                }
                ctx.setLineDash([]);
            }

            if (state.showSum) {
                ctx.lineWidth = Math.max(0.45, 0.65 * s);
                ctx.strokeStyle = P.VAR_R;
                ctx.beginPath();
                ctx.moveTo(ax, ay);
                ctx.lineTo(wx, wy);
                ctx.stroke();
                
                ctx.strokeStyle = P.VAR_Z;
                ctx.beginPath();
                ctx.moveTo(sx, sy);
                ctx.lineTo(wx, wy);
                ctx.stroke();
            }

            if (state.showDiff) {
                const mx = CC.mapX(-rPt.re);
                const my = CC.mapY(-rPt.im);
                ctx.lineWidth = Math.max(0.45, 0.65 * s);
                
                ctx.strokeStyle = P.VAR_R;
                ctx.beginPath();
                ctx.moveTo(ox, oy);
                ctx.lineTo(mx, my);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(ax, ay);
                ctx.lineTo(dx, dy);
                ctx.stroke();
                
                ctx.strokeStyle = P.VAR_Z;
                ctx.beginPath();
                ctx.moveTo(mx, my);
                ctx.lineTo(dx, dy);
                ctx.stroke();

                // Punkt an der Ecke –r (grün)
                ctx.fillStyle = rgbaFromHex(P.VAR_R, 0.98);
                ctx.beginPath();
                ctx.arc(mx, my, 6 * s, 0, Math.PI * 2);
                ctx.fill();
            }

            /* Vectors O → r, O → z, O → w, O → d: in their respective colors */
            ctx.lineWidth = Math.max(0.45, 0.65 * s);
            
            ctx.strokeStyle = P.VAR_R;
            ctx.beginPath();
            ctx.moveTo(ox, oy);
            ctx.lineTo(sx, sy);
            ctx.stroke();
            
            ctx.strokeStyle = P.VAR_Z;
            ctx.beginPath();
            ctx.moveTo(ox, oy);
            ctx.lineTo(ax, ay);
            ctx.stroke();
            
            if (state.showSum) {
                ctx.strokeStyle = P.VAR_OMEGA;
                ctx.beginPath();
                ctx.moveTo(ox, oy);
                ctx.lineTo(wx, wy);
                ctx.stroke();
            }

            if (state.showDiff) {
                ctx.strokeStyle = P.VAR_DIFF;
                ctx.beginPath();
                ctx.moveTo(ox, oy);
                ctx.lineTo(dx, dy);
                ctx.stroke();
            }

            if (state.showProd) {
                ctx.strokeStyle = P.VAR_PRODUCT;
                ctx.beginPath();
                ctx.moveTo(ox, oy);
                ctx.lineTo(px, py);
                ctx.stroke();
            }
            if (state.showQuot) {
                ctx.strokeStyle = P.VAR_QUOT;
                ctx.beginPath();
                ctx.moveTo(ox, oy);
                ctx.lineTo(qx, qy);
                ctx.stroke();
            }

            ctx.fillStyle = rgbaFromHex(P.VAR_R, 0.98);
            ctx.beginPath();
            ctx.arc(sx, sy, 6 * s, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = rgbaFromHex(P.VAR_Z, 0.95);
            ctx.beginPath();
            ctx.arc(ax, ay, 6 * s, 0, Math.PI * 2);
            ctx.fill();
            
            if (state.showSum) {
                ctx.fillStyle = rgbaFromHex(P.VAR_OMEGA, 0.98);
                ctx.beginPath();
                ctx.arc(wx, wy, 6 * s, 0, Math.PI * 2);
                ctx.fill();
            }

            if (state.showDiff) {
                ctx.fillStyle = rgbaFromHex(P.VAR_DIFF, 0.98);
                ctx.beginPath();
                ctx.arc(dx, dy, 6 * s, 0, Math.PI * 2);
                ctx.fill();
            }

            if (state.showProd) {
                ctx.fillStyle = rgbaFromHex(P.VAR_PRODUCT, 0.98);
                ctx.beginPath();
                ctx.arc(px, py, 6 * s, 0, Math.PI * 2);
                ctx.fill();
            }
            if (state.showQuot) {
                ctx.fillStyle = rgbaFromHex(P.VAR_QUOT, 0.98);
                ctx.beginPath();
                ctx.arc(qx, qy, 6 * s, 0, Math.PI * 2);
                ctx.fill();
            }

            ImaginaryNumbersOverlays.updateCnPointLabelOverlays(CC, ax, ay, sx, sy, wx, wy, dx, dy, px, py, qx, qy, s, state);

            ImaginaryNumbersOverlays.updateCnFormulaOverlay(state, dragTarget);
            ImaginaryNumbersOverlays.updateCnAbszOverlay(state);
            ImaginaryNumbersOverlays.updateCnAbsrOverlay(state);
            ImaginaryNumbersOverlays.updateCnAbswOverlay(state);
            ImaginaryNumbersOverlays.updateCnAbspOverlay(state);
            ImaginaryNumbersOverlays.updateCnAbsdOverlay(state);
            ImaginaryNumbersOverlays.updateCnAbsqOverlay(state);
            ImaginaryNumbersOverlays.updateCnMagnitudeOverlay(state);
            ImaginaryNumbersOverlays.updateCnSumOverlay(state);
            ImaginaryNumbersOverlays.updateCnProdOverlay(state);
            ImaginaryNumbersOverlays.updateCnQuotOverlay(state);
            ImaginaryNumbersOverlays.updateCnDiffOverlay(state);
            requestAnimationFrame(() => ImaginaryNumbersOverlays.syncCnFormulaOverlayWidths());
            maybePersistAfterDraw();
        }

        function setupLab() {
            const saved = loadPersistedLab();

            CyberCanvasInstance.init('main-canvas', {}, {
                showLabels: true,
                showTelemetry: false,
            });

            if (saved) {
                state.re = clampToSliders(saved.re);
                state.im = clampToSliders(saved.im);
                if (saved.zMapMode === 'sqrt' || saved.zMapMode === 'square' || saved.zMapMode === 'free') {
                    state.zMapMode = saved.zMapMode;
                }
                if (typeof saved.rRe === 'number' && typeof saved.rIm === 'number') {
                    state.rRe = saved.rRe;
                    state.rIm = saved.rIm;
                }
                if (saved.showSum !== undefined) {
                    state.showSum = !!saved.showSum;
                }
                if (saved.showDiff !== undefined) {
                    state.showDiff = !!saved.showDiff;
                }
                if (saved.showProd !== undefined) {
                    state.showProd = !!saved.showProd;
                }
                if (saved.showQuot !== undefined) {
                    state.showQuot = !!saved.showQuot;
                }
                if (saved.showDashedLines !== undefined) {
                    state.showDashedLines = !!saved.showDashedLines;
                }
                if (saved.showAbsBoxes !== undefined) {
                    state.showAbsBoxes = !!saved.showAbsBoxes;
                }
                CyberCanvasInstance.view.minX = saved.view.minX;
                CyberCanvasInstance.view.maxX = saved.view.maxX;
                CyberCanvasInstance.view.minY = saved.view.minY;
                CyberCanvasInstance.view.maxY = saved.view.maxY;
                CyberCanvasInstance.resize();
            } else {
                CyberCanvasInstance.resetView(Z_SLIDER_MIN, Z_SLIDER_MAX);
            }

            ImaginaryNumbersOverlays.invalidateCnOverlaysMemo();

            CyberCanvasInstance.onResize = draw;
            bindZPointDrag();

            window.addEventListener('beforeunload', persistLabState);
            window.addEventListener('pagehide', persistLabState);

            CyberCanvasInstance.onContextMenu = (e) => {
                CyberUI.showContextMenu(e.clientX, e.clientY, [
                    {
                        label: CyberI18n.get('lgs.view_reset'),
                        onclick: () => {
                            CyberCanvasInstance.resetView(Z_SLIDER_MIN, Z_SLIDER_MAX);
                            CyberCanvasInstance.needsRedraw = true;
                            schedulePersistLabState();
                        },
                    },
                    { divider: true },
                    {
                        label: CyberI18n.get('ui.show_axes'),
                        checked: CyberCanvasInstance.showAxes,
                        onchange: (val) => {
                            CyberCanvasInstance.showAxes = val;
                            CyberCanvasInstance.needsRedraw = true;
                        },
                    },
                    {
                        label: CyberI18n.get('ui.show_grid'),
                        checked: CyberCanvasInstance.showGrid,
                        onchange: (val) => {
                            CyberCanvasInstance.showGrid = val;
                            CyberCanvasInstance.needsRedraw = true;
                        },
                    },
                    {
                        label: CyberI18n.get('ui.show_labels'),
                        checked: CyberCanvasInstance.showLabels,
                        onchange: (val) => {
                            CyberCanvasInstance.showLabels = val;
                            CyberCanvasInstance.needsRedraw = true;
                        },
                    },
                ]);
            };

            ImaginaryNumbersControls.setupParameterCard({
                state,
                fmtNum,
                sqrtProvider: mapRFromZ,
            });

            setupMapModeButtons();

            syncSlidersFromState();
            ImaginaryNumbersOverlays.updateCnFormulaOverlay(state, dragTarget);
            ImaginaryNumbersOverlays.updateCnAbszOverlay(state);
            ImaginaryNumbersOverlays.updateCnAbsrOverlay(state);
            ImaginaryNumbersOverlays.updateCnAbswOverlay(state);
            ImaginaryNumbersOverlays.updateCnAbspOverlay(state);
            ImaginaryNumbersOverlays.updateCnAbsqOverlay(state);
            ImaginaryNumbersOverlays.updateCnAbsdOverlay(state);
            ImaginaryNumbersOverlays.updateCnMagnitudeOverlay(state);
            ImaginaryNumbersOverlays.updateCnSumOverlay(state);
            ImaginaryNumbersOverlays.updateCnProdOverlay(state);
            ImaginaryNumbersOverlays.updateCnQuotOverlay(state);
            ImaginaryNumbersOverlays.updateCnDiffOverlay(state);
            ImaginaryNumbersOverlays.ensureCnFormulaWidthResizeListener();
            requestAnimationFrame(() => ImaginaryNumbersOverlays.syncCnFormulaOverlayWidths());

            CyberCanvasInstance.needsRedraw = true;
        }

        document.fonts.ready.then(setupLab);
    </script>
</body>

</html>
