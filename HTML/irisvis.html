    <style>
        /* --- stage-specific only; shared chrome stays in js/cyber-*.css --- */
        #canvas-container { overflow: hidden; }

        #canvas { cursor: grab; touch-action: none; }
        #canvas.dragging { cursor: grabbing; }

        /* the coach box carries the theorem and the live formula */
        #math-coach-box {
            left: 18px;
            top: 18px;
            bottom: auto;
            width: min(470px, calc(100% - 36px));
            /* same top and left in both states, otherwise the title jumps when the box
               is unfolded (the shared box pads 25px all round) */
            padding: 9px 18px 16px;
        }

        /* the title bar is the only clickable part — clicks on the text still reach
           the canvas underneath, so dragging a vertex behind the box keeps working */
        #math-coach-box .coach-title {
            pointer-events: auto;
            cursor: pointer;
            user-select: none;
            justify-content: space-between;
            font-size: 0.95rem;
            letter-spacing: 1.5px;
        }

        /* the shared coach box carries a glowing dot — not wanted here (page-local
           override, the central rule stays untouched for the other labs) */
        #math-coach-box .coach-title::before { content: none; }

        #coach-caret { font-size: 0.95rem; }

        #coach-caret {
            transition: transform 0.25s ease;
            color: #00d2ff;
        }

        #math-coach-box.folded #coach-caret { transform: rotate(-90deg); }

        /* folded: only a slim title bar is left (the shared box pads 25px all round) */
        #math-coach-box.folded { padding: 9px 18px; }   /* only the bottom differs */
        #math-coach-box.folded .coach-title { margin-bottom: 0 !important; }
        #math-coach-box.folded #coach-content { display: none; }

        .katex { font-size: 1.05em; }

        /* Flatter, uniform buttons — page-local, so the other labs keep the tall
           "ultra" default. The shared rules use !important, hence these do too. */
        #ui-container .cyber-btn {
            min-height: 40px !important;
            padding: 10px 14px !important;
            font-size: 0.7rem !important;
            letter-spacing: 1.6px !important;
            white-space: nowrap;
        }

        /* Tighter vertically — the shared sliders are built for big touch targets;
           this lab has many of them, so the sidebar needs the room (page-local). */
        #ui-container .cyber-control-group { margin-top: 8px !important; }
        #ui-container .control-header { margin-bottom: 0 !important; }
        #ui-container input[type="range"] { padding: 2px 0 !important; min-height: 16px !important; }
        #ui-container .instrument-card { padding-bottom: 8px !important; margin-bottom: 4px !important; }
        #ui-container .cyber-checkbox-wrapper { padding: 0 !important; }
        #ui-container .instrument-title { margin-bottom: 4px !important; }

        /* every card body is one column with ONE gap — no per-element margins,
           so the vertical rhythm cannot drift apart */
        #ui-container .stack { display: flex; flex-direction: column; gap: 4px; }
        #ui-container .stack > .row { display: flex; gap: 4px; }
        #ui-container .stack > .row > .cyber-btn { flex: 1; }
        #ui-container .stack .cyber-control-group { margin-top: 0 !important; }
        #ui-container .stack > .note {
            font-family: 'Outfit', sans-serif;
            font-size: 0.72rem;
            color: rgba(190, 214, 246, 0.62);
            line-height: 1.5;
        }

        .iris-text {
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            line-height: 1.62;
            color: rgba(230, 240, 255, 0.92);
        }

        .iris-text b { color: rgb(245, 194, 66); font-weight: 600; }
        .iris-text .ok { color: rgb(150, 200, 80); }

        /* the formula always stays on ONE line: if it is wider than the box it is
           scaled down as a whole (see fitFormula), never wrapped */
        .iris-formula {
            font-size: 1.1rem;
            color: #9de8ff;
            margin: 10px 0 6px;
            white-space: nowrap;
            overflow: visible;
        }

        .iris-formula > span {
            display: inline-block;
            transform-origin: left center;
        }

        .iris-hint {
            font-family: 'Outfit', sans-serif;
            font-size: 0.8rem;
            color: rgba(190, 214, 246, 0.62);
            line-height: 1.5;
            margin-top: 10px;
        }

        /* Messwerte: label left, value right — flat rows, no tiles */
        #mw { width: 100%; border-collapse: collapse; }

        #mw td {
            padding: 5px 0;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.98rem;
            letter-spacing: 0.02em;
            color: rgba(200, 220, 248, 0.88);
            border-top: 1px solid rgba(120, 160, 220, 0.12);
        }

        #mw tr:first-child td { border-top: none; }

        #mw td.v {
            text-align: right;
            font-size: 0.98rem;
            color: #eaf2ff;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .iris-keys {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.62rem;
            line-height: 1.9;
            color: rgba(190, 214, 246, 0.75);
        }

        .iris-keys b { color: rgb(245, 194, 66); font-weight: 400; }

        /* help overlay (H) — same dark-blue card language as the rest */
        /* A floating window, NOT modal: the lab stays usable while it is open, and it
           can be dragged by its title bar. */
        #grad-win {
            position: fixed;
            z-index: 60;
            display: none;
            width: min(760px, calc(100vw - 40px));
            background: rgb(14, 36, 78);
            border: 1px solid rgba(120, 160, 220, 0.35);
            border-radius: 14px;
            padding: 8px 20px 12px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
        }

        #grad-win.on { display: block; }

        /* invisible grab strip along the top edge — nothing to see, just to hold */
        .grad-grip {
            height: 16px;
            margin: -4px -12px 4px;
            cursor: move;
        }

        /* a quiet little word in the bottom right corner instead of a shouting × */
        #grad-close {
            position: absolute;
            right: 14px;
            bottom: 7px;
            cursor: pointer;
            border: none;
            background: transparent;
            padding: 0;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.52rem;
            letter-spacing: 0.14em;
            text-transform: lowercase;
            color: rgba(190, 214, 246, 0.38);
        }

        #grad-close:hover { color: #00d2ff; }

        #help-overlay {
            position: fixed;
            inset: 0;
            z-index: 60;
            background: rgba(4, 10, 24, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            cursor: pointer;
        }

        .help-card {
            background: rgb(14, 36, 78);
            border: 1px solid rgba(120, 160, 220, 0.35);
            border-radius: 16px;
            padding: 22px 26px;
            max-width: 720px;
            width: 100%;
            max-height: 86vh;
            overflow: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);

        .help-card h2 {

            font-size: 1.1rem;
            color: #00d2ff;
            margin-bottom: 14px;
            letter-spacing: 1.5px;
        }

        .help-card table { width: 100%; border-collapse: collapse; }

        .help-card td {
            padding: 7px 12px 7px 0;
            font-family: 'Outfit', sans-serif;
            font-size: 0.98rem;

            border-top: 1px solid rgba(120, 160, 220, 0.14);

            font-family: 'Orbitron', sans-serif;
            font-size: 0.6rem;
            color: rgba(190, 214, 246, 0.5);
            text-align: right;
