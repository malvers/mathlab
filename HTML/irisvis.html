<body>

    <script src="js/cyber-left-chrome.js"></script>

    <script src="js/i18n-it.js"></script>

    <script src="js/i18n-sw.js"></script>
    <script src="js/i18n-tr.js"></script>

    <script>
        function toggleSidebar() {
            const panel = document.getElementById('side-panel');
            panel.classList.toggle('collapsed');
            if (window.CyberLeftChrome && typeof CyberLeftChrome.publishResolvedScale === 'function') {
                CyberLeftChrome.publishResolvedScale();
            }
            setTimeout(() => {
                window.dispatchEvent(new Event('resize'));
                if (typeof init === 'function') init();
                if (window.CyberLeftChrome && typeof CyberLeftChrome.publishResolvedScale === 'function') {
                    CyberLeftChrome.publishResolvedScale();
                }
            }, 400);
        }

        CyberBranding.init({
            useExternalStyles: true,
            title: "Conway's Iris",
            subtitle: 'Der Kreis mit den sechs Punkten',
        });
        CyberUI.init();

        if (window.CyberLeftChrome && typeof CyberLeftChrome.configure === 'function') {
            CyberLeftChrome.configure({ viewportOnlyZoom: true });
        }

        /* ================================================================
           Conway's circle theorem
           At every vertex both sides are extended beyond that vertex by the
           length of the OPPOSITE side. The six endpoints lie on one circle
           centred at the incentre I with radius sqrt(r² + s²).
           Extending by (opposite side + d) keeps them concyclic — the radius
           becomes sqrt(r² + (s+d)²). Sweeping d draws the "iris".
           ================================================================ */

        const COL = {
            a: 'rgb(176, 36, 24)',      // side a = BC   (Υ red)
            b: 'rgb(121, 158, 49)',     // side b = CA   (φ green)
            c: 'rgb(245, 194, 66)',     // side c = AB   (λ orange)
            circle: '#00d2ff',
            ink: 'rgba(230, 240, 255, 0.92)',
            dim: 'rgba(160, 190, 230, 0.45)'
        };

        /* the wiper arcs are named after the vertex they pivot around */
        const VCOL = { A: 'rgb(245, 194, 66)', B: 'rgb(176, 36, 24)', C: 'rgb(121, 158, 49)' };

        const state = {
            d: 0,               // extra extension length (world units)
            showTriangle: true,
            showLines: true,     // the extended side lines ("whiskers")
            showPoints: true,
            showCircle: true,
            showIncircle: true,
            showProof: false,    // perpendiculars from I to the three lines
            showLabels: true,
            iris: true,          // family of circles for d in [dMin … dMax]
            rings: 26,
            animate: false,
            wiper: true,         // the six wiper arcs (the closed "iris" curve)
            wiperFill: true
        };

        let buildT = 1;          // 0 … 1: how much of the wiper curve is drawn
        let building = false;

        /* triangle vertices in world coordinates */
        let A = { x: -170, y: 110 }, B = { x: 190, y: 140 }, C = { x: -20, y: -160 };
        let view = { s: 1, ox: 0, oy: 0 };     // world -> screen
        let drag = null;                        // 'A' | 'B' | 'C' | 'pan'
        let animPhase = 0;
        let raf = null;

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        const $ = (id) => document.getElementById(id);
        const de = (x, n) => (Number.isFinite(x) ? Number(x).toFixed(n).replace('.', ',') : '—');

        /* ---------- vector helpers ---------- */
        const sub = (p, q) => ({ x: p.x - q.x, y: p.y - q.y });
        const add = (p, q) => ({ x: p.x + q.x, y: p.y + q.y });
        const mul = (p, k) => ({ x: p.x * k, y: p.y * k });
        const len = (p) => Math.hypot(p.x, p.y);
        const norm = (p) => { const l = len(p) || 1; return { x: p.x / l, y: p.y / l }; };
        const dist = (p, q) => Math.hypot(p.x - q.x, p.y - q.y);

        /* ---------- the construction ---------- */
        function geometry(d) {
            const a = dist(B, C), b = dist(C, A), c = dist(A, B);
            const per = a + b + c;
            const s = per / 2;
            const area = Math.abs((B.x - A.x) * (C.y - A.y) - (C.x - A.x) * (B.y - A.y)) / 2;
            const r = area / s;
            /* incentre: the side lengths are the barycentric weights */
            const I = {
                x: (a * A.x + b * B.x + c * C.x) / per,
                y: (a * A.y + b * B.y + c * C.y) / per
            };

            /* at A extend by a+d, at B by b+d, at C by c+d */
            const eA = a + d, eB = b + d, eC = c + d;
            const uAB = norm(sub(A, B));    // from B towards A
            const uAC = norm(sub(A, C));
            const uBA = norm(sub(B, A));
            const uBC = norm(sub(B, C));
            const uCA = norm(sub(C, A));
            const uCB = norm(sub(C, B));

            /* points named by the line they sit on and the vertex they passed */
            const P = {
                cA: add(A, mul(uAB, eA)),   // line AB, beyond A
                cB: add(B, mul(uBA, eB)),   // line AB, beyond B
                aB: add(B, mul(uBC, eB)),   // line BC, beyond B
                aC: add(C, mul(uCB, eC)),   // line BC, beyond C
                bC: add(C, mul(uCA, eC)),   // line CA, beyond C
                bA: add(A, mul(uAC, eA))    // line CA, beyond A
            };

            const R = Math.hypot(r, s + d);
            /* honest check: how far off the circle are the six points really? */
            let err = 0;
            for (const k in P) err = Math.max(err, Math.abs(dist(P[k], I) - R));

            return { a, b, c, s, r, area, I, P, R, err, d };
        }

        /* The six wiper arcs, in the order in which they close the curve.
           Big arc: pivot at a vertex, radius = adjacent side + extension, spans the
           interior angle. Small arc: same pivot, radius = the extension itself,
           spans the exterior angle. Big and small at the same pivot always add up to
           2(s+d) — that is why the closed curve has CONSTANT WIDTH. */
        function arcsOf(g) {
            const eA = g.a + g.d, eB = g.b + g.d, eC = g.c + g.d;
            const P = g.P;
            return [
                { k: 'C', r: g.a + eB, from: P.aB, to: P.bA, big: true },
                { k: 'A', r: eA, from: P.bA, to: P.cA, big: false },
                { k: 'B', r: g.c + eA, from: P.cA, to: P.aC, big: true },
                { k: 'C', r: eC, from: P.aC, to: P.bC, big: false },
                { k: 'A', r: g.b + eC, from: P.bC, to: P.cB, big: true },
                { k: 'B', r: eB, from: P.cB, to: P.aB, big: false }
            ];
        }

        const vertexOf = (k) => (k === 'A' ? A : k === 'B' ? B : C);

        /* signed minor-arc sweep from `from` to `to` around the pivot */
        function sweep(arc) {
            const O = vertexOf(arc.k);
            const a1 = Math.atan2(arc.from.y - O.y, arc.from.x - O.x);
            const a2 = Math.atan2(arc.to.y - O.y, arc.to.x - O.x);
            let dA = a2 - a1;
            while (dA > Math.PI) dA -= 2 * Math.PI;
            while (dA < -Math.PI) dA += 2 * Math.PI;
            return { O: O, a1: a1, dA: dA };
        }

        /* sample the closed curve — used to MEASURE the width, never to draw it */
        function curvePoints(g, per) {
            const pts = [];
            arcsOf(g).forEach((arc) => {
                if (arc.r <= 0) return;
                const w = sweep(arc);
                for (let i = 0; i < per; i++) {
                    const t = w.a1 + w.dA * (i / per);
                    pts.push({ x: w.O.x + Math.cos(t) * arc.r, y: w.O.y + Math.sin(t) * arc.r });
                }
            });
            return pts;
        }

        /* smallest and largest width over 180 directions — constant width shows up
           as min == max (up to rounding) */
        function widthRange(g) {
            const pts = curvePoints(g, 40);
            if (!pts.length) return { min: NaN, max: NaN };
            let lo = Infinity, hi = -Infinity;
            for (let i = 0; i < 180; i++) {
                const th = Math.PI * i / 180, cx = Math.cos(th), sy = Math.sin(th);
                let mn = Infinity, mx = -Infinity;
                for (const p of pts) {
                    const v = p.x * cx + p.y * sy;
                    if (v < mn) mn = v;
                    if (v > mx) mx = v;
                }
                const w = mx - mn;
                if (w < lo) lo = w;
                if (w > hi) hi = w;
            }
            return { min: lo, max: hi };
        }

        /* ---------- view: fit everything on screen ---------- */
        function fit(g) {
            const rect = container.getBoundingClientRect();
            const W = Math.max(1, rect.width), H = Math.max(1, rect.height);
            const dMax = state.iris ? Math.max(state.d, irisMax()) : state.d;
            let Rmax = Math.hypot(g.r, g.s + Math.max(0, dMax));
            if (state.wiper) {
                /* the wiper curve reaches further than the circle through the six points */
                arcsOf(g).forEach((arc) => {
                    if (arc.r <= 0) return;
                    Rmax = Math.max(Rmax, dist(vertexOf(arc.k), g.I) + arc.r);
                });
            }
            const pad = 48;
            const s = Math.min((W - 2 * pad) / (2 * Rmax), (H - 2 * pad) / (2 * Rmax));
            view.s = Math.max(0.02, s);
            view.ox = W / 2 - g.I.x * view.s;
            view.oy = H / 2 - g.I.y * view.s;
        }

        const toScreen = (p) => ({ x: p.x * view.s + view.ox, y: p.y * view.s + view.oy });
        const toWorld = (p) => ({ x: (p.x - view.ox) / view.s, y: (p.y - view.oy) / view.s });

        /* largest extension shown by the iris fan */
        function irisMax() {
            const g0 = geometry(0);
            return g0.s * 1.1;
        }

        /* ---------- drawing ---------- */
        function line(p, q, col, w, dash) {
            const P = toScreen(p), Q = toScreen(q);
            ctx.save();
            ctx.strokeStyle = col;
            ctx.lineWidth = w;
            if (dash) ctx.setLineDash(dash);
            ctx.beginPath();
            ctx.moveTo(P.x, P.y);
            ctx.lineTo(Q.x, Q.y);
            ctx.stroke();
            ctx.restore();
        }

        function circle(cP, rWorld, col, w, dash) {
            const S = toScreen(cP);
            ctx.save();
            ctx.strokeStyle = col;
            ctx.lineWidth = w;
            if (dash) ctx.setLineDash(dash);
            ctx.beginPath();
            ctx.arc(S.x, S.y, rWorld * view.s, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }

        function dot(p, col, rPix, label) {
            const S = toScreen(p);
            ctx.save();
            ctx.fillStyle = col;
            ctx.beginPath();
            ctx.arc(S.x, S.y, rPix, 0, Math.PI * 2);
            ctx.fill();
            if (label && state.showLabels) {
                ctx.fillStyle = COL.ink;
                ctx.font = '13px Orbitron, sans-serif';
                ctx.fillText(label, S.x + rPix + 5, S.y - rPix - 3);
            }
            ctx.restore();
        }

        /* blue -> red like the Java ColorSpectrum, but on our palette */
        function spectrum(t) {
            const c1 = [0, 210, 255], c2 = [245, 194, 66];
            const v = Math.max(0, Math.min(1, t));
            return 'rgba(' + Math.round(c1[0] + v * (c2[0] - c1[0])) + ',' +
                Math.round(c1[1] + v * (c2[1] - c1[1])) + ',' +
                Math.round(c1[2] + v * (c2[2] - c1[2])) + ',0.5)';
        }

        function render() {
            const dpr = window.devicePixelRatio || 1;
            const rect = container.getBoundingClientRect();
            const W = Math.max(1, rect.width), H = Math.max(1, rect.height);
            canvas.width = Math.floor(W * dpr);
            canvas.height = Math.floor(H * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, W, H);

            const g = geometry(state.d);

            /* the iris: one circle per extension step, all centred at I */
            if (state.iris) {
                const dMax = irisMax();
                for (let i = 0; i < state.rings; i++) {
                    const t = i / (state.rings - 1);
                    const dd = t * dMax;
                    circle(g.I, Math.hypot(g.r, g.s + dd), spectrum(t), 1);
                }
            }

            /* the wiper curve: six arcs, drawn up to buildT so it can build itself up */
            if (state.wiper) drawWiper(g);

            /* the three extended side lines — each carries two of the six points */
            if (state.showLines) {
                line(g.P.cA, g.P.cB, COL.c, 1.6);
                line(g.P.aB, g.P.aC, COL.a, 1.6);
                line(g.P.bC, g.P.bA, COL.b, 1.6);
            }

            /* proof: the distance from I to each line is the inradius r, and each
               line is cut by the circle in a chord of half-length s + d */
            if (state.showProof) {
                foot(g, A, B, COL.c);
                foot(g, B, C, COL.a);
                foot(g, C, A, COL.b);
            }

            if (state.showIncircle) {
                circle(g.I, g.r, COL.dim, 1.4, [5, 5]);
                dot(g.I, '#9de8ff', 4, state.showLabels ? 'I' : '');
            }

            if (state.showCircle) circle(g.I, g.R, COL.circle, 2.2);

            if (state.showTriangle) {
                line(A, B, COL.c, 2.4);
                line(B, C, COL.a, 2.4);
                line(C, A, COL.b, 2.4);
            }

            if (state.showPoints) {
                dot(g.P.cA, COL.c, 5); dot(g.P.cB, COL.c, 5);
                dot(g.P.aB, COL.a, 5); dot(g.P.aC, COL.a, 5);
                dot(g.P.bC, COL.b, 5); dot(g.P.bA, COL.b, 5);
            }

            /* the draggable vertices last, so they stay on top */
            dot(A, COL.ink, 7, 'A');
            dot(B, COL.ink, 7, 'B');
            dot(C, COL.ink, 7, 'C');

            updateReadout(g);
        }

        /* The wiper curve. buildT < 1 draws only the first part and shows the wiper
           arm at the sweeping end — that is the build-up. */
        function drawWiper(g) {
            const arcs = arcsOf(g).filter((x) => x.r > 0);
            if (!arcs.length) return;
            const segs = arcs.map((arc) => {
                const w = sweep(arc);
                return { arc: arc, w: w, L: Math.abs(w.dA) * arc.r };
            });
            const total = segs.reduce((s0, x) => s0 + x.L, 0);
            let budget = total * Math.max(0, Math.min(1, buildT));

            /* soft fill so the shape reads as one body */
            if (state.wiperFill && buildT >= 1) {
                ctx.save();
                ctx.beginPath();
                segs.forEach((sg, i) => {
                    const S = toScreen(sg.w.O);
                    ctx.arc(S.x, S.y, sg.arc.r * view.s, sg.w.a1, sg.w.a1 + sg.w.dA, sg.w.dA < 0);
                });
                ctx.closePath();
                ctx.fillStyle = 'rgba(0, 210, 255, 0.07)';
                ctx.fill();
                ctx.restore();
            }

            let armDrawn = false;
            for (const sg of segs) {
                if (budget <= 0) break;
                const frac = Math.min(1, budget / sg.L);
                budget -= sg.L;
                const S = toScreen(sg.w.O);
                ctx.save();
                ctx.strokeStyle = VCOL[sg.arc.k];
                ctx.lineWidth = sg.arc.big ? 2.6 : 2.6;
                ctx.beginPath();
                ctx.arc(S.x, S.y, sg.arc.r * view.s, sg.w.a1, sg.w.a1 + sg.w.dA * frac, sg.w.dA < 0);
                ctx.stroke();
                ctx.restore();
                /* the wiper arm itself, at the moving end */
                if (frac < 1 && !armDrawn) {
                    armDrawn = true;
                    const t = sg.w.a1 + sg.w.dA * frac;
                    const tip = { x: sg.w.O.x + Math.cos(t) * sg.arc.r, y: sg.w.O.y + Math.sin(t) * sg.arc.r };
                    line(sg.w.O, tip, VCOL[sg.arc.k], 1.6, [6, 4]);
                    dot(tip, VCOL[sg.arc.k], 5);
                }
            }
        }

        /* perpendicular from the incentre to a side line + the right-angle mark */
        function foot(g, P1, P2, col) {
            const u = norm(sub(P2, P1));
            const t = (g.I.x - P1.x) * u.x + (g.I.y - P1.y) * u.y;
            const F = add(P1, mul(u, t));
            line(g.I, F, col, 1.2, [4, 4]);
            const n = norm(sub(g.I, F));
            const k = 9 / view.s;
            const p1 = add(F, mul(u, k)), p2 = add(add(F, mul(u, k)), mul(n, k)), p3 = add(F, mul(n, k));
            line(p1, p2, col, 1);
            line(p2, p3, col, 1);
        }

        /* ---------- readouts ---------- */
        function updateReadout(g) {
            CyberUI.updateStatsGrid('stats', [
                { value: de(g.a, 1) }, { value: de(g.b, 1) }, { value: de(g.c, 1) },
                { value: de(g.s, 1) }, { value: de(g.r, 1) }, { value: de(g.R, 1) },
                { value: state.wiper ? de(widthRange(g).min, 1) : '—' }
            ]);
            const coach = $('coach-content');
            if (!coach) return;
            const exact = g.err < 1e-6;
            coach.innerHTML =
                '<div class="iris-text">' +
                'Verlängere an jeder Ecke <b>beide</b> Seiten über die Ecke hinaus um die Länge der ' +
                '<b>gegenüberliegenden</b> Seite. Die sechs Endpunkte liegen auf <b>einem</b> Kreis — ' +
                'sein Mittelpunkt ist der Inkreismittelpunkt <b>I</b>.' +
                '<div class="iris-formula">R = &radic;(r² + (s + d)²) = &radic;(' + de(g.r, 1) + '² + ' +
                de(g.s + g.d, 1) + '²) = ' + de(g.R, 1) + '</div>' +
                'mit s = ' + de(g.s, 1) + ' (halber Umfang), r = ' + de(g.r, 1) + ' (Inkreisradius), ' +
                'd = ' + de(g.d, 1) + ' (zusätzliche Verlängerung).<br>' +
                'Abstand der sechs Punkte vom Kreis: <span class="' + (exact ? 'ok' : '') + '">' +
                g.err.toExponential(1).replace('.', ',') + '</span>' + (exact ? ' — also exakt.' : '') +
                (state.wiper ? '<br>Die Wischerkurve aus den sechs Bögen hat die konstante Breite <b>' +
                    de(widthRange(g).min, 1) + '</b> = 2·(s+d).' : '') +
                '<div class="iris-hint">Ecken ziehen. Jede der drei Geraden schneidet aus dem Kreis eine ' +
                'Sehne der Länge 2·(s+d) heraus und hat vom Mittelpunkt den Abstand r — gleich lange Sehnen ' +
                'sind gleich weit vom Mittelpunkt entfernt, deshalb <i>ein</i> Kreis.</div>' +
                '</div>';
        }

        /* ---------- interaction ---------- */
        function hit(pos) {
            const P = { A: A, B: B, C: C };
            for (const k in P) {
                const S = toScreen(P[k]);
                if (Math.hypot(S.x - pos.x, S.y - pos.y) < 18) return k;
            }
            return null;
        }

        function localPos(e) {
            const rect = canvas.getBoundingClientRect();
            const t = e.touches ? e.touches[0] : e;
            return { x: t.clientX - rect.left, y: t.clientY - rect.top };
        }

        function onDown(e) {
            const pos = localPos(e);
            const k = hit(pos);
            if (k) {
                drag = k;
                canvas.classList.add('dragging');
                e.preventDefault();
            }
        }

        function onMove(e) {
            if (!drag) return;
            const w = toWorld(localPos(e));
            if (drag === 'A') A = w; else if (drag === 'B') B = w; else C = w;
            e.preventDefault();
            render();
        }

        function onUp() {
            if (!drag) return;
            drag = null;
            canvas.classList.remove('dragging');
            render();
        }

        canvas.addEventListener('mousedown', onDown);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
        canvas.addEventListener('touchstart', onDown, { passive: false });
        canvas.addEventListener('touchmove', onMove, { passive: false });
        window.addEventListener('touchend', onUp);

        /* keys taken over from the Java original */
        window.addEventListener('keydown', (e) => {
            if (e.target && /input|textarea/i.test(e.target.tagName)) return;
            if (e.metaKey || e.ctrlKey || e.altKey) return;      // leave Cmd-C & Co. alone
            const k = e.key.toLowerCase();
            if (k === 't') { state.showTriangle = !state.showTriangle; sync(); }
            else if (k === 'e') { state.showLines = !state.showLines; sync(); }
            else if (k === 'c') { state.showCircle = !state.showCircle; sync(); }
            else if (k === 'i') { state.showIncircle = !state.showIncircle; sync(); }
            else if (k === 'a') { state.showLabels = !state.showLabels; sync(); }
            else if (k === 'b') { state.showProof = !state.showProof; sync(); }
            else if (k === 'p') { state.iris = !state.iris; sync(); }
            else if (k === 'w') { state.wiper = !state.wiper; sync(); }
            else if (k === 's') { buildUp(); }
            else if (k === '0') { reset(); }
            else if (k === ' ') { state.animate = !state.animate; loop(); e.preventDefault(); }
        });

        /* checkboxes are built by CyberUI, so re-render and keep them in step */
        function sync() { fitAndRender(); }

        function fitAndRender() {
            fit(geometry(state.d));
            render();
        }

        function reset() {
            A = { x: -170, y: 110 }; B = { x: 190, y: 140 }; C = { x: -20, y: -160 };
            state.d = 0;
            fitAndRender();
        }

        function randomTriangle() {
            const rnd = (a, b) => a + Math.random() * (b - a);
            const R0 = 190;
            const ang = [rnd(0, 2), rnd(2, 4), rnd(4, 6)];
            const pts = ang.map((t) => ({ x: Math.cos(t) * rnd(R0 * 0.6, R0), y: Math.sin(t) * rnd(R0 * 0.6, R0) }));
            A = pts[0]; B = pts[1]; C = pts[2];
            fitAndRender();
        }

        function equilateral() {
            const R0 = 180;
            A = { x: Math.cos(-Math.PI / 2) * R0, y: Math.sin(-Math.PI / 2) * R0 };
            B = { x: Math.cos(Math.PI / 6) * R0, y: Math.sin(Math.PI / 6) * R0 };
            C = { x: Math.cos(5 * Math.PI / 6) * R0, y: Math.sin(5 * Math.PI / 6) * R0 };
            fitAndRender();
        }

        /* One driver for both animations: the breathing pupil (d) and the build-up
           of the wiper curve. */
        function tick() {
            if (state.animate) {
                animPhase += 0.012;
                const g0 = geometry(0);
                state.d = (1 - Math.cos(animPhase)) / 2 * g0.s * 0.9;
            }
            if (building) {
                buildT += 0.008;
                if (buildT >= 1) { buildT = 1; building = false; }
            }
            if (state.animate) fitAndRender(); else render();
            raf = (state.animate || building) ? requestAnimationFrame(tick) : null;
        }

        function loop() {
            if (raf) return;
            if (state.animate || building) raf = requestAnimationFrame(tick);
        }

        /* let the curve draw itself, like the wiper sweeping across the screen */
        function buildUp() {
            state.wiper = true;
            buildT = 0;
            building = true;
            fit(geometry(state.d));
            loop();
        }

        /* ---------- sidebar ---------- */
        function setupUI() {
            CyberUI.createCard('ui-container', 'Dreieck', `
                <div style="display:flex; gap:8px; flex-wrap:wrap">
                    <button class="cyber-btn" id="btn-rnd" style="flex:1">Zufällig</button>
                    <button class="cyber-btn" id="btn-eq" style="flex:1">Gleichseitig</button>
                </div>
                <button class="cyber-btn" id="btn-reset" style="width:100%; margin-top:8px; border-color:#ffcc00; color:#ffcc00">Zurücksetzen</button>
                <div style="margin-top:10px; font-family:'Outfit'; font-size:0.72rem; color:rgba(190,214,246,0.62); line-height:1.5">
                    Die Ecken A, B, C lassen sich direkt auf der Bühne ziehen.
                </div>
            `, '#00d2ff');

            CyberUI.createCard('ui-container', 'Konstruktion', `
                <div id="sl-d"></div>
                <div id="chk-box" style="display:flex; flex-direction:column; gap:4px; margin-top:6px"></div>
            `, 'rgb(121,158,49)');

            CyberUI.createCard('ui-container', 'Wischerkurve', `
                <div id="chk-wiper" style="display:flex; flex-direction:column; gap:4px"></div>
                <button class="cyber-btn" id="btn-build" style="width:100%; margin-top:8px">Aufbauen</button>
                <div style="margin-top:10px; font-family:'Outfit'; font-size:0.72rem; color:rgba(190,214,246,0.62); line-height:1.5">
                    Sechs Bögen, je um eine Ecke gedreht wie ein Scheibenwischer: großer Bogen +
                    kleiner Bogen um dieselbe Ecke ergeben immer 2·(s+d) — die Kurve hat
                    <b style="color:rgb(245,194,66)">konstante Breite</b>.
                </div>
            `, 'rgb(155,130,225)');

            CyberUI.createCard('ui-container', 'Iris', `
                <div id="chk-iris" style="display:flex; flex-direction:column; gap:4px"></div>
                <div id="sl-rings" style="margin-top:6px"></div>
                <button class="cyber-btn" id="btn-anim" style="width:100%; margin-top:8px; border-color:rgb(121,158,49); color:rgb(160,200,90)">Pupille atmen lassen</button>
            `, 'rgb(245,194,66)');

            CyberUI.createCard('ui-container', 'Messwerte', '<div id="stats"></div>', '#00d2ff');
            CyberUI.createStatsGrid('stats', [
                { label: 'a = |BC|', value: '—', color: COL.a },
                { label: 'b = |CA|', value: '—', color: COL.b },
                { label: 'c = |AB|', value: '—', color: COL.c },
                { label: 's (halber Umfang)', value: '—', color: '#9de8ff' },
                { label: 'r (Inkreis)', value: '—', color: '#9de8ff' },
                { label: 'R (Conway)', value: '—', color: COL.circle },
                { label: 'Breite der Kurve', value: '—', color: '#9de8ff' }
            ]);

            CyberUI.createCard('ui-container', 'Tasten', `
                <div class="iris-keys">
                    <b>T</b> Dreieck &middot; <b>E</b> Verlängerungen &middot; <b>C</b> Conway-Kreis<br>
                    <b>I</b> Inkreis &middot; <b>B</b> Beweis &middot; <b>A</b> Beschriftung<br>
                    <b>W</b> Wischerkurve &middot; <b>S</b> Aufbauen<br>
                    <b>P</b> Iris &middot; <b>Leertaste</b> Animation &middot; <b>0</b> Zurücksetzen
                </div>
            `, 'rgb(155,130,225)', { collapsible: true, collapsed: true });

            CyberUI.createSlider('sl-d', 'Verlängerung d', -40, 400, state.d, 1, (v) => {
                state.d = v;
                fitAndRender();
            }, 'var(--neon-blue)', (v) => de(v, 0));

            CyberUI.createSlider('sl-rings', 'Ringe', 4, 60, state.rings, 1, (v) => {
                state.rings = Math.round(v);
                render();
            }, 'rgb(245,194,66)', (v) => String(Math.round(v)));

            const boxes = [
                ['chk-box', 'Dreieck', 'showTriangle'],
                ['chk-box', 'Verlängerungen', 'showLines'],
                ['chk-box', 'Sechs Punkte', 'showPoints'],
                ['chk-box', 'Conway-Kreis', 'showCircle'],
                ['chk-box', 'Inkreis + I', 'showIncircle'],
                ['chk-box', 'Beweis: Abstand r', 'showProof'],
                ['chk-box', 'Beschriftung', 'showLabels'],
                ['chk-wiper', 'Wischerkurve', 'wiper'],
                ['chk-wiper', 'Fläche füllen', 'wiperFill'],
                ['chk-iris', 'Kreisschar zeigen', 'iris']
            ];
            boxes.forEach(([box, label, key]) => {
                CyberUI.createCheckbox(box, label, state[key], (on) => {
                    state[key] = on;
                    fitAndRender();
                });
            });

            $('btn-build').addEventListener('click', buildUp);
            $('btn-rnd').addEventListener('click', randomTriangle);
            $('btn-eq').addEventListener('click', equilateral);
            $('btn-reset').addEventListener('click', reset);
            $('btn-anim').addEventListener('click', () => {
                state.animate = !state.animate;
                $('btn-anim').textContent = state.animate ? 'Anhalten' : 'Pupille atmen lassen';
                loop();
            });
        }

        function init() { fitAndRender(); }

        $('coach-title-slot').textContent = "Conway's Circle Theorem";
        setupUI();
        window.addEventListener('resize', init);
        document.fonts.ready.then(init);
        init();
        $('math-coach-box').classList.add('visible');
        buildUp();      // draw itself once on arrival
    </script>
</body>

</html>
