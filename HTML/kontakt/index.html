<!DOCTYPE html>
<html lang="de">

<!--
    Kontakt - Doc's side, a small app of its own with the red telephone (Doc, 29.10.2026: VGP was far
    too much for this). The pupils write on svp/sprechstunde.html (the red phone on meinplan.html); here
    Doc reads and answers. Installable (manifest.json, sw.js in this folder). The bell sends the push to
    this device: its subscription goes to chat_config (Doc's account only), and the push function
    (supabase/functions/push-on-message) seals "Nachricht vom Stundenplan" for it.

    Doc's SVP account reads the tables (RLS: his uid only); pupils' messages open with his private key
    (svp-crypto.js, the passphrase of the talk names), replies are sealed for the pupil's device and,
    as Doc's own copy, for his key. Tables: supabase/migrations/20261029_chat.sql.
-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kontakt</title>
    <meta name="robots" content="noindex">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#050b18">
    <link rel="stylesheet" href="../svp/sprechstunde.css?v=20261029-4">
</head>

<body class="sp-page">
    <div class="sp-window">
    <header class="sp-head">
        <div class="sp-wrap">
            <button class="sp-back" id="back" type="button" aria-label="Zurück zur Liste" title="Zurück zur Liste" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <span id="phone"></span>
            <div class="sp-title">
                <h1 id="title">Kontakt</h1>
                <p id="sub">&nbsp;</p>
            </div>
            <button class="sp-bell" id="bell" type="button" aria-label="Benachrichtigungen auf dieses Gerät" title="Benachrichtigungen auf dieses Gerät" hidden>
                <!-- Lucide "bell" (ISC licence) -->
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"></path><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"></path></svg>
            </button>
            <div class="sp-tools" id="tools" hidden>
                <button class="sp-btn" id="block" type="button">Sperren</button>
                <button class="sp-btn danger" id="del" type="button">Löschen</button>
            </div>
        </div>
    </header>

    <main class="sp-main">
        <div class="sp-wrap">
            <p class="sp-note" id="note" hidden></p>
            <ul class="sp-list" id="list"></ul>
            <div class="sp-msgs" id="msgs" hidden aria-live="polite"></div>
        </div>
    </main>

    <form class="sp-compose" id="compose" autocomplete="off" hidden>
        <div class="sp-wrap">
            <label class="sr" for="text">Antwort</label>
            <textarea id="text" rows="1" placeholder="Antwort …" enterkeyhint="send"></textarea>
            <button class="sp-send" id="send" type="submit" aria-label="Senden" title="Senden" disabled></button>
        </div>
    </form>
    </div>

    <script src="../svp/svp-auth.js"></script>
    <script src="../svp/svp-crypto.js?v=20261029-2"></script>
    <script src="../svp/sprechstunde-core.js?v=20261029-2"></script>
    <script>
        (function () {
            const S = window.Sprechstunde, A = window.svpAuth, C = window.svpCrypto;
            const DOC_UID = '2889073e-cbb8-4ca1-ad48-5234abe40585';   // same uid as in the RLS policies
            const $ = id => document.getElementById(id);

            // VGP's VAPID pair: the public half is safe to ship, the private half is a secret of the push function
            const VAPID_PUBLIC = 'BG84swdCjSLS8IzPrfbyokHl-gjdx5MEahdLbZDbDgxzd9x7_BV6iqrVVveWfw4bPwV5Rach0K2_RfzL5RCOvW8';
            const canPush = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
            // own worker, scope /kontakt/: the app installs, and its push subscription stays apart from VGP's
            const swReady = 'serviceWorker' in navigator
                ? navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready) : Promise.reject(new Error('no service worker'));
            swReady.catch(() => {});
            const b64urlBytes = b64 => Uint8Array.from(atob((b64 + '='.repeat((4 - b64.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));

            $('phone').innerHTML = S.PHONE;
            $('send').innerHTML = S.SEND_SVG;

            function note(text, warn) {
                const n = $('note');
                n.hidden = !text;
                n.textContent = text || '';
                n.classList.toggle('warn', !!warn);
            }

            function uid() {
                try {
                    const p = A.session.access_token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
                    return JSON.parse(atob(p)).sub;
                } catch (e) { return ''; }
            }

            async function api(path, opts) {
                const res = await A.api(path, opts);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.status === 204 ? null : res.json().catch(() => null);
            }

            let threads = [], metas = [], open = null;     // open = the thread on screen, null = the list

            /* --- the list ---------------------------------------------------------------------------- */

            async function loadList() {
                threads = await api('chat_thread?select=id,nr,pub,created_at,last_at,doc_seen_at,blocked&order=last_at.desc');
                metas = await api('chat_msg?select=thread,from_doc,created_at&order=id');
                if (!open) paintList();
            }

            function unreadOf(t) {
                return metas.filter(m => m.thread === t.id && !m.from_doc && new Date(m.created_at) > new Date(t.doc_seen_at)).length;
            }

            function paintList() {
                const ul = $('list');
                ul.innerHTML = '';
                const total = threads.reduce((s, t) => s + unreadOf(t), 0);
                $('title').textContent = 'Kontakt';
                $('sub').textContent = threads.length
                    ? threads.length + (threads.length === 1 ? ' Chat' : ' Chats') + (total ? ' · ' + total + ' neu' : '')
                    : 'Noch niemand hat geschrieben.';
                for (const t of threads) {
                    const li = document.createElement('li');
                    const b = document.createElement('button');
                    b.type = 'button';
                    b.className = 'sp-item' + (t.blocked ? ' blocked' : '');
                    const n = metas.filter(m => m.thread === t.id).length;
                    b.innerHTML = '<div class="sp-item-main"><div class="sp-item-name"></div><div class="sp-item-sub"></div></div>';
                    b.querySelector('.sp-item-name').textContent = 'Chat ' + t.nr;
                    b.querySelector('.sp-item-sub').textContent = S.fmtTime(t.last_at) + ' · ' + n + (n === 1 ? ' Nachricht' : ' Nachrichten')
                        + (t.blocked ? ' · gesperrt' : '');
                    const u = unreadOf(t);
                    if (u) {
                        const badge = document.createElement('span');
                        badge.className = 'sp-badge';
                        badge.textContent = u > 99 ? '99+' : u;
                        b.appendChild(badge);
                    }
                    b.addEventListener('click', () => openThread(t.id));
                    li.appendChild(b);
                    ul.appendChild(li);
                }
            }

            /* --- one chat ---------------------------------------------------------------------------- */

            async function openThread(id) {
                open = threads.find(t => t.id === id) || null;
                if (!open) return showList();
                $('list').hidden = true;
                $('msgs').hidden = false;
                $('compose').hidden = false;
                $('tools').hidden = false;
                $('back').hidden = false;
                $('bell').hidden = true;
                $('msgs').dataset.painted = '';
                paintTools();
                await loadThread();
                $('text').focus();
            }

            async function loadThread() {
                if (!open) return;
                const rows = await api('chat_msg?thread=eq.' + open.id + '&select=id,from_doc,body_enc,copy_enc,created_at&order=id');
                const out = [];
                for (const r of rows) {
                    let text;
                    try { text = await C.open(r.from_doc ? r.copy_enc : r.body_enc); } catch (e) { text = '🔒 (nicht lesbar)'; }
                    out.push({ id: r.id, mine: r.from_doc, text: text, at: r.created_at });
                }
                S.paint($('msgs'), out, 'Leer.');
                $('title').textContent = 'Chat ' + open.nr;
                $('sub').textContent = 'anonym · seit ' + S.fmtTime(open.created_at) + (open.blocked ? ' · gesperrt' : '');
                // seen up to the pupil's last message (the trigger does it for replies; reading alone does it
                // here) - its server time, not this phone's clock, so a clock running late cannot keep it unread
                const last = rows.filter(r => !r.from_doc).pop();
                if (last && new Date(last.created_at) > new Date(open.doc_seen_at)) {
                    await api('chat_thread?id=eq.' + open.id, { method: 'PATCH', headers: { Prefer: 'return=minimal' },
                        body: JSON.stringify({ doc_seen_at: last.created_at }) });
                    open.doc_seen_at = last.created_at;
                }
            }

            function paintTools() {
                $('block').textContent = open.blocked ? 'Entsperren' : 'Sperren';
                const del = $('del');
                delete del.dataset.armed;
                del.classList.remove('armed');
                del.textContent = 'Löschen';
            }

            function showList() {
                open = null;
                $('list').hidden = false;
                $('msgs').hidden = true;
                $('compose').hidden = true;
                $('tools').hidden = true;
                $('back').hidden = true;
                $('bell').hidden = !canPush;
                loadList().catch(e => note('Liste nicht ladbar: ' + e.message, true));
            }

            async function reply() {
                const ta = $('text');
                const text = ta.value.trim();
                if (!open || !text || text.length > S.MAX_LEN) return;
                $('send').disabled = true;
                try {
                    const body = await C.sealFor(open.pub, text);     // for the pupil's device
                    const copy = await C.seal(text);                  // Doc's own copy
                    await api('chat_msg', { method: 'POST', headers: { Prefer: 'return=minimal' },
                        body: JSON.stringify({ thread: open.id, from_doc: true, body_enc: body, copy_enc: copy }) });
                    ta.value = '';
                    fit();
                    await loadThread();
                } catch (e) {
                    note('Nicht gesendet: ' + e.message, true);
                }
                sync();
            }

            $('block').addEventListener('click', async () => {
                if (!open) return;
                await api('chat_thread?id=eq.' + open.id, { method: 'PATCH', headers: { Prefer: 'return=minimal' },
                    body: JSON.stringify({ blocked: !open.blocked }) }).catch(e => note(e.message, true));
                open.blocked = !open.blocked;
                paintTools();
                loadThread();
            });

            /* no native confirm: a second tap within 3 s deletes (same as the timetable versions) */
            $('del').addEventListener('click', async () => {
                const del = $('del');
                if (!del.dataset.armed) {
                    del.dataset.armed = '1';
                    del.classList.add('armed');
                    del.textContent = 'Sicher?';
                    setTimeout(() => { if (open) paintTools(); }, 3000);
                    return;
                }
                await api('chat_thread?id=eq.' + open.id, { method: 'DELETE', headers: { Prefer: 'return=minimal' } })
                    .catch(e => note(e.message, true));
                showList();
            });

            $('back').addEventListener('click', () => { if (open) showList(); });

            const ta = $('text');
            const fit = S.autoGrow(ta);
            const sync = () => { $('send').disabled = !ta.value.trim() || ta.value.length > S.MAX_LEN; };
            ta.addEventListener('input', sync);
            ta.setAttribute('maxlength', S.MAX_LEN);
            $('compose').addEventListener('submit', e => { e.preventDefault(); reply(); });
            ta.addEventListener('keydown', e => {
                if (e.key === 'Enter' && !e.shiftKey && !matchMedia('(pointer: coarse)').matches) { e.preventDefault(); reply(); }
            });

            /* --- the bell: push to this device ------------------------------------------------------- */
            /* The device that tapped the bell last gets the push. Its subscription is kept in chat_config
               (push_endpoint, push_key, push_auth - Doc's account only), where the push function reads it. */

            async function bellState() {
                const bell = $('bell');
                let on = false;
                try {
                    // no permission check: Chrome drops the subscription itself when notifications get blocked
                    const sub = await (await swReady).pushManager.getSubscription();
                    if (sub) {
                        const rows = await api('chat_config?key=eq.push_endpoint&select=value');
                        on = !!(rows && rows[0] && rows[0].value === sub.endpoint);
                    }
                } catch (e) { /* offline - leave it off */ }
                bell.classList.toggle('on', on);
                bell.setAttribute('aria-pressed', String(on));
                bell.title = on ? 'Benachrichtigungen kommen auf dieses Gerät' : 'Benachrichtigungen auf dieses Gerät holen';
            }

            async function bellOn() {
                if (await Notification.requestPermission() !== 'granted') {
                    note('Benachrichtigungen sind in diesem Browser blockiert (Website-Einstellungen).', true);
                    return;
                }
                const reg = await swReady;
                const sub = await reg.pushManager.getSubscription()
                    || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64urlBytes(VAPID_PUBLIC) });
                const k = sub.toJSON().keys;
                await api('chat_config', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
                    body: JSON.stringify([{ key: 'push_endpoint', value: sub.endpoint }, { key: 'push_key', value: k.p256dh },
                        { key: 'push_auth', value: k.auth }]) });
                note('Benachrichtigungen kommen ab jetzt auf dieses Gerät.');
                bellState();
            }

            $('bell').addEventListener('click', () => bellOn().catch(e => note('Benachrichtigung nicht eingerichtet: ' + e.message, true)));

            /* --- start: login (Doc's SVP account), key, bell ---------------------------------------- */

            async function start() {
                if (!A.hasSession()) { A.loginDialog(start, 'Kontakt: mit dem SVP-Konto anmelden'); return; }
                if (uid() !== DOC_UID) { note('Der Kontakt gehört Dr. Alvers. Dieses Konto hat keinen Zugang.', true); return; }
                if (!(await S.available())) { note('Der Kontakt ist noch nicht eingerichtet: Das SQL fehlt noch.', true); return; }
                await C.ready;
                if (!C.hasPrivate()) { C.passDialog('unlock', start, 'Kontakt'); return; }
                $('bell').hidden = !canPush || !!open;
                bellState();
                S.poll(() => (open ? loadThread() : loadList()).catch(e => note('Nicht ladbar: ' + e.message, true)), 20000);
            }
            start();
        })();
    </script>
</body>

</html>
