<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>DOC ALVERS – LAB AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            options: {
                ignoreHtmlClass: 'tex2jax_ignore',
                processHtmlClass: 'tex2jax_process'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Orbitron', monospace;
            background: radial-gradient(circle at 20% 30%, #0a0a2a, #030318);
            min-height: 100vh;
            padding: 24px;
        }

        /* Branding Styles matching other labs */
        .canvas-branding {
            position: fixed;
            top: 20px;
            right: 24px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 1000;
            pointer-events: none;
        }

        .chat-header {
            padding: 8px 16px;
            background: rgba(0, 5, 20, 0.4);
            border-bottom: 1px solid rgba(0, 210, 255, 0.2);
            display: flex;
            align-items: center;
        }

        .model-select {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 4px;
            color: #00d2ff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            padding: 2px 8px;
            outline: none;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        
        .model-select:hover {
            border-color: #00d2ff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        }

        .canvas-branding h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            margin: 0;
            letter-spacing: 3px;
            background: linear-gradient(to right, #00d2ff, #ffffff, #9d50bb);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            filter: drop-shadow(0 0 10px rgba(0, 210, 255, 0.4));
            text-transform: uppercase;
            font-weight: 700;
            line-height: 1.1;
        }

        .canvas-subtitle {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            letter-spacing: 5px;
            color: #00d2ff;
            margin-top: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 7px #00d2ff;
            opacity: 0.9;
        }

        .chat-container {
            max-width: 1100px;
            width: 100%;
            margin: 60px auto 0 auto;
            background: rgba(5, 7, 25, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 10px;
            border: 1px solid rgba(0, 210, 255, 0.4);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: calc((100vh - 180px) * 1.1);
        }

        /* API-Leiste – wird ausgeblendet, wenn Key gespeichert */
        .api-section {
            padding: 16px 24px;
            background: rgba(0, 5, 20, 0.7);
            border-bottom: 1px solid rgba(0, 210, 255, 0.4);
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            align-items: center;
            transition: all 0.3s ease;
        }

        .api-section.hidden {
            display: none;
        }

        .api-input {
            flex: 2;
            background: #070b1a;
            border: 1px solid #2d2f6e;
            border-radius: 10px;
            padding: 12px 20px;
            color: #b5f0ff;
            font-family: 'Orbitron', monospace;
            font-size: 0.8rem;
        }

        .api-input:focus {
            outline: none;
            border-color: #00d2ff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
        }

        .save-key-btn {
            background: #1e2a3e;
            border: 1px solid #00d2ff;
            border-radius: 10px;
            padding: 12px 20px;
            color: #00d2ff;
            font-family: 'Orbitron', monospace;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .save-key-btn:hover {
            background: #00d2ff;
            color: #0a0a2a;
        }



        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            scroll-behavior: smooth;
            scrollbar-color: #5a2080 #0a0f2a;
            scrollbar-width: thin;
        }

        .messages-area::-webkit-scrollbar,
        .message-input::-webkit-scrollbar,
        .message-content pre::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .messages-area::-webkit-scrollbar-track,
        .message-content pre::-webkit-scrollbar-track {
            background: #0a0f2a;
            border-radius: 10px;
        }

        .message-input::-webkit-scrollbar-track {
            background: transparent;
            margin: 8px 0;
        }

        /* Horizontale Scrollbar in Code-Blöcken */
        .message-content pre::-webkit-scrollbar-track {
            background: #1a0a2e;
            border-radius: 10px;
            margin: 0 12px;
        }

        .message-content pre::-webkit-scrollbar-thumb {
            background: #5a2080;
            border-radius: 10px;
        }

        .messages-area::-webkit-scrollbar-thumb,
        .message-input::-webkit-scrollbar-thumb,
        .message-content pre::-webkit-scrollbar-thumb {
            background: #5a2080;
            border-radius: 10px;
        }

        .message {
            display: flex;
            animation: fadeSlide 0.25s ease-out;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }



        .message-content {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 10px;
            font-family: 'Helvetica', 'Arial', sans-serif;
            font-weight: 400;
            font-size: 0.95rem;
            line-height: 1.45;
        }

        .message.user .message-content {
            background: linear-gradient(125deg, #00a3cc, #5e2a84);
            color: white;
        }

        .message.assistant .message-content {
            background: rgba(0, 20, 40, 0.8);
            backdrop-filter: blur(4px);
            color: #ccf5ff;
            border: 1px solid #4b2c7a;
            max-width: 80%;
            width: 80%;
            position: relative;
        }

        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 210, 255, 0.08);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 6px;
            color: #00d2ff;
            cursor: pointer;
            padding: 4px 6px;
            font-size: 0.85rem;
            line-height: 1;
            transition: background 0.2s, color 0.2s;
            z-index: 2;
        }

        .copy-btn:hover {
            background: rgba(0, 210, 255, 0.22);
        }

        .copy-btn.copied {
            color: #7fff7f;
            border-color: #7fff7f;
        }

        .pre-wrapper {
            position: relative;
        }

        .pre-wrapper .copy-btn {
            top: 12px;
            right: 12px;
        }

        .message-content pre {
            background: #03081a;
            padding: 10px;
            border-radius: 10px;
            overflow-x: auto;
            margin: 8px 0;
            border-left: 3px solid #00d2ff;
            scrollbar-color: #5a2080 #1a0a2e;
            scrollbar-width: thin;
        }

        .message-content code {
            font-family: monospace;
            background: #00000055;
            padding: 2px 6px;
            border-radius: 10px;
        }

        .message-content ul {
            padding-left: 1.4em;
            margin: 6px 0;
        }

        .message-content li {
            margin: 3px 0;
            line-height: 1.5;
        }

        .typing-dots {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 0;
        }

        .typing-dots span {
            width: 8px;
            height: 8px;
            background: #00d2ff;
            border-radius: 50%;
            animation: typing-pulse 1.4s infinite ease-in-out;
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.4);
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing-pulse {

            0%,
            80%,
            100% {
                transform: scale(0.7);
                opacity: 0.4;
            }

            40% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        .message-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 10px 0;
            font-size: 0.88rem;
        }

        .message-content th,
        .message-content td {
            border: 1px solid rgba(0, 210, 255, 0.25);
            padding: 6px 12px;
            text-align: left;
        }

        .message-content th {
            background: rgba(0, 210, 255, 0.12);
            color: #00d2ff;
            font-family: 'Orbitron', monospace;
            font-size: 0.78rem;
            letter-spacing: 1px;
        }

        .message-content tr:nth-child(even) td {
            background: rgba(0, 210, 255, 0.04);
        }

        .message-content hr {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            margin: 12px 0;
            box-shadow: 0 1px 0 rgba(0, 210, 255, 0.1);
        }

        .input-area {
            padding: 16px 24px;
            background: rgba(2, 6, 23, 0.8);
            display: flex;
            gap: 16px;
            align-items: flex-end;
        }

        .message-input {
            flex: 1;
            background: #070b1a;
            border: 1px solid #2d2f6e;
            border-radius: 10px;
            padding: 10px 20px;
            color: #b5f0ff;
            font-family: 'Helvetica', 'Arial', sans-serif;
            font-size: 1rem;
            resize: none;
            outline: none;
            height: 44px;
            min-height: 44px;
            max-height: 120px;
            overflow-y: hidden;
            transition: height 0.1s ease;
            line-height: 1.45;
            box-sizing: border-box;
        }

        .message-input:focus {
            outline: none;
            border-color: #00d2ff;
            box-shadow: 0 0 6px #00d2ff;
        }

        .send-button {
            background: linear-gradient(135deg, #00d2ff, #9d50bb);
            border: none;
            border-radius: 10px;
            padding: 12px 24px;
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            height: 44px;
            flex-shrink: 0;
        }

        .send-button:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 0 14px #9d50bb;
        }

        /* --- SECURITY CLEARANCE OVERLAY --- */
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(3, 4, 18, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .auth-overlay.visible {
            opacity: 1;
            pointer-events: all;
        }
        .auth-modal {
            background: rgba(5, 10, 30, 0.95);
            border: 1px solid var(--neon-blue, #00d2ff);
            border-radius: 12px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 210, 255, 0.1);
            transition: all 0.3s ease;
        }
        .auth-modal .briefing-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--neon-blue, #00d2ff);
            letter-spacing: 2px;
        }
        .auth-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-family: monospace;
            font-size: 1.2rem;
            text-align: center;
            margin: 20px 0;
            outline: none;
        }
        .auth-input:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        }
    </style>
</head>

<body>

    <div class="auth-overlay" id="cyber-auth-overlay">
        <div class="auth-modal">
            <div class="briefing-header">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                Passwort eingeben
            </div>
            <div style="position: relative; margin: 20px 0;">
                <input type="password" id="cyber-pwd-input" class="auth-input" placeholder="********" autocomplete="off" aria-label="Passwort" style="margin: 0; padding-right: 48px;">
                <button id="toggle-pwd-btn" onclick="togglePwdVisibility()" aria-label="Passwort anzeigen"
                    style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:#00d2ff; padding:4px; line-height:1;">
                    <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
            <div style="display: flex; gap: 15px; justify-content: center;">
                <button class="send-button" style="flex:1; padding: 10px 25px;" onclick="validateLabAccess()">LOGIN</button>
                <button style="flex:1;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.2);border-radius:10px;padding:10px 28px;color:rgba(255,255,255,0.5);font-family:'Orbitron',sans-serif;font-weight:700;font-size:0.9rem;cursor:pointer;transition:all 0.2s;" onclick="document.getElementById('cyber-auth-overlay').classList.remove('visible')">CANCEL</button>
            </div>
        </div>
    </div>

    <div class="canvas-branding">
        <h1>DOC ALVERS MATHE-LABOR</h1>
        <div class="canvas-subtitle">LAB AI</div>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            <select id="modelSelect" class="model-select">
                <option value="deepseek-v4-pro">V4 PRO</option>
                <option value="deepseek-v4-flash">V4 FLASH</option>
                <option value="deepseek-reasoner">REASONER</option>
                <option value="deepseek-chat">CHAT (V3)</option>
            </select>
        </div>
        <div class="messages-area" id="messagesArea">
            <div class="message assistant">
                <div class="message-content" style="font-family: 'Helvetica', 'Arial', sans-serif;">
                    <strong>Wie kann ich Dir helfen?</strong>
                </div>
            </div>
        </div>

        <div class="input-area">
            <textarea class="message-input" id="messageInput" rows="1" placeholder="Du hast sicher Fragen ... schreib sie hier!" aria-label="Deine Nachricht an die KI"></textarea>
            <button class="send-button" id="sendButton">GO</button>
        </div>

    </div>

    <script>
        const AI_URL = 'https://api.deepseek.com/v1/chat/completions';
        let conversationHistory = [];
        
        // HIER KOMMT DER VERSCHLÜSSELTE KEY HIN:
        // Verschlüssele deinen Key in der Browser-Konsole mit: CryptoJS.AES.encrypt("sk-DEIN_KEY", "vsb2026!").toString()
        const ENCRYPTED_API_KEY = "U2FsdGVkX18xMjM0NTY3OF0Uf+jzF9gByhGWIdT4T2fU3spB2Qdhpje6i/EbkuiEknQzonQJGrEVmzraOCZTng==";

        function aesDecrypt(encryptedText, pwd) {
            try {
                const bytes = CryptoJS.AES.decrypt(encryptedText, pwd);
                return bytes.toString(CryptoJS.enc.Utf8);
            } catch (e) {
                return "";
            }
        }
        
        let sessionApiKey = ""; // Wird nach Login gefüllt

        function togglePwdVisibility() {
            const input = document.getElementById('cyber-pwd-input');
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            document.getElementById('eye-icon').innerHTML = isHidden
                ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path><line x1="1" y1="1" x2="23" y2="23"></line>`
                : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
        }

        function validateLabAccess() {
            const pwd = document.getElementById('cyber-pwd-input').value;
            const decrypted = aesDecrypt(ENCRYPTED_API_KEY, pwd);
            
            if (decrypted.startsWith("sk-")) {
                sessionApiKey = decrypted;
                document.getElementById('cyber-auth-overlay').classList.remove('visible');
                document.getElementById('messageInput').focus();
            } else {
                const modal = document.querySelector(".auth-modal");
                modal.style.borderColor = "red";
                modal.style.boxShadow = "0 0 30px rgba(255,0,0,0.4)";
                document.getElementById('cyber-pwd-input').value = "";
                setTimeout(() => {
                    modal.style.borderColor = "var(--neon-blue, #00d2ff)";
                    modal.style.boxShadow = "0 15px 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 210, 255, 0.1)";
                }, 500);
            }
        }

        // Event-Listener für das Passwortfeld (erst registrieren, wenn DOM ready ist)
        document.addEventListener('DOMContentLoaded', () => {
            const pwdInput = document.getElementById('cyber-pwd-input');
            if(pwdInput) {
                pwdInput.focus();
                pwdInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') validateLabAccess();
                });
            }
        });

        const messagesArea = document.getElementById('messagesArea');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');

        // Storage Keys – liest auch alten 'deepseek_api_key' für Migration
        const STORAGE_KEY = 'ai_api_key';
        const MODEL_KEY = 'ai_model';
        const HISTORY_KEY = 'ai_history';

        const COPY_ICON = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
        const CHECK_ICON = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;

        function getApiKey() {
            return sessionApiKey;
        }

        function getModel() {
            const select = document.getElementById('modelSelect');
            if (select) return select.value;
            return localStorage.getItem(MODEL_KEY) || 'deepseek-v4-pro';
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            const modelSelect = document.getElementById('modelSelect');
            if (modelSelect) {
                const saved = localStorage.getItem(MODEL_KEY);
                if (saved) modelSelect.value = saved;
                modelSelect.addEventListener('change', () => {
                    localStorage.setItem(MODEL_KEY, modelSelect.value);
                });
            }
        });

        function saveHistory() {
            localStorage.setItem(HISTORY_KEY, JSON.stringify(conversationHistory));
        }

        function loadHistory() {
            try {
                const saved = localStorage.getItem(HISTORY_KEY)
                    || localStorage.getItem('deepseek_history');
                if (!saved) return;
                const history = JSON.parse(saved);
                if (!Array.isArray(history) || history.length === 0) return;
                conversationHistory = history;
                messagesArea.innerHTML = '';
                history.forEach(msg => addMessage(msg.role, msg.content));
            } catch (e) { }
        }

        loadHistory();

        // ----- CHAT-LOGIK -----
        messageInput.addEventListener('input', function () {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 110) + 'px';
        });
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        sendButton.addEventListener('click', sendMessage);

        function addMessage(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            // 1. Code-Blöcke extrahieren (Platzhalter nutzen)
            const codeBlocks = [];
            let formatted = content.replace(/```(\w*)\n([\s\S]*?)```/g, (match, lang, code) => {
                const placeholder = `__CODE_BLOCK_${codeBlocks.length}__`;
                codeBlocks.push({ lang, code });
                return placeholder;
            });

            // 2a. Markdown-Tabellen rendern
            formatted = formatted.replace(/^(\|.+\|)\n\|[-| :]+\|\n((?:\|.+\|\n?)*)/gm, (match, header, body) => {
                const parseRow = row => row.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
                const ths = parseRow(header).map(h => `<th>${h}</th>`).join('');
                const trs = body.trim().split('\n').map(row =>
                    '<tr>' + parseRow(row).map(c => `<td>${c}</td>`).join('') + '</tr>'
                ).join('');
                return `<table><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table>`;
            });

            // 2. Andere Markups formatieren
            formatted = formatted.replace(/^### (.*$)/gim, '<h3>$1</h3>');
            formatted = formatted.replace(/^## (.*$)/gim, '<h4>$1</h4>');
            formatted = formatted.replace(/^# (.*$)/gim, '<h5>$1</h5>');
            formatted = formatted.replace(/^\s*[-*+]\s+(.*)$/gim, '<li>$1</li>');
            formatted = formatted.replace(/(<li>.*<\/li>)/gim, '<ul>$1</ul>');
            formatted = formatted.replace(/<\/ul>\s*<ul>/gim, '');
            formatted = formatted.replace(/^---$/gm, '<hr>');
            formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            formatted = formatted.replace(/\*(.*?)\*/g, '<em>$1</em>');
            formatted = formatted.replace(/`([^`]+)`/g, '<code>$1</code>');
            formatted = formatted.replace(/\n/g, '<br>');

            // 3. Code-Blöcke sicher wieder einsetzen
            codeBlocks.forEach((block, index) => {
                const langClass = block.lang ? ` class="language-${block.lang}"` : '';
                const codeHtml = `<div class="pre-wrapper"><button class="copy-btn" data-code="${encodeURIComponent(block.code.trim())}">${COPY_ICON}</button><pre><code${langClass}>${escapeHtml(block.code.trim())}</code></pre></div>`;
                formatted = formatted.replace(`__CODE_BLOCK_${index}__`, codeHtml);
            });

            contentDiv.innerHTML = formatted;

            // Copy-Button für gesamte Antwort
            if (role === 'assistant') {
                const msgCopyBtn = document.createElement('button');
                msgCopyBtn.className = 'copy-btn';
                msgCopyBtn.innerHTML = COPY_ICON;
                msgCopyBtn.style.position = 'absolute';
                msgCopyBtn.addEventListener('click', () => copyText(content, msgCopyBtn));
                contentDiv.appendChild(msgCopyBtn);
            }

            // Copy-Button für Code-Blöcke verdrahten
            contentDiv.querySelectorAll('.pre-wrapper .copy-btn').forEach(btn => {
                const code = decodeURIComponent(btn.dataset.code);
                btn.addEventListener('click', () => copyText(code, btn));
            });

            messageDiv.appendChild(contentDiv);
            messagesArea.appendChild(messageDiv);

            // MathJax Rendering
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([contentDiv]);
            }

            // Syntax Highlighting
            if (typeof hljs !== 'undefined') {
                contentDiv.querySelectorAll('pre code').forEach((block) => {
                    hljs.highlightElement(block);
                });
            }

            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        function copyText(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                btn.innerHTML = CHECK_ICON;
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.innerHTML = COPY_ICON;
                    btn.classList.remove('copied');
                }, 1500);
            });
        }

        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function (m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message assistant';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = `<div class="message-content"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
            messagesArea.appendChild(typingDiv);
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        function hideTyping() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        async function sendMessage() {
            const userText = messageInput.value.trim();
            const apiKey = getApiKey();

            if (!userText) return;

            if (userText.toLowerCase() === '%clearchat') {
                conversationHistory = [];
                localStorage.removeItem(HISTORY_KEY);
                messagesArea.innerHTML = `<div class="message assistant"><div class="message-content"><strong>Wie kann ich Dir helfen?</strong></div></div>`;
                messageInput.value = '';
                messageInput.style.height = 'auto';
                return;
            }

            if (!apiKey || !apiKey.startsWith('sk-')) {
                addMessage('assistant', '❌ Kein API-Key gefunden. Bitte in localStorage unter "ai_api_key" speichern.');
                return;
            }

            addMessage('user', userText);
            messageInput.value = '';
            messageInput.style.height = 'auto';
            sendButton.disabled = true;
            conversationHistory.push({ role: 'user', content: userText });
            showTyping();

            try {
                const response = await fetch(AI_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: getModel(),
                        messages: conversationHistory,
                        temperature: 0.6,
                        max_tokens: 3000
                    })
                });
                if (!response.ok) {
                    hideTyping();
                    let err = `Fehler ${response.status}`;
                    if (response.status === 401) err = 'Ungültiger API-Key – bitte neu speichern';
                    if (response.status === 402) err = 'Nicht genug Guthaben – AI-Konto aufladen';
                    throw new Error(err);
                }
                const data = await response.json();
                const reply = data.choices[0].message.content;
                conversationHistory.push({ role: 'assistant', content: reply });
                if (conversationHistory.length > 20) conversationHistory = conversationHistory.slice(-20);
                saveHistory();

                hideTyping();
                addMessage('assistant', reply);
            } catch (err) {
                hideTyping();
                addMessage('assistant', `❌ Fehler: ${err.message}`);
            } finally {
                sendButton.disabled = false;
                messageInput.focus();
            }
        }
        // ----- AUTO-LOGIN & AUTH-INITIALISIERUNG -----
        (function initAuth() {
            const devPwd = localStorage.getItem('dev_access');
            const isLocal = location.hostname === "localhost" || 
                           location.hostname === "127.0.0.1" || 
                           location.protocol === "file:" ||
                           location.hostname.startsWith("192.168.");
            
            let success = false;
            if (isLocal && devPwd) {
                const decrypted = aesDecrypt(ENCRYPTED_API_KEY, devPwd);
                if (decrypted && decrypted.startsWith("sk-")) {
                    sessionApiKey = decrypted;
                    success = true;
                }
            }

            if (!success) {
                document.getElementById('cyber-auth-overlay').classList.add('visible');
                const pwdInput = document.getElementById('cyber-pwd-input');
                if (pwdInput) setTimeout(() => pwdInput.focus(), 100);
            } else {
                setTimeout(() => messageInput.focus(), 100);
            }
        })();
    </script>
</body>
