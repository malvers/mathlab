<style>
    /* the deck's night behind the banner, the banner in the middle */
    html, body { height: 100%; margin: 0; background: #071630; }
    body {
        display: grid; place-items: center; padding: 16px; box-sizing: border-box; cursor: pointer;
        background: radial-gradient(80% 60% at 50% 45%, #0f2547 0%, #071630 70%);
    }

</style>

<body>
    <a class="b-kino" href="../decks/mathe11-lehrbuch.html#1" aria-label="The Making of: ein ganzes Lehrbuch für 0,49 € – zur Präsentation">
        <span class="b-kino-strip" aria-hidden="true"></span>
        <span class="b-kino-frame">
            <span class="b-kino-beam" aria-hidden="true"></span>
            <span class="b-kino-pre">DOC ALVERS MATHE-LABOR PRÄSENTIERT</span>
            <span class="b-kino-title">THE MAKING OF</span>

            <span class="b-kino-play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5Z"/></svg></span>
        </span>
        <span class="b-kino-strip" aria-hidden="true"></span>
    </a>
    <script>
        // a click or Enter/Space anywhere counts as a click on the banner - still inside the user's gesture, so the
        // fullscreen of deck-fullscreen.js is granted
        (function () {
            const kino = document.querySelector('.b-kino');
            document.addEventListener('click', function (e) {
                if (!e.target.closest('.b-kino') && !e.button) kino.click();
            });
            document.addEventListener('keydown', function (e) {
                if ((e.key === 'Enter' || e.key === ' ') && e.target === document.body) { e.preventDefault(); kino.click(); }
            });
        })();
    </script>
</body>
