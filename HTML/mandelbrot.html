            /** Format one real for KaTeX (decimal separator escaped). */
            function mbOrbitPlaneTexNum(x, digits) {
                const n = digits != null ? digits : ORBIT_COORD_NKS;
                let s = String(Number(Number(x).toFixed(n)));
                if (s === '-0') s = '0';
                return s.replace('.', '{.}');
            }

            /**
             * KaTeX overlay for c; orbit vertices use #orbit-tex-chain (see syncOrbitWaypointKatexOverlays).
             * Prefix k| vs t| in cache bumps render when KaTeX loads after first paint.
             */
            function syncOrbitHandleKatexOverlays(planeCtx) {
                const { cc: cco, canvasEl, cr, ci, showC } = planeCtx;
                const elC = document.getElementById('orbit-tex-c');
                if (!elC || !canvasEl || !cco) return;
                const w = Math.max(1, cco.width);
                const h = Math.max(1, cco.height);
                const cqKind = typeof katex !== 'undefined' ? 'k' : 't';

                function placePct(el, ux, uy, ox, oy) {
                    const lp = Math.max(0, Math.min(100, ((ux + ox) / w) * 100));
                    const tp = Math.max(0, Math.min(100, ((uy + oy) / h) * 100));
                    el.style.left = lp + '%';
                    el.style.top = tp + '%';
                }

                if (showC) {
                    const cqKey = `${cqKind}|${cr.toFixed(ORBIT_COORD_NKS)}|${ci.toFixed(ORBIT_COORD_NKS)}|cPurp`;
                    if (orbitOverlayCTexKey !== cqKey) {
                        orbitOverlayCTexKey = cqKey;
                        if (typeof katex !== 'undefined') {
                            const tex = `\\textcolor{${ORBIT_WORKED_C_ACCENT_COLOR}}{\\mathbf{c}}\\ \\bigl(${mbOrbitPlaneTexNum(
                                cr,
                            )} \\bigm| ${mbOrbitPlaneTexNum(ci)}\\bigr)`;
                            katex.render(tex, elC, { throwOnError: false, displayMode: false });
                        } else {
                            const pxS = Number(cr).toFixed(ORBIT_COORD_NKS);
                            const pyS = Number(ci).toFixed(ORBIT_COORD_NKS);
                            elC.innerHTML = `<span style="color:rgba(167,85,247,0.98);font-weight:700">c</span> (${pxS} | ${pyS})`;
                        }
                    }
                    elC.hidden = false;
                    elC.classList.remove('orbit-point-katex--hidden');
                    placePct(elC, cco.mapX(cr), cco.mapY(ci), 4, 10);
                } else {
                    orbitOverlayCTexKey = '';
                    elC.innerHTML = '';
                    elC.hidden = true;
                    elC.classList.add('orbit-point-katex--hidden');
                }
            }

            /** Squared-plane distance threshold: match drawOrbitPlane waypoint dots vs c (omit duplicate chips). */
            const ORBIT_WAYPOINT_SAME_AS_C_R2_MAX = 1e-10;

            /** True when orbit vertex liegt auf dem c‑Griff (z. B. z₁ = c bei z₀ = 0): doppeltes KaTeX‑Chip vermeiden. */
            function orbitWaypointSameAsDragC(px, py, cr0, ci0) {
                const dx = px - cr0;
                const dy = py - ci0;
                return dx * dx + dy * dy < ORBIT_WAYPOINT_SAME_AS_C_R2_MAX;
            }

            /** Bumpt DOM-Cache in syncOrbitWaypointKatexOverlays bei Label-TeX-/Farbänderungen. */
            const ORBIT_WAYPOINT_KATEX_KEY_REV = 'zb5-italic-like-box';

            /** One KaTeX chip per orbit vertex z_i (Re | Im); skip chips that sit on c — c has its own overlay. */
            function syncOrbitWaypointKatexOverlays(cco, pts, showPolyline, cr0, ci0) {
                const chain = document.getElementById('orbit-tex-chain');
                if (!chain || !cco) return;
                const w = Math.max(1, cco.width);
                const h = Math.max(1, cco.height);
                if (!showPolyline || !pts || pts.length === 0) {
                    chain.innerHTML = '';
                    return;
                }
                while (chain.children.length < pts.length) {
                    const d = document.createElement('div');
                    d.className = 'orbit-point-katex orbit-point-katex--waypoint';
                    chain.appendChild(d);
                }
                while (chain.children.length > pts.length) {
                    chain.removeChild(chain.lastChild);
                }
                const cqKind = typeof katex !== 'undefined' ? 'k' : 't';
                for (let i = 0; i < pts.length; i++) {
                    const el = chain.children[i];
                    const px = pts[i].x;
                    const py = pts[i].y;
                    if (orbitWaypointSameAsDragC(px, py, cr0, ci0)) {
                        el.hidden = true;
                        el.classList.add('orbit-point-katex--hidden');
                        el.innerHTML = '';
                        delete el.dataset.mbOrbitWpKey;
                        continue;
                    }
                    el.hidden = false;
                    el.classList.remove('orbit-point-katex--hidden');
                    const key = `${i}|${cqKind}|${px.toFixed(ORBIT_COORD_NKS)}|${py.toFixed(ORBIT_COORD_NKS)}|${ORBIT_WAYPOINT_KATEX_KEY_REV}`;
                    if (el.dataset.mbOrbitWpKey !== key) {
                        el.dataset.mbOrbitWpKey = key;
                        if (typeof katex !== 'undefined') {
                            const tex = `\\textcolor{${ORBIT_WORKED_STEP_HEAD_COLOR}}{z_{${i}}}\\ \\bigl(${mbOrbitPlaneTexNum(
                                px,
                            )} \\bigm| ${mbOrbitPlaneTexNum(py)}\\bigr)`;
                            katex.render(tex, el, { throwOnError: false, displayMode: false });
                        } else {
                            const pxS = Number(px).toFixed(ORBIT_COORD_NKS);
                            const pyS = Number(py).toFixed(ORBIT_COORD_NKS);
                            el.innerHTML = `<span style="color:rgba(92,225,255,0.96)">z<sub>${i}</sub></span> (${pxS} | ${pyS})`;
                        }
                    }
                    const ux = cco.mapX(px);
                    const uy = cco.mapY(py);
                    const ox = 4 + (i % 3) * 3;
                    const oy = 8 + (i % 4) * 3;
                    const lp = Math.max(0, Math.min(100, ((ux + ox) / w) * 100));
                    const tp = Math.max(0, Math.min(100, ((uy + oy) / h) * 100));
                    el.style.left = lp + '%';
                    el.style.top = tp + '%';
                }
            }

            function drawOrbitPlane() {
                const cc = CyberCanvasInstance;
                if (!cc.isInitialized || mainPlane !== 'ORBIT') return;
                const orbitDrawT0 = performance.now();
                syncOrbitCyberCanvasViewFromFractal(false);
                cc.drawGrid({
                    vignette: false,
                    mainColor: 'rgba(0, 210, 255, 0.42)',
                    gridColor: 'rgba(255, 255, 255, 0.095)',
                });
                const ctx = cc.ctx;

                function strokeCircleRadius(R, strokeStyle, dashed) {
                    const ox = cc.mapX(0);
                    const oy = cc.mapY(0);
                    const pxPerUnit = cc.width / (cc.view.maxX - cc.view.minX);
                    const rad = R * pxPerUnit;
                    if (rad <= 0.5) return;
                    ctx.save();
                    ctx.strokeStyle = strokeStyle;
                    ctx.lineWidth = 0.85;
                    ctx.setLineDash(dashed ? [7, 5] : []);
                    ctx.beginPath();
                    ctx.arc(ox, oy, rad, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }

                strokeCircleRadius(1, 'rgba(255,255,255,0.38)', true);
                strokeCircleRadius(2, 'rgba(0, 210, 255, 0.42)', true);

                let z0x;
                let z0y;
                let cr;
                let ci;
                if (fractalUsesCBurnPlane()) {
                    z0x = 0;
                    z0y = 0;
                    cr = juliaX;
                    ci = juliaY;
                } else {
                    z0x = centerX;
                    z0y = centerY;
                    cr = juliaX;
                    ci = juliaY;
                }

                const pts = [];
                let zx = z0x;
                let zy = z0y;
                const burnOrbit = mode === 'BURNING_SHIP';
                /** ↑/↓ in orbit view adjust orbitLegCount (legs / segments). */
                const legsBudget = clampOrbitLegCount(orbitLegCount);
                pts.push({ x: zx, y: zy });
                /** Schenkel nur anhängen, wenn die Iteration endliche Werte liefert (kein Schweif aus „n/a“-Punkten). */
                for (let seg = 0; seg < legsBudget; seg++) {
                    const st = orbitIterateMap(zx, zy, cr, ci, burnOrbit);
                    const nzx = st.zx;
                    const nzy = st.zy;
                    if (!Number.isFinite(nzx) || !Number.isFinite(nzy)) break;
                    zx = nzx;
                    zy = nzy;
                    pts.push({ x: zx, y: zy });
                }

                orbitLastLegBudget = legsBudget;
                orbitLastActualLegs = Math.max(0, pts.length - 1);

                const nWp = pts.length > 1 ? Math.min(pts.length - 1, ORBIT_WORKED_PANEL_ZS_MAX) : 0;
                orbitWorkedPanelSnap = {
                    cr,
                    ci,
                    z0x,
                    z0y,
                    burnOrbit,
                    zs: nWp > 0 ? pts.slice(1, 1 + nWp) : [],
                    legsBudget,
                };

                /** Escape like shader: |z|² > 4 → unstable (red); inside disk yellow like stable HUD gold. */
                const lp = pts[pts.length - 1];
                const r2Last = lp.x * lp.x + lp.y * lp.y;
                orbitLastLegEndR2 = r2Last;
                const orbitStablePath = r2Last <= 4 + 1e-10;
                const orbitStroke = orbitStablePath
                    ? 'rgba(242, 187, 68, 0.94)'
                    : 'rgba(229, 57, 53, 0.94)';
                /** Kleine Quadrate/Punkte auf \(z_k\): einheitlich Cyan wie Griff; Schenkelfarbe bleibt gold/rot. */
                const ORBIT_WAYPOINT_DOT_FILL = 'rgba(5, 209, 255, 0.92)';
                const ORBIT_WAYPOINT_DOT_R_SCALE = 1.2;

                const nSeg = pts.length - 1;
                if (orbitShowLegPolyline) {
                    for (let i = 0; i < nSeg; i++) {
                        const t = nSeg <= 1 ? 1 : i / (nSeg - 1);
                        ctx.strokeStyle = orbitStroke;
                        ctx.lineWidth = Math.max(1.2, 0.65 + t * 1.45);
                        ctx.lineCap = 'round';
                        ctx.lineJoin = 'round';
                        ctx.beginPath();
                        ctx.moveTo(cc.mapX(pts[i].x), cc.mapY(pts[i].y));
                        ctx.lineTo(cc.mapX(pts[i + 1].x), cc.mapY(pts[i + 1].y));
                        ctx.stroke();
                    }
                }

                const ni = Math.max(1, pts.length - 1);
                if (orbitShowLegPolyline) {
                    ctx.fillStyle = ORBIT_WAYPOINT_DOT_FILL;
                    pts.forEach((p, i) => {
                        if (i === 0) return;
                        const dc = (p.x - cr) * (p.x - cr) + (p.y - ci) * (p.y - ci);
                        if (dc < ORBIT_WAYPOINT_SAME_AS_C_R2_MAX) return;
                        const px = cc.mapX(p.x);
                        const py = cc.mapY(p.y);
                        const tr = ni <= 0 ? 1 : i / ni;
                        const r = (1.35 + tr * 1.55) * ORBIT_WAYPOINT_DOT_R_SCALE;
                        ctx.beginPath();
                        ctx.arc(px, py, r, 0, Math.PI * 2);
                        ctx.fill();
                    });
                }

                function drawHandle(mx, my, isDraggable, draggableFill) {
                    const px = cc.mapX(mx);
                    const py = cc.mapY(my);
                    ctx.save();
                    const fillIdle = 'rgba(160, 175, 198, 0.72)';
                    ctx.fillStyle = isDraggable
                        ? draggableFill != null
                            ? draggableFill
                            : ORBIT_HANDLE_C_FILL
                        : fillIdle;
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.88)';
                    ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    ctx.arc(px, py, isDraggable ? 6.5 : 4.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                }

                if (orbitShowLegPolyline) {
                    drawHandle(cr, ci, true);
                }
                if (mode === 'JULIA') {
                    drawHandle(z0x, z0y, true, ORBIT_HANDLE_Z0_FILL);
                } else {
                    drawHandle(0, 0, false);
                }

                const orbitCanvasEl = document.getElementById('orbit-canvas');
                syncOrbitHandleKatexOverlays({
                    cc,
                    canvasEl: orbitCanvasEl,
                    cr,
                    ci,
                    showC: orbitShowLegPolyline,
                });
                syncOrbitWaypointKatexOverlays(cc, pts, orbitShowLegPolyline, cr, ci);

                if (orbitScanActive) {
                    const scanIters = Math.min(8192, fractalShaderTargetMaxIter());
                    const stepsPf = 132;
                    for (let s = 0; s < stepsPf && orbitScanActive && orbitScanIy < orbitScanRows; ) {
                        const { sx, sy } = orbitScanPixelToComplex(cc);
                        orbitScanProbeCx = sx;
                        orbitScanProbeCy = sy;
                        let hudMagR2 = sx * sx + sy * sy;
                        let probe;
                        if (fractalUsesCBurnPlane()) {
                            if (orbitMbScanCheapExterior(sx, sy)) {
                                probe = { stable: false };
                            } else {
                                probe = orbitProbeStableWithFinalR2(
                                    sx,
                                    sy,
                                    0,
                                    0,
                                    scanIters,
                                    mode === 'BURNING_SHIP'
                                );
                                if (probe.stable) hudMagR2 = probe.finalR2;
                                else hudMagR2 = probe.escapeR2 ?? hudMagR2;
                            }
                        } else {
                            const jq = orbitJuliaQuickExteriorResult(juliaX, juliaY, sx, sy, undefined, false);
                            if (jq.escaped) {
                                probe = { stable: false };
                                hudMagR2 = jq.escapeR2 ?? hudMagR2;
                            } else {
                                probe = orbitProbeStableWithFinalR2(juliaX, juliaY, sx, sy, scanIters, false);
                                if (probe.stable) hudMagR2 = probe.finalR2;
                                else hudMagR2 = probe.escapeR2 ?? hudMagR2;
                            }
                        }
                        orbitScanHudMagR2 = hudMagR2;
                        const cellKey = orbitScanIx + ',' + orbitScanIy;
                        if (probe.stable && !orbitScanStableKeys.has(cellKey)) {
                            orbitScanStableKeys.add(cellKey);
                            orbitScanStableHits.push({ x: sx, y: sy, finalR2: probe.finalR2 });
                        }
                        orbitScanVisitSerial++;
                        orbitScanAdvanceTopDown();
                        s++;

                        while (
                            fractalUsesCBurnPlane() &&
                            s < stepsPf &&
                            orbitScanActive &&
                            orbitScanIy < orbitScanRows
                        ) {
                            const p = orbitScanPixelToComplex(cc);
                            const cheapDead = orbitMbScanCheapExterior(p.sx, p.sy);
                            if (!cheapDead) break;
                            orbitScanProbeCx = p.sx;
                            orbitScanProbeCy = p.sy;
                            orbitScanHudMagR2 = p.sx * p.sx + p.sy * p.sy;
                            orbitScanVisitSerial++;
                            orbitScanAdvanceTopDown();
                            s++;
                        }
                    }
                }

                drawOrbitScanStableHits(cc, ctx);

                if (orbitScanActive) {
                    const px = cc.mapX(orbitScanProbeCx);
                    const py = cc.mapY(orbitScanProbeCy);
                    ctx.save();
                    ctx.fillStyle = ORBIT_HANDLE_Z0_FILL;
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.88)';
                    ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    ctx.arc(px, py, 6.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                }

                const orbitDrawDt = performance.now() - orbitDrawT0;
                orbitHudFrameMsSmooth =
                    orbitHudFrameMsSmooth > 0
                        ? orbitHudFrameMsSmooth * 0.82 + orbitDrawDt * 0.18
                        : orbitDrawDt;
                syncOrbitHud();
                syncMbOrbitStableCountPanel();
                syncMbFractalFormulaOverlay();
                syncOrbitMbWorkedExample();
            }

            function setupOrbitCyberCanvas() {
                teardownOrbitCyberCanvas();
                orbitFractalViewportSyncKey = '';
                CyberCanvasInstance.init('orbit-canvas', {}, {
                    showTelemetry: false,
                    showAxes: true,
                    showLabels: true,
                    showGrid: true,
                });
                CyberCanvasInstance.onResize = drawOrbitPlane;

                function orbitPickDragTarget(mx, my) {
                    let cr;
                    let ci;
                    let z0x_;
                    let z0y_;
                    if (fractalUsesCBurnPlane()) {
                        z0x_ = 0;
                        z0y_ = 0;
                        cr = juliaX;
                        ci = juliaY;
                    } else {
                        z0x_ = centerX;
                        z0y_ = centerY;
                        cr = juliaX;
                        ci = juliaY;
                    }
                    const pxPerUnit = CyberCanvasInstance.width / (CyberCanvasInstance.view.maxX - CyberCanvasInstance.view.minX);
                    const tol = 14 / pxPerUnit;
                    const dc = Math.hypot(mx - cr, my - ci);
                    const dz = Math.hypot(mx - z0x_, my - z0y_);
                    if (fractalUsesCBurnPlane()) {
                        if (orbitScanActive) return null;
                        if (!orbitShowLegPolyline) return null;
                        return dc < tol ? 'c' : null;
                    }
                    if (orbitScanActive) {
                        return dz < tol ? 'z0' : null;
                    }
                    if (!orbitShowLegPolyline) {
                        return dz < tol ? 'z0' : null;
                    }
                    if (dc < tol && dz < tol) return dc <= dz ? 'c' : 'z0';
                    if (dc < tol) return 'c';
                    if (dz < tol) return 'z0';
                    return null;
                }

                CyberCanvasInstance.onMouseDown = (pos) => {
                    orbitCanvasDrag = orbitPickDragTarget(pos.x, pos.y);
                    if (orbitCanvasDrag) CyberCanvasInstance.allowPan = false;
                };
                CyberCanvasInstance.onMouseMove = (pos) => {
                    if (!orbitCanvasDrag) return;
                    if (orbitCanvasDrag === 'c') {
                        if (fractalUsesCBurnPlane()) {
                            juliaX = pos.x;
                            juliaY = pos.y;
                            updateSliderMountVisual('jx-mount', Math.round(juliaX * 1000));
                            updateSliderMountVisual('jy-mount', Math.round(juliaY * 1000));
                        } else {
                            juliaX = pos.x;
                            juliaY = pos.y;
                            updateSliderMountVisual('jx-mount', Math.round(juliaX * 1000));
                            updateSliderMountVisual('jy-mount', Math.round(juliaY * 1000));
                        }
                    } else {
                        centerX = pos.x;
                        centerY = pos.y;
                    }
                    CyberCanvasInstance.needsRedraw = true;
                };
                CyberCanvasInstance.onMouseUp = () => {
                    if (!orbitCanvasDrag) return;
                    const was = orbitCanvasDrag;
                    orbitCanvasDrag = null;
                    CyberCanvasInstance.allowPan = true;
                    if (was === 'c') {
                        if (fractalUsesCBurnPlane()) {
                            updateSliderMountVisual('jx-mount', Math.round(juliaX * 1000));
                            updateSliderMountVisual('jy-mount', Math.round(juliaY * 1000));
                        } else {
                            updateSliderMountVisual('jx-mount', Math.round(juliaX * 1000));
                            updateSliderMountVisual('jy-mount', Math.round(juliaY * 1000));
                        }
                    }
                    schedulePersistMandelbrotFractalState();
                };

                CyberCanvasInstance.onContextMenu = (e) => {
                    CyberUI.showContextMenu(e.clientX, e.clientY, [
                        {
                            label: CyberI18n.get('fractal.reset'),
                            onclick: () => {
                                syncOrbitCyberCanvasViewFromFractal(true);
                                orbitScanClearAndRestartGrid(CyberCanvasInstance);
                            },
                        },
                        { divider: true },
                        {
                            label: CyberI18n.get('ui.show_axes'),
                            checked: CyberCanvasInstance.showAxes,
                            onchange: (v) => {
                                CyberCanvasInstance.showAxes = v;
                                CyberCanvasInstance.needsRedraw = true;
                            },
                        },
                        {
                            label: CyberI18n.get('ui.show_labels'),
                            checked: CyberCanvasInstance.showLabels,
                            onchange: (v) => {
                                CyberCanvasInstance.showLabels = v;
                                CyberCanvasInstance.needsRedraw = true;
                            },
                        },
                        {
                            label: CyberI18n.get('fractal.orbit_grid'),
                            checked: CyberCanvasInstance.showGrid,
                            onchange: (v) => {
                                CyberCanvasInstance.showGrid = v;
                                CyberCanvasInstance.needsRedraw = true;
                            },
                        },
                        {
                            label: CyberI18n.get('fractal.orbit_leg_polyline'),
                            checked: orbitShowLegPolyline,
                            onchange: (v) => {
                                orbitShowLegPolyline = !!v;
                                persistMandelbrotOrbitLegPolyline();
                                CyberCanvasInstance.needsRedraw = true;
                                drawOrbitPlane();
                            },
                        },
                    ]);
                };
                CyberCanvasInstance.needsRedraw = true;
                startOrbitRedrawLoop();
                applyOrbitHudVisibility();
                syncOrbitHud();
                syncOrbitMbWorkedExample();
            }

            function setMainPlane(next) {
                if (next !== 'FRACTAL' && next !== 'ORBIT') return;
                mainPlane = next;
                const ow = document.getElementById('orbit-view-wrap');
                const bf = document.getElementById('btn-plane-fractal');
                const bo = document.getElementById('btn-plane-orbit');
                if (next === 'FRACTAL') {
                    fractalRenderPaused = false;
                    teardownOrbitCyberCanvas();
                    canvas.classList.remove('mb-fractal-view-hidden');
                    if (ow) {
                        ow.hidden = true;
                        ow.setAttribute('aria-hidden', 'true');
                    }
                    if (bf) bf.classList.add('is-active');
                    if (bo) bo.classList.remove('is-active');
                    window.dispatchEvent(new Event('resize'));
                } else {
                    fractalRenderPaused = true;
                    if (isFlight) stopFlightUi();
                    canvas.classList.add('mb-fractal-view-hidden');
                    if (ow) {
                        ow.hidden = false;
                        ow.setAttribute('aria-hidden', 'false');
                    }
                    if (bf) bf.classList.remove('is-active');
                    if (bo) bo.classList.add('is-active');
                    setupOrbitCyberCanvas();
                }
                persistMandelbrotMainPlane();
                syncMbOrbitStableCountPanel();
                syncMbFractalFormulaOverlay();
                syncFlightButtonForMainPlane();
                syncOrbitSidebarWorkedCheckboxMount();
                syncOrbitMbWorkedExample();
            }

            /** 0 at zoom≈1, 1 at ZOOM_MAX — depth measure on log scale */
            function zoomDepthLogUnit(z) {
                if (!Number.isFinite(z) || z <= 1) return 0;
                return Math.min(1, Math.log(z) / Math.log(ZOOM_MAX));
            }

            /**
             * Iteration target like fractal shader (targetIter before smoothing): maxIter + zoom boost.
             * In ORBIT render() does not run — smoothEffectiveMaxIter would freeze; scan/cheap probes use this instead.
             */
            function fractalShaderTargetMaxIter() {
                const depthU = zoomDepthLogUnit(zoom);
                const boostF = (MB_ITER_EFFECTIVE_CAP - maxIter) * 0.9 * depthU;
                return Math.min(MB_ITER_EFFECTIVE_CAP, Math.max(MB_ITER_SLIDER_MIN, Math.round(maxIter + boostF)));
            }

            /**
             * Wheel: damping ~ u³ in log depth u → high zoom (200k→10k) feels slower,
             * near floor still ~4.5% of base step.
             */
            function deepZoomWheelDamp(zoomBefore) {
                const u = zoomDepthLogUnit(zoomBefore);
                if (u <= 0) return 1;
                const MIN_DAMP = 0.045;
                return 1 - (1 - MIN_DAMP) * u * u * u;
            }

            /** Short resets on mouse zoom (small log span), long from flight rows (to ZOOM_MAX). */
            function computeResetDurationMs(fromZ, toZ) {
                const lnFrom = Math.log(Math.max(1, fromZ));
                const lnTo = Math.log(Math.max(1, toZ));
                const span = Math.max(0, lnFrom - lnTo);
                const ref = Math.log(ZOOM_MAX);
                const t = ref > 0 ? Math.min(1, span / ref) : 0;
                return Math.round(RESET_ANIM_MS_MIN + (RESET_ANIM_MS_MAX - RESET_ANIM_MS_MIN) * t);
            }

            function abortResetAnim() {
                if (!resetAnim) return;
                resetAnim = null;
                const br = document.getElementById('btn-reset');
                if (br) br.disabled = false;
            }

            function updateSliderMountVisual(mountId, numericValue) {
                const inp = document.querySelector('#' + mountId + ' input.cyber-slider');
                if (!inp) return;
                const rounded = Math.round(Number(numericValue));
                inp.value = String(rounded);
                const disp = document.querySelector('#' + mountId + ' .val-display');
                if (disp) {
                    if (mountId === 'jx-mount' || mountId === 'jy-mount') {
                        disp.textContent = (rounded / 1000).toFixed(3);
                    } else {
                        disp.textContent = String(rounded);
                    }
                }
            }

            function onFlightMouseSync(e) {
                if (!isFlight) return;
                const p = canvasPixelFromClient(e.clientX, e.clientY);
                flightMouseCanvasX = p.mx;
                flightMouseCanvasY = p.my;
            }

            function tickResetAnim() {
                if (!resetAnim) return;
                const dur = resetAnim.durationMs;
                const rawT = Math.min(1, (performance.now() - resetAnim.t0) / dur);
                const f = resetAnim.from;
                const to = resetAnim.to;
                /** Zoom: ease-out. With large lateral offset decouple pan in time (ease-in-out),
                 * else center and log-zoom feel coupled like swiping through irrelevant regions. */
                const ez = easeOutCubic(rawT);
                const sCan = Math.min(canvas.width, canvas.height);
                const z0 = Math.max(1e-300, f.zoom);
                const z1 = Math.max(1e-300, to.zoom);
                const zMid = Math.sqrt(z0 * z1);
                const cell = 3 / (zMid * Math.max(1, sCan));
                const nd = Math.hypot(canvas.width, canvas.height) / (2 * Math.max(1, sCan));
                const viewDiagC = cell * nd;
                const dc = Math.hypot(to.cx - f.cx, to.cy - f.cy);
                const tinyPan = dc < viewDiagC * 0.065;
                const ep = tinyPan ? ez : easeInOutCubic(rawT);
                centerX = lerp(f.cx, to.cx, ep);
                centerY = lerp(f.cy, to.cy, ep);
                if (f.zoom > 0 && to.zoom > 0 && Number.isFinite(f.zoom) && Number.isFinite(to.zoom)) {
                    zoom = Math.exp(lerp(Math.log(f.zoom), Math.log(to.zoom), ez));
                } else {
                    zoom = lerp(f.zoom, to.zoom, ez);
                }
                zoom = clampZoom(zoom);
                if (fractalUsesCBurnPlane() && mainPlane === 'ORBIT') {
                    juliaX = lerp(f.jx, to.jx, ep);
                    juliaY = lerp(f.jy, to.jy, ep);
                } else if (fractalUsesCBurnPlane()) {
                    juliaX = centerX;
                    juliaY = centerY;
                } else {
                    juliaX = lerp(f.jx, to.jx, ep);
                    juliaY = lerp(f.jy, to.jy, ep);
                }
                maxIter = Math.max(MB_ITER_SLIDER_MIN, Math.min(MB_ITER_SLIDER_MAX, Math.round(lerp(f.mi, to.mi, ep))));
                updateSliderMountVisual('jx-mount', juliaX * 1000);
                updateSliderMountVisual('jy-mount', juliaY * 1000);
                updateSliderMountVisual('iter-mount', maxIter);

                if (rawT >= 1) {
                    centerX = to.cx; centerY = to.cy; zoom = to.zoom;
                    juliaX = to.jx; juliaY = to.jy; maxIter = to.mi;
                    const clearFlight = resetAnim.clearFlightSnapshotOnDone;
                    resetAnim = null;
                    const br = document.getElementById('btn-reset');
                    if (br) br.disabled = false;
                    if (clearFlight) flightSnapshot = null;
                    setRangeInMount('jx-mount', Math.round(to.jx * 1000));
                    setRangeInMount('jy-mount', Math.round(to.jy * 1000));
                    setRangeInMount('iter-mount', to.mi);
                    const uDone = zoomDepthLogUnit(zoom);
                    smoothEffectiveMaxIter = Math.min(
                        MB_ITER_EFFECTIVE_CAP,
                        Math.max(MB_ITER_SLIDER_MIN, maxIter + (MB_ITER_EFFECTIVE_CAP - maxIter) * 0.9 * uDone)
                    );
                    lastEffectiveMaxIter = Math.round(smoothEffectiveMaxIter);
                    persistMandelbrotFractalState();
                }
            }

            function setRangeInMount(mountId, value) {
                const inp = document.querySelector('#' + mountId + ' input.cyber-slider');
                if (!inp) return;
                inp.value = String(value);
                inp.dispatchEvent(new Event('input', { bubbles: true }));
            }

            function formatZoomFactor(z) {
                if (!Number.isFinite(z) || z <= 0) return '1';
                return Math.round(z).toLocaleString('de-DE', { maximumFractionDigits: 0 });
            }

            function syncFraktalReadouts() {
                const d = document.getElementById('readout-detail');
                const zEl = document.getElementById('readout-zoom');
                if (d) {
                    /* Base sliders only in sidebar; zoom boost only in orbit HUD (syncOrbitHud). */
                    d.textContent = String(maxIter);
                }
                if (zEl) zEl.textContent = formatZoomFactor(zoom);
            }

            function syncModeButtonsFromState() {
                const bm = document.getElementById('btn-mode-m');
                const bs = document.getElementById('btn-mode-bs');
                const bj = document.getElementById('btn-mode-j');
                if (!bm || !bs || !bj) return;
                bm.classList.toggle('is-active', mode === 'MANDELBROT');
                bs.classList.toggle('is-active', mode === 'BURNING_SHIP');
                bj.classList.toggle('is-active', mode === 'JULIA');
            }

            function resetView() {
                isFlight = false;
                time = 0;
                orbitLegCount = ORBIT_LEG_DEFAULT;
                mbFormulaOverlayCacheKey = '';
                if (mainPlane === 'ORBIT') syncOrbitHud();
                syncMbFractalFormulaOverlay();
                syncModeButtonsFromState();
                const bf = document.querySelector('#side-panel #btn-flight');
                if (bf) {
                    bf.innerText = CyberI18n.get('fractal.flight_start');
                    bf.classList.remove('is-active');
                }
                zoom = clampZoom(zoom);
                const preserveOrbitC = mainPlane === 'ORBIT';
                const resetCTarget =
                    preserveOrbitC
                        ? { jx: juliaX, jy: juliaY }
                        : { jx: DEF_MB_ORBIT_C_RE, jy: DEF_MB_ORBIT_C_IM };
                let to;
                let clearFlightSnapshotOnDone = false;
                if (flightSnapshot !== null) {
                    to = {
                        cx: flightSnapshot.cx,
                        cy: flightSnapshot.cy,
                        zoom: flightSnapshot.zoom,
                        jx: resetCTarget.jx,
                        jy: resetCTarget.jy,
                        mi: flightSnapshot.mi,
                    };
                    clearFlightSnapshotOnDone = true;
                } else {
                    to =
                        mode === 'JULIA'
                            ? {
                                  cx: DEF_JL_CENTER_X,
                                  cy: DEF_JL_CENTER_Y,
                                  zoom: DEF_JL_ZOOM,
                                  jx: resetCTarget.jx,
                                  jy: resetCTarget.jy,
                                  mi: DEF_MAX_ITER,
                              }
                            : {
                                  cx: DEF_MB_CENTER_X,
                                  cy: DEF_MB_CENTER_Y,
                                  zoom: DEF_MB_ZOOM,
                                  jx: resetCTarget.jx,
                                  jy: resetCTarget.jy,
                                  mi: DEF_MAX_ITER,
                              };
                }
                if (fractalUsesCBurnPlane()) syncMbJuliaSlidersFromFractalCenter();
                const from = { cx: centerX, cy: centerY, zoom, jx: juliaX, jy: juliaY, mi: maxIter };
                resetAnim = {
                    t0: performance.now(),
                    from,
                    to,
                    durationMs: computeResetDurationMs(from.zoom, to.zoom),
                    clearFlightSnapshotOnDone
                };
                const br = document.getElementById('btn-reset');
                if (br) br.disabled = true;
                if (typeof CyberCanvasInstance !== 'undefined' && CyberCanvasInstance.isInitialized) {
                    orbitScanClearAndRestartGrid(CyberCanvasInstance);
                    CyberCanvasInstance.needsRedraw = true;
                }
            }

            function drawFractalOnly() {
                gl.viewport(0, 0, canvas.width, canvas.height);
                gl.bindFramebuffer(gl.FRAMEBUFFER, null);
                gl.useProgram(prg);
                gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
                gl.enableVertexAttribArray(pos);
                gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
                gl.uniform2f(uRes, canvas.width, canvas.height);
                gl.uniform2f(uCenter, centerX, centerY);
                gl.uniform1f(uZoom, zoom);
                gl.uniform1i(uMaxIter, lastEffectiveMaxIter);
                gl.uniform2f(uJuliaC, juliaX, juliaY);
                gl.uniform1f(uTime, time);
                gl.uniform1i(uJulia, mode === 'JULIA' ? 1 : 0);
                gl.uniform1i(uBurning, mode === 'BURNING_SHIP' ? 1 : 0);
                gl.drawArrays(gl.TRIANGLES, 0, 6);
            }

            /**
             * One zoom step like auto-flight: same rel = 0.005·TICK·head, head = 1 − zoomDepthLogUnit.
             * zoomIn false → exact inverse for same rel (one flight tick back).
             */
            function stepZoomFlightLike(mx, my, cw, ch, zoomIn) {
                const zb = clampZoom(zoom);
                if (cw <= 0 || ch <= 0 || !Number.isFinite(zb) || zb <= 0) return;
                const u = zoomDepthLogUnit(zb);
                const head = 1 - u;
                const rel = 0.005 * TICK_VS_LEGACY_60HZ * head;
                const { fX, fY } = focalPlaneUnderCanvasPixel(mx, my, cw, ch, zb, centerX, centerY);
                let next = zoomIn ? zb * (1 + rel) : zb / (1 + rel);
                if (zoomIn && next >= ZOOM_MAX) next = ZOOM_MAX;
                zoom = clampZoom(next);
                const nc = centerKeepingFocalPlane(mx, my, cw, ch, zoom, fX, fY);
                centerX = nc.cx;
                centerY = nc.cy;
            }

            function render(now) {
                requestAnimationFrame(render);
                const ts = typeof now === 'number' ? now : performance.now();

                /** Fraktal-Schleife pausiert ORBIT — Reset-Animation läuft trozdem (sonst tut RESET nichts). */
                if (resetAnim) tickResetAnim();

                if (fractalRenderPaused) return;

                if (lastRenderFrameTs !== 0 && ts - lastRenderFrameTs < RENDER_FRAME_MS) return;
                lastRenderFrameTs = ts;

                const w = canvas.clientWidth, h = canvas.clientHeight;
                if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h); }
                zoom = clampZoom(zoom);
                if (isFlight) {
                    /* Auto-zoom like wheel: same world point under cursor stays stable (flightMouse = pointer). */
                    const cw = canvas.width;
                    const ch = canvas.height;
                    const s = Math.min(cw, ch);
                    const mx = flightMouseCanvasX != null ? flightMouseCanvasX : cw / 2;
                    const my = flightMouseCanvasY != null ? flightMouseCanvasY : ch / 2;

                    if (zoom >= ZOOM_MAX) {
                        zoom = ZOOM_MAX;
                        stopFlightUi();
                    } else if (s > 0 && Number.isFinite(zoom) && zoom > 0) {
                        stepZoomFlightLike(mx, my, cw, ch, true);
                        if (zoom >= ZOOM_MAX) stopFlightUi();
                    }
                    zoom = clampZoom(zoom);
                }
                zoom = clampZoom(zoom);
                if (isFlight && zoom >= ZOOM_MAX) stopFlightUi();

                zoom = clampZoom(zoom);
                const depthU = zoomDepthLogUnit(zoom);
                const boostF = (MB_ITER_EFFECTIVE_CAP - maxIter) * 0.9 * depthU;
                const targetIter = Math.min(MB_ITER_EFFECTIVE_CAP, Math.max(MB_ITER_SLIDER_MIN, maxIter + boostF));
                const tau = 0.14 * TICK_VS_LEGACY_60HZ;
                smoothEffectiveMaxIter += (targetIter - smoothEffectiveMaxIter) * tau;
                smoothEffectiveMaxIter = Math.min(MB_ITER_EFFECTIVE_CAP, Math.max(MB_ITER_SLIDER_MIN, smoothEffectiveMaxIter));
                lastEffectiveMaxIter = Math.round(smoothEffectiveMaxIter);

                time += 0.004 * TICK_VS_LEGACY_60HZ;

                if (fractalUsesCBurnPlane() && isFlight) syncMbJuliaSlidersFromFractalCenter();

                drawFractalOnly();
                syncFraktalReadouts();
                if (isFlight) schedulePersistMandelbrotFractalState();
            }

            CyberUI.createCard('ui-container', CyberI18n.get('fractal.mode'), `
                <div class="fraktal-seg-row">
                    <button type="button" id="btn-mode-m" class="fraktal-seg-btn">${CyberI18n.get('fractal.mandelbrot')}</button>
                    <button type="button" id="btn-mode-bs" class="fraktal-seg-btn">${CyberI18n.get('fractal.burning_ship')}</button>
                    <button type="button" id="btn-mode-j" class="fraktal-seg-btn">${CyberI18n.get('fractal.julia')}</button>
                </div>
                <div style="margin:14px 0 6px;font-size:0.65rem;letter-spacing:0.14em;color:rgba(180,210,235,0.82);">${CyberI18n.get('fractal.display')}</div>
                <div class="fraktal-seg-row">
                    <button type="button" id="btn-plane-fractal" class="fraktal-seg-btn">${CyberI18n.get('fractal.plane_fractal')}</button>
                    <button type="button" id="btn-plane-orbit" class="fraktal-seg-btn is-active">${CyberI18n.get('fractal.plane_orbit')}</button>
                </div>
                <div id="orbit-sidebar-worked-wrap" class="orbit-sidebar-worked-wrap" hidden>
                    <label class="cyber-checkbox-wrapper" style="margin-top:12px;margin-bottom:0">
                        <input type="checkbox" id="orbit-show-worked-checkbox" class="cyber-checkbox" checked />
                        <span class="cyber-label">${CyberI18n.get('fractal.orbit_show_worked')}</span>
                    </label>
                </div>
            `, 'var(--neon-blue)');

            CyberUI.createCard('ui-container', CyberI18n.get('fractal.params'), `
                <div id="jx-mount"></div>
                <div id="jy-mount" style="margin-top:2px;"></div>
                <div id="iter-mount" style="margin-top:2px;"></div>
                <div id="fraktal-readouts-mount" class="stats-grid fraktal-readouts">
                    <div class="stats-card">
                        <span class="stats-label">${CyberI18n.get('fractal.detail')}</span>
                        <span id="readout-detail" class="stats-val">500</span>
                    </div>
                    <div class="stats-card">
                        <span class="stats-label">${CyberI18n.get('fractal.zoom')}</span>
                        <span id="readout-zoom" class="stats-val">1</span>
                    </div>
                </div>
            `, 'var(--neon-blue)');

            const fmtJuliaSliderPlane = (raw) => (Number(raw) / 1000).toFixed(3);

            CyberUI.createSlider('jx-mount', CyberI18n.get('fractal.real'), -2000, 2000, -800, 1, (v) => {
                abortResetAnim();
                juliaX = v / 1000;
                syncMbFractalCenterFromJuliaSliders();
                persistMandelbrotFractalState();
            }, 'var(--neon-blue)', fmtJuliaSliderPlane);

            CyberUI.createSlider('jy-mount', CyberI18n.get('fractal.imaginary'), -2000, 2000, 156, 1, (v) => {
                abortResetAnim();
                juliaY = v / 1000;
                syncMbFractalCenterFromJuliaSliders();
                persistMandelbrotFractalState();
            }, 'var(--neon-blue)', fmtJuliaSliderPlane);

            CyberUI.createSlider('iter-mount', CyberI18n.get('fractal.iterations'), MB_ITER_SLIDER_MIN, MB_ITER_SLIDER_MAX, DEF_MAX_ITER, 1, (v) => {
                abortResetAnim();
                maxIter = parseInt(v, 10);
                const u = zoomDepthLogUnit(zoom);
                smoothEffectiveMaxIter = Math.min(
                    MB_ITER_EFFECTIVE_CAP,
                    Math.max(MB_ITER_SLIDER_MIN, maxIter + (MB_ITER_EFFECTIVE_CAP - maxIter) * 0.9 * u)
                );
                persistMandelbrotFractalState();
            }, 'var(--neon-blue)');

            CyberUI.createCard('ui-container', CyberI18n.get('fractal.navigation'), `
                <div class="fraktal-seg-row">
                    <button type="button" id="btn-flight" class="fraktal-seg-btn" disabled>${CyberI18n.get('fractal.flight_start')}</button>
                    <button type="button" id="btn-reset" class="fraktal-seg-btn">${CyberI18n.get('fractal.reset')}</button>
                </div>
            `, 'var(--neon-blue)');

            document.getElementById('btn-mode-m').onclick = () => {
                mode = 'MANDELBROT';
                syncMbFractalCenterFromJuliaSliders();
                mbFormulaOverlayCacheKey = '';
                syncModeButtonsFromState();
                persistMandelbrotFractalState();
                syncMbFractalFormulaOverlay();
                syncOrbitMbWorkedExample();
            };
            document.getElementById('btn-mode-bs').onclick = () => {
                mode = 'BURNING_SHIP';
                syncMbFractalCenterFromJuliaSliders();
                mbFormulaOverlayCacheKey = '';
                syncModeButtonsFromState();
                persistMandelbrotFractalState();
                syncMbFractalFormulaOverlay();
                syncOrbitMbWorkedExample();
            };
            document.getElementById('btn-mode-j').onclick = () => {
                mode = 'JULIA';
                juliaX = DEF_JULIA_C_RE;
                juliaY = DEF_JULIA_C_IM;
                updateSliderMountVisual('jx-mount', Math.round(juliaX * 1000));
                updateSliderMountVisual('jy-mount', Math.round(juliaY * 1000));
                mbFormulaOverlayCacheKey = '';
                syncModeButtonsFromState();
                persistMandelbrotFractalState();
                syncMbFractalFormulaOverlay();
                syncOrbitMbWorkedExample();
            };
            syncModeButtonsFromState();

            document.getElementById('btn-plane-fractal').onclick = () => setMainPlane('FRACTAL');
            document.getElementById('btn-plane-orbit').onclick = () => setMainPlane('ORBIT');

            const orbitShowWorkedEl = document.getElementById('orbit-show-worked-checkbox');
            if (orbitShowWorkedEl) {
                orbitShowWorkedEl.addEventListener('change', () => {
                    orbitShowWorkedCalc = !!orbitShowWorkedEl.checked;
                    persistMandelbrotOrbitShowWorkedCalc();
                    mbFormulaOverlayCacheKey = '';
                    syncMbFractalFormulaOverlay();
                    syncMbOrbitStableCountPanel();
                    syncOrbitMbWorkedExample();
                });
            }

            const btnFlightEl = document.querySelector('#side-panel #btn-flight');
            if (btnFlightEl) {
                btnFlightEl.onclick = () => {
                    if (mainPlane !== 'FRACTAL') return;
                    isFlight = !isFlight;
                    btnFlightEl.innerText = isFlight ? CyberI18n.get('fractal.flight_stop') : CyberI18n.get('fractal.flight_start');
                    btnFlightEl.classList.toggle('is-active', isFlight);
                    if (isFlight) {
                        flightSnapshot = {
                            cx: centerX,
                            cy: centerY,
                            zoom: clampZoom(zoom),
                            jx: fractalUsesCBurnPlane() ? centerX : juliaX,
                            jy: fractalUsesCBurnPlane() ? centerY : juliaY,
                            mi: maxIter,
                        };
                        const w = canvas.width, h = canvas.height;
                        flightMouseCanvasX = w > 0 ? w / 2 : null;
                        flightMouseCanvasY = h > 0 ? h / 2 : null;
                        isDrag = false;
                    } else {
                        persistMandelbrotFractalState();
                    }
                };
            }

            /** True only for real text/number inputs — not range sliders (↑/↓ otherwise swallowed by browser). */
            function keyboardTypingCapturesArrows(target) {
                if (!target || !target.closest) return false;
                if (target.closest('textarea, select, [contenteditable="true"]')) return true;
                const inp = target.closest('input');
                if (!inp) return false;
                const typ = String(inp.type || 'text').toLowerCase();
                return typ !== 'range';
            }

            /** capture: true → preventDefault before native range/browser arrow-key handling. */
            window.addEventListener(
                'keydown',
                (e) => {
                    const t = e.target;
                    const inField = t && t.closest && t.closest('input, textarea, select, [contenteditable="true"]');

                    if (
                        !keyboardTypingCapturesArrows(t) &&
                        mainPlane === 'ORBIT' &&
                        (e.key === 'd' || e.key === 'D') &&
                        (e.metaKey || e.ctrlKey) &&
                        !e.altKey &&
                        !e.shiftKey
                    ) {
                        e.preventDefault();
                        toggleOrbitHudVisible();
                        return;
                    }

                    const arrowUp = e.code === 'ArrowUp' || e.key === 'ArrowUp';
                    const arrowDown = e.code === 'ArrowDown' || e.key === 'ArrowDown';
                    if (arrowUp || arrowDown) {
                        if (keyboardTypingCapturesArrows(t)) return;
                        if (mainPlane === 'ORBIT') {
                            e.preventDefault();
                            const step = e.shiftKey ? 5 : 1;
                            orbitLegCount += arrowUp ? step : -step;
                            orbitLegCount = clampOrbitLegCount(orbitLegCount);
                            if (typeof CyberCanvasInstance !== 'undefined' && CyberCanvasInstance.isInitialized) {
                                CyberCanvasInstance.needsRedraw = true;
                            }
                            return;
                        }
                        if (mainPlane !== 'FRACTAL') return;
                        e.preventDefault();
                        applyKeyedZoom(arrowUp);
                        return;
                    }

                    if (e.code !== 'Space' && e.key !== ' ') return;
                    if (inField) return;
                    if (t && t.closest && t.closest('button')) return;
                    if (mainPlane === 'ORBIT') {
                        if (e.repeat) return;
                        e.preventDefault();
                        toggleOrbitScan();
                        return;
                    }
                    if (mainPlane !== 'FRACTAL') return;
                    e.preventDefault();
                    btnFlightEl?.click();
                },
                true
            );
            window.addEventListener('mousemove', onFlightMouseSync, { passive: true });
            window.addEventListener('pointermove', onFlightMouseSync, { passive: true });
            canvas.addEventListener('mousemove', (e) => {
                const p = canvasPixelFromClient(e.clientX, e.clientY);
                flightMouseCanvasX = p.mx;
                flightMouseCanvasY = p.my;
            });
            document.getElementById('btn-reset').onclick = () => resetView();
            let isDrag = false;
            let dragLastCanvas = null;
            canvas.onmousedown = (e) => {
                abortResetAnim();
                if (isFlight) return;
                isDrag = true;
                dragLastCanvas = canvasPixelFromClient(e.clientX, e.clientY);
            };
            window.onmousemove = (e) => {
                if (isFlight) return;
                if (!isDrag || !dragLastCanvas) return;
                const cur = canvasPixelFromClient(e.clientX, e.clientY);
                const dx = cur.mx - dragLastCanvas.mx;
                const dy = cur.my - dragLastCanvas.my;
                dragLastCanvas = cur;
                const s = Math.min(canvas.width, canvas.height);
                centerX -= (dx / s / zoom) * 3;
                centerY += (dy / s / zoom) * 3;
            };
            window.onmouseup = () => {
                if (isDrag) {
                    syncMbJuliaSlidersFromFractalCenter();
                    schedulePersistMandelbrotFractalState();
                }
                isDrag = false;
                dragLastCanvas = null;
            };

            /** Same logic as render(): backing store from layout — else ↑/↓ zoom fails before first frame (e.g. orbit only). */
            function ensureMbFractalGlBufferSized() {
                const w = canvas.clientWidth, h = canvas.clientHeight;
                if (w <= 0 || h <= 0) return false;
                if (canvas.width !== w || canvas.height !== h) {
                    canvas.width = w;
                    canvas.height = h;
                    gl.viewport(0, 0, w, h);
                }
                return true;
            }

            /** Arrow up/down: zoom like wheel (deltaY), point under cursor/center stays stable. */
            function applyKeyedZoom(zoomIn) {
                abortResetAnim();
                if (!ensureMbFractalGlBufferSized()) return;
                const w = canvas.width;
                const h = canvas.height;
                if (w <= 0 || h <= 0) return;
                let mx = flightMouseCanvasX != null ? flightMouseCanvasX : w / 2;
                let my = flightMouseCanvasY != null ? flightMouseCanvasY : h / 2;
                if (isFlight) {
                    flightMouseCanvasX = mx;
                    flightMouseCanvasY = my;
                }
                stepZoomFlightLike(mx, my, w, h, zoomIn);
                syncMbJuliaSlidersFromFractalCenter();

                drawFractalOnly();
                schedulePersistMandelbrotFractalState();
            }

            /**
             * Wheel / trackpad: zoom proportional to deltaY (gentler than fixed factor per event).
             * ctrlKey ≈ pinch-zoom on macOS; deltaMode respects line/page quantization.
             */
            canvas.addEventListener(
                'wheel',
                (e) => {
                    e.preventDefault();
                    abortResetAnim();
                    const w = canvas.width;
                    const h = canvas.height;
                    const { mx, my } = canvasPixelFromClient(e.clientX, e.clientY);
                    if (isFlight) {
                        flightMouseCanvasX = mx;
                        flightMouseCanvasY = my;
                    }
                    const { fX, fY } = focalPlaneUnderCanvasPixel(mx, my, w, h, zoom, centerX, centerY);

                    let dz = -e.deltaY;
                    if (e.deltaMode === 1) dz *= 16;
                    else if (e.deltaMode === 2) dz *= Math.max(320, Math.min(w, h)) / 12;

                    let sensitivity = e.shiftKey ? 0.00032 : 0.00105;
                    if (e.ctrlKey) sensitivity *= 1.45;

                    const damp = deepZoomWheelDamp(zoom);
                    let factor = Math.exp(dz * sensitivity * damp);

                    const cap = e.shiftKey ? 1.018 : e.ctrlKey ? 1.11 : 1.092;
                    factor = Math.max(1 / cap, Math.min(cap, factor));

                    zoom *= factor;
                    zoom = clampZoom(zoom);
                    const nc = centerKeepingFocalPlane(mx, my, w, h, zoom, fX, fY);
                    centerX = nc.cx;
                    centerY = nc.cy;
                    syncMbJuliaSlidersFromFractalCenter();
                    schedulePersistMandelbrotFractalState();
                },
                { passive: false }
            );

            canvas.addEventListener('touchstart', (e) => {
                if (e.touches.length !== 2) return;
                abortResetAnim();
                const a = e.touches[0];
                const b = e.touches[1];
                pinchStartDist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
                if (pinchStartDist < 8) return;
                pinchStartZoom = zoom;
                const cx = (a.clientX + b.clientX) / 2;
                const cy = (a.clientY + b.clientY) / 2;
                const w = canvas.width;
                const h = canvas.height;
                const { mx, my } = canvasPixelFromClient(cx, cy);
                pinchAnchor = {
                    mx,
                    my,
                    ...focalPlaneUnderCanvasPixel(mx, my, w, h, zoom, centerX, centerY),
                };
            }, { passive: true });

            canvas.addEventListener(
                'touchmove',
                (e) => {
                    if (e.touches.length !== 2 || !pinchAnchor || pinchStartDist < 8) return;
                    e.preventDefault();
                    const a = e.touches[0];
                    const b = e.touches[1];
                    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
                    let ratio = d / pinchStartDist;
                    ratio = Math.max(0.25, Math.min(4, ratio));
                    zoom = clampZoom(pinchStartZoom * ratio);
                    const { mx, my, fX, fY } = pinchAnchor;
                    const w = canvas.width;
                    const h = canvas.height;
                    const nc = centerKeepingFocalPlane(mx, my, w, h, zoom, fX, fY);
                    centerX = nc.cx;
                    centerY = nc.cy;
                },
                { passive: false }
            );

            canvas.addEventListener('touchend', () => {
                const hadPinch = pinchAnchor != null && pinchStartDist >= 8;
                pinchAnchor = null;
                pinchStartDist = 0;
                if (hadPinch) {
                    syncMbJuliaSlidersFromFractalCenter();
                    schedulePersistMandelbrotFractalState();
                }
            });

            function loadMandelbrotFractalPersist() {
                try {
                    const m = localStorage.getItem(LS_MB_MODE);
                    if (m === 'MANDELBROT' || m === 'JULIA' || m === 'BURNING_SHIP') mode = m;

                    const rf = (key, fb) => {
                        const s = localStorage.getItem(key);
                        if (s == null || s === '') return fb;
                        const x = parseFloat(s);
                        return Number.isFinite(x) ? x : fb;
                    };
                    const ri = (key, fb, lo, hi) => {
                        const s = localStorage.getItem(key);
                        if (s == null || s === '') return fb;
                        const n = parseInt(s, 10);
                        if (!Number.isFinite(n)) return fb;
                        return Math.max(lo, Math.min(hi, n));
                    };

                    centerX = rf(LS_MB_CENTER_X, centerX);
                    centerY = rf(LS_MB_CENTER_Y, centerY);
                    zoom = clampZoom(rf(LS_MB_ZOOM, zoom));
                    maxIter = ri(LS_MB_MAX_ITER, maxIter, MB_ITER_SLIDER_MIN, MB_ITER_SLIDER_MAX);

                    const u = zoomDepthLogUnit(zoom);
                    smoothEffectiveMaxIter = Math.min(
                        MB_ITER_EFFECTIVE_CAP,
                        Math.max(MB_ITER_SLIDER_MIN, maxIter + (MB_ITER_EFFECTIVE_CAP - maxIter) * 0.9 * u)
                    );
                    lastEffectiveMaxIter = Math.round(smoothEffectiveMaxIter);

                    syncModeButtonsFromState();
                    updateSliderMountVisual('jx-mount', Math.round(juliaX * 1000));
                    updateSliderMountVisual('jy-mount', Math.round(juliaY * 1000));
                    updateSliderMountVisual('iter-mount', maxIter);
                    mbFormulaOverlayCacheKey = '';
                    if (fractalUsesCBurnPlane()) syncMbFractalCenterFromJuliaSliders();
                    syncFraktalReadouts();
                } catch (e) {
                    /* ignore */
                }
            }

            window.addEventListener('beforeunload', () => {
                persistMandelbrotFractalState();
            });

            loadOrbitWorkedBoxPos();
            initOrbitWorkedBoxDragOnce();

            const startPlane = loadMandelbrotPersist();
            loadMandelbrotFractalPersist();
            if (orbitShowWorkedEl) orbitShowWorkedEl.checked = orbitShowWorkedCalc;
            syncOrbitSidebarWorkedCheckboxMount();
            setMainPlane(startPlane === 'FRACTAL' ? 'FRACTAL' : 'ORBIT');
            render();
        });
})();
    </script>
</body>
