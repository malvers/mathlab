<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="forloop.mandelbrot.panel" content="554">
    <title>DOC ALVERS MATHE-LABORE | Fraktale · Mandelbrot & Julia</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="js/cyber-layout.css">
    <link rel="stylesheet" href="js/buttons-ultra.css">
    <link rel="stylesheet" href="js/cyber-lab-overrides.css">
    <link rel="stylesheet" href="js/branding.styles.extracted.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">

    <style>
        :root {
            --cyber-left-natural-w: 426px; /* 66px rail + 360px sidebar */
        }

        body.cyber-shell-grid #cyber-left-chrome-inner {
            grid-template-columns: 66px 360px !important;
        }

        #main-content {
            background: #000;
            /* Flex: fills remaining width like multiplikation.html — avoids visible stripe on the right */
            flex: 1 1 0% !important;
            min-width: 0 !important;
            min-height: 0 !important;
            /* Worked-example box (#orbit-mb-worked): vertical slot under masthead / formula lane */
            --mb-orbit-worked-top: calc(var(--cyber-nav-band-top, 14px) + clamp(64px, 11.5vmin, 102px));
        }

        /* Sidebar: global 350px + 10px in this lab only */
        #side-panel:not(.collapsed) {
            width: 360px !important;
            min-width: 360px !important;
        }

        /* Same as multiplikation.html — colors/glass */
        #side-panel {
            background: rgba(10, 20, 36, 0.75);
            border: none;
            border-right: 1px solid rgba(0, 210, 255, 0.28);
            backdrop-filter: blur(28px);
            align-items: stretch !important;
        }

        #side-panel #ui-container {
            width: 100% !important;
            max-width: none !important;
            align-self: stretch !important;
        }

        #side-panel .instrument-card {
            background: rgba(255, 255, 255, 0.055);
            border-color: rgba(0, 210, 255, 0.32);
            box-shadow: 0 0 18px rgba(0, 180, 220, 0.07);
            width: 100% !important;
            max-width: none !important;
            box-sizing: border-box !important;
            margin-bottom: 12px;
        }

        #side-panel .instrument-card:last-child {
            margin-bottom: 6px;
        }

        #side-panel .instrument-title {
            color: rgba(0, 210, 255, 0.92) !important;
            text-shadow: 0 0 12px rgba(0, 210, 255, 0.35) !important;
        }

        /* Numbers only in sidebar — no canvas HUD */
        /* Top icon row: no separate shrink sizing — size comes from cyber-lab-overrides.css (52×52). */
        #sidebar-header .cyber-nav {
            margin: 0 0 6px 0 !important;
            gap: 6px !important;
        }

        /* Sidebar: centered layout (cyber-lab-overrides + even cards) */
        #ui-container {
            min-height: 0;
        }

        /* Two-way rows like lissajous.html (#grp-view · lissajous-view-btn), not oversized pill layout */
        #side-panel .fraktal-seg-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 0;
            width: 100%;
            box-sizing: border-box;
        }

        #side-panel .fraktal-seg-btn {
            flex: 1;
            min-width: 118px;
            box-sizing: border-box;
            margin: 0;
            padding: 8px 10px;
            font-family: Orbitron, sans-serif;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            line-height: 1.2;
            border-radius: 10px;
            cursor: pointer;
            outline: none;
            background: rgba(16, 30, 52, 0.9);
            border: 1px solid rgba(90, 200, 230, 0.38);
            color: #d4eefc;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        #side-panel .fraktal-seg-btn:hover:not(:disabled) {
            border-color: rgba(120, 220, 255, 0.55);
            background: rgba(20, 38, 62, 0.95);
        }

        #side-panel .fraktal-seg-btn.is-active {
            border-color: rgba(0, 210, 255, 0.9);
            box-shadow: 0 0 16px rgba(0, 210, 255, 0.3);
            color: #f0fdff;
            background: rgba(0, 210, 255, 0.14);
        }

        #side-panel .fraktal-seg-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        #side-panel .stats-grid.fraktal-readouts {
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 8px;
            margin-top: 12px;
        }

        #side-panel .fraktal-readouts .stats-card {
            min-width: 0;
        }

        #side-panel .fraktal-readouts .stats-val {
            font-size: 0.72rem;
            line-height: 1.25;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        /* FRACTAL PARAMS: buttons-ultra sets .cyber-control-group margin-top:15px — tighten heavily here */
        #side-panel .instrument-card:has(#jx-mount) #jx-mount > .cyber-control-group:first-child {
            margin-top: 0 !important;
        }

        #side-panel .instrument-card:has(#jx-mount) .cyber-control-group {
            margin-top: 2px !important;
            margin-bottom: 0 !important;
        }

        #side-panel .instrument-card:has(#jx-mount) .control-header {
            margin-bottom: 1px !important;
            line-height: 1.15 !important;
        }

        #side-panel .instrument-card:has(#jx-mount) .cyber-slider {
            margin-top: 2px !important;
            margin-bottom: 2px !important;
        }

        /* Box 1 (KaTeX |z²|/N): left; Box 2 (stable c): plot center — shared row, full width */
        .mb-fractal-formula-overlay {
            position: absolute;
            left: 0;
            right: 0;
            width: 100%;
            max-width: none;
            transform: none;
            top: var(--cyber-nav-band-top, 14px);
            z-index: 6;
            pointer-events: none;
            box-sizing: border-box;
        }

        .mb-fractal-formula-overlay[hidden] {
            display: none !important;
        }

        .mb-fractal-formula-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: stretch;
            width: 100%;
            min-height: 52px;
            gap: 10px;
            box-sizing: border-box;
        }

        /* Same row height (stretch); KaTeX box in left column */
        .mb-fractal-formula-row > .mb-fractal-formula-box:not(.mb-fractal-stable-panel) {
            grid-column: 1;
            justify-self: start;
            align-self: stretch;
            margin-left: clamp(12px, 2.5vw, 28px);
            display: flex;
            align-items: center;
        }

        /* Stable c: middle column (centered in plot) */
        .mb-fractal-formula-row > #mb-fractal-stable-panel.mb-fractal-stable-panel {
            grid-column: 2;
            justify-self: center;
            align-self: stretch;
            transform: none;
            display: flex;
            align-items: center;
        }

        /* display:flex wins over [hidden] — otherwise empty bordered box stayed visible */
        .mb-fractal-formula-row > #mb-fractal-stable-panel.mb-fractal-stable-panel[hidden] {
            display: none !important;
        }

        .mb-fractal-stable-panel .mb-fractal-stable-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            width: 100%;
            min-width: 124px;
            text-align: center;
            box-sizing: border-box;
        }

        .mb-fractal-formula-row #mb-fractal-stable-panel .mb-fractal-stable-inner {
            height: 100%;
            min-height: 0;
        }

        /* Overrides global cyber-lab-overrides.css (justify-content:flex-start !important) */
        .mb-fractal-stable-panel #mb-fractal-stable-widget.cyber-number-widget {
            justify-content: center !important;
            width: fit-content !important;
            max-width: 100%;
            margin-left: auto !important;
            margin-right: auto !important;
            align-items: center !important;
            flex-wrap: wrap !important;
        }

        /* cyber-lab-overrides: digits default cyan !important — fixed gold for top panel only */
        .mb-fractal-stable-panel #mb-fractal-stable-widget .cyber-digit-box {
            color: #f2bb44 !important;
            text-shadow: 0 0 12px rgba(242, 187, 68, 0.48) !important;
        }

        #mb-fractal-stable-widget {
            align-self: center;
        }

        .mb-fractal-stable-label {
            font-family: Orbitron, sans-serif;
            font-size: 0.52rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(0, 210, 255, 0.94);
            text-shadow: 0 0 12px rgba(0, 210, 255, 0.38);
            line-height: 1.2;
            max-width: 11rem;
        }

        .mb-fractal-stable-note {
            font-family: Orbitron, system-ui, sans-serif;
            font-size: 0.47rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            line-height: 1.35;
            color: rgba(186, 214, 235, 0.92);
            text-shadow: 0 0 8px rgba(0, 210, 255, 0.22);
            max-width: min(17rem, 86vw);
            margin-top: 2px;
            white-space: pre-line;
        }
        /* KaTeX: readable; min ~ button height, box grows with formula */
        .mb-fractal-formula-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            min-height: clamp(44px, 10vmin, 52px);
            height: auto;
            padding: clamp(6px, 1.8vmin, 10px) clamp(10px, 2.8vmin, 18px);
            background: rgba(6, 14, 28, 0.9);
            border-radius: 12px;
            border: 0.5px solid rgba(242, 187, 68, 0.48);
            box-shadow:
                0 0 16px rgba(242, 187, 68, 0.14),
                0 0 22px rgba(0, 210, 255, 0.08);
        }

        #canvas-container .mb-fractal-formula-box .katex-display {
            margin: 0 !important;
        }

        /* Orbit |z²|/N: Kasten nur so breit wie Inhalt — max. 368px / volle Plotbreite kleiner davon */
        #mb-fractal-formula-panel.mb-fractal-formula-panel--orbit-metrics {
            box-sizing: border-box;
            width: fit-content;
            max-width: min(368px, calc(100% - 20px));
            min-width: 0;
            min-height: 52px;
            padding: clamp(8px, 2vmin, 11px) clamp(12px, 3.2vmin, 22px);
            flex-shrink: 1;
            justify-content: flex-start;
            align-items: center;
            contain: layout style;
            border-radius: 999px;
            background: linear-gradient(
                165deg,
                rgba(16, 28, 52, 0.94) 0%,
                rgba(7, 14, 30, 0.86) 48%,
                rgba(10, 22, 42, 0.92) 100%
            );
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(242, 187, 68, 0.45);
            box-shadow:
                0 0 0 1px rgba(0, 210, 255, 0.12) inset,
                0 1px 0 rgba(255, 255, 255, 0.05) inset,
                0 12px 36px rgba(0, 0, 0, 0.58),
                0 0 32px rgba(0, 210, 255, 0.14),
                0 0 52px rgba(242, 187, 68, 0.09);
        }

        /* FRACTAL: compact box around main row (no extra empty space like orbit |z²|/N tile) */
        #mb-fractal-formula-panel.mb-fractal-formula-panel--fractal-banner {
            box-sizing: border-box;
            width: fit-content;
            max-width: min(560px, calc(100% - 20px));
            min-width: 0;
            min-height: 52px;
            padding: 8px 14px;
            flex-shrink: 0;
            justify-content: flex-start;
            align-items: center;
            contain: layout style;
        }

        #mb-fractal-formula-panel.mb-fractal-formula-panel--orbit-metrics #mb-fractal-formula-tex,
        #mb-fractal-formula-panel.mb-fractal-formula-panel--fractal-banner #mb-fractal-formula-tex {
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            min-height: 2.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #mb-fractal-formula-panel.mb-fractal-formula-panel--orbit-metrics #mb-fractal-formula-tex {
            width: auto;
            max-width: 100%;
            min-height: 0;
            justify-content: flex-start;
            text-align: left;
        }

        /* Orbit/scan: |z²| und N nebeneinander mit Gap — keine künstliche Pillenbreite */
        #mb-fractal-formula-panel.mb-fractal-formula-panel--orbit-metrics
            #mb-fractal-formula-tex.mb-fractal-mz-split {
            position: relative;
            display: inline-flex;
            flex-direction: row;
            flex-wrap: nowrap;
            align-items: baseline;
            gap: clamp(0.55rem, 2vmin, 1rem);
            justify-content: flex-start;
            text-align: left;
        }

        #mb-fractal-formula-tex.mb-fractal-mz-split .mb-fractal-mz-z2 {
            display: inline-block;
            vertical-align: middle;
            text-align: left;
            flex-shrink: 0;
        }

        #mb-fractal-formula-tex.mb-fractal-mz-split .mb-fractal-mz-n {
            position: static;
            transform: none;
            left: auto;
            top: auto;
            white-space: nowrap;
            display: inline-block;
            vertical-align: middle;
            flex-shrink: 0;
        }

        #mb-fractal-formula-tex.mb-fractal-mz-split .mb-fractal-mz-spd {
            white-space: nowrap;
            display: inline-block;
            vertical-align: middle;
            flex-shrink: 0;
        }

        #mb-fractal-formula-tex.mb-fractal-mz-split .mb-fractal-mz-spd .katex {
            text-shadow: none !important;
        }

        /* μ-Zeile: lesbar ohne Fraktal-Palette (Parent `.katex` erzwingt sonst Gold + \textcolor verliert gegen !important). */
        #canvas-container
            #mb-fractal-formula-panel.mb-fractal-formula-panel--orbit-metrics
            #mb-fractal-formula-tex.mb-fractal-mz-split
            .mb-fractal-mz-spd--white
            .katex {
            color: #f8faff !important;
            text-shadow: none !important;
            filter: none !important;
        }

        #canvas-container
            #mb-fractal-formula-panel.mb-fractal-formula-panel--orbit-metrics
            #mb-fractal-formula-tex.mb-fractal-mz-split
            .mb-fractal-mz-spd--muted
            .katex {
            color: #94a3b8 !important;
            text-shadow: none !important;
            filter: none !important;
        }

        /* FRACTAL main row left-aligned; width follows KaTeX */
        #mb-fractal-formula-panel.mb-fractal-formula-panel--fractal-banner #mb-fractal-formula-tex:not(.mb-fractal-mz-split) {
            justify-content: flex-start;
            text-align: left;
            width: auto;
            min-width: 0;
        }

        #canvas-container #mb-fractal-formula-panel.mb-fractal-formula-panel--orbit-metrics .katex-display,
        #canvas-container #mb-fractal-formula-panel.mb-fractal-formula-panel--fractal-banner .katex-display {
            margin-left: auto !important;
            margin-right: auto !important;
        }

        #canvas-container #mb-fractal-formula-panel.mb-fractal-formula-panel--orbit-metrics .katex-display {
            margin-left: 0 !important;
            margin-right: 0 !important;
        }

        #canvas-container
            #mb-fractal-formula-panel.mb-fractal-formula-panel--fractal-banner
            #mb-fractal-formula-tex:not(.mb-fractal-mz-split)
            .katex-display {
            margin-left: 0 !important;
            margin-right: auto !important;
        }

        #canvas-container #mb-fractal-formula-tex .katex {
            font-size: clamp(0.88rem, 0.55rem + 1.8vmin, 1.38rem) !important;
            color: #f2bb44 !important;
            text-shadow:
                0 0 14px rgba(242, 187, 68, 0.42),
                0 0 26px rgba(255, 228, 170, 0.18);
            line-height: 1.2 !important;
        }

        #canvas-container
            #mb-fractal-formula-panel.mb-fractal-formula-panel--orbit-metrics
            #mb-fractal-formula-tex
            .katex {
            font-size: clamp(0.86rem, 0.52rem + 1.75vmin, 1.34rem) !important;
            text-shadow:
                0 0 20px rgba(242, 187, 68, 0.38),
                0 0 38px rgba(0, 210, 255, 0.14),
                0 1px 2px rgba(0, 0, 0, 0.5);
            filter: drop-shadow(0 0 1px rgba(0, 0, 0, 0.35));
        }

        /* Main WebGL: hide in orbit view (CyberCanvas stacks above) */
        #canvas-container #canvas.mb-fractal-view-hidden {
            visibility: hidden;
            pointer-events: none;
        }

        .orbit-view-wrap {
            position: absolute;
            inset: 0;
            z-index: 4;
            background: #050b18;
        }

        .orbit-view-wrap[hidden] {
            display: none !important;
        }

        /** KaTeX labels at orbit (HTML over canvas — no canvas LaTeX). */
        .orbit-point-katex {
            position: absolute;
            left: 0;
            top: 0;
            margin: 0;
            padding: 2px 8px;
            pointer-events: none;
            z-index: 6;
            max-width: min(96%, 440px);
            background: rgba(5, 12, 24, 0.72);
            border-radius: 8px;
            border: 1px solid rgba(0, 210, 255, 0.35);
            box-shadow: 0 0 16px rgba(0, 0, 0, 0.45);
            transform-origin: 0 0;
        }

        .orbit-point-katex--c {
            transform: scale(0.6);
            color: rgba(248, 250, 255, 0.96);
            border-color: rgba(168, 85, 247, 0.48) !important;
            text-shadow: 0 0 10px rgba(167, 85, 247, 0.38);
        }

        .orbit-point-katex--waypoint {
            transform: scale(0.6);
            z-index: 5;
        }

        .orbit-point-katex[hidden],
        .orbit-point-katex--hidden {
            display: none !important;
        }

        #orbit-view-wrap .orbit-point-katex.orbit-point-katex--waypoint .katex {
            font-size: clamp(1.02rem, 0.74rem + 1.95vmin, 1.72rem) !important;
            /* kein Farb-!important — \textcolor{…}{z} in KaTeX muss wirken */
            color: rgba(248, 250, 255, 0.96);
            text-shadow:
                0 0 14px rgba(0, 210, 255, 0.28),
                0 0 24px rgba(0, 0, 0, 0.25);
            filter: drop-shadow(0 0 2px rgba(0, 0, 0, 0.5));
        }

        #orbit-view-wrap .orbit-point-katex.orbit-point-katex--c .katex {
            font-size: clamp(1.02rem, 0.74rem + 1.95vmin, 1.72rem) !important;
            /* kein Farb-!important — \textcolor am \(\mathbf c\) */
            color: rgba(248, 250, 255, 0.96);
            text-shadow:
                0 0 12px rgba(167, 85, 247, 0.22),
                0 0 22px rgba(0, 0, 0, 0.2);
            filter: drop-shadow(0 0 2px rgba(0, 0, 0, 0.5));
        }

        #orbit-canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
        }

        /*
         * Rechenbox: direkt unter #main-content — nicht in #canvas-container.
         * Sonst liegt die ganze Plot-Ebene unter .canvas-branding (z-index 120) und die Box blieb unsichtbar.
         */
        #main-content > #orbit-mb-worked.orbit-mb-worked {
            position: absolute;
            right: clamp(16px, 2.6vw, 36px);
            top: var(--mb-orbit-worked-top);
            z-index: 200;
            /**
             * \texttt{inline-flex} + \texttt{align-items: flex-start}: Kartenbreite = \(\max\)(Merkhilfe, Rechenspur),
             * nicht die volle \#main-content-Breite (Problem war \texttt{width:fit-content}-Flex mit \texttt{stretch}
             * + \(\texttt{max-width:100\%}\) Kindern beim abs.\ Positionieren).
             */
            display: inline-flex;
            flex-direction: column;
            align-items: flex-start;
            /* Obere Merkhilfe + Schritte: begrenzt breit; \(z^2\)-Zeile bleibt einzeilig. */
            max-width: min(940px, calc(100vw - 20px));
            min-width: 0;
            padding: 10px 12px 14px;
            box-sizing: border-box;
            pointer-events: auto;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            font-family: Outfit, system-ui, sans-serif;
            font-size: 1.06rem;
            background: rgba(5, 12, 26, 0.88);
            backdrop-filter: blur(10px);
            border-radius: 18px;
            border: 1px solid rgba(0, 210, 255, 0.45);
            box-shadow:
                0 0 0 1px rgba(0, 210, 255, 0.1),
                0 0 22px rgba(0, 210, 255, 0.18),
                0 12px 36px rgba(0, 0, 0, 0.42);
        }

        #main-content > #orbit-mb-worked.orbit-mb-worked[hidden] {
            display: none !important;
        }

        .orbit-mb-worked-caption {
            display: none;
        }

        #main-content > #orbit-mb-worked.orbit-mb-worked.orbit-mb-worked--drag {
            cursor: grabbing;
        }

        /** Rechenspur: Inhaltsbreite wie Merkhilfe (Kartenbreite kommt vom breiteren Block). */
        #orbit-mb-worked .orbit-mb-worked-tex-scroll {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            width: fit-content;
            max-width: 100%;
            min-width: 0;
            align-self: flex-start;
            max-height: min(38vh, 15rem);
            scrollbar-gutter: auto;
            overflow-x: hidden;
            overflow-y: auto;
            overscroll-behavior: contain;
            touch-action: pan-y;
        }

        /**
         Über der Scrollleiste vertikaler „Hoch/Runter“-Cursor (\texttt{ns-resize}).
         Nur WebKit: bei Firefox wirkt natives Scrollbar-Verhalten ohne eigenen Cursor-Stil pro Streifen.
         */
        #orbit-mb-worked .orbit-mb-worked-tex-scroll::-webkit-scrollbar {
            width: 8px;
            cursor: ns-resize;
        }

        #orbit-mb-worked .orbit-mb-worked-tex-scroll::-webkit-scrollbar-thumb {
            cursor: ns-resize;
            background: rgba(0, 210, 255, 0.35);
            border-radius: 6px;
        }

        #orbit-mb-worked .orbit-mb-worked-tex-scroll::-webkit-scrollbar-track {
            cursor: ns-resize;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 6px;
        }

        #orbit-mb-worked .orbit-mb-worked-tex {
            margin: 0;
            padding: 0;
            width: fit-content;
            max-width: 100%;
            min-width: 0;
            box-sizing: border-box;
            text-align: left;
        }

        #orbit-mb-worked .orbit-mb-worked-tex .katex {
            font-size: clamp(0.92rem, 0.78rem + 1.35vmin, 1.22rem) !important;
            color: rgba(248, 250, 255, 0.96) !important;
            filter: drop-shadow(0 0 1px rgba(0, 0, 0, 0.5));
        }

        #orbit-mb-worked .orbit-mb-worked-tex .katex-display {
            margin: 0 !important;
            text-align: left !important;
            width: fit-content;
            max-width: 100%;
        }

        attribute vec2 position;

    <script id="fs" type="x-shader/x-fragment">
        precision highp float;
        uniform vec2 u_res;
        uniform vec2 u_center;
        uniform float u_zoom;
        uniform int u_max_iter;
        uniform vec2 u_julia_c;
        uniform float u_time;
        uniform int u_julia;
        uniform int u_burning;
        void main() {
            vec3 color = vec3(0.0);
            vec2 uv = (gl_FragCoord.xy - 0.5 * u_res) / min(u_res.x, u_res.y);
            float zm = min(max(u_zoom, 1e-8), 200000.0);
            float sc = 3.0 / zm;
            vec2 z, c;
            if (u_julia == 1) {
                z = u_center + uv * sc;
                c = u_julia_c;
            } else {
                z = vec2(0.0);
                c = u_center + uv * sc;
            }
            int iter = 0;
            bool escaped = false;
            for (int k = 0; k < 768; k++) {
                if (k >= u_max_iter) break;
                if (dot(z, z) > 4.0) { escaped = true; iter = k; break; }
                vec2 zz = z;
                if (u_burning == 1) zz = abs(z);
                z = vec2(zz.x * zz.x - zz.y * zz.y, 2.0 * zz.x * zz.y) + c;
            }
            if (escaped) {
                float sn = float(iter) - log2(max(1.0, log2(length(z))));
                /* Slower color modulation: less shimmer/flicker on zoom than with strong u_time factor */
                float r = 0.5 + 0.5 * cos(3.0 + sn * 0.15 + u_time * 0.12);
                float g = 0.5 + 0.5 * cos(2.0 + sn * 0.15 + u_time * 0.12);
                float b = 0.5 + 0.5 * cos(1.0 + sn * 0.15 + u_time * 0.12);
                color = vec3(r, g, b);
            }
            gl_FragColor = vec4(color, 1.0);
        }

                const x = Math.round(Number(n));

                return Math.max(ORBIT_LEG_MIN, Math.min(ORBIT_LEG_MAX, x));
            }

            let orbitWorkedBoxDrag = null;

            /** { l, t } = Ecke links/oben relativ zu #main-content [%]. */
            function orbitWorkedBoxClampPct(l, t, el, main) {
                const mw = Math.max(1, main.clientWidth);
                const mh = Math.max(1, main.clientHeight);
                const ew = Math.max(1, el.offsetWidth || 1);
                const eh = Math.max(1, el.offsetHeight || 1);
                const maxL = Math.max(0, ((mw - ew) / mw) * 100);
                const maxT = Math.max(0, ((mh - eh) / mh) * 100);
                return {
                    l: Math.max(0, Math.min(maxL, l)),
                    t: Math.max(0, Math.min(maxT, t)),
                };
            }

            function orbitWorkedBoxApplyPct(l, t) {
                const el = document.getElementById('orbit-mb-worked');
                const main = document.getElementById('main-content');
                if (!el || !main) return;
                const c = orbitWorkedBoxClampPct(l, t, el, main);
                el.style.right = 'auto';
                el.style.left = c.l + '%';
                el.style.top = c.t + '%';
            }

            /** Nach KaTeX/Resize: gespeicherte Ecke wieder anwenden und begrenzen. */
            function orbitWorkedBoxReclampPersisted() {
                if (orbitWorkedBoxDrag) return;
                requestAnimationFrame(() =>
                    requestAnimationFrame(() => {
                        try {
                            const raw = localStorage.getItem(LS_MB_ORBIT_WORKED_BOX);
                            if (!raw) return;
                            const o = JSON.parse(raw);
                            if (typeof o.l === 'number' && typeof o.t === 'number' && Number.isFinite(o.l) && Number.isFinite(o.t))
                                orbitWorkedBoxApplyPct(o.l, o.t);
                        } catch (e) {
                            /* ignore */
                        }
                    })
                );
            }

            function loadOrbitWorkedBoxPos() {
                try {
                    const raw = localStorage.getItem(LS_MB_ORBIT_WORKED_BOX);
                    if (!raw) return;
                    const o = JSON.parse(raw);
                    if (typeof o.l !== 'number' || typeof o.t !== 'number') return;
                    if (!Number.isFinite(o.l) || !Number.isFinite(o.t)) return;
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => orbitWorkedBoxApplyPct(o.l, o.t));
                    });
                } catch (e) {
                    /* ignore */
                }
            }

            function persistOrbitWorkedBoxPos() {
                try {
                    const el = document.getElementById('orbit-mb-worked');
                    const main = document.getElementById('main-content');
                    if (!el || !main) return;
                    const mr = main.getBoundingClientRect();
                    const er = el.getBoundingClientRect();
                    const l = ((er.left - mr.left) / Math.max(1, mr.width)) * 100;
                    const t = ((er.top - mr.top) / Math.max(1, mr.height)) * 100;
                    const cl = orbitWorkedBoxClampPct(l, t, el, main);
                    localStorage.setItem(LS_MB_ORBIT_WORKED_BOX, JSON.stringify({ l: cl.l, t: cl.t }));
                } catch (e) {
                    /* ignore */
                }
            }

            let orbitWorkedBoxResizeTim = null;
            window.addEventListener('resize', () => {
                clearTimeout(orbitWorkedBoxResizeTim);
                orbitWorkedBoxResizeTim = setTimeout(() => {
                    try {
                        const raw = localStorage.getItem(LS_MB_ORBIT_WORKED_BOX);
                        if (!raw) return;
                        const o = JSON.parse(raw);
                        if (typeof o.l === 'number' && typeof o.t === 'number' && Number.isFinite(o.l) && Number.isFinite(o.t))
                            orbitWorkedBoxApplyPct(o.l, o.t);
                    } catch (e) {
                        /* ignore */
                    }
                }, 120);
            });

            /** Einmalige Maus-/Touch-Ziehlogik (#orbit-mb-worked relativ zu #main-content). */
            function initOrbitWorkedBoxDragOnce() {
                const el = document.getElementById('orbit-mb-worked');
                const main = document.getElementById('main-content');
                if (!el || !main || el.dataset.mbWorkedDragInit === '1') return;
                el.dataset.mbWorkedDragInit = '1';

                function onDown(ev) {
                    if (mainPlane !== 'ORBIT') return;
                    const btn = ev.button !== undefined ? ev.button : ev.type === 'touchstart' ? 0 : 0;
                    if (btn !== 0) return;
                    const t = ev.target;
                    if (t && typeof t.closest === 'function') {
                        const bad = t.closest('a[href], button, input, select, textarea, [contenteditable="true"]');
                        if (bad) return;
                        /** Scrollbereich nicht zum Ziehen — sonst kämpfen Maus‑Drag und scrollbar. */
                        if (t.closest('.orbit-mb-worked-tex-scroll')) return;
                    }

                    const clientX = ev.clientX != null ? ev.clientX : ev.touches && ev.touches[0] && ev.touches[0].clientX;
                    const clientY = ev.clientY != null ? ev.clientY : ev.touches && ev.touches[0] && ev.touches[0].clientY;
                    if (clientX == null || clientY == null) return;

                    const mr = main.getBoundingClientRect();
                    const er = el.getBoundingClientRect();
                    let lPct = ((er.left - mr.left) / Math.max(1, mr.width)) * 100;
                    let tPct = ((er.top - mr.top) / Math.max(1, mr.height)) * 100;
                    orbitWorkedBoxApplyPct(lPct, tPct);

                    const mr2 = main.getBoundingClientRect();
                    const r = el.getBoundingClientRect();
                    orbitWorkedBoxDrag = {
                        startX: clientX,
                        startY: clientY,
                        startL: ((r.left - mr2.left) / mr2.width) * 100,
                        startT: ((r.top - mr2.top) / mr2.height) * 100,
                        mainW: mr2.width,
                        mainH: mr2.height,
                    };

                    el.classList.add('orbit-mb-worked--drag');
                    document.body.style.userSelect = 'none';
                    document.body.style.webkitUserSelect = 'none';
                    ev.preventDefault();
                }

                function onMove(ev) {
                    const d = orbitWorkedBoxDrag;
                    if (!d) return;

                    const clientX = ev.clientX != null ? ev.clientX : ev.touches && ev.touches[0] && ev.touches[0].clientX;
                    const clientY = ev.clientY != null ? ev.clientY : ev.touches && ev.touches[0] && ev.touches[0].clientY;
                    if (clientX == null || clientY == null) return;

                    const dxPct = ((clientX - d.startX) / Math.max(1, d.mainW)) * 100;
                    const dyPct = ((clientY - d.startY) / Math.max(1, d.mainH)) * 100;
                    orbitWorkedBoxApplyPct(d.startL + dxPct, d.startT + dyPct);

                    ev.preventDefault();
                }

                function onUp() {
                    const had = orbitWorkedBoxDrag != null || el.classList.contains('orbit-mb-worked--drag');
                    orbitWorkedBoxDrag = null;
                    el.classList.remove('orbit-mb-worked--drag');
                    document.body.style.userSelect = '';
                    document.body.style.webkitUserSelect = '';
                    if (had) persistOrbitWorkedBoxPos();
                }

                el.addEventListener('mousedown', onDown);
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
                el.addEventListener('touchstart', onDown, { passive: false });
                document.addEventListener('touchmove', onMove, { passive: false });
                document.addEventListener('touchend', onUp);
                document.addEventListener('touchcancel', onUp);
            }

            /** Wissenschaftliche Darstellung \(a\times10^{n}\) (Orbit-/Rechen‑HUD); Mantisse mit \texttt{ORBIT\_COORD\_NKS} Nachkommastellen. */
            function orbitScientificFloatToKatex(x, sigDig) {
                const d = sigDig != null ? sigDig : ORBIT_COORD_NKS;
                const eStr = Number(x).toExponential(d);
                const parsed = /^(-?)(\d(?:\.\d+)?)[eE]([+-])(\d+)$/.exec(eStr);
                if (!parsed) return '\\text{' + eStr + '}';
                const es = parsed[3] === '-' ? '-' : '';
                return parsed[1] + parsed[2] + '\\times10^{' + es + parsed[4] + '}';
            }

            /** \(|z|^{2}\) am Ende der Orbitschiene: keine vollständig ausgeschriebenen Riesenzahlen durch \texttt{toFixed}. */
            function orbitHudFormatZSquaredDisplay(r2) {
                if (!Number.isFinite(r2)) return { tex: '\\text{n/a}', plain: '—' };
                if (Object.is(r2, -0) || r2 === 0) return { tex: '0', plain: '0' };
                const ax = Math.abs(r2);
                if (ax >= 1e5 || ax < 1e-4) {
                    return {
                        tex: orbitScientificFloatToKatex(r2, ORBIT_COORD_NKS),
                        plain: Number(r2).toExponential(ORBIT_COORD_NKS),
                    };
                }
                let s = String(Number(r2.toFixed(ORBIT_COORD_NKS)));
                if (s === '-0') s = '0';
                return { tex: s.replace('.', '{.}'), plain: Number(r2).toFixed(ORBIT_COORD_NKS) };
            }

            /** Top-Leiste \(\lvert z^{2}\\rvert\)/\(N\)/\(\mu\): nur in der Orbitebene wenn \texttt{orbitShowWorkedCalc}. */
            function syncMbOrbitFormulaOverlayShellVisibility() {
                const overlay = document.querySelector('.mb-fractal-formula-overlay');
                if (!overlay) return;
                if (mainPlane === 'FRACTAL') {
                    overlay.hidden = false;
                } else {
                    overlay.hidden = !orbitShowWorkedCalc;
                }
            }

            /** Top KaTeX box: FRACTAL = classic / Burning Ship; ORBIT leg mode = |z²| at endpoint + leg N; scan = same line at grid point + hit count */
            function syncMbFractalFormulaOverlay() {
                const formulaPanel = document.getElementById('mb-fractal-formula-panel');
                if (formulaPanel) {
                    formulaPanel.classList.toggle('mb-fractal-formula-panel--orbit-metrics', mainPlane === 'ORBIT');
                    formulaPanel.classList.toggle('mb-fractal-formula-panel--fractal-banner', mainPlane === 'FRACTAL');
                }
                syncMbOrbitFormulaOverlayShellVisibility();
                const el = document.getElementById('mb-fractal-formula-tex');
                if (!el) return;
                if (mainPlane === 'ORBIT' && !orbitShowWorkedCalc) {
                    return;
                }
                let cacheKey;
                if (mainPlane === 'FRACTAL') {
                    cacheKey = `F:${mode}`;
                } else if (mainPlane === 'ORBIT' && orbitScanActive) {
                    const rSnap = orbitScanHudMagR2;
                    const rScanKey = !Number.isFinite(rSnap)
                        ? 'x'
                        : Math.abs(rSnap) >= 1e10 || (Math.abs(rSnap) > 0 && Math.abs(rSnap) < 1e-4)
                          ? String(rSnap.toExponential(6))
                          : String(Math.round(rSnap * 1e6));
                    const pcx = orbitScanProbeCx;
                    const pcy = orbitScanProbeCy;
                    const spdScan =
                        (fractalUsesCBurnPlane() ? `0~0@${pcx}@${pcy}` : `${pcx}@${pcy}@${juliaX}@${juliaY}`) +
                        '|' +
                        fractalShaderTargetMaxIter() +
                        '|t' +
                        time.toFixed(4) +
                        '|muW';
                    cacheKey = `OS:${mode}:${rScanKey}:${orbitScanStableHits.length}:${spdScan}`;
                } else if (mainPlane === 'ORBIT') {
                    const r2Show =
                        orbitLastLegEndR2 >= 0 && Number.isFinite(orbitLastLegEndR2) ? orbitLastLegEndR2 : -1;
                    const nLeg = orbitLastActualLegs;
                    const r2Key =
                        !Number.isFinite(r2Show) || r2Show < 0
                            ? 'x'
                            : r2Show >= 1e10 || (r2Show > 0 && r2Show < 1e-4)
                              ? r2Show.toExponential(6)
                              : String(Math.round(Math.min(r2Show, 1e15) * 1000));
                    const spdOrbit =
                        (fractalUsesCBurnPlane()
                            ? `MB@${juliaX}@${juliaY}`
                            : `${centerX}@${centerY}@${juliaX}@${juliaY}`) +
                        '|' +
                        fractalShaderTargetMaxIter() +
                        '|t' +
                        time.toFixed(4) +
                        '|muW';
                    cacheKey = `OL:${mode}:${r2Key}:${nLeg}:${clampOrbitLegCount(orbitLegCount)}:${spdOrbit}`;
                } else {
                    cacheKey = 'X';
                }
                if (cacheKey === mbFormulaOverlayCacheKey) return;
                mbFormulaOverlayCacheKey = cacheKey;

                const baseClassic = 'z_{n+1} = z_n^{2} + c';
                const baseBurning =
                    'z_{n+1} = \\bigl(\\lvert\\Re z_n\\rvert + i\\,\\lvert\\Im z_n\\rvert\\bigr)^{2} + c';

                function orbitProbeSpeedMatchesFractalShader() {
                    const maxSteps = fractalShaderTargetMaxIter();
                    const burning = mode === 'BURNING_SHIP';
                    if (mainPlane === 'ORBIT' && orbitScanActive) {
                        if (fractalUsesCBurnPlane()) {
                            return fractalEscapeProbeLikeShader(
                                0,
                                0,
                                orbitScanProbeCx,
                                orbitScanProbeCy,
                                maxSteps,
                                burning,
                                time,
                            );
                        }
                        return fractalEscapeProbeLikeShader(
                            orbitScanProbeCx,
                            orbitScanProbeCy,
                            juliaX,
                            juliaY,
                            maxSteps,
                            burning,
                            time,
                        );
                    }
                    if (mainPlane === 'ORBIT') {
                        if (fractalUsesCBurnPlane()) {
                            return fractalEscapeProbeLikeShader(
                                0,
                                0,
                                juliaX,
                                juliaY,
                                maxSteps,
                                burning,
                                time,
                            );
                        }
                        return fractalEscapeProbeLikeShader(
                            centerX,
                            centerY,
                            juliaX,
                            juliaY,
                            maxSteps,
                            burning,
                            time,
                        );
                    }
                    return { escaped: false, interior: true, hex: '#94a3b8', texMuBody: '\\text{—}', plainMu: '—' };
                }

                /** Same layout as scan row; values from leg polyline or grid hits — red when |z|²>4 like plot */
                function renderMzSquaredLine(rTexBody, nPartStr, r2Numeric, plainR, speedProbe) {
                    let hex = '#f2bb44';
                    let shadow = '0 0 12px rgba(242,187,68,0.4)';
                    if (Number.isFinite(r2Numeric)) {
                        if (r2Numeric > ORBIT_SCAN_ESC_R2) {
                            hex = '#e53935';
                            shadow = '0 0 12px rgba(229,57,53,0.38)';
                        }
                    } else {
                        hex = '#94a3b8';
                        shadow = '0 0 8px rgba(148,163,184,0.22)';
                    }
                    el.classList.add('mb-fractal-mz-split');
                    el.innerHTML =
                        '<span class="mb-fractal-mz-z2"></span><span class="mb-fractal-mz-n"></span><span class="mb-fractal-mz-spd"></span>';
                    const z2Wrap = el.querySelector('.mb-fractal-mz-z2');
                    const nWrap = el.querySelector('.mb-fractal-mz-n');
                    const spdWrap = el.querySelector('.mb-fractal-mz-spd');
                    const texZ2 =
                        '\\textcolor{' +
                        hex +
                        '}{\\left\\lvert z^{2}\\right\\rvert = ' +
                        rTexBody +
                        '}';
                    const texN = '\\textcolor{' + hex + '}{N = ' + nPartStr + '}';
                    let texSpd;
                    if (speedProbe && speedProbe.escaped) {
                        spdWrap.classList.remove('mb-fractal-mz-spd--muted');
                        spdWrap.classList.add('mb-fractal-mz-spd--white');
                        texSpd = '\\mu \\approx ' + speedProbe.texMuBody;
                    } else {
                        spdWrap.classList.remove('mb-fractal-mz-spd--white');
                        spdWrap.classList.add('mb-fractal-mz-spd--muted');
                        texSpd = '\\mu \\approx \\text{—}';
                    }
                    if (typeof katex !== 'undefined') {
                        katex.render(texZ2, z2Wrap, { throwOnError: false, displayMode: false });
                        katex.render(texN, nWrap, { throwOnError: false, displayMode: false });
                        katex.render(texSpd, spdWrap, { throwOnError: false, displayMode: false });
                    } else {
                        z2Wrap.textContent = '|z²| = ' + (plainR != null ? plainR : '');
                        nWrap.textContent = 'N = ' + nPartStr;
                        if (speedProbe && speedProbe.escaped) {
                            spdWrap.textContent = '\u03bc \u2248 ' + speedProbe.plainMu;
                            spdWrap.style.color = '#f8faff';
                            spdWrap.style.textShadow = 'none';
                        } else {
                            spdWrap.textContent = '\u03bc \u2248 \u2014';
                            spdWrap.style.color = '#94a3b8';
                            spdWrap.style.textShadow = 'none';
                        }
                        el.style.cssText =
                            'font-family:Orbitron,sans-serif;font-size:1.22rem;line-height:1.25;color:' +
                            hex +
                            ';text-shadow:' +
                            shadow +
                            ';';
                    }
                }

                if (mainPlane === 'ORBIT' && orbitScanActive) {
                    const fmt = orbitHudFormatZSquaredDisplay(orbitScanHudMagR2);
                    const nHits = orbitScanStableHits.length;
                    const spdProbe = orbitProbeSpeedMatchesFractalShader();
                    renderMzSquaredLine(fmt.tex, String(nHits), orbitScanHudMagR2, fmt.plain, spdProbe);
                    return;
                }

                if (mainPlane === 'ORBIT') {
                    const r2Ok = orbitLastLegEndR2 >= 0 && Number.isFinite(orbitLastLegEndR2);
                    const fmt = orbitHudFormatZSquaredDisplay(r2Ok ? orbitLastLegEndR2 : NaN);
                    const nStr =
                        orbitLastActualLegs >= 0 ? String(orbitLastActualLegs) : '—';
                    const spdProbe = orbitProbeSpeedMatchesFractalShader();
                    renderMzSquaredLine(
                        fmt.tex,
                        nStr,
                        r2Ok ? orbitLastLegEndR2 : NaN,
                        fmt.plain,
                        spdProbe,
                    );
                    return;
                }

                el.classList.remove('mb-fractal-mz-split');
                const bannerBase = mode === 'BURNING_SHIP' ? baseBurning : baseClassic;
                const texFull = `${bannerBase}\\quad z_n,\\, c \\in \\mathbb{C}`;
                if (typeof katex !== 'undefined') {
                    katex.render(texFull, el, { throwOnError: false, displayMode: true });
                } else {
                    el.textContent =
                        mode === 'BURNING_SHIP'
                            ? 'z_{n+1} = (|ℜ z_n| + i|ℑ z_n|)² + c   z_n, c ∈ ℂ'
                            : 'z_{n+1} = z_n² + c  z_n, c ∈ ℂ';
                    el.style.cssText =
                        'font-family:Orbitron,sans-serif;font-size:1.28rem;line-height:1.2;color:#f2bb44;text-align:left;text-shadow:0 0 12px rgba(242,187,68,0.4);';
                }
            }

            function persistMandelbrotOrbitLegPolyline() {
                try {
                    localStorage.setItem(LS_MB_ORBIT_LEG_POLYLINE, orbitShowLegPolyline ? '1' : '0');
                } catch (e) {
                    /* ignore */
                }
            }

            function persistMandelbrotOrbitShowWorkedCalc() {
                try {
                    localStorage.setItem(LS_MB_ORBIT_SHOW_WORKED, orbitShowWorkedCalc ? '1' : '0');
                } catch (e) {
                    /* ignore */
                }
            }

            /** Read persisted orbit/HUD settings; returns saved view or null (\(\texttt{orbitLegCount}\) nur Sitzung). */
            function loadMandelbrotPersist() {
                try {
                    const plane = localStorage.getItem(LS_MB_MAIN_PLANE);
                    const legPoly = localStorage.getItem(LS_MB_ORBIT_LEG_POLYLINE);
                    if (legPoly === '0') orbitShowLegPolyline = false;
                    else if (legPoly === '1') orbitShowLegPolyline = true;
                    const worked = localStorage.getItem(LS_MB_ORBIT_SHOW_WORKED);
                    if (worked === '0') orbitShowWorkedCalc = false;
                    else if (worked === '1') orbitShowWorkedCalc = true;
                    return plane === 'FRACTAL' || plane === 'ORBIT' ? plane : null;
                } catch (e) {
                    return null;
                }
            }

            function syncOrbitSidebarWorkedCheckboxMount() {
                const wrap = document.getElementById('orbit-sidebar-worked-wrap');
                const cb = document.getElementById('orbit-show-worked-checkbox');
                if (wrap) {
                    wrap.hidden = mainPlane !== 'ORBIT';
                }
                if (cb && cb.checked !== orbitShowWorkedCalc) {
                    cb.checked = orbitShowWorkedCalc;
                }
            }

            if (!gl) return;

            function orbitIterateMap(zx, zy, cr, ci, burning) {
                if (burning) {
                    const ax = Math.abs(zx);
                    const ay = Math.abs(zy);
                    return { zx: ax * ax - ay * ay + cr, zy: 2 * ax * ay + ci };
                }
                return { zx: zx * zx - zy * zy + cr, zy: 2 * zx * zy + ci };
            }

            /** Matches \texttt{fs} fragment: cosine palette from smooth iteration \texttt{sn} + \texttt{u\_time}. */
            function fractalRgbFromShaderSn(sn, uTime) {
                const r = 0.5 + 0.5 * Math.cos(3.0 + sn * 0.15 + uTime * 0.12);
                const g = 0.5 + 0.5 * Math.cos(2.0 + sn * 0.15 + uTime * 0.12);
                const b = 0.5 + 0.5 * Math.cos(1.0 + sn * 0.15 + uTime * 0.12);
                return { r, g, b };
            }

            function fractalRgb01ToHex(r, g, b) {
                const q = (x) =>
                    Math.max(0, Math.min(255, Math.round(Number(x) * 255)))
                        .toString(16)
                        .padStart(2, '0');
                return '#' + q(r) + q(g) + q(b);
            }

            /**
             * Iterate like WebGL (768 cap, breakout |z|²>4), \(\texttt{sn}=\texttt{iter}-\log_2\max(1,\log_2|z|)}\),
             * \(\mu=\ln|z|^{2}/(2\max(1,\texttt{iter}))\) at escape.
             */
            function fractalEscapeProbeLikeShader(z0x, z0y, cx, cy, maxSteps, burning, uTime) {
                const cap = Math.min(768, Math.max(1, maxSteps | 0));
                let zx = Number(z0x);
                let zy = Number(z0y);
                const cr = Number(cx);
                const ci = Number(cy);
                if (![zx, zy, cr, ci].every((v) => Number.isFinite(v))) {
                    return {
                        escaped: false,
                        interior: true,
                        mu: NaN,
                        hex: '#94a3b8',
                        texMuBody: '\\text{—}',
                        plainMu: '—',
                    };
                }
                for (let k = 0; k < cap; k++) {
                    const r2 = zx * zx + zy * zy;
                    if (r2 > 4.0) {
                        const len = Math.hypot(zx, zy);
                        const inner = Math.log2(Math.max(1.0, Math.log2(len)));
                        const sn = k - inner;
                        const rgb = fractalRgbFromShaderSn(sn, uTime);
                        const hex = fractalRgb01ToHex(rgb.r, rgb.g, rgb.b);
                        const den = Math.max(1, k);
                        const mu = Math.log(r2) / (2 * den);
                        let texMuBody;
                        let plainMu;
                        const ax = Math.abs(mu);
                        if (ax >= 1e5 || (ax > 0 && ax < 1e-5)) {
                            texMuBody = orbitScientificFloatToKatex(mu, 3);
                            plainMu = Number(mu).toExponential(3);
                        } else {
                            plainMu = mu.toFixed(4).replace(/\.?0+$/, '');
                            if (plainMu === '-0') plainMu = '0';
                            texMuBody = plainMu.replace('.', '{.}');
                        }
                        return { escaped: true, iter: k, sn, mu, hex, texMuBody, plainMu, r2Esc: r2 };
                    }
                    const st = orbitIterateMap(zx, zy, cr, ci, burning);
                    zx = st.zx;
                    zy = st.zy;
                    if (!Number.isFinite(zx) || !Number.isFinite(zy)) {
                        return {
                            escaped: false,
                            interior: false,
                            mu: NaN,
                            hex: '#94a3b8',
                            texMuBody: '\\text{—}',
                            plainMu: '—',
                        };
                    }
                }
                return {
                    escaped: false,
                    interior: true,
                    mu: NaN,
                    hex: '#000000',
                    texMuBody: '\\text{—}',
                    plainMu: '—',
                };
            }

            /** Stable point after maxSteps with |z|² ≤ 4; else stable: false. escapeR2 = |z|² when crossing cutoff (HUD). */
            function orbitProbeStableWithFinalR2(cr, ci, z0x, z0y, maxSteps, burning) {

                const memo = document.getElementById('orbit-mb-worked-memo');
                const rule = document.getElementById('orbit-mb-worked-rule');
                if (!memo || !rule) return;
                if (!enabled) {
                    memo.hidden = true;
                    rule.hidden = true;
                    memo.innerHTML = '';
                    memo.textContent = '';
                    memo.classList.remove('orbit-mb-worked-plain');
                    delete memo.dataset.mbMemoKey;
                    return;
                }
                memo.hidden = false;
                rule.hidden = false;
                const kFlag = typeof katex !== 'undefined' ? 'k' : 't';
                const key = `${kFlag}|${ORBIT_WORKED_MEMO_TEX_REV}`;
                if (memo.dataset.mbMemoKey === key) return;
                memo.dataset.mbMemoKey = key;
                memo.innerHTML = '';
                memo.classList.remove('orbit-mb-worked-plain');
                if (typeof katex !== 'undefined') {
                    try {
                        katex.render(ORBIT_WORKED_MEMO_KATEX, memo, { throwOnError: false, displayMode: true });
                    } catch (_) {
                        memo.classList.add('orbit-mb-worked-plain');
                        memo.textContent = ORBIT_WORKED_MEMO_PLAIN;
                    }
                } else {
                    memo.classList.add('orbit-mb-worked-plain');
                    memo.textContent = ORBIT_WORKED_MEMO_PLAIN;
                }
            }

            function orbitWorkedAlignedBlockEndRowSuffix(extraGapPx) {
                return extraGapPx ? '\\\\[' + ORBIT_WORKED_BLOCK_GAP_PX + 'px]' : '\\\\';
            }

            function orbitWorkedNumTex(v) {
                const fv = Number(v);
                if (!Number.isFinite(fv)) return '\\text{—}';
                const ax = Math.abs(fv);
                if (ax >= 1e5 || (ax > 0 && ax < 1e-5)) return orbitScientificFloatToKatex(fv, ORBIT_COORD_NKS);
                return mbOrbitPlaneTexNum(fv, ORBIT_COORD_NKS);
            }

            /** Plaintext-Realfürzel für das Rechenpanel (wie KaTeX, aber ohne Makros). */
            function orbitWorkedPlainCoord(x) {
                const fv = Number(x);
                if (!Number.isFinite(fv)) return '—';
                const ax = Math.abs(fv);
                if (ax >= 1e5 || (ax > 0 && ax < 1e-5)) return fv.toExponential(ORBIT_COORD_NKS);
                return fv.toFixed(ORBIT_COORD_NKS);
            }

            /** Koordinate (-Paar) \(\bigl(\Re\big|\Im\bigr)\) für die Rechenspur (3 NKS). */
            function orbitWorkedPairTex(x, y) {
                return (
                    '\\bigl(' +
                    orbitWorkedNumTex(x) +
                    ' \\bigm| ' +
                    orbitWorkedNumTex(y) +
                    '\\bigr)'
                );
            }

            const ORBIT_WORKED_PLAIN_UNICODE_SUB = '₀₁₂₃₄₅₆₇₈₉';

            /** Plain: kursives \(z_k\) wie KaTeX-Spur (Unicode-Tiefgestellt). */
            function orbitWorkedPlainZkLabel(k) {
                return (
                    'z' +
                    String(Math.max(0, Math.floor(k)))
                        .split('')
                        .map((d) => ORBIT_WORKED_PLAIN_UNICODE_SUB[+d])
                        .join('')
                );
            }

            /** \(z²+c\): ein Block z_k vom Vor‑Punkt (aligned-Zeilen mit &=). */
            function orbitWorkedQuadrBlockTex(cr, ci, pk, zk, idx, gapAfterBlock) {
                const H = ORBIT_WORKED_STEP_HEAD_COLOR;
                const P = orbitWorkedPairTex;
                const kp = idx - 1;
                const rsq = pk.x * pk.x - pk.y * pk.y;
                const jsq = 2 * pk.x * pk.y;
                const rh =
                    '\\textcolor{' +
                    H +
                    '}{z_{' +
                    kp +
                    '}^{\\textcolor{#f8faff}{2}}} + \\textcolor{' +
                    ORBIT_WORKED_C_ACCENT_COLOR +
                    '}{\\mathbf{c}}';
                const endRow = orbitWorkedAlignedBlockEndRowSuffix(gapAfterBlock);
                return (
                    '\\textcolor{' +
                    H +
                    '}{z_{' +
                    idx +
                    '}} &= ' +
                    rh +
                    '\\\\' +
                    ' &= ' +
                    P(pk.x, pk.y) +
                    '^{2} + ' +
                    P(cr, ci) +
                    '\\\\' +
                    ' &= ' +
                    P(rsq, jsq) +
                    ' + ' +
                    P(cr, ci) +
                    '\\\\' +
                    ' &= ' +
                    P(zk.x, zk.y) +
                    endRow
                );
            }

            /** Alle Quadr‑Blöcke nacheinander (array‑Zeilen, \(=\)-Spalte). */
            function orbitWorkedQuadrTrailTex(cr, ci, z0x, z0y, zs) {
                let prev = { x: z0x, y: z0y };
                let tex = '';
                for (let i = 0; i < zs.length; i++) {
                    const gapAfter =
                        zs.length <= 1 ? false : i < zs.length - 1;
                    tex += orbitWorkedQuadrBlockTex(cr, ci, prev, zs[i], i + 1, gapAfter);
                    prev = zs[i];
                }
                return tex;
            }

            /** Klammerteil von \(\bigl(|\Re z_{k}|\ldots\bigr)\) (ohne \(\vphantom|^2\) — Hochzahl liegt außerhalb von \(\texttt H\)-\(\texttt{\\textcolor}\)). */
            function orbitWorkedBurningBsParenTex(kMinus1) {
                return (
                    '\\bigl(\\lvert\\Re z_{' +
                    kMinus1 +
                    '}\\rvert + \\mathrm{i}\\,\\lvert\\Im z_{' +
                    kMinus1 +
                    '}\\rvert\\bigr)'
                );
            }

            function orbitWorkedBurningBsFormulaTex(kMinus1) {
                const Cp = ORBIT_WORKED_C_ACCENT_COLOR;
                return orbitWorkedBurningBsParenTex(kMinus1) + '^{2}+\\textcolor{' + Cp + '}{\\mathbf{c}}';
            }

            /** Ein Burning-Schritt z_k, konsistent zur JS-Iterationsfunktion orbitIterateMap. */
            function orbitWorkedBurningBlockTex(cr, ci, pk, zk, idx, gapAfterBlock) {
                const H = ORBIT_WORKED_STEP_HEAD_COLOR;
                const P = orbitWorkedPairTex;
                const fx = Math.abs(pk.x);
                const fy = Math.abs(pk.y);
                const qx = fx * fx - fy * fy;
                const qy = 2 * fx * fy;
                const rh =
                    '\\textcolor{' +
                    H +
                    '}{' +
                    orbitWorkedBurningBsParenTex(idx - 1) +
                    '}^{2}+\\textcolor{' +
                    ORBIT_WORKED_C_ACCENT_COLOR +
                    '}{\\mathbf{c}}';
                const endRow = orbitWorkedAlignedBlockEndRowSuffix(gapAfterBlock);
                return (
                    '\\textcolor{' +
                    H +
                    '}{z_{' +
                    idx +
                    '}} &= ' +
                    rh +
                    '\\\\' +
                    ' &= ' +
                    P(fx, fy) +
                    '^{2} + ' +
                    P(cr, ci) +
                    '\\\\' +
                    ' &= ' +
                    P(qx, qy) +
                    ' + ' +
                    P(cr, ci) +
                    '\\\\' +
                    ' &= ' +
                    P(zk.x, zk.y) +
                    endRow
                );
            }

            /** Burning-Kette: beliebig viele Blöcke (Länge \texttt{zs}). */
            function orbitWorkedBurningTrailTex(cr, ci, z0x, z0y, zs) {
                let prev = { x: z0x, y: z0y };
                let tex = '';
                for (let i = 0; i < zs.length; i++) {
                    const gapAfter =
                        zs.length <= 1 ? false : i < zs.length - 1;
                    tex += orbitWorkedBurningBlockTex(cr, ci, prev, zs[i], i + 1, gapAfter);
                    prev = zs[i];
                }
                return tex;
            }

            /** Kopf \(\mathbf{c}\), \(z_0\) mit Blockabstand (geteilt mit Voll‑ und Cz‑only‑Panel). */
            function orbitWorkedCzHeadTex(cr, ci, z0x, z0y) {
                const H = ORBIT_WORKED_BLOCK_GAP_PX;
                const Cp = ORBIT_WORKED_C_ACCENT_COLOR;
                const P = orbitWorkedPairTex;
                return (
                    '\\textcolor{' + Cp + '}{\\mathbf{c}} &= ' +
                    P(cr, ci) +
                    '\\\\[' +
                    H +
                    'px]' +
                    '\\textcolor{' +
                    ORBIT_WORKED_STEP_HEAD_COLOR +
                    '}{z_{0}} &= ' +
                    P(z0x, z0y) +
                    '\\\\[' +
                    H +
                    'px]'
                );
            }

            /** Nur Konstanten \(\mathbf{c}\) und \(z_0\) (noch kein Iterationsschritt). */
            function orbitWorkedPanelKatexCzOnly(cr, ci, z0x, z0y) {
                return '\\begin{aligned}' + orbitWorkedCzHeadTex(cr, ci, z0x, z0y) + '\\end{aligned}';
            }

            /** AMS aligned (KaTeX-sicher): kein array @{…}‑Preamble. */
            function orbitWorkedPanelKatex(cr, ci, z0x, z0y, zs, burning) {
                const zsUse = zs && zs.length ? zs : [];
                const czHead = orbitWorkedCzHeadTex(cr, ci, z0x, z0y);
                let tail = burning
                    ? orbitWorkedBurningTrailTex(cr, ci, z0x, z0y, zsUse)
                    : orbitWorkedQuadrTrailTex(cr, ci, z0x, z0y, zsUse);
                while (tail.length >= 2 && tail.slice(-2) === '\\\\') {
                    tail = tail.slice(0, -2);
                }
                return '\\begin{aligned}' + czHead + tail + '\\end{aligned}';
            }

            /** KaTeX-freier Fallback; gleiche \(z\)-Stil-Kette wie \(\texttt{orbitWorkedPanelKatex}\). */
            function orbitWorkedPanelPlain(cr, ci, z0x, z0y, zsIn, burning) {
                const Pcoord = (x, y) => `(${orbitWorkedPlainCoord(x)} | ${orbitWorkedPlainCoord(y)})`;
                let body = `c = ${Pcoord(cr, ci)}\nz₀ = ${Pcoord(z0x, z0y)}`;

                const quadrBlock = (ax, ay, out, zk, zp) => {
                    const rsq = ax * ax - ay * ay;
                    const jsq = 2 * ax * ay;
                    return (
                        `${zk} = ${zp}² + c` +
                        `\n= ${Pcoord(ax, ay)}² + ${Pcoord(cr, ci)}` +
                        `\n= ${Pcoord(rsq, jsq)} + ${Pcoord(cr, ci)}` +
                        `\n${Pcoord(out.x, out.y)}`
                    );
                };

                const zs = zsIn && zsIn.length ? zsIn : [];
                const blockSep = '\n\n';

                if (!burning) {
                    let pa = z0x;
                    let pb = z0y;
                    for (let i = 0; i < zs.length; i++) {
                        const k = i + 1;
                        body +=
                            blockSep +
                            quadrBlock(
                                pa,
                                pb,
                                zs[i],
                                orbitWorkedPlainZkLabel(k),
                                orbitWorkedPlainZkLabel(k - 1),
                            );
                        pa = zs[i].x;
                        pb = zs[i].y;
                    }
                } else {
                    const cplxSq = (re, im) => ({ x: re * re - im * im, y: 2 * re * im });
                    let pa = z0x;
                    let pb = z0y;
                    for (let i = 0; i < zs.length; i++) {
                        const k = i + 1;
                        const fx = Math.abs(pa);
                        const fy = Math.abs(pb);
                        const q = cplxSq(fx, fy);
                        body +=
                            blockSep +
                            `${orbitWorkedPlainZkLabel(k)} = (|Re ${orbitWorkedPlainZkLabel(k - 1)}| + i|Im ${orbitWorkedPlainZkLabel(k - 1)}|)² + c` +
                            `\n= ${Pcoord(fx, fy)}² + ${Pcoord(cr, ci)}` +
                            `\n= ${Pcoord(q.x, q.y)} + ${Pcoord(cr, ci)}` +
                            `\n${Pcoord(zs[i].x, zs[i].y)}`;
                        pa = zs[i].x;
                        pb = zs[i].y;
                    }
                }
                return body;
            }

            function orbitWorkedPanelPlainCzOnly(cr, ci, z0x, z0y) {
                const Pcoord = (x, y) => `(${orbitWorkedPlainCoord(x)} | ${orbitWorkedPlainCoord(y)})`;
                return `c = ${Pcoord(cr, ci)}\nz₀ = ${Pcoord(z0x, z0y)}`;
            }

            /** Kurzer Hinweis im Rechenpanel: KaTeX wie die Hauptausgabe, sonst Unicode-Plaintext (keine rohen `$`). */
            function orbitWorkedRenderPlaceholder(hostEl, tex, plainUnicode) {
                hostEl.innerHTML = '';
                hostEl.classList.remove('orbit-mb-worked-plain');
                if (typeof katex !== 'undefined') {
                    try {
                        katex.render(tex, hostEl, { throwOnError: false, displayMode: true });
                    } catch (_) {
                        hostEl.classList.add('orbit-mb-worked-plain');
                        hostEl.textContent = plainUnicode;
                    }
                } else {
                    hostEl.classList.add('orbit-mb-worked-plain');
                    hostEl.textContent = plainUnicode;
                }
            }

            /** CacheSegment für \(z\)-Orbit-Punkte (\(;\)-getrennte Paare \texttt{NKS}). */
            function orbitWorkedZsMbWorkedCacheSeg(zs, nk) {
                if (!zs || !zs.length) return '';
                return zs.map((p) => p.x.toFixed(nk) + '|' + p.y.toFixed(nk)).join(';');
            }

            /**
             Nur nach neu aufgebautem Inhalt ans untere Ende scrollen.
             Nicht bei Cache-Hit (\texttt{syncOrbitMbWorkedExample} läuft pro Orbit-Zeichenzyklus) — sonst bleibt manuelles Scrollen nicht bestehen.
             */
            function orbitWorkedScrollTexToBottom() {
                requestAnimationFrame(() =>
                    requestAnimationFrame(() => {
                        try {
                            const sc = document.getElementById('orbit-mb-worked-tex-scroll');
                            if (sc) sc.scrollTop = sc.scrollHeight;
                        } catch (_) {}
                    }),
                );
            }

            function orbitWorkedFinishMbWorkedLayout() {
                orbitWorkedBoxReclampPersisted();
                orbitWorkedScrollTexToBottom();
            }

            function syncOrbitMbWorkedExample() {
                const wrap = document.getElementById('orbit-mb-worked');
                if (!wrap) return;
                const show = mainPlane === 'ORBIT' && orbitShowWorkedCalc;
                wrap.hidden = !show;
                wrap.setAttribute('aria-hidden', show ? 'false' : 'true');
                if (!show) {
                    syncOrbitWorkedMemoStrip(false);
                    return;
                }

                const host = document.getElementById('orbit-mb-worked-tex');
                if (!host) return;

                const snap = orbitWorkedPanelSnap;
                const kFlag = typeof katex !== 'undefined' ? 'k' : 't';

                /** Nur ein Leg angezeigt, Budget < 2: Rechenweg bis \(z_1\) ohne leeres Panel. */
                const hideAwaitLegs =
                    snap &&
                    snap.zs &&
                    snap.zs.length === 1 &&
                    snap.legsBudget !== null &&
                    snap.legsBudget < 2;

                if (!snap) {
                    syncOrbitWorkedMemoStrip(false);
                    const cacheTag = `${kFlag}|hint|init`;
                    if (host.dataset.mbWorked === cacheTag) {
                        return;
                    }
                    host.dataset.mbWorked = cacheTag;
                    orbitWorkedRenderPlaceholder(
                        host,
                        '\\textbf{Orbitebene}\\\\\\text{Zeichnung startet gleich.}',
                        'Zeichnung startet gleich.',
                    );
                    orbitWorkedFinishMbWorkedLayout();
                    return;
                }

                const { cr, ci, z0x, z0y, burnOrbit } = snap;
                const zs = snap.zs && snap.zs.length ? snap.zs : [];

                /** Merkhilfe \((x+\mathrm{i}y)^2\) gilt für \(z^2+c\) — Burning-Ship-Formel \(|\cdot|\) anderer Schlüssel. */
                const showSqMemo = !burnOrbit;
                const nk = ORBIT_COORD_NKS;

                const paintMbWorkedMain = (cacheKey, tex, plainUnicode) => {
                    if (host.dataset.mbWorked === cacheKey) {
                        syncOrbitWorkedMemoStrip(showSqMemo);
                        return;
                    }
                    delete host.dataset.mbWorked;
                    host.classList.remove('orbit-mb-worked-plain');
                    syncOrbitWorkedMemoStrip(showSqMemo);
                    if (typeof katex !== 'undefined') {
                        host.innerHTML = '';
                        katex.render(tex, host, {
                            throwOnError: false,
                            displayMode: true,
                            maxExpand: ORBIT_WORKED_KATEX_MAX_EXPAND,
                        });
                        host.dataset.mbWorked = cacheKey;
                        orbitWorkedFinishMbWorkedLayout();
                        return;
                    }
                    host.textContent = plainUnicode;
                    host.classList.add('orbit-mb-worked-plain');
                    host.dataset.mbWorked = cacheKey;
                    orbitWorkedFinishMbWorkedLayout();
                };

                if (!zs.length) {
                    const cacheKey = [
                        kFlag,
                        ORBIT_WORKED_PANEL_TEX_REV,
                        'cz',
                        burnOrbit ? 'B' : 'S',
                        cr.toFixed(nk),
                        ci.toFixed(nk),
                        z0x.toFixed(nk),
                        z0y.toFixed(nk),
                    ].join('|');
                    paintMbWorkedMain(
                        cacheKey,
                        orbitWorkedPanelKatexCzOnly(cr, ci, z0x, z0y),
                        orbitWorkedPanelPlainCzOnly(cr, ci, z0x, z0y),
                    );
                    return;
                }

                if (hideAwaitLegs) {
                    const cacheKey = [
                        kFlag,
                        ORBIT_WORKED_PANEL_TEX_REV,
                        burnOrbit ? 'B' : 'S',
                        cr.toFixed(nk),
                        ci.toFixed(nk),
                        z0x.toFixed(nk),
                        z0y.toFixed(nk),
                        orbitWorkedZsMbWorkedCacheSeg(zs, nk),
                    ].join('|');
                    paintMbWorkedMain(
                        cacheKey,
                        orbitWorkedPanelKatex(cr, ci, z0x, z0y, zs, burnOrbit),
                        orbitWorkedPanelPlain(cr, ci, z0x, z0y, zs, burnOrbit),
                    );
                    return;
                }

                if (zs.length < 2) {
                    syncOrbitWorkedMemoStrip(false);
                    const nextK = zs.length + 1;
                    const zkPlain = orbitWorkedPlainZkLabel(nextK);
                    const cacheTag =
                        `${kFlag}|hint|escaped|${snap.legsBudget}|${orbitWorkedZsMbWorkedCacheSeg(zs, nk)}`;
                    if (host.dataset.mbWorked === cacheTag) {
                        return;
                    }
                    host.dataset.mbWorked = cacheTag;
                    orbitWorkedRenderPlaceholder(
                        host,
                        '\\textbf{Achtung}\\\\' +
                            '\\lvert z\\rvert^{2}\\! > 4\\ \\text{vor }\\textcolor{' +
                            ORBIT_WORKED_STEP_HEAD_COLOR +
                            '}{z_{' +
                            nextK +
                            '}}\\text{ — kein weiterer Punkt im Plot.}',
                        '|z|² > 4 vor ' + zkPlain + ' — kein weiterer Punkt im Plot.',
                    );
                    orbitWorkedFinishMbWorkedLayout();
                    return;
                }

                const cacheKey = [
                    kFlag,
                    ORBIT_WORKED_PANEL_TEX_REV,
                    burnOrbit ? 'B' : 'S',
                    cr.toFixed(nk),
                    ci.toFixed(nk),
                    z0x.toFixed(nk),
                    z0y.toFixed(nk),
                    orbitWorkedZsMbWorkedCacheSeg(zs, nk),
                ].join('|');

                paintMbWorkedMain(
                    cacheKey,
                    orbitWorkedPanelKatex(cr, ci, z0x, z0y, zs, burnOrbit),
                    orbitWorkedPanelPlain(cr, ci, z0x, z0y, zs, burnOrbit),
                );
            }
