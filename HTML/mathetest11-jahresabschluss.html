  questions: [
    {

      steps: [
        'Beide Seiten mit $2$ multiplizieren: $2s = a\\,t^2$',
        'Durch $a$ teilen: $t^2 = \\dfrac{2s}{a}$',
        'Wurzel ziehen; wegen $t>0$ nur die positive Lösung: $t = \\sqrt{\\dfrac{2s}{a}}$'

      solution: 0

    {
      q: 'Wie lautet $(3x-2)^2$ ausmultipliziert?',

        '$a^2 = (3x)^2 = 9x^2$  ·  $2ab = 2\\cdot 3x\\cdot 2 = 12x$  ·  $b^2 = 4$',
        'Zusammensetzen: $(3x-2)^2 = 9x^2 - 12x + 4$'
      ],
      solution: 1
    },
    {
      q: 'Ein Preis wird zuerst um 20 % gesenkt und danach wieder um 20 % erhöht. Wie verhält sich der Endpreis zum Ausgangspreis?',
      opts: ['Er ist genauso hoch.', 'Er ist 4 % höher.', 'Er ist 4 % niedriger.', 'Er ist 20 % niedriger.'],
      steps: [
        'Senkung um 20 % bedeutet Faktor $0{,}8$',
        'Erhöhung um 20 % bedeutet Faktor $1{,}2$',
        'Nacheinander heißt multiplizieren: $0{,}8 \\cdot 1{,}2 = 0{,}96$',
        '$96\\,\\%$ des Ausgangspreises, also 4 % niedriger. Merke: Prozentänderungen werden multipliziert, nicht addiert.'
      ],
      solution: 2
    },
    {
      q: 'Ein Zylinder hat den Radius $r = 2$ cm und die Höhe $h = 3$ cm. Wie groß ist seine Oberfläche $A = 2\\pi r(r+h)$?',

      steps: [
        'Formel notieren: $A = 2\\pi r (r+h)$',
        'Einsetzen: $A = 2\\pi \\cdot 2\\,(2+3)$',
        'Ausrechnen: $A = 2\\pi \\cdot 2 \\cdot 5 = 20\\pi\\ \\mathrm{cm^2} \\approx 62{,}8\\ \\mathrm{cm^2}$'
      ],
      solution: 1

    {
      q: 'Welchen größtmöglichen Definitionsbereich hat $f(x) = \\dfrac{1}{x-3}$?',
      opts: ['$\\mathbb{R}$', '$\\mathbb{R}\\setminus\\{0\\}$', '$x > 3$', '$\\mathbb{R}\\setminus\\{3\\}$'],
      steps: [
        'Ein Bruch ist nur definiert, wenn der Nenner nicht null ist: $x - 3 \\neq 0$',
        'Auflösen: $x \\neq 3$',
        'Also $D = \\mathbb{R}\\setminus\\{3\\}$ — bei $x=3$ liegt eine Polstelle.'
      ],
      solution: 3

    {
      q: 'Welche Symmetrie besitzt der Graph von $f(x) = x^4 - 3x^2$?',
      opts: ['Achsensymmetrisch zur $y$-Achse', 'Punktsymmetrisch zum Ursprung', 'Achsensymmetrisch zur $x$-Achse', 'Keine Symmetrie'],
      steps: [
        'Symmetrie prüft man mit $f(-x)$: $f(-x) = (-x)^4 - 3(-x)^2$',
        'Gerade Exponenten schlucken das Minus: $f(-x) = x^4 - 3x^2$',
        'Es gilt $f(-x) = f(x)$ ⇒ achsensymmetrisch zur $y$-Achse (nur gerade Exponenten ⇒ gerade Funktion).'
      ],
      solution: 0
    },
    {
      q: 'Eine Gerade verläuft durch die Punkte $P(1|5)$ und $Q(3|11)$. Wie lautet ihre Gleichung?',
      opts: ['$y = 3x + 2$', '$y = 2x + 3$', '$y = 3x - 2$', '$y = 6x - 1$'],
      steps: [
        'Anstieg aus zwei Punkten: $m = \\dfrac{y_2-y_1}{x_2-x_1} = \\dfrac{11-5}{3-1} = \\dfrac{6}{2} = 3$',
        '$P(1|5)$ in $y = 3x + n$ einsetzen: $5 = 3\\cdot 1 + n \\Rightarrow n = 2$',
        'Gleichung: $y = 3x + 2$; Probe mit $Q$: $3\\cdot 3 + 2 = 11$ ✓'
      ],
      solution: 0
    },
    {
      q: 'Ein Kapital von 1000 € wird 5 Jahre lang mit 3 % pro Jahr verzinst (Zinseszins). Welcher Ansatz ist richtig?',
      opts: ['$1000 \\cdot 0{,}03 \\cdot 5$', '$1000 \\cdot 1{,}03 \\cdot 5$', '$1000 \\cdot 1{,}03^{5}$', '$1000 + 1{,}03^{5}$'],
      steps: [
        '3 % Zinsen bedeuten pro Jahr den Wachstumsfaktor $q = 1{,}03$',
        'Bei Zinseszins wirkt der Faktor jedes Jahr erneut: $K_n = K_0 \\cdot q^{\\,n}$',
        'Einsetzen: $K_5 = 1000 \\cdot 1{,}03^{5} \\approx 1159{,}27$ €',
        '$1000\\cdot 0{,}03\\cdot 5 = 150$ € wären nur einfache Zinsen — ohne Zins auf die Zinsen.'
      ],
      solution: 2
    },
    {
      q: 'Wie viel Prozent eines radioaktiven Stoffes sind nach drei Halbwertszeiten noch vorhanden?',
      opts: ['50 %', '25 %', '12,5 %', '0 %'],
      steps: [
        'Jede Halbwertszeit halbiert den Bestand: Faktor $\\tfrac{1}{2}$',
        'Drei Halbwertszeiten: $\\left(\\tfrac{1}{2}\\right)^3 = \\tfrac{1}{8}$',
        '$\\tfrac{1}{8} = 0{,}125 = 12{,}5\\,\\%$ — exponentieller Zerfall erreicht nie exakt null.'
      ],
      solution: 2
    },
    {
      q: 'Welche Lösungen hat die Gleichung $x^2 - 5x + 6 = 0$?',
      opts: ['$x_1 = -2$, $x_2 = -3$', '$x_1 = 2$, $x_2 = 3$', '$x_1 = 1$, $x_2 = 6$', '$x_1 = 5$, $x_2 = 6$'],
      steps: [
        'Normalform ablesen: $p = -5$, $q = 6$',
        '$p$-$q$-Formel: $x_{1,2} = -\\dfrac{p}{2} \\pm \\sqrt{\\left(\\dfrac{p}{2}\\right)^2 - q} = 2{,}5 \\pm \\sqrt{6{,}25 - 6}$',
        '$x_{1,2} = 2{,}5 \\pm 0{,}5$, also $x_1 = 2$ und $x_2 = 3$',
        'Probe mit Vieta: $x_1 + x_2 = 5 = -p$  und  $x_1 \\cdot x_2 = 6 = q$ ✓'
      ],
      solution: 1
    },
    {
      q: 'Wo liegt der Scheitelpunkt der Parabel $f(x) = (x-3)^2 - 4$?',
      opts: ['$S(-3|-4)$', '$S(3|4)$', '$S(3|-4)$', '$S(-3|4)$'],
      steps: [
        'Scheitelpunktform: $f(x) = a\\,(x-d)^2 + e$ mit Scheitel $S(d|e)$',
        'Vergleich mit $f(x) = (x-3)^2 - 4$: $d = 3$, $e = -4$',
        '$S(3|-4)$ — Vorsicht: das Minus in der Klammer dreht das Vorzeichen von $d$ um.'
      ],
      solution: 2
    },
    {
      q: 'Welche Periode hat die Funktion $f(x) = \\sin(2x)$?',
      opts: ['$\\pi$', '$2\\pi$', '$4\\pi$', '$\\tfrac{\\pi}{2}$'],
      steps: [
        'Allgemein hat $\\sin(bx)$ die Periode $T = \\dfrac{2\\pi}{|b|}$',
        'Hier ist $b = 2$',
        '$T = \\dfrac{2\\pi}{2} = \\pi$ — die Schwingung läuft doppelt so schnell wie $\\sin x$.'
      ],
      solution: 0
    },
    {
      q: 'Wie erhält man den Graphen der Umkehrfunktion aus dem Graphen von $f$?',
      opts: ['Durch Spiegelung an der $x$-Achse', 'Durch Spiegelung an der Geraden $y = x$', 'Durch Spiegelung an der $y$-Achse', 'Durch Verschiebung um 1 nach oben'],
      steps: [
        'Umkehren heißt: $x$ und $y$ tauschen die Rollen',
        'Vertauschte Koordinaten $(a|b) \\rightarrow (b|a)$ entsprechen geometrisch der Spiegelung an der Winkelhalbierenden $y = x$',
        'Beispiel: $f(x) = x^2$ für $x \\ge 0$ hat $(2|4)$, die Umkehrung $f^{-1}(x) = \\sqrt{x}$ hat $(4|2)$'
      ],
      solution: 1
    },
    {
      q: 'Welchen Wert hat $x$ in der Gleichung $2^x = 0{,}25$?',
      opts: ['$x = 2$', '$x = -2$', '$x = 0{,}5$', '$x = -4$'],
      steps: [
        '$0{,}25$ als Bruch schreiben: $0{,}25 = \\dfrac{1}{4} = \\dfrac{1}{2^2}$',
        'Als Potenz mit Basis 2: $\\dfrac{1}{2^2} = 2^{-2}$',
        'Gleiche Basis ⇒ gleiche Exponenten: $2^x = 2^{-2} \\Rightarrow x = -2$'
      ],
      solution: 1
    },
    {
      q: 'Ein Guthaben wächst jährlich um 5 %. Nach welcher Zeit hat es sich verdoppelt, d. h. $1{,}05^{\\,t} = 2$?',
      opts: ['$t = \\dfrac{\\ln 2}{\\ln 1{,}05} \\approx 14{,}2$ Jahre', '$t = \\dfrac{2}{1{,}05} \\approx 1{,}9$ Jahre', '$t = \\ln 2 \\cdot \\ln 1{,}05 \\approx 0{,}03$ Jahre', '$t = 20$ Jahre'],
      steps: [
        'Ansatz: $1{,}05^{\\,t} = 2$',
        'Beide Seiten logarithmieren: $\\ln\\left(1{,}05^{\\,t}\\right) = \\ln 2$',
        'Logarithmusgesetz $\\ln(a^t) = t\\cdot\\ln a$: $t \\cdot \\ln 1{,}05 = \\ln 2$',
        '$t = \\dfrac{\\ln 2}{\\ln 1{,}05} \\approx \\dfrac{0{,}693}{0{,}0488} \\approx 14{,}2$ Jahre'
      ],
      solution: 0
    },
    {
      q: 'Wie entsteht der Graph von $g(x) = f(x+2)$ aus dem Graphen von $f$?',
      opts: ['Verschiebung um 2 nach rechts', 'Verschiebung um 2 nach oben', 'Verschiebung um 2 nach links', 'Streckung mit dem Faktor 2'],
      steps: [
        'Der Parameter steht im Argument: $g(x) = f(x + c)$ mit $c = 2$',
        '$g$ nimmt an der Stelle $x$ schon den Wert an, den $f$ erst bei $x+2$ hat',
        'Der Graph wandert also 2 Einheiten nach links — im Argument wirkt $+c$ gegenläufig',
        'Zum Vergleich: $f(x) + 2$ verschiebt um 2 nach oben.'
      ],
      solution: 2
    },
    {
      q: 'Wie heißt die Matrix $\\begin{pmatrix} 1 & 0 \\\\ 0 & 1 \\end{pmatrix}$?',
      opts: ['Nullmatrix', 'Diagonalmatrix ohne besonderen Namen', 'Einheitsmatrix', 'Dreiecksmatrix'],
      steps: [
        'Die Matrix ist quadratisch ($2\\times 2$)',
        'Auf der Hauptdiagonale stehen nur Einsen, sonst nur Nullen',
        'Das ist die Einheitsmatrix $E$ (auch $I$) — das neutrale Element: $E \\cdot \\vec{x} = \\vec{x}$'
      ],
      solution: 2
    },
    {
      q: 'Beim Gauß-Verfahren entsteht in der letzten Zeile die Aussage $0 = 5$. Was folgt daraus für das lineare Gleichungssystem?',
      opts: ['Es hat genau eine Lösung.', 'Es hat unendlich viele Lösungen.', 'Es hat keine Lösung.', 'Es muss neu aufgestellt werden — so etwas kann nicht auftreten.'],
      steps: [
        'Die Zeile ausgeschrieben lautet $0\\cdot x + 0\\cdot y + 0\\cdot z = 5$',
        'Die linke Seite ist für jede Belegung $0$ — die Aussage $0 = 5$ ist ein Widerspruch',
        'Also $L = \\{\\,\\}$: keine Lösung. Geometrisch haben die drei Ebenen keinen gemeinsamen Punkt.',
        'Zum Vergleich: Ergäbe sich $0 = 0$, gäbe es unendlich viele Lösungen (freier Parameter).'
      ],
      solution: 2
    },
    {
      q: 'Ein Würfel wird zweimal geworfen. Wie groß ist die Wahrscheinlichkeit, zweimal eine Sechs zu würfeln (Pfadmultiplikation)?',
      opts: ['$\\tfrac{1}{36}$', '$\\tfrac{1}{12}$', '$\\tfrac{1}{6}$', '$\\tfrac{2}{6}$'],
      steps: [
        'Zweistufiger Zufallsversuch, die Stufen sind unabhängig',
        'Jede Stufe: $P(\\text{Sechs}) = \\tfrac{1}{6}$',
        '1. Pfadregel (Pfadmultiplikation): $P = \\tfrac{1}{6} \\cdot \\tfrac{1}{6}$',
        '$P = \\tfrac{1}{36} \\approx 2{,}8\\,\\%$'
      ],
      solution: 0
    },
    {
      q: 'Von 100 befragten Personen tragen 40 eine Brille; 25 dieser Brillenträger sind Frauen. Eine zufällig ausgewählte Person trägt eine Brille. Mit welcher Wahrscheinlichkeit ist es eine Frau?',
      opts: ['25 %', '40 %', '62,5 %', '65 %'],
      steps: [
        'Gesucht ist die bedingte Wahrscheinlichkeit $P(\\text{Frau} \\mid \\text{Brille})$',
        'Vierfeldertafel: Brillenträger gesamt $= 40$, davon Frauen $= 25$',
        '$P(\\text{Frau} \\mid \\text{Brille}) = \\dfrac{25}{40} = 0{,}625 = 62{,}5\\,\\%$',
        'Nicht $\\tfrac{25}{100}$: die Bedingung „trägt Brille“ verkleinert die Grundmenge von 100 auf 40.'
      ],
      solution: 2
    }
  ]
