  questions: [

      steps: [
        'Anstieg: $m = \\dfrac{\\Delta y}{\\Delta x} = \\dfrac{7 - 3}{3 - 1} = \\dfrac{4}{2} = 2$',
        'Punkt $A$ einsetzen: $3 = 2 \\cdot 1 + n$, also $n = 1$.',
        'Probe mit $B$: $2 \\cdot 3 + 1 = 7$. Passt.',

    {

      steps: [

        '$3x = 12$, also $x = 4$.',
        'Probe: $3 \\cdot 4 - 12 = 0$.'

      solution: 0

    {
      q: 'Unter welchem Winkel schneidet die Gerade $f(x) = 0{,}5x + 1$ die $x$-Achse?',

      steps: [
        'Gleichsetzen: $2x - 1 = -x + 5$',

        'Probe über die Linearfaktoren: $(x - 2)(x - 3) = x^2 - 5x + 6$. Passt.'

      solution: 2

    {
      q: 'Bestimme den Scheitelpunkt der Parabel $f(x) = x^2 - 4x + 1$.',
      opts: ['$S(2|-3)$', '$S(4|1)$', '$S(-2|13)$', '$S(2|1)$'],
      steps: [
        'Scheitelstelle: $x_S = -\\dfrac{b}{2a} = -\\dfrac{-4}{2} = 2$',
        '$y_S = f(2) = 4 - 8 + 1 = -3$, also $S(2|-3)$.',
        'Falle: das Vorzeichen in $-\\dfrac{b}{2a}$ vergessen liefert $x_S = -2$.'

    {

    {

    {

      opts: ['$2x^6$', '$4x^5$', '$2x^5$', '$4x^6$'],

        '$(2x^3)^2 = 2^2 \\cdot x^{3 \\cdot 2} = 4x^6$',
        'Falle: Exponenten werden hier multipliziert, nicht addiert.'

      solution: 3

    {

      opts: ['$81$', '$48$', '$24$', '$1296$'],

      opts: ['$x = 16$', '$x = 4$', '$x = 3$', '$x = 5$'],
      steps: [
        'Erst durch $5$ teilen: $2^x = 16$',
        '$16 = 2^4$, Exponentenvergleich: $x = 4$',
        'Probe: $5 \\cdot 2^4 = 5 \\cdot 16 = 80$.'

      solution: 1

    {
      q: 'Ein Kapital von $2000$ Euro wird $5$ Jahre lang mit $3\\,\\%$ pro Jahr verzinst (Zinseszins). Wie hoch ist das Kapital danach?',

      solution: 1

      steps: [
        'Multiplikationsregel: $P(A) \\cdot P(B) = 0{,}4 \\cdot 0{,}5 = 0{,}2 = P(A \\cap B)$, also unabhängig.',

      steps: [
        'Pfadregel: $P(rr) = \\dfrac{3}{5} \\cdot \\dfrac{2}{4}$ - nach dem ersten Zug liegen nur noch $4$ Kugeln in der Urne.',

        'Falle: $\\dfrac{3}{5} \\cdot \\dfrac{3}{5} = \\dfrac{9}{25}$ gilt nur mit Zurücklegen.'

      solution: 0

        '$P(\\text{mindestens ein Treffer}) = 1 - 0{,}512 = 0{,}488$',
        'Falle: $3 \\cdot 0{,}2 = 0{,}6$ addiert die Pfade falsch; $0{,}2^3$ wäre „drei Treffer“.'
      ],
      solution: 3

    {
      q: 'Von $200$ Befragten sind $120$ Frauen. $90$ Personen nutzen eine Lern-App, darunter $60$ Frauen. Wie viele Männer nutzen die App nicht?',

      steps: [

        'Männer mit App: $90 - 60 = 30$',
        'Männer ohne App: $80 - 30 = 50$'

      q: 'Zwei Maschinen fertigen ein Bauteil: $M_1$ liefert $60\\,\\%$ der Stücke mit $2\\,\\%$ Ausschuss, $M_2$ liefert $40\\,\\%$ mit $5\\,\\%$ Ausschuss. Ein Stück ist Ausschuss. Mit welcher Wahrscheinlichkeit stammt es von $M_2$?',
