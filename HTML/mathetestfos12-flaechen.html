      figcap: 'f(x) = 1 − x² über [0; 2]: A₁ liegt über, A₂ unter der x-Achse',
      opts: ['$A = -\\dfrac{2}{3}$', '$A = 2$', '$A = \\dfrac{4}{3}$', '$A = \\dfrac{2}{3}$'],
      steps: [
        'Nullstelle im Innern: $x = 1$. Teilflächen getrennt rechnen, $F(x) = x - \\dfrac{x^3}{3}$.',
        '$A_1 = \\int_0^1 f(x)\\,dx = 1 - \\dfrac{1}{3} = \\dfrac{2}{3}$ und $\\int_1^2 f(x)\\,dx = \\left(2 - \\dfrac{8}{3}\\right) - \\dfrac{2}{3} = -\\dfrac{4}{3}$, also $A_2 = \\dfrac{4}{3}$.',
        '$A = A_1 + A_2 = \\dfrac{2}{3} + \\dfrac{4}{3} = 2$.',
        'Das Integral über $[0;2]$ wäre nur $-\\dfrac{2}{3}$ - es verrechnet die beiden Stücke gegeneinander.'

    {
      q: 'Welchen Inhalt hat die Fläche, die der Graph von $f(x) = x^3 - 4x$ über $[-2;2]$ mit der $x$-Achse einschließt?',
      opts: ['$4$', '$0$', '$8$', '$16$'],
      steps: [
        'Nullstellen: $x\\,(x^2 - 4) = 0$, also $x = -2$, $x = 0$, $x = 2$ - der Graph wechselt bei $x = 0$ die Seite.',
        '$F(x) = \\dfrac{x^4}{4} - 2x^2$, also $\\int_0^2 f(x)\\,dx = (4 - 8) - 0 = -4$; wegen der Punktsymmetrie ist $\\int_{-2}^{0} f(x)\\,dx = +4$.',
        '$A = |-4| + |4| = 8$. Das Integral über $[-2;2]$ ist dagegen $0$ - der klassische Fehler.'
      ],
      solution: 2

    {
      q: 'Berechne den Inhalt der Fläche zwischen dem Graphen von $f(x) = x^2 - 2x$ und der $x$-Achse über $[1;4]$.',
      opts: ['$\\dfrac{2}{3}$', '$6$', '$\\dfrac{20}{3} \\approx 6{,}67$', '$\\dfrac{22}{3} \\approx 7{,}33$'],
      steps: [
        'Nullstelle im Intervall: $x = 2$. Mit $F(x) = \\dfrac{x^3}{3} - x^2$ ist $F(1) = -\\dfrac{2}{3}$, $F(2) = -\\dfrac{4}{3}$, $F(4) = \\dfrac{16}{3}$.',
        '$\\int_1^2 f(x)\\,dx = -\\dfrac{4}{3} + \\dfrac{2}{3} = -\\dfrac{2}{3}$ (unter der Achse) und $\\int_2^4 f(x)\\,dx = \\dfrac{16}{3} + \\dfrac{4}{3} = \\dfrac{20}{3}$.',
        '$A = \\dfrac{2}{3} + \\dfrac{20}{3} = \\dfrac{22}{3}$; das Integral über $[1;4]$ ist nur $6$.'
      ],
      solution: 3

    {
      q: 'Wie berechnet man den Inhalt der Fläche, die zwei Graphen einschließen?',
      opts: ['$A = \\left|\\int_a^b f(x)\\,dx\\right| + \\left|\\int_a^b g(x)\\,dx\\right|$', '$A = \\int_a^b \\left(f(x) + g(x)\\right)dx$ mit den Schnittstellen $a$ und $b$.', '$A = \\int_a^b f(x) \\cdot g(x)\\,dx$ mit den Schnittstellen $a$ und $b$.', '$A = \\int_a^b \\left(f(x) - g(x)\\right)dx$, wobei $a$ und $b$ die Schnittstellen sind und $f$ oben verläuft.'],
      steps: [
        'Erst die Schnittstellen aus $f(x) = g(x)$ - sie sind die Integrationsgrenzen.',
        'Dann die Differenzfunktion „oben minus unten“ integrieren; dabei ist es egal, ob die Graphen über oder unter der $x$-Achse liegen.',

        'Schnittstellen: $x^2 = x \\Leftrightarrow x\\,(x - 1) = 0$, also $x = 0$ und $x = 1$.',
        'Auf $[0;1]$ liegt $g$ oben: $A = \\int_0^1 \\left(x - x^2\\right)dx = \\left[\\dfrac{x^2}{2} - \\dfrac{x^3}{3}\\right]_0^1 = \\dfrac{1}{2} - \\dfrac{1}{3}$',
