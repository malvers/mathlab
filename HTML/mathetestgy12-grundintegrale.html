  dashSub: 'Gymnasium · Jahrgangsstufe 12 · Woche 3 · Live-Auswertung: anonyme Einzelscores + Gruppenleistung pro Aufgabe',
  back: 'svp/mathe/mathegy12.html', /* opened from the plan */
  /* Blocks: Potenzregel mit Wurzeln und Brüchen (1, 2, 8, 9, 19), Grundintegrale e^x, 1/x, sin, cos (3-7, 20), bestimmte Integrale (10-13, 15), Umformen und Probe (14, 16-18). Ohne Hilfsmittel. */
  questions: [
    {
      q: 'Berechne $\\int \\sqrt{x}\\,\\mathrm{d}x$.',
      opts: ['$x^{3/2} + C$', '$\\tfrac23 x^{3/2} + C$', '$\\tfrac32 x^{3/2} + C$', '$\\dfrac{1}{2\\sqrt{x}} + C$'],
      steps: [
        '$\\sqrt{x} = x^{1/2}$, neuer Exponent $\\tfrac32$: $\\dfrac{x^{3/2}}{3/2} = \\tfrac23 x^{3/2}$.',
        'Probe: $\\left(\\tfrac23 x^{3/2}\\right)^{\\prime} = \\tfrac23 \\cdot \\tfrac32 x^{1/2} = \\sqrt{x}$ ✔. $\\tfrac{1}{2\\sqrt x}$ ist die Ableitung.'
      ],
      solution: 1
    },
    {
      q: 'Berechne $\\int \\dfrac{1}{x^3}\\,\\mathrm{d}x$ für $x \\neq 0$.',
      opts: ['$-\\dfrac{1}{2x^2} + C$', '$\\dfrac{1}{4x^4} + C$', '$-\\dfrac{3}{x^4} + C$', '$\\ln|x^3| + C$'],
      steps: [
        '$\\dfrac{1}{x^3} = x^{-3}$, neuer Exponent $-2$: $\\dfrac{x^{-2}}{-2}$.',
        'Also $-\\dfrac{1}{2x^2} + C$. Der Logarithmus gehört nur zu $x^{-1}$.'
      ],
      solution: 0
    },
    {
      q: 'Berechne $\\int \\mathrm{e}^x\\,\\mathrm{d}x$.',
      opts: ['$\\dfrac{\\mathrm{e}^{x+1}}{x + 1} + C$', '$x\\,\\mathrm{e}^{x-1} + C$', '$\\ln x + C$', '$\\mathrm{e}^x + C$'],
      steps: [
        '$(\\mathrm{e}^x)^{\\prime} = \\mathrm{e}^x$, also ist $\\mathrm{e}^x$ seine eigene Stammfunktion.',
        'Die Potenzregel gilt nicht: Bei $\\mathrm{e}^x$ steht die Variable im Exponenten.'
      ],
      solution: 3

    {
      q: 'Welche Funktion ist für $x > 0$ eine Stammfunktion von $f(x) = \\dfrac1x$?',

      steps: [
        '$(\\ln x)^{\\prime} = \\dfrac1x$.',
        'Die Potenzregel versagt bei $x^{-1}$: Man müsste durch $0$ teilen. Allgemein gilt $\\int \\tfrac1x\\,\\mathrm{d}x = \\ln|x| + C$.'
      ],
      solution: 1
    },
    {
      q: 'Berechne $\\int \\sin x\\,\\mathrm{d}x$.',
      opts: ['$\\cos x + C$', '$-\\cos x + C$', '$\\tfrac12 \\sin^2 x + C$', '$-\\sin x + C$'],
      steps: [
        '$(\\cos x)^{\\prime} = -\\sin x$, also $(-\\cos x)^{\\prime} = \\sin x$.',
        'Darum $\\int \\sin x\\,\\mathrm{d}x = -\\cos x + C$. Das Vorzeichen ist die häufigste Falle.'

      solution: 1

    {
      q: 'Berechne $\\int \\cos x\\,\\mathrm{d}x$.',
      opts: ['$-\\cos x + C$', '$\\tfrac12 \\cos^2 x + C$', '$-\\sin x + C$', '$\\sin x + C$'],
      steps: [
        '$(\\sin x)^{\\prime} = \\cos x$.',
        'Also $\\int \\cos x\\,\\mathrm{d}x = \\sin x + C$.'
      ],
      solution: 3
    },
    {
      q: 'Berechne $\\int \\left(3\\,\\mathrm{e}^x - \\dfrac2x\\right)\\mathrm{d}x$ für $x > 0$.',
      opts: ['$3\\,\\mathrm{e}^x + \\dfrac{2}{x^2} + C$', '$3x\\,\\mathrm{e}^x - 2\\ln x + C$', '$3\\,\\mathrm{e}^x - 2\\ln x + C$', '$3\\,\\mathrm{e}^x - 2x + C$'],
      steps: [
        'Summen- und Faktorregel: Summandenweise integrieren, Faktoren bleiben stehen.',
        '$3 \\int \\mathrm{e}^x\\,\\mathrm{d}x - 2 \\int \\tfrac1x\\,\\mathrm{d}x = 3\\,\\mathrm{e}^x - 2\\ln x + C$.'
      ],
      solution: 2
    },
    {
      q: 'Berechne $\\int x^{2/3}\\,\\mathrm{d}x$.',
      opts: ['$\\tfrac23 x^{-1/3} + C$', '$\\tfrac53 x^{5/3} + C$', '$\\tfrac35 x^{5/3} + C$', '$\\tfrac32 x^{5/3} + C$'],
      steps: [
        'Neuer Exponent $\\tfrac23 + 1 = \\tfrac53$, durch ihn teilen heißt mit $\\tfrac35$ malnehmen.',
        '$\\int x^{2/3}\\,\\mathrm{d}x = \\tfrac35 x^{5/3} + C$.'
      ],
      solution: 2
    },
    {
      q: 'Berechne $\\int \\dfrac{4}{\\sqrt{x}}\\,\\mathrm{d}x$ für $x > 0$.',

        '$\\dfrac{4}{\\sqrt x} = 4x^{-1/2}$, Stammfunktion $4 \\cdot \\dfrac{x^{1/2}}{1/2} = 8x^{1/2}$.',
        'Probe: $(8\\sqrt x)^{\\prime} = 8 \\cdot \\dfrac{1}{2\\sqrt x} = \\dfrac{4}{\\sqrt x}$ ✔'
      ],
      solution: 2
    },
    {
      q: 'Berechne $\\int_0^{\\pi} \\sin x\\,\\mathrm{d}x$.',

      steps: [
        '$\\left[-\\cos x\\right]_0^{\\pi} = -\\cos\\pi - (-\\cos 0) = 1 + 1$.',
        '$= 2$. Wer $\\cos$ statt $-\\cos$ nimmt, erhält $-2$.'
      ],
      solution: 3
    },
    {
      q: 'Berechne $\\int_1^{\\mathrm{e}} \\dfrac1x\\,\\mathrm{d}x$.',
      opts: ['$1$', '$0$', '$\\dfrac{1}{\\mathrm{e}} - 1$', '$\\mathrm{e} - 1$'],
      steps: [
        '$\\left[\\ln x\\right]_1^{\\mathrm{e}} = \\ln\\mathrm{e} - \\ln 1$.',
        '$= 1 - 0 = 1$.'
      ],
      solution: 0
    },
    {
      q: 'Berechne $\\int_0^1 \\mathrm{e}^x\\,\\mathrm{d}x$.',
      opts: ['$\\mathrm{e}$', '$1$', '$\\mathrm{e} + 1$', '$\\mathrm{e} - 1$'],
      steps: [
        '$\\left[\\mathrm{e}^x\\right]_0^1 = \\mathrm{e}^1 - \\mathrm{e}^0$.',
        '$= \\mathrm{e} - 1 \\approx 1{,}72$. Die untere Grenze liefert $\\mathrm{e}^0 = 1$, nicht $0$.'
      ],
      solution: 3
    },
    {
      q: 'Berechne $\\int_1^4 \\sqrt{x}\\,\\mathrm{d}x$.',
      opts: ['$\\dfrac{14}{3}$', '$3$', '$\\dfrac{16}{3}$', '$\\dfrac{7}{3}$'],
      steps: [
        '$\\left[\\tfrac23 x^{3/2}\\right]_1^4 = \\tfrac23 \\cdot 8 - \\tfrac23 \\cdot 1$, denn $4^{3/2} = 8$.',
        '$= \\tfrac{16}{3} - \\tfrac23 = \\tfrac{14}{3}$.'
      ],
      solution: 0
    },
    {
      q: 'Berechne $\\int \\dfrac{x^2 + 1}{x}\\,\\mathrm{d}x$ für $x > 0$.',
      opts: ['$x + \\ln x + C$', '$\\tfrac12 x^2 - \\dfrac{1}{x^2} + C$', '$\\tfrac12 x^2 + \\ln x + C$', '$\\dfrac{\\frac13 x^3 + x}{\\frac12 x^2} + C$'],
      steps: [
        'Erst teilen: $\\dfrac{x^2 + 1}{x} = x + \\dfrac1x$. Zähler und Nenner getrennt integrieren ist falsch.',
        '$\\int \\left(x + \\tfrac1x\\right)\\mathrm{d}x = \\tfrac12 x^2 + \\ln x + C$.'
      ],
      solution: 2
    },
    {
      q: 'Berechne $\\int_0^{\\pi/2} \\cos x\\,\\mathrm{d}x$.',
      opts: ['$-1$', '$\\dfrac{\\pi}{2}$', '$1$', '$0$'],
      steps: [
        '$\\left[\\sin x\\right]_0^{\\pi/2} = \\sin\\tfrac{\\pi}{2} - \\sin 0$.',
        '$= 1 - 0 = 1$.'
      ],
      solution: 2
    },
    {
      q: 'Welche Funktion ist eine Stammfunktion von $f(x) = 2\\sin x$?',
      opts: ['$F(x) = \\cos(2x)$', '$F(x) = -2\\cos x$', '$F(x) = 2\\cos x$', '$F(x) = -2\\sin x$'],
      steps: [
        'Faktorregel: $\\int 2\\sin x\\,\\mathrm{d}x = 2 \\cdot (-\\cos x) + C$.',
        'Probe: $(-2\\cos x)^{\\prime} = 2\\sin x$ ✔'
      ],
      solution: 1
    },
    {
      q: 'Berechne $\\int \\left(x^3 - 2x + \\dfrac{1}{x^2}\\right)\\mathrm{d}x$ für $x \\neq 0$.',
      opts: ['$\\tfrac14 x^4 - x^2 + \\ln x^2 + C$', '$\\tfrac14 x^4 - x^2 - \\dfrac1x + C$', '$\\tfrac14 x^4 - x^2 + \\dfrac1x + C$', '$3x^2 - 2 - \\dfrac{2}{x^3} + C$'],
      steps: [
        '$\\int x^{-2}\\,\\mathrm{d}x = \\dfrac{x^{-1}}{-1} = -\\dfrac1x$, der Rest mit der Potenzregel.',
        'Ergebnis $\\tfrac14 x^4 - x^2 - \\tfrac1x + C$. $3x^2 - 2 - \\tfrac{2}{x^3}$ ist die Ableitung.'
      ],
      solution: 1
    },
    {
      q: 'Warum kann man $\\int x^{-1}\\,\\mathrm{d}x$ nicht mit der Potenzregel berechnen?',
      opts: ['Der neue Exponent wäre $0$, und man müsste durch $0$ teilen.', 'Weil $x^{-1}$ keine Stammfunktion hat.', 'Weil $x^{-1}$ an jeder Stelle unstetig ist.', 'Weil negative Exponenten beim Integrieren nie erlaubt sind.'],
      steps: [
        'Potenzregel: $\\dfrac{x^{n+1}}{n+1}$ mit $n = -1$ ergibt $\\dfrac{x^0}{0}$.',
        'Stammfunktion ist stattdessen $\\ln|x|$. Für andere negative Exponenten wie $x^{-2}$ gilt die Regel weiter.'
      ],
      solution: 0
    },
    {
      q: 'Berechne $\\int_1^2 \\dfrac{1}{x^2}\\,\\mathrm{d}x$.',
      opts: ['$-\\dfrac12$', '$\\dfrac34$', '$\\ln 2$', '$\\dfrac12$'],
      steps: [
        '$\\left[-\\dfrac1x\\right]_1^2 = -\\dfrac12 - (-1)$.',
        '$= \\dfrac12$. $\\ln 2$ wäre das Integral von $\\tfrac1x$.'
      ],
      solution: 3
    },
    {
      q: 'Berechne $\\int (\\sin x + \\cos x)\\,\\mathrm{d}x$.',
      opts: ['$\\sin x - \\cos x + C$', '$\\cos x - \\sin x + C$', '$\\sin x + \\cos x + C$', '$-\\sin x - \\cos x + C$'],
      steps: [
        '$\\int \\sin x\\,\\mathrm{d}x = -\\cos x$ und $\\int \\cos x\\,\\mathrm{d}x = \\sin x$.',
        'Summe: $\\sin x - \\cos x + C$. Probe: $(\\sin x - \\cos x)^{\\prime} = \\cos x + \\sin x$ ✔'
      ],
      solution: 0
    }
  ]
};
