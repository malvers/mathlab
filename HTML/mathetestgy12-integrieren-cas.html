  dashSub: 'Gymnasium · Jahrgangsstufe 12 · Woche 4 · Live-Auswertung: anonyme Einzelscores + Gruppenleistung pro Aufgabe',

  /* Blocks: lineare Verkettung von Hand (1-6, 10-12, 16), CAS-Ergebnis prüfen (7-9, 13, 15, 20), Anwendung (17), Grenzen des CAS (14, 18, 19). Mit CAS, aber Ergebnisse immer durch Ableiten bestätigen. */
  questions: [
    {
      q: 'Berechne $\\int \\mathrm{e}^{2x}\\,\\mathrm{d}x$.',
      opts: ['$\\dfrac{\\mathrm{e}^{2x+1}}{2x + 1} + C$', '$\\mathrm{e}^{2x} + C$', '$2\\,\\mathrm{e}^{2x} + C$', '$\\tfrac12\\,\\mathrm{e}^{2x} + C$'],
      steps: [
        'Lineare Verkettung: $\\int f(ax + b)\\,\\mathrm{d}x = \\tfrac1a F(ax + b) + C$.',

      solution: 3

    {

      steps: [
        'Stammfunktion von $\\sin$ ist $-\\cos$, wegen der inneren Ableitung $3$ teilt man durch $3$.',
        'Probe: $\\left(-\\tfrac13 \\cos(3x)\\right)^{\\prime} = \\tfrac13 \\sin(3x) \\cdot 3 = \\sin(3x)$ ✔'

      solution: 0

    {
      q: 'Berechne $\\int (2x + 1)^4\\,\\mathrm{d}x$.',

      steps: [
        '$\\tfrac15 (2x + 1)^5$ und dann durch die innere Ableitung $2$ teilen: $\\tfrac{1}{10}$.',

    {

    {

      solution: 1

    {
      q: 'Mit $\\int x\\cos x\\,\\mathrm{d}x = x\\sin x + \\cos x$: Berechne $\\int_0^{\\pi} x\\cos x\\,\\mathrm{d}x$.',

      steps: [
        'Obere Grenze: $\\pi \\sin\\pi + \\cos\\pi = -1$. Untere Grenze: $0 + \\cos 0 = 1$.',

      solution: 2

      solution: 3

      steps: [
        'Stammfunktion: $\\tfrac19 (3x + 1)^3$.',
        '$\\tfrac19 (64 - 1) = 7$. Wer die $1$ an der unteren Grenze vergisst, erhält $\\tfrac{64}{9}$.'
      ],
      solution: 1

    {
      q: 'Berechne $\\int_0^2 \\mathrm{e}^{0{,}5x}\\,\\mathrm{d}x$ auf zwei Nachkommastellen.',

      steps: [
        'Stammfunktion: $2\\,\\mathrm{e}^{0{,}5x}$.',
        '$2\\,\\mathrm{e}^1 - 2\\,\\mathrm{e}^0 = 2(\\mathrm{e} - 1) \\approx 3{,}44$.'
      ],
      solution: 2
    },
    {
      q: 'Berechne $\\int_0^{\\pi} \\sin(2x)\\,\\mathrm{d}x$.',
      opts: ['$2$', '$-1$', '$0$', '$1$'],
      steps: [
        'Stammfunktion $-\\tfrac12 \\cos(2x)$: $-\\tfrac12 \\cos(2\\pi) + \\tfrac12 \\cos 0 = -\\tfrac12 + \\tfrac12$.',
        '$= 0$: Auf $[0;\\ \\pi]$ liegen eine positive und eine gleich große negative Halbwelle.'
      ],
      solution: 2
    },
    {
      q: 'Ein CAS liefert $\\int \\dfrac{x}{x^2 + 1}\\,\\mathrm{d}x = \\tfrac12 \\ln(x^2 + 1)$. Welche Probe bestätigt das?',
      opts: ['$\\left(\\dfrac{x}{x^2 + 1}\\right)^{\\prime} = \\tfrac12 \\ln(x^2 + 1)$', '$\\tfrac12 \\ln(0^2 + 1) = 0$', '$\\ln(x^2 + 1) = \\ln x^2 + \\ln 1$', '$\\left(\\tfrac12 \\ln(x^2 + 1)\\right)^{\\prime} = \\tfrac12 \\cdot \\dfrac{2x}{x^2 + 1} = \\dfrac{x}{x^2 + 1}$'],
      steps: [
        'Eine Stammfunktion prüft man durch Ableiten, hier mit der Kettenregel.',
        'Die innere Ableitung $2x$ hebt sich mit dem Faktor $\\tfrac12$ zu $x$ im Zähler.'
      ],
      solution: 3
    },
    {
      q: 'Ein CAS gibt $\\int \\mathrm{e}^{-x^2}\\,\\mathrm{d}x$ nur mit einer besonderen Funktion an (der Fehlerfunktion). Was folgt daraus?',
      opts: ['Man kann bestimmte Integrale davon trotzdem numerisch berechnen.', 'Die Fläche unter dem Graphen ist unendlich groß.', 'Der Rechner ist defekt.', 'Das Integral existiert nicht.'],
      steps: [
        'Nicht jede Stammfunktion lässt sich mit den bekannten Funktionen hinschreiben.',
        'Bestimmte Integrale wie $\\int_0^1 \\mathrm{e}^{-x^2}\\,\\mathrm{d}x \\approx 0{,}747$ berechnet man numerisch, siehe Wahlbereich 5.'

      solution: 0

      q: 'Ein CAS liefert $\\int \\ln x\\,\\mathrm{d}x = x\\ln x - x$. Berechne $\\int_1^{\\mathrm{e}} \\ln x\\,\\mathrm{d}x$.',
      opts: ['$1$', '$0$', '$\\mathrm{e}$', '$\\mathrm{e} - 1$'],
      steps: [
        'Obere Grenze: $\\mathrm{e}\\ln\\mathrm{e} - \\mathrm{e} = 0$, untere Grenze: $1 \\cdot \\ln 1 - 1 = -1$.',
        '$0 - (-1) = 1$.'

      solution: 0

    {
      q: 'Berechne $\\int_0^2 \\dfrac{1}{x + 1}\\,\\mathrm{d}x$ auf drei Nachkommastellen.',
      opts: ['$\\approx 2{,}000$', '$\\approx 1{,}099$', '$\\approx 0{,}667$', '$\\approx 0{,}693$'],
      steps: [
        'Stammfunktion $\\ln(x + 1)$.',
        '$\\ln 3 - \\ln 1 = \\ln 3 \\approx 1{,}099$.'
      ],
      solution: 1
    },
    {
      q: 'In einen Tank fließen $r(t) = 20\\,\\mathrm{e}^{-0{,}1t}$ Liter pro Minute. Wie viel Wasser fließt in den ersten $10$ Minuten zu?',
      opts: ['$\\approx 200{,}0$ l', '$\\approx 73{,}6$ l', '$\\approx 126{,}4$ l', '$\\approx 7{,}4$ l'],
      steps: [
        '$\\int_0^{10} 20\\,\\mathrm{e}^{-0{,}1t}\\,\\mathrm{d}t = \\left[-200\\,\\mathrm{e}^{-0{,}1t}\\right]_0^{10}$.',
        '$= -200\\,\\mathrm{e}^{-1} + 200 = 200(1 - \\mathrm{e}^{-1}) \\approx 126{,}4$ l. $7{,}4$ l/min ist die Rate am Ende.'
      ],
      solution: 2
    },
    {
      q: 'Ein CAS liefert $\\int_0^{\\pi} \\sin^2 x\\,\\mathrm{d}x = \\dfrac{\\pi}{2}$. Welcher Wert ist das auf zwei Nachkommastellen?',
      opts: ['$\\approx 2{,}00$', '$\\approx 3{,}14$', '$\\approx 0{,}79$', '$\\approx 1{,}57$'],
      steps: [
        '$\\tfrac{\\pi}{2} \\approx 1{,}5708$.',
        'Plausibel: $\\sin^2 x$ liegt zwischen $0$ und $1$ und hat den Mittelwert $\\tfrac12$, also etwa $\\tfrac12 \\cdot \\pi$.'
      ],
      solution: 3
    },
    {
      q: 'Welche Antwort eines CAS für $\\int \\dfrac{2x + 3}{x^2 + 3x}\\,\\mathrm{d}x$ ($x > 0$) ist richtig?',
      opts: ['$\\dfrac{1}{x^2 + 3x} + C$', '$(2x + 3)\\ln x + C$', '$\\ln(x^2 + 3x) + C$', '$\\dfrac{x^2 + 3x}{\\frac13 x^3 + \\frac32 x^2} + C$'],

      q: 'Berechne $\\int_0^1 x^2\\,\\mathrm{e}^{x^3}\\,\\mathrm{d}x$ mit $\\int x^2\\,\\mathrm{e}^{x^3}\\,\\mathrm{d}x = \\tfrac13\\,\\mathrm{e}^{x^3}$.',
