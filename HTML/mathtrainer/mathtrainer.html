<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MATHTRAINER — SchoolTrainer</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;700&family=Orbitron:wght@400;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js"></script>
    <link rel="icon" type="image/png" href="../resources/favicon.png">
    <link rel="stylesheet" href="mathtrainer.css">
</head>

<body>
    <!-- one full-screen stage, like the Swing single-panel app -->
    <div id="stage" tabindex="0">
        <div id="bg-image"></div>
        <div id="bg-overlay"></div>

        <!-- header / status -->
        <div id="hdr-left"></div>
        <div id="hdr-right"></div>
        <div id="hdr-limit" class="hidden">limit to selected series</div>
        <div id="hdr-file"></div>

        <!-- splash -->
        <div id="splash">
            <div id="splash-school">School</div>
            <div id="splash-title"></div>
            <div id="splash-cool">is cool!</div>
            <div id="splash-hint">Press ↓ to start training! Press h for help. Right-click for the menu.</div>
        </div>

        <!-- task screen -->
        <div id="task-screen" class="hidden">
            <div id="task-header">Task 1</div>
            <div id="task-area"></div>
            <div id="solution-area"></div>
            <div id="pupil">
                <div id="pupil-photo"></div>
                <div id="pupil-name"></div>
            </div>
            <div id="countdown" class="hidden">10</div>
        </div>

        <!-- modal pages (help / students / series / end) render here -->
        <div id="page" class="hidden"></div>

        <!-- bottom chrome -->
        <div id="op-strip" class="hidden"></div>
        <div id="stopwatch"></div>
        <div id="picker-btn" title="Random pupil picker (P)">🎲</div>

        <!-- YouTube music fallback (visible mini-player, required by YT terms) -->
        <div id="yt-music" class="hidden"><div id="yt-music-frame"></div></div>

        <!-- transient toast + folder chip -->
        <div id="toast" class="hidden"></div>
        <button id="folder-chip" class="chip-off" title="Connect the MathTrainer resources folder">no folder</button>
    </div>

    <div id="ctx-menu" class="hidden"></div>

    <script src="js/mt-core.js"></script>
    <script src="js/mt-store.js"></script>
    <script src="js/mt-people.js"></script>
    <script src="js/mt-tasks.js"></script>
    <script src="js/mt-audio.js"></script>
    <script src="js/mt-render.js"></script>
    <script src="js/mt-app.js"></script>
</body>

</html>
