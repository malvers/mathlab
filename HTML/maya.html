<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOC ALVERS MATHE-LABORE | Maya-Zahlen</title>
    <meta name="description"
        content="Maya-Zahlen selbst legen: Punkte, Striche und die Muschel für die Null — und der Dezimalwert läuft mit.">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="resources/favicon.svg">
    <link rel="icon" type="image/png" sizes="256x256" href="resources/favicon.png">
    <link rel="stylesheet" href="js/cyber-layout.css">
    <link rel="stylesheet" href="js/buttons-ultra.css">
    <link rel="stylesheet" href="js/cyber-clock.css">
    <link rel="stylesheet" href="js/cyber-lab-overrides.css">
    <link rel="stylesheet" href="js/branding.styles.extracted.css">
    <link rel="stylesheet" href="js/lab-shell-minimal.css">
    <style>
        #maya-solution {
            padding-left: 0;
            padding-right: 0;
        }

        #maya-solution {
            font-size: 1.6rem;
            font-family: Arial, Helvetica, sans-serif;
        }

        #canvas {
            touch-action: none;
        }

        /* the number and the sum each sit on their own card over the stage;
           left and width come from the same block the places and the panel use */
        .maya-card {
            position: absolute;
            margin: 0;
            padding: 12px 18px;
            border-radius: 18px;
            background: rgba(10, 20, 40, 0.4);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(0, 210, 255, 0.2);
            text-align: center;
            pointer-events: none;
            box-sizing: border-box;
        }

        #maya-head .maya-num {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            line-height: 1;
            color: rgb(245, 194, 66);
            font-size: clamp(2.2rem, 7.5vw, 6rem);
        }

        #maya-head.solved .maya-num {
            color: rgb(121, 158, 49);
        }



        #maya-formula {
            position: relative;
        }

        .maya-term,
        .maya-plus {
            position: absolute;
            top: 0;
            transform: translateX(-50%);
            white-space: nowrap;
        }

        .maya-plus {
            opacity: 0.5;
        }

        .maya-row {
            display: flex;
            align-items: stretch;      /* the field takes the button's height, whatever it is */
            gap: 8px;
            margin-top: 8px;
        }

        .maya-row>* {
            flex: 1 1 0;               /* two equal halves, like the row below */
            min-width: 0;
        }

        /* the shared button carries a 10px top margin; inside a row it would make the
           field next to it that much taller, so the row spacing lives on .maya-row */
        #ui-container .maya-row .cyber-btn {
            margin-top: 0;
        }

        .maya-row input[type="number"] {
            text-align: center;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(245, 194, 66, 0.35);
            border-radius: 10px;
            color: rgb(245, 194, 66);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            line-height: 1;            /* Orbitron's line box would make the field taller */
            padding: 6px 10px;         /* than the button beside it */
        }

        .maya-row input[type="number"]:focus {
            outline: none;
            border-color: rgb(245, 194, 66);
        }

        .maya-note {
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            line-height: 1.5;
            opacity: 0.8;
        }

        .maya-task-target {
            display: flex;
            justify-content: center;
            margin: 6px 0 10px;
        }

        @media (max-width: 760px) {
            #maya-head .maya-num {
                font-size: clamp(1.8rem, 12vw, 3.2rem);
            }
        }
    </style>
</head>

<body>
    <nav id="mini-rail">
        <div class="nav-btn" onclick="toggleSidebar()" title="Toggle Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </div>
    </nav>

    <aside id="side-panel">
        <header id="sidebar-header"></header>
        <div id="ui-container"></div>
    </aside>

    <main id="main-content">
        <div id="canvas-container">
            <div id="maya-head" class="maya-card">
                <div class="maya-num" id="maya-num"></div>
            </div>
            <div id="maya-solution" class="maya-card">
                <div id="maya-formula"></div>
            </div>
            <canvas id="canvas"></canvas>
        </div>
    </main>

    <script>
        // Debug output goes into the central DEBUG window, never into the console.
        if (/[?&]debug=1\b/.test(location.search)) {
            var s = document.createElement('script');
            s.src = 'js/debug-window.js';
            s.onload = function () { try { DebugWindow.show(); } catch (e) { } };
            document.head.appendChild(s);
        }
    </script>
    <script src="js/cyber-left-chrome.js"></script>
    <script src="js/branding/briefings.js"></script>
    <script src="js/branding/overlays.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/branding/nav.js"></script>
    <script src="js/branding.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/cyber-clock.js"></script>
    <script>
        function toggleSidebar() {
            const panel = document.getElementById('side-panel');
            panel.classList.toggle('collapsed');
            if (window.CyberLeftChrome && typeof CyberLeftChrome.publishResolvedScale === 'function') {
                CyberLeftChrome.publishResolvedScale();
            }
            setTimeout(() => {
                window.dispatchEvent(new Event('resize'));
                if (typeof init === 'function') init();
                if (window.CyberLeftChrome && typeof CyberLeftChrome.publishResolvedScale === 'function') {
                    CyberLeftChrome.publishResolvedScale();
                }
            }, 400);
        }

        const T = (k, fb) => (typeof CyberI18n !== 'undefined' && CyberI18n.getOr)
            ? CyberI18n.getOr('maya.' + k, fb)
            : fb;

        function dbg(m) { if (window.DebugWindow) DebugWindow.log('[maya] ' + m); }

        CyberBranding.init({
            useExternalStyles: true,
            title: CyberI18n.get('ui.coach_title'),
            subtitle: T('title', 'MAYA-ZAHLEN'),
        });
        CyberUI.init();

        if (window.CyberLeftChrome && typeof CyberLeftChrome.configure === 'function') {
            CyberLeftChrome.configure({ viewportOnlyZoom: true });
        }

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');

        // ---------------------------------------------------------------- palette ---
        const COL = {
            glyph: 'rgb(245, 194, 66)',   // dots and bars
            shell: 'rgb(121, 158, 49)',   // the shell that stands for zero
            warn: 'rgb(176, 36, 24)',
            dim: 'rgba(245, 194, 66, 0.55)',
            line: 'rgba(255, 255, 255, 0.13)',
            fill: 'rgba(255, 255, 255, 0.03)'
        };

        // ------------------------------------------------------------ number system ---
        // A Maya number is written from the bottom up: the ones sit at the bottom, every row
        // above is worth more. The Long Count is not a pure base 20 - its third place is worth
        // 360 (18 x 20, the 360 day year), and from there it goes times 20 again. So the ones
        // place rolls over at 20, but the twenties place rolls over at 18.
        const SYSTEMS = {
            kalender: {
                label: 'Kalender (Long Count)',
                values: [1, 20, 360, 7200, 144000],
                limits: [20, 18, 20, 20, 20]
            },
            rein20: {
                label: 'rein 20er',
                values: [1, 20, 400, 8000, 160000],
                limits: [20, 20, 20, 20, 20]
            }
        };

        let sysKey = 'kalender';
        let digits = [0, 0, 0, 0, 0];     // index 0 = ones, at the bottom of the board
        let task = null;                  // { target, done }
        let solvedCount = 0;
        let flashes = [];                 // { place, color, until }
        let cards = [];                   // the places, side by side
        let glyphs = [];                  // every dot and every bar, for taking them away
        let palette = [];                 // the twenty digits to drag from
        let drag = null;                  // { digit, x, y, moved }
        let picked = null;                // digit tapped in the panel, waiting for a place
        let hoverPlace = null;            // the place a dragged digit is over

        const sys = () => SYSTEMS[sysKey];
        const value = () => digits.reduce((sum, d, i) => sum + d * sys().values[i], 0);
        const de = (n) => n.toLocaleString('de-DE');

        function places() {
            let top = 3;                  // four places are always on the board
            for (let i = digits.length - 1; i >= 0; i--) {
                if (digits[i] > 0) { top = Math.max(top, i); break; }
            }
            return top + 1;
        }

        // Lay a decimal number out over the places, highest first.
        function layout(n) {
            const v = sys().values;
            const maxValue = v[4] * (sys().limits[4] - 1) + v[4] - 1;
            n = Math.max(0, Math.min(Math.floor(n), maxValue));
            const out = [0, 0, 0, 0, 0];
            for (let i = v.length - 1; i >= 0; i--) {
                out[i] = Math.floor(n / v[i]);
                n -= out[i] * v[i];
            }
            digits = out;
        }

        // ------------------------------------------------------------------ drawing ---
        function roundRect(x, y, w, h, r, fill, stroke) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
            if (fill) { ctx.fillStyle = fill; ctx.fill(); }
            if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
        }

        // The zero: a scallop shell — ribs fanning out of the hinge, a scalloped rim.
        function drawShell(cx, cy, w, h) {
            const lw = Math.max(2, Math.min(6, h * 0.075));   // one weight for rim, mouth and ribs
            const R = h * 0.92;
            const hx = cx, hy = cy + h * 0.44;          // the hinge
            const spread = 0.44;                        // half opening, in units of PI
            const a0 = -Math.PI / 2 - Math.PI * spread;
            const a1 = -Math.PI / 2 + Math.PI * spread;
            const kx = (w / 2) / (R * Math.sin(Math.PI * spread));
            const P = (a, r) => [hx + kx * R * r * Math.cos(a), hy + R * r * Math.sin(a)];
            const lobes = 6;

            ctx.save();
            ctx.strokeStyle = COL.shell;
            ctx.lineWidth = lw;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.beginPath();
            const first = P(a0, 0.9);
            ctx.moveTo(first[0], first[1]);
            for (let i = 0; i < lobes; i++) {
                const m = a0 + (a1 - a0) * (i + 0.5) / lobes;
                const e = a0 + (a1 - a0) * (i + 1) / lobes;
                const c = P(m, 1.10), q = P(e, 0.9);
                ctx.quadraticCurveTo(c[0], c[1], q[0], q[1]);
            }
            ctx.quadraticCurveTo(hx + w * 0.10, hy + h * 0.10, hx, hy);
            ctx.quadraticCurveTo(hx - w * 0.10, hy + h * 0.10, first[0], first[1]);
            ctx.closePath();
            ctx.stroke();

            for (let i = 1; i < lobes; i++) {
                const a = a0 + (a1 - a0) * i / lobes;
                const st = P(a, 0.16), en = P(a, 0.86);
                ctx.beginPath();
                ctx.moveTo(st[0], st[1]);
                ctx.lineTo(en[0], en[1]);
                ctx.stroke();
            }
            ctx.restore();
        }

        // Every bar counts five, every dot one, and the dots sit above the bars.
        // place === null draws a loose digit (panel, drag ghost) and registers no targets.
        function paintDigit(d, cx, cy, bw, bh, place) {
            if (d === 0) {
                const w = Math.min(bw * 0.78, 132);   // exactly the width of a bar
                const h = w * 0.64;
                drawShell(cx, cy + h * 0.065, w, h);   // the shape is taller above the centre
                return;
            }
            const bars = Math.floor(d / 5), dots = d % 5;
            const barW = Math.min(bw * 0.78, 132);
            const barH = Math.max(4, bh * 0.115);
            const gap = Math.max(3, bh * 0.07);
            const dotR = Math.max(3, Math.min(bh * 0.072, barW * 0.09));
            const dotsH = dots ? dotR * 2 : 0;
            const barsH = bars ? bars * barH + (bars - 1) * gap : 0;
            const totalH = dotsH + barsH + (dots && bars ? gap : 0);
            let y = cy - totalH / 2;

            if (dots) {
                const step = Math.min(dotR * 3.1, barW / 3.6);
                const startX = cx - step * (dots - 1) / 2;
                for (let k = 0; k < dots; k++) {
                    const x = startX + k * step;
                    ctx.beginPath();
                    ctx.fillStyle = COL.glyph;
                    ctx.arc(x, y + dotR, dotR, 0, Math.PI * 2);
                    ctx.fill();
                    if (place !== null) {
                        glyphs.push({ place, type: 'dot', x: x - dotR * 1.5, y: y - dotR * 0.5, w: dotR * 3, h: dotR * 3 });
                    }
                }
                y += dotsH + gap;
            }
            for (let k = 0; k < bars; k++) {
                roundRect(cx - barW / 2, y, barW, barH, barH / 2, COL.glyph, null);
                if (place !== null) {
                    glyphs.push({ place, type: 'bar', x: cx - barW / 2, y: y - gap * 0.35, w: barW, h: barH + gap * 0.7 });
                }
                y += barH + gap;
            }
        }

        function flashColor(place) {
            const now = performance.now();
            const f = flashes.find(f => f.place === place && f.until > now);
            return f ? f.color : null;
        }

        function draw() {
            const rect = container.getBoundingClientRect();
            const W = rect.width, H = rect.height;
            ctx.clearRect(0, 0, W, H);
            cards = [];
            glyphs = [];
            palette = [];
            if (W < 200 || H < 200) return;     // the chrome has not settled yet

            const pad = 16;
            const n = places();

            // places and panel share one width, so their edges line up
            const blockW = Math.min(W - 2 * pad, n * 200 + (n - 1) * 14);
            const blockX = (W - blockW) / 2;

            // where the places will stand - the sum's terms line up with these columns
            const cardW = (blockW - (n - 1) * 14) / n;
            const colCenter = (col) => blockX + col * (cardW + 14) + cardW / 2;

            // the number and the sum sit above the board as HTML cards -
            // measure them, then give the board what is left
            const headEl = document.getElementById('maya-head');
            const solEl = document.getElementById('maya-solution');
            let top = 14, headTop = 14, hH = 0, sH = 0;
            if (headEl && solEl) {
                for (const el of [headEl, solEl]) {
                    if (!el) continue;
                    el.style.left = blockX + 'px';
                    el.style.width = blockW + 'px';
                }
                // the branding sits in the top right corner of the stage - stay below it
                const brand = document.querySelector('.canvas-branding');
                if (brand) {
                    const b = brand.getBoundingClientRect();
                    if (b.width && b.left - rect.left < blockX + blockW) {
                        headTop = Math.max(headTop, b.bottom - rect.top + 12);
                    }
                }
                solEl.querySelectorAll('.maya-term').forEach(el => {
                    el.style.left = (colCenter(Number(el.dataset.col)) - blockX) + 'px';
                });
                solEl.querySelectorAll('.maya-plus').forEach(el => {
                    const g = Number(el.dataset.gap);
                    el.style.left = ((colCenter(g) + colCenter(g + 1)) / 2 - blockX) + 'px';
                });
                headEl.style.top = headTop + 'px';
                hH = headEl.offsetHeight;
                solEl.style.top = (headTop + hH + 14) + 'px';
                sH = solEl.offsetHeight;
                top = headTop + hH + 14 + sH + 14;
            }

            const avail = H - top - pad;
            if (avail < 200) return;

            // the panel: ten digits in a row where there is width for it, five where there is not
            const cols = blockW >= 720 ? 10 : 5;
            const rows = 20 / cols;
            const cellW = blockW / cols;
            const cellH = Math.min(cellW * 0.95, (avail * 0.5 - 26) / rows);
            const panelH = rows * cellH + 26;

            // the places above it
            const cardsH = Math.min(avail - panelH - 16, 280);
            const cardH = Math.max(90, cardsH - 24);
            const rowX = blockX;

            const gapH = 22, captionH = 28;
            const blockH = cardH + gapH + rows * cellH + captionH;

            // number, sum and board keep the same gap the places and the panel keep,
            // and the whole stack stands centred on the stage
            const stackGap = gapH;
            const stackH = hH + stackGap + sH + stackGap + blockH;
            const stackTop = Math.max(headTop, Math.min((H - stackH) / 2, H - pad - stackH));
            if (headEl) headEl.style.top = stackTop + 'px';
            if (solEl) solEl.style.top = (stackTop + hH + stackGap) + 'px';
            const cardY = stackTop + hH + stackGap + sH + stackGap;
            const panelY = cardY + cardH + gapH;

            for (let col = 0; col < n; col++) {
                const place = n - 1 - col;              // the highest place stands on the left
                const x = rowX + col * (cardW + 14);
                const flash = flashColor(place);
                const hot = hoverPlace === place;

                ctx.lineWidth = (flash || hot) ? 2 : 1;
                roundRect(x, cardY, cardW, cardH, 16,
                    hot ? 'rgba(245, 194, 66, 0.10)' : (flash ? 'rgba(121, 158, 49, 0.10)' : COL.fill),
                    hot ? COL.glyph : (flash || COL.line));

                paintDigit(digits[place], x + cardW / 2, cardY + cardH / 2, cardW, cardH, place);

                cards.push({ place, x, y: cardY, w: cardW, h: cardH });
            }

            // ---- the panel of all twenty digits ----
            const gridX = blockX;

            for (let k = 0; k < 20; k++) {
                const cx0 = gridX + (k % cols) * cellW;
                const cy0 = panelY + Math.floor(k / cols) * cellH;
                const on = picked === k || (drag && drag.digit === k);

                roundRect(cx0 + 3, cy0 + 2, cellW - 6, cellH - 4, 10,
                    on ? 'rgba(245, 194, 66, 0.12)' : 'rgba(255, 255, 255, 0.02)',
                    on ? COL.glyph : 'rgba(255, 255, 255, 0.07)');

                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.font = "600 12px 'Orbitron', sans-serif";
                ctx.fillStyle = on ? COL.glyph : 'rgba(255, 255, 255, 0.45)';
                ctx.fillText(String(k), cx0 + cellW / 2, cy0 + 6);

                paintDigit(k, cx0 + cellW / 2, cy0 + cellH * 0.62, cellW - 14, cellH * 0.6, null);
                palette.push({ digit: k, x: cx0, y: cy0, w: cellW, h: cellH });
            }

            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.font = "400 13px 'Outfit', sans-serif";
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.fillText(T('panel', 'Ziffern — auf eine Stelle ziehen'),
                blockX + blockW / 2, panelY + rows * cellH + 8);

            // the digit being dragged hangs on the finger
            if (drag) {
                ctx.save();
                ctx.globalAlpha = 0.9;
                paintDigit(drag.digit, drag.x, drag.y, Math.min(cardW, 150), Math.min(cardH, 130), null);
                ctx.restore();
            }
        }

        // ------------------------------------------------------------- interaction ---
        function inRect(p, r) {
            return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
        }

        function pos(e) {
            const r = canvas.getBoundingClientRect();
            return { x: e.clientX - r.left, y: e.clientY - r.top };
        }

        // What a message used to say on the stage - the board says it now by flashing,
        // so this only goes into the debug window.
        function say(text) {
            if (text) dbg(text);
        }

        function flashPlace(place, color) {
            flashes.push({ place, color: color || COL.shell, until: performance.now() + 900 });
            setTimeout(draw, 950);
        }

        // Adding beyond the last digit of a place carries into the place above — that is the
        // whole point of a place value system, so it gets said out loud.
        function addOne(place) {
            const lim = sys().limits;
            let k = place;
            digits[k]++;
            while (digits[k] >= lim[k]) {
                if (k + 1 >= digits.length) {
                    digits[k] = lim[k] - 1;
                    say(T('full', 'Das Brett ist voll — höher geht es hier nicht.'), COL.warn);
                    break;
                }
                digits[k] = 0;
                digits[k + 1]++;
                flashPlace(k + 1);
                say(lim[k] + ' × ' + de(sys().values[k]) + ' = ' + de(sys().values[k + 1])
                    + ' — ' + T('carry', 'das wandert eine Stelle nach oben.'), COL.shell);
                k++;
            }
            changed();
        }

        function removeGlyph(g) {
            digits[g.place] = Math.max(0, digits[g.place] - (g.type === 'bar' ? 5 : 1));
            changed();
        }

        // A whole digit dropped on a place - the calendar reckoning only lets the twenties
        // place run to 17, so a 18 or 19 has to be refused there.
        function applyDigit(place, d) {
            const lim = sys().limits[place];
            if (d >= lim) {
                flashPlace(place, COL.warn);
                say(T('too_big', 'Diese Stelle fasst nur bis ') + (lim - 1) + '.', COL.warn);
                draw();
                return false;
            }
            digits[place] = d;
            flashPlace(place, COL.shell);
            say('');
            changed();
            return true;
        }

        canvas.addEventListener('pointerdown', (e) => {
            const p = pos(e);
            const pal = palette.find(h => inRect(p, h));
            if (pal) {
                drag = { digit: pal.digit, x: p.x, y: p.y, moved: false };
                try { canvas.setPointerCapture(e.pointerId); } catch (err) { }
                draw();
                return;
            }
            const card = cards.find(h => inRect(p, h));
            if (picked !== null && card) {
                applyDigit(card.place, picked);
                picked = null;
                return;
            }
            const g = glyphs.find(h => inRect(p, h));
            if (g) { removeGlyph(g); return; }
            if (card) addOne(card.place);
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!drag) return;
            const p = pos(e);
            if (Math.abs(p.x - drag.x) > 4 || Math.abs(p.y - drag.y) > 4) drag.moved = true;
            drag.x = p.x;
            drag.y = p.y;
            const card = cards.find(h => inRect(p, h));
            hoverPlace = card ? card.place : null;
            draw();
        });

        function endDrag(e) {
            if (!drag) return;
            const p = pos(e);
            const card = cards.find(h => inRect(p, h));
            const d = drag.digit, moved = drag.moved;
            drag = null;
            hoverPlace = null;
            if (card) {
                applyDigit(card.place, d);
                picked = null;
                dbg('dropped ' + d + ' on place ' + card.place);
            } else if (!moved) {
                // a tap in the panel picks the digit up, the next tap on a place puts it down
                picked = (picked === d) ? null : d;
                say(picked === null ? '' : T('picked', 'Ziffer ') + d + T('picked2', ' — jetzt auf eine Stelle tippen.'), COL.glyph);
            }
            draw();
        }

        canvas.addEventListener('pointerup', endDrag);
        canvas.addEventListener('pointercancel', () => { drag = null; hoverPlace = null; draw(); });

        // ------------------------------------------------------------------ readout ---
        // The sum stands column by column: every term over its place, every plus over
        // the gap between two places. draw() puts them where the cards are.
        function renderFormula() {
            const host = document.getElementById('maya-formula');
            if (!host) return;
            const n = places();
            let html = '';
            for (let i = 0; i < n; i++) {
                html += '<span class="maya-term" data-col="' + i + '"></span>';
                if (i < n - 1) html += '<span class="maya-plus" data-gap="' + i + '">+</span>';
            }
            host.innerHTML = html;
            host.querySelectorAll('.maya-term').forEach(el => {
                const place = n - 1 - Number(el.dataset.col);
                el.textContent = digits[place] + ' \u00b7 ' + sys().values[place];
            });
            let h = 0;
            host.querySelectorAll('span').forEach(el => { h = Math.max(h, el.offsetHeight); });
            host.style.height = (h || 22) + 'px';
        }

        function updateHead() {
            const num = document.getElementById('maya-num');
            const head = document.getElementById('maya-head');
            if (!num || !head) return;
            num.textContent = de(task ? task.target : value());
            head.classList.toggle('solved', !!(task && task.done));
        }

        function changed() {
            updateHead();
            if (window.CyberClock) {
                CyberClock.digits('maya-value', value(), {
                    thousands: true,
                    style: { size: '30px', digitWidth: '29px' }
                });
            }
            renderFormula();
            if (task && !task.done && value() === task.target) {
                task.done = true;
                solvedCount++;
                say(T('task_correct', 'Richtig! ') + de(task.target) + T('task_lies', ' liegt auf dem Brett.'), COL.shell);
                for (let i = 0; i < places(); i++) flashPlace(i);
                updateStats();
            }
            draw();
        }

        function updateStats() {
            CyberUI.updateStatsGrid('maya-stats', [
                { value: de(solvedCount) },
                { value: sysKey === 'kalender' ? '360' : '400' }
            ]);
        }

        function newTask() {
            task = { target: 21 + Math.floor(Math.random() * 9979), done: false };
            digits = [0, 0, 0, 0, 0];
            say(T('task_hint', 'Lege die Zahl - zieh die Ziffern aus dem Panel auf die Stellen.'), COL.glyph);
            changed();
        }

        // --------------------------------------------------------------- side panel ---
        function buildUI() {
            CyberUI.createCard('ui-container', T('card_value', 'DEZIMALWERT'),
                '<div id="maya-value" style="display:flex;justify-content:center;padding:4px 0 2px;"></div>'
                + '<div id="maya-stats"></div>', 'rgb(245, 194, 66)');
            CyberUI.createStatsGrid('maya-stats', [
                { label: T('stat_solved', 'GELÖST'), value: '0', color: 'rgb(121, 158, 49)' },
                { label: T('stat_third', '3. STELLE'), value: '360', color: 'rgb(245, 194, 66)' }
            ]);

            CyberUI.createCard('ui-container', T('card_system', 'STELLENWERTE'),
                '<div id="maya-system"></div>'
                + '<div class="maya-note" id="maya-system-note"></div>', 'rgb(121, 158, 49)');
            CyberUI.createRadioGroup('maya-system', null, [
                { value: 'kalender', label: T('sys_cal', 'Kalender: 1, 20, 360, 7200') },
                { value: 'rein20', label: T('sys_20', 'rein 20er: 1, 20, 400, 8000') }
            ], sysKey, (v) => {
                sysKey = v;
                // the glyphs stay where they are - only what they are worth changes
                say(T('sys_switch', 'Dieselben Zeichen, andere Stellenwerte: jetzt ') + de(value()) + '.', COL.glyph);
                document.getElementById('maya-system-note').textContent = noteFor(v);
                updateStats();
                changed();
            });
            document.getElementById('maya-system-note').textContent = noteFor(sysKey);

            CyberUI.createCard('ui-container', T('card_lay', 'ZAHL LEGEN'),
                '<div class="maya-row">'
                + '<input type="number" id="maya-input" min="0" max="2000000" placeholder="5432"'
                + ' aria-label="' + T('card_lay', 'ZAHL LEGEN') + '">'
                + '<button class="cyber-btn" id="maya-lay">' + T('btn_lay', 'LEGEN') + '</button>'
                + '</div>'
                + '<div class="maya-row">'
                + '<button class="cyber-btn" id="maya-random">' + T('btn_random', 'ZUFALL') + '</button>'
                + '<button class="cyber-btn" id="maya-clear">' + T('btn_clear', 'LEEREN') + '</button>'
                + '</div>', 'rgb(245, 194, 66)');

            CyberUI.createCard('ui-container', T('card_task', 'AUFGABE'),
                '<div class="maya-note">' + T('task_note', 'Eine Zahl wird genannt, Du legst sie. Stimmt sie, färbt sich das Brett grün.') + '</div>'
                + '<div class="maya-row">'
                + '<button class="cyber-btn" id="maya-task">' + T('btn_task', 'NEUE AUFGABE') + '</button>'
                + '</div>', 'rgb(176, 36, 24)');

            CyberUI.createCard('ui-container', T('card_help', 'SO GEHT ES'),
                '<div class="maya-note">' + T('help', 'Zieh eine Ziffer aus dem Panel auf eine Stelle - oder tippe sie an und dann die Stelle. In eine Stelle tippen legt einen Punkt dazu, auf einen Punkt tippen nimmt ihn weg, auf einen Strich nimmt fünf weg. Ist eine Stelle voll, wandert sie nach oben, und die leere zeigt die Muschel - die Null.') + '</div>',
                'rgb(121, 158, 49)');

            document.getElementById('maya-lay').onclick = () => {
                const el = document.getElementById('maya-input');
                const n = parseInt(el.value, 10);
                if (!isNaN(n)) { layout(n); task = null; say(''); changed(); dbg('laid out ' + n); }
            };
            document.getElementById('maya-input').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') document.getElementById('maya-lay').click();
            });
            document.getElementById('maya-random').onclick = () => {
                layout(21 + Math.floor(Math.random() * 9979));
                task = null;
                say('');
                changed();
            };
            document.getElementById('maya-clear').onclick = () => {
                digits = [0, 0, 0, 0, 0];
                task = null;
                say('');
                changed();
            };
            document.getElementById('maya-task').onclick = newTask;
        }

        function noteFor(key) {
            return key === 'kalender'
                ? T('note_cal', 'Die dritte Stelle ist 360 statt 400 — 18 × 20, das Kalenderjahr der Maya. Deshalb fasst die Zwanziger-Stelle hier nur bis 17.')
                : T('note_20', 'Reines Zwanzigersystem, jede Stelle das Zwanzigfache der vorigen. Zum Vergleichen gedacht.');
        }

        // ---------------------------------------------------------------------- run ---
        function resizeCanvasToContainer() {
            const dpr = window.devicePixelRatio || 1;
            const rect = container.getBoundingClientRect();
            const w = Math.max(1, rect.width);
            const h = Math.max(1, rect.height);
            canvas.width = Math.floor(w * dpr);
            canvas.height = Math.floor(h * dpr);
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
        }

        function init() {
            resizeCanvasToContainer();
            draw();
        }

        window.addEventListener('resize', init);

        // The left chrome settles a moment after load and the coach box grows with the sum -
        // measure the stage again whenever that happens instead of trusting a timeout.
        if (window.ResizeObserver) {
            new ResizeObserver(() => init()).observe(container);
        }

        buildUI();
        layout(5432);
        say(T('start', 'Eine Maya-Zahl steht schon da. Zieh Ziffern aus dem Panel darauf oder tippe in eine Stelle.'), COL.glyph);
        init();
        changed();
        document.fonts.ready.then(() => { init(); changed(); });
        dbg('lab ready');
    </script>
</body>

</html>
