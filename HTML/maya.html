<body>

    <script>
        // Only what is Maya lives here - the board itself is js/stellenwert-brett.js. The functions
        // below draw with its helpers (ctx, COL, roundRect, placeColor, glyphs), which exist by the
        // time anything is drawn.

        // A Maya number is written from the bottom up: the ones sit at the bottom, every row
        // above is worth more. The Long Count is not a pure base 20 - its third place is worth
        // 360 (18 x 20, the 360 day year), and from there it goes times 20 again. So the ones
        // place rolls over at 20, but the twenties place rolls over at 18.
        const BOARD = {
            key: 'maya',
            subtitle: 'MAYA-ZAHLEN',
            digits: 20,
            defaultPlaces: 4,
            typedDigits: 7,
            rollFitsDecimals: true,
            systems: {
                kalender: {
                    values: [1, 20, 360, 7200, 144000],
                    limits: [20, 18, 20, 20, 20],
                    label: 'Kalender: 1, 20, 360, 7200',
                    note: 'Die dritte Stelle ist 360 statt 400 — 18 × 20, das Kalenderjahr der Maya. Deshalb fasst die Zwanziger-Stelle hier nur bis 17.'
                },
                rein20: {
                    values: [1, 20, 400, 8000, 160000],
                    limits: [20, 20, 20, 20, 20],
                    label: 'rein 20er: 1, 20, 400, 8000',
                    note: 'Reines Zwanzigersystem, jede Stelle das Zwanzigfache der vorigen. Zum Vergleichen gedacht.'
                }
            },
            defaultSystem: 'kalender',
            arrange: {
                flat: 'waagerecht: die Stellen nebeneinander',
                upright: 'hochkant: als Spalte, wie die Maya schrieben'
            },
            panelCaption: 'Die zwanzig Ziffern',
            // ten digits in a row where there is width for it, five where there is not
            panelFlat: (blockW) => ({ cols: blockW >= 720 ? 10 : 5, cellRatio: 0.95, share: 0.5 }),
            // upright: two columns of digits beside the column the Maya wrote
            upright: { panel: [110, 0.15, 210], board: [120, 0.18, 240], num: [204, 0.288, 396], cols: 2, byColumn: false },
            fitTerms: true,
            power: powerOf,
            paintDigit
        };

        // The zero: the scallop shell, drawn straight from resources/muschel.svg. That file
        // is the one source for the shape - edit it (or rerun tools/muschel-svg.py) and the
        // board follows. It carries its own box and stroke width, so nothing here guesses.
        const shell = { path: null, w: 1, h: 1, mx: 0, my: 0, lw: 3.2 };
        fetch('resources/muschel.svg').then(r => r.text()).then(txt => {
            const doc = new DOMParser().parseFromString(txt, 'image/svg+xml');
            const svg = doc.querySelector('svg'), d = doc.querySelector('path').getAttribute('d');
            const [x, y, w, h] = svg.getAttribute('viewBox').trim().split(/[\s,]+/).map(Number);
            shell.path = new Path2D(d);
            shell.w = w; shell.h = h;
            shell.mx = x + w / 2; shell.my = y + h / 2;          // the middle of its box
            shell.lw = parseFloat(svg.getAttribute('stroke-width')) || 3.2;
            draw();                                             // it arrives after the first paint
        }).catch(() => { });

        // cx, cy is the middle of the shell, size the square it has to fit into
        function drawShell(cx, cy, size, col) {
            if (!shell.path) return;                            // still loading - the next draw has it
            const k = size / Math.max(shell.w, shell.h);
            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(k, k);
            ctx.translate(-shell.mx, -shell.my);
            ctx.strokeStyle = col || COL.zero;
            ctx.lineWidth = shell.lw;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.stroke(shell.path);
            ctx.restore();
        }

        // The place value as a power, drawn small under its card. In the calendar reckoning
        // only the first two places are plain powers of twenty - above them every place is
        // eighteen twenties, so they read 18*20^n. That is exactly why the third place is 360.
        function powerOf(place) {
            if (sysKey === 'rein20') return { pre: '', base: '20', exp: place };
            return place < 2 ? { pre: '', base: '20', exp: place } : { pre: '18·', base: '20', exp: place - 1 };
        }

        // Every bar counts five, every dot one, and the dots sit above the bars.
        // place === null draws a loose digit (panel, drag ghost) and registers no targets.
        function paintDigit(d, cx, cy, bw, bh, place, colOverride) {
            if (d === null) return;               // an empty place shows nothing at all
            const col = colOverride || placeColor(place);
            if (d === 0) {
                let s = Math.min(bw * 0.78, 132);     // at most as wide as a bar
                if (s > bh * 0.96) s = bh * 0.96;     // ... and never taller than its box
                drawShell(cx, cy, s, col);
                return;
            }
            const bars = Math.floor(d / 5), dots = d % 5;
            const barW = Math.min(bw * 0.78, 132);
            const barH = Math.max(4, bh * 0.115);
            const gap = Math.max(3, bh * 0.07);
            const dotR = Math.max(3, Math.min(bh * 0.072, barW * 0.09));
            const dotsH = dots ? dotR * 2 : 0;
            const barsH = bars ? bars * barH + (bars - 1) * gap : 0;
            const totalH = dotsH + barsH + (dots && bars ? gap : 0);
            let y = cy - totalH / 2;

            if (dots) {
                const step = Math.min(dotR * 3.1, barW / 3.6);
                const startX = cx - step * (dots - 1) / 2;
                for (let k = 0; k < dots; k++) {
                    const x = startX + k * step;
                    ctx.beginPath();
                    ctx.fillStyle = col;
                    ctx.arc(x, y + dotR, dotR, 0, Math.PI * 2);
                    ctx.fill();
                    if (place !== null) {
                        glyphs.push({ place, type: 'dot', x: x - dotR * 1.5, y: y - dotR * 0.5, w: dotR * 3, h: dotR * 3 });
                    }
                }
                y += dotsH + gap;
            }
            for (let k = 0; k < bars; k++) {
                roundRect(cx - barW / 2, y, barW, barH, barH / 2, col, null);
                if (place !== null) {
                    glyphs.push({ place, type: 'bar', x: cx - barW / 2, y: y - gap * 0.35, w: barW, h: barH + gap * 0.7 });
                }
                y += barH + gap;
            }
        }
    </script>
    <script src="js/stellenwert-brett.js"></script>
