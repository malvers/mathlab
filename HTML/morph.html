<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOC ALVERS MATHE-LABORE | Morph</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="resources/favicon.png">
    <link rel="stylesheet" href="js/cyber-layout.css">
    <link rel="stylesheet" href="js/buttons-ultra.css">
    <link rel="stylesheet" href="js/cyber-lab-overrides.css">
    <link rel="stylesheet" href="js/branding.styles.extracted.css">
    <link rel="stylesheet" href="js/lab-shell-minimal.css">
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="js/debug-window.js"></script>
    <style>
        #draw-canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #000;
            cursor: crosshair;
            border-radius: 10px;
            border: 2px solid rgba(0, 210, 255, 0.5);
            box-shadow: 0 0 24px rgba(0, 210, 255, 0.12);
            touch-action: none;
        }

        #canvas-stack {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            line-height: 0;
            transform: scale(1.05);
            transform-origin: center center;
        }

        #digit-canvas, #morph-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            border-radius: 10px;
        }

        #draw-wrap {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 80px 20px 20px;
            box-sizing: border-box;
        }

        #draw-hint {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 0.04em;
            text-align: center;
        }

        .eps-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .eps-row label {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            color: rgba(0, 210, 255, 0.7);
        }

        .eps-row input[type=range] {
            flex: 1;
            accent-color: #00d2ff;
        }

        .eps-row span {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            color: #00d2ff;
            width: 28px;
            text-align: right;
        }

        #vert-count {
            display: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            color: #adff2f;
            text-align: center;
            margin-top: 8px;
            min-height: 18px;
            letter-spacing: 0.06em;
        }

        /* Make sidebar buttons 30% flatter (overrides buttons-ultra.css min-height) */
        #side-panel .cyber-btn {
            padding-top: 5px !important;
            padding-bottom: 5px !important;
            min-height: 40px !important;
        }
        #side-panel .digit-grid .cyber-btn,
        #side-panel div[class*="grid"] .cyber-btn {
            min-height: 34px !important;
        }
        #side-panel .digit-grid label {
            padding-top: 5px !important;
            padding-bottom: 5px !important;
        }

        /* Toggle switch */
        .switch-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            color: rgba(0, 210, 255, 0.7);
            letter-spacing: 0.06em;
        }

        .switch {
            position: relative;
            width: 36px;
            height: 18px;
            display: inline-block;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .switch-slider {
            position: absolute;
            inset: 0;
            background: rgba(0, 210, 255, 0.15);
            border: 1px solid rgba(0, 210, 255, 0.4);
            border-radius: 18px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .switch-slider::before {
            content: '';
            position: absolute;
            left: 2px;
            top: 1px;
            width: 12px;
            height: 12px;
            background: #00d2ff;
            border-radius: 50%;
            transition: transform 0.2s;
        }

        .switch input:checked + .switch-slider {
            background: rgba(173, 255, 47, 0.2);
            border-color: #adff2f;
        }

        .switch input:checked + .switch-slider::before {
            background: #adff2f;
            transform: translateX(18px);
        }

        .digit-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        .digit-grid input[type=radio] {
            display: none;
        }

        .digit-grid label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 0;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.55);
            background: rgba(0, 210, 255, 0.04);
            border: 1px solid rgba(0, 210, 255, 0.25);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
        }

        .digit-grid label:hover {
            color: #00d2ff;
            border-color: rgba(0, 210, 255, 0.6);
            background: rgba(0, 210, 255, 0.1);
        }

        .digit-grid input[type=radio]:checked + span {
            color: #adff2f;
        }

        .digit-grid label:has(input:checked) {
            color: #adff2f;
            border-color: #adff2f;
            background: rgba(173, 255, 47, 0.12);
            box-shadow: 0 0 12px rgba(173, 255, 47, 0.3);
        }

        /* LaTeX labels inside digit-grid — visually match digit size */
        .digit-grid .latex-label {
            font-size: 20px !important;
        }
        .digit-grid .latex-render {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .digit-grid .latex-render .katex {
            color: inherit;
            line-height: 1.2;
            font-size: 1em;
        }

        /* Collapsible instrument cards */
        .instrument-card.collapsible .instrument-title {
            cursor: pointer;
            user-select: none;
        }
        .instrument-card.collapsible .toggle-icon {
            display: inline-block;
            transition: transform 0.2s ease;
            margin-right: 6px;
            font-size: 10px;
        }
        .instrument-card.collapsible:not(.collapsed) .toggle-icon {
            transform: rotate(90deg);
        }
        .instrument-card.collapsible.collapsed .card-content {
            display: none;
        }
    </style>
</head>

<body>
    <nav id="mini-rail">
        <div class="nav-btn" onclick="toggleSidebar()" title="Toggle Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </div>
    </nav>

    <aside id="side-panel">
        <header id="sidebar-header"></header>
        <div id="ui-container"></div>
    </aside>

    <main id="main-content">
        <div id="canvas-container">
            <div class="cyber-grid"></div>
            <div id="math-coach-box">
                <div class="coach-title" id="coach-title-slot"></div>
                <div id="coach-content" class="coach-message"></div>
            </div>
            <div id="draw-wrap">
                <div id="canvas-stack">
                    <canvas id="draw-canvas" width="1000" height="1000"></canvas>
                    <canvas id="digit-canvas" width="1000" height="1000"></canvas>

                </div>

            </div>
        </div>
    </main>

    <script src="js/cyber-left-chrome.js"></script>

    <script src="js/i18n-pt.js"></script>
    <script src="js/i18n-sw.js"></script>
    <script src="js/i18n-tr.js"></script>
    <script src="js/i18n-nl.js"></script>

    <script src="js/branding.js"></script>

    <script>
        function toggleSidebar() {
            const panel = document.getElementById('side-panel');
            panel.classList.toggle('collapsed');
            if (window.CyberLeftChrome?.publishResolvedScale) CyberLeftChrome.publishResolvedScale();
            setTimeout(() => window.dispatchEvent(new Event('resize')), 400);
        }

        CyberBranding.init({ useExternalStyles: true, title: CyberI18n.get('ui.coach_title'), subtitle: 'Morph' });
        CyberUI.init();
        document.getElementById('coach-title-slot').textContent = 'Morph';
        if (window.CyberLeftChrome?.configure) CyberLeftChrome.configure({ viewportOnlyZoom: true });

        CyberUI.createCard('ui-container', 'ZEICHNEN', `
            <button class="cyber-btn" onclick="clearDraw()"
                style="width:100%;border-color:rgba(0,210,255,0.35);">LÖSCHEN</button>
        `, '#00d2ff', { collapsible: true });

        CyberUI.createCard('ui-container', 'OUTLINES', `
            <button class="cyber-btn" onclick="extractOutline()"
                style="width:100%;margin-bottom:8px;border-color:rgba(173,255,47,0.5);color:#adff2f;">OUTLINE</button>
            <button class="cyber-btn" onclick="clearOutline()"
                style="width:100%;border-color:rgba(244,196,48,0.5);color:#F4C430;">OUTLINES LÖSCHEN</button>
            <label class="switch-row">
                <span>POLY ANZEIGEN</span>
                <span class="switch">
                    <input type="checkbox" id="poly-toggle" checked onchange="onPolyToggle(this.checked)">
                    <span class="switch-slider"></span>
                </span>
            </label>
            <div class="eps-row">
                <label>ε</label>
                <input type="range" id="eps-slider" min="1" max="50" value="8" step="0.5"
                    oninput="onEpsChange(this.value)">
                <span id="eps-val">8</span>
            </div>
            <div id="vert-count"></div>
        `, '#00d2ff', { collapsible: true });

        CyberUI.createCard('ui-container', 'MORPH', `
            <button class="cyber-btn" onclick="startMorph()"
                style="width:100%;margin-bottom:8px;border-color:rgba(173,255,47,0.5);color:#adff2f;">► MORPH</button>
            <div class="eps-row">
                <label>t</label>
                <input type="range" id="morph-slider" min="1" max="100" value="1" step="1"
                    oninput="onMorphSlider(this.value)">
                <span id="morph-val">0</span>
            </div>
            <div class="eps-row">
                <label>Ähnlichkeit</label>
                <span id="morph-similarity">0%</span>
            </div>
        `, '#00d2ff', { collapsible: true });

        CyberUI.createCard('ui-container', 'ZIFFER', `
            <div class="digit-grid">
                ${[1,2,3,4,5,6,7,8,9,0].map(d => `
                    <label>
                        <input type="radio" name="digit" value="${d}" onchange="onDigitChange(${d})">
                        <span>${d}</span>
                    </label>
                `).join('')}
                ${[
                    { latex: '\\surd', text: '\\sqrt', title: 'surd' },
                    { latex: '\\sqrt{\\phantom{x}}', text: '\\sqrt{\\phantom{x}}', title: 'sqrt + bar' },
                    { latex: '\\int', text: '\\int', title: 'integral' },
                    { latex: '\\sum', text: '\\sum', title: 'sum' },
                    { latex: '\\prod', text: '\\prod', title: 'product' },
                    { latex: '\\oint', text: '\\oint', title: 'closed integral' },
                    { latex: '\\partial', text: '\\partial', title: 'partial' },
                    { latex: '\\nabla', text: '\\nabla', title: 'nabla' },
                    { latex: '\\infty', text: '\\infty', title: 'infinity' },
                    { latex: '\\pi', text: '\\pi', title: 'pi' },
                    { latex: '\\Omega', text: '\\Omega', title: 'Omega' }
                ].map((sym, i) => `
                    <label class="latex-label" title="${sym.title}">
                        <input type="radio" name="digit" value="latex-${i}" onclick="setTextInput(this.dataset.latex)" data-latex="${sym.text}">
                        <span class="latex-render" data-latex="${sym.latex}"></span>
                    </label>
                `).join('')}
            </div>
            <input type="text" id="text-input" placeholder="Text/LaTeX..."
                style="width:100%;margin-top:8px;padding:6px 10px;background:rgba(0,210,255,0.1);border:1px solid rgba(0,210,255,0.4);color:#00d2ff;font-family:'Orbitron',monospace;font-size:12px;border-radius:4px;"
                oninput="onTextInput(this.value)">
            <div id="target-count" style="display:none;font-family:'Orbitron',sans-serif;font-size:12px;color:#F4C430;text-align:center;margin-top:10px;min-height:18px;letter-spacing:0.06em;"></div>
        `, '#00d2ff', { collapsible: true });

        // ── Drawing ─────────────────────────────────────────────────────────────────
        const drawCanvas = document.getElementById('draw-canvas');
        const drawCtx = drawCanvas.getContext('2d');
        const digitCanvas = document.getElementById('digit-canvas');
        const digitCtx = digitCanvas.getContext('2d');
        const morphCanvas = document.getElementById('morph-canvas');
        const morphCtx = morphCanvas.getContext('2d');
        let isDrawing = false;
        let savedPixels = null; // ImageData snapshot before polygon is drawn
        let rawContour = null;  // largest sub-polygon (for morphing reference)
        let rawContours = null; // ALL sub-polygons (outer + holes), topology-aware
        let saveTimer = null;   // debounce for auto-save

        function initDraw() {
            drawCtx.fillStyle = '#000';
            drawCtx.fillRect(0, 0, 1000, 1000);
            drawCtx.strokeStyle = '#adff2f';
            drawCtx.lineWidth = 3;
            drawCtx.lineCap = 'round';
            drawCtx.lineJoin = 'round';
        }

        function clearDraw() {
            // Stop any in-progress morph animation
            cancelAnimationFrame(morphRaf);
            morphRaf = null;
            savedPixels = null;
            rawContour = null;
            rawContours = null;
            userMorphPoly = null;
            document.getElementById('vert-count').textContent = '';
            try {
                localStorage.removeItem('morph-outline');
                localStorage.removeItem('morph-outlines');
            } catch (_) {}
            initDraw();
            // Also clear the times outline overlay (digit fill stays)
            const toggle = document.getElementById('poly-toggle');
            if (selectedDigit !== null && toggle) {
                const wasChecked = toggle.checked;
                toggle.checked = false;
                onDigitChange(selectedDigit);
                toggle.checked = wasChecked;
            }
            // Clear morphed figure
            morphCtx.clearRect(0, 0, 1000, 1000);
            targetMorphPoly = null;
            const sl = document.getElementById('morph-slider');
            const mv = document.getElementById('morph-val');
            if (sl) sl.value = 0;
            if (mv) mv.textContent = 0;
        }

        function getPos(e) {
            const r = drawCanvas.getBoundingClientRect();
            const sx = drawCanvas.width / r.width;
            const sy = drawCanvas.height / r.height;
            const s = e.touches ? e.touches[0] : e;
            return { x: (s.clientX - r.left) * sx, y: (s.clientY - r.top) * sy };
        }

        function resetDrawState() {
            savedPixels = null;
            rawContour = null;
            rawContours = null;
            document.getElementById('vert-count').textContent = '';
            try {
                localStorage.removeItem('morph-outline');
                localStorage.removeItem('morph-outlines');
            } catch (_) {}
        }

        drawCanvas.addEventListener('mousedown', e => {
            if (savedPixels) { drawCtx.putImageData(savedPixels, 0, 0); resetDrawState(); }
            isDrawing = true;
            drawCtx.beginPath();
            const p = getPos(e); drawCtx.moveTo(p.x, p.y);
        });
        drawCanvas.addEventListener('mousemove', e => {
            if (!isDrawing) return;
            const p = getPos(e); drawCtx.lineTo(p.x, p.y); drawCtx.stroke();
            scheduleAutoSave();
        });
        drawCanvas.addEventListener('mouseup', () => { isDrawing = false; });
        drawCanvas.addEventListener('mouseleave', () => { isDrawing = false; });

        drawCanvas.addEventListener('touchstart', e => {
            e.preventDefault();
            if (savedPixels) { drawCtx.putImageData(savedPixels, 0, 0); resetDrawState(); }
            isDrawing = true;
            drawCtx.beginPath();
            const p = getPos(e); drawCtx.moveTo(p.x, p.y);
        }, { passive: false });
        drawCanvas.addEventListener('touchmove', e => {
            e.preventDefault();
            if (!isDrawing) return;
            const p = getPos(e); drawCtx.lineTo(p.x, p.y); drawCtx.stroke();
            scheduleAutoSave();
        }, { passive: false });
        drawCanvas.addEventListener('touchend', () => { isDrawing = false; });

        // ── Marching Squares Contour Extraction ───────────────────────────────────────
        // Returns flat ordered points (backward-compatible single-contour version)
        function getContour(grid, W, H) {
            const all = getContoursWithHoles(grid, W, H);
            if (all.length === 0) return [];
            // Return concatenation? No — return only the largest (outer) to preserve old behavior
            // But for hole support we need all. Return largest for legacy single-poly callers.
            let largest = all[0];
            for (const c of all) if (c.length > largest.length) largest = c;
            return largest;
        }

        // Topology-aware boundary tracing using Marching Squares with proper edge linking.
        // Returns multiple disjoint closed contours (outer + holes) — no bridges between them.
        function getContoursWithHoles(grid, W, H) {
            // Step 1: For each cell, generate line segments based on marching-squares case.
            // Each segment is [pt1, pt2] where pts are at edge midpoints.
            // Cell case bits (msb first): TL TR BR BL
            const segments = [];

            for (let y = 0; y < H - 1; y++) {
                for (let x = 0; x < W - 1; x++) {
                    const tl = grid[y * W + x];
                    const tr = grid[y * W + (x + 1)];
                    const br = grid[(y + 1) * W + (x + 1)];
                    const bl = grid[(y + 1) * W + x];
                    const cas = (tl << 3) | (tr << 2) | (br << 1) | bl;
                    if (cas === 0 || cas === 15) continue;

                    const top    = [x + 0.5, y];
                    const right  = [x + 1,   y + 0.5];
                    const bottom = [x + 0.5, y + 1];
                    const left   = [x,       y + 0.5];

                    switch (cas) {
                        // Single-corner cases (one filled corner)
                        case 1:  segments.push([left, bottom]); break;            // BL
                        case 2:  segments.push([bottom, right]); break;           // BR
                        case 4:  segments.push([top, right]); break;              // TR
                        case 8:  segments.push([top, left]); break;               // TL

                        // Three-corner cases (one outside corner)
                        case 7:  segments.push([left, top]); break;               // TR+BR+BL
                        case 11: segments.push([right, top]); break;              // TL+BR+BL
                        case 13: segments.push([right, bottom]); break;           // TL+TR+BL
                        case 14: segments.push([bottom, left]); break;            // TL+TR+BR

                        // Two-corner adjacent (horizontal/vertical)
                        case 3:  segments.push([left, right]); break;             // BL+BR
                        case 12: segments.push([left, right]); break;             // TL+TR
                        case 6:  segments.push([top, bottom]); break;             // TR+BR
                        case 9:  segments.push([top, bottom]); break;             // TL+BL

                        // Saddle cases (ambiguous diagonal — pick local disambiguation)
                        // Case 5 = TR+BL (anti-diagonal): keep two separate segments
                        case 5:
                            segments.push([top, right]);
                            segments.push([left, bottom]);
                            break;
                        // Case 10 = TL+BR (main diagonal)
                        case 10:
                            segments.push([top, left]);
                            segments.push([right, bottom]);
                            break;
                    }
                }
            }

            if (segments.length === 0) return [];

            // Step 2: Build endpoint→segment-indices map for chaining.
            // Use a numeric key that's collision-free for our domain (W,H ≤ ~2000, halves):
            const ptKey = pt => pt[0] * 1e6 + pt[1];
            const endpointMap = new Map();
            for (let i = 0; i < segments.length; i++) {
                for (let e = 0; e < 2; e++) {
                    const k = ptKey(segments[i][e]);
                    if (!endpointMap.has(k)) endpointMap.set(k, []);
                    endpointMap.get(k).push(i);
                }
            }

            // Step 3: Walk segments to build closed contours.
            // Each segment is consumed exactly once. Multiple disjoint loops emerge naturally.
            const used = new Uint8Array(segments.length);
            const contours = [];

            for (let startIdx = 0; startIdx < segments.length; startIdx++) {
                if (used[startIdx]) continue;
                used[startIdx] = 1;

                const startPt = segments[startIdx][0];
                const startKey = ptKey(startPt);
                const contour = [startPt];
                let currentPt = segments[startIdx][1];
                contour.push(currentPt);

                let safety = 0;
                const maxSteps = segments.length + 2;

                while (safety++ < maxSteps) {
                    const k = ptKey(currentPt);
                    if (k === startKey) break; // Closed loop

                    const candidates = endpointMap.get(k);
                    if (!candidates) break;

                    let nextSegIdx = -1;
                    for (const ci of candidates) {
                        if (!used[ci]) { nextSegIdx = ci; break; }
                    }
                    if (nextSegIdx < 0) break;
                    used[nextSegIdx] = 1;

                    const seg = segments[nextSegIdx];
                    currentPt = (ptKey(seg[0]) === k) ? seg[1] : seg[0];
                    contour.push(currentPt);
                }

                if (contour.length >= 5) contours.push(contour);
            }

            return contours;
        }

        // ── Ramer–Douglas–Peucker simplification ─────────────────────────────────────
        function ptLineDist([px, py], [ax, ay], [bx, by]) {
            const dx = bx - ax, dy = by - ay;
            const len2 = dx * dx + dy * dy;
            if (len2 === 0) return Math.hypot(px - ax, py - ay);
            return Math.abs(dy * px - dx * py + bx * ay - by * ax) / Math.sqrt(len2);
        }

        function rdp(pts, eps) {
            if (pts.length < 3) return pts.slice();
            let maxD = 0, idx = 1;
            for (let i = 1; i < pts.length - 1; i++) {
                const d = ptLineDist(pts[i], pts[0], pts[pts.length - 1]);
                if (d > maxD) { maxD = d; idx = i; }
            }
            if (maxD > eps) {
                const l = rdp(pts.slice(0, idx + 1), eps);
                const r = rdp(pts.slice(idx), eps);
                return [...l.slice(0, -1), ...r];
            }
            return [pts[0], pts[pts.length - 1]];
        }

        // ── Outline extraction & rendering ───────────────────────────────────────────
        function extractOutline() {
            const imgData = drawCtx.getImageData(0, 0, 1000, 1000);
            savedPixels = imgData;

            const grid = new Uint8Array(1000 * 1000);
            for (let i = 0; i < 1000 * 1000; i++)
                grid[i] = imgData.data[i * 4] > 30 ? 1 : 0;

            // Topology-aware extraction: get ALL contours (outer + holes)
            rawContours = getContoursWithHoles(grid, 1000, 1000);

            if (!rawContours || rawContours.length === 0) {
                rawContour = null;
                document.getElementById('vert-count').textContent = 'Nichts gefunden';
                DebugWindow.log('⚠️ extractOutline: no contours found');
                return;
            }

            // Pick the largest as the "main" contour (used for morphing reference)
            rawContour = rawContours[0];
            for (const c of rawContours) {
                if (c.length > rawContour.length) rawContour = c;
            }
            DebugWindow.log(`✓ extractOutline: ${rawContours.length} contour(s), largest=${rawContour.length} pts`);

            if (rawContour.length < 3) {
                document.getElementById('vert-count').textContent = 'Nichts gefunden';
                return;
            }

            try {
                localStorage.setItem('morph-outline', JSON.stringify(rawContour));
                localStorage.setItem('morph-outlines', JSON.stringify(rawContours));
            } catch (_) {}
            drawPolygon();
        }

        // Resample a polygon to exactly n evenly-spaced points along its perimeter
        function resamplePolygon(poly, n) {
            if (poly.length < 2 || n < 2) return poly.slice();
            const cumLens = [0];
            for (let i = 0; i < poly.length; i++) {
                const [x1, y1] = poly[i];
                const [x2, y2] = poly[(i + 1) % poly.length];
                cumLens.push(cumLens[cumLens.length - 1] + Math.hypot(x2 - x1, y2 - y1));
            }
            const totalLen = cumLens[cumLens.length - 1];
            if (totalLen === 0) return poly.slice();
            const result = [];
            for (let k = 0; k < n; k++) {
                const targetDist = (k * totalLen) / n;
                let segIdx = 0;
                while (segIdx < poly.length && cumLens[segIdx + 1] < targetDist) segIdx++;
                if (segIdx >= poly.length) segIdx = poly.length - 1;
                const segStart = cumLens[segIdx];
                const segLen = cumLens[segIdx + 1] - segStart;
                const t = segLen > 0 ? (targetDist - segStart) / segLen : 0;
                const [x1, y1] = poly[segIdx];
                const [x2, y2] = poly[(segIdx + 1) % poly.length];
                result.push([x1 + (x2 - x1) * t, y1 + (y2 - y1) * t]);
            }
            return result;
        }

        // Returns array of crossing-pairs [i, j] where segments (poly[i], poly[i+1])
        // and (poly[j], poly[j+1]) intersect. Adjacent edges (sharing an endpoint) are skipped.
        function findSelfIntersections(poly) {
            const n = poly.length;
            if (n < 4) return [];
            const ccw = (p, q, r) =>
                (q[0] - p[0]) * (r[1] - p[1]) - (r[0] - p[0]) * (q[1] - p[1]);
            const intersect = (a, b, c, d) => {
                const d1 = ccw(c, d, a), d2 = ccw(c, d, b);
                const d3 = ccw(a, b, c), d4 = ccw(a, b, d);
                return ((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) &&
                       ((d3 > 0 && d4 < 0) || (d3 < 0 && d4 > 0));
            };
            const crosses = [];
            for (let i = 0; i < n - 1; i++) {
                for (let j = i + 2; j < n - 1; j++) {
                    // Skip the wrap-around adjacency between last and first segment
                    if (i === 0 && j === n - 2) continue;
                    if (intersect(poly[i], poly[i + 1], poly[j], poly[j + 1])) {
                        crosses.push([i, j]);
                    }
                }
            }
            return crosses;
        }

        // Distinct colors per contour region. Chosen to contrast with user-green (#adff2f),
        // times-yellow (#F4C430), morph-green (#adff2f), and black background.
        const REGION_COLORS = [
            '#ff3030', // red
            '#30c4ff', // bright cyan-blue
            '#ff30c8', // magenta
            '#ff9030', // orange
            '#a060ff', // purple
            '#30ffd0', // turquoise
            '#ff6060', // coral
            '#60a0ff', // light blue
        ];
        function regionColor(idx) { return REGION_COLORS[idx % REGION_COLORS.length]; }

        function drawPolygon() {
            if ((!rawContour && !rawContours) || !savedPixels) return;
            drawCtx.putImageData(savedPixels, 0, 0);

            const showPoly = document.getElementById('poly-toggle')?.checked ?? true;
            const eps = +document.getElementById('eps-slider').value;

            // Multi-polygon support: use rawContours if available, else fallback to single rawContour
            const contours = (rawContours && rawContours.length > 0)
                ? rawContours
                : (rawContour && rawContour.length >= 3 ? [rawContour] : []);
            if (contours.length === 0) return;

            // Find largest contour index — that's the one used for morphing (resampled to target)
            let largestIdx = 0;
            for (let i = 1; i < contours.length; i++) {
                if (contours[i].length > contours[largestIdx].length) largestIdx = i;
            }

            const targetLargest = getLargestTargetSubPoly();
            let totalRdpVerts = 0, totalFinalVerts = 0, totalCrosses = 0;
            let resampled = false;
            userMorphPoly = null;

            drawCtx.save();
            drawCtx.lineWidth = 1;
            drawCtx.lineCap = 'round';
            drawCtx.lineJoin = 'round';

            // Process each contour separately (no bridges, proper topology)
            for (let ci = 0; ci < contours.length; ci++) {
                const rc = contours[ci];
                if (!rc || rc.length < 3) continue;

                let poly = rdp(rc, eps);
                totalRdpVerts += poly.length;

                // Only the LARGEST contour is resampled to match target for morphing
                if (ci === largestIdx && targetLargest && targetLargest.length >= 3) {
                    let openPoly = poly;
                    if (poly.length > 1 &&
                        poly[0][0] === poly[poly.length - 1][0] &&
                        poly[0][1] === poly[poly.length - 1][1]) {
                        openPoly = poly.slice(0, -1);
                    }
                    poly = resamplePolygon(openPoly, targetLargest.length);
                    resampled = true;
                    userMorphPoly = poly.slice();
                }

                // Ensure closed polygon
                if (poly.length > 2) {
                    const [fx, fy] = poly[0];
                    const [lx, ly] = poly[poly.length - 1];
                    if ((fx - lx) ** 2 + (fy - ly) ** 2 > 4) {
                        poly = [...poly, poly[0]];
                    }
                }

                const isClosed = poly.length > 2 &&
                    poly[0][0] === poly[poly.length - 1][0] &&
                    poly[0][1] === poly[poly.length - 1][1];
                const verts = isClosed ? poly.slice(0, -1) : poly;
                totalFinalVerts += verts.length;

                const color = regionColor(ci);

                if (showPoly) {
                    // Stroke in region-specific color, 2pt
                    drawCtx.strokeStyle = color;
                    drawCtx.lineWidth = 2;
                    drawCtx.beginPath();
                    drawCtx.moveTo(poly[0][0], poly[0][1]);
                    for (let i = 1; i < poly.length; i++) drawCtx.lineTo(poly[i][0], poly[i][1]);
                    drawCtx.closePath();
                    drawCtx.stroke();

                    // Vertices in region-specific color
                    drawCtx.fillStyle = color;
                    for (const [x, y] of verts) {
                        drawCtx.beginPath();
                        drawCtx.arc(x, y, 1.0, 0, Math.PI * 2);
                        drawCtx.fill();
                    }
                }

                // Per-polygon self-intersection check
                const crosses = findSelfIntersections(poly);
                if (crosses.length > 0) {
                    totalCrosses += crosses.length;
                    drawCtx.save();
                    drawCtx.strokeStyle = 'rgba(255, 0, 0, 0.95)';
                    drawCtx.lineWidth = 2;
                    const seen = new Set();
                    for (const [i, j] of crosses) {
                        for (const k of [i, j]) {
                            if (seen.has(k)) continue;
                            seen.add(k);
                            drawCtx.beginPath();
                            drawCtx.moveTo(poly[k][0],     poly[k][1]);
                            drawCtx.lineTo(poly[k + 1][0], poly[k + 1][1]);
                            drawCtx.stroke();
                        }
                    }
                    drawCtx.restore();
                }
            }

            drawCtx.restore();

            const countText = resampled
                ? `${totalRdpVerts} → ${totalFinalVerts} Vertices (${contours.length} loops)`
                : `${totalFinalVerts} Vertices (${contours.length} loops)`;
            const crossText = totalCrosses > 0 ? `  ⚠ ${totalCrosses} Cross${totalCrosses > 1 ? 'es' : ''}` : '';
            document.getElementById('vert-count').textContent = countText + crossText;
        }

        function onEpsChange(val) {
            document.getElementById('eps-val').textContent = val;
            try { localStorage.setItem('morph-eps', val); } catch (_) {}
            drawPolygon();
        }

        function onPolyToggle(checked) {
            try { localStorage.setItem('morph-poly-visible', checked ? '1' : '0'); } catch (_) {}
            // User outline (Kunst): drawPolygon() restores savedPixels first, so off-state clears it.
            if (rawContour && savedPixels) drawPolygon();
            // Times outline: re-render the digit canvas fully — drawTargetPolygon inside
            // respects the toggle, so the overlay disappears when off.
            if (selectedDigit !== null) onDigitChange(selectedDigit);
            // Morph figure: redraw with current slider value if morph exists
            const morphSlider = document.getElementById('morph-slider');
            if (morphSlider && userMorphPoly && targetMorphPoly) {
                const t = parseInt(morphSlider.value) / 100;
                drawMorph(t);
            }
        }

        function clearOutline() {
            // Stop any in-progress morph animation
            cancelAnimationFrame(morphRaf);
            morphRaf = null;
            // Clear drawing (Kunst) + user outline
            savedPixels = null;
            rawContour = null;
            rawContours = null;
            userMorphPoly = null;
            document.getElementById('vert-count').textContent = '';
            try { localStorage.removeItem('morph-outline'); } catch (_) {}
            initDraw();
            // Redraw digit without outline
            if (selectedDigit !== null && timesFont) {
                const fontSize = 640;
                const probe = timesFont.getPath(String(selectedDigit), 0, 0, fontSize);
                const bbox = probe.getBoundingBox();
                const offsetX = 720 - (bbox.x1 + bbox.x2) / 2;
                const offsetY = 500 - (bbox.y1 + bbox.y2) / 2;
                const path = timesFont.getPath(String(selectedDigit), offsetX, offsetY, fontSize);
                path.fill = '#F4C430';
                path.draw(digitCtx);
                targetPolygon = pathToPolygons(path, 8);
            } else if (selectedDigit !== null) {
                digitCtx.save();
                digitCtx.fillStyle = '#F4C430';
                digitCtx.font = 'bold 640px "Times New Roman", serif';
                digitCtx.textAlign = 'center';
                digitCtx.textBaseline = 'middle';
                digitCtx.fillText(String(selectedDigit), 720, 580);
                digitCtx.restore();
                const imgData = digitCtx.getImageData(0, 0, 1000, 1000);
                const grid = new Uint8Array(1000 * 1000);
                for (let i = 0; i < 1000 * 1000; i++)
                    grid[i] = imgData.data[i * 4 + 3] > 30 ? 1 : 0;
                const contour = getContour(grid, 1000, 1000);
                targetPolygon = contour.length ? [contour] : null;
            }
            // Clear morphed figure
            morphCtx.clearRect(0, 0, 1000, 1000);
            targetMorphPoly = null;
            // Reset morph slider
            const sl = document.getElementById('morph-slider');
            const mv = document.getElementById('morph-val');
            if (sl) sl.value = 0;
            if (mv) mv.textContent = 0;
        }

        // ── Morph: alignment + animation ─────────────────────────────────────────────
        function getLargestTargetSubPoly() {
            if (!targetPolygon || targetPolygon.length === 0) return null;
            let largest = targetPolygon[0];
            for (const p of targetPolygon) if (p.length > largest.length) largest = p;
            return largest;
        }

        // Rotate & possibly reverse target to minimize sum of vertex-distances to user
        function alignTargetTo(userPoly, target) {
            const n = userPoly.length;
            if (target.length !== n) return target;
            function bestRotation(t) {
                let bestK = 0, bestDist = Infinity;
                for (let k = 0; k < n; k++) {
                    let dist = 0;
                    for (let i = 0; i < n; i++) {
                        const dx = userPoly[i][0] - t[(i + k) % n][0];
                        const dy = userPoly[i][1] - t[(i + k) % n][1];
                        dist += dx * dx + dy * dy;
                        if (dist >= bestDist) break; // early-exit
                    }
                    if (dist < bestDist) { bestDist = dist; bestK = k; }
                }
                return { k: bestK, dist: bestDist };
            }
            const fwd = bestRotation(target);
            const rev = [...target].reverse();
            const bwd = bestRotation(rev);
            if (bwd.dist < fwd.dist) {
                return [...rev.slice(bwd.k), ...rev.slice(0, bwd.k)];
            }
            return [...target.slice(fwd.k), ...target.slice(0, fwd.k)];
        }

        function bboxOf(poly) {
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            for (const [x, y] of poly) {
                if (x < minX) minX = x;
                if (x > maxX) maxX = x;
                if (y < minY) minY = y;
                if (y > maxY) maxY = y;
            }
            return { minX, maxX, minY, maxY };
        }

        function prepareMorph() {
            if (!targetPolygon) return false;
            const target = getLargestTargetSubPoly();
            if (!target || !rawContour) return false;
            // Always regenerate userMorphPoly fresh from rawContour to avoid
            // cumulative translation across multiple prepareMorph calls.
            const eps = +document.getElementById('eps-slider').value;
            let basePoly = rdp(rawContour, eps);
            if (basePoly.length > 1 &&
                basePoly[0][0] === basePoly[basePoly.length-1][0] &&
                basePoly[0][1] === basePoly[basePoly.length-1][1]) {
                basePoly = basePoly.slice(0, -1);
            }
            userMorphPoly = resamplePolygon(basePoly, target.length);
            // userMorphPoly stays at its ORIGINAL drawn position (t=0).
            // targetMorphPoly is positioned LEFT of the times outline, baseline-aligned (t=1).
            // The morph interpolates position AND shape, so the figure animates from the
            // user's drawn position to the final left-of-times position.
            const tb = bboxOf(target);
            const gap = 100;
            const dxTarget = tb.minX - gap - tb.maxX;
            const targetTranslated = target.map(([x, y]) => [x + dxTarget, y]);
            targetMorphPoly = alignTargetTo(userMorphPoly, targetTranslated);
            return true;
        }

        function calculateSimilarity(morphPts, targetPts) {
            if (!morphPts || !targetPts || morphPts.length === 0) return 0;
            let sumDist = 0;
            const n = Math.min(morphPts.length, targetPts.length);
            for (let i = 0; i < n; i++) {
                const dx = morphPts[i][0] - targetPts[i][0];
                const dy = morphPts[i][1] - targetPts[i][1];
                sumDist += Math.sqrt(dx * dx + dy * dy);
            }
            const avgDist = sumDist / n;
            // Normalize: 0 distance = 100% similar, 150 pixels distance = 0% similar
            const maxDist = 150;
            const similarity = Math.max(0, Math.min(100, 100 * (1 - avgDist / maxDist)));
            return Math.round(similarity);
        }

        function drawMorph(t) {
            morphCtx.clearRect(0, 0, 1000, 1000);
            if (!userMorphPoly || !targetMorphPoly) return;
            const n = userMorphPoly.length;
            morphCtx.save();
            morphCtx.fillStyle = '#adff2f';
            morphCtx.beginPath();
            const pts = [];
            for (let i = 0; i < n; i++) {
                const ux = userMorphPoly[i][0], uy = userMorphPoly[i][1];
                const tx = targetMorphPoly[i][0], ty = targetMorphPoly[i][1];
                const x = ux + (tx - ux) * t;
                const y = uy + (ty - uy) * t;
                pts.push([x, y]);
                if (i === 0) morphCtx.moveTo(x, y);
                else morphCtx.lineTo(x, y);
            }
            morphCtx.closePath();
            morphCtx.fill();

            // Outline overlay — only when POLY ANZEIGEN switch is ON
            const showPoly = document.getElementById('poly-toggle')?.checked ?? true;
            if (showPoly) {
                morphCtx.strokeStyle = '#808080';
                morphCtx.lineWidth = 1;
                morphCtx.lineCap = 'round';
                morphCtx.lineJoin = 'round';
                morphCtx.stroke();
                morphCtx.fillStyle = 'rgb(240, 0, 0)';
                for (const [x, y] of pts) {
                    morphCtx.beginPath();
                    morphCtx.arc(x, y, 1.6, 0, Math.PI * 2);
                    morphCtx.fill();
                }
            }
            morphCtx.restore();

            // Calculate and display similarity
            const sim = calculateSimilarity(pts, targetMorphPoly);
            const simEl = document.getElementById('morph-similarity');
            if (simEl) simEl.textContent = sim + '%';
            if (t === 0 || t === 1 || Math.round(t * 100) % 20 === 0) {
                DebugWindow.log(`🎬 t=${Math.round(t * 100)}% | Similarity: ${sim}%`);
            }
        }

        function hideUserOutline() {
            // Clear draw canvas completely (hide user art AND outline)
            drawCtx.save();
            drawCtx.fillStyle = '#000';
            drawCtx.fillRect(0, 0, 1000, 1000);
            drawCtx.restore();
        }

        function showUserOutline() {
            // Restore user art + outline overlay
            if (savedPixels) drawCtx.putImageData(savedPixels, 0, 0);
            if (rawContour && savedPixels) drawPolygon();
        }

        function startMorph() {
            DebugWindow.log('▶ START MORPH');
            if (!rawContour) extractOutline();
            if (!prepareMorph()) {
                DebugWindow.log('❌ Morph failed: missing outline or digit');
                return;
            }
            DebugWindow.log(`✓ Morph setup ready (${MORPH_DURATION}ms)`);
            cancelAnimationFrame(morphRaf);
            // Redraw digit without outline
            if (selectedDigit !== null && timesFont) {
                const fontSize = 640;
                const probe = timesFont.getPath(String(selectedDigit), 0, 0, fontSize);
                const bbox = probe.getBoundingBox();
                const offsetX = 720 - (bbox.x1 + bbox.x2) / 2;
                const offsetY = 500 - (bbox.y1 + bbox.y2) / 2;
                const path = timesFont.getPath(String(selectedDigit), offsetX, offsetY, fontSize);
                path.fill = '#F4C430';
                digitCtx.clearRect(0, 0, 1000, 1000);
                path.draw(digitCtx);
            } else if (selectedDigit !== null) {
                digitCtx.clearRect(0, 0, 1000, 1000);
                digitCtx.save();
                digitCtx.fillStyle = '#F4C430';
                digitCtx.font = 'bold 640px "Times New Roman", serif';
                digitCtx.textAlign = 'center';
                digitCtx.textBaseline = 'middle';
                digitCtx.fillText(String(selectedDigit), 720, 580);
                digitCtx.restore();
            }
            // Draw times outline if toggle is on
            drawTargetPolygon();
            // Hide user outline during morphing
            hideUserOutline();
            morphStart = performance.now();
            function tick() {
                const elapsed = performance.now() - morphStart;
                const t = Math.min(1, elapsed / MORPH_DURATION);
                drawMorph(t);
                document.getElementById('morph-slider').value = Math.round(t * 100);
                document.getElementById('morph-val').textContent = Math.round(t * 100);
                if (t < 1) morphRaf = requestAnimationFrame(tick);
            }
            tick();
        }

        function stopMorph() {
            DebugWindow.log('⏹ STOP MORPH');
            cancelAnimationFrame(morphRaf);
            morphRaf = null;
            morphCtx.clearRect(0, 0, 1000, 1000);
            document.getElementById('morph-slider').value = 1;
            document.getElementById('morph-val').textContent = 1;
            // Redraw digit with outline
            if (selectedDigit !== null) drawTargetPolygon();
            showUserOutline();
            DebugWindow.log('✓ Morph stopped, user outline restored');
        }

        function clearMorphFigure() {
            cancelAnimationFrame(morphRaf);
            morphRaf = null;
            morphCtx.clearRect(0, 0, 1000, 1000);
            document.getElementById('morph-slider').value = 1;
            document.getElementById('morph-val').textContent = 1;
            const simEl = document.getElementById('morph-similarity');
            if (simEl) simEl.textContent = '0%';
            targetMorphPoly = null;
            userMorphPoly = null;
            showUserOutline();
        }

        function onMorphSlider(val) {
            cancelAnimationFrame(morphRaf);
            morphRaf = null;
            document.getElementById('morph-val').textContent = val;
            if (+val === 0) {
                morphCtx.clearRect(0, 0, 1000, 1000);
                if (selectedDigit !== null) drawTargetPolygon();
                return;
            }
            if (!prepareMorph()) return;
            // Redraw digit without outline
            if (selectedDigit !== null && timesFont) {
                const fontSize = 640;
                const probe = timesFont.getPath(String(selectedDigit), 0, 0, fontSize);
                const bbox = probe.getBoundingBox();
                const offsetX = 720 - (bbox.x1 + bbox.x2) / 2;
                const offsetY = 500 - (bbox.y1 + bbox.y2) / 2;
                const path = timesFont.getPath(String(selectedDigit), offsetX, offsetY, fontSize);
                path.fill = '#F4C430';
                digitCtx.clearRect(0, 0, 1000, 1000);
                path.draw(digitCtx);
            } else if (selectedDigit !== null) {
                digitCtx.clearRect(0, 0, 1000, 1000);
                digitCtx.save();
                digitCtx.fillStyle = '#F4C430';
                digitCtx.font = 'bold 640px "Times New Roman", serif';
                digitCtx.textAlign = 'center';
                digitCtx.textBaseline = 'middle';
                digitCtx.fillText(String(selectedDigit), 720, 580);
                digitCtx.restore();
            }
            drawMorph(val / 100);
        }

        let selectedDigit = null;
        let timesFont = null;
        let targetPolygon = null; // high-res polygon of the times digit, for morphing
        let userMorphPoly = null;   // resampled user polygon (no closing point)
        let targetMorphPoly = null; // largest target sub-polygon, aligned to userMorphPoly
        let morphRaf = null;
        let morphStart = 0;
        const MORPH_DURATION = 2500;

        // ── Bézier sampling for vector path → polygon ────────────────────────────────
        function sampleQuadratic(p0, p1, p2, n) {
            const pts = [];
            for (let i = 1; i <= n; i++) {
                const t = i / n, mt = 1 - t;
                pts.push([
                    mt*mt*p0[0] + 2*mt*t*p1[0] + t*t*p2[0],
                    mt*mt*p0[1] + 2*mt*t*p1[1] + t*t*p2[1]
                ]);
            }
            return pts;
        }
        function sampleCubic(p0, p1, p2, p3, n) {
            const pts = [];
            for (let i = 1; i <= n; i++) {
                const t = i / n, mt = 1 - t;
                pts.push([
                    mt*mt*mt*p0[0] + 3*mt*mt*t*p1[0] + 3*mt*t*t*p2[0] + t*t*t*p3[0],
                    mt*mt*mt*p0[1] + 3*mt*mt*t*p1[1] + 3*mt*t*t*p2[1] + t*t*t*p3[1]
                ]);
            }
            return pts;
        }
        function pathToPolygons(path, samplesPerCurve = 30) {
            const polys = [];
            let cur = null;
            let cx = 0, cy = 0, sx = 0, sy = 0;
            for (const cmd of path.commands) {
                switch (cmd.type) {
                    case 'M':
                        if (cur && cur.length) polys.push(cur);
                        cur = [[cmd.x, cmd.y]];
                        cx = sx = cmd.x; cy = sy = cmd.y;
                        break;
                    case 'L':
                        cur.push([cmd.x, cmd.y]);
                        cx = cmd.x; cy = cmd.y;
                        break;
                    case 'Q':
                        cur.push(...sampleQuadratic([cx, cy], [cmd.x1, cmd.y1], [cmd.x, cmd.y], samplesPerCurve));
                        cx = cmd.x; cy = cmd.y;
                        break;
                    case 'C':
                        cur.push(...sampleCubic([cx, cy], [cmd.x1, cmd.y1], [cmd.x2, cmd.y2], [cmd.x, cmd.y], samplesPerCurve));
                        cx = cmd.x; cy = cmd.y;
                        break;
                    case 'Z':
                        cx = sx; cy = sy;
                        break;
                }
            }
            if (cur && cur.length) polys.push(cur);
            return polys;
        }

        function onDigitChange(d) {
            selectedDigit = d;
            clearMorphFigure();
            try {
                localStorage.setItem('morph-digit', String(d));
                localStorage.removeItem('morph-text');
                document.getElementById('text-input').value = '';
            } catch (_) {}
            digitCtx.clearRect(0, 0, 1000, 1000);

            if (timesFont) {
                // Vector render via opentype
                const fontSize = 640;
                const probe = timesFont.getPath(String(d), 0, 0, fontSize);
                const bbox = probe.getBoundingBox();
                const offsetX = 720 - (bbox.x1 + bbox.x2) / 2;
                const offsetY = 580 - (bbox.y1 + bbox.y2) / 2;
                const path = timesFont.getPath(String(d), offsetX, offsetY, fontSize);
                path.fill = '#F4C430';
                path.draw(digitCtx);
                targetPolygon = pathToPolygons(path, 8);
            } else {
                // Fallback: canvas fillText + Marching Squares extraction
                digitCtx.save();
                digitCtx.fillStyle = '#F4C430';
                digitCtx.font = 'bold 640px "Times New Roman", serif';
                digitCtx.textAlign = 'center';
                digitCtx.textBaseline = 'middle';
                digitCtx.fillText(String(d), 720, 580);
                digitCtx.restore();

                // Extract polygons (topology-aware: outer + holes)
                const imgData = digitCtx.getImageData(0, 0, 1000, 1000);
                const grid = new Uint8Array(1000 * 1000);
                for (let i = 0; i < 1000 * 1000; i++)
                    grid[i] = imgData.data[i * 4 + 3] > 30 ? 1 : 0;
                const contours = getContoursWithHoles(grid, 1000, 1000);
                targetPolygon = contours.length ? contours : null;
            }

            // Sub-sample each sub-polygon to a max count
            const MAX_PTS = 300;
            if (targetPolygon) {
                targetPolygon = targetPolygon.map(poly => {
                    if (poly.length <= MAX_PTS) return poly;
                    const step = poly.length / MAX_PTS;
                    const sub = [];
                    for (let i = 0; i < MAX_PTS; i++) sub.push(poly[Math.round(i * step)]);
                    return sub;
                });
            }

            // Update vertex counter
            const total = targetPolygon ? targetPolygon.reduce((s, p) => s + p.length, 0) : 0;
            const el = document.getElementById('target-count');
            if (el) el.textContent = `${total} Vertices`;

            drawTargetPolygon();
            if (rawContour && savedPixels) drawPolygon();
        }

        function setTextInput(latex) {
            const input = document.getElementById('text-input');
            input.value = latex;
            try {
                localStorage.setItem('morph-text', latex);
                localStorage.removeItem('morph-digit');
            } catch (_) {}
            onTextInput(latex);
        }

        function onTextInput(text) {
            selectedDigit = null;
            clearMorphFigure();
            DebugWindow.log(`━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`);
            if (!text || text.trim() === '') {
                DebugWindow.log('⊘ Empty input');
                digitCtx.clearRect(0, 0, 1000, 1000);
                targetPolygon = null;
                drawTargetPolygon();
                return;
            }
            renderLatexToCanvas(text);
        }

        function extractAndUpdatePolygon() {
            DebugWindow.log('📊 Extracting polygons (topology-aware)...');
            const imgData = digitCtx.getImageData(0, 0, 1000, 1000);
            const grid = new Uint8Array(1000 * 1000);
            for (let i = 0; i < 1000 * 1000; i++)
                grid[i] = imgData.data[i * 4 + 3] > 30 ? 1 : 0;
            const contours = getContoursWithHoles(grid, 1000, 1000);
            targetPolygon = contours.length ? contours : null;

            if (!targetPolygon) {
                DebugWindow.log('⚠️ No polygons detected');
                return;
            }

            DebugWindow.log(`✓ Found ${contours.length} contour(s) (outer + holes)`);
            const totalVerts = contours.reduce((s, c) => s + c.length, 0);
            DebugWindow.log(`  Total vertices: ${totalVerts}`);

            const MAX_PTS = 300;
            if (targetPolygon) {
                targetPolygon = targetPolygon.map(poly => {
                    if (poly.length <= MAX_PTS) return poly;
                    const step = poly.length / MAX_PTS;
                    const sub = [];
                    for (let i = 0; i < MAX_PTS; i++) sub.push(poly[Math.round(i * step)]);
                    return sub;
                });
            }
            const total = targetPolygon ? targetPolygon.reduce((s, p) => s + p.length, 0) : 0;
            DebugWindow.log(`✓ Resampled to ${total} vertices (max: 300)`);

            const el = document.getElementById('target-count');
            if (el) el.textContent = `${total} Vertices`;
            drawTargetPolygon();
            if (rawContour && savedPixels) drawPolygon();
        }

        function renderLatexToCanvas(text) {
            digitCtx.clearRect(0, 0, 1000, 1000);
            DebugWindow.log(`📝 Input: "${text}"`);
            DebugWindow.log(`KaTeX: ${typeof katex !== 'undefined' ? '✓' : '✗'} | html2canvas: ${typeof html2canvas !== 'undefined' ? '✓' : '✗'}`);

            if (typeof katex === 'undefined') {
                DebugWindow.log('⚠️ KaTeX not loaded');
                renderPlainText(text);
                return;
            }
            if (typeof html2canvas === 'undefined') {
                DebugWindow.log('⚠️ html2canvas not loaded');
                renderPlainText(text);
                return;
            }

            // Handle special cases: \sqrt alone → \surd (just the root symbol)
            let processedText = text.trim();
            if (processedText === '\\sqrt') {
                processedText = '\\surd';
                DebugWindow.log('🔄 Converting \\sqrt → \\surd (root symbol only)');
            }

            try {
                DebugWindow.log('🔄 Rendering KaTeX...');
                const html = katex.renderToString(processedText, { throwOnError: true, displayMode: true });
                DebugWindow.log('✓ KaTeX HTML generated');

                // Create visible offscreen div with KaTeX HTML
                const wrapper = document.createElement('div');
                wrapper.innerHTML = html;
                wrapper.style.cssText = `
                    position: fixed;
                    left: -10000px;
                    top: 0;
                    background: transparent;
                    color: #F4C430;
                    font-size: 400px;
                    padding: 60px;
                    display: inline-block;
                    line-height: 1;
                `;
                document.body.appendChild(wrapper);

                // Wait a tick for rendering
                setTimeout(() => {
                    const rect = wrapper.getBoundingClientRect();
                    DebugWindow.log(`DOM size: ${Math.round(rect.width)}×${Math.round(rect.height)}px`);

                    html2canvas(wrapper, {
                        backgroundColor: null,
                        scale: 1,
                        logging: false,
                        width: rect.width,
                        height: rect.height
                    }).then(canvas => {
                        DebugWindow.log(`✓ html2canvas: ${canvas.width}×${canvas.height}px`);

                        // Scale to fit on digit canvas — match Times digit size (~640px tall)
                        const maxW = 900, maxH = 800;
                        const scale = Math.min(maxW / canvas.width, maxH / canvas.height);
                        const w = canvas.width * scale;
                        const h = canvas.height * scale;
                        const x = 720 - w / 2;
                        const y = 580 - h / 2;

                        digitCtx.drawImage(canvas, x, y, w, h);
                        document.body.removeChild(wrapper);
                        DebugWindow.log(`✓ Drawn at (${Math.round(x)},${Math.round(y)}) ${Math.round(w)}×${Math.round(h)}px`);
                        extractAndUpdatePolygon();
                    }).catch(err => {
                        DebugWindow.log(`❌ html2canvas error: ${err.message}`);
                        document.body.removeChild(wrapper);
                        renderPlainText(text);
                    });
                }, 50);
            } catch (e) {
                DebugWindow.log(`❌ KaTeX error: ${e.message}`);
                renderPlainText(text);
            }
        }

        function renderPlainText(text) {
            DebugWindow.log(`📄 Fallback to plain text: "${text}"`);
            digitCtx.clearRect(0, 0, 1000, 1000);
            digitCtx.save();
            digitCtx.fillStyle = '#F4C430';
            const fontSize = 640;
            digitCtx.font = `bold ${fontSize}px "Times New Roman", serif`;
            digitCtx.textAlign = 'center';
            digitCtx.textBaseline = 'middle';
            digitCtx.fillText(text, 720, 580);
            digitCtx.restore();
            DebugWindow.log('✓ Text rendered');
            extractAndUpdatePolygon();
        }

        function drawTargetPolygon() {
            if (!targetPolygon) return;
            const showTarget = document.getElementById('poly-toggle')?.checked ?? true;
            if (!showTarget) return;

            // Show times outline at its natural times position (no alignment shift)
            const displayTarget = targetPolygon;

            digitCtx.save();
            digitCtx.lineWidth = 2;
            digitCtx.lineCap = 'round';
            digitCtx.lineJoin = 'round';
            // Stroke + vertices per region, each in its own color
            for (let i = 0; i < displayTarget.length; i++) {
                const color = regionColor(i);
                const poly = displayTarget[i];
                digitCtx.strokeStyle = color;
                digitCtx.beginPath();
                digitCtx.moveTo(poly[0][0], poly[0][1]);
                for (let j = 1; j < poly.length; j++) digitCtx.lineTo(poly[j][0], poly[j][1]);
                digitCtx.closePath();
                digitCtx.stroke();

                digitCtx.fillStyle = color;
                for (const [x, y] of poly) {
                    digitCtx.beginPath();
                    digitCtx.arc(x, y, 1.0, 0, Math.PI * 2);
                    digitCtx.fill();
                }
            }
            digitCtx.restore();
        }

        // Load Tinos (Times-compatible) font asynchronously
        opentype.load('https://cdn.jsdelivr.net/gh/google/fonts/apache/tinos/Tinos-Bold.ttf', (err, font) => {
            if (err) { console.warn('Tinos load failed:', err); return; }
            timesFont = font;
            if (selectedDigit !== null) onDigitChange(selectedDigit);
        });

        // ── Persistence ─────────────────────────────────────────────────────────────
        function scheduleAutoSave() {
            clearTimeout(saveTimer);
            saveTimer = setTimeout(() => {
                try {
                    const data = drawCanvas.toDataURL('image/png');
                    localStorage.setItem('morph-drawing', data);
                } catch (_) {}
            }, 500);
        }

        function downloadPng() {
            const link = document.createElement('a');
            link.href = drawCanvas.toDataURL('image/png');
            link.download = 'morph-' + new Date().toISOString().slice(0, 10) + '.png';
            link.click();
        }

        function loadFromStorage() {
            try {
                const data = localStorage.getItem('morph-drawing');
                if (data) {
                    const img = new Image();
                    img.onload = () => {
                        drawCtx.drawImage(img, 0, 0);
                        restoreOutline();
                    };
                    img.src = data;
                    return;
                }
            } catch (_) {}
            restoreOutline();
        }

        function restoreOutline() {
            try {
                const allData = localStorage.getItem('morph-outlines');
                if (allData) {
                    rawContours = JSON.parse(allData);
                    if (rawContours && rawContours.length > 0) {
                        rawContour = rawContours[0];
                        for (const c of rawContours) {
                            if (c.length > rawContour.length) rawContour = c;
                        }
                    }
                } else {
                    const data = localStorage.getItem('morph-outline');
                    if (data) {
                        rawContour = JSON.parse(data);
                        rawContours = [rawContour];
                    }
                }
                if (rawContour) {
                    savedPixels = drawCtx.getImageData(0, 0, 1000, 1000);
                    drawPolygon();
                }
            } catch (_) {}
        }

        // Make cards collapsible with state persistence
        function makeCardsCollapsible() {
            const cards = document.querySelectorAll('.instrument-card.collapsible');
            cards.forEach(card => {
                const titleEl = card.querySelector('.instrument-title');
                if (!titleEl) return;

                // Extract title text (without icon)
                const cardKey = titleEl.textContent.trim().replace(/^▶\s*/, '');

                // Restore collapsed state from localStorage
                try {
                    const isCollapsed = localStorage.getItem('morph-card-' + cardKey) === '1';
                    if (isCollapsed) card.classList.add('collapsed');
                    else card.classList.remove('collapsed');
                } catch (_) {}

                // Persist on toggle (note: ui.js already adds the click handler that toggles)
                titleEl.addEventListener('click', () => {
                    try {
                        const isCollapsed = card.classList.contains('collapsed');
                        localStorage.setItem('morph-card-' + cardKey, isCollapsed ? '1' : '0');
                    } catch (_) {}
                });
            });
        }

        // Boot
        initDraw();
        loadFromStorage();
        try {
            const savedEps = localStorage.getItem('morph-eps');
            if (savedEps !== null) {
                document.getElementById('eps-slider').value = savedEps;
                document.getElementById('eps-val').textContent = savedEps;
            }
        } catch (_) {}
        try {
            const savedText = localStorage.getItem('morph-text');
            const savedDigit = localStorage.getItem('morph-digit');
            if (savedText !== null) {
                document.getElementById('text-input').value = savedText;
                // Check matching latex radio button
                const radio = document.querySelector(`input[name="digit"][data-latex="${savedText}"]`);
                if (radio) radio.checked = true;
                onTextInput(savedText);
            } else if (savedDigit !== null) {
                const radio = document.querySelector(`input[name="digit"][value="${savedDigit}"]`);
                if (radio) radio.checked = true;
                onDigitChange(+savedDigit);
            }
        } catch (_) {}
        try {
            const savedPoly = localStorage.getItem('morph-poly-visible');
            if (savedPoly !== null) {
                document.getElementById('poly-toggle').checked = savedPoly === '1';
            }
        } catch (_) {}
        makeCardsCollapsible();
        renderLatexButtons();

        function renderLatexButtons() {
            if (typeof katex === 'undefined') return;
            document.querySelectorAll('.latex-render[data-latex]').forEach(el => {
                try {
                    katex.render(el.dataset.latex, el, {
                        throwOnError: false,
                        displayMode: false
                    });
                } catch (e) {
                    el.textContent = el.dataset.latex;
                }
            });
        }
    </script>
</body>
