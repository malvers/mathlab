<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOC ALVERS MATHE-LABORE | Equation OCR</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="../resources/favicon.png">
    <link rel="stylesheet" href="../js/cyber-layout.css">
    <link rel="stylesheet" href="../js/buttons-ultra.css">
    <link rel="stylesheet" href="../js/cyber-lab-overrides.css">
    <link rel="stylesheet" href="../js/branding.styles.extracted.css">
    <link rel="stylesheet" href="../js/lab-shell-minimal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">

    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="../js/debug-window.js"></script>
    <!-- API key: embedded.js (committed, deployed) sets window.GEMINI_API_KEY
         for production; local.js (gitignored) loads after and can override
         for local development. Missing local.js is fine — onerror swallows. -->
    <script src="apikey.embedded.js"></script>
    <script src="apikey.local.js" onerror="this.remove()"></script>

    <style>
        #draw-canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #020410;
            /* Default: pen OFF so accidental clicks during box-adjustment
               don't paint. The pen-toggle icon in the ZEICHNEN card title
               adds .pen-on to re-enable drawing. */
            cursor: default;
            pointer-events: none;
            border-radius: 10px;
            border: 2px solid rgba(0, 210, 255, 0.5);
            box-shadow: 0 0 24px rgba(0, 210, 255, 0.12);
            touch-action: none;
        }
        #draw-canvas.pen-on {
            cursor: crosshair;
            pointer-events: auto;
        }
        /* Mouse-coord readout — sits just above the ERKENNEN button, shows
           the current pointer position in canvas-space (0–1000 each axis). */
        #mouse-coord {
            position: absolute;
            left: 50%;
            bottom: 80px;
            transform: translateX(-50%);
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: #adff2f;
            background: rgba(2, 4, 16, 0.85);
            padding: 8px 20px;
            border-radius: 6px;
            border: 1px solid rgba(173, 255, 47, 0.4);
            pointer-events: none;
            z-index: 31;
            white-space: nowrap;
            min-width: 220px;
            text-align: center;
        }
        /* Small pen icon in the ZEICHNEN card title — toggles drawing. */
        .pen-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-left: 10px;
            width: 18px;
            height: 18px;
            cursor: pointer;
            color: rgba(0, 210, 255, 0.45);
            transition: color 0.15s, filter 0.15s;
        }
        .pen-toggle:hover { color: #00d2ff; }
        .pen-toggle.active {
            color: #adff2f;
            filter: drop-shadow(0 0 4px rgba(173, 255, 47, 0.6));
        }
        #canvas-stack {
            position: relative;
            /* Responsive: shrinks to fit small viewports (tablet) while
               keeping the 1:1 aspect ratio. The intrinsic canvas resolution
               stays 1000×1000 (Gemini box coords map 1:1 to it); CSS just
               scales the displayed size uniformly. Mouse-coord mapping in
               JS already accounts for display vs intrinsic ratio. */
            width: min(1000px, calc(100vw - 40px), calc(100vh - 280px));
            aspect-ratio: 1 / 1;
            flex: 0 0 auto;
            line-height: 0;
        }
        #canvas-stack > canvas {
            width: 100%;
            height: 100%;
        }
        /* Bottom-center button row overlaying the canvas (ERKENNEN + CLEAR).
           Canvas is WHITE in this lab (for OCR contrast), so the buttons need
           a solid dark background to stay readable. */
        #canvas-btn-row {
            position: absolute;
            left: 50%;
            bottom: clamp(8px, 1.5vh, 16px);
            transform: translateX(-50%);
            display: flex;
            gap: clamp(6px, 1vw, 10px);
            z-index: 30;
            width: max-content;
            max-width: calc(100% - 24px);
        }
        #canvas-recognize-btn,
        #canvas-clear-btn {
            width: auto !important;
            /* Responsive: shrinks on tablet, fills sensibly on desktop. */
            min-width: clamp(70px, 18vw, 140px) !important;
            padding: clamp(4px, 0.8vh, 10px) clamp(8px, 2vw, 18px) !important;
            font-size: clamp(11px, 1.6vw, 14px) !important;
            border: 0.5px solid #adff2f !important;
            color: #adff2f !important;
            background: rgba(8, 20, 42, 0.92) !important;
            box-shadow: 0 0 6px rgba(173, 255, 47, 0.18) !important;
        }
        #canvas-recognize-btn { min-width: clamp(110px, 24vw, 200px) !important; }
        #canvas-recognize-btn:hover,
        #canvas-clear-btn:hover {
            background: rgba(8, 20, 42, 0.92) !important;
            border: 0.5px solid #adff2f !important;
            color: #adff2f !important;
            box-shadow: 0 0 14px rgba(173, 255, 47, 0.4) !important;
        }
        #canvas-recognize-btn:active,
        #canvas-clear-btn:active {
            transform: scale(0.98) !important;
        }
        #draw-wrap {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 14px;
            padding: 50px 20px 20px;
            box-sizing: border-box;
        }
        #result-box {
            position: relative;
            /* Matches canvas-stack width so the LATEX + RENDER panes align
               with the drawing surface. Responsive: same min() formula. */
            width: min(1000px, calc(100vw - 40px), calc(100vh - 280px));
            flex-shrink: 0;
            background: #020410;
            border: 1px solid rgba(0, 210, 255, 0.5);
            border-radius: 8px;
            color: #00d2ff;
            font-family: 'Outfit', sans-serif;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
            overflow: hidden;
        }
        #result-box .pane {
            padding: clamp(8px, 1.5vh, 18px) 22px;
        }
        #result-box .pane + .pane {
            border-top: 1px solid rgba(0, 210, 255, 0.3);
        }
        #result-box .label {
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            letter-spacing: 0.1em;
            color: rgba(0, 210, 255, 0.6);
            margin-bottom: 8px;
        }
        #result-latex {
            font-family: 'Courier New', monospace;
            font-size: 20px;
            color: #adff2f;
            word-break: break-all;
            line-height: 1.4;
            /* Responsive: tablet shrinks LATEX line, desktop keeps 30px. */
            height: clamp(20px, 3vh, 32px);
            overflow: auto;
            display: flex;
            align-items: center;
        }
        #result-render {
            font-size: 24px;
            color: #F4C430;
            /* Responsive: shrinks to ~9vh on small viewports, max 96px desktop. */
            height: clamp(56px, 9vh, 96px);
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        /* KaTeX inherits page font-family otherwise — force its own glyphs */
        #result-render .katex,
        #result-render .katex-display {
            color: #F4C430;
        }
        .api-input {
            width: 100%;
            margin-top: 6px;
            padding: 6px 10px;
            background: rgba(0, 210, 255, 0.08);
            border: 1px solid rgba(0, 210, 255, 0.3);
            color: #00d2ff;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            border-radius: 4px;
            outline: none;
            box-sizing: border-box;
        }
        .api-input:focus {
            border-color: #00d2ff;
        }
        #draw-hint {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 0.04em;
            text-align: center;
        }
        .eps-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }
        .eps-row label {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            color: rgba(0, 210, 255, 0.7);
        }
        .eps-row input[type=range] {
            flex: 1;
            accent-color: #00d2ff;
        }
        .eps-row span {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            color: #00d2ff;
            width: 28px;
            text-align: right;
        }
        /* Tiny RESET button — sits at the top-right of the KOSTENKONTROLLE card,
           next to the title. Overrides cyber-btn defaults (which would fill width). */
        #reset-cost-btn {
            position: absolute !important;
            top: 6px !important;
            right: 12px !important;
            width: auto !important;
            min-width: 0 !important;
            min-height: 22px !important;
            padding: 3px 10px !important;
            font-size: 10px !important;
            letter-spacing: 1.5px !important;
            background: rgba(8, 20, 42, 0.6) !important;
            border: 1px solid rgba(244, 196, 48, 0.5) !important;
            color: #F4C430 !important;
            border-radius: 4px !important;
            box-shadow: none !important;
            margin: 0 !important;
            z-index: 5;
        }
        #reset-cost-btn:hover {
            background: rgba(244, 196, 48, 0.12) !important;
            border-color: #F4C430 !important;
            color: #F4C430 !important;
            box-shadow: 0 0 8px rgba(244, 196, 48, 0.35) !important;
            transform: none !important;
        }

        /* Page-local cyber-btn override — only inside equationocr.html.
           buttons-ultra.css enforces min-height 58px globally; we make them
           flatter here without touching the central rule (morph etc. stay 58px). */
        .cyber-btn {
            min-height: 42px !important;
            padding: 10px 18px !important;
        }

        /* Formula grid — copied from morph.css (digit-grid + formula-grid) */
        .digit-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 6px;
        }
        .digit-grid input[type=radio] { display: none; }
        .digit-grid label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 16px;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.55);
            background: rgba(0, 210, 255, 0.04);
            border: 1px solid rgba(0, 210, 255, 0.25);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
        }
        .digit-grid label:hover {
            color: #00d2ff;
            border-color: rgba(0, 210, 255, 0.6);
            background: rgba(0, 210, 255, 0.1);
        }
        .digit-grid label:has(input:checked) {
            color: #adff2f;
            border-color: #adff2f;
            background: rgba(173, 255, 47, 0.12);
            box-shadow: 0 0 12px rgba(173, 255, 47, 0.3);
        }
        .digit-grid .latex-render .katex {
            color: inherit;
            line-height: 1;
        }
    </style>
</head>

<body>
    <nav id="mini-rail">
        <div class="nav-btn" onclick="toggleSidebar()" title="Toggle Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </div>
    </nav>

    <aside id="side-panel">
        <header id="sidebar-header"></header>
        <div id="ui-container"></div>
    </aside>

    <main id="main-content">
        <div id="canvas-container">
            <div class="cyber-grid"></div>
            <div id="math-coach-box">
                <div class="coach-title" id="coach-title-slot"></div>
                <div id="coach-content" class="coach-message"></div>
            </div>
            <div id="draw-wrap">
                <div id="result-box">
                    <div class="pane">
                        <div id="result-latex"></div>
                    </div>
                    <div class="pane">
                        <div id="result-render"></div>
                    </div>
                </div>
                <div id="canvas-stack">
                    <canvas id="draw-canvas" width="1000" height="1000"></canvas>
                    <!-- <div id="mouse-coord">x: —  y: —</div> -->
                    <div id="canvas-btn-row">
                        <button class="cyber-btn" id="canvas-recognize-btn" onclick="recognize()">ERKENNEN</button>
                        <button class="cyber-btn" id="canvas-clear-btn" onclick="clearDraw()">CLEAR</button>
                    </div>
                </div>
                <div id="draw-hint">Zeichne eine Formel — Maus oder Finger</div>
            </div>
        </div>
    </main>

    <!-- Cost warning overlay — fullscreen modal, blocks until acknowledged. -->
    <div id="cost-warning" style="display:none;position:fixed;inset:0;background:rgba(2,4,16,0.85);backdrop-filter:blur(6px);z-index:10000;align-items:center;justify-content:center;">
        <div style="background:#020410;border:2px solid #C41E3A;border-radius:10px;box-shadow:0 0 60px rgba(196,30,58,0.6),0 0 120px rgba(196,30,58,0.3);padding:32px 40px;max-width:520px;color:#fff;font-family:Arial,sans-serif;text-align:center;">
            <div style="font-size:48px;color:#C41E3A;line-height:1;margin-bottom:14px;">⚠</div>
            <div style="font-size:20px;font-weight:700;color:#C41E3A;letter-spacing:0.04em;margin-bottom:18px;">KOSTEN-WARNUNG</div>
            <div id="cost-warning-text" style="font-size:15px;line-height:1.5;color:#fff;margin-bottom:24px;"></div>
            <button onclick="dismissCostWarning()"
                style="background:#C41E3A;border:none;color:#fff;padding:10px 32px;border-radius:5px;font-family:Arial,sans-serif;font-size:14px;font-weight:700;letter-spacing:0.1em;cursor:pointer;">VERSTANDEN</button>
        </div>
    </div>

    <script src="../js/cyber-left-chrome.js"></script>
    <script src="../js/branding/briefings.js"></script>
    <script src="../js/branding/overlays.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/i18n-de.js"></script>
    <script src="../js/i18n-en.js"></script>
    <script src="../js/i18n-es.js"></script>
    <script src="../js/i18n-fr.js"></script>
    <script src="../js/i18n-it.js"></script>
    <script src="../js/i18n-pt.js"></script>
    <script src="../js/i18n-sw.js"></script>
    <script src="../js/i18n-tr.js"></script>
    <script src="../js/i18n-nl.js"></script>
    <script src="../js/branding/nav.js"></script>
    <script src="../js/branding.js"></script>
    <script src="../js/ui.js"></script>
    <script>
        function toggleSidebar() {
            const panel = document.getElementById('side-panel');
            panel.classList.toggle('collapsed');
            if (window.CyberLeftChrome?.publishResolvedScale) CyberLeftChrome.publishResolvedScale();
            setTimeout(() => window.dispatchEvent(new Event('resize')), 400);
        }

        CyberBranding.init({ useExternalStyles: true, title: CyberI18n.get('ui.coach_title'), subtitle: 'Equation OCR' });
        CyberUI.init();
        document.getElementById('coach-title-slot').textContent = 'Equation OCR';
        if (window.CyberLeftChrome?.configure) CyberLeftChrome.configure({ viewportOnlyZoom: true });

        CyberUI.createCard('ui-container', 'ZEICHNEN', `
            <button class="cyber-btn" onclick="clearDraw()"
                style="width:100%;border-color:rgba(0,210,255,0.35);">LÖSCHEN</button>
            <button class="cyber-btn" onclick="replayLast()"
                style="width:100%;margin-top:6px;border-color:rgba(244,196,48,0.4);color:#F4C430;"
                title="Letzte Gemini-Antwort aus localStorage neu zeichnen (kein API-Call)">REPLAY</button>
            <div class="eps-row">
                <label>Stift</label>
                <input type="range" id="stroke-slider" min="1" max="30" value="8" step="1"
                    oninput="onStrokeChange(this.value)">
                <span id="stroke-val">8</span>
            </div>
            <div class="eps-row">
                <label>Scale</label>
                <input type="range" id="canvas-scale-slider" min="10" max="100" value="50" step="5"
                    oninput="onCanvasScaleChange(this.value)">
                <span id="canvas-scale-val">50</span><span style="opacity:0.6;">%</span>
            </div>
            <div style="font-family:'Orbitron',sans-serif;font-size:10px;color:rgba(0,210,255,0.6);text-align:right;margin-top:2px;">
                <span id="canvas-scale-size">500×500</span> px an Gemini
            </div>
        `, '#00d2ff', { collapsible: true });

        CyberUI.createCard('ui-container', 'GOOGLE GEMINI API', `
            <!-- API key input kept hidden — key is loaded from apikey.local.js
                 (obfuscated, gitignored). Restore-logic in initApi() still
                 reads/writes this field so localStorage round-trips work. -->
            <input type="password" id="g-api-key" class="api-input" placeholder="API key" autocomplete="off" style="display:none;">
            <select id="g-model" class="api-input" onchange="updateGeminiTitle()">
                <option value="gemini-2.5-flash">2.5-flash</option>
                <option value="gemini-2.5-flash-lite">2.5-flash-lite</option>
                <option value="gemini-2.5-pro">2.5-pro</option>
            </select>
            <div id="g-price-info" style="font-family:'Orbitron',sans-serif;font-size:10px;color:rgba(0,210,255,0.65);text-align:right;margin-top:4px;letter-spacing:0.04em;">
                — per Mio. Token
            </div>
        `, '#00d2ff', { collapsible: true });

        // Reflect the selected model in the card title (replaces "API" with e.g. "2.5-FLASH").
        // Also updates the small price-info line below the dropdown — that's where
        // the per-1M-token rates live now that they're out of the option text.
        function updateGeminiTitle() {
            const sel = document.getElementById('g-model');
            if (!sel) return;
            const model = sel.value;
            // Persist the selection now — otherwise it would only land in
            // localStorage at the next ERKENNEN call (and get lost if the
            // user reloads before pressing it).
            try { localStorage.setItem('eocr-g-model', model); } catch (_) {}
            const suffix = model.replace(/^gemini-/, '').toUpperCase();
            const card = sel.closest('.instrument-card');
            const titleEl = card?.querySelector('.instrument-title');
            if (titleEl) {
                const icon = titleEl.querySelector('.toggle-icon');
                titleEl.innerHTML = '';
                if (icon) titleEl.appendChild(icon);
                titleEl.appendChild(document.createTextNode(' GOOGLE GEMINI ' + suffix));
            }
            const priceEl = document.getElementById('g-price-info');
            const price = (typeof GEMINI_PRICING !== 'undefined') ? GEMINI_PRICING[model] : null;
            if (priceEl && price) {
                priceEl.textContent = `$${price.in} in / $${price.out} out — per Mio. Token`;
            }
        }

        CyberUI.createCard('ui-container', 'KOSTENKONTROLLE', `
            <div style="font-family:Arial,sans-serif;font-size:17px;line-height:1.9;color:#00d2ff;letter-spacing:0.02em;">
                <div style="display:flex;justify-content:space-between;gap:10px;">
                    <span>Last Call:</span>
                    <span id="cost-last" style="color:#adff2f;font-weight:700;white-space:nowrap;">0</span>
                </div>
                <div style="display:flex;justify-content:space-between;gap:10px;">
                    <span>Session:</span>
                    <span id="cost-session" style="color:#adff2f;font-weight:700;text-align:right;white-space:nowrap;">0</span>
                </div>
                <div style="display:flex;justify-content:space-between;gap:10px;">
                    <span>Counter:</span>
                    <span id="cost-alltime" style="color:#F4C430;font-weight:700;text-align:right;white-space:nowrap;">0</span>
                </div>
            </div>
            <!--
            <div class="eps-row" style="margin-top:14px;">
                <label style="font-size:13px;">Limit $</label>
                <input type="number" id="cost-limit" step="0.01" min="0" value="1.00"
                    style="flex:1;padding:6px 10px;background:rgba(0,210,255,0.08);border:1px solid rgba(0,210,255,0.3);color:#00d2ff;font-family:'Courier New',monospace;font-size:13px;border-radius:4px;outline:none;"
                    oninput="onCostLimitChange(this.value)">
            </div>
            -->

            <button class="cyber-btn" id="reset-cost-btn" onclick="resetCostCounter()" title="Counter zurücksetzen">RESET</button>
        `, '#F4C430', { collapsible: true });

        // Formula list — same shape & order as morph.html FORMELN card.
        const FORMULAS = [
            { latex: 'E=mc^2',                                                                                                                title: 'Einstein' },
            { latex: '\\frac{a}{b}',                                                                                                          title: 'Bruch' },
            { latex: 'x=\\frac{-b\\pm\\sqrt{b^2-4ac}}{2a}',                                                                                   title: 'Quadratische Formel' },
            { latex: 'e^{i\\pi}+1=0',                                                                                                         title: 'Eulersche Identität' },
            { latex: 'a^2+b^2=c^2',                                                                                                           title: 'Pythagoras' },
            { latex: 'e^x=\\sum_{n=0}^{\\infty}\\frac{x^n}{n!}',                                                                              title: 'Taylor e^x' },
            { latex: '\\int_{-\\infty}^{\\infty}e^{-x^2}dx=\\sqrt{\\pi}',                                                                     title: 'Gauss-Integral' },
            { latex: '\\binom{n}{k}=\\frac{n!}{k!(n-k)!}',                                                                                    title: 'Binomialkoeffizient' },
            { latex: '\\frac{d}{dx}x^n=nx^{n-1}',                                                                                             title: 'Potenzregel' },
            { latex: '\\int_a^b f(x)\\,dx',                                                                                                   title: 'Bestimmtes Integral' },
            { latex: 'F=G\\frac{m_1 m_2}{r^2}',                                                                                               title: 'Newton Gravitation' },
            { latex: 'i\\hbar\\frac{\\partial}{\\partial t}\\Psi=\\hat{H}\\Psi',                                                               title: 'Schrödinger' },
            { latex: '\\nabla\\cdot E=\\frac{\\rho}{\\varepsilon_0}',                                                                         title: 'Maxwell (Gauß)' },
            { latex: '\\nabla\\times B=\\mu_0 J+\\mu_0\\varepsilon_0\\frac{\\partial E}{\\partial t}',                                        title: 'Maxwell (Ampère)' }
        ];
        // Complex formulas — rendered live via KaTeX + html2canvas onto the
        // draw-canvas. No preset PNGs needed.
        const COMPLEX_FORMULAS = [
            { latex: '\\zeta(s)=\\sum_{n=1}^{\\infty}\\frac{1}{n^s}',                                                                          title: 'Riemann ζ' },
            { latex: '(i\\hbar\\gamma^\\mu\\partial_\\mu - mc)\\psi=0',                                                                         title: 'Dirac' },
            { latex: 'f(a)=\\frac{1}{2\\pi i}\\oint_\\gamma\\frac{f(z)}{z-a}\\,dz',                                                              title: 'Cauchy-Integral' },
            { latex: 'R_{\\mu\\nu}-\\tfrac{1}{2}g_{\\mu\\nu}R+\\Lambda g_{\\mu\\nu}=\\frac{8\\pi G}{c^4}T_{\\mu\\nu}',                          title: 'Einstein-Feldgleichungen' },
            { latex: '\\rho\\!\\left(\\frac{\\partial\\mathbf{v}}{\\partial t}+\\mathbf{v}\\!\\cdot\\!\\nabla\\mathbf{v}\\right)=-\\nabla p+\\mu\\nabla^2\\mathbf{v}+\\mathbf{f}', title: 'Navier–Stokes' }
        ];
        CyberUI.createCard('ui-container', 'KOMPLEX', `
            <div class="digit-grid">
                ${COMPLEX_FORMULAS.map((sym, i) => `
                    <label class="latex-label" title="${sym.title}">
                        <input type="radio" name="complex-formula" value="complex-${i}"
                            onclick="loadComplexPreset(${i})">
                        <span class="latex-render" data-latex="${sym.latex}"></span>
                    </label>
                `).join('')}
            </div>
        `, '#F4C430', { collapsible: true });

        // Render KaTeX to draw-canvas via html2canvas. Used by the KOMPLEX card
        // for equations that have no preset PNG. Output: green-on-darkblue, fit
        // to canvas with 60 px margin (same look as drawn / preset content).
        function loadKatexToCanvas(latex, title) {
            DebugWindow.log(`▶ Render Komplex: ${title}`);
            clearOverlay();
            const tmp = document.createElement('div');
            tmp.style.cssText = 'position:fixed;left:-10000px;top:0;padding:40px;background:#020410;color:#adff2f;font-size:60px;line-height:1.4;white-space:nowrap;';
            document.body.appendChild(tmp);
            try { katex.render(latex, tmp, { throwOnError: false, displayMode: true }); }
            catch (e) { tmp.textContent = latex; }
            // Give KaTeX a tick to lay out before html2canvas captures it.
            setTimeout(() => {
                html2canvas(tmp, { backgroundColor: '#020410', scale: 2, logging: false }).then(snap => {
                    drawCtx.fillStyle = '#020410';
                    drawCtx.fillRect(0, 0, 1000, 1000);
                    const MARGIN = 60;
                    const sc = Math.min((1000 - 2*MARGIN) / snap.width, (1000 - 2*MARGIN) / snap.height);
                    const nw = snap.width * sc, nh = snap.height * sc;
                    const ox = (1000 - nw) / 2, oy = (1000 - nh) / 2;
                    drawCtx.imageSmoothingEnabled = true;
                    drawCtx.imageSmoothingQuality = 'high';
                    drawCtx.drawImage(snap, ox, oy, nw, nh);
                    document.body.removeChild(tmp);
                    saveCanvasState();
                    DebugWindow.log(`✓ ${title} aufs Canvas (${Math.round(nw)}×${Math.round(nh)})`);
                }).catch(err => {
                    if (tmp.parentNode) document.body.removeChild(tmp);
                    DebugWindow.log(`✗ html2canvas-Fehler: ${err.message}`);
                });
            }, 50);
        }

        CyberUI.createCard('ui-container', 'FORMELN', `
            <div class="digit-grid formula-grid">
                ${FORMULAS.map((sym, i) => `
                    <label class="latex-label" title="${sym.title}">
                        <input type="radio" name="formula" value="formula-${i}" onclick="loadPreset(${i})">
                        <span class="latex-render" data-latex="${sym.latex}"></span>
                    </label>
                `).join('')}
            </div>
        `, '#F4C430', { collapsible: true });

        // Render KaTeX into the formula buttons after the card exists.
        function renderFormulaButtons() {
            if (typeof katex === 'undefined') return;
            document.querySelectorAll('.latex-render[data-latex]').forEach(el => {
                try { katex.render(el.dataset.latex, el, { throwOnError: false, displayMode: false }); }
                catch (e) { el.textContent = el.dataset.latex; }
            });
        }
        renderFormulaButtons();

        // ── Draw state ──────────────────────────────────────────────────────────
        const drawCanvas = document.getElementById('draw-canvas');
        const drawCtx = drawCanvas.getContext('2d');
        let isDrawing = false;

        // Bounding-box overlay was removed (Gemini boxes were unreliable).
        // Kept as a no-op so older callsites (replayLast etc.) stay valid.
        function clearOverlay() { /* no-op */ }

        // Persist the last Gemini response + the exact canvas state at send-time
        // so we can iterate on the drawing/scaling logic without burning new
        // API calls. The image lets REPLAY restore the same picture the model
        // analyzed; tokens/raw let us inspect coordinates after the fact.
        function saveLastDebug(latex, tokens, rawJson) {
            try {
                const canvasImg = drawCanvas.toDataURL('image/png');
                const payload = JSON.stringify({
                    ts: Date.now(),
                    latex,
                    tokens,
                    raw: rawJson,
                    canvasImg,
                    canvasW: drawCanvas.width,
                    canvasH: drawCanvas.height
                });
                localStorage.setItem('eocr-last-debug', payload);
                DebugWindow.log(`  💾 Antwort gespeichert (${(payload.length / 1024).toFixed(1)} KB) — REPLAY-Button verfügbar`);
            } catch (e) {
                DebugWindow.log(`  ⚠ save fehlgeschlagen: ${e.message}`);
            }
        }

        // Replay the last saved response: restore the canvas image, re-set the
        // result-latex/render, and re-draw boxes. Also dumps every token's raw
        // coords to DebugWindow so we can debug the scaling math directly.
        window.replayLast = function () {
            let raw;
            try { raw = localStorage.getItem('eocr-last-debug'); }
            catch (e) {
                DebugWindow.log(`✗ localStorage read failed: ${e.message}`);
                document.getElementById('result-latex').textContent = `✗ localStorage: ${e.message}`;
                return null;
            }
            if (!raw) {
                const msg = '⚠ keine gespeicherte Antwort — erst einmal ERKENNEN drücken';
                DebugWindow.log(msg);
                document.getElementById('result-latex').textContent = msg;
                return null;
            }
            let p;
            try { p = JSON.parse(raw); }
            catch (e) {
                DebugWindow.log(`✗ replay parse failed: ${e.message}`);
                document.getElementById('result-latex').textContent = `✗ replay parse: ${e.message}`;
                return null;
            }
            const age = Math.round((Date.now() - (p.ts || 0)) / 1000);
            const toks = Array.isArray(p.tokens) ? p.tokens : [];
            DebugWindow.log(`▶ REPLAY (alter: ${age}s) — latex="${(p.latex || '').slice(0, 60)}", tokens=${toks.length}`);
            // Dimensions: intrinsic (canvas attribute) vs. display (CSS).
            // If these have different aspect ratios, boxes will look squished.
            const rect = drawCanvas.getBoundingClientRect();
            DebugWindow.log(`  📏 canvas: intrinsic ${drawCanvas.width}×${drawCanvas.height}, display ${Math.round(rect.width)}×${Math.round(rect.height)} (ratio ${(rect.width / rect.height).toFixed(2)})`);
            // Token list (labels only, no boxes).
            toks.forEach((t, i) => {
                const lbl = typeof t === 'string' ? t : (t?.label ?? '');
                DebugWindow.log(`  [${i}] "${lbl}"`);
            });
            const finishDraw = () => {
                document.getElementById('result-latex').textContent = p.latex || '';
                if (p.latex && p.latex !== '(empty)' && p.latex !== '(leer)') renderLatex(p.latex);
            };
            if (p.canvasImg) {
                const img = new Image();
                img.onload = () => {
                    drawCtx.fillStyle = '#020410';
                    drawCtx.fillRect(0, 0, drawCanvas.width, drawCanvas.height);
                    drawCtx.drawImage(img, 0, 0, drawCanvas.width, drawCanvas.height);
                    finishDraw();
                };
                img.onerror = () => { DebugWindow.log('⚠ canvasImg konnte nicht geladen werden'); finishDraw(); };
                img.src = p.canvasImg;
            } else {
                finishDraw();
            }
            return p;
        };

        function initDraw() {
            drawCtx.fillStyle = '#020410'; // dark blue background — matches cyber theme
            drawCtx.fillRect(0, 0, 1000, 1000);
            drawCtx.strokeStyle = '#adff2f'; // neon green strokes
            const strokeEl = document.getElementById('stroke-slider');
            drawCtx.lineWidth = strokeEl ? +strokeEl.value : 8;
            drawCtx.lineCap = 'round';
            drawCtx.lineJoin = 'round';
        }

        function clearDraw() {
            initDraw();
            clearOverlay();
            try { localStorage.removeItem('eocr-canvas-png'); } catch (_) {}
            document.getElementById('result-latex').textContent = '';
            document.getElementById('result-render').innerHTML = '';
            // Reset stuck drawing state + ensure the canvas is interactive so
            // the user can keep drawing right after CLEAR.
            isDrawing = false;
            drawCanvas.classList.add('pen-on');
            try { localStorage.setItem('eocr-pen-on', '1'); } catch (_) {}
            const pen = document.getElementById('pen-toggle');
            if (pen) pen.classList.add('active');
        }

        // Shared PNG-loader: takes any bright-on-dark preset PNG and recolors
        // it to green-on-darkblue on the draw-canvas. Used by both the simple
        // FORMELN card (formula-N.png) and the KOMPLEX card (complex-N.png).
        function loadPNGPreset(path, title) {
            DebugWindow.log(`▶ Lade ${path} (${title})`);
            clearOverlay();
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
                const tmp = document.createElement('canvas');
                tmp.width = img.width; tmp.height = img.height;
                const tctx = tmp.getContext('2d');
                tctx.drawImage(img, 0, 0);
                const id = tctx.getImageData(0, 0, tmp.width, tmp.height);
                const d = id.data;
                for (let i = 0; i < d.length; i += 4) {
                    // Bright pixel (drawn stroke) → green, dark (bg) → dark blue.
                    const brightness = (d[i] + d[i+1] + d[i+2]) / 3;
                    if (brightness > 40) { d[i] = 173; d[i+1] = 255; d[i+2] = 47; }
                    else                 { d[i] = 2;   d[i+1] = 4;   d[i+2] = 16; }
                    d[i+3] = 255;
                }
                tctx.putImageData(id, 0, 0);
                drawCtx.fillStyle = '#020410';
                drawCtx.fillRect(0, 0, 1000, 1000);
                drawCtx.drawImage(tmp, 0, 0, 1000, 1000);
                saveCanvasState();
                DebugWindow.log(`✓ ${title} geladen (${img.width}×${img.height})`);
            };
            img.onerror = () => DebugWindow.log(`✗ ${path} konnte nicht geladen werden`);
            img.src = path;
        }

        function loadPreset(idx) {
            saveFormulaChoice('simple', idx);
            loadPNGPreset(`presets/formula-${idx}.png`, FORMULAS[idx]?.title ?? '?');
        }
        function loadComplexPreset(idx) {
            saveFormulaChoice('complex', idx);
            loadPNGPreset(`presets/complex-${idx}.png`, COMPLEX_FORMULAS[idx]?.title ?? '?');
        }

        // Persist which formula radio was last picked — kind ('simple'/'complex')
        // + index — so reload restores both the checked radio AND the canvas
        // content (via the same load path the click would trigger).
        function saveFormulaChoice(kind, idx) {
            try { localStorage.setItem('eocr-formula', JSON.stringify({ kind, idx })); }
            catch (_) {}
        }
        function restoreFormulaChoice() {
            // Only restore the radio's checked state. The canvas content is
            // handled separately by the canvas-state restore — calling
            // loadPreset here would overwrite any saved strokes on reload.
            let raw;
            try { raw = localStorage.getItem('eocr-formula'); } catch (_) { return; }
            if (!raw) return;
            let saved;
            try { saved = JSON.parse(raw); } catch (_) { return; }
            const kind = saved?.kind, idx = +saved?.idx;
            if (!Number.isFinite(idx)) return;
            const radioName = kind === 'complex' ? 'complex-formula' : 'formula';
            const value = `${kind === 'complex' ? 'complex' : 'formula'}-${idx}`;
            const radio = document.querySelector(`input[name="${radioName}"][value="${value}"]`);
            if (radio) radio.checked = true;
            DebugWindow.log(`↻ Formel-Radio wiederhergestellt: ${kind}-${idx}`);
        }

        function onStrokeChange(v) {
            document.getElementById('stroke-val').textContent = v;
            drawCtx.lineWidth = +v;
            try { localStorage.setItem('eocr-stroke', v); } catch (_) {}
        }

        // Downsample factor (10–100 %). Stays in localStorage. Default 50 %.
        // Slider affects ONLY what gets sent to Gemini — the canvas keeps
        // displaying the formula at full size for the user.
        function onCanvasScaleChange(v) {
            document.getElementById('canvas-scale-val').textContent = v;
            const px = Math.round(1000 * (+v / 100));
            const sizeEl = document.getElementById('canvas-scale-size');
            if (sizeEl) sizeEl.textContent = `${px}×${px}`;
            // Clear any stale inline transform from older code paths — the
            // visible canvas now stays at full size regardless of slider.
            const dc = document.getElementById('draw-canvas');
            if (dc) dc.style.transform = '';
            try { localStorage.setItem('eocr-canvas-scale', v); } catch (_) {}
        }

        function getPos(e) {
            const r = drawCanvas.getBoundingClientRect();
            const sx = drawCanvas.width / r.width;
            const sy = drawCanvas.height / r.height;
            const s = e.touches ? e.touches[0] : e;
            return { x: (s.clientX - r.left) * sx, y: (s.clientY - r.top) * sy };
        }

        drawCanvas.addEventListener('mousedown', e => {
            isDrawing = true;
            drawCtx.beginPath();
            const p = getPos(e); drawCtx.moveTo(p.x, p.y);
        });
        drawCanvas.addEventListener('mousemove', e => {
            if (!isDrawing) return;
            const p = getPos(e); drawCtx.lineTo(p.x, p.y); drawCtx.stroke();
        });
        drawCanvas.addEventListener('mouseup',    () => { if (isDrawing) { isDrawing = false; saveCanvasState(); } });
        drawCanvas.addEventListener('mouseleave', () => { if (isDrawing) { isDrawing = false; saveCanvasState(); } });
        drawCanvas.addEventListener('touchstart', e => {
            e.preventDefault(); isDrawing = true;
            drawCtx.beginPath();
            const p = getPos(e); drawCtx.moveTo(p.x, p.y);
        }, { passive: false });
        drawCanvas.addEventListener('touchmove', e => {
            e.preventDefault();
            if (!isDrawing) return;
            const p = getPos(e); drawCtx.lineTo(p.x, p.y); drawCtx.stroke();
        }, { passive: false });
        drawCanvas.addEventListener('touchend', () => { if (isDrawing) { isDrawing = false; saveCanvasState(); } });

        // Persist the current canvas pixels — called after every finished
        // stroke and after preset loads. ~100–400 KB PNG; fits in localStorage.
        function saveCanvasState() {
            try { localStorage.setItem('eocr-canvas-png', drawCanvas.toDataURL('image/png')); }
            catch (e) { DebugWindow.log(`⚠ Canvas-Save fehlgeschlagen: ${e.message}`); }
        }

        // ── Cost control ────────────────────────────────────────────────────────
        // USD per 1M tokens. Verify against ai.google.dev/pricing if rates change.
        const GEMINI_PRICING = {
            'gemini-2.5-flash':      { in: 0.30, out: 2.50  },
            'gemini-2.5-flash-lite': { in: 0.10, out: 0.40  },
            'gemini-2.5-pro':        { in: 1.25, out: 10.00 }
        };

        // Session counters (reset on reload). All-time counters in localStorage.
        let costSession = { calls: 0, inTok: 0, outTok: 0, usd: 0 };
        let costAllTime = { calls: 0, inTok: 0, outTok: 0, usd: 0 };
        let costLastUSD = 0;
        let costLastTok = 0;
        // Internal warning threshold — remind user every $1 spent to cross-check
        // against Google Cloud Console. Hardcoded, not user-configurable.
        const COST_REMIND_INTERVAL_USD = 1.00;
        let costLastReminderUSD = 0;
        try {
            const saved = localStorage.getItem('eocr-cost-alltime');
            if (saved) costAllTime = JSON.parse(saved);
            const lastRem = localStorage.getItem('eocr-cost-last-reminder');
            if (lastRem !== null) costLastReminderUSD = parseFloat(lastRem) || 0;
        } catch (_) {}
        try {
            const lim = localStorage.getItem('eocr-cost-limit');
            const limEl = document.getElementById('cost-limit');
            if (lim && limEl) limEl.value = lim;
        } catch (_) {}

        function fmtUSD(v) {
            // Always dollars. 2 NKS normally; 4 NKS below $0.01 so sub-cent
            // amounts stay readable instead of rounding to "$0.00".
            if (v < 0.01) return '$' + v.toFixed(4);
            return '$' + v.toFixed(2);
        }
        function fmtTok(n) {
            // < 1000: raw number. 1000–9999: e.g. 1.5K tok. ≥10000: integer K tok.
            if (n < 1000) return n + ' tok';
            const k = n / 1000;
            return (k >= 10 ? Math.round(k) : (Math.round(k * 10) / 10)) + 'K tok';
        }
        // Separator: em-space (U+2003) ×3 between price and token-count
        // so the eye gets a clear gap that CSS won't collapse.
        function fmtCount(c) {
            const SEP = '   ';
            return c.calls + ' call' + (c.calls === 1 ? '' : 's') + ', ' + fmtUSD(c.usd) + SEP + fmtTok(c.inTok + c.outTok);
        }

        function updateCostUI() {
            const SEP = '   ';
            document.getElementById('cost-last').textContent =
                costLastUSD > 0 ? `${fmtUSD(costLastUSD)}${SEP}${fmtTok(costLastTok)}` : '0';
            document.getElementById('cost-session').textContent =
                costSession.calls > 0 ? fmtCount(costSession) : '0';
            document.getElementById('cost-alltime').textContent =
                costAllTime.calls > 0 ? fmtCount(costAllTime) : '0';
            // Limit warning — red text when exceeded (input is commented out, defaults to no limit)
            const limitEl = document.getElementById('cost-limit');
            const limit = limitEl ? parseFloat(limitEl.value) : NaN;
            const el = document.getElementById('cost-alltime');
            if (isFinite(limit) && limit > 0 && costAllTime.usd >= limit) {
                el.style.color = '#C41E3A';
                el.style.fontWeight = 'bold';
            } else {
                el.style.color = '#F4C430';
                el.style.fontWeight = '';
            }
        }

        // Called after a successful Gemini response. usage = data.usageMetadata.
        function trackCost(model, usage) {
            if (!usage) {
                DebugWindow.log('  ⚠ keine usageMetadata in der Antwort');
                return;
            }
            const inTok  = +usage.promptTokenCount    || 0;
            const outTok = +usage.candidatesTokenCount || 0;
            const p = GEMINI_PRICING[model] || GEMINI_PRICING['gemini-2.5-flash'];
            const usd = (inTok * p.in + outTok * p.out) / 1_000_000;
            costLastUSD = usd;
            costLastTok = inTok + outTok;
            costSession.calls++;  costSession.inTok += inTok;  costSession.outTok += outTok;  costSession.usd += usd;
            costAllTime.calls++;  costAllTime.inTok += inTok;  costAllTime.outTok += outTok;  costAllTime.usd += usd;
            try { localStorage.setItem('eocr-cost-alltime', JSON.stringify(costAllTime)); } catch (_) {}
            DebugWindow.log(`  💰 ${inTok} in + ${outTok} out = ${fmtUSD(usd)} (all-time: ${fmtUSD(costAllTime.usd)})`);
            updateCostUI();
            maybeShowCostWarning();
            // Warn if all-time crosses the limit on THIS call
            const limitEl = document.getElementById('cost-limit');
            const limit = limitEl ? parseFloat(limitEl.value) : NaN;
            if (isFinite(limit) && limit > 0 && costAllTime.usd >= limit && (costAllTime.usd - usd) < limit) {
                DebugWindow.log(`⚠️ LIMIT $${limit.toFixed(2)} überschritten (all-time: ${fmtUSD(costAllTime.usd)})`);
            }
        }

        function resetCostCounter() {
            if (!confirm('All-time-Counter wirklich auf 0 setzen?')) return;
            costAllTime = { calls: 0, inTok: 0, outTok: 0, usd: 0 };
            costLastReminderUSD = 0;
            try { localStorage.removeItem('eocr-cost-alltime'); } catch (_) {}
            try { localStorage.removeItem('eocr-cost-last-reminder'); } catch (_) {}
            dismissCostWarning();
            DebugWindow.log('🔄 All-time-Counter reset');
            updateCostUI();
        }

        // Show the red warning banner when all-time crosses the next $1 mark.
        // costLastReminderUSD tracks the highest threshold already shown for —
        // ensures user gets reminded again at $2, $3, … without re-triggering
        // for the same dollar.
        function maybeShowCostWarning() {
            const nextThreshold = Math.floor(costAllTime.usd / COST_REMIND_INTERVAL_USD) * COST_REMIND_INTERVAL_USD;
            if (nextThreshold <= costLastReminderUSD || nextThreshold < COST_REMIND_INTERVAL_USD) return;
            const box = document.getElementById('cost-warning');
            const txt = document.getElementById('cost-warning-text');
            if (!box || !txt) return;
            txt.innerHTML = `Du hast jetzt <b style="color:#ff7088;">über $${nextThreshold.toFixed(2)}</b> verbraucht.<br><br>Bitte gegen <b>console.cloud.google.com → Billing</b> querverifizieren.`;
            box.style.display = 'flex';
            DebugWindow.log(`⚠️ COST WARNUNG: $${costAllTime.usd.toFixed(4)} überschritten Schwelle $${nextThreshold.toFixed(2)}`);
        }
        function dismissCostWarning() {
            const box = document.getElementById('cost-warning');
            if (box) box.style.display = 'none';
            // Lock the threshold so it doesn't pop again for this $1-bucket.
            costLastReminderUSD = Math.floor(costAllTime.usd / COST_REMIND_INTERVAL_USD) * COST_REMIND_INTERVAL_USD;
            try { localStorage.setItem('eocr-cost-last-reminder', String(costLastReminderUSD)); } catch (_) {}
        }

        function onCostLimitChange(v) {
            try { localStorage.setItem('eocr-cost-limit', v); } catch (_) {}
            updateCostUI();
        }

        // Show initial values + re-check warning state (in case we crossed
        // the threshold in a previous session and never acknowledged it).
        updateCostUI();
        maybeShowCostWarning();

        // ── Render helper (shared by recognize + debugRender) ───────────────────
        function renderLatex(latex) {
            const target = document.getElementById('result-render');
            target.innerHTML = '';
            try {
                katex.render(latex, target, { throwOnError: false, displayMode: true });
            } catch (e) {
                target.textContent = latex;
                DebugWindow.log(`⚠ katex.render threw: ${e.message}`);
            }
            fitLatexToContainer(target);
        }

        // Autoscale the KaTeX render to fit the container. If the natural
        // size overflows on either axis, shrink via CSS transform so the
        // glyph stays sharp (KaTeX is vector). Idempotent — resets any
        // previous transform on the inner .katex element first.
        function fitLatexToContainer(target) {
            const inner = target.querySelector('.katex, .katex-display');
            if (!inner) return;
            inner.style.transformOrigin = 'center center';
            inner.style.transform = '';
            // Force layout flush before measuring (otherwise we read stale
            // dimensions from the cleared transform above).
            const cw = target.clientWidth, ch = target.clientHeight;
            const nw = inner.scrollWidth || inner.offsetWidth;
            const nh = inner.scrollHeight || inner.offsetHeight;
            if (!cw || !ch || !nw || !nh) return;
            // 0.95 padding so the glyph doesn't touch the box edges.
            const sx = (cw * 0.95) / nw;
            const sy = (ch * 0.95) / nh;
            const s = Math.min(sx, sy, 1);
            if (s < 1) inner.style.transform = `scale(${s.toFixed(4)})`;
        }

        // ── Gemini OCR ──────────────────────────────────────────────────────────
        // Strip a single $...$, $$...$$, \(...\) or \[...\] wrapper if Gemini added one.
        function unwrapLatex(s) {
            s = s.trim();
            // Remove markdown code fences ```latex ... ``` if present
            const fence = s.match(/^```(?:latex|tex)?\s*([\s\S]*?)\s*```$/i);
            if (fence) s = fence[1].trim();
            if (s.startsWith('$$') && s.endsWith('$$')) return s.slice(2, -2).trim();
            if (s.startsWith('$')  && s.endsWith('$'))  return s.slice(1, -1).trim();
            if (s.startsWith('\\(') && s.endsWith('\\)')) return s.slice(2, -2).trim();
            if (s.startsWith('\\[') && s.endsWith('\\]')) return s.slice(2, -2).trim();
            return s;
        }

        async function recognize() {
            const apiKey = document.getElementById('g-api-key').value.trim();
            const model  = document.getElementById('g-model').value;
            if (!apiKey) {
                DebugWindow.log('⚠ API key fehlt');
                document.getElementById('result-latex').textContent = '⚠ API-Key fehlt';
                return;
            }
            try { localStorage.setItem('eocr-g-key', apiKey); } catch (_) {}
            try { localStorage.setItem('eocr-g-model', model); } catch (_) {}

            // Pipeline before sending: (a) optional downsample via slider,
            // (b) convert the cyber-themed canvas (green-on-darkblue) to
            // pure b/w so Gemini sees a clean high-contrast OCR image.
            const scalePct = +(document.getElementById('canvas-scale-slider')?.value ?? 100);
            const w = Math.round(drawCanvas.width  * scalePct / 100);
            const h = Math.round(drawCanvas.height * scalePct / 100);
            const tmp = document.createElement('canvas');
            tmp.width = w; tmp.height = h;
            const tctx = tmp.getContext('2d');
            tctx.imageSmoothingEnabled = true;
            tctx.imageSmoothingQuality = 'high';
            tctx.drawImage(drawCanvas, 0, 0, w, h);
            const id = tctx.getImageData(0, 0, w, h);
            const dpx = id.data;
            for (let i = 0; i < dpx.length; i += 4) {
                const brightness = (dpx[i] + dpx[i+1] + dpx[i+2]) / 3;
                // Bright (green stroke, incl. anti-aliased edges) → black.
                // Dark (dark-blue bg) → white.
                if (brightness > 60) { dpx[i] = dpx[i+1] = dpx[i+2] = 0;   }
                else                 { dpx[i] = dpx[i+1] = dpx[i+2] = 255; }
                dpx[i+3] = 255;
            }
            tctx.putImageData(id, 0, 0);
            const dataUrl = tmp.toDataURL('image/png');
            DebugWindow.log(`▾ ${drawCanvas.width}×${drawCanvas.height} → ${w}×${h} (${scalePct}%) + b/w`);
            // Gemini wants bare base64 in inline_data — strip the data-URL prefix.
            const b64 = dataUrl.split(',', 2)[1];

            DebugWindow.log(`▶ Gemini ${model} (key: …${apiKey.slice(-4)}, b64: ${b64.length} chars)`);
            console.log('Gemini recognize() start', { model, keyTail: apiKey.slice(-4), b64Len: b64.length });
            document.getElementById('result-latex').textContent = '⏳ Lade…';
            document.getElementById('result-render').innerHTML = '';
            clearOverlay();

            const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`;
            // Gemini bounding boxes were unreliable — drop them entirely.
            // We still ask for a per-glyph token list (labels only, no boxes)
            // for downstream character-level matching against a LaTeX target.
            const prompt =
                "This image shows a single printed or handwritten mathematical equation.\n" +
                "\n" +
                "Return strict JSON, no markdown, no commentary:\n" +
                "{\n" +
                "  \"latex\": \"<full equation as LaTeX, no $ or \\\\( delimiters>\",\n" +
                "  \"tokens\": [ \"<LaTeX of single glyph>\", ... ]\n" +
                "}\n" +
                "\n" +
                "RULES:\n" +
                "- tokens lists every visible glyph (character, digit, operator, bracket, accent), in reading order.\n" +
                "- No bounding boxes. Just the labels.\n" +
                "- If empty/unreadable: { \"latex\": \"(empty)\", \"tokens\": [] }";
            // Gemini REST API expects camelCase: inlineData, mimeType, generationConfig.
            // responseMimeType forces strict JSON output (no markdown wrappers).
            const body = {
                contents: [{
                    parts: [
                        { text: prompt },
                        { inlineData: { mimeType: 'image/png', data: b64 } }
                    ]
                }],
                generationConfig: { temperature: 0, responseMimeType: 'application/json' }
            };
            try {
                const t0 = performance.now();
                DebugWindow.log(`  → fetch POST ${model}:generateContent`);
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                DebugWindow.log(`  ← HTTP ${res.status} ${res.statusText} (${Math.round(performance.now() - t0)}ms)`);
                console.log('Gemini response', res.status, res.statusText);
                const text = await res.text();
                DebugWindow.log(`  body: ${text.slice(0, 240)}`);
                let data;
                try { data = JSON.parse(text); }
                catch (e) {
                    DebugWindow.log(`✗ JSON parse failed: ${e.message}`);
                    document.getElementById('result-latex').textContent = `Fehler: invalid JSON (${res.status})`;
                    return;
                }
                if (!res.ok) {
                    const msg = data?.error?.message || `HTTP ${res.status}`;
                    DebugWindow.log(`✗ Gemini-Fehler: ${msg}`);
                    document.getElementById('result-latex').textContent = `Fehler: ${msg}`;
                    return;
                }
                trackCost(model, data?.usageMetadata);
                const raw = data?.candidates?.[0]?.content?.parts?.[0]?.text ?? '';
                DebugWindow.log(`  raw: ${raw.slice(0, 200)}`);
                // With responseMimeType=application/json Gemini returns a JSON
                // string in the text field. Parse it for { latex, tokens }.
                // If parsing fails (e.g. model ignored the schema), fall back
                // to treating the whole text as raw LaTeX with no boxes.
                let latex = '(leer)';
                let tokens = [];
                try {
                    const parsed = JSON.parse(raw);
                    latex = typeof parsed?.latex === 'string' && parsed.latex.trim()
                        ? unwrapLatex(parsed.latex) : '(leer)';
                    tokens = Array.isArray(parsed?.tokens) ? parsed.tokens : [];
                    DebugWindow.log(`  parsed: latex="${latex.slice(0,80)}", tokens=${tokens.length}`);
                } catch (e) {
                    DebugWindow.log(`  ⚠ JSON-Schema-Parse fehlgeschlagen, fallback auf raw text`);
                    latex = unwrapLatex(raw || '(leer)');
                }
                document.getElementById('result-latex').textContent = latex;
                renderLatex(latex);
                saveLastDebug(latex, tokens, raw);
                DebugWindow.log(`✓ LaTeX: ${latex}`);
            } catch (err) {
                DebugWindow.log(`✗ Gemini-Fehler: ${err.message}`);
                console.error('Gemini fetch error', err);
                document.getElementById('result-latex').textContent = `Fehler: ${err.message}`;
            }
        }

        // Restore credentials: localStorage wins; fall back to window.GEMINI_API_KEY
        // from apikey.local.js (gitignored) so the key survives a localStorage wipe.
        try {
            const keyLS  = localStorage.getItem('eocr-g-key');
            const keyFile = (typeof window.GEMINI_API_KEY === 'string' && window.GEMINI_API_KEY.trim())
                ? window.GEMINI_API_KEY.trim() : '';
            const key   = keyLS || keyFile;
            // Validate restored model — if it points at a deprecated/removed
            // option (e.g. gemini-2.0-flash after the 2.0 sunset), discard it
            // and fall back to whatever the dropdown's first option is.
            const modelSaved = localStorage.getItem('eocr-g-model');
            const modelEl = document.getElementById('g-model');
            const validModels = Array.from(modelEl.options).map(o => o.value);
            const model = validModels.includes(modelSaved) ? modelSaved : null;
            if (key)   document.getElementById('g-api-key').value = key;
            if (model) modelEl.value = model;
            else if (modelSaved) {
                try { localStorage.removeItem('eocr-g-model'); } catch (_) {}
                DebugWindow.log(`⚠ Gespeichertes Modell "${modelSaved}" nicht mehr verfügbar — Default geladen`);
            }
            updateGeminiTitle();
            if (keyFile && !keyLS) DebugWindow.log('🔑 Key aus apikey.local.js geladen');
            const s = localStorage.getItem('eocr-stroke');
            if (s) { document.getElementById('stroke-slider').value = s; document.getElementById('stroke-val').textContent = s; }
            const sc = localStorage.getItem('eocr-canvas-scale');
            const scInit = sc !== null ? sc : '50';
            const slSc = document.getElementById('canvas-scale-slider');
            if (slSc) { slSc.value = scInit; onCanvasScaleChange(scInit); }
        } catch (_) {}

        // Persist card collapse state — same pattern as morph.html
        function makeCardsCollapsible() {
            document.querySelectorAll('.instrument-card.collapsible').forEach(card => {
                const titleEl = card.querySelector('.instrument-title');
                if (!titleEl) return;
                const cardKey = titleEl.textContent.trim().replace(/^▶\s*/, '');
                try {
                    const isCollapsed = localStorage.getItem('eocr-card-' + cardKey) === '1';
                    if (isCollapsed) card.classList.add('collapsed');
                    else card.classList.remove('collapsed');
                } catch (_) {}
                titleEl.addEventListener('click', () => {
                    try {
                        const isCollapsed = card.classList.contains('collapsed');
                        localStorage.setItem('eocr-card-' + cardKey, isCollapsed ? '1' : '0');
                    } catch (_) {}
                });
            });
        }
        makeCardsCollapsible();

        // Pen toggle — small SVG icon injected into the ZEICHNEN card title.
        // Click flips drawing on/off (via .pen-on class on #draw-canvas).
        // State is persisted in localStorage so the user's pick survives reload.
        function togglePen() {
            const on = drawCanvas.classList.toggle('pen-on');
            try { localStorage.setItem('eocr-pen-on', on ? '1' : '0'); } catch (_) {}
            const pen = document.querySelector('.pen-toggle');
            if (pen) pen.classList.toggle('active', on);
            DebugWindow.log(on ? '✏ Stift AN' : '✏ Stift AUS');
        }
        function setupPenToggle() {
            const cards = document.querySelectorAll('.instrument-card');
            let target = null;
            for (const c of cards) {
                const t = c.querySelector('.instrument-title');
                if (t && t.textContent.trim().toUpperCase().includes('ZEICHNEN')) {
                    target = t; break;
                }
            }
            if (!target || target.querySelector('.pen-toggle')) return;
            const pen = document.createElement('span');
            pen.className = 'pen-toggle';
            pen.title = 'Stift an/aus';
            pen.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>';
            pen.addEventListener('click', (e) => { e.stopPropagation(); togglePen(); });
            // Append at the right end of the title bar (after the text).
            target.appendChild(pen);
            // Reflect current state.
            if (drawCanvas.classList.contains('pen-on')) pen.classList.add('active');
        }
        // Restore last pen state, then mount the icon.
        try {
            if (localStorage.getItem('eocr-pen-on') === '1') drawCanvas.classList.add('pen-on');
        } catch (_) {}
        setupPenToggle();

        // Live mouse-coord readout above the ERKENNEN button.
        (function wireMouseCoord() {
            const coordEl = document.getElementById('mouse-coord');
            const stackEl = document.getElementById('canvas-stack');
            if (!coordEl || !stackEl) return;
            stackEl.addEventListener('mousemove', (e) => {
                const r = stackEl.getBoundingClientRect();
                const x = Math.round((e.clientX - r.left) * 1000 / r.width);
                const y = Math.round((e.clientY - r.top)  * 1000 / r.height);
                coordEl.textContent = `x: ${x}  y: ${y}`;
            });
            stackEl.addEventListener('mouseleave', () => {
                coordEl.textContent = 'x: —  y: —';
            });
        })();

        initDraw();
        restoreFormulaChoice();
        // If user has drawn / loaded a preset previously, restore the actual
        // canvas pixels — overlays whatever restoreFormulaChoice just drew so
        // strokes survive reload. Async, but it's the last thing to land.
        (function restoreCanvasState() {
            let dataUrl;
            try { dataUrl = localStorage.getItem('eocr-canvas-png'); } catch (_) { return; }
            if (!dataUrl) return;
            const img = new Image();
            img.onload = () => {
                drawCtx.fillStyle = '#020410';
                drawCtx.fillRect(0, 0, drawCanvas.width, drawCanvas.height);
                drawCtx.drawImage(img, 0, 0, drawCanvas.width, drawCanvas.height);
                DebugWindow.log(`↻ Canvas-Pixel wiederhergestellt`);
            };
            img.src = dataUrl;
        })();

        // Diagnostic: report left-chrome geometry (rail + sidebar) for the central
        // single-source-of-truth refactor. Logs natural sum vs. rendered width.
        function logChromeGeometry(tag) {
            const cs = getComputedStyle(document.documentElement);
            const railVar    = cs.getPropertyValue('--cyber-rail-w').trim();
            const sbVar      = cs.getPropertyValue('--cyber-sidebar-w').trim();
            const naturalVar = cs.getPropertyValue('--cyber-left-natural-w').trim();
            const scaleVar   = cs.getPropertyValue('--cyber-left-scale').trim();
            const rail       = document.getElementById('mini-rail');
            const panel      = document.getElementById('side-panel');
            const chrome     = document.getElementById('cyber-left-chrome');
            const railW      = rail   ? rail.getBoundingClientRect().width   : null;
            const panelW     = panel  ? panel.getBoundingClientRect().width  : null;
            const chromeW    = chrome ? chrome.getBoundingClientRect().width : null;
            const sumRailPanel = (railW != null && panelW != null) ? (railW + panelW) : null;

            DebugWindow.log(`▼ chrome (${tag}): vars rail=${railVar} sb=${sbVar} natural=${naturalVar} scale=${scaleVar}`);
            DebugWindow.log(`  measured: rail=${railW?.toFixed(2)} sb=${panelW?.toFixed(2)} sum=${sumRailPanel?.toFixed(2)} chrome=${chromeW?.toFixed(2)}`);
        }
        // Fire after layout settles (post auto-fit-scale calc).
        setTimeout(() => logChromeGeometry('init'), 50);
        setTimeout(() => logChromeGeometry('settled'), 400);
        window.addEventListener('resize', () => {
            clearTimeout(window.__chromeLogTimer);
            window.__chromeLogTimer = setTimeout(() => logChromeGeometry('resize'), 250);
        });
    </script>
</body>
