<!DOCTYPE html>
<!--
  VISION: see /TRAUM.md — handwriting captured here should morph almost
  imperceptibly into LaTeX. This file is one half of that pipeline;
  morph.html is the other.
-->
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOC ALVERS MATHE-LABORE | Equation OCR</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="../resources/favicon.png">
    <link rel="stylesheet" href="../js/cyber-layout.css">
    <link rel="stylesheet" href="../js/buttons-ultra.css">
    <link rel="stylesheet" href="../js/cyber-lab-overrides.css">
    <link rel="stylesheet" href="../js/branding.styles.extracted.css">
    <link rel="stylesheet" href="../js/lab-shell-minimal.css">

    <script src="../js/debug-window.js?v=20260517a"></script>
    <!-- API key: embedded.js (committed, deployed) sets window.GEMINI_API_KEY

    <script src="apikey.embedded.js"></script>

    <script src="plausibilcheck.js"></script>
    <script src="draw20-match.js"></script>
    <script src="gemini-ocr.js"></script>
    <script src="formulas.js"></script>

    <script>
function toggleSidebar() {
            const panel = document.getElementById('side-panel');
            panel.classList.toggle('collapsed');
            if (window.CyberLeftChrome?.publishResolvedScale) CyberLeftChrome.publishResolvedScale();
            setTimeout(() => window.dispatchEvent(new Event('resize')), 400);
        }

        CyberBranding.init({ useExternalStyles: true, title: CyberI18n.get('ui.coach_title'), subtitle: 'Equation OCR' });
        CyberUI.init();
        document.getElementById('coach-title-slot').textContent = 'Equation OCR';
        if (window.CyberLeftChrome?.configure) CyberLeftChrome.configure({ viewportOnlyZoom: true });

        CyberUI.createCard('ui-container', 'ZEICHNEN', `
            <div class="eps-row">
                <label>Stift</label>
                <input type="range" id="stroke-slider" min="1" max="30" value="8" step="1"
                    oninput="onStrokeChange(this.value)">
                <span id="stroke-val">8</span>
            </div>
            <div class="eps-row">
                <label>Scale</label>
                <input type="range" id="canvas-scale-slider" min="10" max="100" value="50" step="5"
                    oninput="onCanvasScaleChange(this.value)">
                <span id="canvas-scale-val">50</span><span style="opacity:0.6;">%</span>
            </div>
            <div style="font-family:'Orbitron',sans-serif;font-size:10px;color:rgba(0,210,255,0.6);text-align:right;margin-top:2px;">
                <span id="canvas-scale-size">—×—</span> px an Gemini
            </div>
        `, '#00d2ff', { collapsible: true });

        CyberUI.createCard('ui-container', 'GOOGLE GEMINI API', `
            <!-- API key input kept hidden — key is loaded from apikey.local.js
                 (obfuscated, gitignored). Restore-logic in initApi() still
                 reads/writes this field so localStorage round-trips work. -->
            <input type="password" id="g-api-key" class="api-input" placeholder="API key" autocomplete="off" style="display:none;">
            <select id="g-model" class="api-input" onchange="updateGeminiTitle()">
                <option value="gemini-2.5-flash">2.5-flash</option>
                <option value="gemini-2.5-flash-lite">2.5-flash-lite</option>
                <option value="gemini-2.5-pro">2.5-pro</option>
            </select>
            <div id="g-price-info" style="font-family:'Orbitron',sans-serif;font-size:10px;color:rgba(0,210,255,0.65);text-align:right;margin-top:4px;letter-spacing:0.04em;">
                — per Mio. Token
            </div>
            <label style="display:flex;align-items:center;gap:8px;margin-top:10px;font-family:'Orbitron',sans-serif;font-size:11px;color:#00d2ff;cursor:pointer;letter-spacing:0.05em;">
                <input type="checkbox" id="g-thinking" onchange="onThinkingChange()">
                <span>Thinking (default on)</span>
            </label>
            <label style="display:flex;align-items:center;gap:8px;margin-top:6px;font-family:'Orbitron',sans-serif;font-size:11px;color:#00d2ff;cursor:pointer;letter-spacing:0.05em;">
                <input type="checkbox" id="g-outline" onchange="onOutlineChange()" checked>
                <span>Outline (off → KaTeX HTML)</span>
            </label>
        `, '#00d2ff', { collapsible: true });

        // Reflect the selected model in the card title (replaces "API" with e.g. "2.5-FLASH").
        // Also updates the small price-info line below the dropdown — that's where
        // the per-1M-token rates live now that they're out of the option text.
        function updateGeminiTitle() {
            const sel = document.getElementById('g-model');
            if (!sel) return;
            const model = sel.value;
            // Persist the selection now — otherwise it would only land in
            // localStorage at the next ERKENNEN call (and get lost if the
            // user reloads before pressing it).
            try { localStorage.setItem('eocr-g-model', model); } catch (_) {}
            const suffix = model.replace(/^gemini-/, '').toUpperCase();
            const card = sel.closest('.instrument-card');
            const titleEl = card?.querySelector('.instrument-title');
            if (titleEl) {
                const icon = titleEl.querySelector('.toggle-icon');
                titleEl.innerHTML = '';
                if (icon) titleEl.appendChild(icon);
                titleEl.appendChild(document.createTextNode(' GOOGLE GEMINI ' + suffix));
            }
            const priceEl = document.getElementById('g-price-info');
            const price = (typeof GEMINI_PRICING !== 'undefined') ? GEMINI_PRICING[model] : null;
            if (priceEl && price) {
                priceEl.textContent = `$${price.in} in / $${price.out} out — per Mio. Token`;
            }
        }

        // Thinking toggle — persisted across sessions. Default ON (Gemini 2.5
        // default behaviour). When unchecked, we set thinkingBudget=0 in
        // generationConfig to skip the reasoning step and save output tokens.
        function onThinkingChange() {
            const el = document.getElementById('g-thinking');
            if (!el) return;
            try { localStorage.setItem('eocr-thinking', el.checked ? '1' : '0'); } catch (_) {}
            DebugWindow.log(`🧠 thinking: ${el.checked ? 'ON (default)' : 'OFF (budget=0)'}`);
        }
        // Outline toggle — when ON (default), the LaTeX is shown as colored
        // contour outlines on the canvas upper half. When OFF, the original
        // KaTeX HTML render is shown instead (the un-touched Gemini output).
        function onOutlineChange() {
            const el = document.getElementById('g-outline');
            if (!el) return;
            try { localStorage.setItem('eocr-outline', el.checked ? '1' : '0'); } catch (_) {}
            DebugWindow.log(`✏ outline: ${el.checked ? 'ON (contour render)' : 'OFF (KaTeX HTML)'}`);
            // Outline ON: contours on canvas, red KaTeX hidden.
            // Outline OFF: no contours, red KaTeX visible.
            const rr = document.getElementById('result-render');
            if (el.checked) {
                if (rr) rr.style.visibility = 'hidden';
                if (lastMatchResult) {
                    drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
                    renderHandwritingContoursOnCanvas();
                    renderLatexContoursOnCanvas();
                }
            } else {
                if (rr) rr.style.visibility = '';
                drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
                renderHandwritingContoursOnCanvas();
            }
        }

        CyberUI.createCard('ui-container', 'KOSTENKONTROLLE', `
            <div style="font-family:Arial,sans-serif;font-size:17px;line-height:1.9;color:#00d2ff;letter-spacing:0.02em;display:grid;grid-template-columns:auto 1fr auto auto;column-gap:14px;align-items:baseline;">
                <span>Last:</span>
                <span id="cost-last-calls" style="color:#adff2f;font-weight:700;text-align:right;white-space:nowrap;"></span>
                <span id="cost-last-usd"   style="color:#adff2f;font-weight:700;text-align:right;white-space:nowrap;">—</span>
                <span id="cost-last-tok"   style="color:#adff2f;font-weight:700;text-align:right;white-space:nowrap;">—</span>

                <span>Session:</span>
                <span id="cost-session-calls" style="color:#adff2f;font-weight:700;text-align:right;white-space:nowrap;">—</span>
                <span id="cost-session-usd"   style="color:#adff2f;font-weight:700;text-align:right;white-space:nowrap;">—</span>
                <span id="cost-session-tok"   style="color:#adff2f;font-weight:700;text-align:right;white-space:nowrap;">—</span>

                <span>Counter:</span>
                <span id="cost-alltime-calls" style="color:#F4C430;font-weight:700;text-align:right;white-space:nowrap;">—</span>
                <span id="cost-alltime-usd"   style="color:#F4C430;font-weight:700;text-align:right;white-space:nowrap;">—</span>
                <span id="cost-alltime-tok"   style="color:#F4C430;font-weight:700;text-align:right;white-space:nowrap;">—</span>
            </div>
            <!--
            <div class="eps-row" style="margin-top:14px;">
                <label style="font-size:13px;">Limit $</label>
                <input type="number" id="cost-limit" step="0.01" min="0" value="1.00"
                    style="flex:1;padding:6px 10px;background:rgba(0,210,255,0.08);border:1px solid rgba(0,210,255,0.3);color:#00d2ff;font-family:'Courier New',monospace;font-size:13px;border-radius:4px;outline:none;"
                    oninput="onCostLimitChange(this.value)">
            </div>
            -->

            <button class="cyber-btn" id="reset-cost-btn" onclick="resetCostCounter()" title="Counter zurücksetzen">RESET</button>
        `, '#F4C430', { collapsible: true });

        // Shared formula registry (formulas.js). Defensive fallback so the
        // rest of the script keeps building cards even if formulas.js failed.
        if (!window.MORPHEUS_FORMULAS) {
            DebugWindow.log('⚠ formulas.js nicht geladen — FORMELN/KOMPLEX bleiben leer');
        }
        const FORMULAS = window.MORPHEUS_FORMULAS || [];
        const COMPLEX_FORMULAS = window.MORPHEUS_COMPLEX_FORMULAS || [];
        CyberUI.createCard('ui-container', 'KOMPLEX', `
            <div class="digit-grid">
                ${COMPLEX_FORMULAS.map((sym, i) => `
                    <label class="latex-label" title="${sym.title}">
                        <input type="radio" name="complex-formula" value="complex-${i}"
                            onclick="loadComplexPreset(${i})">
                        <span class="latex-render" data-latex="${sym.latex}"></span>
                    </label>
                `).join('')}
            </div>
        `, '#F4C430', { collapsible: true });

        // Render KaTeX to draw-canvas via html2canvas. Used by the KOMPLEX card
        // for equations that have no preset PNG. Output: green-on-darkblue, fit
        // to canvas with 60 px margin (same look as drawn / preset content).
        function loadKatexToCanvas(latex, title) {
            DebugWindow.log(`▶ Render Komplex: ${title}`);
            clearOverlay();
            // Picking a new formula → the previous LaTeX result is stale; wipe it.
            setLatexResult('');
            const rr = document.getElementById('result-render');
            if (rr) rr.innerHTML = '';
            const tmp = document.createElement('div');
            tmp.style.cssText = 'position:fixed;left:-10000px;top:0;padding:40px;background:#020410;color:#adff2f;font-size:60px;line-height:1.4;white-space:nowrap;';
            document.body.appendChild(tmp);
            try { katex.render(latex, tmp, { throwOnError: false, displayMode: true }); }
            catch (e) { tmp.textContent = latex; }
            // Give KaTeX a tick to lay out before html2canvas captures it.
            setTimeout(() => {
                html2canvas(tmp, { backgroundColor: null, scale: 2, logging: false }).then(snap => {
                    const W = drawCanvas.width;
                    const H = drawCanvas.height;
                    const halfH = H / 2;
                    drawCtx.clearRect(0, 0, W, H);
                    // Base = aspect-fit into lower half, then 60% larger.
                    // Cap so it never overflows the viewport. Bottom-anchored in
                    // the lower half (minus a button gap); tall formulas grow
                    // upward into the upper half rather than below the buttons.
                    const MARGIN = 20;
                    const BUTTON_GAP = MARGIN;
                    const baseSc = Math.min((W - 2*MARGIN) / snap.width, (halfH - 2*MARGIN) / snap.height);
                    const maxSc  = Math.min((W - 2*MARGIN) / snap.width, (H - 2*MARGIN) / snap.height);
                    const sc = Math.min(baseSc * 1.6, maxSc);
                    const nw = snap.width * sc, nh = snap.height * sc;
                    const ox = (W - nw) / 2;
                    const oy = H - BUTTON_GAP - nh;
                    drawCtx.imageSmoothingEnabled = true;
                    drawCtx.imageSmoothingQuality = 'high';
                    drawCtx.drawImage(snap, ox, oy, nw, nh);
                    document.body.removeChild(tmp);
                    saveCanvasState();
                    DebugWindow.log(`✓ ${title} aufs Canvas (${Math.round(nw)}×${Math.round(nh)} @lower)`);
                }).catch(err => {
                    if (tmp.parentNode) document.body.removeChild(tmp);
                    DebugWindow.log(`✗ html2canvas-Fehler: ${err.message}`);
                });
            }, 50);
        }

        CyberUI.createCard('ui-container', 'FORMELN', `
            <div class="digit-grid formula-grid">
                ${FORMULAS.map((sym, i) => `
                    <label class="latex-label" title="${sym.title}">
                        <input type="radio" name="formula" value="formula-${i}" onclick="loadPreset(${i})">
                        <span class="latex-render" data-latex="${sym.latex}"></span>
                    </label>
                `).join('')}
            </div>
        `, '#F4C430', { collapsible: true });

        // Render KaTeX into the formula buttons after the card exists.
        function renderFormulaButtons() {
            if (typeof katex === 'undefined') return;
            document.querySelectorAll('.latex-render[data-latex]').forEach(el => {
                try { katex.render(el.dataset.latex, el, { throwOnError: false, displayMode: false }); }
                catch (e) { el.textContent = el.dataset.latex; }
            });
        }
        renderFormulaButtons();

        // ── Draw state ──────────────────────────────────────────────────────────
        const drawCanvas = document.getElementById('draw-canvas');
        const drawCtx = drawCanvas.getContext('2d');
        let isDrawing = false;

        // Set canvas internal resolution to match display size × DPR for crisp rendering.
        function resizeCanvas() {
            const w = drawCanvas.offsetWidth;
            const h = drawCanvas.offsetHeight;
            if (w < 1 || h < 1) return;
            const dpr = window.devicePixelRatio || 1;
            const iw = Math.round(w * dpr);
            const ih = Math.round(h * dpr);
            if (drawCanvas.width !== iw || drawCanvas.height !== ih) {
                drawCanvas.width = iw;
                drawCanvas.height = ih;
                DebugWindow.log(`▸ canvas resized to ${iw}×${ih} (display ${w}×${h}, DPR ${dpr})`);
            }
        }

        // Bounding-box overlay was removed (Gemini boxes were unreliable).
        // Kept as a no-op so older callsites (replayLast etc.) stay valid.
        function clearOverlay() { /* no-op */ }

        // The #result-latex DOM node is currently commented out. This helper
        // logs every status/error message to the DEBUG window instead and
        // safely no-ops the textContent write if the node is missing.
        function setLatexResult(text) {
            try { DebugWindow.log(`[latex] ${text}`); } catch (_) {}
            const el = document.getElementById('result-latex');
            if (el) el.textContent = text;
        }

        // Persist the last Gemini response + the exact canvas state at send-time
        // so we can iterate on the drawing/scaling logic without burning new
        // API calls. The image lets REPLAY restore the same picture the model
        // analyzed; tokens/raw let us inspect coordinates after the fact.
        function saveLastDebug(latex, tokens, rawJson) {
            try {
                const canvasImg = drawCanvas.toDataURL('image/png');
                const payload = JSON.stringify({
                    ts: Date.now(),
                    latex,
                    tokens,
                    raw: rawJson,
                    canvasImg,
                    canvasW: drawCanvas.width,
                    canvasH: drawCanvas.height
                });
                localStorage.setItem('eocr-last-debug', payload);
                DebugWindow.log(`  💾 Antwort gespeichert (${(payload.length / 1024).toFixed(1)} KB) — REPLAY-Button verfügbar`);
            } catch (e) {
                DebugWindow.log(`  ⚠ save fehlgeschlagen: ${e.message}`);
            }
        }

        // Replay the last saved response: restore the canvas image, re-set the
        // result-latex/render, and re-draw boxes. Also dumps every token's raw
        // coords to DebugWindow so we can debug the scaling math directly.
        window.replayLast = function () {
            let raw;
            try { raw = localStorage.getItem('eocr-last-debug'); }
            catch (e) {
                DebugWindow.log(`✗ localStorage read failed: ${e.message}`);
                setLatexResult(`✗ localStorage: ${e.message}`);
                return null;
            }
            if (!raw) {
                const msg = '⚠ keine gespeicherte Antwort — erst einmal ERKENNEN drücken';
                DebugWindow.log(msg);
                setLatexResult(msg);
                return null;
            }
            let p;
            try { p = JSON.parse(raw); }
            catch (e) {
                DebugWindow.log(`✗ replay parse failed: ${e.message}`);
                setLatexResult(`✗ replay parse: ${e.message}`);
                return null;
            }
            const age = Math.round((Date.now() - (p.ts || 0)) / 1000);
            const toks = Array.isArray(p.tokens) ? p.tokens : [];
            DebugWindow.log(`▶ REPLAY (alter: ${age}s) — latex="${(p.latex || '').slice(0, 60)}", tokens=${toks.length}`);
            // Dimensions: intrinsic (canvas attribute) vs. display (CSS).
            // If these have different aspect ratios, boxes will look squished.
            const rect = drawCanvas.getBoundingClientRect();
            DebugWindow.log(`  📏 canvas: intrinsic ${drawCanvas.width}×${drawCanvas.height}, display ${Math.round(rect.width)}×${Math.round(rect.height)} (ratio ${(rect.width / rect.height).toFixed(2)})`);
            // Token list (labels only, no boxes).
            toks.forEach((t, i) => {
                const lbl = typeof t === 'string' ? t : (t?.label ?? '');
                DebugWindow.log(`  [${i}] "${lbl}"`);
            });
            const finishDraw = () => {
                setLatexResult(p.latex || '');
                if (p.latex && p.latex !== '(empty)' && p.latex !== '(leer)') renderLatex(p.latex);
            };
            if (p.canvasImg) {
                const img = new Image();
                img.onload = () => {
                    drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
                    drawCtx.drawImage(img, 0, 0, drawCanvas.width, drawCanvas.height);
                    finishDraw();
                };
                img.onerror = () => { DebugWindow.log('⚠ canvasImg konnte nicht geladen werden'); finishDraw(); };
                img.src = p.canvasImg;
            } else {
                finishDraw();
            }
            return p;
        };

        function initDraw() {
            // Transparent canvas — main-content background shows through.
            drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            drawCtx.strokeStyle = '#adff2f'; // neon green strokes
            const strokeEl = document.getElementById('stroke-slider');
            drawCtx.lineWidth = strokeEl ? +strokeEl.value : 8;
            drawCtx.lineCap = 'round';
            drawCtx.lineJoin = 'round';
        }

        function clearDraw() {
        // Defer resize until after layout is computed.
        setTimeout(() => {
            resizeCanvas();
            initDraw();
            // Update scale display now that canvas has real dimensions.
            const scInit = +(document.getElementById('canvas-scale-slider')?.value ?? 50);
            onCanvasScaleChange(scInit);
        }, 100);
        // Observe container resize → keep canvas resolution in sync.
        const stackEl = document.getElementById('canvas-stack');

            clearOverlay();

            strokes.length = 0;
            objects.length = 0;
            curStroke = null;
            activeObjIdx = -1;

            handwritingOuters = [];

        // Shared PNG-loader: takes any bright-on-dark preset PNG and recolors
        // it to green-on-darkblue on the draw-canvas. Used by both the simple
        // FORMELN card (formula-N.png) and the KOMPLEX card (complex-N.png).
        function loadPNGPreset(path, title) {
            DebugWindow.log(`▶ Lade ${path} (${title})`);
            clearOverlay();
            // Picking a new formula → the previous LaTeX result is stale; wipe it.
            setLatexResult('');
            const rr = document.getElementById('result-render');
            if (rr) rr.innerHTML = '';
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
                const tmp = document.createElement('canvas');
                tmp.width = img.width; tmp.height = img.height;
                const tctx = tmp.getContext('2d');
                tctx.drawImage(img, 0, 0);
                const id = tctx.getImageData(0, 0, tmp.width, tmp.height);
                const d = id.data;
                for (let i = 0; i < d.length; i += 4) {
                    // Bright pixel (drawn stroke) → green, dark (bg) → dark blue.
                    const brightness = (d[i] + d[i+1] + d[i+2]) / 3;
                    if (brightness > 40) { d[i] = 173; d[i+1] = 255; d[i+2] = 47; }
                    else                 { d[i] = 2;   d[i+1] = 4;   d[i+2] = 16; }
                    d[i+3] = 255;
                }
                tctx.putImageData(id, 0, 0);
                drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
                // Base = aspect-fit into lower half, then 60% larger.
                // Bottom-anchored in the lower half (minus a button gap).
                const W = drawCanvas.width;
                const H = drawCanvas.height;
                const halfH = H / 2;
                const MARGIN = 20;
                const BUTTON_GAP = MARGIN;
                const baseSc = Math.min((W - 2*MARGIN) / img.width, (halfH - 2*MARGIN) / img.height);
                const maxSc  = Math.min((W - 2*MARGIN) / img.width, (H - 2*MARGIN) / img.height);
                const sc = Math.min(baseSc * 1.6, maxSc);
                const nw = img.width * sc, nh = img.height * sc;
                const ox = (W - nw) / 2;
                const oy = H - BUTTON_GAP - nh;
                drawCtx.imageSmoothingEnabled = true;
                drawCtx.imageSmoothingQuality = 'high';
                drawCtx.drawImage(tmp, ox, oy, nw, nh);
                saveCanvasState();
                DebugWindow.log(`✓ ${title} geladen (${img.width}×${img.height} → ${Math.round(nw)}×${Math.round(nh)} @lower)`);
            };
            img.onerror = () => DebugWindow.log(`✗ ${path} konnte nicht geladen werden`);
            img.src = path;
        }

        function loadPreset(idx) {

        function loadComplexPreset(idx) {
            saveFormulaChoice('complex', idx);
            loadPNGPreset(`presets/complex-${idx}.png`, COMPLEX_FORMULAS[idx]?.title ?? '?');
        }

        // Persist which formula radio was last picked — kind ('simple'/'complex')
        // + index — so reload restores both the checked radio AND the canvas
        // content (via the same load path the click would trigger).
        function saveFormulaChoice(kind, idx) {
            try { localStorage.setItem('eocr-formula', JSON.stringify({ kind, idx })); }
            catch (_) {}
        }
        function restoreFormulaChoice() {

            // handled separately by the canvas-state restore — calling
            // loadPreset here would overwrite any saved strokes on reload.
            let raw;
            try { raw = localStorage.getItem('eocr-formula'); } catch (_) { return; }
            if (!raw) return;

            try { saved = JSON.parse(raw); } catch (_) { return; }
            const kind = saved?.kind, idx = +saved?.idx;
            if (!Number.isFinite(idx)) return;
            const radioName = kind === 'complex' ? 'complex-formula' : 'formula';
            const value = `${kind === 'complex' ? 'complex' : 'formula'}-${idx}`;
            const radio = document.querySelector(`input[name="${radioName}"][value="${value}"]`);
            if (radio) radio.checked = true;
            DebugWindow.log(`↻ Formel-Radio wiederhergestellt: ${kind}-${idx}`);
        }

        function onStrokeChange(v) {

            try { localStorage.setItem('eocr-stroke', v); } catch (_) {}
        }

        // Slider affects ONLY what gets sent to Gemini — the canvas keeps
        // displaying the formula at full size for the user.
        function onCanvasScaleChange(v) {
            document.getElementById('canvas-scale-val').textContent = v;
            const px = Math.round(drawCanvas.width * (+v / 100));
            const sizeEl = document.getElementById('canvas-scale-size');
            if (sizeEl) sizeEl.textContent = `${px}×${px}`;
            // Clear any stale inline transform from older code paths — the
            // visible canvas now stays at full size regardless of slider.

            const sy = drawCanvas.height / r.height;
            const s = e.touches ? e.touches[0] : e;
            return { x: (s.clientX - r.left) * sx, y: (s.clientY - r.top) * sy };

        // ── Stroke + object buffer ─────────────────────────────────────────

        const strokes = [];          // [{ points: [{x,y}], width }]
        const objects = [];          // [{ strokeIdxs, bbox, outerIdx, matchId, status, label, matchedTokenIdx }]
        // Raw contours + outers from the latest regroup — passed to the
        // morph-style cross-pane matcher (draw20ComputeMatchIds).
        let handwritingContours = [];
        let handwritingOuters = [];
        let latexContours = [];
        let latexOuters = [];

        // renderLatexContoursOnCanvas() maps from these to the drawCanvas

        let latexSrcW = 0, latexSrcH = 0;

        // actually sits on the off-screen canvas (= same coord space
        // as the drawCanvas upper half). Used to draw a debug-rectangle so we
        // can sanity-check rendering against the original layout.
        let latexOriginalBBox = null;
        let curStroke = null;
        let activeObjIdx = -1;
        let objectIdleTimer = null;
        const OBJ_MARGIN_PX = 30;    // bbox expansion for "same object" test
        const OBJ_IDLE_MS = 500;     // pause after which active obj is closed

        function bboxOfStroke(s) {
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            for (const p of s.points) {
                if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
                if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
            }
            return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
        }
        function bboxUnion(a, b) {
            const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
            return { x, y, w: Math.max(a.x + a.w, b.x + b.w) - x, h: Math.max(a.y + a.h, b.y + b.h) - y };
        }
        function bboxOverlapsExpanded(a, b, margin) {
            return !(a.x + a.w + margin < b.x

                  || a.y + a.h + margin < b.y
                  || b.y + b.h + margin < a.y);

                bbox: bb,
                status: 'pending',
                label: '',
                matchedTokenIdx: -1,

        // 20-color RED-FREE palette used by morph). Same matchId → same color

        function objColor(i) { return draw20PaletteColor(i); }
        function objColorHex(i) { return draw20PaletteColor(i).replace(/^#/, '').toUpperCase(); }
        // Wrap each glyph in the LaTeX source with \textcolor[HTML]{HEX}{glyph},
        // using the color of the object that's been matched to that token. Walks
        // latex + tokens in parallel — works for simple inline math (E=mc^2,
        // single-letter operators); multi-char \cmd tokens are left uncolored
        // (they're structural anyway). Returns latex unchanged if no tokens.
        function colorizeLatex(latex, tokens) {
            if (!Array.isArray(tokens) || tokens.length === 0) return latex;
            // tokenIdx → objIdx via matchedTokenIdx.
            const tokToObj = new Array(tokens.length).fill(-1);
            for (let oi = 0; oi < objects.length; oi++) {
                const t = objects[oi].matchedTokenIdx;
                if (t >= 0 && t < tokens.length) tokToObj[t] = oi;
            }

            let ti = 0;
            let i = 0;
            // If the previous char was ^ or _ (and no explicit { followed),
            // the next wrapped glyph must be surrounded with {…} so KaTeX
            // takes the whole \textcolor expression as the sup/sub argument.
            let needsBraces = false;
            while (i < latex.length) {
                const ch = latex[i];
                if (ch === '\\') {
                    let j = i + 1;
                    while (j < latex.length && /[a-zA-Z]/.test(latex[j])) j++;
                    out += latex.substring(i, j);
                    i = j;
                    needsBraces = false;
                    continue;
                }
                if (ch === '^' || ch === '_') {
                    out += ch;
                    if (ti < tokens.length && tokens[ti] === ch) ti++;
                    needsBraces = true;
                    i++;
                    continue;
                }
                if (ch === '{' || ch === '}' || ch === ' ') {
                    out += ch;
                    if (ti < tokens.length && tokens[ti] === ch) ti++;

                    if (ch === '{') needsBraces = false;

                        wrap = `\\textcolor{#${objColorHex(oi)}}{${ch}}`;
                    } else {
                        wrap = ch;
                    }

                        out += '{' + wrap + '}';
                    } else {
                        out += wrap;
                    }
                    needsBraces = false;
                    ti++;
                } else {
                    out += ch;
                    needsBraces = false;
                }
                i++;

            return out;
        }

            for (let i = 0; i < objects.length; i++) {

        // Brightness-thresholded grid: any pixel that's brighter than the
        // dark-blue background counts as ink, regardless of stroke color.
        // The morph stack's draw20CanvasToGridRed only checks the red
        // channel — won't catch blue/cyan/green strokes.
        function eocrBuildGridFromCanvas() {
            const W = drawCanvas.width, H = drawCanvas.height;
            let data;
            try { data = drawCtx.getImageData(0, 0, W, H).data; }
            catch (e) { return null; }
            // Background is ~#020410 → r+g+b ≈ 22. Any palette colour scores
            // hundreds. Threshold 80 = generous "is ink" detection.
            const THRESHOLD = 80;
            const grid = new Uint8Array(W * H);
            for (let i = 0; i < W * H; i++) {
                const r = data[i*4], g = data[i*4+1], b = data[i*4+2];
                grid[i] = (r + g + b) > THRESHOLD ? 1 : 0;
            }
            return { grid, W, H };

            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            for (const [x, y] of poly) {
                if (x < minX) minX = x; if (x > maxX) maxX = x;
                if (y < minY) minY = y; if (y > maxY) maxY = y;
            }
            return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
        }
        // Replace `objects[]` with groupings derived from the rasterised canvas.
        // Connected-component contours from marching-squares = "one outer per
        // glyph". Each stroke is assigned to the outer whose polygon contains
        // the majority of its points. Strokes that don't fall inside any outer
        // (very thin lines, possibly missed) get their own singleton object.
        function regroupObjectsFromContours() {
            if (typeof getContoursWithHoles !== 'function'
                || typeof classifyContours !== 'function') {
                DebugWindow.log('⚠ contour deps missing — keeping bbox-grouping');
                return false;
            }
            const g = eocrBuildGridFromCanvas();
            if (!g) { DebugWindow.log('⚠ grid build failed'); return false; }
            const raw = getContoursWithHoles(g.grid, g.W, g.H);
            const { outers } = classifyContours(raw);
            if (outers.length === 0) {
                DebugWindow.log('⊘ no outers found in canvas');
                return false;
            }
            // Build polygon array + bbox per outer.
            const outerPolys = outers.map(o => raw[o.idx]);
            const outerBBs = outerPolys.map(bboxOfPolygon);
            // Cache raw contours + outers list for the morph-style cross-pane
            // matcher (`draw20ComputeMatchIds` runs after the full-pass).
            handwritingContours = raw;
            handwritingOuters = outers;
            // Assign each stroke to an outer polygon via robust bbox-test:
            //  (1) is stroke's bbox-center inside an outer's bbox?
            //  (2) else: which outer is closest by bbox-center distance?
            // Marching-squares polygons live at half-pixel edges; the strict
            // pointInPoly check from earlier produced false-negatives on
            // narrow ink, leaving strokes orphaned. Bbox is tolerant enough.
            const strokeToOuter = new Array(strokes.length).fill(-1);
            for (let si = 0; si < strokes.length; si++) {
                const st = strokes[si];
                if (!st || !st.points || st.points.length === 0) continue;
                const sBB = bboxOfStroke(st);
                const scx = sBB.x + sBB.w / 2;
                const scy = sBB.y + sBB.h / 2;
                // (1) bbox-containment of stroke-center.
                let best = -1;
                for (let oi = 0; oi < outerPolys.length; oi++) {
                    const bb = outerBBs[oi];
                    if (scx >= bb.x && scx <= bb.x + bb.w
                        && scy >= bb.y && scy <= bb.y + bb.h) { best = oi; break; }
                }
                // (2) nearest by center-distance.
                if (best < 0) {
                    let bestD = Infinity;
                    for (let oi = 0; oi < outerPolys.length; oi++) {
                        const bb = outerBBs[oi];
                        const dx = (bb.x + bb.w / 2) - scx;
                        const dy = (bb.y + bb.h / 2) - scy;
                        const d = Math.sqrt(dx * dx + dy * dy);
                        if (d < bestD) { bestD = d; best = oi; }
                    }
                }
                strokeToOuter[si] = best;
            }

            // the per-object OCR runs next. Preserve any existing label/match.
            //

            // morph-style cross-pane matcher can map an object back to its
            // contour in `handwritingContours`. matchId is filled later by
            // draw20ComputeMatchIds. -1 means orphan / not matched.
            const newObjects = outerPolys.map((poly, oi) => ({
                strokeIdxs: [],
                bbox: outerBBs[oi],
                outerIdx: oi,
                matchId: -1,
                status: 'closed',
                label: '',
                matchedTokenIdx: -1,

            const orphans = [];

                if (oi >= 0) newObjects[oi].strokeIdxs.push(si);
                else orphans.push(si);
            }
            for (const si of orphans) {

                    strokeIdxs: [si],
                    bbox: bboxOfStroke(strokes[si]),
                    outerIdx: -1,    // not in the contour list — pure stroke
                    matchId: -1,
                    status: 'closed',
                    label: '',
                    matchedTokenIdx: -1,
                });
            }

            // objects legitimately have strokeIdxs=[], but their bbox/pixels
            // are still valid OCR targets. Only drop if strokes existed AND
            // this outer caught none of them (= true noise).
            const final = (strokes.length === 0)
                ? newObjects
                : newObjects.filter(o => o.strokeIdxs.length > 0);
            objects.length = 0;
            for (const o of final) objects.push(o);

        // Result is stored on each object as `matchId`.
        async function renderLatexToOffscreenAndExtractContours(_latex) {
            return new Promise((resolve) => {
                const target = document.getElementById('result-render');
                if (!target) { resolve({ contours: [], outers: [], srcW: 0, srcH: 0 }); return; }

                // fitLatexToContainer + correct container-query font-size).

                const dpr = window.devicePixelRatio || 1;

                // dark-blue pixels far past the glyph and inflates contours by
                // ~10–15px on each side. Restore after html2canvas returns.
                const prevShadow = target.style.textShadow;

                    html2canvas(target, { backgroundColor: '#000', scale: dpr, logging: false }).then(snap => {

                        for (let i = 0; i < RW * RH; i++) {

                            grid[i] = (r + g + b) > 128 ? 1 : 0;
                        }

                            ? getContoursWithHoles(grid, RW, RH) : [];
                        const cls = (typeof classifyContours === 'function')
                            ? classifyContours(contours) : { outers: [], holes: [] };
                        const holesInOuters = cls.outers.reduce((s, o) => s + (o.holes || []).length, 0);
                        DebugWindow.log(`▷ latex-contours: ${contours.length} contours @${RW}×${RH}, ${cls.outers.length} outers, ${cls.holes.length} holes (${holesInOuters} attached)`);

        // the hole edges in the matched palette color.
        function renderHandwritingContoursOnCanvas() {

                .map(o => bboxOfPolygon(handwritingContours[o.idx]))
                .filter(Boolean);

                drawCtx.moveTo(poly[0][0], poly[0][1]);
                for (let p = 1; p < poly.length; p++) drawCtx.lineTo(poly[p][0], poly[p][1]);

        function bboxOfBoxes(boxes) {

                if (!bb) { bb = { x: b.x, y: b.y, w: b.w, h: b.h }; continue; }

        }
        // Render LaTeX contours onto the canvas EXACTLY where #result-render
        // is drawn — no upper-half assumption. We read result-render's rect
        // relative to drawCanvas's rect and scale to canvas internal pixels.
        function renderLatexContoursOnCanvas() {
            if (!lastMatchResult || latexContours.length === 0) return;
            if (!latexSrcW || !latexSrcH) return;
            const rr = document.getElementById('result-render');
            if (!rr) return;
            const rrR = rr.getBoundingClientRect();
            const cR  = drawCanvas.getBoundingClientRect();
            if (!cR.width || !cR.height) return;
            const pxPerCssX = drawCanvas.width  / cR.width;
            const pxPerCssY = drawCanvas.height / cR.height;
            const offX = (rrR.left - cR.left) * pxPerCssX;
            const offY = (rrR.top  - cR.top ) * pxPerCssY;
            const sx = (rrR.width  * pxPerCssX) / latexSrcW;
            const sy = (rrR.height * pxPerCssY) / latexSrcH;
            const tx = (p) => offX + p[0] * sx;
            const ty = (p) => offY + p[1] * sy;
            drawCtx.lineWidth = 3;
            drawCtx.lineJoin = 'round';
            drawCtx.lineCap = 'round';
            let holesDrawn = 0;
            for (let oi = 0; oi < latexOuters.length; oi++) {
                const outer = latexOuters[oi];
                const poly = latexContours[outer.idx];
                if (!poly || poly.length < 3) continue;
                const id = lastMatchResult.latId[outer.idx];
                const pair = lastMatchResult.idToPair.get(id);
                const isOrphan = !pair || pair.png < 0;
                const color = isOrphan ? '#FF0000' : draw20PaletteColor(id);
                drawCtx.strokeStyle = color;
                drawCtx.beginPath();
                drawCtx.moveTo(tx(poly[0]), ty(poly[0]));
                for (let p = 1; p < poly.length; p++) drawCtx.lineTo(tx(poly[p]), ty(poly[p]));
                drawCtx.closePath();
                for (const hi of (outer.holes || [])) {
                    const hole = latexContours[hi];
                    if (!hole || hole.length < 3) continue;
                    holesDrawn++;
                    drawCtx.moveTo(tx(hole[0]), ty(hole[0]));
                    for (let p = 1; p < hole.length; p++) drawCtx.lineTo(tx(hole[p]), ty(hole[p]));
                    drawCtx.closePath();
                }
                drawCtx.stroke();
            }
            DebugWindow.log(`✂ latex: ${latexOuters.length} outers, ${holesDrawn} hole(s) outlined`);
        }
        // Latest match result — referenced by renderStrokes / renderChips /
        // colorizeLatex to look up "is this object an orphan?" via idToPair.
        let lastMatchResult = null;
        // Build a synthetic match result from a positional 1:1 mapping —
        // same shape as draw20ComputeMatchIds output (pngId, latId, idToPair)
        // so the rest of the rendering code doesn't care about the source.
        function positionalMatchResult() {
            const sortFn = (a, b) => (a.cx - b.cx) || (a.cy - b.cy);
            const pngSorted = handwritingOuters.map((o, i) => {
                const bb = bboxOfPolygon(handwritingContours[o.idx]);
                return { i, idx: o.idx, holes: o.holes, cx: bb.x + bb.w / 2, cy: bb.y + bb.h / 2 };
            }).sort(sortFn);
            const latSorted = latexOuters.map((o, j) => {
                const bb = bboxOfPolygon(latexContours[o.idx]);
                return { j, idx: o.idx, holes: o.holes, cx: bb.x + bb.w / 2, cy: bb.y + bb.h / 2 };
            }).sort(sortFn);
            const N = Math.min(pngSorted.length, latSorted.length);
            const pngId = new Array(handwritingContours.length).fill(-1);
            const latId = new Array(latexContours.length).fill(-1);
            const idToPair = new Map();
            let nextId = 0;
            for (let k = 0; k < N; k++) {
                const id = nextId++;
                const p = pngSorted[k], l = latSorted[k];
                pngId[p.idx] = id;
                for (const hi of (p.holes || [])) pngId[hi] = id;
                latId[l.idx] = id;
                for (const hi of (l.holes || [])) latId[hi] = id;
                idToPair.set(id, { png: p.i, lat: l.j });
            }
            // Unmatched outers (when counts differ) → orphans with own id.
            for (let k = N; k < pngSorted.length; k++) {
                const id = nextId++;
                const p = pngSorted[k];
                pngId[p.idx] = id;
                for (const hi of (p.holes || [])) pngId[hi] = id;
                idToPair.set(id, { png: p.i, lat: -1 });
            }
            for (let k = N; k < latSorted.length; k++) {
                const id = nextId++;
                const l = latSorted[k];
                latId[l.idx] = id;
                for (const hi of (l.holes || [])) latId[hi] = id;
                idToPair.set(id, { png: -1, lat: l.j });
            }
            return { pngId, latId, idToPair };
        }
        // Apply matching. Strategy:
        //   1. If outer counts on both sides agree → POSITIONAL 1:1 in
        //      reading order. Almost always correct for simple inline math
        //      because both renders share the same glyph count.
        //   2. Else → SHAPE matching (draw20ComputeMatchIds) — pairs as many
        //      as plausible by geometry, leaves the rest as orphans.
        // Writes matchId + isOrphan on every object.
        function applyShapeMatching() {
            lastMatchResult = null;
            if (handwritingContours.length === 0 || latexContours.length === 0) {
                DebugWindow.log('⚠ matching skipped — no contours on one side');
                return null;
            }
            let result;
            if (handwritingOuters.length === latexOuters.length
                && handwritingOuters.length > 0) {
                result = positionalMatchResult();
                DebugWindow.log(`📎 positional 1:1 match (${handwritingOuters.length} outers each side)`);
            } else if (typeof draw20ComputeMatchIds === 'function'
                && typeof PlausibilCheck !== 'undefined') {
                result = draw20ComputeMatchIds(handwritingContours, latexContours,
                    { matchingEnabled: true, dbg: (m) => DebugWindow.log(`  shape: ${m}`) });
                DebugWindow.log(`📎 shape-match (${handwritingOuters.length} png / ${latexOuters.length} lat)`);
            } else {
                DebugWindow.log('⚠ shape-matching deps missing (draw20-match / plausibilcheck)');
                return null;
            }
            lastMatchResult = result;
            for (const obj of objects) {
                obj.matchId = -1;
                obj.isOrphan = false;
                if (obj.outerIdx < 0) continue;
                const o = handwritingOuters[obj.outerIdx];
                if (!o) continue;
                const id = result.pngId[o.idx];
                if (typeof id === 'number' && id >= 0) {
                    obj.matchId = id;
                    const pair = result.idToPair.get(id);
                    obj.isOrphan = !pair || pair.lat < 0;
                }
            }
            let paired = 0, orphan = 0;
            for (const obj of objects) {
                if (obj.matchId < 0 || obj.isOrphan) orphan++; else paired++;
            }
            DebugWindow.log(`  → ${paired}/${objects.length} paired, ${orphan} orphan(s)`);
            return result;
        }
        // Color for an object — palette by matchId when paired, orphan red
        // when matched-but-no-LaTeX-counterpart, fallback green when match
        // hasn't run yet (e.g. live drawing before ERKENNEN).
        function colorForObject(obj) {
            if (obj && obj.isOrphan) return '#FF0000';
            if (obj && typeof obj.matchId === 'number' && obj.matchId >= 0) {
                return draw20PaletteColor(obj.matchId);
            }
            return null; // caller falls back to objColor(index) for unmatched
        }
        // After shape-matching, attach a label to each object by walking
        // the matched LaTeX outers in reading-order and pairing them with
        // the full-pass `tokens[]`. For each object → its matched LaTeX
        // outer → the token at that outer's reading rank.
        function assignLabelsFromTokens(tokens) {
            for (const obj of objects) obj.label = '';
            if (!Array.isArray(tokens) || tokens.length === 0) return;
            if (!lastMatchResult || latexOuters.length === 0) return;
            // Sort LaTeX outers by reading order (x with y tiebreak).
            const sorted = latexOuters
                .map((o, j) => {
                    const poly = latexContours[o.idx];
                    const bb = bboxOfPolygon(poly);
                    return { j, cx: bb.x + bb.w / 2, cy: bb.y + bb.h / 2 };
                })
                .sort((a, b) => (a.cx - b.cx) || (a.cy - b.cy));
            // Map LaTeX-outer-index (j in latexOuters) → token from tokens[rank].
            const tokenForLatOuter = new Map();
            sorted.forEach((x, rank) => {
                if (rank < tokens.length) tokenForLatOuter.set(x.j, tokens[rank]);
            });
            // For each handwriting object: its matchId → pair.lat → token.
            for (const obj of objects) {
                if (typeof obj.matchId !== 'number' || obj.matchId < 0) continue;
                const pair = lastMatchResult.idToPair.get(obj.matchId);
                if (!pair || pair.lat < 0) continue;
                const tok = tokenForLatOuter.get(pair.lat);
                if (tok != null) {
                    obj.label = String(tok);
                    obj.status = 'recognized';
                }
            }
            DebugWindow.log(`📝 labels assigned via shape-match + token reading-order`);
        }
        // Detect "stacked horizontal bars" signature — two outers that are
        // each MUCH wider than tall, vertically stacked with overlapping
        // x-range. Matches '=', '±' bars, '÷' dashes. ALWAYS merged before
        // the generic count-based merge runs, because count-merge sometimes
        // picks the wrong pair when multiple have gap≈0.
        function isStackedBars(a, b) {
            // Both are horizontal bars (w / h > 1.5).
            if (!(a.w > a.h * 1.5)) return false;
            if (!(b.w > b.h * 1.5)) return false;
            // Their x-ranges overlap by at least 50% of the smaller width.
            const xOverlap = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
            const minW = Math.min(a.w, b.w);
            if (xOverlap < minW * 0.5) return false;
            // They DON'T overlap in y (one above the other), and the y-gap
            // is small relative to the bar's height (within ~4x the height).
            const yGap = Math.max(0, Math.max(a.y - (b.y + b.h), b.y - (a.y + a.h)));
            if (yGap <= 0) return false;
            const minH = Math.min(a.h, b.h);
            if (yGap > minH * 4) return false;
            return true;
        }
        function mergeStackedBars() {
            let changed = true;
            let merges = 0;
            while (changed) {
                changed = false;
                for (let i = 0; i < objects.length && !changed; i++) {
                    for (let j = i + 1; j < objects.length; j++) {
                        if (!isStackedBars(objects[i].bbox, objects[j].bbox)) continue;
                        const a = objects[i], b = objects[j];
                        a.strokeIdxs = Array.from(new Set([...a.strokeIdxs, ...b.strokeIdxs]));
                        a.bbox = bboxUnion(a.bbox, b.bbox);
                        DebugWindow.log(`  ↣ stacked-bar merge obj#${j} → obj#${i} (gap-y small, x-overlap high)`);
                        objects.splice(j, 1);
                        merges++;
                        changed = true;
                        break;
                    }
                }
            }
            if (merges > 0) DebugWindow.log(`▷ stacked-bar pass: ${merges} merge(s)`);
        }
        // Minimum edge-distance between two bboxes: 0 if they overlap or
        // touch, else the euclidean gap to the closest edge. Better than
        // center-distance for merging fragmented glyphs because the dot of
        // an 'i' or the bar of a '+' has its bbox right next to the rest.
        function bboxGap(a, b) {
            const dx = Math.max(0, Math.max(a.x - (b.x + b.w), b.x - (a.x + a.w)));
            const dy = Math.max(0, Math.max(a.y - (b.y + b.h), b.y - (a.y + a.h)));
            return Math.sqrt(dx * dx + dy * dy);
        }
        // Greedy merge of the closest (by edge-gap) bbox-pair, repeated
        // until objects.length === target. Reconciles contour-count
        // (which fragments multi-stroke glyphs like '+', '=', '5' with
        // disconnected dash) with the full-pass token-count. Ties on gap=0
        // are broken by the smaller center-distance.
        function mergeObjectsToMatchTokens(target) {
            if (!target || objects.length <= target) return;
            const startCount = objects.length;
            while (objects.length > target) {
                let bestI = -1, bestJ = -1, bestGap = Infinity, bestCD = Infinity;
                for (let i = 0; i < objects.length; i++) {
                    const a = objects[i];
                    const ax = a.bbox.x + a.bbox.w / 2;
                    const ay = a.bbox.y + a.bbox.h / 2;
                    for (let j = i + 1; j < objects.length; j++) {
                        const b = objects[j];
                        const gap = bboxGap(a.bbox, b.bbox);
                        if (gap > bestGap) continue;
                        const bx = b.bbox.x + b.bbox.w / 2;
                        const by = b.bbox.y + b.bbox.h / 2;
                        const dx = ax - bx, dy = ay - by;
                        const cd = Math.sqrt(dx * dx + dy * dy);
                        if (gap < bestGap || (gap === bestGap && cd < bestCD)) {
                            bestGap = gap; bestCD = cd; bestI = i; bestJ = j;
                        }
                    }
                }
                if (bestI < 0) break;
                const a = objects[bestI], b = objects[bestJ];
                a.strokeIdxs = Array.from(new Set([...a.strokeIdxs, ...b.strokeIdxs]));
                a.bbox = bboxUnion(a.bbox, b.bbox);
                DebugWindow.log(`  ↣ merge obj#${bestJ} → obj#${bestI} (gap=${bestGap.toFixed(1)}, cd=${bestCD.toFixed(1)})`);
                objects.splice(bestJ, 1);
            }
            DebugWindow.log(`▷ merge done: ${startCount} → ${objects.length} objects (target ${target})`);
        }
        // Wipe canvas + repaint every stroke in its object's color. Called
        // after each stroke-end (color "snaps" once you lift the pen).
        // Skip entirely when no strokes exist — would otherwise erase any
        // preset PNG that was loaded into the canvas pixels.
        function renderStrokes() {
            if (strokes.length === 0) return;
            drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            drawCtx.lineCap = 'round';
            drawCtx.lineJoin = 'round';
            for (let s = 0; s < strokes.length; s++) {
                const st = strokes[s];
                if (!st || !st.points || st.points.length < 1) continue;
                const objIdx = objectOfStroke(s);
                // Color priority: matchId (after shape-matching) > objColor
                // (live-drawing index) > fallback green for orphan strokes.
                let col = '#adff2f';
                if (objIdx >= 0) {
                    const matched = colorForObject(objects[objIdx]);
                    col = matched != null ? matched : objColor(objIdx);
                }
                drawCtx.strokeStyle = col;
                drawCtx.lineWidth = st.width || drawCtx.lineWidth;
                drawCtx.beginPath();
                drawCtx.moveTo(st.points[0].x, st.points[0].y);
                for (let p = 1; p < st.points.length; p++) {
                    drawCtx.lineTo(st.points[p].x, st.points[p].y);
                }
                if (st.points.length === 1) {
                    drawCtx.lineTo(st.points[0].x + 0.01, st.points[0].y + 0.01);
                }
                drawCtx.stroke();
            }
        }

        // run OCR. Per-object recognition is now deferred until ERKENNEN, so
        // we can pass the full-formula LaTeX as context to flash-lite.
        function closeActiveObject() {
            if (activeObjIdx < 0) return;
            const obj = objects[activeObjIdx];
            if (obj && obj.status === 'pending') obj.status = 'closed';
            activeObjIdx = -1;
        }
        function onStrokeFinished(strokeIdx) {
            const stroke = strokes[strokeIdx];
            if (!stroke || stroke.points.length < 1) return;
            const sBB = bboxOfStroke(stroke);
            if (activeObjIdx >= 0 && objects[activeObjIdx].status === 'pending') {
                const obj = objects[activeObjIdx];
                if (bboxOverlapsExpanded(obj.bbox, sBB, OBJ_MARGIN_PX)) {
                    obj.strokeIdxs.push(strokeIdx);
                    obj.bbox = bboxUnion(obj.bbox, sBB);
                } else {
                    closeActiveObject();
                    pushNewObject(strokeIdx, sBB);
                }
            } else {
                pushNewObject(strokeIdx, sBB);
            }
            if (objectIdleTimer) clearTimeout(objectIdleTimer);
            const idleIdx = activeObjIdx;
            objectIdleTimer = setTimeout(() => {
                if (idleIdx === activeObjIdx) closeActiveObject();
            }, OBJ_IDLE_MS);
        }

        // ── Per-object Gemini recognition ──────────────────────────────────

        //         obj.status = 'recognized';

        // Chips are arranged in a SINGLE HORIZONTAL ROW, evenly distributed

        // window.addEventListener('resize', renderChips);

        // After the final-pass returns its token list (strings, reading-order),
        // assign each pixel-object the index of its matching token. Walks both
        // arrays in order and picks the first un-consumed token whose label
        // equals the object's label. Unmatched objects get matchedTokenIdx=-1.
        function applyObjectTokenMapping(tokens) {
            if (!Array.isArray(tokens)) tokens = [];
            const used = new Array(tokens.length).fill(false);
            const norm = (s) => (s || '').toString().trim().replace(/^\\\\/, '\\\\').toLowerCase();
            // Walk objects in WRITING order (left-to-right by bbox.x, ties by
            // bbox.y top-to-bottom), not stroke-order — user may add glyphs
            // out-of-sequence (e.g. superscript ² over c after writing E=mc).
            const ordered = objects
                .map((o, i) => ({ o, i }))
                .sort((a, b) => (a.o.bbox.x - b.o.bbox.x) || (a.o.bbox.y - b.o.bbox.y));
            for (const { o: obj } of ordered) {
                obj.matchedTokenIdx = -1;
                if (obj.status !== 'recognized') continue;
                const wanted = norm(obj.label);
                for (let k = 0; k < tokens.length; k++) {
                    if (used[k]) continue;
                    if (norm(tokens[k]) === wanted) {
                        obj.matchedTokenIdx = k;
                        used[k] = true;
                        break;
                    }
                }
            }
            const mapped  = objects.filter(o => o.matchedTokenIdx >= 0).length;
            const unmapped = objects.length - mapped;
            DebugWindow.log(`📎 obj↔token: ${mapped}/${objects.length} matched (${unmapped} unmapped, ${tokens.length} tokens total)`);
            ordered.forEach(({ o, i }, rank) => {
                const t = o.matchedTokenIdx;
                const tokStr = (t >= 0 && tokens[t] != null) ? `"${tokens[t]}"` : '—';
                DebugWindow.log(`  rank#${rank} obj#${i} (x=${Math.round(o.bbox.x)}) "${o.label}" ↔ token#${t} ${tokStr}`);
