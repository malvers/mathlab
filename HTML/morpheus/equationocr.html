<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOC ALVERS MATHE-LABORE | Equation OCR</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;600&display=swap"

    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <!-- Local API keys (gitignored). Missing file is fine — onerror swallows the 404. -->
    <script src="apikey.local.js" onerror="this.remove()"></script>

    <style>
        #draw-canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #000;
            cursor: crosshair;
            border-radius: 10px;
            border: 2px solid rgba(0, 210, 255, 0.5);
            box-shadow: 0 0 24px rgba(0, 210, 255, 0.12);
            touch-action: none;
        }
        #canvas-stack {
            position: relative;
            width: 80%;
            max-width: 80vh;
            flex: 1 1 auto;
            min-height: 0;
            aspect-ratio: 1 / 1;
            line-height: 0;
        }
        /* Floating ERKENNEN button — bottom-center overlay on the canvas.
           Canvas is WHITE in this lab (for OCR contrast), so the button needs
           a solid dark background to stay readable — unlike morph where the
           canvas is dark and the default faint bg works fine. */
        #canvas-recognize-btn {
            position: absolute;
            left: 50%;
            bottom: 16px;
            transform: translateX(-50%);
            width: auto !important;
            min-width: 260px;
            border: 2px solid #adff2f !important;
            color: #adff2f !important;
            background: rgba(8, 20, 42, 0.92) !important;
            box-shadow: 0 0 20px rgba(173, 255, 47, 0.35) !important;
            z-index: 30;
        }
        /* Hover: button stays visually identical — only the glow intensifies. */
        #canvas-recognize-btn:hover {
            background: rgba(8, 20, 42, 0.92) !important;
            border: 2px solid #adff2f !important;
            color: #adff2f !important;
            box-shadow: 0 0 40px rgba(173, 255, 47, 0.75) !important;
            transform: translateX(-50%) !important;
        }
        #canvas-recognize-btn:active {
            transform: translateX(-50%) scale(0.98) !important;
        }
        #draw-wrap {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 14px;
            padding: 80px 20px 20px;
            box-sizing: border-box;
        }
        #result-box {
            position: relative;
            width: 80%;
            max-width: 80vh;
            flex-shrink: 0;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(0, 210, 255, 0.5);
            border-radius: 8px;
            color: #00d2ff;
            font-family: 'Outfit', sans-serif;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
            overflow: hidden;
        }
        #result-box .pane {
            padding: 18px 22px;
        }
        #result-box .pane + .pane {
            border-top: 1px solid rgba(0, 210, 255, 0.3);
        }
        #result-box .label {
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            letter-spacing: 0.1em;
            color: rgba(0, 210, 255, 0.6);
            margin-bottom: 8px;
        }
        #result-latex {
            font-family: 'Courier New', monospace;
            font-size: 20px;
            color: #adff2f;
            word-break: break-all;
            line-height: 1.4;
        }
        #result-render {
            font-size: 32px;
            color: #F4C430;
            height: 96px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
        }
        /* KaTeX inherits page font-family otherwise — force its own glyphs */
        #result-render .katex,
        #result-render .katex-display {
            color: #F4C430;
        }
        .api-input {
            width: 100%;
            margin-top: 6px;
            padding: 6px 10px;
            background: rgba(0, 210, 255, 0.08);
            border: 1px solid rgba(0, 210, 255, 0.3);
            color: #00d2ff;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            border-radius: 4px;
            outline: none;
            box-sizing: border-box;
        }
        .api-input:focus {
            border-color: #00d2ff;
        }
        #draw-hint {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 0.04em;
            text-align: center;
        }
        .eps-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }
        .eps-row label {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            color: rgba(0, 210, 255, 0.7);
        }
        .eps-row input[type=range] {
            flex: 1;
            accent-color: #00d2ff;
        }
        .eps-row span {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            color: #00d2ff;
            width: 28px;
            text-align: right;
        }
        /* Page-local cyber-btn override — only inside equationocr.html.
           buttons-ultra.css enforces min-height 58px globally; we make them
           flatter here without touching the central rule (morph etc. stay 58px). */
        .cyber-btn {
            min-height: 42px !important;
            padding: 10px 18px !important;
        }

        /* Formula grid — copied from morph.css (digit-grid + formula-grid) */
        .digit-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 6px;
        }
        .digit-grid input[type=radio] { display: none; }
        .digit-grid label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 16px;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.55);
            background: rgba(0, 210, 255, 0.04);
            border: 1px solid rgba(0, 210, 255, 0.25);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
        }
        .digit-grid label:hover {
            color: #00d2ff;
            border-color: rgba(0, 210, 255, 0.6);
            background: rgba(0, 210, 255, 0.1);
        }
        .digit-grid label:has(input:checked) {
            color: #adff2f;
            border-color: #adff2f;
            background: rgba(173, 255, 47, 0.12);
            box-shadow: 0 0 12px rgba(173, 255, 47, 0.3);
        }
        .digit-grid .latex-render .katex {
            color: inherit;
            line-height: 1;
        }
    </style>
</head>

<body>

                    <button class="cyber-btn" id="canvas-recognize-btn" onclick="recognize()">► ERKENNEN</button>

    <script src="../js/i18n-pt.js"></script>

    <script>
        function toggleSidebar() {
            const panel = document.getElementById('side-panel');
            panel.classList.toggle('collapsed');
            if (window.CyberLeftChrome?.publishResolvedScale) CyberLeftChrome.publishResolvedScale();
            setTimeout(() => window.dispatchEvent(new Event('resize')), 400);
        }

        CyberBranding.init({ useExternalStyles: true, title: CyberI18n.get('ui.coach_title'), subtitle: 'Equation OCR' });
        CyberUI.init();
        document.getElementById('coach-title-slot').textContent = 'Equation OCR';
        if (window.CyberLeftChrome?.configure) CyberLeftChrome.configure({ viewportOnlyZoom: true });

        CyberUI.createCard('ui-container', 'ZEICHNEN', `
            <button class="cyber-btn" onclick="clearDraw()"
                style="width:100%;border-color:rgba(0,210,255,0.35);">LÖSCHEN</button>
            <div class="eps-row">
                <label>Stift</label>
                <input type="range" id="stroke-slider" min="1" max="30" value="8" step="1"
                    oninput="onStrokeChange(this.value)">
                <span id="stroke-val">8</span>
            </div>
            <div class="eps-row">
                <label>Scale</label>
                <input type="range" id="canvas-scale-slider" min="10" max="100" value="50" step="5"
                    oninput="onCanvasScaleChange(this.value)">
                <span id="canvas-scale-val">50</span><span style="opacity:0.6;">%</span>
            </div>
            <div style="font-family:'Orbitron',sans-serif;font-size:10px;color:rgba(0,210,255,0.6);text-align:right;margin-top:2px;">
                <span id="canvas-scale-size">500×500</span> px an Gemini
            </div>
        `, '#00d2ff', { collapsible: true });

        CyberUI.createCard('ui-container', 'GOOGLE GEMINI API', `
            <input type="password" id="g-api-key" class="api-input" placeholder="API key (aistudio.google.com/apikey)" autocomplete="off">
            <select id="g-model" class="api-input" style="margin-top:6px;" onchange="updateGeminiTitle()">
                <option value="gemini-2.5-flash">2.5-flash</option>
                <option value="gemini-2.5-pro">2.5-pro</option>
                <option value="gemini-2.0-flash">2.0-flash</option>
            </select>
            <div id="g-price-info" style="font-family:'Orbitron',sans-serif;font-size:10px;color:rgba(0,210,255,0.65);text-align:right;margin-top:4px;letter-spacing:0.04em;">
                — per Mio. Token
            </div>
        `, '#00d2ff', { collapsible: true });

        // Reflect the selected model in the card title (replaces "API" with e.g. "2.5-FLASH").
        // Also updates the small price-info line below the dropdown — that's where
        // the per-1M-token rates live now that they're out of the option text.
        function updateGeminiTitle() {
            const sel = document.getElementById('g-model');
            if (!sel) return;
            const model = sel.value;
            const suffix = model.replace(/^gemini-/, '').toUpperCase();
            const card = sel.closest('.instrument-card');
            const titleEl = card?.querySelector('.instrument-title');
            if (titleEl) {
                const icon = titleEl.querySelector('.toggle-icon');
                titleEl.innerHTML = '';
                if (icon) titleEl.appendChild(icon);
                titleEl.appendChild(document.createTextNode(' GOOGLE GEMINI ' + suffix));
            }
            const priceEl = document.getElementById('g-price-info');
            const price = (typeof GEMINI_PRICING !== 'undefined') ? GEMINI_PRICING[model] : null;
            if (priceEl && price) {
                priceEl.textContent = `$${price.in} in / $${price.out} out — per Mio. Token`;
            }
        }

        CyberUI.createCard('ui-container', 'KOSTENKONTROLLE', `
            <div style="font-family:'Orbitron',sans-serif;font-size:15px;line-height:1.9;color:#00d2ff;letter-spacing:0.02em;">
                <div style="display:flex;justify-content:space-between;gap:10px;">
                    <span>Letzter Call:</span>
                    <span id="cost-last" style="color:#adff2f;font-weight:700;">—</span>
                </div>
                <div style="display:flex;justify-content:space-between;gap:10px;">
                    <span>Session:</span>
                    <span id="cost-session" style="color:#adff2f;font-weight:700;text-align:right;">—</span>
                </div>
                <div style="display:flex;justify-content:space-between;gap:10px;">
                    <span>Counter:</span>
                    <span id="cost-alltime" style="color:#F4C430;font-weight:700;text-align:right;">—</span>
                </div>
            </div>
            <!--
            <div class="eps-row" style="margin-top:14px;">
                <label style="font-size:13px;">Limit $</label>
                <input type="number" id="cost-limit" step="0.01" min="0" value="1.00"
                    style="flex:1;padding:6px 10px;background:rgba(0,210,255,0.08);border:1px solid rgba(0,210,255,0.3);color:#00d2ff;font-family:'Courier New',monospace;font-size:13px;border-radius:4px;outline:none;"
                    oninput="onCostLimitChange(this.value)">
            </div>
            -->

            <button class="cyber-btn" onclick="resetCostCounter()"
                style="width:100%;margin-top:10px;border-color:rgba(0,210,255,0.5);color:#00d2ff;">RESET COUNTER</button>
        `, '#F4C430', { collapsible: true });

        // Formula list — same shape & order as morph.html FORMELN card.
        const FORMULAS = [
            { latex: 'E=mc^2',                                                                                                                title: 'Einstein' },
            { latex: '\\frac{a}{b}',                                                                                                          title: 'Bruch' },
            { latex: 'x=\\frac{-b\\pm\\sqrt{b^2-4ac}}{2a}',                                                                                   title: 'Quadratische Formel' },
            { latex: 'e^{i\\pi}+1=0',                                                                                                         title: 'Eulersche Identität' },
            { latex: 'a^2+b^2=c^2',                                                                                                           title: 'Pythagoras' },
            { latex: 'e^x=\\sum_{n=0}^{\\infty}\\frac{x^n}{n!}',                                                                              title: 'Taylor e^x' },
            { latex: '\\int_{-\\infty}^{\\infty}e^{-x^2}dx=\\sqrt{\\pi}',                                                                     title: 'Gauss-Integral' },
            { latex: '\\binom{n}{k}=\\frac{n!}{k!(n-k)!}',                                                                                    title: 'Binomialkoeffizient' },
            { latex: '\\frac{d}{dx}x^n=nx^{n-1}',                                                                                             title: 'Potenzregel' },
            { latex: '\\int_a^b f(x)\\,dx',                                                                                                   title: 'Bestimmtes Integral' },
            { latex: 'F=G\\frac{m_1 m_2}{r^2}',                                                                                               title: 'Newton Gravitation' },
            { latex: 'i\\hbar\\frac{\\partial}{\\partial t}\\Psi=\\hat{H}\\Psi',                                                               title: 'Schrödinger' },
            { latex: '\\nabla\\cdot E=\\frac{\\rho}{\\varepsilon_0}',                                                                         title: 'Maxwell (Gauß)' },
            { latex: '\\nabla\\times B=\\mu_0 J+\\mu_0\\varepsilon_0\\frac{\\partial E}{\\partial t}',                                        title: 'Maxwell (Ampère)' }
        ];
        CyberUI.createCard('ui-container', 'FORMELN', `
            <div class="digit-grid formula-grid">
                ${FORMULAS.map((sym, i) => `
                    <label class="latex-label" title="${sym.title}">
                        <input type="radio" name="formula" value="formula-${i}" onclick="loadPreset(${i})">
                        <span class="latex-render" data-latex="${sym.latex}"></span>
                    </label>
                `).join('')}
            </div>
        `, '#F4C430', { collapsible: true });

        // Render KaTeX into the formula buttons after the card exists.
        function renderFormulaButtons() {
            if (typeof katex === 'undefined') return;
            document.querySelectorAll('.latex-render[data-latex]').forEach(el => {
                try { katex.render(el.dataset.latex, el, { throwOnError: false, displayMode: false }); }
                catch (e) { el.textContent = el.dataset.latex; }
            });
        }
        renderFormulaButtons();

        // ── Draw state ──────────────────────────────────────────────────────────
        const drawCanvas = document.getElementById('draw-canvas');
        const drawCtx = drawCanvas.getContext('2d');
        let isDrawing = false;

        function initDraw() {
            drawCtx.fillStyle = '#fff'; // white background — better OCR contrast for Gemini
            drawCtx.fillRect(0, 0, 1000, 1000);
            drawCtx.strokeStyle = '#000';
            const strokeEl = document.getElementById('stroke-slider');
            drawCtx.lineWidth = strokeEl ? +strokeEl.value : 8;
            drawCtx.lineCap = 'round';
            drawCtx.lineJoin = 'round';
        }

        function clearDraw() {
            initDraw();
            document.getElementById('result-latex').textContent = '—';
            document.getElementById('result-render').innerHTML = '';
        }

        // Lade Preset-PNG, ersetze grün/farbig → schwarz auf weiß für die OCR
        function loadPreset(idx) {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
                // Erst Bild auf temp canvas zeichnen, Pixel manipulieren
                const tmp = document.createElement('canvas');
                tmp.width = img.width; tmp.height = img.height;
                const tctx = tmp.getContext('2d');
                tctx.drawImage(img, 0, 0);
                const id = tctx.getImageData(0, 0, tmp.width, tmp.height);
                const d = id.data;
                for (let i = 0; i < d.length; i += 4) {
                    const r = d[i], g = d[i+1], b = d[i+2];
                    // Heller Pixel (gezeichnet) → schwarz, dunkel (BG) → weiß
                    const brightness = (r + g + b) / 3;
                    if (brightness > 40) { d[i] = d[i+1] = d[i+2] = 0; d[i+3] = 255; }
                    else                  { d[i] = d[i+1] = d[i+2] = 255; d[i+3] = 255; }
                }
                tctx.putImageData(id, 0, 0);
                // Auf draw-canvas
                drawCtx.fillStyle = '#fff';
                drawCtx.fillRect(0, 0, 1000, 1000);
                drawCtx.drawImage(tmp, 0, 0, 1000, 1000);
                DebugWindow.log(`✓ Preset ${idx} geladen: ${FORMULAS[idx]?.title ?? '?'}`);
            };
            img.onerror = () => DebugWindow.log(`✗ Preset ${idx} konnte nicht geladen werden`);
            img.src = `presets/formula-${idx}.png`;
            DebugWindow.log(`▶ Lade Preset ${idx} (${FORMULAS[idx]?.title ?? '?'})`);
        }

        function onStrokeChange(v) {
            document.getElementById('stroke-val').textContent = v;
            drawCtx.lineWidth = +v;
            try { localStorage.setItem('eocr-stroke', v); } catch (_) {}
        }

        // Downsample factor (10–100 %). Stays in localStorage. Default 50 %.
        // Slider drives BOTH: (a) visual scale of the canvas on screen (CSS
        // transform — live preview of what gets sent), (b) actual pixel
        // downsampling at send-time in recognize().
        function onCanvasScaleChange(v) {
            document.getElementById('canvas-scale-val').textContent = v;
            const px = Math.round(1000 * (+v / 100));
            const sizeEl = document.getElementById('canvas-scale-size');
            if (sizeEl) sizeEl.textContent = `${px}×${px}`;
            // Visual scale — shrink/grow the canvas inside its container.
            const dc = document.getElementById('draw-canvas');
            if (dc) {
                dc.style.transform = `scale(${(+v) / 100})`;
                dc.style.transformOrigin = 'center center';
            }
            try { localStorage.setItem('eocr-canvas-scale', v); } catch (_) {}
        }

        function getPos(e) {
            const r = drawCanvas.getBoundingClientRect();
            const sx = drawCanvas.width / r.width;
            const sy = drawCanvas.height / r.height;
            const s = e.touches ? e.touches[0] : e;
            return { x: (s.clientX - r.left) * sx, y: (s.clientY - r.top) * sy };
        }

        drawCanvas.addEventListener('mousedown', e => {
            isDrawing = true;
            drawCtx.beginPath();
            const p = getPos(e); drawCtx.moveTo(p.x, p.y);
        });
        drawCanvas.addEventListener('mousemove', e => {
            if (!isDrawing) return;
            const p = getPos(e); drawCtx.lineTo(p.x, p.y); drawCtx.stroke();
        });
        drawCanvas.addEventListener('mouseup',    () => { isDrawing = false; });
        drawCanvas.addEventListener('mouseleave', () => { isDrawing = false; });
        drawCanvas.addEventListener('touchstart', e => {
            e.preventDefault(); isDrawing = true;
            drawCtx.beginPath();
            const p = getPos(e); drawCtx.moveTo(p.x, p.y);
        }, { passive: false });
        drawCanvas.addEventListener('touchmove', e => {
            e.preventDefault();
            if (!isDrawing) return;
            const p = getPos(e); drawCtx.lineTo(p.x, p.y); drawCtx.stroke();
        }, { passive: false });
        drawCanvas.addEventListener('touchend', () => { isDrawing = false; });

        // ── Cost control ────────────────────────────────────────────────────────
        // USD per 1M tokens. Verify against ai.google.dev/pricing if rates change.
        const GEMINI_PRICING = {
            'gemini-2.5-flash': { in: 0.30,  out: 2.50  },
            'gemini-2.5-pro':   { in: 1.25,  out: 10.00 },
            'gemini-2.0-flash': { in: 0.10,  out: 0.40  }
        };

        // Session counters (reset on reload). All-time counters in localStorage.
        let costSession = { calls: 0, inTok: 0, outTok: 0, usd: 0 };
        let costAllTime = { calls: 0, inTok: 0, outTok: 0, usd: 0 };
        let costLastUSD = 0;
        try {
            const saved = localStorage.getItem('eocr-cost-alltime');
            if (saved) costAllTime = JSON.parse(saved);
        } catch (_) {}
        try {
            const lim = localStorage.getItem('eocr-cost-limit');
            const limEl = document.getElementById('cost-limit');
            if (lim && limEl) limEl.value = lim;
        } catch (_) {}

        function fmtUSD(v) {
            // Below $1, show cents (1 USD = 100 ct) — easier to read for small amounts.
            if (v < 1) return (v * 100).toFixed(2) + ' ct';
            return '$' + v.toFixed(2);
        }
        function fmtCount(c) { return c.calls + ' call' + (c.calls === 1 ? '' : 's') + ', ' + fmtUSD(c.usd); }

        function updateCostUI() {
            document.getElementById('cost-last').textContent =
                costLastUSD > 0 ? fmtUSD(costLastUSD) : '—';
            document.getElementById('cost-session').textContent =
                costSession.calls > 0 ? fmtCount(costSession) : '—';
            document.getElementById('cost-alltime').textContent =
                costAllTime.calls > 0 ? fmtCount(costAllTime) : '—';
            // Limit warning — red text when exceeded (input is commented out, defaults to no limit)
            const limitEl = document.getElementById('cost-limit');
            const limit = limitEl ? parseFloat(limitEl.value) : NaN;
            const el = document.getElementById('cost-alltime');
            if (isFinite(limit) && limit > 0 && costAllTime.usd >= limit) {
                el.style.color = '#C41E3A';
                el.style.fontWeight = 'bold';
            } else {
                el.style.color = '#F4C430';
                el.style.fontWeight = '';
            }
        }

        // Called after a successful Gemini response. usage = data.usageMetadata.
        function trackCost(model, usage) {
            if (!usage) {
                DebugWindow.log('  ⚠ keine usageMetadata in der Antwort');
                return;
            }
            const inTok  = +usage.promptTokenCount    || 0;
            const outTok = +usage.candidatesTokenCount || 0;
            const p = GEMINI_PRICING[model] || GEMINI_PRICING['gemini-2.5-flash'];
            const usd = (inTok * p.in + outTok * p.out) / 1_000_000;
            costLastUSD = usd;
            costSession.calls++;  costSession.inTok += inTok;  costSession.outTok += outTok;  costSession.usd += usd;
            costAllTime.calls++;  costAllTime.inTok += inTok;  costAllTime.outTok += outTok;  costAllTime.usd += usd;
            try { localStorage.setItem('eocr-cost-alltime', JSON.stringify(costAllTime)); } catch (_) {}
            DebugWindow.log(`  💰 ${inTok} in + ${outTok} out = ${fmtUSD(usd)} (all-time: ${fmtUSD(costAllTime.usd)})`);
            updateCostUI();
            // Warn if all-time crosses the limit on THIS call
            const limitEl = document.getElementById('cost-limit');
            const limit = limitEl ? parseFloat(limitEl.value) : NaN;
            if (isFinite(limit) && limit > 0 && costAllTime.usd >= limit && (costAllTime.usd - usd) < limit) {
                DebugWindow.log(`⚠️ LIMIT $${limit.toFixed(2)} überschritten (all-time: ${fmtUSD(costAllTime.usd)})`);
            }
        }

        function resetCostCounter() {
            if (!confirm('All-time-Counter wirklich auf 0 setzen?')) return;
            costAllTime = { calls: 0, inTok: 0, outTok: 0, usd: 0 };
            try { localStorage.removeItem('eocr-cost-alltime'); } catch (_) {}
            DebugWindow.log('🔄 All-time-Counter reset');
            updateCostUI();
        }

        function onCostLimitChange(v) {
            try { localStorage.setItem('eocr-cost-limit', v); } catch (_) {}
            updateCostUI();
        }

        // Show initial values
        updateCostUI();

        // ── Render helper (shared by recognize + debugRender) ───────────────────
        function renderLatex(latex) {
            const target = document.getElementById('result-render');
            target.innerHTML = '';
            try {
                katex.render(latex, target, { throwOnError: false, displayMode: true });
            } catch (e) {
                target.textContent = latex;
                DebugWindow.log(`⚠ katex.render threw: ${e.message}`);
            }
        }

        // ── Gemini OCR ──────────────────────────────────────────────────────────
        // Strip a single $...$, $$...$$, \(...\) or \[...\] wrapper if Gemini added one.
        function unwrapLatex(s) {
            s = s.trim();
            // Remove markdown code fences ```latex ... ``` if present
            const fence = s.match(/^```(?:latex|tex)?\s*([\s\S]*?)\s*```$/i);
            if (fence) s = fence[1].trim();
            if (s.startsWith('$$') && s.endsWith('$$')) return s.slice(2, -2).trim();
            if (s.startsWith('$')  && s.endsWith('$'))  return s.slice(1, -1).trim();
            if (s.startsWith('\\(') && s.endsWith('\\)')) return s.slice(2, -2).trim();
            if (s.startsWith('\\[') && s.endsWith('\\]')) return s.slice(2, -2).trim();
            return s;
        }

        async function recognize() {
            const apiKey = document.getElementById('g-api-key').value.trim();
            const model  = document.getElementById('g-model').value;
            if (!apiKey) {
                DebugWindow.log('⚠ API key fehlt');
                document.getElementById('result-latex').textContent = '⚠ API-Key fehlt';
                return;
            }
            try { localStorage.setItem('eocr-g-key', apiKey); } catch (_) {}
            try { localStorage.setItem('eocr-g-model', model); } catch (_) {}

            // Optionally downsample the canvas before sending — fewer pixels
            // → potentially fewer image tiles → cheaper. Slider 10–100 %.
            const scalePct = +(document.getElementById('canvas-scale-slider')?.value ?? 100);
            let dataUrl;
            if (scalePct < 100) {
                const w = Math.round(drawCanvas.width  * scalePct / 100);
                const h = Math.round(drawCanvas.height * scalePct / 100);
                const tmp = document.createElement('canvas');
                tmp.width = w; tmp.height = h;
                const tctx = tmp.getContext('2d');
                tctx.imageSmoothingEnabled = true;
                tctx.imageSmoothingQuality = 'high';
                tctx.drawImage(drawCanvas, 0, 0, w, h);
                dataUrl = tmp.toDataURL('image/png');
                DebugWindow.log(`▾ Downsample ${drawCanvas.width}×${drawCanvas.height} → ${w}×${h} (${scalePct}%)`);
            } else {
                dataUrl = drawCanvas.toDataURL('image/png');
            }
            // Gemini wants bare base64 in inline_data — strip the data-URL prefix.
            const b64 = dataUrl.split(',', 2)[1];

            DebugWindow.log(`▶ Gemini ${model} (key: …${apiKey.slice(-4)}, b64: ${b64.length} chars)`);
            console.log('Gemini recognize() start', { model, keyTail: apiKey.slice(-4), b64Len: b64.length });
            document.getElementById('result-latex').textContent = '⏳ Lade…';
            document.getElementById('result-render').innerHTML = '';

            const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`;
            const prompt =
                "This image contains a single handwritten or printed mathematical equation. " +
                "Return ONLY the equation as LaTeX, with no surrounding text, no markdown code fences, " +
                "no $ or \\( delimiters. Use standard LaTeX commands (e.g. \\frac, \\sqrt, \\sum, \\int). " +
                "If the image is empty or unreadable, return exactly: (empty)";
            // Gemini REST API expects camelCase: inlineData, mimeType, generationConfig.
            const body = {
                contents: [{
                    parts: [
                        { text: prompt },
                        { inlineData: { mimeType: 'image/png', data: b64 } }
                    ]
                }],
                generationConfig: { temperature: 0 }
            };
            try {
                const t0 = performance.now();
                DebugWindow.log(`  → fetch POST ${model}:generateContent`);
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                DebugWindow.log(`  ← HTTP ${res.status} ${res.statusText} (${Math.round(performance.now() - t0)}ms)`);
                console.log('Gemini response', res.status, res.statusText);
                const text = await res.text();
                DebugWindow.log(`  body: ${text.slice(0, 240)}`);
                let data;
                try { data = JSON.parse(text); }
                catch (e) {
                    DebugWindow.log(`✗ JSON parse failed: ${e.message}`);
                    document.getElementById('result-latex').textContent = `Fehler: invalid JSON (${res.status})`;
                    return;
                }
                if (!res.ok) {
                    const msg = data?.error?.message || `HTTP ${res.status}`;
                    DebugWindow.log(`✗ Gemini-Fehler: ${msg}`);
                    document.getElementById('result-latex').textContent = `Fehler: ${msg}`;
                    return;
                }
                trackCost(model, data?.usageMetadata);
                const raw = data?.candidates?.[0]?.content?.parts?.[0]?.text ?? '(leer)';
                DebugWindow.log(`  raw: ${raw.slice(0, 200)}`);
                const latex = unwrapLatex(raw);
                document.getElementById('result-latex').textContent = latex;
                renderLatex(latex);
                DebugWindow.log(`✓ LaTeX: ${latex}`);
            } catch (err) {
                DebugWindow.log(`✗ Gemini-Fehler: ${err.message}`);
                console.error('Gemini fetch error', err);
                document.getElementById('result-latex').textContent = `Fehler: ${err.message}`;
            }
        }

        // Restore credentials: localStorage wins; fall back to window.GEMINI_API_KEY
        // from apikey.local.js (gitignored) so the key survives a localStorage wipe.
        try {
            const keyLS  = localStorage.getItem('eocr-g-key');
            const keyFile = (typeof window.GEMINI_API_KEY === 'string' && window.GEMINI_API_KEY.trim())
                ? window.GEMINI_API_KEY.trim() : '';
            const key   = keyLS || keyFile;
            const model = localStorage.getItem('eocr-g-model');
            if (key)   document.getElementById('g-api-key').value = key;
            if (model) document.getElementById('g-model').value = model;
            updateGeminiTitle();
            if (keyFile && !keyLS) DebugWindow.log('🔑 Key aus apikey.local.js geladen');
            const s = localStorage.getItem('eocr-stroke');
            if (s) { document.getElementById('stroke-slider').value = s; document.getElementById('stroke-val').textContent = s; }
            const sc = localStorage.getItem('eocr-canvas-scale');
            const scInit = sc !== null ? sc : '50';
            const slSc = document.getElementById('canvas-scale-slider');
            if (slSc) { slSc.value = scInit; onCanvasScaleChange(scInit); }
        } catch (_) {}

        // Persist card collapse state — same pattern as morph.html
        function makeCardsCollapsible() {
            document.querySelectorAll('.instrument-card.collapsible').forEach(card => {
                const titleEl = card.querySelector('.instrument-title');
                if (!titleEl) return;
                const cardKey = titleEl.textContent.trim().replace(/^▶\s*/, '');
                try {
                    const isCollapsed = localStorage.getItem('eocr-card-' + cardKey) === '1';
                    if (isCollapsed) card.classList.add('collapsed');
                    else card.classList.remove('collapsed');
                } catch (_) {}
                titleEl.addEventListener('click', () => {
                    try {
                        const isCollapsed = card.classList.contains('collapsed');
                        localStorage.setItem('eocr-card-' + cardKey, isCollapsed ? '1' : '0');
                    } catch (_) {}
                });
            });
        }
        makeCardsCollapsible();

        initDraw();
    </script>
</body>

</html>
