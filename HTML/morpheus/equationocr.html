        }

        // Pointer events with palm rejection.
        // Accept: pen, mouse, finger (small touch contact).
        // Reject: palm (large touch contact — width or height > PALM_MAX_PX).
        // iPad Safari reports finger touches with width/height in the 50-80
        // range (much larger than Android), so threshold needs to be generous.
        const PALM_MAX_PX = 100;
        let activePointerId = null;

        function isAllowedPointer(e) {
            if (e.pointerType === 'pen' || e.pointerType === 'mouse') return true;
            if (e.pointerType === 'touch') {
                if ((e.width || 0) > PALM_MAX_PX || (e.height || 0) > PALM_MAX_PX) return false;
                return true;
            }
            return true;
        }

        drawCanvas.style.touchAction = 'none';

        drawCanvas.addEventListener('pointerdown', e => {
            // TEMP DIAG: log every pointerdown so we can see what iPad reports
            // for finger touches (width/height vs PALM_MAX_PX threshold).
            try {
                DebugWindow.log(`🖐 down type=${e.pointerType} w=${e.width||0} h=${e.height||0} primary=${e.isPrimary} allow=${isAllowedPointer(e)}`);
            } catch (_) {}
            if (!isAllowedPointer(e)) return;
            if (activePointerId !== null) return;
            activePointerId = e.pointerId;
            isDrawing = true;
            const p = getPos(e);
            curStroke = { points: [p], width: drawCtx.lineWidth };
            drawCtx.beginPath();
            drawCtx.moveTo(p.x, p.y);
            try { drawCanvas.setPointerCapture(e.pointerId); } catch (_) {}
            e.preventDefault();
        }, { passive: false });

        drawCanvas.addEventListener('pointermove', e => {
            if (!isDrawing || e.pointerId !== activePointerId) return;
            if (!isAllowedPointer(e)) return;
            const p = getPos(e);
            if (curStroke) curStroke.points.push(p);
            drawCtx.lineTo(p.x, p.y); drawCtx.stroke();
            e.preventDefault();
        }, { passive: false });

        function endStroke(e) {
            if (e && e.pointerId !== activePointerId) return;
            if (isDrawing) {
                isDrawing = false;
                if (curStroke && curStroke.points.length >= 1) {
                    const idx = strokes.length;
                    strokes.push(curStroke);
                    onStrokeFinished(idx);
                    // Re-paint everything in object colors (color snaps on release).
                    renderStrokes();
                    saveCanvasState();
                }
                curStroke = null;
            }
            activePointerId = null;
        }
        drawCanvas.addEventListener('pointerup',     endStroke);
        drawCanvas.addEventListener('pointercancel', endStroke);
        drawCanvas.addEventListener('pointerleave',  endStroke);
        // Persist the current canvas pixels — called after every finished
        // stroke and after preset loads. ~100–400 KB PNG; fits in localStorage.
        function saveCanvasState() {
            try { localStorage.setItem('eocr-canvas-png', drawCanvas.toDataURL('image/png')); }
            catch (e) { DebugWindow.log(`⚠ Canvas-Save fehlgeschlagen: ${e.message}`); }
        }
        // ── Cost control ────────────────────────────────────────────────────────
        // USD per 1M tokens. Verify against ai.google.dev/pricing if rates change.
        const GEMINI_PRICING = {
            'gemini-2.5-flash':      { in: 0.30, out: 2.50  },
            'gemini-2.5-flash-lite': { in: 0.10, out: 0.40  },
            'gemini-2.5-pro':        { in: 1.25, out: 10.00 }
        };

        // Session counters (reset on reload). All-time counters in localStorage.
        let costSession = { calls: 0, inTok: 0, outTok: 0, usd: 0 };
        let costAllTime = { calls: 0, inTok: 0, outTok: 0, usd: 0 };
        let costLastUSD = 0;
        let costLastTok = 0;
        // Internal warning threshold — remind user every $1 spent to cross-check
        // against Google Cloud Console. Hardcoded, not user-configurable.
        const COST_REMIND_INTERVAL_USD = 1.00;
        let costLastReminderUSD = 0;
        try {
            const saved = localStorage.getItem('eocr-cost-alltime');
            if (saved) costAllTime = JSON.parse(saved);
            const lastRem = localStorage.getItem('eocr-cost-last-reminder');
            if (lastRem !== null) costLastReminderUSD = parseFloat(lastRem) || 0;
        } catch (_) {}
        try {
            const lim = localStorage.getItem('eocr-cost-limit');
            const limEl = document.getElementById('cost-limit');
            if (lim && limEl) limEl.value = lim;
        } catch (_) {}
        function fmtUSD(v) {
            // Always dollars. 2 NKS normally; 4 NKS below $0.01 so sub-cent
            // amounts stay readable instead of rounding to "$0.00".
            if (v < 0.01) return '$' + v.toFixed(4);
            return '$' + v.toFixed(2);
        }
        function fmtTok(n) {
            // < 1000: raw number. 1000–9999: e.g. 1.5K tok. ≥10000: integer K tok.
            if (n < 1000) return n + ' tok';
            const k = n / 1000;
            return (k >= 10 ? Math.round(k) : (Math.round(k * 10) / 10)) + 'K tok';
        }
        // Separator: em-space (U+2003) ×3 between price and token-count
        // so the eye gets a clear gap that CSS won't collapse.
        function fmtCount(c) {
            const SEP = '   ';
            return c.calls + ' call' + (c.calls === 1 ? '' : 's') + ', ' + fmtUSD(c.usd) + SEP + fmtTok(c.inTok + c.outTok);
        }
        // Fill one cost row across THREE spans: cost-{idBase}-calls / -usd / -tok.
        // calls null → calls cell stays "—". Empty (0/0) row → all three "—".
        function setRow(idBase, calls, usd, tok) {
            const callsEl = document.getElementById(idBase + '-calls');
            const usdEl   = document.getElementById(idBase + '-usd');
            const tokEl   = document.getElementById(idBase + '-tok');
            const empty   = !usd && !tok;
            if (callsEl) callsEl.textContent = (typeof calls === 'number')
                ? (calls + ' call' + (calls === 1 ? '' : 's'))
                : (empty ? '—' : '');
            if (usdEl)   usdEl.textContent = empty ? '—' : fmtUSD(usd);
            if (tokEl)   tokEl.textContent = empty ? '—' : fmtTok(tok);
        }

        function updateCostUI() {
            setRow('cost-last',    null,              costLastUSD,    costLastTok);
            setRow('cost-session', costSession.calls, costSession.usd, costSession.inTok + costSession.outTok);
            setRow('cost-alltime', costAllTime.calls, costAllTime.usd, costAllTime.inTok + costAllTime.outTok);
            // Limit warning — red text on the all-time USD cell when exceeded.
            const limitEl = document.getElementById('cost-limit');
            const limit = limitEl ? parseFloat(limitEl.value) : NaN;
            const allTimeUsdEl = document.getElementById('cost-alltime-usd');
            if (!allTimeUsdEl) return;
            if (isFinite(limit) && limit > 0 && costAllTime.usd >= limit) {
                allTimeUsdEl.style.color = '#C41E3A';
                allTimeUsdEl.style.fontWeight = 'bold';
            } else {
                allTimeUsdEl.style.color = '#F4C430';
                allTimeUsdEl.style.fontWeight = '';
            }
        }

        // Called after a successful Gemini response. usage = data.usageMetadata.
        function trackCost(model, usage) {
            if (!usage) {
                DebugWindow.log('  ⚠ keine usageMetadata in der Antwort');
                return;
            }
            // Gemini 2.5 (Flash, Flash-Lite) have *thinking enabled by
            // default*. Per Google: "response pricing is the sum of output
            // tokens AND thinking tokens." So thoughtsTokenCount must be
            // charged at the OUTPUT rate, on top of candidatesTokenCount.
            // (We were undercounting before.)
            const inTok       = +usage.promptTokenCount     || 0;
            const candidates  = +usage.candidatesTokenCount || 0;
            const thoughts    = +usage.thoughtsTokenCount   || 0;
            const outTok      = candidates + thoughts;
            const p = GEMINI_PRICING[model] || GEMINI_PRICING['gemini-2.5-flash'];
            const usd = (inTok * p.in + outTok * p.out) / 1_000_000;
            costLastUSD = usd;
            costLastTok = inTok + outTok;
            costSession.calls++;  costSession.inTok += inTok;  costSession.outTok += outTok;  costSession.usd += usd;
            costAllTime.calls++;  costAllTime.inTok += inTok;  costAllTime.outTok += outTok;  costAllTime.usd += usd;
            try { localStorage.setItem('eocr-cost-alltime', JSON.stringify(costAllTime)); } catch (_) {}
            DebugWindow.log(`  💰 ${inTok} in + ${candidates} out${thoughts > 0 ? ' + ' + thoughts + ' think' : ''} = ${fmtUSD(usd)} (all-time: ${fmtUSD(costAllTime.usd)})`);
            updateCostUI();
            maybeShowCostWarning();
            // Warn if all-time crosses the limit on THIS call
            const limitEl = document.getElementById('cost-limit');
            const limit = limitEl ? parseFloat(limitEl.value) : NaN;
            if (isFinite(limit) && limit > 0 && costAllTime.usd >= limit && (costAllTime.usd - usd) < limit) {
                DebugWindow.log(`⚠️ LIMIT $${limit.toFixed(2)} überschritten (all-time: ${fmtUSD(costAllTime.usd)})`);
            }
        }

        function resetCostCounter() {
            if (!confirm('All-time-Counter wirklich auf 0 setzen?')) return;
            costAllTime = { calls: 0, inTok: 0, outTok: 0, usd: 0 };
            costLastReminderUSD = 0;
            try { localStorage.removeItem('eocr-cost-alltime'); } catch (_) {}
            try { localStorage.removeItem('eocr-cost-last-reminder'); } catch (_) {}
            dismissCostWarning();
            DebugWindow.log('🔄 All-time-Counter reset');
            updateCostUI();
        }

        // Show the red warning banner when all-time crosses the next $1 mark.
        // costLastReminderUSD tracks the highest threshold already shown for —
        // ensures user gets reminded again at $2, $3, … without re-triggering
        // for the same dollar.
        function maybeShowCostWarning() {
            const nextThreshold = Math.floor(costAllTime.usd / COST_REMIND_INTERVAL_USD) * COST_REMIND_INTERVAL_USD;
            if (nextThreshold <= costLastReminderUSD || nextThreshold < COST_REMIND_INTERVAL_USD) return;
            const box = document.getElementById('cost-warning');
            const txt = document.getElementById('cost-warning-text');
            if (!box || !txt) return;
            txt.innerHTML = `Du hast jetzt <b style="color:#ff7088;">über $${nextThreshold.toFixed(2)}</b> verbraucht.<br><br>Bitte gegen <b>console.cloud.google.com → Billing</b> querverifizieren.`;
            box.style.display = 'flex';
            DebugWindow.log(`⚠️ COST WARNUNG: $${costAllTime.usd.toFixed(4)} überschritten Schwelle $${nextThreshold.toFixed(2)}`);
        }
        function dismissCostWarning() {
            const box = document.getElementById('cost-warning');
            if (box) box.style.display = 'none';
            // Lock the threshold so it doesn't pop again for this $1-bucket.
            costLastReminderUSD = Math.floor(costAllTime.usd / COST_REMIND_INTERVAL_USD) * COST_REMIND_INTERVAL_USD;
            try { localStorage.setItem('eocr-cost-last-reminder', String(costLastReminderUSD)); } catch (_) {}
        }

        function onCostLimitChange(v) {
            try { localStorage.setItem('eocr-cost-limit', v); } catch (_) {}
            updateCostUI();
        }

        // Show initial values + re-check warning state (in case we crossed
        // the threshold in a previous session and never acknowledged it).
        updateCostUI();
        maybeShowCostWarning();

        // ── Render helper (shared by recognize + debugRender) ───────────────────
        function renderLatex(latex) {
            const target = document.getElementById('result-render');
            target.innerHTML = '';
            try {
                katex.render(latex, target, { throwOnError: false, displayMode: true });
            } catch (e) {
                target.textContent = latex;
                DebugWindow.log(`⚠ katex.render threw: ${e.message}`);
            }
            fitLatexToContainer(target);
        }

        // Autoscale the KaTeX render to fit the container. If the natural
        // size overflows on either axis, shrink via CSS transform so the
        // glyph stays sharp (KaTeX is vector). Idempotent — resets any
        // previous transform on the inner .katex element first.
        function fitLatexToContainer(target) {
            const inner = target.querySelector('.katex, .katex-display');
            if (!inner) return;
            inner.style.transformOrigin = 'center center';
            inner.style.transform = '';
            // Force layout flush before measuring (otherwise we read stale
            // dimensions from the cleared transform above).
            const cw = target.clientWidth, ch = target.clientHeight;
            const nw = inner.scrollWidth || inner.offsetWidth;
            const nh = inner.scrollHeight || inner.offsetHeight;
            if (!cw || !ch || !nw || !nh) return;
            // 0.95 padding so the glyph doesn't touch the box edges.
            const sx = (cw * 0.95) / nw;
            const sy = (ch * 0.95) / nh;
            const s = Math.min(sx, sy, 1);
            if (s < 1) inner.style.transform = `scale(${s.toFixed(4)})`;
        }

//         // ── Gemini OCR ──────────────────────────────────────────────────────────
//         // Strip a single $...$, $$...$$, \(...\) or \[...\] wrapper if Gemini added one.
        function unwrapLatex(s) {
            s = s.trim();
            // Remove markdown code fences ```latex ... ``` if present
            const fence = s.match(/^```(?:latex|tex)?\s*([\s\S]*?)\s*```$/i);
            if (fence) s = fence[1].trim();
            if (s.startsWith('$$') && s.endsWith('$$')) return s.slice(2, -2).trim();
            if (s.startsWith('$')  && s.endsWith('$'))  return s.slice(1, -1).trim();
            if (s.startsWith('\\(') && s.endsWith('\\)')) return s.slice(2, -2).trim();
            if (s.startsWith('\\[') && s.endsWith('\\]')) return s.slice(2, -2).trim();
            return s;
        }
        async function recognize() {
            const apiKey = document.getElementById('g-api-key').value.trim();
            const model  = document.getElementById('g-model').value;
            if (!apiKey) {
                DebugWindow.log('⚠ API-Key fehlt');
                setLatexResult('⚠ API-Key fehlt');
                return;
            }
            try { localStorage.setItem('eocr-g-key', apiKey); } catch (_) {}
            try { localStorage.setItem('eocr-g-model', model); } catch (_) {}

            // Pipeline before sending: (a) optional downsample via slider,
            // (b) convert the cyber-themed canvas (green-on-darkblue) to
            // pure b/w so Gemini sees a clean high-contrast OCR image.
            const scalePct = +(document.getElementById('canvas-scale-slider')?.value ?? 100);
            const w = Math.round(drawCanvas.width  * scalePct / 100);
            const h = Math.round(drawCanvas.height * scalePct / 100);
            const tmp = document.createElement('canvas');
            tmp.width = w; tmp.height = h;
            const tctx = tmp.getContext('2d');
            tctx.imageSmoothingEnabled = true;
            tctx.imageSmoothingQuality = 'high';
            tctx.drawImage(drawCanvas, 0, 0, w, h);
            const id = tctx.getImageData(0, 0, w, h);
            const dpx = id.data;
            for (let i = 0; i < dpx.length; i += 4) {
                const brightness = (dpx[i] + dpx[i+1] + dpx[i+2]) / 3;
                // Bright (green stroke, incl. anti-aliased edges) → black.
                // Dark (dark-blue bg) → white.
                if (brightness > 60) { dpx[i] = dpx[i+1] = dpx[i+2] = 0;   }
                else                 { dpx[i] = dpx[i+1] = dpx[i+2] = 255; }
                dpx[i+3] = 255;
            }
            tctx.putImageData(id, 0, 0);
            const dataUrl = tmp.toDataURL('image/png');
            DebugWindow.log(`▾ ${drawCanvas.width}×${drawCanvas.height} → ${w}×${h} (${scalePct}%) + b/w`);
            // Gemini wants bare base64 in inline_data — strip the data-URL prefix.
            const b64 = dataUrl.split(',', 2)[1];

            DebugWindow.log(`▶ Gemini ${model} (key: …${apiKey.slice(-4)}, b64: ${b64.length} chars)`);
            console.log('Gemini recognize() start', { model, keyTail: apiKey.slice(-4), b64Len: b64.length });
            setLatexResult('⏳ Lade…');
            // Show the squiri spinner in the upper half while we await Gemini.
            // renderLatex(latex) overwrites innerHTML when the result arrives.
            document.getElementById('result-render').innerHTML =
                '<div class="squiri"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>';
            clearOverlay();

            const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`;
            // Gemini bounding boxes were unreliable — drop them entirely.
            // We still ask for a per-glyph token list (labels only, no boxes)
            // for downstream character-level matching against a LaTeX target.
            const prompt =
                "This image shows a single printed or handwritten mathematical equation.\n" +
                "\n" +
                "Return strict JSON, no markdown, no commentary:\n" +
                "{\n" +
                "  \"latex\": \"<full equation as LaTeX, no $ or \\\\( delimiters>\",\n" +
                "  \"tokens\": [ \"<LaTeX of single glyph>\", ... ]\n" +
                "}\n" +
                "\n" +
                "RULES:\n" +
                "- tokens lists every VISIBLE INK glyph (letter, digit, operator like +/-/=/*, bracket, dot, accent, radical, integral, sum, Greek letter), in reading order.\n" +
                "- INCLUDE visible LaTeX commands that produce ink: \\\\sqrt, \\\\sum, \\\\int, \\\\frac (counts as one token — the fraction bar), \\\\pi, \\\\alpha, \\\\beta, etc.\n" +
                "- EXCLUDE LaTeX *structural* characters that produce NO ink: '^', '_', '{', '}', whitespace.\n" +
                "- Example: \"E=mc^2\" → tokens = [\"E\", \"=\", \"m\", \"c\", \"2\"] (no '^').\n" +
                "- Example: \"a^2+b^2\" → tokens = [\"a\", \"2\", \"+\", \"b\", \"2\"].\n" +
                "- Example: \"\\\\sqrt{x}+1\" → tokens = [\"\\\\sqrt\", \"x\", \"+\", \"1\"] (the radical IS visible ink).\n" +
                "- Example: \"\\\\sum_{i=1}^n i\" → tokens = [\"\\\\sum\", \"i\", \"=\", \"1\", \"n\", \"i\"] (sum sign visible, _ and ^ skipped).\n" +
                "- No bounding boxes. Just the labels.\n" +
                "- If empty/unreadable: { \"latex\": \"(empty)\", \"tokens\": [] }";
            // Gemini REST API expects camelCase: inlineData, mimeType, generationConfig.
            // responseMimeType forces strict JSON output (no markdown wrappers).
            const body = {
                contents: [{
                    parts: [
                        { text: prompt },
                        { inlineData: { mimeType: 'image/png', data: b64 } }
                    ]
                }],
                generationConfig: (() => {
                    const cfg = { temperature: 0, responseMimeType: 'application/json' };
                    const thEl = document.getElementById('g-thinking');
                    if (thEl && !thEl.checked) {
                        // Disable thinking → save thoughts-tokens at output rate.
                        cfg.thinkingConfig = { thinkingBudget: 0 };
                    }
                    return cfg;
                })()
            };
            try {
                const t0 = performance.now();
                DebugWindow.log(`  → fetch POST ${model}:generateContent`);
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                DebugWindow.log(`  ← HTTP ${res.status} ${res.statusText} (${Math.round(performance.now() - t0)}ms)`);
                console.log('Gemini response', res.status, res.statusText);
                const text = await res.text();
                DebugWindow.log(`  body: ${text.slice(0, 240)}`);
                let data;
                try { data = JSON.parse(text); }
                catch (e) {
                    DebugWindow.log(`✗ JSON parse failed: ${e.message}`);
                    setLatexResult(`Fehler: invalid JSON (${res.status})`);
                    return;
                }
                if (!res.ok) {
                    const msg = data?.error?.message || `HTTP ${res.status}`;
                    DebugWindow.log(`✗ Gemini-Fehler: ${msg}`);
                    setLatexResult(`Fehler: ${msg}`);
                    return;
                }
                trackCost(model, data?.usageMetadata);
                const raw = data?.candidates?.[0]?.content?.parts?.[0]?.text ?? '';
                DebugWindow.log(`  raw: ${raw.slice(0, 200)}`);
                // With responseMimeType=application/json Gemini returns a JSON
                // string in the text field. Parse it for { latex, tokens }.
                // If parsing fails (e.g. model ignored the schema), fall back
                // to treating the whole text as raw LaTeX with no boxes.
                let latex = '(leer)';
                let tokens = [];
                try {
                    const parsed = JSON.parse(raw);
                    latex = typeof parsed?.latex === 'string' && parsed.latex.trim()
                        ? unwrapLatex(parsed.latex) : '(leer)';
                    tokens = Array.isArray(parsed?.tokens) ? parsed.tokens : [];
                    DebugWindow.log(`  parsed: latex="${latex.slice(0,80)}", tokens=${tokens.length}`);
                } catch (e) {
                    DebugWindow.log(`  ⚠ JSON-Schema-Parse fehlgeschlagen, fallback auf raw text`);
                    latex = unwrapLatex(raw || '(leer)');
                }
                setLatexResult(latex);
                renderLatex(latex);
                saveLastDebug(latex, tokens, raw);
                DebugWindow.log(`✓ LaTeX: ${latex}`);
                // 1) Close any still-open active object.
                if (objectIdleTimer) { clearTimeout(objectIdleTimer); objectIdleTimer = null; }
                closeActiveObject();
                // 2) Rebuild objects[] from connected-component contours of
                //    the rasterised canvas (morph-style). Connected ink =
                //    one glyph; the live bbox-grouping was unreliable.
                regroupObjectsFromContours();
                // 2a) Specifically merge "stacked horizontal bars" (= ± ÷)
                //     ALWAYS, regardless of count. Two parallel horizontal
                //     bars with overlapping x-range and small vertical gap
                //     are pretty much always one glyph.
                // NB: mergeStackedBars() is intentionally NOT called here.
                // Shape-matching pairs each PNG outer to its LaTeX outer
                // individually — '=' as 2 outers on both sides pairs 1:1
                // (top↔top, bot↔bot) with matching colours. Pre-merging
                // would orphan one of the LaTeX bars.
                //
                // 3) MORPH-STYLE SHAPE MATCHING (replaces position-based
                //    mapping). Render the LaTeX off-screen, extract its
                //    contours, then pair each handwriting outer with a LaTeX
                //    outer by SHAPE (size, elongation, position, fuzz) via
                //    the same Greedy-Sequential-Symbol-Type-Tier matcher
                //    that morph uses. Result is stored on every object as
                //    `matchId`.
                let shapeMatched = false;
                try {
                    const lat = await renderLatexToOffscreenAndExtractContours(latex);
                    latexContours = lat.contours;
                    latexOuters   = lat.outers;
                    latexSrcW = lat.srcW || 0;
                    latexSrcH = lat.srcH || 0;
                    applyShapeMatching();
                    assignLabelsFromTokens(tokens);
                    shapeMatched = lastMatchResult != null;
                } catch (e) {
                    DebugWindow.log(`⚠ shape-match failed: ${e.message}`);
                }
                // 4) MORPH-STYLE UNIFIED RENDER. After ERKENNEN:
                //    - clear canvas
                //    - draw handwriting outers as filled+holes polygons
                //      (matched palette colour)
                //    - overlay LaTeX outers, REMAPPED to the handwriting's
                //      bbox so the two share screen position (morph base
                //      state — ready for cross-fade later).
                // Outline ON: contours on canvas, red KaTeX hidden.
                // Outline OFF: no contours, red KaTeX visible.
                if (shapeMatched) {
                    drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
                    renderHandwritingContoursOnCanvas();
                    const outlineEl = document.getElementById('g-outline');
                    const rr = document.getElementById('result-render');
                    if (!outlineEl || outlineEl.checked) {
                        renderLatexContoursOnCanvas();
                        if (rr) rr.style.visibility = 'hidden';
                    } else {
                        if (rr) rr.style.visibility = '';
                    }
                } else {
                    // Fallback: shape-match failed; just show user strokes + red KaTeX.
                    renderStrokes();
                    const rr = document.getElementById('result-render');
                    if (rr) rr.style.visibility = '';
                }
                // renderChips();
                // 5) (legacy fallback — KaTeX colorize-via-textcolor — kept
                //    in case shape-matching fails entirely. Currently hidden
                //    via display:none above when shape-matching succeeds.)
                try {
                    const colored = colorizeLatex(latex, tokens);
                    renderLatex(colored);
                    DebugWindow.log(`🎨 colorized re-render: ${colored.slice(0, 120)}`);
                } catch (e) {
                    DebugWindow.log(`⚠ colorize failed: ${e.message}`);
                }
            } catch (err) {
                DebugWindow.log(`✗ Gemini-Fehler: ${err.message}`);
                console.error('Gemini fetch error', err);
                setLatexResult(`Fehler: ${err.message}`);
            }
        }
        // Restore credentials: localStorage wins; fall back to window.GEMINI_API_KEY
        // from apikey.local.js (gitignored) so the key survives a localStorage wipe.
        try {
            const keyLS  = localStorage.getItem('eocr-g-key');
            const keyFile = (typeof window.GEMINI_API_KEY === 'string' && window.GEMINI_API_KEY.trim())
                ? window.GEMINI_API_KEY.trim() : '';
            DebugWindow.log(`🔑 init: localStorage=${keyLS ? '…' + keyLS.slice(-4) : '∅'}, window.GEMINI_API_KEY=${keyFile ? '…' + keyFile.slice(-4) : '∅'}`);
            const key   = keyLS || keyFile;
            // Validate restored model — if it points at a deprecated/removed
            // option (e.g. gemini-2.0-flash after the 2.0 sunset), discard it
            // and fall back to whatever the dropdown's first option is.
            const modelSaved = localStorage.getItem('eocr-g-model');
            const modelEl = document.getElementById('g-model');
            const validModels = Array.from(modelEl.options).map(o => o.value);
            const model = validModels.includes(modelSaved) ? modelSaved : null;
            if (key)   document.getElementById('g-api-key').value = key;
            if (model) modelEl.value = model;
            else if (modelSaved) {
                try { localStorage.removeItem('eocr-g-model'); } catch (_) {}
                DebugWindow.log(`⚠ Gespeichertes Modell "${modelSaved}" nicht mehr verfügbar — Default geladen`);
            }
            // Restore thinking toggle (default ON).
            const thinkingSaved = localStorage.getItem('eocr-thinking');
            const thinkingEl = document.getElementById('g-thinking');
            if (thinkingEl) thinkingEl.checked = (thinkingSaved !== '0');
            // Restore outline toggle (default ON).
            const outlineSaved = localStorage.getItem('eocr-outline');
            const outlineEl = document.getElementById('g-outline');
            if (outlineEl) outlineEl.checked = (outlineSaved !== '0');
            updateGeminiTitle();
            if (keyFile && !keyLS) DebugWindow.log('🔑 Key aus apikey.local.js geladen');
            const s = localStorage.getItem('eocr-stroke');
            if (s) { document.getElementById('stroke-slider').value = s; document.getElementById('stroke-val').textContent = s; }
            const sc = localStorage.getItem('eocr-canvas-scale');
            const scInit = sc !== null ? sc : '50';
            const slSc = document.getElementById('canvas-scale-slider');
            if (slSc) { slSc.value = scInit; onCanvasScaleChange(scInit); }
        } catch (_) {}

        // Persist card collapse state — same pattern as morph.html
        function makeCardsCollapsible() {
            document.querySelectorAll('.instrument-card.collapsible').forEach(card => {
                const titleEl = card.querySelector('.instrument-title');
                if (!titleEl) return;
                const cardKey = titleEl.textContent.trim().replace(/^▶\s*/, '');
                try {
                    const isCollapsed = localStorage.getItem('eocr-card-' + cardKey) === '1';
                    if (isCollapsed) card.classList.add('collapsed');
                    else card.classList.remove('collapsed');
                } catch (_) {}
                titleEl.addEventListener('click', () => {
                    try {
                        const isCollapsed = card.classList.contains('collapsed');
                        localStorage.setItem('eocr-card-' + cardKey, isCollapsed ? '1' : '0');
                    } catch (_) {}
                });
            });
        }
        makeCardsCollapsible();

        // Pen toggle — small SVG icon injected into the ZEICHNEN card title.
        // Click flips drawing on/off (via .pen-on class on #draw-canvas).
        // State is persisted in localStorage so the user's pick survives reload.
        function togglePen() {
            const on = drawCanvas.classList.toggle('pen-on');
            try { localStorage.setItem('eocr-pen-on', on ? '1' : '0'); } catch (_) {}
            const pen = document.querySelector('.pen-toggle');
            if (pen) pen.classList.toggle('active', on);
            DebugWindow.log(on ? '✏ Stift AN' : '✏ Stift AUS');
        }
        function setupPenToggle() {
            const cards = document.querySelectorAll('.instrument-card');
            let target = null;
            for (const c of cards) {
                const t = c.querySelector('.instrument-title');
                if (t && t.textContent.trim().toUpperCase().includes('ZEICHNEN')) {
                    target = t; break;
                }
            }
            if (!target || target.querySelector('.pen-toggle')) return;
            const pen = document.createElement('span');
            pen.className = 'pen-toggle';
            pen.title = 'Stift an/aus';
            pen.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>';
            pen.addEventListener('click', (e) => { e.stopPropagation(); togglePen(); });
            // Append at the right end of the title bar (after the text).
            target.appendChild(pen);
            // Reflect current state.
            if (drawCanvas.classList.contains('pen-on')) pen.classList.add('active');
        }
        // Restore last pen state, then mount the icon.
        try {
            if (localStorage.getItem('eocr-pen-on') === '1') drawCanvas.classList.add('pen-on');
        } catch (_) {}
        setupPenToggle();

        // Live mouse-coord readout above the ERKENNEN button.
        (function wireMouseCoord() {
            const coordEl = document.getElementById('mouse-coord');
            const stackEl = document.getElementById('canvas-stack');
            if (!coordEl || !stackEl) return;
            stackEl.addEventListener('mousemove', (e) => {
                const r = stackEl.getBoundingClientRect();
                const W = drawCanvas.width;
                const H = drawCanvas.height;
                const x = Math.round((e.clientX - r.left) * W / r.width);
                const y = Math.round((e.clientY - r.top)  * H / r.height);
                coordEl.textContent = `x: ${x}  y: ${y}`;
            });
            stackEl.addEventListener('mouseleave', () => {
                coordEl.textContent = 'x: —  y: —';
            });
        })();

        restoreFormulaChoice();
        // Defer resize until after layout is computed.
        setTimeout(() => {
            resizeCanvas();
            initDraw();
            // Update scale display now that canvas has real dimensions.
            const scInit = +(document.getElementById('canvas-scale-slider')?.value ?? 50);
            onCanvasScaleChange(scInit);
            // Restore saved canvas pixels after resize so dimensions are correct.
            (function restoreCanvasState() {
                let dataUrl;
                try { dataUrl = localStorage.getItem('eocr-canvas-png'); } catch (_) { return; }
                if (!dataUrl) return;
                const img = new Image();
                img.onload = () => {
                    drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
                    drawCtx.drawImage(img, 0, 0, drawCanvas.width, drawCanvas.height);
                    DebugWindow.log(`↻ Canvas-Pixel wiederhergestellt`);
                };
                img.src = dataUrl;
            })();
        }, 100);
        // Observe container resize → keep canvas resolution in sync.
        const stackEl = document.getElementById('canvas-stack');
        if (stackEl && typeof ResizeObserver !== 'undefined') {
            new ResizeObserver(() => resizeCanvas()).observe(stackEl);
        }

        // Diagnostic: report left-chrome geometry (rail + sidebar) for the central
        // single-source-of-truth refactor. Logs natural sum vs. rendered width.
        function logChromeGeometry(tag) {
            const cs = getComputedStyle(document.documentElement);
            const railVar    = cs.getPropertyValue('--cyber-rail-w').trim();
            const sbVar      = cs.getPropertyValue('--cyber-sidebar-w').trim();
            const naturalVar = cs.getPropertyValue('--cyber-left-natural-w').trim();
            const scaleVar   = cs.getPropertyValue('--cyber-left-scale').trim();
            const rail       = document.getElementById('mini-rail');
            const panel      = document.getElementById('side-panel');
            const chrome     = document.getElementById('cyber-left-chrome');
            const railW      = rail   ? rail.getBoundingClientRect().width   : null;
            const panelW     = panel  ? panel.getBoundingClientRect().width  : null;
            const chromeW    = chrome ? chrome.getBoundingClientRect().width : null;
            const sumRailPanel = (railW != null && panelW != null) ? (railW + panelW) : null;

            DebugWindow.log(`▼ chrome (${tag}): vars rail=${railVar} sb=${sbVar} natural=${naturalVar} scale=${scaleVar}`);
            DebugWindow.log(`  measured: rail=${railW?.toFixed(2)} sb=${panelW?.toFixed(2)} sum=${sumRailPanel?.toFixed(2)} chrome=${chromeW?.toFixed(2)}`);
        }
        // Fire after layout settles (post auto-fit-scale calc).
        setTimeout(() => logChromeGeometry('init'), 50);
        setTimeout(() => logChromeGeometry('settled'), 400);
        window.addEventListener('resize', () => {
            clearTimeout(window.__chromeLogTimer);
            window.__chromeLogTimer = setTimeout(() => logChromeGeometry('resize'), 250);
        });
        // ── Canvas wheel-zoom (mouse-pivot) ─────────────────────────────────
        // Wheel over the canvas-stack scales it via CSS transform, with the
        // mouse position as pivot — so the pixel under the cursor stays
        // anchored while zooming in/out. Press '0' to reset.
        (function setupCanvasZoom() {
            const stack = document.getElementById('canvas-stack');
            if (!stack) return;
            let scale = 1, tx = 0, ty = 0;
            stack.style.transformOrigin = '0 0';
            function apply() {
                stack.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
            }
            stack.addEventListener('wheel', e => {
                e.preventDefault();
                const parentR = stack.parentElement.getBoundingClientRect();
                const mx = e.clientX - parentR.left;
                const my = e.clientY - parentR.top;
                const step = (e.deltaY < 0) ? 1.15 : (1 / 1.15);
                const newScale = Math.max(0.2, Math.min(40, scale * step));
                const k = newScale / scale;
                tx = mx - k * (mx - tx);
                ty = my - k * (my - ty);
                scale = newScale;
                apply();
            }, { passive: false });
            document.addEventListener('keydown', e => {
                if (e.key === '0' || e.key === 'Escape') {
                    scale = 1; tx = 0; ty = 0; apply();
                    DebugWindow.log('🔍 canvas-zoom reset');
                }
            });
        })();
    </script>
</body>

</html>
