<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOC ALVERS MATHE-LABORE | Morph</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="../resources/favicon.png">
    <link rel="stylesheet" href="../js/cyber-layout.css">
    <link rel="stylesheet" href="../js/buttons-ultra.css">
    <link rel="stylesheet" href="../js/cyber-lab-overrides.css">
    <link rel="stylesheet" href="../js/branding.styles.extracted.css">
    <link rel="stylesheet" href="../js/lab-shell-minimal.css">
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script src="geometry.js"></script>

    <script src="count-objects.js"></script>
    <style>
        #draw-canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #000;
            cursor: crosshair;
            border-radius: 10px;
            border: 2px solid rgba(0, 210, 255, 0.5);
            box-shadow: 0 0 24px rgba(0, 210, 255, 0.12);
            touch-action: none;
        }

        #canvas-stack {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            line-height: 0;
            transform: scale(1.05);
            transform-origin: center center;
        }

        #digit-canvas, #outline-canvas, #morph-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            border-radius: 10px;
        }

        #draw-wrap {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 80px 20px 20px;
            box-sizing: border-box;
        }

        #draw-hint {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 0.04em;
            text-align: center;
        }

        .eps-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .eps-row label {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            color: rgba(0, 210, 255, 0.7);
        }

        .eps-row input[type=range] {
            flex: 1;
            accent-color: #00d2ff;
        }

        .eps-row span {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            color: #00d2ff;
            width: 28px;
            text-align: right;
        }

        #vert-count {
            display: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            color: #adff2f;
            text-align: center;
            margin-top: 8px;
            min-height: 18px;
            letter-spacing: 0.06em;
        }

        /* Make sidebar buttons 30% flatter (overrides buttons-ultra.css min-height) */
        #side-panel .cyber-btn {
            padding-top: 5px !important;
            padding-bottom: 5px !important;
            min-height: 40px !important;
        }
        #side-panel .digit-grid .cyber-btn,
        #side-panel div[class*="grid"] .cyber-btn {
            min-height: 34px !important;
        }
        #side-panel .digit-grid label {
            padding-top: 5px !important;
            padding-bottom: 5px !important;
        }

        /* Toggle switch */
        .switch-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            color: rgba(0, 210, 255, 0.7);
            letter-spacing: 0.06em;
        }

        .switch {
            position: relative;
            width: 36px;
            height: 18px;
            display: inline-block;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .switch-slider {
            position: absolute;
            inset: 0;
            background: rgba(0, 210, 255, 0.15);
            border: 1px solid rgba(0, 210, 255, 0.4);
            border-radius: 18px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .switch-slider::before {
            content: '';
            position: absolute;
            left: 2px;
            top: 1px;
            width: 12px;
            height: 12px;
            background: #00d2ff;
            border-radius: 50%;
            transition: transform 0.2s;
        }

        .switch input:checked + .switch-slider {
            background: rgba(173, 255, 47, 0.2);
            border-color: #adff2f;
        }

        .switch input:checked + .switch-slider::before {
            background: #adff2f;
            transform: translateX(18px);
        }

        .digit-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        .digit-grid input[type=radio] {
            display: none;
        }

        .digit-grid label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 0;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.55);
            background: rgba(0, 210, 255, 0.04);
            border: 1px solid rgba(0, 210, 255, 0.25);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
        }

        .digit-grid label:hover {
            color: #00d2ff;
            border-color: rgba(0, 210, 255, 0.6);
            background: rgba(0, 210, 255, 0.1);
        }

        .digit-grid input[type=radio]:checked + span {
            color: #adff2f;
        }

        .digit-grid label:has(input:checked) {
            color: #adff2f;
            border-color: #adff2f;
            background: rgba(173, 255, 47, 0.12);
            box-shadow: 0 0 12px rgba(173, 255, 47, 0.3);
        }

        /* Similarity overlay: top-left of canvas container (above the canvas),
           floats over whatever layout - independent of the square canvas-stack. */
        #similarity-box {
            position: absolute;
            top: 50px;
            left: 30px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(0, 210, 255, 0.5);
            border-radius: 12px;
            padding: 24px 36px;
            text-align: center;
            color: #00d2ff;
            pointer-events: none;
            min-width: 200px;
            line-height: 1;
            z-index: 50;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
        }
        #similarity-box .sim-value {
            font-family: 'KaTeX_Math', 'Times New Roman', serif;
            font-style: italic;
            font-size: 96px;
            font-weight: 700;
            color: #00d2ff;
            line-height: 1;
        }
        #similarity-box .sim-label {
            font-family: 'KaTeX_Math', 'Times New Roman', serif;
            font-style: italic;
            font-size: 28px;
            color: rgba(0, 210, 255, 0.85);
            margin-top: 10px;
            line-height: 1;
        }

        /* LaTeX labels inside digit-grid — visually match digit size */
        .digit-grid .latex-label {
            font-size: 20px !important;
        }
        .digit-grid .latex-render {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .digit-grid .latex-render .katex {
            color: inherit;
            line-height: 1.2;
            font-size: 1em;
        }

        /* Collapsible instrument cards */
        .instrument-card.collapsible .instrument-title {
            cursor: pointer;
            user-select: none;
        }
        .instrument-card.collapsible .toggle-icon {
            display: inline-block;
            transition: transform 0.2s ease;
            margin-right: 6px;
            font-size: 10px;
        }
        .instrument-card.collapsible:not(.collapsed) .toggle-icon {
            transform: rotate(90deg);
        }
        .instrument-card.collapsible.collapsed .card-content {
            display: none;
        }
    </style>
</head>

<body>
    <nav id="mini-rail">
        <div class="nav-btn" onclick="toggleSidebar()" title="Toggle Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </div>
    </nav>

    <aside id="side-panel">
        <header id="sidebar-header"></header>
        <div id="ui-container"></div>
    </aside>

    <main id="main-content">
        <div id="canvas-container">
            <div class="cyber-grid"></div>
            <div id="math-coach-box">
                <div class="coach-title" id="coach-title-slot"></div>
                <div id="coach-content" class="coach-message"></div>
            </div>
            <div id="draw-wrap">
                <div id="canvas-stack">
                    <canvas id="draw-canvas" width="1000" height="1000"></canvas>
                    <canvas id="digit-canvas" width="1000" height="1000"></canvas>
                    <canvas id="outline-canvas" width="1000" height="1000"></canvas>
                    <canvas id="morph-canvas" width="1000" height="1000"></canvas>
                </div>
                <div id="draw-hint">Zeichne — Maus oder Finger</div>
            </div>
            <div id="similarity-box">
                <div class="sim-value" id="sim-value">0%</div>
                <div class="sim-label" id="sim-label"></div>
            </div>
        </div>
    </main>

    <script src="../js/cyber-left-chrome.js"></script>
    <script src="../js/branding/briefings.js"></script>
    <script src="../js/branding/overlays.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/i18n-de.js"></script>
    <script src="../js/i18n-en.js"></script>
    <script src="../js/i18n-es.js"></script>
    <script src="../js/i18n-fr.js"></script>
    <script src="../js/i18n-it.js"></script>
    <script src="../js/i18n-pt.js"></script>
    <script src="../js/i18n-sw.js"></script>
    <script src="../js/i18n-tr.js"></script>
    <script src="../js/i18n-nl.js"></script>
    <script src="../js/branding/nav.js"></script>
    <script src="../js/branding.js"></script>
    <script src="../js/ui.js"></script>
    <script>
        function toggleSidebar() {
            const panel = document.getElementById('side-panel');
            panel.classList.toggle('collapsed');
            if (window.CyberLeftChrome?.publishResolvedScale) CyberLeftChrome.publishResolvedScale();
            setTimeout(() => window.dispatchEvent(new Event('resize')), 400);
        }

        CyberBranding.init({ useExternalStyles: true, title: CyberI18n.get('ui.coach_title'), subtitle: 'Morph' });
        CyberUI.init();
        document.getElementById('coach-title-slot').textContent = 'Morph';
        if (window.CyberLeftChrome?.configure) CyberLeftChrome.configure({ viewportOnlyZoom: true });

        CyberUI.createCard('ui-container', 'ZEICHNEN', `
            <button class="cyber-btn" onclick="clearDraw()"
                style="width:100%;border-color:rgba(0,210,255,0.35);">LÖSCHEN</button>
            <div class="eps-row">
                <label>Stift</label>
                <input type="range" id="stroke-slider" min="1" max="30" value="6" step="1"
                    oninput="onStrokeChange(this.value)">
                <span id="stroke-val">6</span>
            </div>
        `, '#00d2ff', { collapsible: true });

        CyberUI.createCard('ui-container', 'OUTLINES', `
            <button class="cyber-btn" onclick="extractOutline()"
                style="width:100%;margin-bottom:8px;border-color:rgba(173,255,47,0.5);color:#adff2f;">OUTLINES GENERIEREN</button>
            <button class="cyber-btn" onclick="clearOutline()"
                style="width:100%;border-color:rgba(244,196,48,0.5);color:#F4C430;">OUTLINES LÖSCHEN</button>
            <label class="switch-row">
                <span>LINIE</span>
                <span class="switch">
                    <input type="checkbox" id="lines-toggle" checked onchange="onLinesToggle(this.checked)">
                    <span class="switch-slider"></span>
                </span>
            </label>
            <label class="switch-row">
                <span>PUNKTE</span>
                <span class="switch">
                    <input type="checkbox" id="points-toggle" checked onchange="onPointsToggle(this.checked)">
                    <span class="switch-slider"></span>
                </span>
            </label>
            <!--
            <div class="eps-row">
                <label>ε</label>
                <input type="range" id="eps-slider" min="1" max="50" value="8" step="0.5"
                    oninput="onEpsChange(this.value)">
                <span id="eps-val">8</span>
            </div>
            -->
            <div id="vert-count"></div>
        `, '#00d2ff', { collapsible: true });

        CyberUI.createCard('ui-container', 'MORPH', `
            <button class="cyber-btn" onclick="startMorph()"
                style="width:100%;margin-bottom:8px;border-color:rgba(173,255,47,0.5);color:#adff2f;">► MORPH</button>
            <div class="eps-row">
                <label>t</label>
                <input type="range" id="morph-slider" min="1" max="100" value="1" step="1"
                    oninput="onMorphSlider(this.value)">
                <span id="morph-val">0</span>
            </div>
        `, '#00d2ff', { collapsible: true });

        CyberUI.createCard('ui-container', 'ZIFFER', `
            <div class="digit-grid">
                ${[1,2,3,4,5,6,7,8,9,0].map(d => `
                    <label>
                        <input type="radio" name="digit" value="${d}" onchange="onDigitChange(${d})">
                        <span>${d}</span>
                    </label>
                `).join('')}
                ${[
                    { latex: '\\surd', text: '\\sqrt', title: 'surd' },
                    { latex: '\\sqrt{\\phantom{x}}', text: '\\sqrt{\\phantom{x}}', title: 'sqrt + bar' },
                    { latex: '\\int', text: '\\int', title: 'integral' },
                    { latex: '\\sum', text: '\\sum', title: 'sum' },
                    { latex: '\\prod', text: '\\prod', title: 'product' },
                    { latex: '\\oint', text: '\\oint', title: 'closed integral' },
                    { latex: '\\partial', text: '\\partial', title: 'partial' },
                    { latex: '\\nabla', text: '\\nabla', title: 'nabla' },
                    { latex: '\\infty', text: '\\infty', title: 'infinity' },
                    { latex: '\\pi', text: '\\pi', title: 'pi' },
                    { latex: '\\Omega', text: '\\Omega', title: 'Omega' }
                ].map((sym, i) => `
                    <label class="latex-label" title="${sym.title}">
                        <input type="radio" name="digit" value="latex-${i}" onclick="setTextInput(this.dataset.latex)" data-latex="${sym.text}">
                        <span class="latex-render" data-latex="${sym.latex}"></span>
                    </label>
                `).join('')}
            </div>
            <input type="text" id="text-input" placeholder="Text/LaTeX..."
                style="width:100%;margin-top:8px;padding:6px 10px;background:rgba(0,210,255,0.1);border:1px solid rgba(0,210,255,0.4);color:#00d2ff;font-family:'Orbitron',monospace;font-size:12px;border-radius:4px;"
                oninput="onTextInput(this.value)">
            <div id="target-count" style="display:none;font-family:'Orbitron',sans-serif;font-size:12px;color:#F4C430;text-align:center;margin-top:10px;min-height:18px;letter-spacing:0.06em;"></div>
        `, '#00d2ff', { collapsible: true });

        // ── Drawing ─────────────────────────────────────────────────────────────────
        const drawCanvas = document.getElementById('draw-canvas');
        const drawCtx = drawCanvas.getContext('2d');
        const digitCanvas = document.getElementById('digit-canvas');
        const digitCtx = digitCanvas.getContext('2d');
        const morphCanvas = document.getElementById('morph-canvas');
        const morphCtx = morphCanvas.getContext('2d');
        const outlineCanvas = document.getElementById('outline-canvas');
        const outlineCtx = outlineCanvas.getContext('2d');
        let isDrawing = false;
        let savedPixels = null; // ImageData snapshot before polygon is drawn
        let rawContour = null;  // largest sub-polygon (for morphing reference)
        let rawContours = null; // ALL sub-polygons (outer + holes), topology-aware
        let saveTimer = null;   // debounce for auto-save

        function initDraw() {
            drawCtx.fillStyle = '#000';
            drawCtx.fillRect(0, 0, 1000, 1000);
            drawCtx.strokeStyle = '#adff2f';
            const strokeEl = document.getElementById('stroke-slider');
            drawCtx.lineWidth = strokeEl ? +strokeEl.value : 6;
            drawCtx.lineCap = 'round';
            drawCtx.lineJoin = 'round';
        }

        function clearDraw() {
            // Stop any in-progress morph animation
            cancelAnimationFrame(morphRaf);
            morphRaf = null;
            savedPixels = null;
            rawContour = null;
            rawContours = null;
            userMorphPoly = null;
            userMorphPolys = null;
            document.getElementById('vert-count').textContent = '';
            try {
                localStorage.removeItem('morph-outline');
                localStorage.removeItem('morph-outlines');
            } catch (_) {}
            initDraw();
            // Also clear the times outline overlay (digit fill stays)
            const toggle = document.getElementById('poly-toggle');
            if (selectedDigit !== null && toggle) {
                const wasChecked = toggle.checked;
                toggle.checked = false;
                onDigitChange(selectedDigit);
                toggle.checked = wasChecked;
            }
            // Clear morphed figure
            morphCtx.clearRect(0, 0, 1000, 1000);
            targetMorphPoly = null;
            targetMorphPolys = null;
            const sl = document.getElementById('morph-slider');
            const mv = document.getElementById('morph-val');
            if (sl) sl.value = 0;
            if (mv) mv.textContent = 0;
        }

        function getPos(e) {
            const r = drawCanvas.getBoundingClientRect();
            const sx = drawCanvas.width / r.width;
            const sy = drawCanvas.height / r.height;
            const s = e.touches ? e.touches[0] : e;
            return { x: (s.clientX - r.left) * sx, y: (s.clientY - r.top) * sy };
        }

        function resetDrawState() {
            savedPixels = null;
            rawContour = null;
            rawContours = null;
            document.getElementById('vert-count').textContent = '';
            try {
                localStorage.removeItem('morph-outline');
                localStorage.removeItem('morph-outlines');
            } catch (_) {}
        }

        // Pause running morph animation on Spacebar press.
        document.addEventListener('keydown', e => {
            if (e.code === 'Space' || e.key === ' ') {
                // Don't interfere with typing in input fields
                if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
                if (morphRaf !== null) {
                    e.preventDefault();
                    cancelAnimationFrame(morphRaf);
                    morphRaf = null;
                    DebugWindow.log('⏸ Morph paused (Space)');
                }
            }
        });

        drawCanvas.addEventListener('mousedown', e => {
            // If morph was just paused, don't start drawing — let user click again
            if (savedPixels) { drawCtx.putImageData(savedPixels, 0, 0); resetDrawState(); }
            isDrawing = true;
            drawCtx.beginPath();
            const p = getPos(e); drawCtx.moveTo(p.x, p.y);
        });
        drawCanvas.addEventListener('mousemove', e => {
            if (!isDrawing) return;
            const p = getPos(e); drawCtx.lineTo(p.x, p.y); drawCtx.stroke();
            scheduleAutoSave();
        });
        drawCanvas.addEventListener('mouseup', () => { isDrawing = false; });
        drawCanvas.addEventListener('mouseleave', () => { isDrawing = false; });

        drawCanvas.addEventListener('touchstart', e => {
            e.preventDefault();
            if (savedPixels) { drawCtx.putImageData(savedPixels, 0, 0); resetDrawState(); }
            isDrawing = true;
            drawCtx.beginPath();
            const p = getPos(e); drawCtx.moveTo(p.x, p.y);
        }, { passive: false });
        drawCanvas.addEventListener('touchmove', e => {
            e.preventDefault();
            if (!isDrawing) return;
            const p = getPos(e); drawCtx.lineTo(p.x, p.y); drawCtx.stroke();
            scheduleAutoSave();
        }, { passive: false });
        drawCanvas.addEventListener('touchend', () => { isDrawing = false; });

        // ── Outline extraction & rendering ───────────────────────────────────────────
        // (Marching Squares + RDP helpers moved to morpheus/contours.js + morpheus/geometry.js)
        function extractOutline() {
            DebugWindow.log('▶ extractOutline called');
            try {
                const imgData = drawCtx.getImageData(0, 0, 1000, 1000);
                savedPixels = imgData;

                const grid = new Uint8Array(1000 * 1000);
                let filledCount = 0;
                for (let i = 0; i < 1000 * 1000; i++) {
                    const v = imgData.data[i * 4] > 30 ? 1 : 0;
                    grid[i] = v;
                    if (v) filledCount++;
                }
                DebugWindow.log(`  grid: ${filledCount} filled pixels`);

                // Topology-aware extraction: get ALL contours (outer + holes)
                const rawList = getContoursWithHoles(grid, 1000, 1000);
                DebugWindow.log(`  getContoursWithHoles → ${rawList.length} contour(s)`);
                rawContours = sortContoursCanonical(rawList);

                if (!rawContours || rawContours.length === 0) {
                    rawContour = null;
                    document.getElementById('vert-count').textContent = 'Nichts gefunden';
                    DebugWindow.log('⚠️ extractOutline: no contours found');
                    return;
                }

                // Pick the largest as the "main" contour (used for morphing reference)
                rawContour = rawContours[0];
                for (const c of rawContours) {
                    if (c.length > rawContour.length) rawContour = c;
                }
                DebugWindow.log(`✓ extractOutline: ${rawContours.length} contour(s), largest=${rawContour.length} pts`);

                if (rawContour.length < 3) {
                    document.getElementById('vert-count').textContent = 'Nichts gefunden';
                    return;
                }

                try {
                    localStorage.setItem('morph-outline', JSON.stringify(rawContour));
                    localStorage.setItem('morph-outlines', JSON.stringify(rawContours));
                } catch (_) {}
                drawPolygon();
                if (selectedDigit !== null) drawTargetPolygon();
                DebugWindow.log('✓ extractOutline done');
            } catch (e) {
                DebugWindow.log(`❌ extractOutline error: ${e.message}`);
                console.error('extractOutline error:', e);
            }
        }

        // (resamplePolygon + findSelfIntersections moved to morpheus/geometry.js)

        // (REGION_COLORS, regionColor moved to morpheus/morph-engine.js)

        function drawPolygon() {
            if ((!rawContour && !rawContours) || !savedPixels) return;
            drawCtx.putImageData(savedPixels, 0, 0);

            const showPoly = document.getElementById('poly-toggle')?.checked ?? true;
            const eps = +(document.getElementById('eps-slider')?.value ?? 1);

            // Multi-polygon support: use rawContours if available, else fallback to single rawContour
            const contours = (rawContours && rawContours.length > 0)
                ? rawContours
                : (rawContour && rawContour.length >= 3 ? [rawContour] : []);
            if (contours.length === 0) return;

            // Find largest contour index — that's the one used for morphing (resampled to target)
            let largestIdx = 0;
            for (let i = 1; i < contours.length; i++) {
                if (contours[i].length > contours[largestIdx].length) largestIdx = i;
            }

            const targetLargest = getLargestTargetSubPoly();
            let totalRdpVerts = 0, totalFinalVerts = 0, totalCrosses = 0;
            let resampled = false;
            userMorphPoly = null;

            drawCtx.save();
            drawCtx.lineWidth = 1;
            drawCtx.lineCap = 'round';
            drawCtx.lineJoin = 'round';

            // Process each contour separately (no bridges, proper topology)
            for (let ci = 0; ci < contours.length; ci++) {
                const rc = contours[ci];
                if (!rc || rc.length < 3) continue;

                let poly = rdp(rc, eps);
                totalRdpVerts += poly.length;

                // Only the LARGEST contour is resampled to match target for morphing
                if (ci === largestIdx && targetLargest && targetLargest.length >= 3) {
                    let openPoly = poly;
                    if (poly.length > 1 &&
                        poly[0][0] === poly[poly.length - 1][0] &&
                        poly[0][1] === poly[poly.length - 1][1]) {
                        openPoly = poly.slice(0, -1);
                    }
                    poly = resamplePolygon(openPoly, targetLargest.length);
                    resampled = true;
                    userMorphPoly = poly.slice();
                }

                // Ensure closed polygon
                if (poly.length > 2) {
                    const [fx, fy] = poly[0];
                    const [lx, ly] = poly[poly.length - 1];
                    if ((fx - lx) ** 2 + (fy - ly) ** 2 > 4) {
                        poly = [...poly, poly[0]];
                    }
                }

                const isClosed = poly.length > 2 &&
                    poly[0][0] === poly[poly.length - 1][0] &&
                    poly[0][1] === poly[poly.length - 1][1];
                const verts = isClosed ? poly.slice(0, -1) : poly;
                totalFinalVerts += verts.length;

                const color = regionColor(ci);

                if (showPoly) {
                    const showLines = document.getElementById('lines-toggle')?.checked ?? true;
                    const showPoints = document.getElementById('points-toggle')?.checked ?? true;
                    if (showLines) {
                        // Stroke in region-specific color, 2pt
                        drawCtx.strokeStyle = color;
                        drawCtx.lineWidth = 2;
                        drawCtx.beginPath();
                        drawCtx.moveTo(poly[0][0], poly[0][1]);
                        for (let i = 1; i < poly.length; i++) drawCtx.lineTo(poly[i][0], poly[i][1]);
                        drawCtx.closePath();
                        drawCtx.stroke();
                    }
                    if (showPoints) {
                        // Vertices in region-specific color
                        drawCtx.fillStyle = color;
                        for (const [x, y] of verts) {
                            drawCtx.beginPath();
                            drawCtx.arc(x, y, 1.6, 0, Math.PI * 2);
                            drawCtx.fill();
                        }
                    }
                }

                // Per-polygon self-intersection check
                const crosses = findSelfIntersections(poly);
                if (crosses.length > 0) {
                    totalCrosses += crosses.length;
                    drawCtx.save();
                    drawCtx.strokeStyle = 'rgba(255, 0, 0, 0.95)';
                    drawCtx.lineWidth = 2;
                    const seen = new Set();
                    for (const [i, j] of crosses) {
                        for (const k of [i, j]) {
                            if (seen.has(k)) continue;
                            seen.add(k);
                            drawCtx.beginPath();
                            drawCtx.moveTo(poly[k][0],     poly[k][1]);
                            drawCtx.lineTo(poly[k + 1][0], poly[k + 1][1]);
                            drawCtx.stroke();
                        }
                    }
                    drawCtx.restore();
                }
            }

            drawCtx.restore();

            const countText = resampled
                ? `${totalRdpVerts} → ${totalFinalVerts} Vertices (${contours.length} loops)`
                : `${totalFinalVerts} Vertices (${contours.length} loops)`;
            const crossText = totalCrosses > 0 ? `  ⚠ ${totalCrosses} Cross${totalCrosses > 1 ? 'es' : ''}` : '';
            document.getElementById('vert-count').textContent = countText + crossText;
        }

        function onStrokeChange(val) {
            document.getElementById('stroke-val').textContent = val;
            drawCtx.lineWidth = +val;
            try { localStorage.setItem('morph-stroke', val); } catch (_) {}
        }

        function onEpsChange(val) {
            document.getElementById('eps-val').textContent = val;
            try { localStorage.setItem('morph-eps', val); } catch (_) {}
            drawPolygon();
        }

        function onLinesToggle(checked) {
            try { localStorage.setItem('morph-lines-visible', checked ? '1' : '0'); } catch (_) {}
            refreshOutlines();
        }

        function onPointsToggle(checked) {
            try { localStorage.setItem('morph-points-visible', checked ? '1' : '0'); } catch (_) {}
            refreshOutlines();
        }

        function refreshOutlines() {
            // Kunst: restore art pixels then redraw polygon overlay
            if (rawContour && savedPixels) drawPolygon();
            // Target: clear outline-canvas, redraw outline only (digit fill untouched)
            drawTargetPolygon();
            // Morph: redraw at current slider position (fill unchanged, just overlay)
            if (userMorphPolys && targetMorphPolys) {
                const sl = document.getElementById('morph-slider');
                const t = sl ? +sl.value / 100 : 0;
                drawMorph(t);
            }
        }

        function onPolyToggle(checked) {
            try { localStorage.setItem('morph-poly-visible', checked ? '1' : '0'); } catch (_) {}
            // User outline (Kunst): drawPolygon() restores savedPixels first, so off-state clears it.
            if (rawContour && savedPixels) drawPolygon();
            // Times outline: re-render the digit canvas fully — drawTargetPolygon inside
            // respects the toggle, so the overlay disappears when off.
            if (selectedDigit !== null) onDigitChange(selectedDigit);
            // Morph figure: redraw with current slider value if morph exists
            const morphSlider = document.getElementById('morph-slider');
            if (morphSlider && userMorphPolys && targetMorphPolys) {
                const t = parseInt(morphSlider.value) / 100;
                drawMorph(t);
            }
        }

        function clearOutline() {
            // Kunst: restore art pixels (removes polygon overlay), keep drawing
            if (savedPixels) drawCtx.putImageData(savedPixels, 0, 0);
            savedPixels = null;
            rawContour = null;
            rawContours = null;
            userMorphPoly = null;
            userMorphPolys = null;
            document.getElementById('vert-count').textContent = '';
            try {
                localStorage.removeItem('morph-outline');
                localStorage.removeItem('morph-outlines');
            } catch (_) {}
            // Target: clear outline overlay, digit fill on digit-canvas untouched
            outlineCtx.clearRect(0, 0, 1000, 1000);
            // Morph: redraw fill only (remove outline overlay), keep morph figure
            if (targetMorphPolys) {
                const sl = document.getElementById('morph-slider');
                const t = sl ? +sl.value / 100 : 1;
                drawMorph(t, false, false);
            }
        }

        // ── Morph: alignment + animation ─────────────────────────────────────────────
        // (prepareMorph, drawMorph, alignTargetTo, getLargestTargetSubPoly,
        //  calculateSimilarity moved to morpheus/morph-engine.js)

        function hideUserOutline() {
            // Clear draw canvas completely (hide user art AND outline)
            drawCtx.save();
            drawCtx.fillStyle = '#000';
            drawCtx.fillRect(0, 0, 1000, 1000);
            drawCtx.restore();
        }

        function showUserOutline() {
            // Restore user art + outline overlay
            if (savedPixels) drawCtx.putImageData(savedPixels, 0, 0);
            if (rawContour && savedPixels) drawPolygon();
        }

        function startMorph() {
            DebugWindow.log('▶ START MORPH');
            if (!rawContour) extractOutline();
            if (!prepareMorph()) {
                DebugWindow.log('❌ Morph failed: missing outline or digit');
                return;
            }
            DebugWindow.log(`✓ Morph setup ready (${MORPH_DURATION}ms)`);
            cancelAnimationFrame(morphRaf);
            // Redraw digit without outline
            if (selectedDigit !== null && timesFont) {
                const fontSize = 640;
                const probe = timesFont.getPath(String(selectedDigit), 0, 0, fontSize);
                const bbox = probe.getBoundingBox();
                const offsetX = 720 - (bbox.x1 + bbox.x2) / 2;
                const offsetY = 500 - (bbox.y1 + bbox.y2) / 2;
                const path = timesFont.getPath(String(selectedDigit), offsetX, offsetY, fontSize);
                path.fill = '#F4C430';
                digitCtx.clearRect(0, 0, 1000, 1000);
                path.draw(digitCtx);
            } else if (selectedDigit !== null) {
                digitCtx.clearRect(0, 0, 1000, 1000);
                digitCtx.save();
                digitCtx.fillStyle = '#F4C430';
                digitCtx.font = 'bold 640px "Times New Roman", serif';
                digitCtx.textAlign = 'center';
                digitCtx.textBaseline = 'middle';
                digitCtx.fillText(String(selectedDigit), 720, 500);
                digitCtx.restore();
            }
            // Draw times outline if toggle is on
            drawTargetPolygon();
            // Hide user outline during morphing
            hideUserOutline();
            morphStart = performance.now();
            function tick() {
                const elapsed = performance.now() - morphStart;
                const t = Math.min(1, elapsed / MORPH_DURATION);
                drawMorph(t);
                document.getElementById('morph-slider').value = Math.round(t * 100);
                document.getElementById('morph-val').textContent = Math.round(t * 100);
                if (t < 1) morphRaf = requestAnimationFrame(tick);
            }
            tick();
        }

        function stopMorph() {
            DebugWindow.log('⏹ STOP MORPH');
            cancelAnimationFrame(morphRaf);
            morphRaf = null;
            morphCtx.clearRect(0, 0, 1000, 1000);
            document.getElementById('morph-slider').value = 1;
            document.getElementById('morph-val').textContent = 1;
            // Redraw digit with outline
            if (selectedDigit !== null) drawTargetPolygon();
            showUserOutline();
            DebugWindow.log('✓ Morph stopped, user outline restored');
        }

        function clearMorphFigure() {
            cancelAnimationFrame(morphRaf);
            morphRaf = null;
            morphCtx.clearRect(0, 0, 1000, 1000);
            document.getElementById('morph-slider').value = 1;
            document.getElementById('morph-val').textContent = 1;
            const simEl = document.getElementById('morph-similarity');
            if (simEl) simEl.textContent = '0%';
            targetMorphPoly = null;
            userMorphPoly = null;
            targetMorphPolys = null;
            userMorphPolys = null;
            showUserOutline();
        }

        function onMorphSlider(val) {
            cancelAnimationFrame(morphRaf);
            morphRaf = null;
            document.getElementById('morph-val').textContent = val;
            if (+val === 0) {
                morphCtx.clearRect(0, 0, 1000, 1000);
                if (selectedDigit !== null) drawTargetPolygon();
                return;
            }
            if (!prepareMorph()) return;
            // Redraw digit without outline
            if (selectedDigit !== null && timesFont) {
                const fontSize = 640;
                const probe = timesFont.getPath(String(selectedDigit), 0, 0, fontSize);
                const bbox = probe.getBoundingBox();
                const offsetX = 720 - (bbox.x1 + bbox.x2) / 2;
                const offsetY = 500 - (bbox.y1 + bbox.y2) / 2;
                const path = timesFont.getPath(String(selectedDigit), offsetX, offsetY, fontSize);
                path.fill = '#F4C430';
                digitCtx.clearRect(0, 0, 1000, 1000);
                path.draw(digitCtx);
            } else if (selectedDigit !== null) {
                digitCtx.clearRect(0, 0, 1000, 1000);
                digitCtx.save();
                digitCtx.fillStyle = '#F4C430';
                digitCtx.font = 'bold 640px "Times New Roman", serif';
                digitCtx.textAlign = 'center';
                digitCtx.textBaseline = 'middle';
                digitCtx.fillText(String(selectedDigit), 720, 500);
                digitCtx.restore();
            }
            drawMorph(val / 100);
        }

        let selectedDigit = null;
        let timesFont = null;
        let targetPolygon = null; // high-res polygon of the times digit, for morphing
        let userMorphPoly = null;   // legacy: largest single user polygon (= userMorphPolys[0])
        let targetMorphPoly = null; // legacy: largest target sub-polygon (= targetMorphPolys[0])
        let userMorphPolys = null;  // per-region resampled user polygons (sorted by size desc)
        let targetMorphPolys = null;// per-region target polygons (matched 1:1, translated/aligned)
        let morphRaf = null;
        let morphStart = 0;
        // MORPH_DURATION + REGION_COLORS + regionColor live in morpheus/morph-engine.js

        // (sampleQuadratic, sampleCubic, pathToPolygons moved to morpheus/geometry.js)

        // (onDigitChange, onTextInput, setTextInput, renderLatexToCanvas, renderPlainText,
        //  extractAndUpdatePolygon, drawTargetPolygon moved to morpheus/target-render.js)

        // Load Tinos (Times-compatible) font asynchronously
        opentype.load('https://cdn.jsdelivr.net/gh/google/fonts/apache/tinos/Tinos-Bold.ttf', (err, font) => {
            if (err) { console.warn('Tinos load failed:', err); return; }
            timesFont = font;
            if (selectedDigit !== null) onDigitChange(selectedDigit);
        });

        // ── Persistence ─────────────────────────────────────────────────────────────
        function scheduleAutoSave() {
            clearTimeout(saveTimer);
            saveTimer = setTimeout(() => {
                try {
                    const data = drawCanvas.toDataURL('image/png');
                    localStorage.setItem('morph-drawing', data);
                } catch (_) {}
            }, 500);
        }

        function downloadPng() {
            const link = document.createElement('a');
            link.href = drawCanvas.toDataURL('image/png');
            link.download = 'morph-' + new Date().toISOString().slice(0, 10) + '.png';
            link.click();
        }

        function loadFromStorage() {
            try {
                const data = localStorage.getItem('morph-drawing');
                if (data) {
                    const img = new Image();
                    img.onload = () => {
                        drawCtx.drawImage(img, 0, 0);
                        restoreOutline();
                    };
                    img.src = data;
                    return;
                }
            } catch (_) {}
            restoreOutline();
        }

        function restoreOutline() {
            try {
                const allData = localStorage.getItem('morph-outlines');
                if (allData) {
                    rawContours = JSON.parse(allData);
                    if (rawContours && rawContours.length > 0) {
                        rawContour = rawContours[0];
                        for (const c of rawContours) {
                            if (c.length > rawContour.length) rawContour = c;
                        }
                    }
                } else {
                    const data = localStorage.getItem('morph-outline');
                    if (data) {
                        rawContour = JSON.parse(data);
                        rawContours = [rawContour];
                    }
                }
                if (rawContour) {
                    savedPixels = drawCtx.getImageData(0, 0, 1000, 1000);
                    drawPolygon();
                }
            } catch (_) {}
        }

        // Make cards collapsible with state persistence
        function makeCardsCollapsible() {
            const cards = document.querySelectorAll('.instrument-card.collapsible');
            cards.forEach(card => {
                const titleEl = card.querySelector('.instrument-title');
                if (!titleEl) return;

                // Extract title text (without icon)
                const cardKey = titleEl.textContent.trim().replace(/^▶\s*/, '');

                // Restore collapsed state from localStorage
                try {
                    const isCollapsed = localStorage.getItem('morph-card-' + cardKey) === '1';
                    if (isCollapsed) card.classList.add('collapsed');
                    else card.classList.remove('collapsed');
                } catch (_) {}

                // Persist on toggle (note: ui.js already adds the click handler that toggles)
                titleEl.addEventListener('click', () => {
                    try {
                        const isCollapsed = card.classList.contains('collapsed');
                        localStorage.setItem('morph-card-' + cardKey, isCollapsed ? '1' : '0');
                    } catch (_) {}
                });
            });
        }

        // Boot
        initDraw();
        loadFromStorage();
        try {
            const savedEps = localStorage.getItem('morph-eps');
            if (savedEps !== null) {
                document.getElementById('eps-slider').value = savedEps;
                document.getElementById('eps-val').textContent = savedEps;
            }
        } catch (_) {}
        try {
            const savedStroke = localStorage.getItem('morph-stroke');
            if (savedStroke !== null) {
                document.getElementById('stroke-slider').value = savedStroke;
                document.getElementById('stroke-val').textContent = savedStroke;
                drawCtx.lineWidth = +savedStroke;
            }
        } catch (_) {}
        try {
            const savedText = localStorage.getItem('morph-text');
            const savedDigit = localStorage.getItem('morph-digit');
            if (savedText !== null) {
                document.getElementById('text-input').value = savedText;
                // Check matching latex radio button
                const radio = document.querySelector(`input[name="digit"][data-latex="${savedText}"]`);
                if (radio) radio.checked = true;
                onTextInput(savedText);
            } else if (savedDigit !== null) {
                const radio = document.querySelector(`input[name="digit"][value="${savedDigit}"]`);
                if (radio) radio.checked = true;
                onDigitChange(+savedDigit);
            }
        } catch (_) {}
        try {
            const savedPoly = localStorage.getItem('morph-poly-visible');
            if (savedPoly !== null) {
                document.getElementById('poly-toggle').checked = savedPoly === '1';
            }
        } catch (_) {}
        try {
            const savedLines = localStorage.getItem('morph-lines-visible');
            if (savedLines !== null) document.getElementById('lines-toggle').checked = savedLines === '1';
        } catch (_) {}
        try {
            const savedPoints = localStorage.getItem('morph-points-visible');
            if (savedPoints !== null) document.getElementById('points-toggle').checked = savedPoints === '1';
        } catch (_) {}
        makeCardsCollapsible();
        renderLatexButtons();

        function renderLatexButtons() {
            if (typeof katex === 'undefined') return;
            document.querySelectorAll('.latex-render[data-latex]').forEach(el => {
                try {
                    katex.render(el.dataset.latex, el, {
                        throwOnError: false,
                        displayMode: false
                    });
                } catch (e) {
                    el.textContent = el.dataset.latex;
                }
            });
            // Similarity label + value — plain text with CSS-based LaTeX-look
            // (KaTeX_Math font + italic styling does the LaTeX appearance).
            const simLabel = document.getElementById('sim-label');
            if (simLabel) simLabel.textContent = 'Ähnlichkeit';
            const simBoxVal = document.getElementById('sim-value');
            if (simBoxVal) simBoxVal.textContent = '0%';
        }
    </script>
</body>

</html>
