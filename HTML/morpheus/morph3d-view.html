<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>3D MORPH</title>
<style>
    html, body { margin: 0; padding: 0; height: 100%; background: rgb(8, 20, 42); overflow: hidden; font-family: 'Orbitron', sans-serif; color: #00d2ff; }
    canvas { display: block; }
    #hud {
        position: fixed; top: 12px; left: 12px;
        font-size: 11px; letter-spacing: 1.5px; opacity: 0.85;
        pointer-events: none; line-height: 1.5;
    }
    #empty {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        text-align: center; font-size: 1.1rem; letter-spacing: 0.1em;
        opacity: 0.7;
    }
    .row { display: flex; gap: 14px; align-items: center; }
    .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: middle; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<div id="hud">
    <div class="row"><span class="swatch" style="background:#adff2f"></span>PNG · DRAWING</div>
    <div class="row"><span class="swatch" style="background:#F4C430"></span>LaTeX · TARGET</div>
    <div style="margin-top:8px;opacity:0.6">drag · orbit · wheel · zoom · ESC · close</div>
</div>
<div id="empty" style="display:none">Keine Polygon-Daten — bitte erst Formel + Zeichnung in morph.html laden.</div>
<script>
(function () {
    const data = window.opener && window.opener.__morph3dData;
    // Debug: surface what we actually received so failures are diagnosable.
    const emptyEl = document.getElementById('empty');
    if (!data || !data.pngContours || !data.latexContours) {
        const why = !window.opener ? 'window.opener ist null (Popup-Block oder noopener?)'
                   : !window.opener.__morph3dData ? '__morph3dData ist null/undefined auf opener'
                   : !data.pngContours ? 'pngContours fehlen'
                   : !data.latexContours ? 'latexContours fehlen'
                   : 'unbekannt';
        emptyEl.innerHTML = 'Keine Polygon-Daten — bitte erst Formel + Zeichnung in morph.html laden.<br><br>'
            + '<span style="font-size:0.7rem;opacity:0.6">Diagnose: ' + why + '</span>';
        emptyEl.style.display = 'block';
        return;
    }

    // Pull out the structured outers (same iteration as draw20-ring.js).
    function collectOuters(contours, classification, displayScale) {
        const out = [];
        if (!contours || !classification || !classification.outers) return out;
        for (let oi = 0; oi < classification.outers.length; oi++) {
            const o = classification.outers[oi];
            const c = contours[o.idx];
            if (c && c.length) {
                // Each contour is an array of [x, y] pairs in image-natural pixels.
                // Apply the display-scale so the 3D view roughly matches the size
                // the user sees on screen.
                const pts = c.map(([x, y]) => ({ x: x * displayScale, y: y * displayScale }));
                out.push({ pts, holes: (o.holes || []).map(hi => contours[hi]).filter(Boolean)
                    .map(h => h.map(([x, y]) => ({ x: x * displayScale, y: y * displayScale }))) });
            }
        }
        return out;
    }

    const pngOuters = collectOuters(data.pngContours, data.pClass, data.pngDisplayScale || 1);
    const latOuters = collectOuters(data.latexContours, data.lClass, data.latDisplayScale || 1);

    if (!pngOuters.length && !latOuters.length) {
        document.getElementById('empty').style.display = 'block';
        return;
    }

    // Compute combined bbox so we can center the whole scene around origin.
    function bboxOf(outers) {
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (const o of outers) for (const p of o.pts) {
            if (p.x < minX) minX = p.x; if (p.y < minY) minY = p.y;
            if (p.x > maxX) maxX = p.x; if (p.y > maxY) maxY = p.y;
        }
        return { minX, minY, maxX, maxY, w: maxX - minX, h: maxY - minY,
                 cx: (minX + maxX) / 2, cy: (minY + maxY) / 2 };
    }
    const pngBB = bboxOf(pngOuters);
    const latBB = bboxOf(latOuters);
    // Normalize so both side's polygons are centered on the same origin
    // and use the same world-unit scale (longest dim → 400).
    const targetSize = 400;
    const pngScale = Math.max(pngBB.w, pngBB.h) > 0 ? targetSize / Math.max(pngBB.w, pngBB.h) : 1;
    const latScale = Math.max(latBB.w, latBB.h) > 0 ? targetSize / Math.max(latBB.w, latBB.h) : 1;
    function normalize(outers, bb, scale) {
        return outers.map(o => ({
            pts: o.pts.map(p => ({ x: (p.x - bb.cx) * scale, y: -(p.y - bb.cy) * scale })),
            holes: o.holes.map(h => h.map(p => ({ x: (p.x - bb.cx) * scale, y: -(p.y - bb.cy) * scale }))),
        }));
    }
    const pngN = normalize(pngOuters, pngBB, pngScale);
    const latN = normalize(latOuters, latBB, latScale);

    // Uniform-arclength resample to fixed N for vertex-vertex correspondence.
    function resample(pts, N) {
        if (!pts || pts.length < 2) return new Array(N).fill({ x: 0, y: 0 });
        let total = 0;
        const segLen = [];
        for (let i = 0; i < pts.length; i++) {
            const a = pts[i], b = pts[(i + 1) % pts.length];
            const d = Math.hypot(b.x - a.x, b.y - a.y);
            segLen.push(d); total += d;
        }
        if (total === 0) return pts.slice(0, 1).concat(new Array(N - 1).fill(pts[0]));
        const step = total / N;
        const out = [];
        let segIdx = 0, segRem = segLen[0], cur = { x: pts[0].x, y: pts[0].y };
        for (let i = 0; i < N; i++) {
            out.push({ x: cur.x, y: cur.y });
            let need = step;
            while (need > segRem + 1e-9 && segIdx < pts.length - 1) {
                need -= segRem;
                segIdx++;
                cur = { x: pts[segIdx].x, y: pts[segIdx].y };
                segRem = segLen[segIdx];
            }
            if (segRem > 1e-9) {
                const next = pts[(segIdx + 1) % pts.length];
                const t = need / segRem;
                cur = { x: cur.x + (next.x - cur.x) * t, y: cur.y + (next.y - cur.y) * t };
                segRem -= need;
            }
        }
        return out;
    }

    // ── three.js scene ───────────────────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x081428);

    const cam = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 5000);
    cam.position.set(450, 250, 700);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(cam, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 0, 175);

    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const sun = new THREE.DirectionalLight(0xffffff, 0.8);
    sun.position.set(300, 400, 300);
    scene.add(sun);

    // Grid helpers — one at each polygon plane.
    function planeGrid(z) {
        const grid = new THREE.GridHelper(600, 12, 0x00d2ff, 0x00d2ff);
        grid.material.opacity = 0.12;
        grid.material.transparent = true;
        grid.rotation.x = Math.PI / 2;
        grid.position.z = z;
        scene.add(grid);
    }
    planeGrid(0);
    planeGrid(350);

    // Helper: render one outer (closed loop) at given z, in given color.
    function addOutlineLoop(pts, z, color, lineWidth = 2) {
        if (!pts.length) return;
        const verts = pts.map(p => new THREE.Vector3(p.x, p.y, z));
        verts.push(verts[0].clone());
        const geom = new THREE.BufferGeometry().setFromPoints(verts);
        const mat = new THREE.LineBasicMaterial({ color, linewidth: lineWidth });
        scene.add(new THREE.Line(geom, mat));
    }

    // Helper: tiny dot for each vertex (looks like the blue points in the screenshot).
    function addPoints(pts, z, color, size = 2.5) {
        const verts = new Float32Array(pts.length * 3);
        for (let i = 0; i < pts.length; i++) {
            verts[i * 3]     = pts[i].x;
            verts[i * 3 + 1] = pts[i].y;
            verts[i * 3 + 2] = z;
        }
        const geom = new THREE.BufferGeometry();
        geom.setAttribute('position', new THREE.BufferAttribute(verts, 3));
        const mat = new THREE.PointsMaterial({ color, size, sizeAttenuation: false });
        scene.add(new THREE.Points(geom, mat));
    }

    const PNG_COLOR = 0xadff2f;
    const LAT_COLOR = 0xF4C430;
    const LINK_COLOR = 0x4dbfa0;
    const SAMPLES = 80;
    const Z_PNG = 0;
    const Z_LAT = 350;

    // Draw outers + their holes at each plane.
    for (const o of pngN) {
        addOutlineLoop(o.pts, Z_PNG, PNG_COLOR);
        addPoints(o.pts, Z_PNG, 0x66ddff);
        for (const h of o.holes) addOutlineLoop(h, Z_PNG, PNG_COLOR);
    }
    for (const o of latN) {
        addOutlineLoop(o.pts, Z_LAT, LAT_COLOR);
        addPoints(o.pts, Z_LAT, 0x66ddff);
        for (const h of o.holes) addOutlineLoop(h, Z_LAT, LAT_COLOR);
    }

    // Correspondence lines: pair PNG outers ↔ LaTeX outers via the same logic
    // the matcher uses (data.idToPair). Both sides get resampled to SAMPLES
    // points; matching vertex i on each gets a line.
    if (data.idToPair && data.pngId && data.latId) {
        // Index pngId/latId → outer-array index for quick lookup.
        function indexById(outers, classification, idArr) {
            const map = new Map();
            for (let oi = 0; oi < classification.outers.length; oi++) {
                const o = classification.outers[oi];
                const id = idArr[o.idx];
                map.set(id, oi);
            }
            return map;
        }
        const pngIdx = indexById(pngN.length ? data.pngContours : [], data.pClass, data.pngId);
        const latIdx = indexById(latN.length ? data.latexContours : [], data.lClass, data.latId);

        const linkVerts = [];
        for (const [id, pair] of data.idToPair) {
            if (pair.png < 0 || pair.lat < 0) continue;
            const pi = pngIdx.get(id);
            const li = latIdx.get(id);
            if (pi == null || li == null) continue;
            if (!pngN[pi] || !latN[li]) continue;
            const a = resample(pngN[pi].pts, SAMPLES);
            const b = resample(latN[li].pts, SAMPLES);
            for (let k = 0; k < SAMPLES; k++) {
                linkVerts.push(a[k].x, a[k].y, Z_PNG);
                linkVerts.push(b[k].x, b[k].y, Z_LAT);
            }
        }
        if (linkVerts.length) {
            const lg = new THREE.BufferGeometry();
            lg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(linkVerts), 3));
            const lm = new THREE.LineBasicMaterial({
                color: LINK_COLOR, transparent: true, opacity: 0.45,
            });
            scene.add(new THREE.LineSegments(lg, lm));
        }
    }

    // ── Loop ────────────────────────────────────────────────────────────────
    function loop() {
        requestAnimationFrame(loop);
        controls.update();
        renderer.render(scene, cam);
    }
    loop();

    window.addEventListener('resize', () => {
        cam.aspect = innerWidth / innerHeight;
        cam.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
    });

    // Close on ESC.
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') window.close();
    });

    // Persist window geometry (size + position). Same-origin → shared
    // localStorage with the opener, key matches morph3d.js GEOM_KEY.
    function saveGeom() {
        try {
            localStorage.setItem('draw20-morph3d-geom', JSON.stringify({
                w: window.outerWidth,
                h: window.outerHeight,
                x: window.screenX,
                y: window.screenY,
            }));
        } catch (_) {}
    }
    window.addEventListener('resize', saveGeom);
    window.addEventListener('beforeunload', saveGeom);
    setInterval(saveGeom, 1500); // position has no event — poll while popup is open
})();
</script>
</body>
</html>
