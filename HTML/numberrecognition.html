<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOC ALVERS MATHE-LABORE | KI Zahlenerkennung</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="resources/favicon.png">
    <link rel="stylesheet" href="js/cyber-layout.css">
    <link rel="stylesheet" href="js/buttons-ultra.css">
    <link rel="stylesheet" href="js/cyber-lab-overrides.css">
    <link rel="stylesheet" href="js/branding.styles.extracted.css">
    <link rel="stylesheet" href="js/lab-shell-minimal.css">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
    <style>
        :root {
            --side-width: 340px;
        }

        /* ── Drawing canvas ── */
        #draw-canvas {
            display: block;
            background: #000;
            cursor: crosshair;
            border-radius: 10px;
            border: 2px solid rgba(0, 210, 255, 0.5);
            box-shadow: 0 0 24px rgba(0, 210, 255, 0.12);
            touch-action: none;
            max-width: 100%;
        }

        #draw-canvas.disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        #draw-wrap {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 80px 20px 20px;
            box-sizing: border-box;
        }

        #draw-hint {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 0.04em;
            text-align: center;
        }

        /* ── Training progress overlay ── */
        #train-overlay {
            display: none;
            position: absolute;
            inset: 0;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            background: rgba(10, 15, 30, 0.92);
            border-radius: 10px;
            padding: 24px;
            box-sizing: border-box;
        }

        #train-overlay.visible {
            display: flex;
        }

        #train-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            font-weight: 700;
            color: var(--neon-blue, #00d2ff);
            letter-spacing: 0.1em;
            text-shadow: 0 0 30px rgba(0, 210, 255, 0.4);
            padding: 8px 18px;
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 10px;
            background: rgba(0, 210, 255, 0.06);
            align-self: center;
            text-align: center;
        }

        #train-epoch-info {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            color: var(--neon-blue, #00d2ff);
            letter-spacing: 0.06em;
            transition: color 0.4s ease;
        }

        #train-epoch-info.loaded {
            color: #adff2f;
        }

        #train-epoch-info.running {
            color: rgba(255, 255, 255, 0.4);
        }

        #mnist-anim-wrap {
            flex-shrink: 0;
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 8px;
            margin: 8px 0;
            overflow: hidden;
        }

        #mnist-anim {
            width: 280px !important;
            height: 280px !important;
            display: block;
            cursor: default !important;
            image-rendering: pixelated;
        }

        #load-spinner { pointer-events: none; }

        .squiri {
            position: relative;
            width: 80px;
            height: 80px;
        }

        .squiri span {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00d2ff;
            box-shadow: 0 0 8px rgba(0,210,255,0.8);
            animation: chase-fade 1.2s ease-in-out infinite;
        }

        .squiri span:nth-child(1) { top: 0;    left: 35px; animation-delay: 0s; }
        .squiri span:nth-child(2) { top: 11px; left: 62px; animation-delay: -1.05s; }
        .squiri span:nth-child(3) { top: 35px; left: 70px; animation-delay: -0.9s; }
        .squiri span:nth-child(4) { top: 59px; left: 62px; animation-delay: -0.75s; }
        .squiri span:nth-child(5) { top: 70px; left: 35px; animation-delay: -0.6s; }
        .squiri span:nth-child(6) { top: 59px; left: 8px;  animation-delay: -0.45s; }
        .squiri span:nth-child(7) { top: 35px; left: 0;    animation-delay: -0.3s; }
        .squiri span:nth-child(8) { top: 11px; left: 8px;  animation-delay: -0.15s; }

        @keyframes chase-fade {
            0%, 100% { opacity: 0.15; transform: scale(0.7); }
            50%       { opacity: 1;    transform: scale(1.2); }
        }

        #mnist-anim-digit {
            font-family: 'Orbitron', sans-serif;
            font-size: 36px;
            font-weight: 700;
            color: #adff2f;
            text-shadow: 0 0 20px rgba(173, 255, 47, 0.5);
            min-height: 44px;
        }

        .train-bar-bg {
            width: 100%;
            max-width: 240px;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 4px;
        }

        #train-bar {
            height: 100%;
            width: 0%;
            background: var(--neon-blue, #00d2ff);
            border-radius: 3px;
            transition: width 0.4s ease;
        }

        /* ── Prediction display ── */
        #result-digit {
            font-family: 'Orbitron', sans-serif;
            font-size: 80px;
            font-weight: 700;
            text-align: center;
            line-height: 1;
            color: #adff2f;
            text-shadow: 0 0 40px rgba(173, 255, 47, 0.5);
            min-height: 90px;
            transition: color 0.15s;
            display: flex !important;
            width: 100% !important;
            justify-content: center !important;
        }
        #result-conf {
            display: flex !important;
            width: 100% !important;
            justify-content: center !important;
        }

        #result-digit.dim {
            color: rgba(255, 255, 255, 0.18);
            text-shadow: none;
        }

        #result-conf {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
            margin-top: 5px;
            min-height: 16px;
        }

        /* ── Confidence bars ── */
        .conf-row {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 5px;
        }

        .conf-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            color: rgba(0, 210, 255, 0.65);
            width: 14px;
            text-align: right;
            flex-shrink: 0;
        }

        .conf-bar-bg {
            flex: 1;
            height: 7px;
            background: rgba(255, 255, 255, 0.07);
            border-radius: 4px;
            overflow: hidden;
        }

        .conf-bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 4px;
            background: rgba(0, 210, 255, 0.55);
            transition: width 0.15s ease, background 0.15s;
        }

        .conf-bar-fill.top {
            background: #adff2f;
        }

        .conf-pct {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.35);
            width: 36px;
            text-align: right;
            flex-shrink: 0;
        }

        .conf-pct.top {
            color: #adff2f;
        }

        /* ── 28×28 preview ── */
        #preview-canvas {
            image-rendering: pixelated;
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 4px;
            display: block;
            margin: 0 auto;
        }

        .instrument-card.collapsed {
            padding-top: 6px !important;
            padding-bottom: 6px !important;
        }
        .td-opt:hover {
            background: rgba(0,210,255,0.15) !important;
            color: #00d2ff !important;
        }

        /* ── Status ── */
        /*
        .instrument-card.collapsible .toggle-icon {
            font-size: 0.7rem !important;
            line-height: 1 !important;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .instrument-title {
            display: flex !important;
            align-items: center !important;
            gap: 8px;
            min-height: 18px;
        }
        */

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            margin-right: 6px;
            vertical-align: middle;
        }

        .status-dot.ok {
            background: #adff2f;
            box-shadow: 0 0 6px rgba(173, 255, 47, 0.5);
        }

        .status-dot.err {
            background: #ff4444;
        }

        .status-dot.spin {
            background: var(--neon-blue, #00d2ff);
            animation: blink 0.9s ease-in-out infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.25;
            }
        }

        #model-status-text {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            vertical-align: middle;
        }

        #arch-text {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.22);
            margin-top: 6px;
            line-height: 1.5;
        }

        /* ── Start screen ── */
        #start-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 32px;
            background: rgba(10, 15, 30, 0.92);
            border-radius: 10px;
        }

        #start-overlay.hidden {
            display: none;
        }

        #start-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--neon-blue, #00d2ff);
            letter-spacing: 0.1em;
            text-align: center;
            text-shadow: 0 0 30px rgba(0, 210, 255, 0.35);
        }

        #start-sub {
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.35);
            text-align: center;
            max-width: 320px;
            line-height: 1.6;
        }

        #btn-start {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.15em;
            padding: 18px 56px;
            background: transparent;
            border: 2px solid var(--neon-blue, #00d2ff);
            color: var(--neon-blue, #00d2ff);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-shadow: 0 0 12px rgba(0, 210, 255, 0.4);
            box-shadow: 0 0 24px rgba(0, 210, 255, 0.1);
        }

        #btn-start:hover {
            background: var(--neon-blue, #00d2ff);
            color: #000;
            box-shadow: 0 0 40px rgba(0, 210, 255, 0.5);
        }
    </style>
</head>

<body>
    <nav id="mini-rail">
        <div class="nav-btn" onclick="toggleSidebar()" title="Toggle Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </div>
    </nav>

    <aside id="side-panel">
        <header id="sidebar-header"></header>
        <div id="ui-container"></div>
    </aside>

    <main id="main-content">
        <div id="canvas-container">
            <div class="cyber-grid"></div>
            <div id="math-coach-box">
                <div class="coach-title" id="coach-title-slot"></div>
                <div id="coach-content" class="coach-message"></div>
            </div>
            <div id="draw-wrap">
                <canvas id="draw-canvas" width="280" height="280"></canvas>
                <div id="train-overlay">
                    <div id="train-label">KI LERNT ZAHLEN</div>
                    <div id="train-epoch-info">Durchlauf 0 / 8</div>
                    <div id="mnist-anim-wrap" style="position:relative;width:280px;height:280px;">
                        <canvas id="mnist-anim" width="280" height="280" style="width:280px;height:280px;"></canvas>
                        <div id="load-spinner" style="display:none;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
                            <div class="squiri"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
                        </div>
                    </div>
                    <div id="mnist-anim-digit"></div>
                    <div class="train-bar-bg">
                        <div id="train-bar"></div>
                    </div>
                    <div id="train-seen-wrap" style="display:flex;flex-direction:row;align-items:center;justify-content:center;gap:10px;padding:8px 18px;border:1px solid rgba(0,210,255,0.2);border-radius:10px;background:rgba(0,210,255,0.06);margin-top:8px;align-self:center;">
                        <div id="train-seen" class="cyber-number-widget"></div>
                        <span id="train-seen-label"
                            style="font-family:'Orbitron',sans-serif;font-size:17px;color:rgba(255,255,255,0.5);letter-spacing:0.06em;">Beispiele geladen</span>
                    </div>
                    <div id="train-stopwatch-wrap" style="display:flex;flex-direction:row;align-items:center;justify-content:center;gap:8px;padding:6px 18px;border:1px solid rgba(0,210,255,0.12);border-radius:10px;background:rgba(0,210,255,0.04);margin-top:6px;align-self:center;">
                        <div id="train-stopwatch" class="cyber-number-widget"></div>
                    </div>
                    <button id="btn-training-done" onclick="finishTraining()" style="display:none;margin-top:12px;padding:10px 36px;font-family:'Orbitron',sans-serif;font-size:14px;letter-spacing:0.1em;background:rgba(173,255,47,0.12);border:1px solid rgba(173,255,47,0.5);color:#adff2f;border-radius:8px;cursor:pointer;">OK</button>
                </div>
                <div id="draw-hint"></div>
                <div id="start-overlay" class="hidden">
                    <div id="start-title">KI ZAHLENERKENNUNG</div>
                    <div id="start-sub">Die KI lernt Ziffern aus 50.000 echten Handschriften — direkt im Browser.</div>
                    <button id="btn-start" onclick="startLab()">START</button>
                </div>
            </div>
            <canvas id="canvas" style="display:none"></canvas>
        </div>
    </main>

    <script src="js/cyber-left-chrome.js"></script>
    <script src="js/branding/briefings.js"></script>
    <script src="js/branding/overlays.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/i18n-de.js"></script>
    <script src="js/i18n-en.js"></script>
    <script src="js/i18n-es.js"></script>
    <script src="js/i18n-fr.js"></script>
    <script src="js/i18n-it.js"></script>
    <script src="js/i18n-pt.js"></script>
    <script src="js/i18n-sw.js"></script>
    <script src="js/i18n-tr.js"></script>
    <script src="js/i18n-nl.js"></script>
    <script src="js/branding.js"></script>
    <script src="js/ui.js"></script>
    <script>
        // ── Local translations ──────────────────────────────────────────────────────
        const LAB_T = {
            de: {
                lab_title: 'KI Zahlenerkennung',
                card_result: 'Erkannte Ziffer',
                card_conf: 'Konfidenz-Analyse',
                card_preview: 'Modell-Eingang (28×28)',
                card_model: 'Modell',
                clear: 'LÖSCHEN',
                draw_hint: 'Zeichne eine Ziffer (0–9) — Maus oder Finger',
                nothing: 'Noch nichts gezeichnet',
                training: 'Modell wird trainiert …',
                ready: 'Zeichne eine Ziffer — Vorhersage in Echtzeit',
                predicted: 'Erkannt',
                conf: 'Konfidenz',
                arch: 'CNN · 2× Conv2D · Dense 128 · Softmax 10\nTrainiert auf 10 000 echten MNIST-Handschriften',
            },
            en: {
                lab_title: 'AI Number Recognition',
                card_result: 'Predicted Digit',
                card_conf: 'Confidence Analysis',
                card_preview: 'Model Input (28×28)',
                card_model: 'Model',
                clear: 'CLEAR',
                draw_hint: 'Draw a digit (0–9) — mouse or finger',
                nothing: 'Nothing drawn yet',
                training: 'Training model …',
                ready: 'Draw a digit — real-time prediction',
                predicted: 'Predicted',
                conf: 'Confidence',
                arch: 'CNN · 2× Conv2D · Dense 128 · Softmax 10\nTrained on 10 000 real MNIST handwriting samples',
            },
            fr: {
                lab_title: 'Reconnaissance de Chiffres IA',
                card_result: 'Chiffre Reconnu',
                card_conf: 'Analyse de Confiance',
                card_preview: 'Entrée du Modèle (28×28)',
                card_model: 'Modèle',
                clear: 'EFFACER',
                draw_hint: 'Dessine un chiffre (0–9) — souris ou doigt',
                nothing: 'Rien dessiné',
                training: 'Entraînement du modèle …',
                ready: 'Dessine un chiffre — prédiction en temps réel',
                predicted: 'Prédit',
                conf: 'Confiance',
                arch: 'CNN · 2× Conv2D · Dense 128 · Softmax 10\nEntraîné sur 10 000 échantillons MNIST réels',
            },
            nl: {
                lab_title: 'AI Cijferherkenning',
                card_result: 'Herkend Cijfer',
                card_conf: 'Vertrouwensanalyse',
                card_preview: 'Model-Ingang (28×28)',
                card_model: 'Model',
                clear: 'WISSEN',
                draw_hint: 'Teken een cijfer (0–9) — muis of vinger',
                nothing: 'Nog niets getekend',
                training: 'Model trainen …',
                ready: 'Teken een cijfer — real-time voorspelling',
                predicted: 'Voorspelling',
                conf: 'Vertrouwen',
                arch: 'CNN · 2× Conv2D · Dense 128 · Softmax 10\nGetraind op 10 000 echte MNIST-handschriften',
            },
        };

        function t(key) {
            const lang = (typeof CyberI18n !== 'undefined' ? CyberI18n.current : null) || 'de';
            return (LAB_T[lang] || LAB_T.en || LAB_T.de)[key] || (LAB_T.de)[key] || key;
        }

        // ── Shell & Branding ────────────────────────────────────────────────────────
        function toggleSidebar() {
            const panel = document.getElementById('side-panel');
            panel.classList.toggle('collapsed');
            if (window.CyberLeftChrome?.publishResolvedScale) CyberLeftChrome.publishResolvedScale();
            setTimeout(() => window.dispatchEvent(new Event('resize')), 400);
        }

        CyberBranding.init({ useExternalStyles: true, title: CyberI18n.get('ui.coach_title'), subtitle: t('lab_title') });
        CyberUI.init();
        document.getElementById('coach-title-slot').textContent = t('lab_title');
        document.getElementById('draw-hint').textContent = t('draw_hint');
        if (window.CyberLeftChrome?.configure) CyberLeftChrome.configure({ viewportOnlyZoom: true });

        const trainSampleCountStored = +(localStorage.getItem('mnist-td-count') || 50000);

        // ── Sidebar cards ───────────────────────────────────────────────────────────
        document.getElementById('ui-container').insertAdjacentHTML('beforeend', '<div id="result-cards-wrap" style="display:none"></div>');
        CyberUI.createCard('result-cards-wrap', t('card_result'), `
        <div id="result-digit" class="cyber-number-widget dim" style="display:flex;width:100%;justify-content:center;min-height:90px;"></div>
        <div id="result-conf" class="cyber-number-widget" style="display:flex;width:100%;justify-content:center;min-height:20px;margin-top:5px;"></div>
        <button class="cyber-btn" onclick="clearDraw()"
            style="width:100%;margin-top:14px;border-color:rgba(0,210,255,0.35);">
            ${t('clear')}
        </button>
    `);

        let barsHtml = '';
        for (let i = 0; i <= 9; i++) {
            barsHtml += `<div class="conf-row">
            <span class="conf-label">${i}</span>
            <div class="conf-bar-bg"><div class="conf-bar-fill" id="bar-${i}"></div></div>
            <span class="conf-pct" id="pct-${i}">—</span>
        </div>`;
        }
        CyberUI.createCard('ui-container', t('card_conf'), barsHtml + `
        <div style="display:flex;justify-content:space-between;align-items:center;
                    margin-top:10px;padding-top:8px;border-top:1px solid rgba(0,210,255,0.15);">
            <span style="font-family:'Orbitron',sans-serif;font-size:11px;color:rgba(0,210,255,0.6);letter-spacing:0.08em;">DURCHSCHNITT</span>
            <span id="conf-avg" style="font-family:'Orbitron',sans-serif;font-size:13px;color:#00d2ff;letter-spacing:0.06em;">—</span>
        </div>`);

        CyberUI.createCard('ui-container', t('card_model'), `
        <button id="btn-reset" class="cyber-btn" onclick="resetModel()"
            style="width:100%;margin-top:12px;border-color:rgba(0,210,255,0.35);transition:border-color 0.3s,box-shadow 0.3s,color 0.3s;">
            START TRAINING
        </button>
    `);
        document.getElementById('ui-container').insertAdjacentHTML('beforeend', '<div id="model-cards-wrap" style="display:none"></div>');
        CyberUI.createCard('model-cards-wrap', t('card_preview'), `
        <canvas id="preview-canvas" width="56" height="56"
            style="width:112px;height:112px;"></canvas>
    `);

        CyberUI.createCard('ui-container', 'ANZAHL TRAININGSDATEN', `
        <div id="td-dropdown" style="position:relative;user-select:none;">
            <div id="td-selected" onclick="tdToggle()"
                style="display:flex;align-items:center;justify-content:space-between;
                       padding:9px 14px;border:1px solid rgba(0,210,255,0.4);border-radius:10px;
                       background:rgba(0,210,255,0.07);cursor:pointer;
                       font-family:'Orbitron',sans-serif;font-size:14px;color:#00d2ff;
                       box-shadow:0 0 12px rgba(0,210,255,0.08);transition:border-color 0.2s;">
                <span id="td-label">${trainSampleCountStored.toLocaleString('de-DE')}</span>
                <span id="td-arrow" style="font-size:10px;transition:transform 0.2s;">▼</span>
            </div>
            <div id="td-options" style="display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;
                border:1px solid rgba(0,210,255,0.35);border-radius:10px;
                background:rgba(8,14,28,0.97);backdrop-filter:blur(20px);
                overflow:hidden;z-index:999;box-shadow:0 8px 32px rgba(0,0,0,0.6);">
                ${[100,500,1000,5000,10000,20000,30000,40000,50000].map(v =>
                    `<div class="td-opt" data-val="${v}" onclick="tdSelect(${v})"
                        style="padding:10px 14px;font-family:'Orbitron',sans-serif;font-size:14px;
                               color:${v===trainSampleCountStored?'#00d2ff':'rgba(255,255,255,0.6)'};
                               background:${v===trainSampleCountStored?'rgba(0,210,255,0.1)':'transparent'};
                               cursor:pointer;border-bottom:1px solid rgba(0,210,255,0.08);
                               transition:background 0.15s,color 0.15s;">
                        ${v.toLocaleString('de-DE')}
                    </div>`
                ).join('')}
            </div>
        </div>
    `);

        /* DEBUG-Karte auskommentiert
        CyberUI.createCard('ui-container', 'DEBUG', `
        <div id="debug-list" style="font-family:monospace;font-size:14px;line-height:2;">
            <span id="debug-empty" style="color:rgba(255,255,255,0.2);font-family:'Outfit',sans-serif;font-size:14px;">— kein Training aktiv —</span>
        </div>
    `, '#00d2ff', { collapsible: true, collapsed: true });
        */

        const coachEl = document.getElementById('coach-content');
        coachEl.textContent = t('training');

        // ── Drawing setup ───────────────────────────────────────────────────────────
        const drawCanvas = document.getElementById('draw-canvas');
        const drawCtx = drawCanvas.getContext('2d');
        let isDrawing = false;
        let hasStrokes = false;
        let wasPredicted = false;
        let model = null;
        let trainSampleCount = trainSampleCountStored;

        function tdToggle() {
            const opts = document.getElementById('td-options');
            const arrow = document.getElementById('td-arrow');
            const open = opts.style.display === 'none';
            opts.style.display = open ? 'block' : 'none';
            arrow.style.transform = open ? 'rotate(180deg)' : '';
        }
        function tdSelect(val) {
            trainSampleCount = val;
            localStorage.setItem('mnist-td-count', val);
            document.getElementById('td-label').textContent = val.toLocaleString('de-DE');
            document.querySelectorAll('.td-opt').forEach(el => {
                const active = +el.dataset.val === val;
                el.style.color = active ? '#00d2ff' : 'rgba(255,255,255,0.6)';
                el.style.background = active ? 'rgba(0,210,255,0.1)' : 'transparent';
            });

            document.getElementById('td-arrow').style.transform = '';
            const btn = document.getElementById('btn-reset');
            if (btn) {
                btn.style.borderColor = '#adff2f';
                btn.style.color = '#adff2f';
                btn.style.boxShadow = '0 0 16px rgba(173,255,47,0.4)';
            }
        }
        document.addEventListener('click', e => {
            if (!document.getElementById('td-dropdown')?.contains(e.target)) {
                const opts = document.getElementById('td-options');
                if (opts) { opts.style.display = 'none'; document.getElementById('td-arrow').style.transform = ''; }
            }
        });
        let predictTid = null;
        let animInterval = null;

        function startMnistAnim(pixels, labels, n) {
            // Zufällige Einzel-Animation für Training-Phase
            const ac = document.getElementById('mnist-anim');
            const ctx = ac.getContext('2d');
            const lbl = document.getElementById('mnist-anim-digit');
            const S = 10; // 28 × 10 = 280px
            animInterval = setInterval(() => {
                const idx = Math.floor(Math.random() * n);
                const imgData = ctx.createImageData(28, 28);
                for (let i = 0; i < 784; i++) {
                    const v = Math.round(pixels[idx * 784 + i] * 255);
                    imgData.data[i * 4] = imgData.data[i * 4 + 1] = imgData.data[i * 4 + 2] = v;
                    imgData.data[i * 4 + 3] = 255;
                }
                const off = document.createElement('canvas');
                off.width = off.height = 28;
                off.getContext('2d').putImageData(imgData, 0, 0);
                ctx.imageSmoothingEnabled = false;
                ctx.drawImage(off, 0, 0, 280, 280);
                lbl.textContent = labels[idx];
            }, 140);
        }

        // ── Sequenzielle 10×10 Thumbnail-Grid-Animation nach Phase 1 ───────────────
        function startSequentialAnim(pixels, labels, n) {
            return new Promise(resolve => {
                const ac = document.getElementById('mnist-anim');
                const ctx = ac.getContext('2d');
                const epochInfo = document.getElementById('train-epoch-info');
                const lbl = document.getElementById('mnist-anim-digit');

                // 10×10 Grid: jede Zelle = 28×28px → gesamt 280×280
                const COLS = 10, ROWS = 10, CELL = 28;
                const BATCH = COLS * ROWS; // 100 Bilder pro Frame

                // Offscreen-Buffer für das gesamte Grid
                const gridData = ctx.createImageData(280, 280);

                let idx = 0;
                let rafId = null;

                function renderFrame() {
                    if (idx >= n) {
                        epochInfo.className = 'loaded';
                        epochInfo.textContent = `Phase 2 — ✓ alle ${n.toLocaleString('de')} Bilder gezeigt`;
                        lbl.textContent = '';
                        animInterval = null;
                        resolve();
                        return;
                    }

                    // 100 Bilder in das Grid-ImageData schreiben
                    for (let b = 0; b < BATCH && idx < n; b++, idx++) {
                        const col = b % COLS;
                        const row = Math.floor(b / COLS);
                        const base = idx * 784;
                        for (let py = 0; py < CELL; py++) {
                            for (let px = 0; px < CELL; px++) {
                                const v = Math.round(pixels[base + py * CELL + px] * 255);
                                const di = ((row * CELL + py) * 280 + col * CELL + px) * 4;
                                gridData.data[di] = gridData.data[di + 1] = gridData.data[di + 2] = v;
                                gridData.data[di + 3] = 255;
                            }
                        }
                    }

                    ctx.putImageData(gridData, 0, 0);
                    epochInfo.textContent = `Phase 2 — ${Math.min(idx, n).toLocaleString('de')} / ${n.toLocaleString('de')} Bilder`;

                    rafId = requestAnimationFrame(renderFrame);
                    animInterval = rafId;
                }

                rafId = requestAnimationFrame(renderFrame);
                animInterval = rafId;
            });
        }

        function stopMnistAnim() {
            if (animInterval) {
                // Stoppt sowohl setInterval als auch requestAnimationFrame
                clearInterval(animInterval);
                cancelAnimationFrame(animInterval);
                animInterval = null;
            }
        }

        let swRaf = null, swStart = 0;
        function swFmt(ms) {
            const s = Math.floor(ms / 1000);
            const mm = String(Math.floor(s / 60)).padStart(2, '0');
            const ss = String(s % 60).padStart(2, '0');
            return mm + ':' + ss;
        }
        function startStopwatch() {
            stopStopwatch();
            swStart = performance.now();
            function tick() {
                CyberUI.updateNumberWidget('train-stopwatch', swFmt(performance.now() - swStart), 0, 0, {
                    fontSize: '17px', digitWidth: '12px', digitHeight: '23px',
                    color: '#00d2ff'
                });
                swRaf = requestAnimationFrame(tick);
            }
            swRaf = requestAnimationFrame(tick);
        }
        function stopStopwatch() {
            if (swRaf) { cancelAnimationFrame(swRaf); swRaf = null; }
        }

        function initDraw() {
            drawCtx.fillStyle = '#000';
            drawCtx.fillRect(0, 0, 280, 280);
            drawCtx.strokeStyle = '#fff';
            drawCtx.lineWidth = 22;
            drawCtx.lineCap = 'round';
            drawCtx.lineJoin = 'round';
        }

        function getPos(e) {
            const r = drawCanvas.getBoundingClientRect();
            const sx = drawCanvas.width / r.width;
            const sy = drawCanvas.height / r.height;
            const s = e.touches ? e.touches[0] : e;
            return { x: (s.clientX - r.left) * sx, y: (s.clientY - r.top) * sy };
        }

        drawCanvas.addEventListener('mousedown', e => {
            if (!model) return;
            if (wasPredicted) { clearDraw(); wasPredicted = false; }
            isDrawing = true;
            drawCtx.beginPath();
            const p = getPos(e); drawCtx.moveTo(p.x, p.y);
        });
        drawCanvas.addEventListener('mousemove', e => {
            if (!isDrawing) return;
            const p = getPos(e); drawCtx.lineTo(p.x, p.y); drawCtx.stroke();
            hasStrokes = true; schedulePred();
        });
        drawCanvas.addEventListener('mouseup', () => { isDrawing = false; });
        drawCanvas.addEventListener('mouseleave', () => { isDrawing = false; });

        drawCanvas.addEventListener('touchstart', e => {
            e.preventDefault();
            if (!model) return;
            if (wasPredicted) { clearDraw(); wasPredicted = false; }
            isDrawing = true;
            drawCtx.beginPath();
            const p = getPos(e); drawCtx.moveTo(p.x, p.y);
        }, { passive: false });
        drawCanvas.addEventListener('touchmove', e => {
            e.preventDefault();
            if (!isDrawing) return;
            const p = getPos(e); drawCtx.lineTo(p.x, p.y); drawCtx.stroke();
            hasStrokes = true; schedulePred();
        }, { passive: false });
        drawCanvas.addEventListener('touchend', () => { isDrawing = false; });

        function schedulePred() {
            clearTimeout(predictTid);
            predictTid = setTimeout(runPredict, 120);
        }

        function clearDraw() {
            initDraw();
            hasStrokes = false;
            const rd = document.getElementById('result-digit');
            rd.className = 'cyber-number-widget dim';
            rd.innerHTML = '<div class="cyber-digit-box" style="font-size:80px;width:60px;height:88px;opacity:0.18;">—</div>';
            document.getElementById('result-conf').innerHTML = '';
            for (let i = 0; i <= 9; i++) {
                const b = document.getElementById('bar-' + i);
                b.style.width = '0%'; b.classList.remove('top');
                const p = document.getElementById('pct-' + i);
                p.textContent = '—'; p.classList.remove('top');
            }
            document.getElementById('preview-canvas').getContext('2d')
                .clearRect(0, 0, 56, 56);
            coachEl.textContent = t('ready');
        }

        // ── Bounding-box crop → centered square (matches MNIST preprocessing) ───────
        function getCroppedCanvas(src) {
            const w = src.width, h = src.height;
            const data = src.getContext('2d').getImageData(0, 0, w, h).data;
            let minX = w, maxX = -1, minY = h, maxY = -1;
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    if (data[(y * w + x) * 4] > 10) {
                        if (x < minX) minX = x;
                        if (x > maxX) maxX = x;
                        if (y < minY) minY = y;
                        if (y > maxY) maxY = y;
                    }
                }
            }
            if (maxX < 0) return null;
            const bw = maxX - minX + 1;
            const bh = maxY - minY + 1;
            const pad = Math.max(Math.round(Math.max(bw, bh) * 0.25), 14);
            const size = Math.max(bw, bh) + pad * 2;
            const off = document.createElement('canvas');
            off.width = off.height = size;
            const ctx = off.getContext('2d');
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, size, size);
            ctx.drawImage(src, minX, minY, bw, bh,
                Math.round((size - bw) / 2), Math.round((size - bh) / 2), bw, bh);
            return off;
        }

        // ── Inference ───────────────────────────────────────────────────────────────
        function runPredict() {
            if (!model || !hasStrokes) return;
            const cropped = getCroppedCanvas(drawCanvas);
            if (!cropped) return;
            tf.tidy(() => {
                const tensor = tf.browser
                    .fromPixels(cropped, 1)
                    .resizeBilinear([28, 28])
                    .toFloat().div(255.0);
                updatePreview(tensor);
                const probs = Array.from(
                    model.predict(tensor.expandDims(0)).dataSync()
                );
                updateBars(probs);
            });
        }

        function updatePreview(t28) {
            const pv = document.getElementById('preview-canvas');
            const ctx = pv.getContext('2d');
            const d = t28.dataSync();
            const img = ctx.createImageData(28, 28);
            for (let i = 0; i < 784; i++) {
                const v = Math.round(d[i] * 255);
                img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v;
                img.data[i * 4 + 3] = 255;
            }
            const off = document.createElement('canvas');
            off.width = off.height = 28;
            off.getContext('2d').putImageData(img, 0, 0);
            ctx.clearRect(0, 0, 56, 56);
            ctx.drawImage(off, 0, 0, 56, 56);
        }

        function barColor(v) {
            return `hsl(${Math.round(Math.pow(v / 100, 2) * 120)}, 85%, 50%)`;
        }

        function updateBars(probs) {
            const top = probs.indexOf(Math.max(...probs));
            for (let i = 0; i <= 9; i++) {
                const v = probs[i] * 100;
                const pct = v.toFixed(1);
                const color = barColor(v);
                const b = document.getElementById('bar-' + i);
                b.style.width = pct + '%';
                b.style.background = color;
                b.classList.remove('top');
                const p = document.getElementById('pct-' + i);
                p.textContent = pct + '%';
                p.style.color = color;
                p.classList.remove('top');
            }
            const rdEl = document.getElementById('result-digit');
            rdEl.className = 'cyber-number-widget';
            CyberUI.updateNumberWidget('result-digit', top, 0, 1, {
                fontSize: '80px', digitWidth: '60px', digitHeight: '88px',
                color: '#adff2f', textShadow: '0 0 40px rgba(173,255,47,0.5)'
            });
            const c = (probs[top] * 100).toFixed(1);
            CyberUI.updateNumberWidget('result-conf', parseFloat(c), 1, 2, {
                fontSize: '12px', digitWidth: '8px', digitHeight: '18px',
                color: 'rgba(255,255,255,0.45)'
            });
            coachEl.textContent = `${t('predicted')}: ${top}  ·  ${t('conf')}: ${c}%`;
            wasPredicted = true;
        }

        // ── MNIST data loading (real handwritten digits) ────────────────────────────
        // Sprite: 784 px wide × 65 000 px tall — each row = one 28×28 image flattened
        // Cache-Busting: ?nocache=<timestamp> verhindert Browser-HTTP-Cache
        const MNIST_BASE_IMG = 'https://storage.googleapis.com/learnjs-data/model-builder/mnist_images.png';
        const MNIST_BASE_LAB = 'https://storage.googleapis.com/learnjs-data/model-builder/mnist_labels_uint8';
        const PER_CLASS = 5000;  // balanced: 5 000 × 10 classes = 50 000 total

        async function loadMNIST(onStatus, onProgress) {
            // Cache-Busting-Timestamp für diese Session
            const cb = `?nocache=${Date.now()}`;
            const MNIST_IMG_URL = MNIST_BASE_IMG + cb;
            const MNIST_LAB_URL = MNIST_BASE_LAB + cb;

            // 1. Labels first — file is one-hot encoded: 10 bytes per sample → 650 000 bytes total
            onStatus('Labels laden …');
            await tf.nextFrame();
            const labRes = await fetch(MNIST_LAB_URL, { cache: 'no-store' });
            const rawBytes = new Uint8Array(await labRes.arrayBuffer());
            const NUM_SAMPLES = rawBytes.length / 10; // 65 000
            const allLabels = new Uint8Array(NUM_SAMPLES);
            for (let i = 0; i < NUM_SAMPLES; i++) {
                for (let j = 0; j < 10; j++) {
                    if (rawBytes[i * 10 + j] === 1) { allLabels[i] = j; break; }
                }
            }

            // 2. Balanced index selection — 5 000 per class, scanning in order
            const buckets = Array.from({ length: 10 }, () => []);
            for (let i = 0; i < NUM_SAMPLES; i++) {
                const c = allLabels[i];
                if (buckets[c].length < PER_CLASS) buckets[c].push(i);
                if (buckets.every(b => b.length >= PER_CLASS)) break;
            }
            const selected = buckets.flat().sort((a, b) => a - b);
            const maxRow = selected[selected.length - 1];

            // 3. Image sprite — via fetch() um Browser-Cache zu umgehen
            onStatus('Bilder laden …');
            await tf.nextFrame();
            const imgRes = await fetch(MNIST_IMG_URL, { cache: 'no-store' });
            const imgBlob = await imgRes.blob();
            const imgBlobUrl = URL.createObjectURL(imgBlob);
            const img = new Image();
            img.crossOrigin = '';
            await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = imgBlobUrl; });
            URL.revokeObjectURL(imgBlobUrl); // Speicher freigeben

            // 4. Extract only the rows we need
            onStatus('Pixeldaten extrahieren …');
            await tf.nextFrame();
            const canvas = document.createElement('canvas');
            canvas.width = 784;
            canvas.height = maxRow + 1;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, 784, maxRow + 1, 0, 0, 784, maxRow + 1);
            const raw = ctx.getImageData(0, 0, 784, maxRow + 1).data;

            const n = selected.length;
            const pixels = new Float32Array(n * 784);
            const labels = new Uint8Array(n);
            const REF_PER_CLASS = 100;
            const refSamples = Array.from({ length: 10 }, () => []); // 100 samples per class

            // Chunked extraction — yield every 1000 samples so browser can render
            const CHUNK = 1000;
            for (let dst = 0; dst < n; dst++) {
                const srcRow = selected[dst];
                const cls = allLabels[srcRow];
                for (let px = 0; px < 784; px++)
                    pixels[dst * 784 + px] = raw[(srcRow * 784 + px) * 4] / 255;
                labels[dst] = cls;
                if (refSamples[cls].length < REF_PER_CLASS)
                    refSamples[cls].push(pixels.slice(dst * 784, dst * 784 + 784));
                if ((dst + 1) % CHUNK === 0) {
                    if (onProgress) onProgress(dst + 1, n, pixels);
                    await tf.nextFrame();
                }
            }
            if (onProgress) onProgress(n, n, pixels);

            return { pixels, labels, n, refSamples, REF_PER_CLASS };
        }

        // ── Model definition & training ─────────────────────────────────────────────
        function buildModel() {
            const m = tf.sequential({
                layers: [
                    tf.layers.conv2d({
                        inputShape: [28, 28, 1], filters: 16, kernelSize: 3,
                        activation: 'relu', padding: 'same'
                    }),
                    tf.layers.maxPooling2d({ poolSize: 2 }),
                    tf.layers.conv2d({ filters: 32, kernelSize: 3, activation: 'relu', padding: 'same' }),
                    tf.layers.maxPooling2d({ poolSize: 2 }),
                    tf.layers.flatten(),
                    tf.layers.dropout({ rate: 0.25 }),
                    tf.layers.dense({ units: 128, activation: 'relu' }),
                    tf.layers.dense({ units: 10, activation: 'softmax' }),
                ]
            });
            m.compile({
                optimizer: tf.train.adam(0.001),
                loss: 'categoricalCrossentropy', metrics: ['accuracy']
            });
            return m;
        }

        const IDB_KEY = 'indexeddb://cyber-mnist-cnn-v3'; // v3: 50 000 samples

        // ── Geladene Daten — global gespeichert für späteres Training ───────────
        let mnistData = null; // { pixels, labels, n, refSamples }

        async function trainAndReady() {
            const overlay   = document.getElementById('train-overlay');
            const bar       = document.getElementById('train-bar');
            const epochInfo = document.getElementById('train-epoch-info');
            const seenLabel = document.getElementById('train-seen-label');

            // ── IDB-Cache prüfen (vor Overlay) ───────────────────────────────────
            stopMnistAnim();
            startStopwatch();
            mnistData = null;
            drawCanvas.classList.add('disabled');
            try {
                const cached = await tf.io.listModels();
                if (IDB_KEY in cached) {
                    dbgLog('IDB-Cache gefunden — Modell laden');
                    model = await tf.loadLayersModel(IDB_KEY);
                    dbgLog('Modell aus IDB geladen');
                    showModelCards();
                    coachEl.textContent = t('ready');
                    drawCanvas.classList.remove('disabled');
                    return;
                }
            } catch (_) { /* kein Cache oder Fehler → normal trainieren */ }

            // ── Reset UI für Training ─────────────────────────────────────────────
            document.getElementById('btn-training-done').style.display = 'none';
            bar.style.cssText     = 'width:0%;background:#adff2f;transition:width 0.3s ease;';
            epochInfo.className   = '';
            epochInfo.textContent = 'Phase 1 — Daten laden …';
            document.getElementById('mnist-anim-digit').textContent = '';
            document.getElementById('mnist-anim').getContext('2d').clearRect(0, 0, 280, 280);
            document.getElementById('load-spinner').style.display = 'flex';
            seenLabel.textContent = 'Beispiele geladen';
            seenLabel.style.color = 'rgba(255,255,255,0.35)';
            CyberUI.updateNumberWidget('train-seen', 0, 0, 6, {
                fontSize: '17px', digitWidth: '12px', digitHeight: '23px',
                color: 'rgba(255,255,255,0.35)', thousandsSep: true
            });
            overlay.classList.add('visible');

            // Zwei Frames warten bis display:flex wirklich gerendert ist
            await new Promise(r => requestAnimationFrame(r));
            await new Promise(r => requestAnimationFrame(r));

            dbgLog('Phase 1 start — Daten laden');

            // ── PHASE 1: Daten laden — echte Fortschrittsbalken ──────────────────
            // onStatus → epochInfo-Text live aktualisieren
            // onProgress → echter Balken basierend auf geladenen Samples
            try {
                mnistData = await loadMNIST(
                    (statusText) => {
                        epochInfo.textContent = 'Phase 1 — ' + statusText;
                        if (statusText.includes('extra')) {
                            document.getElementById('load-spinner').style.display = 'none';
                        }
                    },
                    (done, total, currentPixels) => {
                        const pct = Math.round((done / total) * 100);
                        bar.style.width = pct + '%';
                        seenLabel.style.color = '#adff2f';
                        seenLabel.style.textShadow = '0 0 10px rgba(173,255,47,0.6)';
                        CyberUI.updateNumberWidget('train-seen', done, 0, 6, {
                            fontSize: '17px', digitWidth: '12px', digitHeight: '23px',
                            color: '#adff2f', textShadow: '0 0 10px rgba(173,255,47,0.6)', thousandsSep: true
                        });
                        
                        // Zeichne 10x10 Grid der aktuell geladenen Daten
                        const ac = document.getElementById('mnist-anim');
                        const ctx = ac.getContext('2d');
                        const COLS = 10, ROWS = 10, CELL = 28;
                        const BATCH = COLS * ROWS;
                        const gridData = ctx.createImageData(280, 280);
                        const startIdx = Math.max(0, done - BATCH);
                        
                        for (let b = 0; b < BATCH; b++) {
                            const idx = startIdx + b;
                            const col = b % COLS;
                            const row = Math.floor(b / COLS);
                            const base = idx * 784;
                            for (let py = 0; py < CELL; py++) {
                                for (let px = 0; px < CELL; px++) {
                                    const v = Math.round(currentPixels[base + py * CELL + px] * 255);
                                    const di = ((row * CELL + py) * 280 + col * CELL + px) * 4;
                                    gridData.data[di] = gridData.data[di + 1] = gridData.data[di + 2] = v;
                                    gridData.data[di + 3] = 255;
                                }
                            }
                        }
                        ctx.putImageData(gridData, 0, 0);
                    }
                );
            } catch (err) {
                overlay.classList.remove('visible');
                drawCanvas.classList.remove('disabled');
                coachEl.textContent = 'MNIST-Daten konnten nicht geladen werden.';
                console.error('[ANN Lab] MNIST load failed:', err);
                return;
            }

            // ── PHASE 1 FERTIG → direkt Training ─────────────────────────────────
            const { n } = mnistData;
            dbgLog(`Phase 1 fertig — ${n} Beispiele geladen`);
            bar.style.transition = 'none';
            bar.style.width = '100%';
            await new Promise(r => requestAnimationFrame(r));
            document.getElementById('load-spinner').style.display = 'none';

            // ── Phase 2: Training ─────────────────────────────────────────────────
            const EPOCHS = 8;
            const { pixels, labels, n: nTrain } = mnistData;
            const N = Math.min(trainSampleCount, nTrain);
            dbgLog('Phase 3 start — Training');

            model = buildModel();

            const xs = tf.tensor4d(pixels.slice(0, N * 784), [N, 28, 28, 1]);
            const ys = tf.oneHot(
                tf.tensor1d(Int32Array.from(labels.slice(0, N)), 'int32'), 10
            ).toFloat();

            bar.style.cssText = 'width:0%;background:#00d2ff;transition:width 0.5s ease;';
            epochInfo.className   = 'running';
            epochInfo.textContent = 'Phase 3 — Training startet …';
            coachEl.textContent   = 'Modell wird trainiert …';
            seenLabel.textContent = 'Beispiele trainiert';
            seenLabel.style.color = '#00d2ff';
            CyberUI.updateNumberWidget('train-seen', 0, 0, 6, {
                fontSize: '17px', digitWidth: '12px', digitHeight: '23px', color: '#00d2ff', thousandsSep: true
            });
            startMnistAnim(pixels, labels, N);

            const N_ACTUAL = N;
            const batchesPerEpoch = Math.ceil(N_ACTUAL / 256);
            const { refSamples, REF_PER_CLASS } = mnistData;
            let currentEpoch = 0;
            let epochStartTime = 0.0;
            const accSum = new Array(10).fill(0);
            let lastClassAcc = new Array(10).fill(0);
            let avgAccSum = 0, avgAccCount = 0;

            function computeAndShowClassAcc(epochForAccum) {
                lastClassAcc = tf.tidy(() => {
                    const flat = new Float32Array(10 * REF_PER_CLASS * 784);
                    for (let i = 0; i < 10; i++)
                        refSamples[i].forEach((s, k) => flat.set(s, (i * REF_PER_CLASS + k) * 784));
                    const batch = tf.tensor4d(flat, [10 * REF_PER_CLASS, 28, 28, 1]);
                    const preds = model.predict(batch).argMax(1).arraySync();
                    return Array.from({ length: 10 }, (_, i) => {
                        const slice = preds.slice(i * REF_PER_CLASS, (i + 1) * REF_PER_CLASS);
                        return slice.filter(p => p === i).length / REF_PER_CLASS;
                    });
                });
                // akkumulierter Durchschnitt über alle Messungen
                const batchAvg = lastClassAcc.reduce((s, v) => s + v, 0) / 10;
                avgAccSum += batchAvg;
                avgAccCount++;
                const avgPct = (avgAccSum / avgAccCount) * 100;
                const avgEl = document.getElementById('conf-avg');
                if (avgEl) { avgEl.textContent = avgPct.toFixed(1) + ' %'; avgEl.style.color = barColor(avgPct); }

                if (epochForAccum === null) {
                    // intra-epoch: zeige Rohwert in Slidern
                    for (let i = 0; i < 10; i++) {
                        const v = lastClassAcc[i] * 100;
                        const b = document.getElementById('bar-' + i);
                        const p = document.getElementById('pct-' + i);
                        b.style.width = v.toFixed(1) + '%';
                        b.classList.remove('top');
                        b.style.background = barColor(v);
                        if (p) { p.textContent = v.toFixed(1) + '%'; p.classList.remove('top'); p.style.color = barColor(v); }
                    }
                }
            }
            await model.fit(xs, ys, {
                epochs: EPOCHS,
                batchSize: 256,
                callbacks: {
                    onEpochBegin: async (epoch) => {
                        currentEpoch = epoch;
                        epochStartTime = performance.now();
                        epochInfo.textContent = `Phase 3 — Trainingsdurchlauf ${epoch + 1} von ${EPOCHS}`;
                        bar.style.transition = 'none';
                        bar.style.width = `${Math.round(epoch / EPOCHS * 100)}%`;
                        await tf.nextFrame();
                    },
                    onBatchEnd: async (batch, logs) => {
                        const epochFrac = (currentEpoch + (batch + 1) / batchesPerEpoch) / EPOCHS;
                        bar.style.transition = 'none';
                        bar.style.width = `${Math.min(100, Math.round(epochFrac * 100))}%`;
                        const trained = Math.min((currentEpoch * N_ACTUAL) + (batch + 1) * 256, (currentEpoch + 1) * N_ACTUAL);
                        CyberUI.updateNumberWidget('train-seen', trained, 0, 6, {
                            fontSize: '17px', digitWidth: '12px', digitHeight: '23px', color: '#00d2ff', thousandsSep: true
                        });
                        if ((batch + 1) % 5 === 0) {
                            computeAndShowClassAcc(null);
                        }
                        await tf.nextFrame();
                    },
                    onEpochEnd: async (epoch) => {
                        const ms = performance.now() - epochStartTime;
                        dbgLog(`Epoch ${epoch + 1}  ${ms.toFixed(3)} ms`);
                        bar.style.transition = 'none';
                        bar.style.width = `${Math.round((epoch + 1) / EPOCHS * 100)}%`;
                        computeAndShowClassAcc(epoch);
                        for (let i = 0; i < 10; i++) {
                            accSum[i] += lastClassAcc[i];
                            const v = (accSum[i] / (epoch + 1)) * 100;
                            const color = barColor(v);
                            const b = document.getElementById('bar-' + i);
                            const p = document.getElementById('pct-' + i);
                            b.style.width = v.toFixed(1) + '%';
                            b.classList.remove('top');
                            b.style.background = color;
                            if (p) { p.textContent = v.toFixed(1) + '%'; p.classList.remove('top'); p.style.color = color; }
                        }
                        await tf.nextFrame();
                    }
                }
            });

            xs.dispose(); ys.dispose();
            stopMnistAnim();
            stopStopwatch();

            try { await model.save(IDB_KEY); dbgLog('Modell in IDB gespeichert'); } catch (_) {}

            epochInfo.className   = 'loaded';
            epochInfo.textContent = 'Phase 3 — Fertig ✓';
            bar.style.transition  = 'none';
            bar.style.width       = '100%';

            document.getElementById('btn-training-done').style.display = 'inline-block';
        }

        function showModelCards() {
            document.getElementById('result-cards-wrap').style.display = '';
            document.getElementById('model-cards-wrap').style.display = '';
        }



        function finishTraining() {
            document.getElementById('btn-training-done').style.display = 'none';
            const overlay = document.getElementById('train-overlay');
            showModelCards();
            coachEl.textContent = t('ready');
            overlay.classList.remove('visible');
            drawCanvas.classList.remove('disabled');
        }

        async function resetModel() {
            const btn = document.getElementById('btn-reset');
            if (btn) { btn.style.borderColor = ''; btn.style.color = ''; btn.style.boxShadow = ''; }
            try {
                await tf.io.removeModel(IDB_KEY);
            } catch (_) { /* wasn't cached */ }
            if (model) { model.dispose(); model = null; }
            document.getElementById('result-cards-wrap').style.display = 'none';
            document.getElementById('model-cards-wrap').style.display = 'none';

            clearDraw();
            coachEl.textContent = t('training');
            initDraw();
            dbgT0 = Date.now();
            trainAndReady();
        }

        function dbgLog(msg) {
            const t = Date.now() - dbgT0;
            console.log(`+${t}ms  ${msg}`);
            const dbg = document.getElementById('debug-list');
            if (!dbg) return;
            const placeholder = document.getElementById('debug-empty');
            if (placeholder) placeholder.remove();
            const line = document.createElement('div');
            line.style.cssText = 'color:#00d2ff;';
            line.textContent = msg;
            dbg.appendChild(line);
        }
        let dbgT0 = 0;

        function startLab() {
            dbgT0 = Date.now();
            dbgLog('START geklickt');
            document.getElementById('start-overlay').classList.add('hidden');
            trainAndReady();
        }

        // ── Boot ────────────────────────────────────────────────────────────────────
        initDraw();

        // IDB-Cache prüfen: wenn Modell vorhanden → direkt laden, sonst Start-Overlay zeigen
        (async () => {
            try {
                const cached = await tf.io.listModels();
                if (IDB_KEY in cached) {
                    dbgT0 = Date.now();
                    trainAndReady();
                    return;
                }
            } catch (_) {}
            document.getElementById('start-overlay').classList.remove('hidden');
        })();
    </script>
</body>
