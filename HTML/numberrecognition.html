<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOC ALVERS MATHE-LABORE | KI Zahlenerkennung</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="resources/favicon.png">
    <link rel="stylesheet" href="js/cyber-layout.css">
    <link rel="stylesheet" href="js/buttons-ultra.css">
    <link rel="stylesheet" href="js/cyber-lab-overrides.css">
    <link rel="stylesheet" href="js/branding.styles.extracted.css">
    <link rel="stylesheet" href="js/lab-shell-minimal.css">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
    <style>
        :root { --side-width: 340px; }

        /* ── Drawing canvas ── */
        #draw-canvas {
            display: block;
            background: #000;
            cursor: crosshair;
            border-radius: 10px;
            border: 2px solid rgba(0, 210, 255, 0.5);
            box-shadow: 0 0 24px rgba(0, 210, 255, 0.12);
            touch-action: none;
            max-width: 100%;
        }
        #draw-canvas.disabled { opacity: 0.35; cursor: not-allowed; }

        #draw-wrap {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 80px 20px 20px;
            box-sizing: border-box;
        }
        #draw-hint {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 0.04em;
            text-align: center;
        }

        /* ── Training progress overlay ── */
        #train-overlay {
            display: none;
            position: absolute;
            inset: 0;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            background: rgba(10, 15, 30, 0.88);
            border-radius: 10px;
            padding: 24px;
            box-sizing: border-box;
        }
        #train-overlay.visible { display: flex; }
        #train-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            color: var(--neon-blue, #00d2ff);
            letter-spacing: 0.08em;
        }
        .train-bar-bg {
            width: 100%;
            max-width: 240px;
            height: 6px;
            background: rgba(255,255,255,0.08);
            border-radius: 3px;
            overflow: hidden;
        }
        #train-bar {
            height: 100%;
            width: 0%;
            background: var(--neon-blue, #00d2ff);
            border-radius: 3px;
            transition: width 0.3s ease;
        }
        #train-stats {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.45);
            text-align: center;
            min-height: 16px;
        }

        /* ── Prediction display ── */
        #result-digit {
            font-family: 'Orbitron', sans-serif;
            font-size: 80px;
            font-weight: 700;
            text-align: center;
            line-height: 1;
            color: #adff2f;
            text-shadow: 0 0 40px rgba(173, 255, 47, 0.5);
            min-height: 90px;
            transition: color 0.15s;
        }
        #result-digit.dim { color: rgba(255,255,255,0.18); text-shadow: none; }
        #result-conf {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
            margin-top: 5px;
            min-height: 16px;
        }

        /* ── Confidence bars ── */
        .conf-row {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 5px;
        }
        .conf-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            color: rgba(0, 210, 255, 0.65);
            width: 14px;
            text-align: right;
            flex-shrink: 0;
        }
        .conf-bar-bg {
            flex: 1;
            height: 7px;
            background: rgba(255,255,255,0.07);
            border-radius: 4px;
            overflow: hidden;
        }
        .conf-bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 4px;
            background: rgba(0, 210, 255, 0.55);
            transition: width 0.15s ease, background 0.15s;
        }
        .conf-bar-fill.top { background: #adff2f; }
        .conf-pct {
            font-size: 10px;
            color: rgba(255,255,255,0.35);
            width: 36px;
            text-align: right;
            flex-shrink: 0;
        }
        .conf-pct.top { color: #adff2f; }

        /* ── 28×28 preview ── */
        #preview-canvas {
            image-rendering: pixelated;
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 4px;
            display: block;
            margin: 0 auto;
        }

        /* ── Status ── */
        .status-dot {
            display: inline-block;
            width: 8px; height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            margin-right: 6px;
            vertical-align: middle;
        }
        .status-dot.ok   { background: #adff2f; box-shadow: 0 0 6px rgba(173,255,47,0.5); }
        .status-dot.err  { background: #ff4444; }
        .status-dot.spin { background: var(--neon-blue, #00d2ff); animation: blink 0.9s ease-in-out infinite; }
        @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.25; } }
        #model-status-text { font-size: 11px; color: rgba(255,255,255,0.5); vertical-align: middle; }
        #arch-text { font-size: 9px; color: rgba(255,255,255,0.22); margin-top: 6px; line-height: 1.5; }
    </style>
</head>

<body>
    <nav id="mini-rail">
        <div class="nav-btn" onclick="toggleSidebar()" title="Toggle Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </div>
    </nav>

    <aside id="side-panel">
        <header id="sidebar-header"></header>
        <div id="ui-container"></div>
    </aside>

    <main id="main-content">
        <div id="canvas-container">
            <div class="cyber-grid"></div>
            <div id="math-coach-box">
                <div class="coach-title" id="coach-title-slot"></div>
                <div id="coach-content" class="coach-message"></div>
            </div>
            <div id="draw-wrap">
                <canvas id="draw-canvas" width="280" height="280"></canvas>
                <div id="train-overlay">
                    <div id="train-label">TRAINING …</div>
                    <div class="train-bar-bg"><div id="train-bar"></div></div>
                    <div id="train-stats"></div>
                </div>
                <div id="draw-hint"></div>
            </div>
            <canvas id="canvas" style="display:none"></canvas>
        </div>
    </main>

    <script src="js/cyber-left-chrome.js"></script>
    <script src="js/branding/briefings.js"></script>
    <script src="js/branding/overlays.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/i18n-de.js"></script>
    <script src="js/i18n-en.js"></script>
    <script src="js/i18n-es.js"></script>
    <script src="js/i18n-fr.js"></script>
    <script src="js/i18n-it.js"></script>
    <script src="js/i18n-pt.js"></script>
    <script src="js/i18n-sw.js"></script>
    <script src="js/i18n-tr.js"></script>
    <script src="js/i18n-nl.js"></script>
    <script src="js/branding.js"></script>
    <script src="js/ui.js"></script>
    <script>
    // ── Local translations ──────────────────────────────────────────────────────
    const LAB_T = {
        de: {
            lab_title:    'KI Zahlenerkennung',
            card_result:  'Erkannte Ziffer',
            card_conf:    'Konfidenz-Analyse',
            card_preview: 'Modell-Eingang (28×28)',
            card_model:   'Modell',
            clear:        'LÖSCHEN',
            draw_hint:    'Zeichne eine Ziffer (0–9) — Maus oder Finger',
            nothing:      'Noch nichts gezeichnet',
            training:     'Modell wird trainiert …',
            ready:        'Zeichne eine Ziffer — Vorhersage in Echtzeit',
            predicted:    'Erkannt',
            conf:         'Konfidenz',
            arch:         'CNN · 2× Conv2D + MaxPool · Dense 64 · Softmax 10\n1 500 synthetische Trainingsbeispiele',
        },
        en: {
            lab_title:    'AI Number Recognition',
            card_result:  'Predicted Digit',
            card_conf:    'Confidence Analysis',
            card_preview: 'Model Input (28×28)',
            card_model:   'Model',
            clear:        'CLEAR',
            draw_hint:    'Draw a digit (0–9) — mouse or finger',
            nothing:      'Nothing drawn yet',
            training:     'Training model …',
            ready:        'Draw a digit — real-time prediction',
            predicted:    'Predicted',
            conf:         'Confidence',
            arch:         'CNN · 2× Conv2D + MaxPool · Dense 64 · Softmax 10\n1 500 synthetic training samples',
        },
        fr: {
            lab_title:    'Reconnaissance de Chiffres IA',
            card_result:  'Chiffre Reconnu',
            card_conf:    'Analyse de Confiance',
            card_preview: 'Entrée du Modèle (28×28)',
            card_model:   'Modèle',
            clear:        'EFFACER',
            draw_hint:    'Dessine un chiffre (0–9) — souris ou doigt',
            nothing:      'Rien dessiné',
            training:     'Entraînement du modèle …',
            ready:        'Dessine un chiffre — prédiction en temps réel',
            predicted:    'Prédit',
            conf:         'Confiance',
            arch:         'CNN · 2× Conv2D + MaxPool · Dense 64 · Softmax 10\n1 500 échantillons synthétiques',
        },
        nl: {
            lab_title:    'AI Cijferherkenning',
            card_result:  'Herkend Cijfer',
            card_conf:    'Vertrouwensanalyse',
            card_preview: 'Model-Ingang (28×28)',
            card_model:   'Model',
            clear:        'WISSEN',
            draw_hint:    'Teken een cijfer (0–9) — muis of vinger',
            nothing:      'Nog niets getekend',
            training:     'Model trainen …',
            ready:        'Teken een cijfer — real-time voorspelling',
            predicted:    'Voorspelling',
            conf:         'Vertrouwen',
            arch:         'CNN · 2× Conv2D + MaxPool · Dense 64 · Softmax 10\n1 500 synthetische trainingssamples',
        },
    };

    function t(key) {
        const lang = (typeof CyberI18n !== 'undefined' ? CyberI18n.current : null) || 'de';
        return (LAB_T[lang] || LAB_T.en || LAB_T.de)[key] || (LAB_T.de)[key] || key;
    }

    // ── Shell & Branding ────────────────────────────────────────────────────────
    function toggleSidebar() {
        const panel = document.getElementById('side-panel');
        panel.classList.toggle('collapsed');
        if (window.CyberLeftChrome?.publishResolvedScale) CyberLeftChrome.publishResolvedScale();
        setTimeout(() => window.dispatchEvent(new Event('resize')), 400);
    }

    CyberBranding.init({ useExternalStyles: true, title: CyberI18n.get('ui.coach_title'), subtitle: t('lab_title') });
    CyberUI.init();
    document.getElementById('coach-title-slot').textContent = t('lab_title');
    document.getElementById('draw-hint').textContent = t('draw_hint');
    if (window.CyberLeftChrome?.configure) CyberLeftChrome.configure({ viewportOnlyZoom: true });

    // ── Sidebar cards ───────────────────────────────────────────────────────────
    CyberUI.createCard('ui-container', t('card_result'), `
        <div id="result-digit" class="dim">—</div>
        <div id="result-conf">${t('nothing')}</div>
        <button class="cyber-btn" onclick="clearDraw()"
            style="width:100%;margin-top:14px;border-color:rgba(0,210,255,0.35);">
            ${t('clear')}
        </button>
    `);

    let barsHtml = '';
    for (let i = 0; i <= 9; i++) {
        barsHtml += `<div class="conf-row">
            <span class="conf-label">${i}</span>
            <div class="conf-bar-bg"><div class="conf-bar-fill" id="bar-${i}"></div></div>
            <span class="conf-pct" id="pct-${i}">—</span>
        </div>`;
    }
    CyberUI.createCard('ui-container', t('card_conf'), barsHtml);

    CyberUI.createCard('ui-container', t('card_preview'), `
        <canvas id="preview-canvas" width="56" height="56"
            style="width:112px;height:112px;"></canvas>
    `);

    CyberUI.createCard('ui-container', t('card_model'), `
        <div style="margin-bottom:5px;">
            <span class="status-dot spin" id="status-dot"></span>
            <span id="model-status-text">${t('training')}</span>
        </div>
        <div id="arch-text">${t('arch').replace('\n','<br>')}</div>
    `);

    const coachEl = document.getElementById('coach-content');
    coachEl.textContent = t('training');

    // ── Drawing setup ───────────────────────────────────────────────────────────
    const drawCanvas = document.getElementById('draw-canvas');
    const drawCtx    = drawCanvas.getContext('2d');
    let isDrawing    = false;
    let hasStrokes   = false;
    let model        = null;
    let predictTid   = null;

    function initDraw() {
        drawCtx.fillStyle = '#000';
        drawCtx.fillRect(0, 0, 280, 280);
        drawCtx.strokeStyle = '#fff';
        drawCtx.lineWidth   = 22;
        drawCtx.lineCap     = 'round';
        drawCtx.lineJoin    = 'round';
    }

    function getPos(e) {
        const r  = drawCanvas.getBoundingClientRect();
        const sx = drawCanvas.width  / r.width;
        const sy = drawCanvas.height / r.height;
        const s  = e.touches ? e.touches[0] : e;
        return { x: (s.clientX - r.left) * sx, y: (s.clientY - r.top) * sy };
    }

    drawCanvas.addEventListener('mousedown', e => {
        if (!model) return;
        isDrawing = true;
        drawCtx.beginPath();
        const p = getPos(e); drawCtx.moveTo(p.x, p.y);
    });
    drawCanvas.addEventListener('mousemove', e => {
        if (!isDrawing) return;
        const p = getPos(e); drawCtx.lineTo(p.x, p.y); drawCtx.stroke();
        hasStrokes = true; schedulePred();
    });
    drawCanvas.addEventListener('mouseup',    () => { isDrawing = false; });
    drawCanvas.addEventListener('mouseleave', () => { isDrawing = false; });

    drawCanvas.addEventListener('touchstart', e => {
        e.preventDefault();
        if (!model) return;
        isDrawing = true;
        drawCtx.beginPath();
        const p = getPos(e); drawCtx.moveTo(p.x, p.y);
    }, { passive: false });
    drawCanvas.addEventListener('touchmove', e => {
        e.preventDefault();
        if (!isDrawing) return;
        const p = getPos(e); drawCtx.lineTo(p.x, p.y); drawCtx.stroke();
        hasStrokes = true; schedulePred();
    }, { passive: false });
    drawCanvas.addEventListener('touchend', () => { isDrawing = false; });

    function schedulePred() {
        clearTimeout(predictTid);
        predictTid = setTimeout(runPredict, 120);
    }

    function clearDraw() {
        initDraw();
        hasStrokes = false;
        document.getElementById('result-digit').textContent = '—';
        document.getElementById('result-digit').className   = 'dim';
        document.getElementById('result-conf').textContent  = t('nothing');
        for (let i = 0; i <= 9; i++) {
            const b = document.getElementById('bar-' + i);
            b.style.width = '0%'; b.classList.remove('top');
            const p = document.getElementById('pct-' + i);
            p.textContent = '—'; p.classList.remove('top');
        }
        document.getElementById('preview-canvas').getContext('2d')
            .clearRect(0, 0, 56, 56);
        coachEl.textContent = t('ready');
    }

    // ── Inference ───────────────────────────────────────────────────────────────
    function runPredict() {
        if (!model || !hasStrokes) return;
        tf.tidy(() => {
            // [280,280,1] → resize → [28,28,1] → add batch → [1,28,28,1]
            const tensor = tf.browser
                .fromPixels(drawCanvas, 1)
                .resizeBilinear([28, 28])
                .toFloat().div(255.0);

            updatePreview(tensor);

            const probs = Array.from(
                model.predict(tensor.expandDims(0)).softmax().dataSync()
            );
            updateBars(probs);
        });
    }

    function updatePreview(t28) {
        const pv  = document.getElementById('preview-canvas');
        const ctx = pv.getContext('2d');
        const d   = t28.dataSync();
        const img = ctx.createImageData(28, 28);
        for (let i = 0; i < 784; i++) {
            const v = Math.round(d[i] * 255);
            img.data[i*4] = img.data[i*4+1] = img.data[i*4+2] = v;
            img.data[i*4+3] = 255;
        }
        const off = document.createElement('canvas');
        off.width = off.height = 28;
        off.getContext('2d').putImageData(img, 0, 0);
        ctx.clearRect(0, 0, 56, 56);
        ctx.drawImage(off, 0, 0, 56, 56);
    }

    function updateBars(probs) {
        const top = probs.indexOf(Math.max(...probs));
        for (let i = 0; i <= 9; i++) {
            const pct = (probs[i] * 100).toFixed(1);
            const b   = document.getElementById('bar-' + i);
            b.style.width = pct + '%';
            b.classList.toggle('top', i === top);
            const p = document.getElementById('pct-' + i);
            p.textContent = pct + '%';
            p.classList.toggle('top', i === top);
        }
        document.getElementById('result-digit').textContent = top;
        document.getElementById('result-digit').className   = '';
        const c = (probs[top] * 100).toFixed(1);
        document.getElementById('result-conf').textContent  = c + '%';
        coachEl.textContent = `${t('predicted')}: ${top}  ·  ${t('conf')}: ${c}%`;
    }

    // ── Synthetic data generation ───────────────────────────────────────────────
    const FONTS  = ['Arial', 'Georgia', 'Courier New', 'Verdana', 'Impact',
                    'Trebuchet MS', 'Palatino Linotype', 'serif', 'monospace'];
    const STYLES = ['normal', 'bold', 'italic', 'bold italic'];
    const SIZES  = [16, 18, 20, 22, 24, 26];
    const EXAMPLES_PER_CLASS = 150; // 10 × 150 = 1500 total

    function renderExample(digit) {
        const off = document.createElement('canvas');
        off.width = off.height = 28;
        const ctx = off.getContext('2d');

        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, 28, 28);

        const font  = FONTS [Math.floor(Math.random() * FONTS.length)];
        const style = STYLES[Math.floor(Math.random() * STYLES.length)];
        const size  = SIZES [Math.floor(Math.random() * SIZES.length)];
        const dx    = (Math.random() - 0.5) * 5;
        const dy    = (Math.random() - 0.5) * 5;
        const angle = (Math.random() - 0.5) * 28 * Math.PI / 180;

        ctx.save();
        ctx.translate(14 + dx, 14 + dy);
        ctx.rotate(angle);

        if (Math.random() < 0.25) {
            ctx.shadowColor = '#fff';
            ctx.shadowBlur  = 1 + Math.random() * 2;
        }

        ctx.fillStyle   = '#fff';
        ctx.font        = `${style} ${size}px ${font}`;
        ctx.textAlign   = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(digit), 0, 0);
        ctx.restore();

        // pixel noise
        const id = ctx.getImageData(0, 0, 28, 28);
        for (let i = 0; i < id.data.length; i += 4) {
            const n = (Math.random() - 0.5) * 28;
            id.data[i]   = Math.max(0, Math.min(255, id.data[i]   + n));
            id.data[i+1] = Math.max(0, Math.min(255, id.data[i+1] + n));
            id.data[i+2] = Math.max(0, Math.min(255, id.data[i+2] + n));
        }
        ctx.putImageData(id, 0, 0);

        const pixels = new Float32Array(784);
        const data   = ctx.getImageData(0, 0, 28, 28).data;
        for (let i = 0; i < 784; i++) pixels[i] = data[i * 4] / 255;
        return pixels;
    }

    function buildDataset() {
        const n     = EXAMPLES_PER_CLASS * 10;
        const xs    = new Float32Array(n * 784);
        const ys    = new Int32Array(n);
        let idx     = 0;
        for (let d = 0; d <= 9; d++) {
            for (let k = 0; k < EXAMPLES_PER_CLASS; k++) {
                xs.set(renderExample(d), idx * 784);
                ys[idx] = d;
                idx++;
            }
        }
        // shuffle
        for (let i = n - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            // swap labels
            [ys[i], ys[j]] = [ys[j], ys[i]];
            // swap image rows
            const tmp = xs.slice(i * 784, (i + 1) * 784);
            xs.copyWithin(i * 784, j * 784, (j + 1) * 784);
            xs.set(tmp, j * 784);
        }
        return { xs, ys, n };
    }

    // ── Model definition & training ─────────────────────────────────────────────
    function buildModel() {
        const m = tf.sequential({ layers: [
            tf.layers.conv2d({ inputShape: [28, 28, 1], filters: 16, kernelSize: 3, activation: 'relu', padding: 'same' }),
            tf.layers.maxPooling2d({ poolSize: 2 }),
            tf.layers.conv2d({ filters: 32, kernelSize: 3, activation: 'relu', padding: 'same' }),
            tf.layers.maxPooling2d({ poolSize: 2 }),
            tf.layers.flatten(),
            tf.layers.dropout({ rate: 0.25 }),
            tf.layers.dense({ units: 128, activation: 'relu' }),
            tf.layers.dense({ units: 10,  activation: 'softmax' }),
        ]});
        m.compile({ optimizer: tf.train.adam(0.001), loss: 'categoricalCrossentropy', metrics: ['accuracy'] });
        return m;
    }

    async function trainAndReady() {
        const overlay = document.getElementById('train-overlay');
        const bar     = document.getElementById('train-bar');
        const stats   = document.getElementById('train-stats');
        const label   = document.getElementById('train-label');

        drawCanvas.classList.add('disabled');
        overlay.classList.add('visible');
        label.textContent = t('training').toUpperCase();

        // Generate synthetic data
        stats.textContent = 'Generating training data …';
        await tf.nextFrame();
        const { xs, ys, n } = buildDataset();

        const xTensor = tf.tensor4d(xs, [n, 28, 28, 1]);
        const yTensor = tf.oneHot(tf.tensor1d(ys, 'int32'), 10).toFloat();

        const EPOCHS = 12;
        model = buildModel();

        await model.fit(xTensor, yTensor, {
            epochs:          EPOCHS,
            batchSize:       64,
            validationSplit: 0.1,
            shuffle:         true,
            callbacks: {
                onEpochEnd: async (epoch, logs) => {
                    const pct = Math.round(((epoch + 1) / EPOCHS) * 100);
                    bar.style.width = pct + '%';
                    stats.textContent =
                        `Epoch ${epoch + 1}/${EPOCHS}  ·  ` +
                        `acc ${(logs.acc * 100).toFixed(1)}%  ·  ` +
                        `loss ${logs.loss.toFixed(3)}`;
                    await tf.nextFrame();
                }
            }
        });

        xTensor.dispose();
        yTensor.dispose();

        // Warmup
        tf.tidy(() => model.predict(tf.zeros([1, 28, 28, 1])));

        overlay.classList.remove('visible');
        drawCanvas.classList.remove('disabled');
        document.getElementById('status-dot').className = 'status-dot ok';
        document.getElementById('model-status-text').textContent = '✓ Trained · ready';
        coachEl.textContent = t('ready');
    }

    // ── Boot ────────────────────────────────────────────────────────────────────
    initDraw();
    trainAndReady();
    </script>
</body>
