<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>PAGODE · BLE Remote</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        /* Standalone BLE hardware-test tool for the DSD TECH 2-channel BLE relay (SH-HC-08, FFE0/FFE1, A0-cmds).
           On-brand: dark blue (never black), Orbitron, green action buttons (never orange). This page IS the
           content the Capacitor test-APK will wrap — see Solita_goes_Pagode.md §5.1. */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: rgb(8, 20, 42);
            --panel: rgb(14, 36, 78);
            --green: rgb(121, 158, 49);
            --green-hi: rgb(150, 196, 60);
            --red: rgb(176, 36, 24);
            --orange: rgb(245, 194, 66);
            --ink: #e8eefc;
            --muted: #8fa0c4;
        }

        body {
            font-family: 'Orbitron', sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            padding: 22px 16px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        header { text-align: center; }
        h1 { font-size: 20px; font-weight: 900; letter-spacing: 3px; }
        .sub { font-size: 11px; letter-spacing: 2px; color: var(--muted); margin-top: 4px; text-transform: uppercase; }

        .wrap { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 16px; }

        /* connection state circle INSIDE the Verbinden button */
        .conn-dot { width: 15px; height: 15px; border-radius: 50%; flex: 0 0 auto; background: var(--red); box-shadow: 0 0 7px rgba(176, 36, 24, .6); transition: background .2s, box-shadow .2s; }
        .conn-dot.on { background: var(--green-hi); box-shadow: 0 0 9px var(--green-hi); }
        .conn-dot.busy { background: var(--orange); box-shadow: 0 0 9px var(--orange); }

        button {
            font-family: 'Orbitron', sans-serif; font-weight: 800; letter-spacing: 2px;
            border: none; border-radius: 12px; cursor: pointer; color: var(--ink);
            padding: 16px; font-size: 15px; transition: transform .05s, filter .15s, background .15s;
            -webkit-tap-highlight-color: transparent; touch-action: manipulation;
        }
        button:active { transform: scale(0.97); }
        button:disabled { opacity: .4; cursor: not-allowed; }

        .btn-connect { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--panel); color: var(--ink); border: 1px solid #2c4a86; }

        /* secondary action: get the native APK (BLE without the HTTPS/secure-context constraint). */
        .btn-download {
            display: block; width: 100%; text-align: center; text-decoration: none;
            background: var(--panel); color: var(--ink); border: 1px solid #2c4a86;
            padding: 16px; border-radius: 12px; font-family: 'Orbitron', sans-serif;
            font-weight: 800; letter-spacing: 2px; font-size: 14px;
            transition: transform .05s, filter .15s;
        }
        .btn-download:hover { filter: brightness(1.12); }
        .btn-download:active { transform: scale(0.97); }
        .btn-download small { display: block; font-weight: 400; letter-spacing: 1px; font-size: 10px; color: var(--muted); margin-top: 4px; text-transform: none; }

        .card {
            background: var(--panel); border-radius: 14px; padding: 14px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .card h2 { font-size: 13px; letter-spacing: 2px; color: var(--orange); font-weight: 800; }
        .card .role { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
        .row { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 8px; }
        .btn-on { background: var(--green); }
        .btn-on:hover { filter: brightness(1.1); }
        .btn-off { background: #34507f; }
        .btn-pulse { background: var(--green); filter: brightness(.92); }
        /* single hold button for both channels (no pulse): green=START holds K1, red=STOP holds K2 */
        .btn-power { width: 100%; padding: 22px; font-size: 20px; font-weight: 800; letter-spacing: 2px;
            background: var(--green); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
        .btn-power.is-stop { background: #9e362a; }
        .btn-power:active { filter: brightness(1.15); }

        /* log */
        .log {
            background: rgb(6, 16, 34); border-radius: 12px; padding: 12px;
            font-family: 'Menlo', 'Consolas', monospace; font-size: 12px; line-height: 1.5;
            color: var(--muted); height: 168px; overflow-y: auto; white-space: pre-wrap; word-break: break-word;
            scrollbar-width: thin; scrollbar-color: #2c4a86 transparent;
        }
        .log .ok { color: var(--green-hi); }
        .log .err { color: #e8736a; }
        .log .tx { color: var(--orange); }

        .hint { font-size: 11px; color: var(--muted); text-align: center; line-height: 1.6; }
        code { background: rgba(255,255,255,.06); padding: 1px 5px; border-radius: 4px; font-size: 11px; }
    </style>
    <link rel="icon" type="image/svg+xml" href="../resources/favicon.svg">
    <link rel="icon" type="image/png" sizes="256x256" href="../resources/favicon.png">
</head>

<body>
    <header>
        <h1>PAGODE · BLE REMOTE</h1>
        <div class="sub">DSD TECH 2-Kanal · SH-HC-08</div>
    </header>

    <div class="wrap">
        <button class="btn-connect" id="btn-connect" type="button">
            <span class="conn-dot" id="conn-dot"></span>
            <span id="btn-connect-txt">Verbinden</span>
        </button>

        <!-- ONE button for both channels: HOLD = relay ON (no pulse), release = OFF; role flips START <-> STOP -->
        <div class="card">
            <div class="role" id="power-role">START · Kanal 1 · Klemme 50 · Anlasser</div>
            <button class="btn-power" id="btn-power" type="button" disabled>START — halten</button>
        </div>

        <div class="log" id="log" aria-label="Protokoll" role="log"></div>

        <div class="hint">
            Web Bluetooth (Chrome/Android/Desktop) <b>oder</b> APK (BLE-Plugin) — automatisch erkannt.<br>
            Protokoll: Service <code>0xFFE0</code> · Char <code>0xFFE1</code> · Befehle <code>A0…</code>
        </div>

        <a class="btn-download" href="doc-alvers-pagode.apk" download="doc-alvers-pagode.apk">⬇ APK HERUNTERLADEN<small>native App — Bluetooth ohne HTTPS, läuft auch im Auto</small></a>
    </div>

    <!-- shared BLE protocol + transport (single source for both Pagode pages + the APK) -->
    <script src="js/pagode-ble.js"></script>
    <script>
        'use strict';

        // ---- protocol + BLE transport live in the shared single source js/pagode-ble.js ----------------------
        const CFG = PagodeBLE.CFG;   // FFE0/FFE1 + A0 relay commands
        const PULSE_MS = 900;        // momentary pulse length (crank / stop) — page policy

        // ---- tiny log + status UI ----------------------------------------------------------------------------
        const logEl = document.getElementById('log');
        const connDot = document.getElementById('conn-dot');
        function log(msg, cls) {
            const t = new Date().toLocaleTimeString('de-DE');
            const line = document.createElement('div');
            if (cls) line.className = cls;
            line.textContent = t + '  ' + msg;
            logEl.appendChild(line);
            logEl.scrollTop = logEl.scrollHeight;
        }
        function setStatus(state) { connDot.className = 'conn-dot' + (state ? ' ' + state : ''); }
        const hex = (a) => a.map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');
        const sleep = (ms) => new Promise(r => setTimeout(r, ms));

        // ---- BLE transport comes from the shared single source (js/pagode-ble.js) ----------------------------
        let backend = null;   // { name, connect(), write(bytes), disconnect() } — from PagodeBLE.createBackend()

        // ---- wiring ------------------------------------------------------------------------------------------
        const btnConnect = document.getElementById('btn-connect');
        let connected = false, busy = false;

        const btnConnectTxt = document.getElementById('btn-connect-txt');
        const btnPower = document.getElementById('btn-power');
        const powerRole = document.getElementById('power-role');
        function markConnected(on) {
            connected = on;
            btnConnectTxt.textContent = on ? 'Trennen' : 'Verbinden';
            btnPower.disabled = !on;
        }
        markConnected(false);

        // ONE button, both channels: HOLD = relay ON (no pulse), release = OFF; role flips START(K1) <-> STOP(K2).
        let running = false, holding = false;
        function updatePower() {
            btnPower.textContent = (running ? 'STOP' : 'START') + ' — halten';
            btnPower.classList.toggle('is-stop', running);
            powerRole.textContent = running ? 'STOP · Kanal 2 · Zündung unterbrechen' : 'START · Kanal 1 · Klemme 50 · Anlasser';
        }
        async function powerDown(e) {
            e.preventDefault();
            if (!connected || holding) return;
            holding = true; setStatus('busy');
            const on = running ? 'K2_ON' : 'K1_ON';
            try { await backend.write(CFG.CMD[on]); log('TX ' + on + '  [' + hex(CFG.CMD[on]) + ']  (halten)', 'tx'); }
            catch (err) { holding = false; setStatus('on'); log('Fehler: ' + (err.message || err), 'err'); }
        }
        async function powerUp() {
            if (!holding) return;
            holding = false; setStatus('on');
            const off = running ? 'K2_OFF' : 'K1_OFF';
            try { await backend.write(CFG.CMD[off]); log('TX ' + off + '  [' + hex(CFG.CMD[off]) + ']  (los)', 'tx'); }
            catch (err) { log('Fehler: ' + (err.message || err), 'err'); return; }
            running = !running; updatePower();
        }

        btnConnect.addEventListener('click', async () => {
            if (connected) { await backend.disconnect(); markConnected(false); setStatus('', 'getrennt'); log('getrennt'); return; }
            // build the right backend (user gesture → requestDevice is allowed here)
            backend = PagodeBLE.createBackend({
                onDisconnect() { setStatus('', 'getrennt'); markConnected(false); log('Verbindung getrennt', 'err'); }
            });
            if (!backend) { log('Web Bluetooth nicht verfügbar — braucht HTTPS oder localhost + Chrome (Android/Desktop), nicht Safari/iOS. Über http://LAN-IP geht es NICHT.', 'err'); return; }
            setStatus('busy', 'verbinde…'); log('verbinde via ' + backend.name + '…');
            try {
                const name = await backend.connect();
                markConnected(true); setStatus('on', 'verbunden'); log('verbunden mit ' + name, 'ok');
            } catch (e) {
                setStatus('', 'getrennt'); log('Verbindung fehlgeschlagen: ' + (e.message || e), 'err');
            }
        });

        btnPower.addEventListener('pointerdown', powerDown);
        btnPower.addEventListener('pointerup', powerUp);
        btnPower.addEventListener('pointerleave', powerUp);
        btnPower.addEventListener('pointercancel', powerUp);
        updatePower();

        log('Bereit. Transport: ' + (PagodeBLE.isNative ? 'Capacitor BLE-Plugin (APK)' : (navigator.bluetooth ? 'Web Bluetooth (Browser)' : 'KEINER — kein BLE')) + '.');
    </script>
</body>

</html>
