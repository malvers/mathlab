<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>230 SL · Pagode</title>
    <!-- Vintage typography (Doc explicitly asked for a vintage look → not Orbitron here):
         Playfair Display = elegant 1960s Didone for the badge, Cinzel = engraved Roman caps for the knobs. -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
    <style>
        /* ---- Car version: two beautiful buttons (START / STOP) in a 1964 Mercedes 230 SL "Pagode" dashboard
           style — ivory panel, chrome bezels, deep navy leather backdrop (no harsh black). Same BLE backend
           (FFE0/FFE1, A0 commands) as the diagnostic page; the connect step is folded into the first press so
           only the two knobs remain. ---- */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --navy: rgb(14, 36, 78);          /* deep vintage navy leather (project dark, not black) */
            --navy-deep: rgb(8, 20, 42);
            --ivory: #efe6cf;                 /* dashboard ivory */
            --ivory-sh: #d9cda9;
            --ink: #2b2a26;                   /* warm anthracite text */
            --green: #6f9a34;                 /* φ-grün, vertieft */
            --red: rgb(176, 36, 24);          /* Υ-rot */
            --amber: rgb(245, 194, 66);       /* λ-orange (idiot light) */
            --chrome-hi: #fdfefe;
            --chrome: #c9cdd2;
            --chrome-lo: #7b818a;
            /* golden frames (knob rings + panel bezel) */
            --gold-hi: #fff3d0;
            --gold: #e7c873;
            --gold-lo: #9c7a2e;
            --gold-deep: #6e521d;
        }

        body {
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 26px 16px; color: var(--ink);
            font-family: 'Playfair Display', Georgia, serif;
        }

        /* ---- switchable backdrops — press "b" to cycle, choice persists ---- */
        body.bg-navy {
            background:
                radial-gradient(120% 90% at 50% 8%, rgba(40, 64, 110, .55), transparent 60%),
                radial-gradient(140% 120% at 50% 120%, rgba(0, 0, 0, .45), transparent 55%),
                var(--navy);
            background-attachment: fixed;
        }
        /* Dark brown leather (1960s Pagode interior). Uses a REAL leather photo when present at leder-braun.jpg;
           until then a warm dark-leather CSS fallback shows. Drop the photo into HTML/pagode/ and it slots in. */
        body.bg-sand {
            background-color: #2a1c0f;
            background-image:
                url('leder-braun.jpg'),
                radial-gradient(120% 110% at 50% 14%, #4a3320, transparent 55%),
                radial-gradient(130% 120% at 50% 120%, rgba(0, 0, 0, .58), transparent 55%),
                linear-gradient(0deg, #1c1208, #33230f);
            background-size: cover, auto, auto, auto;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .toast {
            position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
            background: rgba(20, 14, 8, .88); color: var(--ivory);
            font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
            padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, .16);
            opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 50;
        }
        .toast.show { opacity: 1; }

        /* the dashboard panel — snakeskin fascia (real reptile-leather photo).
           A soft dark overlay over the skin keeps the engraved cream text legible. */
        .dash {
            width: 100%; max-width: 400px;
            background:
                linear-gradient(180deg, rgba(8, 12, 20, .52), rgba(8, 12, 20, .24) 42%, rgba(8, 12, 20, .48)),
                url('snakeskin.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 22px;
            padding: 30px 26px 26px;
            /* golden rim + soft depth */
            box-shadow:
                0 0 0 2px #7a611f,
                0 0 0 7px var(--gold),
                0 0 0 8px var(--gold-lo),
                0 22px 50px rgba(0, 0, 0, .55),
                inset 0 2px 6px rgba(255, 240, 205, .3);
            text-align: center;
        }

        /* badge */
        /* truly ENGRAVED (incised) gold lettering: dark shadow at the TOP edge (the cut recedes),
           bright gold lip at the BOTTOM edge (catches the light) — the inverse of an embossed bevel. */
        .badge-model { font-size: 38px; font-weight: 700; letter-spacing: 1px; line-height: 1; color: #ac8e45; text-shadow: 0 -1px 1px rgba(0, 0, 0, .95), 0 -2px 2px rgba(0, 0, 0, .45), 0 1px 0 rgba(255, 243, 205, .62); }
        .badge-name {
            font-family: 'Cinzel', serif; font-weight: 700; font-size: 15px; letter-spacing: 7px;
            margin-top: 8px; color: #a98e49; padding-left: 7px; text-shadow: 0 -1px 1px rgba(0, 0, 0, .95), 0 1px 0 rgba(255, 240, 198, .58);
        }
        .badge-year { font-style: italic; font-size: 13px; color: #9f8650; margin-top: 4px; text-shadow: 0 -1px 1px rgba(0, 0, 0, .9), 0 1px 0 rgba(255, 240, 198, .52); }

        .rule {
            height: 2px; margin: 18px auto 6px; max-width: 240px;
            background: linear-gradient(90deg, transparent, #d0b772, transparent);
        }

        /* connection telltale — a 1960s brass dashboard indicator lamp: a glass lens in a brass bezel.
           pale red = getrennt · lit green = verbunden · amber = verbinde… (no text — the lamp says it) */
        .lamp-row {
            display: flex; align-items: center; justify-content: center;
            margin: 30px 0 12px; padding: 8px; cursor: pointer; user-select: none;
        }
        .lamp {
            width: 15px; height: 15px; border-radius: 50%; flex: none;
            background: radial-gradient(circle at 42% 36%, #c07268, #99413a 52%, #632a25 92%);
            box-shadow:
                0 0 0 2px var(--gold-deep),
                0 0 0 4px var(--gold),
                0 0 0 5px rgba(0, 0, 0, .55),
                inset 0 1px 1px rgba(255, 255, 255, .14),
                inset 0 -2px 3px rgba(0, 0, 0, .6);
            transition: background .3s;
        }
        .lamp-row.on .lamp {
            background: radial-gradient(circle at 42% 36%, #4a9a63, #2b6f43 52%, #10402a 92%);
        }
        .lamp-row.busy .lamp {
            background: radial-gradient(circle at 42% 36%, #dcb64f, #b9871f 54%, #79540e 92%);
        }
        .lamp-label { font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 3px; color: #c7b692; text-transform: uppercase; text-shadow: 0 1px 2px rgba(0, 0, 0, .7); }

        /* the two knobs — sitting directly on the snakeskin fascia */
        .knobs { display: flex; flex-direction: column; align-items: center; gap: 26px; margin-top: 5vh; }
        .knob {
            width: 188px; height: 188px; border-radius: 50%; border: none; cursor: pointer;
            position: relative; padding: 9px; /* the gold ring thickness */
            background:
                radial-gradient(circle at 50% 22%, var(--gold-hi), var(--gold) 42%, var(--gold-lo) 72%, #f3e2af 86%, var(--gold-deep));
            box-shadow: 0 10px 22px rgba(0, 0, 0, .45), inset 0 2px 3px rgba(255, 244, 210, .9);
            transition: transform .06s ease, box-shadow .12s;
            -webkit-tap-highlight-color: transparent; touch-action: none; user-select: none; -webkit-user-select: none;
        }
        .knob .face {
            width: 100%; height: 100%; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Cinzel', serif; font-weight: 700; font-size: 30px; letter-spacing: 4px;
            color: #e3d5a2;
            /* engraved (incised): dark top edge, light lower lip — a touch deeper */
            text-shadow: 0 -1px 1px rgba(0, 0, 0, .7), 0 -2px 2px rgba(0, 0, 0, .35), 0 1px 0 rgba(255, 255, 255, .4);
            box-shadow: inset 0 -6px 14px rgba(0, 0, 0, .5), inset 0 7px 14px rgba(255, 255, 255, .25);
        }
        /* English racing green (START) and dark oxblood red (STOP) */
        .knob.start .face { background: radial-gradient(circle at 50% 34%, #357a4c, #103f27 56%, #06281a); }
        .knob.stop  .face { background: radial-gradient(circle at 50% 34%, #9e362a, #65140d 56%, #380a06); }

        .knob:active { transform: translateY(2px) scale(.985); box-shadow: 0 5px 12px rgba(0, 0, 0, .45), inset 0 2px 3px rgba(255, 255, 255, .9); }
        .knob:active .face { box-shadow: inset 0 6px 16px rgba(0, 0, 0, .6), inset 0 -3px 8px rgba(255, 255, 255, .12); }
        .knob:disabled { cursor: not-allowed; filter: grayscale(.55) brightness(.92); opacity: .8; }

        /* status line */
        .statusline {
            margin-top: 22px; font-style: italic; font-size: 13px; color: #cbbb91; min-height: 20px; text-shadow: 0 1px 2px rgba(0, 0, 0, .7);
        }

        .foot { margin-top: 14px; font-family: 'Cinzel', serif; font-size: 9px; letter-spacing: 2px; color: #bdab80; text-transform: uppercase; text-shadow: 0 1px 2px rgba(0, 0, 0, .7); }
    </style>
</head>

<body class="bg-sand">
    <div class="toast" id="toast"></div>
    <div class="dash">
        <div class="badge-model">230 SL</div>
        <div class="badge-name">Pagode</div>
        <div class="badge-year">Baujahr 1964</div>

        <div class="rule"></div>

        <div class="knobs">
            <button class="knob start" id="btn-power" type="button" aria-label="Motor starten und stoppen — gedrückt halten"><span class="face">START</span></button>
        </div>

        <div class="lamp-row" id="lamp-row" title="Tippen zum Verbinden">
            <span class="lamp"></span>
        </div>

        <div class="foot">Solita in der Fahrschule</div>
    </div>

    <!-- shared BLE protocol + transport (single source for both Pagode pages + the APK) -->
    <script src="js/pagode-ble.js"></script>
    <script>
        'use strict';

        // ---- protocol + BLE transport live in the shared single source js/pagode-ble.js ----------------------
        const CFG = PagodeBLE.CFG;   // FFE0/FFE1 + A0 relay commands

        const lampRow = document.getElementById('lamp-row');
        const btn = document.getElementById('btn-power');

        function setLamp(state) { lampRow.className = 'lamp-row' + (state ? ' ' + state : ''); }

        // ---- BLE transport comes from the shared single source (js/pagode-ble.js) ----------------------------
        let backend = null, connected = false;

        async function ensureConnected() {
            if (connected) return true;
            backend = PagodeBLE.createBackend({ onDisconnect() { connected = false; setLamp('', 'getrennt'); } });
            if (!backend) { setLamp('', 'kein BLE'); return false; }
            setLamp('busy', 'verbinde…');
            try { await backend.connect(); connected = true; setLamp('on', 'verbunden'); return true; }
            catch (e) { connected = false; setLamp('', 'getrennt'); return false; }
        }

        // ---- ONE button: HOLD = relay ON (no pulse), release = OFF. Role flips each cycle:
        //   running=false → START (green, holds K1 = Anlasser). running=true → STOP (red, holds K2 = Zündung). ----
        let running = false, holding = false;
        function updateBtn() {
            btn.className = 'knob ' + (running ? 'stop' : 'start');
            btn.querySelector('.face').textContent = running ? 'STOP' : 'START';
        }
        async function press() {
            if (!connected) { ensureConnected(); return; }   // first touch just connects; hold again to act
            if (holding) return;
            holding = true;
            try { await backend.write(running ? CFG.CMD.K2_ON : CFG.CMD.K1_ON); }
            catch (e) { holding = false; connected = false; setLamp('', 'getrennt'); }
        }
        async function release() {
            if (!holding) return;
            holding = false;
            try { await backend.write(running ? CFG.CMD.K2_OFF : CFG.CMD.K1_OFF); }
            catch (e) { connected = false; setLamp('', 'getrennt'); return; }
            running = !running; updateBtn();
        }
        btn.addEventListener('pointerdown', (e) => { e.preventDefault(); press(); });
        btn.addEventListener('pointerup', release);
        btn.addEventListener('pointerleave', release);
        btn.addEventListener('pointercancel', release);
        lampRow.addEventListener('click', () => { if (!connected) ensureConnected(); });
        updateBtn();

        // ---- switchable backdrop: press "b" to cycle; choice persists in localStorage ----
        const BGS = [
            { cls: 'bg-sand', name: 'Braun-Leder' },
            { cls: 'bg-navy', name: 'Navy-Leder' }
        ];
        const toast = document.getElementById('toast');
        let bgIdx = BGS.findIndex(b => b.cls === localStorage.getItem('pagode-bg'));
        if (bgIdx < 0) bgIdx = 0;
        function applyBg(withToast) {
            document.body.className = BGS[bgIdx].cls;
            localStorage.setItem('pagode-bg', BGS[bgIdx].cls);
            if (withToast) {
                toast.textContent = 'Hintergrund: ' + BGS[bgIdx].name;
                toast.classList.add('show');
                clearTimeout(applyBg._t); applyBg._t = setTimeout(() => toast.classList.remove('show'), 1400);
            }
        }
        applyBg(false);
        document.addEventListener('keydown', (e) => {
            if ((e.key === 'b' || e.key === 'B') && !e.metaKey && !e.ctrlKey && !e.altKey) {
                bgIdx = (bgIdx + 1) % BGS.length; applyBg(true);
            }
        });
    </script>
</body>

</html>
