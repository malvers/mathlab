<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Start address of the colour picker's app window (~/Applications/tailwind-palette.app,
     Shift+C in the plan). Chrome keeps an app window's position and size under a name
     made from this URL; a dot in it ("tailwind-palette.html") nests the saved entry and
     Chrome never finds it again (Doc, 19.09.2026: "pos und size persist" - "nein, tut es
     nicht"). So the app starts here and moves on to the picker. -->
<title>Tailwind-Palette</title>
<style>html, body { background: rgb(26, 26, 28); margin: 0; }</style>
<script>location.replace('/tailwind-palette.html');</script>
</head>
</html>
