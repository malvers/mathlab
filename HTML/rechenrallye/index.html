<!doctype html>
<!-- generated by docpad/tools/rallye_web.mjs from docpad/web/rallye.html - edit there, not here -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rechen-Rallye</title>
<!-- The Rechen-Rallye on a page of its own, filling the window (Doc 04.10.2026: "das Spiel mal auf einer normalen Webseite ...
     dass ich es in groß sehe", then "auf index ... eine Kachel ... Spiele ... Pack das da mit drin"). The same files as in
     DOCPAD - rallye.js, quiz.js, quiz.css, fonts.css -, only another frame: #calc is the container the cards' cqw sizes refer
     to (as wide as a big calculator, by the window's height), #screen the whole window. A start menu: the small times or
     division table first (20 right in 2 minutes, then the ride with the high-score list) or a free ride (no quiz, no list,
     1 - 9 jump to a level). ?level=5 or ?frei=1 go straight into the free ride (for showing it); ?ton=1 switches the tones
     on; ?lang=en for English. docalvers.de gets a copy made by tools/rallye_web.mjs - edit this one. -->
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="quiz.css">
<style>
  :root { --lcd: #f7f8f3; --lcd-font: 'Raleway', 'Helvetica Neue', Arial, sans-serif; --ink: rgb(25, 52, 130); --or: rgb(245, 194, 66); }
  html, body { margin: 0; height: 100%; background: #1b1d22; color: #f7f8f3; font-family: var(--lcd-font); overflow: hidden; }
  [hidden] { display: none !important; }
  #calc { container-type: inline-size; width: clamp(480px, 88vh, 1100px); height: 0; }
  #screen { position: fixed; inset: 0; }
  /* the start menu: over the game's own mountains */
  #menu { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
    background: linear-gradient(rgba(16, 24, 44, .25), rgba(16, 24, 44, .55)), url(rallye/alps.webp) center 30% / cover no-repeat; }
  .rm-card { width: min(560px, 100%); box-sizing: border-box; padding: 34px 32px 28px; border-radius: 22px; text-align: center;
    background: rgba(247, 248, 243, .95); color: var(--ink); box-shadow: 0 18px 60px rgba(0, 0, 0, .45); }
  .rm-title { font: 700 clamp(30px, 6vw, 42px) 'Orbitron', sans-serif; letter-spacing: .03em; }
  .rm-sub { margin: 14px auto 24px; max-width: 30em; font-size: 17px; line-height: 1.5; font-weight: 500; }
  .rm-buttons { display: flex; flex-direction: column; gap: 12px; align-items: stretch; max-width: 340px; margin: 0 auto; }
  .rm-buttons button { font: 600 20px var(--lcd-font); padding: 14px 20px; border-radius: 40px; border: 0; cursor: pointer;
    background: var(--or); color: var(--ink); transition: transform .15s, box-shadow .15s; }
  .rm-buttons button:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(245, 194, 66, .45); }
  .rm-buttons button.plain { background: rgba(25, 52, 130, .08); }
  .rm-buttons button.plain:hover { box-shadow: 0 6px 18px rgba(25, 52, 130, .2); }
  .rm-note { margin-top: 14px; font-size: 14px; color: #7a8294; }
  .rm-home { display: inline-block; margin-top: 18px; font: 700 13px 'Orbitron', sans-serif; letter-spacing: .06em; color: #7a8294; text-decoration: none; }
  .rm-home:hover { color: var(--ink); }
</style>
</head>
<body>
<div id="calc"><div id="screen"></div></div>
<div id="menu" hidden>
  <div class="rm-card">
    <div class="rm-title">Rechen-Rallye</div>
    <div class="rm-sub" data-t="sub"></div>
    <div class="rm-buttons">
      <button type="button" data-go="1x1" data-t="mul"></button>
      <button type="button" data-go="1d1" data-t="div"></button>
      <button type="button" data-go="free" class="plain" data-t="free"></button>
    </div>
    <div class="rm-note" data-t="note"></div>
    <a class="rm-home" href="https://docalvers.de/">Doc Alvers Mathe-Labor</a>
  </div>
</div>
<script src="vendor/katex/katex.min.js"></script>
<script src="rallye.js"></script>
<script src="quiz.js"></script>
<script>
  (function () {
    'use strict';
    const q = new URLSearchParams(location.search);
    const lang = q.get('lang') ? (q.get('lang') === 'de' ? 'de' : 'en') : (/^de/i.test(navigator.language || 'de') ? 'de' : 'en');
    const ton = q.get('ton') === '1', startLevel = Math.min(Math.max(+q.get('level') || 1, 1), 9);
    const TEXT = {
      de: { sub: 'Rechne dich ins Rennen: 20 Aufgaben richtig in 2 Minuten – dann geht es auf die Strecke, mit Hitliste.',
        mul: 'Kleines 1⋅1', div: 'Kleines 1÷1', free: 'Freie Fahrt', note: 'Freie Fahrt: ohne Quiz und ohne Hitliste – 1 bis 9 springt ins Level' },
      en: { sub: 'Calculate your way into the race: 20 right in 2 minutes – then onto the track, with a high-score list.',
        mul: '1×1 times tables', div: '1÷1 division tables', free: 'Free ride', note: 'Free ride: no quiz, no high scores – 1 to 9 jump to a level' }
    };
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach(e => { e.textContent = TEXT[lang][e.dataset.t]; });
    const menu = document.getElementById('menu');
    const quiz = CPQuiz.create({ screen: document.getElementById('screen'), lang: () => lang, sound: () => ton,
      tex: s => katex.renderToString(s, { throwOnError: false }), rally: { startLevel } });
    function go(what) { menu.hidden = true; if (what === 'free') quiz.show(); else quiz.open(what); }
    // the layer's ✕ or Clear ends quiz and game: back to the menu
    new MutationObserver(() => { menu.hidden = quiz.isOpen(); }).observe(document.getElementById('screen'), { childList: true });
    menu.addEventListener('click', ev => { const b = ev.target.closest('[data-go]'); if (b) go(b.dataset.go); });
    if (q.has('level') || q.get('frei') === '1') go('free'); else menu.hidden = false;
  })();
</script>
</body>
</html>
