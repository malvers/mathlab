<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -6 19 15.6" width="150" height="123">
<!-- Clawd, the mascot of Claude Code - redrawn pixel for pixel from the block characters of its terminal welcome
     (" ▐▛███▜▌ / ▝▜█████▛▘ / ▘▘ ▝▝"); a terminal quarter block is 1 wide and 1.6 tall here. Body rgb(215, 119, 87).
     Now and then three jumps for joy, arms up, the shadow shrinking in the air; a blink in between; still with
     "reduce motion". Pure SVG + CSS, no script: it also moves as <img src="…/resources/clawd.svg">.
     Doc, 09.10.2026, on slide 8 of decks/mathe11-lehrbuch.html: "Der ist so geil … Unbedingt aufheben. Ins Repo." -->
<style>.hops{transform-box:fill-box;transform-origin:50% 100%;animation:clawd-hops 5.5s ease-in-out 1s infinite}.arme-oben{opacity:0;animation:clawd-oben 5.5s steps(1,end) 1s infinite}.arme-unten{animation:clawd-unten 5.5s steps(1,end) 1s infinite}.schatten{transform-box:fill-box;transform-origin:50% 50%;animation:clawd-schatten 5.5s ease-in-out 1s infinite}.augen rect{transform-box:fill-box;transform-origin:50% 50%;animation:clawd-blinzeln 5.5s 1s infinite}@keyframes clawd-hops{0%,22%,100%{transform:translateY(0) scale(1,1)}1.5%,7.5%,13.5%,19.5%{transform:translateY(0) scale(1.1,.86)}4.5%,10.5%,16.5%{transform:translateY(-4.6px) scale(.95,1.08)}}@keyframes clawd-oben{0%{opacity:0}1.5%{opacity:1}19.5%{opacity:0}100%{opacity:0}}@keyframes clawd-unten{0%{opacity:1}1.5%{opacity:0}19.5%{opacity:1}100%{opacity:1}}@keyframes clawd-schatten{0%,1.5%,7.5%,13.5%,19.5%,100%{transform:scaleX(1);opacity:.28}4.5%,10.5%,16.5%{transform:scaleX(.55);opacity:.14}}@keyframes clawd-blinzeln{0%,58%,62%,100%{transform:scaleY(1)}60%{transform:scaleY(.15)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.arme-oben{opacity:0}}</style>
<ellipse class="schatten" cx="8.5" cy="8.35" rx="6.6" ry="0.55" fill="#141413" opacity=".28"/><g class="hops"><g fill="#D77757"><rect x="3" y="0.00" width="12" height="6.40"/><rect x="3.98" y="6.32" width="1.04" height="1.68"/><rect x="5.98" y="6.32" width="1.04" height="1.68"/><rect x="10.98" y="6.32" width="1.04" height="1.68"/><rect x="12.98" y="6.32" width="1.04" height="1.68"/></g><g class="arme-unten" fill="#D77757"><rect x="0.95" y="3.20" width="2.1" height="1.60"/><rect x="14.95" y="3.20" width="2.1" height="1.60"/></g><g class="arme-oben" fill="#D77757"><rect x="1.95" y="1.60" width="1.1" height="1.60"/><rect x="0.95" y="0.00" width="1.1" height="1.68"/><rect x="14.95" y="1.60" width="1.1" height="1.60"/><rect x="15.95" y="0.00" width="1.1" height="1.68"/></g><g class="augen" fill="#141413"><rect x="5" y="1.60" width="1" height="1.60"/><rect x="12" y="1.60" width="1" height="1.60"/></g></g>
</svg>
