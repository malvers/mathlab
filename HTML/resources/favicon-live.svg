<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Doc Alvers Mathe-Labor</title>
  <!-- Lambda knocked out of the house orange - the LIVE icon. The Pages deploy copies
       this file over favicon.svg, so only docalvers.de shows orange; in the repo
       favicon.svg is red, and every local server (any port, any worktree, file://)
       shows red (Doc, 27.10.2026: "zwingend rot"). Build tools that want the house
       icon (app icons, OG cards) read this file, never favicon.svg.
       Letterforms are paths, never text: a favicon is loaded as a standalone image
       and gets no webfonts. -->
  <rect width="64" height="64" rx="14" fill="rgb(245,194,66)"/>
  <g stroke="rgb(14,36,78)" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M22 11 L46 53"/>
    <path d="M34.5 32.5 L18 53"/>
  </g>
</svg>
