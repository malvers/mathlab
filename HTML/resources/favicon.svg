<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Doc Alvers Mathe-Labor (lokal)</title>
  <!-- RED on purpose: this is what every page links, and served from this machine it is
       what the tab shows - whatever server, port or worktree serves it. The Pages
       deploy copies favicon-live.svg (orange) over this file, so only docalvers.de
       shows orange (Doc, 27.10.2026: "zwingend rot"). Never use this file as the
       house icon in a build - take favicon-live.svg.
       Light lambda here - house dark blue on red goes muddy at 16px.
       Letterforms are paths, never text: a favicon gets no webfonts. -->
  <rect width="64" height="64" rx="14" fill="rgb(176,36,24)"/>
  <g stroke="rgb(250,246,238)" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M22 11 L46 53"/>
    <path d="M34.5 32.5 L18 53"/>
  </g>
</svg>
