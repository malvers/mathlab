<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>SOLITA · Doc Alvers</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            options: {
                ignoreHtmlClass: 'tex2jax_ignore',
                processHtmlClass: 'tex2jax_process'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Orbitron', monospace;
            background: rgb(8, 20, 42);   /* flat, calm — minimal */
            height: 100vh;
            padding: 0;
            display: flex;            /* full-window flow: chat fills the viewport, no floating box */
            flex-direction: column;
        }

        #vsb-motto { display: none; }     /* minimal: drop the decorative motto */

        /* Branding Styles matching other labs */
        .canvas-branding {
            position: fixed;
            top: 20px;
            right: 24px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 1000;
            pointer-events: none;
        }

        .model-select {
            display: none;   /* minimal: fixed default model (Sonnet), no picker */
        }

        .model-select-display {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            height: 100%;
            background: rgba(0, 20, 40, 0.8);
            border: 1px solid #4b2c7a;
            border-radius: 10px;
            color: #ccf5ff;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        .model-select-display:hover,
        .model-select.open .model-select-display {
            border-color: #00d2ff;
        }

        .model-select-options {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: rgba(3, 8, 26, 0.98);
            border: 1px solid #4b2c7a;
            border-radius: 10px;
            overflow: hidden;
            z-index: 100;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }

        .model-select.open .model-select-options {
            display: block;
        }

        .model-option {
            padding: 12px 18px;
            color: #ccf5ff;
            cursor: pointer;
            transition: background 0.15s;
        }

        .model-option:hover {
            background: rgba(0, 210, 255, 0.08);
        }

        .model-option.selected {
            color: #00d2ff;
            background: rgba(0, 210, 255, 0.06);
        }

        .canvas-branding h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            margin: 0;
            letter-spacing: 2px;
            color: #4f5d78;
            text-transform: uppercase;
            font-weight: 600;
            line-height: 1.1;
        }

        .canvas-subtitle {
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            letter-spacing: 3px;
            color: #6b7a99;
            margin-top: 3px;
            text-transform: uppercase;
        }

        .chat-container {
            width: 100%;               /* nix box: full-bleed, no centered column */
            margin: 0;
            flex: 1;                   /* fill the viewport height */
            min-height: 0;             /* let messages-area scroll instead of clipping */
            background: transparent;
            border: none;
            border-radius: 0;
            box-shadow: none;
            display: flex;
            flex-direction: column;
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            min-height: 0;             /* flex child must shrink to scroll, not clip */
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            scroll-behavior: smooth;
            scrollbar-color: rgba(72, 88, 112, 0.9) #0a0f2a;
            scrollbar-width: thin;
        }

        .messages-area::-webkit-scrollbar,
        .message-input::-webkit-scrollbar,
        .message-content pre::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .messages-area::-webkit-scrollbar-track,
        .message-content pre::-webkit-scrollbar-track {
            background: #0a0f2a;
            border-radius: 10px;
        }

        .message-input::-webkit-scrollbar-track {
            background: transparent;
            margin: 8px 0;
        }

        /* Horizontale Scrollbar in Code-Blöcken */
        .message-content pre::-webkit-scrollbar-track {
            background: #1a0a2e;
            border-radius: 10px;
            margin: 0 12px;
        }

        .message-content pre::-webkit-scrollbar-thumb {
            background: rgba(72, 88, 112, 0.9);
            border-radius: 10px;
        }

        .messages-area::-webkit-scrollbar-thumb,
        .message-input::-webkit-scrollbar-thumb,
        .message-content pre::-webkit-scrollbar-thumb {
            background: rgba(72, 88, 112, 0.9);
            border-radius: 10px;
        }

        .message {
            display: flex;
            animation: fadeSlide 0.25s ease-out;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }



        .message-content {
            max-width: 82%;
            padding: 14px 18px;
            border-radius: 10px;
            font-family: 'Helvetica', 'Arial', sans-serif;
            font-weight: 400;
            font-size: 1.08rem;
            line-height: 1.5;
        }

        .message.user .message-content {
            background: #1b2740;
            color: #e6edf3;
        }

        .message.assistant .message-content {
            background: rgba(255, 255, 255, 0.04);
            color: #e6edf3;
            border: 1px solid rgba(255, 255, 255, 0.10);
            max-width: 80%;
            width: 80%;
            position: relative;
        }

        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 210, 255, 0.08);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 6px;
            color: #00d2ff;
            cursor: pointer;
            padding: 4px 6px;
            font-size: 0.85rem;
            line-height: 1;
            transition: background 0.2s, color 0.2s, opacity 0.15s;
            z-index: 2;
        }

        /* Copy button only on hover INSIDE the box (not the full-width row). Touch: no hover → stays visible. */
        @media (hover: hover) {
            .copy-btn { opacity: 0; }
            .message-content:hover .copy-btn { opacity: 1; }
        }

        .copy-btn:hover {
            background: rgba(0, 210, 255, 0.22);
        }

        .copy-btn.copied {
            color: #7fff7f;
            border-color: #7fff7f;
        }

        .pre-wrapper {
            position: relative;
        }

        .pre-wrapper .copy-btn {
            top: 12px;
            right: 12px;
        }

        .message-content pre {
            background: #03081a;
            padding: 10px;
            border-radius: 10px;
            overflow-x: auto;
            margin: 8px 0;
            border-left: 3px solid #00d2ff;
            scrollbar-color: rgba(72, 88, 112, 0.9) #1a0a2e;
            scrollbar-width: thin;
        }

        .message-content code {
            font-family: monospace;
            background: #00000055;
            padding: 2px 6px;
            border-radius: 10px;
        }

        .message-content ul {
            padding-left: 1.4em;
            margin: 6px 0;
        }

        .message-content li {
            margin: 3px 0;
            line-height: 1.5;
        }

        .typing-dots {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 0;
        }

        .typing-dots span {
            width: 8px;
            height: 8px;
            background: #00d2ff;
            border-radius: 50%;
            animation: typing-pulse 1.4s infinite ease-in-out;
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.4);
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing-pulse {

            0%,
            80%,
            100% {
                transform: scale(0.7);
                opacity: 0.4;
            }

            40% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        .message-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 10px 0;
            font-size: 0.88rem;
        }

        .message-content th,
        .message-content td {
            border: 1px solid rgba(0, 210, 255, 0.25);
            padding: 6px 12px;
            text-align: left;
        }

        .message-content th {
            background: rgba(0, 210, 255, 0.12);
            color: #00d2ff;
            font-family: 'Orbitron', monospace;
            font-size: 0.78rem;
            letter-spacing: 1px;
        }

        .message-content tr:nth-child(even) td {
            background: rgba(0, 210, 255, 0.04);
        }

        .message-content hr {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            margin: 12px 0;
            box-shadow: 0 1px 0 rgba(0, 210, 255, 0.1);
        }

        .input-area {
            padding: 16px 24px;
            background: transparent;   /* nix box: no bottom bar fill */
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        .message-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            padding: 10px 20px;
            color: #e6edf3;
            font-family: 'Helvetica', 'Arial', sans-serif;
            font-size: 1.15rem;
            resize: none;
            outline: none;
            height: 52px;
            min-height: 52px;
            max-height: 120px;
            overflow-y: hidden;
            transition: height 0.1s ease;
            line-height: 1.45;
            box-sizing: border-box;
        }

        .message-input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.32);
        }

        .send-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            padding: 0 14px;
            color: #e6edf3;
            font-family: 'Orbitron', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 1px;
            line-height: 1;
            cursor: pointer;
            transition: background 0.15s, opacity 0.15s, color 0.15s;
            height: 52px;
            min-width: 52px;
            flex-shrink: 0;
        }
        .send-button svg { width: 24px; height: 24px; display: block; }
        .send-button.rec { color: rgb(176, 36, 24); }   /* mic recording */
        .send-button.exit-btn { color: rgb(176, 36, 24); border-color: rgba(176, 36, 24, 0.55); }  /* leave UI mode */

        .send-button:hover:not(:disabled) { background: rgba(255, 255, 255, 0.12); }

        /* Toggle buttons (🔊 Vorlesen · 👂 Weckwort): OFF = dim, ON = filled — flat, kein Glow. */
        .send-button.toggle-btn { background: transparent; border-color: transparent; opacity: 0.4; }
        .send-button.toggle-btn.active { background: rgba(255, 255, 255, 0.16); border-color: rgba(255, 255, 255, 0.2); opacity: 1; }

        /* --- SECURITY CLEARANCE OVERLAY --- */
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(3, 4, 18, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .auth-overlay.visible {
            opacity: 1;
            pointer-events: all;
        }

        .auth-modal {
            background: rgba(5, 10, 30, 0.95);
            border: 1px solid var(--neon-blue, #00d2ff);
            border-radius: 12px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 210, 255, 0.1);
            transition: all 0.3s ease;
        }

        .auth-modal .briefing-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--neon-blue, #00d2ff);
            letter-spacing: 2px;
        }

        .auth-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-family: monospace;
            font-size: 1.2rem;
            text-align: center;
            margin: 20px 0;
            outline: none;
        }

        .auth-input:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        }
    </style>
</head>

<body>

    <div class="auth-overlay" id="cyber-auth-overlay">
        <div class="auth-modal">
            <div class="briefing-header">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                Passwort eingeben
            </div>
            <div style="position: relative; margin: 20px 0;">
                <input type="password" id="cyber-pwd-input" class="auth-input" placeholder="********" autocomplete="off"
                    aria-label="Passwort" style="margin: 0; padding-right: 48px;">
                <button id="toggle-pwd-btn" onclick="togglePwdVisibility()" aria-label="Passwort anzeigen"
                    style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:#00d2ff; padding:4px; line-height:1;">
                    <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
            <div style="display: flex; gap: 15px; justify-content: center;">
                <button class="send-button" style="flex:1; padding: 10px 25px;"
                    onclick="validateLabAccess()">LOGIN</button>
                <button
                    style="flex:1;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.2);border-radius:10px;padding:10px 28px;color:rgba(255,255,255,0.5);font-family:'Orbitron',sans-serif;font-weight:700;font-size:0.9rem;cursor:pointer;transition:all 0.2s;"
                    onclick="history.back()">CANCEL</button>
            </div>
        </div>
    </div>

    <div class="chat-container">
        <div class="messages-area" id="messagesArea">
            <div class="message assistant" style="align-items: center; gap: 10px; width: 100%;">
                <div class="message-content" style="font-family: 'Helvetica', 'Arial', sans-serif;">
                    <strong>Wie kann ich Dir helfen?</strong>
                </div>
                <div class="model-select" id="modelDropdown">
                    <div class="model-select-display" id="modelDisplay">
                        <span id="modelLabel">SONNET 4.6</span>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                    </div>
                    <div class="model-select-options" id="modelOptions">
                        <div class="model-option" data-value="claude-opus-4-8">OPUS 4.8</div>
                        <div class="model-option selected" data-value="claude-sonnet-4-6">SONNET 4.6</div>
                        <div class="model-option" data-value="claude-haiku-4-5-20251001">HAIKU 4.5</div>
                    </div>
                </div>
            </div>
            <div id="vsb-motto" style="flex:1;display:flex;align-items:center;justify-content:center;pointer-events:none;">
                <span style="font-family:'Orbitron',sans-serif;font-size:2.2rem;font-weight:700;letter-spacing:0.25em;text-transform:uppercase;background:linear-gradient(to right,#00d2ff,#ffffff,#9d50bb);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(0 0 18px rgba(0,210,255,0.25));opacity:0.18;">Vita Somnium Breve!</span>
            </div>
        </div>

        <div class="input-area">
            <button class="send-button toggle-btn" id="ttsBtn" title="Vorlesen an/aus" aria-label="Antworten vorlesen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg></button>
            <button class="send-button" id="micBtn" title="Einmal sprechen" aria-label="Per Stimme diktieren"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg></button>
            <button class="send-button toggle-btn" id="wakeBtn" title="Solita-Weckwort an/aus" aria-label="Solita per Weckwort aktivieren"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8.5a6.5 6.5 0 1 1 13 0c0 6-6 6-6 10a3.5 3.5 0 1 1-7 0"/><path d="M6.5 12.5a3.5 3.5 0 1 1 7 0c0 2.5-2 2.5-2 5"/></svg></button>
            <button class="send-button" id="logoutBtn" title="Logout" aria-label="Logout"
                onclick="localStorage.removeItem('dev_access'); sessionPwd=''; document.getElementById('cyber-auth-overlay').classList.add('visible'); document.getElementById('cyber-pwd-input').value=''; setTimeout(()=>document.getElementById('cyber-pwd-input').focus(),100);">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </button>
            <textarea class="message-input" id="messageInput" rows="1"
                placeholder="Du hast sicher Fragen ... schreib sie hier!"
                aria-label="Deine Nachricht an die KI"></textarea>
        </div>

    </div>

    <script>
        // DeepSeek proxy — the API key lives server-side as the DEEPSEEK_API_KEY secret, never in this
        // public client (Rule 18). Access is gated by a password the user types; the proxy verifies it
        // server-side against the LABAI_PASSWORD secret. (Old in-source encrypted key was rotated +
        // removed 2026-06-09.)
        const AI_URL  = 'https://fyfhxzyymmurlaenmzse.supabase.co/functions/v1/claude';
        const SOLITA_CONFIG_URL = 'https://fyfhxzyymmurlaenmzse.supabase.co/functions/v1/solita-config'; // Stufe 2a: Solita patcht HTML/config.json live
        const SB_ANON = 'sb_publishable_ubQDiMD-X3N0vZvPVi229Q_-5Zootfk'; // publishable anon key — client-safe
        let conversationHistory = [];

        // Verify a password against the proxy (server checks LABAI_PASSWORD). No DeepSeek call → no cost.
        async function verifyPwd(pwd) {
            if (!pwd) return false;
            try {
                const r = await fetch(AI_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'apikey': SB_ANON, 'Authorization': 'Bearer ' + SB_ANON, 'x-app-pass': pwd },
                    body: JSON.stringify({ ping: true })
                });
                return r.ok;
            } catch (_) { return false; }
        }

        function aesDecrypt(encryptedText, pwd) {
            try {
                const bytes = CryptoJS.AES.decrypt(encryptedText, pwd);
                return bytes.toString(CryptoJS.enc.Utf8);
            } catch (e) {
                return "";
            }
        }

        let sessionPwd = ""; // password the user typed; sent to the proxy as x-app-pass

        function togglePwdVisibility() {
            const input = document.getElementById('cyber-pwd-input');
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            document.getElementById('eye-icon').innerHTML = isHidden
                ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path><line x1="1" y1="1" x2="23" y2="23"></line>`
                : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
        }

        async function validateLabAccess() {
            const pwd = document.getElementById('cyber-pwd-input').value;
            const ok = await verifyPwd(pwd);

            if (ok) {
                sessionPwd = pwd;
                const isLocal = location.hostname === "localhost" ||
                    location.hostname === "127.0.0.1" ||
                    location.protocol === "file:" ||
                    location.hostname.startsWith("192.168.");
                if (isLocal) localStorage.setItem('dev_access', pwd);
                document.getElementById('cyber-auth-overlay').classList.remove('visible');
                document.getElementById('messageInput').focus();
            } else {
                const modal = document.querySelector(".auth-modal");
                modal.style.borderColor = "red";
                modal.style.boxShadow = "0 0 30px rgba(255,0,0,0.4)";
                document.getElementById('cyber-pwd-input').value = "";
                setTimeout(() => {
                    modal.style.borderColor = "var(--neon-blue, #00d2ff)";
                    modal.style.boxShadow = "0 15px 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 210, 255, 0.1)";
                }, 500);
            }
        }

        const messagesArea = document.getElementById('messagesArea');
        const messageInput = document.getElementById('messageInput');
        // GO/EXIT buttons removed — Enter sends. Null-object keeps the old .disabled / .addEventListener refs safe.
        const sendButton = document.getElementById('sendButton') || { disabled: false, addEventListener() {} };
        const exitUiBtn = document.getElementById('exitUiBtn');

        // UI-Änderungs-Modus (primer): when ON, every message is a live config change via solita-config.
        let uiMode = false;
        function setUiMode(on) {
            uiMode = on;
            window.__uiMode = on;   // let the voice recognizer (wake-word) know we're in UI mode
            messageInput.placeholder = on
                ? '🔧 UI-Modus — Wunsch, dann „go" (oder 4 s Pause). „fertig"/EXIT beendet.'
                : 'Du hast sicher Fragen ... schreib sie hier!';
            if (exitUiBtn) exitUiBtn.style.display = on ? 'inline-flex' : 'none';
        }
        if (exitUiBtn) exitUiBtn.addEventListener('click', () => {
            if (!uiMode) return;
            setUiMode(false);
            addMessage('assistant', 'UI-Modus aus. 🔧');
            if (window.speakReply) window.speakReply('Alles klar.');
            messageInput.focus();
        });
        messageInput.value = '';

        const MODEL_KEY = 'ai_model';
        const HISTORY_KEY = 'ai_history';
        const SUMMARY_KEY = 'solita_summary';

        // Solita's persona. Sent as a system turn on every request (the proxy lifts it into Anthropic's
        // top-level `system`). Kept sprechfreundlich because answers are often read aloud.
        const SOLITA_SYSTEM = "Du bist Solita — die persönliche, kluge und warmherzige Assistentin von "
            + "Doc Alvers. Du sprichst Deutsch, antwortest natürlich, knapp und auf den Punkt (deine "
            + "Antworten werden oft vorgelesen, also sprechfreundlich; keine langen Aufzählungen, wenn ein "
            + "Satz reicht). Du weißt viel und bleibst nah. Was du nicht sicher weißt, sagst du ehrlich.";

        // Rolling summary of older turns so context survives without sending the whole history every time.
        let runningSummary = localStorage.getItem(SUMMARY_KEY) || '';
        const KEEP_RECENT = 16;   // recent turns kept verbatim; older ones get folded into runningSummary

        // Build the proxy payload: persona + rolling summary as a system turn, then the recent chat.
        function buildRequestMessages() {
            const sys = SOLITA_SYSTEM
                + (runningSummary ? "\n\nBisheriger Gesprächskontext (Zusammenfassung):\n" + runningSummary : "");
            return [{ role: 'system', content: sys }].concat(conversationHistory);
        }

        // Keep context bounded WITHOUT just forgetting: fold the oldest turns into runningSummary, drop them.
        async function maybeSummarize() {
            if (conversationHistory.length <= KEEP_RECENT + 8) return;
            const old = conversationHistory.slice(0, conversationHistory.length - KEEP_RECENT);
            const transcript = old.map(m => (m.role === 'user' ? 'Doc' : 'Solita') + ': ' + m.content).join('\n');
            try {
                const r = await fetch(AI_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'apikey': SB_ANON, 'Authorization': `Bearer ${SB_ANON}`, 'x-app-pass': getPwd() },
                    body: JSON.stringify({
                        model: 'claude-haiku-4-5-20251001',   // cheap + fast for summarising
                        max_tokens: 600,
                        messages: [
                            { role: 'system', content: 'Fasse den folgenden Gesprächsausschnitt knapp auf Deutsch zusammen — nur Fakten, Wünsche und Beschlüsse, die für das weitere Gespräch wichtig sind. Stichpunktartig, höchstens 8 Zeilen.' + (runningSummary ? ' Beziehe diese bisherige Zusammenfassung mit ein:\n' + runningSummary : '') },
                            { role: 'user', content: transcript }
                        ]
                    })
                });
                if (r.ok) {
                    const d = await r.json();
                    const s = d.choices && d.choices[0] && d.choices[0].message.content;
                    if (s) { runningSummary = s.trim(); localStorage.setItem(SUMMARY_KEY, runningSummary); }
                }
            } catch (e) { /* summarising is best-effort; we trim below either way */ }
            conversationHistory = conversationHistory.slice(-KEEP_RECENT);
            saveHistory();
        }

        const COPY_ICON = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
        const CHECK_ICON = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;

        function getPwd() { return sessionPwd; }

        let currentModel = localStorage.getItem(MODEL_KEY) || 'claude-sonnet-4-6';
        // Migrate any legacy (DeepSeek) model id → a real Claude model so the proxy gets a valid id.
        if (!/^claude-/.test(currentModel)) currentModel = 'claude-sonnet-4-6';

        function getModel() { return currentModel; }

        function initModelDropdown(dropdownEl) {
            if (!dropdownEl) return;
            const display = dropdownEl.querySelector('.model-select-display');
            const label   = dropdownEl.querySelector('#modelLabel') || dropdownEl.querySelector('span');
            const options = dropdownEl.querySelectorAll('.model-option');

            // Gespeicherten Wert setzen
            options.forEach(opt => {
                opt.classList.toggle('selected', opt.dataset.value === currentModel);
                if (opt.dataset.value === currentModel && label) label.textContent = opt.textContent;
            });

            display.addEventListener('click', (e) => {
                e.stopPropagation();
                dropdownEl.classList.toggle('open');
            });

            options.forEach(opt => {
                opt.addEventListener('click', () => {
                    currentModel = opt.dataset.value;
                    localStorage.setItem(MODEL_KEY, currentModel);
                    if (label) label.textContent = opt.textContent;
                    options.forEach(o => o.classList.toggle('selected', o === opt));
                    dropdownEl.classList.remove('open');
                });
            });
        }

        document.addEventListener('click', () => {
            document.querySelectorAll('.model-select.open').forEach(d => d.classList.remove('open'));
        });

        document.addEventListener('DOMContentLoaded', () => {
            const pwdInput = document.getElementById('cyber-pwd-input');
            if (pwdInput) {
                pwdInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') validateLabAccess();
                });
            }
            initModelDropdown(document.getElementById('modelDropdown'));
        });

        function saveHistory() {
            localStorage.setItem(HISTORY_KEY, JSON.stringify(conversationHistory));
        }

        function loadHistory() {
            try {
                const saved = localStorage.getItem(HISTORY_KEY)
                    || localStorage.getItem('deepseek_history');
                if (!saved) return;
                const history = JSON.parse(saved);
                if (!Array.isArray(history) || history.length === 0) return;
                conversationHistory = history;
                messagesArea.innerHTML = '';
                history.forEach(msg => addMessage(msg.role, msg.content));
            } catch (e) { }
        }

        loadHistory();

        // ----- CHAT-LOGIK -----
        messageInput.addEventListener('input', function () {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 110) + 'px';
        });
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        sendButton.addEventListener('click', sendMessage);

        function addMessage(role, content) {
            const motto = document.getElementById('vsb-motto');
            if (motto) motto.remove();
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            // 1. Code-Blöcke extrahieren (Platzhalter nutzen)
            const codeBlocks = [];
            let formatted = content.replace(/```(\w*)\n([\s\S]*?)```/g, (match, lang, code) => {
                const placeholder = `__CODE_BLOCK_${codeBlocks.length}__`;
                codeBlocks.push({ lang, code });
                return placeholder;
            });

            // Security (WP-5): neutralise any raw HTML in the model's text BEFORE we add our own markup,
            // so an injected <script>/<img onerror> can't run. Markdown chars (#, *, |, `) are untouched.
            formatted = escapeHtml(formatted);

            // 2a. Markdown-Tabellen rendern
            formatted = formatted.replace(/^(\|.+\|)\n\|[-| :]+\|\n((?:\|.+\|\n?)*)/gm, (match, header, body) => {
                const parseRow = row => row.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
                const ths = parseRow(header).map(h => `<th>${h}</th>`).join('');
                const trs = body.trim().split('\n').map(row =>
                    '<tr>' + parseRow(row).map(c => `<td>${c}</td>`).join('') + '</tr>'
                ).join('');
                return `<table><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table>`;
            });

            // 2. Andere Markups formatieren
            formatted = formatted.replace(/^### (.*$)/gim, '<h3>$1</h3>');
            formatted = formatted.replace(/^## (.*$)/gim, '<h4>$1</h4>');
            formatted = formatted.replace(/^# (.*$)/gim, '<h5>$1</h5>');
            formatted = formatted.replace(/^\s*[-*+]\s+(.*)$/gim, '<li>$1</li>');
            formatted = formatted.replace(/(<li>.*<\/li>)/gim, '<ul>$1</ul>');
            formatted = formatted.replace(/<\/ul>\s*<ul>/gim, '');
            formatted = formatted.replace(/^---$/gm, '<hr>');
            formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            formatted = formatted.replace(/\*(.*?)\*/g, '<em>$1</em>');
            formatted = formatted.replace(/`([^`]+)`/g, '<code>$1</code>');
            formatted = formatted.replace(/\n/g, '<br>');

            // 3. Code-Blöcke sicher wieder einsetzen
            codeBlocks.forEach((block, index) => {
                const langClass = block.lang ? ` class="language-${block.lang}"` : '';
                const codeHtml = `<div class="pre-wrapper"><button class="copy-btn" data-code="${encodeURIComponent(block.code.trim())}">${COPY_ICON}</button><pre><code${langClass}>${escapeHtml(block.code.trim())}</code></pre></div>`;
                formatted = formatted.replace(`__CODE_BLOCK_${index}__`, codeHtml);
            });

            contentDiv.innerHTML = formatted;

            // Copy-Button für gesamte Antwort
            if (role === 'assistant') {
                const msgCopyBtn = document.createElement('button');
                msgCopyBtn.className = 'copy-btn';
                msgCopyBtn.innerHTML = COPY_ICON;
                msgCopyBtn.style.position = 'absolute';
                msgCopyBtn.addEventListener('click', () => copyText(content, msgCopyBtn));
                contentDiv.appendChild(msgCopyBtn);
            }

            // Copy-Button für Code-Blöcke verdrahten
            contentDiv.querySelectorAll('.pre-wrapper .copy-btn').forEach(btn => {
                const code = decodeURIComponent(btn.dataset.code);
                btn.addEventListener('click', () => copyText(code, btn));
            });

            messageDiv.appendChild(contentDiv);
            messagesArea.appendChild(messageDiv);

            // MathJax Rendering
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([contentDiv]);
            }

            // Syntax Highlighting
            if (typeof hljs !== 'undefined') {
                contentDiv.querySelectorAll('pre code').forEach((block) => {
                    hljs.highlightElement(block);
                });
            }

            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        function copyText(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                btn.innerHTML = CHECK_ICON;
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.innerHTML = COPY_ICON;
                    btn.classList.remove('copied');
                }, 1500);
            });
        }

        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function (m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message assistant';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = `<div class="message-content"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
            messagesArea.appendChild(typingDiv);
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        function hideTyping() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        async function sendMessage() {
            const userText = messageInput.value.trim();
            const pwd = getPwd();

            if (!userText) return;

            if (userText.toLowerCase() === '%clear') {
                conversationHistory = [];
                localStorage.removeItem(HISTORY_KEY);
                messagesArea.innerHTML = `<div class="message assistant" style="align-items:center;gap:10px;width:100%;"><div class="message-content"><strong>Wie kann ich Dir helfen?</strong></div><div class="model-select" id="modelDropdown"><div class="model-select-display" id="modelDisplay"><span id="modelLabel">SONNET 4.6</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></div><div class="model-select-options" id="modelOptions"><div class="model-option" data-value="claude-opus-4-8">OPUS 4.8</div><div class="model-option selected" data-value="claude-sonnet-4-6">SONNET 4.6</div><div class="model-option" data-value="claude-haiku-4-5-20251001">HAIKU 4.5</div></div></div></div>`;
                initModelDropdown(document.getElementById('modelDropdown'));
                messageInput.value = '';
                messageInput.style.height = 'auto';
                return;
            }

            if (!pwd) {
                document.getElementById('cyber-auth-overlay').classList.add('visible');
                setTimeout(() => document.getElementById('cyber-pwd-input')?.focus(), 100);
                return;
            }

            // ---- UI-Änderungs-Modus (primer) + Einzelbefehl "stell ein: …" → solita-config (live config) ----
            // In UI-Modus ist JEDER Satz eine Config-Änderung; rein via "UI Änderung"/"Änderung UI", raus via
            // "fertig"/EXIT. "stell ein: …" wirkt auch ohne Modus als Einzelbefehl. Nicht in den Chat gepusht.
            const t = userText.trim();
            const wantsEnterUi = (/\bui\b/i.test(t) && /(adjust|change|edit|tune|tweak|adapt|änder|aender|anpass)/i.test(t)) || /\bui[\s-]?mode\b/i.test(t);
            const wantsExitUi  = /^(fertig|ende|stop+|schluss|ui\s*aus|raus|normal)\b/i.test(t);
            const oneShot = t.match(/^\s*(?:solita[\s,:]*)?(?:stell\s+ein|config|konfiguration)\b[\s:]*(.+)/is);

            if (uiMode && wantsExitUi) {                         // leave UI mode
                addMessage('user', userText);
                messageInput.value = ''; messageInput.style.height = 'auto';
                setUiMode(false);
                addMessage('assistant', 'UI-Modus aus. 🔧');
                if (window.speakReply) window.speakReply('Alles klar.');
                return;
            }
            if (!uiMode && wantsEnterUi && !oneShot) {           // enter UI mode
                addMessage('user', userText);
                messageInput.value = ''; messageInput.style.height = 'auto';
                setUiMode(true);
                addMessage('assistant', 'UI-Modus an — sag deinen Wunsch, dann „go" (oder 4 s Pause). „fertig"/EXIT beendet.');
                if (window.speakReply) window.speakReply('UI-Modus an. Sag deinen Wunsch, dann go.');
                return;
            }
            if (uiMode || (oneShot && oneShot[1].trim())) {      // a config instruction
                const instruction = oneShot ? oneShot[1].trim() : t;
                addMessage('user', userText);
                messageInput.value = ''; messageInput.style.height = 'auto';
                sendButton.disabled = true;
                showTyping();
                try {
                    const r = await fetch(SOLITA_CONFIG_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'apikey': SB_ANON, 'Authorization': `Bearer ${SB_ANON}`, 'x-app-pass': pwd },
                        body: JSON.stringify({ instruction })
                    });
                    const data = await r.json().catch(() => ({}));
                    hideTyping();
                    if (!r.ok) {
                        let err = `Fehler ${r.status}`;
                        if (r.status === 401) err = 'Falsches Passwort';
                        else if (data && data.error) err += ' — ' + data.error;
                        addMessage('assistant', `❌ Config: ${err}`);
                    } else {
                        addMessage('assistant', `✓ Eingestellt (config v${data.version}).`);
                        if (window.speakReply) window.speakReply('Erledigt.');
                    }
                } catch (e) {
                    hideTyping();
                    addMessage('assistant', `❌ Config: ${e.message || e}`);
                } finally {
                    sendButton.disabled = false;
                    messageInput.focus();
                }
                return;
            }

            addMessage('user', userText);
            messageInput.value = '';
            messageInput.style.height = 'auto';
            sendButton.disabled = true;
            conversationHistory.push({ role: 'user', content: userText });
            showTyping();

            try {
                const response = await fetch(AI_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SB_ANON,
                        'Authorization': `Bearer ${SB_ANON}`,
                        'x-app-pass': pwd
                    },
                    body: JSON.stringify({
                        model: getModel(),
                        messages: buildRequestMessages(),
                        temperature: 0.6,
                        max_tokens: 3000
                    })
                });
                if (!response.ok) {
                    let err = `Fehler ${response.status}`;
                    if (response.status === 401) err = 'Falsches Passwort';
                    else if (response.status === 402) err = 'Nicht genug Guthaben – AI-Konto aufladen';
                    else { try { const e = await response.json(); if (e && e.error) err += ' — ' + e.error; } catch (_) { } }
                    throw new Error(err);
                }
                const data = await response.json();
                const reply = (data.choices && data.choices[0] && data.choices[0].message.content) || '(keine Antwort)';
                conversationHistory.push({ role: 'assistant', content: reply });
                saveHistory();
                hideTyping();
                addMessage('assistant', reply);
                if (window.speakReply) window.speakReply(reply); // read the answer aloud (voice mode)
                maybeSummarize();   // fold older turns into the rolling summary (best-effort, background)
            } catch (err) {
                conversationHistory.pop(); // User-Nachricht bei Fehler wieder entfernen
                hideTyping();
                addMessage('assistant', `❌ Fehler: ${err.message}`);
            } finally {
                sendButton.disabled = false;
                messageInput.focus();
            }
        }
        // ----- AUTO-LOGIN & AUTH-INITIALISIERUNG -----
        (async function initAuth() {
            const devPwd = localStorage.getItem('dev_access');
            const isLocal = location.hostname === "localhost" ||
                location.hostname === "127.0.0.1" ||
                location.protocol === "file:" ||
                location.hostname.startsWith("192.168.");

            let success = false;
            if (isLocal && devPwd && await verifyPwd(devPwd)) {
                sessionPwd = devPwd;
                success = true;
            }

            if (!success) {
                document.getElementById('cyber-auth-overlay').classList.add('visible');
                const pwdInput = document.getElementById('cyber-pwd-input');
                if (pwdInput) setTimeout(() => pwdInput.focus(), 100);
            } else {
                setTimeout(() => messageInput.focus(), 100);
            }
        })();
    </script>

    <!-- Voice mode: dictate (🎤) + read answers aloud (🔊). Browser-native, no key. Additive. -->
    <script>
        (function () {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            const TTS_KEY = 'solita_tts';
            let ttsOn = localStorage.getItem(TTS_KEY) !== '0';   // default: read aloud ON
            const ttsBtn = document.getElementById('ttsBtn');
            const micBtn = document.getElementById('micBtn');
            const input = document.getElementById('messageInput');

            function reflectTts() { if (ttsBtn) ttsBtn.classList.toggle('active', ttsOn); }
            reflectTts();

            // Pick a GOOD German voice — the browser default is often the robotic one. Prefer Chrome's
            // natural "Google Deutsch", then named female macOS voices (Solita's persona), then any German.
            // getVoices() loads async, so also re-pick on 'voiceschanged'. (Same approach as the glocken lab.)
            let chosenVoice = null;
            function pickVoice() {
                if (!('speechSynthesis' in window)) return;
                const voices = window.speechSynthesis.getVoices();
                if (!voices.length) return;
                const google = voices.find(v => /^de/i.test(v.lang) && /Google/i.test(v.name));
                const femaleDE = voices.find(v => /^de(-DE)?/i.test(v.lang) && /Anna|Petra|Helena|Katja|Hedda/i.test(v.name));
                const anyDE = voices.find(v => /^de(-DE)?/i.test(v.lang));
                chosenVoice = google || femaleDE || anyDE || voices[0];
            }
            pickVoice();
            if ('speechSynthesis' in window) window.speechSynthesis.addEventListener('voiceschanged', pickVoice);

            // Read the assistant's reply aloud (called from sendMessage). Strip light markdown first.
            window.speakReply = function (text) {
                if (!ttsOn || !('speechSynthesis' in window) || !text) return;
                try {
                    const clean = String(text)
                        .replace(/[\p{Extended_Pictographic}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{1F1E6}-\u{1F1FF}\uFE0F\u200D]/gu, '') // strip smileys/emoji — don't read them aloud (Doc)
                        .replace(/[*_`#>]/g, '')
                        .replace(/\s+/g, ' ').trim();
                    const u = new SpeechSynthesisUtterance(clean);
                    u.lang = 'de-DE';
                    if (!chosenVoice) pickVoice();          // voices may have loaded since init
                    if (chosenVoice) u.voice = chosenVoice;
                    u.rate = 0.96;                          // a touch slower = calmer, less synthetic
                    u.pitch = 1.0;
                    window.speechSynthesis.cancel();   // never queue stale speech
                    window.speechSynthesis.speak(u);
                } catch (e) { }
            };

            if (ttsBtn) ttsBtn.addEventListener('click', () => {
                ttsOn = !ttsOn; localStorage.setItem(TTS_KEY, ttsOn ? '1' : '0'); reflectTts();
                if (!ttsOn) { try { window.speechSynthesis.cancel(); } catch (e) { } }
            });

            // Dictation: tap mic → listen once (de-DE) → fill the input and send hands-free.
            let rec = null, listening = false;
            if (micBtn) {
                if (!SR) { micBtn.style.display = 'none'; }      // e.g. iOS Safari: no SpeechRecognition
                else micBtn.addEventListener('click', () => {
                    if (listening) { try { rec.stop(); } catch (e) { } return; }
                    try {
                        rec = new SR(); rec.lang = 'de-DE'; rec.interimResults = true; rec.maxAlternatives = 1;
                        listening = true; micBtn.classList.add('rec');
                        try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) { } // don't talk over you
                        // Live transcript flows into the input line as you speak…
                        rec.onresult = (e) => {
                            let txt = '';
                            for (let i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript;
                            if (input) { input.value = txt; input.dispatchEvent(new Event('input')); }
                        };
                        rec.onend = () => {
                            listening = false; micBtn.classList.remove('rec');
                            // …then a short beat so you SEE it in the line, and only THEN submit.
                            if (input && input.value.trim() && typeof sendMessage === 'function') setTimeout(sendMessage, 700);
                        };
                        rec.onerror = () => { listening = false; micBtn.classList.remove('rec'); };
                        rec.start();
                    } catch (e) { listening = false; micBtn.classList.remove('rec'); }
                });
            }
        })();
    </script>

    <!-- Wake-word "Solita": hands-free in the car. Continuous SpeechRecognition (Chrome); on hearing
         "Solita …" it takes the rest of the phrase as the question (or says "Ja?" and listens once more),
         then sends. Pauses while Solita speaks so she doesn't hear herself. Web listens only in the
         FOREGROUND — true background / locked-screen wake is the native krass-app (Vosk) path. -->
    <script>
        (function () {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            const wakeBtn = document.getElementById('wakeBtn');
            const input = document.getElementById('messageInput');
            if (!wakeBtn) return;
            if (!SR) { wakeBtn.style.display = 'none'; return; }   // e.g. iOS Safari: no SpeechRecognition

            const TRIGGERS = ['solita', 'solida', 'rita'];          // Vosk-tested variants (see krass-app note)
            const WAKE_KEY = 'solita_wake';
            let wakeOn = localStorage.getItem(WAKE_KEY) === '1';
            let rec = null, awaitingQuery = false, speaking = false, stopping = false;

            function reflect() { wakeBtn.classList.toggle('active', wakeOn); }
            reflect();

            // Pause listening while Solita speaks (so the mic doesn't pick up her own "Solita"), resume after.
            const _speak = window.speakReply;
            window.speakReply = function (text) {
                if (wakeOn && rec) { speaking = true; try { rec.stop(); } catch (e) { } }
                if (typeof _speak === 'function') _speak(text);
                const askedSomething = /\?[\s"')\]]*$/.test(String(text || '').trim()); // Solita ended on a question
                const resume = () => {
                    speaking = false;
                    if (wakeOn) { startRec(); if (askedSomething && !window.__uiMode) awaitingQuery = true; } // → answer without "Solita"
                };
                try {
                    if (window.speechSynthesis) {
                        const iv = setInterval(() => {
                            if (!window.speechSynthesis.speaking) { clearInterval(iv); setTimeout(resume, 400); }
                        }, 300);
                    } else setTimeout(resume, 800);
                } catch (e) { setTimeout(resume, 800); }
            };

            function extractQuery(t) {
                const low = t.toLowerCase();
                let idx = -1, hit = '';
                for (const w of TRIGGERS) {
                    const i = low.indexOf(w);
                    if (i !== -1 && (idx === -1 || i < idx)) { idx = i; hit = w; }
                }
                if (idx === -1) return null;                         // no wake word in this phrase
                return t.slice(idx + hit.length).replace(/^[\s,.:!?-]+/, '').trim();
            }

            function fire(query) {
                if (!query) {                                        // heard "Solita" alone → prompt + listen once
                    awaitingQuery = true;
                    if (window.speakReply) window.speakReply('Ja?');
                    return;
                }
                awaitingQuery = false;
                // Show the heard question in the input line first, then submit a beat later.
                if (input) { input.value = query; input.dispatchEvent(new Event('input')); }
                if (typeof sendMessage === 'function') setTimeout(sendMessage, 700);
            }

            // UI-mode voice flow (Doc): once in UI mode, speak the wish freely (no "Solita" needed),
            // then "go" OR a 4 s pause submits it; "fertig" leaves. (sendMessage routes UI-mode text to config.)
            let uiTimer = null;
            function uiExec() {
                if (uiTimer) { clearTimeout(uiTimer); uiTimer = null; }
                if (input && input.value.trim() && typeof sendMessage === 'function') sendMessage();
            }
            function handleUiVoice(txt) {
                if (/^\s*(fertig|exit|stopp?|ende|raus)\b/i.test(txt)) {   // leave UI mode
                    if (uiTimer) { clearTimeout(uiTimer); uiTimer = null; }
                    if (input) { input.value = txt; input.dispatchEvent(new Event('input')); }
                    if (typeof sendMessage === 'function') sendMessage();
                    return;
                }
                const sawGo = /\bgo\b/i.test(txt);
                const cmd = txt.replace(/\bgo\b.*$/i, '').trim();          // text before "go"
                if (cmd && input) {
                    input.value = (input.value.trim() ? input.value.trim() + ' ' : '') + cmd;
                    input.dispatchEvent(new Event('input'));
                }
                if (sawGo) { uiExec(); return; }                          // "go" → submit now
                if (uiTimer) clearTimeout(uiTimer);                       // else (re)start the 4 s pause-timer
                uiTimer = setTimeout(uiExec, 4000);
            }

            function onResult(e) {
                if (speaking) return;
                let txt = '';
                for (let i = e.resultIndex; i < e.results.length; i++) {
                    if (e.results[i].isFinal) txt += e.results[i][0].transcript;
                }
                txt = txt.trim();
                if (!txt) return;
                if (window.__uiMode) { handleUiVoice(txt); return; }  // UI mode: accumulate + go/pause
                if (awaitingQuery) { fire(txt); return; }            // wake word already heard last round
                const q = extractQuery(txt);
                if (q !== null) fire(q);                              // phrase contained "Solita …"
            }

            function startRec() {
                if (!wakeOn || speaking || rec) return;
                try {
                    rec = new SR();
                    rec.lang = 'de-DE'; rec.continuous = true; rec.interimResults = false; rec.maxAlternatives = 1;
                    rec.onresult = onResult;
                    rec.onerror = function () { };
                    rec.onend = function () { rec = null; if (wakeOn && !speaking && !stopping) setTimeout(startRec, 300); };
                    rec.start();
                } catch (e) { rec = null; }
            }

            function stopRec() {
                stopping = true;
                if (rec) { try { rec.stop(); } catch (e) { } rec = null; }
                setTimeout(function () { stopping = false; }, 500);
            }

            wakeBtn.addEventListener('click', function () {
                wakeOn = !wakeOn; localStorage.setItem(WAKE_KEY, wakeOn ? '1' : '0'); reflect();
                if (wakeOn) { awaitingQuery = false; startRec(); } else stopRec();
            });

            if (wakeOn) setTimeout(startRec, 600);                   // auto-resume if it was left on
        })();
    </script>
</body>

</html>
