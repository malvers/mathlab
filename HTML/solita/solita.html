<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>SOLITA · Doc Alvers</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            options: {
                ignoreHtmlClass: 'tex2jax_ignore',
                processHtmlClass: 'tex2jax_process'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <!-- Debug panel: loads + shows ONLY with ?debug=1 in the URL. Otherwise absent → the DebugWindow.log()
         calls (all guarded by `if (window.DebugWindow)`) are silently skipped. -->
    <script>if (/[?&]debug=1\b/.test(location.search)) { var s = document.createElement('script'); s.src = '../js/debug-window.js'; s.onload = function () { try { DebugWindow.show(); } catch (e) { } }; document.head.appendChild(s); }</script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Orbitron', monospace;
            background: rgb(8, 20, 42);   /* flat, calm — minimal */
            height: 100vh;
            padding: 0;
            display: flex;            /* full-window flow: chat fills the viewport, no floating box */
            flex-direction: column;
        }

        #vsb-motto { display: none; }     /* minimal: drop the decorative motto */

        /* Branding Styles matching other labs */
        .canvas-branding {
            position: fixed;
            top: 20px;
            right: 24px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 1000;
            pointer-events: none;
        }

        .model-select {
            display: none;   /* minimal: fixed default model (Sonnet), no picker */
        }

        .model-select-display {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            height: 100%;
            background: rgba(0, 20, 40, 0.8);
            border: 1px solid #4b2c7a;
            border-radius: 10px;
            color: #ccf5ff;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        .model-select-display:hover,
        .model-select.open .model-select-display {
            border-color: #00d2ff;
        }

        .model-select-options {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: rgba(3, 8, 26, 0.98);
            border: 1px solid #4b2c7a;
            border-radius: 10px;
            overflow: hidden;
            z-index: 100;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }

        .model-select.open .model-select-options {
            display: block;
        }

        .model-option {
            padding: 12px 18px;
            color: #ccf5ff;
            cursor: pointer;
            transition: background 0.15s;
        }

        .model-option:hover {
            background: rgba(0, 210, 255, 0.08);
        }

        .model-option.selected {
            color: #00d2ff;
            background: rgba(0, 210, 255, 0.06);
        }

        .canvas-branding h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            margin: 0;
            letter-spacing: 2px;
            color: #4f5d78;
            text-transform: uppercase;
            font-weight: 600;
            line-height: 1.1;
        }

        .canvas-subtitle {
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            letter-spacing: 3px;
            color: #6b7a99;
            margin-top: 3px;
            text-transform: uppercase;
        }

        .chat-container {
            width: 100%;               /* nix box: full-bleed, no centered column */
            margin: 0;
            flex: 1;                   /* fill the viewport height */
            min-height: 0;             /* let messages-area scroll instead of clipping */
            background: transparent;
            border: none;
            border-radius: 0;
            box-shadow: none;
            display: flex;
            flex-direction: column;
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            min-height: 0;             /* flex child must shrink to scroll, not clip */
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            scroll-behavior: smooth;
            scrollbar-color: rgba(72, 88, 112, 0.9) #0a0f2a;
            scrollbar-width: thin;
        }

        .messages-area::-webkit-scrollbar,
        .message-input::-webkit-scrollbar,
        .message-content pre::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .messages-area::-webkit-scrollbar-track,
        .message-content pre::-webkit-scrollbar-track {
            background: #0a0f2a;
            border-radius: 10px;
        }

        .message-input::-webkit-scrollbar-track {
            background: transparent;
            margin: 8px 0;
        }

        /* Horizontale Scrollbar in Code-Blöcken */
        .message-content pre::-webkit-scrollbar-track {
            background: #1a0a2e;
            border-radius: 10px;
            margin: 0 12px;
        }

        .message-content pre::-webkit-scrollbar-thumb {
            background: rgba(72, 88, 112, 0.9);
            border-radius: 10px;
        }

        .messages-area::-webkit-scrollbar-thumb,
        .message-input::-webkit-scrollbar-thumb,
        .message-content pre::-webkit-scrollbar-thumb {
            background: rgba(72, 88, 112, 0.9);
            border-radius: 10px;
        }

        .message {
            display: flex;
            animation: fadeSlide 0.25s ease-out;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }



        .message-content {
            max-width: 82%;
            padding: 14px 18px;
            border-radius: 10px;
            font-family: 'Helvetica', 'Arial', sans-serif;
            font-weight: 400;
            font-size: 1.08rem;
            line-height: 1.5;
        }

        .message.user .message-content {
            background: #1b2740;
            color: #e6edf3;
        }

        .message.assistant .message-content {
            background: rgba(255, 255, 255, 0.04);
            color: #e6edf3;
            border: 1px solid rgba(255, 255, 255, 0.10);
            max-width: 80%;
            width: 80%;
            position: relative;
        }
        /* Per-query cost under a Solita answer — dezent, nicht aufdringlich. */
        .solita-cost {
            margin-top: 7px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.66rem;
            letter-spacing: 0.5px;
            opacity: 0.45;
        }

        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 210, 255, 0.08);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 6px;
            color: #00d2ff;
            cursor: pointer;
            padding: 4px 6px;
            font-size: 0.85rem;
            line-height: 1;
            transition: background 0.2s, color 0.2s, opacity 0.15s;
            z-index: 2;
        }

        /* Copy button only on hover INSIDE the box (not the full-width row). */
        @media (hover: hover) {
            .copy-btn { opacity: 0; }
            .message-content:hover .copy-btn { opacity: 1; }
        }

        /* Touch (no hover): copy button hidden until the bubble is TAPPED — sonst kleben die Icons fest
           dran (Doc 2026-06-15). Tap toggelt .show-copy (Handler in solita-core.js). */
        @media (hover: none) {
            .copy-btn { opacity: 0; }
            .message-content.show-copy .copy-btn { opacity: 1; }
        }

        .copy-btn:hover {
            background: rgba(0, 210, 255, 0.22);
        }

        .copy-btn.copied {
            color: #7fff7f;
            border-color: #7fff7f;
        }

        .pre-wrapper {
            position: relative;
        }

        .pre-wrapper .copy-btn {
            top: 12px;
            right: 12px;
        }

        .message-content pre {
            background: #03081a;
            padding: 10px;
            border-radius: 10px;
            overflow-x: auto;
            margin: 8px 0;
            border-left: 3px solid #00d2ff;
            scrollbar-color: rgba(72, 88, 112, 0.9) #1a0a2e;
            scrollbar-width: thin;
        }

        .message-content code {
            font-family: monospace;
            background: #00000055;
            padding: 2px 6px;
            border-radius: 10px;
        }

        .message-content ul {
            padding-left: 1.4em;
            margin: 6px 0;
        }

        .message-content li {
            margin: 3px 0;
            line-height: 1.5;
        }

        .typing-dots {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 0;
        }

        .typing-dots span {
            width: 8px;
            height: 8px;
            background: #00d2ff;
            border-radius: 50%;
            animation: typing-pulse 1.4s infinite ease-in-out;
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.4);
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing-pulse {

            0%,
            80%,
            100% {
                transform: scale(0.7);
                opacity: 0.4;
            }

            40% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        .message-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 10px 0;
            font-size: 0.88rem;
        }

        .message-content th,
        .message-content td {
            border: 1px solid rgba(0, 210, 255, 0.25);
            padding: 6px 12px;
            text-align: left;
        }

        .message-content th {
            background: rgba(0, 210, 255, 0.12);
            color: #00d2ff;
            font-family: 'Orbitron', monospace;
            font-size: 0.78rem;
            letter-spacing: 1px;
        }

        .message-content tr:nth-child(even) td {
            background: rgba(0, 210, 255, 0.04);
        }

        .message-content hr {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            margin: 12px 0;
            box-shadow: 0 1px 0 rgba(0, 210, 255, 0.1);
        }

        .input-area {
            position: relative;        /* anchor for the phase-pill overlay */
            padding: 16px 24px;
            background: transparent;   /* nix box: no bottom bar fill */
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        .message-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            padding: 10px 20px;
            color: #e6edf3;
            font-family: 'Helvetica', 'Arial', sans-serif;
            font-size: 1.15rem;
            resize: none;
            outline: none;
            height: 52px;
            min-height: 52px;
            max-height: 120px;
            overflow-y: hidden;
            transition: height 0.1s ease;
            line-height: 1.45;
            box-sizing: border-box;
        }

        .message-input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.32);
        }

        .send-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            padding: 0 14px;
            color: #e6edf3;
            font-family: 'Orbitron', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 1px;
            line-height: 1;
            cursor: pointer;
            transition: background 0.15s, opacity 0.15s, color 0.15s;
            height: 52px;
            min-width: 52px;
            flex-shrink: 0;
        }
        .send-button svg { width: 24px; height: 24px; display: block; }
        .send-button.rec { color: rgb(176, 36, 24); }   /* mic recording */
        .send-button.exit-btn { color: rgb(176, 36, 24); border-color: rgba(176, 36, 24, 0.55); }  /* leave UI mode */

        .send-button:hover:not(:disabled) { background: rgba(255, 255, 255, 0.12); }

        /* Toggle buttons (🔊 Vorlesen · 👂 Weckwort): OFF = dim, ON = filled — flat, kein Glow. */
        .send-button.toggle-btn { background: transparent; border-color: transparent; opacity: 0.4; }
        .send-button.toggle-btn.active { background: rgb(121, 158, 49); border-color: rgb(121, 158, 49); color: #fff; opacity: 1; }   /* ON = phi green, white icon */
        .send-button.toggle-btn.active:hover { background: rgb(134, 173, 56); border-color: rgb(134, 173, 56); }   /* keep green on hover (generic hover would whiten it) */

        /* --- SECURITY CLEARANCE OVERLAY --- */
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(3, 4, 18, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .auth-overlay.visible {
            opacity: 1;
            pointer-events: all;
        }

        .auth-modal {
            background: rgba(5, 10, 30, 0.95);
            border: 1px solid var(--neon-blue, #00d2ff);
            border-radius: 12px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 210, 255, 0.1);
            transition: all 0.3s ease;
        }

        .auth-modal .briefing-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--neon-blue, #00d2ff);
            letter-spacing: 2px;
        }

        .auth-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-family: monospace;
            font-size: 1.2rem;
            text-align: center;
            margin: 20px 0;
            outline: none;
        }

        .auth-input:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        }

        /* Conversation-phase indicator (Solita state): what's going on right now. */
        #solita-phase {
            position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(100% - 10px);
            display: none; align-items: center; gap: 9px;
            white-space: nowrap; max-width: calc(100vw - 16px);
            padding: 6px 15px; border-radius: 999px;
            background: rgba(8, 20, 42, 0.88); border: 1px solid rgba(255, 255, 255, 0.12);
            font-family: 'Orbitron', sans-serif; font-size: 0.72rem; letter-spacing: 1.5px;
            text-transform: uppercase; color: #cfe3ff; z-index: 9999;
            backdrop-filter: blur(6px); pointer-events: none;
        }
        #solita-phase[data-state="listening"],
        #solita-phase[data-state="thinking"],
        #solita-phase[data-state="speaking"],
        #solita-phase[data-state="dormant"] { display: flex; }
        #solita-phase .dot { width: 9px; height: 9px; border-radius: 50%; background: #6b7a99; }
        #solita-phase[data-state="listening"] .dot { background: rgb(121, 158, 49); animation: solita-pulse 1.1s ease-in-out infinite; } /* φ grün — du sprichst, sie hört */
        #solita-phase[data-state="thinking"]  .dot { display: none; }   /* denkt: dot hidden — the yellow twinkling star is the indicator */
        #solita-phase .ts { color: rgb(245, 194, 66); font-size: 12px; line-height: 1; }   /* twinkling star: λ-yellow, ~dot-sized (9px) */
        #solita-phase[data-state="speaking"]  .dot { background: #00d2ff;          animation: solita-pulse 0.7s ease-in-out infinite; } /* cyan — Solita spricht */
        #solita-phase[data-state="dormant"]   .dot { background: #6b5b95;          animation: solita-pulse 2.6s ease-in-out infinite; } /* muted violet, slow breath — paused/half-asleep */
        @keyframes solita-pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(1.6); } }

        /* Hamburger → Solita's identity panel (her face). Utilities consolidate here later (Stufe 2). */
        #solita-hh {
            display: inline-flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px;
            height: 52px; min-width: 52px; flex-shrink: 0;
            background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px; cursor: pointer; transition: background 0.15s;
        }
        #solita-hh:hover { background: rgba(255, 255, 255, 0.12); }
        #solita-hh span { width: 18px; height: 2px; background: #cfe3ff; border-radius: 2px; }
        #solita-hh-panel {
            position: fixed; bottom: 86px; left: 24px; z-index: 10000;
            width: 280px; padding: 20px 18px; border-radius: 14px;
            background: rgba(8, 20, 42, 0.96); border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px); box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
            display: none; flex-direction: column; align-items: center; gap: 4px;
        }
        #solita-hh-panel.open { display: flex; }
        #solita-hh-panel .hh-face {
            width: 120px; height: 120px; border-radius: 50%; object-fit: cover;
            border: 2px solid rgba(0, 210, 255, 0.4); margin-bottom: 12px;
        }
        #solita-hh-panel .hh-name { font-family: 'Orbitron', sans-serif; font-size: 1rem; letter-spacing: 1px; color: #e6edf3; }
        #solita-hh-panel .hh-tag { font-family: 'Orbitron', sans-serif; font-size: 0.62rem; letter-spacing: 1.5px; color: #6b7a99; text-transform: uppercase; margin-top: 2px; }
        #solita-hh-panel .hh-controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 16px; }
        #solita-hh-panel .hh-voice { margin-top: 14px; width: 100%; padding: 8px 10px; border-radius: 8px; background: rgba(255, 255, 255, 0.06); color: #e6edf3; border: 1px solid rgba(255, 255, 255, 0.12); font-family: 'Orbitron', sans-serif; font-size: 0.66rem; cursor: pointer; }
        #solita-hh-panel .hh-voice option { background: #0a0f2a; color: #e6edf3; }
        #solita-hh-panel .hh-lang { display: flex; gap: 6px; width: 100%; margin-top: 14px; }
        #solita-hh-panel .hh-lang button { flex: 1; padding: 7px 0; border-radius: 8px; background: rgba(255, 255, 255, 0.06); color: #e6edf3; border: 1px solid rgba(255, 255, 255, 0.12); font-family: 'Orbitron', sans-serif; font-size: 0.7rem; letter-spacing: 1px; cursor: pointer; transition: background 0.15s, color 0.15s; }
        #solita-hh-panel .hh-lang button:hover { background: rgba(255, 255, 255, 0.12); }
        #solita-hh-panel .hh-lang button.active { background: rgb(121, 158, 49); border-color: rgb(121, 158, 49); color: #fff; }   /* ON = phi green, like the toggles */
        #solita-hh-panel .hh-face { cursor: zoom-in; }
        #solita-lightbox {
            position: fixed; inset: 0; z-index: 10001; display: none;
            align-items: center; justify-content: center;
            background: rgba(8, 20, 42, 0.92); backdrop-filter: blur(8px); cursor: zoom-out;
        }
        #solita-lightbox.open { display: flex; }
        #solita-lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 16px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6); }

        /* Mobile (≤600px): tighten chat + bottom bar so they fit without overflow (Regel 16). */
        @media (max-width: 600px) {
            .messages-area { padding: 14px; gap: 12px; }
            .input-area { padding: 10px 12px; }
            .message-content { max-width: 90%; font-size: 1rem; padding: 12px 14px; }
            .message.assistant .message-content { width: auto; max-width: 92%; }
            #solita-hh-panel { width: calc(100vw - 32px); max-width: 300px; }
            #solita-phase { font-size: 0.66rem; padding: 5px 12px; }
        }
    </style>
</head>

<body>

    <div class="auth-overlay" id="cyber-auth-overlay">
        <div class="auth-modal">
            <div class="briefing-header">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                Passwort eingeben
            </div>
            <div style="position: relative; margin: 20px 0;">
                <input type="password" id="cyber-pwd-input" class="auth-input" placeholder="********" autocomplete="off"
                    aria-label="Passwort" style="margin: 0; padding-right: 48px;">
                <button id="toggle-pwd-btn" onclick="togglePwdVisibility()" aria-label="Passwort anzeigen"
                    style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:#00d2ff; padding:4px; line-height:1;">
                    <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
            <div style="display: flex; gap: 15px; justify-content: center;">
                <button class="send-button" style="flex:1; padding: 10px 25px;"
                    onclick="validateLabAccess()">LOGIN</button>
                <button
                    style="flex:1;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.2);border-radius:10px;padding:10px 28px;color:rgba(255,255,255,0.5);font-family:'Orbitron',sans-serif;font-weight:700;font-size:0.9rem;cursor:pointer;transition:all 0.2s;"
                    onclick="history.back()">CANCEL</button>
            </div>
        </div>
    </div>

    <!-- Hamburger panel → Solita's identity (her face) + the consolidated controls. Opened by the ☰ in the input bar. -->
    <div id="solita-hh-panel" role="menu" aria-hidden="true">
        <img class="hh-face" src="../resources/team/team_02.png" alt="Solita" onclick="document.getElementById('solita-lightbox').classList.add('open')" onerror="this.style.display='none'">
        <div class="hh-name">Solita Neural</div>
        <div class="hh-tag">Deine persönliche Assistentin</div>
        <div class="hh-controls">
            <button class="send-button toggle-btn" id="ttsBtn" title="Vorlesen an/aus" aria-label="Antworten vorlesen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg></button>
            <button class="send-button" id="micBtn" title="Einmal sprechen" aria-label="Per Stimme diktieren"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg></button>
            <button class="send-button toggle-btn" id="wakeBtn" title="Solita-Weckwort an/aus" aria-label="Solita per Weckwort aktivieren"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="9.5" x2="4" y2="14.5"/><line x1="8" y1="6" x2="8" y2="18"/><line x1="12" y1="3" x2="12" y2="21"/><line x1="16" y1="6" x2="16" y2="18"/><line x1="20" y1="9.5" x2="20" y2="14.5"/></svg></button>
            <button class="send-button" id="logoutBtn" title="Logout" aria-label="Logout"
                onclick="solitaLogout()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </button>
        </div>
        <div id="hh-lang" class="hh-lang" role="group" aria-label="Sprache / Language">
            <button type="button" data-lang="de" aria-label="Deutsch">DE</button>
            <button type="button" data-lang="en" aria-label="English">EN</button>
            <button type="button" data-lang="es" aria-label="Español">ES</button>
        </div>
        <!-- Sprachmodell wählen (zum Vergleichen): Claude (mit Tools) ↔ DeepSeek (günstig, nur Chat, keine Tools). -->
        <div id="hh-model" class="hh-lang" role="group" aria-label="Sprachmodell" title="DeepSeek ist günstig, kann aber keine Tools (Wetter/Kalender/Mail)">
            <button type="button" data-model="claude-sonnet-4-6" aria-label="Claude (mit Tools)">CLAUDE</button>
            <button type="button" data-model="deepseek-chat" aria-label="DeepSeek (günstig, ohne Tools)">DEEPSEEK</button>
        </div>
        <select id="hh-voice" class="hh-voice" aria-label="Solitas Stimme" title="Stimme wählen — Vorschau beim Auswählen"></select>
        <!-- ODbL attribution: where_am_i resolves place names via Nominatim (OpenStreetMap data). -->
        <div class="hh-attrib" style="margin-top:16px;font-size:0.56rem;line-height:1.45;color:#6b7a99;text-align:center;">
            Standort-Ortsnamen © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener" style="color:#6b7a99;text-decoration:underline;">OpenStreetMap contributors</a>
        </div>
    </div>

    <!-- Tap Solita's portrait → full-size lightbox. -->
    <div id="solita-lightbox" onclick="this.classList.remove('open')"><img src="../resources/team/team_02.png" alt="Solita"></div>

    <div class="chat-container">
        <div class="messages-area" id="messagesArea">
            <div class="message assistant" style="align-items: center; gap: 10px; width: 100%;">
                <div class="message-content" style="font-family: 'Helvetica', 'Arial', sans-serif;">
                    <strong>Wie kann ich Dir helfen?</strong>
                </div>
                <div class="model-select" id="modelDropdown">
                    <div class="model-select-display" id="modelDisplay">
                        <span id="modelLabel">SONNET 4.6</span>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                    </div>
                    <div class="model-select-options" id="modelOptions">
                        <div class="model-option" data-value="claude-opus-4-8">OPUS 4.8</div>
                        <div class="model-option selected" data-value="claude-sonnet-4-6">SONNET 4.6</div>
                        <div class="model-option" data-value="claude-haiku-4-5-20251001">HAIKU 4.5</div>
                    </div>
                </div>
            </div>
            <div id="vsb-motto" style="flex:1;display:flex;align-items:center;justify-content:center;pointer-events:none;">
                <span style="font-family:'Orbitron',sans-serif;font-size:2.2rem;font-weight:700;letter-spacing:0.25em;text-transform:uppercase;background:linear-gradient(to right,#00d2ff,#ffffff,#9d50bb);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(0 0 18px rgba(0,210,255,0.25));opacity:0.18;">Vita Somnium Breve!</span>
            </div>
        </div>

        <div class="input-area">
            <!-- Conversation-phase indicator: höre zu / denkt / spricht (set via window.solitaPhase). Overlaid just above the input bar. -->
            <div id="solita-phase" aria-live="polite"><span class="dot"></span><span class="lbl"></span></div>
            <button id="solita-hh" aria-label="Menü" title="Solita"><span></span><span></span><span></span></button>
            <textarea class="message-input" id="messageInput" rows="1"
                placeholder="Du hast sicher Fragen ... schreib sie hier!"
                aria-label="Deine Nachricht an die KI"></textarea>
        </div>

    </div>

    <!-- The "brain": LLM conversation + tool-use engine. Generic + reusable — ear.js hears, solita-brain
         thinks, solita-tts speaks → any lab = ear + brain + tts (no iframe). Loads BEFORE its host core. -->
    <script src="../js/solita-brain.js"></script>
    <!-- Cross-device sync: one shared conversation log via the password-gated 'solita-sync' edge fn.
         Loads BEFORE the core so the host can wire it. -->
    <script src="../js/solita-sync.js"></script>
    <script src="../js/solita-core.js"></script>

    <!-- Tool add-on: check_gmail (READ-ONLY Gmail peek). Self-registers into window.SolitaTools. -->
    <script src="../js/solita-gmail.js"></script>

    <!-- Tool add-on: send_gmail (sends a plain-text mail to Doc himself). Self-registers into window.SolitaTools. -->
    <script src="../js/solita-gmail-send.js"></script>

    <!-- Tool add-on: check_calendar (READ-ONLY Google Calendar peek → upcoming events). Self-registers. -->
    <script src="../js/solita-calendar.js"></script>

    <!-- Tool add-on: where_am_i (GPS + OpenStreetMap reverse-geocode → tells Doc where he is). Self-registers. -->
    <script src="../js/solita-where.js"></script>

    <!-- Tool add-on: read_notes (fetch saved notes from the PRIVATE store → email/read/summarize). Self-registers. -->
    <script src="../js/solita-read-notes.js"></script>

    <!-- Tool add-on: delete_notes (delete notes — two-step, confirms with Doc first). Self-registers. -->
    <script src="../js/solita-delete-notes.js"></script>

    <!-- Tool add-on: read_markdown (list + read ANY .md in the public repo via GitHub, keyless; AUDIT.md denied).
         Self-registers into window.SolitaTools. -->
    <script src="../js/solita-read-md.js"></script>

    <!-- Tool add-on: get_time (device clock + Intl time zones → local or any city's time). Self-registers. -->
    <script src="../js/solita-time.js"></script>

    <!-- Voice mode: dictate (🎤) + read answers aloud (🔊). Browser-native, no key. Additive. -->
    <script src="../js/solita-tts.js"></script>

    <!-- Wake-word "Solita": hands-free in the car. Continuous SpeechRecognition (Chrome); on hearing
         "Solita …" it takes the rest of the phrase as the question (or says "Ja?" and listens once more),
         then sends. Pauses while Solita speaks so she doesn't hear herself. Web listens only in the
         FOREGROUND — true background / locked-screen wake is the native krass-app (Vosk) path. -->
    <script src="../js/ear.js"></script>
    <script src="../js/solita-wake.js"></script>
</body>

</html>
