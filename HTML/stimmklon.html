<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Stimmklon — Aufnahmekabine</title>
    <meta name="description" content="Nimmt Docs Stimme satzweise auf und legt saubere WAVs für einen Stimmklon ab.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="resources/favicon.svg">
    <link rel="stylesheet" href="js/cyber-layout.css">
    <link rel="stylesheet" href="js/buttons-ultra.css">
    <link rel="stylesheet" href="js/cyber-lab-overrides.css">
    <link rel="stylesheet" href="js/branding.styles.extracted.css">
    <link rel="stylesheet" href="js/lab-shell-minimal.css">
    <style>
        /* Page-local only: the recording booth layout. Everything shared (buttons, colours,
           panels, scrollbars) comes from the central sheets linked above. */
        .booth {
            position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden;
            padding: 22px clamp(16px, 3vw, 34px) 70px;
        }
        .bahn { max-width: 1240px; margin: 0 auto; }

        .zaehler {
            display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline;
            margin: 0 0 9px; font-size: 0.72rem; letter-spacing: 0.04em;
        }
        .zaehler b { font-size: 1.45rem; font-weight: 900; }
        .ziel { font-size: 0.66rem; opacity: .55; line-height: 1.5; margin-top: 9px; }
        .ziel code { font-size: 0.95em; }
        .genug { color: rgb(121, 158, 49); }
        .fehlt { color: rgb(245, 194, 66); }
        .schlecht { color: rgb(176, 36, 24); }

        .balken { height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
        .balken i { display: block; height: 100%; background: rgb(121, 158, 49); width: 0; transition: width .35s; }

        .satz {
            margin: 22px 0 14px; padding: 24px 26px; border-radius: 14px;
            min-height: 34vh; display: flex; flex-direction: column; justify-content: center;
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.14);
        }
        .satz.laeuft { border-color: rgb(176, 36, 24); box-shadow: 0 0 0 2px rgba(176, 36, 24, .35); }
        .satz .nr { display: block; font-size: 0.7rem; opacity: .6; margin-bottom: 12px; letter-spacing: .12em; }

        /* The line to read is NOT set in Orbitron: it is a display face, and reading 300 words
           aloud from it is genuinely hard on the eye. Everything else on the page stays Orbitron. */
        #satztext {
            font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
            font-size: clamp(1.05rem, 2.6vw, 1.42rem); line-height: 1.72; font-weight: 400;
            display: block; max-height: 46vh; overflow-y: auto; padding-right: 8px;
        }
        #satztext.kurz { font-size: clamp(1.15rem, 3.4vw, 1.8rem); font-weight: 600; line-height: 1.5; }
        #satztext p { margin: 0 0 1em; }
        #satztext p:last-child { margin-bottom: 0; }

        .regie { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 8px; }
        /* Everything on the horizontal axis, record dead centre (Doc, 24.09.2026: "rec in die
           mitte alle x zentr"). A 1fr | auto | 1fr grid keeps the record button on the axis no
           matter how many buttons sit on either side of it. */
        .regie { display: flex; flex-direction: column; align-items: center; gap: 12px; margin: 6px 0 4px; }
        .transport { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 18px; width: 100%; }
        .seite { display: flex; gap: 14px; align-items: center; }
        .seite.links { justify-content: flex-end; }
        .seite.rechts { justify-content: flex-start; }
        /* fixed height: clock and meter appear while recording without shoving the page down */
        .laufzeile { display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 22px; }
        .optionen[hidden] { display: none; }
        .optionen { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 14px; }
        /* silent unless there is news; the fixed height keeps the page from jumping when there is */
        .alle-zeile { text-align: center; }
        /* a pill, not a checkbox (Doc, 24.09.2026) - the checkbox stays underneath, the script reads it */
        .pille { display: inline-flex; cursor: pointer; }
        .pille input { position: absolute; opacity: 0; pointer-events: none; }
        .pille span {
            padding: 6px 18px; border-radius: 999px; font-size: 0.68rem; letter-spacing: .04em;
            border: 1px solid rgba(255, 255, 255, .25); color: rgba(255, 255, 255, .75);
            transition: background .15s, color .15s, border-color .15s;
        }
        .pille:hover span { border-color: var(--neon-blue); color: var(--neon-blue); }
        .pille input:checked + span { background: var(--neon-blue); border-color: var(--neon-blue); color: #0a0f1a; }
        .pille input:focus-visible + span { outline: 2px solid var(--neon-blue); outline-offset: 2px; }
        #tipp { text-align: center; min-height: 1.6em; margin: 8px 0 14px; }
        .regie .cyber-btn {
            flex: 0 1 auto; min-width: 142px; cursor: pointer; border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--neon-blue); color: var(--neon-blue);
        }
        .regie .cyber-btn:hover { background: rgba(0, 210, 255, 0.12); }
        .regie .cyber-btn:disabled { opacity: .35; cursor: not-allowed; }
        /* the one button that starts something irreversible wears Doc's red */
        #btnRec { border-color: rgb(176, 36, 24); color: rgb(226, 96, 86); }
        #btnRec:hover { background: rgba(176, 36, 24, .18); }
        #btnRec.stopp { background: rgb(176, 36, 24); color: white; }
        .uhr { font-variant-numeric: tabular-nums; font-size: 1.1rem; font-weight: 700; opacity: .85; min-width: 4.5em; }
        .pegelbox {
            width: 132px; height: 9px; border-radius: 5px; overflow: hidden;
            background: rgba(255, 255, 255, .1); flex: 0 0 auto;
        }
        .pegelbox i { display: block; height: 100%; width: 0; background: rgb(121, 158, 49); transition: width .07s linear; }
        .pegelwert { font-size: 0.7rem; opacity: .6; min-width: 5em; font-variant-numeric: tabular-nums; }
        .agc { font-size: 0.68rem; opacity: .7; display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .agc input { accent-color: var(--neon-blue); cursor: pointer; }
        .mikrowahl {
            font: inherit; font-size: 0.68rem; max-width: 230px; padding: 4px 8px; cursor: pointer;
            background: rgba(255, 255, 255, .05); color: inherit; border-radius: 7px;
            border: 1px solid rgba(255, 255, 255, .2);
        }
        .mikrowahl:focus { border-color: var(--neon-blue); outline: none; }
        .uhr.laeuft { color: rgb(176, 36, 24); }
        /* Clock and level meter show only while a take runs. At rest, "0:00" beside an empty bar
           looks exactly like a player's progress line (Doc, 24.09.2026: "progress dort raus"). */
        .regie .uhr, .regie .pegelbox, .regie .pegelwert, .regie .punkt, .regie .mikroname { display: none; }
        .mikroname { font-size: 0.66rem; opacity: .75; }
        .mikroname.fremd { color: rgb(245, 194, 66); opacity: 1; }
        .regie.aktiv .uhr, .regie.aktiv .pegelbox, .regie.aktiv .pegelwert, .regie.aktiv .punkt, .regie.aktiv .mikroname { display: inline-block; }

        .ikon {
            width: 52px; height: 52px; border-radius: 50%; padding: 0; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
            background: rgba(255, 255, 255, .03); border: 1px solid var(--neon-blue); color: var(--neon-blue);
            transition: background .15s, transform .1s;
        }
        .ikon svg { width: 22px; height: 22px; }
        .ikon:hover { background: rgba(0, 210, 255, .12); }
        .ikon:active { transform: scale(.94); }
        .ikon:disabled { opacity: .3; cursor: not-allowed; }
        .ikon[hidden] { display: none; }
        /* record: Doc's red - a filled dot at rest, a filled square while it runs */
        .ikon.rec { width: 64px; height: 64px; border-color: rgb(176, 36, 24); color: rgb(176, 36, 24); }
        .ikon.rec svg { width: 26px; height: 26px; }
        .ikon.rec:hover { background: rgba(176, 36, 24, .16); }
        .ikon.rec.stopp { background: rgb(176, 36, 24); color: #fff; animation: puls 1.2s infinite; }

        .punkt { width: 11px; height: 11px; border-radius: 50%; background: rgba(255, 255, 255, .25); display: inline-block; }
        .punkt.an { background: rgb(176, 36, 24); animation: puls 1s infinite; }
        @keyframes puls { 50% { opacity: .25; } }

        .liste { margin: 18px 0 0; }
        .zeile {
            display: flex; gap: 7px; align-items: center; padding: 6px 8px; border-radius: 8px;
            border: 1px solid transparent; font-size: 0.7rem; cursor: pointer; margin-bottom: 3px;
        }
        .zeile:hover { background: rgba(0, 210, 255, 0.07); }
        .vgl { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
        .vgl .cyber-btn {
            flex: 1 1 200px; width: auto !important; font-size: 0.66rem !important;
            cursor: pointer; border-radius: 8px;
            background: rgba(255, 255, 255, .03);
            border: 1px solid rgb(245, 194, 66); color: rgb(245, 194, 66);
        }
        .vgl .cyber-btn:hover { background: rgba(245, 194, 66, .14); }
        /* the icon says what a click does: play at rest, stop while this one plays */
        .vgl .cyber-btn { gap: 10px; }
        .vgl .cyber-btn svg { width: 15px; height: 15px; flex: 0 0 auto; }
        .vgl .ic-stop, .vgl .laeuft .ic-play { display: none; }
        .vgl .laeuft .ic-stop { display: inline-block; }
        .vgl .cyber-btn.laeuft { background: rgb(245, 194, 66); color: #0a0f1a; }

        .trenner {
            font-size: 0.6rem; letter-spacing: .14em; text-transform: uppercase;
            opacity: .45; margin: 12px 0 6px 8px;
        }
        .zeile.fertig { border-color: rgba(121, 158, 49, .45); }
        .zeile.angeschnitten { border-color: rgb(245, 194, 66); background: rgba(245, 194, 66, .07); }
        .zeile.hier { background: rgba(0, 210, 255, 0.12); border-color: var(--neon-blue); }
        .zeile .txt { font-family: 'Outfit', sans-serif; flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .zeile .sek { opacity: .6; font-variant-numeric: tabular-nums; min-width: 3.1em; text-align: right; }
        .zeile .sek.warn { color: rgb(245, 194, 66); opacity: 1; font-weight: 700; }
        .zeile button {
            background: none; border: 1px solid rgba(255, 255, 255, .18); color: inherit;
            border-radius: 6px; padding: 3px 5px; cursor: pointer; font: inherit; line-height: 0; flex: 0 0 auto;
        }
        .zeile button:hover { border-color: rgb(245, 194, 66); }
        .zeile svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; }

        .hinweis { font-size: 0.78rem; opacity: .72; line-height: 1.6; margin: 20px 0; }
        .hinweis code { font-size: 0.9em; opacity: .9; }
        .warnkasten {
            margin: 16px 0; padding: 12px 16px; border-radius: 10px; font-size: 0.82rem; line-height: 1.6;
            background: rgba(245, 194, 66, .12); border: 1px solid rgba(245, 194, 66, .5);
        }

        @media (max-width: 560px) {
            .regie .cyber-btn { flex: 1 1 100%; }
            #satztext { max-height: 40vh; }
        }
    </style>
</head>

<body>
    <main id="main-content">
    <div class="booth">
        <div class="bahn">
        <h1 style="margin:26px 0 4px;font-size:clamp(1.3rem,4vw,2rem)">Stimmklon — Aufnahmekabine</h1>
        <p class="hinweis" style="margin-top:0">
            Sprich so, wie du im Labor redest — nicht vorlesen, erzählen. Bei den langen Stücken ruhig
            atmen und Fehler einfach überlesen, das stört den Klon nicht.
        </p>

        <div class="zaehler">
            <span><b id="minuten">0</b><span id="einheit"> s Referenz</span></span>
            <span id="urteil" class="fehlt">noch nichts</span>
            <span id="stand" style="opacity:.6"></span>
        </div>
        <div class="balken"><i id="fortschritt"></i></div>

        <div id="warnung"></div>

        <div class="satz" id="satz">
            <span class="nr" id="satznr">…</span>
            <span id="satztext">…</span>
        </div>

        <div class="vgl">
            <button class="cyber-btn" data-hoer="vergleich-original"><svg class="ic-play" viewBox="0 0 24 24"><polygon points="8,5 19,12 8,19" fill="currentColor"/></svg><svg class="ic-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2" fill="currentColor"/></svg><span>Original — Doc am RØDE</span></button>
            <button class="cyber-btn" data-hoer="vergleich-klon"><svg class="ic-play" viewBox="0 0 24 24"><polygon points="8,5 19,12 8,19" fill="currentColor"/></svg><svg class="ic-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2" fill="currentColor"/></svg><span>Klon</span></button>
            <button class="cyber-btn" data-hoer="vergleich-klon-eq"><svg class="ic-play" viewBox="0 0 24 24"><polygon points="8,5 19,12 8,19" fill="currentColor"/></svg><svg class="ic-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2" fill="currentColor"/></svg><span>Klon + Höhen (+3 dB ab 6 kHz)</span></button>
        </div>
        <div class="regie">
            <div class="transport">
                <div class="seite links">
                    <button class="ikon" id="btnPrev" title="Voriger Text (←)" aria-label="Voriger Text"><svg viewBox="0 0 24 24"><polygon points="17,5 8,12 17,19" fill="currentColor"/><rect x="5" y="5" width="2.4" height="14" rx="1" fill="currentColor"/></svg></button>
                </div>
                <button class="ikon rec" id="btnRec" title="Aufnehmen (Leertaste)" aria-label="Aufnehmen"></button>
                <div class="seite rechts">
                    <button class="ikon" id="btnPlay" hidden title="Anhören" aria-label="Anhören"><svg viewBox="0 0 24 24"><polygon points="8,5 19,12 8,19" fill="currentColor"/></svg></button>
                    <button class="ikon" id="btnNext" title="Nächster Text (→)" aria-label="Nächster Text"><svg viewBox="0 0 24 24"><polygon points="7,5 16,12 7,19" fill="currentColor"/><rect x="16.6" y="5" width="2.4" height="14" rx="1" fill="currentColor"/></svg></button>
                </div>
            </div>
            <div class="laufzeile">
                <span class="punkt" id="punkt" title="Aufnahme"></span>
                <span class="uhr" id="uhr">0:00</span>
                <span class="pegelbox" title="Aussteuerung"><i id="pegel"></i></span>
                <span class="pegelwert" id="pegelwert"></span>
                <span class="mikroname" id="mikroname"></span>
            </div>
            <div class="optionen" hidden>
                <label class="agc"><input type="checkbox" id="agc"> Aussteuerung automatisch</label>
                <label class="agc" for="mikro">Mikrofon</label>
                <select id="mikro" class="mikrowahl" title="Mikrofon"></select>
            </div>
        </div>
        <p class="hinweis" id="tipp"></p>


        <div class="liste" id="liste"></div>
        <p class="hinweis alle-zeile">
            <label class="pille"><input type="checkbox" id="alle"><span>alle Texte zeigen</span></label>
        </p>

        </div>
    </div>
    </main>

    <script src="js/cyber-left-chrome.js"></script>
    <script src="js/branding/briefings.js"></script>
    <script src="js/branding/overlays.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/branding/nav.js"></script>
    <script src="js/branding.js"></script>
    <script src="js/ui.js"></script>
    <script>
        /* The script Doc reads. Short lines first (they carry his catchphrase and his range),
           then long passages - a clone needs MINUTES of connected speech, not a list of snippets.
           The ids never change: they are the file names on disk, and renaming one would orphan
           a take Doc already recorded. */
        const SAETZE = [
            { id: 'einwilligung', text: 'Ich bin der Eigentümer dieser Stimme und bin damit einverstanden, dass Google diese Stimme zur Erstellung eines synthetischen Stimmmodells verwendet.', hinweis: 'Einwilligung — wortwörtlich so, das verlangt Google.' },
            { id: 'story', hinweis: 'Die Geschichte — 30 Sekunden, das eigentliche Training. Gedankenstriche sind Pausen; bei „Mensch" ruhig seufzen; das Lachen nicht spielen.', text: [
                'Also. Ich sitze da, halb zwölf nachts, und die Gleichung geht einfach nicht auf. Dreimal gerechnet, dreimal derselbe Unsinn. Und ich denke: Du hast Physik studiert, Mensch — und kriegst das nicht hin.',
                'Und dann, plötzlich: da war ein Vorzeichen. Ein einziges Minus, an der falschen Stelle!',
                'Ich hab laut gelacht. Um Mitternacht, allein in der Küche. So ist Mathe: ärgert dich stundenlang, und beschenkt dich in einer Sekunde.',
            ] },
            { id: 's01', text: 'Nicht verzagen, Doc Alvers fragen!' },
            { id: 's02', text: 'Herzlich willkommen im Mathe-Labor. Schön, dass ihr da seid.' },
            { id: 's03', text: 'Schauen wir uns das mal in Ruhe an: Was passiert eigentlich, wenn wir den Radius verdoppeln?' },
            { id: 's04', text: 'Das Volumen einer Kugel ist vier Drittel mal Pi mal r hoch drei — und die Oberfläche vier Pi r Quadrat.' },
            { id: 's05', text: 'Moment mal. Genau da steckt der Fehler drin, und zwar ein ziemlich hübscher.' },
            { id: 's06', text: 'Zweiundvierzig, siebzehn, dreihundertacht, null Komma fünf, minus neunzehn.' },
            { id: 's07', text: 'Die Ableitung von x Quadrat ist zwei x. Das klingt banal, ist aber der ganze Trick.' },
            { id: 's08', text: 'Wahnsinn, oder? Genau deswegen liebe ich diesen Satz so sehr!' },
            { id: 's09', text: 'Ganz ehrlich: Am Anfang habe ich das auch nicht verstanden. Überhaupt nicht.' },
            { id: 's10', text: 'Ein Würfel, ein Tetraeder, ein Oktaeder, ein Dodekaeder, ein Ikosaeder — fünf Stück, mehr gibt es nicht.' },
            { id: 's11', text: 'Nächste Woche schreiben wir darüber eine kurze Übung. Keine Panik, das schafft ihr.' },
            { id: 's12', text: 'Zeichnet euch das bitte auf, das hilft ungemein. Erst skizzieren, dann rechnen.' },
            { id: 's13', text: 'Und jetzt kommt der Teil, der mich wirklich umgehauen hat, als ich Physik studiert habe.' },
            { id: 's14', text: 'Fragen? Immer her damit. Es gibt keine dummen Fragen, nur ungestellte.' },

            { id: 't01', titel: 'Die Kugel und der Becher', text: [
                'Ich möchte euch etwas zeigen, das über zweitausend Jahre alt ist und mich immer noch jedes Mal umhaut. Archimedes war so stolz darauf, dass er sich eine Kugel in einem Zylinder auf den Grabstein meißeln ließ. Nicht seinen Namen, nicht seine Schlachten — eine Kugel in einem Zylinder.',
                'Stellt euch einen Zylinder vor, in den eine Kugel exakt hineinpasst. Der Zylinder ist also genau so hoch wie die Kugel dick ist, und genau so weit. Die Frage ist: In welchem Verhältnis stehen die beiden Rauminhalte zueinander? Man könnte vermuten, das sei irgendeine krumme Zahl mit Pi und Wurzeln und allem Drum und Dran.',
                'Ist es aber nicht. Die Kugel füllt genau zwei Drittel des Zylinders. Zwei Drittel. Eine so schlichte Zahl, dass man sie sich nach einmal Hören merkt. Und es kommt noch besser: Auch die Oberflächen stehen im Verhältnis zwei zu drei, wenn man Deckel und Boden mitzählt. Dieselbe Zahl, zweimal, an zwei völlig verschiedenen Stellen.',
                'Warum ist das so? Archimedes hatte kein Integral, keine Infinitesimalrechnung, gar nichts von dem Werkzeug, das wir heute selbstverständlich benutzen. Er hat die Kugel in Scheiben zerlegt und gegen einen Kegel abgewogen, im Kopf, mit einer gedachten Waage. Das ist keine Rechnung, das ist eine Idee. Und die Idee ist so gut, dass sie zweitausend Jahre später immer noch die schönste Erklärung ist, die wir haben.',
                'Wenn ihr also das nächste Mal eine Kugel in der Hand haltet — einen Ball, eine Orange, was auch immer — dann denkt kurz daran: zwei Drittel. Der Rest ist Luft.',
            ] },

            { id: 't02', titel: 'Warum es nur fünf gibt', text: [
                'Es gibt genau fünf platonische Körper. Nicht ungefähr fünf, nicht fünf, soweit wir bisher gesucht haben — genau fünf, und mehr wird es nie geben. Das ist einer der ersten Sätze der Mathematikgeschichte, bei dem jemand nicht nur etwas gefunden, sondern bewiesen hat, dass es nichts weiter zu finden gibt.',
                'Ein platonischer Körper muss drei Bedingungen erfüllen. Alle Flächen sind dasselbe regelmäßige Vieleck. An jeder Ecke treffen gleich viele Flächen zusammen. Und der Körper ist konvex, hat also keine Dellen. Das klingt nach wenig. Es ist aber so streng, dass fast nichts übrig bleibt.',
                'Schauen wir mal. Nehmen wir gleichseitige Dreiecke. An einer Ecke müssen mindestens drei zusammenkommen, sonst wird es flach. Drei Dreiecke ergeben das Tetraeder, vier ergeben das Oktaeder, fünf das Ikosaeder. Und sechs? Sechs Dreiecke zu sechzig Grad ergeben dreihundertsechzig Grad — das ist eine Ebene, kein Körper. Ende der Fahnenstange.',
                'Mit Quadraten: drei an einer Ecke ergeben den Würfel. Vier Quadrate sind wieder dreihundertsechzig Grad, also flach. Mit Fünfecken: drei ergeben das Dodekaeder, vier passen gar nicht mehr. Und mit Sechsecken? Schon drei Sechsecke ergeben dreihundertsechzig Grad. Es geht nicht einmal los.',
                'Das war es. Fünf Stück. Tetraeder, Würfel, Oktaeder, Dodekaeder, Ikosaeder. Wir haben sie nicht gesucht und gefunden, wir haben nachgewiesen, dass die Liste vollständig ist. Kepler war davon so ergriffen, dass er das Sonnensystem daraus bauen wollte. Er lag falsch, aber ich verstehe ihn vollkommen.',
            ] },

            { id: 't03', titel: 'Der Moment mit der Ableitung', text: [
                'Ich erinnere mich genau an den Moment, in dem ich verstanden habe, was eine Ableitung eigentlich ist. Vorher war das für mich eine Rechenregel: x hoch n wird zu n mal x hoch n minus eins. Die konnte ich anwenden, ohne die leiseste Ahnung zu haben, wovon ich da eigentlich rede.',
                'Und dann hat jemand gesagt: Die Ableitung ist die Steigung. Nicht irgendeine Steigung, sondern die Steigung in einem einzigen Punkt. Und da habe ich zum ersten Mal gestutzt. Denn eine Steigung braucht doch zwei Punkte. Höhenunterschied geteilt durch Längenunterschied — das ist die Definition. Wie soll das mit einem Punkt gehen?',
                'Genau das ist der Trick, und er ist frech. Man nimmt zwei Punkte, rechnet die Steigung aus, und lässt die beiden Punkte dann aufeinander zuwandern. Immer näher. Die Steigung ändert sich dabei, und man schaut, wohin sie strebt. Man setzt die Punkte niemals aufeinander — das wäre null geteilt durch null und damit sinnlos. Man schaut nur, wohin die Reise geht.',
                'Dieser Umweg ist die ganze Differentialrechnung. Newton und Leibniz haben ihn unabhängig voneinander gefunden und sich danach jahrzehntelang darüber gestritten, wer zuerst da war. Und beide konnten nicht sauber erklären, was dieses Immer-näher eigentlich bedeutet. Es hat noch einmal hundertfünfzig Jahre gedauert, bis Weierstraß das ordentlich hingeschrieben hat.',
                'Das finde ich tröstlich. Wenn zwei der größten Köpfe der Geschichte etwas benutzen konnten, das sie nicht vollständig durchschaut haben, dann darf es euch beim ersten Mal auch komisch vorkommen. Das ist kein Zeichen von Dummheit. Das ist das richtige Gefühl an der richtigen Stelle.',
            ] },

            { id: 't04', titel: 'Es gibt größere Unendlichkeiten', text: [
                'Jetzt wird es kurz schwindelerregend, aber bleibt bei mir, es lohnt sich. Wir zählen: eins, zwei, drei, vier, und so weiter. Das hört nie auf, es sind unendlich viele. So weit, so bekannt.',
                'Jetzt die geraden Zahlen: zwei, vier, sechs, acht. Davon gibt es doch offensichtlich weniger, oder? Nur jede zweite. Falsch. Ich kann jeder Zahl genau eine gerade Zahl zuordnen: der Eins die Zwei, der Zwei die Vier, der Drei die Sechs. Keine bleibt übrig, keine fehlt. Also sind es gleich viele. Das ist bei unendlichen Mengen nicht paradox, das ist einfach so.',
                'Und die Brüche? Alle Brüche, die es gibt, zwischen allen ganzen Zahlen? Auch die kann man durchnummerieren. Cantor hat sie in ein unendliches Gitter geschrieben und ist diagonal durchgelaufen. Jeder Bruch kommt dran, jeder kriegt eine Nummer. Gleich viele wie die natürlichen Zahlen. Obwohl zwischen null und eins schon unendlich viele liegen.',
                'Man glaubt langsam, alle Unendlichkeiten seien gleich groß. Und dann kommt Cantor und zeigt: Die reellen Zahlen kann man nicht durchnummerieren. Er nimmt an, jemand hätte eine vollständige Liste, und baut daraus eine Zahl, die garantiert nicht drin vorkommt — indem er die erste Nachkommastelle der ersten Zahl ändert, die zweite der zweiten, und so weiter. Diese neue Zahl unterscheidet sich von jeder einzelnen in der Liste an mindestens einer Stelle. Die Liste war also nie vollständig.',
                'Es gibt größere und kleinere Unendlichkeiten. Cantor wurde dafür angefeindet, ein Kollege nannte es eine Krankheit. Heute steht es in jedem Lehrbuch. Manchmal braucht die Wahrheit einfach eine Generation.',
            ] },

            { id: 't05', titel: 'Pi und die Frage nach dem Ende', text: [
                'Pi ist das Verhältnis von Umfang zu Durchmesser bei einem Kreis. Bei jedem Kreis. Bei einem Suppenteller, bei einem Fahrradreifen, beim Äquator. Immer dieselbe Zahl, drei Komma eins vier eins fünf neun und so weiter.',
                'Archimedes hat sie eingesperrt. Er hat dem Kreis ein Vieleck einbeschrieben und eins umbeschrieben. Das innere ist kleiner als der Kreis, das äußere größer — also liegt Pi dazwischen. Dann hat er die Eckenzahl verdoppelt, wieder und wieder, bis zum Sechsundneunzigeck. Von Hand. Ohne Dezimalschreibweise, ohne Taschenrechner. Ergebnis: Pi liegt zwischen drei und einem Siebtel und drei und zehn Einundsiebzigsteln. Auf zwei Stellen genau, und diese Schranke hielt fast zweitausend Jahre.',
                'Später kam die Frage: Hört das jemals auf? Wiederholt sich das Muster irgendwann? Die Antwort kam erst siebzehnhunderteinundsechzig von Lambert: Nein. Pi ist irrational, es gibt keinen Bruch, der es exakt trifft. Und achtzehnhundertzweiundachtzig hat Lindemann noch eins draufgesetzt: Pi ist transzendent. Es ist nicht Lösung irgendeiner Polynomgleichung mit ganzzahligen Koeffizienten.',
                'Und damit war eine zweitausend Jahre alte Frage beantwortet, an der sich Generationen die Zähne ausgebissen haben: die Quadratur des Kreises. Ein Quadrat mit demselben Flächeninhalt wie ein gegebener Kreis, nur mit Zirkel und Lineal. Das geht nicht. Nicht, weil wir zu dumm waren. Es geht prinzipiell nicht, und Lindemann hat gezeigt, warum.',
                'Ich finde es großartig, dass die Antwort auf eine geometrische Frage aus der Zahlentheorie kam. Völlig anderes Zimmer, und plötzlich steht die Lösung darin.',
            ] },

            { id: 't06', titel: 'Die schönste Formel', text: [
                'Es gibt eine Formel, die regelmäßig zur schönsten der Mathematik gewählt wird. Sie ist kurz genug für einen Ring: e hoch i mal Pi plus eins gleich null.',
                'Schaut euch an, wer da alles zu Besuch ist. Die Null, das Nichts, der Nullpunkt. Die Eins, der Anfang allen Zählens. Pi, aus der Geometrie des Kreises. Die eulersche Zahl e, aus dem Wachstum, aus Zinsen und Zerfall. Und i, die Wurzel aus minus eins, diese Zahl, die es eigentlich nicht geben dürfte und die man erst erfinden musste.',
                'Fünf Konstanten, die aus fünf völlig verschiedenen Ecken der Mathematik kommen, zu verschiedenen Zeiten von verschiedenen Leuten aus verschiedenen Gründen eingeführt. Und sie stehen in einer einzigen Gleichung, die auf null aufgeht. Ohne Rest, ohne Korrekturfaktor, ohne ungefähr.',
                'Was bedeutet das? e hoch i mal x beschreibt eine Drehung im Kreis. Setzt man für x den Wert Pi ein, dreht man um einen halben Kreis — hundertachtzig Grad. Man landet bei minus eins. Zählt man eins dazu, ist man bei null. So gesehen ist die Formel fast eine Trivialität: eine halbe Umdrehung bringt dich auf die andere Seite.',
                'Aber dieses So-gesehen ist eben das Ergebnis von dreihundert Jahren Arbeit. Erst als klar war, dass die Exponentialfunktion im Komplexen eine Drehung ist, wurde aus einer rätselhaften Formel eine selbstverständliche. Das ist für mich der eigentliche Kern von Mathematik: Man arbeitet so lange, bis das Unfassbare selbstverständlich aussieht.',
            ] },

            { id: 't07', titel: 'Der Zufall hat kein Gedächtnis', text: [
                'Ein Würfel ist viermal hintereinander auf der Sechs gelandet. Wie groß ist die Wahrscheinlichkeit, dass beim fünften Wurf wieder eine Sechs kommt? Ein Sechstel. Genau wie vorher. Der Würfel weiß nicht, was er vorher gemacht hat. Er hat kein Gedächtnis, kein Gewissen und keinen Ausgleichsbedarf.',
                'Trotzdem sträubt sich alles in uns dagegen. Das nennt man den Spielerfehlschluss, und es gibt eine berühmte Nacht dazu: Achtzehnhundertdreizehn fiel in Monte Carlo sechsundzwanzigmal hintereinander Schwarz. Die Leute haben Vermögen auf Rot gesetzt, weil doch jetzt endlich Rot kommen müsse. Die Kugel hat davon nie erfahren.',
                'Der Haken ist: Auf lange Sicht gleicht es sich tatsächlich aus, das Gesetz der großen Zahlen stimmt ja. Aber es gleicht sich nicht durch Nachholen aus, sondern durch Verdünnen. Die vier Sechsen verschwinden nicht, sie werden von zehntausend weiteren Würfen einfach unbedeutend gemacht. Kein Ausgleich, nur Verwässerung.',
                'Und jetzt der umgekehrte Fehler, der genauso oft passiert. Wie wahrscheinlich ist es, dass in einer Klasse mit dreiundzwanzig Leuten zwei am selben Tag Geburtstag haben? Die meisten schätzen ein paar Prozent. Es sind über fünfzig. Bei fünfzig Personen sind es siebenundneunzig Prozent. Der Grund: Es kommt nicht darauf an, wie viele Personen da sind, sondern wie viele Paare — und bei dreiundzwanzig Personen sind das schon zweihundertdreiundfünfzig Paare.',
                'Unser Bauchgefühl ist beim Zufall regelmäßig daneben. Deshalb rechnet man. Nicht weil Rechnen schöner wäre als Fühlen, sondern weil das Gefühl hier zuverlässig lügt.',
            ] },

            { id: 't08', titel: 'Der Satz, den jeder kennt', text: [
                'a Quadrat plus b Quadrat gleich c Quadrat. Den Satz des Pythagoras kennt wirklich jeder, auch Leute, die sonst mit Mathematik nichts am Hut haben. Und fast alle erinnern sich nur an die Formel, nicht an das Bild dahinter. Dabei ist das Bild der ganze Punkt.',
                'Es geht nämlich nicht um Buchstaben, es geht um Flächen. Setzt auf jede Seite eines rechtwinkligen Dreiecks ein echtes Quadrat. Dann ist die Fläche des großen Quadrats auf der langen Seite genau so groß wie die beiden kleinen zusammen. Man kann die beiden kleinen zerschneiden und das große damit auslegen, ohne Rest, ohne Lücke. Es gibt Beweise, die genau das tun, nur mit Schere und Papier.',
                'Und es muss nicht einmal ein Quadrat sein. Setzt Halbkreise auf die Seiten, oder gleichseitige Dreiecke, oder kleine Elefanten, wenn sie nur alle dieselbe Form haben — die Rechnung stimmt immer noch. Die beiden kleinen ergeben zusammen das große. Das hat mich beim ersten Hören mehr beeindruckt als der Satz selbst.',
                'Der Name ist übrigens fragwürdig. Die Babylonier kannten solche Zahlentripel tausend Jahre vor Pythagoras, es gibt eine Tontafel mit fünfzehn davon. Die Inder und die Chinesen kannten den Zusammenhang ebenfalls. Was der griechischen Schule zugeschrieben wird, ist der Beweis — die Einsicht, dass es nicht nur für die geprüften Fälle gilt, sondern für alle, auch die, die nie jemand nachmessen wird.',
                'Dieser Sprung vom Beispiel zum Beweis ist der Moment, in dem aus Rechnen Mathematik wird. Alles andere ist Buchhaltung.',
            ] },

            { id: 't09', titel: 'Primzahlen hören nicht auf', text: [
                'Eine Primzahl ist nur durch eins und durch sich selbst teilbar. Zwei, drei, fünf, sieben, elf, dreizehn. Sie sind die Bausteine: Jede Zahl lässt sich in Primfaktoren zerlegen, und zwar auf genau eine Weise. Das ist der Grund, warum sie überhaupt wichtig sind.',
                'Je weiter man kommt, desto seltener werden sie. Zwischen eins und hundert liegen fünfundzwanzig, zwischen einer Million und einer Million plus hundert nur noch sechs. Da liegt die Frage nahe: Gehen sie irgendwann aus? Gibt es eine größte Primzahl, hinter der nichts mehr kommt?',
                'Euklid hat das vor über zweitausend Jahren beantwortet, mit einem Argument, das man in drei Sätzen erzählen kann. Angenommen, es gäbe nur endlich viele. Dann multipliziert man sie alle miteinander und addiert eins. Diese neue Zahl ist durch keine der Primzahlen aus der Liste teilbar — es bleibt immer der Rest eins. Also ist sie entweder selbst prim, oder sie hat einen Primfaktor, der nicht auf der Liste stand. So oder so: Die Liste war unvollständig. Und da wir jede endliche Liste so widerlegen können, gibt es unendlich viele.',
                'Was ich daran so mag: Der Beweis nennt keine einzige neue Primzahl. Er sagt nicht, wo die nächste liegt. Er zeigt nur, dass es sie geben muss. Man weiß, dass der Vorrat nie ausgeht, ohne ihn je gesehen zu haben.',
                'Und ganz nebenbei sitzt genau das heute in jeder verschlüsselten Verbindung. Zwei große Primzahlen zu multiplizieren ist leicht. Das Ergebnis wieder auseinanderzunehmen ist so schwer, dass die Sicherheit Ihrer Bankgeschäfte davon abhängt. Zweitausend Jahre alte Zahlentheorie, die niemand für brauchbar hielt.',
            ] },

            { id: 't10', titel: 'Galilei und der schiefe Turm', text: [
                'Was fällt schneller: eine schwere Kugel oder eine leichte? Zweitausend Jahre lang war die Antwort klar, Aristoteles hatte es gesagt: die schwere. Klingt vernünftig. Ist aber falsch, und man braucht nicht einmal ein Experiment, um das zu merken.',
                'Galilei hat es so gedreht. Angenommen, Schweres fällt schneller. Jetzt binde ich eine schwere und eine leichte Kugel zusammen. Was passiert? Einerseits müsste die leichte die schwere bremsen, das Gespann wäre also langsamer als die schwere allein. Andererseits sind beide zusammen schwerer als die schwere allein, das Gespann müsste also schneller fallen. Beides zugleich geht nicht. Die Annahme war falsch.',
                'Das ist reines Nachdenken, kein Turm, keine Kugeln, kein Messgerät. Ob er wirklich in Pisa geworfen hat, ist bis heute umstritten. Was er nachweislich getan hat, ist klüger: Er hat Kugeln schiefe Ebenen hinunterrollen lassen. Damit wird der Fall langsam genug, um ihn mit den Uhren von damals überhaupt messen zu können. Und er fand: Die zurückgelegte Strecke wächst mit dem Quadrat der Zeit. Doppelte Zeit, vierfache Strecke.',
                'Warum fällt dann eine Feder langsamer als ein Stein? Wegen der Luft, nicht wegen des Gewichts. Die Apollo-fünfzehn-Besatzung hat das auf dem Mond vorgeführt, mit einem Hammer und einer Falkenfeder. Beide kamen gleichzeitig an. Es gibt Aufnahmen davon, und man hört den Astronauten lachen.',
                'Für mich ist das die Geburtsstunde der Physik: nicht, dass Galilei eine bessere Antwort hatte, sondern dass er anfing, die Natur zu fragen statt die Bücher.',
            ] },

            { id: 't11', titel: 'Der goldene Schnitt, nüchtern betrachtet', text: [
                'Der goldene Schnitt hat unter allen mathematischen Konstanten die beste Presse und die schlechteste Faktenlage. Fangen wir mit dem an, was wirklich stimmt.',
                'Teile eine Strecke so, dass sich der größere Teil zum kleineren verhält wie die ganze Strecke zum größeren. Dieses Verhältnis ist Phi, ungefähr eins Komma sechs eins acht. Es ist die einzige Zahl, bei der Phi minus eins gleich eins durch Phi ist. Zieht man eins ab oder bildet den Kehrwert — es kommt fast dasselbe heraus. So eine Zahl gibt es kein zweites Mal.',
                'Noch schöner wird es mit Fibonacci. Eins, eins, zwei, drei, fünf, acht, dreizehn, einundzwanzig, jede Zahl die Summe der beiden davor. Teilt man aufeinanderfolgende Glieder, nähert man sich Phi an. Und in der Natur taucht das tatsächlich auf: Sonnenblumenkerne, Tannenzapfen, die Anordnung von Blättern am Stängel. Das ist kein Mystizismus, es hat einen handfesten Grund. Phi ist in einem präzisen Sinn die am schlechtesten durch Brüche annäherbare Zahl — und deshalb ist es der beste Drehwinkel, wenn sich Blätter möglichst wenig gegenseitig beschatten sollen.',
                'Und jetzt der Teil, den man selten dazusagt. Dass der Parthenon nach dem goldenen Schnitt gebaut sei, dass Leonardo ihn benutzt habe, dass die Mona Lisa darauf aufgebaut sei — dafür gibt es keine belastbaren Belege. Man kann in jedes hinreichend komplizierte Bauwerk irgendein Rechteck legen, das ungefähr passt. Die meisten dieser Behauptungen stammen aus dem neunzehnten Jahrhundert.',
                'Die Wahrheit ist interessanter als der Mythos. Wir brauchen die Kunstgeschichte nicht, um Phi großartig zu finden. Die Sonnenblume reicht völlig.',
            ] },

            { id: 't12', titel: 'Warum ich das mache', text: [
                'Ich werde oft gefragt, warum ich Mathematik unterrichte, wo ich doch eigentlich Physiker bin und jahrelang etwas ganz anderes gemacht habe. Die ehrliche Antwort ist: wegen eines bestimmten Gesichtsausdrucks.',
                'Es gibt einen Moment, den man sieht. Jemand sitzt vor einem Problem, rechnet herum, kommt nicht weiter, wird langsam ärgerlich — und dann passiert etwas. Die Stirn glättet sich, der Kopf hebt sich, und meistens kommt ein sehr leises Ach so. Nicht laut, fast nebenbei. Das ist der Moment, in dem etwas von außen nach innen gewandert ist. Vorher war die Sache im Buch, jetzt ist sie im Kopf, und da bleibt sie auch.',
                'Man kann diesen Moment nicht erzwingen und nicht abkürzen. Man kann niemandem etwas erklären, das er nicht selbst gerade versucht zu verstehen. Erklären ist keine Übertragung, es ist eine Einladung. Und manchmal dauert die Einladung drei Wochen, und ich habe längst aufgegeben, und dann kommt jemand in der Pause und sagt: Ich glaub, ich hab das jetzt.',
                'Dafür lohnt sich der ganze Aufwand. Die Labore, die Filme, die Animationen — das ist alles nur Werkzeug, damit dieser Moment öfter passiert. Ein Körper, den man drehen kann, zeigt in zehn Sekunden, wofür eine Tafelzeichnung zehn Minuten braucht und dann immer noch schief ist.',
                'Und wenn jemand danach nie wieder eine Kugel berechnet — auch gut. Dann hat er trotzdem einmal erlebt, wie es sich anfühlt, wenn etwas Kompliziertes plötzlich einfach wird. Das ist ein Gefühl, das trägt. Auch weit außerhalb der Mathematik.',
            ] },
        ];

        const ICON_PLAY = '<svg viewBox="0 0 24 24"><polygon points="7,4 20,12 7,20" fill="currentColor" stroke="none"/></svg>';
        const ICON_WEG = '<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';

        /* Only two texts are needed now: the consent line and the story Google actually learns
           from. The other 27 stay in SAETZE - Doc, 24.09.2026: "nicht wegwerfen, vlt. brauchen
           wir das noch" - and the switch below brings them back. */
        const G_MIN = 10, G_MAX = 30;      // Google's reference window, same as tools/stimme-hochladen.py
        // Only the story is shown: the consent recording is done and stays valid, and Google
        // takes it from disk (Doc, 24.09.2026: "Ich bin Eigentümer auch raus").
        const NUR = ['story'];
        let alleZeigen = false;
        const sichtbar = () => alleZeigen ? SAETZE : SAETZE.filter(s => NUR.includes(s.id));

        const alsText = s => Array.isArray(s.text) ? s.text.join(' ') : s.text;
        /* A rough reading pace, used only to spot a take that was cut off: German read aloud runs at
           roughly 13 characters a second. A take under 55 % of that lost its tail and must be redone. */
        const erwartet = s => alsText(s).length / 13;

        let i = 0, takes = {}, rec = null, stream = null, laeuft = false, uhrAb = 0, uhrTakt = null;
        let klang = null, falscherServer = false;                 // keep the Audio alive: a bare new Audio().play() can be collected mid-play
        const $ = id => document.getElementById(id);

        /* Live reload must not pull the page out from under a running take - the recording would be
           gone without a trace. Same hook filmkritik.html and cyber-tour.js use (tools/live_reload.py). */
        window.__liveReloadBusy = () => laeuft;

        /* Automatic gain: ON by default, because the built-in mic is far too quiet without it
           (22.09., -55 dB takes). A RØDE does not need it and sounds cleaner without - hence the
           switch. Changing it drops the stream, so the next take opens the microphone afresh. */
        /* Gain is ON, as in the story that made the good clone (24.09.2026). The switch is hidden
           (Doc: "müssen wir das haben?"), so a remembered 'off' would act unseen - ignore it. */
        $('agc').checked = true;
        /* Which microphone: Chrome silently takes the system default, and that is how a RØDE
           gets ignored while the built-in one records (24.09.2026). Device labels stay empty
           until permission was granted once - so the list is refilled after that. */
        async function mikroListe() {
            let geraete = [];
            try { geraete = (await navigator.mediaDevices.enumerateDevices()).filter(g => g.kind === 'audioinput'); }
            catch (e) { return; }
            const w = $('mikro');
            w.innerHTML = '<option value="">Systemvorgabe</option>' + geraete.map(g =>
                '<option value="' + g.deviceId + '">' + (g.label || 'Mikrofon') + '</option>').join('');
            // A RØDE, when plugged in, always wins - the menu is hidden, so an old pick (say the
            // built-in mic) must not quietly lock the RØDE out. Otherwise the system default.
            const rode = geraete.find(g => /r[oø]de/i.test(g.label || ''));
            w.value = rode ? rode.deviceId : '';
        }
        mikroListe();
        $('mikro').onchange = () => {
            try { localStorage.setItem('mikro', $('mikro').value); } catch (e) { }
            if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
            $('tipp').textContent = 'Mikrofon gewechselt — beim nächsten Start wirksam.'; verblasse();
        };

        $('alle').onchange = () => { alleZeigen = $('alle').checked; i = 0; zeichne(); };

        $('agc').onchange = () => {
            try { localStorage.setItem('agc', $('agc').checked ? 'an' : 'aus'); } catch (e) { }
            if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
            $('tipp').textContent = 'Aussteuerung ' + ($('agc').checked ? 'automatisch' : 'aus')
                + ' — beim nächsten Start wirksam. Pegel im Auge behalten.'; verblasse(4000);
        };

        // Anything that throws used to fail silently and look like "nothing was recorded" - say it out loud.
        const verblasse = (ms = 3000) => {
            const war = $('tipp').textContent;
            setTimeout(() => { if ($('tipp').textContent === war) $('tipp').textContent = ''; }, ms);
        };

        window.addEventListener('error', e => { $('tipp').textContent = 'Fehler: ' + e.message; });
        window.addEventListener('unhandledrejection', e => {
            $('tipp').textContent = 'Fehler: ' + ((e.reason && e.reason.message) || e.reason);
        });
        const zuKurz = (s, t) => t && t.sekunden > 0 && t.sekunden < erwartet(s) * 0.55;
        // the server measures every take with ffmpeg volumedetect; under -45 dB there is no voice in it
        const zuLeise = t => t && typeof t.pegel === 'number' && t.pegel < -45;
        const taugtNicht = (s, t) => zuKurz(s, t) || zuLeise(t);

        function zeichne() {
            const LISTE = sichtbar(), s = LISTE[i], lang = Array.isArray(s.text);
            $('satznr').textContent = s.hinweis || (lang ? ('Langer Text — ' + s.titel) : ('Text ' + (i + 1) + ' von ' + LISTE.length));
            $('satztext').className = lang ? '' : 'kurz';
            $('satztext').innerHTML = lang
                ? s.text.map(p => '<p>' + p + '</p>').join('')
                : s.text;
            $('satz').classList.toggle('laeuft', laeuft);
            $('punkt').classList.toggle('an', laeuft);
            const REC = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="currentColor"/></svg>';
            const STOP = '<svg viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2" fill="currentColor"/></svg>';
            $('btnRec').innerHTML = laeuft ? STOP : REC;
            const wort = laeuft ? 'Stopp' : (takes[s.id] ? 'Neu aufnehmen' : 'Aufnehmen');
            $('btnRec').title = wort + ' (Leertaste)'; $('btnRec').setAttribute('aria-label', wort);
            $('btnRec').classList.toggle('stopp', laeuft);
            document.querySelector('.regie').classList.toggle('aktiv', laeuft);
            // one text: nothing to page through, so the arrows stay out of sight
            $('btnPrev').hidden = $('btnNext').hidden = !alleZeigen;
            $('btnPrev').disabled = laeuft || i === 0;
            $('btnNext').disabled = laeuft || i >= LISTE.length - 1;
            $('btnPlay').disabled = !takes[s.id];

            // only takes that are not obviously truncated count towards the goal
            let gut = 0, kaputt = 0;
            LISTE.forEach(x => {
                const t = takes[x.id];
                if (!t || !t.sekunden) return;
                if (taugtNicht(x, t)) kaputt++; else gut += t.sekunden;
            });
            /* The bar measures what Google actually asks for: ONE reference take of 10-30 s,
               plus the consent recording. The old scale ran to 30 minutes - that was ElevenLabs,
               which wants as much material as it can get, and it made a perfect take read
               "noch zu wenig" (Doc, 24.09.2026). */
            const refKand = LISTE.filter(x => x.id !== 'einwilligung' && takes[x.id] && !taugtNicht(x, takes[x.id]))
                                 .map(x => takes[x.id].sekunden || 0);
            const ref = refKand.length ? Math.max.apply(null, refKand) : 0;
            const okEinw = takes['einwilligung'] && !taugtNicht(SAETZE[0], takes['einwilligung']);

            $('minuten').textContent = ref ? ref.toFixed(1).replace('.', ',') : '0';
            $('einheit').textContent = ' s Referenz';
            $('fortschritt').style.width = Math.min(100, ref / G_MAX * 100) + '%';
            $('fortschritt').style.background = ref >= G_MIN ? 'rgb(121, 158, 49)' : 'rgb(245, 194, 66)';

            const u = $('urteil');
            if (!ref) { u.textContent = 'keine Referenz'; u.className = 'fehlt'; }
            else if (ref < G_MIN) { u.textContent = 'zu kurz — Google will mindestens ' + G_MIN + ' s'; u.className = 'fehlt'; }
            else if (ref > G_MAX) { u.textContent = 'länger als ' + G_MAX + ' s — wird beim Hochladen gekürzt'; u.className = 'fehlt'; }
            else { u.textContent = 'passt'; u.className = 'genug'; }

            $('stand').textContent = (okEinw ? 'Einwilligung liegt vor' : 'Einwilligung fehlt noch')
                + ' · Google nimmt ' + G_MIN + '–' + G_MAX + ' s'
                + (alleZeigen ? ' · ' + LISTE.filter(x => takes[x.id]).length + ' von ' + LISTE.length + ' Texten' : '');

            if (!falscherServer) $('warnung').innerHTML = kaputt
                ? '<div class="warnkasten"><b>' + kaputt + ' Aufnahme' + (kaputt > 1 ? 'n taugen' : ' taugt') + ' nicht</b> — '
                  + 'zu kurz oder zu leise. Unten orange markiert, bitte noch einmal aufnehmen. '
                  + 'Achte beim Sprechen auf den Pegelbalken: er muss grün ausschlagen.</div>'
                : '';

            $('liste').innerHTML = LISTE.map((x, n) => {
                const t = takes[x.id], kaput = taugtNicht(x, t);
                const name = x.titel || alsText(x);
                const kopf = (alleZeigen && x.id === 't01') ? '<div class="trenner">Lange Texte</div>' : '';
                return kopf + '<div class="zeile ' + (t ? (kaput ? 'angeschnitten' : 'fertig') : '') + (n === i ? ' hier' : '') + '" data-zu="' + n + '">'
                    + '<span class="sek ' + (kaput ? 'warn' : '') + '" title="' + (t && t.pegel != null ? t.pegel + ' dB' : '') + '">'
                    + (t ? (zuLeise(t) ? 'still' : (t.sekunden || 0).toFixed(1) + 's') : '—') + '</span>'
                    + '<span class="txt">' + name + '</span>'
                    + (t ? '<button data-hoer="' + x.id + '" title="Anhören">' + ICON_PLAY + '</button>'
                         + '<button data-weg="' + x.id + '" title="Verwerfen">' + ICON_WEG + '</button>' : '')
                    + '</div>';
            }).join('');
            const hier = $('liste').querySelector('.hier');
            if (hier) hier.scrollIntoView({ block: 'nearest' });
        }

        /* A level meter, because everything else about a silent take looks perfectly fine:
           the clock runs, the dot blinks, a file appears. Only the needle tells the truth. */
        let hoerer = null, pegelTakt = null;
        function pegelAn(stream) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const quelle = ctx.createMediaStreamSource(stream);
                const analyse = ctx.createAnalyser();
                analyse.fftSize = 1024;
                quelle.connect(analyse);
                const buf = new Float32Array(analyse.fftSize);
                let spitze = 0;
                hoerer = ctx;
                pegelTakt = setInterval(() => {
                    analyse.getFloatTimeDomainData(buf);
                    let summe = 0;
                    for (let k = 0; k < buf.length; k++) summe += buf[k] * buf[k];
                    const db = 20 * Math.log10(Math.sqrt(summe / buf.length) + 1e-9);
                    spitze = Math.max(spitze, db);
                    const anteil = Math.max(0, Math.min(1, (db + 60) / 60));   // -60 dB .. 0 dB
                    $('pegel').style.width = (anteil * 100) + '%';
                    $('pegel').style.background = db < -45 ? 'rgb(176, 36, 24)'
                        : db < -32 ? 'rgb(245, 194, 66)' : 'rgb(121, 158, 49)';
                    $('pegelwert').textContent = db < -55 ? 'kein Ton' : Math.round(db) + ' dB';
                }, 80);
            } catch (e) { /* no meter is survivable; the server measures the take anyway */ }
        }
        function pegelAus() {
            clearInterval(pegelTakt); pegelTakt = null;
            if (hoerer) { try { hoerer.close(); } catch (e) { } hoerer = null; }
            $('pegel').style.width = '0%';
            $('pegelwert').textContent = '';
        }

        function uhrAn() {
            uhrAb = Date.now();
            $('uhr').classList.add('laeuft');
            uhrTakt = setInterval(() => {
                const s = Math.floor((Date.now() - uhrAb) / 1000);
                $('uhr').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
            }, 250);
        }
        function uhrAus() { clearInterval(uhrTakt); $('uhr').classList.remove('laeuft'); }

        async function starte() {
            if (laeuft) return;
            /* Bound NOW, before the microphone opens: getUserMedia is an await, and anything that
               moves the cursor in between (the server check at load, a key press) would file this
               take under the wrong text. Found 24.09.2026 while rebuilding the page. */
            const meine = sichtbar()[i].id;
            // a stream from a previous take can be dead (device switched, tab slept) - take a fresh one then
            if (stream) {
                const spur = stream.getAudioTracks()[0], soll = $('mikro').value;
                const passt = spur && spur.readyState === 'live'
                    && (!soll || (spur.getSettings && spur.getSettings().deviceId === soll));
                if (!passt) { stream.getTracks().forEach(t => t.stop()); stream = null; }
            }
            if (!stream) {
                $('tipp').textContent = 'Mikrofon wird geöffnet …';
                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        /* Automatic gain STAYS ON. Switching it off was meant to give the clone
                           untouched audio; on Doc's built-in mic it produced -55 to -72 dB - room
                           noise, no voice (22.09.2026: "man hört gar nix"). A clone needs an audible
                           voice far more than it needs an unprocessed one. Echo cancellation and
                           noise suppression stay off: those two chew on the voice itself. */
                        audio: Object.assign(
                            { echoCancellation: false, noiseSuppression: false,
                              autoGainControl: $('agc').checked, channelCount: 1 },
                            $('mikro').value ? { deviceId: { exact: $('mikro').value } } : {})
                    });
                } catch (err) {
                    $('tipp').textContent = 'Kein Mikrofon: ' + err.name + ' — ' + err.message;
                    return;
                }
            }
            const typ = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'].find(c => MediaRecorder.isTypeSupported(c)) || '';
            const r = new MediaRecorder(stream, typ ? { mimeType: typ } : undefined);
            const stuecke = [];              // own array per take, so the next start cannot empty this one
            r.ondataavailable = e => e.data.size && stuecke.push(e.data);
            r.onstop = () => schicke(meine, stuecke, r.mimeType || 'audio/webm');
            rec = r;
            // a timeslice means data arrives during the take, not only at the end - a long passage
            // is then never lost as one big missing chunk
            r.start(1000);
            laeuft = true; uhrAn(); pegelAn(stream); zeichne();
            {   // say which microphone this take really comes from - orange if it is not a RØDE
                const name = (stream.getAudioTracks()[0] || {}).label || 'unbekanntes Mikrofon';
                $('mikroname').textContent = '· ' + name;
                $('mikroname').classList.toggle('fremd', !/r[oø]de/i.test(name));
            }
            mikroListe();                 // labels arrive only after the first permission
            $('tipp').textContent = '';     // clock, meter and the stop square say it already
        }

        function stoppe() {
            if (!laeuft) return;
            laeuft = false; uhrAus(); pegelAus();
            if (rec && rec.state !== 'inactive') rec.stop();   // fires onstop -> schicke()
            $('tipp').textContent = 'Wird gespeichert …';
            zeichne();
        }

        async function schicke(id, stuecke, typ) {
            const blob = new Blob(stuecke, { type: typ });
            if (!blob.size) { $('tipp').textContent = 'Nichts aufgenommen — Mikrofon prüfen.'; return; }
            const b64 = await new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(blob); });
            const s = SAETZE.find(x => x.id === id);
            const res = await fetch('/__stimme/aufnahme', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id, text: alsText(s), audio: b64 })
            }).then(r => r.json()).catch(e => ({ error: String(e) }));
            if (res.error) { $('tipp').textContent = 'Fehler: ' + res.error; return zeichne(); }
            takes = res.takes || {};
            const t = takes[id];
            if (t && t.fehler) $('tipp').textContent = 'Gespeichert, aber ohne WAV: ' + t.fehler;
            else if (zuLeise(t)) $('tipp').textContent = 'Gespeichert — aber mit ' + t.pegel + ' dB praktisch stumm. Mikrofon prüfen und noch einmal.';
            else if (zuKurz(s, t)) $('tipp').textContent = 'Gespeichert — aber nur ' + t.sekunden + ' s, das ist zu kurz. Bitte noch einmal.';
            else { $('tipp').textContent = 'Gespeichert: ' + (t ? t.sekunden : 0).toString().replace('.', ',') + ' s'; verblasse(); }
            // move on only if this take was the one on screen and it looks complete
            const L = sichtbar();
            if (id === L[i].id && t && !taugtNicht(s, t) && i < L.length - 1) i++;
            zeichne();
        }

        function hoere(id) {
            if (klang) { klang.pause(); }
            document.querySelectorAll('.vgl .cyber-btn').forEach(b => b.classList.remove('laeuft'));
            const knopfV = document.querySelector('.vgl [data-hoer="' + id + '"]');
            if (knopfV) knopfV.classList.add('laeuft');
            klang = new Audio('/__stimme/hoeren/' + id + '?t=' + Date.now());
            klang.onended = () => { if (knopfV) knopfV.classList.remove('laeuft'); };
            klang.onerror = () => { $('tipp').textContent = 'Konnte die Aufnahme nicht abspielen.'; };
            klang.play().catch(e => { $('tipp').textContent = 'Wiedergabe abgelehnt: ' + e.message; });
        }

        /* blur after every press: a focused button ALSO reacts to the space bar, so the key would
           toggle twice - start, and immediately stop again. That is what cut the first takes short. */
        const knopf = (el, tu) => el.onclick = () => { el.blur(); tu(); };
        knopf($('btnRec'), () => laeuft ? stoppe() : starte());
        knopf($('btnPlay'), () => hoere(sichtbar()[i].id));
        knopf($('btnPrev'), () => { if (!laeuft && i > 0) { i--; zeichne(); } });
        knopf($('btnNext'), () => { if (!laeuft && i < sichtbar().length - 1) { i++; zeichne(); } });

        /* No separate stop button: clicking the one that is playing stops it (Doc, 24.09.2026:
           "raus -> nochmaliges Klicken"). Clicking another one switches over. */
        document.addEventListener('click', e => {
            const v = e.target.closest && e.target.closest('.vgl [data-hoer]');
            if (!v) return;
            if (v.classList.contains('laeuft')) {
                if (klang) klang.pause();
                v.classList.remove('laeuft');
                return;
            }
            hoere(v.dataset.hoer);
        });

        $('liste').onclick = async e => {
            const h = e.target.closest('[data-hoer]'), w = e.target.closest('[data-weg]'), z = e.target.closest('[data-zu]');
            if (h) return hoere(h.dataset.hoer);
            if (w) {
                const res = await fetch('/__stimme/loeschen', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: w.dataset.weg })
                }).then(r => r.json());
                takes = res.takes || {}; return zeichne();
            }
            if (z && !laeuft) { i = +z.dataset.zu; zeichne(); }   // click a line to jump to it
        };

        document.addEventListener('keydown', e => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.target.tagName === 'BUTTON') return;      // let the button's own click handle it, once
            if (e.code === 'Space' && !e.repeat) { e.preventDefault(); laeuft ? stoppe() : starte(); }
            if (e.code === 'ArrowRight') $('btnNext').click();
            if (e.code === 'ArrowLeft') $('btnPrev').click();
        });

        window.addEventListener('beforeunload', e => {
            if (laeuft) { e.preventDefault(); e.returnValue = ''; }   // a running take would be lost
        });

        /* ?selbsttest=1 records three seconds into the id "selbsttest" and reports the result in the
           page title, so the whole chain (microphone -> MediaRecorder -> POST -> ffmpeg -> WAV) can be
           checked from a headless Chrome with --use-fake-device-for-media-stream. Deliberately left in:
           the next time "nothing was recorded" comes up, this answers it in one command. */
        if (location.search.includes('selbsttest')) {
            SAETZE.push({ id: 'selbsttest', text: 'Selbsttest, drei Sekunden Ton.' });
            setTimeout(async () => {
                // the test line is hidden by the text filter - show everything, then find it by id
                alleZeigen = true;
                i = sichtbar().findIndex(x => x.id === 'selbsttest');
                await starte();
                if (!laeuft) { document.title = 'SELBSTTEST: Aufnahme startete nicht'; return; }
                setTimeout(() => {
                    stoppe();
                    setTimeout(() => {
                        const t = takes['selbsttest'];
                        document.title = 'SELBSTTEST: ' + (t && t.sekunden ? t.sekunden + ' s, WAV ' + t.datei : 'NICHTS ANGEKOMMEN');
                    }, 2500);
                }, 3000);
            }, 1800);   // after the server check - it moves the cursor too
        }

        /* This page lives in HTML/, so serve.py (:8765) and every filmkritik server hand it out too -
           and there /__stimme/* does not exist. It then looked perfectly normal and saved nothing.
           So: check first, and if we are on the wrong server, go find the right one and say so. */
        async function stehtDerServer() {
            try {
                const r = await fetch('/__stimme/liste', { cache: 'no-store' });
                if (r.ok) return await r.json();
            } catch (e) { /* wrong server, look for the real one below */ }
            return null;
        }

        async function sucheKabine() {
            for (let p = 8771; p < 8783; p++) {
                if (String(p) === location.port) continue;
                try {
                    const r = await fetch('http://127.0.0.1:' + p + '/__stimme/liste', { cache: 'no-store' });
                    if (r.ok) return p;
                } catch (e) { /* nobody there */ }
            }
            return null;
        }


        stehtDerServer().then(async d => {
            if (!d) {
                falscherServer = true;
                const p = await sucheKabine();
                const hin = p ? 'http://127.0.0.1:' + p + '/stimmklon.html' : null;
                $('warnung').innerHTML = '<div class="warnkasten"><b>Falscher Server — hier wird nichts gespeichert.</b><br>'
                    + 'Diese Seite liegt in HTML/ und wird auch von serve.py und den Filmkritik-Servern ausgeliefert, '
                    + 'aber nur die Aufnahmekabine kann speichern.<br>'
                    + (hin ? 'Die Kabine läuft auf Port ' + p + ': <a href="' + hin + '" style="color:rgb(245,194,66)">hier entlang</a>.'
                           : 'Die Kabine läuft gerade nicht. Starten mit: <code>python3 tools/stimmklon.py</code>')
                    + '</div>';
                $('btnRec').disabled = true;
                $('tipp').textContent = 'Aufnahme gesperrt, bis die Seite am richtigen Server hängt.';
                return zeichne();
            }
            takes = d.takes || {};
            // (the folder used to be shown here; Doc wanted the line out - it lives in the handoff)
            // start at the first line that is missing or truncated, so a resumed session picks up there
            const offen = sichtbar().findIndex(s => !takes[s.id] || taugtNicht(s, takes[s.id]));
            i = offen < 0 ? 0 : offen;
            zeichne();
        });
    </script>
</body>

</html>
