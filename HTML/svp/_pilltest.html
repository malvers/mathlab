  <span class="mat-pill-wrap">

      <span class="mat-label">Weltzeituhr</span>
    </a>
    <button type="button" class="mat-x">&#10005;</button>
  </span>
  <span class="mat-pill-wrap">

      <span class="mat-label">Ein sehr sehr langer Materialtitel der abgeschnitten werden muss</span>

</body></html>
