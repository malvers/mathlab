<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Stundenplan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;600&display=swap"
            rel="stylesheet">
    </noscript>
    <link rel="icon" type="image/svg+xml" href="../resources/favicon.svg">
    <link rel="icon" type="image/png" sizes="256x256" href="../resources/favicon.png">
    <link rel="stylesheet" href="svp.css">
    <link rel="stylesheet" href="svp-timetable.css">
    <link rel="stylesheet" href="meinplan.css">
    <!-- No gate here on purpose: this page is FOR the students. It shows only
         the lessons of one teacher, published from stundenplan.html into the
         table svp_public_plan (anon may read, only Doc's account may write). -->
    <script>
        /* Stored choice wins; a first-time visitor (every kid) gets the scheme
           their device asks for instead of always landing in the dark. */
        (function () {
            var t = null;
            try { t = localStorage.getItem('svp-theme'); } catch (e) { }
            if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            if (t === 'light') document.documentElement.classList.add('svp-light');
            if (t === 'grey') document.documentElement.classList.add('svp-grey');
        })();
    </script>
</head>

<body>
    <header class="page-head">
        <div class="head-row">
            <div class="title-group">
                <h1 id="who">Mein Stundenplan</h1>
            </div>
        </div>
    </header>

    <main class="svp-section">
        <div class="mp-bar">
            <button class="mp-nav" id="prev" type="button" aria-label="Vorige Woche"></button>
            <div class="mp-week" id="week">&nbsp;</div>
            <button class="mp-nav" id="next" type="button" aria-label="Nächste Woche"></button>
            <button class="action secondary" id="today" type="button">Diese Woche</button>
            <div class="mp-stamp" id="stamp"></div>
        </div>

        <!-- same time-axis grid as the staff view (svp-timetable.css/.js) -->
        <div class="tt-wrap mp-wrap">
            <div class="tt-grid" id="days">
                <div class="tt-empty">Plan wird geladen&hellip;</div>
            </div>
        </div>
    </main>

    <script src="svp-timetable.js"></script>
    <script>
        'use strict';

        const DB_URL = 'https://fyfhxzyymmurlaenmzse.supabase.co';
        const DB_KEY = 'sb_publishable_ubQDiMD-X3N0vZvPVi229Q_-5Zootfk'; /* publishable key - public by design */

        const $ = id => document.getElementById(id);
        const T = SvpTimetable;
        const DAYS = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];

        let WEEKS = [];              // published week keys, ascending (YYYYMMDD of the Monday)
        let CURRENT = null;
        const cache = new Map();

        const { parseYmd, hhmm, toMin } = T;
        const dmy = d => String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.';
        const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

        /* Klasse+Fach -> Stoffverteilungsplan. Same file the staff view uses,
           generated by tools/webuntis.js status. Missing file = no links, the
           page just stays a plain timetable. */
        let SVP_MAP = null;
        fetch('svp-map.json?v=' + Date.now())
            .then(r => r.ok ? r.json() : null)
            .then(m => { SVP_MAP = m; if (CURRENT && cache.has(CURRENT)) render(cache.get(CURRENT)); })
            .catch(() => { });

        function svpEntryFor(l) {
            if (!SVP_MAP || !SVP_MAP.pages) return null;
            const subject = String(l.subject || '');
            return SVP_MAP.pages.find(p =>
                (!p.subjects || !p.subjects.length || p.subjects.includes(subject)) &&
                (l.classes || []).some(c => (p.classes || []).includes(c))) || null;
        }
        function svpPageFor(l) {
            const hit = svpEntryFor(l);
            return hit ? hit.page : null;
        }

        /* Teilen sich mehrere Lerngruppen einen Plan (FOS 12), oeffnet der Link
           ihn gleich in der Ansicht DIESER Gruppe (?g=). Gekoppelte Klassen
           stehen in svp-map.json als "FOG25-2,FOW25-2" - verglichen wird
           sortiert, auf die Reihenfolge ist kein Verlass. */
        function svpGroupFor(l) {
            const hit = svpEntryFor(l);
            const groups = (hit && hit.groups) || [];
            if (groups.length < 2) return '';
            const key = (v) => (Array.isArray(v) ? v : String(v).split(','))
                .map(x => x.trim()).filter(Boolean).sort().join('|');
            const want = key(l.classes || []);
            const g = groups.find(x => key(x) === want);
            return g ? '&g=' + encodeURIComponent(g.replace(/[^A-Za-z0-9-]+/g, '_')) : '';
        }

        /* ISO calendar week of a YYYYMMDD date - the plan pages open at ?kw= */
        function isoWeek(ymd) {
            const d = parseYmd(ymd);
            const t = new Date(d);
            t.setDate(t.getDate() + 4 - (t.getDay() || 7));
            return Math.ceil(((t - new Date(t.getFullYear(), 0, 1)) / 86400000 + 1) / 7);
        }

        /* Anonymous read - no login, no key beyond the publishable one. */
        function db(path) {
            return fetch(DB_URL + '/rest/v1/' + path, { headers: { apikey: DB_KEY } })
                .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
        }

        /* Monday of the current week, as the YYYYMMDD key the publisher uses */
        function mondayKey(now) {
            const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
            return '' + d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
        }

        /* The running week if it was published, otherwise the next one after today */
        function startWeek() {
            const wk = mondayKey(new Date());
            if (WEEKS.includes(wk)) return wk;
            return WEEKS.find(w => w >= wk) || WEEKS[WEEKS.length - 1];
        }

        /* The week as a timetable (Doc, 17.09.2026: "mach den doch als time table"):
           same grid and tiles as the staff view, Monday to Friday always - an
           empty column is information too ("da ist nichts"), a missing one is a
           puzzle. On a phone svp-timetable.css folds it into one day after another. */
        function render(payload) {
            const grid = $('days');

            /* just the name, nothing beneath it (Doc, 10.09.2026: "das Wort Stundenplan weg") */
            $('who').textContent = payload.teacher || 'Mein Stundenplan';

            const all = payload.lessons || [];
            const lessons = all.filter(l => !T.isBanner(l));
            const banners = all.filter(T.isBanner);

            const mon = parseYmd(payload.week);
            const dates = [];
            for (let i = 0; i < 5; i++) {
                const d = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i);
                dates.push(+ymdKey(d));
            }

            /* The axis runs from this week's first lesson to its last, on half hours.
               A week with banners only falls back to the school's timegrid. */
            const units = (payload.timegrid && payload.timegrid[0] && payload.timegrid[0].timeUnits) || [];
            const spanSrc = lessons.length ? lessons : units;
            if (!spanSrc.length) {
                grid.innerHTML = '<div class="tt-empty">In dieser Woche keine Stunden.</div>';
                return;
            }
            const startMin = Math.floor(Math.min(...spanSrc.map(l => toMin(l.startTime))) / 30) * 30;
            const endMin = Math.ceil(Math.max(...spanSrc.map(l => toMin(l.endTime))) / 30) * 30;

            // banner lane: same height for every day so the axis lines up
            const BANNER_H = 30;
            const laneRows = Math.max(0, ...dates.map(d => banners.filter(b => b.date === d).length));
            const laneH = laneRows * BANNER_H + (laneRows ? 6 : 0);
            const scale = T.PX_PER_MIN;
            const height = laneH + (endMin - startMin) * scale;
            const y = m => laneH + (m - startMin) * scale;

            const html = ['<div></div>'];
            const todayKey = +ymdKey(new Date());
            dates.forEach((d, i) => {
                html.push('<div class="tt-head' + (d === todayKey ? ' today' : '') + '">' +
                    DAYS[i] + '<span>' + dmy(parseYmd(d)) + '</span></div>');
            });

            /* Axis labels at the real start and end times of this week's lessons -
               the Oberschule's 11:35/13:20 are not in the school's timegrid. Labels
               closer than 12 px would overprint each other; the earlier one stays. */
            const marks = [...new Set((lessons.length ? lessons : units)
                .flatMap(l => [toMin(l.startTime), toMin(l.endTime)]))]
                .filter(m => m >= startMin && m <= endMin).sort((a, b) => a - b);
            let lastY = -Infinity;
            html.push('<div class="tt-axis" style="height:' + height + 'px">');
            for (const m of marks) {
                if (y(m) - lastY < 12) continue;
                lastY = y(m);
                html.push('<div class="tt-tick" style="top:' + y(m) + 'px">' +
                    String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0') + '</div>');
            }
            html.push('</div>');

            dates.forEach((d, i) => {
                const dayLessons = lessons.filter(l => l.date === d);
                const dayBanners = banners.filter(b => b.date === d);
                html.push('<div class="tt-col" style="height:' + height + 'px" data-day="' +
                    DAYS[i] + ', ' + dmy(parseYmd(d)) + '">');
                // a line at every full and half hour, like the staff view
                for (let m = Math.ceil(startMin / 30) * 30; m <= endMin; m += 30) {
                    html.push('<div class="tt-hline' + (m % 60 ? ' half' : '') + '" style="top:' + y(m) + 'px"></div>');
                }
                dayBanners.forEach((b, bi) => {
                    const label = b.lstext || b.substText || b.subject || 'Termin';
                    html.push('<div class="tt-banner" style="top:' + (bi * BANNER_H) + 'px;height:' + (BANNER_H - 4) + 'px"' +
                        ' title="' + esc(label) + '"><span class="tt-bl">' + esc(label) + '</span>' +
                        '<span class="tt-br">' + esc((b.classes || []).join(', ')) + '</span></div>');
                });
                // phones only: a day without lessons says so (the desktop column just stays empty)
                if (!dayLessons.length && !dayBanners.length) html.push('<div class="mp-free">frei</div>');
                for (const it of T.layoutColumns(dayLessons.map(l => ({ l })))) {
                    html.push(lessonTile(it, y, scale));
                }
                html.push('</div>');
            });

            grid.style.setProperty('--days', dates.length);
            grid.innerHTML = html.join('');
        }

        /* plain YYYYMMDD of a date - used to highlight today's column */
        function ymdKey(now) {
            return '' + now.getFullYear() + String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0');
        }

        /* One lesson as a staff-view tile. A lesson with a Stoffverteilungsplan is a
           link that opens it at this week; a cancelled one stays on the grid - the
           free slot is the news. */
        function lessonTile(it, y, scale) {
            const l = it.l;
            const off = l.code === 'cancelled';
            const note = l.substText || l.info || l.lstext || '';
            const a = toMin(l.startTime), b = toMin(l.endTime);
            const page = svpPageFor(l);
            const cls = 'tt-lesson' + (l.code ? ' code-' + l.code : '') + (page ? ' has-plan' : '');
            const style = 'top:' + y(a) + 'px;height:' + Math.max(16, (b - a) * scale - 3) + 'px;' +
                'left:calc(' + (it.col * 100 / it.of) + '% + 3px);width:calc(' + (100 / it.of) + '% - 6px);' +
                '--hue:var(' + T.hueOf(l.subject, true) + ')';
            const title = [l.subject, (l.classes || []).join(', '), (l.rooms || []).length ? 'Raum ' + l.rooms.join(', ') : '',
                hhmm(l.startTime) + '–' + hhmm(l.endTime), off ? 'fällt aus' : '', note,
                page ? 'Klick: Stoffverteilungsplan dieser Woche' : ''].filter(Boolean).join(' · ');
            const open = page
                ? '<a class="' + cls + '" href="' + esc(page) + '?kw=' + isoWeek(l.date) + svpGroupFor(l) + '"' +
                  ' target="_blank" rel="noopener"'
                : '<div class="' + cls + '"';
            const jg = T.jahrgangOf(l);
            return open + ' style="' + style + '" title="' + esc(title) + '">' +
                '<div class="tt-cols">' +
                '<div class="tt-col">' +
                '<div class="tt-subject">' + esc(l.subject || '—') + '</div>' +
                '<div class="tt-who">' + esc((l.classes || []).join(', ')) + '</div>' +
                '</div>' +
                '<div class="tt-col">' +
                ((l.rooms || []).length ? '<div class="tt-where">' + esc(l.rooms.join(', ')) + '</div>' : '') +
                (off
                    ? '<div class="tt-time mp-off">fällt aus</div>'
                    : '<div class="tt-time">' + hhmm(l.startTime) + '–' + hhmm(l.endTime) + '</div>') +
                '</div>' +
                '</div>' +
                (jg ? '<div class="tt-jg">' + jg + '</div>' : '') +
                (page ? '</a>' : '</div>');
        }

        function showWeek(wk) {
            if (!WEEKS.includes(wk)) return;
            CURRENT = wk;
            const i = WEEKS.indexOf(wk);
            $('prev').disabled = i <= 0;
            $('next').disabled = i >= WEEKS.length - 1;
            const mon = parseYmd(wk);
            const fri = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 4);
            $('week').textContent = dmy(mon) + ' – ' + dmy(fri) + ' ' + fri.getFullYear();
            try { history.replaceState(null, '', '?w=' + wk); } catch (e) { }

            if (cache.has(wk)) { render(cache.get(wk)); return; }
            $('days').innerHTML = '<div class="tt-empty">Woche wird geladen&hellip;</div>';
            db('svp_public_plan?week=eq.' + encodeURIComponent(wk) + '&select=payload,updated_at')
                .then(rows => {
                    if (!rows.length) throw new Error('nicht veröffentlicht');
                    cache.set(wk, rows[0].payload);
                    $('stamp').textContent = rows[0].updated_at
                        ? 'Stand: ' + new Date(rows[0].updated_at).toLocaleString('de-DE') : '';
                    if (CURRENT === wk) render(rows[0].payload);
                })
                .catch(e => {
                    $('days').innerHTML = '<div class="tt-empty">Diese Woche steht noch nicht bereit (' + esc(e.message) + ').</div>';
                });
        }

        function step(delta) {
            const i = WEEKS.indexOf(CURRENT);
            if (i >= 0 && WEEKS[i + delta]) showWeek(WEEKS[i + delta]);
        }

        $('prev').addEventListener('click', () => step(-1));
        $('next').addEventListener('click', () => step(1));
        $('today').addEventListener('click', () => showWeek(startWeek()));
        /* listed in the "?" panel of the nav row (svp-nav.js) */
        window.svpKeys = (window.svpKeys || []).concat([
            [['←', '→'], 'Eine Woche zurück oder vor'],
            [['J'], 'Zur aktuellen Woche springen (jetzt)']
        ]);
        document.addEventListener('keydown', e => {
            if (e.metaKey || e.ctrlKey || e.altKey) return;   // never swallow Cmd-Shift-R
            if (e.key === 'ArrowLeft') step(-1);
            if (e.key === 'ArrowRight') step(1);
            /* J like on the plan pages - H is the help menu of the nav row */
            if (e.key === 'j' || e.key === 'J') showWeek(startWeek());
        });

        db('svp_public_plan?select=week&order=week.asc')
            .then(rows => {
                WEEKS = rows.map(r => r.week);
                if (!WEEKS.length) {
                    $('days').innerHTML = '<div class="tt-empty">Es ist noch kein Plan veröffentlicht.</div>';
                    return;
                }
                const wanted = new URLSearchParams(location.search).get('w');
                showWeek(WEEKS.includes(wanted) ? wanted : startWeek());
            })
            .catch(e => {
                $('days').innerHTML = '<div class="tt-empty">Plan nicht erreichbar (' + esc(e.message) + ').</div>';
            });
    </script>
    <!-- shared nav band on top, like every other svp page (Doc, 10.09.2026) -->
    <script src="svp-nav.js"></script>

</body>

</html>
