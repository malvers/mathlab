<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Kontakt chat wallpaper (Doc, 29.10.2026): one seamless 400×400 tile of maths doodles in the
       palette (λ orange, Υ red, φ green) plus a muted grey. Every doodle stays inside its 100×100 cell,
       so nothing is cut at the tile edge. sprechstunde.css shows it dimmed behind the conversation. -->
  <g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">

    <!-- row 1: π, sine wave, Σ, right triangle -->
    <text x="30" y="66" font-size="46" transform="rotate(-12 48 52)" fill="rgb(245,194,66)" font-family="'Times New Roman','Noto Serif',serif" font-style="italic">π</text>
    <path d="M115 52 q10 -20 20 0 t20 0 t20 0 t20 0" stroke="#8a96ab" transform="rotate(-8 155 52)"/>
    <text x="234" y="66" font-size="46" transform="rotate(10 250 52)" fill="rgb(121,158,49)" font-family="'Times New Roman','Noto Serif',serif">∑</text>
    <g stroke="rgb(176,36,24)" transform="rotate(-6 345 55)">
      <path d="M318 76 H376 L318 30 Z"/>
      <path d="M318 66 h10 v10"/>
    </g>

    <!-- row 2: circle with radius, integral, Pythagoras, infinity -->
    <g stroke="#8a96ab">
      <circle cx="52" cy="150" r="26"/>
      <path d="M52 150 L74 136"/>
      <circle cx="52" cy="150" r="2.2" fill="#8a96ab"/>
    </g>
    <text x="138" y="172" font-size="56" transform="rotate(8 150 150)" fill="rgb(245,194,66)" font-family="'Times New Roman','Noto Serif',serif" font-style="italic">∫</text>
    <text x="208" y="158" font-size="19" transform="rotate(-10 250 152)" fill="#8a96ab" font-family="'Times New Roman','Noto Serif',serif" font-style="italic">a²+b²=c²</text>
    <path d="M350 150 c10 -16 30 -16 30 0 c0 16 -20 16 -30 0 c-10 -16 -30 -16 -30 0 c0 16 20 16 30 0 Z" stroke="rgb(121,158,49)"/>

    <!-- row 3: square root, parabola on axes, λ, cube -->
    <g stroke="rgb(176,36,24)">
      <path d="M14 254 l7 -4 l10 22 l14 -44 h40"/>
    </g>
    <text x="52" y="266" font-size="26" fill="rgb(176,36,24)" font-family="'Times New Roman','Noto Serif',serif" font-style="italic">x</text>
    <g stroke="rgb(121,158,49)">
      <path d="M112 262 H190 M184 258 l6 4 l-6 4"/>
      <path d="M150 290 V216 M146 222 l4 -6 l4 6"/>
      <path d="M122 226 Q150 318 178 226"/>
    </g>
    <text x="232" y="268" font-size="48" transform="rotate(-8 250 250)" fill="rgb(245,194,66)" font-family="'Times New Roman','Noto Serif',serif" font-style="italic">λ</text>
    <g stroke="#8a96ab">
      <path d="M322 236 h36 v36 h-36 Z"/>
      <path d="M336 222 h36 v36 h-14"/>
      <path d="M322 236 l14 -14 M358 236 l14 -14 M358 272 l14 -14"/>
    </g>

    <!-- row 4: Euler, φ, Υ, angle α -->
    <text x="22" y="364" font-size="32" transform="rotate(-6 50 350)" fill="#8a96ab" font-family="'Times New Roman','Noto Serif',serif" font-style="italic">e<tspan dy="-14" font-size="18">iπ</tspan></text>
    <text x="134" y="370" font-size="46" transform="rotate(10 150 352)" fill="rgb(121,158,49)" font-family="'Times New Roman','Noto Serif',serif" font-style="italic">φ</text>
    <text x="234" y="366" font-size="44" transform="rotate(-10 250 350)" fill="rgb(176,36,24)" font-family="'Times New Roman','Noto Serif',serif">Υ</text>
    <g stroke="rgb(245,194,66)">
      <path d="M318 372 H380 M318 372 L366 330"/>
      <path d="M346 372 A28 28 0 0 0 339 354"/>
    </g>
    <text x="350" y="366" font-size="17" fill="rgb(245,194,66)" font-family="'Times New Roman','Noto Serif',serif" font-style="italic">α</text>

    <!-- sparkles in the gaps between the cells -->
    <path d="M100 94 v12 M94 100 h12" stroke="#8a96ab"/>
    <circle cx="300" cy="100" r="2.4" fill="rgb(245,194,66)" stroke="none"/>
    <circle cx="200" cy="200" r="2.4" fill="rgb(176,36,24)" stroke="none"/>
    <circle cx="100" cy="300" r="2.4" fill="rgb(121,158,49)" stroke="none"/>
    <path d="M300 294 v12 M294 300 h12" stroke="#8a96ab"/>
  </g>
</svg>
