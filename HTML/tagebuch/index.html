  /* ---------- the night sky behind the book (night scheme; Doc, 24.11.2026: "einen Sternenhimmel dahinter mit sich bewegenden
     Sternen" ... "lass die mal von hinten nach vorne kommen, als würde man so durchs Weltall fliegen" ... "noch ein paar mehr"):
     a canvas under the book, a slow flight through space - the stars come from far behind the book towards the viewer,
     growing and brightening as they near, and start afresh far away once they pass; each twinkles a little, now and then a
     shooting star. It only runs while the night scheme is on

      const x = cx + st.x / st.z, y = cy + st.y / st.z;

  function woStageEnd() {
    woStageTok++;
    if (woStage) { woStage.destroy(); woStage = null; }
    if (woArt) woArt.forEach(a => a.classList.remove('veiled'));
  }
  /* key = a day of WO_DAYS (day), at rest: its portrait and icon on their pages; '': anything else - all paused, hidden */
  function woShow(key, day) {
    if (key === woK && day === woDay) { if (key) woPlaceArt(); return; }
    clearTimeout(woAutoT);
    woStageEnd(); woHide();
    woK = key; woDay = day || ''; woSpec = key ? WO_DAYS[key] : null;
    if (!key) { if (woArt) woArt.forEach(a => a.classList.remove('on')); return; }
    if (!woArt) woMakeArt();
    woSetArt();
    const t = woSpec.plate[0] + ' · ' + woSpec.name + ' – Klick: spielen / Pause';
    woArt.forEach(a => { a.title = t; a.setAttribute('aria-label', t); });
    /* placed once the pages are laid out: on arrival the book may still be building */
    woPlaceArt(); requestAnimationFrame(() => requestAnimationFrame(() => { if (woK) woPlaceArt(); })); setTimeout(() => { if (woK) woPlaceArt(); }, 400);
    if (woSpec.show === 'buehne' && day !== birthDay()) woStageStart(woDay);
    /* a piece that opens by itself (auto: seconds after the day's scene began, or after arriving on a day without one) - the
       API loads meanwhile. Sound needs the browser's consent: after any click or key on the page it plays at once; on a
       book that opened on this day by itself the player shows its play button instead (a click there leaves the scene) */
    if (woSpec.auto) {
      woLoad();
      /* the scene's clock starts on its first frame (sunSetup), after this call - so the time is checked again when it is up */
      const tArr = performance.now(), spec = woSpec;
      const tick = () => {
        if (woK !== key || woDay !== day || woSpec !== spec || (woBox && woBox.classList.contains('on'))) return;
        const t0 = sunOn && sunArgs === day && sunScene && !sunEnd ? sunT0 : tArr, left = t0 + spec.auto * 1000 - performance.now();
        if (left > 30) { woAutoT = setTimeout(tick, left); return; }
        woOpen(true);
      };
      woAutoT = setTimeout(tick, spec.auto * 1000);
    }
  }

  /* settings: kept per browser only (localStorage may be blocked - then the defaults stay) */
  const SET_KEY = 'tagebuch-einstellungen';
  /* night is the default look (Doc, 24.11.2026: "mache Nacht den Default-Modus, der ist cool"); a choice made here stays */
  const settings = { hand: 'hand', script: '1', scheme: 'nacht', geb: '', fest: 'funken' };
  try { Object.assign(settings, JSON.parse(localStorage.getItem(SET_KEY) || '{}')); } catch (e) { }
  /* ?geb=27.05&fest=blueten: the birthday and its celebration for a book given by link (like ?fuer=), not stored */
  try { const q = new URLSearchParams(location.search), g = /^(\d\d)\.(\d\d)$/.exec(q.get('geb') || ''); if (g) settings.geb = g[1] + '.' + g[2]; if (/^(funken|blueten)$/.test(q.get('fest') || '')) settings.fest = q.get('fest'); } catch (e) { }
  try { const q = new URLSearchParams(location.search).get('schrift'); if (/^[123]$/.test(q || '')) settings.script = q; } catch (e) { }
  function applySettings() {
    stage.classList.toggle('typed', settings.hand === 'typed');
    ['1', '2', '3'].forEach(n => document.documentElement.classList.toggle('sf-' + n, settings.script === n));
    ['modern', 'nacht'].forEach(s => stage.classList.toggle('sch-' + s, settings.scheme === s));
    skyRun();
    markSegs(document);
    const [gd, gm] = (settings.geb || '.').split('.');
    $$('select[data-geb="d"]').forEach(x => { x.value = gd || ''; });
    $$('select[data-geb="m"]').forEach(x => { x.value = gm || ''; });
  }
  /* the birthday selects (on the settings page and its copies): both set -> stored, the year plan and the card follow */
  document.addEventListener('change', e => {
    const x = e.target.closest && e.target.closest('select[data-geb]'); if (!x) return;
    const box = x.closest('.geb'), d = box.querySelector('[data-geb="d"]').value, m = box.querySelector('[data-geb="m"]').value;
    settings.geb = d && m ? d + '.' + m : '';
    try { localStorage.setItem(SET_KEY, JSON.stringify(settings)); } catch (err) { }
    PLAN = null; if (cardDay) setCard(cardDay);
    applySettings();
  });
  /* the choices on the settings page (and its copies while a page turns) */
  function markSegs(root) {
    root.querySelectorAll('.seg[data-set]').forEach(seg => seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', settings[seg.dataset.set] === b.dataset.v)));
  }
  document.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('.seg[data-set] button'); if (!b) return;
    settings[b.closest('.seg').dataset.set] = b.dataset.v;
    try { localStorage.setItem(SET_KEY, JSON.stringify(settings)); } catch (err) { }
    applySettings();
    setTimeout(growAll, 80);
  });
  applySettings();
  /* a drag: the grabbed half tells the direction (left half = back) */
  host.addEventListener('pointerdown', e => {
    if (!pf || mode !== 'desk') return;
    const r = host.getBoundingClientRect();
    target = stepTarget(e.clientX < r.left + r.width / 2);
  }, true);
  if (PHONE.addEventListener) PHONE.addEventListener('change', build); else PHONE.addListener(build);
  /* page sizes follow the width (cq units): re-measure the fields after a resize */
  let rsz = 0;
  window.addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(growAll, 150); });

  /* fonts first: the cloud layout measures the real letter widths */
  const fontsReady = document.fonts && document.fonts.load
    ? Promise.all(['400 40px "Caveat Brush"', '600 40px Caveat', '500 40px Caveat', '700 20px Orbitron', '900 20px Orbitron',
        '400 40px "' + getComputedStyle(document.documentElement).getPropertyValue('--script').split(',')[0].replace(/['"\s]/g, ' ').trim() + '"'].map(f => document.fonts.load(f))).catch(() => null)
    : Promise.resolve();
  /* start: sign in (Doc's account), read the year's entries and the sayings, then open the book at today */
  async function start() {
    $('#gate').hidden = true;
    try { await loadEntries(); } catch (e) { toast('Einträge nicht geladen: ' + e.message); }
    await loadBook();
    await loadSayings();
    await Promise.race([fontsReady, new Promise(res => setTimeout(res, 2500))]);
    paintAll();
    build();
    renderReg();
    renderTocPages();
    if (REVIEW) toast((matchMedia('(pointer: coarse)').matches ? 'Sprüche durchblättern: zur Seite wischen' : 'Sprüche durchblättern mit ← und →') + '  ·  Tag ' + reviewDay + ' von ' + DAYS.length);
  }
  $('#loginBtn').addEventListener('click', () => auth.loginDialog(start, 'Anmelden für dein Tagebuch'));
  if (auth && auth.hasSession()) start(); else $('#gate').hidden = false;
})();
</script>
