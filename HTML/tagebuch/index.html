.spruch::after { content: none; }
.spruch .k { display: block; font-family: var(--display); font-weight: 700; font-size: 1cqw; letter-spacing: .3em; color: var(--ochre); margin-bottom: .6cqw; }
.spruch .s { display: block; font-size: 1.55cqw; line-height: 1.32; font-weight: 600; color: var(--ink); }
.spruch .s em, .spr-page .s em, .gdw em { font-style: normal; color: var(--ypsi-ink); font-weight: 700; }
.spruch .w { display: block; margin-top: .6cqw; font-size: 1.05cqw; font-style: italic; color: var(--print-soft); }
/* long sayings (fitCard): a little wider and smaller, so the card ends above the first question (Doc, 24.11.2026) */
.spruch.long, .spruch.longer { width: 40cqw; }
.spruch.long .s { font-size: 1.4cqw; }
.spruch.longer .s { font-size: 1.27cqw; line-height: 1.28; }
.spruch.long .w, .spruch.longer .w { font-size: .98cqw; }
/* the source: a quiet tooltip on the author line. Going through the sayings (?spruch=…) it stands on the card, with the day
   and the number of the saying underneath (Doc, 24.11.2026) */
.stage.show-card .spruch .w[title] { pointer-events: auto; cursor: help; }
.spruch .q, .spruch .r { display: none; }
.stage.review.show-card .spruch { pointer-events: auto; }
.stage.review .spruch .q:not(:empty) { display: block; margin-top: .5cqw; font-size: .85cqw; line-height: 1.35; color: var(--print-soft); overflow-wrap: anywhere; }
.spruch .q a { color: var(--ochre); text-decoration: none; white-space: nowrap; }
.spruch .q a:hover { text-decoration: underline; }
.stage.review .spruch .r { display: block; margin-top: .7cqw; padding-top: .5cqw; border-top: 1px solid rgba(176, 122, 20, .3);
  font-family: var(--display); font-weight: 700; font-size: .8cqw; letter-spacing: .25em; text-transform: uppercase; color: var(--ochre); }
/* phone: no card in the book; going through the sayings it lies across the top of the page */
.stage.portrait.review .spruch { top: 2.5cqw; width: 84cqw; padding: 4cqw 4.5cqw 3cqw; }
.stage.portrait.review .spruch::before, .stage.portrait.review .spruch::after { top: -2cqw; width: 14cqw; height: 4.4cqw; }
.stage.portrait.review .spruch .k { font-size: 2.5cqw; margin-bottom: 1.4cqw; }
.stage.portrait.review .spruch .s { font-size: 4.3cqw; }
.stage.portrait.review .spruch .w { margin-top: 1.4cqw; font-size: 3cqw; }
.stage.portrait.review .spruch .q:not(:empty) { margin-top: 1.2cqw; font-size: 2.4cqw; }
.stage.portrait.review .spruch .r { margin-top: 1.6cqw; padding-top: 1.2cqw; font-size: 2.2cqw; }
.spr-page { position: absolute; inset: 8cqh 9cqw 6cqh 11cqw; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 3cqh; }
.spr-page .k { font-family: var(--display); font-weight: 700; font-size: 3.2cqw; letter-spacing: .3em; color: var(--ochre); }
.spr-page .s { font-size: 6.2cqw; line-height: 1.35; font-weight: 600; color: var(--ink); }
.spr-page .w { font-size: 3.6cqw; font-style: italic; color: var(--print-soft); }
.photo { position: relative; background: #fff; padding: 2.2cqw 2.2cqw 2.6cqw; box-shadow: 0 .6cqw 1.4cqw rgba(40, 25, 10, .35); transform: rotate(2deg); }
.photo img { display: block; width: 100%; height: auto; }
.photo::before, .photo::after { content: ''; position: absolute; width: 6cqw; height: 6cqw; background: linear-gradient(135deg, rgba(40, 30, 20, .75) 50%, transparent 50%); }
.photo::before { left: -1cqw; top: -1cqw; }
.photo::after { right: -1cqw; bottom: -1cqw; transform: rotate(180deg); }
.spr-page .photo { width: 46cqw; }

/* weekly spread */
.wq { margin-top: 2.2cqh; }
.wq .q-t { font-size: calc(var(--u) * 3.15); }
.wq .q-t .tx { font-size: calc(var(--u) * 3.15 * var(--sk)); }
.lbl { font-family: var(--display); font-weight: 700; font-size: calc(var(--u) * 2.1); letter-spacing: .2em; color: var(--ochre); text-transform: uppercase; margin: 2.6cqh 0 .8cqh; }
.lbl:first-of-type { margin-top: 1.6cqh; }
/* the weekly thought's heading: a little higher, with air above the photo and its corners (Doc, 23.11.2026) */
.lbl.gl { margin-top: 1.2cqh; margin-bottom: 2.4cqh; }
.svgbox { width: 100%; }
.svgbox svg { display: block; width: 100%; height: auto; }
/* weekly thought: the sheet as a real print glued in with four album corners (navy leather with a gold edge, like the cover),
   the saying beside it in the book's script; the big 1200 px sheet from R2, so it stays sharp at this size */
.gdw { display: grid; grid-template-columns: 34% 1fr; gap: 5cqw; align-items: center; margin-top: .6cqh; }
/* the print sits on a sheet of handmade paper (Doc, 24.11.2026: "Büttenpapier oder ausgefranstes Papier. Schöner."): warm
   cream with fibres and a torn, deckled edge - one SVG painted behind the print (noise displaces the rectangle's edge, finer
   noise lays the fibres in), the shadow follows the ragged outline */
.gdw .photo { transform: rotate(-2deg); padding: 1.2cqw 1.2cqw 1.6cqw;
  background: var(--deckle-tall) center / 100% 100% no-repeat;
  filter: drop-shadow(0 .45cqw .6cqw rgba(40, 25, 10, .32)) drop-shadow(0 .1cqw .12cqw rgba(40, 25, 10, .3)); }
/* printed onto that paper: the sheet's white takes the paper's tone (multiply inside the shadowed group) */
.gdw .photo img { mix-blend-mode: multiply; }
.gdw .pc { position: absolute; inset: 0; pointer-events: none; }
.gdw .photo::before, .gdw .photo::after, .gdw .pc::before, .gdw .pc::after { content: ''; position: absolute; z-index: 2; width: 4.6cqw; height: 4.6cqw;
  background: linear-gradient(135deg, #2b4170 0, #16233f 44%, #e2bd5c 44%, #a87b22 49%, transparent 49%);
  filter: drop-shadow(0 .12cqw .12cqw rgba(0, 0, 0, .35)); }
.gdw .photo::before { left: -.7cqw; top: -.7cqw; transform: none; }
.gdw .pc::before { right: -.7cqw; top: -.7cqw; transform: rotate(90deg); }
.gdw .photo::after { right: -.7cqw; bottom: -.7cqw; transform: rotate(180deg); }
.gdw .pc::after { left: -.7cqw; bottom: -.7cqw; transform: rotate(270deg); }
.gdw p { font-family: var(--script); font-weight: 400; font-size: calc(var(--u) * 3.7 * var(--sk)); line-height: 1.12; color: #2a2620; }
.gdw p em { font-weight: 400; }
.gdw p .src { display: block; margin-top: 2cqh; font-family: var(--display); font-weight: 700; font-size: calc(var(--u) * 1.9); letter-spacing: .2em; text-transform: uppercase; color: var(--ochre); line-height: 1.4; }
.gdw p .src::before { content: ''; display: block; width: 10cqw; height: 1px; margin-bottom: 1.2cqh; background: linear-gradient(90deg, var(--ochre), transparent); }
.gdw p .nt { display: block; margin-top: .6cqh; font-family: var(--read); font-size: calc(var(--u) * 2.2); font-style: italic; color: var(--print-soft); line-height: 1.35; }
/* the week's word cloud a little smaller, so the weekly thought gets the room */
.svgbox.cl { width: 76%; margin: 0 auto; }

/* contents pages: the book's parts with dotted leaders, the year as twelve small months in three columns */
.in.toc .ih { margin: .4cqh 0 1cqh; font-family: 'Great Vibes', 'Pinyon Script', cursive; font-weight: 400; font-size: calc(var(--u) * 9); line-height: 1; color: var(--ink); }
.toc-gear { position: absolute; top: 0; right: 0; width: calc(var(--u) * 7.5); height: calc(var(--u) * 7.5); padding: 0; border: 0; background: none; cursor: pointer;
  filter: drop-shadow(0 .2cqw .2cqw rgba(60, 35, 5, .4)); transition: transform .7s cubic-bezier(.3, 1.4, .5, 1); }
.toc-gear svg { width: 100%; height: 100%; display: block; }
.toc-gear:hover { transform: rotate(30deg); }
.in.toc .lbl { margin: 2cqh 0 .8cqh; }
/* the settings page with more air between its parts (Doc, 24.11.2026: "den y noch ein bisschen Luft geben") */
.p-set1 .in.toc .lbl { margin: 3.6cqh 0 1.5cqh; }
.p-set1 .setp .set-note { margin-top: 4.6cqh; }
.in.toc .toc-book { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 4cqw; }
.in.toc .toc-book button { display: flex; align-items: baseline; gap: 1cqw; width: 100%; border: 0; background: none; padding: .45cqh 0; cursor: pointer; text-align: left; color: var(--ink);
  font: calc(var(--u) * 2.6) / 1.3 var(--read); }
.in.toc .toc-book button span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.in.toc .toc-book button i { flex: 1; min-width: 2cqw; border-bottom: max(1px, calc(var(--u) * .2)) dotted rgba(109, 98, 80, .55); transform: translateY(-.5cqh); }
.in.toc .toc-book button em { font-style: normal; font-family: var(--display); font-size: calc(var(--u) * 1.8); letter-spacing: .06em; color: var(--print-soft); white-space: nowrap; }
.in.toc .toc-book button:hover span { color: var(--ypsi-ink); }
.in.toc .toc-year { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.4cqh 3cqw; }
.in.toc .mon h4 button { border: 0; background: none; padding: 0; margin: 0; font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; cursor: pointer; }
.in.toc .mon h4 button:hover { color: var(--ypsi-ink); }
.in.toc .mon h4 { margin: 0 0 .5cqh; font-family: var(--display); font-weight: 700; font-size: calc(var(--u) * 1.75); letter-spacing: .18em; text-transform: uppercase; color: var(--ink); }
.in.toc .mon .g { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: calc(var(--u) * .2); }
.in.toc .mon .g b { font: 700 calc(var(--u) * 1.2) / 1.6 var(--display); color: var(--print-soft); text-align: center; }
.in.toc .mon .g button { aspect-ratio: 1; border: 0; padding: 0; border-radius: 50%; background: none; cursor: pointer; font: calc(var(--u) * 1.65) / 1 var(--read); color: var(--print-soft); }
.in.toc .mon .g button.w { color: #2c4a12; background: radial-gradient(circle, rgba(121, 158, 49, .36) 0 58%, transparent 62%); }
.in.toc .mon .g button.e { color: rgba(109, 98, 80, .8); }
.in.toc .mon .g button.f { color: rgba(109, 98, 80, .45); }
.in.toc .mon .g button.t { color: var(--ink); font-weight: 700; box-shadow: inset 0 0 0 max(1.5px, calc(var(--u) * .3)) #c99a35; }
.in.toc .mon .g button:hover { background-color: rgba(245, 194, 66, .35); }
/* a personal day in the calendar (Oct 31 in the books it is meant for): a gold coin with its number engraved, glowing up
   and down gently (Doc, 26.11.2026: "der 31. Oktober definitiv Gold sein und schön sein. Und blinken. Vorsichtig blinken.") */
.mon .g button.own, .in.toc .mon .g button.own { color: #4a3006; font-weight: 700; text-shadow: 0 1px 0 rgba(255, 244, 205, .7);
  background: radial-gradient(circle at 35% 30%, #fff1b8 0, #f0c95a 30%, #c8901f 62%, #8a5c12 74%, transparent 77%);
  animation: own-glow 2.6s ease-in-out infinite; }
@keyframes own-glow { 0%, 100% { filter: brightness(1) drop-shadow(0 0 0 rgba(245, 194, 66, 0)); }
  50% { filter: brightness(1.22) drop-shadow(0 0 .35em rgba(245, 194, 66, .85)); } }
@media (prefers-reduced-motion: reduce) { .mon .g button.own, .in.toc .mon .g button.own { animation: none; } }
.in.toc .toc-stat { margin-top: 1.6cqh; font-family: var(--script); font-size: calc(var(--u) * 3.6 * var(--sk)); line-height: 1.15; color: var(--ink); text-align: center; }
.in.toc .toc-note { margin-top: 2.2cqh; font-size: calc(var(--u) * 2.1); font-style: italic; color: var(--print-soft); text-align: center; line-height: 1.4; }
/* the motto plate: a raised cream label in a double gold frame with diamond ornaments, Latin in the script, the translation
   in the book's question script, the source in Orbitron */
.toc-plate { position: relative; margin: 3.6cqh auto 0; width: 80%; padding: 3.2cqh 5cqw 2.8cqh; text-align: center;
  background: linear-gradient(180deg, #fffaf0, #f6ecd4); border-radius: .6cqw;
  box-shadow: 0 .5cqw 1.2cqw rgba(60, 40, 15, .22), 0 .1cqw .25cqw rgba(60, 40, 15, .25),
    inset 0 0 0 max(1px, calc(var(--u) * .25)) #b4862a, inset 0 0 0 calc(var(--u) * 1) #fbf4e2, inset 0 0 0 calc(var(--u) * 1.18) rgba(180, 134, 42, .75); }
.toc-plate::before, .toc-plate::after { content: '◆'; position: absolute; left: 50%; transform: translateX(-50%); font-size: calc(var(--u) * 2.2); line-height: 1; color: #b4862a;
  background: #fbf4e2; padding: 0 1.2cqw; }
.toc-plate::before { top: calc(var(--u) * -.1); }
.toc-plate::after { bottom: calc(var(--u) * -.1); }
.toc-plate .pl-lat { font-family: 'Great Vibes', 'Pinyon Script', cursive; font-size: calc(var(--u) * 7.4); line-height: 1.05; color: var(--ink); }
.toc-plate .pl-de { margin-top: .8cqh; font-family: var(--script); font-size: calc(var(--u) * 3 * var(--sk)); line-height: 1.15; color: #2a2620; }
/* plate (smaller, left) and the painting (right, gilt frame, tilted to the right) side by side */
.toc-motto { display: flex; align-items: center; justify-content: center; gap: 6cqw; margin-top: 1.4cqh; }
.toc-motto .toc-plate { flex: 0 0 auto; width: auto; margin: 0; padding: 2.8cqh 3.6cqw 2.6cqh; transform: translate(-1.2cqw, -1.2cqh); }
.toc-motto .pl-lat { font-size: calc(var(--u) * 6); }
.toc-motto .pl-de { font-size: calc(var(--u) * 2.6 * var(--sk)); white-space: nowrap; }
.toc-motto .toc-plate { text-align: center; }
/* the painting hangs free beside the plate, a little askew; below it, free-standing too, a small brass museum plate -
   too small to read in the book, readable once the painting is clicked and lifted off the page (script: openPic) */
/* the right contents page carries no footer line - the plate and the painting need the room */
.p-toc2 .ft { display: none; }
.toc-pic { flex: 0 0 25%; margin: 0; transform: translate(1.2cqw, 1.4cqh) rotate(4deg); cursor: zoom-in; }
/* a gilt frame of the 1880s: a carved profile of ridges and hollows in gold leaf (stacked inset rings), a row of small pearls,
   a linen slip around the canvas */
.toc-pic .frame { position: relative; padding: calc(var(--u) * 2.1); border-radius: calc(var(--u) * .2);
  background:
    radial-gradient(circle at 50% 50%, rgba(255, 244, 205, .9) 0 calc(var(--u) * .16), transparent calc(var(--u) * .2)) 0 0 / calc(var(--u) * .7) calc(var(--u) * .7),
    linear-gradient(135deg, #5e4210, #e9c665 22%, #8a6526 40%, #f6df9e 58%, #9a7430 76%, #e2bd5c 90%, #6e4f10);
  box-shadow:
    0 calc(var(--u) * 1) calc(var(--u) * 2) rgba(30, 18, 6, .45), 0 calc(var(--u) * .2) calc(var(--u) * .35) rgba(30, 18, 6, .45),
    inset 0 0 0 max(1px, calc(var(--u) * .14)) #3d2a08,
    inset 0 0 0 calc(var(--u) * .42) #f2d98d,
    inset 0 0 0 calc(var(--u) * .62) #7a5814,
    inset 0 0 0 calc(var(--u) * .9) rgba(0, 0, 0, 0),
    inset 0 0 0 calc(var(--u) * 1.3) rgba(110, 79, 16, .35),
    inset 0 0 0 calc(var(--u) * 1.55) #f6e2a6,
    inset 0 0 0 calc(var(--u) * 1.75) #5a3f12; }
/* the pearl row only on the broad middle band of the profile */
.toc-pic .frame::before { content: ''; position: absolute; inset: calc(var(--u) * .62); pointer-events: none;
  border: calc(var(--u) * .62) solid transparent; border-radius: calc(var(--u) * .1);
  background: linear-gradient(135deg, rgba(90, 62, 14, .25), rgba(255, 240, 200, .15), rgba(90, 62, 14, .3)) border-box;
  -webkit-mask: linear-gradient(#000 0 0) border-box, linear-gradient(#000 0 0) padding-box; -webkit-mask-composite: xor; mask-composite: exclude; }
.toc-pic img { position: relative; display: block; width: 100%; height: auto;
  border: calc(var(--u) * .45) solid #e9e0c8; box-shadow: 0 0 0 max(1px, calc(var(--u) * .12)) #3a2a12, inset 0 0 calc(var(--u) * .6) rgba(0, 0, 0, .35); box-sizing: border-box; }
/* the brass plate: slightly bent like a real one screwed onto a curved frame - curved edges, a light band across the bend,
   the letters engraved (dark, light lower edge), screws at both ends */
.toc-pic .brass { position: relative; width: 96%; margin: calc(var(--u) * 1.6) auto 0; padding: calc(var(--u) * .55) calc(var(--u) * 1.3); white-space: nowrap;
  border-radius: 14% / 45%; text-align: center; transform: perspective(calc(var(--u) * 40)) rotateX(10deg);
  background: linear-gradient(180deg, #7a5814 0%, #c9a24e 18%, #f6e3a6 42%, #d8b65f 62%, #9a7430 86%, #6e4f10 100%);
  box-shadow: 0 calc(var(--u) * .35) calc(var(--u) * .55) rgba(30, 18, 6, .4), inset 0 max(.5px, calc(var(--u) * .08)) 0 rgba(255, 245, 210, .7), inset 0 calc(var(--u) * -.1) calc(var(--u) * .2) rgba(60, 40, 8, .35);
  font: 500 calc(var(--u) * .78) / 1.35 var(--display); letter-spacing: .06em; color: #3a2608;
  text-shadow: 0 .5px 0 rgba(255, 244, 205, .65), 0 -.4px 0 rgba(40, 25, 5, .45); }
.toc-pic .brass::before, .toc-pic .brass::after { content: ''; position: absolute; top: 50%; width: calc(var(--u) * .5); height: calc(var(--u) * .5); margin-top: calc(var(--u) * -.25);
  border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff2c4, #a07a2c 60%, #5a3f12); box-shadow: inset 0 0 0 max(.3px, calc(var(--u) * .05)) rgba(40, 25, 5, .5); }
.toc-pic .brass::before { left: calc(var(--u) * .45); }
.toc-pic .brass::after { right: calc(var(--u) * .45); }
.toc-pic .brass b { font-weight: 700; text-transform: uppercase; color: inherit; }
.toc-pic .brass i { font-style: normal; font-family: 'Great Vibes', 'Pinyon Script', cursive; font-size: 1.5em; letter-spacing: 0; }
/* the lifted copy: fixed over everything, straight and large, the veil behind it */
.toc-pic.zoomed { position: fixed; z-index: 40; margin: 0; cursor: zoom-out; transition: transform .65s cubic-bezier(.3, .8, .3, 1); will-change: transform; }
.stage.portrait .in.toc .toc-year { grid-template-columns: repeat(2, minmax(0, 1fr)); flex: 1; min-height: 0; overflow-y: auto; align-content: start; scrollbar-width: none; }
.stage.portrait .in.toc .toc-year::-webkit-scrollbar { display: none; }

/* introduction: Orbitron kicker, a script heading, Arial for the reading text, the book's script for the quote */
.intro .ik { font-family: var(--display); font-weight: 700; font-size: calc(var(--u) * 2); letter-spacing: .3em; text-transform: uppercase; color: var(--ochre); }
.intro .ih { margin: 1.2cqh 0 1.8cqh; font-family: 'Great Vibes', 'Pinyon Script', cursive; font-weight: 400; font-size: calc(var(--u) * 7.6); line-height: 1.05; letter-spacing: 0; text-transform: none; color: var(--ink); }
.intro .ib { flex: 1; min-height: 0; overflow: hidden; }
.intro .ib p, .intro .ib li { font-size: calc(var(--u) * 2.75); line-height: 1.5; color: var(--print); }
.intro .ib p + p { margin-top: 1.2cqh; }
.intro .ib b { color: var(--ink); }
.intro .ib p.iq { margin-top: 2.6cqh; padding: 0 3cqw; text-align: center; font-family: var(--script); font-size: calc(var(--u) * 3.2 * var(--sk)); line-height: 1.2; color: var(--ink); }
.intro .ib p.isrc { margin-top: 2.2cqh; font-size: calc(var(--u) * 2.05); line-height: 1.4; font-style: italic; color: var(--print-soft); }
.intro .il, .intro .ir { margin: 1cqh 0 1.2cqh; padding-left: 1.3em; }
.intro .il li, .intro .ir li { margin: .7cqh 0; }
.intro .il li::marker { color: var(--ochre); }
.intro .ir li::marker { font-family: var(--display); font-weight: 700; color: var(--ochre); }
.intro .ip { gap: 1.3cqh; margin-bottom: 1.2cqh; }
.intro .ip dt { font-size: calc(var(--u) * 1.85); padding-left: 0; }
.intro .ip dd { font-size: calc(var(--u) * 2.6 * var(--sk)); line-height: 1.18; }
@media (max-width: 700px) { .intro .ib { overflow-y: auto; scrollbar-width: none; } .intro .ib::-webkit-scrollbar { display: none; } }

/* monthly check: six questions on a 1-10 scale - the circles up to your value fill in green, the value itself is a full green dot */
.mqs { display: grid; gap: 2.4cqh; margin: 3.4cqh 0 1.6cqh; }   /* pulled apart (Doc) */
.mq .q-t { font-size: calc(var(--u) * 3); }
.mq .q-t .tx { font-size: calc(var(--u) * 3 * var(--sk)); }
.scale { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: calc(var(--u) * .9); margin-top: .4cqh; max-width: calc(var(--u) * 60); }
.scale button { aspect-ratio: 1; border-radius: 50%; padding: 0; cursor: pointer; display: grid; place-items: center; background: transparent;
  border: max(1px, calc(var(--u) * .2)) solid rgba(184, 145, 58, .75); font-family: var(--display); font-weight: 700; font-size: calc(var(--u) * 1.8); color: var(--print-soft); }
.scale button.lo { background: rgba(121, 158, 49, .2); border-color: rgba(85, 128, 28, .5); color: #3d5d16; }
.scale button.on { background: radial-gradient(circle at 38% 32%, #a9c96a, #6f9a2c 70%, #55801c); border-color: #3d5d16; color: #fff; box-shadow: 0 .1cqw .3cqw rgba(40, 60, 10, .4); }
.scale button:hover { border-color: #b07a14; }
.cmp { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: .2cqh 2.4cqw; align-items: baseline; margin-top: .4cqh; }
.cmp span { font-family: var(--hand); font-size: calc(var(--u) * 3.3); line-height: 1.15; color: var(--pen); }
.cmp em { font-style: normal; }
.cmp .v { font-family: var(--display); font-weight: 700; font-size: calc(var(--u) * 2.2); text-align: right; color: var(--print-soft); }
.cmp .v.now { color: var(--phi-ink); }
.cmp .ar { font-family: var(--display); font-size: calc(var(--u) * 2.2); color: var(--phi-ink); }
/* the personality of the month on the month view's right page (Doc, 24.11.2026: "da eine tolle Persönlichkeit hin mit
   Minibio"): the portrait in the gilt frame of the contents' painting with its brass plate (name, years), beside it name, what
   they were, life dates and a short life story - persoenlichkeiten.json, portraits public domain in img/pers/ */
.pers { margin-top: 1.2cqh; }
/* further down, just above the footer (Doc, 24.11.2026: "weiter runter"): the free space goes above the block */
.pers { margin-top: auto; margin-bottom: 4.6cqh; }   /* a tick higher again (Doc: "'n Tick zu viel") */
.pers ~ .ft { margin-top: 0; }
/* the year's curve (with its heading) a little lower on the page (Doc, 24.11.2026: "die obere Grafik noch Stück runter") */
.p-monatR .in > .lbl:first-child { margin-top: 4.6cqh; }
.pers[hidden] { display: none; }
.pers-in { display: flex; align-items: flex-start; gap: 5cqw; margin-top: 1.4cqh; }
.toc-pic.pers-pic { flex: 0 0 27%; transform: translate(.6cqw, .6cqh) rotate(-2.5deg); cursor: default; }
.pers-pic .brass { font-size: calc(var(--u) * 1.1); }
.pers-tx { flex: 1; min-width: 0; }
.pers-nm { font-family: var(--script); font-size: calc(var(--u) * 4.6 * var(--sk)); line-height: 1.1; color: var(--ink); }
.pers-rl { margin-top: .8cqh; font-family: var(--display); font-weight: 700; font-size: calc(var(--u) * 1.7); letter-spacing: .14em; text-transform: uppercase; color: var(--ochre); }
.pers-ld { margin-top: .5cqh; font-size: calc(var(--u) * 2); color: var(--print-soft); }
.pers-bio { margin: 1.3cqh 0 0; font-size: calc(var(--u) * 2.35); line-height: 1.45; color: var(--print); }
.pers-src { margin: 1.2cqh 0 0; font-size: calc(var(--u) * 1.5); line-height: 1.3; color: var(--print-soft); }
.trend-note { margin-top: 1.6cqh; font-size: calc(var(--u) * 2.3); line-height: 1.4; font-style: italic; color: var(--print-soft); }

/* cloud pages: one painted SVG shared via <use> - the right page shows its right half */
.cloud { position: absolute; inset: 0; }
.cloud svg { display: block; width: 100%; height: 100%; mix-blend-mode: multiply; will-change: transform; }

/* title page + notes */
.tp { position: absolute; inset: 9cqh 10cqw 8cqh 12cqw; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2.2cqh; color: var(--ink); }
.tp .t2.yr { margin-top: -1.2cqh; font-weight: 700; letter-spacing: .4em; }
.tp .t1 { font-family: 'Great Vibes', 'Pinyon Script', cursive; font-weight: 400; font-size: 15cqw; line-height: 1.1; letter-spacing: 0; margin-top: 3cqh; }
.tp .t2 { font-family: var(--display); font-weight: 500; font-size: 2.6cqw; letter-spacing: .32em; padding-left: .32em; color: var(--ochre); }
.tp svg { width: 34cqw; height: auto; margin: 1.2cqh 0 1.6cqh; flex: none; }   /* flex: none - the full column had squeezed them to 0 px */
/* the plan of the book: Orbitron for the when, the book's script for the what (no Arial on the title page - Doc, 23.11.2026) */
.tp-plan { margin: 0; display: grid; gap: 1.5cqh; }
.tp-plan dt { font-family: var(--display); font-weight: 700; font-size: 2cqw; letter-spacing: .3em; padding-left: .3em; text-transform: uppercase; color: var(--ochre); }
.tp-plan dd { margin: .2cqh 0 0; font-family: var(--script); font-weight: 400; font-size: calc(3.1cqw * var(--sk)); line-height: 1.15; color: #2a2620; }
.tp .sig { margin-top: auto; font-family: var(--hand); font-size: 6.5cqw; color: var(--pen); transform: rotate(-3deg); }
/* "ein Buch von Doc Alvers", © below (Doc, 23.11.2026); the plan block sits higher */
.tp .sig .by { display: block; font-family: var(--script); font-size: calc(3cqw * var(--sk)); color: #2a2620; transform: rotate(3deg); margin-bottom: .4cqh; }
/* "ein Claude-Buch von" (Doc, 24.11.2026: "weil ich das mit euch gemacht habe") a few px nearer the name, the © a few px up */
.tp .sig .by { transform: translateY(.55cqh) rotate(3deg); }
/* in Orbitron like the © line (Doc, 24.11.2026: "ein Claude-Buch von bitte im Orbi, wie unten die 2026"), straight, small caps */
.tp .sig .by { font-family: var(--display); font-weight: 500; font-size: 2cqw; letter-spacing: .25em; padding-left: .25em; text-transform: uppercase;
  color: var(--print-soft); margin-bottom: 1.2cqh;
  /* level, not tilted - it sits in the tilted signature, so it turns back by the signature's 3 degrees - and a bit lower
     (Doc, 24.11.2026: "definitiv nicht schief und ein Stück weiter runter") */
  transform: rotate(3deg) translateY(1.87cqh); }   /* +2 px (Doc) */
.tp .copy { margin-top: -2.08cqh; font-family: var(--display); font-weight: 500; font-size: 2cqw; letter-spacing: .25em; color: var(--print-soft); }
.tp .tp-plan { margin-top: -3cqh; }
/* the signature block a little lower, nearer the foot of the page (Doc, 24.11.2026: "Stück weiter runter") - it hangs on
   margin-top: auto, so only it moves */
.tp { bottom: 4.5cqh; }
/* the whole title page a little higher (Doc, 24.11.2026: "Rück mal bitte alles ein Stück weiter hoch"): top and bottom by 3 cqh */
.tp { top: 6cqh; bottom: 7.5cqh; }
/* the signature block 6 px lower, the © 4 px up, "ein Claude-Buch von" 2 px lower (Doc, 24.11.2026; px at a 748 px page) */
.tp { bottom: 5.9cqh; }
/* from "Grateful" down to the new divider everything 10 px higher (Doc, 24.11.2026; px at a 748 px page) - the signature
   hangs on margin-top: auto and stays where it is */
.tp { top: 4.66cqh; }
.tp svg.tp-end { margin: 1.4cqh 0 0; }
/* with both dividers back (they had been squeezed to 0 px) the column ran over the page foot: a little less space between
   its parts, so the signature sits where Doc placed it again */
.tp { gap: 1.45cqh; }
/* the two dividers finer and smaller (Doc, 24.11.2026: "subtiler, also dünner, kleiner"), and the lower one as close to
   "dein Jahr in Worten" as the upper one is to MORGENS ("deutlich nach oben rücken, gleicher Abstand") */
.tp svg { width: 26.25cqw; }   /* 5 % bigger (Doc) */
.tp svg:not(.tp-end) { margin-bottom: calc(1.6cqh + .53cqh); }   /* 4 px more room (Doc) */
.tp svg path { stroke-width: .95; }
.tp svg circle { r: 1.25px; }
.tp svg.tp-end { margin-top: calc(-1.45cqh + .2cqh + .53cqh); }   /* 4 px more room (Doc) */   /* and another 6 px lower (Doc, 24.11.2026: "sensationell gut ... noch 6 Pixel weiter") */
.notes p { font-size: calc(var(--u) * 3.1); line-height: 1.45; color: var(--print); margin-top: 1.6cqh; }
/* the imprint under "So geht's": small print, links in the book's ochre */
.notes .imp { margin-top: 2.4cqh; }
/* the imprint at the foot of the page, the lines are gone from here (Doc: "ganz nach unten, die Zeilen raus") */
.notes .imp { margin-top: auto; margin-bottom: 1.6cqh; }
.notes .imp ~ .ft { margin-top: 0; }
/* the right page of the notes spread has no heading: its lines start where the left page's lines start */
.ruled.ruled-full { margin-top: calc(var(--u) * 7.2 + 2cqh); }
.notes .imp .lbl { margin: 0 0 .6cqh; }
.notes .imp p { margin-top: .6cqh; font-size: calc(var(--u) * 1.9); line-height: 1.45; color: var(--print-soft); }
.notes .imp a { color: var(--ochre); text-decoration: none; }
.notes .imp a:hover { text-decoration: underline; }
.notes p b { color: var(--ink); }
/* the imprint's page (Doc, 25.11.2026): the small print in two columns, a gold vignette under it at the foot */
.imp-page .imp { margin-top: 1.8cqh; column-count: 2; column-gap: 3.4cqw; }
.imp-page .imp p { margin: 0 0 .9cqh; font-size: calc(var(--u) * 1.62); line-height: 1.42; color: var(--print-soft); }
.imp-page .imp a { color: var(--ochre); text-decoration: none; }
.imp-page .imp a:hover { text-decoration: underline; }
.imp-page .imp-vign { display: block; width: 44cqw; margin: auto auto 4cqh; flex: none; }
/* the phone: the imprint on two pages, one column - the first with the publisher, Claude and privacy, the second the credits */
.stage.portrait .imp-page .imp { column-count: 1; }
.stage.portrait .imp-page .imp p { font-size: calc(var(--u) * 1.75); }
.stage.portrait .p-imp .imp-b, .stage.portrait .p-imp2 .imp-a, .stage.portrait .p-imp2 .imp-vign { display: none; }
.stage.portrait .p-imp2 .imp p { font-size: calc(var(--u) * 1.5); line-height: 1.38; }
/* "So geht's" without the imprint: a gold divider closes it */
.notes .so-end { display: block; width: 30cqw; margin: 4cqh auto 0; flex: none; }
/* the quiet page before the back endpaper: paper, a small gold heart a little below the middle */
.finis { position: absolute; inset: 0; display: grid; place-items: center; }
.finis svg { width: 7cqw; margin-top: 18cqh; opacity: .75; }
.ruled { flex: 1; margin-top: 2cqh; background-image: repeating-linear-gradient(180deg, transparent 0 calc(var(--u) * 6.6 - 1px), rgba(60, 95, 150, .22) calc(var(--u) * 6.6 - 1px) calc(var(--u) * 6.6)); }
/* thin, even note lines (Doc, 24.11.2026: "nur dünne Linie nehmen bei Notizen"): one hairline per line, lighter, and the
   line spacing rounded to whole pixels - a fractional spacing let some lines blur to two pixels and look thicker */
.ruled { background-image: linear-gradient(180deg, transparent calc(100% - 1px), rgba(60, 95, 150, .17) 0); background-size: 100% calc(var(--u) * 6.6); background-repeat: repeat-y; }
@supports (width: round(1.5px, 1px)) { .ruled { background-size: 100% round(nearest, calc(var(--u) * 6.6), 1px); } }

/* static spreads (mock-up 2 and the fallback) */
.spread { position: relative; display: grid; grid-template-columns: 1fr 1fr; aspect-ratio: 1000 / 700; }
.spread .leaf { height: 100%; }
.portrait-page { position: relative; aspect-ratio: 400 / 640; max-width: 440px; margin: 0 auto; }
.only-phone { display: none; }
.stage.static { padding-bottom: 56px; }
.stage.static .boards { z-index: 0; }

/* SVG sprite holder (filters + shared drawings): must not be display:none, or the filters vanish */
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

/* no slide-in of boards and card while the page loads */
.stage:not(.ready) .boards, .stage:not(.ready) .spruch, .stage:not(.ready) .edge, .stage:not(.ready) .ribbon, .stage:not(.ready) .headband { transition: none; }
/* before the first build the book has no height yet: boards, edges and the Inhalt tab stood as a flat bar while the
   entries loaded (Doc, 25.11.2026: "der Artefakt am Anfang") - nothing of the book until it is built */
.stage:not(.built) .bookwrap { visibility: hidden; }
@media (prefers-reduced-motion: reduce) { .boards, .spruch, .edge, .ribbon { transition: none; } }
@media (max-width: 920px) { .flow { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 700px) {
  .stage { padding: 64px 14px 56px; }
  .stage.static { padding-top: 34px; }
  .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); }
  .only-desk { display: none; }
  .only-phone { display: block; }
  .card { padding: 12px 14px; }
}
@media (max-width: 460px) { .flow { grid-template-columns: minmax(0, 1fr); } }

/* ===== Smartphones, short landscape screens, touch (Doc, 24.11.2026: "auf dem Phone ... gar nicht responsive") =====
   The desktop look stays exactly as above. Phone upright: one page as wide as the screen. Phone sideways: the spread as wide
   as the screen, the page scrolls up and down. Touch screens: tabs, gear and buttons a thumb can hit (at least 40 px). */
/* full screen and home screen app: nothing under the camera hole, the notch or the gesture bar (the insets are 0 on a desktop,
   so these are the old paddings there: 72 / 5% / 50 / 5%) */
.stage { padding: calc(72px + env(safe-area-inset-top)) calc(5% + env(safe-area-inset-right)) calc(50px + env(safe-area-inset-bottom)) calc(5% + env(safe-area-inset-left)); }
.stage .bookwrap { max-width: min(1000px, calc((100dvh - 150px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 1000 / 700)); }
.stage.portrait .bookwrap { max-width: min(440px, calc((100dvh - 140px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 400 / 640)); }
/* the book takes 90 % of the window, aspect kept (Doc, 24.11.2026: "mach es mal 90% des Fensters, keep aspect"): its whole
   look - the boards (3.4 % wider, 2.1 % lower than the spread) and the open day's tab on top (40 px) - fits into 90 % of the
   width and of the height, the 1000 px cap is gone. Not on an upright phone (one page) and not on a phone held sideways
   (there the spread is as wide as the screen and the desk scrolls). */
@media not all and (orientation: landscape) and (max-height: 500px) {
  .stage:not(.portrait) { padding-top: calc(18px + env(safe-area-inset-top)); padding-bottom: env(safe-area-inset-bottom); }
  .stage:not(.portrait) .bookwrap { max-width: none; width: min(86.5vw, calc((90dvh - 40px) / .721)); }
}
.toast { bottom: calc(22px + env(safe-area-inset-bottom)); }
@media (max-width: 700px) {
  .stage { padding: calc(64px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(56px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left)); }
  .toast { bottom: calc(14px + env(safe-area-inset-bottom)); }
}
/* phone sideways: the spread takes the whole width (a height-bound spread was 340 px wide, its writing 8 px); the desk
   scrolls up and down, so sheets, veil and note stay on the screen */
@media (orientation: landscape) and (max-height: 500px) {
  .stage { justify-content: flex-start; padding-top: calc(60px + env(safe-area-inset-top)); padding-bottom: calc(44px + env(safe-area-inset-bottom)); }
  .stage .bookwrap { max-width: 1000px; }
  .sheet, .veil, .toast { position: fixed; }
  .sheet { max-height: calc(100dvh - 28px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); }
  .mqs { gap: 2cqh; }   /* the monthly check keeps its footer inside the margin */
}
/* the full screen switch: four gold corners on the wood, bottom right (thumb), sideways top right (the desk scrolls);
   only on phones and touch screens - on a computer the key F does it, the desk keeps its look */
.fs-btn { position: absolute; z-index: 6; right: calc(8px + env(safe-area-inset-right)); bottom: calc(8px + env(safe-area-inset-bottom)); width: 44px; height: 44px;
  padding: 11px; border: 0; border-radius: 50%; background: rgba(20, 9, 3, .3); color: #ecc969; opacity: .72; cursor: pointer; display: none;
  -webkit-tap-highlight-color: transparent; }
.fs-btn:active { opacity: 1; }
.fs-btn svg { width: 100%; height: 100%; display: block; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round;
  filter: drop-shadow(0 1px 0 rgba(0, 0, 0, .75)); }
.fs-btn .x, .stage.fs-on .fs-btn .o { display: none; }
.stage.fs-on .fs-btn .x { display: block; }
@media (orientation: landscape) and (max-height: 500px) { .fs-btn { top: calc(8px + env(safe-area-inset-top)); bottom: auto; } }
/* the installed app opens full screen anyway (manifest): no switch there - unless the switch itself made it full screen */
@media (display-mode: fullscreen), (display-mode: standalone) { .stage:not(.fs-on) .fs-btn { display: none !important; } }
@media (pointer: coarse), (max-width: 700px), (max-height: 500px) {
  .stage.fs-able .fs-btn { display: block; }
  .stage.fs-able .toast { max-width: calc(100% - 128px); }
  /* the tabs: 42 px high, the open day 48 (desktop 33 / 40) - same leather and gold, the writing a little lower */
  .reg, .reg.l { top: -42px; }
  #reg, #reg button, .reg.l button { height: 42px; }
  #reg button.sel { height: 48px; }
  .reg button { padding-top: 9px; }
  /* the gear on the contents page: big enough for a thumb */
  .toc-gear { width: max(44px, calc(var(--u) * 7.5)); height: max(44px, calc(var(--u) * 7.5)); }
  /* typed entries (Arial) never below 16 px - Android zooms into smaller fields */
  .stage.typed textarea.hand { font-size: max(16px, calc(var(--u) * 3.3 * max(var(--fz, 1), .8))); }
}
/* "INHALT" fits its narrow phone tab */
.stage.portrait .reg.l button span { letter-spacing: .9px; }
/* the monthly check on the phone: the circles across the whole line (a little bigger for the thumb), the questions a little
   closer, so the sentence of the month and the footer stay on the page */
.stage.portrait .scale { max-width: none; }
.stage.portrait .mqs { gap: 1.2cqh; margin: 2.4cqh 0 1.2cqh; }
/* the week page's five questions a little closer on the phone - its footer was cut off below the page */
.stage.portrait .wq { margin-top: .9cqh; }
/* the inside of the front board on the phone (with the plate "für …"): the board stands round the page like the cover */
.stage.portrait .p-endpaper .board-in { inset: -1.7cqw -2.6cqw -2.1cqw -1.4cqw; border-radius: 0 .9cqw .9cqw 0; }
/* the thought of the day on the phone: its own page between morning and evening ("in der Mitte"), no card over the page.
   A sheet of Doc's own shows its picture; long sayings get smaller letters; going through the sayings (?spruch=) the
   page also names the source and the day. */
.spr-page { gap: 2.6cqh; }
.spr-page .photo { width: 36cqw; }
.spr-page.long .photo { width: 30cqw; }
.spr-page.long .s { font-size: 5.4cqw; }
.spr-page.longer .s { font-size: 4.8cqw; line-height: 1.3; }
.spr-page .w { font-size: 3.4cqw; line-height: 1.35; }
.spr-page .q, .spr-page .r { display: none; }
.stage.review .spr-page .q:not(:empty) { display: block; font-size: 2.7cqw; line-height: 1.4; color: var(--print-soft); overflow-wrap: anywhere; }
.spr-page .q a { color: var(--ochre); text-decoration: none; }
.stage.review .spr-page .r { display: block; padding-top: 1.4cqh; border-top: 1px solid rgba(176, 122, 20, .3); font-family: var(--display); font-weight: 700;
  font-size: 2.5cqw; letter-spacing: .25em; text-transform: uppercase; color: var(--ochre); }
</style>

<template id="tpl-intro1">
  <div class="pg paper"><div class="in intro">
    <div class="ik">Einführung · I</div>
    <h4 class="ih">Warum dieses Buch wirkt</h4>
    <div class="ib">
      <p>Unser Gehirn ist ein hervorragender Alarmgeber. Was schiefgeht, bleibt hängen, was gelingt, rauscht vorbei. Die Psychologie nennt das den <b>Negativitätseffekt</b>: Schlechtes wiegt in unserer Wahrnehmung schwerer als Gutes. Für unsere Vorfahren war das überlebenswichtig. Im Alltag führt es dazu, dass ein Tag mit neun guten Momenten und einem Ärgernis abends als „anstrengend“ abgelegt wird.</p>
      <p>Dieses Buch dreht den Spieß um. Es lenkt deine Aufmerksamkeit zweimal am Tag auf das, was da ist und was gelingt. Nicht, um Probleme schönzureden, sondern um das Bild zu vervollständigen. Wer jeden Tag nach Gutem sucht, findet mit der Zeit mehr davon. Nicht weil die Welt sich ändert, sondern weil der Blick sich schärft.</p>
      <p class="iq">Drei Minuten am Tag reichen: anderthalb am Morgen, anderthalb am Abend. Entscheidend ist nicht die Länge, sondern dass du es tust.</p>
    </div>
    <div class="ft"><span class="pn">I</span><span>Einführung</span></div>
  </div></div>
</template>

<template id="tpl-intro2">
  <div class="pg paper"><div class="in intro">
    <div class="ik">Einführung · II</div>
    <h4 class="ih">Positive Verstärkung</h4>
    <div class="ib">
      <p>In der Lernpsychologie gehört sie zu den stärksten Prinzipien: Ein Verhalten, auf das etwas Angenehmes folgt, zeigen wir öfter. Am besten wirkt sie, wenn die Belohnung <b>klein</b> ist, <b>sofort</b> kommt und <b>zuverlässig</b>. Genau so ist dieses Buch gebaut:</p>
      <ul class="il">
        <li>Du bemerkst etwas Gutes und spürst es beim Aufschreiben ein zweites Mal. Das Gefühl ist die Belohnung.</li>
        <li>Nach dreißig Sekunden schließt sich der goldene Ring mit einem Häkchen.</li>
        <li>Deine Gewohnheiten füllen sich Kreis um Kreis, die Reiter oben glänzen, der Buchblock links wird mit jedem Tag dicker.</li>
        <li>Einmal im Monat siehst du als Kurve, wie es dir geht.</li>
      </ul>
      <p>So entsteht ein Kreislauf: Aufmerksamkeit, gutes Gefühl, Wiederholung, Gewohnheit.</p>
      <p class="iq">Du trainierst nicht, glücklich zu sein. Du trainierst, das Gute zu bemerken.</p>
    </div>
    <div class="ft r"><span class="pn">II</span><span>Einführung</span></div>
  </div></div>
</template>

<template id="tpl-intro3">
  <div class="pg paper"><div class="in intro">
    <div class="ik">Einführung · III</div>
    <h4 class="ih">Was die Forschung sagt</h4>
    <div class="ib">
      <p>Dankbarkeit aufzuschreiben gehört zu den am besten untersuchten Übungen der Positiven Psychologie.</p>
      <p>Bei <b>Robert Emmons und Michael McCullough</b> (2003) notierten Menschen zehn Wochen lang einmal pro Woche, wofür sie dankbar waren. Verglichen mit Gruppen, die Ärgernisse oder bloße Ereignisse aufschrieben, sahen sie zuversichtlicher auf die kommende Woche, waren zufriedener mit ihrem Leben, hatten weniger körperliche Beschwerden und bewegten sich mehr.</p>
      <p><b>Martin Seligman</b> und sein Team (2005) ließen Menschen eine Woche lang jeden Abend drei Dinge aufschreiben, die gut gelaufen waren, und warum. Sie fühlten sich glücklicher und weniger niedergeschlagen, noch sechs Monate später.</p>
      <p>Und wie lange dauert es, bis so etwas zur Gewohnheit wird? <b>Phillippa Lally</b> und ihr Team (2010) fanden im Mittel 66 Tage, je nach Mensch und Verhalten zwischen 18 und 254. Ein ausgelassener Tag änderte daran kaum etwas.</p>
      <p class="isrc">Emmons &amp; McCullough, J. Pers. Soc. Psychol. 84 (2003) · Seligman u. a., American Psychologist 60 (2005) · Lally u. a., Eur. J. Soc. Psychol. 40 (2010)</p>
    </div>
    <div class="ft"><span class="pn">III</span><span>Einführung</span></div>
  </div></div>
</template>

    <h4 class="ih">So benutzt du dieses Buch</h4>
    <div class="ib">
      <dl class="tp-plan ip">
        <div><dt>Morgens</dt><dd>wofür du dankbar bist, welcher kleine Schritt heute zählt, mit welcher Haltung du in den Tag gehst</dd></div>

        <li><b>Weitermachen statt nachholen.</b> Ein leerer Tag ist kein Bruch.</li>
      </ol>
      <p class="isrc">Dieses Buch ersetzt keine Therapie. Wenn es dir über längere Zeit schlecht geht, sprich mit jemandem, zum Beispiel mit der TelefonSeelsorge, kostenfrei und rund um die Uhr: +49 800 111 0 111.</p>

<template id="tpl-back">
  <div class="pg leather cover-back"><div class="cv-frame"></div>

  </div>

<script>
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));
  const SVGNS = 'http://www.w3.org/2000/svg';

  /* ---------- the year in this book ---------- */
  /* the book's year: the current one, never before 2026 (the first edition) - so on 1 January the book turns to the new year
     by itself, the same book one year on (Doc, 26.11.2026: "du kannst das 2027er Buch bauen. Eigentlich genauso wie es heute
     ist, nur das Datum um 1 verschoben"); ?jahr=2027 opens that year's book before it begins (the gift links sent at
     Christmas open on 1 January), ?jahr=2026 last year's */
  const YEAR = (() => {
    try { const j = +(new URLSearchParams(location.search).get('jahr') || 0); if (j >= 2026 && j <= 2099) return j; } catch (e) { }
    return Math.max(2026, new Date().getFullYear());
  })();
  /* the year printed on the cover, the title page and the year's curve: from YEAR, in the page templates before any page is made */
  document.querySelectorAll('template').forEach(t => {
    t.content.querySelectorAll('.cv-year, .t2.yr').forEach(e => { e.textContent = String(YEAR); });
    t.content.querySelectorAll('.lbl').forEach(e => { e.textContent = e.textContent.replace(/· 2026$/, '· ' + YEAR); });
    t.content.querySelectorAll('svg[aria-label*="2026"]').forEach(e => e.setAttribute('aria-label', e.getAttribute('aria-label').replace('2026', YEAR)));
  });
  const pad = n => String(n).padStart(2, '0');
  const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const dateOf = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = dateOf(s); d.setDate(d.getDate() + n); return iso(d); };
  const DAYS = [];
  for (let d = new Date(YEAR, 0, 1); d.getFullYear() === YEAR; d.setDate(d.getDate() + 1)) DAYS.push(iso(d));
  /* today, kept inside the book's year (before it: 1 January, after it: 31 December) */
  const TODAY = (() => { const d = new Date(); return d.getFullYear() === YEAR ? iso(d) : d.getFullYear() < YEAR ? DAYS[0] : DAYS[DAYS.length - 1]; })();
  const WD = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
  const WD2 = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
  const MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
  const longDate = s => { const d = dateOf(s); return WD[d.getDay()] + ', ' + d.getDate() + '. ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); };
  const dayNo = s => DAYS.indexOf(s) + 1;
  const isoWeek = s => { const d = dateOf(s); d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7); const w1 = new Date(d.getFullYear(), 0, 4); return 1 + Math.round(((d - w1) / 864e5 - 3 + (w1.getDay() + 6) % 7) / 7); };
  const weekDays = sunday => Array.from({ length: 7 }, (_, i) => addDays(sunday, i - 6)).filter(d => d.startsWith(YEAR + '-'));
  /* ?spruch=45 : going through the sayings one by one (Doc, 24.11.2026). The book opens at day 45 of the year, the card shows
     that day's saying with its source, day and number, the arrow keys step one day back or on (past the week and month
     pages). ?spruch without a number starts at today. 0 = the normal book. */
  const REVIEW = (() => {
    let v = null;
    try { v = new URLSearchParams(location.search).get('spruch'); } catch (e) { }
    if (v === null) return 0;
    const n = parseInt(v, 10);
    return n >= 1 ? Math.min(n, DAYS.length) : dayNo(TODAY);
  })();
  let reviewDay = REVIEW;

  /* Field values, one key per field and day: "m1@2026-11-23" = morning 1 of that day. m1 is the thanks sentence and lives in
     Doc's table grateful (like on /grateful/). Everything else - morning 2-3, evening, habits, week, month - is kept in this
     browser for now (localStorage), until the table grateful_tag exists (supabase/migrations/20261123_grateful_tag.sql). */
  const vals = {}, done = new Set();
  const LOCAL_KEY = 'tagebuch-' + YEAR;
  const local = { vals: {}, done: [], habits: {}, months: {} };
  try { Object.assign(local, JSON.parse(localStorage.getItem(LOCAL_KEY) || '{}')); } catch (e) { }
  Object.assign(vals, local.vals || {});
  (local.done || []).forEach(k => done.add(k));
  let localT = 0;
  function saveLocal() {
    clearTimeout(localT);
    localT = setTimeout(() => {
      local.vals = {};
      Object.keys(vals).forEach(k => { if (!/^m1@/.test(k) && vals[k]) local.vals[k] = vals[k]; });
      local.done = [...done].filter(k => !/^m1@/.test(k));
      try { localStorage.setItem(LOCAL_KEY, JSON.stringify(local)); } catch (e) { }
    }, 400);
  }
  const written = d => !!((entries[d] && entries[d].length) || ['m2', 'm3', 'e1', 'e2', 'e3'].some(s => vals[s + '@' + d]));
  const morningDone = d => ['m1', 'm2', 'm3'].some(s => vals[s + '@' + d]);
  const eveningDone = d => ['e1', 'e2', 'e3'].some(s => vals[s + '@' + d]);

  /* ---------- Doc's thanks sentences: table grateful, one row per entry (several a day are possible) ---------- */
  const auth = window.svpAuth;
  const entries = {};                      /* day -> [{ id, text }] */
  async function loadEntries() {
    const res = await auth.api('grateful?select=id,day,text&day=gte.' + YEAR + '-01-01&day=lte.' + YEAR + '-12-31&order=day.asc,id.asc');
    if (!res.ok) throw new Error(res.status === 401 || res.status === 403 ? 'Kein Zugriff mit diesem Konto' : 'HTTP ' + res.status);
    (await res.json()).forEach(r => { (entries[r.day] = entries[r.day] || []).push({ id: r.id, text: r.text }); });
    Object.keys(entries).forEach(d => { vals['m1@' + d] = entries[d].map(e => e.text).join('\n'); done.add('m1@' + d); });
  }
  /* writing the thanks sentence back: a day with no entry gets one, a day with exactly one changes it; a day with several
     stays read-only in the book (edit those on /grateful/). An emptied field never deletes anything. */
  const m1T = {};
  function queueM1(day) { clearTimeout(m1T[day]); m1T[day] = setTimeout(() => storeM1(day), 1200); }
  async function storeM1(day) {
    const text = (vals['m1@' + day] || '').trim(), list = entries[day] || [];
    if (!text || list.length > 1 || (list.length === 1 && list[0].text === text)) return;
    try {
      const res = list.length === 1
        ? await auth.api('grateful?id=eq.' + list[0].id, { method: 'PATCH', headers: { Prefer: 'return=representation' }, body: JSON.stringify({ text }) })
        : await auth.api('grateful', { method: 'POST', headers: { Prefer: 'return=representation' }, body: JSON.stringify([{ day, text }]) });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const rows = await res.json();
      if (rows.length) entries[day] = [{ id: rows[0].id, text: rows[0].text }];
      markSaved(day);
    } catch (e) { toast('Nicht gespeichert: ' + e.message); }
  }
  function markSaved(day) {
    $$('.p-morgen[data-day="' + day + '"] .ft span:last-child').forEach(s => { s.textContent = 'Morgen · gespeichert ✎'; });
    renderReg();
  }
  function afterChange(k) {
    const at = k.indexOf('@');
    if (k.startsWith('m1@')) queueM1(k.slice(at + 1)); else { saveLocal(); markDirty(k); }
    if (/^[me][123]@/.test(k)) renderRegSoon();
    if (/^n[12]@/.test(k)) $$('.quill[data-note="' + k + '"]').forEach(b => b.classList.toggle('has', !!String(vals[k] || '').trim()));
  }

  /* ---------- sayings: the weekly thoughts (gdw.json, Doc's sheets) and the wisdoms of the world (gdw-weisheiten.json) ---------- */
  /* SPR: every sheet with its true author and source (sprueche.json, made by tools/gdw/sprueche.py from blaetter.json);
     the card and the week page name the author, never a sheet number (Doc, 23.11.2026) */
  /* TAG: the sayings for the days of the year (sprueche-tag.json, nr 102 on, each with author, work and checked source).
     Kept apart from SPR: SPR is looked up by sheet number, TAG is no sheet. */
  let GDW = [], WEISHEIT = [], SPR = {}, TAG = [];
  /* the personality of the month (persoenlichkeiten.json, one per month, born in it): fills the month view's right page */
  let PERS = {};
  function fillPers(d, m) {
    const box = d.querySelector('[data-pers]'), x = PERS[m];
    if (!box) return;
    box.hidden = !x;
    if (!x) return;
    const img = box.querySelector('img');
    img.src = x.bild; img.alt = x.name + (x.bild_urheber ? ' – ' + x.bild_urheber : '');
    const years = (String(x.lebensdaten || '').match(/\d{4}/g) || []).join('–');
    const plate = box.querySelector('.brass'), b = document.createElement('b');
    b.textContent = x.name; plate.replaceChildren(b, document.createElement('br'), document.createTextNode(years));
    setText(box, '.pers-nm', x.name);
    setText(box, '.pers-rl', x.rolle || '');
    setText(box, '.pers-ld', x.lebensdaten || '');
    setText(box, '.pers-bio', x.bio || '');
    setText(box, '.pers-src', 'Bild: ' + (x.bild_urheber ? x.bild_urheber + ', ' : '') + 'gemeinfrei (Wikimedia Commons)');
  }
  async function loadSayings() {
    const get = async (u, list) => { try { const r = await fetch(u); if (!r.ok) return list ? [] : {}; const j = await r.json(); return list ? Object.values(j) : j; } catch (e) { return list ? [] : {}; } };
    let spr, pers;
    [GDW, WEISHEIT, spr, TAG, pers] = await Promise.all([get('../svp/gdw.json', true), get('../svp/gdw-weisheiten.json', true), get('sprueche.json', true), get('sprueche-tag.json', true), get('persoenlichkeiten.json', true)]);
    SPR = {}; spr.forEach(s => { SPR[pad(s.nr)] = s; });
    PERS = {}; pers.forEach(x => { if (x && x.monat) PERS[x.monat] = x; });
    PLAN = null;
  }
  const abDate = s => { const m = /^(\d\d)\.(\d\d)\.(\d\d)$/.exec(s || ''); return m ? '20' + m[3] + '-' + m[2] + '-' + m[1] : ''; };
  /* text (may carry <em> red words and <br>) and the line with the author */
  const byLine = s => s && s.wer ? s.wer + (s.rolle ? ' · ' + s.rolle : '') : '';
  /* the weekly thought of the week starting on monday: Doc's own sheet that school week, else a wisdom, round the year */
  /* the reader's birthday in this book's year (settings.geb 'DD.MM'), or '' */
  const birthDay = () => { const m = /^(\d\d)\.(\d\d)$/.exec(settings.geb || ''); const d = m ? YEAR + '-' + m[2] + '-' + m[1] : ''; return DAYS.includes(d) ? d : ''; };
  /* the last weekly thought of the year is Doc's slogan (Doc, 24.11.2026: "The future was yesterday als Gedanken der Woche") */
  const lastMonday = () => DAYS.filter(d => dateOf(d).getDay() === 1).pop();
  function weekThought(monday) {
    if (monday === lastMonday()) return { bild: '', card: 'The future<br>was yesterday.', html: 'The future was <em>yesterday</em>.', by: 'Doc Alvers', own: false };
    const own = GDW.find(g => abDate(g.ab) === monday);
    const pick = own || WEISHEIT.find(g => abDate(g.ab) === monday) || WEISHEIT[(isoWeek(monday) + 52) % Math.max(1, WEISHEIT.length)];
    if (!pick) return null;
    const s = SPR[pick.bild];
    return { bild: pick.bild, html: s ? s.text : esc(pick.titel || ''), by: byLine(s), own: !!own };
  }
  /* The thought of the day (the taped card): every day of the year its own saying, none twice (Doc, 24.11.2026).
     Pool: the sayings with an author (sprueche.json, sprueche-tag.json) and Doc's own sheets with words (gdw.json).
     1. No day repeats the weekly thought of its own week: the week page ("Gedanke der Woche · ab Montag") shows it right
        before Monday, and Monday's card used to show it again (Doc, 24.11.2026: "das wiederholt das von der Seite davor ...
        bitte nicht"). So the weekly thought of a week is skipped on that week's days.
     2. A saying with a season ("zeit" in sprueche-tag.json) only stands in its season: spread evenly over it, the
        narrowest seasons first (Christmas, the turn of the year, May, ...).
     3. Every other day walks through one shuffled list of the rest (fixed seed = the year) and skips what is taken.
     Only if the pool is smaller than the year does a saying come back - the one of the earliest day without a season.
     (The old rotation, day * 7 % 42, only ever reached 6 sayings - Einstein came back every week.) */
  let PLAN = null;
  const sayKey = h => String(h || '').replace(/<[^>]*>/g, ' ').toLowerCase().replace(/ß/g, 'ss').replace(/[^a-z0-9äöü]+/g, '');
  /* Doc's sheets that are no thought of the day (a single word, a cut-off text, a picture caption): never in the daily
     rotation, but still the weekly thought on their own Monday (Doc / Marie, 24.11.2026) */
  const NOT_DAILY = new Set(['02', '03', '16']);
  /* the seasons as month-day ranges (a range may run over the new year) */
  const ZEIT = {
    fruehling: ['03-21', '06-20'], mai: ['05-01', '05-31'], sommer: ['06-21', '09-22'], herbst: ['09-23', '12-20'],
    winter: ['12-21', '03-20'], winterende: ['02-15', '03-20'], weihnacht: ['12-24', '12-26'], jahreswechsel: ['12-31', '01-01']
  };
  const ZEIT_NAME = { fruehling: 'Frühling', mai: 'Mai', sommer: 'Sommer', herbst: 'Herbst', winter: 'Winter', winterende: 'Winterende',
    weihnacht: 'Weihnachten', jahreswechsel: 'Jahreswechsel' };
  const inZeit = (z, day) => {
    const w = ZEIT[z], md = day.slice(5);
    return !w || (w[0] <= w[1] ? md >= w[0] && md <= w[1] : md >= w[0] || md <= w[1]);
  };
  function yearPlan() {
    if (PLAN) return PLAN;
    const pool = [], byKey = new Map();
    const add = t => { t.key = sayKey(t.html); if (t.key && !byKey.has(t.key)) { byKey.set(t.key, t); pool.push(t); } };
    const authored = s => ({ html: s.text, by: byLine(s), nr: s.nr, quelle: s.quelle || '', zeit: ZEIT[s.zeit] ? s.zeit : '' });
    Object.values(SPR).filter(s => s.wer && s.text).forEach(s => add(authored(s)));
    TAG.filter(s => s.wer && s.text).forEach(s => add(authored(s)));
    GDW.forEach(g => {
      const s = SPR[g.bild];
      if ((s && s.wer) || NOT_DAILY.has(g.bild)) return;
      add({ html: s ? s.text : esc(g.titel || ''), by: 'Gedanke der Woche', nr: g.bild, quelle: '', own: true, zeit: '' });
    });
    const plan = DAYS.map(() => null), used = new Set();
    /* 0. fixed days (Doc, 24.11.2026): his slogan on 1 January, Böcklin's motto on the reader's birthday */
    const fix = (day, t) => { const i = DAYS.indexOf(day); if (i < 0) return; t.key = sayKey(t.html); plan[i] = t; used.add(t.key); };
    fix(YEAR + '-01-01', { html: 'Think the <em>impossible</em>.', by: 'Doc Alvers', nr: 'Doc', quelle: '', zeit: '' });
    const bd = birthDay();
    /* ?gruss=…: a greeting of its own on the birthday's card instead of Böcklin's motto - only from the link, never in the code;
       "|" breaks the line, _word_ is set in red (e.g. ?geb=25.11&tag=2026-11-25&gruss=Nachträglich alles Gute zum Geburtstag,|_Dr. X_!) */
    const gruss = (() => { try { return (new URLSearchParams(location.search).get('gruss') || '').trim().slice(0, 160); } catch (e) { return ''; } })();
    const grussHtml = gruss.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])).replace(/_([^_]+)_/g, '<em>$1</em>').replace(/\s*\|\s*/g, '<br>');
    if (bd) fix(bd, gruss ? { html: grussHtml, by: '', nr: 'Geburtstag', gruss: true, quelle: '', zeit: '' }
      : { html: 'Vita somnium breve.<br>Das Leben ist ein kurzer <em>Traum</em>.', by: 'Arnold Böcklin · Gemälde, 1888', nr: 'Geburtstag', quelle: '', zeit: '' });
    /* 1. the weekly thought of each day's week (Monday to Sunday) - kept off that week's days */
    const weekKeys = new Map();
    const wkOf = day => {
      const mon = addDays(day, -((dateOf(day).getDay() + 6) % 7));
      if (!weekKeys.has(mon)) { const w = weekThought(mon); weekKeys.set(mon, w && w.html ? sayKey(w.html) : ''); }
      return weekKeys.get(mon);
    };
    const wk = DAYS.map(wkOf);
    const r = mulberry32(YEAR);
    const order = pool.map(t => [r(), t]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
    /* 2. the sayings with a season, each group spread evenly over its days (the nearest free day to its share) */
    const groups = {};
    order.filter(t => t.zeit && !used.has(t.key)).forEach(t => { (groups[t.zeit] = groups[t.zeit] || []).push(t); });
    const span = z => DAYS.filter(d => inZeit(z, d)).length;
    Object.keys(groups).sort((a, b) => span(a) - span(b)).forEach(z => {
      const win = DAYS.map((d, i) => i).filter(i => inZeit(z, DAYS[i]));
      groups[z].forEach((t, n) => {
        const want = Math.floor((n + 0.5) * win.length / groups[z].length);
        for (let off = 0; off < win.length; off++) {
          const k = [want + off, want - off].find(x => x >= 0 && x < win.length && !plan[win[x]] && wk[win[x]] !== t.key);
          if (k !== undefined) { plan[win[k]] = t; used.add(t.key); return; }
        }
      });
    });
    /* 3. all other days */
    const rest = order.filter(t => !t.zeit);

  const INK = { phi: '#55801c', ochre: '#b07a14', ink: '#1f3d7a', lead: '#555b66', red: '#a3301f' };
  const WASH = ['245,194,66', '121,158,49', '90,150,210', '210,110,80', '245,194,66'];
  const mctx = document.createElement('canvas').getContext('2d');

  function deform(pts, depth, v, r) {
    for (let d = 0; d < depth; d++) {
      const o = [];
      for (let i = 0; i < pts.length; i++) {
        const a = pts[i], b = pts[(i + 1) % pts.length], len = Math.hypot(b[0] - a[0], b[1] - a[1]);
        o.push(a, [(a[0] + b[0]) / 2 + gauss(r) * len * v, (a[1] + b[1]) / 2 + gauss(r) * len * v]);
      }
      pts = o;
    }
    return pts;
  }
  /* watercolour stain after Tyler Hobbs: one deformed polygon, many faint re-deformed layers */
  function stain(cx, cy, rx, ry, rgb, r, layers) {
    let base = [];
    for (let i = 0; i < 9; i++) { const a = i / 9 * Math.PI * 2, k = 0.78 + r() * 0.44; base.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]); }
    base = deform(base, 2, 0.42, r);
    let s = '';
    for (let l = 0; l < layers; l++) {
      const p = deform(base, 1, 0.32, r);
      s += '<path d="M' + p.map(q => f1(q[0]) + ' ' + f1(q[1])).join('L') + 'Z" fill="rgb(' + rgb + ')" fill-opacity="0.055"/>';
    }
    for (let i = 0; i < 7; i++) {   /* a few splashes */
      const a = r() * Math.PI * 2, d = 1 + r() * 0.5;
      s += '<circle cx="' + f1(cx + Math.cos(a) * rx * d) + '" cy="' + f1(cy + Math.sin(a) * ry * d) + '" r="' + f1(0.8 + r() * 2.6) + '" fill="rgb(' + rgb + ')" fill-opacity="0.32"/>';
    }
    return s;
  }
  function roughPaths(drawable, extra) {
    if (!window.rough) return '';
    const gen = rough.generator();
    return gen.toPaths(drawable).map(p => '<path d="' + p.d + '" fill="' + (p.fill || 'none') + '" stroke="' + p.stroke + '" stroke-width="' + p.strokeWidth + '"' + (extra || '') + '/>').join('');
  }
  function heart(x, y, s, seed) {
    if (!window.rough) return '';
    const gen = rough.generator();
    const d = gen.path('M10 18 C3 12 0 8 0 5 C0 2 2 0 5 0 C7 0 9 1 10 3 C11 1 13 0 15 0 C18 0 20 2 20 5 C20 8 17 12 10 18 Z',
      { fill: 'rgba(176,48,28,.75)', fillStyle: 'hachure', hachureGap: 2.4, fillWeight: 1, stroke: '#8e2a1b', strokeWidth: 1.1, roughness: 1.1, seed: seed });
    return '<g transform="translate(' + f1(x) + ' ' + f1(y) + ') scale(' + s + ')">' + gen.toPaths(d).map(p => '<path d="' + p.d + '" fill="' + (p.fill || 'none') + '" stroke="' + p.stroke + '" stroke-width="' + p.strokeWidth + '"/>').join('') + '</g>';
  }

  function paintCloud(words, W, H, o) {
    const r = mulberry32(o.seed);
    const sorted = words.slice().sort((a, b) => b[1] - a[1]);
    const max = sorted[0][1], min = sorted[sorted.length - 1][1], n = sorted.length;
    const placed = (o.reserve || []).map(q => q.slice());
    const items = [];
    const gl = W / 2 - W * 0.035, gr = W / 2 + W * 0.035;
    const hits = q => placed.some(p => q[0] < p[0] + p[2] && q[0] + q[2] > p[0] && q[1] < p[1] + p[3] && q[1] + q[3] > p[1]);
    sorted.forEach(([w, c], i) => {
      const t = Math.sqrt((c - min) / Math.max(1, max - min)), rank = i / n;
      const brush = rank < 0.3, fs = o.fsMin + (o.fsMax - o.fsMin) * t;
      const ff = brush ? '"Caveat Brush"' : 'Caveat', fw = brush ? 400 : (rank < 0.62 ? 600 : 500);
      mctx.font = fw + ' ' + fs + 'px ' + ff;
      mctx.textBaseline = 'middle';
      const m = mctx.measureText(w);
      const tw = m.width, asc = m.actualBoundingBoxAscent || fs * 0.42, desc = m.actualBoundingBoxDescent || fs * 0.3;
      const pad = Math.max(2, fs * 0.08), phase = r() * Math.PI * 2;
      for (let a = 0; a < 700; a += 0.11) {
        const rr = a * o.step;
        const x = o.cx + Math.cos(a + phase) * rr * o.ax, y = o.cy + Math.sin(a + phase) * rr;
        const q = [x - tw / 2 - pad, y - asc - pad, tw + 2 * pad, asc + desc + 2 * pad];
        if (q[0] < o.m || q[1] < o.top || q[0] + q[2] > W - o.m || q[1] + q[3] > H - o.bottom) continue;
        if (o.gutter && q[0] < gr && q[0] + q[2] > gl) continue;
        if (hits(q)) continue;
        placed.push(q);
        const col = rank < 0.1 ? INK.phi : rank < 0.3 ? INK.ochre : rank < 0.62 ? INK.ink : INK.lead;
        items.push({ w, x, y, fs, ff, fw, col, rot: (r() - 0.5) * 7, tw, asc, desc, rank, kind: brush ? 'brush' : rank < 0.62 ? 'ink' : 'lead' });
        break;
      }
    });
    let wash = '', ink = '', brushS = '', lead = '', deco = '';
    items.slice(0, o.washes).forEach((it, i) => { wash += stain(it.x, it.y, it.tw * 0.62 + 18, (it.asc + it.desc) * 0.95 + 14, WASH[i % WASH.length], r, 12); });
    items.forEach(it => {
      const s = '<text x="' + f1(it.x) + '" y="' + f1(it.y) + '" transform="rotate(' + f1(it.rot) + ' ' + f1(it.x) + ' ' + f1(it.y) + ')" font-family=\'' + it.ff + '\' font-weight="' + it.fw + '" font-size="' + f1(it.fs) + '" fill="' + it.col + '" text-anchor="middle" dominant-baseline="middle">' + esc(it.w) + '</text>';
      if (it.kind === 'brush') brushS += s; else if (it.kind === 'ink') ink += s; else lead += s;
    });
    if (window.rough && o.deco && items.length > 3) {
      const gen = rough.generator();
      const a = items[0], b = items[1];
      deco += roughPaths(gen.ellipse(a.x, a.y + 2, a.tw * 1.12 + 16, (a.asc + a.desc) * 1.45 + 4, { stroke: INK.red, strokeWidth: 1.7, roughness: 1.9, bowing: 1.6, seed: o.seed + 1 }));
      const by = b.y + b.desc + 6;
      deco += roughPaths(gen.curve([[b.x - b.tw / 2, by + 2], [b.x - b.tw / 6, by + 5], [b.x + b.tw / 4, by + 1], [b.x + b.tw / 2 + 4, by + 3]], { stroke: INK.ochre, strokeWidth: 2.2, roughness: 1.3, seed: o.seed + 2 }));
      (o.hearts || []).forEach((h, i) => { deco += heart(h[0], h[1], h[2], o.seed + 10 + i); });
      (o.stars || []).forEach((st, i) => {
        const pts = []; for (let k = 0; k < 10; k++) { const ang = -Math.PI / 2 + k * Math.PI / 5, rad = k % 2 ? st[2] * 0.45 : st[2]; pts.push([st[0] + Math.cos(ang) * rad, st[1] + Math.sin(ang) * rad]); }
        deco += roughPaths(gen.polygon(pts, { stroke: INK.ochre, strokeWidth: 1.3, roughness: 1.2, fill: 'rgba(245,194,66,.55)', fillStyle: 'solid', seed: o.seed + 20 + i }));
      });
      if (o.note) {
        /* the margin note points at the nearest smaller word - a short arrow, never across the page */
        const cand = items.slice(3).filter(it => it.y < o.note.y - 20);
        const tgt = cand.sort((p, q) => Math.hypot(p.x - o.note.x - 60, p.y - o.note.y) - Math.hypot(q.x - o.note.x - 60, q.y - o.note.y))[0];
        if (tgt) {
          o.note.word = tgt.w;
          const sx = o.note.x + 40, sy = o.note.y - 24, ex = tgt.x, ey = tgt.y + tgt.desc + 6;
          const mx = (sx + ex) / 2 + 22, my = (sy + ey) / 2 + 8;
          deco += roughPaths(gen.curve([[sx, sy], [mx, my], [ex, ey]], { stroke: INK.ink, strokeWidth: 1.5, roughness: 1.1, seed: o.seed + 30 }));
          const ang = Math.atan2(ey - my, ex - mx);
          [0.5, -0.5].forEach((d, i) => { deco += roughPaths(gen.line(ex, ey, ex - Math.cos(ang + d) * 12, ey - Math.sin(ang + d) * 12, { stroke: INK.ink, strokeWidth: 1.5, roughness: 0.8, seed: o.seed + 31 + i })); });
        }
      }
    }
    let title = '';
    if (o.title) {
      const tt = o.title;
      title += '<text x="' + tt.x + '" y="' + tt.y + '" font-family="\'Caveat Brush\'" font-size="' + tt.fs + '" fill="' + INK.ink + '">Mein Jahr in Worten</text>';
      title += '<text x="' + tt.x + '" y="' + (tt.y + tt.fs * 0.95) + '" font-family="Orbitron" font-weight="700" font-size="' + (tt.fs * 0.42) + '" letter-spacing="6" fill="' + INK.ochre + '">' + YEAR + '</text>';
      if (window.rough) title += roughPaths(rough.generator().line(tt.x, tt.y + tt.fs * 0.28, tt.x + tt.fs * 5.6, tt.y + tt.fs * 0.22, { stroke: INK.red, strokeWidth: 1.6, roughness: 1.4, seed: o.seed + 40 }));
    }
    let note = '';
    if (o.note) note = '<text x="' + o.note.x + '" y="' + o.note.y + '" font-family="Caveat" font-weight="600" font-size="' + o.note.fs + '" fill="' + INK.ink + '" transform="rotate(-4 ' + o.note.x + ' ' + o.note.y + ')">neu dabei: ' + esc(o.note.word || 'Fahrrad') + '</text>';
    let small = '';
    if (o.small) small = '<text x="' + o.small.x + '" y="' + o.small.y + '" font-family="Arial" font-size="' + o.small.fs + '" fill="#8a7b62" font-style="italic">Beispielwörter · die echte Wolke liest alle Einträge</text>';
    return '<g filter="url(#f-wc)">' + wash + '</g>' +
      '<g filter="url(#f-pencil)" opacity=".9">' + lead + '</g>' +
      '<g filter="url(#f-ink)">' + ink + title + note + '</g>' +
      '<g filter="url(#f-brush)">' + brushS + '</g>' +
      '<g filter="url(#f-pencil)">' + deco + '</g>' + small;
  }

  function paintHabits(rows) {
    const D = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
    const x0 = 196, dx = 43, r = mulberry32(77);
    let s = '<g filter="url(#f-wc)">' + stain(x0 + 6 * dx, 100, 22, 78, '245,194,66', r, 10) + '</g>';
    s += D.map((d, i) => '<text x="' + (x0 + i * dx) + '" y="22" font-family="Arial" font-size="15" fill="#6d6250" text-anchor="middle">' + d + '</text>').join('');
    let marks = '';
    /* six habits since 24.11.2026: the rows closer and the names smaller, so they still fit the box */
    const many = rows.length > 3, y0 = many ? 44 : 62, dy = many ? 22.5 : 46, fs = many ? 21 : 27, cr = many ? 19 : 27;
    rows.forEach(([name, v], ri) => {
      const y = y0 + ri * dy;
      s += '<text x="6" y="' + (y + (many ? 6 : 8)) + '" font-family="Caveat" font-weight="600" font-size="' + fs + '" fill="' + INK.ink + '">' + esc(name) + '</text>';
      if (window.rough) {
        const gen = rough.generator();
        v.forEach((on, i) => {
          const cx = x0 + i * dx;
          marks += roughPaths(gen.circle(cx, y, cr, on
            /* done in gold, like the gold balls of the day pages (Doc, 24.11.2026: "kein grünes Check, sondern ... golden") */
            ? { stroke: '#9a6f1c', strokeWidth: 1.3, roughness: 1.3, fill: 'rgba(214,166,58,.9)', fillStyle: 'hachure', hachureGap: 3.2, fillWeight: 1.2, seed: 100 + ri * 10 + i }
            : { stroke: INK.lead, strokeWidth: 1, roughness: 1.1, seed: 100 + ri * 10 + i }));
        });
      }
    });
    return s + '<g filter="url(#f-pencil)">' + marks + '</g>';
  }

  function paintAll() {
    const words = wordCounts(DAYS).slice(0, 120);   /* as many as fit - the cloud places them big to small until the page is full */
    const W = words.length > 4 ? words : [['Grateful', 3], ['Danke', 2], ['Jahr', 1]];
    /* the margin note: a word that is new in the last 30 days */
    const recent = new Set(wordCounts(DAYS.filter(d => d > addDays(TODAY, -30) && d <= TODAY)).map(w => w[0]));
    const older = new Set(wordCounts(DAYS.filter(d => d <= addDays(TODAY, -30))).map(w => w[0]));
    const fresh = W.find(w => recent.has(w[0]) && !older.has(w[0]));
    const note = fresh ? fresh[0] : null;
    $('#draw-cloud-spread').innerHTML = paintCloud(W, 1000, 700, {
      seed: 7, cx: 500, cy: 395, ax: 1.5, step: 1.45, m: 62, top: 150, bottom: 92, gutter: true, fsMax: 96, fsMin: 21, washes: 5, deco: true,
      reserve: [[60, 48, 380, 112], [640, 600, 300, 60]],
      title: { x: 72, y: 96, fs: 50 }, note: note ? { x: 668, y: 640, fs: 28, word: note } : null,
      hearts: [[880, 92, 1.3], [118, 560, 1.1]], stars: [[930, 160, 11], [452, 92, 8]]
    });
    $('#draw-cloud-portrait').innerHTML = paintCloud(W, 600, 960, {
      seed: 11, cx: 300, cy: 520, ax: 0.75, step: 1.25, m: 52, top: 190, bottom: 110, gutter: false, fsMax: 76, fsMin: 17, washes: 4, deco: true,
      reserve: [[52, 50, 360, 120], [300, 860, 280, 60]],
      title: { x: 60, y: 104, fs: 48 }, note: note ? { x: 316, y: 896, fs: 27, word: note } : null,
      hearts: [[500, 96, 1.2]], stars: [[540, 170, 10]]
    });
  }

  /* ---------- monthly check (Monatsblick): six questions 1-10 per month, the curve over the months that have answers ---------- */
  const MQ_SHORT = ['glücklich', 'gelassen', 'gut für mich gesorgt', 'nah bei meinen Menschen', 'Gutes bemerkt', 'zufrieden mit mir'];
  const de1 = v => v.toFixed(1).replace('.', ',');
  const monthVals = m => (local.months[m] = local.months[m] || []);
  const monthAvg = m => { const v = (local.months[m] || []).filter(x => x > 0); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  function markScale(sc) {
    const v = (local.months[sc.dataset.m] || [])[+sc.dataset.q] || 0;
    sc.querySelectorAll('button').forEach(b => { const n = +b.dataset.v; b.classList.toggle('on', n === v); b.classList.toggle('lo', n < v); });
  }
  /* this month against the first month that has answers */
  function fillCmp(el) {
    const m = el.dataset.m, ms = Object.keys(local.months).filter(x => monthAvg(x) !== null && x <= m).sort();
    const first = ms[0], now = local.months[m] || [];
    el.innerHTML = MQ_SHORT.map((t, i) => {
      const a = first && first !== m ? (local.months[first] || [])[i] : null, b = now[i];
      const ar = a && b ? (b > a ? '↗' : b < a ? '↘' : '→') : '';
      return '<span>' + t + '</span><em class="v">' + (a || '') + '</em><em class="ar">' + ar + '</em><em class="v now">' + (b || '–') + '</em>';
    }).join('');
    const lbl = el.previousElementSibling;
    if (lbl && lbl.classList.contains('lbl')) lbl.textContent = first && first !== m ? MONTHS[+first.slice(5) - 1] + ' → ' + MONTHS[+m.slice(5) - 1] : MONTHS[+m.slice(5) - 1] + ' · dein erster Monatsblick';
  }
  /* the year as one hand-drawn curve: the mean of all six answers (ink, green wash) and "happy" alone (ochre); the month of the page in gold */
  function paintTrend(m) {
    const W = 500, H = 300, L = 40, R = 92, T = 34, B = 40, n = 12, dx = (W - L - R) / (n - 1);
    const x = i => L + i * dx, y = v => T + (10 - v) / 9 * (H - T - B);
    const key = i => YEAR + '-' + pad(i + 1);
    const avg = MONTHS.map((_, i) => monthAvg(key(i)));
    const hap = MONTHS.map((_, i) => (local.months[key(i)] || [])[0] || null);
    const pts = avg.map((v, i) => v === null ? null : [x(i), y(v)]).filter(Boolean);
    const hp = hap.map((v, i) => v ? [x(i), y(v)] : null).filter(Boolean);
    const mi = +m.slice(5) - 1;
    let txt = '', pen = '', wash = '';
    [2, 4, 6, 8, 10].forEach(v => { txt += '<text x="' + (L - 12) + '" y="' + f1(y(v) + 4) + '" font-family="Orbitron" font-size="11" fill="#8a7b62" text-anchor="end">' + v + '</text>'; });
    'JFMAMJJASOND'.split('').forEach((c, i) => { txt += '<text x="' + f1(x(i)) + '" y="' + (H - B + 25) + '" font-family="Caveat" font-weight="' + (i === mi ? 700 : 600) + '" font-size="' + (i === mi ? 23 : 20) + '" fill="' + (i === mi ? INK.ochre : INK.ink) + '" text-anchor="middle">' + c + '</text>'; });
    if (pts.length > 1) wash = '<path d="M' + f1(pts[0][0]) + ' ' + (H - B) + ' L' + pts.map(p => f1(p[0]) + ' ' + f1(p[1])).join(' L') + ' L' + f1(pts[pts.length - 1][0]) + ' ' + (H - B) + ' Z" fill="rgba(121,158,49,.34)"/>';
    if (window.rough) {
      const g = rough.generator();
      [2, 4, 6, 8, 10].forEach((v, k) => { pen += roughPaths(g.line(L, y(v), W - R + 8, y(v), { stroke: '#c2b69c', strokeWidth: .8, roughness: .7, seed: 300 + k })); });
      pen += roughPaths(g.line(L - 4, H - B, W - R + 8, H - B, { stroke: INK.lead, strokeWidth: 1.2, roughness: .9, seed: 310 }));
      if (hp.length > 1) pen += roughPaths(g.linearPath(hp, { stroke: INK.ochre, strokeWidth: 1.6, roughness: 1.1, seed: 320 }));
      if (pts.length > 1) pen += roughPaths(g.linearPath(pts, { stroke: INK.ink, strokeWidth: 2.6, roughness: 1.15, seed: 330 }));
      avg.forEach((v, i) => { if (v === null) return; pen += roughPaths(g.circle(x(i), y(v), i === mi ? 16 : 9, { stroke: INK.ink, strokeWidth: 1.4, fill: i === mi ? 'rgba(245,194,66,.95)' : '#fffaf0', fillStyle: 'solid', roughness: .8, seed: 340 + i })); });
    }
    const known = avg.map((v, i) => [v, i]).filter(p => p[0] !== null);
    if (known.length > 1) {
      /* the gain beside the last point - a tick lower than before, away from the legend (Doc, 24.11.2026: "'n Tick runter") */
      const d = known[known.length - 1][0] - known[0][0], ex = x(known[known.length - 1][1]), ey = Math.max(y(known[known.length - 1][0]), 54);
      txt += '<text x="' + f1(Math.min(ex + 26, W - 60)) + '" y="' + f1(ey - 26) + '" font-family="Caveat" font-weight="700" font-size="30" fill="' + INK.phi + '">' + (d >= 0 ? '+' : '−') + de1(Math.abs(d)) + '</text>';
      txt += '<text x="' + f1(Math.min(ex + 26, W - 60)) + '" y="' + f1(ey - 8) + '" font-family="Caveat" font-size="17" fill="' + INK.phi + '">seit ' + MONTHS[known[0][1]] + '</text>';
    } else {
      txt += '<text x="' + (W / 2) + '" y="' + (H / 2) + '" font-family="Caveat" font-size="22" fill="#8a7b62" text-anchor="middle">Die Kurve beginnt mit deinem ersten Monatsblick.</text>';
    }
    txt += '<path d="M' + (L + 4) + ' 12 h22" stroke="' + INK.ink + '" stroke-width="2.6"/><text x="' + (L + 32) + '" y="17" font-family="Caveat" font-size="18" fill="' + INK.ink + '">Schnitt aller Fragen</text>';
    txt += '<path d="M' + (L + 186) + ' 12 h22" stroke="' + INK.ochre + '" stroke-width="1.8"/><text x="' + (L + 214) + '" y="17" font-family="Caveat" font-size="18" fill="' + INK.ochre + '">glücklich</text>';
    return '<g filter="url(#f-wc)">' + wash + '</g><g filter="url(#f-pencil)">' + pen + '</g><g filter="url(#f-ink)">' + txt + '</g>';
  }
  function repaintMonths() {
    $$('.p-monatR[data-filled] svg.trend').forEach(s => { s.innerHTML = paintTrend(s.closest('.leaf').dataset.month); });
    $$('[data-cmp]').forEach(fillCmp);
  }
  /* tapping a circle sets the value on every copy of the page and moves that month on the curve */
  document.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('.scale button'); if (!b) return;
    const sc = b.parentElement, m = sc.dataset.m, q = +sc.dataset.q;
    monthVals(m)[q] = +b.dataset.v;
    saveLocal(); markDirty('x@' + m);
    $$('.scale[data-m="' + m + '"][data-q="' + q + '"]').forEach(markScale);
    repaintMonths();
  });

  /* ---------- the pages of the year ---------- */
  /* Front matter, then every day as a spread (morning | evening), after each Sunday the week, after each month's last day the
     monthly check, at the end the year in words. Desk: spreads (cover alone, then pairs), so every block has an even number of
     pages and each day's morning lands on a left page. Phone: single pages. About 870 pages - they start as empty shells and
     get their content only near the open spread (fillNear). */
  const HARD = new Set(['cover', 'endpaper', 'endpaper2', 'back']);
  const LAZY = new Set(['morgen', 'spruch', 'abend', 'wocheL', 'wocheR', 'monatL', 'monatR']);
  /* the pages of one day: morning, (phone: the thought of the day), evening */
  const DAYPAGE = new Set(['morgen', 'spruch', 'abend']);
  /* Phone (24.11.2026): the inside of the front board with the plate (?seite=innen&fuer=…) is a page of its own too, and the
     thought of the day - on the desk a card taped across the fold - is the page between morning and evening. */
  function buildSeq(m) {
    const seq = [], add = (kind, key) => seq.push({ kind, key: key || '' });
    add('cover'); add('endpaper');
    add('title'); add('toc1'); add('toc2'); add('set1'); add('set2'); ['intro1', 'intro2', 'intro3', 'intro4'].forEach(k => add(k));
    DAYS.forEach((d, i) => {
      add('morgen', d); if (m === 'phone') add('spruch', d); add('abend', d);
      const dt = dateOf(d), next = DAYS[i + 1];
      if (dt.getDay() === 0) { add('wocheL', d); add('wocheR', d); }
      if (!next || dateOf(next).getMonth() !== dt.getMonth()) { add('monatL', d.slice(0, 7)); add('monatR', d.slice(0, 7)); }
    });
    if (m === 'desk') { add('wolkeL'); add('wolkeR'); } else add('wolkeP');
    add('lines1'); if (m === 'desk') add('lines2');

  /* Swipes (phone and touch screens): a quick sideways stroke anywhere on the book turns one page - to the left = on, to the

  /* Full screen (Doc, 24.11.2026: "Wir brauchen fullscreen"): the switch bottom right on phones and touch screens, the key F
