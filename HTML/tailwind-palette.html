<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Tailwind palette picker (Doc, 19.09.2026: "unglaublich gut das Tool nicht wegwerfen!").
     Also published as https://claude.ai/artifact/L53Kd9NtgFGgFjeLZrCrYY -->
<title>Tailwind-Palette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap">
<style>
    /* Deliberately one look: the SVP grey scheme, so every swatch is judged
       on the ground it will actually sit on. */
    :root {
        --bg: rgb(26, 26, 28);
        --card: rgb(37, 37, 40);
        --line: rgba(205, 210, 220, 0.14);
        --text: rgba(238, 240, 244, 0.92);
        --muted: rgba(200, 204, 212, 0.62);
        --pick: 244, 114, 182;
        color-scheme: dark;
    }
    body {
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 8px 48px; }   /* was 24px on top - Doc: "alles ein Stück höher" */
    h1, h2, .mono-label {
        font-family: "Orbitron", system-ui, sans-serif;
        letter-spacing: 0.06em;
        text-wrap: balance;
    }
    h1 { font-size: 1.35rem; font-weight: 700; margin: 0 0 4px; }
    .lead { color: var(--muted); margin: 0 0 20px; max-width: 65ch; }

    /* ---- preview of the picked colour ---- */
    .preview {
        position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2;
        background: var(--bg);
        padding-block: 10px 14px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 18px;
        display: grid; gap: 10px;
    }
    .pv-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
    .pv-name { font-family: "Orbitron", sans-serif; font-size: 0.95rem; letter-spacing: 0.06em; color: rgb(var(--pick)); }
    .pv-val { font-variant-numeric: tabular-nums; color: var(--muted); }
    .copy {
        font: inherit; font-size: 0.8rem; color: var(--text);
        background: rgba(205, 210, 220, 0.08); border: 1px solid var(--line);
        border-radius: 8px; padding: 4px 10px; cursor: pointer;
    }
    .copy:hover, .copy:focus-visible { border-color: rgba(205, 210, 220, 0.5); outline: none; }
    .copied { color: rgb(74, 222, 128); font-size: 0.8rem; }
    .pv-rows { display: grid; gap: 6px; }
    .row {
        display: flex; align-items: center; gap: 14px;
        background: var(--card); border-radius: 6px;
        padding: 8px 14px; min-height: 22px;
        overflow: hidden;
    }
    .row .nr { color: var(--muted); font-variant-numeric: tabular-nums; }
    .row .topic { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row.now {
        background-image: linear-gradient(90deg, rgba(var(--pick), var(--pe, 0.26)), rgba(var(--pick), var(--pm, 0.06)) 50%, rgba(var(--pick), var(--pe, 0.26)));
        box-shadow: inset 2px 0 0 rgb(var(--pick)), inset -2px 0 0 rgb(var(--pick)),
            inset 6px 0 10px -6px rgba(var(--pick), 0.5), inset -6px 0 10px -6px rgba(var(--pick), 0.5);
    }
    .row.band {
        justify-content: center;
        font-family: "Orbitron", sans-serif; font-size: 0.78rem; letter-spacing: 0.08em;
        background-image: linear-gradient(90deg, rgba(var(--pick), var(--pe, 0.22)), rgba(var(--pick), var(--pm, 0.05)) 50%, rgba(var(--pick), var(--pe, 0.22)));
        box-shadow: inset 2px 0 0 rgb(var(--pick)), inset -2px 0 0 rgb(var(--pick));
        text-shadow: 0 0 10px rgba(var(--pick), 0.25);
    }
    .pill {
        font-family: "Orbitron", sans-serif; font-size: 0.66rem; letter-spacing: 0.04em;
        color: rgb(var(--pick));
        border: 1px solid rgba(var(--pick), 0.5);
        background: rgba(var(--pick), 0.08);
        box-shadow: 0 0 6px rgba(var(--pick), 0.2);
        border-radius: 6px; padding: 2px 9px; white-space: nowrap;
    }

    /* ---- the palette grid ---- */
    .scroll { overflow-x: auto; }
    table { border-collapse: separate; border-spacing: 3px; min-width: 420px; width: 100%; }

    /* ---- live link to an open plan (same origin, BroadcastChannel) ---- */
    /* one line per group: label column, then its chips */
    .targets { display: grid; grid-template-columns: max-content 1fr; align-items: center; gap: 8px 14px; }
    .grp {
        font-family: "Orbitron", sans-serif; font-size: 0.62rem; letter-spacing: 0.08em;
        text-transform: uppercase; color: var(--muted);
    }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    /* Doc: "Slider untereinander, Kopieren/Zurück eine Zeile tiefer rechts" */
    .tools { display: grid; gap: 10px; }
    .tools .alphas { display: grid; grid-template-columns: max-content 1fr max-content; }
    .acts { display: flex; gap: 6px; justify-self: end; }
    @media (max-width: 420px) {
        .targets { grid-template-columns: 1fr; gap: 4px; }
        .grp { margin-top: 6px; }
    }
    .tgt {
        font: inherit; font-size: 0.76rem; color: var(--muted);
        background: transparent; border: 1px solid var(--line);
        border-radius: 999px; padding: 3px 10px; cursor: pointer;
    }
    .tgt:hover { color: var(--text); }
    /* each chip wears its current colour (Doc: "mach die in den aktuellen
       Farben"): a tinted rim, the chosen one filled - the dot went again
       (Doc: "den Punkt vor den Farben weg") */
    /* Doc: "den der selektiert ist mit einem roten Rand, alle anderen den HG
       in der Randfarbe" - every chip is filled with its colour, the chosen
       one wears our red (Ypsilon) rim */
    /* ... then "bitte doch nur den Rand bunt": no fill, the rim in the colour,
       the chosen one keeps the red rim */
    .tgt { display: inline-flex; align-items: center; gap: 6px; }
    .tgt[data-prop] { color: var(--text); background: transparent; border-color: rgb(var(--c, 205, 210, 220)); }
    .tgt[data-prop]:hover { color: var(--text); background: rgba(var(--c, 205, 210, 220), 0.12); }
    /* Grund and Karten are nearly the page ground - a rim in their own colour
       vanished (Doc: "Grund Karte keine Pille?"), so dark ones get a light rim */
    .tgt[data-prop].dark-c { border-color: rgba(205, 210, 220, 0.45); }
    .tgt[data-prop].on, .tgt[data-prop].on.dark-c { border-color: rgb(176, 36, 24); box-shadow: 0 0 0 2px rgb(176, 36, 24); }   /* Doc: "roter Rand 1px dicker" - 3 px */
    .tgt:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
    /* Doc: "Kopieren grün, Zurück rot", then "bitte UNSER grün/rot" - the
       project palette (CLAUDE.md): phi green and Ypsilon red, filled */
    .tgt.copy-btn { margin-left: auto; color: rgb(255, 255, 255); background: rgb(121, 158, 49); border-color: rgb(121, 158, 49); }
    .tgt.reset { color: rgb(255, 255, 255); background: rgb(176, 36, 24); border-color: rgb(176, 36, 24); }
    .tgt.copy-btn:hover, .tgt.reset:hover { color: rgb(255, 255, 255); filter: brightness(1.12); }
    /* Doc: "bitte nur greyed wenn nicht relevant" - always there, dimmed and
       locked for targets without an alpha pair */
    .alphas.off { opacity: 0.35; }
    .alphas { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 0.8rem; color: var(--muted); }
    .alphas input[type="range"] { flex: 1 1 120px; min-width: 0; accent-color: rgb(var(--pick)); }
    .alphas output { color: var(--text); font-variant-numeric: tabular-nums; min-width: 3.2ch; }
    .summary { color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; min-height: 1.2em; }
    .summary b { color: var(--text); font-weight: 600; }
    th { font-weight: 500; color: var(--muted); font-size: 0.72rem; }
    thead th { font-variant-numeric: tabular-nums; padding-bottom: 2px; }
    tbody th {
        text-align: left; padding-right: 8px; white-space: nowrap;
        font-family: "Orbitron", sans-serif; letter-spacing: 0.05em; font-size: 0.66rem; text-transform: uppercase;
    }
    td { padding: 0; }
    .sw {
        display: block; width: 100%; height: 34px; border: 0; border-radius: 5px;
        cursor: pointer; position: relative; padding: 0;
    }
    .sw:hover { transform: scale(1.08); z-index: 1; }
    .sw:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
    .sw.sel { outline: 3px solid var(--text); outline-offset: 2px; transform: scale(1.1); z-index: 1; }
    .legend { color: var(--muted); font-size: 0.8rem; margin-top: 12px; max-width: 75ch; }
    @media (prefers-reduced-motion: reduce) { .sw:hover { transform: none; } }
</style>

<div class="wrap">
    <h1>Tailwind-Palette</h1>
    <div class="preview" aria-live="polite">
        <div class="pv-head" hidden>
            <!-- Doc: "die eine Farbe davor weg" - "Kopieren" takes the whole set now,
                 the single picked colour stays only as data for it -->
            <span class="pv-name" id="pv-name" hidden>pink-400</span>
            <span class="pv-val" id="pv-val" hidden>rgb(244, 114, 182) · #f472b6</span>
            <span class="copied" id="copied" hidden>kopiert</span>
        </div>
        <!-- Doc: "picker nimm das raus - die beiden Leisten" - the week row and
             holiday band preview are gone, the live plan is the preview -->
        <!-- Live link: each click also goes to every open SVP plan on this
             origin (localhost:8765) - the plan switches to grey and repaints. -->
        <!-- Doc: "das sieht sehr durcheinander aus" - the chips come in labelled
             groups, one line each. A short chip text keeps its old full name in
             data-label: that is the key of the stored trials and of "Kopieren". -->
        <div class="targets" id="targets" role="radiogroup" aria-label="Was im Plan umgefärbt wird">
            <span class="grp">Bänder</span>
            <div class="chips">
                <button type="button" class="tgt on" data-prop="--g-week" data-mark="W" data-alpha="week">Aktuelle Woche</button>
                <button type="button" class="tgt" data-prop="--g-ferien" data-mark="F" data-alpha="ferien">Ferien</button>
            </div>
            <span class="grp">Akzente</span>
            <div class="chips">
                <button type="button" class="tgt" data-prop="--g-orange" data-label="LB Orange" title="LB-Pillen">Orange</button>
                <button type="button" class="tgt" data-prop="--g-green">Grün</button>
                <button type="button" class="tgt" data-prop="--g-cyan">Cyan</button>
                <button type="button" class="tgt" data-prop="--g-violet">Violett</button>
                <button type="button" class="tgt" data-prop="--g-teal">Türkis</button>
                <button type="button" class="tgt" data-prop="--g-pink">Pink</button>
            </div>
            <span class="grp">Material</span>
            <div class="chips">
                <button type="button" class="tgt" data-prop="--g-mat" data-label="Zusatzmaterial-Rand" title="Zusatzmaterial-Rand">Rand</button>
                <!-- Doc: "sieht nicht gut aus ... auf den HG für Zusatz-Pillen" - own target -->
                <button type="button" class="tgt" data-prop="--g-matbg" data-label="Zusatzmaterial-HG" title="Zusatzmaterial-Hintergrund">Hintergrund</button>
            </div>
            <span class="grp">Grundfarben</span>
            <div class="chips">
                <button type="button" class="tgt" data-prop="--text">Schrift</button>
                <button type="button" class="tgt" data-prop="--head">Überschriften</button>
                <button type="button" class="tgt" data-prop="--bg">Grund</button>
                <button type="button" class="tgt" data-prop="--g-btn" data-label="Knopf-HG" title="Knopf-Hintergrund">Knopf</button>
            </div>
            <!-- Doc: "wo kommen die Farben her?" - the timetable kept its own
                 subject colours (--tt-* in svp.css), now pickable too -->
            <span class="grp">Stundenplan</span>
            <div class="chips">
                <button type="button" class="tgt" data-prop="--tt-inf" data-label="Stundenplan Inf">Inf</button>
                <button type="button" class="tgt" data-prop="--tt-mat" data-label="Stundenplan Mat">Mat</button>
                <button type="button" class="tgt" data-prop="--tt-gk" data-label="Stundenplan GK Inf">GK Inf</button>
                <button type="button" class="tgt" data-prop="--tt-violet" data-label="Stundenplan Violett" title="andere Fächer, z. B. IA">Violett</button>
                <button type="button" class="tgt" data-prop="--tt-teal" data-label="Stundenplan Türkis" title="andere Fächer">Türkis</button>
                <button type="button" class="tgt" data-prop="--tt-pink" data-label="Stundenplan Pink" title="andere Fächer">Pink</button>
            </div>
        </div>
        <div class="tools">
            <!-- Doc: "gib mir noch einen Slider für die 2 Transp" - edge and middle
                 alpha of the week row / holiday band, shown for those two targets -->
            <div class="alphas off" id="alphas">
                <label for="a-edge">Rand</label>
                <input type="range" id="a-edge" min="0" max="1" step="0.01" value="0.4">
                <output id="a-edge-v" for="a-edge">0.40</output>
                <label for="a-mid">Mitte</label>
                <input type="range" id="a-mid" min="0" max="1" step="0.01" value="0.2">
                <output id="a-mid-v" for="a-mid">0.20</output>
            </div>
            <!-- Doc: "Kopieren links neben Zurück-Pille" -->
            <div class="acts">
                <button type="button" class="tgt copy-btn" id="copy">Kopieren</button>
                <button type="button" class="tgt reset" id="reset">Zurücksetzen</button>
            </div>
        </div>
        <!-- Doc: "weg" - the chips carry the colours, "Kopieren" the list -->
        <div class="summary" id="summary" hidden>Ziel wählen, dann Farbe anklicken: der offene Plan färbt sich sofort um.</div>
    </div>

    <div class="scroll">
        <table id="grid">
            <thead><tr><th></th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
(function () {
    const SHADES = [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950];
    const P = {
        slate: 'f8fafc f1f5f9 e2e8f0 cbd5e1 94a3b8 64748b 475569 334155 1e293b 0f172a 020617',
        gray: 'f9fafb f3f4f6 e5e7eb d1d5db 9ca3af 6b7280 4b5563 374151 1f2937 111827 030712',
        zinc: 'fafafa f4f4f5 e4e4e7 d4d4d8 a1a1aa 71717a 52525b 3f3f46 27272a 18181b 09090b',
        neutral: 'fafafa f5f5f5 e5e5e5 d4d4d4 a3a3a3 737373 525252 404040 262626 171717 0a0a0a',
        stone: 'fafaf9 f5f5f4 e7e5e4 d6d3d1 a8a29e 78716c 57534e 44403c 292524 1c1917 0c0a09',
        red: 'fef2f2 fee2e2 fecaca fca5a5 f87171 ef4444 dc2626 b91c1c 991b1b 7f1d1d 450a0a',
        orange: 'fff7ed ffedd5 fed7aa fdba74 fb923c f97316 ea580c c2410c 9a3412 7c2d12 431407',
        amber: 'fffbeb fef3c7 fde68a fcd34d fbbf24 f59e0b d97706 b45309 92400e 78350f 451a03',
        yellow: 'fefce8 fef9c3 fef08a fde047 facc15 eab308 ca8a04 a16207 854d0e 713f12 422006',
        lime: 'f7fee7 ecfccb d9f99d bef264 a3e635 84cc16 65a30d 4d7c0f 3f6212 365314 1a2e05',
        green: 'f0fdf4 dcfce7 bbf7d0 86efac 4ade80 22c55e 16a34a 15803d 166534 14532d 052e16',
        emerald: 'ecfdf5 d1fae5 a7f3d0 6ee7b7 34d399 10b981 059669 047857 065f46 064e3b 022c22',
        teal: 'f0fdfa ccfbf1 99f6e4 5eead4 2dd4bf 14b8a6 0d9488 0f766e 115e59 134e4a 042f2e',
        cyan: 'ecfeff cffafe a5f3fc 67e8f9 22d3ee 06b6d4 0891b2 0e7490 155e75 164e63 083344',
        sky: 'f0f9ff e0f2fe bae6fd 7dd3fc 38bdf8 0ea5e9 0284c7 0369a1 075985 0c4a6e 082f49',
        blue: 'eff6ff dbeafe bfdbfe 93c5fd 60a5fa 3b82f6 2563eb 1d4ed8 1e40af 1e3a8a 172554',
        indigo: 'eef2ff e0e7ff c7d2fe a5b4fc 818cf8 6366f1 4f46e5 4338ca 3730a3 312e81 1e1b4b',
        violet: 'f5f3ff ede9fe ddd6fe c4b5fd a78bfa 8b5cf6 7c3aed 6d28d9 5b21b6 4c1d95 2e1065',
        purple: 'faf5ff f3e8ff e9d5ff d8b4fe c084fc a855f7 9333ea 7e22ce 6b21a8 581c87 3b0764',
        fuchsia: 'fdf4ff fae8ff f5d0fe f0abfc e879f9 d946ef c026d3 a21caf 86198f 701a75 4a044e',
        pink: 'fdf2f8 fce7f3 fbcfe8 f9a8d4 f472b6 ec4899 db2777 be185d 9d174d 831843 500724',
        rose: 'fff1f2 ffe4e6 fecdd3 fda4af fb7185 f43f5e e11d48 be123c 9f1239 881337 4c0519'
    };
    // what the SVP grey scheme uses right now
    // no W / F / P marks any more (Doc: "P & Co raus") - the target chips show the colours
    const USED = {};

    const rgbOf = (hex) => [0, 2, 4].map(i => parseInt(hex.substr(i, 2), 16));
    const table = document.getElementById('grid');
    const headRow = table.tHead.rows[0];
    SHADES.forEach(s => { const th = document.createElement('th'); th.textContent = s; headRow.appendChild(th); });

    const root = document.documentElement.style;
    const nameEl = document.getElementById('pv-name');
    const valEl = document.getElementById('pv-val');
    let current = 'rgb(244, 114, 182)';
    let selBtn = null;

    function pick(btn) {
        const [r, g, b] = btn.dataset.rgb.split(',').map(Number);
        root.setProperty('--pick', r + ', ' + g + ', ' + b);
        current = 'rgb(' + r + ', ' + g + ', ' + b + ')';
        nameEl.textContent = btn.dataset.name;
        valEl.textContent = current + ' · #' + btn.dataset.hex;
        if (selBtn) selBtn.classList.remove('sel');
        selBtn = btn; btn.classList.add('sel');
        document.getElementById('copied').hidden = true;
    }

    const tbody = table.tBodies[0];
    Object.keys(P).forEach(fam => {
        const tr = document.createElement('tr');
        const th = document.createElement('th');
        th.scope = 'row'; th.textContent = fam;
        tr.appendChild(th);
        P[fam].split(' ').forEach((hex, i) => {
            const name = fam + '-' + SHADES[i];
            const rgb = rgbOf(hex);
            const td = document.createElement('td');
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'sw' + (USED[name] ? ' used' : '');
            btn.style.background = '#' + hex;
            btn.dataset.rgb = rgb.join(',');
            btn.dataset.hex = hex;
            btn.dataset.name = name;
            if (USED[name]) btn.dataset.use = USED[name];
            btn.title = name + ' · rgb(' + rgb.join(', ') + ')';
            btn.setAttribute('aria-label', btn.title);
            btn.addEventListener('click', () => { pick(btn); send(btn); });
            td.appendChild(btn);
            tr.appendChild(td);
            if (name === 'pink-400') selBtn = btn;
        });
        tbody.appendChild(tr);
    });
    if (selBtn) pick(selBtn);

    // ---- live link to open plans (Doc, 19.09.2026: "gib mir die col table als
    // Extra Fenster connected, so dass ich probieren kann"). Same origin only:
    // on localhost:8765 the plan's svp-nav.js listens on "svp-colors" and sets
    // the variable on its <html>; elsewhere (the artifact copy) nothing listens.
    let channel = null;
    try { channel = new BroadcastChannel('svp-colors'); } catch (e) { }
    const targets = [...document.querySelectorAll('#targets .tgt[data-prop]')];
    // the stored name of a chip: its old full label where the text got shorter
    const labelOf = t => t.dataset.label || t.textContent;
    let target = targets[0];
    /* label -> { name, rgb, mark, msgs: [[prop, value], ...] }. Kept in
       localStorage (Doc pasted a lone "pink-400" - a reload had emptied the
       list), and re-sent whenever a plan (re)loads and says "hello". */
    const STORE = 'svp-color-trial';
    /* one list per scheme of the plan (Doc: "link pick zum Schema") */
    const SCHEME_NAME = { grey: 'Grau', light: 'Hell', dark: 'Dunkel' };
    let scheme = 'grey';
    let chosenAll = {};
    try { chosenAll = JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { chosenAll = {}; }
    if (!chosenAll.grey && !chosenAll.light && !chosenAll.dark) chosenAll = { grey: chosenAll };  // old flat list
    ['grey', 'light', 'dark'].forEach(k => { chosenAll[k] = chosenAll[k] || {}; });
    let chosen = chosenAll[scheme];
    const summary = document.getElementById('summary');

    targets.forEach(t => t.addEventListener('click', () => {
        target.classList.remove('on');
        target = t; t.classList.add('on');
        markCurrent();
        showAlpha();
    }));

    /* Doc: "unten hervorheben" - the grid rings the swatch the chosen target
       has right now, so one sees where it sits before picking another. */
    function markCurrent() {
        const c = currentTriple(target);
        const sw = c && document.querySelector('.sw[data-rgb="' + c.join(',') + '"]');
        if (sw) { pick(sw); return; }
        /* Doc: "die immer in der sel col" - the preview rows show the chosen
           target's colour, also when it is no Tailwind shade (Grund, Karten) */
        if (selBtn) selBtn.classList.remove('sel');
        selBtn = null;
        if (c) root.setProperty('--pick', c.join(', '));
    }

    function moveMark(mark, btn) {
        document.querySelectorAll('.sw[data-use="' + mark + '"]').forEach(s => {
            s.classList.remove('used'); delete s.dataset.use;
        });
        btn.classList.add('used'); btn.dataset.use = mark;
    }

    // live: a real click here - only that may switch the plan to grey
    function post(msgs) {
        if (channel) msgs.forEach(m => channel.postMessage({ type: 'set', scheme: scheme, prop: m[0], value: m[1] }));
    }

    function render() {
        const keys = Object.keys(chosen);
        if (!keys.length) {
            summary.textContent = 'Ziel wählen, dann Farbe anklicken: der offene Plan färbt sich sofort um.';
            return;
        }
        summary.innerHTML = keys.map(k => k + ': <b>' + chosen[k].name + '</b>').join(' · ');
        keys.forEach(k => {
            const c = chosen[k];
            const sw = c.mark && document.querySelector('.sw[data-name="' + c.name + '"]');
            if (sw) moveMark(c.mark, sw);
        });
    }

    function save() {
        chosenAll[scheme] = chosen;
        try { localStorage.setItem(STORE, JSON.stringify(chosenAll)); } catch (e) { }
    }

    function send(btn) {
        const prop = target.dataset.prop;
        const triple = btn.dataset.rgb.split(',').join(', ');
        // the --g-* / --tt-* accents are r, g, b triples; the page tokens are full colours
        const msgs = [[prop, /^--(g|tt)-/.test(prop) ? triple : 'rgb(' + triple + ')']];
        /* Doc: "alle Schrift wird bei Schrift nicht geändert" - body text is
           three tokens in the plan: --text, the dimmed --muted (SW, KW,
           dates, Ustd.) and --tint-text (bullets, material pills). */
        // grey paints the pill ground solid (--g-matbg); Hell/Dunkel mix 7 % of --mat-hg
        if (prop === '--g-matbg') msgs.push(['--mat-hg', 'rgb(' + triple + ')']);
        if (prop === '--text') {
            msgs.push(['--muted', 'rgba(' + triple + ', 0.62)'], ['--tint-text', triple]);
        }
        post(msgs);
        chosen[labelOf(target)] = { name: btn.dataset.name, rgb: 'rgb(' + triple + ')',
            mark: target.dataset.mark || '', msgs: msgs };
        save();
        render();
        paintChips();
    }

    // a plan that (re)loads asks for the current trial
    /* the whole set as the open plan shows it (asked for on load and on every
       "hello"), so "Kopieren" can list every colour, not only the trials */
    let planValues = null;
    const askPlan = () => {
        if (channel) channel.postMessage({ type: 'get', props: targets.map(t => t.dataset.prop).concat(['--muted', '--card', '--a-week-edge', '--a-week-mid', '--a-ferien-edge', '--a-ferien-mid']) });
    };
    function useScheme(sc) {
        if (!SCHEME_NAME[sc] || sc === scheme) return;
        scheme = sc;
        chosen = chosenAll[scheme];
        render();
    }
    // ---- the two alphas of the week row / holiday band ----
    const alphas = document.getElementById('alphas');
    const KIND = { edge: 'Rand', mid: 'Mitte' };
    const alphaLabel = (t, kind) => labelOf(t) + ' · ' + KIND[kind];
    function alphaOf(t, kind) {
        const c = chosen[alphaLabel(t, kind)];
        const v = c ? c.rgb : planValues && planValues['--a-' + t.dataset.alpha + '-' + kind];
        const n = parseFloat(v);
        return isNaN(n) ? null : n;
    }
    function showAlpha() {
        const w = target.dataset.alpha;
        alphas.classList.toggle('off', !w);
        alphas.querySelectorAll('input').forEach(i => { i.disabled = !w; });
        if (!w) { root.removeProperty('--pe'); root.removeProperty('--pm'); return; }
        ['edge', 'mid'].forEach(kind => {
            const v = alphaOf(target, kind);
            if (v === null) return;
            document.getElementById('a-' + kind).value = v;
            document.getElementById('a-' + kind + '-v').textContent = v.toFixed(2);
            root.setProperty(kind === 'edge' ? '--pe' : '--pm', v);
        });
    }
    ['edge', 'mid'].forEach(kind => {
        document.getElementById('a-' + kind).addEventListener('input', e => {
            const w = target.dataset.alpha;
            if (!w) return;
            const v = (+e.target.value).toFixed(2);
            const msgs = [['--a-' + w + '-' + kind, v]];
            post(msgs);
            chosen[alphaLabel(target, kind)] = { name: 'Deckkraft', rgb: v, mark: '', msgs: msgs };
            save();
            document.getElementById('a-' + kind + '-v').textContent = v;
            root.setProperty(kind === 'edge' ? '--pe' : '--pm', v);
        });
    });

    // the picker takes the plan's ground, card and text, so a Hell plan gets a light picker
    function wearPlan(v) {
        ['--bg', '--card', '--text', '--muted'].forEach(p => { if (v[p]) root.setProperty(p, v[p]); });
        document.documentElement.style.colorScheme = scheme === 'light' ? 'light' : 'dark';
    }
    if (channel) channel.onmessage = e => {
        const d = e.data || {};
        if (d.type === 'hello') {
            ['grey', 'light', 'dark'].forEach(sc => Object.keys(chosenAll[sc]).forEach(k =>
                chosenAll[sc][k].msgs.forEach(m => channel.postMessage({ type: 'set', scheme: sc, prop: m[0], value: m[1] }))));
            useScheme(d.scheme);
            askPlan();
        }
        if (d.type === 'scheme') { useScheme(d.scheme); askPlan(); }
        if (d.type === 'values') { useScheme(d.scheme); planValues = d.values; wearPlan(d.values); paintChips(); showAlpha(); }
    };
    askPlan();

    // current colour of a target: the running trial, else what the plan shows
    function currentTriple(t) {
        const c = chosen[labelOf(t)];
        let v = c ? c.rgb : (planValues && planValues[t.dataset.prop]) || '';
        const m = v.match(/(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
        return m ? [+m[1], +m[2], +m[3]] : null;
    }
    function paintChips() {
        targets.forEach(t => {
            const c = currentTriple(t);
            if (!c) { t.style.removeProperty('--c'); t.classList.remove('dark-c'); return; }
            t.style.setProperty('--c', c.join(', '));
            // light text on a dark fill (Grund, Karten)
            t.classList.toggle('dark-c', 0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2] < 110);
        });
        markCurrent();
    }
    render();
    if (channel) ['grey', 'light', 'dark'].forEach(sc => Object.keys(chosenAll[sc]).forEach(k =>
        chosenAll[sc][k].msgs.forEach(m => channel.postMessage({ type: 'set', scheme: sc, prop: m[0], value: m[1] }))));

    document.getElementById('reset').addEventListener('click', () => {
        if (channel) channel.postMessage({ type: 'reset', scheme: scheme });
        chosen = {};
        save();
        askPlan();                            // the plan is back on svp.css - repaint from it
        summary.textContent = 'Zurückgesetzt: der Plan zeigt wieder die Farben aus svp.css.';
    });

    document.getElementById('copy').addEventListener('click', () => {
        // the pill itself confirms - the old "kopiert" label sat in the header
        const btn = document.getElementById('copy');
        const done = () => { btn.textContent = 'Kopiert ✓'; setTimeout(() => { btn.textContent = 'Kopieren'; }, 1500); };
        /* Doc: "Lass den Kopier-Button alles kopieren, so dass ich es Dir
           reichen kann" - every trial choice with name and value, one per
           line; without any choice yet, the picked colour alone. */
        // Tailwind name for a value, if it is one exactly
        const byRgb = {};
        document.querySelectorAll('.sw').forEach(s => { byRgb[s.dataset.rgb.replace(/\s/g, '')] = s.dataset.name; });
        const lines = targets.map(t => {
            const label = labelOf(t);
            if (chosen[label]) return label + ': ' + chosen[label].name + ' = ' + chosen[label].rgb + '  (Probe)';
            let v = planValues && planValues[t.dataset.prop];
            if (!v) return label + ': Standard';   // e.g. Zusatzmaterial-HG: mixed from the pill's text colour
            if (!/^rgb/.test(v)) v = 'rgb(' + v + ')';
            const key = (v.match(/\d+\s*,\s*\d+\s*,\s*\d+/) || [''])[0].replace(/\s/g, '');
            return label + ': ' + (byRgb[key] || 'eigener Wert') + ' = ' + v;
        });
        targets.filter(t => t.dataset.alpha).forEach(t => ['edge', 'mid'].forEach(kind => {
            const v = alphaOf(t, kind);
            lines.push(alphaLabel(t, kind) + ': Deckkraft ' + (v === null ? '?' : v.toFixed(2)) +
                (chosen[alphaLabel(t, kind)] ? '  (Probe)' : ''));
        }));
        const text = 'Farbwähler, ' + SCHEME_NAME[scheme] + '-Schema' + (planValues ? '' : ' (kein Plan verbunden - nur Proben sicher)') +
            ':\n' + lines.join('\n');
        try {
            navigator.clipboard.writeText(text).then(done, () => {});
        } catch (e) { }
    });
})();
</script>

</html>
