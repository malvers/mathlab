    <style>
        :root {
            --space-bg: #050b18;
            --neon-blue: #00d2ff;
            --neon-pink: #ff00ff;
            --neon-purple: #9d50bb;
            --neon-green: #adff2f;
            --neon-orange: #ff8c00;
            --glass: rgba(15, 23, 42, 0.6);
            --border: rgba(255, 255, 255, 0.1);
        }

        /* Hub: never stack a second floating title branding (this page has its own header). */
        body.cyber-hub .canvas-branding {
            display: none !important;
        }

        html {
            background-color: var(--space-bg);
            height: 100%;
            scrollbar-width: thin;
            scrollbar-color: rgba(72, 88, 112, 0.95) rgba(38, 46, 64, 0.88);
        }

        html::-webkit-scrollbar {
            width: 11px;
            height: 11px;
        }

        html::-webkit-scrollbar-track {
            background: rgba(40, 48, 68, 0.72);
            border-radius: 999px;
            margin: 6px 0;
        }

        html::-webkit-scrollbar-thumb {
            background: linear-gradient(
                180deg,
                rgba(78, 92, 118, 0.95) 0%,
                rgba(52, 64, 86, 0.92) 100%
            );
            border-radius: 999px;
            border: 2px solid rgba(34, 42, 58, 0.85);
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.35);
        }

        html::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(
                180deg,
                rgba(92, 108, 134, 0.98) 0%,
                rgba(68, 82, 108, 0.95) 100%
            );
            box-shadow: 0 0 10px rgba(100, 118, 145, 0.22);
        }

        html::-webkit-scrollbar-corner {
            background: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            color: white;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        #bg-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            opacity: 0.72;
            pointer-events: none;
        }

        /* --- BACKGROUND EFFECTS --- */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 30%, rgba(0, 210, 255, 0.02) 0%, transparent 45%),
                radial-gradient(circle at 80% 70%, rgba(157, 80, 187, 0.02) 0%, transparent 45%);
            z-index: 1;
            pointer-events: none;
        }

        header,
        .search-scan-row,
        #sidebar-header,
        .launcher-grid,
        footer {
            position: relative;
            z-index: 2;
        }

        header {
            width: 100%;
            padding: 22px 0 10px;
            text-align: center;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.12), transparent);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.8rem;
            margin: 0;
            letter-spacing: 5px;
            background: linear-gradient(to right, var(--neon-blue), #fff, var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            filter: drop-shadow(0 0 15px rgba(0, 210, 255, 0.4));
        }

        .subtitle {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 12px;
            color: var(--neon-blue);
            margin-top: 10px;
            opacity: 0.8;
            text-shadow: 0 0 10px var(--neon-blue);
        }

        .launcher-grid {
            width: 100%;
            max-width: none;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px; /* Enough room to avoid clash */
            padding: 20px 0 28px;
            margin-left: 0; /* Left-aligned */
            flex: 1 0 auto;
        }

        /* --- THE WIDE FLAT BUTTON --- */
        .tool-button {
            display: flex;
            align-items: center;
            padding: 6px 20px;
            /* Extreme Low-Profile Padding */
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 8px;
            /* Slightly sharper for a flat look */
            text-decoration: none;
            color: white;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease-out;
            backdrop-filter: blur(20px);
            min-height: 52px; /* Euler default row height */
            box-sizing: border-box;
        }

        .tool-button::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: var(--accent-color, var(--neon-blue));
            transition: width 0.3s ease;
        }

        .tool-button:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent-color, var(--neon-blue));
        }

        .tool-button:hover::before {
            width: 10px;
        }

        .tool-icon {
            font-size: 1.2rem;
            margin-right: 20px;
            width: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.1));
            transition: transform 0.3s ease;
        }

        .tool-icon svg {
            width: 24px !important;
            height: 24px !important;
            opacity: 0.9;
        }

        .tool-button:hover .tool-icon {
            transform: scale(1.15) rotate(-3deg);
        }

        .tool-info {
            flex-grow: 1;
        }

        .tool-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            /* Ultra-compact font */
            letter-spacing: 1.5px;
            margin-bottom: 0px;
            transition: color 0.3s ease;
            text-transform: uppercase;
        }

        .tool-button:hover .tool-name {
            color: #fff;
            text-shadow: 0 0 10px var(--accent-color, var(--neon-blue));
        }

        .tool-tagline {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 300;
            letter-spacing: 1px;
        }

        .external-icon {
            opacity: 0.3;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            transform: translateX(-10px);
            color: var(--accent-color, var(--neon-blue));
        }

        .tool-button:hover .external-icon {
            opacity: 1;
            transform: translateX(0);
        }

        /* --- ACCENT COLORS --- */
        .color-blue {
            --accent-color: #00d2ff;
            --accent-color-glow: rgba(0, 210, 255, 0.3);
        }

        .color-purple {
            --accent-color: #ff00ff;
            --accent-color-glow: rgba(255, 0, 255, 0.3);
        }

        .color-green {
            --accent-color: #adff2f;
            --accent-color-glow: rgba(173, 255, 47, 0.3);
        }

        .color-orange {
            --accent-color: #ff8c00;
            --accent-color-glow: rgba(255, 140, 0, 0.3);
        }

        .color-gold {
            --accent-color: #ffd700;
            --accent-color-glow: rgba(255, 215, 0, 0.3);
        }

        /* Fractals only: no loud accent chrome (was confused with Universe) */
        .tool-button.tool-button--mute-chrome {
            border-color: var(--border);
        }
        .tool-button.tool-button--mute-chrome::before {
            background: rgba(226, 232, 240, 0.35);
        }
        .tool-button.tool-button--mute-chrome:hover {
            border-color: rgba(255, 255, 255, 0.16);
            background: rgba(255, 255, 255, 0.06);
        }
        .tool-button.tool-button--mute-chrome:hover::before {
            width: 5px;
        }
        .tool-button.tool-button--mute-chrome:hover .tool-name {
            text-shadow: none;
        }
        .tool-button.tool-button--mute-chrome:hover .external-icon {
            color: rgba(255, 255, 255, 0.55);
        }

        footer {
            margin-top: auto;
            width: 100%;
            box-sizing: border-box;
            padding: 24px 16px max(28px, env(safe-area-inset-bottom, 0px));
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            opacity: 0.72;
            letter-spacing: 2px;
            flex-shrink: 0;
            color: rgba(245, 243, 255, 0.88);
        }

        footer a {
            color: inherit;
            text-decoration: none;
            margin-left: 15px;
            transition: color 0.3s, opacity 0.3s;
        }

        footer a:hover {
            color: var(--neon-blue);
            opacity: 1;
        }

        @media (max-width: 600px) {
            .tool-button {
                padding: 15px 20px;
            }

            .tool-icon {
                margin-right: 15px;
                font-size: 1.8rem;
                width: 45px;
            }

            .tool-name {
                font-size: 1rem;
            }

            .tool-tagline {
                font-size: 0.8rem;
            }
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 100px 0;
            font-family: 'Orbitron', sans-serif;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        /*
         * Lab scan + Universe galaxy — same outer size as index.html (#tool-view / topic grid)
         */
        .search-scan-row {
            width: min(1123px, calc(100vw - 24px));
            max-width: 1123px;
            margin-left: auto;
            margin-right: auto;
            margin-top: 20px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 14px;
            position: relative;
            z-index: 100;
            box-sizing: border-box;
        }

        .search-scan-row #search-mount {
            flex: 1;
            min-width: 0;
        }

        .universe-galaxy-btn {
            box-sizing: border-box;
            flex: 0 0 auto;
            width: clamp(42px, 7.5vw, 68px);
            position: relative;
            overflow: hidden;
            align-self: center;
            height: 56px;
            border-radius: 12px;
            border: 1px solid rgba(0, 210, 255, 0.55);
            box-shadow:
                0 8px 26px rgba(0, 0, 0, 0.38),
                0 0 18px rgba(0, 210, 255, 0.14);
            transition: box-shadow 0.22s ease, border-color 0.22s ease;
            padding: 0;
            background: #070d18;
            cursor: pointer;
            display: block;
            text-decoration: none;
            line-height: 0;
        }

        .universe-galaxy-btn:hover {
            border-color: rgba(0, 210, 255, 0.9);
            box-shadow:
                0 0 28px rgba(0, 210, 255, 0.35),
                0 10px 32px rgba(0, 0, 0, 0.45);
        }

        .universe-galaxy-btn:focus-visible {
            outline: 2px solid var(--neon-blue);
            outline-offset: 3px;
        }

        .universe-galaxy-btn img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }

        @media (max-width: 520px) {
            .search-scan-row {
                gap: 10px;
            }

            .universe-galaxy-btn {
                width: clamp(36px, 14vw, 56px);
            }
        }

        /* No tool taglines on this page; no ? briefing here */
        .cyber-nav .nav-btn[title="Beschreibung anzeigen"] {
            display: none !important;
        }

        .tool-info .tool-tagline {
            display: none;
        }

        /* Shared column acts as “panel”; close sits in the top-right */
        .tools-panel {
            position: relative;
            width: min(1123px, calc(100vw - 24px));
            max-width: 1123px;
            margin: 0 auto;
            z-index: 2;
            box-sizing: border-box;
            overflow: visible;
        }
        .tools-panel .search-scan-row,
        .tools-panel .launcher-grid {
            width: 100%;
            max-width: none;
            margin-left: 0;
            margin-right: 0;
        }
        .tools-panel .search-scan-row {
            margin-top: 20px;
            margin-bottom: 12px;
        }
        .tools-panel #sidebar-header {
            width: 100% !important;
            max-width: none !important;
        }
        .tools-panel > header:not(#sidebar-header) .header-content {
            padding-right: 12px;
            box-sizing: border-box;
        }

        .tools-hub-close {
            position: absolute;
            top: 0;
            right: 0;
            transform: translate(50%, -50%);
            z-index: 30;
            /* ~30% of the former 44px */
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(15, 23, 42, 0.82);
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            backdrop-filter: blur(10px);
            box-shadow:
                0 0 0 1px rgba(0, 210, 255, 0.35),
                0 8px 24px rgba(0, 0, 0, 0.45);
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
        }
        .tools-hub-close:hover {
            background: rgba(220, 38, 38, 0.4);
            box-shadow: 0 0 20px rgba(255, 80, 80, 0.45);
            transform: translate(50%, -50%) scale(1.08);
        }
        .tools-hub-close:focus-visible {
            outline: 2px solid var(--neon-blue);
            outline-offset: 3px;
        }
        .tools-hub-close svg {
            display: block;
            width: 8px;
            height: 8px;
        }

    </style>
</head>

    <script>
        function toggleFullscreen() {
            const doc = window.document, docEl = doc.documentElement;
            const isFs = doc.fullscreenElement || doc.webkitFullscreenElement;
            if (!isFs) {
                if (docEl.requestFullscreen) docEl.requestFullscreen();
                else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();
            } else {
                if (doc.exitFullscreen) doc.exitFullscreen();
                else if (doc.webkitExitFullscreen) doc.webkitExitFullscreen();
            }
        }
        document.addEventListener('keydown', e => {
            if (e.key && e.key.toLowerCase() === 'f' &&
                !['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName) &&
                !e.target.isContentEditable) toggleFullscreen();
        });
        function openToolsQrOverlay() {
            const url = window.location.href;
            document.getElementById('tools-qr-img').src =
                'https://api.qrserver.com/v1/create-qr-code/?size=240x240&margin=8&data=' + encodeURIComponent(url);
            document.getElementById('tools-qr-url').textContent = url;
            document.getElementById('tools-qr-overlay').classList.add('open');
        }
    </script>

        // Language: follows CyberI18n.current from i18n.js (incl. browser language). Only ?lang= in URL overrides.
        const urlParams = new URLSearchParams(window.location.search);
        const qLang = urlParams.get('lang');
        if (qLang) {
            const L = String(qLang).toLowerCase();
            if (CyberI18n && ['de', 'en', 'es', 'fr', 'it', 'pt', 'nl', 'sw', 'tr'].includes(L) && CyberI18n.translations[L]) {
                CyberI18n.current = L;
                try {
                    localStorage.setItem('cyber-lab-lang', L);
                } catch (e) {}
            }
        }

        function withLang(href) {
            if (
                typeof CyberI18n !== 'undefined' &&
                typeof CyberI18n.appendLangToRelativeHref === 'function'
            ) {
                return CyberI18n.appendLangToRelativeHref(href);
            }
            if (!href || /^https?:\/\//i.test(href)) return href;
            const L = typeof CyberI18n !== 'undefined' ? CyberI18n.current : '';
            if (!L || !['de', 'en', 'es', 'fr', 'it', 'pt', 'nl', 'sw', 'tr'].includes(L)) return href;
            return href + (href.includes('?') ? '&' : '?') + 'lang=' + encodeURIComponent(L);
        }

        function renderLauncher(filterText = "") {
            const grid = document.getElementById('launcher-grid');
            if (!grid) return;

            const searchLower = filterText.toLowerCase().trim();
            const filteredData = LABS_DATA.filter(lab => {
                const title = (lab.title || "").toLowerCase();
                const tagline = (lab.tagline || "").toLowerCase();
                const keywords = (lab.keywords || "").toLowerCase();
                return title.includes(searchLower) || 
                       tagline.includes(searchLower) || 
                       keywords.includes(searchLower);
            });

            const count = filteredData.length;
            const subtitle = document.getElementById('dynamic-subtitle');
            if (subtitle) {
                const word =
                    (typeof CyberI18n !== 'undefined' && CyberI18n.get('index.ui.tools_subtitle_word')) ||
                    'Tools';
                const safeWord = word === 'index.ui.tools_subtitle_word' ? 'Tools' : word;
                if (filterText === '') {
                    subtitle.textContent = `${count} ${safeWord}`;
                } else {
                    const hitsRaw = CyberI18n.get('index.ui.tools_filter_hits');
                    const hitsPhrase = hitsRaw === 'index.ui.tools_filter_hits' ? 'HITS FOUND' : hitsRaw;
                    subtitle.textContent = `${count} ${hitsPhrase}`;
                }
            }

            if (count === 0) {
                const nrRaw = CyberI18n.get('index.ui.tools_no_results', { query: filterText });
                const noRes = nrRaw === 'index.ui.tools_no_results'
                    ? `No matches for “${filterText}”`
                    : nrRaw;
                grid.innerHTML = `<div class="no-results">${noRes}</div>`;
                return 0;
            }

            // Separate Intro from the rest to keep it at top (Priority 1)
            const intro = filteredData.find(lab => lab.id === 'cinematic-intro');
            const otherLabs = filteredData.filter(lab => lab.id !== 'cinematic-intro')
                                          .sort((a, b) => {
                                              const titleA = CyberI18n.getOr('index.labs.' + a.id + '.title', a.title || "");
                                              const titleB = CyberI18n.getOr('index.labs.' + b.id + '.title', b.title || "");
                                              return titleA.localeCompare(titleB, CyberI18n.current || undefined, {
                                                  sensitivity: 'base'
                                              });
                                          });
            
            const sortedLabs = intro ? [intro, ...otherLabs] : otherLabs;

            grid.innerHTML = sortedLabs.map(lab => {
                const muteChrome = lab.id === 'mandelbrot-deep' ? ' tool-button--mute-chrome' : '';
                const locTitle = CyberI18n.getOr('index.labs.' + lab.id + '.title', lab.title);
                const toolHref = withLang(lab.href);
                return `
                <a href="${toolHref}" target="_blank" class="tool-button color-${lab.color || 'blue'}${muteChrome}">
                    <div class="tool-icon">${lab.icon}</div>
                    <div class="tool-info">
                        <div class="tool-name">${locTitle}</div>
                    </div>
                    <div class="external-icon">↗</div>
                </a>
            `;
            }).join('');

            return count;
        }

        // Initialize launcher and UI
        CyberUI.init();
        
        const searchHint = CyberI18n.getOr('index.ui.search_placeholder', 'START LAB SCAN…');
        CyberUI.createSearch('search-mount', searchHint, (val) => {
            renderLauncher(val);
        });

        (function syncUniverseGalaxyBtnHeight() {
            const btn = document.querySelector('.search-scan-row .universe-galaxy-btn');
            function sync() {
                const inp = document.querySelector('#search-mount .search-input');
                const wrap = document.querySelector('#search-mount .search-container');
                if (!inp || !btn) return;
                const hInp = inp.getBoundingClientRect().height;
                const hWrap = wrap ? wrap.getBoundingClientRect().height : 0;
                const base = Math.max(hInp, hWrap);
                const px = Math.ceil(base) + 2;
                btn.style.height = Math.max(36, px) + 'px';
            }
            sync();
            requestAnimationFrame(sync);
            window.addEventListener('resize', () => requestAnimationFrame(sync));
            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(() => requestAnimationFrame(sync));
            }
            if (typeof ResizeObserver !== 'undefined') {
                const ro = new ResizeObserver(() => sync());
                const inp = document.querySelector('#search-mount .search-input');
                const wrap = document.querySelector('#search-mount .search-container');
                if (inp) ro.observe(inp);
                if (wrap) ro.observe(wrap);
            }
        })();

        const toolCount = renderLauncher();

        // Ensure background video actually plays across browsers.
        const bgVid = document.getElementById('bg-video');
        if (bgVid) {
            bgVid.playbackRate = 0.5;
            const tryPlay = () => bgVid.play().catch(() => {});
            tryPlay();
            window.addEventListener('pointerdown', tryPlay, { once: true });
        }

        const mainTitleText =
            typeof CyberI18n !== 'undefined' && typeof CyberI18n.getBrandMastheadTitle === 'function'
                ? CyberI18n.getBrandMastheadTitle()
                : 'Doc Alvers Mathe-Labor';
        const docTitleRaw = CyberI18n.get('index.ui.tools_doc_title');
        const docTitle =
            docTitleRaw === 'index.ui.tools_doc_title' ? mainTitleText : docTitleRaw;
        const toolsWord =
            (typeof CyberI18n !== 'undefined' && CyberI18n.get('index.ui.tools_subtitle_word')) || 'Tools';
        const subtitleText =
            `${toolCount} ${toolsWord === 'index.ui.tools_subtitle_word' ? 'Tools' : toolsWord}`;

        const mainTitleEl = document.getElementById('main-title');
        if (mainTitleEl) mainTitleEl.textContent = mainTitleText;
        document.title = docTitle;
        const closeEl = document.getElementById('tools-hub-close');
        if (closeEl) {
            closeEl.href = withLang('index.html');
            closeEl.title = CyberI18n.getOr('index.view.back_title', 'Back');
            const closeAria = CyberI18n.get('index.ui.tools_close_aria');
            if (closeAria !== 'index.ui.tools_close_aria') closeEl.setAttribute('aria-label', closeAria);
        }
        const universeBtn = document.getElementById('universe-btn');
        if (universeBtn) {
            universeBtn.href = withLang('universe.html');
            universeBtn.title = CyberI18n.getOr('index.ui.universe_tip', 'Universe');
            const uAria = CyberI18n.get('index.ui.tools_universe_aria');
            if (uAria !== 'index.ui.tools_universe_aria') universeBtn.setAttribute('aria-label', uAria);
        }
        const footEl = document.getElementById('tools-footer');
        if (footEl) {
            const fAria = CyberI18n.get('index.ui.tools_footer_aria');
            if (fAria !== 'index.ui.tools_footer_aria') footEl.setAttribute('aria-label', fAria);
        }

        CyberBranding.init({
            title: mainTitleText,
            subtitle: subtitleText,
            useExternalStyles: true,
            skipCanvasBranding: true
        });

        const fc = document.getElementById('footer-credits');
        const fi = document.getElementById('footer-impressum');
        if (fc) {
            fc.textContent = CyberI18n.getOr('index.ui.credits', 'CREDITS');
            fc.href = withLang('credits.html');
        }
        if (fi) {
            fi.textContent = CyberI18n.getOr('index.ui.impressum', 'IMPRESSUM');
            fi.href = withLang('impressum.html');
        }

        document.addEventListener('keydown', (e) => {
            if (e.code !== 'Escape') return;
            const t = e.target;
            if (t && t.closest && t.closest('input, textarea, select, [contenteditable="true"]')) return;
            e.preventDefault();
            window.location.href = withLang('index.html');
        });
    </script>
</body>

</html>
