<!doctype html>
<!-- Live tour "Die ganze Klasse im Blick": the film's story, played in the real pages - pause with space,
     comment with Enter (js/cyber-tour.js). Left the teacher's svp/leistungstest.html, right the pupil's
     test in a phone; eight more pupils work unseen (t.addFrame). Needs its server:
         python3 tools/tourkritik.py mission-control   ->   http://127.0.0.1:8769/tours/mission-control.html
     The Drehbuch is mission-control.js next to this page. -->
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Die ganze Klasse im Blick — Live-Tour</title>
    <link rel="icon" type="image/svg+xml" href="../resources/favicon.svg">

    <link rel="stylesheet" href="../js/cyber-tour.css">
</head>
<body>
    <div class="tour-stage">
        <div class="tour-col grow">
            <div class="tour-label">Lehrkraft · Mission Control</div>

                <iframe name="teacher" title="Lehrer-Seite" data-width="1140" src="about:blank"></iframe>
                <iframe name="teacher2" class="tour-over" title="Live-Auswertung" data-width="1140" src="about:blank"></iframe>
            </div>
        </div>
        <div class="tour-col phone">
            <div class="tour-label">Schülerin oder Schüler</div>
            <div class="tour-phone">
                <div class="tour-screen">
                    <div class="off tour-scan">
                        <!-- whose test it is, before the camera sees the slip (Doc, 19.09.2026: "oben drüber das Logo
                             von der IBB ... oben drüber Leistungstest 9a Informatik"). No white plate ("auf weißem Grund
                             ist Mist"): mission-control.js puts the logo in as inline SVG, the CSS lights its grey letters. -->

                        <div class="what"><b>Leistungstest</b><span>Informatik · Klasse GENII</span></div>

                            <b></b>
                        </div>
                        <div class="lbl">QR-Code scannen</div>
                    </div>
                    <iframe name="pupil" title="Test" data-width="390" data-device data-timers="15000:3000" src="about:blank"></iframe>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/kritik-recorder.js"></script>
    <script src="../js/cyber-tour.js"></script>
    <script src="mission-control.js"></script>
