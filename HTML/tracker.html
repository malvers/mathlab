<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOC ALVERS MATHE-LABORE | GPS Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="resources/favicon.png">
    <!-- Leaflet (map library) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <!-- Reusable fixed-slot clock (shared component) — keeps the timer from jittering -->
    <link rel="stylesheet" href="js/cyber-clock.css">
    <style>
        /* ---- Standalone full-screen shell (same pattern as glocken — no cyber grid,
                so there is no left margin / blue rand bleeding through) ---- */
        :root {
            --bg: rgb(8, 20, 42);
            --bg-light: rgb(14, 36, 78);
            --orange: rgb(245, 194, 66);
            --red: rgb(176, 36, 24);
            --green: rgb(121, 158, 49);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: manipulation;
        }

        /* ---- Map fills the whole viewport ---- */
        #map {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        .leaflet-container {
            background: var(--bg-light);
            /* let Leaflet fully own touch gestures (pinch-zoom / pan) even with user-scalable=no */
            touch-action: none;
        }

        /* Red position dot — hidden during the move, fades in once we are on the position */
        path.pos-marker {
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        path.pos-marker.pos-shown {
            opacity: 1;
        }

        /* ---- Top HUD: timer + stats ---- */
        #hud-top {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 500;
            padding: 14px 16px 30px;
            padding-top: max(14px, env(safe-area-inset-top));
            background: linear-gradient(180deg,
                    rgba(8, 20, 42, 0.95) 0%,
                    rgba(8, 20, 42, 0.92) 62%,
                    rgba(8, 20, 42, 0.72) 86%,
                    rgba(8, 20, 42, 0) 100%);
            text-align: center;
            pointer-events: none;
            /* let map drags pass through empty areas */
        }

        #gps-chip {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-size: 0.72rem;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.85);
        }

        #gps-src {
            color: rgba(255, 255, 255, 0.85);
        }

        #gps-acc {
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 1px;
            font-variant-numeric: tabular-nums;
        }

        #gps-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 8px currentColor;
            transition: background 0.3s ease, color 0.3s ease;
        }

        #gps-label {
            transition: color 0.3s ease;
        }

        /* Timer is rendered by CyberClock (fixed-width digit slots). Size it here; the
           component reads --cc-size for its slot/digit sizing. */
        #hud-time {
            --cc-size: clamp(2.2rem, 12vw, 3.6rem);
            justify-content: center;
            margin-top: clamp(6px, 2vw, 12px);
            /* small gap below the POSITION chip */
            pointer-events: auto;
            /* re-enable taps — the parent HUD is pointer-events:none */
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #hud-stats {
            display: flex;
            justify-content: center;
            gap: clamp(18px, 9vw, 56px);
            margin-top: 14px;
        }

        .hud-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hud-val {
            font-size: clamp(1.2rem, 6vw, 1.9rem);
            font-weight: 700;
            line-height: 1;
            color: var(--orange);
            font-variant-numeric: tabular-nums;
            font-feature-settings: 'tnum' 1;
        }

        .hud-lbl {
            font-size: 0.55rem;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 6px;
        }

        /* ---- Big round START / STOP ---- */
        #trk-toggle {
            position: fixed;
            bottom: max(26px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 500;
            width: clamp(96px, 30vw, 132px);
            height: clamp(96px, 30vw, 132px);
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.85);
            background: var(--green);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: clamp(1.1rem, 5vw, 1.5rem);
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            transition: background 0.2s ease, transform 0.1s ease;
        }

        #trk-toggle:active {
            transform: translateX(-50%) scale(0.96);
        }

        /* ---- Small tool buttons (bottom-left) ---- */
        #hud-tools {
            position: fixed;
            left: 14px;
            bottom: max(26px, env(safe-area-inset-bottom));
            z-index: 500;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .hud-tool {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(8, 20, 42, 0.82);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            transition: transform 0.1s ease, border-color 0.2s ease, color 0.2s ease;
        }

        .hud-tool svg {
            width: 22px;
            height: 22px;
        }

        .hud-tool:hover {
            border-color: rgba(255, 255, 255, 0.6);
        }

        .hud-tool:active {
            transform: scale(0.94);
        }

        /* Clear button hints at its destructive action */
        #trk-clear:hover {
            color: var(--red);
            border-color: var(--red);
        }

        /* ---- Radial action popup (long-press / right-click) — style from worldclock, orange accent ---- */
        #mini-stack {
            display: none;
        }

        #mini-stack.popup {
            display: block;
            position: fixed;
            z-index: 960;
            width: 320px;
            height: 260px;
            pointer-events: none;
            /* only the buttons are tappable */
        }

        #mini-stack.popup::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            width: 520px;
            height: 380px;
            transform: translate(-50%, -50%);
            background: radial-gradient(ellipse at center,
                    rgba(245, 194, 66, 0.18) 0%,
                    rgba(245, 194, 66, 0.09) 28%,
                    rgba(245, 194, 66, 0.035) 55%,
                    rgba(245, 194, 66, 0) 75%);
            filter: blur(6px);
            z-index: -1;
        }

        #mini-stack.popup .mini-btn {
            position: absolute;
            pointer-events: auto;
            width: 112px;
            height: 46px;
            transform: translate(-50%, -50%);
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.64rem;
            letter-spacing: 0.12em;
            color: var(--orange);
            background: rgba(8, 18, 38, 0.96);
            border: 1px solid rgba(245, 194, 66, 0.8);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5), 0 0 10px rgba(245, 194, 66, 0.25);
            transition: background 0.12s, transform 0.12s;
        }

        #mini-stack.popup .mini-btn:hover {
            background: rgba(245, 194, 66, 0.12);
        }

        #mini-stack.popup .mini-btn:active {
            transform: translate(-50%, -50%) scale(0.95);
        }

        /* ---- Centered overlay panels (track list + info) ---- */
        #ov-backdrop {
            position: fixed;
            inset: 0;
            z-index: 970;
            background: rgba(2, 9, 25, 0.6);
            backdrop-filter: blur(2px);
            display: none;
        }

        #ov-backdrop.open {
            display: block;
        }

        .ov-panel {
            position: fixed;
            z-index: 971;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(0.96);
            opacity: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            width: min(92vw, 420px);
            max-height: 80vh;
            padding: 16px;
            background: rgba(8, 20, 42, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
            font-family: 'Orbitron', sans-serif;
            color: #fff;
            transition: opacity 0.18s ease, transform 0.18s ease;
        }

        .ov-panel.open {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        .ov-title {
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: var(--orange);
            margin-bottom: 12px;
        }

        .ov-body {
            overflow-y: auto;
        }

        .ov-close {
            margin-top: 14px;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: transparent;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.72rem;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .ov-close:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        /* track list rows */
        .tl-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 10px;
            border-radius: 10px;
            cursor: pointer;
        }

        .tl-row:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .tl-main {
            flex: 1;
            min-width: 0;
        }

        .tl-name {
            font-size: 0.78rem;
        }

        .tl-meta {
            font-family: system-ui, sans-serif;
            font-size: 0.66rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 3px;
        }

        .tl-del {
            flex: none;
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            font-size: 1.1rem;
        }

        .tl-del:hover {
            background: rgba(176, 36, 24, 0.18);
            color: var(--red);
        }

        .tl-empty {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.74rem;
            padding: 8px 0;
        }

        /* GNSS info text */
        #info-body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 0.82rem;
            line-height: 1.5;
            color: #fff;
        }

        #info-body h4 {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.74rem;
            color: var(--orange);
            margin: 14px 0 4px;
        }

        #info-body p {
            margin: 0 0 8px;
        }

        #info-body .flag {
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.55);
        }

        /* toast */
        #toast {
            position: fixed;
            left: 50%;
            bottom: max(170px, calc(env(safe-area-inset-bottom) + 150px));
            transform: translateX(-50%) translateY(8px);
            z-index: 980;
            background: rgba(8, 20, 42, 0.96);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 10px 16px;
            font-family: system-ui, sans-serif;
            font-size: 0.8rem;
            color: #fff;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <!-- Top HUD -->
    <div id="hud-top">
        <div id="gps-chip"><span id="gps-dot"></span><span id="gps-label">POSITION</span><span id="gps-src"></span><span id="gps-acc">±– m</span></div>
        <div id="hud-time"></div>
        <div id="hud-stats">
            <div class="hud-stat"><span class="hud-val" id="trk-dist">0.00</span><span class="hud-lbl">KM</span></div>
            <div class="hud-stat"><span class="hud-val" id="trk-speed">0.0</span><span class="hud-lbl">KM/H</span></div>
        </div>
    </div>

    <!-- Tool buttons -->
    <div id="hud-tools">
        <button id="trk-center" class="hud-tool" title="Zentrieren" aria-label="Zentrieren">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <line x1="12" y1="2" x2="12" y2="5"></line>
                <line x1="12" y1="19" x2="12" y2="22"></line>
                <line x1="2" y1="12" x2="5" y2="12"></line>
                <line x1="19" y1="12" x2="22" y2="12"></line>
            </svg>
        </button>
        <button id="trk-export" class="hud-tool" title="Export GPX" aria-label="Export GPX">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
        </button>
        <button id="trk-clear" class="hud-tool" title="Track löschen" aria-label="Track löschen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
                <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
            </svg>
        </button>
    </div>

    <!-- Big start/stop -->
    <button id="trk-toggle">START</button>

    <!-- Radial action popup (long-press / right-click) — style ported from worldclock -->
    <div id="mini-stack">
        <button class="mini-btn" id="mb-save">SPEICHERN</button>
        <button class="mini-btn" id="mb-load">LADEN</button>
        <button class="mini-btn" id="mb-fs">VOLLBILD</button>
        <button class="mini-btn" id="mb-info">INFO</button>
    </div>

    <!-- Centered overlay panels (track list + GNSS info) -->
    <div id="ov-backdrop"></div>
    <div id="track-list" class="ov-panel">
        <div class="ov-title">Gespeicherte Tracks</div>
        <div id="track-list-items" class="ov-body"></div>
        <button class="ov-close" id="list-close">Schließen</button>
    </div>
    <div id="info-panel" class="ov-panel">
        <div class="ov-title">Satelliten-Systeme · GNSS</div>
        <div class="ov-body" id="info-body"></div>
        <button class="ov-close" id="info-close">Schließen</button>
    </div>

    <!-- Transient toast (replaces the removed status line for action feedback) -->
    <div id="toast"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="js/cyber-clock.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script>
        // ---------------------------------------------------------------
        // Brand palette (see CLAUDE.md)
        // ---------------------------------------------------------------
        const COL_ORANGE = 'rgb(245, 194, 66)';   // track line
        const COL_RED = 'rgb(176, 36, 24)';       // stop / recording
        const COL_GREEN = 'rgb(121, 158, 49)';    // start / idle

        // ---------------------------------------------------------------
        // Map setup
        // ---------------------------------------------------------------
        const map = L.map('map', {
            zoomControl: false,
            attributionControl: true,
            touchZoom: true,          // pinch-zoom with two fingers
            doubleClickZoom: false,   // so a double-tap never zooms the map (clock owns double-tap → fullscreen)
            tap: true,
        }).setView([51.1657, 10.4515], 6); // centre of Germany as a neutral start
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors',
        }).addTo(map);

        const trackLine = L.polyline([], { color: COL_ORANGE, weight: 5, opacity: 0.9 }).addTo(map);
        let posMarker = null;

        // ---------------------------------------------------------------
        // Tracking state
        // ---------------------------------------------------------------
        let watchId = null;
        let acquireWatch = null;   // temporary watch used while acquiring a good initial fix
        let tracking = false;
        let track = [];            // array of [lat, lng]
        let times = [];            // ISO timestamp per recorded point (index-aligned)
        let totalDist = 0;         // metres
        let startTime = null;      // ms
        let timerId = null;
        let lastFix = null;        // { lat, lng, t }

        const MIN_MOVE_M = 4;      // ignore jitter below this distance
        const MAX_ACC_M = 50;      // ignore fixes worse than this accuracy

        const $ = id => document.getElementById(id);
        const elToggle = $('trk-toggle');
        const elDist = $('trk-dist');
        const elTime = $('hud-time');
        const elSpeed = $('trk-speed');
        const elAcc = $('gps-acc');
        const elSrc = $('gps-src');
        const elStatus = $('trk-status');
        const elGps = $('gps-dot');
        const elGpsLabel = $('gps-label');

        // Mount the shared fixed-slot clock so the ticking timer never jitters.
        // Size comes from the #hud-time --cc-size rule; colours are set here.
        CyberClock.mount(elTime, {
            digitColor: '#fff',
            colonColor: 'rgba(255, 255, 255, 0.55)',
            seconds: true,
        });
        CyberClock.set(elTime, '00:00:00');

        function setStatus(msg) { if (elStatus) elStatus.textContent = msg; } // status line removed — guard-safe no-op

        function setGpsState(hasFix) {
            // Green once a position is available, dimmed grey while none ("grün wenn da")
            const c = hasFix ? COL_GREEN : 'rgba(255, 255, 255, 0.3)';
            elGps.style.background = c;
            elGps.style.color = c; // drives the dot glow (box-shadow uses currentColor)
            elGpsLabel.style.color = hasFix ? COL_GREEN : 'rgba(255, 255, 255, 0.55)';
        }
        setGpsState(false);

        // Fade the red position dot in (it starts hidden via CSS)
        function showDot() {
            const el = posMarker && posMarker.getElement && posMarker.getElement();
            if (el) el.classList.add('pos-shown');
        }

        // ---------------------------------------------------------------
        // Geometry helpers
        // ---------------------------------------------------------------
        function haversine(a, b) {
            const R = 6371000; // metres
            const toRad = d => d * Math.PI / 180;
            const dLat = toRad(b[0] - a[0]);
            const dLon = toRad(b[1] - a[1]);
            const lat1 = toRad(a[0]);
            const lat2 = toRad(b[0]);
            const x = Math.sin(dLat / 2) ** 2 +
                Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
            return 2 * R * Math.asin(Math.sqrt(x));
        }

        function fmtDuration(ms) {
            const s = Math.floor(ms / 1000);
            const hh = Math.floor(s / 3600);
            const mm = Math.floor((s % 3600) / 60);
            const ss = s % 60;
            const pad = n => String(n).padStart(2, '0');
            return `${pad(hh)}:${pad(mm)}:${pad(ss)}`;
        }

        function updateDuration() {
            if (startTime) CyberClock.set(elTime, fmtDuration(Date.now() - startTime));
        }

        // ---------------------------------------------------------------
        // Position handling
        // ---------------------------------------------------------------
        // Draw / move the current-position marker, accuracy circle and HUD readout.
        // Shared by live tracking and the one-shot "centre" locate.
        function renderPosition(here, accuracy) {
            // Fixed-pixel dot via circleMarker — keeps its size at every zoom level.
            // (An L.circle would use metres and balloon when zooming in.)
            if (!posMarker) {
                posMarker = L.circleMarker(here, {
                    radius: 7, color: '#fff', weight: 2,
                    fillColor: COL_RED, fillOpacity: 1,
                    className: 'pos-marker',
                }).addTo(map);
            } else {
                posMarker.setLatLng(here);
            }

            elAcc.textContent = accuracy != null ? '±' + Math.round(accuracy) + ' m' : '±– m';
            elSrc.textContent = sourceLabel(accuracy);
            setGpsState(true);
        }

        // The web Geolocation API hides the fix source — infer it from accuracy (heuristic).
        // The real provider (gps/network/fused) is only available in the native app.
        function sourceLabel(acc) {
            if (acc == null) return '';
            if (acc <= 15) return 'GPS';     // only GNSS is this precise
            if (acc <= 150) return 'WLAN';
            return 'FUNK';                    // cell tower / IP
        }

        function onPosition(pos) {
            const { latitude, longitude, accuracy, speed } = pos.coords;
            const now = pos.timestamp || Date.now();
            const here = [latitude, longitude];

            const firstFix = !posMarker;
            renderPosition(here, accuracy);
            showDot();
            if (firstFix) map.setView(here, 17); // snap to the very first fix

            // Reject noisy fixes for the recorded track
            if (accuracy != null && accuracy > MAX_ACC_M) {
                setStatus(`Warte auf besseres Signal … (±${Math.round(accuracy)} m)`);
                return;
            }

            // Add to track only if we actually moved
            const stamp = new Date(now).toISOString();
            if (track.length === 0) {
                track.push(here);
                times.push(stamp);
                trackLine.addLatLng(here);
            } else {
                const step = haversine(track[track.length - 1], here);
                if (step >= MIN_MOVE_M) {
                    totalDist += step;
                    track.push(here);
                    times.push(stamp);
                    trackLine.addLatLng(here);
                }
            }
            elDist.textContent = (totalDist / 1000).toFixed(2);

            // Speed: prefer device value (m/s), else derive from last fix
            let kmh = null;
            if (speed != null && speed >= 0) {
                kmh = speed * 3.6;
            } else if (lastFix) {
                const dt = (now - lastFix.t) / 1000;
                if (dt > 0) kmh = (haversine([lastFix.lat, lastFix.lng], here) / dt) * 3.6;
            }
            if (kmh != null) elSpeed.textContent = kmh.toFixed(1);

            lastFix = { lat: latitude, lng: longitude, t: now };

            map.panTo(here, { animate: true });
            if (tracking) setStatus(`Aufzeichnung läuft … ${track.length} Punkte`);
        }

        function onError(err) {
            const messages = {
                1: 'Standortzugriff verweigert. Bitte in den Einstellungen erlauben.',
                2: 'Position nicht verfügbar (kein GPS-Signal).',
                3: 'Zeitüberschreitung beim Standort.',
            };
            setStatus(messages[err.code] || ('Fehler: ' + err.message));
        }

        // ---------------------------------------------------------------
        // Geolocation source — prefer the native background plugin (Capacitor)
        // so recording continues with the screen off; fall back to the browser
        // API on the web. In a plain browser window.Capacitor is undefined, so
        // this whole block is a no-op and the web behaviour is unchanged.
        // ---------------------------------------------------------------
        const BgGeo = (window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.BackgroundGeolocation) || null;
        const useNativeGeo = !!(BgGeo && Capacitor.isNativePlatform && Capacitor.isNativePlatform());

        function startGeoWatch(onPos, onErr) {
            if (useNativeGeo) {
                // addWatcher returns a Promise<string> (the watcher id)
                return BgGeo.addWatcher(
                    {
                        backgroundTitle: 'Doc Alvers Tracker',
                        backgroundMessage: 'Aufzeichnung läuft …',
                        requestPermissions: true,
                        stale: false,
                        distanceFilter: 0,
                    },
                    (location, error) => {
                        if (error) {
                            onErr({ code: error.code === 'NOT_AUTHORIZED' ? 1 : 2, message: error.message || '' });
                            return;
                        }
                        // adapt the plugin's location shape to the W3C Geolocation shape
                        onPos({
                            coords: {
                                latitude: location.latitude,
                                longitude: location.longitude,
                                accuracy: location.accuracy,
                                speed: location.speed,
                            },
                            timestamp: location.time || Date.now(),
                        });
                    }
                );
            }
            return navigator.geolocation.watchPosition(onPos, onErr, {
                enableHighAccuracy: true,
                maximumAge: 0,
                timeout: 10000,
            });
        }

        function stopGeoWatch(id) {
            if (id == null) return;
            if (useNativeGeo) Promise.resolve(id).then(realId => BgGeo.removeWatcher({ id: realId }));
            else navigator.geolocation.clearWatch(id);
        }

        // ---------------------------------------------------------------
        // Start / Stop
        // ---------------------------------------------------------------
        function startTracking() {
            if (!('geolocation' in navigator)) {
                setStatus('Dieser Browser unterstützt keine Standortbestimmung.');
                return;
            }
            if (!window.isSecureContext) {
                setStatus('GPS braucht HTTPS oder localhost. Über file:// gibt es keine Position.');
                return;
            }
            // stop the acquire watch — the tracking watch takes over now
            if (acquireWatch != null) { navigator.geolocation.clearWatch(acquireWatch); acquireWatch = null; }
            tracking = true;
            startTime = Date.now();
            timerId = setInterval(updateDuration, 1000);
            watchId = startGeoWatch(onPosition, onError); // native background plugin if available, else web
            elToggle.textContent = 'STOP';
            elToggle.style.background = COL_RED;
            setStatus('Suche GPS-Signal …');
        }

        function stopTracking() {
            tracking = false;
            stopGeoWatch(watchId);
            watchId = null;
            if (timerId) clearInterval(timerId);
            timerId = null;
            elToggle.textContent = 'START';
            elToggle.style.background = COL_GREEN;
            setStatus(track.length ? `Gestoppt. ${(totalDist / 1000).toFixed(2)} km, ${track.length} Punkte.` : 'Gestoppt.');
        }

        elToggle.addEventListener('click', () => tracking ? stopTracking() : startTracking());

        // ---------------------------------------------------------------
        // Acquire a position: snap there at once, then keep refining until the
        // accuracy is good (or a timeout hits) — only then reveal the red dot.
        // ---------------------------------------------------------------
        function goToCurrentPosition(opts) {
            opts = opts || {};
            if (!('geolocation' in navigator)) {
                setStatus('Dieser Browser unterstützt keine Standortbestimmung.');
                return;
            }
            if (!window.isSecureContext) {
                setStatus('GPS braucht HTTPS oder localhost. Über file:// gibt es keine Position.');
                return;
            }
            if (acquireWatch != null) navigator.geolocation.clearWatch(acquireWatch);

            const GOOD_ACC = 15;       // metres: a great fix → settle at once
            const STABLE_MS = 3000;    // ms: accuracy stopped improving this long → settle at best
            const MAX_WAIT = 15000;    // ms: reveal anyway after this long
            const startedAt = Date.now();
            let best = null;
            let lastImproved = startedAt;
            let centred = false;

            setStatus('Warte auf bessere Positionsdaten …');

            function reveal() {
                if (acquireWatch != null) { navigator.geolocation.clearWatch(acquireWatch); acquireWatch = null; }
                if (!best) return;
                showDot();
                setStatus(`Position gefunden (±${Math.round(best.accuracy)} m).`);
            }

            acquireWatch = navigator.geolocation.watchPosition(
                pos => {
                    const here = [pos.coords.latitude, pos.coords.longitude];
                    const acc = pos.coords.accuracy != null ? pos.coords.accuracy : Infinity;
                    const now = Date.now();
                    // count it as progress only if accuracy drops meaningfully (ignore jitter)
                    if (!best || acc < best.accuracy - 0.5) { best = { here, accuracy: acc }; lastImproved = now; }

                    renderPosition(best.here, best.accuracy); // moves the still-hidden dot + accuracy readout

                    if (!centred) {
                        centred = true; // go to the position immediately on the first fix
                        if (opts.initial) map.setView(best.here, 16);
                        else map.flyTo(best.here, Math.max(map.getZoom(), 16), { duration: 1.2 });
                    } else {
                        map.panTo(best.here, { animate: true });
                    }

                    // settle once it is great, once it stops improving, or after the hard cap
                    const settle = best.accuracy <= GOOD_ACC
                        || (now - lastImproved) >= STABLE_MS
                        || (now - startedAt) > MAX_WAIT;
                    if (settle) reveal();
                    else setStatus(`Warte auf bessere Positionsdaten … (±${Math.round(best.accuracy)} m)`);
                },
                onError,
                { enableHighAccuracy: true, maximumAge: 0, timeout: 12000 }
            );

            // safety net: reveal the best fix even if updates stop coming
            setTimeout(() => { if (acquireWatch != null) reveal(); }, MAX_WAIT + 500);
        }

        $('trk-center').addEventListener('click', () => {
            // Already have a position → glide there smoothly
            if (posMarker) {
                map.flyTo(posMarker.getLatLng(), Math.max(map.getZoom(), 16), { duration: 1.2 });
                showDot();
                return;
            }
            goToCurrentPosition({ initial: false });
        });

        $('trk-clear').addEventListener('click', () => {
            // Guard against losing a recording by accident
            if (track.length && !confirm('Aktuellen Track wirklich löschen?')) return;
            track = [];
            times = [];
            totalDist = 0;
            lastFix = null;
            trackLine.setLatLngs([]);
            elDist.textContent = '0.00';
            elSpeed.textContent = '0.0';
            if (!tracking) { CyberClock.set(elTime, '00:00:00'); startTime = null; }
            setStatus('Track gelöscht.');
        });

        // ---------------------------------------------------------------
        // Export as GPX (the standard GPS exchange format)
        // ---------------------------------------------------------------
        function buildGpx() {
            const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const name = 'Doc Alvers Tracker ' + (times[0] || '');
            const pts = track.map((p, i) =>
                `      <trkpt lat="${p[0].toFixed(7)}" lon="${p[1].toFixed(7)}">` +
                (times[i] ? `<time>${times[i]}</time>` : '') +
                `</trkpt>`
            ).join('\n');
            return `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Doc Alvers Mathe-Labor" xmlns="http://www.topografix.com/GPX/1/1">
  <trk>
    <name>${esc(name)}</name>
    <trkseg>
${pts}
    </trkseg>
  </trk>
</gpx>`;
        }

        $('trk-export').addEventListener('click', () => {
            if (track.length < 2) {
                setStatus('Noch kein Track zum Exportieren (mind. 2 Punkte nötig).');
                return;
            }
            const blob = new Blob([buildGpx()], { type: 'application/gpx+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `track-${new Date().toISOString().replace(/[:.]/g, '-')}.gpx`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
            setStatus(`GPX exportiert: ${track.length} Punkte, ${(totalDist / 1000).toFixed(2)} km.`);
        });

        // ---------------------------------------------------------------
        // Double-tap the clock → toggle fullscreen
        // ---------------------------------------------------------------
        function toggleFullscreen() {
            const d = document;
            const inFs = d.fullscreenElement || d.webkitFullscreenElement;
            if (!inFs) {
                const el = d.documentElement;
                const req = el.requestFullscreen || el.webkitRequestFullscreen;
                if (req) req.call(el);
            } else {
                const exit = d.exitFullscreen || d.webkitExitFullscreen;
                if (exit) exit.call(d);
            }
        }

        let lastTapTime = 0;
        elTime.addEventListener('click', (e) => {
            e.stopPropagation(); // don't let the tap leak to the map underneath
            const now = Date.now();
            if (now - lastTapTime < 350) { toggleFullscreen(); lastTapTime = 0; } // second tap
            else lastTapTime = now;
        });

        // Re-fit the map after the viewport changes size on enter/leave fullscreen
        document.addEventListener('fullscreenchange', () => setTimeout(init, 120));
        document.addEventListener('webkitfullscreenchange', () => setTimeout(init, 120));

        // ===============================================================
        // Supabase — same project as VGP. The publishable key is public by
        // design; Row-Level-Security keeps each device's tracks private to
        // its anonymous auth.uid().
        // ===============================================================
        const SUPABASE_URL = 'https://fyfhxzyymmurlaenmzse.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ubQDiMD-X3N0vZvPVi229Q_-5Zootfk';
        let sb = null;

        async function ensureSb() {
            if (!window.supabase) throw new Error('Supabase-Lib nicht geladen');
            if (!sb) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            const { data: { session } } = await sb.auth.getSession();
            if (!session) {
                const { error } = await sb.auth.signInAnonymously();
                if (error) throw new Error('Anon-Login aus? ' + error.message);
            }
            return sb;
        }

        async function saveTrack(name) {
            const c = await ensureSb();
            const pts = track.map((p, i) => [p[0], p[1], times[i] || null]);
            const { error } = await c.from('tracks').insert({
                name: name,
                distance_m: Math.round(totalDist),
                points: pts,
            });
            if (error) throw error;
        }

        async function listTracks() {
            const c = await ensureSb();
            const { data, error } = await c.from('tracks')
                .select('id, name, created_at, distance_m')
                .order('created_at', { ascending: false });
            if (error) throw error;
            return data || [];
        }

        async function fetchTrackPoints(id) {
            const c = await ensureSb();
            const { data, error } = await c.from('tracks').select('points').eq('id', id).single();
            if (error) throw error;
            return data.points || [];
        }

        async function removeTrack(id) {
            const c = await ensureSb();
            const { error } = await c.from('tracks').delete().eq('id', id);
            if (error) throw error;
        }

        // Plot a loaded track onto the map (replaces the current line)
        function plotTrack(points) {
            const latlngs = points.map(p => [p[0], p[1]]);
            track = latlngs.map(ll => [ll[0], ll[1]]);
            times = points.map(p => p[2] || null);
            totalDist = 0;
            for (let i = 1; i < latlngs.length; i++) totalDist += haversine(latlngs[i - 1], latlngs[i]);
            trackLine.setLatLngs(latlngs);
            elDist.textContent = (totalDist / 1000).toFixed(2);
            elSpeed.textContent = '0.0';
            if (latlngs.length) map.fitBounds(trackLine.getBounds(), { padding: [40, 40] });
        }

        // ---- Transient toast (the persistent status line was removed) ----
        let toastTimer = null;
        function toast(msg) {
            const t = $('toast');
            t.textContent = msg;
            t.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
        }

        // ===============================================================
        // Radial action popup (long-press / right-click) — style from worldclock
        // ===============================================================
        const miniStack = $('mini-stack');

        function openPopup(clientX, clientY) {
            const W = 320, H = 260, rx = 104, ry = 92;
            const x = Math.max(8, Math.min(clientX - W / 2, window.innerWidth - W - 8));
            const y = Math.max(8, Math.min(clientY - H / 2, window.innerHeight - H - 8));
            miniStack.style.left = x + 'px';
            miniStack.style.top = y + 'px';
            miniStack.classList.add('popup');
            const btns = Array.from(miniStack.querySelectorAll('.mini-btn'));
            const n = btns.length;
            btns.forEach((b, i) => {
                const a = (i / n) * 2 * Math.PI - Math.PI / 2;
                b.style.left = (W / 2 + Math.cos(a) * rx) + 'px';
                b.style.top = (H / 2 + Math.sin(a) * ry) + 'px';
            });
        }
        function closePopup() { miniStack.classList.remove('popup'); }

        window.addEventListener('contextmenu', (e) => { e.preventDefault(); openPopup(e.clientX, e.clientY); });

        let lpTimer = null, lpX = 0, lpY = 0;
        document.addEventListener('touchstart', (e) => {
            if (e.target.closest('button')) return;
            if (miniStack.classList.contains('popup')) return;
            const t = e.touches[0];
            lpX = t.clientX; lpY = t.clientY;
            clearTimeout(lpTimer);
            lpTimer = setTimeout(() => { openPopup(lpX, lpY); lpTimer = null; }, 550);
        }, { passive: true });
        document.addEventListener('touchmove', (e) => {
            const t = e.touches[0];
            if (Math.abs(t.clientX - lpX) > 10 || Math.abs(t.clientY - lpY) > 10) { clearTimeout(lpTimer); lpTimer = null; }
        }, { passive: true });
        document.addEventListener('touchend', () => { clearTimeout(lpTimer); lpTimer = null; });
        document.addEventListener('touchcancel', () => { clearTimeout(lpTimer); lpTimer = null; });
        document.addEventListener('mousedown', (e) => {
            if (miniStack.classList.contains('popup') && !miniStack.contains(e.target)) closePopup();
        });

        // ---- Overlay panels (track list + info) ----
        const ovBackdrop = $('ov-backdrop');
        function showPanel(id) { ovBackdrop.classList.add('open'); $(id).classList.add('open'); }
        function hidePanels() {
            ovBackdrop.classList.remove('open');
            document.querySelectorAll('.ov-panel').forEach(p => p.classList.remove('open'));
        }
        ovBackdrop.addEventListener('click', hidePanels);
        $('list-close').addEventListener('click', hidePanels);
        $('info-close').addEventListener('click', hidePanels);

        // ---- Popup actions ----
        $('mb-save').addEventListener('click', async () => {
            closePopup();
            if (track.length < 2) { toast('Kein Track zum Speichern.'); return; }
            const def = 'Track ' + new Date().toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
            const name = prompt('Track-Name:', def);
            if (name == null) return;
            toast('Speichere …');
            try { await saveTrack(name.trim() || def); toast('Track gespeichert.'); }
            catch (e) { toast('Speichern fehlgeschlagen: ' + (e.message || e)); }
        });

        $('mb-load').addEventListener('click', async () => {
            closePopup();
            toast('Lade Liste …');
            let rows;
            try { rows = await listTracks(); }
            catch (e) { toast('Laden fehlgeschlagen: ' + (e.message || e)); return; }
            renderTrackList(rows);
            showPanel('track-list');
        });

        $('mb-fs').addEventListener('click', () => { closePopup(); toggleFullscreen(); });
        $('mb-info').addEventListener('click', () => { closePopup(); $('info-body').innerHTML = GNSS_INFO; showPanel('info-panel'); });

        function renderTrackList(rows) {
            const box = $('track-list-items');
            box.innerHTML = '';
            if (!rows.length) { box.innerHTML = '<div class="tl-empty">Noch keine gespeicherten Tracks.</div>'; return; }
            rows.forEach((r) => {
                const row = document.createElement('div');
                row.className = 'tl-row';
                const km = r.distance_m != null ? (r.distance_m / 1000).toFixed(2) + ' km' : '–';
                const when = new Date(r.created_at).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
                const main = document.createElement('div');
                main.className = 'tl-main';
                const nm = document.createElement('div'); nm.className = 'tl-name'; nm.textContent = r.name;
                const mt = document.createElement('div'); mt.className = 'tl-meta'; mt.textContent = when + ' · ' + km;
                main.appendChild(nm); main.appendChild(mt);
                main.addEventListener('click', async () => {
                    toast('Lade Track …');
                    try { const pts = await fetchTrackPoints(r.id); plotTrack(pts); hidePanels(); toast(r.name + ' geladen.'); }
                    catch (e) { toast('Track laden fehlgeschlagen.'); }
                });
                const del = document.createElement('button');
                del.className = 'tl-del'; del.textContent = '×'; del.title = 'Löschen';
                del.addEventListener('click', async (ev) => {
                    ev.stopPropagation();
                    if (!confirm('Track löschen?')) return;
                    try { await removeTrack(r.id); row.remove(); toast('Gelöscht.'); }
                    catch (e) { toast('Löschen fehlgeschlagen.'); }
                });
                row.appendChild(main); row.appendChild(del);
                box.appendChild(row);
            });
        }

        const GNSS_INFO =
            '<p>GNSS = <b>Globale Navigations-Satelliten-Systeme</b>. Dein Gerät empfängt Signale mehrerer ' +
            'Satelliten und berechnet aus deren Laufzeiten seine Position. Meist laufen mehrere Systeme ' +
            'gleichzeitig (Multi-GNSS) → schneller und genauer.</p>' +
            '<h4>GPS · USA</h4>' +
            '<p>„Global Positioning System", betrieben von der <b>US Space Force</b>. Das älteste und ' +
            'bekannteste System, rund 31 Satelliten. <span class="flag">seit 1978</span></p>' +
            '<h4>GLONASS · Russland</h4>' +
            '<p>Russisches Gegenstück, betrieben von Roskosmos.</p>' +
            '<h4>Galileo · Europa</h4>' +
            '<p>Ziviles System der <b>EU/ESA</b> — sehr genau, kein Militär dahinter.</p>' +
            '<h4>BeiDou · China</h4>' +
            '<p>Chinesisches System, seit 2020 global.</p>' +
            '<h4>QZSS · Japan &amp; NavIC · Indien</h4>' +
            '<p>Regionale Systeme, die GPS über Asien bzw. Indien ergänzen.</p>' +
            '<h4>Wer trägt bei?</h4>' +
            '<p>Welche Satelliten gerade zu Deiner Positionsbestimmung beitragen, kann nur die native App ' +
            'zeigen (Android GnssStatus) — im Browser gibt die Standort-API das nicht her.</p>';

        // ---------------------------------------------------------------
        // Keep Leaflet sized correctly
        // ---------------------------------------------------------------
        function init() {
            map.invalidateSize();
        }
        window.addEventListener('resize', init);
        document.fonts.ready.then(init);
        setTimeout(init, 300);

        // On load: jump straight to the current position (no need to press centre),
        // then wait for better data before revealing the red dot.
        goToCurrentPosition({ initial: true });
    </script>
</body>

</html>
