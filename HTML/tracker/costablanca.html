<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Highlights Costa Blanca — Doc Alvers</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="preload" as="image" href="vsb-yggdrasil-gold.png">
    <style>
        /* ---- tracker palette (same as the Wander-Checkliste) ---- */
        :root {
            --bg: rgb(8, 20, 42);
            --bg-light: rgb(14, 36, 78);
            --orange: rgb(245, 194, 66);
            --red: rgb(176, 36, 24);
            --green: rgb(121, 158, 49);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: #fff;
            /* content in Arial for readability — Orbitron stays on title + buttons */
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            padding-bottom: 24px;
        }

        /* ---------------- app header ---------------- */
        header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: linear-gradient(180deg, var(--bg-light), var(--bg));
            border-bottom: 1px solid rgba(245, 194, 66, 0.3);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .back {
            color: var(--orange);
            text-decoration: none;
            font-size: 14px;
            padding: 12px 12px;
            border: 1px solid rgba(245, 194, 66, 0.4);
            border-radius: 10px;
            white-space: nowrap;
            min-height: 44px;
            display: flex;
            align-items: center;
        }

        h1 { font-family: 'Orbitron', sans-serif; font-size: 15px; letter-spacing: 1.5px; color: var(--orange); flex: 1; }

        .langs { display: flex; gap: 9px; }

        .lang {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            padding: 12px 12px;
            min-height: 44px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: transparent;
            color: #cdd8ec;
            cursor: pointer;
        }

        .lang.active { background: var(--green); border-color: var(--green); color: #fff; }

        /* ---------------- tagline ---------------- */
        #tagline { padding: 12px 16px 2px 16px; color: #9fb6dc; font-size: 16px; }

        /* ---------------- progress ---------------- */
        #progress-wrap { padding: 10px 16px 4px 16px; }

        #progress-bar {
            height: 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.12);
            overflow: hidden;
        }

        #progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 999px;
            background-image: linear-gradient(90deg, var(--red), var(--orange), var(--green));
            background-size: 100% 100%;
            transition: width 0.25s;
        }

        .progress-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 6px; }

        #progress-text { font-size: 14px; color: #9fb6dc; }

        .progress-row .btn.reset { flex: 0 0 auto; font-size: 11px; letter-spacing: 0.5px; padding: 7px 12px; border-radius: 10px; }

        #progress-text .go { color: var(--green); font-weight: 700; }

        /* ---------------- spot list ---------------- */
        #list { padding: 10px 12px 0 12px; display: flex; flex-direction: column; gap: 8px; }

        .spot {
            background: var(--bg-light);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
        }

        .spot.done { border-color: rgba(121, 158, 49, 0.7); }

        .spot .row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            cursor: pointer;
            user-select: none;
            min-height: 52px;
        }

        .spot .box {
            width: 26px;
            height: 26px;
            flex: 0 0 auto;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            color: #fff;
            cursor: pointer;
        }

        .spot .box:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }

        .spot.done .box { background: var(--green); border-color: var(--green); }

        /* mini thumbnail next to the checkbox / in the pool row; grows into a preview on hover */
        .spot .thumb, .poolitem .thumb {
            flex: 0 0 auto;
            width: 38px;
            height: 38px;
            object-fit: cover;
            border-radius: 7px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            cursor: zoom-in;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-radius 0.2s ease;
        }

        .spot .thumb:hover, .poolitem .thumb:hover {
            transform: scale(3.6);
            transform-origin: left center;
            position: relative;
            z-index: 30;
            border-radius: 10px;
            box-shadow: 0 10px 34px rgba(8, 20, 42, 0.85);
        }

        /* let the enlarged pool thumbnail escape the pool's clipping while hovered */
        #pool:has(.thumb:hover), .pool-inner:has(.thumb:hover), .poolitem:has(.thumb:hover) { overflow: visible; }

        /* lightbox: tap a thumbnail to see the full image (touch-friendly) */
        #lightbox {
            position: fixed;
            inset: 0;
            background: rgba(8, 20, 42, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 200;
            cursor: zoom-out;
        }

        #lightbox.open { display: flex; }

        #lightbox img {
            max-width: 96%;
            max-height: 92%;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 60px rgba(8, 20, 42, 0.7);
        }

        .spot .name { flex: 1; font-size: 17px; line-height: 1.4; }

        .spot.done .name { color: #9fb6dc; text-decoration: line-through; text-decoration-thickness: 1px; }

        .spot .chev {
            flex: 0 0 auto;
            color: #9fb6dc;
            font-size: 18px;
            transition: transform 0.28s ease;
            padding: 0 2px;
        }

        .spot.open .chev { transform: rotate(90deg); }

        .chev svg { width: 22px; height: 22px; display: block; }

        /* collapsible description — animate via grid-template-rows 0fr -> 1fr */
        .spot .desc {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.28s ease;
        }

        .spot.open .desc { grid-template-rows: 1fr; }

        .spot .descInner { overflow: hidden; }

        .spot .text {
            padding: 2px 16px 14px 52px;
            color: #dbe4f4;
            font-size: 16px;
            line-height: 1.62;
        }

        /* photos in the description — self-hiding (missing files remove themselves).
           full aspect ratio, no crop (plenty of room); only capped in size */
        .spot .shots { display: block; padding: 4px 16px 6px 52px; }
        .spot .shots:empty { display: none; }

        .spot .shot {
            display: block;
            max-width: 100%;
            max-height: 460px;
            height: auto;
            width: auto;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.04);
            margin-bottom: 8px;
        }

        .spot .credit {
            padding: 0 16px 8px 52px;
            color: #7f93b5;
            font-size: 12px;
            line-height: 1.4;
        }

        .spot .credit:empty { display: none; }

        .spot .warn {
            margin: 0 16px 8px 52px;
            padding: 8px 10px;
            border-radius: 10px;
            background: rgba(245, 194, 66, 0.12);
            border: 1px solid rgba(245, 194, 66, 0.4);
            color: var(--orange);
            font-size: 14px;
            line-height: 1.5;
        }

        /* ---------------- actions ---------------- */
        #actions { display: flex; gap: 10px; padding: 6px 12px 18px 12px; }

        .btn {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            letter-spacing: 1px;
            padding: 14px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
        }

        .btn.reset { background: transparent; border: 1px solid rgba(255, 255, 255, 0.3); color: #cdd8ec; }

        /* ---------------- VSB seal footer ---------------- */
        footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 12px 16px 24px 16px;
        }

        .sealsvg { width: 131px; height: 131px; }

        .motto {
            font-family: 'Times New Roman', Times, serif;
            font-style: italic;
            letter-spacing: 1px;
            color: #9fb6dc;
            font-size: 12px;
        }

        /* ---------------- Solita sign-off card ---------------- */
        .signoff {
            display: flex;
            align-items: center;
            gap: 14px;
            width: calc(100% - 24px);
            max-width: 420px;
            margin: 6px auto 30px auto;
            padding: 14px 16px;
            background: var(--bg-light);
            border: 1px solid rgba(245, 194, 66, 0.28);
            border-radius: 16px;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
        }

        .signoff:hover { border-color: rgba(245, 194, 66, 0.6); background: rgb(18, 44, 92); }

        .signoff .teamlink { font-size: 11.5px; color: var(--green); margin-top: 6px; }

        .signoff:hover .teamlink { text-decoration: underline; }

        .signoff .avatar {
            width: 76px;
            height: 76px;
            flex: 0 0 auto;
            border-radius: 14px;
            object-fit: cover;
            object-position: center 20%;
            border: 1px solid rgba(245, 194, 66, 0.4);
        }

        .signoff .who { display: flex; flex-direction: column; gap: 1px; min-width: 0; }

        .signoff .nm {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            letter-spacing: 0.5px;
            color: var(--orange);
        }

        .signoff .ti { font-size: 12px; color: #cdd8ec; }

        .signoff .sub { font-size: 10.5px; color: #7f93b5; margin-top: 3px; }
        /* drag handle (mouse reorder) + move-to-pool (x) on each item row */
        .spot .grip {
            flex: 0 0 auto;
            color: #6b7ea3;
            font-size: 18px;
            line-height: 1;
            padding: 4px 2px;
            cursor: grab;
        }

        .spot .grip:active { cursor: grabbing; }
        .spot.dragging { opacity: 0.55; border-color: rgba(245, 194, 66, 0.7); }

        .spot .topool {
            flex: 0 0 auto;
            height: 28px;
            min-width: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            color: #7f93b5;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
            border-radius: 8px;
        }

        .spot .topool:hover { color: #fff; background: rgba(176, 36, 24, 0.55); }

        /* ---------------- Pool card (green bg, blue text, same shape as items) ---------------- */
        #pool {
            margin: 8px 12px 14px 12px;
            background: var(--green);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 14px;
            overflow: hidden;
            color: rgb(14, 36, 78);
        }

        .pool-head {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            cursor: pointer;
            user-select: none;
            min-height: 52px;
        }

        .pool-title { font-size: 17px; color: rgb(14, 36, 78); }
        .pool-count { flex: 1; font-size: 12px; color: rgba(14, 36, 78, 0.72); }
        .pool-count::before { content: '('; }
        .pool-count::after { content: ')'; }

        .pool-head .chev { flex: 0 0 auto; color: rgb(14, 36, 78); font-size: 18px; transition: transform 0.28s ease; }
        #pool.open .pool-head .chev { transform: rotate(90deg); }

        .pool-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.28s ease; }
        #pool.open .pool-body { grid-template-rows: 1fr; }
        .pool-inner { overflow: hidden; }

        .pool-hint { padding: 0 14px 8px 14px; font-size: 11.5px; color: rgba(14, 36, 78, 0.8); line-height: 1.5; }
        .poolempty { padding: 0 14px 12px 14px; font-size: 12.5px; color: rgba(14, 36, 78, 0.8); }

        #pool-list { padding: 0 12px 12px 12px; display: flex; flex-direction: column; gap: 6px; }

        .poolitem {
            background: rgba(255, 255, 255, 0.22);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }

        .poolrow { display: flex; align-items: center; gap: 10px; padding: 8px 10px; cursor: pointer; user-select: none; }
        .poolitem .poolname { flex: 1; font-size: 15px; color: rgb(14, 36, 78); }
        .poolitem .chev { flex: 0 0 auto; color: rgba(14, 36, 78, 0.8); font-size: 18px; transition: transform 0.28s ease; }
        .poolitem.open .chev { transform: rotate(90deg); }

        .poolitem .desc { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.28s ease; }
        .poolitem.open .desc { grid-template-rows: 1fr; }
        .poolitem .descInner { overflow: hidden; }

        .poolitem .shots { display: block; padding: 2px 12px 6px 12px; }
        .poolitem .shots:empty { display: none; }
        .poolitem .shot {
            display: block;
            max-width: 100%;
            max-height: 360px;
            height: auto;
            width: auto;
            border-radius: 10px;
            border: 1px solid rgba(14, 36, 78, 0.25);
            margin-bottom: 6px;
        }

        .poolitem .credit { padding: 0 12px 6px 12px; font-size: 11px; color: rgba(14, 36, 78, 0.7); }
        .poolitem .credit:empty { display: none; }
        .poolitem .text { padding: 0 12px 12px 12px; font-size: 15px; line-height: 1.55; color: rgb(14, 36, 78); }

        .topmain {
            flex: 0 0 auto;
            height: 28px;
            min-width: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            color: rgb(14, 36, 78);
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
            border-radius: 8px;
        }

        .topmain:hover { background: rgba(255, 255, 255, 0.35); }
    </style>
</head>

    <script>
        'use strict';

        /* ---- content: Team-Eva Costa-Blanca spots, researched blurbs (DE/EN/ES/IT) ---- */
        const SPOTS = [
    {
        "key": "altea",
        "name": {
            "de": "Altea – Altstadt",
            "en": "Altea Old Town",
            "es": "Altea – Casco Antiguo",
            "it": "Altea – Centro Storico"
        },
        "uncertain": false,
        "blurb": {
            "de": "Über der Altstadt von Altea thront die Iglesia de Nuestra Señora del Consuelo mit ihren blau-weiß gekachelten Zwillingskuppeln — umgeben von einem Labyrinth weiß getünchter, bougainvillea-umrankter Gassen, in denen seit Generationen Künstler zu Hause sind. Von der Plaza de la Iglesia führt der Weg weiter zum Portal Vell und zum Mirador de los Cronistas, wo sich die ganze Bucht von Altea bis Benidorm und zum Peñón de Ifach bei Calpe öffnet. Geh am besten am späten Nachmittag hinauf: Stell das Auto unten am Paseo Marítimo ab und nimm die gepflasterten Stufen zu Fuß, denn oben einen Parkplatz zu finden ist quasi aussichtslos. Und dann auf eine Terrasse am Kirchplatz, ein Glas in der Hand, während die blauen Kuppeln das letzte Sonnenlicht einfangen.",
            "en": "Crowning Altea's old town, the Iglesia de Nuestra Señora del Consuelo lifts its twin blue-and-white tiled domes above a maze of whitewashed, bougainvillea-draped lanes that have drawn artists here for generations. Wander from the Plaza de la Iglesia to the Portal Vell and on to the Mirador de los Cronistas, where the whole Bay of Altea opens up toward Benidorm and the Peñón de Ifach at Calpe. Come up in the late afternoon: leave the car down on the Paseo Marítimo and climb the cobbled steps on foot, since parking at the top is near-impossible. Then settle onto a terrace on the church square with a drink as the blue domes catch the last of the sun.",
            "es": "Coronando el casco antiguo de Altea, la Iglesia de Nuestra Señora del Consuelo alza sus cúpulas gemelas de azulejos azules y blancos sobre un laberinto de callejuelas encaladas y cubiertas de buganvillas, hogar de artistas desde hace generaciones. Desde la Plaza de la Iglesia puedes acercarte al Portal Vell y al Mirador de los Cronistas, donde se abre toda la bahía de Altea hacia Benidorm y el Peñón de Ifach de Calpe. Sube a última hora de la tarde: deja el coche abajo, en el Paseo Marítimo, y afronta a pie las escaleras empedradas, porque aparcar arriba es casi imposible. Luego siéntate en una terraza de la plaza de la iglesia con algo para beber mientras las cúpulas azules atrapan la última luz del día.",
            "it": "Sul centro storico di Altea troneggia la Iglesia de Nuestra Señora del Consuelo con le sue cupole gemelle di piastrelle blu e bianche — circondata da un labirinto di vicoli imbiancati a calce e avvolti di bouganville, dove da generazioni sono di casa gli artisti. Dalla Plaza de la Iglesia si prosegue verso il Portal Vell e il Mirador de los Cronistas, dove si apre tutta la baia di Altea fino a Benidorm e al Peñón de Ifach di Calpe. Sali nel tardo pomeriggio: lascia l’auto giù al Paseo Marítimo e prendi a piedi i gradini acciottolati, perché trovare parcheggio in cima è praticamente impossibile. E poi una terrazza sulla piazza della chiesa, un bicchiere in mano, mentre le cupole blu catturano l’ultima luce del sole."
        },
        "credit": "Foto: ConradMoeller · CC BY-SA 2.5 · Wikimedia Commons",
        "defaultPool": false
    },
    {
        "key": "valencia",
        "name": {
            "de": "Valencia",
            "en": "Valencia",
            "es": "Valencia",
            "it": "Valencia"
        },
        "uncertain": false,
        "blurb": {
            "de": "Nur gut anderthalb Stunden nördlich über die AP-7 liegt eine Stadt, die Zukunft und Mittelalter mühelos verbindet: Calatravas futuristische Ciudad de las Artes y las Ciencias im alten Turia-Flussbett mit dem Oceanogràfic, dem größten Aquarium Europas, und wenige Straßen weiter die gotische Seidenbörse La Lonja mit ihren gedrehten Säulen und der Jugendstil-Markthalle Mercado Central. Wer will, steigt auf den Miguelete für den Blick über die Altstadt oder spaziert durch den 9 km langen Turia-Park, der sich als grünes Band um alles legt. Ein Tipp aus Erfahrung: die Tickets für Oceanogràfic und Hemisfèric vorab online buchen (Kombi spart Geld) und früh kommen, bevor der Andrang kommt. Und die echte Paella Valenciana gibt es in aller Ruhe als Mittagessen draußen in der Albufera, dort wo der Reis wächst – genau so, wie es die Einheimischen halten.",

            "de": "Keine 40 Minuten vom Haus entfernt klebt dieses Bergdorf hoch über einem türkisfarbenen Stausee, eingerahmt von der Aitana-Sierra — und in die Altstadt gelangt man durch das Portal de Sant Josep, ein Tor, das direkt durch den nackten Fels gehauen wurde. Oben thront der weiß gekalkte Glockenturm auf seinem eigenen Felssporn, das meistfotografierte Bild des ganzen Ortes, dazu die maurische Burgruine aus dem 11. Jahrhundert und eine Handvoll herrlich schrulliger Mini-Museen — Mikrominiaturen, Puppenhäuser, sogar ein Foltermuseum. Am besten früh morgens oder am späten Nachmittag hin, dann entgeht man den Reisebussen aus Benidorm; das Auto unten auf dem kostenpflichtigen Parkplatz lassen und durch die autofreien Kopfsteingassen hochlaufen.",
            "en": "Barely 40 minutes from the house, this village clings to a crag high above a turquoise reservoir ringed by the Aitana sierras — and you enter the old town through the Portal de Sant Josep, a gateway tunnelled straight through solid rock. Up top, the whitewashed bell tower perched on its own rock spur is the picture everyone comes for, alongside the 11th-century Moorish castle ruins and a cluster of wonderfully odd little museums (microminiatures, dolls' houses, even a torture museum). Go early morning or late afternoon to dodge the Benidorm coach crowds, leave the car in the paid lot at the bottom, and walk up through the car-free cobbled lanes.",
            "es": "A apenas 40 minutos de casa, este pueblo se aferra a un risco sobre un embalse turquesa rodeado por las sierras de Aitana, Serrella y Xortà, y se entra al casco antiguo por el Portal de Sant Josep, una puerta excavada directamente en la roca viva. Arriba te espera el campanario encalado del Peñón de la Alcalá, la imagen más fotografiada del lugar, junto a las ruinas del castillo árabe del siglo XI y un puñado de museos diminutos y curiosísimos (microminiaturas, casas de muñecas, hasta uno de la tortura). Ve a primera hora o a última de la tarde para esquivar los autobuses de Benidorm, deja el coche en el aparcamiento de pago de abajo y sube a pie por las callejuelas empedradas.",
            "it": "A nemmeno 40 minuti da casa questo borgo di montagna è aggrappato in alto sopra un lago turchese, incorniciato dalla sierra di Aitana — e nel centro storico si entra dal Portal de Sant Josep, una porta scavata direttamente nella roccia viva. In alto troneggia il campanile imbiancato sul suo sperone di roccia, l’immagine più fotografata di tutto il paese, insieme alle rovine del castello moresco dell’XI secolo e a una manciata di piccoli musei deliziosamente stravaganti — microminiature, case di bambole, perfino un museo della tortura. Meglio al mattino presto o nel tardo pomeriggio, per evitare i pullman da Benidorm; lascia l’auto nel parcheggio a pagamento in basso e sali a piedi per i vicoli acciottolati chiusi al traffico."

            "es": "A solo 30-40 minutos por la costa desde Altea, Moraira es un tranquilo pueblo costero de casas bajas entre Calpe y Jávea, donde el pequeño Castillo de Moraira —con su curiosa forma de 'pezuña de buey'— se alza junto a la Playa de l'Ampolla, recuerdo de los tiempos de vigías contra los piratas. Sube por el sendero del acantilado hasta la Torre del Cap d'Or, sobre El Portet, para disfrutar de amplias vistas al mar, y baja luego al puerto, donde la lonja y los restaurantes junto al muelle sirven pescado fresco. Ve un viernes por la mañana a uno de los mercados más grandes de la Costa Blanca y después acércate a la cala turquesa de El Portet para bañarte y comer, pero llega pronto: hay muy pocas plazas de aparcamiento, así que mejor deja el coche en el pueblo y ve andando o en el pequeño bus de playa. Y no te vayas sin probar el Moscatel de la tierra.",

        const UI = {
            de: {
                title: 'Highlights Costa Blanca', tagline: 'Costa-Blanca-Ausflüge · zum Abhaken', reset: 'ZURÜCKSETZEN',
                progress: (n, t) => n + ' von ' + t + ' gesehen', done: 'Alles gesehen! 🎉',
                warn: 'Schrift auf dem Zettel unklar — bitte bestätigen oder korrigieren.',
                motto: 'vita somnium breve'
            },
            en: {
                title: 'Highlights Costa Blanca', tagline: 'Costa Blanca outings · tick them off', reset: 'RESET',
                progress: (n, t) => n + ' of ' + t + ' seen', done: 'All seen! 🎉',
                warn: 'Handwriting on the note is unclear — please confirm or correct.',
                motto: 'vita somnium breve'
            },
            es: {
                title: 'Highlights Costa Blanca', tagline: 'Excursiones por la Costa Blanca · para tachar', reset: 'REINICIAR',
                progress: (n, t) => n + ' de ' + t + ' vistos', done: '¡Todo visto! 🎉',
                warn: 'La letra de la nota no está clara — confírmalo o corrígelo.',
                motto: 'vita somnium breve'
            },
            it: {
                title: 'Highlights Costa Blanca', tagline: 'Gite sulla Costa Blanca · da spuntare', reset: 'AZZERA',
                progress: (n, t) => n + ' di ' + t + ' visti', done: 'Tutto visto! 🎉',
                warn: 'La scrittura sul foglietto non è chiara — conferma o correggi.',
                motto: 'vita somnium breve'
            }
        };

        const LS_STATE = 'cbspots.state', LS_LANG = 'cbspots.lang', LS_OPEN = 'cbspots.open',
              LS_POOL = 'cbspots.pool', LS_ORDER = 'cbspots.order', LS_POOLOPEN = 'cbspots.poolopen';
        let lang = localStorage.getItem(LS_LANG) || 'de';
        // language can be given in the link (?lang=xx) and takes precedence
        try { const ul = new URLSearchParams(location.search).get('lang'); if (ul && ['de', 'en', 'es', 'it'].includes(ul)) lang = ul; } catch (e) { }
        let state = {};   // spot key -> visited
        let open = {};    // spot key -> expanded
        try { state = JSON.parse(localStorage.getItem(LS_STATE) || '{}') || {}; } catch (e) { state = {}; }
        try { open = JSON.parse(localStorage.getItem(LS_OPEN) || '{}') || {}; } catch (e) { open = {}; }

        const byKey = {};
        SPOTS.forEach(s => { byKey[s.key] = s; });

        // custom display order (superset of all keys); reconcile with SPOTS so new keys appear & stale drop
        let order;
        try { order = JSON.parse(localStorage.getItem(LS_ORDER) || 'null'); } catch (e) { order = null; }
        if (!Array.isArray(order)) order = SPOTS.map(s => s.key);
        order = order.filter(k => byKey[k]);
        SPOTS.forEach(s => { if (!order.includes(s.key)) order.push(s.key); });

        // pool: keys parked in the Pool card (seed from defaultPool on first run)
        let pool;
        try {
            const raw = localStorage.getItem(LS_POOL);
            pool = new Set(raw ? JSON.parse(raw) : SPOTS.filter(s => s.defaultPool).map(s => s.key));
        } catch (e) { pool = new Set(SPOTS.filter(s => s.defaultPool).map(s => s.key)); }
        let poolOpen = localStorage.getItem(LS_POOLOPEN) === '1';   // pool card collapsed by default
        let dragEl = null;   // currently dragged .spot element (mouse reorder)

        const POOL_UI = {
            de: { title: 'Pool', empty: 'Pool ist leer.', hint: 'Ziele zum Hochholen (+) — im Sommer bleiben die Berge hier geparkt.' },
            en: { title: 'Pool', empty: 'Pool is empty.', hint: 'Targets to pull up (+) — in summer the peaks stay parked here.' },
            es: { title: 'Pool', empty: 'El pool está vacío.', hint: 'Destinos para subir (+) — en verano las montañas se quedan aquí.' },
            it: { title: 'Pool', empty: 'Il pool è vuoto.', hint: 'Mete da tirare su (+) — in estate le montagne restano parcheggiate qui.' }
        };

        const $ = id => document.getElementById(id);

        // tap/click a thumbnail -> full-image lightbox (touch-friendly); desktop keeps the hover-zoom too
        const lightbox = $('lightbox');
        function openLightbox(src, alt) {
            const im = lightbox.querySelector('img');
            im.src = src; im.alt = alt || '';
            lightbox.classList.add('open');
        }
        function closeLightbox() { lightbox.classList.remove('open'); lightbox.querySelector('img').removeAttribute('src'); }
        lightbox.addEventListener('click', closeLightbox);
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

        function save() {
            localStorage.setItem(LS_STATE, JSON.stringify(state));
            localStorage.setItem(LS_OPEN, JSON.stringify(open));
            localStorage.setItem(LS_LANG, lang);
            localStorage.setItem(LS_POOL, JSON.stringify([...pool]));
            localStorage.setItem(LS_ORDER, JSON.stringify(order));
            localStorage.setItem(LS_POOLOPEN, poolOpen ? '1' : '0');
        }

        function pick(obj) { return obj[lang] || obj.de || ''; }

        // keep the current language in the URL so the link reflects/shares it
        function syncLangToUrl() {
            try {
                const u = new URL(location.href);
                u.searchParams.set('lang', lang);
                history.replaceState(null, '', u);
            } catch (e) { }
        }

        function activeKeys() { return order.filter(k => byKey[k] && !pool.has(k)); }

        function updateProgress() {
            const u = UI[lang];
            const act = activeKeys();
            const n = act.filter(k => state[k]).length, t = act.length;
            const pct = t ? n * 100 / t : 0;
            $('progress-fill').style.width = pct + '%';
            $('progress-fill').style.backgroundSize = pct > 0 ? (10000 / pct) + '% 100%' : '100% 100%';
            $('progress-text').innerHTML = (t && n === t)
                ? '<span class="go">' + u.done + '</span>'
                : u.progress(n, t);
        }

        function render() {
            const u = UI[lang];
            document.documentElement.lang = lang;
            $('t-title').textContent = u.title;
            $('btn-reset').textContent = u.reset;
            document.querySelectorAll('.lang').forEach(b => b.classList.toggle('active', b.dataset.l === lang));

            const list = $('list');
            list.innerHTML = '';
            const act = activeKeys();
            act.forEach((key, idx) => {
                const s = byKey[key];
                const done = !!state[key], isOpen = !!open[key];
                const el = document.createElement('div');
                el.className = 'spot' + (done ? ' done' : '') + (isOpen ? ' open' : '');
                el.innerHTML =
                    '<div class="row">' +
                    '<span class="grip" title="ziehen zum Sortieren" aria-hidden="true">⠿</span>' +
                    '<span class="box" role="checkbox" tabindex="0"></span>' +
                    '<img class="thumb" loading="lazy" alt="" src="cb/' + s.key + '.jpg" onerror="this.remove()">' +
                    '<span class="name"></span>' +
                    '<span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"/></svg></span>' +
                    '<button class="topool" title="in den Pool" aria-label="in den Pool">×</button>' +
                    '</div>' +
                    '<div class="desc"><div class="descInner">' +
                    (s.uncertain ? '<p class="warn"></p>' : '') +
                    '<div class="shots">' +
                    '<img class="shot" loading="lazy" alt="" src="cb/' + s.key + '.jpg" onerror="this.remove()">' +
                    '<img class="shot" loading="lazy" alt="" src="cb/' + s.key + '-2.jpg" onerror="this.remove()">' +
                    '</div>' +
                    '<p class="credit"></p>' +
                    '<p class="text"></p>' +
                    '</div></div>';

                const box = el.querySelector('.box');
                box.textContent = done ? '✓' : '';
                box.setAttribute('aria-checked', done ? 'true' : 'false');
                box.setAttribute('aria-label', pick(s.name));
                el.querySelector('.name').textContent = pick(s.name);
                el.querySelector('.text').textContent = pick(s.blurb);
                if (s.credit) el.querySelector('.credit').textContent = s.credit;
                el.querySelectorAll('.shot').forEach(im => { im.alt = pick(s.name); });
                if (s.uncertain) el.querySelector('.warn').textContent = '⚠ ' + (s.note ? pick(s.note) : u.warn);

                el.querySelector('.row').addEventListener('click', () => {
                    open[key] = !open[key];
                    el.classList.toggle('open', open[key]);
                    save();
                });
                box.addEventListener('click', e => { e.stopPropagation(); toggleDone(key, el); });
                box.addEventListener('keydown', e => {
                    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); toggleDone(key, el); }
                });
                el.dataset.key = key;
                const grip = el.querySelector('.grip');
                grip.draggable = true;
                grip.addEventListener('click', e => e.stopPropagation());
                grip.addEventListener('dragstart', e => {
                    dragEl = el;
                    e.dataTransfer.effectAllowed = 'move';
                    try { e.dataTransfer.setData('text/plain', key); } catch (_) { }
                    if (e.dataTransfer.setDragImage) e.dataTransfer.setDragImage(el, 24, 24);
                    setTimeout(() => el.classList.add('dragging'), 0);
                });
                grip.addEventListener('dragend', () => {
                    el.classList.remove('dragging');
                    if (dragEl) {
                        const domKeys = [...$('list').children].map(x => x.dataset.key);
                        order = [...domKeys, ...order.filter(k => !domKeys.includes(k))];
                        save();
                    }
                    dragEl = null;
                    render();
                });
                el.querySelector('.topool').addEventListener('click', e => { e.stopPropagation(); moveToPool(key); });
                const th = el.querySelector('.thumb');
                if (th) th.addEventListener('click', e => { e.stopPropagation(); openLightbox(th.src, pick(s.name)); });

                list.appendChild(el);
            });
            renderPool();
            updateProgress();
        }

        function renderPool() {
            const pu = POOL_UI[lang];
            const pooled = order.filter(k => byKey[k] && pool.has(k)).map(k => byKey[k]);
            $('pool-title').textContent = pu.title;
            $('pool-count').textContent = pooled.length;
            $('pool').classList.toggle('open', poolOpen);
            const body = $('pool-list');
            body.innerHTML = '';
            if (!pooled.length) {
                const empty = document.createElement('div');
                empty.className = 'poolempty';
                empty.textContent = pu.empty;
                body.appendChild(empty);
                return;
            }
            pooled.forEach(s => {
                const isOpen = !!open[s.key];
                const it = document.createElement('div');
                it.className = 'poolitem' + (isOpen ? ' open' : '');
                it.innerHTML =
                    '<div class="poolrow">' +
                    '<img class="thumb" loading="lazy" alt="" src="cb/' + s.key + '.jpg" onerror="this.remove()">' +
                    '<span class="poolname"></span>' +
                    '<span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"/></svg></span>' +
                    '<button class="topmain" title="nach oben holen" aria-label="nach oben holen">+</button>' +
                    '</div>' +
                    '<div class="desc"><div class="descInner">' +
                    '<div class="shots">' +
                    '<img class="shot" loading="lazy" alt="" src="cb/' + s.key + '.jpg" onerror="this.remove()">' +
                    '<img class="shot" loading="lazy" alt="" src="cb/' + s.key + '-2.jpg" onerror="this.remove()">' +
                    '</div>' +
                    '<p class="credit"></p>' +
                    '<p class="text"></p>' +
                    '</div></div>';
                it.querySelector('.poolname').textContent = pick(s.name);
                it.querySelector('.text').textContent = pick(s.blurb);
                if (s.credit) it.querySelector('.credit').textContent = s.credit;
                it.querySelectorAll('.shot').forEach(im => { im.alt = pick(s.name); });
                it.querySelector('.poolrow').addEventListener('click', () => {
                    open[s.key] = !open[s.key];
                    it.classList.toggle('open', open[s.key]);
                    save();
                });
                it.querySelector('.topmain').addEventListener('click', e => { e.stopPropagation(); moveToMain(s.key); });
                const pth = it.querySelector('.thumb');
                if (pth) pth.addEventListener('click', e => { e.stopPropagation(); openLightbox(pth.src, pick(s.name)); });
                body.appendChild(it);
            });
        }

        function moveItem(key, dir) {
            const act = activeKeys();
            const i = act.indexOf(key), j = i + dir;
            if (j < 0 || j >= act.length) return;
            const a = order.indexOf(key), b = order.indexOf(act[j]);
            const tmp = order[a]; order[a] = order[b]; order[b] = tmp;
            save(); render();
        }

        function moveToPool(key) { pool.add(key); open[key] = false; save(); render(); }
        function moveToMain(key) { pool.delete(key); order = [key, ...order.filter(k => k !== key)]; save(); render(); }

        function toggleDone(key, el) {
            state[key] = !state[key];
            const done = !!state[key];
            el.classList.toggle('done', done);
            const box = el.querySelector('.box');
            box.textContent = done ? '✓' : '';
            box.setAttribute('aria-checked', done ? 'true' : 'false');
            save();
            updateProgress();
        }

        /* ---- wiring ---- */
        document.querySelectorAll('.lang').forEach(b =>
            b.addEventListener('click', () => { lang = b.dataset.l; save(); syncLangToUrl(); render(); }));
        $('btn-reset').addEventListener('click', () => { state = {}; save(); render(); });
        $('pool-head').addEventListener('click', () => {
            poolOpen = !poolOpen; $('pool').classList.toggle('open', poolOpen); save();
        });

        // mouse drag-reorder of the active list (grip handle sets dragEl)
        $('list').addEventListener('dragover', e => {
            if (!dragEl) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            const list = $('list');
            const after = [...list.children].find(c => {
                if (c === dragEl) return false;
                const rect = c.getBoundingClientRect();
                return e.clientY < rect.top + rect.height / 2;
            });
            if (after) list.insertBefore(dragEl, after);
            else list.appendChild(dragEl);
        });
        $('list').addEventListener('drop', e => e.preventDefault());

        syncLangToUrl();
        render();
    </script>
