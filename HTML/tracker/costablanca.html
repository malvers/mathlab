<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Highlights Costa Blanca — Doc Alvers</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="icon" href="icon.svg" type="image/svg+xml">

    <style>
        /* ---- tracker palette (same as the Wander-Checkliste) ---- */
        :root {
            --bg: rgb(8, 20, 42);
            --bg-light: rgb(14, 36, 78);
            --orange: rgb(245, 194, 66);
            --red: rgb(176, 36, 24);
            --green: rgb(121, 158, 49);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: #fff;
            /* content in Arial for readability — Orbitron stays on title + buttons */
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            padding-bottom: 24px;
        }

        /* ---------------- app header ---------------- */
        header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: linear-gradient(180deg, var(--bg-light), var(--bg));
            border-bottom: 1px solid rgba(245, 194, 66, 0.3);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .back {
            color: var(--orange);
            text-decoration: none;
            font-size: 14px;
            padding: 12px 12px;
            border: 1px solid rgba(245, 194, 66, 0.4);
            border-radius: 10px;
            white-space: nowrap;
            min-height: 44px;
            display: flex;
            align-items: center;
        }

        h1 { font-family: 'Orbitron', sans-serif; font-size: 15px; letter-spacing: 1.5px; color: var(--orange); flex: 1; }

        .langs { display: flex; gap: 9px; }

        .lang {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            padding: 12px 12px;
            min-height: 44px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: transparent;
            color: #cdd8ec;
            cursor: pointer;
        }

        .lang.active { background: var(--green); border-color: var(--green); color: #fff; }

        /* ---------------- tagline ---------------- */
        #tagline { padding: 12px 16px 2px 16px; color: #9fb6dc; font-size: 16px; }

        /* ---------------- progress ---------------- */
        #progress-wrap { padding: 10px 16px 4px 16px; }

        #progress-bar {
            height: 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.12);
            overflow: hidden;
        }

        #progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 999px;
            background-image: linear-gradient(90deg, var(--red), var(--orange), var(--green));
            background-size: 100% 100%;
            transition: width 0.25s;
        }

        #progress-text { font-size: 14px; color: #9fb6dc; margin-top: 6px; }

        #progress-text .go { color: var(--green); font-weight: 700; }

        /* ---------------- spot list ---------------- */
        #list { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }

        .spot {
            background: var(--bg-light);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            overflow: hidden;
        }

        .spot.done { border-color: rgba(121, 158, 49, 0.7); }

        .spot .row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            cursor: pointer;
            user-select: none;
            min-height: 52px;
        }

        .spot .box {
            width: 26px;
            height: 26px;
            flex: 0 0 auto;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            color: #fff;
            cursor: pointer;
        }

        .spot .box:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }

        .spot.done .box { background: var(--green); border-color: var(--green); }

        .spot .name { flex: 1; font-size: 17px; line-height: 1.4; }

        .spot.done .name { color: #9fb6dc; text-decoration: line-through; text-decoration-thickness: 1px; }

        .spot .chev {
            flex: 0 0 auto;
            color: #9fb6dc;
            font-size: 15px;
            transition: transform 0.28s ease;
            padding: 0 2px;
        }

        .spot.open .chev { transform: rotate(180deg); }

        /* collapsible description — animate via grid-template-rows 0fr -> 1fr */
        .spot .desc {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.28s ease;
        }

        .spot.open .desc { grid-template-rows: 1fr; }

        .spot .descInner { overflow: hidden; }

        .spot .text {
            padding: 2px 16px 14px 52px;
            color: #dbe4f4;
            font-size: 16px;
            line-height: 1.62;
        }

        /* photos in the description — self-hiding (missing files remove themselves).
           full aspect ratio, no crop (plenty of room); only capped in size */
        .spot .shots { display: block; padding: 4px 16px 6px 52px; }
        .spot .shots:empty { display: none; }

        .spot .shot {
            display: block;
            max-width: 100%;
            max-height: 460px;
            height: auto;
            width: auto;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.04);
            margin-bottom: 8px;
        }

        .spot .credit {
            padding: 0 16px 8px 52px;
            color: #7f93b5;
            font-size: 12px;
            line-height: 1.4;
        }

        .spot .credit:empty { display: none; }

        .spot .warn {
            margin: 0 16px 8px 52px;
            padding: 8px 10px;
            border-radius: 10px;
            background: rgba(245, 194, 66, 0.12);
            border: 1px solid rgba(245, 194, 66, 0.4);
            color: var(--orange);
            font-size: 14px;
            line-height: 1.5;
        }

        /* ---------------- actions ---------------- */
        #actions { display: flex; gap: 10px; padding: 6px 12px 18px 12px; }

        .btn {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            letter-spacing: 1px;
            padding: 14px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
        }

        .btn.reset { background: transparent; border: 1px solid rgba(255, 255, 255, 0.3); color: #cdd8ec; }

        /* ---------------- VSB seal footer ---------------- */
        footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 12px 16px 24px 16px;
        }

        .sealsvg { width: 101px; height: 101px; }

        .motto {
            font-family: 'Times New Roman', Times, serif;
            font-style: italic;
            letter-spacing: 1px;
            color: #9fb6dc;
            font-size: 12px;
        }

        /* ---------------- Solita sign-off card ---------------- */
        .signoff {
            display: flex;
            align-items: center;
            gap: 14px;
            max-width: 420px;
            margin: 6px auto 30px auto;
            padding: 14px 16px;
            background: var(--bg-light);
            border: 1px solid rgba(245, 194, 66, 0.28);
            border-radius: 16px;
        }

        .signoff .avatar {
            width: 76px;
            height: 76px;
            flex: 0 0 auto;
            border-radius: 14px;
            object-fit: cover;
            object-position: center 20%;
            border: 1px solid rgba(245, 194, 66, 0.4);
        }

        .signoff .who { display: flex; flex-direction: column; gap: 1px; min-width: 0; }

        .signoff .nm {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            letter-spacing: 0.5px;
            color: var(--orange);
        }

        .signoff .ti { font-size: 12px; color: #cdd8ec; }

        .signoff .sub { font-size: 10.5px; color: #7f93b5; margin-top: 3px; }
    </style>
</head>

    <script>
        'use strict';

        /* ---- content: Team-Eva Costa-Blanca spots, researched blurbs (DE/EN/ES) ---- */
        const SPOTS = [
    {
        "key": "altea",
        "name": {
            "de": "Altea – Altstadt",
            "en": "Altea Old Town",
            "es": "Altea – Casco Antiguo"
        },
        "uncertain": false,
        "blurb": {
            "de": "Über der Altstadt von Altea thront die Iglesia de Nuestra Señora del Consuelo mit ihren blau-weiß gekachelten Zwillingskuppeln — umgeben von einem Labyrinth weiß getünchter, bougainvillea-umrankter Gassen, in denen seit Generationen Künstler zu Hause sind. Von der Plaza de la Iglesia führt der Weg weiter zum Portal Vell und zum Mirador de los Cronistas, wo sich die ganze Bucht von Altea bis Benidorm und zum Peñón de Ifach bei Calpe öffnet. Geh am besten am späten Nachmittag hinauf: Stell das Auto unten am Paseo Marítimo ab und nimm die gepflasterten Stufen zu Fuß, denn oben einen Parkplatz zu finden ist quasi aussichtslos. Und dann auf eine Terrasse am Kirchplatz, ein Glas in der Hand, während die blauen Kuppeln das letzte Sonnenlicht einfangen.",
            "en": "Crowning Altea's old town, the Iglesia de Nuestra Señora del Consuelo lifts its twin blue-and-white tiled domes above a maze of whitewashed, bougainvillea-draped lanes that have drawn artists here for generations. Wander from the Plaza de la Iglesia to the Portal Vell and on to the Mirador de los Cronistas, where the whole Bay of Altea opens up toward Benidorm and the Peñón de Ifach at Calpe. Come up in the late afternoon: leave the car down on the Paseo Marítimo and climb the cobbled steps on foot, since parking at the top is near-impossible. Then settle onto a terrace on the church square with a drink as the blue domes catch the last of the sun.",
            "es": "Coronando el casco antiguo de Altea, la Iglesia de Nuestra Señora del Consuelo alza sus cúpulas gemelas de azulejos azules y blancos sobre un laberinto de callejuelas encaladas y cubiertas de buganvillas, hogar de artistas desde hace generaciones. Desde la Plaza de la Iglesia puedes acercarte al Portal Vell y al Mirador de los Cronistas, donde se abre toda la bahía de Altea hacia Benidorm y el Peñón de Ifach de Calpe. Sube a última hora de la tarde: deja el coche abajo, en el Paseo Marítimo, y afronta a pie las escaleras empedradas, porque aparcar arriba es casi imposible. Luego siéntate en una terraza de la plaza de la iglesia con algo para beber mientras las cúpulas azules atrapan la última luz del día."
        },
        "credit": "Foto: ConradMoeller · CC BY-SA 2.5 · Wikimedia Commons"
    },
    {
        "key": "valencia",
        "name": {
            "de": "Valencia",
            "en": "Valencia",
            "es": "Valencia"
        },
        "uncertain": false,
        "blurb": {
            "de": "Nur gut anderthalb Stunden nördlich über die AP-7 liegt eine Stadt, die Zukunft und Mittelalter mühelos verbindet: Calatravas futuristische Ciudad de las Artes y las Ciencias im alten Turia-Flussbett mit dem Oceanogràfic, dem größten Aquarium Europas, und wenige Straßen weiter die gotische Seidenbörse La Lonja mit ihren gedrehten Säulen und der Jugendstil-Markthalle Mercado Central. Wer will, steigt auf den Miguelete für den Blick über die Altstadt oder spaziert durch den 9 km langen Turia-Park, der sich als grünes Band um alles legt. Ein Tipp aus Erfahrung: die Tickets für Oceanogràfic und Hemisfèric vorab online buchen (Kombi spart Geld) und früh kommen, bevor der Andrang kommt. Und die echte Paella Valenciana gibt es in aller Ruhe als Mittagessen draußen in der Albufera, dort wo der Reis wächst – genau so, wie es die Einheimischen halten.",
            "en": "Just over an hour and a half north on the AP-7, this is a city where the space-age and the medieval sit side by side: Calatrava's futuristic Ciudad de las Artes y las Ciencias in the old Turia riverbed, home to the Oceanogràfic (Europe's largest aquarium), and a few streets away the Gothic Silk Exchange with its spiralling twisted columns and the Art Nouveau Mercado Central. Climb the Miguelete bell tower for old-town views, or wander the 9 km Jardín del Turia, the green ribbon that loops around it all. A little insider advice: book your Oceanogràfic and Hemisfèric tickets online ahead of time (the combined ticket saves money) and arrive early, before the City of Arts fills up at midday. And save room for the real thing — authentic paella Valenciana, eaten as a slow lunch out at the Albufera rice fields, just the way the locals do it.",
            "es": "A poco más de hora y media al norte por la AP-7, es una ciudad donde el futuro y la Edad Media conviven sin esfuerzo: la futurista Ciudad de las Artes y las Ciencias de Calatrava, en el antiguo cauce del Turia, con el Oceanogràfic, el mayor acuario de Europa, y a unas calles la gótica Lonja de la Seda con sus columnas retorcidas y el modernista Mercado Central. Sube al Miguelete para ver el casco antiguo desde lo alto o pasea por los 9 km del Jardín del Turia, la cinta verde que lo rodea todo. Un consejo práctico: reserva las entradas del Oceanogràfic y el Hemisfèric por internet con antelación (la entrada combinada sale más a cuenta) y llega temprano, antes de que la Ciudad de las Artes se llene a mediodía. Y deja hueco para lo auténtico: una buena paella valenciana, comida con calma al mediodía junto a los arrozales de la Albufera, como hacen los de aquí."
        },
        "credit": "Foto: Diego Delso · CC BY-SA 3.0 · Wikimedia Commons"
    },
    {
        "key": "alicante",
        "name": {
            "de": "Alicante",
            "en": "Alicante",
            "es": "Alicante"
        },
        "uncertain": false,
        "blurb": {
            "de": "Nur rund 50 Minuten südlich von Altea über die AP-7 (oder mit der TRAM, in Benidorm umsteigen) wartet die Hauptstadt der Costa Blanca — und über allem thront das Castillo de Santa Bárbara auf dem 166 m hohen Benacantil, eine der größten mittelalterlichen Festungen Spaniens mit maurischen Wurzeln aus dem 9. Jahrhundert und einem Traumblick über Bucht, Hafen und Strände. Spar dir den steilen Aufstieg: Nimm den Aufzug (ascensor) vom Tunneleingang gegenüber der Playa del Postiguet direkt hinauf — auf das Burggelände selbst kommst du gratis. Unten schlenderst du über die Explanada de España mit ihrem welligen Mosaik aus rund 6,6 Millionen Marmorsteinchen und durch das blumengeschmückte Altstadtviertel Barrio de Santa Cruz; und such vom Strand aus die „Cara del Moro\", das Gesicht des Mauren im Fels. Am schönsten am späten Nachmittag, wenn die Sonne über der Bucht versinkt.",
            "en": "Just about 50 minutes south of Altea via the AP-7 (or by TRAM, changing at Benidorm), the capital of the Costa Blanca is crowned by the Castillo de Santa Bárbara — one of Spain's largest medieval fortresses, perched atop the 166 m Mount Benacantil, with 9th-century Moorish roots and sweeping views over the bay, marina and beaches. Skip the steep climb: take the lift (ascensor) from the tunnel entrance across the road from Playa del Postiguet straight to the top — entry to the castle grounds is free. Down below, stroll the palm-lined Explanada de España with its wavy mosaic of roughly 6.6 million marble tiles, wander the flower-decked lanes of the old Barrio de Santa Cruz, and from the beach look up for the \"Cara del Moro,\" the Face of the Moor in the cliff. Go in the late afternoon for the best light and a sunset over the bay.",
            "es": "A solo unos 50 minutos al sur de Altea por la AP-7 (o en TRAM, haciendo transbordo en Benidorm), la capital de la Costa Blanca está coronada por el Castillo de Santa Bárbara: una de las mayores fortalezas medievales de España, en lo alto del monte Benacantil (166 m), con origen árabe del siglo IX y vistas increíbles sobre la bahía, el puerto y las playas. Ahórrate la subida a pie: coge el ascensor desde la entrada del túnel, frente a la Playa del Postiguet, que te lleva directo arriba — y la entrada al recinto del castillo es gratis. Abajo, pasea por la Explanada de España y su ondulante mosaico de unos 6,6 millones de teselas de mármol, piérdete por las callejuelas floridas del Barrio de Santa Cruz y, desde la playa, busca la \"Cara del Moro\" en la roca del acantilado. Ve a última hora de la tarde: la mejor luz y una puesta de sol sobre la bahía."
        },
        "credit": "Foto: Diego Delso · CC BY-SA 3.0 · Wikimedia Commons"
    },
    {
        "key": "denia",
        "name": {
            "de": "Dénia – mit dem Zug",
            "en": "Dénia – by train",
            "es": "Dénia – en tren"
        },
        "uncertain": false,
        "blurb": {
            "de": "Dénia ist ein Tagesausflug, der schon mit der Anreise beginnt: Von Altea fährst Du mit der TRAM Linie 1 bis Benidorm und steigst dort in die Linie 9 um, den historischen Trenet de la Marina von 1915, der sich durch Calp, Teulada und Gata de Gorgos an der Küste entlangschlängelt. Oben thront das maurische Castell de Dénia mit dem Palau del Governador und einem weiten Blick über den Hafen und das Montgó-Massiv, das mit 753 m über der Stadt aufragt. Dénia ist außerdem UNESCO-Stadt der Gastronomie — komm hungrig und reserviere Dir einen Mittagstisch für die berühmte gamba roja, die tiefrote Tiefsee-Garnele, einfach gegrillt mit Olivenöl und Meersalz (teuer, aber jeden Cent wert). Plane die Rückfahrt bewusst, denn die Linie 9 fährt seltener als die Linie 1.",
            "en": "Dénia is a day trip where the journey is half the joy: from Altea take TRAM Line 1 up to Benidorm, then change to Line 9 — the historic 1915 Trenet de la Marina — which hugs the coast and hills through Calp, Teulada and Gata de Gorgos before rolling right into town. Crowning the hill is the Moorish Castell de Dénia with its Palau del Governador and sweeping views over the marina and the 753 m Montgó massif that looms above everything. Dénia is a UNESCO Creative City of Gastronomy, so come hungry and book a lunch table for the gamba roja — the prized deep-red prawn from 500–800 m down, sweeter than any ordinary one and best simply grilled with olive oil and sea salt (pricey, and worth it). There's no direct train, so mind the change at Benidorm and time your return, since Line 9 runs less often than Line 1.",
            "es": "Dénia es una excursión donde el propio viaje ya es un placer: desde Altea toma el TRAM Línea 1 hasta Benidorm y allí cambia a la Línea 9, el histórico Trenet de la Marina de 1915, que bordea la costa y las colinas pasando por Calp, Teulada y Gata de Gorgos hasta llegar al centro. En lo alto se alza el Castell de Dénia de origen árabe, con el Palau del Governador y vistas amplias sobre el puerto y el macizo del Montgó, que domina la ciudad con sus 753 m. Dénia es Ciudad Creativa de la Gastronomía de la UNESCO, así que ven con hambre y reserva mesa para la gamba roja, ese preciado marisco rojo intenso de aguas profundas, más dulce que cualquier otra y mejor a la plancha con aceite de oliva y sal marina (cara, pero lo vale). No hay tren directo, así que no olvides el cambio en Benidorm y calcula bien la vuelta, porque la Línea 9 pasa con menos frecuencia que la Línea 1."
        },
        "credit": "Foto: Diego Delso · CC BY-SA 4.0 · Wikimedia Commons"
    },
    {
        "key": "tarbena",
        "name": {
            "de": "Tárbena – Can Pinet",
            "en": "Tárbena – Can Pinet",
            "es": "Tárbena – Can Pinet"
        },
        "uncertain": false,
        "blurb": {
            "de": "Ein winziges weißes Bergdorf über Altea, das seit über 400 Jahren mallorquinisch spricht — nach der Morisken-Vertreibung 1609 mit Familien von Mallorca neu besiedelt, und man hört es bis heute am balearischen Artikel „sa\". Im rustikalen Can Pinet, gleich neben der Dorfkirche, prasselt das Feuer mitten im Speiseraum, und das Haus-Signature ist Sobrassada amb mel: mallorquinische Streichwurst, mit Honig beträufelt. Kommt zum Mittagessen (montags zu, ca. 8–17:30 Uhr), bestellt genau das und nehmt ein vakuumverpacktes Stück mit nach Hause — und auf dem Weg hinauf lohnt der Stopp an den Wasserfällen der Fonts de l'Algar.",
            "en": "A tiny white mountain village above Altea that has spoken Mallorquí for over 400 years — resettled with families from Mallorca after the 1609 Morisco expulsion, and you can still hear it in the Balearic article \"sa\". At the rustic Can Pinet, right beside the parish church, a fireplace crackles in the middle of the dining room and the house signature is sobrassada amb mel: Mallorcan cured sausage drizzled with honey. Come for lunch (closed Mondays, roughly 8:00–17:30), order exactly that, and grab a vacuum-packed sobrasada to take home — and on the drive up, break the trip at the Fonts de l'Algar waterfalls.",
            "es": "Un diminuto pueblo blanco de montaña por encima de Altea que habla mallorquín desde hace más de 400 años — repoblado con familias de Mallorca tras la expulsión morisca de 1609, y todavía se nota en el artículo salado «sa». En el rústico Can Pinet, junto a la iglesia parroquial, la chimenea crepita en medio del comedor y la especialidad de la casa es la sobrassada amb mel: embutido mallorquín regado con miel. Id a mediodía (cerrado los lunes, de 8:00 a 17:30 aprox.), pedid justo ese plato y llevaos una sobrasada envasada al vacío; de camino, parad en las cascadas de las Fonts de l'Algar."

            "es": "Cada domingo, todo el año, el gran aparcamiento de la Avenida del Albir se convierte en uno de los mejores mercadillos de la Costa Blanca — reconocido por Sanidad como uno de los mejor gestionados de la Comunidad Valenciana. Se divide con claridad en dos zonas: fruta y verdura de temporada, miel local, especias y pan recién hecho por un lado; ropa, piel, bisutería y artesanía por el otro. Está junto al Paseo de las Estrellas, el precioso paseo marítimo de l'Albir bordeado de palmeras, así que puedes pasar de los puestos a un café frente al mar — o sumar la ruta llana de 2,4 km hasta el Faro del Albir. Ve temprano, antes de las 10:00: aún se aparca fácil y el género está en su mejor momento, y aunque muchos puestos ya aceptan tarjeta, llevar algo de efectivo siempre viene bien."

            "en": "Just a 30-40 minute drive up the coast from Altea, Moraira is an easygoing, low-rise seaside town between Calpe and Jávea, where the little Castillo de Moraira — with its curious 'ox-hoof' (pezuña de buey) shape — sits right on Playa de l'Ampolla, a leftover from the days of pirate lookouts. Walk the clifftop path up to the Torre del Cap d'Or above El Portet for wide sea views, then wander down to the marina where the fishing lonja and portside restaurants serve the day's catch. Come on a Friday morning for one of the biggest markets on the Costa Blanca, then head over to El Portet's turquoise cove to swim and have lunch — but get there early, as parking is tiny; better to leave the car in town and walk or take the little beach shuttle. And do try the local Moscatel wine while you're at it.",

                    '</div>' +
                    '<div class="desc"><div class="descInner">' +
                    (s.uncertain ? '<p class="warn"></p>' : '') +
                    '<div class="shots">' +
                    '<img class="shot" loading="lazy" alt="" src="cb/' + s.key + '.jpg" onerror="this.remove()">' +
                    '<img class="shot" loading="lazy" alt="" src="cb/' + s.key + '-2.jpg" onerror="this.remove()">' +
                    '</div>' +
                    '<p class="credit"></p>' +
                    '<p class="text"></p>' +
                    '</div></div>';

                const box = el.querySelector('.box');
                box.textContent = done ? '✓' : '';
                box.setAttribute('aria-checked', done ? 'true' : 'false');
                box.setAttribute('aria-label', pick(s.name));
                el.querySelector('.name').textContent = pick(s.name);
                el.querySelector('.text').textContent = pick(s.blurb);
                if (s.credit) el.querySelector('.credit').textContent = s.credit;
                el.querySelectorAll('.shot').forEach(im => { im.alt = pick(s.name); });
                if (s.uncertain) el.querySelector('.warn').textContent = '⚠ ' + (s.note ? pick(s.note) : u.warn);

                el.querySelector('.row').addEventListener('click', () => {
                    open[s.key] = !open[s.key];
                    el.classList.toggle('open', open[s.key]);
                    save();
                });
                box.addEventListener('click', e => { e.stopPropagation(); toggleDone(s.key, el); });
                box.addEventListener('keydown', e => {
                    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); toggleDone(s.key, el); }
                });

                list.appendChild(el);
            });
            updateProgress();
        }

        function toggleDone(key, el) {
            state[key] = !state[key];
            const done = !!state[key];
            el.classList.toggle('done', done);
            const box = el.querySelector('.box');
            box.textContent = done ? '✓' : '';
            box.setAttribute('aria-checked', done ? 'true' : 'false');
            save();
            updateProgress();
        }

        /* ---- wiring ---- */
        document.querySelectorAll('.lang').forEach(b =>
            b.addEventListener('click', () => { lang = b.dataset.l; save(); render(); }));
        $('btn-reset').addEventListener('click', () => { state = {}; save(); render(); });

        render();
    </script>
</body>

</html>
