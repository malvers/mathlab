<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Doc Alvers Tracker — dein Weg, aufgezeichnet</title>
    <meta name="description"
        content="Schlanker GPS-Tracker: öffnen, START, laufen. Kein Konto, ehrliche Anzeige, GPX-Export, Hintergrund-Aufzeichnung.">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: rgb(8, 20, 42);
            --bg2: rgb(14, 36, 78);
            --orange: rgb(245, 194, 66);
            --orange-rgb: 245, 194, 66;
            --red: rgb(176, 36, 24);
            --green: rgb(121, 158, 49);
            --ink: #f4f4f4;
            --muted: rgba(244, 244, 244, 0.6);
            --line: rgba(244, 244, 244, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100dvh;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: clamp(28px, 6vw, 48px) 24px;
            background:
                radial-gradient(1200px 600px at 50% -10%, rgba(var(--orange-rgb), 0.08), transparent 60%),
                linear-gradient(180deg, var(--bg) 0%, rgb(5, 13, 30) 100%);
            color: var(--ink);
            font-family: 'Orbitron', system-ui, -apple-system, sans-serif;
            font-weight: 400;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            -webkit-text-size-adjust: 100%;
        }

        /* ---- Shared brand header on top ---- */
        .hero {
            text-align: center;
            max-width: 560px;
            margin: 0 auto clamp(28px, 6vw, 44px);
        }

        .hero-icon {
            width: clamp(76px, 20vw, 100px);
            height: auto;
            display: block;
            margin: 0 auto 16px;
            filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.45));
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: clamp(2rem, 8vw, 3rem);
            letter-spacing: 1px;
            line-height: 1.05;
            margin-bottom: 10px;
        }

        .sub {
            color: var(--orange);
            font-size: clamp(0.95rem, 3.4vw, 1.05rem);
            font-weight: 600;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .quip {
            color: var(--muted);
            font-size: clamp(0.8rem, 3vw, 0.95rem);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
        }

        .smiley {
            font-size: clamp(1.8rem, 7vw, 2.4rem);
            line-height: 1;
            margin-bottom: 16px;
        }

        .kiss {
            font-size: clamp(0.78rem, 2.8vw, 0.92rem);
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .kiss b {
            color: var(--orange);
            font-weight: 600;
        }

        /* ---- Two action tiles: side by side on desktop, stacked on mobile ---- */
        .tiles {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: stretch;
            gap: clamp(16px, 3vw, 24px);
            width: 100%;
            max-width: 760px;
        }

        .card {
            flex: 1 1 300px;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(14, 36, 78, 0.45);
            border: 1px solid rgba(var(--orange-rgb), 0.3);
            border-radius: 20px;
            box-shadow: 0 0 28px rgba(var(--orange-rgb), 0.12);
            padding: clamp(26px, 5vw, 34px) clamp(22px, 5vw, 30px);
            text-align: center;
        }

        .tile-icon {
            width: clamp(50px, 14vw, 62px);
            height: auto;
            display: block;
            margin: 0 auto 14px;
        }

        .card h2 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: clamp(1.05rem, 4vw, 1.25rem);
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .card .line {
            color: var(--muted);
            font-size: 0.96rem;
            margin-bottom: 22px;
            max-width: 26ch;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: var(--orange);
            color: #14110a;
            font-family: 'Orbitron', sans-serif;
            font-weight: 400;
            letter-spacing: 1.5px;
            font-size: clamp(0.95rem, 3vw, 1.05rem);
            text-decoration: none;
            cursor: pointer;
            /* push the CTA (and note below it) to the bottom so both tiles align */
            margin-top: auto;
            /* dark-on-light reads sharper with subpixel AA than the page-wide grayscale smoothing */
            -webkit-font-smoothing: subpixel-antialiased;
            -moz-osx-font-smoothing: auto;
            transition: transform 0.12s ease, box-shadow 0.2s ease;
            box-shadow: 0 12px 34px rgba(var(--orange-rgb), 0.28);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 40px rgba(var(--orange-rgb), 0.38);
        }

        .note {
            margin-top: 12px;
            font-size: 0.8rem;
            color: var(--muted);
        }
    </style>
</head>

<body>
    <header class="hero">
        <img class="hero-icon" src="icon.svg" alt="Doc Alvers Tracker">
        <h1>Doc Alvers Tracker</h1>
        <div class="sub">Der Weg ist das Ziel.</div>
        <p class="quip">Tracken schadet nicht</p>
        <div class="smiley">😎</div>
        <p class="kiss">Design-Philosophie<br><b>KISS</b></p>
    </header>

    <div class="tiles">
        <!-- Tile 1 — open in the browser -->
        <div class="card">
            <svg class="tile-icon" viewBox="0 0 64 64" role="img" aria-label="Im Browser öffnen">
                <rect width="64" height="64" rx="14" fill="#08142a" />
                <circle cx="32" cy="32" r="14" fill="none" stroke="#f5c242" stroke-width="2" />
                <line x1="18" y1="32" x2="46" y2="32" stroke="#f5c242" stroke-width="2" />
                <ellipse cx="32" cy="32" rx="7" ry="14" fill="none" stroke="#f5c242" stroke-width="2" />
            </svg>
            <h2>Im Browser</h2>
            <p class="line">Öffnen. Starten. Laufen.</p>
            <a class="btn" href="tracker.html">ÖFFNEN</a>
        </div>

        <!-- Tile 2 — download the Android APK -->
        <div class="card">
            <svg class="tile-icon" viewBox="0 0 64 64" role="img" aria-label="Android-App herunterladen">
                <rect width="64" height="64" rx="14" fill="#08142a" />
                <path d="M32,16 V37" fill="none" stroke="#f5c242" stroke-width="2.5" stroke-linecap="round" />
                <path d="M22,29 L32,40 L42,29" fill="none" stroke="#f5c242" stroke-width="2.5" stroke-linecap="round"
                    stroke-linejoin="round" />
                <path d="M20,48 H44" fill="none" stroke="#f5c242" stroke-width="2.5" stroke-linecap="round" />
            </svg>
            <h2>Android-App</h2>
            <p class="line">Installieren. Starten. Laufen.</p>
            <a class="btn" href="doc-alvers-tracker.apk" download="doc-alvers-tracker.apk">INSTALLIEREN</a>
        </div>
    </div>
</body>

</html>
