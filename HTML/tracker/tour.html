<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Doc Alvers Tracker — Tour</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <!-- shared viewer scaffold (theme · map · zoom · popup · overlay) + photo pins/lightbox -->
    <link rel="stylesheet" href="../js/viewer-base.css">
    <link rel="stylesheet" href="../js/photo-layer.css">
    <style>
        /* lift the zoom buttons above the elevation profile + Etappen button (shared default is +18px) */
        :root { --zoom-bottom: calc(env(safe-area-inset-bottom, 0px) + 132px); }

        /* ---- Header: tour name + combined stat tiles ---- */
        #hdr {
            position: fixed; top: 0; left: 0; right: 0; z-index: 500;
            padding: 14px 16px 26px;
            padding-top: max(14px, env(safe-area-inset-top));
            background: linear-gradient(180deg, rgba(8, 20, 42, 0.96) 0%, rgba(8, 20, 42, 0.85) 62%, rgba(8, 20, 42, 0) 100%);
            text-align: center; pointer-events: none;
        }
        #hdr h1 {
            margin: 0; font-size: clamp(1rem, 4.6vw, 1.45rem); font-weight: 900;
            letter-spacing: 1px; color: var(--orange);
        }
        #stats {
            display: flex; justify-content: center; flex-wrap: wrap;
            gap: clamp(10px, 4.5vw, 30px); margin-top: 12px;
        }
        .stat { display: flex; flex-direction: column; align-items: center; min-width: 44px; }
        .stat b { font-size: clamp(0.95rem, 4.2vw, 1.3rem); font-weight: 700; color: var(--orange); }
        .stat small { font-size: 0.52rem; letter-spacing: 2px; color: rgba(255, 255, 255, 0.55); margin-top: 5px; }

        /* ---- Elevation profile (bottom, above the legs button) ---- */
        #profile {
            position: fixed; left: 0; right: 0;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 52px);
            z-index: 480; height: 74px; pointer-events: none;
            background: linear-gradient(0deg, rgba(8, 20, 42, 0.92), rgba(8, 20, 42, 0));
        }
        #profile svg { width: 100%; height: 100%; display: block; }

        /* ---- Etappen (legs) sheet ---- */
        #legs-btn {
            position: fixed; left: 50%; transform: translateX(-50%);
            bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
            z-index: 560; padding: 8px 18px; border: 1px solid rgba(245, 194, 66, 0.5);
            border-radius: 999px; background: rgba(8, 20, 42, 0.86); color: var(--orange);
            font-family: 'Orbitron', sans-serif; font-size: 0.66rem; letter-spacing: 1px;
            cursor: pointer; backdrop-filter: blur(6px); box-shadow: 0 3px 12px rgba(0, 0, 0, 0.45);
        }
        #legs-panel {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 570;
            max-height: 66vh; overflow-y: auto;
            padding: 16px 16px calc(env(safe-area-inset-bottom, 0px) + 18px);
            background: rgba(8, 20, 42, 0.97); border-top: 1px solid rgba(255, 255, 255, 0.12);
            transform: translateY(100%); transition: transform 0.25s ease;
            box-shadow: 0 -8px 26px rgba(0, 0, 0, 0.5);
        }
        #legs-panel.open { transform: translateY(0); }
        #legs-title {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.8rem; letter-spacing: 1px; color: var(--orange); margin-bottom: 12px;
        }
        #legs-close { background: none; border: none; color: rgba(255, 255, 255, 0.7); font-size: 1.3rem; cursor: pointer; }
        .leg {
            display: flex; align-items: center; gap: 10px;
            padding: 11px 6px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); cursor: pointer;
        }
        .leg:last-child { border-bottom: none; }
        .leg-n {
            flex: none; width: 26px; height: 26px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: var(--green); color: #fff; font: 700 0.7rem Arial, sans-serif;
        }
        .leg-main { flex: 1; min-width: 0; }
        .leg-name { font-size: 0.74rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .leg-meta { font-family: system-ui, sans-serif; font-size: 0.66rem; color: rgba(255, 255, 255, 0.5); margin-top: 2px; }

        /* (base theme, #map, #zoom-in/out and #msg live in the shared viewer-base.css) */
    </style>
</head>

<body>
    <div id="map"></div>
    <header id="hdr">
        <h1 id="tour-name">Tour</h1>
        <div id="stats"></div>
    </header>
    <div id="profile"><svg viewBox="0 0 1000 74" preserveAspectRatio="none" aria-hidden="true"></svg></div>
    <button id="fit-btn" type="button" data-mode="fit" aria-label="Ganze Tour zeigen" title="Ganze Tour zeigen">
        <svg class="ic-fit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5a1 1 0 0 1 1-1h4"></path><path d="M20 9V5a1 1 0 0 0-1-1h-4"></path><path d="M4 15v4a1 1 0 0 0 1 1h4"></path><path d="M20 15v4a1 1 0 0 1-1 1h-4"></path></svg>
        <svg class="ic-custom" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><rect x="12" y="9" width="6" height="5" rx="1"></rect></svg>
    </button>
    <button id="zoom-in" type="button" aria-label="Hineinzoomen"></button>
    <button id="zoom-out" type="button" aria-label="Herauszoomen"></button>
    <button id="legs-btn" type="button">Etappen ▴</button>
    <div id="legs-panel">
        <div id="legs-title"><span>Etappen</span><button id="legs-close" type="button" aria-label="Schließen">&times;</button></div>
        <div id="legs-list"></div>
        <div style="text-align:center;margin-top:14px">
            <a href="index.html" style="color:var(--orange);text-decoration:none;font-size:0.66rem;letter-spacing:1px">Doc Alvers Tracker →</a>
        </div>
    </div>
    <div id="foot"></div>
    <div id="msg">Lade Tour …</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet-hotline@0.4.0/dist/leaflet.hotline.min.js"></script>
    <script src="../js/track-render.js"></script>
    <script src="../js/photo-layer.js"></script>
    <script src="../js/track-overlay.js"></script>
    <script src="../js/supa-gate.js"></script>
    <script src="../js/vendor/supabase.min.js"></script>
    <script src="../js/viewer-base.js"></script>
    <script>
        const $ = id => document.getElementById(id);
        const { esc, showMsg, hideMsg } = ViewerBase;   // shared theme/map/zoom/overlay scaffold
        const sb = ViewerBase.supa();
        if (!sb) { showMsg('<b style="color:var(--orange)">Bibliothek nicht geladen</b><br>Anderes Netz/Reload versuchen.'); throw new Error('supabase lib missing'); }
        const map = ViewerBase.createMap([51.05, 13.74], 11);
        let _fitBounds = null;                          // whole-tour bounds → the recenter button re-frames to it
        const _fitc = ViewerBase.fitControl(map, () => _fitBounds);

        const usesHotline = !!L.hotline;
        const trackLayer = L.layerGroup().addTo(map);
        const wpState = { waypoints: [], wpMarkers: [] };   // media pins — shared glue in TrackOverlay
        PhotoLayer.mountLightbox();
        map.on('zoomend', () => PhotoLayer.applyStackBadges(wpState.wpMarkers, map));

        const hav = TrackOverlay.haversine, fmtClock = TrackOverlay.fmtClock;
        function statTile(val, lbl) { return '<div class="stat"><b>' + val + '</b><small>' + lbl + '</small></div>'; }

        // Draw the elevation profile of the whole tour (all stages concatenated, cum-distance × altitude).
        function drawProfile(profPts) {
            const svg = $('profile').querySelector('svg');
            const withAlt = profPts.filter(p => p.alt != null);
            if (withAlt.length < 2) { $('profile').style.display = 'none'; return; }
            const W = 1000, H = 74, pad = 6;
            const maxD = profPts[profPts.length - 1].d || 1;
            let lo = Infinity, hi = -Infinity;
            withAlt.forEach(p => { if (p.alt < lo) lo = p.alt; if (p.alt > hi) hi = p.alt; });
            const span = Math.max(1, hi - lo);
            const x = d => (d / maxD) * W;
            const y = a => H - pad - ((a - lo) / span) * (H - 2 * pad);
            // build a path over points that have altitude (skip gaps)
            let dPath = '', started = false;
            profPts.forEach(p => {
                if (p.alt == null) { started = false; return; }
                dPath += (started ? 'L' : 'M') + x(p.d).toFixed(1) + ' ' + y(p.alt).toFixed(1) + ' ';
                started = true;
            });
            const area = 'M0 ' + H + ' ' + dPath.replace(/^M/, 'L') + 'L' + W + ' ' + H + ' Z';
            svg.innerHTML =
                '<path d="' + area + '" fill="rgba(245,194,66,0.14)"/>' +
                '<path d="' + dPath.trim() + '" fill="none" stroke="rgb(245,194,66)" stroke-width="1.6" vector-effect="non-scaling-stroke"/>';
        }

        // ---- entry: ?t=<folder slug> ----
        const slug = new URLSearchParams(location.search).get('t');
        if (!slug) { showMsg('Kein Tour-Link. Erwartet: <code>?t=name</code>'); throw new Error('no slug'); }

        (async function load() {
            let data;
            try {
                const { data: d, error } = await sb.rpc('get_shared_folder', { p_slug: slug });
                if (error) throw error;
                data = d;
            } catch (e) {
                showMsg('<b style="color:var(--orange)">Konnte die Tour nicht laden</b><br><span style="opacity:.7">' + esc(e.message || e) + '</span>');
                return;
            }
            if (!data || !Array.isArray(data.tracks) || !data.tracks.length) {
                showMsg('Tour nicht gefunden — Link ungültig oder nicht (mehr) öffentlich.');
                return;
            }
            $('tour-name').textContent = data.name || 'Tour';
            document.title = 'Tour — ' + (data.name || '');

            // chronological order (oldest stage first)
            const tracks = data.tracks.slice().sort((a, b) => Date.parse(a.created_at || 0) - Date.parse(b.created_at || 0));
            const allLatLng = [], profPts = [];
            let cum = 0, totDist = 0, totDur = 0, totUp = 0, totDown = 0, photos = 0;
            const legsList = $('legs-list');

            tracks.forEach((t, i) => {
                const pts = (t.points || []).filter(p => p && p[0] != null);
                const st = TrackOverlay.statsFromPoints(pts);
                const distM = (t.distance_m != null ? Number(t.distance_m) : st.distM);
                totDist += distM; totDur += st.durMs; totUp += st.up; totDown += st.down;

                if (pts.length) {
                    // click-to-identify popup: "N. name" + km · dauer
                    const label = (i + 1) + '. ' + ((t.name || '').replace(/^Track\s+/, '') || ('Etappe ' + (i + 1)));
                    const parts = [];
                    if (distM >= 10) parts.push((distM / 1000).toFixed(2) + ' km');
                    if (st.durMs > 0) parts.push(fmtClock(st.durMs));
                    TrackOverlay.drawStage(map, trackLayer, pts, { usesHotline, name: label, meta: parts.join(' · ') });
                    // profile: append this stage's points with running cumulative distance
                    for (let k = 0; k < pts.length; k++) {
                        if (k > 0) cum += hav(pts[k - 1], pts[k]);
                        profPts.push({ d: cum, alt: (pts[k][3] != null ? pts[k][3] : null) });
                        allLatLng.push([pts[k][0], pts[k][1]]);
                    }
                }
                (t.waypoints || []).forEach(w => { if (w && w.lat != null) { TrackOverlay.addWaypoint(map, wpState, w); photos++; } });

                // legs list row
                const row = document.createElement('div'); row.className = 'leg';
                const legMeta = [];
                if (distM) legMeta.push((distM / 1000).toFixed(2) + ' km');
                if (st.durMs > 0) legMeta.push(fmtClock(st.durMs));
                if (st.durMs > 0 && distM > 0) legMeta.push(((distM / 1000) / (st.durMs / 3600000)).toFixed(1) + ' km/h');
                row.innerHTML = '<span class="leg-n">' + (i + 1) + '</span><div class="leg-main">' +
                    '<div class="leg-name">' + esc((t.name || '').replace(/^Track\s+/, '') || ('Etappe ' + (i + 1))) + '</div>' +
                    '<div class="leg-meta">' + legMeta.join(' · ') + '</div></div>';
                if (pts.length) row.addEventListener('click', () => { closeLegs(); map.fitBounds(L.latLngBounds(pts.map(p => [p[0], p[1]])), { padding: [60, 60] }); });
                legsList.appendChild(row);
            });

            // combined stats tiles
            const durTxt = totDur > 0 ? fmtClock(totDur) : '–';
            const avg = (totDur > 0) ? ((totDist / 1000) / (totDur / 3600000)).toFixed(1) : '0';
            $('stats').innerHTML =
                statTile(tracks.length, 'ETAPPEN') +
                statTile((totDist / 1000).toFixed(1), 'KM') +
                statTile(durTxt, 'DAUER') +
                statTile(avg, 'KM/H') +
                statTile('↑' + totUp, 'HÖHE') +
                (photos ? statTile(photos, 'FOTOS') : '');

            drawProfile(profPts);
            $('legs-btn').textContent = 'Etappen (' + tracks.length + ') ▴';
            if (allLatLng.length) { _fitBounds = L.latLngBounds(allLatLng); _fitc.fit(); }
            hideMsg();
        })();

        // legs sheet open/close
        function openLegs() { $('legs-panel').classList.add('open'); }
        function closeLegs() { $('legs-panel').classList.remove('open'); }
        $('legs-btn').addEventListener('click', openLegs);
        $('legs-close').addEventListener('click', closeLegs);
    </script>
</body>

</html>
