<body>

        <div class="nav-btn" onclick="toggleSidebar()" title="Toggle Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

        <div id="tab-strip">
            <div id="tab-bar"></div>
            <div id="v-progress"></div>
        </div>
        <div id="tab-stage">
            <div id="v-stage">
                <div id="v-canvas-wrap">
                    <div class="cyber-grid"></div>
                    <canvas id="canvas"></canvas>
                </div>
                <div id="v-hud"></div>

            </div>
            <aside id="v-doc"></aside>
        </div>
    </main>

        onload="window.dispatchEvent(new Event('katex-ready'))"></script>

    <script src="js/trigonometrie-core.js"></script>
    <script src="js/trigonometrie-mod-kreis.js"></script>
    <script src="js/trigonometrie-mod-kurven.js"></script>
    <script src="js/trigonometrie-mod-parameter.js"></script>
    <script src="js/trigonometrie-mod-saetze.js"></script>
    <script src="js/chapter-lab.js"></script>
    <script>
        function toggleSidebar() {
            const panel = document.getElementById('side-panel');
            panel.classList.toggle('collapsed');
            if (window.CyberLeftChrome && typeof CyberLeftChrome.publishResolvedScale === 'function') {
                CyberLeftChrome.publishResolvedScale();
            }
            setTimeout(() => {
                window.dispatchEvent(new Event('resize'));
                if (window.CyberLeftChrome && typeof CyberLeftChrome.publishResolvedScale === 'function') {
                    CyberLeftChrome.publishResolvedScale();
                }
            }, 400);
        }

        CyberBranding.init({
            useExternalStyles: true,
            title: CyberI18n.get('ui.coach_title'),
            subtitle: 'Trigonometrie',
        });
        // Worked through on a tablet as well — the documentation column stacks under
        // the stage below 900px, so only a genuinely tiny screen gets the warning.
        CyberUI.init({ screenWarning: false });
        CyberUI.ensureScreenWarning({
            minWidth: 380, minHeight: 480,
            message: 'Für das Trigonometrie-Labor ist der Bildschirm sehr klein — quer halten hilft.',
        });
        if (window.CyberLeftChrome && typeof CyberLeftChrome.configure === 'function') {
            CyberLeftChrome.configure({ viewportOnlyZoom: true });
        }
        // on a narrow screen the stage needs the room more than the controls do
        if (window.innerWidth < 900) document.getElementById('side-panel').classList.add('collapsed');

        // ------------------------------------------------------------------
        // Chapters — the order a learner works through, 1 to 11.
        // `plan` names the grade (Gymnasium); `core` = Pflichtstoff, grey = Ausblick.
        // ------------------------------------------------------------------
        const CHAPTERS = [
            { id: 'dreieck', tab: 'Dreieck', plan: 'Klasse 9 · rechtwinkliges Dreieck', core: true },
            { id: 'kreis', tab: 'Einheitskreis', plan: 'Klasse 10 · Sinus und Kosinus am Einheitskreis', core: true },
            { id: 'bogen', tab: 'Bogenmaß', plan: 'Klasse 10 · Grad- und Bogenmaß', core: true },
            { id: 'sinus', tab: 'Sinuskurve', plan: 'Klasse 10 · vom Einheitskreis zur Sinusfunktion', core: true },
            { id: 'kosinus', tab: 'Kosinus', plan: 'Klasse 10 · Kosinusfunktion', core: true },
            { id: 'gleichung', tab: 'Gleichungen', plan: 'Klasse 10 · Werte, Symmetrie, sin x = y₀', core: true },
            { id: 'parameter', tab: 'Parameter', plan: 'Klasse 10 · Amplitude, Periode, Verschiebung', core: true },
            { id: 'modell', tab: 'Modellieren', plan: 'Klasse 10 · periodische Vorgänge', core: true },
            { id: 'tangens', tab: 'Tangens', plan: 'Klasse 10 · Tangensfunktion', core: true },
            { id: 'saetze', tab: 'Sinussatz', plan: 'Klasse 10 · Sinussatz, Kosinussatz, Fläche', core: true },
            { id: 'ableitung', tab: 'Ableitung', plan: 'Oberstufe — Ausblick über Klasse 10 hinaus' },
        ];

        const stage = new TrigLab.TrigStage(document.getElementById('canvas'));
        stage.hudEl = document.getElementById('v-hud');
        ChapterLab.start({ chapters: CHAPTERS, lib: TrigLab, stage2: stage, first: 'dreieck' });
    </script>
</body>
