<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- VGP app icon: a large, bold padlock (encryption) with an oval chat bubble + typing dots (chat) inside.
       Glyph enlarged to ~80% height / ~62% width so it reads big on the home screen (was ~53%). -->
  <rect width="512" height="512" fill="#061226"/>
  <!-- Shackle (raised); leg ends tuck behind the body -->
  <path d="M170 262 v-94 a86 86 0 0 1 172 0 v94" fill="none" stroke="#00d2ff" stroke-width="40" stroke-linecap="round"/>
  <!-- Lock body, centered -->
  <rect x="104" y="250" width="304" height="206" rx="42" fill="#00d2ff"/>
  <!-- Oval chat bubble punched out of the body (same navy as background), with a tail at bottom-left -->
  <ellipse cx="256" cy="360" rx="104" ry="78" fill="#061226"/>
  <path d="M200 420 L180 454 L250 426 Z" fill="#061226"/>
  <!-- Typing dots -->
  <circle cx="210" cy="360" r="15" fill="#00d2ff"/>
  <circle cx="256" cy="360" r="15" fill="#00d2ff"/>
  <circle cx="302" cy="360" r="15" fill="#00d2ff"/>
</svg>
