<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KB-Autofill-Test</title>
<!-- Throwaway diagnostic: which field type makes Google Autofill's strip (key/card/location) appear? -->
<style>
  body{font-family:system-ui,sans-serif;background:rgb(14,36,78);color:#fff;margin:0;padding:20px;font-size:18px;line-height:1.4}
  h2{font-size:15px;margin:22px 0 6px;color:#9ec1ff}
  input,textarea,.ce{display:block;width:100%;box-sizing:border-box;padding:14px;font-size:18px;
    border-radius:10px;border:none;background:rgb(19,52,107);color:#fff;font-family:inherit}
  textarea{resize:none;overflow:hidden}
  .ce{min-height:24px;white-space:nowrap;overflow:hidden}
  .ce:empty:before{content:attr(data-ph);color:#7d9}
  p.q{margin-top:30px;color:#9ec1ff}
</style>
</head>
<body>
  <h2>1) &lt;input&gt;</h2>
  <input placeholder="hier tippen" autocomplete="off">

  <h2>2) &lt;textarea&gt;</h2>
  <textarea rows="1" placeholder="hier tippen" autocomplete="off"></textarea>

  <h2>3) contenteditable &lt;div&gt;</h2>
  <div class="ce" contenteditable="true" data-ph="hier tippen"></div>

  <p class="q">Tippe nacheinander in jedes der drei Felder.<br>
  Bei welchem erscheint die weiße Autofill-Leiste (Schlüssel / Karte / Standort)?</p>
</body>
</html>
