<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>VGP installieren</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Raleway:wght@400;500;700&display=swap" rel="stylesheet">
<!-- PWA install entry point: manifest + icons. The manifest's start_url points at vgpchat.html,
     so the installed tile opens the chat directly. -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#020410">
    <link rel="icon" type="image/svg+xml" href="../resources/favicon.svg">
    <link rel="icon" type="image/png" sizes="256x256" href="../resources/favicon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VGP">
<link rel="stylesheet" href="theme.css?v=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Raleway',system-ui,sans-serif;background:var(--vgp-app-bg);color:var(--vgp-text2);min-height:100dvh;display:flex;justify-content:center;align-items:center;padding:24px;-webkit-text-size-adjust:100%}
.card{width:100%;max-width:420px;background:var(--vgp-ink);border:1px solid rgba(var(--vgp-accent-rgb),.3);border-radius:20px;box-shadow:0 0 24px rgba(var(--vgp-accent-rgb),.12);padding:32px 28px;text-align:center}
.icon{width:112px;height:112px;border-radius:24px;margin:0 auto 18px;display:block}
h1{font-family:'Orbitron',sans-serif;font-size:40px;letter-spacing:5px;color:var(--vgp-accent);margin-bottom:6px}
.sub{color:rgba(var(--vgp-accent-rgb),.6);font-size:17px;letter-spacing:2px;text-transform:uppercase;margin-bottom:22px}
p{font-size:14.5px;line-height:1.55;color:var(--vgp-text-dim);margin-bottom:18px}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;background:var(--vgp-accent);color:var(--vgp-ink);font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;margin-bottom:12px}
.btn.secondary{background:rgba(var(--vgp-accent-rgb),.12);color:var(--vgp-accent);border:1px solid rgba(var(--vgp-accent-rgb),.3)}
.btn:disabled{opacity:.4;cursor:default}
.ios{display:none;text-align:left;background:var(--vgp-ios-hint);border:1px solid rgba(var(--vgp-accent-rgb),.2);border-radius:12px;padding:14px 16px;font-size:13.5px;line-height:1.6;color:var(--vgp-text-dim);margin-bottom:12px}
.ios b{color:var(--vgp-accent)}
.note{font-size:11.5px;color:rgba(var(--vgp-accent-rgb),.45);line-height:1.5;margin-top:8px}
.note.warn{font-size:14px;color:var(--vgp-warn)}
.share{stroke:var(--vgp-accent);display:inline-block;width:16px;height:16px;vertical-align:-3px;margin:0 2px}
/* swirly spinner — shown while something is running (install / opening the app) */
.spinner{display:none;width:34px;height:34px;margin:16px auto 0;border:3px solid rgba(var(--vgp-accent-rgb),.2);border-top-color:var(--vgp-accent);border-radius:50%;animation:spin .8s linear infinite}
.spinner.on{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <img class="icon" src="icons/icon-512.png" alt="VGP">
  <h1>VGP</h1>
  <div class="sub">very good privacy</div>
  <p>100% Ende-zu-Ende-verschlüsselte Kommunikation!</p>

  <button class="btn" id="install-btn">App installieren</button>

  <div class="ios" id="ios-hint">
    Auf dem iPhone:&nbsp; <b>Teilen</b>
    <svg class="share" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
    &nbsp;→&nbsp; <b>„Zum Home-Bildschirm"</b>.
  </div>

  <a class="btn secondary" href="vgpchat.html" id="open-btn">Im Browser öffnen</a>
  <div class="spinner" id="spinner"></div>
  <div class="note" id="status"></div>
</div>

<script>
const statusEl = document.getElementById('status');
const installBtn = document.getElementById('install-btn');
const iosHint = document.getElementById('ios-hint');
const spinner = document.getElementById('spinner');
const showSpinner = (on) => spinner.classList.toggle('on', on);

// Register the site-wide service worker (lives at the web root, one dir up) — needed for installability.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('../sw.js').catch(() => {});
}

// iOS doesn't fire beforeinstallprompt and has no programmatic install → show the manual hint.
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
if (standalone) {
  // Already launched as an installed app → spinner, then straight to the chat.
  showSpinner(true);
  location.replace('vgpchat.html');
} else if (isIOS) {
  iosHint.style.display = 'block';
}

// Spinner while the chat loads when "Im Browser öffnen" is tapped
document.getElementById('open-btn').addEventListener('click', () => showSpinner(true));

// Android/Chromium fires beforeinstallprompt → we can install directly. The button stays visible
// always; on platforms without a native prompt (iOS, desktop, already installed) we explain that.
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
});
installBtn.onclick = async () => {
  if (!deferredPrompt) {
    // No native install prompt available → direct install is Android/Chrome only.
    statusEl.textContent = 'Direkt-Installation nur unter Android (Chrome) möglich.';
    statusEl.classList.add('warn');
    if (isIOS) iosHint.style.display = 'block';
    return;
  }
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  if (outcome === 'accepted') {
    // Chrome now installs in the background → keep the spinner running until 'appinstalled'
    showSpinner(true);
    statusEl.classList.remove('warn');
    statusEl.textContent = 'Installiere…';
  } else {
    showSpinner(false);
    statusEl.textContent = 'Installation abgebrochen.';
  }
  deferredPrompt = null;
};
window.addEventListener('appinstalled', () => {
  showSpinner(false);
  statusEl.classList.remove('warn');
  statusEl.textContent = 'Installiert! Öffne VGP vom Startbildschirm.';
});
</script>
</body>
</html>
