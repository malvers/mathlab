<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>VGP installieren</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Raleway:wght@400;500;700&display=swap" rel="stylesheet">
<!-- PWA install entry point: manifest + icons. The manifest's start_url points at vgp.html,
     so the installed tile opens the chat directly. -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#020410">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VGP">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Raleway',system-ui,sans-serif;background:#0a0e1a;color:#e0e8f0;min-height:100dvh;display:flex;justify-content:center;align-items:center;padding:24px;-webkit-text-size-adjust:100%}
.card{width:100%;max-width:420px;background:#020410;border:1px solid rgba(0,210,255,.3);border-radius:20px;box-shadow:0 0 24px rgba(0,210,255,.12);padding:32px 28px;text-align:center}
.icon{width:112px;height:112px;border-radius:24px;margin:0 auto 18px;display:block}
h1{font-family:'Orbitron',sans-serif;font-size:40px;letter-spacing:5px;color:#00d2ff;margin-bottom:6px}
.sub{color:rgba(0,210,255,.6);font-size:17px;letter-spacing:2px;text-transform:uppercase;margin-bottom:22px}
p{font-size:14.5px;line-height:1.55;color:#cfe4f7;margin-bottom:18px}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;background:#00d2ff;color:#020410;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;margin-bottom:12px}
.btn.secondary{background:rgba(0,210,255,.12);color:#00d2ff;border:1px solid rgba(0,210,255,.3)}
.btn:disabled{opacity:.4;cursor:default}
.ios{display:none;text-align:left;background:rgb(14,32,64);border:1px solid rgba(0,210,255,.2);border-radius:12px;padding:14px 16px;font-size:13.5px;line-height:1.6;color:#cfe4f7;margin-bottom:12px}
.ios b{color:#00d2ff}
.note{font-size:11.5px;color:rgba(0,210,255,.45);line-height:1.5;margin-top:8px}
.share{display:inline-block;width:16px;height:16px;vertical-align:-3px;margin:0 2px}
</style>
</head>
<body>
<div class="card">
  <img class="icon" src="icons/icon-512.png" alt="VGP">
  <h1>VGP</h1>
  <div class="sub">very good privacy</div>
  <p>100% Ende-zu-Ende-verschlüsselte Chat-App.</p>

  <button class="btn" id="install-btn" style="display:none">App installieren</button>

  <div class="ios" id="ios-hint">
    Auf dem iPhone:&nbsp; <b>Teilen</b>
    <svg class="share" viewBox="0 0 24 24" fill="none" stroke="#00d2ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
    &nbsp;→&nbsp; <b>„Zum Home-Bildschirm"</b>.
  </div>

  <a class="btn secondary" href="vgp.html">Im Browser öffnen</a>
  <div class="note" id="status"></div>
</div>

<script>
const statusEl = document.getElementById('status');
const installBtn = document.getElementById('install-btn');
const iosHint = document.getElementById('ios-hint');

// Register the service worker (scope covers vgp.html too) — needed for installability.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// iOS doesn't fire beforeinstallprompt and has no programmatic install → show the manual hint.
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
if (standalone) {
  // Already launched as an installed app → go straight to the chat.
  location.replace('vgp.html');
} else if (isIOS) {
  iosHint.style.display = 'block';
}

// Android/Chromium: capture the install prompt and wire it to our button.
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = 'block';
});
installBtn.onclick = async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  statusEl.textContent = outcome === 'accepted' ? 'Installiert! Öffne VGP vom Startbildschirm.' : 'Installation abgebrochen.';
  deferredPrompt = null;
  installBtn.style.display = 'none';
};
window.addEventListener('appinstalled', () => {
  statusEl.textContent = 'Installiert! Öffne VGP vom Startbildschirm.';
  installBtn.style.display = 'none';
});
</script>
</body>
</html>
