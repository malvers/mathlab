<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice Recorder</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Raleway:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }
        body {
            background: rgb(0, 0, 20);
            min-height: 100vh;
            min-height: 100dvh;   /* dynamic viewport height — survives mobile URL bar */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: clamp(8px, 2vh, 16px);
            padding: clamp(8px, 2vh, 16px) 0;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
        }

        .btn-row {
            display: flex;
            gap: 16px;
            align-items: center;
            width: min(560px, 92vw);
            flex-shrink: 0;
        }

        .btn {
            flex: 1;
            height: clamp(44px, 10vh, 60px);
            flex-shrink: 0;
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            outline: none;
            font-size: 0.6rem;
            letter-spacing: 0.25em;
            color: rgba(255,255,255,0.7);
            background: rgba(0, 0, 20, 0.95);
            transition: transform 0.12s;
            container-type: size;
        }
        /* icon size scales with button height (50% of the smaller side) */
        .btn svg {
            width: 50cqmin;
            height: 50cqmin;
            max-width: 60%;
            max-height: 60%;
        }
        .btn:active { transform: scale(0.93); }

        #btn-record {
            background: rgba(8, 18, 38, 0.9);
            border: 1px solid rgb(245, 194, 66);
            box-shadow: 0 0 8px rgba(245,194,66,0.35);
        }
        #btn-record.active svg circle { animation: pulse-icon 1s infinite; }
        #btn-play.playing svg .icon-stop { animation: pulse-icon 1s infinite; }

        #btn-play {
            background: rgba(8, 18, 38, 0.9);
            border: 1px solid rgb(121, 158, 49);
            box-shadow: 0 0 8px rgba(121,158,49,0.35);
        }
        #btn-play:disabled {
            cursor: not-allowed;
        }
        #btn-play:disabled svg .icon-play {
            fill: #444 !important;
        }
        #btn-play .icon-stop { display: none; }
        #btn-play.playing .icon-play { display: none; }
        #btn-play.playing .icon-stop { display: block; }

        @keyframes pulse-icon {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.3; }
        }

        #transcript-box {
            width: min(560px, 92vw);
            flex: 1 1 0;
            min-height: 0;   /* allow it to shrink inside flex column */
            background: rgba(8, 18, 38, 0.9);
            border: 1px solid rgba(0, 210, 255, 0.8);
            border-radius: 12px;
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.28);
            overflow: hidden;
            display: flex;
            position: relative;
        }

        #btn-fullscreen {
            position: fixed;
            top: 0;
            right: 0;
            width: 20px;
            height: 20px;
            background: transparent;
            border: none;
            cursor: pointer;
            outline: none;
            z-index: 10;
            opacity: 0;
        }
        #btn-fullscreen:hover {
            opacity: 0.15;
            background: rgba(0, 210, 255, 0.4);
        }

        /* ── MINI MODE ─────────────────────────────────────── */
        body.mini > #transcript-box { display: none; }
        body.mini > .btn-row {
            flex: 2 1 0;
            flex-direction: column;
            width: min(560px, 90vw);
        }
        body.mini > .btn-row .btn {
            flex: 1 1 0;
            height: auto;
            width: 100%;
        }
        body.mini > #btn-download {
            flex: 1 1 0;
            height: auto;
        }

        #mini-stack {
            display: none;
            flex-direction: column;
            gap: 10px;
            width: 220px;
            padding: 14px;
            background: rgba(8, 18, 38, 0.96);
            border: 1px solid rgba(0, 210, 255, 0.6);
            border-radius: 10px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6), 0 0 12px rgba(0, 210, 255, 0.25);
            backdrop-filter: blur(6px);
        }
        #mini-stack.popup {
            display: flex;
            position: fixed;
            z-index: 20;
        }
        .mini-btn {
            height: clamp(48px, 12vw, 60px);
            border-radius: 12px;
            cursor: pointer;
            outline: none;
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(0.8rem, 2.6vw, 0.95rem);
            letter-spacing: 0.22em;
            color: rgba(0, 210, 255, 0.95);
            background: rgba(8, 18, 38, 0.9);
            border: 1px solid rgba(0, 210, 255, 0.8);
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.28);
            transition: background 0.12s, transform 0.12s;
        }
        .mini-btn:hover { background: rgba(0, 210, 255, 0.08); }
        .mini-btn:active { transform: scale(0.97); }
        .mini-btn.danger {
            color: rgb(245, 194, 66);
            border-color: rgb(245, 194, 66);
            box-shadow: 0 0 8px rgba(245, 194, 66, 0.35);
        }
        .mini-btn.danger:hover { background: rgba(245, 194, 66, 0.08); }
        .mini-sep {
            height: 1px;
            background: rgba(0, 210, 255, 0.3);
            margin: 6px 0;
        }
        #transcript-inner {
            flex: 1;
            padding: clamp(12px, 3vw, 16px) clamp(14px, 4vw, 20px);
            color: rgba(200, 200, 200, 0.85);
            font-family: 'Raleway', sans-serif;
            font-size: clamp(0.85rem, 2.8vw, 0.95rem);
            letter-spacing: 0.06em;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(72, 88, 112, 0.95) rgba(8, 18, 38, 0.9);
        }
        #transcript-inner::-webkit-scrollbar {
            width: 11px;
        }
        #transcript-inner::-webkit-scrollbar-track {
            background: rgba(8, 18, 38, 0.9);
            border-radius: 999px;
            margin: 6px 0;
        }
        #transcript-inner::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg,
                rgba(78, 92, 118, 0.95) 0%,
                rgba(52, 64, 86, 0.92) 100%);
            border-radius: 999px;
            border: 2px solid rgba(34, 42, 58, 0.85);
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.35);
        }
        #transcript-inner::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg,
                rgba(92, 108, 134, 0.98) 0%,
                rgba(68, 82, 108, 0.95) 100%);
            box-shadow: 0 0 10px rgba(100, 118, 145, 0.22);
        }

        #btn-download {
            width: min(560px, 92vw);
            height: clamp(44px, 10vh, 60px);
            flex-shrink: 0;
            border-radius: 12px;
            cursor: pointer;
            outline: none;
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(0.95rem, 3.2vw, 1.15rem);
            letter-spacing: 0.3em;
            color: rgba(0, 210, 255, 0.95);
            background: rgba(8, 18, 38, 0.9);
            border: 1px solid rgba(0, 210, 255, 0.8);
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.28);
            transition: transform 0.12s, background 0.12s;
            display: flex;
            align-items: center;
            justify-content: center;
            container-type: size;
        }
        #btn-download .dl-icon { display: none; }
        body.mini > #btn-download .dl-label { display: none; }
        body.mini > #btn-download .dl-icon {
            display: block;
            width: 50cqmin;
            height: 50cqmin;
            max-width: 60%;
            max-height: 60%;
            stroke: rgba(0, 210, 255, 0.95);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        #btn-download:hover:not(:disabled) {
            background: rgba(0, 210, 255, 0.08);
        }
        #btn-download:active:not(:disabled) { transform: scale(0.97); }
        #btn-download:disabled {
            cursor: not-allowed;
            color: rgba(0, 210, 255, 0.25);
            border-color: rgba(0, 210, 255, 0.25);
            box-shadow: none;
        }
        /* button stays cyan; only the label/icon pulses to signal unsaved */
        #btn-download.unsaved .dl-label,
        #btn-download.unsaved .dl-icon {
            animation: pulse-label 1.2s ease-in-out infinite;
        }
        body.mini > #btn-download:disabled .dl-icon { stroke: rgba(0, 210, 255, 0.25); }
        @keyframes pulse-label {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.35; }
        }

        #build-info {
            font-family: 'Raleway', sans-serif;
            font-size: 0.65rem;
            color: rgba(60, 90, 130, 0.35);
            letter-spacing: 0.05em;
            margin-top: -4px;
            flex-shrink: 0;
            cursor: pointer;
            user-select: none;
        }
        #build-info:hover { color: rgba(0, 210, 255, 0.95); }

        /* ── Pixel dialog ─────────────────────────────────── */
        #pixel-dialog {
            position: fixed; inset: 0;
            background: rgba(0, 0, 20, 0.85);
            display: flex; align-items: center; justify-content: center;
            z-index: 30;
            backdrop-filter: blur(4px);
        }
        #pixel-dialog .dlg-card {
            background: rgba(8, 18, 38, 0.98);
            border: 1px solid rgba(0, 210, 255, 0.8);
            border-radius: 14px;
            box-shadow: 0 0 24px rgba(0, 210, 255, 0.3);
            padding: 24px 28px;
            width: min(420px, 90vw);
            font-family: 'Raleway', sans-serif;
            color: rgba(220, 230, 245, 0.95);
        }
        #pixel-dialog h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            letter-spacing: 0.2em;
            color: rgba(0, 210, 255, 0.95);
            margin-bottom: 14px;
        }
        #pixel-dialog p { font-size: 0.85rem; line-height: 1.5; margin-bottom: 18px; }
        #pixel-dialog em { color: rgb(245, 194, 66); font-style: normal; }
        #pixel-dialog .radio {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; margin-bottom: 8px;
            background: rgba(0, 210, 255, 0.05);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        #pixel-dialog .radio input { accent-color: rgb(0, 210, 255); transform: scale(1.2); }
        #pixel-dialog button {
            margin-top: 14px;
            width: 100%;
            height: 44px;
            border-radius: 8px;
            background: rgba(8, 18, 38, 0.9);
            border: 1px solid rgba(0, 210, 255, 0.8);
            color: rgba(0, 210, 255, 0.95);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.25em;
            cursor: pointer;
        }
        #pixel-dialog button:hover { background: rgba(0, 210, 255, 0.1); }
    </style>
</head>
<body>
    <div class="btn-row">
        <button class="btn" id="btn-record" title="Record">
            <svg viewBox="0 0 40 40">
                <circle cx="20" cy="20" r="14" fill="rgb(245, 194, 66)"/>
            </svg>
        </button>

        <button class="btn" id="btn-play" title="Play" disabled>
            <svg viewBox="0 0 52 52">
                <polygon class="icon-play" points="14,6 46,26 14,46" fill="rgb(121, 158, 49)"/>
                <rect class="icon-stop" x="12" y="12" width="28" height="28" rx="3" fill="rgb(121, 158, 49)"/>
            </svg>
        </button>
    </div>

    <div id="transcript-box">
        <div id="transcript-inner"></div></div>

    <button id="btn-download" disabled>
        <span class="dl-label">DOWNLOAD</span>
        <svg class="dl-icon" viewBox="0 0 24 24">
            <path d="M12 3 v12 m-5 -5 l5 5 l5 -5 M5 20 h14"/>
        </svg>
    </button>

    <div id="build-info"></div>

    <div id="mini-stack">
        <button class="mini-btn" id="mb-mini-toggle">MINI MODE</button>
        <div class="mini-sep"></div>
        <button class="mini-btn danger" id="mb-del-all">DELETE ALL</button>
        <button class="mini-btn danger" id="mb-del-text">DELETE TEXT</button>
        <button class="mini-btn danger" id="mb-del-voice">DELETE VOICE</button>
        <div class="mini-sep"></div>
        <button class="mini-btn" id="mb-copy-text">COPY TEXT</button>
        <button class="mini-btn" id="mb-load-file">LOAD FILE</button>
    </div>

    <input type="file" id="file-input" accept="audio/*,text/plain,.txt,.webm" multiple style="display:none">

    <div id="pixel-dialog" style="display:none">
        <div class="dlg-card">
            <h2>Pixel-Hinweis</h2>
            <p>Auf Pixel-Geräten kann der Browser nur entweder Audio aufzeichnen <em>oder</em> live transkribieren — nicht beides gleichzeitig.</p>
            <label class="radio"><input type="radio" name="pixmode" value="text" checked> Text (Transkript)</label>
            <label class="radio"><input type="radio" name="pixmode" value="audio"> Audio (.webm-Aufnahme)</label>
            <button id="pixel-dialog-ok">OK</button>
        </div>
    </div>

    <button id="btn-fullscreen" title="Fullscreen"></button>

    <script>
        const btnRecord    = document.getElementById('btn-record');
        const btnPlay      = document.getElementById('btn-play');
        const btnDownload  = document.getElementById('btn-download');
        const transcriptEl = document.getElementById('transcript-inner');

        let mediaRecorder = null;
        let audioChunks   = [];
        let audioUrl      = null;
        let audioEl       = null;
        let isRecording   = false;
        let isPlaying     = false;
        let recognition   = null;
        let currentBlob   = null;
        let isDirty       = false; // recording exists but not downloaded

        // ── IndexedDB ────────────────────────────────────────────
        const DB_NAME = 'voicerec', STORE = 'recordings', KEY = 'current';
        function openDB() {
            return new Promise((res, rej) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = () => req.result.createObjectStore(STORE);
                req.onsuccess = () => res(req.result);
                req.onerror   = () => rej(req.error);
            });
        }
        async function saveToDB(blob, transcript) {
            const db = await openDB();
            const tx = db.transaction(STORE, 'readwrite');
            tx.objectStore(STORE).put({ blob, transcript, savedAt: Date.now() }, KEY);
            return new Promise(res => tx.oncomplete = () => res());
        }
        async function loadFromDB() {
            const db = await openDB();
            const tx = db.transaction(STORE, 'readonly');
            return new Promise(res => {
                const r = tx.objectStore(STORE).get(KEY);
                r.onsuccess = () => res(r.result || null);
                r.onerror   = () => res(null);
            });
        }
        async function clearDB() {
            const db = await openDB();
            const tx = db.transaction(STORE, 'readwrite');
            tx.objectStore(STORE).delete(KEY);
            return new Promise(res => tx.oncomplete = () => res());
        }

        function setDirty(v) {
            isDirty = v;
            btnDownload.classList.toggle('unsaved', v);
        }

        // ── Recognition event log ────────────────────────────────
        let recLog = [];
        const tStamp = () => {
            const d = new Date();
            return String(d.getHours()).padStart(2,'0') + ':' +
                   String(d.getMinutes()).padStart(2,'0') + ':' +
                   String(d.getSeconds()).padStart(2,'0') + '.' +
                   String(d.getMilliseconds()).padStart(3,'0');
        };
        // const logRec = (msg) => recLog.push(`${tStamp()} ${msg}`);
        const logRec = () => {};   // debug disabled — uncomment line above to re-enable

        // ── Speech recognition ───────────────────────────────────
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let finalText = '';      // total displayed final text
        let savedFinal = '';     // committed from previous sessions (across recognition.start cycles)

        logRec(`UA: ${navigator.userAgent.substring(0, 80)}`);
        logRec(`SpeechRecognition: ${!!window.SpeechRecognition}, webkitSpeechRecognition: ${!!window.webkitSpeechRecognition}`);
        logRec(`online: ${navigator.onLine}, language: ${navigator.language}`);

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous    = true;
            recognition.interimResults = true;
            recognition.lang          = 'de-DE';

            recognition.onaudiostart   = () => logRec('audiostart');
            recognition.onsoundstart   = () => logRec('soundstart');
            recognition.onspeechstart  = () => logRec('speechstart');
            recognition.onspeechend    = () => logRec('speechend');
            recognition.onsoundend     = () => logRec('soundend');
            recognition.onaudioend     = () => logRec('audioend');
            recognition.onnomatch      = () => logRec('nomatch');
            recognition.onstart        = () => logRec('start');

            recognition.onresult = e => {
                let sessionFinal = '';
                let interim = '';
                const dump = [];
                // Chrome's quirk: multiple overlapping final results.
                // Strategy: take only the LAST final result + the LAST interim result.
                let lastFinalIdx = -1, lastInterimIdx = -1;
                for (let i = 0; i < e.results.length; i++) {
                    const t = e.results[i][0].transcript;
                    const f = e.results[i].isFinal;
                    dump.push(`[${i}]${f?'F':'I'}="${t}"`);
                    if (f) lastFinalIdx = i;
                    else   lastInterimIdx = i;
                }
                if (lastFinalIdx   >= 0) sessionFinal = e.results[lastFinalIdx  ][0].transcript;
                if (lastInterimIdx >= 0) interim       = e.results[lastInterimIdx][0].transcript;

                logRec(`result idx=${e.resultIndex} ${dump.join(' ')}`);
                finalText = savedFinal + sessionFinal;
                transcriptEl.textContent = finalText + interim;
            };
            recognition.onend = () => {
                // promote session's final text into savedFinal with a trailing space
                savedFinal = finalText.replace(/\s+$/, '') + (finalText ? ' ' : '');
                finalText = savedFinal;
                transcriptEl.textContent = finalText;
                logRec(`end (finalText.len=${finalText.length})`);

                if (isRecording) {
                    // auto-restart so the silence-timeout doesn't permanently kill recognition
                    try {
                        recognition.start();
                        logRec('recognition auto-restarted');
                    } catch (e) {
                        logRec(`recognition restart THREW: ${e.message || e}`);
                    }
                    return;
                }

                if (currentBlob) {
                    saveToDB(currentBlob, finalText);
                    logRec(`saveToDB called, transcript=${finalText.length} chars`);
                }
                // If MediaRecorder was skipped (test mode), no onstop will fire — dump log here
                // if (!currentBlob) {
                //     transcriptEl.textContent = '[DEBUG-LOG]\n' + recLog.join('\n') + '\n\n[TRANSCRIPT]\n' + (finalText || '(empty)');
                // }
            };
            recognition.onerror = e => {
                logRec(`ERROR: error="${e.error||''}" message="${e.message||''}"`);
            };
        } else {
            logRec('NO SpeechRecognition object — API not available');
        }

        // build timestamp — updated on every save
        const BUILD_TIME = '2026-05-16 13:35';

        // detect Pixel device via User-Agent Client Hints
        // Pixel-mode: 'text' = transcribe only, 'audio' = record only
        let isPixel = /Pixel/i.test(navigator.userAgent);
        let pixelMode = 'text';   // default

        function maybeShowPixelDialog() {
            if (!isPixel) return;
            const dlg = document.getElementById('pixel-dialog');
            dlg.style.display = 'flex';
            document.getElementById('pixel-dialog-ok').addEventListener('click', () => {
                const sel = dlg.querySelector('input[name="pixmode"]:checked');
                pixelMode = sel ? sel.value : 'text';
                dlg.style.display = 'none';
            }, { once: true });
        }

        if (navigator.userAgentData?.getHighEntropyValues) {
            navigator.userAgentData.getHighEntropyValues(['model']).then(d => {
                if (d.model && /Pixel/i.test(d.model)) isPixel = true;
                maybeShowPixelDialog();
            }).catch(() => { maybeShowPixelDialog(); });
        } else {
            maybeShowPixelDialog();
        }

        // build-info line auskommentiert (war "unter Wasser") — wieder einkommentieren falls debug nötig
        // const buildInfoEl = document.getElementById('build-info');
        // buildInfoEl.textContent = `BT: ${BUILD_TIME}`;
        // buildInfoEl.title = 'Klick: hart neu laden';
        // buildInfoEl.addEventListener('click', () => {
        //     const url = location.pathname + '?cb=' + Date.now() + location.hash;
        //     location.replace(url);
        // });

        // ── Restore from IndexedDB on load ───────────────────────
        (async () => {
            const dbg = [];
            try {
                const stored = await loadFromDB();
                if (!stored) {
                    dbg.push('IDB: nichts gespeichert');
                } else {
                    dbg.push('IDB stored keys: ' + Object.keys(stored).join(','));
                    dbg.push('IDB blob: ' + (stored.blob ? `${stored.blob.size}B type=${stored.blob.type||'?'}` : 'null'));
                    dbg.push('IDB transcript: ' + (stored.transcript ? `${stored.transcript.length} chars` : 'null/empty'));
                    dbg.push('IDB savedAt: ' + (stored.savedAt ? new Date(stored.savedAt).toLocaleString() : 'unknown'));

                    if (stored.blob) {
                        currentBlob = stored.blob;
                        if (audioUrl) URL.revokeObjectURL(audioUrl);
                        audioUrl = URL.createObjectURL(currentBlob);
                        audioEl  = new Audio(audioUrl);
                        btnPlay.disabled = false;
                        btnDownload.disabled = false;
                        setDirty(true);
                    }
                    if (stored.transcript) {
                        finalText = stored.transcript;
                        savedFinal = stored.transcript;
                    }
                }
            } catch (e) {
                dbg.push('IDB ERROR: ' + (e.message || e));
            }
            // show restored transcript (debug-dump auskommentiert)
            // transcriptEl.textContent = '[DEBUG]\n' + dbg.join('\n') + '\n\n' + (finalText || '');
            transcriptEl.textContent = finalText || '';
        })();

        // ── Record ───────────────────────────────────────────────
        btnRecord.addEventListener('click', async () => {
            if (isPlaying) return;

            if (!isRecording) {
                try {
                    if (!navigator.mediaDevices?.getUserMedia) {
                        throw new Error('getUserMedia nicht verfügbar (HTTPS nötig)');
                    }
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

                    // pick a supported MIME type — Android often lacks audio/webm
                    const candidates = [
                        'audio/webm;codecs=opus',
                        'audio/webm',
                        'audio/ogg;codecs=opus',
                        'audio/mp4;codecs=mp4a.40.2',
                        'audio/mp4',
                        ''   // fallback: let browser decide
                    ];
                    let mimeType = '';
                    for (const c of candidates) {
                        if (c === '' || MediaRecorder.isTypeSupported(c)) { mimeType = c; break; }
                    }

                    mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
                    const usedType = mediaRecorder.mimeType || mimeType || 'audio/webm';
                    logRec(`MediaRecorder mimeType=${usedType}`);

                    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                    mediaRecorder.onstop = async () => {
                        if (audioUrl) URL.revokeObjectURL(audioUrl);
                        currentBlob = new Blob(audioChunks, { type: usedType });
                        audioUrl = URL.createObjectURL(currentBlob);
                        audioEl  = new Audio(audioUrl);
                        btnPlay.disabled = false;
                        btnDownload.disabled = false;
                        stream.getTracks().forEach(t => t.stop());

                        await saveToDB(currentBlob, finalText);
                        logRec(`mediaRecorder.onstop saved blob=${currentBlob.size}B transcript=${finalText.length}chars`);
                        setDirty(true);

                        // dump full debug log after stop
                        // transcriptEl.textContent = '[DEBUG-LOG]\n' + recLog.join('\n') + '\n\n[TRANSCRIPT]\n' + (finalText || '(empty)');
                    };

                    isRecording = true;
                    btnRecord.classList.add('active');
                    btnPlay.disabled = true;
                    recLog = []; // fresh log per recording

                    // Pixel-Mic-Conflict: User wählt im Dialog Audio ODER Text.
                    // Andere Geräte (Lenovo, Desktop, iOS) machen beides.
                    const SKIP_MEDIARECORDER = isPixel && pixelMode === 'text';
                    const SKIP_RECOGNITION   = isPixel && pixelMode === 'audio';
                    logRec(`isPixel=${isPixel} mode=${pixelMode} → skipMR=${SKIP_MEDIARECORDER} skipRec=${SKIP_RECOGNITION}`);

                    let recognitionStarted = false;
                    if (!SKIP_RECOGNITION) {
                        try {
                            if (recognition) {
                                recognition.start();
                                recognitionStarted = true;
                                logRec('recognition.start() called');
                            } else {
                                logRec('recognition is null');
                            }
                        } catch (e) {
                            logRec(`recognition.start THREW: ${e.message || e}`);
                        }
                    } else {
                        logRec('recognition SKIPPED (audio-only mode)');
                    }

                    if (!SKIP_MEDIARECORDER) {
                        setTimeout(() => {
                            try {
                                mediaRecorder.start();
                                logRec('mediaRecorder.start (delayed)');
                            } catch (e) {
                                logRec(`mediaRecorder.start THREW: ${e.message || e}`);
                            }
                        }, recognitionStarted ? 600 : 0);
                    } else {
                        // release the mic stream we acquired since we won't use MR
                        stream.getTracks().forEach(t => t.stop());
                        logRec('MediaRecorder SKIPPED, mic stream released');
                    }

                } catch (err) {
                    // surface error in the transcript area so user can see what failed
                    transcriptEl.textContent = '[Mikrofon-Fehler] ' + (err && err.message ? err.message : err);
                }

            } else {
                if (recognition) recognition.stop();
                try {
                    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
                } catch (e) { logRec('mediaRecorder.stop error: ' + (e.message||e)); }
                isRecording = false;
                btnRecord.classList.remove('active');
            }
        });

        // ── Play / Stop ──────────────────────────────────────────
        btnPlay.addEventListener('click', () => {
            if (isRecording || !audioEl) return;
            if (isPlaying) {
                audioEl.pause();
                audioEl.currentTime = 0;
                isPlaying = false;
                btnPlay.classList.remove('playing');
                return;
            }
            isPlaying = true;
            btnPlay.classList.add('playing');
            audioEl.currentTime = 0;
            audioEl.play();
            audioEl.onended = () => {
                isPlaying = false;
                btnPlay.classList.remove('playing');
                audioEl = new Audio(audioUrl);
            };
        });

        // ── Download (audio + transcript sidecar) ────────────────
        function audioExt(blob) {
            const t = (blob.type || '').toLowerCase();
            if (t.includes('mp4'))  return '.m4a';
            if (t.includes('ogg'))  return '.ogg';
            if (t.includes('wav'))  return '.wav';
            if (t.includes('mpeg')) return '.mp3';
            return '.webm';
        }
        btnDownload.addEventListener('click', () => {
            if (!currentBlob) return;
            const d = new Date();
            const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
            const baseName = `recording ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;

            // audio file
            const a1 = document.createElement('a');
            a1.href = URL.createObjectURL(currentBlob);
            a1.download = baseName + audioExt(currentBlob);
            a1.click();
            URL.revokeObjectURL(a1.href);

            // transcript sidecar (only if there is text)
            const text = transcriptEl.textContent.trim();
            if (text) {
                const a2 = document.createElement('a');
                const tBlob = new Blob([text], { type: 'text/plain;charset=utf-8' });
                a2.href = URL.createObjectURL(tBlob);
                a2.download = baseName + '.txt';
                a2.click();
                URL.revokeObjectURL(a2.href);
            }

            setDirty(false);
        });

// ── Fullscreen toggle ────────────────────────────────────
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen?.();
            } else {
                document.exitFullscreen?.();
            }
        }
        document.getElementById('btn-fullscreen').addEventListener('click', toggleFullscreen);

        // Right-click anywhere → popup with action buttons
        const miniStack = document.getElementById('mini-stack');
        window.addEventListener('contextmenu', e => {
            e.preventDefault();
            const w = 220, h = 240;
            const x = Math.min(e.clientX, window.innerWidth  - w - 8);
            const y = Math.min(e.clientY, window.innerHeight - h - 8);
            miniStack.style.left = x + 'px';
            miniStack.style.top  = y + 'px';
            miniStack.classList.add('popup');
        });

        // close popup after a button click inside it (click fires AFTER mousedown)
        miniStack.addEventListener('click', e => {
            if (e.target.tagName === 'BUTTON') miniStack.classList.remove('popup');
        });
        // close popup on click outside
        document.addEventListener('mousedown', e => {
            if (miniStack.classList.contains('popup') && !miniStack.contains(e.target)) {
                miniStack.classList.remove('popup');
            }
        });

        // ── Mini-mode toggle (from popup) ────────────────────────
        const btnMiniToggle = document.getElementById('mb-mini-toggle');
        btnMiniToggle.addEventListener('click', () => {
            document.body.classList.toggle('mini');
            btnMiniToggle.textContent = document.body.classList.contains('mini') ? 'FULL MODE' : 'MINI MODE';
        });

        // ── Mini-mode actions ────────────────────────────────────
        document.getElementById('mb-del-all').addEventListener('click', async () => {
            if (!confirm('Alles löschen — Aufnahme und Text?')) return;
            audioChunks = [];
            currentBlob = null;
            if (audioUrl) { URL.revokeObjectURL(audioUrl); audioUrl = null; }
            audioEl = null;
            finalText = '';
            savedFinal = '';
            transcriptEl.textContent = '';
            btnPlay.disabled = true;
            btnDownload.disabled = true;
            await clearDB();
            setDirty(false);
        });

        document.getElementById('mb-del-text').addEventListener('click', () => {
            if (!confirm('Transkript löschen?')) return;
            finalText = '';
            savedFinal = '';
            transcriptEl.textContent = '';
            if (currentBlob) saveToDB(currentBlob, '');
        });

        document.getElementById('mb-del-voice').addEventListener('click', async () => {
            if (!confirm('Aufnahme löschen?')) return;
            audioChunks = [];
            currentBlob = null;
            if (audioUrl) { URL.revokeObjectURL(audioUrl); audioUrl = null; }
            audioEl = null;
            btnPlay.disabled = true;
            btnDownload.disabled = true;
            await clearDB();
            setDirty(false);
        });

        document.getElementById('mb-copy-text').addEventListener('click', async () => {
            const text = transcriptEl.textContent.trim();
            if (!text) return;
            try { await navigator.clipboard.writeText(text); } catch (e) {}
        });

        // ── Load file(s): audio + optional transcript sidecar ─────
        const fileInput = document.getElementById('file-input');
        document.getElementById('mb-load-file').addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', async () => {
            const files = Array.from(fileInput.files || []);
            if (!files.length) return;

            let audioFile = files.find(f => f.type.startsWith('audio/') || /\.(webm|mp3|wav|m4a|ogg)$/i.test(f.name));
            let textFile  = files.find(f => f.type === 'text/plain' || /\.txt$/i.test(f.name));

            if (audioFile) {
                if (audioUrl) URL.revokeObjectURL(audioUrl);
                currentBlob = audioFile;
                audioUrl = URL.createObjectURL(currentBlob);
                audioEl  = new Audio(audioUrl);
                btnPlay.disabled = false;
                btnDownload.disabled = false;
            }

            if (textFile) {
                const text = await textFile.text();
                finalText  = text;
                savedFinal = text;
                transcriptEl.textContent = text;
            }

            if (currentBlob) await saveToDB(currentBlob, finalText);
            setDirty(false);
            fileInput.value = '';
        });

        // Fullscreen only via the top-right corner button (no long-press elsewhere).

        // ── Warn on close if unsaved ─────────────────────────────
        window.addEventListener('beforeunload', e => {
            if (isDirty) {
                e.preventDefault();
                e.returnValue = '';
                return '';
            }
        });
    </script>
</body>
</html>
