<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice Recorder</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Raleway:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }
        body {
            background: rgb(0, 0, 20);
            min-height: 100vh;
            min-height: 100dvh;   /* dynamic viewport height — survives mobile URL bar */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: clamp(8px, 2vh, 16px);
            padding: clamp(8px, 2vh, 16px) 0;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
        }

        .btn-row {
            display: flex;
            gap: 16px;
            align-items: center;
            width: min(560px, 92vw);
            flex-shrink: 0;
        }

        .btn {
            flex: 1;
            height: clamp(44px, 10vh, 60px);
            flex-shrink: 0;
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            outline: none;
            font-size: 0.6rem;
            letter-spacing: 0.25em;
            color: rgba(255,255,255,0.7);
            background: rgba(0, 0, 20, 0.95);
            transition: transform 0.12s;
            container-type: size;
        }
        /* icon size scales with button height (50% of the smaller side) */
        .btn svg {
            width: 50cqmin;
            height: 50cqmin;
            max-width: 60%;
            max-height: 60%;
        }
        .btn:active { transform: scale(0.93); }

        #btn-record {
            background: rgba(8, 18, 38, 0.9);
            border: 1px solid rgb(245, 194, 66);
            box-shadow: 0 0 8px rgba(245,194,66,0.35);
        }
        #btn-record.active svg circle { animation: pulse-icon 1s infinite; }
        #btn-play.playing svg .icon-stop { animation: pulse-icon 1s infinite; }

        #btn-play {
            background: rgba(8, 18, 38, 0.9);
            border: 1px solid rgb(121, 158, 49);
            box-shadow: 0 0 8px rgba(121,158,49,0.35);
        }
        #btn-play:disabled {
            cursor: not-allowed;
        }
        #btn-play:disabled svg .icon-play {
            fill: #444 !important;
        }
        #btn-play .icon-stop { display: none; }
        #btn-play.playing .icon-play { display: none; }
        #btn-play.playing .icon-stop { display: block; }

        @keyframes pulse-icon {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.3; }
        }

        #transcript-box {
            width: min(560px, 92vw);
            flex: 1 1 0;
            min-height: 0;   /* allow it to shrink inside flex column */
            background: rgba(8, 18, 38, 0.9);
            border: 1px solid rgba(0, 210, 255, 0.8);
            border-radius: 12px;
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.28);
            overflow: hidden;
            display: flex;
            position: relative;
        }

        #btn-fullscreen {
            position: fixed;
            top: 0;
            right: 0;
            width: 20px;
            height: 20px;
            background: transparent;
            border: none;
            cursor: pointer;
            outline: none;
            z-index: 10;
            opacity: 0;
        }
        #btn-fullscreen:hover {
            opacity: 0.15;
            background: rgba(0, 210, 255, 0.4);
        }

        /* ── MINI MODE ─────────────────────────────────────── */
        body.mini > #transcript-box { display: none; }
        body.mini > .btn-row {
            flex: 2 1 0;
            flex-direction: column;
            width: min(560px, 90vw);
        }
        body.mini > .btn-row .btn {
            flex: 1 1 0;
            height: auto;
            width: 100%;
        }
        body.mini > .bottom-row {
            flex: 2 1 0;
            flex-direction: column;
        }
        body.mini > .bottom-row .btn-saveload {
            flex: 1 1 0;
            height: auto;
        }

        /* mini-mode body view (vertical stack) */
        #mini-stack {
            display: none;
            flex-direction: column;
            gap: 10px;
            width: 220px;
            padding: 14px;
        }
        /* popup mode: RADIAL — buttons arranged in a circle around touch point */
        #mini-stack.popup {
            display: block;
            position: fixed;
            z-index: 20;
            width: 320px;
            height: 230px;
            padding: 0;
            background: transparent;
            border: none;
            box-shadow: none;
            backdrop-filter: none;
            pointer-events: none;     /* center is click-through */
        }
        /* subtle radial glow underneath the popup buttons */
        #mini-stack.popup::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            width: 520px;
            height: 380px;
            transform: translate(-50%, -50%);
            background: radial-gradient(ellipse at center,
                rgba(0, 210, 255, 0.18) 0%,
                rgba(0, 210, 255, 0.09) 28%,
                rgba(0, 210, 255, 0.035) 55%,
                rgba(0, 210, 255, 0) 75%);
            pointer-events: none;
            z-index: -1;
            filter: blur(6px);
        }
        #mini-stack.popup .mini-sep { display: none; }
        #mini-stack.popup .mini-btn {
            position: absolute;
            pointer-events: auto;
            width: 115px;
            height: 32px;
            font-size: 0.62rem;
            letter-spacing: 0.15em;
            transform: translate(-50%, -50%);
            background: rgba(8, 18, 38, 0.96);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5), 0 0 10px rgba(0, 210, 255, 0.25);
            color: rgba(0, 210, 255, 0.95);
            border-color: rgba(0, 210, 255, 0.8);
        }
        #mini-stack.popup .mini-btn:hover { background: rgba(0, 210, 255, 0.1); }
        /* destructive deletes → rot (right side) */
        #mini-stack.popup #mb-del-all,
        #mini-stack.popup #mb-del-text,
        #mini-stack.popup #mb-del-voice {
            color: rgb(196, 30, 58);
            border-color: rgb(196, 30, 58);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5), 0 0 10px rgba(196, 30, 58, 0.3);
        }
        #mini-stack.popup #mb-del-all:hover,
        #mini-stack.popup #mb-del-text:hover,
        #mini-stack.popup #mb-del-voice:hover { background: rgba(196, 30, 58, 0.12); }
        /* opposite/warning buttons → orange (left side) */
        #mini-stack.popup #mb-load-file,
        #mini-stack.popup #mb-engine,
        #mini-stack.popup #mb-reload-ai {
            color: rgb(245, 194, 66);
            border-color: rgb(245, 194, 66);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5), 0 0 10px rgba(245, 194, 66, 0.3);
        }
        #mini-stack.popup #mb-load-file:hover,
        #mini-stack.popup #mb-engine:hover,
        #mini-stack.popup #mb-reload-ai:hover { background: rgba(245, 194, 66, 0.12); }
        .mini-btn {
            height: clamp(48px, 12vw, 60px);
            border-radius: 12px;
            cursor: pointer;
            outline: none;
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(0.8rem, 2.6vw, 0.95rem);
            letter-spacing: 0.22em;
            color: rgba(0, 210, 255, 0.95);
            background: rgba(8, 18, 38, 0.9);
            border: 1px solid rgba(0, 210, 255, 0.8);
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.28);
            transition: background 0.12s, transform 0.12s;
        }
        .mini-btn:hover { background: rgba(0, 210, 255, 0.08); }
        .mini-btn:active { transform: scale(0.97); }
        .mini-btn.danger {
            color: rgb(245, 194, 66);
            border-color: rgb(245, 194, 66);
            box-shadow: 0 0 8px rgba(245, 194, 66, 0.35);
        }
        .mini-btn.danger:hover { background: rgba(245, 194, 66, 0.08); }
        .mini-sep {
            height: 1px;
            background: rgba(0, 210, 255, 0.3);
            margin: 6px 0;
        }
        #transcript-inner {
            flex: 1;
            padding: clamp(12px, 3vw, 16px) clamp(14px, 4vw, 20px);
            color: rgba(200, 200, 200, 0.85);
            font-family: 'Raleway', sans-serif;
            font-size: clamp(0.85rem, 2.8vw, 0.95rem);
            letter-spacing: 0.06em;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(72, 88, 112, 0.95) rgba(8, 18, 38, 0.9);
        }
        #transcript-inner::-webkit-scrollbar {
            width: 11px;
        }
        #transcript-inner::-webkit-scrollbar-track {
            background: rgba(8, 18, 38, 0.9);
            border-radius: 999px;
            margin: 6px 0;
        }
        #transcript-inner::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg,
                rgba(78, 92, 118, 0.95) 0%,
                rgba(52, 64, 86, 0.92) 100%);
            border-radius: 999px;
            border: 2px solid rgba(34, 42, 58, 0.85);
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.35);
        }
        #transcript-inner::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg,
                rgba(92, 108, 134, 0.98) 0%,
                rgba(68, 82, 108, 0.95) 100%);
            box-shadow: 0 0 10px rgba(100, 118, 145, 0.22);
        }

        .bottom-row {
            width: min(560px, 92vw);
            display: flex;
            gap: 16px;
            flex-shrink: 0;
        }
        .btn-saveload {
            flex: 1;
            height: clamp(44px, 10vh, 60px);
            border-radius: 12px;
            cursor: pointer;
            outline: none;
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(0.85rem, 3vw, 1.05rem);
            letter-spacing: 0.3em;
            color: rgba(0, 210, 255, 0.95);
            background: rgba(8, 18, 38, 0.9);
            border: 1px solid rgba(0, 210, 255, 0.8);
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.28);
            transition: transform 0.12s, background 0.12s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            container-type: size;
        }
        .btn-saveload .sl-icon { display: none; }
        body.mini .btn-saveload .sl-label { display: none; }
        body.mini .btn-saveload .sl-icon {
            display: block;
            width: 50cqmin;
            height: 50cqmin;
            max-width: 60%;
            max-height: 60%;
            stroke: rgba(0, 210, 255, 0.95);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .btn-saveload:hover:not(:disabled) {
            background: rgba(0, 210, 255, 0.08);
        }
        .btn-saveload:active:not(:disabled) { transform: scale(0.97); }
        .btn-saveload:disabled {
            cursor: not-allowed;
            color: rgba(0, 210, 255, 0.25);
            border-color: rgba(0, 210, 255, 0.25);
            box-shadow: none;
        }
        #btn-save.unsaved .sl-label,
        #btn-save.unsaved .sl-icon {
            animation: pulse-label 1.2s ease-in-out infinite;
        }
        body.mini .btn-saveload:disabled .sl-icon { stroke: rgba(0, 210, 255, 0.25); }
        @keyframes pulse-label {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.35; }
        }

        #build-info {
            font-family: 'Raleway', sans-serif;
            font-size: 0.9rem;
            color: rgba(180, 210, 235, 0.85);
            letter-spacing: 0.05em;
            margin-top: -2px;
            flex-shrink: 0;
            cursor: pointer;
            user-select: none;
        }
        #build-info:hover { color: rgba(0, 210, 255, 1); }

        /* ── Whisper status banner ─────────────────────── */
        #whisper-status {
            position: fixed;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            padding: 6px 14px;
            font-family: 'Raleway', sans-serif;
            font-size: 0.78rem;
            color: rgba(0, 210, 255, 0.95);
            background: rgba(8, 18, 38, 0.92);
            border: 1px solid rgba(0, 210, 255, 0.6);
            border-radius: 999px;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.3);
            z-index: 25;
            display: none;
            max-width: 92vw;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #whisper-status.visible { display: block; }
        #whisper-status.busy { animation: pulse-label 1.3s ease-in-out infinite; }

        /* ── Library dialog ─────────────────────────────── */
        #library-dialog {
            position: fixed; inset: 0;
            display: none;
            align-items: center; justify-content: center;
            background: rgba(0, 0, 20, 0.7);
            backdrop-filter: blur(3px);
            z-index: 55;
        }
        #library-dialog.visible { display: flex; }
        #library-dialog .lib-card {
            background: rgba(8, 18, 38, 0.98);
            border: 1px solid rgba(0, 210, 255, 0.8);
            border-radius: 14px;
            box-shadow: 0 0 24px rgba(0, 210, 255, 0.3);
            padding: 22px 24px;
            width: min(520px, 92vw);
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            font-family: 'Raleway', sans-serif;
            color: rgba(220, 230, 245, 0.95);
        }
        #library-dialog .lib-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 0.3em;
            color: rgba(0, 210, 255, 0.95);
            margin-bottom: 14px;
        }
        #library-dialog .lib-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
            min-height: 80px;
            max-height: 50vh;
        }
        #library-dialog .lib-empty {
            display: none;
            color: rgba(180, 200, 220, 0.5);
            text-align: center;
            padding: 24px 0;
            font-size: 0.9rem;
        }
        #library-dialog.empty .lib-empty { display: block; }
        #library-dialog.empty .lib-list  { display: none; }
        #library-dialog .lib-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: rgba(0, 210, 255, 0.05);
            border: 1px solid rgba(0, 210, 255, 0.25);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.12s, border-color 0.12s;
        }
        #library-dialog .lib-item:hover {
            background: rgba(0, 210, 255, 0.12);
            border-color: rgba(0, 210, 255, 0.6);
        }
        #library-dialog .lib-name {
            flex: 1;
            font-size: 0.85rem;
            color: rgba(220, 230, 245, 0.95);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #library-dialog .lib-meta {
            font-size: 0.72rem;
            color: rgba(160, 190, 215, 0.6);
            margin-right: 8px;
        }
        #library-dialog .lib-del {
            background: transparent;
            border: 1px solid rgb(196, 30, 58);
            color: rgb(196, 30, 58);
            width: 28px; height: 28px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            line-height: 1;
            flex-shrink: 0;
        }
        #library-dialog .lib-del:hover { background: rgba(196, 30, 58, 0.12); }
        #library-dialog .lib-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        /* ── Confirm dialog ────────────────────────────── */
        #confirm-dialog {
            position: fixed; inset: 0;
            display: none;
            align-items: center; justify-content: center;
            background: rgba(0, 0, 20, 0.7);
            backdrop-filter: blur(3px);
            z-index: 60;
        }
        #confirm-dialog.visible { display: flex; }
        #confirm-dialog .cdlg-card {
            background: rgba(8, 18, 38, 0.98);
            border: 1px solid rgba(0, 210, 255, 0.8);
            border-radius: 14px;
            box-shadow: 0 0 24px rgba(0, 210, 255, 0.3);
            padding: 24px 28px;
            width: min(420px, 90vw);
            font-family: 'Raleway', sans-serif;
            color: rgba(220, 230, 245, 0.95);
        }
        #confirm-dialog .cdlg-msg {
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 22px;
        }
        #confirm-dialog .cdlg-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }
        #confirm-dialog .cdlg-btn {
            min-width: 110px;
            height: 44px;
            border-radius: 8px;
            background: rgba(8, 18, 38, 0.9);
            border: 1px solid rgba(0, 210, 255, 0.6);
            color: rgba(0, 210, 255, 0.95);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.25em;
            cursor: pointer;
            transition: background 0.12s, transform 0.12s;
        }
        #confirm-dialog .cdlg-btn:hover { background: rgba(0, 210, 255, 0.1); }
        #confirm-dialog .cdlg-btn:active { transform: scale(0.96); }
        #confirm-dialog .cdlg-btn.ok {
            border-color: rgb(176, 36, 24);
            color: rgb(245, 194, 66);
            box-shadow: 0 0 8px rgba(176, 36, 24, 0.4);
        }
        #confirm-dialog .cdlg-btn.ok:hover { background: rgba(176, 36, 24, 0.12); }

        /* ── Centered AI loader ───────────────────────── */
        #ai-loading {
            position: fixed; inset: 0;
            display: none;
            align-items: center; justify-content: center;
            background: rgba(0, 0, 20, 0.55);
            backdrop-filter: blur(2px);
            z-index: 50;
        }
        #ai-loading.visible { display: flex; }
        #ai-loading .ai-box {
            padding: 40px 56px;
            border-radius: 16px;
            background: rgba(8, 18, 38, 0.95);
            text-align: center;
            min-width: 260px;
            box-shadow: 0 0 40px rgba(0, 210, 255, 0.25);
        }

        /* orbiting chase dots */
        #ai-loading .ai-orbit {
            position: relative;
            width: 80px; height: 80px;
            margin: 0 auto 24px;
            animation: ai-spin 1.6s linear infinite;
        }
        #ai-loading .ai-dot {
            position: absolute;
            top: 50%; left: 50%;
            width: 12px; height: 12px;
            margin: -6px 0 0 -6px;
            border-radius: 50%;
            background: rgb(0, 210, 255);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.9);
            opacity: 1;
        }
        #ai-loading .ai-dot:nth-child(1) { transform: rotate(  0deg) translateX(34px); }
        #ai-loading .ai-dot:nth-child(2) { transform: rotate( 72deg) translateX(34px); }
        #ai-loading .ai-dot:nth-child(3) { transform: rotate(144deg) translateX(34px); }
        #ai-loading .ai-dot:nth-child(4) { transform: rotate(216deg) translateX(34px); }
        #ai-loading .ai-dot:nth-child(5) { transform: rotate(288deg) translateX(34px); }

        #ai-loading .ai-text {
            font-family: 'Raleway', sans-serif;
            font-weight: 500;
            font-size: 1.1rem;
            letter-spacing: 0.35em;
            color: rgba(0, 210, 255, 0.95);
            text-shadow: 0 0 8px rgba(0, 210, 255, 0.5);
            margin-bottom: 8px;
        }
        #ai-loading .ai-hint {
            font-family: 'Raleway', sans-serif;
            font-size: 0.78rem;
            color: rgba(180, 210, 230, 0.65);
            letter-spacing: 0.05em;
        }
        #ai-loading .ai-timer {
            font-family: 'Raleway', sans-serif;
            font-size: 0.78rem;
            font-variant-numeric: tabular-nums;
            color: rgba(180, 210, 230, 0.65);
            letter-spacing: 0.05em;
            margin-top: 4px;
        }
        #ai-loading .ai-progress {
            font-family: 'Raleway', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            color: rgba(180, 220, 240, 0.8);
        }
        @keyframes ai-spin {
            to { transform: rotate(360deg); }
        }

        /* ── Pixel dialog ─────────────────────────────────── */
        #pixel-dialog {
            position: fixed; inset: 0;
            background: rgba(0, 0, 20, 0.85);
            display: flex; align-items: center; justify-content: center;
            z-index: 30;
            backdrop-filter: blur(4px);
        }
        #pixel-dialog .dlg-card {
            background: rgba(8, 18, 38, 0.98);
            border: 1px solid rgba(0, 210, 255, 0.8);
            border-radius: 14px;
            box-shadow: 0 0 24px rgba(0, 210, 255, 0.3);
            padding: 24px 28px;
            width: min(420px, 90vw);
            font-family: 'Raleway', sans-serif;
            color: rgba(220, 230, 245, 0.95);
        }
        #pixel-dialog h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            letter-spacing: 0.2em;
            color: rgba(0, 210, 255, 0.95);
            margin-bottom: 14px;
        }
        #pixel-dialog p { font-size: 0.85rem; line-height: 1.5; margin-bottom: 18px; }
        #pixel-dialog em { color: rgb(245, 194, 66); font-style: normal; }
        #pixel-dialog .radio {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; margin-bottom: 8px;
            background: rgba(0, 210, 255, 0.05);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        #pixel-dialog .radio input { accent-color: rgb(0, 210, 255); transform: scale(1.2); }
        #pixel-dialog button {
            margin-top: 14px;
            width: 100%;
            height: 44px;
            border-radius: 8px;
            background: rgba(8, 18, 38, 0.9);
            border: 1px solid rgba(0, 210, 255, 0.8);
            color: rgba(0, 210, 255, 0.95);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.25em;
            cursor: pointer;
        }
        #pixel-dialog button:hover { background: rgba(0, 210, 255, 0.1); }
    </style>
</head>
<body>
    <div class="btn-row">
        <button class="btn" id="btn-record" title="Record">
            <svg viewBox="0 0 40 40">
                <circle cx="20" cy="20" r="14" fill="rgb(245, 194, 66)"/>
            </svg>
        </button>

        <button class="btn" id="btn-play" title="Play" disabled>
            <svg viewBox="0 0 52 52">
                <polygon class="icon-play" points="14,6 46,26 14,46" fill="rgb(121, 158, 49)"/>
                <rect class="icon-stop" x="12" y="12" width="28" height="28" rx="3" fill="rgb(121, 158, 49)"/>
            </svg>
        </button>
    </div>

    <div id="transcript-box">
        <div id="transcript-inner"></div></div>

    <div class="bottom-row">

    <!-- Whisper status — small banner for transcription/short messages -->

    <!-- Library dialog (saved recordings) -->

    <!-- Centered AI loader — shown while model downloads -->
    <div id="ai-loading">

                <span class="ai-dot"></span>

            </div>
            <div class="ai-text">LOADING AI</div>

    <!-- Pixel dialog entfernt — Whisper macht das obsolet -->

    <button id="btn-fullscreen" title="Fullscreen"></button>

    <!-- ── Whisper (transformers.js) — single transcription path for ALL browsers ── -->
    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';
        env.allowLocalModels = false; // load from HF Hub / CDN

        const statusEl   = document.getElementById('whisper-status');
        const aiLoadEl   = document.getElementById('ai-loading');
        const aiTimerEl  = aiLoadEl.querySelector('.ai-timer');

        function setStatus(msg, busy) {
            if (!msg) { statusEl.classList.remove('visible','busy'); return; }
            statusEl.textContent = msg;
            statusEl.classList.add('visible');
            statusEl.classList.toggle('busy', !!busy);
        }
        let loaderStartT = 0;
        let loaderTimerId = null;
        function tickTimer() {
            const s = Math.floor((Date.now() - loaderStartT) / 1000);
            const mm = String(Math.floor(s / 60)).padStart(2, '0');
            const ss = String(s % 60).padStart(2, '0');
            aiTimerEl.textContent = `${mm}:${ss}`;
        }
        function showLoader() {
            aiLoadEl.classList.add('visible');
            if (loaderTimerId) return;
            loaderStartT = Date.now();
            tickTimer();
            loaderTimerId = setInterval(tickTimer, 1000);
        }
        function hideLoader() {
            aiLoadEl.classList.remove('visible');
            clearInterval(loaderTimerId); loaderTimerId = null;
        }

        let transcriber = null;
        let loading = null;

        async function loadModel() {
            if (transcriber) return transcriber;
            if (loading) return loading;
            loading = (async () => {
                showLoader();
                try {
                    // whisper-base: gute Genauigkeit. WebGPU wenn verfügbar (5-10x schneller).
                    const hasWebGPU = !!navigator.gpu;
                    transcriber = await pipeline(
                        'automatic-speech-recognition',
                        'Xenova/whisper-base',
                        {
                            quantized: true,
                            device: hasWebGPU ? 'webgpu' : 'wasm'
                        }
                    );
                    hideLoader();
                } catch (e) {
                    hideLoader();
                    setStatus('Whisper-Fehler: ' + (e.message || e), false);
                    throw e;
                }
            })();
            await loading;
            return transcriber;
        }

        // Expose a global so the main script can call it
        window.transcribeAudioBlob = async (blob, lang) => {
            await loadModel();
            setStatus('Transkribiere…', true);
            try {
                const arrayBuffer = await blob.arrayBuffer();
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                let pcm;
                if (audioBuffer.numberOfChannels > 1) {
                    pcm = new Float32Array(audioBuffer.length);
                    for (let c = 0; c < audioBuffer.numberOfChannels; c++) {
                        const ch = audioBuffer.getChannelData(c);
                        for (let i = 0; i < pcm.length; i++) pcm[i] += ch[i] / audioBuffer.numberOfChannels;
                    }
                } else {
                    pcm = audioBuffer.getChannelData(0);
                }
                await audioCtx.close();
                const out = await transcriber(pcm, {
                    language: lang || 'german',
                    task: 'transcribe',
                    return_timestamps: false
                });
                setStatus(null);
                return (out && out.text) ? out.text.trim() : '';
            } catch (e) {
                setStatus('Transkriptions-Fehler: ' + (e.message || e), false);
                throw e;
            }
        };

        // start downloading the model in the background ONLY if whisper engine is selected
        if ((localStorage.getItem('transcriber.engine') || 'webspeech') === 'whisper') {
            loadModel().catch(() => {});
        }
    </script>

    <script>
        const btnRecord    = document.getElementById('btn-record');
        const btnPlay      = document.getElementById('btn-play');
        const btnSave  = document.getElementById('btn-save');
        const btnLoad  = document.getElementById('btn-load');
        const transcriptEl = document.getElementById('transcript-inner');

        let mediaRecorder = null;
        let audioChunks   = [];
        let audioUrl      = null;
        let audioEl       = null;
        let isRecording   = false;
        let isPlaying     = false;
        let recognition   = null;
        let currentBlob   = null;
        let isDirty       = false; // recording exists but not downloaded

        // ── IndexedDB ────────────────────────────────────────────
        const DB_NAME = 'voicerec', DB_VERSION = 2;
        const STORE = 'recordings', KEY = 'current';
        const STORE_LIB = 'library';
        function openDB() {
            return new Promise((res, rej) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = () => {
                    const db = req.result;
                    if (!db.objectStoreNames.contains(STORE))     db.createObjectStore(STORE);
                    if (!db.objectStoreNames.contains(STORE_LIB)) db.createObjectStore(STORE_LIB);
                };
                req.onsuccess = () => res(req.result);
                req.onerror   = () => rej(req.error);
            });
        }
        async function saveToDB(blob, transcript) {
            const db = await openDB();
            const tx = db.transaction(STORE, 'readwrite');
            tx.objectStore(STORE).put({ blob, transcript, savedAt: Date.now() }, KEY);
            return new Promise(res => tx.oncomplete = () => res());
        }
        async function loadFromDB() {
            const db = await openDB();
            const tx = db.transaction(STORE, 'readonly');
            return new Promise(res => {
                const r = tx.objectStore(STORE).get(KEY);
                r.onsuccess = () => res(r.result || null);
                r.onerror   = () => res(null);
            });
        }
        async function clearDB() {
            const db = await openDB();
            const tx = db.transaction(STORE, 'readwrite');
            tx.objectStore(STORE).delete(KEY);
            return new Promise(res => tx.oncomplete = () => res());
        }

        // ── Library (Liste aller gespeicherten Aufnahmen) ─────
        async function saveToLibrary(blob, transcript, name) {
            const db = await openDB();
            const tx = db.transaction(STORE_LIB, 'readwrite');
            const id = Date.now();
            tx.objectStore(STORE_LIB).put({ id, blob, transcript, name, savedAt: id }, id);
            return new Promise(res => tx.oncomplete = () => res(id));
        }
        async function listLibrary() {
            const db = await openDB();
            const tx = db.transaction(STORE_LIB, 'readonly');
            return new Promise(res => {
                const r = tx.objectStore(STORE_LIB).getAll();
                r.onsuccess = () => res(r.result || []);
                r.onerror   = () => res([]);
            });
        }
        async function deleteFromLibrary(id) {
            const db = await openDB();
            const tx = db.transaction(STORE_LIB, 'readwrite');
            tx.objectStore(STORE_LIB).delete(id);
            return new Promise(res => tx.oncomplete = () => res());
        }

        function setDirty(v) {
            isDirty = v;
            btnSave.classList.toggle('unsaved', v);
        }

        // Voice commands → formatting
        //   "absatz"     → \n (line break)
        //   "neue idee"  → blank line + "Idee #N" + newline (N counts sequentially)
        function formatCommands(text) {
            if (!text) return text;
            let n = 0;
            return text
                .replace(/\bneue\s+idee\s*[.,;:]?/gi, () => { n++; return `\n\nIdee ${n}\n`; })
                .replace(/\babsatz\s*[.,;:]?/gi, '\n');
        }

        // ── Custom confirm dialog (replaces window.confirm) ───────
        function uiConfirm(message) {
            return new Promise(resolve => {
                const dlg  = document.getElementById('confirm-dialog');
                const msg  = dlg.querySelector('.cdlg-msg');
                const okEl = dlg.querySelector('.cdlg-btn.ok');
                const cancelEl = dlg.querySelector('.cdlg-btn.cancel');
                msg.textContent = message;
                dlg.classList.add('visible');
                const cleanup = (result) => {
                    dlg.classList.remove('visible');
                    okEl.removeEventListener('click', onOk);
                    cancelEl.removeEventListener('click', onCancel);
                    document.removeEventListener('keydown', onKey);
                    resolve(result);
                };
                const onOk     = () => cleanup(true);
                const onCancel = () => cleanup(false);
                const onKey    = e => {
                    if (e.key === 'Enter')  onOk();
                    if (e.key === 'Escape') onCancel();
                };
                okEl.addEventListener('click', onOk);
                cancelEl.addEventListener('click', onCancel);
                document.addEventListener('keydown', onKey);
            });
        }

        // ── Recognition event log ────────────────────────────────
        let recLog = [];
        const tStamp = () => {
            const d = new Date();
            return String(d.getHours()).padStart(2,'0') + ':' +
                   String(d.getMinutes()).padStart(2,'0') + ':' +
                   String(d.getSeconds()).padStart(2,'0') + '.' +
                   String(d.getMilliseconds()).padStart(3,'0');
        };
        const logRec = (msg) => recLog.push(`${tStamp()} ${msg}`);
        // const logRec = () => {};

        // ── Transcription engine switch ──────────────────────────
        // 'webspeech' = live transcription via browser API (default, better quality reported)
        // 'whisper'   = post-record transcription via local Whisper model (more universal)
        let engine = localStorage.getItem('transcriber.engine') || 'webspeech';

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let finalText = '';
        let savedFinal = '';

        logRec(`UA: ${navigator.userAgent.substring(0, 80)}`);

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous    = true;
            recognition.interimResults = true;
            recognition.lang          = 'de-DE';

            recognition.onaudiostart   = () => logRec('audiostart');
            recognition.onsoundstart   = () => logRec('soundstart');
            recognition.onspeechstart  = () => logRec('speechstart');
            recognition.onspeechend    = () => logRec('speechend');
            recognition.onsoundend     = () => logRec('soundend');
            recognition.onaudioend     = () => logRec('audioend');
            recognition.onnomatch      = () => logRec('nomatch');
            recognition.onstart        = () => logRec('start');

            recognition.onresult = e => {
                // Collect all final transcripts in order, then dedupe:
                // - cumulative (Lenovo etc.): later final starts with previous → replace
                // - discrete (Mac etc.):      later final is independent → append
                const finals = [];
                let interim = '';
                const dump = [];
                for (let i = 0; i < e.results.length; i++) {
                    const t = e.results[i][0].transcript;
                    const f = e.results[i].isFinal;
                    dump.push(`[${i}]${f?'F':'I'}="${t}"`);
                    if (f) finals.push(t);
                    else   interim = t;
                }
                const deduped = [];
                for (const f of finals) {
                    const prev = deduped[deduped.length - 1];
                    if (prev && f.trim().startsWith(prev.trim())) {
                        deduped[deduped.length - 1] = f;     // cumulative → replace
                    } else {
                        deduped.push(f);                      // discrete    → append
                    }
                }
                const sessionFinal = deduped.join(' ').replace(/\s+/g, ' ').trim();
                logRec(`result idx=${e.resultIndex} ${dump.join(' ')}`);
                finalText = savedFinal + sessionFinal;
                transcriptEl.textContent = formatCommands(finalText) + (interim ? ' ' + interim : '');
            };
            recognition.onend = () => {
                // promote session's final text into savedFinal with a trailing space
                savedFinal = finalText.replace(/\s+$/, '') + (finalText ? ' ' : '');
                finalText = savedFinal;
                // only paint if we have text — don't wipe interim that's visible on screen
                if (finalText) transcriptEl.textContent = formatCommands(finalText);
                logRec(`end (finalText.len=${finalText.length})`);

                if (isRecording) {
                    // restart in next tick — same-tick restart throws InvalidStateError on iOS Safari
                    setTimeout(() => {
                        if (!isRecording) return;
                        try {
                            recognition.start();
                            logRec('recognition auto-restarted');
                        } catch (e) {
                            logRec(`recognition restart THREW: ${e.message || e}`);
                        }
                    }, 100);
                    return;
                }

                if (currentBlob) {
                    saveToDB(currentBlob, finalText);
                    logRec(`saveToDB called, transcript=${finalText.length} chars`);
                }
            };
            recognition.onerror = e => {
                logRec(`ERROR: error="${e.error||''}" message="${e.message||''}"`);
            };
        } else {
            logRec('NO SpeechRecognition object — API not available');
        }

        // build timestamp — updated on every save
        const BUILD_TIME = '2026-05-16 16:10';

        // Pixel-Detection und Dialog entfernt — Whisper transkribiert den Blob unabhängig vom Mic-Konflikt

        const buildInfoEl = document.getElementById('build-info');
        buildInfoEl.textContent = `BT: ${BUILD_TIME} | engine=${localStorage.getItem('transcriber.engine') || 'webspeech'}`;
        buildInfoEl.title = 'Klick: hart neu laden';
        buildInfoEl.addEventListener('click', () => {
            const url = location.pathname + '?cb=' + Date.now() + location.hash;
            location.replace(url);
        });

        // ── Restore from IndexedDB on load ───────────────────────
        (async () => {
            const dbg = [];
            try {
                const stored = await loadFromDB();
                if (!stored) {
                    dbg.push('IDB: nichts gespeichert');
                } else {
                    dbg.push('IDB stored keys: ' + Object.keys(stored).join(','));
                    dbg.push('IDB blob: ' + (stored.blob ? `${stored.blob.size}B type=${stored.blob.type||'?'}` : 'null'));
                    dbg.push('IDB transcript: ' + (stored.transcript ? `${stored.transcript.length} chars` : 'null/empty'));
                    dbg.push('IDB savedAt: ' + (stored.savedAt ? new Date(stored.savedAt).toLocaleString() : 'unknown'));

                    if (stored.blob) {
                        currentBlob = stored.blob;
                        if (audioUrl) URL.revokeObjectURL(audioUrl);
                        audioUrl = URL.createObjectURL(currentBlob);
                        audioEl  = new Audio(audioUrl);
                        btnPlay.disabled = false;
                        btnSave.disabled = false;
                        setDirty(true);
                    }
                    if (stored.transcript) {
                        finalText = stored.transcript;
                        savedFinal = stored.transcript;
                    }
                }
            } catch (e) {
                dbg.push('IDB ERROR: ' + (e.message || e));
            }
            // show restored transcript (debug-dump auskommentiert)
            // transcriptEl.textContent = '[DEBUG]\n' + dbg.join('\n') + '\n\n' + (finalText || '');
            transcriptEl.textContent = formatCommands(finalText || '');
        })();

        // ── Record ───────────────────────────────────────────────
        btnRecord.addEventListener('click', async () => {
            if (isPlaying) return;

            if (!isRecording) {
                try {
                    if (!navigator.mediaDevices?.getUserMedia) {
                        throw new Error('getUserMedia nicht verfügbar (HTTPS nötig)');
                    }
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

                    // pick a supported MIME type — Android often lacks audio/webm
                    const candidates = [
                        'audio/webm;codecs=opus',
                        'audio/webm',
                        'audio/ogg;codecs=opus',
                        'audio/mp4;codecs=mp4a.40.2',
                        'audio/mp4',
                        ''   // fallback: let browser decide
                    ];
                    let mimeType = '';
                    for (const c of candidates) {
                        if (c === '' || MediaRecorder.isTypeSupported(c)) { mimeType = c; break; }
                    }

                    mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
                    const usedType = mediaRecorder.mimeType || mimeType || 'audio/webm';
                    logRec(`MediaRecorder mimeType=${usedType}`);

                    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                    mediaRecorder.onstop = async () => {
                        if (audioUrl) URL.revokeObjectURL(audioUrl);
                        currentBlob = new Blob(audioChunks, { type: usedType });
                        audioUrl = URL.createObjectURL(currentBlob);
                        audioEl  = new Audio(audioUrl);
                        btnPlay.disabled = false;
                        btnSave.disabled = false;
                        stream.getTracks().forEach(t => t.stop());
                        setDirty(true);

                        // Whisper post-process — only when engine='whisper'
                        if (engine === 'whisper' && window.transcribeAudioBlob) {
                            try {
                                const text = await window.transcribeAudioBlob(currentBlob, 'german');
                                const sep = savedFinal && !savedFinal.endsWith(' ') ? ' ' : '';
                                savedFinal = (savedFinal || '') + sep + text;
                                finalText  = savedFinal;
                                transcriptEl.textContent = formatCommands(finalText);
                            } catch (e) { /* error already shown via setStatus */ }
                        }
                        await saveToDB(currentBlob, finalText);

                        // Diagnostic dump if nothing was transcribed
                        if (!finalText) {
                            transcriptEl.textContent = '[DEBUG-LOG]\n' + recLog.join('\n');
                        }
                    };

                    isRecording = true;
                    btnRecord.classList.add('active');
                    btnPlay.disabled = true;
                    recLog = [];

                    // engine='webspeech': start live recognition; MediaRecorder follows after delay
                    // engine='whisper':   only MediaRecorder; Whisper transcribes blob after stop
                    if (engine === 'webspeech' && recognition) {
                        try {
                            recognition.start();
                            logRec('recognition.start() called');
                        } catch (e) {
                            logRec(`recognition.start THREW: ${e.message || e}`);
                        }
                    }

                    setTimeout(() => {
                        try {
                            mediaRecorder.start();
                            logRec('mediaRecorder.start');
                        } catch (e) {
                            logRec(`mediaRecorder.start THREW: ${e.message || e}`);
                        }
                    }, engine === 'webspeech' && recognition ? 600 : 0);

                } catch (err) {
                    // surface error in the transcript area so user can see what failed
                    transcriptEl.textContent = '[Mikrofon-Fehler] ' + (err && err.message ? err.message : err);
                }

            } else {
                if (recognition) recognition.stop();
                try {
                    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
                } catch (e) { logRec('mediaRecorder.stop error: ' + (e.message||e)); }
                isRecording = false;
                btnRecord.classList.remove('active');
            }
        });

        // ── Play / Stop ──────────────────────────────────────────
        btnPlay.addEventListener('click', () => {
            if (isRecording || !audioEl) return;
            if (isPlaying) {
                audioEl.pause();
                audioEl.currentTime = 0;
                isPlaying = false;
                btnPlay.classList.remove('playing');
                return;
            }
            isPlaying = true;
            btnPlay.classList.add('playing');
            audioEl.currentTime = 0;
            audioEl.play();
            audioEl.onended = () => {
                isPlaying = false;
                btnPlay.classList.remove('playing');
                audioEl = new Audio(audioUrl);
            };
        });

        // ── Save (audio + transcript sidecar + library) ──────────
        function audioExt(blob) {
            const t = (blob.type || '').toLowerCase();
            if (t.includes('mp4'))  return '.m4a';
            if (t.includes('ogg'))  return '.ogg';
            if (t.includes('wav'))  return '.wav';
            if (t.includes('mpeg')) return '.mp3';
            return '.webm';
        }
        btnSave.addEventListener('click', async () => {
            if (!currentBlob) return;
            const d = new Date();
            const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
            const baseName = `recording ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;

            // audio file
            const a1 = document.createElement('a');
            a1.href = URL.createObjectURL(currentBlob);
            a1.download = baseName + audioExt(currentBlob);
            a1.click();
            URL.revokeObjectURL(a1.href);

            // transcript sidecar (only if there is text)
            const text = transcriptEl.textContent.trim();
            if (text) {
                const a2 = document.createElement('a');
                const tBlob = new Blob([text], { type: 'text/plain;charset=utf-8' });
                a2.href = URL.createObjectURL(tBlob);
                a2.download = baseName + '.txt';
                a2.click();
                URL.revokeObjectURL(a2.href);
            }

            // also keep in library
            await saveToLibrary(currentBlob, text, baseName);

            setDirty(false);
        });

// ── Fullscreen toggle ────────────────────────────────────
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen?.();
            } else {
                document.exitFullscreen?.();
            }
        }
        document.getElementById('btn-fullscreen').addEventListener('click', toggleFullscreen);

        // Right-click anywhere → popup with action buttons (radial layout)
        const miniStack = document.getElementById('mini-stack');
        // per-button manual y-offsets (ellipse is just a starting point)
        const Y_OFFSETS = {
            'mb-mini-toggle':  -4,   // war -20, jetzt 16 runter
            'mb-del-all':      16,   // 16 runter
            'mb-reload-ai':    16,   // 16 runter
            'mb-del-voice':   -16,   // 16 hoch
            'mb-copy-text':     4,   // war +20, jetzt 16 hoch
            'mb-load-file':   -16,   // 16 hoch
        };
        function openPopup(clientX, clientY) {
            const W = 320, H = 260;
            const rx = 105, ry = 95;
            const x = Math.max(8, Math.min(clientX - W / 2, window.innerWidth  - W - 8));
            const y = Math.max(8, Math.min(clientY - H / 2, window.innerHeight - H - 8));
            miniStack.style.left = x + 'px';
            miniStack.style.top  = y + 'px';
            miniStack.classList.add('popup');

            const btns = Array.from(miniStack.querySelectorAll('.mini-btn'));
            const n = btns.length;
            btns.forEach((b, i) => {
                const angle = (i / n) * 2 * Math.PI - Math.PI / 2;
                const px = W / 2 + Math.cos(angle) * rx;
                const py = H / 2 + Math.sin(angle) * ry + (Y_OFFSETS[b.id] || 0);
                b.style.left = px + 'px';
                b.style.top  = py + 'px';
            });
        }
        // clear inline positions when popup closes (so body.mini view stays stacked)
        function clearPopupPositions() {
            miniStack.querySelectorAll('.mini-btn').forEach(b => {
                b.style.left = '';
                b.style.top  = '';
            });
        }
        window.addEventListener('contextmenu', e => {
            e.preventDefault();
            openPopup(e.clientX, e.clientY);
        });

        // Long-press on touch devices → also opens popup (iOS Safari hat kein Rechtsklick)
        let lpTimer = null, lpStartX = 0, lpStartY = 0;
        document.addEventListener('touchstart', e => {
            if (e.target.closest('button, input, label')) return;
            if (miniStack.classList.contains('popup')) return;
            const t = e.touches[0];
            lpStartX = t.clientX;
            lpStartY = t.clientY;
            clearTimeout(lpTimer);
            lpTimer = setTimeout(() => {
                openPopup(lpStartX, lpStartY);
                lpTimer = null;
            }, 550);
        }, { passive: true });
        document.addEventListener('touchmove', e => {
            const t = e.touches[0];
            if (Math.abs(t.clientX - lpStartX) > 8 || Math.abs(t.clientY - lpStartY) > 8) {
                clearTimeout(lpTimer); lpTimer = null;
            }
        }, { passive: true });
        document.addEventListener('touchend',   () => { clearTimeout(lpTimer); lpTimer = null; });
        document.addEventListener('touchcancel',() => { clearTimeout(lpTimer); lpTimer = null; });

        // close popup after a button click inside it (click fires AFTER mousedown)
        miniStack.addEventListener('click', e => {
            if (e.target.tagName === 'BUTTON') {
                miniStack.classList.remove('popup');
                clearPopupPositions();
            }
        });
        // close popup on click outside
        document.addEventListener('mousedown', e => {
            if (miniStack.classList.contains('popup') && !miniStack.contains(e.target)) {
                miniStack.classList.remove('popup');
                clearPopupPositions();
            }
        });

        // ── Mini-mode toggle (from popup) ────────────────────────
        const btnMiniToggle = document.getElementById('mb-mini-toggle');
        btnMiniToggle.addEventListener('click', () => {
            document.body.classList.toggle('mini');
            btnMiniToggle.textContent = document.body.classList.contains('mini') ? 'FULL MODE' : 'MINI MODE';
        });

        // ── Mini-mode actions ────────────────────────────────────
        document.getElementById('mb-del-all').addEventListener('click', async () => {
            if (!await uiConfirm('Alles löschen — Aufnahme und Text?')) return;
            audioChunks = [];
            currentBlob = null;
            if (audioUrl) { URL.revokeObjectURL(audioUrl); audioUrl = null; }
            audioEl = null;
            finalText = '';
            savedFinal = '';
            transcriptEl.textContent = '';
            btnPlay.disabled = true;
            btnSave.disabled = true;
            await clearDB();
            setDirty(false);
        });

        document.getElementById('mb-del-text').addEventListener('click', async () => {
            if (!await uiConfirm('Transkript löschen?')) return;
            finalText = '';
            savedFinal = '';
            transcriptEl.textContent = '';
            if (currentBlob) saveToDB(currentBlob, '');
        });

        document.getElementById('mb-del-voice').addEventListener('click', async () => {
            if (!await uiConfirm('Aufnahme löschen?')) return;
            audioChunks = [];
            currentBlob = null;
            if (audioUrl) { URL.revokeObjectURL(audioUrl); audioUrl = null; }
            audioEl = null;
            btnPlay.disabled = true;
            btnSave.disabled = true;
            await clearDB();
            setDirty(false);
        });

        document.getElementById('mb-copy-text').addEventListener('click', async () => {
            const text = transcriptEl.textContent.trim();
            if (!text) return;
            try { await navigator.clipboard.writeText(text); } catch (e) {}
        });

        // ── Engine toggle ────────────────────────────────────────
        const btnEngine = document.getElementById('mb-engine');
        function refreshEngineLabel() {
            btnEngine.textContent = engine.toUpperCase();
        }
        refreshEngineLabel();
        btnEngine.addEventListener('click', () => {
            engine = (engine === 'webspeech') ? 'whisper' : 'webspeech';
            localStorage.setItem('transcriber.engine', engine);
            refreshEngineLabel();
        });

        // ── Reload AI (debug): clear cached Whisper model + hard reload ─
        document.getElementById('mb-reload-ai').addEventListener('click', async () => {
            try {
                const keys = await caches.keys();
                await Promise.all(keys.map(k => caches.delete(k)));
            } catch (e) { /* ignore */ }
            const url = location.pathname + '?cb=' + Date.now() + location.hash;
            location.replace(url);
        });

        // ── Load file(s): audio + optional transcript sidecar ─────
        const fileInput = document.getElementById('file-input');
        document.getElementById('mb-load-file').addEventListener('click', () => fileInput.click());

        // ── Library list dialog (shown on bottom LOAD click) ─────
        const libDlg     = document.getElementById('library-dialog');
        const libListEl  = libDlg.querySelector('.lib-list');
        const libCancel  = document.getElementById('lib-cancel');
        const libFromFile= document.getElementById('lib-from-file');

        async function loadAudioBlob(blob, transcript, name) {
            if (audioUrl) URL.revokeObjectURL(audioUrl);
            currentBlob = blob;
            audioUrl = URL.createObjectURL(currentBlob);
            audioEl  = new Audio(audioUrl);
            btnPlay.disabled = false;
            btnSave.disabled = false;
            if (typeof transcript === 'string') {
                finalText  = transcript;
                savedFinal = transcript;
                transcriptEl.textContent = formatCommands(transcript);
            }
            await saveToDB(currentBlob, finalText);
            setDirty(false);
        }

        async function openLibrary() {
            libListEl.innerHTML = '';
            const items = await listLibrary();
            // newest first
            items.sort((a, b) => b.savedAt - a.savedAt);
            libDlg.classList.toggle('empty', items.length === 0);
            items.forEach(it => {
                const row = document.createElement('div');
                row.className = 'lib-item';
                row.innerHTML = `
                    <div class="lib-name"></div>
                    <div class="lib-meta"></div>
                    <button class="lib-del" title="Löschen">×</button>
                `;
                row.querySelector('.lib-name').textContent = it.name || ('recording ' + new Date(it.savedAt).toLocaleString());
                const sizeKB = Math.round((it.blob?.size || 0) / 1024);
                row.querySelector('.lib-meta').textContent = `${sizeKB} KB`;
                row.addEventListener('click', e => {
                    if (e.target.classList.contains('lib-del')) return;
                    loadAudioBlob(it.blob, it.transcript, it.name);
                    libDlg.classList.remove('visible');
                });
                row.querySelector('.lib-del').addEventListener('click', async (e) => {
                    e.stopPropagation();
                    if (!await uiConfirm(`Aufnahme "${it.name}" löschen?`)) return;
                    await deleteFromLibrary(it.id);
                    openLibrary();
                });
                libListEl.appendChild(row);
            });
            libDlg.classList.add('visible');
        }
        btnLoad.addEventListener('click', openLibrary);
        libCancel.addEventListener('click',  () => libDlg.classList.remove('visible'));
        libFromFile.addEventListener('click',() => {
            libDlg.classList.remove('visible');
            fileInput.click();
        });
        fileInput.addEventListener('change', async () => {
            const files = Array.from(fileInput.files || []);
            if (!files.length) return;

            let audioFile = files.find(f => f.type.startsWith('audio/') || /\.(webm|mp3|wav|m4a|ogg)$/i.test(f.name));
            let textFile  = files.find(f => f.type === 'text/plain' || /\.txt$/i.test(f.name));

            if (audioFile) {
                if (audioUrl) URL.revokeObjectURL(audioUrl);
                currentBlob = audioFile;
                audioUrl = URL.createObjectURL(currentBlob);
                audioEl  = new Audio(audioUrl);
                btnPlay.disabled = false;
                btnSave.disabled = false;
            }

            if (textFile) {
                const text = await textFile.text();
                finalText  = text;
                savedFinal = text;
                transcriptEl.textContent = formatCommands(text);
            }

            if (currentBlob) await saveToDB(currentBlob, finalText);
            setDirty(false);
            fileInput.value = '';
        });

        // Fullscreen only via the top-right corner button (no long-press elsewhere).

        // ── Warn on close if unsaved ─────────────────────────────
        window.addEventListener('beforeunload', e => {
            if (isDirty) {
                e.preventDefault();
                e.returnValue = '';
                return '';
            }
        });
    </script>
</body>
</html>
