<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice Recorder</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Raleway:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="voicerecorder.css">
</head>
<body>
    <div class="btn-row">
        <button class="btn" id="btn-record" title="Record">
            <svg viewBox="0 0 40 40">
                <circle cx="20" cy="20" r="14" fill="rgb(245, 194, 66)"/>
            </svg>
        </button>

        <button class="btn" id="btn-play" title="Play" disabled>
            <svg viewBox="0 0 52 52">
                <polygon class="icon-play" points="14,6 46,26 14,46" fill="rgb(121, 158, 49)"/>
                <rect class="icon-stop" x="12" y="12" width="28" height="28" rx="3" fill="rgb(121, 158, 49)"/>
            </svg>
        </button>
    </div>

    <div id="transcript-box">
        <div id="transcript-inner"></div>
    </div>

    <div class="bottom-row">
        <button class="btn-saveload" id="btn-save" disabled>
            <span class="sl-label">SAVE</span>
            <svg class="sl-icon" viewBox="0 0 24 24">
                <path d="M12 3 v12 m-5 -5 l5 5 l5 -5 M5 20 h14"/>
            </svg>
        </button>
        <button class="btn-saveload" id="btn-load">
            <span class="sl-label">LOAD</span>
            <svg class="sl-icon" viewBox="0 0 24 24">
                <path d="M12 21 v-12 m-5 5 l5 -5 l5 5 M5 4 h14"/>
            </svg>
        </button>
    </div>

    <div id="build-info"></div>

    <div id="mini-stack">
        <button class="mini-btn" id="mb-mini-toggle">MINI MODE</button>
        <div class="mini-sep"></div>
        <button class="mini-btn danger" id="mb-del-all">DELETE ALL</button>
        <button class="mini-btn danger" id="mb-del-text">DELETE TEXT</button>
        <button class="mini-btn danger" id="mb-del-voice">DELETE VOICE</button>
        <div class="mini-sep"></div>
        <button class="mini-btn" id="mb-copy-text">COPY TEXT</button>
        <button class="mini-btn" id="mb-load-file">LOAD</button>
        <div class="mini-sep"></div>
        <button class="mini-btn" id="mb-engine">WEBSPEECH</button>
        <button class="mini-btn danger" id="mb-reload-ai">RELOAD AI</button>
    </div>

    <input type="file" id="file-input" accept="audio/*,text/plain,.txt,.webm" multiple style="display:none">

    <div id="whisper-status"></div>

    <div id="library-dialog">
        <div class="lib-card">
            <div class="lib-title">AUFNAHMEN</div>
            <div class="lib-list"></div>
            <div class="lib-empty">— keine Aufnahmen —</div>
            <div class="lib-actions">
                <button class="cdlg-btn cancel" id="lib-cancel">CANCEL</button>
                <button class="cdlg-btn" id="lib-from-file">FROM FILE…</button>
            </div>
        </div>
    </div>

    <div id="confirm-dialog">
        <div class="cdlg-card">
            <div class="cdlg-msg"></div>
            <div class="cdlg-buttons">
                <button class="cdlg-btn cancel">CANCEL</button>
                <button class="cdlg-btn ok">OK</button>
            </div>
        </div>
    </div>

    <div id="ai-loading">
        <div class="ai-box">
            <div class="ai-orbit">
                <span class="ai-dot"></span>
                <span class="ai-dot"></span>
                <span class="ai-dot"></span>
                <span class="ai-dot"></span>
                <span class="ai-dot"></span>
            </div>
            <div class="ai-text">LOADING AI</div>
            <div class="ai-hint">can take up to one minute — once only</div>
            <div class="ai-timer">00:00</div>
        </div>
    </div>

    <button id="btn-fullscreen" title="Fullscreen"></button>

    <script type="module" src="js/app.js"></script>
</body>
</html>
