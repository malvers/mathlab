<!DOCTYPE html>
<!--
  Vorrechnen: write a calculation by hand, line by line, and watch the strokes be
  grouped into symbols and rows.

  This is the missing first half of the vision in /IDEAS.md ("Nutzer schreibt
  handschriftlich Formeln, die sich kaum merkbar in LaTeX morphen"). morpheus/
  already has the morph; what never worked was knowing which stroke belongs to
  which LaTeX glyph, because morpheus rasterises the drawing and tries to recover
  the reading order from the geometry.

  Here the pen keeps what it knows: every stroke carries its position AND its
  time, and the grouping in js/stroke-symbols.js reads the order straight off it.
  No API call is involved on this page - the grouping is geometry plus the clock,
  so it can be judged, tuned and tested without a key.

  The sliders exist because the thresholds must be calibrated against real
  handwriting, not against what looks plausible in a test. Draw, watch the boxes,
  turn the knobs until they sit, then EXPORT - the saved strokes can be replayed
  offline as often as needed.
-->

<body data-vollbild="immer">

    <script src="js/cyber-left-chrome.js"></script>

    <!-- Morph building blocks from morpheus: contour tracing and polygon helpers. -->
    <script src="morpheus/geometry.js"></script>
    <script src="morpheus/contours.js"></script>
    <script src="js/katex-atome.js"></script>

    <script>
        function toggleSidebar() {
            const panel = document.getElementById('side-panel');
            panel.classList.toggle('collapsed');
            if (window.CyberLeftChrome && typeof CyberLeftChrome.publishResolvedScale === 'function') {
                CyberLeftChrome.publishResolvedScale();
            }
            setTimeout(() => {
                window.dispatchEvent(new Event('resize'));
                if (typeof init === 'function') init();
                if (window.CyberLeftChrome && typeof CyberLeftChrome.publishResolvedScale === 'function') {
                    CyberLeftChrome.publishResolvedScale();
                }
            }, 400);
        }

        // Doc, 25.09.: "Branding rechts oben auskommentieren" - the pad needs the
        // room. The central switch, so navigation and the rest stay as they are.
        // CyberBranding.init({ useExternalStyles: true, title: 'Vorrechnen', subtitle: 'Lab' });
        CyberBranding.init({ useExternalStyles: true, title: 'Vorrechnen', subtitle: 'Lab', skipCanvasBranding: true });
        CyberUI.init();

        if (window.CyberLeftChrome && typeof CyberLeftChrome.configure === 'function') {
            CyberLeftChrome.configure({ viewportOnlyZoom: true });
        }

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');

        // ── State ───────────────────────────────────────────────────────────
        // A stroke is { points: [{x, y, t}], width }. The time is what morpheus
        // never kept, and it is the only thing that separates two glyphs written
        // close together from one glyph drawn in two parts.
        const strokes = [];
        let current = null;
        let analysis = { symbols: [], lines: [] };

        const opts = Object.assign({}, StrokeSymbols.DEFAULTS);
        // Recognition result per row: { latex, tokens, zuordnung, fehler }
        const zeilenErgebnis = [];
        let erkennenLaeuft = false;
        let erkennenStand = 0;             // bumped by every change a result could miss
        // Morph state: 0 = pure handwriting, 1 = fully typeset. Per row, the
        // prepared point pairs; morphT is shared so a row moves as a whole.
        const morphVorbereitet = [];
        let morphT = 0;
        let morphAnim = null;
        // The working under the task: one LaTeX line per step, top to bottom.
        // Kept on the device - live reload must not eat a lesson's board.
        const rechenweg = [];
        try {
            const d = JSON.parse(localStorage.getItem('vorrechnen-rechenweg') || '[]');
            if (Array.isArray(d)) d.forEach(l => { if (typeof l === 'string') rechenweg.push(l); });
        } catch (_) {}
        // formelUnten: the typeset formula under the handwriting - Doc first: "lass
        // die unten weg", then: "zeig bitte doch die erkannte Formel unten x mittig
        // etwas dunkler" (25.09.)
        const view = { boxes: false, numbers: true, rows: true, penOnly: false, formelUnten: true, handballen: true };
        // Doc: boxes off by default, and the choice is remembered on the device
        try { view.boxes = localStorage.getItem('vorrechnen-boxen') === '1'; } catch (_) {}
        // the row bands are the same kind of calibration aid - Doc: "komische Box"
        view.rows = view.boxes;

        // The corpus, easy to hard. Doc copies each one by hand, ERKENNEN saves
        // the probe, and the grouping is then tuned against all of them. Roots
        // and tall brackets come late on purpose - KaTeX draws those as SVG, so
        // they show where the morph still stops.
        const VORLAGEN = [
            ['linear',        '2x+3=11'],
            ['gerade',        'y=mx+b'],
            ['quadrat',       'x^2-4=0'],
            ['pythagoras',    'a^2+b^2=c^2'],
            ['binom',         '(a+b)^2=a^2+2ab+b^2'],
            ['funktion',      'f(x)=x^3-2x'],
            ['brueche',       '\\frac{1}{2}+\\frac{1}{3}=\\frac{5}{6}'],
            ['log',           '\\log_2 8=3'],
            ['ableitung',     "f'(x)=2x"],
            ['euler',         'e^{i\\pi}+1=0'],
            ['trig',          '\\sin^2\\alpha+\\cos^2\\alpha=1'],
            ['wahrsch',       'P(A\\cap B)=P(A)\\cdot P(B)'],
            ['summe',         '\\sum_{k=1}^{n}k=\\frac{n(n+1)}{2}'],
            ['limes',         '\\lim_{x\\to\\infty}\\frac{1}{x}=0'],
            ['ableitung2',    '\\frac{d}{dx}\\sin x=\\cos x'],
            ['integral',      '\\int_0^1 x^2\\,dx=\\frac{1}{3}'],
            ['vektor',        '\\vec{a}\\cdot\\vec{b}=|a||b|\\cos\\varphi'],
            ['wurzel',        '\\sqrt{16}=4'],
            ['pq',            'x=\\frac{-b\\pm\\sqrt{b^2-4ac}}{2a}'],
            ['reihe',         '\\sum_{i=1}^{\\infty}\\frac{1}{2^i}=1'],
            // Doc, 25.09.: the formulas of the old morpheus/equationocr lab
            // (morpheus/formulas.js) - there only as pictures of his hand, which
            // carry no strokes. Written once more on the pad they become examples
            // too. The five complex ones first.
            ['riemann',       '\\zeta(s)=\\sum_{n=1}^{\\infty}\\frac{1}{n^s}'],
            ['dirac',         '(i\\hbar\\gamma^\\mu\\partial_\\mu - mc)\\psi=0'],
            ['cauchy',        'f(a)=\\frac{1}{2\\pi i}\\oint_\\gamma\\frac{f(z)}{z-a}\\,dz'],
            ['einstein',      'R_{\\mu\\nu}-\\tfrac{1}{2}g_{\\mu\\nu}R+\\Lambda g_{\\mu\\nu}=\\frac{8\\pi G}{c^4}T_{\\mu\\nu}'],
            ['navier',        '\\rho\\!\\left(\\frac{\\partial\\mathbf{v}}{\\partial t}+\\mathbf{v}\\!\\cdot\\!\\nabla\\mathbf{v}\\right)=-\\nabla p+\\mu\\nabla^2\\mathbf{v}+\\mathbf{f}'],
            ['emc2',          'E=mc^2'],
            ['taylor',        'e^x=\\sum_{n=0}^{\\infty}\\frac{x^n}{n!}'],
            ['gauss',         '\\int_{-\\infty}^{\\infty}e^{-x^2}dx=\\sqrt{\\pi}'],
            ['binomko',       '\\binom{n}{k}=\\frac{n!}{k!(n-k)!}'],
            ['potenzregel',   '\\frac{d}{dx}x^n=nx^{n-1}'],
            ['integral-ab',   '\\int_a^b f(x)\\,dx'],
            ['gravitation',   'F=G\\frac{m_1 m_2}{r^2}'],
            ['schroedinger',  'i\\hbar\\frac{\\partial}{\\partial t}\\Psi=\\hat{H}\\Psi'],
            ['maxwell-gauss', '\\nabla\\cdot E=\\frac{\\rho}{\\varepsilon_0}'],
            ['maxwell-ampere','\\nabla\\times B=\\mu_0 J+\\mu_0\\varepsilon_0\\frac{\\partial E}{\\partial t}'],
        ];
        let vorlageIdx = 0;
        try { vorlageIdx = Math.min(VORLAGEN.length - 1, parseInt(localStorage.getItem('vorrechnen-vorlage') || '0', 10) || 0); } catch (_) {}

        // Doc, 25.09. evening: without "Meine Beispiele" the head strip holds a
        // task to work through in class - year 11, revision, rearranging
        // equations from easy to harder. [slug, LaTeX, solve for]
        const AUFGABEN = [
            ['plus',        'x+7=12',                                     'x'],
            ['mal',         '4x=28',                                      'x'],
            ['zwei-schritte', '3x+5=20',                                  'x'],
            ['beidseitig',  '7x-4=3x+8',                                  'x'],
            ['klammer',     '5(x-2)=3x+6',                                'x'],
            ['klammern',    '3(2x+1)-2(x-4)=19',                          'x'],
            ['bruch',       '\\frac{x}{4}+3=7',                           'x'],
            ['zaehler',     '\\frac{2x-1}{3}=5',                          'x'],
            ['brueche',     '\\frac{x}{2}+\\frac{x}{3}=10',               'x'],
            ['nenner',      '\\frac{6}{x-1}=2',                           'x'],
            ['geschwindigkeit', 'v=\\frac{s}{t}',                         't'],
            ['ohm',         'U=R\\cdot I',                                'R'],
            ['gerade',      'y=mx+b',                                     'm'],
            ['dreieck',     'A=\\frac{g\\cdot h}{2}',                     'h'],
            ['trapez',      'A=\\frac{a+c}{2}\\cdot h',                   'a'],
            ['parameter',   'ax+b=cx+d',                                  'x'],
            ['energie',     'E=\\frac{1}{2}mv^2',                         'v'],
            ['gravitation', 'F=G\\frac{m_1 m_2}{r^2}',                    'r'],
            ['pendel',      'T=2\\pi\\sqrt{\\frac{l}{g}}',                'g'],
            ['linse',       '\\frac{1}{f}=\\frac{1}{g}+\\frac{1}{b}',     'b'],
        ];
        let aufgabeIdx = 0;
        try { aufgabeIdx = Math.min(AUFGABEN.length - 1, parseInt(localStorage.getItem('vorrechnen-aufgabe') || '0', 10) || 0); } catch (_) {}
        // Does the server take probes? Checked once at load; otherwise the probe
        // is offered as a download, the way SICHERN does it.
        let speichernApi = false;

        // Doc, 25.09.: "irgendwie lenkt das grün ab ... mach mal fast weiß" - ink,
        // template and morph share this one colour
        const INK = '#eaf0f7';
        // Symbol colours: Doc's palette first, then neon blue, cycling. Red-free
        // on purpose so it never reads as an error marker.
        const SYM_COLORS = ['#00d2ff', 'rgb(245,194,66)', 'rgb(121,158,49)', '#c77dff', '#ff9e64'];

        // ── Drawing ─────────────────────────────────────────────────────────
        function canvasPos(ev) {
            const rect = canvas.getBoundingClientRect();
            return { x: ev.clientX - rect.left, y: ev.clientY - rect.top, t: performance.now() };
        }

        // Palm rejection. "Nur Stift" (hidden) lets only the pen draw. On by
        // default is something smarter (Doc, 25.09.: "default ein!"), because Doc
        // also writes with a finger: once the pen is in use - down or hovering -
        // fingers and the ball of the hand do not draw, until a few seconds after
        // the pen was last seen. A touch stroke under way when the pen lands is
        // dropped, a second pointer while one draws is ignored, and a contact as
        // wide as a palm never draws.
        const STIFT_RUHE = 3000;           // ms after the pen was last seen
        const BALLEN_BREITE = 45;          // px of contact: wider is a palm, not a finger
        let stiftZuletzt = -Infinity, currentId = null;
        try { const v = localStorage.getItem('vorrechnen-handballen'); if (v !== null) view.handballen = v === '1'; } catch (_) {}

        function penAccepted(ev) {
            if (view.penOnly) return ev.pointerType === 'pen';
            if (ev.pointerType !== 'touch' || !view.handballen) return true;
            if (performance.now() - stiftZuletzt < STIFT_RUHE) return false;
            return !((ev.width || 0) > BALLEN_BREITE || (ev.height || 0) > BALLEN_BREITE);
        }

        // Swipe up with two or more fingers: the finished lines join the
        // working under the task (rechenwegHoch). Doc asked for four fingers;
        // Windows 11 may keep three and four for itself on a touchscreen, so
        // any two or more count. Fingers in a gesture never draw, and a stroke
        // the first finger had begun is dropped. A palm is not a finger.
        const WISCH = 60;                  // px upwards, averaged over the fingers
        const finger = new Map();          // pointerId -> { x0, y0, x, y, weg }
        let geste = false, gesteAbgebrochen = false;
        function fingerRunter(ev) {
            if (ev.pointerType !== 'touch') return false;
            if ((ev.width || 0) > BALLEN_BREITE || (ev.height || 0) > BALLEN_BREITE) return geste;
            finger.set(ev.pointerId, { x0: ev.clientX, y0: ev.clientY, x: ev.clientX, y: ev.clientY, weg: false });
            if (!geste && [...finger.values()].filter(f => !f.weg).length >= 2) {
                geste = true;
                gesteAbgebrochen = false;
                if (current && current.pointerType === 'touch') { current = null; currentId = null; redrawBald(); }
            }
            return geste;
        }
        function fingerZieht(ev) {
            const f = finger.get(ev.pointerId);
            if (f && !f.weg) { f.x = ev.clientX; f.y = ev.clientY; }
            return geste && !!f;
        }
        function fingerHoch(ev) {
            const f = finger.get(ev.pointerId);
            if (!f) return false;
            if (!geste) { finger.delete(ev.pointerId); return false; }
            // a cancelled pointer (the system took the gesture) has no position
            if (ev.type === 'pointercancel') gesteAbgebrochen = true;
            else if (!f.weg) { f.x = ev.clientX; f.y = ev.clientY; }
            f.weg = true;
            if ([...finger.values()].some(g => !g.weg)) return true;
            const alle = [...finger.values()];
            const dx = alle.reduce((s, g) => s + g.x - g.x0, 0) / alle.length;
            const dy = alle.reduce((s, g) => s + g.y - g.y0, 0) / alle.length;
            finger.clear();
            geste = false;
            if (!gesteAbgebrochen && dy < -WISCH && Math.abs(dy) > Math.abs(dx)) rechenwegHoch();
            return true;
        }

        canvas.addEventListener('pointerdown', ev => {
            if (fingerRunter(ev)) { ev.preventDefault(); return; }
            if (ev.pointerType === 'pen') {
                stiftZuletzt = performance.now();
                // a finger or palm stroke under way when the pen lands was not meant
                if (current && current.pointerType !== 'pen' && view.handballen) {
                    current = null;
                    currentId = null;
                    redrawBald();
                }
            }
            if (!penAccepted(ev)) return;
            if (current && ev.pointerId !== currentId) return;       // one stroke at a time
            // Capture keeps the stroke alive when the pen leaves the canvas mid
            // draw. If it is refused, carry on regardless - losing the capture is
            // a nuisance, losing the stroke is not acceptable.
            try { canvas.setPointerCapture(ev.pointerId); } catch (_) {}
            const p = canvasPos(ev);
            // Pressure widens the line a little where the tablet reports it.
            const w = 2.5 + (ev.pressure > 0 ? ev.pressure * 2.5 : 1.2);
            current = { points: [p], width: w, pointerType: ev.pointerType };
            currentId = ev.pointerId;
            clearTimeout(autoTimer);
            ev.preventDefault();
        });

        // A pen samples far faster than the browser fires pointermove - the rest
        // arrives bundled in getCoalescedEvents(). Without them a 260 px stroke
        // ends up with 15 points and every curve turns into a chain of straight
        // bits, which is exactly what "ich kann nicht richtig schreiben" feels
        // like. Redrawing is throttled to one frame: doing it per event made the
        // tablet drop the events we are trying to collect.
        let zeichenFrame = null;
        function redrawBald() {
            if (zeichenFrame) return;
            zeichenFrame = requestAnimationFrame(() => { zeichenFrame = null; redraw(); });
        }

        canvas.addEventListener('pointermove', ev => {
            if (ev.pointerType === 'pen') stiftZuletzt = performance.now();   // hovering counts too
            if (fingerZieht(ev)) { ev.preventDefault(); return; }
            if (!current || ev.pointerId !== currentId) return;
            const roh = (typeof ev.getCoalescedEvents === 'function') ? ev.getCoalescedEvents() : null;
            if (roh && roh.length) roh.forEach(e => current.points.push(canvasPos(e)));
            else current.points.push(canvasPos(ev));
            redrawBald();
            ev.preventDefault();
        });

        // Double tap on the page switches dust <-> strokes. Doc tapped twice on
        // the page (25.09.) and got two dots, the first of which also threw the
        // recognition away. A tap is held back for a moment: a second tap on
        // the same spot switches and neither stays; otherwise it lands as a dot.
        // A colon's dots sit apart, one above the other, so they still write.
        const TIPP_GROESSE = 10;           // px: a stroke this small is a tap
        const TIPP_FENSTER = 300;          // ms between the two taps (Doc: ~150)
        const TIPP_ABSTAND = 25;           // px sideways between the two taps
        const TIPP_HOEHE = 12;             // px up or down: more is a colon
        let tipp = null;                   // { strich, x, y, zeit, timer }
        function istTipp(s) {
            const xs = s.points.map(p => p.x), ys = s.points.map(p => p.y);
            return Math.max(...xs) - Math.min(...xs) <= TIPP_GROESSE &&
                Math.max(...ys) - Math.min(...ys) <= TIPP_GROESSE;
        }
        function legeStrich(s) {
            if (s.points.length < 2) return false;
            strokes.push(s);
            erkennenStand++;
            merkeBeispiel(false);
            if (zeilenErgebnis.length) verwerfeErkennung();
            autoBald();
            return true;
        }

        // Doc, 25.09.: "Das Erkennen probieren wir mal automatisch, sagen wir
        // mal nach zwei Sekunden keine Eingabe." Every stroke restarts the
        // clock, a pen or finger on the page stops it. Only lines not yet
        // recognised (or failed) are sent. In class only - with "Meine
        // Beispiele" every pause would save half a line as a probe.
        const AUTO_PAUSE = 2000;           // ms without input
        let autoErkennen = true, autoTimer = null;
        try { const v = localStorage.getItem('vorrechnen-auto'); if (v !== null) autoErkennen = v === '1'; } catch (_) {}
        function autoBald() {
            clearTimeout(autoTimer);
            if (!autoErkennen || testModus) return;
            autoTimer = setTimeout(() => {
                if (current || tipp || geste) return;          // the end of that input restarts the clock
                if (erkennenLaeuft) return autoBald();
                if (analysis.lines.some(l => !zuKlein(l) && !zeilenErgebnis[l.lineIdx])) erkennen();
            }, AUTO_PAUSE);
        }
        function tippAblegen() {
            if (!tipp) return;
            clearTimeout(tipp.timer);
            const s = tipp.strich;
            tipp = null;
            if (legeStrich(s)) { recompute(); merkeStriche(); }
            else redrawBald();
        }

        function endStroke(ev) {
            if (ev && ev.pointerType === 'pen') stiftZuletzt = performance.now();
            if (ev && fingerHoch(ev)) return;
            if (!current || (ev && ev.pointerId !== currentId)) return;
            currentId = null;
            const s = current;
            current = null;
            if (istTipp(s)) {
                const p = s.points[0], jetzt = performance.now();
                if (tipp && jetzt - tipp.zeit < TIPP_FENSTER &&
                    Math.abs(p.x - tipp.x) < TIPP_ABSTAND && Math.abs(p.y - tipp.y) < TIPP_HOEHE) {
                    clearTimeout(tipp.timer);
                    tipp = null;
                    redrawBald();
                    wechsleMorphArt();
                    return;
                }
                tippAblegen();
                tipp = { strich: s, x: p.x, y: p.y, zeit: jetzt, timer: setTimeout(tippAblegen, TIPP_FENSTER) };
                redrawBald();
                return;
            }
            tippAblegen();
            legeStrich(s);
            recompute();
            merkeStriche();
        }

        // Live-reload kept wiping Doc's strokes mid-session. They now survive a
        // reload in localStorage; LEEREN clears them for good.
        function merkeStriche() {
            try { localStorage.setItem('vorrechnen-striche', JSON.stringify(strokes)); } catch (_) {}
        }
        function holeStriche() {
            try {
                const d = JSON.parse(localStorage.getItem('vorrechnen-striche') || '[]');
                if (Array.isArray(d) && d.length) { strokes.length = 0; d.forEach(s => strokes.push(s)); }
            } catch (_) {}
        }
        canvas.addEventListener('pointerup', endStroke);
        canvas.addEventListener('pointercancel', endStroke);
        canvas.addEventListener('pointerleave', endStroke);

        function recompute() {
            analysis = StrokeSymbols.analyse(strokes, opts);
            redraw();
            updateStats();
        }

        // ── Rendering ───────────────────────────────────────────────────────
        function strokePath(s) {
            if (s.points.length < 2) return;
            ctx.beginPath();
            ctx.moveTo(s.points[0].x, s.points[0].y);
            for (let i = 1; i < s.points.length; i++) ctx.lineTo(s.points[i].x, s.points[i].y);
            ctx.lineWidth = s.width;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
        }

        function redraw() {
            zeigeZeitleiste();
            zeigeSatz();
            const rect = container.getBoundingClientRect();
            ctx.clearRect(0, 0, rect.width, rect.height);

            // Row bands first, so they sit behind everything.
            if (view.rows) {
                analysis.lines.forEach(l => {
                    if (!l.bbox) return;
                    ctx.fillStyle = 'rgba(0, 210, 255, 0.055)';
                    ctx.fillRect(0, l.bbox.y - 8, rect.width, l.bbox.h + 16);
                });
            }

            // Strokes that belong to a morphing row are drawn by the morph
            // itself - otherwise the original ink would still sit underneath and
            // the whole thing would look like a cross-fade, which is exactly what
            // Doc does not want.
            const imMorph = new Set();
            if (morphT > 0) {
                analysis.lines.forEach(l => {
                    if (morphVorbereitet[l.lineIdx])
                        l.symbols.forEach(sy => sy.strokeIdxs.forEach(i => imMorph.add(i)));
                });
            }
            ctx.strokeStyle = INK;
            strokes.forEach((s, i) => { if (!imMorph.has(i)) strokePath(s); });
            if (current) strokePath(current);
            if (tipp) strokePath(tipp.strich);

            if (morphT > 0) {
                analysis.lines.forEach(l => {
                    const v = morphVorbereitet[l.lineIdx];
                    // at t = 1 the row is real KaTeX (zeigeSatz), the canvas steps aside
                    const erg = zeilenErgebnis[l.lineIdx];
                    if (morphT >= 1 && erg && erg.satz) return;
                    // Doc: "alles grün" - the formula ends in the ink's green, no blue
                    if (v) zeichneMorph(ctx, v, morphT);
                });
            }

            // lines on their way up (rechenwegHoch): ink or morph in a frame
            // that glides and shrinks towards the step's place
            fluege.forEach(f => {
                ctx.save();
                ctx.translate(f.p.tx, f.p.ty);
                ctx.scale(f.p.s, f.p.s);
                if (f.v && f.mt > 0) zeichneMorph(ctx, f.v, f.mt);
                else { ctx.strokeStyle = INK; f.striche.forEach(strokePath); }
                ctx.restore();
            });

            if (view.boxes && morphT === 0) {
                analysis.lines.forEach(line => {
                    line.symbols.forEach((sym, i) => {
                        const c = SYM_COLORS[i % SYM_COLORS.length];
                        const b = sym.bbox;
                        ctx.strokeStyle = c;
                        ctx.lineWidth = 1.5;
                        ctx.setLineDash([4, 3]);
                        ctx.strokeRect(b.x - 4, b.y - 4, b.w + 8, b.h + 8);
                        ctx.setLineDash([]);
                        // Doc: "keine Boxbeschriftung" - numbers and stroke
                        // counts were for calibrating, they only clutter now.
                        if (false && view.numbers) {
                            ctx.fillStyle = c;
                            ctx.font = '600 12px Orbitron, sans-serif';
                            ctx.fillText(String(sym.readIdx), b.x - 4, b.y - 9);
                            // Stroke count, so a glyph that fell apart is obvious.
                            ctx.font = '400 10px Outfit, sans-serif';
                            ctx.globalAlpha = 0.65;
                            ctx.fillText(sym.strokeIdxs.length + '×', b.x + b.w - 4, b.y - 9);
                            ctx.globalAlpha = 1;
                        }
                    });
                });
            }

            // Doc: "NUR die LaTeX Formel" - the per-glyph transcription on the
            // canvas is gone; the typeset formula under the row (KaTeX, see
            // zeigeFormeln) says the same thing and says it properly.
        }

        function updateStats() {
            const el = document.getElementById('stat-row');
            if (!el) return;
            const perLine = analysis.lines.map(l => l.symbols.length).join(' · ') || '–';
            el.innerHTML =
                `<div class="stat"><b>${strokes.length}</b><span>Striche</span></div>` +
                `<div class="stat"><b>${analysis.symbols.length}</b><span>Symbole</span></div>` +
                `<div class="stat"><b>${analysis.lines.length}</b><span>Zeilen</span></div>` +
                `<div class="stat"><b>${perLine}</b><span>je Zeile</span></div>`;
        }

        // ── Recognition ─────────────────────────────────────────────────────
        // One call per row. Gemini says WHAT is written; WHERE comes from the
        // strokes. Both lists are in reading order, so laying them onto each
        // other needs no coordinates from the model - which is good, because its
        // coordinates were never trustworthy.
        // Hidden host where KaTeX sets the formula for measuring. visibility:hidden,
        // not display:none - the boxes must exist.
        function messHost() {
            let h = document.getElementById('mess-host');
            if (!h) {
                h = document.createElement('div');
                h.id = 'mess-host';
                h.style.cssText = 'position:absolute;left:-10000px;top:0;visibility:hidden;white-space:nowrap;pointer-events:none';
                document.body.appendChild(h);
            }
            return h;
        }

        // A row that is only a speck (a slip of the pen) is not a formula.
        function zuKlein(line) {
            return !line.bbox || Math.max(line.bbox.w, line.bbox.h) < 16;
        }

        // Doc: "Wurzel und Summenzeichen sehen noch falsch aus" - KaTeX set them
        // in text style (limits beside the sum, squeezed fractions and roots). By
        // hand a formula is written in display style, so every formula on this
        // page - template, measurement, the end of the morph, the recognised one
        // - is set that way.
        function alsDisplay(latex) { return '\\displaystyle ' + latex; }

        // Shrink a rendered formula (font size in rem) until it fits `frei` px.
        function passeEin(el, frei) {
            if (!el || frei <= 0) return;
            const breit = el.getBoundingClientRect().width;     // scrollWidth is 0 for an inline span
            if (breit > frei) el.style.fontSize = (2.4 * frei / breit).toFixed(3) + 'rem';
        }

        // KaTeX sets the formula; the atoms say where every glyph sits. Then the
        // whole block is scaled and moved onto the handwriting: same height as
        // the row, left edge aligned, centred vertically - Doc's "gleiche Größe".
        async function formelAufZeile(latex, line) {
            const m = await KatexAtome.atomeAusLatex(latex, messHost(), { fontSize: 100, display: true });
            const u = KatexAtome.umfang(m.atome);
            let atome = m.atome;
            // where KaTeX's box sat inside the measuring host - the real formula
            // at the end of the morph goes to exactly the same place
            const hr = messHost().getBoundingClientRect(), kh = messHost().querySelector('.katex-html');
            const kr = kh ? kh.getBoundingClientRect() : hr;
            const satz = { latex, skala: 1, dx: 0, dy: 0, kx: kr.left - hr.left, ky: kr.top - hr.top, kw: kr.width };
            if (u && u.h > 0 && u.w > 0) {
                // "Gleiche Größe" means: the typeset block fits the footprint of
                // the handwriting - height AND width - and never leaves the
                // canvas. Height alone sent a tall integral's fraction off the
                // right edge.
                // Centred on the handwriting (Doc: "den Morph bitte auch x
                // zentriert"), and it must fit on both sides of that centre.
                const breite = container.getBoundingClientRect().width;
                const mitte = line.bbox.x + line.bbox.w / 2;
                const platz = 2 * Math.max(20, Math.min(mitte - 24, breite - mitte - 24));
                const skala = Math.min(line.bbox.h / u.h, line.bbox.w / u.w, platz / u.w);
                const dx = mitte - (u.x + u.w / 2) * skala;
                const dy = (line.bbox.y + line.bbox.h / 2) - (u.y + u.h / 2) * skala;
                atome = KatexAtome.transformiere(m.atome, skala, dx, dy);
                Object.assign(satz, { skala, dx, dy });
            }
            return { atome, svg: m.svg, satz };
        }

        // Which handwritten symbol is which typeset glyph. The typesetter knows
        // the glyph count; when the grouping disagrees it gives way - fused
        // symbols are split at their widest gap, fragments merged - and the
        // reading order is redone.
        function ordneZeile(line, atome, striche = strokes) {
            let zuordnung = FormelErkennen.ordneZu(line.symbols, atome);
            let nachjustiert = false;
            if (!zuordnung.passt) {
                const neu = StrokeSymbols.nachjustieren(line, striche, atome.length, opts);
                if (neu.length === atome.length) {
                    line.symbols = neu;
                    zuordnung = FormelErkennen.ordneZu(neu, atome);
                    nachjustiert = true;
                }
            }
            return { zuordnung, nachjustiert };
        }

        async function erkennen() {
            if (erkennenLaeuft) return;
            if (!analysis.lines.length) { setErgebnisText('Erst etwas schreiben.'); return; }
            erkennenLaeuft = true;
            // a stroke written while the answer is on its way makes it stale
            const stand = erkennenStand;
            setErgebnisText('Erkenne …');
            const modelEl = document.getElementById('modell-wahl');
            const model = modelEl ? modelEl.value : 'gemini-2.5-flash';
            try {
                for (const line of analysis.lines) {
                    if (zuKlein(line)) { zeilenErgebnis[line.lineIdx] = { uebersprungen: true }; continue; }
                    const idxs = line.symbols.flatMap(sy => sy.strokeIdxs);
                    const r = await FormelErkennen.erkenneZeile(strokes, idxs, { model });
                    if (stand !== erkennenStand) return;
                    if (!r.ok) {
                        zeilenErgebnis[line.lineIdx] = { fehler: r.error };
                    } else if (!r.latex || /^\(?\s*(empty|leer)\s*\)?$/i.test(r.latex)) {
                        zeilenErgebnis[line.lineIdx] = { fehler: 'nichts erkannt' };
                    } else {
                        const { atome, svg, satz } = await formelAufZeile(r.latex, line);
                        if (stand !== erkennenStand) return;
                        const { zuordnung, nachjustiert } = ordneZeile(line, atome);
                        zeilenErgebnis[line.lineIdx] = {
                            latex: r.latex, tokens: r.tokens, atome, ms: r.ms, zuordnung, svg, nachjustiert, satz,
                        };
                        // Doc's plan B: the row crumbles to one dust cloud and
                        // settles into the formula (js/staub-morph.js) - each
                        // symbol's dust into its own glyph when the mapping holds,
                        // the row as a whole when it does not. Radicals and
                        // vector arrows are SVG in KaTeX - they are traced first.
                        try {
                            await HandschriftMorph.schriftenBereit(atome);
                            await HandschriftMorph.svgVorbereiten(atome);
                            if (stand !== erkennenStand) return;
                            morphVorbereitet[line.lineIdx] = bereiteMorph(line, zuordnung, atome);
                        } catch (e) {
                            morphVorbereitet[line.lineIdx] = null;
                        }
                    }
                    redraw();
                    setErgebnisText(null);
                    zeigeFormeln();
                }
            } finally {
                erkennenLaeuft = false;
            }
            // Straight into the morph - with the button gone there is nothing
            // left to press, and Doc wanted it to happen by itself anyway.
            if (morphVorbereitet.some(Boolean)) morphen(1);
            // Every ERKENNEN is a probe for the corpus, good or bad.
            if (strokes.length) speichereProbe();
        }

        // The typeset formula under the handwriting - real LaTeX, set by KaTeX.
        function zeigeFormeln() {
            let host = document.getElementById('formel-schicht');
            if (!host) {
                host = document.createElement('div');
                host.id = 'formel-schicht';
                // Doc: "so groß wie oben und weiter runter" - the counterpart of the
                // template strip: a strip at the bottom edge, formulas centred
                host.style.cssText = 'position:absolute;left:0;right:0;bottom:56px;min-height:84px;pointer-events:none;' +
                    'display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.4rem';
                container.appendChild(host);
            }
            host.innerHTML = '';
            if (!view.formelUnten) return;
            analysis.lines.forEach(line => {
                const erg = zeilenErgebnis[line.lineIdx];
                if (!erg || !erg.latex || !line.bbox) return;
                const d = document.createElement('div');
                // a shade darker than the ink, as large as the template on top
                d.style.cssText = 'color:#9aa5b5;font-size:2.4rem';
                try { katex.render(alsDisplay(erg.latex), d, { throwOnError: false, displayMode: false }); }
                catch (e) { d.textContent = erg.latex; }
                host.appendChild(d);
                passeEin(d, host.clientWidth - 48);
            });
        }

        // ── Morph ───────────────────────────────────────────────────────────
        // Doc: "meine in LT faden (morph nicht transp)" - the ink turns into
        // the formula, it does not fade. How long it takes is Doc's to set
        // (slider "Morph-Dauer", remembered on the device).
        // Doc: 0.1 to 1 s ("mach den speed slider 0.1 - 1 s")
        let morphDauer = 0.6;                        // seconds
        // Dust or strokes (Doc, 25.09.: "Bau mir bitte einen Schalter ... welches
        // von beiden"). The stroke morph (js/strich-morph.js) bends each pen line
        // onto the glyph's centre line; it needs the symbol-glyph pairing, so
        // without one the dust takes over.
        let morphArt = 'staub';
        try { if (localStorage.getItem('vorrechnen-morph-art') === 'strich') morphArt = 'strich'; } catch (_) {}
        function bereiteMorph(line, zuordnung, atome, striche = strokes) {
            if (morphArt === 'strich' && zuordnung && zuordnung.passt) {
                const g = StrichMorph.vorbereiten(line, striche, zuordnung);
                if (g && g.length) return { art: 'strich', glyphen: g };
            }
            const v = StaubMorph.vorbereiten(line, striche, zuordnung && zuordnung.paare ? zuordnung : atome, morphOpts);
            return v ? Object.assign(v, { art: 'staub' }) : null;
        }
        function zeichneMorph(c, v, t) {
            if (v.art === 'strich') StrichMorph.zeichnen(c, v.glyphen, t, { farbe: INK, zielFarbe: INK, staffel: morphOpts.staffel });
            else StaubMorph.zeichnen(c, v, t, { farbe: INK, zielFarbe: INK,
                staffel: morphOpts.staffel, wirbel: morphOpts.wirbel, staub: morphOpts.staub });
        }
        function wechsleMorphArt(art) {
            morphArt = art || (morphArt === 'staub' ? 'strich' : 'staub');
            try { localStorage.setItem('vorrechnen-morph-art', morphArt); } catch (_) {}
            document.querySelectorAll('input[name="morph-art"]').forEach(r => { r.checked = r.value === morphArt; });
            nachRegler(true);                    // prepare again in the new kind, replay
        }

        // The dust morph's knobs (js/staub-morph.js), on sliders for Doc: the
        // cloud's shape needs a new preparation, the rest only a new drawing.
        const morphOpts = { dichte: 0.5, wolke: 0.25, auftrieb: 0.25, wirbel: 0.1, staffel: 0, staub: 0.8, pause: 0.9 };
        try { Object.assign(morphOpts, JSON.parse(localStorage.getItem('vorrechnen-morph') || '{}')); } catch (_) {}
        function bereiteMorphNeu() {
            analysis.lines.forEach(line => {
                const erg = zeilenErgebnis[line.lineIdx];
                if (!erg || !erg.atome || !morphVorbereitet[line.lineIdx]) return;
                morphVorbereitet[line.lineIdx] = bereiteMorph(line, erg.zuordnung, erg.atome);
            });
        }
        // Letting go of a slider replays the morph, so the effect can be judged.
        let reglerTimer = null, reglerNeu = false;
        function nachRegler(neu) {
            reglerNeu = reglerNeu || neu;
            clearTimeout(reglerTimer);
            reglerTimer = setTimeout(() => {
                if (reglerNeu) bereiteMorphNeu();
                reglerNeu = false;
                if (!morphVorbereitet.some(Boolean)) return;
                setzeMorph(0);
                morphen(1);
            }, 350);
        }
        try { const v = parseFloat(localStorage.getItem('vorrechnen-morph-dauer')); if (v > 0) morphDauer = Math.min(1, Math.max(0.1, v)); } catch (_) {}
        function morphen(ziel) {
            if (morphAnim) cancelAnimationFrame(morphAnim);
            const von = morphT, nach = (ziel === undefined) ? (morphT > 0.5 ? 0 : 1) : ziel;
            const dauer = morphDauer * 1000;
            const t0 = performance.now();
            const schritt = () => {
                const f = Math.min(1, (performance.now() - t0) / dauer);
                morphT = von + (nach - von) * f;
                redraw();
                const sl = document.getElementById('morph-regler');
                if (sl) sl.value = morphT;
                if (f < 1) morphAnim = requestAnimationFrame(schritt);
                else { morphAnim = null; morphT = nach; redraw(); }
            };
            schritt();
        }

        function setzeMorph(v) {
            if (morphAnim) { cancelAnimationFrame(morphAnim); morphAnim = null; }
            morphT = parseFloat(v);
            redraw();
        }

        // ── The end of the morph is real LaTeX ──────────────────────────────
        // Doc: "könntest Du heimlich am Ende LaTeX zeigen (ich sehe das :-)". The
        // dust lands on traced outlines of the KaTeX glyphs; at t = 1 the row is
        // handed to KaTeX itself, at exactly the place and size the atoms were
        // measured from - the swap cannot be seen, the result is just sharper.
        function zeigeSatz() {
            let host = document.getElementById('satz-schicht');
            if (!host) {
                host = document.createElement('div');
                host.id = 'satz-schicht';
                host.style.cssText = 'position:absolute;inset:0;pointer-events:none';
                container.appendChild(host);
            }
            const soll = new Set();
            analysis.lines.forEach(line => {
                const erg = zeilenErgebnis[line.lineIdx];
                if (morphT < 1 || !erg || !erg.satz || !morphVorbereitet[line.lineIdx]) return;
                const z = erg.satz, key = 'z' + line.lineIdx;
                const sig = [z.latex, z.skala, z.dx, z.dy].join('|');
                soll.add(key);
                const alt = host.querySelector(`[data-zeile="${key}"]`);
                if (alt && alt.dataset.sig === sig) return;
                if (alt) alt.remove();
                const d = document.createElement('div');
                d.dataset.zeile = key;
                d.dataset.sig = sig;
                d.style.cssText = `position:absolute;left:${z.dx}px;top:${z.dy}px;font-size:${100 * z.skala}px;` +
                    `white-space:nowrap;line-height:normal;color:${INK}`;
                host.appendChild(d);
                try { katex.render(alsDisplay(z.latex), d, { throwOnError: false, displayMode: false }); } catch (_) { return; }
                // land on the measured spot: correct whatever the surroundings shifted
                const k = d.querySelector('.katex-html');
                if (!k) return;
                const c = container.getBoundingClientRect(), r = k.getBoundingClientRect();
                const sollX = z.dx + z.kx * z.skala, sollY = z.dy + z.ky * z.skala;
                d.style.left = (z.dx + sollX - (r.left - c.left)) + 'px';
                d.style.top = (z.dy + sollY - (r.top - c.top)) + 'px';
            });
            host.querySelectorAll('[data-zeile]').forEach(d => { if (!soll.has(d.dataset.zeile)) d.remove(); });
        }

        // ── Film strip: scrub the morph back and forth ──────────────────────
        // Doc: "wie in einem Movie einen Slider (vor, zurück)", "mit dem Finger
        // ... ganze Breite", "oder Stift!". A strip of its own along the bottom
        // edge, not a gesture on the page: Doc writes with pen AND finger. Any
        // pointer anywhere across the full width sets the morph to that point.
        // Built on first use; redraw() keeps it in step with the morph.
        let zeitleiste = null;
        function zeigeZeitleiste() {
            if (!zeitleiste) {
                zeitleiste = document.createElement('div');
                zeitleiste.id = 'zeitleiste';
                zeitleiste.setAttribute('role', 'slider');
                zeitleiste.setAttribute('aria-label', 'Morph vor und zurück');
                zeitleiste.setAttribute('aria-valuemin', '0');
                zeitleiste.setAttribute('aria-valuemax', '1');
                zeitleiste.style.cssText = 'position:absolute;left:0;right:0;bottom:0;height:56px;' +
                    'touch-action:none;cursor:ew-resize;z-index:5';
                zeitleiste.innerHTML = '<div class="zl-spur"></div><div class="zl-fuellung"></div><div class="zl-knopf"></div>';
                container.appendChild(zeitleiste);
                const zeitAn = ev => {
                    const r = zeitleiste.getBoundingClientRect();
                    return Math.max(0, Math.min(1, (ev.clientX - r.left - 24) / Math.max(1, r.width - 48)));
                };
                // Doc: "den Switch zwischen den beiden auf Double-Tap oder Double-
                // Mausklick" - here, not on the page, where two quick taps are a
                // colon or an i's dot
                let tippZeit = 0, tippX = 0;
                zeitleiste.addEventListener('pointerdown', ev => {
                    const jetzt = performance.now();
                    if (jetzt - tippZeit < 350 && Math.abs(ev.clientX - tippX) < 40) {
                        tippZeit = 0;
                        ev.preventDefault();
                        wechsleMorphArt();
                        return;
                    }
                    tippZeit = jetzt; tippX = ev.clientX;
                    try { zeitleiste.setPointerCapture(ev.pointerId); } catch (_) {}
                    clearTimeout(beispielTimer);            // a pending replay must not jump in
                    setzeMorph(zeitAn(ev));
                    ev.preventDefault();
                });
                zeitleiste.addEventListener('pointermove', ev => {
                    if (zeitleiste.hasPointerCapture && zeitleiste.hasPointerCapture(ev.pointerId)) setzeMorph(zeitAn(ev));
                });
            }
            const b = Math.max(0, zeitleiste.clientWidth - 48);
            zeitleiste.querySelector('.zl-fuellung').style.width = (b * morphT) + 'px';
            zeitleiste.querySelector('.zl-knopf').style.left = (24 + b * morphT) + 'px';
            zeitleiste.style.opacity = morphVorbereitet.some(Boolean) ? '1' : '0.35';
            zeitleiste.setAttribute('aria-valuenow', morphT.toFixed(2));
        }

        function setErgebnisText(msg) {
            const el = document.getElementById('erkennung-out');
            if (!el) return;
            if (msg) { el.innerHTML = '<div class="erk-info">' + msg + '</div>'; return; }
            const teile = analysis.lines.map(l => {
                const e = zeilenErgebnis[l.lineIdx];
                if (!e) return '';
                if (e.fehler) return `<div class="erk-zeile"><b>Zeile ${l.lineIdx}</b>
                    <div class="erk-fehler">${e.fehler}</div></div>`;
                if (e.uebersprungen) return '';
                const z = e.zuordnung;
                const hinweis = '';
                return `<div class="erk-zeile"><b>Zeile ${l.lineIdx}</b>
                    <div class="erk-latex">${e.latex.replace(/</g, '&lt;')}</div>
                    <div class="${z.passt ? 'erk-ok' : 'erk-warn'}">${z.diagnose}${e.nachjustiert ? ' – Gruppierung an die Zeichenzahl angeglichen' : ''}</div>${hinweis}
                    <div class="erk-info">${e.atome.length} Zeichen gesetzt · ${e.ms} ms</div></div>`;
            });
            el.innerHTML = teile.join('') || '<div class="erk-info">–</div>';
        }

        // ── Vorlage: the formula to copy, shown above the writing area ──────
        function zeigeVorlage(hinweis) {
            let host = document.getElementById('vorlage-schicht');
            if (!host) {
                host = document.createElement('div');
                host.id = 'vorlage-schicht';
                // Doc: the template centred in x and y in the head strip; the
                // counter stays at the left edge
                // at least 84 px; a display-style sum with its limits needs more
                host.style.cssText = 'position:absolute;left:0;right:0;top:0;min-height:84px;padding:6px 0;box-sizing:border-box;' +
                    'pointer-events:none;display:flex;align-items:center;justify-content:center;color:#00d2ff';
                container.appendChild(host);
            }
            // "Meine Beispiele" on: the template to copy; off: the task (AUFGABEN)
            // with what to solve for at the right edge
            const liste = testModus ? VORLAGEN : AUFGABEN, nr = testModus ? vorlageIdx : aufgabeIdx;
            const [slug, latex, nach] = liste[nr];
            const RAND = 'position:absolute;top:50%;transform:translateY(-50%);' +
                'font-family:Orbitron,sans-serif;font-size:0.8rem;letter-spacing:0.1em;color:#8a93a3';
            // Doc: "Font-Size überall gleich", "Gleichheitszeichen untereinander" -
            // in class the task is the first row of the working (zeigeRechenweg),
            // up here only the counter and what to solve for, on the task's height
            host.innerHTML = `<span style="${RAND};left:24px">` +
                `${nr + 1} / ${liste.length}${hinweis ? ' · ' + hinweis : ''}</span>` +
                (testModus ? `<span id="vorlage-formel" style="font-size:2.4rem;color:${INK}"></span>` : '') +
                (nach ? `<span id="vorlage-nach" style="${RAND};right:24px">NACH <span style="font-size:1.6em"></span></span>` : '');
            zeigeTafelPfeile();
            if (nach) {
                const v = host.querySelector('#vorlage-nach span');
                try { katex.render(nach, v, { throwOnError: false }); } catch (e) { v.textContent = nach; }
            }
            host.style.display = 'flex';
            if (!testModus) {
                host.style.minHeight = '0';
                host.style.padding = '0';
                zeigeRechenweg();
                return;
            }
            host.style.minHeight = '84px';
            host.style.padding = '6px 0';
            host.style.top = '0';
            host.style.height = '';
            try { katex.render(alsDisplay(latex), document.getElementById('vorlage-formel'), { throwOnError: false }); }
            catch (e) { document.getElementById('vorlage-formel').textContent = latex; }
            // a long one (Navier-Stokes) shrinks until it clears the counter
            const h = host.getBoundingClientRect();
            const zaehler = host.querySelector('span'), nachEl = document.getElementById('vorlage-nach');
            const rand = Math.max(zaehler ? zaehler.getBoundingClientRect().right - h.left + 32 : 170,
                nachEl ? h.right - nachEl.getBoundingClientRect().left + 32 : 0);
            passeEin(document.getElementById('vorlage-formel'), host.clientWidth - 2 * rand);
            zeigeRechenweg();
        }

        // ── Working: the finished lines climb up under the task ─────────────
        // Doc, 25.09.: "wenn ich zum Beispiel mit vier Fingern nach oben schiebe,
        // dass diese Formel ... kleiner wird und als nächste Zeile für die Lösung
        // dieser Umformung oben steht". Each recognised line on the page becomes
        // one step: its typeset formula shrinks and flies up, its ink is gone,
        // the page is free for the next step. The steps line up at their first
        // equals sign, the way one writes a working on the board.
        function merkeRechenweg() {
            try { localStorage.setItem('vorrechnen-rechenweg', JSON.stringify(rechenweg)); } catch (_) {}
        }
        // "3x+5=20" -> ["3x+5", "{}=20"]; the empty group keeps the space
        // before the "=". Only an "=" outside braces splits.
        function amGleich(latex) {
            let tiefe = 0;
            for (let i = 0; i < latex.length; i++) {
                const c = latex[i];
                if (c === '\\') { i++; continue; }
                if (c === '{') tiefe++;
                else if (c === '}') tiefe--;
                else if (c === '=' && tiefe === 0) return [latex.slice(0, i), '{}' + latex.slice(i)];
            }
            return [latex, ''];
        }
        // One size for the task and every step, the flying line included
        const RECHEN_SCHRIFT = '2.2rem';
        // verborgenAb: steps from this index on are laid out but not yet shown -
        // they are where the flying lines land
        function zeigeRechenweg(verborgenAb) {
            let host = document.getElementById('rechenweg-schicht');
            if (!host) {
                host = document.createElement('div');
                host.id = 'rechenweg-schicht';
                host.style.cssText = 'position:absolute;left:0;right:0;pointer-events:none;display:grid;' +
                    'grid-template-columns:max-content max-content;justify-content:center;align-items:baseline;' +
                    `row-gap:0.6em;font-size:${RECHEN_SCHRIFT};color:${INK}`;          // Doc: more room between the equations
                container.appendChild(host);
            }
            const kopf = document.getElementById('vorlage-schicht');
            host.style.top = testModus ? kopf.getBoundingClientRect().height + 'px' : '14px';
            host.innerHTML = '';
            const zeile = (latex, schritt, verborgen) => amGleich(latex).forEach((teil, j) => {
                const d = document.createElement('div');
                d.dataset.schritt = schritt;
                d.style.justifySelf = j ? 'start' : 'end';
                if (verborgen) d.style.visibility = 'hidden';
                try { katex.render(alsDisplay(teil), d, { throwOnError: false }); } catch (_) { d.textContent = teil; }
                host.appendChild(d);
            });
            if (!testModus) zeile(AUFGABEN[aufgabeIdx][1], 'aufgabe', false);
            rechenweg.forEach((latex, i) => zeile(latex, i, (verborgenAb !== undefined && i >= verborgenAb) || imFlug.has(i)));
            // counter and "NACH x" sit level with the task
            if (!testModus) {
                let o = Infinity, u = -Infinity;
                host.querySelectorAll('[data-schritt="aufgabe"]').forEach(z => {
                    const r = z.getBoundingClientRect(); o = Math.min(o, r.top); u = Math.max(u, r.bottom);
                });
                if (isFinite(o)) {
                    const c = container.getBoundingClientRect();
                    kopf.style.top = (o - c.top) + 'px';
                    kopf.style.height = (u - o) + 'px';
                }
            }
        }
        // ── In flight: the line goes up while it is being recognised ────────
        // The ink leaves the page at once (the next step can be written right
        // away) and glides, shrinking, to where the next step will be. When
        // Gemini answers (~1.5 s) the row is laid out hidden, the frame turns
        // towards its exact place and the morph plays on the way; on landing
        // the KaTeX row takes over. A line that cannot be read flies back.
        const fluege = [];                 // lines in the air, in swipe order
        const imFlug = new Set();          // steps laid out, their line not landed yet
        let flugKette = Promise.resolve(), flugFrame = null, flugStand = 0;
        // LEEREN of the working or another task: lines in the air are dropped
        function flugAbbrechen() {
            flugStand++;
            fluege.length = 0;
            imFlug.clear();
            redraw();
        }
        const FLUG_START = 800;            // ms to the estimated place
        function flugZiel(f, ziel, dauer) {
            f.von = Object.assign({}, f.p);
            f.ziel = ziel;
            f.t0 = performance.now();
            f.dauer = dauer;
            flugLos();
        }
        function flugLos() { if (!flugFrame) flugFrame = requestAnimationFrame(flugSchritt); }
        function flugSchritt() {
            flugFrame = null;
            const jetzt = performance.now();
            fluege.slice().forEach(f => {
                const u = Math.min(1, (jetzt - f.t0) / f.dauer), e = 1 - Math.pow(1 - u, 3);
                ['tx', 'ty', 's'].forEach(k => { f.p[k] = f.von[k] + (f.ziel[k] - f.von[k]) * e; });
                if (f.v && f.mt0 !== null) f.mt = Math.min(1, (jetzt - f.mt0) / (morphDauer * 1000));
                if (u < 1) return;
                if (f.zurueck) flugZurueck(f);
                else if (f.bereit && (!f.v || f.mt >= 1)) flugLandet(f);
            });
            redraw();
            if (fluege.some(f => f.von)) flugFrame = requestAnimationFrame(flugSchritt);
        }
        function flugWeg(f) {
            const i = fluege.indexOf(f);
            if (i >= 0) fluege.splice(i, 1);
        }
        function flugLandet(f) {
            flugWeg(f);
            imFlug.delete(f.schritt);
            document.querySelectorAll(`#rechenweg-schicht [data-schritt="${f.schritt}"]`).forEach(z => { z.style.visibility = ''; });
        }
        function flugZurueck(f) {
            flugWeg(f);
            f.striche.forEach(st => strokes.push(st));
            recompute();
            merkeStriche();
        }
        // where the k-th line still waiting will go: under the last row, its
        // centre on the column of the equals signs, about a step's height
        function schaetzeZiel(b, k) {
            const host = document.getElementById('rechenweg-schicht');
            const c = container.getBoundingClientRect(), cs = getComputedStyle(host);
            const gap = parseFloat(cs.rowGap) || 0, glyph = 1.21 * parseFloat(cs.fontSize);
            let unten = host.getBoundingClientRect().top - c.top - gap, gleich = c.width / 2;
            [...host.children].forEach(z => { const r = z.getBoundingClientRect(); if (r.height) unten = Math.max(unten, r.bottom - c.top); });
            if (host.children[0]) gleich = host.children[0].getBoundingClientRect().right - c.left;
            const s = Math.min(1, 1.2 * glyph / Math.max(1, b.h));
            const oben = unten + gap + k * (1.25 * glyph + gap);
            return { s, tx: gleich - s * (b.x + b.w / 2), ty: oben - s * b.y };
        }
        function starteFluege(zeilen) {
            const wartend = fluege.filter(f => !f.bereit).length;
            const neu = zeilen.map((l, k) => {
                const idxs = [...new Set(l.symbols.flatMap(sy => sy.strokeIdxs))].sort((a, b) => a - b);
                const erg = zeilenErgebnis[l.lineIdx];
                const f = { striche: idxs.map(i => strokes[i]), latex: erg && erg.latex || null, v: null, mt: 0, mt0: null,
                    p: { tx: 0, ty: 0, s: 1 }, bereit: false, zurueck: false, schritt: -1 };
                flugZiel(f, schaetzeZiel(l.bbox, wartend + k), FLUG_START);
                return f;
            });
            // the page is free at once; a recognition under way is void now
            const weg = new Set(zeilen.flatMap(l => l.symbols.flatMap(sy => sy.strokeIdxs)));
            const bleiben = strokes.filter((_, i) => !weg.has(i));
            strokes.length = 0;
            bleiben.forEach(st => strokes.push(st));
            neu.forEach(f => fluege.push(f));
            verwerfeErkennung();
            recompute();
            merkeStriche();
            // one after the other, so the steps keep the order they were swiped in
            neu.forEach(f => { flugKette = flugKette.then(() => erkenneFlug(f)); });
        }
        async function erkenneFlug(f) {
            const stand = flugStand;
            try {
                const ana = StrokeSymbols.analyse(f.striche, opts);
                if (ana.lines.length !== 1) throw new Error('keine einzelne Zeile');
                const line = ana.lines[0];
                let latex = f.latex;
                if (!latex) {
                    const modelEl = document.getElementById('modell-wahl');
                    const r = await FormelErkennen.erkenneZeile(f.striche, line.symbols.flatMap(sy => sy.strokeIdxs),
                        { model: modelEl ? modelEl.value : 'gemini-2.5-flash' });
                    if (!r.ok || !r.latex || /^\(?\s*(empty|leer)\s*\)?$/i.test(r.latex)) throw new Error(r.error || 'nichts erkannt');
                    latex = r.latex;
                }
                if (stand !== flugStand) return;
                const { atome, satz } = await formelAufZeile(latex, line);
                const { zuordnung } = ordneZeile(line, atome, f.striche);
                try {
                    await HandschriftMorph.schriftenBereit(atome);
                    await HandschriftMorph.svgVorbereiten(atome);
                    f.v = bereiteMorph(line, zuordnung, atome, f.striche);
                } catch (_) { f.v = null; }
                if (stand !== flugStand) return;
                // the row, hidden, gives the exact place: the typeset line's
                // corner and width map onto the row's
                const i = rechenweg.length;
                rechenweg.push(latex);
                merkeRechenweg();
                imFlug.add(i);
                zeigeRechenweg();
                const c = container.getBoundingClientRect();
                let x0 = Infinity, y0 = Infinity, x1 = -Infinity;
                document.querySelectorAll(`#rechenweg-schicht [data-schritt="${i}"]`).forEach(z => {
                    const r = (z.querySelector('.katex-html') || z).getBoundingClientRect();
                    if (r.width) { x0 = Math.min(x0, r.left); y0 = Math.min(y0, r.top); x1 = Math.max(x1, r.right); }
                });
                f.schritt = i;
                f.bereit = true;
                if (!isFinite(x0) || !satz.kw) { f.v = null; flugZiel(f, f.ziel, 1); return; }
                const sx = satz.dx + satz.kx * satz.skala, sy = satz.dy + satz.ky * satz.skala, sw = satz.kw * satz.skala;
                const s = (x1 - x0) / Math.max(1, sw);
                f.mt0 = performance.now();
                flugZiel(f, { s, tx: x0 - c.left - s * sx, ty: y0 - c.top - s * sy }, Math.max(500, morphDauer * 1000));
            } catch (e) {
                if (stand !== flugStand) return;
                f.zurueck = true;
                flugZiel(f, { tx: 0, ty: 0, s: 1 }, 600);
            }
        }

        function rechenwegHoch() {
            const zeilen = analysis.lines.filter(l => !zuKlein(l));
            if (!zeilen.length) return;
            // Doc, 25.09.: "wenn ich mit zwei Fingern nach oben schiebe, die
            // Erkennung sofort beginnt ... Vielleicht sogar in der Bewegung" -
            // a line not typeset yet takes off at once and morphs on the way
            // (starteFluege); so does everything while earlier flights are
            // still up, or the steps would overtake each other
            const fertig = zeilen.every(l => zeilenErgebnis[l.lineIdx] && zeilenErgebnis[l.lineIdx].latex && zeilenErgebnis[l.lineIdx].satz);
            if (!fertig || fluege.length) { starteFluege(zeilen); return; }
            if (morphT < 1) setzeMorph(1);
            const c = container.getBoundingClientRect();
            // where each line is now: its typeset formula, or its ink if the morph did not take
            const von = zeilen.map(l => {
                const k = document.querySelector(`#satz-schicht [data-zeile="z${l.lineIdx}"] .katex-html`);
                if (k) { const r = k.getBoundingClientRect(); if (r.width) return { x: r.left - c.left, y: r.top - c.top, w: r.width }; }
                return { x: l.bbox.x, y: l.bbox.y, w: l.bbox.w };
            });
            const latexe = zeilen.map(l => zeilenErgebnis[l.lineIdx].latex);
            const erster = rechenweg.length;
            latexe.forEach(l => rechenweg.push(l));
            merkeRechenweg();
            // the ink and the typeset line go; the new steps wait hidden in their place
            const weg = new Set(zeilen.flatMap(l => l.symbols.flatMap(sy => sy.strokeIdxs)));
            const bleiben = strokes.filter((_, i) => !weg.has(i));
            strokes.length = 0;
            bleiben.forEach(s => strokes.push(s));
            verwerfeErkennung();
            recompute();
            merkeStriche();
            zeigeRechenweg(erster);
            const host = document.getElementById('rechenweg-schicht');
            latexe.forEach((latex, k) => {
                const zellen = [...host.querySelectorAll(`[data-schritt="${erster + k}"]`)];
                const zeigen = () => zellen.forEach(z => { z.style.visibility = ''; });
                let x0 = Infinity, y0 = Infinity;
                zellen.forEach(z => {
                    const r = (z.querySelector('.katex-html') || z).getBoundingClientRect();
                    if (r.width) { x0 = Math.min(x0, r.left); y0 = Math.min(y0, r.top); }
                });
                if (!isFinite(x0)) { zeigen(); return; }
                // one piece in flight, set at the step's size and nudged onto its spot
                const flug = document.createElement('div');
                flug.style.cssText = `position:absolute;left:${x0 - c.left}px;top:${y0 - c.top}px;pointer-events:none;` +
                    `white-space:nowrap;line-height:normal;font-size:${RECHEN_SCHRIFT};color:${INK};z-index:4`;
                try { katex.render(alsDisplay(latex), flug, { throwOnError: false }); } catch (_) { flug.textContent = latex; }
                container.appendChild(flug);
                const fk = flug.querySelector('.katex-html') || flug;
                let r = fk.getBoundingClientRect();
                const links = x0 - c.left + (x0 - r.left), oben = y0 - c.top + (y0 - r.top);
                flug.style.left = links + 'px';
                flug.style.top = oben + 'px';
                r = fk.getBoundingClientRect();
                const a = von[k], s = a.w / Math.max(1, r.width);
                // scale about the formula's own corner, so start and end are exact
                flug.style.transformOrigin = `${r.left - c.left - links}px ${r.top - c.top - oben}px`;
                flug.style.transform = `translate(${a.x - (r.left - c.left)}px, ${a.y - (r.top - c.top)}px) scale(${s})`;
                flug.getBoundingClientRect();
                flug.style.transition = 'transform 0.7s cubic-bezier(0.3, 0.7, 0.3, 1)';
                flug.style.transform = 'none';
                let gelandet = false;
                const landen = () => { if (gelandet) return; gelandet = true; flug.remove(); zeigen(); };
                flug.addEventListener('transitionend', landen, { once: true });
                setTimeout(landen, 1000);
            });
        }

        // Doc: "auf der rechten Seite im großen Panel links und rechts ein
        // Dreieck", then "in die Mitte. Y" - the panel's back and forth on the
        // board itself, at the left and right edge, halfway down
        function zeigeTafelPfeile() {
            if (document.getElementById('tafel-pfeil-zurueck')) return;
            const PFEIL = 'position:absolute;top:50%;transform:translateY(-50%);width:56px;height:96px;padding:0;' +
                'border:none;background:transparent;color:#8a93a3;cursor:pointer;touch-action:manipulation;z-index:5;' +
                'display:flex;align-items:center;justify-content:center';
            [['zurueck', -1, 'left:0', 'vorige Aufgabe', 'M17 4 L6 12 L17 20 Z'],
             ['vor', 1, 'right:0', 'nächste Aufgabe', 'M7 4 L18 12 L7 20 Z']].forEach(([id, schritt, seite, text, d]) => {
                const b = document.createElement('button');
                b.id = 'tafel-pfeil-' + id;
                b.style.cssText = PFEIL + ';' + seite;
                b.title = text;
                b.setAttribute('aria-label', text);
                b.innerHTML = `<svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="${d}" fill="currentColor"/></svg>`;
                b.addEventListener('click', () => naechsteVorlage(schritt));
                container.appendChild(b);
            });
        }

        // Doc: "mach bei Weiter einen left right mit Dreiecken" - back and forth.
        // Without "Meine Beispiele" it steps through the tasks; a new task
        // starts on a clean board.
        function naechsteVorlage(schritt) {
            if (!testModus) {
                const n = AUFGABEN.length;
                aufgabeIdx = (aufgabeIdx + (schritt === -1 ? -1 : 1) + n) % n;
                try { localStorage.setItem('vorrechnen-aufgabe', String(aufgabeIdx)); } catch (_) {}
                flugAbbrechen();
                rechenweg.length = 0;
                merkeRechenweg();
                clearAll();
                zeigeVorlage();
                return;
            }
            const n = VORLAGEN.length;
            vorlageIdx = (vorlageIdx + (schritt === -1 ? -1 : 1) + n) % n;
            try { localStorage.setItem('vorrechnen-vorlage', String(vorlageIdx)); } catch (_) {}
            clearAll();
            zeigeVorlage();
            setProbeStatus('–');
            if (testModus) beispiel();
        }

        // ── Test mode: Doc's own handwriting for the template on top ────────
        // Doc, 25.09.: "Wir sind jetzt im Modus, dass wir erstmal testen, wie gut
        // das Morph funktioniert. Aufgrund der Beispiele, die wir haben." With
        // "Meine Beispiele" on, every template (WEITER, and at start) comes with
        // what he wrote for it - the corpus from the OneDrive zip - centred, a
        // moment to see the ink, then the morph into the template. BEISPIEL shows
        // it again. No API call; an example is never saved as a probe.
        let korpus = null, beispielTimer = null, istBeispiel = false;
        let testModus = true;
        try { const v = localStorage.getItem('vorrechnen-testmodus'); if (v !== null) testModus = v === '1'; } catch (_) {}

        // template LaTeX -> the first probe written for it. Later probes under the
        // same slug may hold anything (probe 26-32: an integral under "linear").
        async function ladeKorpus() {
            if (korpus) return korpus;
            korpus = new Map();
            try {
                const namen = (await (await fetch('/__proben/', { cache: 'no-store' })).json()).proben || [];
                const daten = await Promise.all(namen.map(n =>
                    fetch('morpheus/handschrift-proben/' + n, { cache: 'no-store' }).then(r => r.json()).catch(() => null)));
                daten.forEach(d => {
                    const l = d && d.vorlage && d.vorlage.latex;
                    if (l && d.strokes && d.strokes.length && !korpus.has(l)) korpus.set(l, d);
                });
            } catch (_) {}
            return korpus;
        }

        // A reload (live reload after every edit) brings the strokes back but not
        // the recognition - Doc then saw his handwriting without morph or formula.
        // So the lab remembers that the canvas shows an example and replays it.
        function merkeBeispiel(ja) {
            try { localStorage.setItem('vorrechnen-beispiel', ja ? '1' : '0'); } catch (_) {}
        }

        async function beispiel() {
            const latex = VORLAGEN[vorlageIdx][1];
            const d = (await ladeKorpus()).get(latex);
            clearTimeout(beispielTimer);
            verwerfeErkennung();
            strokes.length = 0;
            current = null;
            istBeispiel = !!d;
            merkeBeispiel(!!d);
            if (!d) { recompute(); merkeStriche(); redraw(); zeigeVorlage('keine Probe'); return; }
            // Written on another screen: centred under the head strip, shrunk
            // only if it would not fit - never enlarged, it is Doc's size.
            let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
            d.strokes.forEach(st => st.points.forEach(q => { x0 = Math.min(x0, q.x); y0 = Math.min(y0, q.y); x1 = Math.max(x1, q.x); y1 = Math.max(y1, q.y); }));
            // between the template strip on top and, at the bottom, the recognised
            // formula (84 px) above the film strip (56 px)
            // the recognised formula is the same formula, so it is as tall as the
            // template strip
            const rect = container.getBoundingClientRect();
            const kopfEl = document.getElementById('vorlage-schicht');
            const KOPF = Math.max(84, kopfEl ? kopfEl.getBoundingClientRect().height : 84), FUSS = 56 + KOPF;
            const w = Math.max(1, x1 - x0), h = Math.max(1, y1 - y0);
            const sk = Math.min(1, (rect.width - 100) / w, (rect.height - KOPF - FUSS - 20) / h);
            const ox = (rect.width - w * sk) / 2, oy = KOPF + (rect.height - KOPF - FUSS - h * sk) / 2;
            d.strokes.forEach(st => strokes.push(Object.assign({}, st, {
                width: (st.width || 3) * sk,
                points: st.points.map(q => Object.assign({}, q, { x: ox + (q.x - x0) * sk, y: oy + (q.y - y0) * sk })),
            })));
            recompute();
            merkeStriche();
            redraw();
            zeigeVorlage();
            const zeilen = analysis.lines.filter(l => !zuKlein(l));
            if (zeilen.length !== 1) return;
            const line = zeilen[0];
            const { atome, svg, satz } = await formelAufZeile(latex, line);
            const { zuordnung, nachjustiert } = ordneZeile(line, atome);
            zeilenErgebnis[line.lineIdx] = { latex, tokens: [], atome, ms: 0, zuordnung, svg, nachjustiert, satz };
            await HandschriftMorph.schriftenBereit(atome);
            await HandschriftMorph.svgVorbereiten(atome);
            morphVorbereitet[line.lineIdx] = bereiteMorph(line, zuordnung, atome);
            zeigeFormeln();
            beispielTimer = setTimeout(() => morphen(1), morphOpts.pause * 1000);
        }

        // Doc: "Show (again)" - back to the handwriting, a moment to see it,
        // then the morph once more. Nothing is recognised or saved again.
        function nochmal() {
            if (!morphVorbereitet.some(Boolean)) { setProbeStatus('Erst ERKENNEN oder BEISPIEL'); return; }
            clearTimeout(beispielTimer);
            setzeMorph(0);
            beispielTimer = setTimeout(() => morphen(1), morphOpts.pause * 1000);
        }

        function setProbeStatus(msg) {
            const el = document.getElementById('probe-status');
            if (el) el.textContent = msg;
        }

        // One probe per ERKENNEN: strokes, the template, what was recognised,
        // and how the pairing went. The server picks the running number.
        async function speichereProbe() {
            // probes are for the templates only - in class (the tasks) nothing
            // is saved, and on docalvers.de nothing may land as a download
            if (istBeispiel || !testModus) return;
            const [slug, vorlage] = VORLAGEN[vorlageIdx];
            const erg = analysis.lines.map(l => zeilenErgebnis[l.lineIdx]).find(e => e && e.latex);
            const probe = {
                version: 2, created: new Date().toISOString(), geraet: navigator.userAgent.includes('Android') ? 'Tablet' : 'Mac',
                canvas: { w: canvas.width, h: canvas.height, dpr: devicePixelRatio },
                vorlage: { idx: vorlageIdx, slug, latex: vorlage },
                latex: erg ? erg.latex : '', tokens: erg ? erg.tokens : [],
                zeichen: erg && erg.atome ? erg.atome.length : 0,
                passt: !!(erg && erg.zuordnung && erg.zuordnung.passt),
                nachjustiert: !!(erg && erg.nachjustiert),
                diagnose: erg && erg.zuordnung ? erg.zuordnung.diagnose : (erg && erg.fehler) || '',
                morph: !!morphVorbereitet.some(Boolean),
                options: opts, strokes,
            };
            const body = JSON.stringify(probe, null, 1);
            if (speichernApi) {
                try {
                    const r = await fetch('/__proben/' + encodeURIComponent(slug), {
                        method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
                    const j = await r.json().catch(() => ({}));
                    if (r.ok && j.name) {
                        setProbeStatus('gespeichert: ' + j.name);
                        korpus = null;          // a new probe is an example right away, not after a reload
                        return;
                    }
                    setProbeStatus('Speichern fehlgeschlagen (' + r.status + ') – Download stattdessen');
                } catch (e) {
                    setProbeStatus('Speichern fehlgeschlagen – Download stattdessen');
                }
            } else {
                setProbeStatus('kein Speicher-Endpunkt – Download stattdessen');
            }
            const blob = new Blob([body], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'probe-' + slug + '-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.json';
            a.click();
            URL.revokeObjectURL(a.href);
        }

        // ── Export / import ─────────────────────────────────────────────────
        // The point of this page: draw once, then replay the strokes as often as
        // needed while tuning, without picking the tablet back up.
        function exportStrokes() {
            const data = {
                version: 1,
                created: new Date().toISOString(),
                canvas: { w: Math.round(container.getBoundingClientRect().width),
                          h: Math.round(container.getBoundingClientRect().height) },
                options: opts,
                strokes,
            };
            const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'striche-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.json';
            a.click();
            URL.revokeObjectURL(a.href);
        }

        function importStrokes(file) {
            const r = new FileReader();
            r.onload = () => {
                try {
                    const d = JSON.parse(r.result);
                    if (!Array.isArray(d.strokes)) throw new Error('keine Striche in der Datei');
                    strokes.length = 0;
                    d.strokes.forEach(s => strokes.push(s));
                    recompute();
                } catch (e) {
                    alert('Konnte die Datei nicht lesen: ' + e.message);
                }
            };
            r.readAsText(file);
        }

        // Anything that was recognised belongs to the strokes as they were. Once
        // the ink changes, that result is stale - so it goes, together with the
        // morph built from it. Otherwise a second example would inherit the
        // first one's glyphs.
        function verwerfeErkennung() {
            erkennenStand++;
            zeilenErgebnis.length = 0;
            morphVorbereitet.length = 0;
            if (morphAnim) { cancelAnimationFrame(morphAnim); morphAnim = null; }
            morphT = 0;
            const r = document.getElementById('morph-regler');
            if (r) r.value = 0;
            const h = document.getElementById('formel-schicht');
            if (h) h.innerHTML = '';
            setErgebnisText('–');
        }

        function clearAll() {
            // The working survives a LEEREN of the page (a botched step must not
            // cost the lesson's board); LEEREN on an empty page clears it too.
            if (!strokes.length && !current && !tipp && (rechenweg.length || fluege.length)) {
                flugAbbrechen();
                rechenweg.length = 0;
                merkeRechenweg();
                zeigeRechenweg();
            }
