            let unten = host.getBoundingClientRect().top - c.top - gap, gleich = c.width / 2;
            [...host.children].forEach(z => { const r = z.getBoundingClientRect(); if (r.height) unten = Math.max(unten, r.bottom - c.top); });
            if (host.children[0]) gleich = host.children[0].getBoundingClientRect().right - c.left;
            const s = Math.min(1, 1.2 * glyph / Math.max(1, b.h));
            const oben = unten + gap + k * (1.25 * glyph + gap);
            return { s, tx: gleich - s * (b.x + b.w / 2), ty: oben - s * b.y };
        }
        function starteFluege(zeilen) {
            const wartend = fluege.filter(f => !f.bereit).length;
            const neu = zeilen.map((l, k) => {
                const idxs = [...new Set(l.symbols.flatMap(sy => sy.strokeIdxs))].sort((a, b) => a - b);
                const erg = zeilenErgebnis[l.lineIdx];
                const f = { striche: idxs.map(i => strokes[i]), latex: erg && erg.latex || null, farbe: linienFarbe(l), v: null, mt: 0, mt0: null,
                    p: { tx: 0, ty: 0, s: 1 }, bereit: false, zurueck: false, schritt: -1 };
                flugZiel(f, schaetzeZiel(l.bbox, wartend + k), FLUG_START);
                return f;
            });
            // the page is free at once; a recognition under way is void now
            const weg = new Set(zeilen.flatMap(l => l.symbols.flatMap(sy => sy.strokeIdxs)));
            const bleiben = strokes.filter((_, i) => !weg.has(i));
            strokes.length = 0;
            bleiben.forEach(st => strokes.push(st));
            neu.forEach(f => fluege.push(f));
            verwerfeErkennung();
            recompute();
            merkeStriche();
            // one after the other, so the steps keep the order they were swiped in
            neu.forEach(f => { flugKette = flugKette.then(() => erkenneFlug(f)); });
        }
        async function erkenneFlug(f) {
            const stand = flugStand;
            try {
                const ana = StrokeSymbols.analyse(f.striche, opts);
                if (ana.lines.length !== 1) throw new Error('keine einzelne Zeile');
                const line = ana.lines[0];
                let latex = f.latex;
                if (!latex) {
                    const modelEl = document.getElementById('modell-wahl');
                    const r = await FormelErkennen.erkenneZeile(f.striche, line.symbols.flatMap(sy => sy.strokeIdxs),
                        { model: modelEl ? modelEl.value : 'gemini-2.5-flash' });
                    if (!r.ok || !r.latex || /^\(?\s*(empty|leer)\s*\)?$/i.test(r.latex)) throw new Error(r.error || 'nichts erkannt');
                    latex = bereinige(r.latex);
                }
                if (stand !== flugStand) return;
                const { atome, satz } = await formelAufZeile(latex, line);
                const { zuordnung } = ordneZeile(line, atome, f.striche);
                try {
                    await HandschriftMorph.schriftenBereit(atome);
                    await HandschriftMorph.svgVorbereiten(atome);
                    f.v = bereiteMorph(line, zuordnung, atome, f.striche);
                } catch (_) { f.v = null; }
                if (stand !== flugStand) return;
                // the row, hidden, gives the exact place: the typeset line's
                // corner and width map onto the row's
                const i = rechenweg.length;
                rechenweg.push({ latex, farbe: f.farbe });
                merkeRechenweg();
                imFlug.add(i);
                zeigeRechenweg();
                const c = container.getBoundingClientRect();
                let x0 = Infinity, y0 = Infinity, x1 = -Infinity;
                document.querySelectorAll(`#rechenweg-schicht [data-schritt="${i}"]`).forEach(z => {
                    const r = (z.querySelector('.katex-html') || z).getBoundingClientRect();
                    if (r.width) { x0 = Math.min(x0, r.left); y0 = Math.min(y0, r.top); x1 = Math.max(x1, r.right); }
                });
                f.schritt = i;
                f.bereit = true;
                if (!isFinite(x0) || !satz.kw) { f.v = null; flugZiel(f, f.ziel, 1); return; }
                const sx = satz.dx + satz.kx * satz.skala, sy = satz.dy + satz.ky * satz.skala, sw = satz.kw * satz.skala;
                const s = (x1 - x0) / Math.max(1, sw);
                f.mt0 = performance.now();
                flugZiel(f, { s, tx: x0 - c.left - s * sx, ty: y0 - c.top - s * sy }, Math.max(500, morphDauer * 1000));
            } catch (e) {
                if (stand !== flugStand) return;
                f.zurueck = true;
                flugZiel(f, { tx: 0, ty: 0, s: 1 }, 600);
            }
        }

        function rechenwegHoch() {
            const zeilen = analysis.lines.filter(l => !zuKlein(l));
            if (!zeilen.length) return;
            merkeVerlauf();
            // Doc, 25.09.: "wenn ich mit zwei Fingern nach oben schiebe, die
            // Erkennung sofort beginnt ... Vielleicht sogar in der Bewegung" -
            // a line not typeset yet takes off at once and morphs on the way
            // (starteFluege); so does everything while earlier flights are
            // still up, or the steps would overtake each other
            // ("zwei Finger oder ... soll die Handschrift hochfliegen und im Flug sich
            // verwandeln", a tap on the recognised line too - only a line already
            // typeset in place, as in "Beispiele", flies as KaTeX)
            const fertig = morphT >= 1 && zeilen.every(l => zeilenErgebnis[l.lineIdx] && zeilenErgebnis[l.lineIdx].latex && zeilenErgebnis[l.lineIdx].satz);
            if (!fertig || fluege.length) { starteFluege(zeilen); return; }
            if (morphT < 1) setzeMorph(1);
            const c = container.getBoundingClientRect();
            // where each line is now: its typeset formula, or its ink if the morph did not take
            const von = zeilen.map(l => {
                const k = document.querySelector(`#satz-schicht [data-zeile="z${l.lineIdx}"] .katex-html`);
                if (k) { const r = k.getBoundingClientRect(); if (r.width) return { x: r.left - c.left, y: r.top - c.top, w: r.width }; }
                return { x: l.bbox.x, y: l.bbox.y, w: l.bbox.w };
            });
            const latexe = zeilen.map(l => zeilenErgebnis[l.lineIdx].latex);
            const farben = zeilen.map(l => linienFarbe(l));
            const erster = rechenweg.length;
            latexe.forEach((l, k) => rechenweg.push({ latex: l, farbe: farben[k] }));
            merkeRechenweg();
            // the ink and the typeset line go; the new steps wait hidden in their place
            const weg = new Set(zeilen.flatMap(l => l.symbols.flatMap(sy => sy.strokeIdxs)));
            const bleiben = strokes.filter((_, i) => !weg.has(i));
            strokes.length = 0;
            bleiben.forEach(s => strokes.push(s));
            verwerfeErkennung();
            recompute();
            merkeStriche();
            zeigeRechenweg(erster);
            const host = document.getElementById('rechenweg-schicht');
            latexe.forEach((latex, k) => {
                const zellen = [...host.querySelectorAll(`[data-schritt="${erster + k}"]`)];
                const zeigen = () => zellen.forEach(z => { z.style.visibility = ''; });
                let x0 = Infinity, y0 = Infinity;
                zellen.forEach(z => {
                    const r = (z.querySelector('.katex-html') || z).getBoundingClientRect();
                    if (r.width) { x0 = Math.min(x0, r.left); y0 = Math.min(y0, r.top); }
                });
                if (!isFinite(x0)) { zeigen(); return; }
                // one piece in flight, set at the step's size and nudged onto its spot
                const flug = document.createElement('div');
                flug.style.cssText = `position:absolute;left:${x0 - c.left}px;top:${y0 - c.top}px;pointer-events:none;` +
                    `white-space:nowrap;line-height:normal;font-size:${RECHEN_SCHRIFT};color:${anzeige(farben[k])};z-index:4`;
                try { katex.render(alsDisplay(latex), flug, { throwOnError: false }); } catch (_) { flug.textContent = latex; }
                container.appendChild(flug);
                const fk = flug.querySelector('.katex-html') || flug;
                let r = fk.getBoundingClientRect();
                const links = x0 - c.left + (x0 - r.left), oben = y0 - c.top + (y0 - r.top);
                flug.style.left = links + 'px';
                flug.style.top = oben + 'px';
                r = fk.getBoundingClientRect();
                const a = von[k], s = a.w / Math.max(1, r.width);
                // scale about the formula's own corner, so start and end are exact
                flug.style.transformOrigin = `${r.left - c.left - links}px ${r.top - c.top - oben}px`;
                flug.style.transform = `translate(${a.x - (r.left - c.left)}px, ${a.y - (r.top - c.top)}px) scale(${s})`;
                const zwilling = anzeigeZwilling(flug);       // the same piece on the beamer
                flug.getBoundingClientRect();
                flug.style.transition = 'transform 0.7s cubic-bezier(0.3, 0.7, 0.3, 1)';
                flug.style.transform = 'none';
                if (zwilling) {
                    try {
                        zwilling.getBoundingClientRect();
                        zwilling.style.transition = flug.style.transition;
                        zwilling.style.transform = 'none';
                    } catch (_) {}
                }
                let gelandet = false;
                const landen = () => {
                    if (gelandet) return;
                    gelandet = true;
                    flug.remove();
                    if (zwilling) try { zwilling.remove(); } catch (_) {}
                    zeigen();
                };
                flug.addEventListener('transitionend', landen, { once: true });
                setTimeout(landen, 1000);
            });
        }

        // Doc: "auf der rechten Seite im großen Panel links und rechts ein
        // Dreieck", then "in die Mitte. Y" - the panel's back and forth on the
        // board itself, at the left and right edge, halfway down
        // Bottom centre in class (Aufgaben, Frei): the small ERKENNEN until the
        // page is recognised, then the recognised line in its place - a tap on
        // that line is GO (zeigeFormeln). Doc: "wenn da noch nichts steht, kann
        // ich auch nicht abschicken ... mach dann doch den Erkennen-Button"
        function seiteErkannt() {
            const zeilen = analysis.lines.filter(l => !zuKlein(l));
            return zeilen.length > 0 && zeilen.every(l => zeilenErgebnis[l.lineIdx] && zeilenErgebnis[l.lineIdx].latex);
        }
        function erkennenKlein() {
            let k = document.getElementById('erkennen-klein');
            if (!k) {
                k = document.createElement('button');
                k.id = 'erkennen-klein';
                k.type = 'button';
                k.textContent = 'ERKENNEN';
                k.title = 'Erkennen';
                k.addEventListener('click', () => erkennen());
                container.appendChild(k);
            }
            k.style.display = (testModus || seiteErkannt()) ? 'none' : '';
            // pale on an empty page and while Gemini reads
            k.style.opacity = (!analysis.lines.some(l => !zuKlein(l)) || erkennenLaeuft) ? '0.4' : '';
        }
        function zeigeTafelPfeile() {
            erkennenKlein();
            const da = document.querySelectorAll('[id^="tafel-pfeil-"]');
            if (da.length) {
                // Doc, 26.09.: "bring die vor/zurück Pfeile runter in den Karobereich" -
                // halfway down the squares (above the film strip when it shows)
                const h = container.getBoundingClientRect().height;
                const mitte = (papierGrenze(h) + h - (testModus ? ZEITLEISTE_H : 0)) / 2;
                da.forEach(b => { b.style.display = modus === 'frei' ? 'none' : 'flex'; b.style.top = mitte + 'px'; });
                return;
            }
            const PFEIL = 'position:absolute;top:50%;transform:translateY(-50%);width:56px;height:96px;padding:0;' +
                'border:none;background:transparent;color:#8a93a3;cursor:pointer;touch-action:manipulation;z-index:5;' +
                'display:flex;align-items:center;justify-content:center';
            [['zurueck', -1, 'left:0', 'vorige Aufgabe', 'M17 4 L6 12 L17 20 Z'],
             ['vor', 1, 'right:0', 'nächste Aufgabe', 'M7 4 L18 12 L7 20 Z']].forEach(([id, schritt, seite, text, d]) => {
                const b = document.createElement('button');
                b.id = 'tafel-pfeil-' + id;
                b.style.cssText = PFEIL + ';' + seite;
                b.title = text;
                b.setAttribute('aria-label', text);
                b.innerHTML = `<svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="${d}" fill="currentColor"/></svg>`;
                b.addEventListener('click', () => naechsteVorlage(schritt));
                container.appendChild(b);
            });
            zeigeTafelPfeile();
        }

        // ── Beamer ──────────────────────────────────────────────────────────
        // Doc, 26.09.: "baue einen modus wie in den Decks, das ich projizieren
        // kann. Kids sehen nur die Rechnungen, ich mission control" - and: "der
        // Beamer soll gerade nicht spiegeln". As in the decks: one tap puts this
        // window fullscreen on the beamer (Window Management API) and opens
        // mission control on the laptop (?steuerung) - the full lab, where Doc
        // writes. Mission control sends every picture of the board: the canvas
        // (drawImage from its own), the layers when they change, the typeset
        // line's flight as a twin. Controls never reach the beamer. Closing
        // mission control brings this window back.
        let steuerFenster = null, anzeigeFrame = null, buehne = { w: 0, h: 0 };
        // not 'formel-schicht': the recognised line is Doc's GO, the class sees
        // only the ink fly up and turn into LaTeX
        const SPIEGEL_SCHICHTEN = ['papier', 'vorlage-schicht', 'rechenweg-schicht', 'satz-schicht'];
        const spiegelCache = {};
        function anzeigeLaeuft() { return anzeigeModus; }
        function anzeigeZiel() {
            if (!STEUERUNG) return null;
            try {
                const z = window.opener;
                return (z && !z.closed && typeof z.anzeigeLaeuft === 'function' && z.anzeigeLaeuft()) ? z : null;
            } catch (_) { return null; }
        }
        // a layer's markup, read again only when it changed (watched per layer)
        function spiegelSchicht(id) {
            const el = document.getElementById(id);
            if (!el) return null;
            let c = spiegelCache[id];
            if (!c || c.el !== el) {
                c = spiegelCache[id] = { el, dirty: true, version: 0 };
                // any change of a layer sends by itself - a landing only unhides
                // a row, and nothing draws after it
                c.obs = new MutationObserver(() => { c.dirty = true; anzeigeBald(); });
                c.obs.observe(el, { subtree: true, childList: true, attributes: true, characterData: true });
            }
            if (c.obs.takeRecords().length) c.dirty = true;
            if (c.dirty) { c.css = el.style.cssText; c.html = el.innerHTML; c.dirty = false; c.version++; }
            return [id, c.css, c.html, c.version];
        }
        function anzeigeSenden() {
            anzeigeFrame = null;
            const ziel = anzeigeZiel();
            if (!ziel) return;
            const r = container.getBoundingClientRect();
            try {
                ziel.anzeigeEmpfang({ w: Math.round(r.width), h: Math.round(r.height), hell, leinwand: canvas,

            const ziel = anzeigeZiel();

        }

        // -- on the beamer --
        function anzeigeEmpfang(d) {
            if (!anzeigeModus) return;
            if (d.w !== buehne.w || d.h !== buehne.h) { buehne = { w: d.w, h: d.h }; anzeigeEinpassen(); }
            if (container.classList.contains('hell') !== d.hell) {
                container.classList.toggle('hell', d.hell);
                document.documentElement.style.setProperty('--anzeige-grund', d.hell ? '#f4ecd8' : '#050d1c');
            }
            const q = d.leinwand;
            if (canvas.width !== q.width || canvas.height !== q.height) { canvas.width = q.width; canvas.height = q.height; }
            canvas.style.width = d.w + 'px';
            canvas.style.height = d.h + 'px';

        // mission control's board, as large as the beamer allows, centred
        function anzeigeEinpassen() {
            if (!anzeigeModus || !buehne.w) return;

            container.style.width = buehne.w + 'px';
            container.style.height = buehne.h + 'px';

        function anzeigeAn() {

        // back to normal: the state is mission control's now, so load it afresh

        async function beamerStart() {

        function beamerAngebot(text, nochmal) {

                k.innerHTML = '<div style="background:#0b1a33;border:1px solid rgba(0,210,255,0.35);border-radius:18px;padding:28px 32px;' +
                    'max-width:520px;font-family:Orbitron,sans-serif;color:#eaf0f7;text-align:center">' +
                    '<p class="beamer-text" style="margin:0 0 24px;line-height:1.6;font-size:1rem"></p>' +
                    '<div style="display:flex;gap:14px;justify-content:center">' +
                    '<button type="button" class="cyber-btn beamer-los" style="flex:1">AUF DEN BEAMER</button>' +

        // ── Undo / redo ─────────────────────────────────────────────────────
        // Doc, 26.09.: "unten: C (für clear), undo/redo". A snapshot of the page
        // and the working before every change (a stroke, C / LEEREN, a swipe);
        // undo steps back through them, redo forth. A new task, mode or
        // example starts a new history.
        const verlauf = [], vorwaerts = [];
        const VERLAUF_MAX = 200;
        function schnappschuss() { return { striche: strokes.slice(), rechenweg: rechenweg.slice() }; }
        function merkeVerlauf() {
            verlauf.push(schnappschuss());
            if (verlauf.length > VERLAUF_MAX) verlauf.shift();
            vorwaerts.length = 0;
        }
        function vergissVerlauf() { verlauf.length = 0; vorwaerts.length = 0; }

        function setzeHell(an) {
            hell = an;
            try { localStorage.setItem('vorrechnen-hell', an ? '1' : '0'); } catch (_) {}
            container.classList.toggle('hell', an);
            zeigeVorlage();                    // template colour, and the working
            zeigeFormeln();
            redraw();                          // ink, morph, typeset lines, circles
        }
        function stelleHer(z) {
            flugAbbrechen();
            clearTimeout(autoTimer);
            clearTimeout(beispielTimer);
            if (tipp) { clearTimeout(tipp.timer); tipp = null; }
            current = null;
            strokes.length = 0;
            z.striche.forEach(st => strokes.push(st));
            rechenweg.length = 0;
            z.rechenweg.forEach(l => rechenweg.push(l));
            istBeispiel = false;
            merkeBeispiel(false);
            verwerfeErkennung();
            recompute();
            merkeStriche();
            merkeRechenweg();
            zeigeRechenweg();

        }
        function rueckgaengig() {
            if (!verlauf.length) return;

        }
        function wiederholen() {
            if (!vorwaerts.length) return;
            verlauf.push(schnappschuss());
            stelleHer(vorwaerts.pop());
        }

        // The tools sit on the right rail (Doc, 26.09.: "rechts einen dunkelblauen
        // Streifen, so wie das Mini-Rail ... pack die Icons auf dieses Mini-Rail"):
        // rail buttons like the left ones - the colours, then C / undo / redo, then
        // light and beamer. Icons are SVG (Doc: never a font glyph), the C too;
        // their stroke is the rail's (1.5, js/cyber-lab-overrides.css).
        const WERKZEUG_ICONS = {
            clear: '<path d="M16.5 7.2 A6.8 6.8 0 1 0 16.5 16.8" fill="none" stroke="currentColor" stroke-linecap="round"/>',
            undo: '<path d="M9 13 L4.5 8.5 L9 4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>' +
                  '<path d="M4.5 8.5 H14 A5.5 5.5 0 0 1 14 19.5 H10" fill="none" stroke="currentColor" stroke-linecap="round"/>',
            redo: '<path d="M15 13 L19.5 8.5 L15 4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>' +
                  '<path d="M19.5 8.5 H10 A5.5 5.5 0 0 0 10 19.5 H14" fill="none" stroke="currentColor" stroke-linecap="round"/>',
            // light / dark: a circle, half filled
            hell: '<circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor"/>' +
                  '<path d="M12 4.5 A7.5 7.5 0 0 0 12 19.5 Z" fill="currentColor"/>',
            // full screen, as in the decks: corners out / corners in
            vollbild: '<g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">' +
                      '<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/>' +
                      '<path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></g>',
            vollbildAus: '<g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">' +
                      '<path d="M3 8h3a2 2 0 0 0 2-2V3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/>' +
                      '<path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/></g>',
            // beamer: a screen on its stand
            beamer: '<rect x="3.5" y="5" width="17" height="11" rx="1.5" fill="none" stroke="currentColor"/>' +
                    '<path d="M12 16 V20 M8 20 H16" fill="none" stroke="currentColor" stroke-linecap="round"/>',
        };
        function railKnopf(id, text, inhalt, tun, neueGruppe) {
            const b = document.createElement('button');
            b.type = 'button';
            b.id = id;
            b.className = 'nav-btn';
            b.title = text;
            b.setAttribute('aria-label', text);
            b.style.touchAction = 'manipulation';
            if (neueGruppe) b.style.marginTop = '12px';
            b.innerHTML = inhalt;
            b.addEventListener('click', e => tun(e));

            return b;
        }
        function vollbildUmschalten() {
            if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
            else document.documentElement.requestFullscreen().catch(() => {});
        }
        // The dot of the decks (deck.js, Doc 21.09.): orange = not extended - at the
        // board that means mirrored, Win P / Cmd F1 (mirrored and "laptop alone" look
        // the same to the browser); green = extended, the beamer is ready. Only where
        // the browser can tell (Chrome), and not in mission control: it projects already.
        const SCHIRM_BEKANNT = 'isExtended' in screen;
        function zeigeVollbildKnopf() {
            const b = document.getElementById('werkzeug-vollbild');
            if (!b) return;
            const an = !!document.fullscreenElement, erweitert = SCHIRM_BEKANNT && screen.isExtended;
            const punkt = SCHIRM_BEKANNT && !STEUERUNG;
            const sig = [an, erweitert, punkt].join();
            if (b.dataset.sig !== sig) {
                b.dataset.sig = sig;
                b.style.position = 'relative';
                b.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">${WERKZEUG_ICONS[an ? 'vollbildAus' : 'vollbild']}</svg>` +
                    (punkt ? `<span class="schirm-punkt" style="position:absolute;top:-4px;right:-4px;width:11px;height:11px;` +
                        `border-radius:50%;background:${erweitert ? 'rgb(121, 158, 49)' : 'rgb(245, 194, 66)'}"></span>` : '');
                b.title = an ? 'Vollbild verlassen'
                    : erweitert ? 'Vollbild – der zweite Bildschirm ist erweitert, der Beamer-Knopf ist da'
                    : SCHIRM_BEKANNT ? 'Vollbild – nur ein Bildschirm: gespiegelt? Windows: Win P → Erweitern' : 'Vollbild';
            }

        }
        // a tap on the dot says what the screens do; anywhere else on the button: full screen
        function vollbildKnopf(e) {
            if (e && e.target && e.target.closest && e.target.closest('.schirm-punkt')) {
                const erweitert = screen.isExtended;
                beamerAngebot(erweitert
                    ? 'Der zweite Bildschirm ist erweitert – der Beamer-Knopf in der rechten Leiste projiziert nur die Rechnung.'
                    : 'Nur ein Bildschirm zu sehen. Hängt der Beamer dran, ist er gespiegelt: Windows Win P → „Erweitern“, am Mac ⌘ F1.', erweitert);
                return;
            }

        }

        // says so, and a slow look as a net (as in the decks)
        if (SCHIRM_BEKANNT) {
            let zuletzt = !!screen.isExtended;
            const nochmal = () => { if (!!screen.isExtended !== zuletzt) { zuletzt = !!screen.isExtended; zeigeWerkzeuge(); } };
            if (screen.addEventListener) screen.addEventListener('change', nochmal);

        }
        // lit = the rail's hover look; the central rule has !important, so this too
        function leuchte(b, an) {
            if (an) {

                b.style.setProperty('box-shadow', '0 0 18px rgba(0, 210, 255, 0.5)', 'important');
            } else {
                b.style.removeProperty('border-color');
                b.style.removeProperty('box-shadow');
            }
        }
        function zeigeWerkzeuge() {
            if (!document.getElementById('right-rail-inner')) return;
            if (!document.getElementById('farbe-0')) {
                FARBEN.forEach(([name, wert], i) => {
                    const b = railKnopf('farbe-' + i, 'Stift ' + name,
                        `<span style="display:block;width:26px;height:26px;border-radius:50%;background:${wert};` +
                        'box-shadow:0 0 0 1px rgba(255, 255, 255, 0.35)"></span>',
                        () => {
                            stiftFarbe = wert;
                            try { localStorage.setItem('vorrechnen-farbe', wert); } catch (_) {}
                            zeigeWerkzeuge();
                        }, false);
                    b.dataset.farbe = wert;
                });
                [['clear', 'Seite leeren (C)', () => clearAll(), true],
                 ['undo', 'Rückgängig', () => rueckgaengig(), false],
                 ['redo', 'Wiederholen', () => wiederholen(), false],
                 ['hell', 'Hell / Dunkel', () => setzeHell(!hell), true],
                 // in mission control it ends the projection
                 ['beamer', STEUERUNG ? 'Beamer beenden' : 'Beamer: nur die Rechnung projizieren',
                     () => { if (STEUERUNG) window.close(); else beamerStart(); }, false],
                 // Doc, 26.09.: "Fullscreen immer zeigen, auch wenn kein zweiter Bildschirm
                 // dran ist, den Beamer nur, wenn ein zweiter Bildschirm wirklich dran ist"
                 ['vollbild', 'Vollbild', (e) => vollbildKnopf(e), false]].forEach(([id, text, tun, neueGruppe]) => {

                const b = document.getElementById('farbe-' + i), an = b.dataset.farbe === stiftFarbe;
                leuchte(b, an);
                b.setAttribute('aria-pressed', an ? 'true' : 'false');
                if (i === 0) {
                    b.firstElementChild.style.background = anzeige(INK);
                    b.title = hell ? 'Stift Tinte' : 'Stift Weiß';
                }
            });
            const hk = document.getElementById('werkzeug-hell');
            hk.setAttribute('aria-pressed', hell ? 'true' : 'false');
            leuchte(hk, hell);
            // in mission control the beamer button is lit: the projection runs;
            // elsewhere it only shows with a second screen, extended
            const bk = document.getElementById('werkzeug-beamer');
            if (STEUERUNG) leuchte(bk, true);
            // (the rail's buttons are display:flex !important - hiding needs it too)

        }

        // Doc: "mach bei Weiter einen left right mit Dreiecken" - back and forth.
        // Without "Meine Beispiele" it steps through the tasks; a new task
        // starts on a clean board.
        function naechsteVorlage(schritt) {
            if (modus === 'frei') return;
            if (aufgabenModus) {
                const n = AUFGABEN.length;
                aufgabeIdx = (aufgabeIdx + (schritt === -1 ? -1 : 1) + n) % n;
                try { localStorage.setItem('vorrechnen-aufgabe', String(aufgabeIdx)); } catch (_) {}
                flugAbbrechen();
                rechenweg.length = 0;
                merkeRechenweg();
                clearAll();
                vergissVerlauf();          // undo must not bring the last task's ink onto this one
                zeigeVorlage();
                return;
            }
            const n = VORLAGEN.length;
            vorlageIdx = (vorlageIdx + (schritt === -1 ? -1 : 1) + n) % n;
            try { localStorage.setItem('vorrechnen-vorlage', String(vorlageIdx)); } catch (_) {}
            clearAll();
            vergissVerlauf();
            zeigeVorlage();
            setProbeStatus('–');
            if (testModus) beispiel();
        }

        // ── Test mode: Doc's own handwriting for the template on top ────────
        // Doc, 25.09.: "Wir sind jetzt im Modus, dass wir erstmal testen, wie gut
        // das Morph funktioniert. Aufgrund der Beispiele, die wir haben." With
        // "Meine Beispiele" on, every template (WEITER, and at start) comes with
        // what he wrote for it - the corpus from the OneDrive zip - centred, a
        // moment to see the ink, then the morph into the template. BEISPIEL shows
        // it again. No API call; an example is never saved as a probe.
        let korpus = null, beispielTimer = null, istBeispiel = false;
        // Doc, 26.09.: "Meine Beispiele ist off dennoch erscheinen sie oben ...
        // wir brauchen einen Aufgaben Modus" - three modes instead of one
        // switch: frei (nothing on top), aufgaben (the tasks, for class),
        // beispiele (the templates with Doc's own handwriting, for testing)
        const MODI = ['frei', 'aufgaben', 'beispiele'];
        let modus = 'aufgaben';
        try {
            const m = localStorage.getItem('vorrechnen-modus');
            if (MODI.includes(m)) modus = m;
            else if (localStorage.getItem('vorrechnen-testmodus') === '1') modus = 'beispiele';
        } catch (_) {}
        let testModus = modus === 'beispiele', aufgabenModus = modus === 'aufgaben';

        // A new mode is a new board: the page, the lines in flight and the
        // working all go
        function setzeModus(m) {
            if (!MODI.includes(m) || m === modus) return;
            modus = m;
            testModus = m === 'beispiele';
            aufgabenModus = m === 'aufgaben';
            try { localStorage.setItem('vorrechnen-modus', m); } catch (_) {}
            leereTafel();
            zeigeVorlage();
            if (testModus) beispiel();
        }
        function leereTafel() {
            clearTimeout(beispielTimer);
            clearTimeout(autoTimer);
            flugAbbrechen();
            vergissVerlauf();
            rechenweg.length = 0;
            merkeRechenweg();
            strokes.length = 0;
            current = null;
            if (tipp) { clearTimeout(tipp.timer); tipp = null; }
            istBeispiel = false;
            merkeBeispiel(false);
            verwerfeErkennung();
            recompute();
            merkeStriche();
        }

        // template LaTeX -> the first probe written for it. Later probes under the
        // same slug may hold anything (probe 26-32: an integral under "linear").
        async function ladeKorpus() {
            if (korpus) return korpus;
            korpus = new Map();
            try {
                const namen = (await (await fetch('/__proben/', { cache: 'no-store' })).json()).proben || [];
                const daten = await Promise.all(namen.map(n =>
                    fetch('morpheus/handschrift-proben/' + n, { cache: 'no-store' }).then(r => r.json()).catch(() => null)));
                daten.forEach(d => {
                    const l = d && d.vorlage && d.vorlage.latex;
                    if (l && d.strokes && d.strokes.length && !korpus.has(l)) korpus.set(l, d);
                });
            } catch (_) {}
            return korpus;
        }

        // A reload (live reload after every edit) brings the strokes back but not
        // the recognition - Doc then saw his handwriting without morph or formula.
        // So the lab remembers that the canvas shows an example and replays it.
        function merkeBeispiel(ja) {
            try { localStorage.setItem('vorrechnen-beispiel', ja ? '1' : '0'); } catch (_) {}
        }

        async function beispiel() {
            const latex = VORLAGEN[vorlageIdx][1];
            const d = (await ladeKorpus()).get(latex);
            clearTimeout(beispielTimer);
            vergissVerlauf();
            verwerfeErkennung();
            strokes.length = 0;
            current = null;
            istBeispiel = !!d;
            merkeBeispiel(!!d);
            if (!d) { recompute(); merkeStriche(); redraw(); zeigeVorlage('keine Probe'); return; }
            // Written on another screen: centred under the head strip, shrunk
            // only if it would not fit - never enlarged, it is Doc's size.
            let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
            d.strokes.forEach(st => st.points.forEach(q => { x0 = Math.min(x0, q.x); y0 = Math.min(y0, q.y); x1 = Math.max(x1, q.x); y1 = Math.max(y1, q.y); }));
            // between the template strip on top and, at the bottom, the recognised
            // formula (84 px) above the film strip (ZEITLEISTE_H)
            // the recognised formula is the same formula, so it is as tall as the
            // template strip
            const rect = container.getBoundingClientRect();
            const kopfEl = document.getElementById('vorlage-schicht');
            const KOPF = Math.max(84, kopfEl ? kopfEl.getBoundingClientRect().height : 84), FUSS = ZEITLEISTE_H + KOPF;
            const w = Math.max(1, x1 - x0), h = Math.max(1, y1 - y0);
            const sk = Math.min(1, (rect.width - 100) / w, (rect.height - KOPF - FUSS - 20) / h);
            const ox = (rect.width - w * sk) / 2, oy = KOPF + (rect.height - KOPF - FUSS - h * sk) / 2;
            d.strokes.forEach(st => strokes.push(Object.assign({}, st, {
                width: (st.width || 3) * sk,
                points: st.points.map(q => Object.assign({}, q, { x: ox + (q.x - x0) * sk, y: oy + (q.y - y0) * sk })),
            })));
            recompute();
            merkeStriche();
            redraw();
            zeigeVorlage();
            const zeilen = analysis.lines.filter(l => !zuKlein(l));
            if (zeilen.length !== 1) return;
            const line = zeilen[0];
            const { atome, svg, satz } = await formelAufZeile(latex, line);
            const { zuordnung, nachjustiert } = ordneZeile(line, atome);
            zeilenErgebnis[line.lineIdx] = { latex, tokens: [], atome, ms: 0, zuordnung, svg, nachjustiert, satz };
            await HandschriftMorph.schriftenBereit(atome);
            await HandschriftMorph.svgVorbereiten(atome);
            morphVorbereitet[line.lineIdx] = bereiteMorph(line, zuordnung, atome);
            zeigeFormeln();
            beispielTimer = setTimeout(() => morphen(1), morphOpts.pause * 1000);
        }

        // Doc: "Show (again)" - back to the handwriting, a moment to see it,
        // then the morph once more. Nothing is recognised or saved again.
        function nochmal() {
            if (!morphVorbereitet.some(Boolean)) { setProbeStatus('Erst ERKENNEN oder BEISPIEL'); return; }
            clearTimeout(beispielTimer);
            setzeMorph(0);
            beispielTimer = setTimeout(() => morphen(1), morphOpts.pause * 1000);
        }

        function setProbeStatus(msg) {
            const el = document.getElementById('probe-status');
            if (el) el.textContent = msg;
        }

        // One probe per ERKENNEN: strokes, the template, what was recognised,
        // and how the pairing went. The server picks the running number.
        async function speichereProbe() {
            // probes are for the templates only - in class (the tasks) nothing
            // is saved, and on docalvers.de nothing may land as a download
            if (istBeispiel || !testModus) return;
            const [slug, vorlage] = VORLAGEN[vorlageIdx];
            const erg = analysis.lines.map(l => zeilenErgebnis[l.lineIdx]).find(e => e && e.latex);
            const probe = {
                version: 2, created: new Date().toISOString(), geraet: navigator.userAgent.includes('Android') ? 'Tablet' : 'Mac',
                canvas: { w: canvas.width, h: canvas.height, dpr: devicePixelRatio },
                vorlage: { idx: vorlageIdx, slug, latex: vorlage },
                latex: erg ? erg.latex : '', tokens: erg ? erg.tokens : [],
                zeichen: erg && erg.atome ? erg.atome.length : 0,
                passt: !!(erg && erg.zuordnung && erg.zuordnung.passt),
                nachjustiert: !!(erg && erg.nachjustiert),
                diagnose: erg && erg.zuordnung ? erg.zuordnung.diagnose : (erg && erg.fehler) || '',
                morph: !!morphVorbereitet.some(Boolean),
                options: opts, strokes,
            };
            const body = JSON.stringify(probe, null, 1);
            if (speichernApi) {
                try {
                    const r = await fetch('/__proben/' + encodeURIComponent(slug), {
                        method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
                    const j = await r.json().catch(() => ({}));
                    if (r.ok && j.name) {
                        setProbeStatus('gespeichert: ' + j.name);
                        korpus = null;          // a new probe is an example right away, not after a reload
                        return;
                    }
                    setProbeStatus('Speichern fehlgeschlagen (' + r.status + ') – Download stattdessen');
                } catch (e) {
                    setProbeStatus('Speichern fehlgeschlagen – Download stattdessen');
                }
            } else {
                setProbeStatus('kein Speicher-Endpunkt – Download stattdessen');
            }
            const blob = new Blob([body], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'probe-' + slug + '-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.json';
            a.click();
            URL.revokeObjectURL(a.href);
        }

        // ── Export / import ─────────────────────────────────────────────────
        // The point of this page: draw once, then replay the strokes as often as
        // needed while tuning, without picking the tablet back up.
        function exportStrokes() {
            const data = {
                version: 1,
                created: new Date().toISOString(),
                canvas: { w: Math.round(container.getBoundingClientRect().width),
                          h: Math.round(container.getBoundingClientRect().height) },
                options: opts,
                strokes,
            };
            const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'striche-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.json';
            a.click();
            URL.revokeObjectURL(a.href);
        }

        function importStrokes(file) {
            const r = new FileReader();
            r.onload = () => {
                try {
                    const d = JSON.parse(r.result);
                    if (!Array.isArray(d.strokes)) throw new Error('keine Striche in der Datei');
                    strokes.length = 0;
                    d.strokes.forEach(s => strokes.push(s));
                    recompute();
                } catch (e) {
                    alert('Konnte die Datei nicht lesen: ' + e.message);
                }
            };
            r.readAsText(file);
        }

        // Anything that was recognised belongs to the strokes as they were. Once
        // the ink changes, that result is stale - so it goes, together with the
        // morph built from it. Otherwise a second example would inherit the
        // first one's glyphs.
        function verwerfeErkennung() {
            erkennenStand++;
            zeilenErgebnis.length = 0;
            morphVorbereitet.length = 0;
            if (morphAnim) { cancelAnimationFrame(morphAnim); morphAnim = null; }
            morphT = 0;
            const r = document.getElementById('morph-regler');
            if (r) r.value = 0;
            const h = document.getElementById('formel-schicht');
            if (h) h.innerHTML = '';
            setErgebnisText('–');
        }

        function clearAll() {
            if (strokes.length || tipp || rechenweg.length) merkeVerlauf();   // C / LEEREN can be undone
            // The working survives a LEEREN of the page (a botched step must not
            // cost the lesson's board); LEEREN on an empty page clears it too.
            if (!strokes.length && !current && !tipp && (rechenweg.length || fluege.length)) {
                flugAbbrechen();
                rechenweg.length = 0;
                merkeRechenweg();
                zeigeRechenweg();
            }
            clearTimeout(beispielTimer);
            clearTimeout(autoTimer);
            istBeispiel = false;
            merkeBeispiel(false);
            strokes.length = 0;
            current = null;
            if (tipp) { clearTimeout(tipp.timer); tipp = null; }
            verwerfeErkennung();
            recompute();
            merkeStriche();
        }

        function undoStroke() {
            strokes.pop();
            verwerfeErkennung();
            recompute();
            merkeStriche();
        }

        // ── Side panel ──────────────────────────────────────────────────────
        function buildPanel() {
            // Three buttons, nothing else (Doc, 25.09.). Everything that was
            // here before - statistics, undo, load, model picker, the morph
            // slider, the display switches and the seven tuning sliders - is
            // kept at the bottom of this function, commented out, because the
            // functions behind them still exist and we will want them back for
            // calibrating.
            CyberUI.createCard('ui-container', '', `
                <div class="gross-row">
                    <!-- Doc, 26.09.: "LEEREN butt weg! links" - the C on the board does it
                    <button class="cyber-btn gross" style="height:6.4rem;min-height:6.4rem;font-size:1.6rem;letter-spacing:0.12em;width:100%;padding:0;line-height:6.4rem" onclick="clearAll()">LEEREN</button> -->
                    <!-- Doc, 25.09.: "nimm den SICHERN unter Kommentar" - ERKENNEN saves every probe anyway
                    <button class="cyber-btn gross" style="height:6.4rem;min-height:6.4rem;font-size:1.6rem;letter-spacing:0.12em;width:100%;padding:0;line-height:6.4rem" onclick="exportStrokes()">SICHERN</button> -->
                    <button id="knopf-erkennen" class="cyber-btn gross" style="height:6.4rem;min-height:6.4rem;font-size:1.6rem;letter-spacing:0.12em;width:100%;padding:0;line-height:6.4rem" onclick="erkennen()">ERKENNEN</button>
                    <!-- Doc, 26.09.: "nimm die beiden vor/zur butts links raus" - the
                         triangles on the board do it now; kept, commented out
                    <div style="display:flex;gap:0.9rem">
                        <button class="cyber-btn gross" style="height:6.4rem;min-height:6.4rem;flex:1;min-width:0;padding:0;display:flex;align-items:center;justify-content:center"
                                onclick="naechsteVorlage(-1)" title="vorige Vorlage" aria-label="vorige Vorlage">
                            <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 4 L6 12 L17 20 Z" fill="currentColor"/></svg>
                        </button>
                        <button class="cyber-btn gross" style="height:6.4rem;min-height:6.4rem;flex:1;min-width:0;padding:0;display:flex;align-items:center;justify-content:center"
                                onclick="naechsteVorlage(1)" title="nächste Vorlage" aria-label="nächste Vorlage">
                            <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4 L18 12 L7 20 Z" fill="currentColor"/></svg>
                        </button>
                    </div>
                    -->
                    <!-- Doc: "mach die NOCHMAL so wie WEITER", then "NOCHMAL -> PLAY", then
                         26.09.: "nimm PLAY butt raus" - it is a triangle under the film strip now
                    <button class="cyber-btn gross" style="height:6.4rem;min-height:6.4rem;font-size:1.6rem;letter-spacing:0.12em;width:100%;padding:0;line-height:6.4rem" onclick="nochmal()">PLAY</button> -->
                </div>
                <!-- Doc 25.09.2026: "BEISPIEL Button raus" - kept, commented out, beispiel() still exists
                <div class="btn-row" style="margin-top:0.8rem">
                    <button class="cyber-btn" style="flex:1" onclick="beispiel()">BEISPIEL</button>
                </div>
                -->
                <!-- Doc: no text under the slider. Still written, just not shown -
                     display:none off again when calibrating. -->
                <div id="probe-status" class="erk-info" style="margin-top:0.6rem;display:none">–</div>
                <div id="erkennung-out" style="margin-top:1rem;display:none"><div class="erk-info">–</div></div>
                <input type="file" id="import-file" accept="application/json" style="display:none"
                       onchange="if(this.files[0]) importStrokes(this.files[0])">
                <select id="modell-wahl" style="display:none">
                    <option value="gemini-2.5-flash">2.5-flash</option>
                </select>
                <input type="range" id="morph-regler" min="0" max="1" step="0.01" value="0"
                       oninput="setzeMorph(this.value)" style="display:none">
            `, '#00d2ff');

            // Doc, 26.09.: "alle Settings (Staub Strich Slider) in eine card, die
            // default geschlossen ... persist", then "mach Einstellungen zu Modus
            // und pack alle Sliders in eine neue card Einstellungen" - the big
            // buttons on top, then "Modus" (the switches), then "Einstellungen"
            // (the sliders), both closed at first and remembered
            CyberUI.createCard('ui-container', 'Modus',
                '<div id="modus-wahl" style="margin-bottom:28px"></div><div id="schalter" style="margin-bottom:28px"></div><div id="morph-steuerung"></div>', '#00d2ff',
                { collapsible: true, collapsed: true, persistKey: 'vorrechnen-einstellungen-zu' });   // the old card's state
            CyberUI.createCard('ui-container', 'Einstellungen', '<div id="regler"></div>', '#00d2ff',
                { collapsible: true, collapsed: true, persistKey: 'vorrechnen-regler-zu' });
            // no "MODUS" over the three choices - the card says it
            CyberUI.createRadioGroup('modus-wahl', '', [
                { value: 'frei', label: 'Frei' }, { value: 'aufgaben', label: 'Aufgaben' },
                { value: 'beispiele', label: 'Beispiele' },          // Doc: "Meine Beispiele -> Beispiele"
            ], modus, v => setzeModus(v));

            // Doc: "speed slider für mich". Letting go replays the morph at the
            // new speed, so the effect can be judged right away.
            CyberUI.createRadioGroup('morph-steuerung', 'Morph (Doppel-Tippen)', [
                { value: 'staub', label: 'Staub' }, { value: 'strich', label: 'Strich' },
            ], morphArt, v => wechsleMorphArt(v));
            document.querySelectorAll('#morph-steuerung .cyber-radio-input').forEach(r => { r.name = 'morph-art'; });

            CyberUI.createSlider('regler', 'Morph-Dauer', 0.1, 1, morphDauer, 0.05, v => {
                morphDauer = v;
                try { localStorage.setItem('vorrechnen-morph-dauer', String(v)); } catch (_) {}
                nachRegler(false);
            }, '#00d2ff', v => v.toFixed(2) + ' s');

            // Doc: "welche Parameter haben wir noch - alle auf Slider bitte"
            // [label, key, min, max, step, format, needs a new preparation] -
            // most important first (Doc: "die wichtigsten als erste")
            [
                ['Wolke: Streuung', 'wolke', 0, 1, 0.05, v => v.toFixed(2), true],
                ['Wolke: Auftrieb', 'auftrieb', 0, 1, 0.05, v => v.toFixed(2), true],
                ['Wirbel', 'wirbel', 0, 0.5, 0.01, v => v.toFixed(2), false],
                ['Körnerdichte', 'dichte', 0.1, 1, 0.05, v => v.toFixed(2), true],
                ['Staubkorn', 'staub', 0.3, 2, 0.1, v => v.toFixed(1) + ' px', false],
                ['Welle links nach rechts', 'staffel', 0, 0.6, 0.05, v => v.toFixed(2), false],
                ['Pause vor dem Morph', 'pause', 0, 2, 0.1, v => v.toFixed(1) + ' s', false],
            ].forEach(([label, key, min, max, step, fmt, neu]) => {
                CyberUI.createSlider('regler', label, min, max, morphOpts[key], step, v => {
                    morphOpts[key] = v;
                    try { localStorage.setItem('vorrechnen-morph', JSON.stringify(morphOpts)); } catch (_) {}
                    nachRegler(neu);
                }, '#00d2ff', fmt);
            });

            // Doc: "nur Stift ganz unter die Slider" - fingers then do not draw;
            // the two-finger swipe still works. Off on a new device: in class
            // Doc writes with his finger.
            // ... and it stays under the sliders when they moved to "Einstellungen"
            const nurStift = CyberUI.createCheckbox('regler', 'Nur Stift', view.penOnly, v => {
                view.penOnly = v;
                try { localStorage.setItem('vorrechnen-nur-stift', v ? '1' : '0'); } catch (_) {}
            });
            nurStift.style.marginTop = '20px';

            /* Doc, 26.09.: "Boxen zeigen weg" - back for calibrating
            CyberUI.createCheckbox('schalter', 'Boxen zeigen', view.boxes, v => {
                view.boxes = view.rows = v;
                try { localStorage.setItem('vorrechnen-boxen', v ? '1' : '0'); } catch (_) {}
                redraw();
            });
            */

            /* Doc, 26.09.: "Handballen -> nur Stift" - the filter is always on now
            CyberUI.createCheckbox('schalter', 'Handballen ignorieren', view.handballen, v => {
                view.handballen = v;
                try { localStorage.setItem('vorrechnen-handballen', v ? '1' : '0'); } catch (_) {}
            });
            */

            // Doc: "Auto reicht" - recognises after 2 s without input
            CyberUI.createCheckbox('schalter', 'Auto', autoErkennen, v => {
                autoErkennen = v;
                try { localStorage.setItem('vorrechnen-auto', v ? '1' : '0'); } catch (_) {}
                if (v) autoBald(); else clearTimeout(autoTimer);
            });

            /* Ausgeblendet auf Docs Wunsch (25.09.) - die Funktionen dahinter
               leben weiter, nur die Bedienelemente sind weg:

            CyberUI.createCard('ui-container', 'Aufnahme', `
                <div id="stat-row"></div>
                <div class="btn-row">
                    <button class="cyber-btn" onclick="undoStroke()">ZURÜCK</button>
                    <button class="cyber-btn" onclick="document.getElementById('import-file').click()">LADEN</button>
                </div>
            `, '#00d2ff');

            CyberUI.createCheckbox('ui-container', 'Nur Stift (Handballen ignorieren)', view.penOnly,
                v => { view.penOnly = v; });
            CyberUI.createCheckbox('ui-container', 'Kästchen zeigen', view.boxes,
                v => { view.boxes = v; redraw(); });
            CyberUI.createCheckbox('ui-container', 'Nummern zeigen', view.numbers,
                v => { view.numbers = v; redraw(); });
            CyberUI.createCheckbox('ui-container', 'Zeilen zeigen', view.rows,
                v => { view.rows = v; redraw(); });

            const sl = (label, key, min, max, step) =>
                CyberUI.createSlider('ui-container', label, min, max, opts[key], step,
                    v => { opts[key] = parseFloat(v); recompute(); }, 'rgb(245,194,66)');
            sl('Zeilenabstand', 'lineGapFactor', 0.4, 2.5, 0.05);
            sl('Überlappung seitlich', 'xOverlapRatio', 0.1, 0.95, 0.05);
            sl('Nachbarschaft seitlich', 'xGapFactor', 0.05, 0.8, 0.01);
            sl('Nur-Nähe: Zeitfenster (ms)', 'nearOnlyMs', 60, 800, 10);
            sl('Gleiches Zeichen: Zeitfenster (ms)', 'sameSymbolMs', 200, 2500, 50);
            sl('Später gesetzt: Überlappung', 'lateJoinRatio', 0.3, 1.0, 0.05);
            sl('Zeilentrennung senkrecht', 'yGapFactor', 0.3, 2.0, 0.05);
            */
        }

        // ── Boot ────────────────────────────────────────────────────────────
        // The drawing surface must match its box exactly, or the ink lands beside
        // the pen: the browser stretches the canvas to its CSS size, so a stale
        // pixel size shows up as a horizontal offset that grows to the right.
        // Measured on the tablet: 1287 px wide inside a 993 px box at dpr 1.5 -
        // 1.296 instead of 1.5.
        let letzteGroesse = '';
        function resizeCanvasToContainer() {
            if (anzeigeModus) return false;
            const dpr = window.devicePixelRatio || 1;
            const rect = container.getBoundingClientRect();
            const w = Math.max(1, Math.round(rect.width)), h = Math.max(1, Math.round(rect.height));
            const key = w + 'x' + h + '@' + dpr;
            if (key === letzteGroesse) return false;
            letzteGroesse = key;
            canvas.width = Math.round(w * dpr);
            canvas.height = Math.round(h * dpr);
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
            return true;
        }

        function init() {
            resizeCanvasToContainer();
            zeigePapier();
            zeigeTafelPfeile();                // halfway down the squares
            zeigeRechenweg();                  // the "=" column follows the board's width
            redraw();
            updateStats();
        }

        // The sidebar changes width when cards are added or it is collapsed, and
        // window.resize says nothing about that. Watch the box itself.
        if (typeof ResizeObserver === 'function') {
            new ResizeObserver(() => {
                if (resizeCanvasToContainer()) { zeigePapier(); zeigeTafelPfeile(); zeigeRechenweg(); redraw(); zeigeFormeln(); }
            }).observe(container);
        }

        window.addEventListener('resize', init);
        // The worker makes Chrome offer a real install (sw-vorrechnen.js says why).
        // Its scope is this page alone. Not under file://, where there is none.
        if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw-vorrechnen.js', { scope: 'vorrechnen.html' })
                    .catch(() => { /* no app then - the page itself is unaffected */ });
            });
        }

        document.fonts.ready.then(() => {
            buildPanel(); holeStriche(); recompute(); init(); zeigeVorlage();
            let warBeispiel = false;
            try { warBeispiel = localStorage.getItem('vorrechnen-beispiel') === '1'; } catch (_) {}
            if (testModus && (!strokes.length || warBeispiel)) beispiel();
            else if (!testModus && warBeispiel) {
                // an example never belongs on the board outside "Meine Beispiele"
                strokes.length = 0;
                istBeispiel = false;
                merkeBeispiel(false);
                verwerfeErkennung();
                recompute();
                merkeStriche();
            }
            fetch('/__proben/', { cache: 'no-store' }).then(r => { speichernApi = r.ok; })
                .catch(() => { speichernApi = false; })
                .then(() => setProbeStatus(speichernApi ? 'Speichern auf dem Mac bereit' : 'kein Speicher-Endpunkt – Proben als Download'));
        });
    </script>
