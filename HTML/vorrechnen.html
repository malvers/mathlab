<!DOCTYPE html>
<!--
  Vorrechnen: write a calculation by hand, line by line, and watch the strokes be
  grouped into symbols and rows.

  This is the missing first half of the vision in /IDEAS.md ("Nutzer schreibt
  handschriftlich Formeln, die sich kaum merkbar in LaTeX morphen"). morpheus/
  already has the morph; what never worked was knowing which stroke belongs to
  which LaTeX glyph, because morpheus rasterises the drawing and tries to recover
  the reading order from the geometry.

  Here the pen keeps what it knows: every stroke carries its position AND its
  time, and the grouping in js/stroke-symbols.js reads the order straight off it.
  No API call is involved on this page - the grouping is geometry plus the clock,
  so it can be judged, tuned and tested without a key.

  The sliders exist because the thresholds must be calibrated against real
  handwriting, not against what looks plausible in a test. Draw, watch the boxes,
  turn the knobs until they sit, then EXPORT - the saved strokes can be replayed
  offline as often as needed.
-->
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOC ALVERS MATHE-LABORE | Vorrechnen</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="resources/favicon.svg">
    <link rel="icon" type="image/png" sizes="256x256" href="resources/favicon.png">
    <link rel="stylesheet" href="js/cyber-layout.css">
    <link rel="stylesheet" href="js/buttons-ultra.css">
    <link rel="stylesheet" href="js/cyber-lab-overrides.css">
    <link rel="stylesheet" href="js/branding.styles.extracted.css">
    <link rel="stylesheet" href="js/lab-shell-minimal.css">
    <link rel="stylesheet" href="morpheus/vendor/katex/katex.min.css">
    <style>
        /* The pen must own the surface: without this the tablet scrolls instead
           of drawing, and a resting palm pans the page. */
        #canvas {
            touch-action: none;
            cursor: crosshair;
        }

        #stat-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem 1.5rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.06em;
        }

        #stat-row .stat b {
            display: block;
            font-size: 1.45rem;
            line-height: 1.1;
            color: var(--neon-blue, #00d2ff);
        }

        #stat-row .stat span {
            opacity: 0.65;
            font-weight: 400;
        }

        #pen-hint {
            margin-top: 0.6rem;
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            opacity: 0.75;
            line-height: 1.45;
        }

        .gross-row {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
        }

        /* Doc: "die Taste richtig groß" - hit with a finger while the other
           hand holds the pen. buttons-ultra.css sets a central height for lab
           buttons, so this needs the extra weight to win; a deliberate local
           exception, like Cavalieri's. */
        #ui-container .cyber-btn.gross {
            font-size: 1.5rem !important;
            letter-spacing: 0.12em;
            padding: 1.6rem 1rem !important;
            height: auto !important;
            min-height: 5.5rem !important;
            line-height: 1.1;
            width: 100%;
        }

        .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.6rem;
        }

        .erk-zeile {
            margin-bottom: 0.7rem;
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
        }

        .erk-zeile b {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            opacity: 0.7;
        }

        .erk-latex {
            font-family: 'Outfit', monospace;
            font-size: 1rem;
            color: var(--neon-blue, #00d2ff);
            word-break: break-all;
            margin: 0.15rem 0;
        }

        .erk-ok { color: rgb(121, 158, 49); }
        .erk-warn { color: rgb(245, 194, 66); }
        .erk-fehler { color: rgb(176, 36, 24); }
        .erk-info { opacity: 0.6; font-size: 0.8rem; }
    </style>
</head>

<body>
    <nav id="mini-rail">
        <div class="nav-btn" onclick="toggleSidebar()" title="Menü">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </div>
    </nav>

    <aside id="side-panel">
        <header id="sidebar-header"></header>
        <div id="ui-container"></div>
    </aside>

    <main id="main-content">
        <div id="canvas-container">
            <div id="math-coach-box">
                <div class="coach-title" id="coach-title-slot"></div>
                <div id="coach-content" class="coach-message"></div>
            </div>
            <canvas id="canvas"></canvas>
        </div>
    </main>

    <script src="js/cyber-left-chrome.js"></script>
    <script src="js/branding/briefings.js"></script>
    <script src="js/branding/overlays.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/branding/nav.js"></script>
    <script src="js/branding.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/stroke-symbols.js"></script>
    <script src="morpheus/vendor/katex/katex.min.js"></script>
    <!-- Morph building blocks from morpheus: contour tracing and polygon helpers. -->
    <script src="morpheus/geometry.js"></script>
    <script src="morpheus/contours.js"></script>
    <script src="js/katex-atome.js"></script>
    <script src="js/formel-erkennen.js"></script>
    <script src="js/handschrift-morph.js"></script>
    <script src="js/staub-morph.js"></script>
    <script>
        function toggleSidebar() {
            const panel = document.getElementById('side-panel');
            panel.classList.toggle('collapsed');
            if (window.CyberLeftChrome && typeof CyberLeftChrome.publishResolvedScale === 'function') {
                CyberLeftChrome.publishResolvedScale();
            }
            setTimeout(() => {
                window.dispatchEvent(new Event('resize'));
                if (typeof init === 'function') init();
                if (window.CyberLeftChrome && typeof CyberLeftChrome.publishResolvedScale === 'function') {
                    CyberLeftChrome.publishResolvedScale();
                }
            }, 400);
        }

        CyberBranding.init({ useExternalStyles: true, title: 'Vorrechnen', subtitle: 'Lab' });
        CyberUI.init();

        if (window.CyberLeftChrome && typeof CyberLeftChrome.configure === 'function') {
            CyberLeftChrome.configure({ viewportOnlyZoom: true });
        }

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');

        // ── State ───────────────────────────────────────────────────────────
        // A stroke is { points: [{x, y, t}], width }. The time is what morpheus
        // never kept, and it is the only thing that separates two glyphs written
        // close together from one glyph drawn in two parts.
        const strokes = [];
        let current = null;
        let analysis = { symbols: [], lines: [] };

        const opts = Object.assign({}, StrokeSymbols.DEFAULTS);
        // Recognition result per row: { latex, tokens, zuordnung, fehler }
        const zeilenErgebnis = [];
        let erkennenLaeuft = false;
        // Morph state: 0 = pure handwriting, 1 = fully typeset. Per row, the
        // prepared point pairs; morphT is shared so a row moves as a whole.
        const morphVorbereitet = [];
        let morphT = 0;
        let morphAnim = null;
        const view = { boxes: true, numbers: true, rows: true, penOnly: false };

        // The corpus, easy to hard. Doc copies each one by hand, ERKENNEN saves
        // the probe, and the grouping is then tuned against all of them. Roots
        // and tall brackets come late on purpose - KaTeX draws those as SVG, so
        // they show where the morph still stops.
        const VORLAGEN = [
            ['linear',        '2x+3=11'],
            ['gerade',        'y=mx+b'],
            ['quadrat',       'x^2-4=0'],
            ['pythagoras',    'a^2+b^2=c^2'],
            ['binom',         '(a+b)^2=a^2+2ab+b^2'],
            ['funktion',      'f(x)=x^3-2x'],
            ['brueche',       '\\frac{1}{2}+\\frac{1}{3}=\\frac{5}{6}'],
            ['log',           '\\log_2 8=3'],
            ['ableitung',     "f'(x)=2x"],
            ['euler',         'e^{i\\pi}+1=0'],
            ['trig',          '\\sin^2\\alpha+\\cos^2\\alpha=1'],
            ['wahrsch',       'P(A\\cap B)=P(A)\\cdot P(B)'],
            ['summe',         '\\sum_{k=1}^{n}k=\\frac{n(n+1)}{2}'],
            ['limes',         '\\lim_{x\\to\\infty}\\frac{1}{x}=0'],
            ['ableitung2',    '\\frac{d}{dx}\\sin x=\\cos x'],
            ['integral',      '\\int_0^1 x^2\\,dx=\\frac{1}{3}'],
            ['vektor',        '\\vec{a}\\cdot\\vec{b}=|a||b|\\cos\\varphi'],
            ['wurzel',        '\\sqrt{16}=4'],
            ['pq',            'x=\\frac{-b\\pm\\sqrt{b^2-4ac}}{2a}'],
            ['reihe',         '\\sum_{i=1}^{\\infty}\\frac{1}{2^i}=1'],
        ];
        let vorlageIdx = 0;
        try { vorlageIdx = Math.min(VORLAGEN.length - 1, parseInt(localStorage.getItem('vorrechnen-vorlage') || '0', 10) || 0); } catch (_) {}
        // Does the server take probes? Checked once at load; otherwise the probe
        // is offered as a download, the way SICHERN does it.
        let speichernApi = false;

        const INK = '#adff2f';                       // same green as morpheus
        // Symbol colours: Doc's palette first, then neon blue, cycling. Red-free
        // on purpose so it never reads as an error marker.
        const SYM_COLORS = ['#00d2ff', 'rgb(245,194,66)', 'rgb(121,158,49)', '#c77dff', '#ff9e64'];

        // ── Drawing ─────────────────────────────────────────────────────────
        function canvasPos(ev) {
            const rect = canvas.getBoundingClientRect();
            return { x: ev.clientX - rect.left, y: ev.clientY - rect.top, t: performance.now() };
        }

        function penAccepted(ev) {
            // Palm rejection: with "nur Stift" on, only the pen draws, so a hand
            // resting on the tablet leaves no marks.
            if (!view.penOnly) return true;
            return ev.pointerType === 'pen';
        }

        canvas.addEventListener('pointerdown', ev => {
            if (!penAccepted(ev)) return;
            // Capture keeps the stroke alive when the pen leaves the canvas mid
            // draw. If it is refused, carry on regardless - losing the capture is
            // a nuisance, losing the stroke is not acceptable.
            try { canvas.setPointerCapture(ev.pointerId); } catch (_) {}
            const p = canvasPos(ev);
            // Pressure widens the line a little where the tablet reports it.
            const w = 2.5 + (ev.pressure > 0 ? ev.pressure * 2.5 : 1.2);
            current = { points: [p], width: w, pointerType: ev.pointerType };
            ev.preventDefault();
        });

        // A pen samples far faster than the browser fires pointermove - the rest
        // arrives bundled in getCoalescedEvents(). Without them a 260 px stroke
        // ends up with 15 points and every curve turns into a chain of straight
        // bits, which is exactly what "ich kann nicht richtig schreiben" feels
        // like. Redrawing is throttled to one frame: doing it per event made the
        // tablet drop the events we are trying to collect.
        let zeichenFrame = null;
        function redrawBald() {
            if (zeichenFrame) return;
            zeichenFrame = requestAnimationFrame(() => { zeichenFrame = null; redraw(); });
        }

        canvas.addEventListener('pointermove', ev => {
            if (!current || !penAccepted(ev)) return;
            const roh = (typeof ev.getCoalescedEvents === 'function') ? ev.getCoalescedEvents() : null;
            if (roh && roh.length) roh.forEach(e => current.points.push(canvasPos(e)));
            else current.points.push(canvasPos(ev));
            redrawBald();
            ev.preventDefault();
        });

        function endStroke(ev) {
            if (!current) return;
            const neu = current.points.length > 1;
            if (neu) strokes.push(current);
            current = null;
            if (neu && zeilenErgebnis.length) verwerfeErkennung();
            recompute();
            merkeStriche();
        }

        // Live-reload kept wiping Doc's strokes mid-session. They now survive a
        // reload in localStorage; LEEREN clears them for good.
        function merkeStriche() {
            try { localStorage.setItem('vorrechnen-striche', JSON.stringify(strokes)); } catch (_) {}
        }
        function holeStriche() {
            try {
                const d = JSON.parse(localStorage.getItem('vorrechnen-striche') || '[]');
                if (Array.isArray(d) && d.length) { strokes.length = 0; d.forEach(s => strokes.push(s)); }
            } catch (_) {}
        }
        canvas.addEventListener('pointerup', endStroke);
        canvas.addEventListener('pointercancel', endStroke);
        canvas.addEventListener('pointerleave', endStroke);

        function recompute() {
            analysis = StrokeSymbols.analyse(strokes, opts);
            redraw();
            updateStats();
        }

        // ── Rendering ───────────────────────────────────────────────────────
        function strokePath(s) {
            if (s.points.length < 2) return;
            ctx.beginPath();
            ctx.moveTo(s.points[0].x, s.points[0].y);
            for (let i = 1; i < s.points.length; i++) ctx.lineTo(s.points[i].x, s.points[i].y);
            ctx.lineWidth = s.width;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
        }

        function redraw() {
            const rect = container.getBoundingClientRect();
            ctx.clearRect(0, 0, rect.width, rect.height);

            // Row bands first, so they sit behind everything.
            if (view.rows) {
                analysis.lines.forEach(l => {
                    if (!l.bbox) return;
                    ctx.fillStyle = 'rgba(0, 210, 255, 0.055)';
                    ctx.fillRect(0, l.bbox.y - 8, rect.width, l.bbox.h + 16);
                });
            }

            // Strokes that belong to a morphing row are drawn by the morph
            // itself - otherwise the original ink would still sit underneath and
            // the whole thing would look like a cross-fade, which is exactly what
            // Doc does not want.
            const imMorph = new Set();
            if (morphT > 0) {
                analysis.lines.forEach(l => {
                    if (morphVorbereitet[l.lineIdx])
                        l.symbols.forEach(sy => sy.strokeIdxs.forEach(i => imMorph.add(i)));
                });
            }
            ctx.strokeStyle = INK;
            strokes.forEach((s, i) => { if (!imMorph.has(i)) strokePath(s); });
            if (current) strokePath(current);

            if (morphT > 0) {
                analysis.lines.forEach(l => {
                    const v = morphVorbereitet[l.lineIdx];
                    if (v) StaubMorph.zeichnen(ctx, v, morphT, { farbe: INK, staffel: 0 });
                });
            }

            if (view.boxes && morphT === 0) {
                analysis.lines.forEach(line => {
                    line.symbols.forEach((sym, i) => {
                        const c = SYM_COLORS[i % SYM_COLORS.length];
                        const b = sym.bbox;
                        ctx.strokeStyle = c;
                        ctx.lineWidth = 1.5;
                        ctx.setLineDash([4, 3]);
                        ctx.strokeRect(b.x - 4, b.y - 4, b.w + 8, b.h + 8);
                        ctx.setLineDash([]);
                        // Doc: "keine Boxbeschriftung" - numbers and stroke
                        // counts were for calibrating, they only clutter now.
                        if (false && view.numbers) {
                            ctx.fillStyle = c;
                            ctx.font = '600 12px Orbitron, sans-serif';
                            ctx.fillText(String(sym.readIdx), b.x - 4, b.y - 9);
                            // Stroke count, so a glyph that fell apart is obvious.
                            ctx.font = '400 10px Outfit, sans-serif';
                            ctx.globalAlpha = 0.65;
                            ctx.fillText(sym.strokeIdxs.length + '×', b.x + b.w - 4, b.y - 9);
                            ctx.globalAlpha = 1;
                        }
                    });
                });
            }

            // Doc: "NUR die LaTeX Formel" - the per-glyph transcription on the
            // canvas is gone; the typeset formula under the row (KaTeX, see
            // zeigeFormeln) says the same thing and says it properly.
        }

        function updateStats() {
            const el = document.getElementById('stat-row');
            if (!el) return;
            const perLine = analysis.lines.map(l => l.symbols.length).join(' · ') || '–';
            el.innerHTML =
                `<div class="stat"><b>${strokes.length}</b><span>Striche</span></div>` +
                `<div class="stat"><b>${analysis.symbols.length}</b><span>Symbole</span></div>` +
                `<div class="stat"><b>${analysis.lines.length}</b><span>Zeilen</span></div>` +
                `<div class="stat"><b>${perLine}</b><span>je Zeile</span></div>`;
        }

        // ── Recognition ─────────────────────────────────────────────────────
        // One call per row. Gemini says WHAT is written; WHERE comes from the
        // strokes. Both lists are in reading order, so laying them onto each
        // other needs no coordinates from the model - which is good, because its
        // coordinates were never trustworthy.
        // Hidden host where KaTeX sets the formula for measuring. visibility:hidden,
        // not display:none - the boxes must exist.
        function messHost() {
            let h = document.getElementById('mess-host');
            if (!h) {
                h = document.createElement('div');
                h.id = 'mess-host';
                h.style.cssText = 'position:absolute;left:-10000px;top:0;visibility:hidden;white-space:nowrap;pointer-events:none';
                document.body.appendChild(h);
            }
            return h;
        }

        // A row that is only a speck (a slip of the pen) is not a formula.
        function zuKlein(line) {
            return !line.bbox || Math.max(line.bbox.w, line.bbox.h) < 16;
        }

        // KaTeX sets the formula; the atoms say where every glyph sits. Then the
        // whole block is scaled and moved onto the handwriting: same height as
        // the row, left edge aligned, centred vertically - Doc's "gleiche Größe".
        async function formelAufZeile(latex, line) {
            const m = await KatexAtome.atomeAusLatex(latex, messHost(), { fontSize: 100 });
            const u = KatexAtome.umfang(m.atome);
            let atome = m.atome;
            if (u && u.h > 0 && u.w > 0) {
                // "Gleiche Größe" means: the typeset block fits the footprint of
                // the handwriting - height AND width - and never leaves the
                // canvas. Height alone sent a tall integral's fraction off the
                // right edge.
                const breite = container.getBoundingClientRect().width;
                const skala = Math.min(line.bbox.h / u.h, line.bbox.w / u.w,
                                       Math.max(40, breite - line.bbox.x - 24) / u.w);
                const dx = line.bbox.x - u.x * skala;
                const dy = (line.bbox.y + line.bbox.h / 2) - (u.y + u.h / 2) * skala;
                atome = KatexAtome.transformiere(m.atome, skala, dx, dy);
            }
            return { atome, svg: m.svg };
        }

        async function erkennen() {
            if (erkennenLaeuft) return;
            if (!analysis.lines.length) { setErgebnisText('Erst etwas schreiben.'); return; }
            erkennenLaeuft = true;
            setErgebnisText('Erkenne …');
            const modelEl = document.getElementById('modell-wahl');
            const model = modelEl ? modelEl.value : 'gemini-2.5-flash';
            try {
                for (const line of analysis.lines) {
                    if (zuKlein(line)) { zeilenErgebnis[line.lineIdx] = { uebersprungen: true }; continue; }
                    const idxs = line.symbols.flatMap(sy => sy.strokeIdxs);
                    const r = await FormelErkennen.erkenneZeile(strokes, idxs, { model });
                    if (!r.ok) {
                        zeilenErgebnis[line.lineIdx] = { fehler: r.error };
                    } else if (!r.latex || /^\(?\s*(empty|leer)\s*\)?$/i.test(r.latex)) {
                        zeilenErgebnis[line.lineIdx] = { fehler: 'nichts erkannt' };
                    } else {
                        const { atome, svg } = await formelAufZeile(r.latex, line);
                        let zuordnung = FormelErkennen.ordneZu(line.symbols, atome);
                        let nachjustiert = false;
                        if (!zuordnung.passt) {
                            // The typesetter knows the glyph count; the grouping
                            // gives way - fused symbols are split at their widest
                            // gap, fragments merged - and reading order is redone.
                            const neu = StrokeSymbols.nachjustieren(line, strokes, atome.length, opts);
                            if (neu.length === atome.length) {
                                line.symbols = neu;
                                zuordnung = FormelErkennen.ordneZu(neu, atome);
                                nachjustiert = true;
                            }
                        }
                        zeilenErgebnis[line.lineIdx] = {
                            latex: r.latex, tokens: r.tokens, atome, ms: r.ms, zuordnung, svg, nachjustiert,
                        };
                        // Doc's plan B: the row crumbles to one dust cloud and
                        // settles into the formula (js/staub-morph.js). It needs
                        // the typeset atoms only, not the grouping - so it runs
                        // even when the mapping does not hold. Radicals and
                        // vector arrows are SVG in KaTeX - they are traced first.
                        try {
                            await HandschriftMorph.schriftenBereit(atome);
                            await HandschriftMorph.svgVorbereiten(atome);
                            morphVorbereitet[line.lineIdx] = StaubMorph.vorbereiten(line, strokes, atome);
                        } catch (e) {
                            morphVorbereitet[line.lineIdx] = null;
                        }
                    }
                    redraw();
                    setErgebnisText(null);
                    zeigeFormeln();
                }
            } finally {
                erkennenLaeuft = false;
            }
            // Straight into the morph - with the button gone there is nothing
            // left to press, and Doc wanted it to happen by itself anyway.
            if (morphVorbereitet.some(Boolean)) morphen(1);
            // Every ERKENNEN is a probe for the corpus, good or bad.
            if (strokes.length) speichereProbe();
        }

        // The typeset formula under the handwriting - real LaTeX, set by KaTeX.
        function zeigeFormeln() {
            let host = document.getElementById('formel-schicht');
            if (!host) {
                host = document.createElement('div');
                host.id = 'formel-schicht';
                host.style.cssText = 'position:absolute;inset:0;pointer-events:none';
                container.appendChild(host);
            }
            host.innerHTML = '';
            analysis.lines.forEach(line => {
                const erg = zeilenErgebnis[line.lineIdx];
                if (!erg || !erg.latex || !line.bbox) return;
                const d = document.createElement('div');
                d.style.cssText = `position:absolute;left:${line.bbox.x}px;` +
                    `top:${line.bbox.y + line.bbox.h + 74}px;color:#00d2ff;font-size:2rem`;
                try { katex.render(erg.latex, d, { throwOnError: false, displayMode: false }); }
                catch (e) { d.textContent = erg.latex; }
                host.appendChild(d);
            });
        }

        // ── Morph ───────────────────────────────────────────────────────────
        // Doc: "meine in LT faden (morph nicht transp)" - the ink turns into
        // the formula, it does not fade. How long it takes is Doc's to set
        // (slider "Morph-Dauer", remembered on the device).
        let morphDauer = 1.6;                        // seconds
        try { const v = parseFloat(localStorage.getItem('vorrechnen-morph-dauer')); if (v > 0) morphDauer = v; } catch (_) {}
        function morphen(ziel) {
            if (morphAnim) cancelAnimationFrame(morphAnim);
            const von = morphT, nach = (ziel === undefined) ? (morphT > 0.5 ? 0 : 1) : ziel;
            const dauer = morphDauer * 1000;
            const t0 = performance.now();
            const schritt = () => {
                const f = Math.min(1, (performance.now() - t0) / dauer);
                morphT = von + (nach - von) * f;
                redraw();
                const sl = document.getElementById('morph-regler');
                if (sl) sl.value = morphT;
                if (f < 1) morphAnim = requestAnimationFrame(schritt);
                else { morphAnim = null; morphT = nach; redraw(); }
            };
            schritt();
        }

        function setzeMorph(v) {
            if (morphAnim) { cancelAnimationFrame(morphAnim); morphAnim = null; }
            morphT = parseFloat(v);
            redraw();
        }

        function setErgebnisText(msg) {
            const el = document.getElementById('erkennung-out');
            if (!el) return;
            if (msg) { el.innerHTML = '<div class="erk-info">' + msg + '</div>'; return; }
            const teile = analysis.lines.map(l => {
                const e = zeilenErgebnis[l.lineIdx];
                if (!e) return '';
                if (e.fehler) return `<div class="erk-zeile"><b>Zeile ${l.lineIdx}</b>
                    <div class="erk-fehler">${e.fehler}</div></div>`;
                if (e.uebersprungen) return '';
                const z = e.zuordnung;
                const hinweis = '';
                return `<div class="erk-zeile"><b>Zeile ${l.lineIdx}</b>
                    <div class="erk-latex">${e.latex.replace(/</g, '&lt;')}</div>
                    <div class="${z.passt ? 'erk-ok' : 'erk-warn'}">${z.diagnose}${e.nachjustiert ? ' – Gruppierung an die Zeichenzahl angeglichen' : ''}</div>${hinweis}
                    <div class="erk-info">${e.atome.length} Zeichen gesetzt · ${e.ms} ms</div></div>`;
            });
            el.innerHTML = teile.join('') || '<div class="erk-info">–</div>';
        }

        // ── Vorlage: the formula to copy, shown above the writing area ──────
        function zeigeVorlage() {
            let host = document.getElementById('vorlage-schicht');
            if (!host) {
                host = document.createElement('div');
                host.id = 'vorlage-schicht';
                host.style.cssText = 'position:absolute;left:24px;top:14px;right:24px;pointer-events:none;' +
                    'display:flex;align-items:baseline;gap:1.2rem;color:#00d2ff';
                container.appendChild(host);
            }
            const [slug, latex] = VORLAGEN[vorlageIdx];
            host.innerHTML = `<span style="font-family:Orbitron,sans-serif;font-size:0.8rem;letter-spacing:0.1em;opacity:0.7">` +
                `VORLAGE ${vorlageIdx + 1} / ${VORLAGEN.length}</span><span id="vorlage-formel" style="font-size:2.4rem"></span>`;
            try { katex.render(latex, document.getElementById('vorlage-formel'), { throwOnError: false }); }
            catch (e) { document.getElementById('vorlage-formel').textContent = latex; }
        }

        function naechsteVorlage() {
            vorlageIdx = (vorlageIdx + 1) % VORLAGEN.length;
            try { localStorage.setItem('vorrechnen-vorlage', String(vorlageIdx)); } catch (_) {}
            clearAll();
            zeigeVorlage();
            setProbeStatus('–');
        }

        // ── Examples ────────────────────────────────────────────────────────
        // Doc: "kannst du mir da Beispiele von mir geben?" - his own corpus,
        // replayed: the strokes as he wrote them, the formula from the template
        // (no API call), a moment to see the ink, then the morph. An example is
        // never saved as a probe, not even by a later ERKENNEN.
        let beispiele = null, beispielIdx = -1, beispielTimer = null, istBeispiel = false;
        async function beispiel() {
            if (!beispiele) {
                try { beispiele = (await (await fetch('/__proben/', { cache: 'no-store' })).json()).proben || []; }
                catch (_) { beispiele = []; }
            }
            if (!beispiele.length) { setProbeStatus('keine Beispiele gefunden'); return; }
            beispielIdx = (beispielIdx + 1) % beispiele.length;
            const name = beispiele[beispielIdx];
            let d;
            try { d = await (await fetch('morpheus/handschrift-proben/' + name, { cache: 'no-store' })).json(); }
            catch (_) { setProbeStatus('Beispiel nicht lesbar: ' + name); return; }
            const latex = (d.vorlage && d.vorlage.latex) || d.latex;
            clearTimeout(beispielTimer);
            verwerfeErkennung();
            strokes.length = 0;
            current = null;
            // Written on another screen: moved to the top left, shrunk only if
            // it would not fit - never enlarged, it is Doc's size.
            let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
            d.strokes.forEach(st => st.points.forEach(q => { x0 = Math.min(x0, q.x); y0 = Math.min(y0, q.y); x1 = Math.max(x1, q.x); y1 = Math.max(y1, q.y); }));
            const rect = container.getBoundingClientRect();
            const sk = Math.min(1, (rect.width - 100) / Math.max(1, x1 - x0), (rect.height - 260) / Math.max(1, y1 - y0));
            d.strokes.forEach(st => strokes.push(Object.assign({}, st, {
                width: (st.width || 3) * sk,
                points: st.points.map(q => Object.assign({}, q, { x: 50 + (q.x - x0) * sk, y: 140 + (q.y - y0) * sk })),
            })));
            istBeispiel = true;
            recompute();
            merkeStriche();
            redraw();
            setProbeStatus(`Beispiel ${beispielIdx + 1} / ${beispiele.length}: ${(d.vorlage && d.vorlage.slug) || name.replace(/^probe-\d+-|\.json$/g, '')}`);
            const zeilen = analysis.lines.filter(l => !zuKlein(l));
            if (zeilen.length !== 1 || !latex) return;
            const line = zeilen[0];
            const { atome, svg } = await formelAufZeile(latex, line);
            zeilenErgebnis[line.lineIdx] = { latex, tokens: [], atome, ms: 0, zuordnung: FormelErkennen.ordneZu(line.symbols, atome), svg };
            await HandschriftMorph.schriftenBereit(atome);
            await HandschriftMorph.svgVorbereiten(atome);
            morphVorbereitet[line.lineIdx] = StaubMorph.vorbereiten(line, strokes, atome);
            zeigeFormeln();
            beispielTimer = setTimeout(() => morphen(1), 900);
        }

        // Doc: "Show (again)" - back to the handwriting, a moment to see it,
        // then the morph once more. Nothing is recognised or saved again.
        function nochmal() {
            if (!morphVorbereitet.some(Boolean)) { setProbeStatus('Erst ERKENNEN oder BEISPIEL'); return; }
            clearTimeout(beispielTimer);
            setzeMorph(0);
            beispielTimer = setTimeout(() => morphen(1), 600);
        }

        function setProbeStatus(msg) {
            const el = document.getElementById('probe-status');
            if (el) el.textContent = msg;
        }

        // One probe per ERKENNEN: strokes, the template, what was recognised,
        // and how the pairing went. The server picks the running number.
        async function speichereProbe() {
            if (istBeispiel) return;
            const [slug, vorlage] = VORLAGEN[vorlageIdx];
            const erg = analysis.lines.map(l => zeilenErgebnis[l.lineIdx]).find(e => e && e.latex);
            const probe = {
                version: 2, created: new Date().toISOString(), geraet: navigator.userAgent.includes('Android') ? 'Tablet' : 'Mac',
                canvas: { w: canvas.width, h: canvas.height, dpr: devicePixelRatio },
                vorlage: { idx: vorlageIdx, slug, latex: vorlage },
                latex: erg ? erg.latex : '', tokens: erg ? erg.tokens : [],
                zeichen: erg && erg.atome ? erg.atome.length : 0,
                passt: !!(erg && erg.zuordnung && erg.zuordnung.passt),
                nachjustiert: !!(erg && erg.nachjustiert),
                diagnose: erg && erg.zuordnung ? erg.zuordnung.diagnose : (erg && erg.fehler) || '',
                morph: !!morphVorbereitet.some(Boolean),
                options: opts, strokes,
            };
            const body = JSON.stringify(probe, null, 1);
            if (speichernApi) {
                try {
                    const r = await fetch('/__proben/' + encodeURIComponent(slug), {
                        method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
                    const j = await r.json().catch(() => ({}));
                    if (r.ok && j.name) { setProbeStatus('gespeichert: ' + j.name); return; }
                    setProbeStatus('Speichern fehlgeschlagen (' + r.status + ') – Download stattdessen');
                } catch (e) {
                    setProbeStatus('Speichern fehlgeschlagen – Download stattdessen');
                }
            } else {
                setProbeStatus('kein Speicher-Endpunkt – Download stattdessen');
            }
            const blob = new Blob([body], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'probe-' + slug + '-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.json';
            a.click();
            URL.revokeObjectURL(a.href);
        }

        // ── Export / import ─────────────────────────────────────────────────
        // The point of this page: draw once, then replay the strokes as often as
        // needed while tuning, without picking the tablet back up.
        function exportStrokes() {
            const data = {
                version: 1,
                created: new Date().toISOString(),
                canvas: { w: Math.round(container.getBoundingClientRect().width),
                          h: Math.round(container.getBoundingClientRect().height) },
                options: opts,
                strokes,
            };
            const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'striche-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.json';
            a.click();
            URL.revokeObjectURL(a.href);
        }

        function importStrokes(file) {
            const r = new FileReader();
            r.onload = () => {
                try {
                    const d = JSON.parse(r.result);
                    if (!Array.isArray(d.strokes)) throw new Error('keine Striche in der Datei');
                    strokes.length = 0;
                    d.strokes.forEach(s => strokes.push(s));
                    recompute();
                } catch (e) {
                    alert('Konnte die Datei nicht lesen: ' + e.message);
                }
            };
            r.readAsText(file);
        }

        // Anything that was recognised belongs to the strokes as they were. Once
        // the ink changes, that result is stale - so it goes, together with the
        // morph built from it. Otherwise a second example would inherit the
        // first one's glyphs.
        function verwerfeErkennung() {
            zeilenErgebnis.length = 0;
            morphVorbereitet.length = 0;
            if (morphAnim) { cancelAnimationFrame(morphAnim); morphAnim = null; }
            morphT = 0;
            const r = document.getElementById('morph-regler');
            if (r) r.value = 0;
            const h = document.getElementById('formel-schicht');
            if (h) h.innerHTML = '';
            setErgebnisText('–');
        }

        function clearAll() {
            clearTimeout(beispielTimer);
            istBeispiel = false;
            strokes.length = 0;
            current = null;
            verwerfeErkennung();
            recompute();
            merkeStriche();
        }

        function undoStroke() {
            strokes.pop();
            verwerfeErkennung();
            recompute();
            merkeStriche();
        }

        // ── Side panel ──────────────────────────────────────────────────────
        function buildPanel() {
            // Three buttons, nothing else (Doc, 25.09.). Everything that was
            // here before - statistics, undo, load, model picker, the morph
            // slider, the display switches and the seven tuning sliders - is
            // kept at the bottom of this function, commented out, because the
            // functions behind them still exist and we will want them back for
            // calibrating.
            CyberUI.createCard('ui-container', '', `
                <div class="gross-row">
                    <button class="cyber-btn gross" style="height:6rem;min-height:6rem;font-size:1.6rem;letter-spacing:0.12em;width:100%;padding:0;line-height:6rem" onclick="clearAll()">LEEREN</button>
                    <button class="cyber-btn gross" style="height:6rem;min-height:6rem;font-size:1.6rem;letter-spacing:0.12em;width:100%;padding:0;line-height:6rem" onclick="exportStrokes()">SICHERN</button>
                    <button class="cyber-btn gross" style="height:6rem;min-height:6rem;font-size:1.6rem;letter-spacing:0.12em;width:100%;padding:0;line-height:6rem" onclick="erkennen()">ERKENNEN</button>
                    <button class="cyber-btn gross" style="height:6rem;min-height:6rem;font-size:1.6rem;letter-spacing:0.12em;width:100%;padding:0;line-height:6rem" onclick="naechsteVorlage()">WEITER</button>
                </div>
                <div id="probe-status" class="erk-info" style="margin-top:0.6rem">–</div>
                <div id="erkennung-out" style="margin-top:1rem"><div class="erk-info">–</div></div>
                <input type="file" id="import-file" accept="application/json" style="display:none"
                       onchange="if(this.files[0]) importStrokes(this.files[0])">
                <select id="modell-wahl" style="display:none">
                    <option value="gemini-2.5-flash">2.5-flash</option>
                </select>
                <input type="range" id="morph-regler" min="0" max="1" step="0.01" value="0"
                       oninput="setzeMorph(this.value)" style="display:none">
            `, '#00d2ff');

            // Doc: "speed slider für mich". Letting go replays the morph at the
            // new speed, so the effect can be judged right away.
            let nochmal = null;
            CyberUI.createSlider('ui-container', 'Morph-Dauer', 0.3, 5, morphDauer, 0.1, v => {
                morphDauer = v;
                try { localStorage.setItem('vorrechnen-morph-dauer', String(v)); } catch (_) {}
                clearTimeout(nochmal);
                nochmal = setTimeout(() => {
                    if (!morphVorbereitet.some(Boolean)) return;
                    setzeMorph(0);
                    morphen(1);
                }, 350);
            }, '#00d2ff', v => v.toFixed(1) + ' s');

            document.getElementById('ui-container').insertAdjacentHTML('beforeend',
                '<div class="btn-row" style="margin-top:0.8rem">' +
                '<button class="cyber-btn" style="flex:1" onclick="beispiel()">BEISPIEL</button>' +
                '<button class="cyber-btn" style="flex:1" onclick="nochmal()">NOCHMAL</button></div>');

            /* Ausgeblendet auf Docs Wunsch (25.09.) - die Funktionen dahinter
               leben weiter, nur die Bedienelemente sind weg:

            CyberUI.createCard('ui-container', 'Aufnahme', `
                <div id="stat-row"></div>
                <div class="btn-row">
                    <button class="cyber-btn" onclick="undoStroke()">ZURÜCK</button>
                    <button class="cyber-btn" onclick="document.getElementById('import-file').click()">LADEN</button>
                </div>
            `, '#00d2ff');

            CyberUI.createCheckbox('ui-container', 'Nur Stift (Handballen ignorieren)', view.penOnly,
                v => { view.penOnly = v; });
            CyberUI.createCheckbox('ui-container', 'Kästchen zeigen', view.boxes,
                v => { view.boxes = v; redraw(); });
            CyberUI.createCheckbox('ui-container', 'Nummern zeigen', view.numbers,
                v => { view.numbers = v; redraw(); });
            CyberUI.createCheckbox('ui-container', 'Zeilen zeigen', view.rows,
                v => { view.rows = v; redraw(); });

            const sl = (label, key, min, max, step) =>
                CyberUI.createSlider('ui-container', label, min, max, opts[key], step,
                    v => { opts[key] = parseFloat(v); recompute(); }, 'rgb(245,194,66)');
            sl('Zeilenabstand', 'lineGapFactor', 0.4, 2.5, 0.05);
            sl('Überlappung seitlich', 'xOverlapRatio', 0.1, 0.95, 0.05);
            sl('Nachbarschaft seitlich', 'xGapFactor', 0.05, 0.8, 0.01);
            sl('Nur-Nähe: Zeitfenster (ms)', 'nearOnlyMs', 60, 800, 10);
            sl('Gleiches Zeichen: Zeitfenster (ms)', 'sameSymbolMs', 200, 2500, 50);
            sl('Später gesetzt: Überlappung', 'lateJoinRatio', 0.3, 1.0, 0.05);
            sl('Zeilentrennung senkrecht', 'yGapFactor', 0.3, 2.0, 0.05);
            */
        }

        // ── Boot ────────────────────────────────────────────────────────────
        // The drawing surface must match its box exactly, or the ink lands beside
        // the pen: the browser stretches the canvas to its CSS size, so a stale
        // pixel size shows up as a horizontal offset that grows to the right.
        // Measured on the tablet: 1287 px wide inside a 993 px box at dpr 1.5 -
        // 1.296 instead of 1.5.
        let letzteGroesse = '';
        function resizeCanvasToContainer() {
            const dpr = window.devicePixelRatio || 1;
            const rect = container.getBoundingClientRect();
            const w = Math.max(1, Math.round(rect.width)), h = Math.max(1, Math.round(rect.height));
            const key = w + 'x' + h + '@' + dpr;
            if (key === letzteGroesse) return false;
            letzteGroesse = key;
            canvas.width = Math.round(w * dpr);
            canvas.height = Math.round(h * dpr);
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
            return true;
        }

        function init() {
            resizeCanvasToContainer();
            redraw();
            updateStats();
        }

        // The sidebar changes width when cards are added or it is collapsed, and
        // window.resize says nothing about that. Watch the box itself.
        if (typeof ResizeObserver === 'function') {
            new ResizeObserver(() => {
                if (resizeCanvasToContainer()) { redraw(); zeigeFormeln(); }
            }).observe(container);
        }

        window.addEventListener('resize', init);
        document.fonts.ready.then(() => {
            buildPanel(); holeStriche(); recompute(); init(); zeigeVorlage();
            fetch('/__proben/', { cache: 'no-store' }).then(r => { speichernApi = r.ok; })
                .catch(() => { speichernApi = false; })
                .then(() => setProbeStatus(speichernApi ? 'Speichern auf dem Mac bereit' : 'kein Speicher-Endpunkt – Proben als Download'));
        });
    </script>
</body>
