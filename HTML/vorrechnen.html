<!DOCTYPE html>
<!--
  Vorrechnen: write a calculation by hand, line by line, and watch the strokes be
  grouped into symbols and rows.

  This is the missing first half of the vision in /IDEAS.md ("Nutzer schreibt
  handschriftlich Formeln, die sich kaum merkbar in LaTeX morphen"). morpheus/
  already has the morph; what never worked was knowing which stroke belongs to
  which LaTeX glyph, because morpheus rasterises the drawing and tries to recover
  the reading order from the geometry.

  Here the pen keeps what it knows: every stroke carries its position AND its
  time, and the grouping in js/stroke-symbols.js reads the order straight off it.
  No API call is involved on this page - the grouping is geometry plus the clock,
  so it can be judged, tuned and tested without a key.

  The sliders exist because the thresholds must be calibrated against real
  handwriting, not against what looks plausible in a test. Draw, watch the boxes,
  turn the knobs until they sit, then EXPORT - the saved strokes can be replayed
  offline as often as needed.
-->
<html lang="de">

<head>
    <meta charset="UTF-8">

         was - without it that strip stayed black and the scene sat 39 px low (Doc, Lenovo, 25.09.) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DOC ALVERS MATHE-LABORE | Vorrechnen</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="resources/favicon.svg">
    <link rel="icon" type="image/png" sizes="256x256" href="resources/favicon.png">
    <!-- Installs as an app that starts in full screen (Doc: "immer im Vollbild starten") -
         a page alone may only go full screen on a touch. Pattern: svp/fahrplan.html. -->
    <link rel="manifest" href="vorrechnen.webmanifest">
    <link rel="apple-touch-icon" href="resources/apple-touch-icon.png">
    <meta name="theme-color" content="#08142a">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="js/cyber-layout.css">
    <link rel="stylesheet" href="js/buttons-ultra.css">
    <link rel="stylesheet" href="js/cyber-lab-overrides.css">
    <link rel="stylesheet" href="js/branding.styles.extracted.css">
    <link rel="stylesheet" href="js/lab-shell-minimal.css">
    <link rel="stylesheet" href="morpheus/vendor/katex/katex.min.css">
    <style>
        /* The pen must own the surface: without this the tablet scrolls instead
           of drawing, and a resting palm pans the page. */
        #canvas {
            touch-action: none;
            cursor: crosshair;
        }

        #stat-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem 1.5rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.06em;
        }

        #stat-row .stat b {
            display: block;
            font-size: 1.45rem;
            line-height: 1.1;
            color: var(--neon-blue, #00d2ff);
        }

        #stat-row .stat span {
            opacity: 0.65;
            font-weight: 400;
        }

        #pen-hint {
            margin-top: 0.6rem;
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            opacity: 0.75;
            line-height: 1.45;
        }

        .gross-row {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
        }

        /* Doc: "die Taste richtig groß" - hit with a finger while the other
           hand holds the pen. buttons-ultra.css sets a central height for lab
           buttons, so this needs the extra weight to win; a deliberate local
           exception, like Cavalieri's. */
        /* Doc, 25.09.: "butts 30% schmaler" - 101 px down to 70 px on the Lenovo,
           where a rem is about 11 px (6.4rem), so the main sliders fit right under
           them. */
        #ui-container .cyber-btn.gross {
            font-size: 1.5rem !important;
            letter-spacing: 0.12em;
            padding: 0 1rem !important;
            height: 6.4rem !important;
            min-height: 6.4rem !important;
            line-height: 6.4rem;
            width: 100%;
        }

        .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.6rem;
        }

        .erk-zeile {
            margin-bottom: 0.7rem;
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
        }

        .erk-zeile b {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            opacity: 0.7;
        }

        .erk-latex {
            font-family: 'Outfit', monospace;
            font-size: 1rem;
            color: var(--neon-blue, #00d2ff);
            word-break: break-all;
            margin: 0.15rem 0;
        }

        /* The film strip along the bottom edge (see "Film strip" in the script):
           the whole strip is the grip, the line and the dot only show where. */
        #zeitleiste .zl-spur, #zeitleiste .zl-fuellung {
            position: absolute; left: 24px; top: 28px; height: 3px; margin-top: -1.5px; border-radius: 2px;
        }
        #zeitleiste .zl-spur { right: 24px; background: rgba(234, 240, 247, 0.18); }
        #zeitleiste .zl-fuellung { width: 0; background: rgba(234, 240, 247, 0.7); }
        #zeitleiste .zl-knopf {
            position: absolute; left: 24px; top: 28px; width: 18px; height: 18px;
            margin: -9px 0 0 -9px; border-radius: 50%; background: #eaf0f7;
        }

        /* Doc, 26.09.: "Schrift größer ... an den checks", "alle checks größer",
           "noch größer" - every checkbox and radio in the settings card, text as
           large as on the big buttons (24 px), box 32 px. A lab exception like the
           big buttons; a central rule pins inputs to 18 px with !important. */
        :is(#modus-wahl, #schalter, #morph-steuerung, #regler) :is(.cyber-checkbox-wrapper, .cyber-radio-wrapper) .cyber-label {
            font-size: 1.5rem;
        }
        :is(#modus-wahl, #schalter, #morph-steuerung, #regler) :is(.cyber-checkbox-wrapper, .cyber-radio-wrapper) { gap: 18px; }
        :is(#modus-wahl, #schalter, #morph-steuerung, #regler) .cyber-checkbox-wrapper { margin-bottom: 16px; }
        :is(#modus-wahl, #schalter, #morph-steuerung, #regler) .cyber-radio-group { gap: 16px; }
        :is(#modus-wahl, #schalter, #morph-steuerung, #regler) :is(.cyber-checkbox, .cyber-radio-input) {
            width: 32px !important;
            height: 32px !important;
            min-height: 32px !important;
        }
        :is(#modus-wahl, #schalter, #morph-steuerung, #regler) .cyber-checkbox { border-radius: 7px; }
        :is(#modus-wahl, #schalter, #morph-steuerung, #regler) .cyber-checkbox::after { width: 9px; height: 18px; border-width: 0 3px 3px 0; }
        :is(#modus-wahl, #schalter, #morph-steuerung, #regler) .cyber-radio-input::after { width: 18px; height: 18px; }
        /* Doc: "Einstellungen die Schrift" - the card's title, larger, arrow too */
        .instrument-card:is(:has(#modus-wahl), :has(#regler)) .instrument-title { font-size: 1.25rem; }
        .instrument-card:is(:has(#modus-wahl), :has(#regler)) .toggle-icon svg { width: 16px; height: 16px; }

        /* Doc, 26.09.: "auf der Seite kann man ... Text markieren ... dieses Google
           Übersetzungsding. Bitte nicht" - nothing on the board selects text (task,
           working, the green line, its buttons); the controls around the board are
           unselectable centrally (cyber-lab-overrides.css) */
        #canvas-container { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
        /* Doc, 26.09.: "auf den dunklen Design auch Linien und Karos" - the same paper
           on the dark board, drawn in the white ink, about as faint as on sand */
        #canvas-container {
            isolation: isolate;        /* #papier (z-index -1) lies on the board, under the ink */
            --papier-linie: rgba(234, 240, 247, 0.13);
            --papier-karo: rgba(234, 240, 247, 0.09);
            --papier-grenze: rgba(234, 240, 247, 0.23);
        }
        /* Doc, 26.09.: "hell mode ... mit leicht sandfarbenen Papier und Tinte und
           zeilen (toggle)" - the board as paper with a ruled line every 96 px;
           the controls on it get darker so they stay visible on sand */
        #canvas-container.hell {
            background: #f4ecd8;
            --papier-linie: rgba(31, 64, 150, 0.2);
            --papier-karo: rgba(31, 64, 150, 0.13);
            --papier-grenze: rgba(31, 64, 150, 0.35);
        }
        /* Doc, 26.09.: "die Aufgabe direkt auf der Zeile und noch etwas enger. Im
           unteren Drittel ... Karos um abzugrenzen" - ruled lines every --zeile px
           down to two thirds, squares of half that below (zeigePapier sets --zeile
           from the screen, 64 px on a 1080 board). Each is one tile repeated, so
           every line is drawn the same, also at a device pixel ratio of 1.5. */
        #papier { --zeile: 64px; position: absolute; inset: 0; z-index: -1; pointer-events: none; }
        #papier .linien {
            position: absolute; left: 0; right: 0; top: 0;
            background-image: linear-gradient(to bottom, transparent calc(var(--zeile) - 1px), var(--papier-linie) calc(var(--zeile) - 1px));
            background-size: 100% var(--zeile);
        }
        #papier .karo {
            position: absolute; left: 0; right: 0; bottom: 0;
            border-top: 2px solid var(--papier-grenze);
            background-image:
                linear-gradient(to bottom, transparent calc(var(--zeile) / 2 - 1px), var(--papier-karo) calc(var(--zeile) / 2 - 1px)),
                linear-gradient(to right, transparent calc(var(--zeile) / 2 - 1px), var(--papier-karo) calc(var(--zeile) / 2 - 1px));
            background-size: calc(var(--zeile) / 2) calc(var(--zeile) / 2);
        }
        #canvas-container.hell :is(#tafel-pfeil-vor, #tafel-pfeil-zurueck, #zl-play) {
            color: #5d6678 !important;
        }
        #canvas-container.hell #zeitleiste .zl-spur { background: rgba(31, 64, 150, 0.18); }
        #canvas-container.hell #zeitleiste .zl-fuellung { background: rgba(31, 64, 150, 0.6); }
        #canvas-container.hell #zeitleiste .zl-knopf { background: rgb(31, 64, 150); }

        /* Doc, 26.09.: "baue einen modus wie in den Decks, das ich projizieren
           kann. Kids sehen nur die Rechnungen, ich mission control" - the window on
           the beamer shows only the board; everything to operate it is gone, and
           a backdrop in the board's colour fills the rest of the screen */
        body.anzeige { overflow: hidden; }
        body.anzeige::before {
            content: ''; position: fixed; inset: 0; z-index: 999;
            background: var(--anzeige-grund, #050d1c);
        }
        body.anzeige :is(#cyber-left-chrome, #mini-rail, #side-panel, #right-rail, #tafel-pfeil-vor, #tafel-pfeil-zurueck, #formel-schicht, #erkennen-klein,
            #schritt-hinweis, #schritt-op, #notiz-rand, #notiz-leeren, #seite-leeren, #radierer, #radier-rahmen, #aufgaben-overlay, [id^="werkzeug-"], [id^="farbe-"], #zeitleiste, #zl-play) {
            display: none !important;
        }
        /* Doc, 26.09.: "nimm bitte HIER das LOCAL rechts oben nach links unten
           kleiner" - serve.py's badge (local only), in this lab only */
        #local-badge {
            top: auto !important; right: auto !important;
            left: 8px !important; bottom: 8px !important;
            transform: scale(0.7); transform-origin: left bottom;
        }
        body.anzeige #local-badge { display: none !important; }
        body.anzeige #canvas-container {
            position: fixed !important; left: 0 !important; top: 0 !important;
            transform-origin: 0 0; z-index: 1000;
        }
        /* Doc, 26.09. (on the wide LG): "die Linien und das Karo gehen nicht bis zum
           Rand - nach links und rechts erweitern ... denk an die Promethean". Mission
           control's board keeps its proportions on the beamer, so a wider screen gets
           margins; the paper simply runs on far beyond them (nothing clips it), on any
           screen. 4000 = 125 squares, so the squares stay in step. */
        body.anzeige #papier { left: -4000px; right: -4000px; }
        /* Dark: the board's glow spans the whole screen and the board itself is
           clear, so the margins are board too - one surface under the lines, as the
           sand is in light mode (else the board shows as a lighter box) */
        body.anzeige:has(> #canvas-container:not(.hell))::before {
            background: radial-gradient(circle at 50% 50%, rgba(5, 25, 55, 1) 0%, rgba(8, 20, 42, 1) 100%);
        }
        body.anzeige #canvas-container:not(.hell) { background: transparent; }

        /* Doc, 26.09.: "mach in der unteren Zeile dann doch den Erkennen-Button" -
           small, bottom centre, until the recognised line takes its place */
        /* Doc, 26.09.: "mache den Erkennen-Button unten etwas deutlicher, denn den
           sehe ja nur ich" - larger, bold, a strong frame with a glow. "Wenn der
           Prozess des Erkennens läuft ... eine Welle" - while Gemini reads, a wave
           runs through the button instead of its word (same size, nothing jumps) */
        /* Doc, 26.09.: "Der Erkennen-Button muss in das Feld, was rechts ist ... Ich
           komme oft mit dem Finger dran" - in the notes margin, where nothing is
           read; then "kann kleiner sein und sollte links neben dem C stehen, immer
           unten. Weniger Platz ist, macht die beiden Buttons einfach kleiner" -
           --knopf scales both when the margin is narrow (erkennenKlein) */
        /* Doc, 26.09.: the notes' C "im gleichen Stil wie Erkennen, auch die
           Buchstabengröße und Font" - one look for both buttons in the margin */
        :is(#erkennen-klein, #notiz-leeren, #seite-leeren, #radierer) {
            position: absolute; z-index: 5;
            display: flex; align-items: center; justify-content: center; box-sizing: border-box;
            bottom: 12px; height: calc(46px * var(--knopf, 1)); border-radius: 8px; cursor: pointer; touch-action: manipulation;
            font-family: 'Orbitron', sans-serif; font-size: calc(1.05rem * var(--knopf, 1)); font-weight: 700; letter-spacing: 0.14em;
            color: #eaf0f7; border: 2px solid rgba(0, 210, 255, 0.85);
            /* opaque, so the squares do not show through: the tint over the board's colour there */
            background: linear-gradient(rgba(0, 210, 255, 0.14), rgba(0, 210, 255, 0.14)) #07162f;
            box-shadow: 0 0 14px rgba(0, 210, 255, 0.35);
        }
        #canvas-container.hell :is(#erkennen-klein, #notiz-leeren, #seite-leeren, #radierer) {
            color: rgb(31, 64, 150); border-color: rgba(31, 64, 150, 0.85);
            background: linear-gradient(rgba(31, 64, 150, 0.08), rgba(31, 64, 150, 0.08)) #f4ecd8;
            box-shadow: none;
        }
        /* at the margin's line (left: erkennenKlein); a fixed width, so the wave takes the word's place without a jump */
        #erkennen-klein { width: calc(150px * var(--knopf, 1)); padding: 0; }
        #erkennen-klein .erk-welle {
            display: none; width: calc(110px * var(--knopf, 1)); height: calc(24px * var(--knopf, 1));
            -webkit-mask-image: linear-gradient(to right, transparent, #000 18%, #000 82%, transparent);
            mask-image: linear-gradient(to right, transparent, #000 18%, #000 82%, transparent);
        }
        #erkennen-klein .erk-welle path {
            fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round;
            animation: erk-welle 0.8s linear infinite;
        }
        #erkennen-klein.liest .erk-wort { display: none; }
        #erkennen-klein.liest .erk-welle { display: block; }
        /* one period (40) per turn, travelling to the right */
        @keyframes erk-welle { from { transform: translateX(-40px); } to { transform: translateX(0); } }
        /* the reload button at the foot of the right rail turns while it fetches */
        #werkzeug-neuladen.dreht svg { animation: neu-drehen 0.8s linear infinite; }
        @keyframes neu-drehen { to { transform: rotate(360deg); } }
        /* Doc, 26.09.: the next step of the solution, grey, for Doc only - at the top
           of the squares, under the ink (z-index -1 after #papier: over the paper,
           under the canvas), never on the beamer (no mirrored layer, hidden there) */
        /* Doc, 26.09.: "die graue Formel unten ungefähr 80% so groß ... und pack die links
           in die Ecke oben in das Karo-Feld" */
        #schritt-hinweis {
            position: absolute; left: 24px; right: 0; z-index: -1; pointer-events: none;
            display: flex; justify-content: flex-start;
            white-space: nowrap; color: #8a93a3;
            font-size: 1.76rem;        /* 80 % of 2.2rem; its own size, not the working's (rechenSchrift()) */
        }
        #canvas-container.hell #schritt-hinweis { color: #7a8294; }
        /* the operation to it, top left in the notes margin at its line - the grey
           line's mirror (Doc, 26.09.: "so wie erkennen links an die gestrichelte
           Linie ... symmetrisch zur Formel links"); left set by zeigeHinweis */
        #schritt-op {
            position: absolute; z-index: -1; pointer-events: none; width: max-content;   /* passeEin measures the real width */
            white-space: nowrap; color: #8a93a3; font-size: 1.76rem;
        }
        #canvas-container.hell #schritt-op { color: #7a8294; }
        /* the edge of the notes margin (right quarter of the squares): dashed, under the ink */
        #notiz-rand {
            position: absolute; bottom: 0; width: 0; z-index: -1; pointer-events: none;
            border-left: 2px dashed rgba(234, 240, 247, 0.3);
        }
        #canvas-container.hell #notiz-rand { border-left-color: rgba(31, 64, 150, 0.4); }
        /* the notes' own C, bottom right in the margin (Doc only) - a letter like
           ERKENNEN's (Doc asked for its size and font), its look shared above */
        #notiz-leeren { right: 12px; width: calc(46px * var(--knopf, 1)); padding: 0; letter-spacing: 0; }
        /* the writing field's own C: in the field, bottom, 12 px left of the margin's line
           (Doc, 26.09.: "in dem Feld, wo ich die Formel schreibe, links neben die
           gestrichelte Linie"); right set by zeigeNotizRand */
        #seite-leeren { width: calc(46px * var(--knopf, 1)); padding: 0; letter-spacing: 0; }
        /* the eraser: bottom centre of the writing field, lit while it rubs; its frame
           is one square of the paper (Doc, 26.09.) */
        #radierer { width: calc(46px * var(--knopf, 1)); padding: 0; transform: translateX(-50%); }
        #radierer svg { width: calc(24px * var(--knopf, 1)); height: calc(24px * var(--knopf, 1)); }
        #radierer.an { background: linear-gradient(rgba(0, 210, 255, 0.4), rgba(0, 210, 255, 0.4)) #07162f; box-shadow: 0 0 20px rgba(0, 210, 255, 0.75); }
        #canvas-container.hell #radierer.an { background: linear-gradient(rgba(31, 64, 150, 0.25), rgba(31, 64, 150, 0.25)) #f4ecd8; }
        #radier-rahmen {
            position: absolute; z-index: 6; pointer-events: none; box-sizing: border-box;
            border: 2px solid rgba(0, 210, 255, 0.9); border-radius: 3px; background: rgba(0, 210, 255, 0.08);
        }
        #canvas-container.hell #radier-rahmen { border-color: rgba(31, 64, 150, 0.85); background: rgba(31, 64, 150, 0.06); }
        /* Doc, 26.09.: "bitte keine selects" - the board's own buttons (◀ ▶, ERKENNEN,
           PLAY) are tapped, never tabbed through: no focus ring after a key press */
        #canvas-container button:focus { outline: none; }

        .erk-ok { color: rgb(121, 158, 49); }
        .erk-warn { color: rgb(245, 194, 66); }
        .erk-fehler { color: rgb(176, 36, 24); }
        .erk-info { opacity: 0.6; font-size: 0.8rem; }

        /* Doc, 26.09.: "Tafel senden" - today's working into the plan, in the central modal;
           chips for the class and the tasks, light on sand with ink like the task panel */
        #tafel-overlay { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
        #tafel-overlay .cyber-modal { padding: 52px 28px 26px; max-width: 660px; text-align: left; font-family: 'Orbitron', sans-serif; }
        #tafel-overlay h3 { text-align: center; }
        #tafel-overlay :is(.ts-text, .ts-status) { font-size: 0.85rem; line-height: 1.6; letter-spacing: 0.03em; }
        #tafel-overlay .ts-text { margin: 0 0 6px; text-align: center; }
        #tafel-overlay .ts-label {
            margin: 16px 0 8px; font-family: 'Orbitron', sans-serif; font-size: 0.72rem; letter-spacing: 0.1em; color: #8a93a3;
        }
        #tafel-overlay .ts-reihe { display: flex; flex-wrap: wrap; gap: 8px; }
        #tafel-overlay .ts-chip {
            min-height: 42px; padding: 0 14px; cursor: pointer; touch-action: manipulation;
            font-family: 'Orbitron', sans-serif; font-size: 0.8rem; letter-spacing: 0.06em;
            color: #eaf0f7; background: rgba(0, 210, 255, 0.05); border: 1px solid rgba(0, 210, 255, 0.25); border-radius: 10px;
        }
        #tafel-overlay .ts-chip.an { border-color: #00d2ff; background: rgba(0, 210, 255, 0.14); box-shadow: 0 0 12px rgba(0, 210, 255, 0.45); }
        #tafel-overlay .ts-chip:focus { outline: none; }
        #tafel-overlay .ts-woche { margin-top: 10px; font-size: 0.78rem; letter-spacing: 0.03em; line-height: 1.5; color: #8a93a3; }
        #tafel-overlay .ts-status { min-height: 1.4em; margin: 18px 0 0; text-align: center; }
        #tafel-overlay .ts-knoepfe { display: flex; gap: 12px; margin-top: 14px; }
        #tafel-overlay .ts-knoepfe .cyber-btn { flex: 1; }
        #tafel-overlay.hell { background: rgba(244, 236, 216, 0.72); }
        #tafel-overlay.hell .cyber-modal {
            background: #f4ecd8; color: rgb(31, 64, 150); border-color: rgba(31, 64, 150, 0.45);
            box-shadow: 0 25px 60px rgba(31, 64, 150, 0.22);
        }
        #tafel-overlay.hell .ts-chip { color: rgb(31, 64, 150); background: rgba(31, 64, 150, 0.05); border-color: rgba(31, 64, 150, 0.25); }
        #tafel-overlay.hell .ts-chip.an { border-color: rgb(31, 64, 150); background: rgba(31, 64, 150, 0.12); box-shadow: 0 0 10px rgba(31, 64, 150, 0.3); }
        #tafel-overlay.hell :is(.ts-label, .ts-woche) { color: #5d6678; }
        #tafel-overlay.hell .cyber-modal-x { color: rgba(31, 64, 150, 0.7); border-color: rgba(31, 64, 150, 0.3); }

        /* Doc, 26.09.: all tasks in one panel (central modal, the grid is the lab's); night:
           flatter tiles, no heading, no "nach x", a small cross, light on sand with ink */
        #aufgaben-overlay { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
        #aufgaben-overlay .cyber-modal { padding: 52px 24px 24px; }          /* room for the cross */
        #aufgaben-overlay .aufgaben-liste {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px;
        }
        #aufgaben-overlay .aufgabe-karte {
            position: relative; display: flex; align-items: center; justify-content: center;
            min-height: 76px; padding: 14px 10px 6px; box-sizing: border-box; cursor: pointer; touch-action: manipulation;
            color: #eaf0f7; background: rgba(0, 210, 255, 0.05); border: 1px solid rgba(0, 210, 255, 0.25); border-radius: 10px;

    <script>
        function toggleSidebar() {

                    CyberLeftChrome.publishResolvedScale();

        let anzeigeModus = false;
        const container = document.getElementById('canvas-container');

        // ── State ───────────────────────────────────────────────────────────

        // Doc, 25.09. evening: without "Meine Beispiele" the head strip holds a

        // fingers and the ball of the hand do not draw, until a few seconds after
        // the pen was last seen. A touch stroke under way when the pen lands is
        // dropped, a second pointer while one draws is ignored, and a contact as
        // wide as a palm never draws.

            // line stays, no second round with Gemini (the notes margin)

        // clock, a pen or finger on the page stops it. Only lines not yet
        // recognised (or failed) are sent. In class only - with "Meine
        // Beispiele" every pause would save half a line as a probe.
        // Doc, 26.09. evening: "startet das Erkennen noch automatisch? ... das ist keine
        // gute Idee. Ich tippe da lieber" - off unless the "Auto" box is ticked; after
        // a tap on ERKENNEN the line still flies up at once. A new key: an "on" stored
        // under the old one must not keep it on.
        const AUTO_PAUSE = 2000;           // ms without input
        let autoErkennen = false, autoTimer = null;
        try { const v = localStorage.getItem('vorrechnen-auto-erkennen'); if (v !== null) autoErkennen = v === '1'; } catch (_) {}
        function autoBald() {
            clearTimeout(autoTimer);
            if (!autoErkennen || testModus) return;
            autoTimer = setTimeout(() => {
                if (current || tipp || geste) return;          // the end of that input restarts the clock
                if (erkennenLaeuft) return autoBald();
                if (analysis.lines.some(l => !zuKlein(l) && !zeilenErgebnis[l.lineIdx])) erkennen();
            }, AUTO_PAUSE);
        }
        function tippAblegen() {
            if (!tipp) return;
            clearTimeout(tipp.timer);
            const s = tipp.strich;
            tipp = null;
            if (legeStrich(s)) { recompute(); merkeStriche(); }
            else redrawBald();
        }

        function endStroke(ev) {
            if (ev && ev.pointerType === 'pen') stiftZuletzt = performance.now();
            if (ev && fingerHoch(ev)) return;
            if (radierId !== null && (!ev || ev.pointerId === radierId)) { radierEnde(); return; }
            if (!current || (ev && ev.pointerId !== currentId)) return;
            currentId = null;
            const s = current;
            current = null;
            if (testModus && istTipp(s)) {
                const p = s.points[0], jetzt = performance.now();
                if (tipp && jetzt - tipp.zeit < TIPP_FENSTER &&
                    Math.abs(p.x - tipp.x) < TIPP_ABSTAND && Math.abs(p.y - tipp.y) < TIPP_HOEHE) {
                    clearTimeout(tipp.timer);
                    tipp = null;
                    redrawBald();
                    wechsleMorphArt();
                    return;
                }
                tippAblegen();
                tipp = { strich: s, x: p.x, y: p.y, zeit: jetzt, timer: setTimeout(tippAblegen, TIPP_FENSTER) };
                redrawBald();
                return;
            }
            tippAblegen();
            legeStrich(s);
            recompute();
            merkeStriche();
        }

        // Live-reload kept wiping Doc's strokes mid-session. They now survive a
        // reload in localStorage; LEEREN clears them for good.
        function merkeStriche() {
            try { localStorage.setItem('vorrechnen-striche', JSON.stringify(strokes)); } catch (_) {}
        }
        function holeStriche() {
            try {
                const d = JSON.parse(localStorage.getItem('vorrechnen-striche') || '[]');
                if (Array.isArray(d) && d.length) { strokes.length = 0; d.forEach(s => strokes.push(s)); }
            } catch (_) {}
        }
        canvas.addEventListener('pointerup', endStroke);
        canvas.addEventListener('pointercancel', endStroke);
        canvas.addEventListener('pointerleave', endStroke);
        canvas.addEventListener('pointerleave', () => { if (radieren && radierId === null) zeigeRadierer(null); });

        // Doc, 26.09.: "Gib mir bitte unten ein Drittel auf der rechten Seite, wo ich
        // Anweisungen schreiben kann, die aber nicht mit transkribiert werden ...
        // senkrechter Strich, wir teilen durch drei", then "ein Viertel reicht" - the
        // right quarter of the squares is a margin for notes: its ink stays on the board (the class sees it), but
        // it is never read and never flies up; it goes with the line it belonged to.
        // A stroke counts by the middle of its box. Not in "Beispiele" (the corpus).
        const NOTIZ_ANTEIL = 1 / 4;
        // where the margin starts, px from the left: on a line of the squares (Doc,
        // 26.09.: "die gestrichelte Linie soll coincide mit dem Karo") - the squares'
        // lines lie at k * ZEILE/2 - 1 (#papier .karo). Every part of the margin -
        // its line, what is read, the hint, the buttons - takes it from here.
        function notizX(breite) {
            const karo = ZEILE / 2;
            return Math.round(breite * (1 - NOTIZ_ANTEIL) / karo) * karo - 1;
        }
        function notizPruefer() {
            if (modus === 'beispiele') return () => false;
            const r = container.getBoundingClientRect(), x0 = notizX(r.width), y0 = papierGrenze(r.height);
            return s => {
                if (!s.points || !s.points.length) return false;
                const b = StrokeSymbols.bboxOfPoints(s.points);
                return b.x + b.w / 2 >= x0 && b.y + b.h / 2 >= y0;
            };
        }
        function recompute() {
            // only the calculation is read: the notes stay out, the indices of the
            // rest are mapped back onto the page
            const istNotiz = notizPruefer();
            const nr = [];
            strokes.forEach((s, i) => { if (!istNotiz(s)) nr.push(i); });
            analysis = StrokeSymbols.analyse(nr.map(i => strokes[i]), opts);
            if (nr.length !== strokes.length) analysis.symbols.forEach(sy => { sy.strokeIdxs = sy.strokeIdxs.map(k => nr[k]); });
            const nk = document.getElementById('notiz-leeren');
            if (nk) nk.style.opacity = nr.length < strokes.length ? '' : '0.35';     // no notes: dimmed
            const sk = document.getElementById('seite-leeren');
            if (sk) sk.style.opacity = nr.length ? '' : '0.35';                     // nothing written: dimmed
            radiererBlass();
            redraw();
            updateStats();
        }

        // ── Rendering ───────────────────────────────────────────────────────
        function strokePath(s) {
            if (s.points.length < 2) return;
            ctx.strokeStyle = anzeige(s.farbe);
            ctx.beginPath();
            ctx.moveTo(s.points[0].x, s.points[0].y);
            for (let i = 1; i < s.points.length; i++) ctx.lineTo(s.points[i].x, s.points[i].y);
            ctx.lineWidth = s.width;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
        }

        function redraw() {
            if (anzeigeModus) return;
            zeigeZeitleiste();
            zeigeWerkzeuge();
            erkennenKlein();
            zeigeSatz();
            const rect = container.getBoundingClientRect();
            ctx.clearRect(0, 0, rect.width, rect.height);

            // Row bands first, so they sit behind everything.
            if (view.rows) {
                analysis.lines.forEach(l => {
                    if (!l.bbox) return;
                    ctx.fillStyle = 'rgba(0, 210, 255, 0.055)';
                    ctx.fillRect(0, l.bbox.y - 8, rect.width, l.bbox.h + 16);
                });
            }

            // Strokes that belong to a morphing row are drawn by the morph
            // itself - otherwise the original ink would still sit underneath and
            // the whole thing would look like a cross-fade, which is exactly what
            // Doc does not want.
            const imMorph = new Set();
            if (morphT > 0) {
                analysis.lines.forEach(l => {
                    if (morphVorbereitet[l.lineIdx])
                        l.symbols.forEach(sy => sy.strokeIdxs.forEach(i => imMorph.add(i)));
                });
            }
            ctx.strokeStyle = INK;
            strokes.forEach((s, i) => { if (!imMorph.has(i)) strokePath(s); });
            if (current) strokePath(current);
            if (tipp) strokePath(tipp.strich);

            if (morphT > 0) {
                analysis.lines.forEach(l => {
                    const v = morphVorbereitet[l.lineIdx];
                    // at t = 1 the row is real KaTeX (zeigeSatz), the canvas steps aside
                    const erg = zeilenErgebnis[l.lineIdx];
                    if (morphT >= 1 && erg && erg.satz) return;
                    // Doc: "alles grün" - the formula ends in the ink's green, no blue
                    if (v) zeichneMorph(ctx, v, morphT, anzeige(linienFarbe(l)));
                });
            }

            anzeigeBald();

            // lines on their way up (rechenwegHoch): ink or morph in a frame
            // that glides and shrinks towards the step's place
            fluege.forEach(f => {
                ctx.save();
                ctx.translate(f.p.tx, f.p.ty);
                ctx.scale(f.p.s, f.p.s);
                if (f.v && f.mt > 0) zeichneMorph(ctx, f.v, f.mt, anzeige(f.farbe));
                else f.striche.forEach(strokePath);
                ctx.restore();
            });

            if (view.boxes && morphT === 0) {
                analysis.lines.forEach(line => {
                    line.symbols.forEach((sym, i) => {
                        const c = SYM_COLORS[i % SYM_COLORS.length];
                        const b = sym.bbox;
                        ctx.strokeStyle = c;
                        ctx.lineWidth = 1.5;
                        ctx.setLineDash([4, 3]);
                        ctx.strokeRect(b.x - 4, b.y - 4, b.w + 8, b.h + 8);
                        ctx.setLineDash([]);
                        // Doc: "keine Boxbeschriftung" - numbers and stroke
                        // counts were for calibrating, they only clutter now.
                        if (false && view.numbers) {
                            ctx.fillStyle = c;
                            ctx.font = '600 12px Orbitron, sans-serif';
                            ctx.fillText(String(sym.readIdx), b.x - 4, b.y - 9);
                            // Stroke count, so a glyph that fell apart is obvious.
                            ctx.font = '400 10px Outfit, sans-serif';
                            ctx.globalAlpha = 0.65;
                            ctx.fillText(sym.strokeIdxs.length + '×', b.x + b.w - 4, b.y - 9);
                            ctx.globalAlpha = 1;
                        }
                    });
                });
            }

            // Doc: "NUR die LaTeX Formel" - the per-glyph transcription on the
            // canvas is gone; the typeset formula under the row (KaTeX, see
            // zeigeFormeln) says the same thing and says it properly.
        }

        function updateStats() {
            const el = document.getElementById('stat-row');
            if (!el) return;
            const perLine = analysis.lines.map(l => l.symbols.length).join(' · ') || '–';
            el.innerHTML =
                `<div class="stat"><b>${strokes.length}</b><span>Striche</span></div>` +
                `<div class="stat"><b>${analysis.symbols.length}</b><span>Symbole</span></div>` +
                `<div class="stat"><b>${analysis.lines.length}</b><span>Zeilen</span></div>` +
                `<div class="stat"><b>${perLine}</b><span>je Zeile</span></div>`;
        }

        // ── Recognition ─────────────────────────────────────────────────────
        // One call per row. Gemini says WHAT is written; WHERE comes from the
        // strokes. Both lists are in reading order, so laying them onto each
        // other needs no coordinates from the model - which is good, because its
        // coordinates were never trustworthy.
        // Hidden host where KaTeX sets the formula for measuring. visibility:hidden,
        // not display:none - the boxes must exist.
        function messHost() {
            let h = document.getElementById('mess-host');
            if (!h) {
                h = document.createElement('div');
                h.id = 'mess-host';
                h.style.cssText = 'position:absolute;left:-10000px;top:0;visibility:hidden;white-space:nowrap;pointer-events:none';
                document.body.appendChild(h);
            }
            return h;
        }

        // A row that is only a speck (a slip of the pen) is not a formula.
        function zuKlein(line) {
            return !line.bbox || Math.max(line.bbox.w, line.bbox.h) < 16;
        }

        // Doc: "Wurzel und Summenzeichen sehen noch falsch aus" - KaTeX set them
        // in text style (limits beside the sum, squeezed fractions and roots). By
        // hand a formula is written in display style, so every formula on this
        // page - template, measurement, the end of the morph, the recognised one
        // - is set that way.
        function alsDisplay(latex) { return '\\displaystyle ' + engeBrueche(latex); }

        // Doc, 26.09.: "kommen so große Abstände aus LaTeX?" - yes: in display
        // style TeX lifts every numerator and lowers every denominator by the
        // same fixed amount, whatever they hold. Then "JA" to closing them up,
        // and "die Wurzeln nicht so wahnsinnig auseinandergezogen" - so it is
        // done in the LaTeX, before KaTeX sets it: the numerator goes down, the
        // denominator up, and KaTeX stops each at its least distance from the
        // bar (3 bar widths) - and sizes roots and \left( \right) around the
        // tight fraction. Only fractions set in display style (not those in a
        // numerator or an exponent: they are small and tight already).
        function engeBrueche(latex, display = true) {
            let aus = '', i = 0;
            const n = latex.length;
            // one argument: a {group} or a single token
            const arg = () => {
                while (latex[i] === ' ') i++;
                if (latex[i] === '{') {
                    const s = ++i;
                    for (let t = 1; i < n; i++) {
                        if (latex[i] === '\\') { i++; continue; }
                        if (latex[i] === '{') t++;
                        else if (latex[i] === '}' && --t === 0) break;
                    }
                    return { text: latex.slice(s, i++), gruppe: true };
                }
                return { text: befehl() || latex[i++] || '', gruppe: false };
            };
            // a \command at i (or nothing)
            const befehl = () => {
                if (latex[i] !== '\\') return '';
                const s = i++;
                if (/[a-zA-Z]/.test(latex[i] || '')) while (i < n && /[a-zA-Z]/.test(latex[i])) i++;
                else i++;
                return latex.slice(s, i);
            };
            while (i < n) {
                const c = latex[i];
                if (c === '\\') {
                    const b = befehl();
                    if (b === '\\frac' || b === '\\dfrac') {
                        const z = engeBrueche(arg().text, false), m = engeBrueche(arg().text, false);
                        aus += display || b === '\\dfrac'
                            ? `${b}{\\raisebox{-0.3em}{$${z}$}}{\\raisebox{0.6em}{$${m}$}}` : `${b}{${z}}{${m}}`;
                        continue;
                    }
                    if (b === '\\displaystyle') display = true;
                    else if (/^\\(text|script|scriptscript)style$/.test(b)) display = false;
                    aus += b;
                } else if (c === '^' || c === '_') {
                    i++;
                    const a = arg();
                    aus += c + (a.gruppe ? '{' + engeBrueche(a.text, false) + '}' : a.text);
                } else if (c === '{') {
                    aus += '{' + engeBrueche(arg().text, display) + '}';
                } else { aus += c; i++; }
            }
            return aus;
        }

        // How far the ink of a set formula reaches, in page px: glyphs measured
        // on a canvas at their baseline, lines and SVGs (roots) by their boxes.
        // KaTeX's boxes are taller than the glyphs - and a denominator raised by
        // engeBrueche keeps its full depth there.
        const tinteCtx = document.createElement('canvas').getContext('2d');
        function tinte(el) {
            let o = Infinity, u = -Infinity;
            el.querySelectorAll('svg, .frac-line, .sqrt-line, .overline-line, .underline-line').forEach(x => {
                const r = x.getBoundingClientRect();
                if (r.width || r.height) { o = Math.min(o, r.top); u = Math.max(u, r.bottom); }
            });
            const texte = [], gang = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
            for (let t = gang.nextNode(); t; t = gang.nextNode()) {
                const text = t.textContent.replace(/​/g, '');
                if (!text.trim() || t.parentElement.closest('svg, .katex-mathml')) continue;
                const sonde = document.createElement('span');          // on the text's baseline
                sonde.style.cssText = 'display:inline-block;width:0;height:0';
                t.parentElement.appendChild(sonde);
                texte.push({ text, p: t.parentElement, sonde });
            }
            // all probes in, then all read: one layout, not one per glyph
            texte.forEach(x => { x.y = x.sonde.getBoundingClientRect().top; });
            texte.forEach(({ text, p, sonde, y }) => {
                sonde.remove();
                const cs = getComputedStyle(p);
                tinteCtx.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
                const m = tinteCtx.measureText(text);
                o = Math.min(o, y - m.actualBoundingBoxAscent); u = Math.max(u, y + m.actualBoundingBoxDescent);
            });
            return isFinite(o) ? { o, u } : null;
        }

        // Shrink a rendered formula (font size in rem) until it fits `frei` px.
        function passeEin(el, frei, basis = 2.4) {             // basis: its font size in rem
            if (!el || frei <= 0) return;
            const breit = el.getBoundingClientRect().width;     // scrollWidth is 0 for an inline span
            if (breit > frei) el.style.fontSize = (basis * frei / breit).toFixed(3) + 'rem';
        }

        // KaTeX sets the formula; the atoms say where every glyph sits. Then the
        // whole block is scaled and moved onto the handwriting: same height as
        // the row, left edge aligned, centred vertically - Doc's "gleiche Größe".
        async function formelAufZeile(latex, line) {
            const m = await KatexAtome.atomeAusLatex(engeBrueche(latex), messHost(), { fontSize: 100, display: true });
            const u = KatexAtome.umfang(m.atome);
            let atome = m.atome;
            // where KaTeX's box sat inside the measuring host - the real formula
            // at the end of the morph goes to exactly the same place
            const hr = messHost().getBoundingClientRect(), kh = messHost().querySelector('.katex-html');
            const kr = kh ? kh.getBoundingClientRect() : hr;
            const satz = { latex, skala: 1, dx: 0, dy: 0, kx: kr.left - hr.left, ky: kr.top - hr.top, kw: kr.width };
            if (u && u.h > 0 && u.w > 0) {
                // "Gleiche Größe" means: the typeset block fits the footprint of
                // the handwriting - height AND width - and never leaves the
                // canvas. Height alone sent a tall integral's fraction off the
                // right edge.
                // Centred on the handwriting (Doc: "den Morph bitte auch x
                // zentriert"), and it must fit on both sides of that centre.
                const breite = container.getBoundingClientRect().width;
                const mitte = line.bbox.x + line.bbox.w / 2;
                const platz = 2 * Math.max(20, Math.min(mitte - 24, breite - mitte - 24));
                const skala = Math.min(line.bbox.h / u.h, line.bbox.w / u.w, platz / u.w);
                const dx = mitte - (u.x + u.w / 2) * skala;
                const dy = (line.bbox.y + line.bbox.h / 2) - (u.y + u.h / 2) * skala;
                atome = KatexAtome.transformiere(m.atome, skala, dx, dy);
                Object.assign(satz, { skala, dx, dy });
            }
            return { atome, svg: m.svg, satz };
        }

        // Which handwritten symbol is which typeset glyph. The typesetter knows
        // the glyph count; when the grouping disagrees it gives way - fused
        // symbols are split at their widest gap, fragments merged - and the
        // reading order is redone.
        function ordneZeile(line, atome, striche = strokes) {
            let zuordnung = FormelErkennen.ordneZu(line.symbols, atome);
            let nachjustiert = false;
            if (!zuordnung.passt) {
                const neu = StrokeSymbols.nachjustieren(line, striche, atome.length, opts);
                if (neu.length === atome.length) {
                    line.symbols = neu;
                    zuordnung = FormelErkennen.ordneZu(neu, atome);
                    nachjustiert = true;
                }
            }
            return { zuordnung, nachjustiert };
        }

        // Gemini's reading is cleaned before it is used. Doc, 26.09.: "Ein rund-
        // oder ungefähr-Zeichen müssen wir immer in ein Gleichheitszeichen
        // umbauen" (an unsplit "≈" also threw the row out of the "=" column), and
        // "macht er manchmal aus Kleinbuchstaben, besonders bei x, ein großes X -
        // können wir die Konsistenz checken?": a letter the task and the working
        // know only in the other case takes that case (with "A" and "a" both in
        // use, as in the trapezium, nothing changes).
        const UNGEFAEHR = /\\(?:approx|thickapprox|simeq|cong|sim)(?![a-zA-Z])|[≈≃≅∼]/g;
        const TEXT_BEFEHL = /^\\(?:text|textrm|mathrm|operatorname)$/;
        // the letters of a formula - command names and \text{...} left out
        function buchstaben(latex) {
            return latex.replace(/\\(?:text|textrm|mathrm|operatorname)\s*\{[^}]*\}/g, ' ')
                .replace(/\\[a-zA-Z]+/g, ' ').split('').filter(c => /[a-zA-Z]/.test(c));
        }
        function bereinige(latex) {
            const s = latex.replace(UNGEFAEHR, '=');
            const kontext = new Set();
            if (aufgabenModus) {
                buchstaben(AUFGABEN[aufgabeIdx][1]).forEach(c => kontext.add(c));
                kontext.add(AUFGABEN[aufgabeIdx][2]);
            }
            rechenweg.forEach(e => buchstaben(e.latex).forEach(c => kontext.add(c)));
            let out = '', i = 0;
            while (i < s.length) {
                if (s[i] === '\\') {
                    const m = /^\\([a-zA-Z]+|.)/.exec(s.slice(i));
                    const befehl = m ? m[0] : '\\';
                    let n = befehl.length;
                    if (TEXT_BEFEHL.test(befehl)) {
                        const gruppe = /^\s*\{[^}]*\}/.exec(s.slice(i + n));
                        if (gruppe) n += gruppe[0].length;
                    }
                    out += s.slice(i, i + n);
                    i += n;
                    continue;
                }
                const c = s[i];
                if (/[a-zA-Z]/.test(c)) {
                    const andere = c === c.toLowerCase() ? c.toUpperCase() : c.toLowerCase();
                    out += (!kontext.has(c) && kontext.has(andere)) ? andere : c;
                } else out += c;
                i++;
            }
            return out;
        }

        async function erkennen() {
            if (erkennenLaeuft) return;
            if (!analysis.lines.length) { setErgebnisText('Erst etwas schreiben.'); return; }
            erkennenLaeuft = true;
            erkennenKlein();                   // the wave runs
            // a stroke written while the answer is on its way makes it stale
            const stand = erkennenStand;
            setErgebnisText('Erkenne …');
            const modelEl = document.getElementById('modell-wahl');
            const model = modelEl ? modelEl.value : 'gemini-2.5-flash';
            let ab = null;                     // a second line tries the steps after the first one's
            try {
                for (const line of analysis.lines) {
                    if (zuKlein(line)) { zeilenErgebnis[line.lineIdx] = { uebersprungen: true }; continue; }
                    const idxs = line.symbols.flatMap(sy => sy.strokeIdxs);
                    // in class the steps still to come first - Gemini only when none fits
                    const erwartet = await erwarteterSchritt(line, strokes, ab);
                    if (stand !== erkennenStand) return;
                    if (erwartet) ab = erwartet.j + 1;
                    const r = erwartet ? { ok: true, latex: erwartet.latex, tokens: [], ms: 0 }
                        : await FormelErkennen.erkenneZeile(strokes, idxs, { model });
                    if (stand !== erkennenStand) return;
                    if (!r.ok) {
                        zeilenErgebnis[line.lineIdx] = { fehler: r.error };
                    } else if (!r.latex || /^\(?\s*(empty|leer)\s*\)?$/i.test(r.latex)) {
                        zeilenErgebnis[line.lineIdx] = { fehler: 'nichts erkannt' };
                    } else {
                        const latex = erwartet ? erwartet.latex : bereinige(r.latex);
                        const { atome, svg, satz } = erwartet || await formelAufZeile(latex, line);
                        if (stand !== erkennenStand) return;
                        const { zuordnung, nachjustiert } = ordneZeile(line, atome);
                        zeilenErgebnis[line.lineIdx] = {
                            latex, tokens: r.tokens, atome, ms: r.ms, zuordnung, svg, nachjustiert, satz, erwartet: !!erwartet,
                        };
                        // Doc's plan B: the row crumbles to one dust cloud and
                        // settles into the formula (js/staub-morph.js) - each
                        // symbol's dust into its own glyph when the mapping holds,
                        // the row as a whole when it does not. Radicals and
                        // vector arrows are SVG in KaTeX - they are traced first.
                        try {
                            await HandschriftMorph.schriftenBereit(atome);
                            await HandschriftMorph.svgVorbereiten(atome);
                            if (stand !== erkennenStand) return;
                            morphVorbereitet[line.lineIdx] = bereiteMorph(line, zuordnung, atome);
                        } catch (e) {
                            morphVorbereitet[line.lineIdx] = null;
                        }
                    }
                    redraw();
                    setErgebnisText(null);
                    zeigeFormeln();
                }
            } finally {
                erkennenLaeuft = false;
                erkennenKlein();               // also after a stale answer, which returns early
            }
            // Straight into the morph - with the button gone there is nothing
            // left to press, and Doc wanted it to happen by itself anyway.
            // Doc, 26.09.: "Wenn die Erkennung fertig ist ... noch nix weiter" -
            // outside "Beispiele" the recognised line shows at the bottom and the
            // ink waits; a tap on that line sends it up, morphing on the way
            if (testModus && morphVorbereitet.some(Boolean)) morphen(1);
            redraw();
            // Every ERKENNEN is a probe for the corpus, good or bad.
            if (strokes.length) speichereProbe();
            // Doc, 26.09. evening: "Wenn das erkannt ist, starte bitte die Animation
            // sofort" - in class the recognised page flies up at once, no tap needed.
            // By itself only a whole step: every line with an "=" (a pause in the
            // middle sent "1/f - 1/g" up without its "= 1/b"); a tap or two fingers
            // still send anything
            const ganz = analysis.lines.every(l => zuKlein(l) || (zeilenErgebnis[l.lineIdx] && /=/.test(zeilenErgebnis[l.lineIdx].latex || '')));
            if (!testModus && seiteErkannt() && ganz) rechenwegHoch();
        }

        // The typeset formula under the handwriting - real LaTeX, set by KaTeX.
        function zeigeFormeln() {
            if (anzeigeModus) return;
            let host = document.getElementById('formel-schicht');
            if (!host) {
                host = document.createElement('div');
                host.id = 'formel-schicht';
                // Doc: "so groß wie oben und weiter runter" - the counterpart of the
                // template strip: a strip at the bottom edge, formulas centred
                host.style.cssText = `position:absolute;left:0;right:0;bottom:${ZEITLEISTE_H}px;min-height:84px;pointer-events:none;` +
                    'display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.4rem';
                container.appendChild(host);
            }
            host.innerHTML = '';
            // above the film strip in "Beispiele"; in class at the bottom edge -
            // Doc, 26.09.: "zeige unten nur, was Google erkannt hat, sozusagen als
            // Zeile ... tippt drauf, wusch, geht's hoch"
            host.style.bottom = (testModus ? ZEITLEISTE_H : 8) + 'px';
            host.style.minHeight = testModus ? '84px' : '0';
            host.style.justifyContent = testModus ? 'center' : 'flex-end';
            if (!view.formelUnten) return;
            analysis.lines.forEach(line => {
                const erg = zeilenErgebnis[line.lineIdx];
                if (!erg || !erg.latex || !line.bbox) return;
                const d = document.createElement('div');
                // a shade darker than the ink, as large as the template on top; in
                // class green - Doc: "wenn die Formel da ist ... die Formel in grün"
                d.style.cssText = `color:${testModus ? (hell ? '#7a8294' : '#9aa5b5') : 'rgb(121, 158, 49)'};font-size:2.4rem`;
                try { katex.render(alsDisplay(erg.latex), d, { throwOnError: false, displayMode: false }); }
                catch (e) { d.textContent = erg.latex; }
                if (!testModus) {
                    // a tap (not a stroke) sends the page up, as the two-finger swipe does
                    d.style.pointerEvents = 'auto';
                    d.style.cursor = 'pointer';
                    d.style.touchAction = 'manipulation';
                    d.title = 'Tippen: hochschicken';
                    let tipp0 = null;
                    d.addEventListener('pointerdown', ev => { tipp0 = { x: ev.clientX, y: ev.clientY }; });
                    d.addEventListener('pointerup', ev => {
                        if (tipp0 && Math.hypot(ev.clientX - tipp0.x, ev.clientY - tipp0.y) < 12) rechenwegHoch();
                        tipp0 = null;
                    });
                }
                host.appendChild(d);
                passeEin(d, host.clientWidth - 48);
            });
            anzeigeBald();
        }

        // ── Morph ───────────────────────────────────────────────────────────
        // Doc: "meine in LT faden (morph nicht transp)" - the ink turns into
        // the formula, it does not fade. How long it takes is Doc's to set
        // (slider "Morph-Dauer", remembered on the device).
        // Doc: 0.1 to 1 s ("mach den speed slider 0.1 - 1 s")
        let morphDauer = 0.6;                        // seconds
        // Dust or strokes (Doc, 25.09.: "Bau mir bitte einen Schalter ... welches
        // von beiden"). The stroke morph (js/strich-morph.js) bends each pen line
        // onto the glyph's centre line; it needs the symbol-glyph pairing, so
        // without one the dust takes over.
        let morphArt = 'staub';
        try { if (localStorage.getItem('vorrechnen-morph-art') === 'strich') morphArt = 'strich'; } catch (_) {}
        function bereiteMorph(line, zuordnung, atome, striche = strokes) {
            if (morphArt === 'strich' && zuordnung && zuordnung.passt) {
                const g = StrichMorph.vorbereiten(line, striche, zuordnung);
                if (g && g.length) return { art: 'strich', glyphen: g };
            }
            const v = StaubMorph.vorbereiten(line, striche, zuordnung && zuordnung.paare ? zuordnung : atome, morphOpts);
            return v ? Object.assign(v, { art: 'staub' }) : null;
        }
        function zeichneMorph(c, v, t, farbe = INK) {
            if (v.art === 'strich') StrichMorph.zeichnen(c, v.glyphen, t, { farbe, zielFarbe: farbe, staffel: morphOpts.staffel });
            else StaubMorph.zeichnen(c, v, t, { farbe, zielFarbe: farbe,
                staffel: morphOpts.staffel, wirbel: morphOpts.wirbel, staub: morphOpts.staub });
        }
        function wechsleMorphArt(art) {
            morphArt = art || (morphArt === 'staub' ? 'strich' : 'staub');
            try { localStorage.setItem('vorrechnen-morph-art', morphArt); } catch (_) {}
            document.querySelectorAll('input[name="morph-art"]').forEach(r => { r.checked = r.value === morphArt; });
            nachRegler(true);                    // prepare again in the new kind, replay
        }

        // The dust morph's knobs (js/staub-morph.js), on sliders for Doc: the
        // cloud's shape needs a new preparation, the rest only a new drawing.
        const morphOpts = { dichte: 0.5, wolke: 0.25, auftrieb: 0.25, wirbel: 0.1, staffel: 0, staub: 0.8, pause: 0.9 };
        try { Object.assign(morphOpts, JSON.parse(localStorage.getItem('vorrechnen-morph') || '{}')); } catch (_) {}
        function bereiteMorphNeu() {
            analysis.lines.forEach(line => {
                const erg = zeilenErgebnis[line.lineIdx];
                if (!erg || !erg.atome || !morphVorbereitet[line.lineIdx]) return;
                morphVorbereitet[line.lineIdx] = bereiteMorph(line, erg.zuordnung, erg.atome);
            });
        }
        // Letting go of a slider replays the morph, so the effect can be judged.
        let reglerTimer = null, reglerNeu = false;
        function nachRegler(neu) {
            reglerNeu = reglerNeu || neu;
            clearTimeout(reglerTimer);
            reglerTimer = setTimeout(() => {
                if (reglerNeu) bereiteMorphNeu();
                reglerNeu = false;
                if (!morphVorbereitet.some(Boolean)) return;
                setzeMorph(0);
                morphen(1);
            }, 350);
        }
        try { const v = parseFloat(localStorage.getItem('vorrechnen-morph-dauer')); if (v > 0) morphDauer = Math.min(1, Math.max(0.1, v)); } catch (_) {}
        function morphen(ziel) {
            if (morphAnim) cancelAnimationFrame(morphAnim);
            const von = morphT, nach = (ziel === undefined) ? (morphT > 0.5 ? 0 : 1) : ziel;
            const dauer = morphDauer * 1000;
            const t0 = performance.now();
            const schritt = () => {
                const f = Math.min(1, (performance.now() - t0) / dauer);
                morphT = von + (nach - von) * f;
                redraw();
                const sl = document.getElementById('morph-regler');
                if (sl) sl.value = morphT;
                if (f < 1) morphAnim = requestAnimationFrame(schritt);
                else { morphAnim = null; morphT = nach; redraw(); }
            };
            schritt();
        }

        function setzeMorph(v) {
            if (morphAnim) { cancelAnimationFrame(morphAnim); morphAnim = null; }
            morphT = parseFloat(v);
            redraw();
        }

        // ── The end of the morph is real LaTeX ──────────────────────────────
        // Doc: "könntest Du heimlich am Ende LaTeX zeigen (ich sehe das :-)". The
        // dust lands on traced outlines of the KaTeX glyphs; at t = 1 the row is
        // handed to KaTeX itself, at exactly the place and size the atoms were
        // measured from - the swap cannot be seen, the result is just sharper.
        function zeigeSatz() {
            let host = document.getElementById('satz-schicht');
            if (!host) {
                host = document.createElement('div');
                host.id = 'satz-schicht';
                host.style.cssText = 'position:absolute;inset:0;pointer-events:none';
                container.appendChild(host);
            }
            const soll = new Set();
            analysis.lines.forEach(line => {
                const erg = zeilenErgebnis[line.lineIdx];
                if (morphT < 1 || !erg || !erg.satz || !morphVorbereitet[line.lineIdx]) return;
                const z = erg.satz, key = 'z' + line.lineIdx, farbe = anzeige(linienFarbe(line));
                const sig = [z.latex, z.skala, z.dx, z.dy, farbe].join('|');
                soll.add(key);
                const alt = host.querySelector(`[data-zeile="${key}"]`);
                if (alt && alt.dataset.sig === sig) return;
                if (alt) alt.remove();
                const d = document.createElement('div');
                d.dataset.zeile = key;
                d.dataset.sig = sig;
                d.style.cssText = `position:absolute;left:${z.dx}px;top:${z.dy}px;font-size:${100 * z.skala}px;` +
                    `white-space:nowrap;line-height:normal;color:${farbe}`;
                host.appendChild(d);
                try { katex.render(alsDisplay(z.latex), d, { throwOnError: false, displayMode: false }); } catch (_) { return; }
                // land on the measured spot: correct whatever the surroundings shifted
                const k = d.querySelector('.katex-html');
                if (!k) return;
                const c = container.getBoundingClientRect(), r = k.getBoundingClientRect();
                const sollX = z.dx + z.kx * z.skala, sollY = z.dy + z.ky * z.skala;
                d.style.left = (z.dx + sollX - (r.left - c.left)) + 'px';
                d.style.top = (z.dy + sollY - (r.top - c.top)) + 'px';
            });
            host.querySelectorAll('[data-zeile]').forEach(d => { if (!soll.has(d.dataset.zeile)) d.remove(); });
        }

        // ── Film strip: scrub the morph back and forth ──────────────────────
        // Doc: "wie in einem Movie einen Slider (vor, zurück)", "mit dem Finger
        // ... ganze Breite", "oder Stift!". A strip of its own along the bottom
        // edge, not a gesture on the page: Doc writes with pen AND finger. Any
        // pointer anywhere across the full width sets the morph to that point.
        // Built on first use; redraw() keeps it in step with the morph.
        let zeitleiste = null, abspielen = null;
        // Doc, 26.09.: "nimm PLAY butt raus und mach ihn unter den Slider rechts
        // als Dreieck", then "x mittig", "größer wie vor zurück" - the strip grew
        // from 56 to 80 px: the track stays 28 px from its top, PLAY sits under
        // its middle, as large as the board's back/forward triangles
        const ZEITLEISTE_H = 80;
        function zeigeZeitleiste() {
            if (!zeitleiste) {
                zeitleiste = document.createElement('div');
                zeitleiste.id = 'zeitleiste';
                zeitleiste.setAttribute('role', 'slider');
                zeitleiste.setAttribute('aria-label', 'Morph vor und zurück');
                zeitleiste.setAttribute('aria-valuemin', '0');
                zeitleiste.setAttribute('aria-valuemax', '1');
                zeitleiste.style.cssText = `position:absolute;left:0;right:0;bottom:0;height:${ZEITLEISTE_H}px;` +
                    'touch-action:none;cursor:ew-resize;z-index:5';
                zeitleiste.innerHTML = '<div class="zl-spur"></div><div class="zl-fuellung"></div><div class="zl-knopf"></div>';
                container.appendChild(zeitleiste);
                // a sibling above the strip, so a tap on it plays and does not scrub
                abspielen = document.createElement('button');
                abspielen.id = 'zl-play';
                abspielen.title = 'Morph noch einmal abspielen';
                abspielen.setAttribute('aria-label', 'Morph noch einmal abspielen');
                abspielen.style.cssText = 'position:absolute;left:50%;transform:translateX(-50%);bottom:1px;width:56px;height:40px;padding:0;border:none;' +
                    'background:transparent;color:#8a93a3;cursor:pointer;touch-action:manipulation;z-index:6;' +
                    'display:flex;align-items:center;justify-content:center';
                abspielen.innerHTML = '<svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
                    '<path d="M7 4 L18 12 L7 20 Z" fill="currentColor"/></svg>';
                abspielen.addEventListener('click', () => nochmal());
                container.appendChild(abspielen);
                const zeitAn = ev => {
                    const r = zeitleiste.getBoundingClientRect();
                    return Math.max(0, Math.min(1, (ev.clientX - r.left - 24) / Math.max(1, r.width - 48)));
                };
                // Doc: "den Switch zwischen den beiden auf Double-Tap oder Double-
                // Mausklick" - here, not on the page, where two quick taps are a
                // colon or an i's dot
                let tippZeit = 0, tippX = 0;
                zeitleiste.addEventListener('pointerdown', ev => {
                    const jetzt = performance.now();
                    if (jetzt - tippZeit < 350 && Math.abs(ev.clientX - tippX) < 40) {
                        tippZeit = 0;
                        ev.preventDefault();
                        wechsleMorphArt();
                        return;
                    }
                    tippZeit = jetzt; tippX = ev.clientX;
                    try { zeitleiste.setPointerCapture(ev.pointerId); } catch (_) {}
                    clearTimeout(beispielTimer);            // a pending replay must not jump in
                    setzeMorph(zeitAn(ev));
                    ev.preventDefault();
                });
                zeitleiste.addEventListener('pointermove', ev => {
                    if (zeitleiste.hasPointerCapture && zeitleiste.hasPointerCapture(ev.pointerId)) setzeMorph(zeitAn(ev));
                });
            }
            const b = Math.max(0, zeitleiste.clientWidth - 48);
            zeitleiste.querySelector('.zl-fuellung').style.width = (b * morphT) + 'px';
            zeitleiste.querySelector('.zl-knopf').style.left = (24 + b * morphT) + 'px';
            zeitleiste.style.opacity = morphVorbereitet.some(Boolean) ? '1' : '0.35';
            abspielen.style.opacity = zeitleiste.style.opacity;
            // Doc, 26.09.: "zeig play und slider nur in Beispiel Mode"
            zeitleiste.style.display = testModus ? '' : 'none';
            abspielen.style.display = testModus ? 'flex' : 'none';
            zeitleiste.setAttribute('aria-valuenow', morphT.toFixed(2));
        }

        function setErgebnisText(msg) {
            const el = document.getElementById('erkennung-out');
            if (!el) return;
            if (msg) { el.innerHTML = '<div class="erk-info">' + msg + '</div>'; return; }
            const teile = analysis.lines.map(l => {
                const e = zeilenErgebnis[l.lineIdx];
                if (!e) return '';
                if (e.fehler) return `<div class="erk-zeile"><b>Zeile ${l.lineIdx}</b>
                    <div class="erk-fehler">${e.fehler}</div></div>`;
                if (e.uebersprungen) return '';
                const z = e.zuordnung;
                const hinweis = '';
                return `<div class="erk-zeile"><b>Zeile ${l.lineIdx}</b>
                    <div class="erk-latex">${e.latex.replace(/</g, '&lt;')}</div>
                    <div class="${z.passt ? 'erk-ok' : 'erk-warn'}">${z.diagnose}${e.nachjustiert ? ' – Gruppierung an die Zeichenzahl angeglichen' : ''}</div>${hinweis}
                    <div class="erk-info">${e.atome.length} Zeichen gesetzt · ${e.ms} ms</div></div>`;
            });
            el.innerHTML = teile.join('') || '<div class="erk-info">–</div>';
        }

        // ── Vorlage: the formula to copy, shown above the writing area ──────
        function zeigeVorlage(hinweis) {
            if (anzeigeModus) return;
            let host = document.getElementById('vorlage-schicht');
            if (!host) {
                host = document.createElement('div');
                host.id = 'vorlage-schicht';
                // Doc: the template centred in x and y in the head strip; the
                // counter stays at the left edge
                // at least 84 px; a display-style sum with its limits needs more
                host.style.cssText = 'position:absolute;left:0;right:0;top:0;min-height:84px;padding:6px 0;box-sizing:border-box;' +
                    'pointer-events:none;display:flex;align-items:center;justify-content:center;color:#00d2ff';
                container.appendChild(host);
            }
            zeigeTafelPfeile();
            // Doc, 26.09.: "Erkennen nur im Frei mod" - in class Auto and the swipe
            // recognise, the examples bring their LaTeX. buttons-ultra.css pins
            // .cyber-btn to display:flex !important, so hiding needs !important too.
            const ek = document.getElementById('knopf-erkennen');
            if (ek) {
                if (modus === 'frei') ek.style.removeProperty('display');
                else ek.style.setProperty('display', 'none', 'important');
                // with LEEREN gone ERKENNEN is the card's only button - no empty box
                const karte = ek.closest('.instrument-card');
                if (karte) karte.style.display = modus === 'frei' ? '' : 'none';
            }
            // frei: nothing up there, the board is Doc's
            if (modus === 'frei') {
                host.style.display = 'none';
                host.innerHTML = '';
                zeigeRechenweg();
                return;
            }
            // beispiele: the template to copy; aufgaben: the task (AUFGABEN)
            // with what to solve for at the right edge
            const liste = testModus ? VORLAGEN : AUFGABEN, nr = testModus ? vorlageIdx : aufgabeIdx;
            const [slug, latex, nach] = liste[nr];
            // Doc, 26.09.: "7 von 20 ... und nach x - bring das links und rechts an die
            // Formel ran, mach's größer, in der Y-Mitte der Zeile; rechts 'umstellen
            // nach x'" - in class larger, placed beside the task by zeigeRechenweg
            const RAND = 'position:absolute;top:50%;transform:translateY(-50%);white-space:nowrap;' +
                `font-family:Orbitron,sans-serif;font-size:${aufgabenModus ? '1.2rem' : '0.8rem'};letter-spacing:0.1em;color:#8a93a3`;
            // Doc: "Font-Size überall gleich", "Gleichheitszeichen untereinander" -
            // in class the task is the first row of the working (zeigeRechenweg),
            // up here only the counter and what to solve for, on the task's height
            host.innerHTML = `<span style="${RAND};left:24px">` +
                `${aufgabenModus ? `Aufgabe ${nr - aufgabenBlock(nr).ab + 1} / ${aufgabenBlock(nr).bis - aufgabenBlock(nr).ab}` : `${nr + 1} / ${liste.length}`}${hinweis ? ' · ' + hinweis : ''}</span>` +      // Doc: "schreib links vor 4 von 20 Aufgabe"
                (testModus ? `<span id="vorlage-formel" style="font-size:2.4rem;color:${anzeige(INK)}"></span>` : '') +
                (nach ? `<span id="vorlage-nach" style="${RAND};right:24px">umstellen nach <span style="font-size:1.4em"></span></span>` : '');
            if (nach) {
                const v = host.querySelector('#vorlage-nach span');
                try { katex.render(nach, v, { throwOnError: false }); } catch (e) { v.textContent = nach; }
            }
            host.style.display = 'flex';
            if (aufgabenModus) {
                host.style.minHeight = '0';
                host.style.padding = '0';
                zeigeRechenweg();
                return;
            }
            host.style.minHeight = '84px';
            host.style.padding = '6px 0';
            host.style.top = '0';
            host.style.height = '';
            try { katex.render(alsDisplay(latex), document.getElementById('vorlage-formel'), { throwOnError: false }); }
            catch (e) { document.getElementById('vorlage-formel').textContent = latex; }
            // a long one (Navier-Stokes) shrinks until it clears the counter
            const h = host.getBoundingClientRect();
            const zaehler = host.querySelector('span'), nachEl = document.getElementById('vorlage-nach');
            const rand = Math.max(zaehler ? zaehler.getBoundingClientRect().right - h.left + 32 : 170,
                nachEl ? h.right - nachEl.getBoundingClientRect().left + 32 : 0);
            passeEin(document.getElementById('vorlage-formel'), host.clientWidth - 2 * rand);
            zeigeRechenweg();
        }

        // ── Working: the finished lines climb up under the task ─────────────
        // Doc, 25.09.: "wenn ich zum Beispiel mit vier Fingern nach oben schiebe,
        // dass diese Formel ... kleiner wird und als nächste Zeile für die Lösung
        // dieser Umformung oben steht". Each recognised line on the page becomes
        // one step: its typeset formula shrinks and flies up, its ink is gone,
        // the page is free for the next step. The steps line up at their first
        // equals sign, the way one writes a working on the board.
        function merkeRechenweg() {
            try { localStorage.setItem('vorrechnen-rechenweg', JSON.stringify(rechenweg)); } catch (_) {}
            zeigeHinweis();                    // a step more or less: the next one changes
        }
        // "3x+5=20" -> ["3x+5", "{}=20"]; the empty group keeps the space
        // before the "=". Only an "=" outside braces splits.
        function amGleich(latex) {
            let tiefe = 0;
            for (let i = 0; i < latex.length; i++) {
                const c = latex[i];
                if (c === '\\') { i++; continue; }
                if (c === '{') tiefe++;
                else if (c === '}') tiefe--;
                else if (c === '=' && tiefe === 0) return [latex.slice(0, i), '{}' + latex.slice(i)];
            }
            return [latex, ''];
        }
        // Doc, 26.09.: "die Zeilengröße müssen wir an den Bildschirm anpassen" - a
        // fixed number of ruled lines above the squares; the line height follows
        // the board's height (even, so the squares stay whole pixels). The paper
        // takes it as --zeile.
        const LINIEN = 11;                 // ruled lines above the squares
        let ZEILE = 64;                    // px between the ruled lines (zeileMessen)
        function zeileMessen() {
            const h = container.getBoundingClientRect().height;
            if (h > 0) ZEILE = Math.max(32, 2 * Math.floor(h * 2 / 3 / LINIEN / 2));
        }
        // Doc, 26.09.: first "Großbuchstaben mittig 80%", then "die 80% in der
        // Zeile sind offensichtlich zu groß ... Klammern ragen über die untere
        // Zeile" - a parenthesis (1 em in KaTeX, 0.75 above the baseline and 0.25
        // below) fills 85 % of a line, and the math axis - the middle of a
        // parenthesis, the bar of a fraction, the "=" - lies on the middle of the
        // line. Capitals come to about 60 %.
        const KLAMMER = 0.85;              // a parenthesis' share of a line
        const ACHSE_EM = 0.25;             // the math axis above the baseline, in em
        // px of KaTeX's em at full size; one size for the task and every step,
        // the flying line included
        const rechenEm = () => KLAMMER * ZEILE;
        // the font size around the formula (.katex sets itself 1.21 times that)
        const rechenSchrift = () => (rechenEm() / 1.21).toFixed(2) + 'px';
        // px from the baseline of a row at size s down to its ruled line
        const linieAb = s => ZEILE / 2 - ACHSE_EM * rechenEm() * s;
        // verborgenAb: steps from this index on are laid out but not yet shown -
        // they are where the flying lines land
        // Doc, 26.09.: "die Aufgabe direkt auf der Zeile" - every row sits in a
        // line of its own, and takes the lines above and below that its
        // fractions reach into. The "=" stay in one column (left cell ends
        // there, right starts).
        // Doc, 26.09.: "Wenn da steht x ist gleich irgendwas, dann ist das
        // offensichtlich das Ergebnis. Und das kann man sofort automatisch doppelt
        // unterstreichen" - the last step that reads VAR = something without VAR,
        // VAR being what the task asks for; never the task itself, not in Frei (no
        // task, no VAR). -1 when there is none.
        function ergebnisSchritt() {
            if (!aufgabenModus) return -1;
            const v = AUFGABEN[aufgabeIdx][2];
            for (let i = rechenweg.length - 1; i >= 0; i--) {
                const [l, r] = amGleich(rechenweg[i].latex.replace(UNGEFAEHR, '='));
                const links = l.replace(/\\displaystyle|[\s{}]/g, '');
                // every letter left once the commands (\frac, \cdot) are gone is a variable
                const rechts = r.replace(/^\{\}=/, '').replace(/\\[a-zA-Z]+/g, ' ');
                if (links === v && rechts.replace(/[\s{}]/g, '') && !rechts.includes(v)) return i;
            }
            return -1;
        }
        let rechenwegWartet = false;
        let rechenwegLinie = 0;            // the last line the working takes (schaetzeZiel)
        function zeigeRechenweg(verborgenAb) {
            if (anzeigeModus) return;

        // the tasks done, stacked upwards from the top of the board

            const dy = aktiv.reduce((s, g) => s + g.y - g.y0, 0) / aktiv.length;

        async function beamerStart() {
            if (!window.getScreenDetails) { beamerAngebot('Dieser Browser kann keinen zweiten Bildschirm ansteuern – bitte Chrome oder Edge.', false); return; }
            let sd = null;

            if (!sd) { beamerAngebot('Die Seite darf keine Fenster auf andere Bildschirme legen – bitte „Fenster verwalten“ erlauben (Schloss in der Adressleiste).', true); return; }
            const lap = sd.screens.find(x => x.isInternal) || sd.currentScreen;
            const beamer = sd.screens.find(x => x !== lap);
            if (!beamer) { beamerAngebot('Kein zweiter Bildschirm gefunden. Den Beamer auf „Erweitern“ stellen, nicht „Duplizieren“ (Windows: Win + P, Mac: ⌘ F1) – dann noch einmal.', true); return; }

        function vergissVerlauf() { verlauf.length = 0; vorwaerts.length = 0; }

        // Doc, 26.09.: "Da ich das HP jetzt so aufgestellt habe, dass die Tastatur nach

        function neuLaden() {

        function railKnopf(id, text, inhalt, tun, neueGruppe) {

        function vollbildKnopf(e) {

            if (screen.addEventListener) screen.addEventListener('change', nochmal);

        // lit = the rail's hover look; the central rule has !important, so this too
