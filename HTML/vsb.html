<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>VSB — vita somnium breve</title>
    <link rel="icon" type="image/svg+xml" href="resources/favicon.svg">
    <link rel="icon" type="image/png" sizes="256x256" href="resources/favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            /* neutral anthracite on Doc's explicit wish (overrides the usual navy) */
            background: radial-gradient(120% 100% at 50% 30%, rgb(36, 37, 40), rgb(16, 17, 19));
            display: flex;
            align-items: center;
            justify-content: center;
        }

        svg.seal {
            width: min(88vw, 88vh);
            height: min(88vw, 88vh);
            filter: drop-shadow(10px 18px 44px rgba(0, 0, 0, 0.6));   /* same upper-left light */
        }

        svg.seal { cursor: pointer; }

        @media print {
            body { background: #fff; }

            svg.seal { filter: none; }
        }
    </style>
</head>

<body>
    <!-- the VSB seal, same artwork as on the hiking-checklist cards -->
    <svg class="seal" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img"
        aria-label="VSB Siegel — vita somnium breve">
        <defs>
            <path id="vsb-arc" d="M 14 50 A 36 36 0 0 1 86 50" fill="none"/>
            <!-- bottom arc, same left-to-right direction but through the bottom: glyphs stay upright -->
            <path id="vsb-arc-b" d="M 14 50 A 36 36 0 0 0 86 50" fill="none"/>
            <!-- ONE light source, upper-left ~35°: disc highlight, gold gradient axis and
                 drop-shadow direction all agree (the tree PNG has the same gradient baked in) -->
            <radialGradient id="vsb-green" cx="38%" cy="30%" r="80%">
                <stop offset="0%" stop-color="rgb(8,92,52)"/>
                <stop offset="100%" stop-color="rgb(0,48,27)"/>
            </radialGradient>
            <radialGradient id="vsb-red" cx="38%" cy="30%" r="80%">
                <stop offset="0%" stop-color="rgb(158,34,24)"/>
                <stop offset="100%" stop-color="rgb(88,14,10)"/>
            </radialGradient>
            <linearGradient id="vsb-gold" x1="0.1" y1="0" x2="0.5" y2="1">
                <stop offset="0%" stop-color="#F3DC8B"/>
                <stop offset="50%" stop-color="#D4AF37"/>
                <stop offset="100%" stop-color="#9A7A24"/>
            </linearGradient>
            <filter id="vsb-emb" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0.5" dy="0.7" stdDeviation="0.35" flood-color="#0b0704" flood-opacity="0.6"/>
            </filter>
        </defs>
        <circle id="seal-disc" cx="50" cy="50" r="49" fill="url(#vsb-green)"/>
        <circle cx="50" cy="50" r="48" fill="none" stroke="url(#vsb-gold)" stroke-width="2.5" filter="url(#vsb-emb)"/>
        <circle cx="50" cy="50" r="43" fill="none" stroke="url(#vsb-gold)" stroke-width="0.8" filter="url(#vsb-emb)"/>
        <text font-family="'Times New Roman', Times, serif" font-size="7.25" letter-spacing="1.1"
            fill="#D4AF37" filter="url(#vsb-emb)">
            <textPath href="#vsb-arc" startOffset="50.49%" text-anchor="middle">VITA · SOMNIUM · BREVE</textPath>
        </text>
        <image href="tracker/vsb-yggdrasil-gold.png" x="24" y="24" width="52" height="52" filter="url(#vsb-emb)"/>
        <!-- spacing via en-spaces, NOT letter-spacing: trailing letter-spacing after the
             last glyph would shift the centered text along the arc (V ends up higher than B) -->
        <text font-family="'Times New Roman', Times, serif" font-size="9.5"
            fill="#D4AF37" filter="url(#vsb-emb)">
            <textPath href="#vsb-arc-b" startOffset="50%" text-anchor="middle">V&#8194;·&#8194;S&#8194;·&#8194;B</textPath>
        </text>
    </svg>

    <script>
        'use strict';
        // click toggles English Green <-> English Red, choice persists
        const disc = document.getElementById('seal-disc');
        const KEY = 'vsb.variant';
        function apply(v) { disc.setAttribute('fill', v === 'red' ? 'url(#vsb-red)' : 'url(#vsb-green)'); }
        let variant = localStorage.getItem(KEY) || 'green';
        apply(variant);
        document.querySelector('svg.seal').addEventListener('click', () => {
            variant = variant === 'green' ? 'red' : 'green';
            localStorage.setItem(KEY, variant);
            apply(variant);
        });
    </script>
</body>

</html>
