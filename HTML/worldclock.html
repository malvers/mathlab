<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOC ALVERS MATHE-LABORE | World Clock</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Raleway:wght@400;700;900&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="resources/favicon.png">
    <link rel="stylesheet" href="js/cyber-layout.css">
    <link rel="stylesheet" href="js/buttons-ultra.css">
    <link rel="stylesheet" href="js/cyber-lab-overrides.css">
    <link rel="stylesheet" href="js/branding.styles.extracted.css">
    <link rel="stylesheet" href="js/lab-shell-minimal.css">
    <style>
        body, #canvas-container, #side-panel {
            background: #000616 !important; /* EXACT match for NASA image background */
        }
        .cyber-grid {
            display: none;
        }
        #math-coach-box {
            background: rgba(0, 6, 22, 0.9);
            border-color: rgba(0, 255, 255, 0.2);
            pointer-events: none; /* Don't block clicks */
        }
    </style>
</head>

<body>
    <nav id="mini-rail">
        <div class="nav-btn" onclick="toggleSidebar()" title="Toggle Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </div>
    </nav>

    <aside id="side-panel">
        <header id="sidebar-header"></header>
        <div id="ui-container"></div>
    </aside>

    <main id="main-content">
        <div id="canvas-container">
            <div class="cyber-grid"></div>
            <div id="math-coach-box">
                <div class="coach-title" id="coach-title-slot"></div>
                <div id="coach-content" class="coach-message"></div>
            </div>
            <canvas id="canvas"></canvas>
        </div>
    </main>

    <script src="js/cyber-left-chrome.js"></script>
    <script src="js/branding/briefings.js"></script>
    <script src="js/branding/overlays.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/i18n-de.js"></script>
    <script src="js/i18n-en.js"></script>
    <script src="js/i18n-es.js"></script>
    <script src="js/i18n-fr.js"></script>
    <script src="js/i18n-it.js"></script>
    <script src="js/i18n-pt.js"></script>
    <script src="js/i18n-sw.js"></script>
    <script src="js/i18n-tr.js"></script>
    <script src="js/i18n-nl.js"></script>
    <script src="js/branding.js"></script>
    <script src="js/ui.js"></script>
    <script>
        function toggleSidebar() {
            const panel = document.getElementById('side-panel');
            panel.classList.toggle('collapsed');
            if (window.CyberLeftChrome && typeof CyberLeftChrome.publishResolvedScale === 'function') {
                CyberLeftChrome.publishResolvedScale();
            }
            setTimeout(() => {
                window.dispatchEvent(new Event('resize'));
                if (typeof init === 'function') init();
                if (window.CyberLeftChrome && typeof CyberLeftChrome.publishResolvedScale === 'function') {
                    CyberLeftChrome.publishResolvedScale();
                }
            }, 400);
        }

        CyberBranding.init({
            useExternalStyles: true,
            title: CyberI18n.get('ui.coach_title'),
            subtitle: 'World Clock',
        });
        CyberUI.init();

        (function setCoachTitleFromI18n() {
            const el = document.getElementById('coach-title-slot');
            if (el && typeof CyberI18n !== 'undefined' && typeof CyberI18n.get === 'function') {
                el.textContent = CyberI18n.get('ui.description');
            }
        })();

        if (window.CyberLeftChrome && typeof CyberLeftChrome.configure === 'function') {
            CyberLeftChrome.configure({ viewportOnlyZoom: true });
        }

        // --- SETUP ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');

        function resizeCanvasToContainer() {
            const dpr = window.devicePixelRatio || 1;
            const rect = container.getBoundingClientRect();
            const w = Math.max(1, rect.width);
            const h = Math.max(1, rect.height);
            canvas.width = Math.floor(w * dpr);
            canvas.height = Math.floor(h * dpr);
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
        }

        // --- WORLD CLOCK LOGIC ---
        const mapImg = new Image();
        mapImg.src = 'resources/worldmap_polar.png';
        let mapLoaded = false;
        mapImg.onload = () => { mapLoaded = true; init(); };

        const cities = [
            { name: "Ankara\nKairo", lon: 30, color: "black" },
            { name: "Dresden", lon: 15, color: "#ffcc00", highlight: true },
            { name: "Dakar\nMadeira", lon: 0, color: "black" }, // London/Dakar Slot
            { name: "Azoren", lon: -15, color: "black" },
            { name: "Kapverd.\nInseln", lon: -30, color: "black" },
            { name: "Rio de\nJaneiro", lon: -45, color: "black" },
            { name: "Caracas\nSantiago\nde Chile", lon: -60, color: "black" },
            { name: "New York", lon: -75, color: "black" },
            { name: "Chicago", lon: -90, color: "black" },
            { name: "Santa Fé", lon: -105, color: "black" },
            { name: "San\nFrancisco", lon: -120, color: "black" },
            { name: "Dawson", lon: -135, color: "black" },
            { name: "Fairbanks\nHonolulu", lon: -150, color: "black" },
            { name: "Samoa", lon: -165, color: "black" },
            { name: "Neu\nseeland", lon: 180, color: "black" },
            { name: "Salomon-\ninseln", lon: 165, color: "black" },
            { name: "Sydney", lon: 150, color: "black" },
            { name: "Tokio", lon: 135, color: "black" },
            { name: "Shanghai", lon: 120, color: "black" },
            { name: "Bangkok", lon: 105, color: "black" },
            { name: "Bombay\nKalkutta\n-30 Min", lon: 90, color: "black" }, // Moved to full hour slot 16
            { name: "Karachi\nUralsk", lon: 75, color: "black" },
            { name: "Baku", lon: 60, color: "black" },
            { name: "Moskau\nBagdad", lon: 45, color: "black" }
        ];

        let isDragging = false;
        let lastAngle = 0;
        let manualOffset = 0; // in minutes
        let autoRotation = 0;
        let autoRotationEnabled = false;

        function getDisplayTime() {
            const now = new Date();
            return new Date(now.getTime() + manualOffset * 60000);
        }
        function draw() {
            if (!mapLoaded) return;
            const rect = container.getBoundingClientRect();
            const w = rect.width;
            const h = rect.height;
            const size = Math.min(w, h) * 0.8;
            const r = size / 2;
            const cx = w / 2;
            const cy = h / 2;

            ctx.clearRect(0, 0, w, h);

            const time = getDisplayTime();
            const utcHours = time.getUTCHours() + time.getUTCMinutes() / 60 + time.getUTCSeconds() / 3600;
            
            ctx.save();
            ctx.translate(cx, cy);

            // 1. Draw Map (Rotating)
            if (autoRotationEnabled) autoRotation -= 0.02; 
            // Add +1 to account for Summer Time (CEST is UTC+2, Lon 15 is UTC+1)
            const mapRotation = (12 - (utcHours + 1)) * 15 + autoRotation;
            
            ctx.save();
            ctx.rotate(mapRotation * Math.PI / 180);
            
            // Draw Map Image (Slightly Darker)
            ctx.save();
            ctx.globalAlpha = 0.8;
            ctx.rotate(-Math.PI / 2); 
            ctx.drawImage(mapImg, -r, -r, size, size);
            ctx.restore();

            // 2. Draw City Markers (Plaques) - GLUED TO EARTH
            cities.forEach(city => {
                // FLIPPED: Use -city.lon because the hour ring is reversed (CCW)
                const cityAngle = (-city.lon) * Math.PI / 180 - Math.PI / 2;
                const markerR = (r * 0.9) - 6; // Moved 6px inward
                const circleRadius = 38; // Back to standard size for all
                const mx = Math.cos(cityAngle) * markerR;
                const my = Math.sin(cityAngle) * markerR;

                // Draw Precision Triangle (Pointer) - LARGER
                ctx.save();
                ctx.fillStyle = "white";
                ctx.beginPath();
                // Tip of triangle further out
                const tipR = markerR + circleRadius + 6;
                const baseR = markerR + circleRadius - 12;
                const spread = 0.06; // Wider spread
                
                ctx.moveTo(Math.cos(cityAngle) * tipR, Math.sin(cityAngle) * tipR);
                ctx.lineTo(Math.cos(cityAngle - spread) * baseR, Math.sin(cityAngle - spread) * baseR);
                ctx.lineTo(Math.cos(cityAngle + spread) * baseR, Math.sin(cityAngle + spread) * baseR);
                ctx.closePath();
                ctx.fill();
                ctx.restore();

                const grad = ctx.createRadialGradient(mx, my, 0, mx, my, circleRadius);
                if (city.highlight) {
                    grad.addColorStop(0, '#ffaa00'); 
                    grad.addColorStop(1, '#e68a00'); 
                    
                    ctx.save();
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#e68a00';
                } else {
                    grad.addColorStop(0, '#0033aa'); 
                    grad.addColorStop(1, '#000811'); 
                }

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(mx, my, circleRadius, 0, Math.PI * 2);
                ctx.fill();
                if (city.highlight) ctx.restore();
                
                ctx.save();
                ctx.translate(mx, my);
                // Inverse the map rotation to keep text level
                ctx.rotate(-mapRotation * Math.PI / 180);
                
                ctx.fillStyle = (city.highlight) ? "#000616" : "#eee";
                ctx.font = "400 11px Raleway";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                
                if (city.highlight) {
                    // Special case for Dresden: BLACK WEIGHT Name + Regular Time
                    const localTime = new Date(time.getTime() + (city.lon / 15 - 1) * 3600000 + 3600000);
                    const timeStr = localTime.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    
                    ctx.fillStyle = "#000616";
                    // Line 1: Dresden (Weight 900, Size 13px)
                    ctx.font = "900 13px Raleway";
                    ctx.fillText("Dresden", 0, -8);
                    
                    // Line 2: Time (Orbitron)
                    ctx.font = "400 11px Orbitron";
                    ctx.fillText(timeStr, 0, 8);
                } else {
                    ctx.fillStyle = "#eee";
                    ctx.font = "bold 11px Raleway"; // All city names now bold
                    const lines = city.name.split('\n');
                    lines.forEach((line, i) => {
                        ctx.fillText(line, 0, (i - (lines.length-1)/2) * 12);
                    });
                }
                ctx.restore();
            });
            ctx.restore(); // End map rotation (Earth + Glued Markers)
            // 3. Draw Numbers Ring (Static) - 80% Distance Adjustment
            ctx.font = "400 28px Orbitron"; 
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            for (let i = 1; i <= 24; i++) {
                const angle = (12 - i) * (Math.PI * 2 / 24) - Math.PI / 2;
                const tx = Math.cos(angle) * (r * 1.15 - 4); 
                const ty = Math.sin(angle) * (r * 1.15 - 4);
                
                // All hours in Deeper Orange with Glow
                ctx.save();
                ctx.fillStyle = "#e68a00"; // Burnt Orange
                ctx.shadowBlur = 10;
                ctx.shadowColor = "#e68a00";
                ctx.fillText(i, tx, ty);
                ctx.restore();
                
                // Hour Ticks
                ctx.save();
                ctx.strokeStyle = 'rgba(255,255,255,0.4)';
                ctx.beginPath();
                ctx.moveTo(Math.cos(angle) * (r * 1.02 - 4), Math.sin(angle) * (r * 1.02 - 4));
                ctx.lineTo(Math.cos(angle) * (r * 1.08 - 4), Math.sin(angle) * (r * 1.08 - 4));
                ctx.stroke();
                ctx.restore();

                // Half-Hour Ticks (Only Tics)
                const halfAngle = angle - (Math.PI / 24); 
                ctx.save();
                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.beginPath();
                ctx.moveTo(Math.cos(halfAngle) * (r * 1.02 - 4), Math.sin(halfAngle) * (r * 1.02 - 4));
                ctx.lineTo(Math.cos(halfAngle) * (r * 1.05 - 4), Math.sin(halfAngle) * (r * 1.05 - 4));
                ctx.stroke();
                ctx.restore();
            }

            ctx.restore(); // Final End Center Translate
            requestAnimationFrame(draw);
        }

        function setupUI() {
            const container = document.getElementById('ui-container');
            if (container) container.innerHTML = ''; // Clear previous to avoid duplicates
            
            const BRAND_BLUE = "#00d2ff";
            CyberUI.createCard('ui-container', 'Steuerung', `
                <div style="display: flex; flex-direction: column; gap: 10px; align-items: stretch; padding: 0;">
                    <button id="rotation-btn" class="cyber-btn" onclick="toggleRotation()" 
                            style="width: 100%; border-color: var(--neon-blue); color: var(--neon-blue); padding: 8px;">
                        ROTATION START
                    </button>
                    
                    <button class="cyber-btn" onclick="manualReset()" 
                            style="width: 100%; border-color: #ff3366; color: #ff3366; padding: 8px;">
                        RESET
                    </button>
                </div>
            `, BRAND_BLUE);
        }

        function toggleRotation() {
            autoRotationEnabled = !autoRotationEnabled;
            const btn = document.getElementById('rotation-btn');
            if (btn) {
                btn.innerText = autoRotationEnabled ? 'ROTATION STOP' : 'ROTATION START';
                btn.style.borderColor = autoRotationEnabled ? '#adff2f' : 'var(--neon-blue)';
                btn.style.color = autoRotationEnabled ? '#adff2f' : 'var(--neon-blue)';
                btn.style.boxShadow = autoRotationEnabled ? '0 0 15px rgba(173, 255, 47, 0.4)' : 'none';
            }
        }

        function manualReset() {
            manualOffset = 0;
            autoRotation = 0;
            autoRotationEnabled = false;
            const btn = document.getElementById('rotation-btn');
            if (btn) {
                btn.innerText = 'ROTATION START';
                btn.style.borderColor = 'var(--neon-blue)';
                btn.style.color = 'var(--neon-blue)';
                btn.style.boxShadow = 'none';
            }
        }

        let isAnimating = false;
        function init() {
            resizeCanvasToContainer();
            setupUI(); // Mount the sidebar controls
            if (!isAnimating && mapLoaded) {
                isAnimating = true;
                draw();
            }
        }

        window.addEventListener('resize', init);
        document.fonts.ready.then(init);
        

        // Debug: Feedback and Reload on mouse enter canvas
        const debugText = document.createElement('div');
        debugText.style.position = 'fixed';
        debugText.style.top = '10px';
        debugText.style.left = '10px';
        debugText.style.color = 'lime';
        debugText.style.fontFamily = 'Orbitron';
        debugText.style.zIndex = '9999';
        debugText.style.display = 'none'; // Hidden per request
        debugText.textContent = 'WAITING FOR MOUSE...';
        document.body.appendChild(debugText);

        window.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            if (e.clientX >= rect.left && e.clientX <= rect.right && 
                e.clientY >= rect.top && e.clientY <= rect.bottom) {
                if (debugText.textContent !== 'MOUSE ENTERED') {
                    debugText.textContent = 'MOUSE ENTERED';
                    console.log('MOUSE ENTERED');
                    setTimeout(() => window.location.reload(), 300);
                }
            }
        });

        // UI Controls & Interaction
        CyberUI.on('reset', manualReset);
        
        function getMouseAngle(e) {
            const rect = container.getBoundingClientRect();
            const clientX = (e.clientX !== undefined) ? e.clientX : (e.touches ? e.touches[0].clientX : 0);
            const clientY = (e.clientY !== undefined) ? e.clientY : (e.touches ? e.touches[0].clientY : 0);
            return Math.atan2(clientY - (rect.top + rect.height/2), clientX - (rect.left + rect.width/2));
        }

        function handleStart(e) {
            isDragging = true;
            lastAngle = getMouseAngle(e);
        }

        function handleMove(e) {
            if (!isDragging) return;
            const currentAngle = getMouseAngle(e);
            let delta = currentAngle - lastAngle;
            while (delta > Math.PI) delta -= Math.PI * 2;
            while (delta < -Math.PI) delta += Math.PI * 2;
            manualOffset += (delta / (Math.PI * 2)) * 1440;
            lastAngle = currentAngle;
        }

        function handleEnd() {
            isDragging = false;
        }

        container.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);

        container.addEventListener('touchstart', (e) => { handleStart(e); }, {passive: false});
        window.addEventListener('touchmove', (e) => { if(isDragging) e.preventDefault(); handleMove(e); }, {passive: false});
        window.addEventListener('touchend', handleEnd);
    </script>
</body>

</html>
