<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOC ALVERS MATHE-LABORE | World Clock</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Raleway:wght@400;700;900&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="resources/favicon.png">
    <link rel="stylesheet" href="js/cyber-layout.css">
    <link rel="stylesheet" href="js/buttons-ultra.css">
    <link rel="stylesheet" href="js/cyber-lab-overrides.css">
    <link rel="stylesheet" href="js/branding.styles.extracted.css">
    <link rel="stylesheet" href="js/lab-shell-minimal.css">
    <style>
        body, #canvas-container, #side-panel {
            background: #000616 !important; /* EXACT match for NASA image background */
        }
        .cyber-grid {
            display: none;
        }
        #math-coach-box {
            background: rgba(0, 6, 22, 0.9);
            border-color: rgba(0, 255, 255, 0.2);
            pointer-events: none; /* Don't block clicks */
        }
    </style>
</head>

<body>
    <nav id="mini-rail">
        <div class="nav-btn" onclick="toggleSidebar()" title="Toggle Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </div>
    </nav>

    <aside id="side-panel">
        <header id="sidebar-header"></header>
        <div id="ui-container"></div>
    </aside>

    <main id="main-content">
        <div id="canvas-container">
            <div class="cyber-grid"></div>
            <div id="math-coach-box">
                <div class="coach-title" id="coach-title-slot"></div>
                <div id="coach-content" class="coach-message"></div>
            </div>
            <canvas id="canvas"></canvas>
        </div>
    </main>

    <script src="js/cyber-left-chrome.js"></script>
    <script src="js/branding/briefings.js"></script>
    <script src="js/branding/overlays.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/i18n-de.js"></script>
    <script src="js/i18n-en.js"></script>
    <script src="js/i18n-es.js"></script>
    <script src="js/i18n-fr.js"></script>
    <script src="js/i18n-it.js"></script>
    <script src="js/i18n-pt.js"></script>
    <script src="js/i18n-sw.js"></script>
    <script src="js/i18n-tr.js"></script>
    <script src="js/i18n-nl.js"></script>
    <script src="js/branding.js"></script>
    <script src="js/ui.js"></script>
    <script>
        function toggleSidebar() {
            const panel = document.getElementById('side-panel');
            panel.classList.toggle('collapsed');
            if (window.CyberLeftChrome && typeof CyberLeftChrome.publishResolvedScale === 'function') {
                CyberLeftChrome.publishResolvedScale();
            }
            setTimeout(() => {
                window.dispatchEvent(new Event('resize'));
                if (typeof init === 'function') init();
                if (window.CyberLeftChrome && typeof CyberLeftChrome.publishResolvedScale === 'function') {
                    CyberLeftChrome.publishResolvedScale();
                }
            }, 400);
        }

        CyberBranding.init({
            useExternalStyles: true,
            title: CyberI18n.get('ui.coach_title'),
            subtitle: 'World Clock',
        });
        CyberUI.init();

        (function setCoachTitleFromI18n() {
            const el = document.getElementById('coach-title-slot');
            if (el && typeof CyberI18n !== 'undefined' && typeof CyberI18n.get === 'function') {
                el.textContent = CyberI18n.get('ui.description');
            }
        })();

        if (window.CyberLeftChrome && typeof CyberLeftChrome.configure === 'function') {
            CyberLeftChrome.configure({ viewportOnlyZoom: true });
        }

        // --- SETUP ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');

        function resizeCanvasToContainer() {
            const dpr = window.devicePixelRatio || 1;
            const rect = container.getBoundingClientRect();
            const w = Math.max(1, rect.width);
            const h = Math.max(1, rect.height);
            canvas.width = Math.floor(w * dpr);
            canvas.height = Math.floor(h * dpr);
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
        }

        // --- WORLD CLOCK LOGIC ---
        const mapImg = new Image();
        mapImg.src = 'resources/worldmap_polar.png';
        let mapLoaded = false;
        mapImg.onload = () => { mapLoaded = true; init(); };

        const cities = [
            { name: "Kairo", lon: 30, tz: "Africa/Cairo", color: "black" },
            { name: "Dresden", lon: 15, tz: "Europe/Berlin", color: "#ffcc00", highlight: true },
            { name: "Dakar", lon: 0, tz: "Africa/Dakar", color: "black" }, 
            { name: "Azoren", lon: -15, tz: "Atlantic/Azores", color: "black" },
            { name: "Kapverden", lon: -30, tz: "Atlantic/Cape_Verde", color: "black" },
            { name: "Rio", lon: -45, tz: "America/Sao_Paulo", color: "black" },
            { name: "Caracas", lon: -60, tz: "America/Caracas", color: "black" },
            { name: "New York", lon: -75, tz: "America/New_York", color: "black" },
            { name: "Chicago", lon: -90, tz: "America/Chicago", color: "black" },
            { name: "Santa Fé", lon: -105, tz: "America/Denver", color: "black" },
            { name: "San\nFrancisco", lon: -120, tz: "America/Los_Angeles", color: "black" },
            { name: "Dawson", lon: -135, tz: "America/Dawson", color: "black" },
            { name: "Honolulu", lon: -150, tz: "Pacific/Honolulu", color: "black" },
            { name: "Samoa", lon: -165, tz: "Pacific/Samoa", color: "black" },
            { name: "Neu\nseeland", lon: 180, tz: "Pacific/Auckland", color: "black" },
            { name: "Salomon-\ninseln", lon: 165, tz: "Pacific/Guadalcanal", color: "black" },
            { name: "Sydney", lon: 150, tz: "Australia/Sydney", color: "black" },
            { name: "Tokio", lon: 135, tz: "Asia/Tokyo", color: "black" },
            { name: "Shanghai", lon: 120, tz: "Asia/Shanghai", color: "black" },
            { name: "Bangkok", lon: 105, tz: "Asia/Bangkok", color: "black" },
            { name: "Bombay", lon: 90, tz: "Asia/Kolkata", color: "black" }, 
            { name: "Karachi", lon: 75, tz: "Asia/Karachi", color: "black" },
            { name: "Baku", lon: 60, tz: "Asia/Baku", color: "black" },
            { name: "Bagdad", lon: 45, tz: "Asia/Baghdad", color: "black" }
        ];

        function getDSTLabel(tz) {
            if (!tz) return "";
            try {
                const parts = new Intl.DateTimeFormat('de-DE', {
                    timeZone: tz,
                    timeZoneName: 'long'
                }).formatToParts(new Date());
                const tzName = parts.find(p => p.type === 'timeZoneName').value;
                return tzName.includes('Sommerzeit') ? "SZ" : "WZ";
            } catch (e) { return ""; }
        }

        let manualOffset = 0; // in minutes
        let autoRotation = 0;
        let autoRotationEnabled = false;
        let isMouseDown = false;
        let lastMouseAngle = 0;
        let isReturning = false;
        let cityFontGray = 200; // Dynamic gray for city labels
        let ringFontGray = 222; // Dynamic gray for standard ring hours
        let selectedCity = null; // Currently clicked city

        function getDisplayTime() {
            const now = new Date();
            return new Date(now.getTime() + manualOffset * 60000);
        }

        function getMouseAngle(e) {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - (rect.left + rect.width / 2);
            const my = e.clientY - (rect.top + rect.height / 2);
            return Math.atan2(my, mx);
        }

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - (rect.left + rect.width / 2);
            const my = e.clientY - (rect.top + rect.height / 2);
            const dist = Math.sqrt(mx*mx + my*my);
            const mouseAngle = Math.atan2(my, mx) * 180 / Math.PI;

            // Hit test for cities
            let hit = false;
            const size = Math.min(rect.width, rect.height) * 0.8;
            const r = size / 2;
            const time = getDisplayTime();
            const utcHours = time.getUTCHours() + time.getUTCMinutes() / 60 + time.getUTCSeconds() / 3600;
            const mapRotation = (12 - (utcHours + 1)) * 15 + autoRotation;

            cities.forEach(city => {
                const cityAngle = (city.lon + mapRotation - 90);
                let diff = (mouseAngle - cityAngle + 180) % 360 - 180;
                if (diff < -180) diff += 360;
                
                // If distance is near the plaques (r*0.92) and angle is close
                if (dist > r * 0.85 && dist < r * 1.05 && Math.abs(diff) < 6) {
                    selectedCity = city;
                    hit = true;
                }
            });

            if (!hit) selectedCity = null;

            isMouseDown = true;
            isReturning = false; 
            lastMouseAngle = Math.atan2(my, mx);
            autoRotationEnabled = false;
            const btn = document.getElementById('rotation-btn');
            if (btn) {
                btn.innerText = 'ROTATION START';
                btn.style.borderColor = 'var(--neon-blue)';
                btn.style.color = 'var(--neon-blue)';
                btn.style.boxShadow = 'none';
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isMouseDown) {
                const currentAngle = getMouseAngle(e);
                let delta = currentAngle - lastMouseAngle;
                if (delta > Math.PI) delta -= Math.PI * 2;
                if (delta < -Math.PI) delta += Math.PI * 2;
                
                manualOffset -= delta * (1440 / (Math.PI * 2));
                lastMouseAngle = currentAngle;
            }
        });

        window.addEventListener('mouseup', () => {
            isMouseDown = false;
            isReturning = true; // Start smooth return
        });

        function draw() {
            if (!mapLoaded) return;

            // Smooth Return Logic
            if (isReturning && !isMouseDown) {
                if (Math.abs(manualOffset) < 0.1) {
                    manualOffset = 0;
                    isReturning = false;
                } else {
                    manualOffset *= 0.92; // Smooth exponential decay back to 0
                }
            }

            const time = getDisplayTime();
            const utcHours = time.getUTCHours() + time.getUTCMinutes() / 60 + time.getUTCSeconds() / 3600;
            
            const rect = canvas.getBoundingClientRect();
            const w = rect.width;
            const h = rect.height;
            const size = Math.min(w, h) * 0.8;
            const r = size / 2;
            const cx = w / 2;
            const cy = h / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.save();
            ctx.translate(cx, cy);

            // 1. Draw Map (Rotating)
            if (autoRotationEnabled) autoRotation -= 0.02; 
            // Add +1 to account for Summer Time (CEST is UTC+2, Lon 15 is UTC+1)
            const mapRotation = (12 - (utcHours + 1)) * 15 + autoRotation;
            
            ctx.save();
            ctx.rotate(mapRotation * Math.PI / 180);
            
            // Draw Map Image (Slightly Darker)
            ctx.save();
            ctx.globalAlpha = 0.8;
            ctx.rotate(-Math.PI / 2); 
            ctx.drawImage(mapImg, -r, -r, size, size);
            ctx.restore();

            // 2. Draw City Markers (Plaques) - GLUED TO EARTH
            cities.forEach(city => {
                // FLIPPED: Use -city.lon because the hour ring is reversed (CCW)
                const cityAngle = (-city.lon) * Math.PI / 180 - Math.PI / 2;
                const markerR = (r * 0.9) - 7; // Moved 7px inward
                const circleRadius = 38; // Back to standard size for all
                const mx = Math.cos(cityAngle) * markerR;
                const my = Math.sin(cityAngle) * markerR;

                // Draw Precision Triangle (Pointer) - LARGER
                ctx.save();
                ctx.fillStyle = "white";
                ctx.beginPath();
                // Tip of triangle further out
                const tipR = markerR + circleRadius + 6;
                const baseR = markerR + circleRadius - 12;
                const spread = 0.06; // Wider spread
                
                ctx.moveTo(Math.cos(cityAngle) * tipR, Math.sin(cityAngle) * tipR);
                ctx.lineTo(Math.cos(cityAngle - spread) * baseR, Math.sin(cityAngle - spread) * baseR);
                ctx.lineTo(Math.cos(cityAngle + spread) * baseR, Math.sin(cityAngle + spread) * baseR);
                ctx.closePath();
                ctx.fill();
                ctx.restore();

                const grad = ctx.createRadialGradient(mx, my, 0, mx, my, circleRadius);
                if (city.highlight) {
                    grad.addColorStop(0, '#ffaa00'); 
                    grad.addColorStop(1, '#e68a00'); 
                    
                    ctx.save();
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#e68a00';
                } else {
                    grad.addColorStop(0, '#0033aa'); 
                    grad.addColorStop(1, '#000811'); 
                }

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(mx, my, circleRadius, 0, Math.PI * 2);
                ctx.fill();
                if (city.highlight) ctx.restore();
                
                ctx.save();
                ctx.translate(mx, my);
                // Inverse the map rotation to keep text level
                ctx.rotate(-mapRotation * Math.PI / 180);
                
                let lines = city.name.split('\n');
                if (city.highlight) {
                    const timeStr = time.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
                    lines.push(timeStr);
                }
                
                const dst = getDSTLabel(city.tz);
                if (city.highlight) {
                    ctx.fillStyle = "#333333";
                } else if (dst === "SZ") {
                    ctx.fillStyle = "#ffaa00"; // Orange for Summer Time
                } else {
                    ctx.fillStyle = `rgb(${cityFontGray},${cityFontGray},${cityFontGray})`;
                }
                ctx.font = (city.highlight) ? "900 12px Orbitron" : "bold 11px Orbitron";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                
                lines.forEach((line, i) => {
                    ctx.fillText(line, 0, (i - (lines.length-1)/2) * 14);
                });
                ctx.restore();
            });
            ctx.restore(); // End map rotation (Earth + Glued Markers)
            // 3. Draw Numbers Ring (Static) - 80% Distance Adjustment
            ctx.font = "400 28px Orbitron"; 
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            for (let i = 1; i <= 24; i++) {
                const angle = (12 - i) * (Math.PI * 2 / 24) - Math.PI / 2;
                const tx = Math.cos(angle) * (r * 1.15 - 7); 
                const ty = Math.sin(angle) * (r * 1.15 - 7);
                
                let color = `rgb(${ringFontGray},${ringFontGray},${ringFontGray})`;
                let glow = false;
                
                if (i === 12) { color = "#ffaa00"; glow = true; }
                else if (i === 6) { color = "#00aa00"; glow = true; }
                else if (i === 24) { color = "#00aaaa"; glow = true; }
                else if (i === 18) { color = "#aa00aa"; glow = true; }
                
                ctx.save();
                ctx.fillStyle = color;
                if (glow) {
                    ctx.shadowBlur = (i === 12) ? 15 : 10;
                    ctx.shadowColor = color;
                }
                ctx.fillText(i, tx, ty);
                ctx.restore();
                
                // Hour Ticks
                ctx.save();
                ctx.strokeStyle = 'rgba(255,255,255,0.4)';
                ctx.beginPath();
                ctx.moveTo(Math.cos(angle) * (r * 1.02 - 5), Math.sin(angle) * (r * 1.02 - 5));
                ctx.lineTo(Math.cos(angle) * (r * 1.08 - 5), Math.sin(angle) * (r * 1.08 - 5));
                ctx.stroke();
                ctx.restore();

                // Half-Hour Ticks (Only Tics)
                const halfAngle = angle - (Math.PI / 24); 
                ctx.save();
                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.beginPath();
                ctx.moveTo(Math.cos(halfAngle) * (r * 1.02 - 5), Math.sin(halfAngle) * (r * 1.02 - 5));
                ctx.lineTo(Math.cos(halfAngle) * (r * 1.05 - 5), Math.sin(halfAngle) * (r * 1.05 - 5));
                ctx.stroke();
                ctx.restore();
            }

            ctx.restore(); // Restore from main translation
            
            // 7. Draw Central Selection Time Box (Absolute Center)
            if (selectedCity) {
                ctx.save();
                ctx.translate(cx, cy);
                
                // --- Connecting Line ---
                const cityAngle = (selectedCity.lon + mapRotation - 90) * Math.PI / 180;
                const startX = Math.cos(cityAngle) * (r * 0.85); // Start slightly inside the plaque
                const startY = Math.sin(cityAngle) * (r * 0.85);
                
                ctx.beginPath();
                ctx.strokeStyle = "rgba(0, 210, 255, 0.4)";
                ctx.lineWidth = 1;
                ctx.setLineDash([5, 5]); // Dashed line for technical look
                ctx.moveTo(startX, startY);
                ctx.lineTo(0, 0);
                ctx.stroke();
                ctx.setLineDash([]); // Reset
                // -----------------------

                const localStr = time.toLocaleTimeString('de-DE', { 
                    timeZone: selectedCity.tz, 
                    hour: '2-digit', minute: '2-digit', second: '2-digit' 
                });
                const parts = localStr.split(':'); // [HH, MM, SS]
                
                const boxW = 160;
                const boxH = 60;
                
                // Shadow/Glow
                ctx.shadowBlur = 25;
                ctx.shadowColor = "rgba(0, 210, 255, 0.4)";
                
                // Background Box
                ctx.fillStyle = "rgba(0, 10, 30, 0.98)";
                ctx.strokeStyle = "#00d2ff";
                ctx.lineWidth = 2;
                
                const rBox = 10;
                const x = -boxW/2, y = -boxH/2;
                ctx.beginPath();
                ctx.moveTo(x + rBox, y);
                ctx.lineTo(x + boxW - rBox, y);
                ctx.quadraticCurveTo(x + boxW, y, x + boxW, y + rBox);
                ctx.lineTo(x + boxW, y + boxH - rBox);
                ctx.quadraticCurveTo(x + boxW, y + boxH, x + boxW - rBox, y + boxH);
                ctx.lineTo(x + rBox, y + boxH);
                ctx.quadraticCurveTo(x, y + boxH, x, y + boxH - rBox);
                ctx.lineTo(x, y + rBox);
                ctx.quadraticCurveTo(x, y, x + rBox, y);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                
                ctx.shadowBlur = 0;
                ctx.textAlign = "center";
                
                // City Name (Top)
                ctx.fillStyle = "#00d2ff";
                ctx.font = "bold 10px Orbitron";
                ctx.fillText(selectedCity.name.replace(/\n/g, ' ').toUpperCase(), 0, -18);
                
                // --- Digit Widgets ---
                const drawDigitBox = (val, xPos) => {
                    const w = 34;
                    const h = 30;
                    ctx.fillStyle = "#001a33";
                    ctx.strokeStyle = "rgba(0, 210, 255, 0.3)";
                    ctx.beginPath();
                    ctx.roundRect(xPos - w/2, 2, w, h, 4);
                    ctx.fill();
                    ctx.stroke();
                    
                    ctx.fillStyle = "#fff";
                    ctx.font = "900 16px Orbitron";
                    ctx.fillText(val, xPos, 17);
                };

                drawDigitBox(parts[0], -40); // HH
                drawDigitBox(parts[1], 0);   // MM
                drawDigitBox(parts[2], 40);  // SS
                
                // Colons
                ctx.fillStyle = "#00d2ff";
                ctx.font = "bold 14px Orbitron";
                ctx.fillText(":", -20, 17);
                ctx.fillText(":", 20, 17);
                
                ctx.restore();
            }

            requestAnimationFrame(draw);
        }

        function setupUI() {
            const container = document.getElementById('ui-container');
            if (container) container.innerHTML = ''; // Clear previous to avoid duplicates
            
            const BRAND_BLUE = "#00d2ff";
            CyberUI.createCard('ui-container', 'Steuerung', `
                <div style="display: flex; flex-direction: column; gap: 10px; align-items: stretch; padding: 0;">
                    <button id="rotation-btn" class="cyber-btn" onclick="toggleRotation()" 
                            style="width: 100%; border-color: var(--neon-blue); color: var(--neon-blue); padding: 8px;">
                        ROTATION START
                    </button>
                    
                    <button class="cyber-btn" onclick="manualReset()" 
                            style="width: 100%; border-color: #ff3366; color: #ff3366; padding: 8px;">
                        RESET
                    </button>

                    <div style="margin-top: 15px;">
                        <label style="color: var(--neon-blue); font-size: 10px; display: block; margin-bottom: 5px; font-family: Orbitron;">
                            STADT-KONTRAST: <span id="gray-val">${cityFontGray}</span>
                        </label>
                        <input type="range" min="0" max="250" value="${cityFontGray}" 
                               oninput="cityFontGray = parseInt(this.value); document.getElementById('gray-val').innerText = this.value;" 
                               style="width: 100%; cursor: pointer; accent-color: var(--neon-blue);">
                    </div>

                    <div style="margin-top: 15px;">
                        <label style="color: var(--neon-blue); font-size: 10px; display: block; margin-bottom: 5px; font-family: Orbitron;">
                            RING-KONTRAST: <span id="ring-gray-val">${ringFontGray}</span>
                        </label>
                        <input type="range" min="0" max="250" value="${ringFontGray}" 
                               oninput="ringFontGray = parseInt(this.value); document.getElementById('ring-gray-val').innerText = this.value;" 
                               style="width: 100%; cursor: pointer; accent-color: var(--neon-blue);">
                    </div>
                </div>
            `, BRAND_BLUE);
        }

        function toggleRotation() {
            autoRotationEnabled = !autoRotationEnabled;
            const btn = document.getElementById('rotation-btn');
            if (btn) {
                btn.innerText = autoRotationEnabled ? 'ROTATION STOP' : 'ROTATION START';
                btn.style.borderColor = autoRotationEnabled ? '#adff2f' : 'var(--neon-blue)';
                btn.style.color = autoRotationEnabled ? '#adff2f' : 'var(--neon-blue)';
                btn.style.boxShadow = autoRotationEnabled ? '0 0 15px rgba(173, 255, 47, 0.4)' : 'none';
            }
        }

        function manualReset() {
            manualOffset = 0;
            autoRotation = 0;
            autoRotationEnabled = false;
            const btn = document.getElementById('rotation-btn');
            if (btn) {
                btn.innerText = 'ROTATION START';
                btn.style.borderColor = 'var(--neon-blue)';
                btn.style.color = 'var(--neon-blue)';
                btn.style.boxShadow = 'none';
            }
        }

        let isAnimating = false;
        function init() {
            resizeCanvasToContainer();
            setupUI(); // Mount the sidebar controls
            if (!isAnimating && mapLoaded) {
                isAnimating = true;
                draw();
            }
        }

        window.addEventListener('resize', init);
        document.fonts.ready.then(init);
        
        // UI Controls & Interaction
        CyberUI.on('reset', manualReset);
    </script>
</body>
</html>
