<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOC ALVERS MATHE-LABORE | World Clock</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Raleway:wght@200;300;400;700;900&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="../resources/favicon.png">
    <link rel="stylesheet" href="../js/cyber-layout.css">
    <link rel="stylesheet" href="../js/buttons-ultra.css">
    <link rel="stylesheet" href="../js/cyber-lab-overrides.css">
    <link rel="stylesheet" href="../js/branding.styles.extracted.css">
    <link rel="stylesheet" href="../js/lab-shell-minimal.css">
    <!-- Debug window: only loaded with ?debug=1 (all DebugWindow.* calls are guarded, so it's safe to skip) -->
    <script>
        if (new URLSearchParams(location.search).get('debug') === '1') {
            document.write('<scr' + 'ipt src="../js/debug-window.js"><\/scr' + 'ipt>');
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script src="https://unpkg.com/three@0.149.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three-globe@2.27.0/dist/three-globe.min.js"></script>
    <script src="https://unpkg.com/globe.gl@2.30.0/dist/globe.gl.min.js"></script>
    <script src="https://unpkg.com/satellite.js@5.0.0/dist/satellite.min.js"></script>
    <link rel="stylesheet" href="../js/cyber-clock.css">
    <link rel="stylesheet" href="worldclock.css">
    <script>
        (function () {
            try {
                const params = new URLSearchParams(window.location.search);
                const raw = params.get('orga');
                const school = raw ? raw.toLowerCase() : null;
                if (school) document.documentElement.dataset.school = school;
                const KNOWN_ORGAS = ['ibb', 'wkoe', 'alema'];
                if (school && KNOWN_ORGAS.includes(school)) {
                    document.addEventListener('DOMContentLoaded', () => {
                        document.body.classList.add('has-school');
                        document.body.classList.add('school-' + school);
                    });
                }
                // Any school logo: click → toggle fullscreen
                document.addEventListener('DOMContentLoaded', () => {
                    document.querySelectorAll('.school-logo').forEach(logo => {
                        logo.addEventListener('click', () => {
                            const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
                            if (!fsEl) {
                                const req = document.documentElement.requestFullscreen
                                    || document.documentElement.webkitRequestFullscreen;
                                if (req) req.call(document.documentElement);
                            } else {
                                const exit = document.exitFullscreen || document.webkitExitFullscreen;
                                if (exit) exit.call(document);
                            }
                        });
                    });
                });
                // ?open=1 → load opening hours from openinghours.txt and show under the org logo
                const wantOpen = params.get('open') === '1';
                window.__openMode = !!(wantOpen && school && KNOWN_ORGAS.includes(school));
                if (window.__openMode) {
                    document.addEventListener('DOMContentLoaded', () => {
                        fetch('openinghours.txt', { cache: 'no-cache' })
                            .then(r => r.ok ? r.text() : Promise.reject(r.status))
                            .then(text => {
                                const lines = text.split(/\r?\n/)
                                    .map(l => l.trim())
                                    .filter(l => l && !l.startsWith('#'));
                                if (!lines.length) return;
                                const host = document.getElementById('opening-hours');
                                if (!host) return;
                                const todayKey = ['SO','MO','DI','MI','DO','FR','SA'][new Date().getDay()];
                                const parts = ['<div class="oh-title">Öffnungszeiten</div>'];
                                const todayRanges = [];
                                lines.forEach(line => {
                                    const m = line.match(/^(\S+)\s+(.+)$/);
                                    if (!m) return;
                                    const day = m[1].replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
                                    const hrsRaw = m[2];
                                    const hrs = hrsRaw
                                        .replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))
                                        .replace(/\s*-\s*/g, ' - ');
                                    const isToday = day.toUpperCase().startsWith(todayKey);
                                    if (isToday) {
                                        hrsRaw.split(/[,;]/).forEach(seg => {
                                            const rm = seg.match(/(\d{1,2})\s*-\s*(\d{1,2})/);
                                            if (rm) todayRanges.push([parseInt(rm[1],10), parseInt(rm[2],10)]);
                                        });
                                    }
                                    parts.push('<div class="oh-row' + (isToday ? ' is-today' : '') + '"><span class="oh-day">' + day + '</span><span class="oh-hours">' + hrs + '</span></div>');
                                });
                                window.__openRanges = todayRanges;
                                host.innerHTML = parts.join('');
                                host.classList.add('is-visible');
                            })
                            .catch(() => { /* file missing or unreachable */ });
                    });
                }
                let visitorMsg = '';
                const mComp = params.get('m');
                if (mComp) {
                    try {
                        const bytes = Uint8Array.from(atob(mComp.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0));
                        visitorMsg = pako.inflate(bytes, { to: 'string' });
                    } catch (_) {}
                }
                if (!visitorMsg) visitorMsg = (params.get('message') || '').trim();
                if (visitorMsg) {
                    document.addEventListener('DOMContentLoaded', () => {
                        const el = document.getElementById('visitor-greeting');
                        if (!el) return;
                        const safe = visitorMsg.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/\r\n|\r|\n/g, '<br>');
                        const align = visitorMsg.length > 60 ? 'left' : 'center';
                        el.style.justifyContent = visitorMsg.length > 60 ? 'flex-start' : 'center';
                        el.style.textAlign = align;
                        el.innerHTML = '<span style="overflow-wrap:break-word;">' + safe + '</span>';
                        el.style.display = 'flex';
                    });
                }
            } catch (e) { /* ignore */ }
        })();
    </script>
</head>

<body>

    <!-- CITY INFO BOX (globe mode, left side) -->
    <div id="city-info-box" style="position: fixed; left: 0; top: 50%; transform: translateY(-50%); width: clamp(240px, 30vmin, 440px); max-height: 80vh; background: rgba(0, 6, 22, 0.92); border: 1px solid rgba(0, 210, 255, 0.4); border-radius: 1vmin; z-index: 9999; display: none; flex-direction: column; font-family: 'Outfit', sans-serif; color: #e6edf3; overflow: hidden; box-shadow: 0 1vmin 4vmin rgba(0,0,0,0.6);">
        <div id="city-info-img-wrap" style="width: 100%; background: #000; overflow: hidden; display: none;">
            <img id="city-info-img" src="" alt="" style="width: 100%; height: auto; display: block;">
        </div>
        <a id="city-info-source" target="_blank" rel="noopener" style="display: none; padding: 0.3vmin 1.2vmin; font-size: clamp(0.6rem, 0.85vmin, 0.8rem); color: rgba(0, 210, 255, 0.7); text-decoration: none; font-family: 'Outfit', sans-serif; border-bottom: 1px solid rgba(0, 210, 255, 0.15);">Quelle: Wikipedia →</a>
        <div style="padding: 1vmin 1.2vmin;">
            <div id="city-info-title" style="font-family: 'Orbitron', sans-serif; font-weight: 700; color: #00d2ff; font-size: clamp(0.8rem, 1.3vmin, 1.1rem); margin-bottom: 0.4vmin; letter-spacing: 1px;"></div>
            <div id="city-info-pop" style="font-family: 'Orbitron', sans-serif; font-weight: 400; color: #ffaa00; font-size: clamp(0.65rem, 1vmin, 0.85rem); margin-bottom: 0.6vmin; letter-spacing: 1px; display: none;"></div>
            <div id="city-info-loading" style="font-size: clamp(0.7rem, 1vmin, 0.9rem); color: rgba(0, 210, 255, 0.6); font-style: italic; display: none;">Lade Info…</div>
            <div id="city-info-extract" style="font-size: clamp(0.72rem, 1.05vmin, 0.95rem); line-height: 1.45; color: rgba(230, 237, 243, 0.85); max-height: 45vh; overflow-y: auto;"></div>
        </div>
    </div>

    <!-- DEBUG: Cover that hides everything except the clock (fades in 2s after load) -->
    <div id="debug-clock-cover">
        <div class="cover-piece" data-piece="top"></div>
        <div class="cover-piece" data-piece="bottom"></div>
        <div class="cover-piece" data-piece="left"></div>
        <div class="cover-piece" data-piece="right"></div>
    </div>

    <img id="school-logo-ibb" class="school-logo" src="https://www.ibb-dresden.de/assets/images/6/ibb-dresden-d0db51aa.svg" alt="IBB Dresden">
    <img id="school-logo-wkoe" class="school-logo" src="WKOE%20frei.png" alt="Wirtschaftskanzlei Oliver Emslander">
    <img id="school-logo-alema" class="school-logo" src="ALEMA.PNG" alt="Alemannenschule">

    <div id="opening-hours" aria-label="Öffnungszeiten"></div>

    <nav id="mini-rail">
        <div class="nav-btn" onclick="toggleSidebar()" title="Toggle Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </div>
    </nav>


    <aside id="side-panel" class="collapsed">
        <header id="sidebar-header"></header>
        <div id="ui-container"></div>
    </aside>

    <main id="main-content">
        <div id="canvas-container">
            <div class="cyber-grid"></div>
            <div id="math-coach-box">
                <div class="coach-title" id="coach-title-slot"></div>
                <div id="coach-content" class="coach-message"></div>
            </div>
            <div id="globe-stage"></div>
            <canvas id="canvas"></canvas>
            <div id="visitor-greeting"></div>
        </div>
    </main>

    <!-- Left-edge hamburger → right-facing half-circle touch menu (sky & date controls) -->
    <button id="wc-menu-btn" type="button" aria-label="Menü"><span></span><span></span><span></span></button>
    <div id="mini-stack" class="mini-stack">
        <button class="mini-btn two-line" id="wc-mb-lang"><span class="opt">DEUTSCH</span><span class="opt">LATEIN</span></button>
        <button class="mini-btn two-line" id="wc-mb-sky"><span class="opt">PLANETARIUM</span><span class="opt">UHR</span></button>
        <button class="mini-btn two-line" id="wc-mb-today"><span class="opt">HEUTE</span><span class="opt"></span></button>
        <button class="mini-btn toggle" id="wc-mb-moon">MOND</button>
        <button class="mini-btn toggle" id="wc-mb-nebula">NEBEL</button>
        <button class="mini-btn two-line" id="wc-mb-globe"><span class="opt">GLOBUS</span><span class="opt">UHR</span></button>
        <button class="mini-btn two-line" id="wc-mb-dir"><span class="opt">SÜD-VIEW</span><span class="opt">NORD-VIEW</span></button>
    </div>

    <!-- Right-edge hamburger → left-facing half-circle: on/off toggles for the sky overlays -->
    <button id="wc-menu-btn-r" type="button" aria-label="Ebenen"><span></span><span></span><span></span></button>
    <div id="mini-stack-r" class="mini-stack">
        <button class="mini-btn toggle" id="wc-tg-conlines">STERNBILDER</button>
        <button class="mini-btn toggle" id="wc-tg-connames">NAMEN</button>
        <button class="mini-btn toggle" id="wc-tg-ecliptic">EKLIPTIK</button>
        <button class="mini-btn toggle" id="wc-tg-planets">PLANETEN</button>
        <button class="mini-btn toggle" id="wc-tg-zodiac">TIERKREIS</button>
        <button class="mini-btn toggle" id="wc-tg-sats">SATELLITEN</button>
    </div>

    <!-- Planetarium: click/tap a star → small identification tooltip -->
    <div id="star-info"><div id="star-info-name"></div><div id="star-info-sub"></div></div>

    <!-- Planetarium: top-center info box — selected city + its local date & time -->
    <div id="sky-info">
        <div id="sky-info-line">
            <div id="sky-info-date"></div>
            <div id="sky-info-city"></div>
            <div id="sky-info-time"></div>
        </div>
    </div>
    <!-- Play/pause sits OUTSIDE #sky-info: that box is transform-positioned, which would otherwise trap position:fixed -->
    <button id="sky-play" type="button" aria-label="Zeitraffer">▶</button>

    <!-- Planetarium: live tally of currently-visible stars · constellations + Milky Way points (bottom-left) -->
    <div id="sky-count"><span class="sc-n" id="sc-stars">0</span> Sterne · <span class="sc-n" id="sc-cons">0</span>/88 Sternbilder · Milchstraße <span class="sc-n" id="sc-mw">0</span>/100–400 Mrd.</div>

    <script src="worldclock-astro.js"></script>
    <script src="worldclock-util.js"></script>
    <script src="worldclock-stars.js"></script>
    <script src="worldclock-tle.js"></script>
    <script src="worldclock-cityinfo.js"></script>
    <script src="worldclock-moon.js"></script>
    <script src="../js/cyber-clock.js"></script>
    <script src="worldclock.js"></script>
    <script src="worldclock-globe.js"></script>
    <script src="worldclock-sky.js"></script>
    <script src="worldclock-menus.js"></script>
    <script src="worldclock-ui.js"></script>

    <script>
    // Local-vs-live indicator (top right): red badge + ring ONLY when served locally. No red = you are on the LIVE site.
    (function () {
        const h = location.hostname;
        const local = h === '' || h === 'localhost' || h === '127.0.0.1' || h.endsWith('.local')
                   || /^(192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.)/.test(h) || location.protocol === 'file:';
        if (!local) return;
        document.documentElement.classList.add('env-local');
        const b = document.createElement('div');
        b.className = 'env-badge';
        b.textContent = 'LOKAL';
        document.body.appendChild(b);
    })();
    </script>
</body>
