    <style>
        .wv-rows { display: flex; flex-direction: column; gap: 7px; }
        .wv-row { display: flex; justify-content: space-between; gap: 10px; font-size: .82rem; }
        .wv-key { color: #9fb2c8; }
        .wv-val { color: #9de8ff; font-family: Orbitron, sans-serif; }
        .wv-btns { display: flex; gap: 8px; }
        .wv-btns .cyber-btn { flex: 1; }
        /* the sentence, open for typing - same rectangle, same type as the drawn box */
        #wv-edit {
            position: fixed; z-index: 40; resize: none; border-radius: 12px;
            background: #FFFFFF; color: #3A4150; caret-color: rgb(176, 36, 24);
            border: 1px solid rgba(58, 65, 80, .45);
            font-family: "IBM Plex Mono", Menlo, monospace; font-weight: 400;
            outline: none; box-shadow: 0 10px 30px rgba(0, 0, 0, .45);
        }
        #wv-edit[hidden] { display: none; }
        /* ?widget - the sheet alone, no rail and no cards: what the deck's frame shows */
        body.wv-widget { grid-template-columns: 0 minmax(0, 1fr) !important; }
        body.wv-widget #cyber-left-chrome, body.wv-widget #cyber-left-chrome-inner, body.wv-widget #mini-rail,
        body.wv-widget #side-panel, body.wv-widget #cyber-screen-warning { display: none !important; }
        body.wv-widget #main-content { grid-column: 1 / -1 !important; }
        /* ...and so no Start button either: the widget gets its own on the sheet - whoever presents the deck must
           see how it runs, not know the Space key (Doc, 28.10.2026: "Kollegen ... müssen sehen, wie es läuft") */
        /* quiet navy outline on the paper (Doc: "kleiner, dezenter") - the rail's cyber-btn is made for dark ground and vanished here */
        #wv-fab { display: none; }
        body.wv-widget #wv-fab { display: flex; align-items: baseline; gap: 8px; position: fixed; top: 14px; right: 22px;
            z-index: 30; padding: 5px 12px; border: 1px solid rgba(14, 36, 78, .3); border-radius: 8px; cursor: pointer;
            background: rgba(14, 36, 78, .06); color: #0E244E; font-family: Orbitron, sans-serif; font-size: 12px;
            letter-spacing: .8px; }
        body.wv-widget #wv-fab:hover { background: rgba(14, 36, 78, .13); border-color: rgba(14, 36, 78, .5); }
        #wv-fab .wv-fab-key { font-family: Raleway, sans-serif; font-size: 10px; letter-spacing: .3px; opacity: .65; }
        /* top right on the sheet: the switch between the two views, and in the widget the Start button beside it
           (Doc, 11.11.2026: "Wie schalte ich denn den Modus um? ... einen Switch machen oben rechts?") - the same
           quiet navy outline as the widget's button, the same height */
        #wv-top { position: fixed; top: 14px; right: 22px; z-index: 30; display: flex; gap: 8px; align-items: stretch; }
        body.wv-widget #wv-top #wv-fab { position: static; }
        #wv-mode { display: flex; border: 1px solid rgba(14, 36, 78, .3); border-radius: 8px; overflow: hidden;
            background: rgba(14, 36, 78, .06); }
        #wv-mode button { border: 0; margin: 0; padding: 5px 11px; background: transparent; color: #0E244E; cursor: pointer;
            font-family: Orbitron, sans-serif; font-size: 12px; letter-spacing: .8px; line-height: 1.3; }
        #wv-mode button + button { border-left: 1px solid rgba(14, 36, 78, .3); }
        #wv-mode button:hover { background: rgba(14, 36, 78, .10); }
        #wv-mode button.on { background: #0E244E; color: #F7F2E7; }
        #wv-mode button:focus-visible { outline: 2px solid rgba(14, 36, 78, .6); outline-offset: -2px; }
        /* in the deck's frame (960 wide) switch and Start share the space right of the centred heading - a little
           tighter there, so the heading keeps clear */
        body.wv-widget #wv-top { right: 14px; gap: 6px; }
        body.wv-widget #wv-mode button { padding: 5px 9px; font-size: 11px; letter-spacing: .5px; }
        body.wv-widget #wv-fab { padding: 5px 10px; letter-spacing: .5px; justify-content: center; box-sizing: border-box; }
        /* a narrow page has no room beside the heading: there the switch in the card on the left does it alone */
        @media (max-width: 700px) { body:not(.wv-widget) #wv-top { display: none; } }
        /* the working area reads like paper - the cards on the left keep the dark house style */
        #canvas-container { background: #F7F2E7; }
        /* no wordmark over the sheet in THIS lab (Doc, 22.09.2026: "Branding rechts oben raus (hier)") */
        .canvas-branding { display: none; }
    </style>

<body>

    <script src="js/cyber-left-chrome.js"></script>

    <script src="js/branding.js"></script>

    <script>
        function toggleSidebar() {
            const panel = document.getElementById('side-panel');
            panel.classList.toggle('collapsed');
            if (window.CyberLeftChrome && typeof CyberLeftChrome.publishResolvedScale === 'function') {
                CyberLeftChrome.publishResolvedScale();
            }
            setTimeout(() => {
                window.dispatchEvent(new Event('resize'));
                if (typeof init === 'function') init();
                if (window.CyberLeftChrome && typeof CyberLeftChrome.publishResolvedScale === 'function') {
                    CyberLeftChrome.publishResolvedScale();
                }
            }, 400);
        }

        CyberBranding.init({
            useExternalStyles: true,
            title: CyberI18n.get('ui.coach_title'),
            subtitle: 'Wortvorhersage',
        });
        CyberUI.init();

        (function setCoachTitleFromI18n() {
            const el = document.getElementById('coach-title-slot');
            if (el && typeof CyberI18n !== 'undefined' && typeof CyberI18n.get === 'function') {
                el.textContent = CyberI18n.get('ui.description');
            }
        })();

        if (window.CyberLeftChrome && typeof CyberLeftChrome.configure === 'function') {
            CyberLeftChrome.configure({ viewportOnlyZoom: true });
        }

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        const log = (m) => { if (typeof dbg === 'function') dbg(m); };
        const T = (k, fb) => (window.CyberI18n && CyberI18n.getOr) ? CyberI18n.getOr('wv.' + k, fb) : fb;

        // ---------------------------------------------------------------- the text ---
        // The training sentence stands above, the prediction grows below it. Any text works - it is only
        // ever read as a list of words, and the window slides over that list.
        const SOURCE = ('Ein neuronales Netz lernt nicht wie ein Mensch und schlägt auch nichts nach. '
            + 'Es bekommt sehr viel Text zu lesen und soll dabei immer nur eines tun: '
            + 'aus den Wörtern davor das nächste Wort erraten. '
            + 'Am Anfang sind alle Gewichte zufällig, also fällt lauter Unsinn heraus. '
            + 'Jeder Fehler wird gemessen und rückwärts durch die Schichten verteilt, '
            + 'und alle Gewichte rücken ein winziges Stück in die bessere Richtung. '
            + 'Nach vielen Durchläufen trifft die Vorhersage immer häufiger das richtige Wort, '
            + 'und aus dem Rauschen wird lesbare Sprache.');
        // more sentences follow on Space, one after the other, the learned share growing with each
        // (Doc, 22.09.2026: "SPACE startet, wenn der 1. Satz durch ist kommt der nächste wenn space etc")
        const TEXTS = [SOURCE,
            'Ein Sprachmodell hat kein Wissen im Sinne von Fakten in einer Tabelle. Es hat Gewichte, viele '
            + 'Milliarden Zahlen, und in ihnen steckt, welche Wörter in welcher Umgebung wahrscheinlich sind. '
            + 'Fragt man es etwas, rechnet es aus dem Gesagten das wahrscheinlichste nächste Wort aus, hängt es '
            + 'an und rechnet weiter. Dass dabei so oft Sinnvolles herauskommt, liegt allein daran, dass es '
            + 'unvorstellbar viel Text gesehen hat.',
            'Beim Training bekommt das Netz einen Satz ohne das letzte Wort und soll es erraten. Liegt es '
            + 'daneben, wird der Abstand zum richtigen Wort gemessen. Dieser Fehler wandert rückwärts durch alle '
            + 'Schichten, und jedes Gewicht erfährt, in welche Richtung es sich ein wenig bewegen muss. Das '
            + 'geschieht Milliarden Male, mit immer neuen Sätzen, bis der Fehler klein geworden ist.',
            'Was ein Netz nie gesehen hat, kann es nicht wissen. Es kann aber Muster fortsetzen, die es aus '
            + 'ähnlichen Texten kennt, und das klingt dann oft überzeugend, auch wenn es falsch ist. Darum lohnt '
            + 'es sich, eine Antwort zu prüfen, statt sie zu glauben. Ein Netz weiß nicht, was wahr ist. Es weiß '
            + 'nur, was wahrscheinlich als Nächstes kommt.',
            'Ein Netz liest keine Wörter, sondern Stücke davon, die Tokens. Ein häufiges Wort ist ein einziges '
            + 'Token, ein seltenes wird in mehrere zerlegt. Was das Netz auf einmal überblicken kann, heißt '
            + 'Kontextfenster, und alles davor ist für den nächsten Schritt einfach nicht mehr da. Darum kann es '
            + 'mitten in einem langen Gespräch vergessen, was am Anfang stand.',
            'Ob dieselbe Frage zweimal dieselbe Antwort bekommt, hängt davon ab, wie das nächste Wort gezogen '
            + 'wird. Nimmt das Netz immer das wahrscheinlichste, wiederholt es sich und klingt hölzern. Lässt man '
            + 'dem Zufall etwas Raum, wird die Sprache lebendiger, aber auch weniger verlässlich. Diesen Regler '
            + 'nennt man Temperatur.'];
        let textIx = 0;
        let TEXT = TEXTS[0].split(/\s+/);
        let startGiven = 0.6;                         // where the first sentence's border opens - set below
        let startLevel = 0.6;                         // the corpus share at the start
        let startSpeed = 900;
        const STORE = 'wv-sliders';
        function saved() {
            try { return JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch (e) { return {}; }
        }
        function remember() {
            try { localStorage.setItem(STORE, JSON.stringify({ given: S.given, level: S.level, speed: S.speed })); }
            catch (e) { }
        }

        // ------------------------------------------------------------------ the state ---
        const S = {
            speed: 900,           // ms until one word has settled - each sentence halves it
            given: 0.6,           // the share of each sentence that is handed over - fixed, the rest is produced
            level: 0.6,           // what the net has learned from the corpus - grows with every sentence
            mode: 'still',        // 'still' = the picture it opens with, 'run' = the rest settling word by word
            running: false,
            pos: 0,               // the word settling right now
            stopAt: -1,           // "Ein Wort": pause once pos reaches this
            epoch: 0,             // runs finished
            nr: 1,                // which sentence this is - the heading says so
            ok: [],               // per position: does the net get this word right? (the opening picture)
            known: [],            // per position: a word behind the border the net already has - seen before
            noise: [],            // per position: the gibberish standing in for the word before it settles
            cur: '',              // the settling word as it looks this instant
            flick: 0,             // when the loose letters were last rolled
            frac: 0,              // how far the settling word has locked, 0..1
            view: 'wort',         // 'wort' = word by word from the left (the default), 'patch' = in patches all over
            tk: [], tkB: [], tkOn: [], tkAt: [], tkOrder: [],   // patches: tokens, their salad, right yet?, since when, order
            pp: 0, ppStop: -1,    // patches: how far this run is, 0..1; "Ein Schritt" stops a little later
            lastT: 0, reroll: 0, tkN: 0,
            t0: 0                 // when the current word started settling
        };

        // gibberish, the way an untrained net babbles: characters with no word behind them - letters, but well mixed
        // with capitals, umlauts, digits, punctuation and signs (Doc, 11.11.2026: "das muss Buchstabensalat sein ...
        // mehr Sonderzeichen"). The target word's own commas and full stops are not copied - an untrained net knows
        // nothing about them. One character per character of the word: the line keeps still.
        const LETTERS = 'abcdefghijklmnopqrstuvwxyz';
        const CAPS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÜ';
        const UML = 'äöüßäöü';
        const DIGITS = '0123456789';
        const SIGNS = ',.;:!?–…„“()§%&/+*#@=';
        const pickc = a => a[(Math.random() * a.length) | 0];
        function rnd() {
            const r = Math.random();
            return r < 0.52 ? pickc(LETTERS) : r < 0.62 ? pickc(CAPS) : r < 0.69 ? pickc(UML)
                : r < 0.81 ? pickc(DIGITS) : pickc(SIGNS);
        }
        function babble(n) {
            let s = '';
            for (let i = 0; i < n; i++) s += rnd();
            return s;
        }

        // The learned part is a PIECE, not a sprinkle: everything up to the border sits, everything after it
        // does not (Doc, 22.09.2026: "den ersten Teil bis winziges grün der Rest rot"). That is how it reads
        // in class - the border walks to the right while the net trains.
        const border = () => Math.round(TEXT.length * S.given);
        // Patches keep the handed-over part too (Doc, 11.11.2026: "das ist mein Stück, was du fortsetzen sollst, ist da
        // weg in dem Modus") - the pieces come right only behind the border

        const SEEN = new Set();
        const norm = w => w.toLowerCase().replace(/[^a-zäöüß]/g, '');
        function rollLevel() {
            const green = border();
            S.ok = TEXT.map((w, i) => i < green);
        }
        function rollKnown() {
            const green = border();
            S.known = TEXT.map((w, i) => i >= green && SEEN.has(norm(w)) && Math.random() < S.level);
            S.noise = TEXT.map((w, i) => (i < green || S.known[i]) ? w : babble(w.length));   // same length: the line keeps still
            rollTokens();
        }

        // ---------------------------------------------------------------- "Patches" ---
        // Doc, 11.11.2026: "einen Modus ..., wo das nicht Wort für Wort erscheint, sondern eben wie es in Wirklichkeit
        // ist. Dass sich das ganze Ding aus Patches zusammensetzt" - "Wenn irgendwo ein Stück grün wird, zack, grün
        // machen. Da grün, da grün, da grün ... bis fertig." In training a net predicts EVERY position at once
        // (teacher forcing), so with each pass pieces come right all over the part behind the border (the handed-over
        // beginning stands black above and fixed below, as word by word): first the punctuation and the
        // frequent little words, then the grammar (endings), last the rare content words. Pieces, not words: a long
        // word comes right in tokens ("Gewi|chte"). Each piece is green the moment it is right - nothing walks from
        // left to right. The salad keeps each piece's length, so the text never shifts.
        const FUNC = new Set(['der', 'die', 'das', 'und', 'ist', 'ein', 'eine', 'einen', 'in', 'zu', 'nicht', 'es',
            'sich', 'mit', 'von', 'den', 'dem', 'des', 'auf', 'für', 'im', 'an', 'als', 'auch', 'wie', 'wird', 'sind',
            'so', 'aus', 'nur', 'was', 'bis', 'am', 'vom', 'zum', 'oder', 'aber', 'dann', 'sie', 'er', 'wir', 'man']);
        const COUNT = new Map();                      // how often each word occurs in the corpus
        TEXTS.join(' ').split(/\s+/).forEach(w => {
            const k = w.replace(/[^A-Za-zÄÖÜäöüß]/g, '').toLowerCase();
            if (k) COUNT.set(k, (COUNT.get(k) || 0) + 1);
        });
        const MAXC = Math.max(1, ...COUNT.values());
        const VOWEL = /[aeiouäöüyAEIOUÄÖÜY]/;
        // a long word in pieces, the way a tokenizer cuts it: after a vowel before a consonant, pieces of 3 and more
        function piecesOf(core) {
            if (core.length <= 5 || FUNC.has(core.toLowerCase())) return [core];
            const out = [];
            let last = 0;
            for (let k = 3; k < core.length - 1; k++) {
                if (k - last >= 3 && VOWEL.test(core[k - 1]) && !VOWEL.test(core[k])) { out.push(core.slice(last, k)); last = k; }
            }
            out.push(core.slice(last));
            return out;
        }
        // the tokens of one word, each with its character offset in the word
        function tokensOf(word, i) {
            const m = word.match(/^([^A-Za-zÄÖÜäöüß0-9]*)(.*?)([^A-Za-zÄÖÜäöüß0-9]*)$/);
            const out = [];
            let at = 0;
            const push = (t, kind) => { if (t) { out.push({ t: t, i: i, kind: kind, at: at }); at += t.length; } };
            [...m[1]].forEach(c => push(c, 'sign'));
            if (m[2]) piecesOf(m[2]).forEach((p, k) => push(p, k ? 'tail' : 'head'));
            [...m[3]].forEach(c => push(c, 'sign'));
            return out;
        }
        // how late a piece comes right, 0 early .. 1 late
        function difficulty(tok) {
            if (tok.kind === 'sign') return 0.05;                              // punctuation first
            const w = TEXT[tok.i].replace(/[^A-Za-zÄÖÜäöüß]/g, '').toLowerCase();
            if (FUNC.has(w)) return 0.18;                                      // the frequent little words
            if (tok.kind === 'tail' && tok.t.length <= 3) return 0.42;         // endings: grammar
            const f = Math.log(1 + (COUNT.get(w) || 0)) / Math.log(1 + MAXC);  // 1 frequent .. 0 rare
            return 0.55 + 0.35 * (1 - f);                                      // content words, the rare ones last
        }
        function rollTokens() {
            const bord = border();
            S.tk = [];
            TEXT.forEach((w, i) => S.tk.push(...tokensOf(w, i)));
            const open = [];
            S.tk.forEach((t, j) => { if (t.i >= bord && !S.known[t.i]) open.push(j); });
            S.tkB = S.tk.map(t => babble(t.t.length));
            S.tkOrder = open.map(j => [j, difficulty(S.tk[j]) + (Math.random() - 0.5) * 0.35])
                .sort((a, b) => a[1] - b[1]).map(a => a[0]);
            tokensReset();
        }
        function tokensReset() {
            const bord = border();
            S.tkOn = S.tk.map(t => t.i < bord || !!S.known[t.i]);
            S.tkAt = S.tk.map(() => 0);
            S.pp = 0; S.ppStop = -1; S.tkN = 0;
        }
        const wordDone = i => S.tk.every((t, j) => t.i !== i || S.tkOn[j]);
        // the share of the part to be guessed that is right: the pieces behind the border (what it had before counts)
        function openShare() {
            const bord = border();
            let n = 0, on = 0;
            S.tk.forEach((t, j) => { if (t.i >= bord) { n++; if (S.tkOn[j]) on++; } });
            return { n: n, on: on, pct: n ? Math.round(100 * on / n) : 100 };
        }
        const easeOut = u => 1 - Math.pow(1 - u, 1.7);      // quick at first, ever slower - like training
        // one frame of the run: the share grows in time (as long as word by word would take), the pieces of that
        // share come right in their order; the salad of the rest keeps rattling, a few pieces at a time
        function patchStep(now) {
            const nWords = Math.max(1, TEXT.length - border() - knownAhead(border()));
            const dt = Math.min(100, now - S.lastT);
            S.lastT = now;
            S.pp = Math.min(1, S.pp + dt / (nWords * S.speed));
            if (S.ppStop >= 0 && S.pp >= S.ppStop) { S.pp = S.ppStop; S.ppStop = -1; S.running = false; playLabel(); }
            const n = Math.round(easeOut(S.pp) * S.tkOrder.length);
            for (let k = 0; k < n; k++) {
                const j = S.tkOrder[k];
                if (!S.tkOn[j]) { S.tkOn[j] = true; S.tkAt[j] = now; }
            }
            if (n !== S.tkN) { S.tkN = n; showStats(); }
            if (now - S.reroll > 90) {
                S.reroll = now;
                for (let k = n; k < S.tkOrder.length; k++) {
                    if (Math.random() < 0.18) { const j = S.tkOrder[k]; S.tkB[j] = babble(S.tk[j].t.length); }
                }
            }
            S.frac = S.pp;
            if (S.pp >= 1 || n >= S.tkOrder.length) { S.pp = 1; S.pos = TEXT.length; finish(); }   // the last piece: done
        }
        // the view, from either switch (the card on the left, the one top right) or &modus=patch at the start: a
        // sentence in the middle of its run starts again in the new view, one at rest just shows the new picture
        function setView(v) {
            const again = S.mode === 'run' && S.pos < TEXT.length;
            S.view = v === 'patch' ? 'patch' : 'wort';
            ['wort', 'patch'].forEach(k => {
                const b = document.getElementById('wv-view-' + k);
                if (b) { b.classList.toggle('active', S.view === k); b.setAttribute('aria-pressed', S.view === k); }
                const t = document.querySelector('#wv-mode [data-v="' + k + '"]');
                if (t) { t.classList.toggle('on', S.view === k); t.setAttribute('aria-pressed', S.view === k); }
            });
            const st = document.getElementById('wv-step');
            if (st) st.textContent = S.view === 'patch' ? T('btn_step_patch', 'Ein Schritt') : T('btn_step', 'Ein Wort');
            still();
            if (again) startRun();
        }
        // the switch top right, on both pages
        (function topSwitch() {
            const top = document.createElement('div');
            top.id = 'wv-top';
            const sw = document.createElement('div');
            sw.id = 'wv-mode';
            sw.setAttribute('role', 'group');
            sw.setAttribute('aria-label', T('l_view', 'Ablauf'));
            [['wort', T('btn_view_wort', 'Wort für Wort')], ['patch', T('btn_view_patch', 'Patches')]].forEach(([k, label]) => {
                const b = document.createElement('button');
                b.type = 'button'; b.dataset.v = k; b.textContent = label;
                b.classList.toggle('on', S.view === k); b.setAttribute('aria-pressed', S.view === k);
                b.addEventListener('click', () => { if (S.view !== k) setView(k); b.blur(); });   // blur: Space goes on working
                sw.appendChild(b);
            });
            top.appendChild(sw);
            document.body.appendChild(top);
        })();
        const knownAhead = from => S.known.reduce((n, k, i) => n + (k && i >= from ? 1 : 0), 0);

        function playLabel() {
            const b = document.getElementById('wv-play');
            if (b) b.textContent = S.running ? T('btn_stop', 'Pause') : T('btn_play', 'Start');
            const f = document.getElementById('wv-fab-l');    // the widget's button does what Space does
            if (f) {
                const st = S.running ? 'stop' : S.mode === 'run' && S.pos >= TEXT.length ? (lastSentence() ? 'done' : 'next') : 'play';
                fabLabel(st);
            }
        }
        // The widget's button keeps ONE width whatever it says (Doc, 11.11.2026: "Der Play-Knopf und Pausen-Knopf ändert
        // seine Breite ... dann springt das alles") - the widest of its labels, measured once the font is there. "oder
        // Leertaste" only where Space does what the button says: not beside "Nächster Satz" and "Fertig", which keeps
        // the widest label short enough for the switch and the heading beside it.
        const FAB = {
            play: () => ['▶ ' + T('btn_play', 'Start'), true],
            stop: () => ['❚❚ ' + T('btn_stop', 'Pause'), true],
            next: () => ['⏭ ' + T('btn_next', 'Nächster Satz'), false],
            done: () => ['✓ ' + T('btn_done', 'Fertig'), false]
        };
        function fabLabel(st) {
            const f = document.getElementById('wv-fab-l'), k = document.querySelector('#wv-fab .wv-fab-key');
            if (!f) return;
            const [text, key] = FAB[st]();
            f.textContent = text;
            if (k) k.style.display = key ? '' : 'none';
        }
        function fabWidth() {
            const fab = document.getElementById('wv-fab'), f = document.getElementById('wv-fab-l');
            if (!fab || !f) return;
            const keep = f.textContent, k = document.querySelector('#wv-fab .wv-fab-key'), kd = k ? k.style.display : '';
            fab.style.width = '';
            let w = 0;
            Object.keys(FAB).forEach(st => { fabLabel(st); w = Math.max(w, fab.getBoundingClientRect().width); });
            f.textContent = keep;
            if (k) k.style.display = kd;
            fab.style.width = Math.ceil(w) + 'px';
        }

        // the picture it opens with: the whole sentence, grey where the net has it, red where it has not
        function still() {
            autoStop();
            S.mode = 'still'; S.running = false; S.stopAt = -1;
            rollLevel(); rollKnown();
            S.pos = border();
            playLabel();
            showStats();
        }
        function resetAll() {
            S.epoch = 0;
            textIx = 0; TEXT = TEXTS[0].split(/\s+/); S.nr = 1;
            SEEN.clear();
            S.given = startGiven; S.level = startLevel;
            const gv = document.getElementById('wv-given'), gvl = document.getElementById('wv-given-l');
            if (gv) gv.value = Math.round(S.given * 100);
            if (gvl) gvl.textContent = Math.round(S.given * 100) + ' %';
            S.speed = startSpeed;
            const sp = document.getElementById('wv-speed'), spl = document.getElementById('wv-speed-l');
            if (sp) sp.value = S.speed;
            if (spl) spl.textContent = S.speed + ' ms';
            const sl = document.getElementById('wv-level'), lb = document.getElementById('wv-level-l');
            if (sl) sl.value = Math.round(S.level * 100);
            if (lb) lb.textContent = Math.round(S.level * 100) + ' %';
            still(); draw();
        }

        // The next sentence, opened as its picture first - the gaps show what the net already has, and
        // that is worth a look before the next Space runs it (Doc, 22.09.2026: "Space muss erst den Satz
        // zeigen und das nächste run"). Faster each time: training is not something one watches for long.
        function nextText() {
            textIx = (textIx + 1) % TEXTS.length;
            TEXT = TEXTS[textIx].split(/\s+/);
            S.nr++;
            still();                                  // the share already grew when the last sentence finished
            S.speed = Math.max(80, Math.round(S.speed * 0.55));
            const sl = document.getElementById('wv-speed'), lb = document.getElementById('wv-speed-l');
            if (sl) sl.value = S.speed;
            if (lb) lb.textContent = S.speed + ' ms';
        }

        // After Start the whole rest behind the border stands there as gibberish, and from left to right one
        // word after the other settles into the real one - letters rattling until they lock, like a lock
        // finding its combination - through to the end of the text (Doc, 22.09.2026: "hinter winziges aus
        // jiberish Stück entstehen ... der ganze Junk bis zum Ende - DAS hatte ich im Kopf").
        function startRun() {
            autoStop();
            S.mode = 'run'; S.running = true; S.stopAt = -1;
            rollLevel();
            if (S.known.length !== TEXT.length) rollKnown();   // the picture's salad carries over into the run
            S.pos = border();
            if (S.view === 'patch') { tokensReset(); S.lastT = S.reroll = performance.now(); }
            S.cur = S.noise[S.pos] || '';
            S.t0 = performance.now(); S.flick = 0; S.frac = 0;
            playLabel();
            showStats();
        }

        // the settling word at this instant: the first letters locked, the rest still rolling
        function settle(now) {
            if (S.pos >= TEXT.length) return;
            const word = TEXT[S.pos];
            const had = !!S.known[S.pos];
            const f = Math.min(1, (now - S.t0) / (had ? S.speed * 0.15 : S.speed));
            S.frac = f;
            const locked = had ? word.length : Math.floor(f * word.length);
            if (now - S.flick > 70 || S.cur.length !== word.length) {   // roll the loose letters ~14 times a second
                S.flick = now;
                let out = word.slice(0, locked);
                for (let k = locked; k < word.length; k++) out += rnd();   // its punctuation rolls too, until it locks
                S.cur = out;
            } else {
                S.cur = word.slice(0, locked) + S.cur.slice(locked);
            }
            if (f >= 1) {                                 // locked - on to the next word
                S.pos++;
                S.cur = S.noise[S.pos] || '';
                S.t0 = now; S.frac = 0;
                showStats();
                if (S.pos >= TEXT.length) {               // the end: the sentence is through, the net has grown
                    finish();
                } else if (S.stopAt >= 0 && S.pos >= S.stopAt) {
                    S.running = false; S.stopAt = -1;
                    playLabel();
                }
            }
        }

        // the end of a sentence, in both views: it is through, the net has grown
        function finish() {
            S.running = false;
            TEXT.forEach(w => SEEN.add(norm(w)));
            grow();
            playLabel(); showStats();
            log('Durchlauf ' + S.epoch);
            if (S.level >= AUTO_FROM && !lastSentence()) autoNext();
        }

        // the learned share grows, quickly at first and ever more slowly - like real training
        // 100 % means: every sentence of the corpus has been trained - not a number creeping towards 99 % while
        // Space still brings more sentences (Doc, 10.11.2026: "Es soll bis 100 % durchlaufen, NICHT die Sätze
        // überspringen. Wenn jetzt 100 % da steht, kann ich immer noch die Leertaste drücken und die Sätze kommen noch")
        function levelAt(k) {
            const n = TEXTS.length, f = (1 - Math.pow(0.7, Math.min(k, n))) / (1 - Math.pow(0.7, n));
            return startLevel + (1 - startLevel) * f;
        }
        const lastSentence = () => S.nr >= TEXTS.length;
        // The corpus share as it shows (Doc, 11.11.2026, "ja, lass Alan das so bauen"): during a run it grows with every
        // word or piece the net gets, from where it stood to where this sentence takes it (levelAt) - far more slowly
        // than this sentence's pill, and the end of the sentence brings no jump, it is there already. After the last
        // sentence it stands at exactly 100 %, as levelAt says.
        function sentenceDone() {
            if (S.mode !== 'run') return 0;
            if (S.view === 'patch') return S.tkOrder.length ? S.tkN / S.tkOrder.length : 1;
            const b = border(), n = TEXT.length - b;
            return n > 0 ? Math.max(0, Math.min(1, (S.pos - b) / n)) : 1;
        }
        function shownLevel() {
            if (S.mode !== 'run' || S.pos >= TEXT.length) return S.level;   // at rest, and once grown: the level itself
            const to = Math.max(S.level, levelAt(S.epoch + 1));
            return S.level + (to - S.level) * sentenceDone();
        }
        function grow() {
            S.epoch++;
            S.level = levelAt(S.epoch);
            const sl = document.getElementById('wv-level');
            const lb = document.getElementById('wv-level-l');
            if (sl) sl.value = Math.round(S.level * 100);
            if (lb) lb.textContent = Math.round(S.level * 100) + ' %';
        }
        // From 85 % on the remaining sentences run by themselves, one after the other, up to the last one = 100 %
        // (Doc, 10.11.2026: "Wenn man so bei 85-95% ist, lässt es einfach weiter durchlaufen. Bis zu 100%").
        // A finished sentence stays a moment, then the next one's picture, then its run.
        const AUTO_FROM = 0.85;
        let autoT = 0;
        function autoStop() { clearTimeout(autoT); autoT = 0; }
        function autoNext() {
            autoStop();
            autoT = setTimeout(() => {
                autoT = 0;
                nextText();
                autoT = setTimeout(() => { autoT = 0; startRun(); }, 700);
            }, 900);
        }
        // one training run by button: the share grows and the picture opens afresh
        function train() { grow(); still(); }

        // ------------------------------------------------------------------ drawing ---
        // Numbers in fixed cells - the site's digits widget (js/cyber-clock.js, CyberClock.draw): Orbitron's digits
        // differ in width, so the % pill, the bar and the run counter jumped while the numbers ran (Doc, 10.11.2026:
        // "verwende für die Zahlen mal bitte das Zahlenwidget, dass die Orbitron nicht springen")
        function num(t, x, y, opts) {
            if (window.CyberClock && CyberClock.draw) return CyberClock.draw(ctx, t, x, y, opts);
            ctx.save(); ctx.font = opts.font; ctx.fillStyle = opts.color; ctx.textAlign = opts.align || 'left';
            ctx.fillText(t, x, y); const w = ctx.measureText(t).width; ctx.restore(); return w;
        }
        function numW(t, opts) {
            if (window.CyberClock && CyberClock.width) return CyberClock.width(ctx, t, opts);
            ctx.font = opts.font; return ctx.measureText(t).width;
        }
        const SAND = '#F7F2E7';                       // the working area, a shade of paper (Doc, 22.09.2026)
        const PAPER = '#EFE7D4';                      // the box, a shade deeper than the ground around it
        const INK = '#3A4150';                        // dark grey, the ordinary word
        const FAR = 'rgba(58,65,80,.34)';             // far from the window - there, but out of play
        const WIN = '#14304F';                        // a word inside the context window
        const RIGHT = INK, WRONG = 'rgb(176,36,24)', WARM = 'rgb(245,194,66)';
        const GREEN = 'rgb(84,116,28)';               // the house green, a shade deeper - it read faint on sand (Doc, 22.09.2026)

        function metrics() {
            const cr = canvas.getBoundingClientRect();
            const room = (window.innerWidth || cr.right) - cr.left;
            const w = Math.max(240, Math.min(cr.width, room));
            const base = Math.max(10, Math.min(17, w / 58));
            return { w: w, h: cr.height, fs: base, lh: base * 1.85, pad: base * 1.1 };
        }

        // the box the text sits in - one rounded panel, same language as the cards on the left
        function panel(x, y, w, h, m) {
            const r = Math.min(12, m.fs * 0.7);
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
            ctx.fillStyle = PAPER;
            ctx.fill();
            ctx.lineWidth = 1;
            ctx.strokeStyle = 'rgba(58,65,80,.30)';
            ctx.stroke();
        }

        // lay words out in lines, left to right, wrapping at the edge
        function layout(words, m, x0, y0, maxW) {
            ctx.font = m.fs + 'px "IBM Plex Mono", Menlo, monospace';
            const out = [];
            let x = x0, y = y0;
            words.forEach((w, i) => {
                const t = w == null ? '·' : w;
                const width = ctx.measureText(t).width;
                if (x + width > x0 + maxW) { x = x0; y += m.lh; }
                out.push({ t: t, x: x, y: y, w: width, i: i });
                x += width + m.fs * 0.42;
            });
            return { boxes: out, bottom: y + m.lh };
        }

        // ONE box per line behind the produced words, not one per word - stacked alpha showed every seam
        // (Doc, 22.09.2026: "EINE Box nicht viele"). It ends where the settling word has locked so far.
        function grown(boxes, from, to, m) {
            const rows = new Map();                       // baseline -> [left, right]
            boxes.forEach(b => {
                if (b.i < from || b.i >= to) return;
                const right = b.i < S.pos ? b.x + b.w : b.x + b.w * S.frac;
                const r = rows.get(b.y);
                if (!r) rows.set(b.y, [b.x, right]); else r[1] = Math.max(r[1], right);
            });
            ctx.fillStyle = 'rgba(185,166,124,.40)';       // dark sand, as the line was
            rows.forEach((r, y) => { if (r[1] > r[0]) ctx.fillRect(r[0] - 3, y - m.fs, r[1] - r[0] + 6, m.fs * 1.38); });
        }

        // ONE type size for every sentence: the biggest at which each of the six fits its box (Doc,
        // 22.09.2026: "du änderst unterwegs die Fontsize? Nee! dann kürzer, wenn es nicht passt"). It only
        // changes with the window. A typed sentence longer than the longest of the six runs out of the box -
        // that is the sign to shorten it. Cached: the search costs a few layouts.
        const ORIG = TEXTS.map(t => t.split(/\s+/));
        function fit(m, boxH, maxW) {
            const key = Math.round(maxW) + '|' + Math.round(boxH);
            if (S.fit && S.fit.key === key) return S.fit;
            let t = null;
            for (let fs = Math.min(30, m.fs * 1.8); fs >= 8; fs -= 0.5) {
                t = { fs: fs, lh: fs * 1.85, inner: fs * 1.15, top: fs * 2.6, key: key };
                const fits = ORIG.every(words => {
                    const probe = layout(words, t, 0, 0, maxW);
                    const lines = Math.max(1, Math.round(probe.bottom / t.lh));
                    return (lines - 1) * t.lh + fs + t.top + t.inner <= boxH;
                });
                if (fits) break;
            }
            S.fit = t;
            return t;
        }

        function title(text, x, y, m) {
            ctx.font = '700 ' + (m.fs * 0.9) + 'px Orbitron, sans-serif';
            ctx.fillStyle = 'rgba(58,65,80,.62)';
            ctx.textAlign = 'center';
            ctx.fillText(text.toUpperCase(), x, y);
            ctx.textAlign = 'left';
        }

        // patches in the lower box: each word at its place in the real text, piece by piece - a right piece green at
        // once ("zack, grün"), with a short glow behind it so the eye finds it, the rest salad of the same length
        function drawPatches(boxes, t, font) {
            const now = performance.now();
            ctx.font = font;
            boxes.forEach(b => {
                S.tk.forEach((tok, j) => {
                    if (tok.i !== b.i) return;
                    const x = b.x + ctx.measureText(b.t.slice(0, tok.at)).width;
                    const w = ctx.measureText(tok.t).width;
                    const on = S.tkOn[j], age = S.tkAt[j] ? now - S.tkAt[j] : 1e9;
                    if (on && age < 900) {                   // the glow: there at once, gone in under a second
                        ctx.fillStyle = 'rgba(121,158,49,' + (0.35 * (1 - age / 900)).toFixed(3) + ')';
                        ctx.fillRect(x - 2, b.y - t.fs, w + 4, t.fs * 1.38);
                    }
                    ctx.fillStyle = on ? (tok.i < border() ? INK : GREEN) : WRONG;
                    ctx.fillText(on ? tok.t : S.tkB[j], x, b.y, w);
                });
            });
        }

        function draw() {
            const m = metrics();
            const cr = canvas.getBoundingClientRect();
            ctx.clearRect(0, 0, cr.width, cr.height);
            ctx.fillStyle = SAND;
            ctx.fillRect(0, 0, cr.width, cr.height);
            ctx.textBaseline = 'alphabetic';
            const boxX = m.pad, boxW = m.w - 2 * m.pad;
            const x0 = boxX + m.pad, maxW = boxW - 2 * m.pad;   // the text keeps clear of the box edges
            S.box = null;
            const run = S.mode === 'run';
            // the line in the sentence above follows the words produced so far: from the border to the one
            // settling now (Doc, 22.09.2026: "warum geht die am Ende nicht von Stück") - none while at rest
            const to = run ? Math.min(S.pos + 1, TEXT.length) : -1, from = run ? border() : -1;

            // --- the sheet: two boxes of the same height, at the same place for every sentence -----------
            const gap = m.fs * 1.8;                    // room for a heading over a box
            const ytop = m.pad + m.fs * 0.4;
            const mid = m.fs * 1.3 + gap;              // between the boxes: the heading
            const foot = m.fs * 2.6;                   // under the second box: the learned share as a bar
            const boxH = Math.max(m.fs * 4, (m.h - ytop - gap - mid - foot - m.pad * 1.2) / 2);
            const t = fit(m, boxH, maxW);              // the type that fills them
            const font = t.fs + 'px "IBM Plex Mono", Menlo, monospace';
            const baseline = t.top + t.fs * 0.86;      // first line, measured from the box top

            // --- the training sentence ---------------------------------------------------
            title(S.nr + '. ' + T('t_training', 'Trainingssatz'), boxX + boxW / 2, ytop + m.fs, m);
            let y = ytop + gap;
            const top = layout(TEXT, t, x0, y + baseline, maxW);
            S.box = { x: boxX, y: y, w: boxW, h: boxH, fs: t.fs, lh: t.lh, pad: t.inner };
            panel(boxX, y, boxW, boxH, m);
            const patch = S.view === 'patch';
            if (run && !patch) grown(top.boxes, from, to, t);
            top.boxes.forEach(b => {
                ctx.font = font;
                // the sentence keeps its colours throughout, in both views: the progress shows below (Doc, 11.11.2026:
                // "Jetzt macht der oben aus den roten Buchstaben schwarze. Das sieht man unten schon. Das soll oben so bleiben")
                ctx.fillStyle = S.ok[b.i] ? RIGHT : WRONG;
                ctx.fillText(b.t, b.x, b.y);
            });

            // --- what the net says ------------------------------------------------------
            y = S.box.y + boxH + m.fs * 1.3;
            title(T('t_said', 'Vorhersage'), boxX + boxW / 2, y + m.fs, m);   // the same distance to its box as above
            y += gap;
            // the same box, the same height: at rest only the learned part, the red part is simply not
            // there; running, the rest stands as gibberish and settles word by word. The words are laid out
            // as the REAL text, so nothing shifts while the letters roll.
            const low = layout(TEXT, t, x0, y + baseline, maxW);
            panel(boxX, y, boxW, boxH, m);
            // in the lower box, above its text: how much of this sentence the net has - learned plus
            // produced, 100 at the end (Doc, 22.09.2026: "pack die % Pille über den unteren Text")
            const have = Math.min(TEXT.length, run ? S.pos + S.frac + knownAhead(S.pos + 1) : border() + knownAhead(border()));
            const pct = (patch ? openShare().pct : Math.round(100 * have / Math.max(1, TEXT.length))) + ' %';
            // with its name in front, "Dieser Satz" - the bar under the box is the whole corpus (Doc, 11.11.2026)
            const pf = { font: '700 ' + (m.fs * 0.9) + 'px Orbitron, sans-serif', color: INK, align: 'right', minDigits: 3 };
            const pl = T('t_sentence', 'Dieser Satz').toUpperCase(), plf = '700 ' + (m.fs * 0.62) + 'px Orbitron, sans-serif';
            ctx.font = plf;
            const plw = ctx.measureText(pl).width;
            const pnw = numW('100 %', pf), ppad = m.fs * 0.8;
            const pw = ppad + plw + m.fs * 0.6 + pnw + ppad, ph = m.fs * 1.5;
            const pcy = y + t.top * 0.5;               // the middle of the air above the text
            const px0 = boxX + boxW / 2 - pw / 2;
            ctx.beginPath();
            ctx.roundRect(px0, pcy - ph / 2, pw, ph, ph / 2);
            ctx.fillStyle = 'rgba(185,166,124,.55)';
            ctx.fill();
            ctx.font = pf.font;
            const asc = ctx.measureText('0').actualBoundingBoxAscent;   // the digits' height: their middle on the pill's
            num(pct, px0 + pw - ppad, pcy + asc / 2, pf);
            ctx.font = plf; ctx.fillStyle = 'rgba(58,65,80,.62)'; ctx.textAlign = 'left';
            ctx.fillText(pl, px0 + ppad, pcy + asc / 2);
            ctx.textAlign = 'left';
            if (patch) { drawPatches(low.boxes, t, font); low.boxes.length = 0; }
            else if (run) grown(low.boxes, from, to, t);
            low.boxes.forEach(b => {
                ctx.font = font;
                let txt = b.t, col = INK;
                const behind = b.i >= border();
                if (!run) {
                    if (behind && S.known[b.i]) col = GREEN;              // has it from before
                    else if (behind) { txt = S.noise[b.i]; col = WRONG; }  // not yet: the salad, already here
                } else if (b.i > S.pos) { txt = S.noise[b.i]; col = S.known[b.i] ? GREEN : WRONG; }
                else if (b.i === S.pos) { txt = S.cur || b.t; col = S.known[b.i] ? GREEN : WRONG; }
                else if (behind) col = GREEN;                 // settled: the words the net made (Doc, 22.09.2026: "unser grün")
                ctx.fillStyle = col;
                // gibberish never grows past the word it stands for - wide letters would run into the neighbour
                if (txt === b.t) ctx.fillText(txt, b.x, b.y); else ctx.fillText(txt, b.x, b.y, b.w);
            });

            // --- under the second box: the learned share, the net's overall quality (Doc, 22.09.2026:
            // "die muss unter die zweite Box: das ist ja die gesamt Quali") - and the run counter beside it
            const by = y + boxH + m.fs * 1.9;          // baseline of that line
            ctx.font = '700 ' + (m.fs * 0.9) + 'px Orbitron, sans-serif';
            ctx.fillStyle = 'rgba(58,65,80,.62)';
            ctx.textAlign = 'left';
            const lab = T('t_corpus', 'Ganzer Korpus').toUpperCase();   // the whole corpus - the pill above is this sentence
            ctx.fillText(lab, boxX, by);
            const lw = ctx.measureText(lab).width;
            const nf = '700 ' + (m.fs * 0.9) + 'px Orbitron, sans-serif';
            const epochTxt = T('t_epoch', 'Durchlauf') + ' ' + S.epoch;
            const ew = num(epochTxt, boxX + boxW, by, { font: nf, color: 'rgba(58,65,80,.55)', align: 'right', minDigits: 2 });
            const lvl = shownLevel();
            const valTxt = Math.round(lvl * 100) + ' %';
            const vx = boxX + boxW - ew - m.fs * 2.2;
            const vw = num(valTxt, vx, by, { font: nf, color: INK, align: 'right', minDigits: 3 });
            ctx.font = nf;
            ctx.textAlign = 'left';
            // the bar itself, between the label and the value
            const bx0 = boxX + lw + m.fs * 0.9, bx1 = vx - vw - m.fs * 0.9, bh = m.fs * 0.62;
            if (bx1 > bx0 + m.fs) {
                ctx.beginPath(); ctx.roundRect(bx0, by - bh * 0.95, bx1 - bx0, bh, bh / 2);
                ctx.fillStyle = 'rgba(58,65,80,.10)'; ctx.fill();
                ctx.beginPath(); ctx.roundRect(bx0, by - bh * 0.95, (bx1 - bx0) * lvl, bh, bh / 2);
                ctx.fillStyle = GREEN; ctx.fill();
            }
        }

        // --------------------------------------------------------- editing the text ---
        // A click into the box turns it into a plain text field over exactly the same rectangle: Doc types
        // his own sentence, Enter takes it, Esc drops it (Doc, 22.09.2026: "editierbar"). The learned share
        // stays where it is, so the border sits at the same fraction of whatever text is there now.
        const editor = document.createElement('textarea');
        editor.id = 'wv-edit';
        editor.hidden = true;
        editor.spellcheck = false;
        document.body.appendChild(editor);

        const inBox = (x, y) => S.box && x >= S.box.x && x <= S.box.x + S.box.w
            && y >= S.box.y && y <= S.box.y + S.box.h;

        function openEditor() {
            if (!S.box || !editor.hidden) return;
            S.running = false; playLabel();           // a running animation would keep changing under the field
            const cr = canvas.getBoundingClientRect(), b = S.box;
            editor.style.left = (cr.left + b.x) + 'px';
            editor.style.top = (cr.top + b.y) + 'px';
            editor.style.width = b.w + 'px';
            editor.style.height = Math.max(b.h, b.fs * 5) + 'px';
            editor.style.padding = (S.fit ? S.fit.top : b.pad) + 'px ' + (b.pad * 0.96) + 'px ' + b.pad + 'px';
            editor.style.fontSize = b.fs + 'px';
            editor.style.lineHeight = b.lh + 'px';
            editor.value = TEXT.join(' ');
            editor.hidden = false;
            editor.focus();
            editor.setSelectionRange(editor.value.length, editor.value.length);
        }

        function closeEditor(keep) {
            if (editor.hidden) return;
            const text = editor.value.replace(/\s+/g, ' ').trim();
            editor.hidden = true;
            if (!keep || !text) return;
            TEXT = text.split(/\s+/);
            TEXTS[textIx] = text;
            still();                                  // same learned share, new text under it
            draw();
        }

        editor.addEventListener('keydown', e => {
            e.stopPropagation();
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); closeEditor(true); }
            else if (e.key === 'Escape') { e.preventDefault(); closeEditor(false); }
        });
        editor.addEventListener('blur', () => closeEditor(true));

        // Space - and the widget's button: start, pause and go on, and once the sentence is through the next one
        function spaceAction() {
            if (S.mode !== 'run') startRun();
            else if (S.pos >= TEXT.length) { if (!lastSentence()) nextText(); }
            else { S.running = !S.running; S.stopAt = -1; S.ppStop = -1; if (S.running) S.t0 = S.lastT = performance.now(); playLabel(); }
        }
        addEventListener('keydown', e => {
            if (e.key !== ' ' || e.metaKey || e.ctrlKey || e.altKey) return;
            if (e.target.closest && e.target.closest('input, textarea, select, button, [contenteditable]')) return;
            e.preventDefault();
            spaceAction();
        });

        canvas.addEventListener('click', e => {
            const cr = canvas.getBoundingClientRect();
            if (inBox(e.clientX - cr.left, e.clientY - cr.top)) openEditor();
        });
        canvas.addEventListener('mousemove', e => {   // the caret only where there is something to type in
            const cr = canvas.getBoundingClientRect();
            canvas.style.cursor = inBox(e.clientX - cr.left, e.clientY - cr.top) ? 'text' : 'default';
        });

        // ------------------------------------------------------------------- the loop ---
        function frame() {
            if (S.running && S.mode === 'run') (S.view === 'patch' ? patchStep : settle)(performance.now());
            const lv = Math.round(shownLevel() * 100);  // the slider on the left follows the bar
            if (S.mode === 'run' && lv !== S.lvShown) {
                S.lvShown = lv;
                const sl = document.getElementById('wv-level'), lb = document.getElementById('wv-level-l');
                if (sl) sl.value = lv;
                if (lb) lb.textContent = lv + ' %';
            }
            resizeCanvasToContainer();            // the layout may settle long after load
            draw();
            requestAnimationFrame(frame);
        }

        function showStats() {
            const set = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
            if (S.view === 'patch') {                     // pieces behind the border: how many are right, wherever
                const o = openShare();
                set('wv-epoch', S.epoch);
                set('wv-hit', o.n ? o.pct + ' %' : '–');
                set('wv-red', (o.n - o.on) + ' / ' + o.n);
                set('wv-pos', '–');
                return;
            }
            const have = Math.min(TEXT.length, (S.mode === 'run' ? Math.min(S.pos, TEXT.length) + knownAhead(S.pos) : border() + knownAhead(border())));   // words the net has
            set('wv-epoch', S.epoch);
            set('wv-hit', TEXT.length ? Math.round(100 * have / TEXT.length) + ' %' : '–');
            set('wv-red', (TEXT.length - have) + ' / ' + TEXT.length);
            set('wv-pos', S.mode === 'run' ? Math.min(S.pos + 1, TEXT.length) + ' / ' + TEXT.length : '–');
        }

        // ----------------------------------------------------------------------- UI ---
        // open on exactly the picture Doc named: green up to and including "winziges", red from there on
        (function startBorder() {
            const k = TEXT.findIndex(w => /^winziges/i.test(w));
            if (k >= 0) S.given = (k + 1) / TEXT.length;
            const sv = saved();                       // what Doc set last time wins over the factory numbers
            if (sv.given >= 0 && sv.given <= 1) S.given = sv.given;
            if (sv.level >= 0 && sv.level <= 1) S.level = sv.level;
            if (sv.speed >= 80 && sv.speed <= 2000) S.speed = sv.speed;
            startGiven = S.given; startLevel = S.level; startSpeed = S.speed;
        })();

        function buildUI() {
            CyberUI.createCard('ui-container', T('card_run', 'Ablauf'), `
                <div style="display:flex; flex-direction:column; gap:14px;">
                    <div class="wv-btns">
                        <button class="cyber-btn" id="wv-play">${T('btn_play', 'Start')}</button>
                        <button class="cyber-btn" id="wv-step">${T('btn_step', 'Ein Wort')}</button>
                    </div>
                    <div class="wv-btns" role="group" aria-label="${T('l_view', 'Ablauf')}">
                        <button class="cyber-btn active" id="wv-view-wort" aria-pressed="true">${T('btn_view_wort', 'Wort für Wort')}</button>
                        <button class="cyber-btn" id="wv-view-patch" aria-pressed="false">${T('btn_view_patch', 'Patches')}</button>
                    </div>
                    <div class="wv-btns">
                        <button class="cyber-btn" id="wv-train">${T('btn_train', 'Ein Durchlauf')}</button>
                        <button class="cyber-btn" id="wv-reset">${T('btn_reset', 'Von vorn')}</button>
                    </div>
                    <div class="lab-note">${T('hint', 'Leertaste startet: der Rest hinter der Vorgabe steht als Buchstabensalat da und rastet Wort für Wort ein. „Patches“ zeigt, wie Training wirklich läuft: Das Netz sagt alle Stellen zugleich vorher, und überall im Text werden Stücke richtig und grün, zuerst Satzzeichen und häufige Wörter, zuletzt seltene. Ist der Satz durch, holt die Leertaste den nächsten — mit Lücken dort, wo das Netz noch nichts hat. Noch eine Leertaste, und er läuft, jedes Mal schneller. In den oberen Kasten klicken, um einen eigenen Satz zu schreiben; Enter übernimmt, Esc verwirft.')}</div>
                </div>`);

            CyberUI.createCard('ui-container', T('card_size', 'Lernen'), `
                <div style="display:flex; flex-direction:column; gap:14px;">
                    <div>
                        <div class="label-row"><span>${T('l_given', 'Vorgabe im Satz')}</span>
                            <span id="wv-given-l" class="cyber-number" style="font-size:.8rem; color:#9de8ff;">${Math.round(S.given * 100)} %</span></div>
                        <input type="range" id="wv-given" min="0" max="100" step="1" value="${Math.round(S.given * 100)}">
                    </div>
                    <div>
                        <div class="label-row"><span>${T('l_level', 'Vom Korpus gelernt')}</span>
                            <span id="wv-level-l" class="cyber-number" style="font-size:.8rem; color:#9de8ff;">${Math.round(S.level * 100)} %</span></div>
                        <input type="range" id="wv-level" min="0" max="100" step="1" value="${Math.round(S.level * 100)}">
                    </div>
                    <div>
                        <div class="label-row"><span>${T('l_speed', 'Tempo')}</span>
                            <span id="wv-speed-l" class="cyber-number" style="font-size:.8rem; color:#9de8ff;">${S.speed} ms</span></div>
                        <input type="range" id="wv-speed" min="120" max="2000" step="20" value="${S.speed}">
                    </div>
                </div>`);

            CyberUI.createCard('ui-container', T('card_stats', 'Stand'), `
                <div class="wv-rows">
                    <div class="wv-row"><span class="wv-key">${T('s_epoch', 'Durchlauf')}</span><span class="wv-val" id="wv-epoch">0</span></div>
                    <div class="wv-row"><span class="wv-key">${T('s_hit', 'Dieser Satz')}</span><span class="wv-val" id="wv-hit">–</span></div>
                    <div class="wv-row"><span class="wv-key">${T('s_red', 'noch offen')}</span><span class="wv-val" id="wv-red">–</span></div>
                    <div class="wv-row"><span class="wv-key">${T('s_pos', 'Wort')}</span><span class="wv-val" id="wv-pos">–</span></div>
                </div>
                <div class="lab-note">${T('s_note', 'Die Treffer steigen mit jedem Durchlauf — das ist das Training. Trifft es am Ende alles, hat es den Satz auswendig gelernt; interessant wird es erst bei einem Satz, den es nie gesehen hat.')}</div>`);

            const on = (id, ev, fn) => { const e = document.getElementById(id); if (e) e.addEventListener(ev, fn); };
            on('wv-play', 'click', () => {
                if (S.mode !== 'run' || S.pos >= TEXT.length) { startRun(); return; }   // from the picture, or once more after the end
                S.running = !S.running; S.stopAt = -1; S.ppStop = -1;
                if (S.running) S.t0 = S.lastT = performance.now();
                playLabel();
            });
            on('wv-step', 'click', () => {                 // one word settles, then it waits
                if (S.mode !== 'run' || S.pos >= TEXT.length) startRun();
                if (S.view === 'patch') {                  // with patches: a step as long as one word would take
                    S.ppStop = Math.min(1, S.pp + 1 / Math.max(1, TEXT.length - border() - knownAhead(border())));
                    S.running = true; S.lastT = performance.now();
                } else { S.stopAt = S.pos + 1; S.running = true; S.t0 = performance.now(); }
                playLabel();
            });
            on('wv-view-wort', 'click', () => setView('wort'));
            on('wv-view-patch', 'click', () => setView('patch'));
            on('wv-train', 'click', train);
            on('wv-reset', 'click', resetAll);
            on('wv-given', 'input', e => {
                S.given = startGiven = parseInt(e.target.value, 10) / 100;
                document.getElementById('wv-given-l').textContent = Math.round(S.given * 100) + ' %';
                still(); remember();
            });
            on('wv-level', 'input', e => {
                S.level = startLevel = parseInt(e.target.value, 10) / 100;
                document.getElementById('wv-level-l').textContent = Math.round(S.level * 100) + ' %';
                remember();
            });
            on('wv-speed', 'input', e => {
                S.speed = startSpeed = parseInt(e.target.value, 10);
                document.getElementById('wv-speed-l').textContent = S.speed + ' ms';
                remember();
            });
        }

        function resizeCanvasToContainer() {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            const w = Math.floor(Math.max(1, rect.width) * dpr);
            const h = Math.floor(Math.max(1, rect.height) * dpr);
            if (canvas.width === w && canvas.height === h) return false;
            canvas.width = w;
            canvas.height = h;
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
            return true;
        }

        function init() {
            resizeCanvasToContainer();
            draw();
        }

        window.addEventListener('resize', init);
        document.fonts.ready.then(function () { S.fit = null; init(); });   // measure again with the real font
        if (window.ResizeObserver) new ResizeObserver(init).observe(container);

        buildUI();
        resetAll();
        init();
        requestAnimationFrame(frame);
        // ?satz=3 opens at the third sentence, the ones before it counted as seen - for the deck, and for
        // checking; ?start runs on its own, for the deck where nobody clicks inside the frame
        (function fromUrl() {
            const q = new URLSearchParams(location.search);
            if (q.has('widget')) {
                document.body.classList.add('wv-widget');
                const fab = document.createElement('button');
                fab.id = 'wv-fab'; fab.type = 'button';
                fab.innerHTML = '<span id="wv-fab-l"></span><span class="wv-fab-key">' + T('key_space', 'oder Leertaste') + '</span>';
                fab.addEventListener('click', () => { spaceAction(); fab.blur(); });   // blur: Space goes on working
                (document.getElementById('wv-top') || document.body).appendChild(fab);
                fabWidth();
                document.fonts.ready.then(fabWidth);     // Orbitron may come later: measure again with it
                playLabel();
            }
            // ?vorgabe=60&korpus=0&tempo=280 - the deck sets the sliders, the stored ones stay untouched
            const num = (k, lo, hi, f) => { const v = parseFloat(q.get(k)); return isFinite(v) && v >= lo && v <= hi ? v * f : null; };
            const g = num('vorgabe', 0, 100, 0.01), l = num('korpus', 0, 100, 0.01), sp = num('tempo', 80, 2000, 1);
            if (g !== null) startGiven = g;
            if (l !== null) startLevel = l;
            if (sp !== null) startSpeed = sp;
            if (g !== null || l !== null || sp !== null) resetAll();
            if (q.get('modus') === 'patch') setView('patch');   // &modus=patch for the deck; word by word stays the default
            const n = parseInt(q.get('satz') || '1', 10);
            for (let k = 1; k < n && k < TEXTS.length; k++) {
                TEXT.forEach(w => SEEN.add(norm(w)));
                grow();
                textIx = (textIx + 1) % TEXTS.length; TEXT = TEXTS[textIx].split(/\s+/); S.nr++;
                S.speed = Math.max(80, Math.round(S.speed * 0.55));
            }
            if (n > 1) { still(); draw(); }
            if (q.has('start')) setTimeout(startRun, 600);
        })();
        log('Wortvorhersage: ' + TEXT.length + ' Wörter');
    </script>
</body>

</html>
