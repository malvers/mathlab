    <script type="module">
        /* The 3D dice come from js/dice3d.js (shared with wuerfel3d.html in the deck).
           Here: one die per player, placed by the 2D views through window.Dice3D. */
        import { DieView, refreshAllFaces } from './js/dice3d.js';

        const stage = document.getElementById('canvas-container');
        let views = null;
        try {
            const make = key => new DieView(stage, {
                style: 'dark',
                source: () => window.DICE3D_SOURCE(key),
                onTap: () => { if (window.DICE3D_TAP) window.DICE3D_TAP(key); }
            });
            views = { A: make('A'), B: make('B') };
        } catch (err) {
            try { if (window.DebugWindow) DebugWindow.log('🎲 kein WebGL, flache Würfel bleiben: ' + err.message); } catch (e) { }
        }
        if (views) {
            window.Dice3D = {
                ok: true,
                beginFrame() { views.A.used = false; views.B.used = false; },
                place(key, x, y, size, opts = {}) { if (views[key]) views[key].place(x, y, size, opts); },
                endFrame() { Object.values(views).forEach(v => { if (!v.used) v.dom.hidden = true; }); },
                refreshFaces() { refreshAllFaces(); }
            };
            if (typeof render === 'function') render();
        }
    </script>
