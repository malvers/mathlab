            drawTree(m, g, Object.assign({ win: true, labelB: E.labelB, pTex: E.pTex, decor: E.decor }, TREE_F));
            const px = tall ? 16 : g.w + 24, py = tall ? g.h + 10 : 20;
            const pw = tall ? W - 32 : W - g.w - 34;
            plate(px, py, pw, tall ? H - py - 10 : 420, 'rgba(224, 106, 94, 0.55)');
            label('FEHLER ' + (S.err + 1) + ' VON 5', px + 20, py + 26, 12, C.redHi, 'left');
            let yy = py + 46;
            yy += rich(E.title, px + 20, yy, 19, '#ffffff', { maxW: pw - 40 }) + 18;
            if (!E.applies) {
                rich('Bei diesen Würfeln fällt der Fehler nicht auf. Probiere die Würfel aus dem Deck.', px + 20, yy, 16, C.soft, { maxW: pw - 40 });
                return;
            }
            label('FALSCH', px + 20, yy + 8, 11, C.redHi, 'left');
            yy += 22;
            E.wrong.forEach(s => { yy += rich(s, px + 20, yy, 17, C.redHi, { maxW: pw - 40 }) + 10; });
            yy += 8;
            label('RICHTIG', px + 20, yy + 8, 11, C.greenHi, 'left');
            yy += 22;
            E.right.forEach(s => { yy += rich(s, px + 20, yy, 17, C.greenHi, { maxW: pw - 40 }) + 10; });
            yy += 8;
            rich(E.why, px + 20, yy, 16, C.text, { maxW: pw - 40 });
        }

        /* ------------------------------------------------ Merksatz & Rezept */
        const MERKSATZ = 'Entlang eines Pfades wird **multipliziert** — verschiedene Pfade zum selben Ereignis werden **addiert**.';
        const RECIPE = [
            { s: '**1.** Würfelnetze zählen: Wie oft steht jede Zahl drauf?', go: 'zaehlen' },
            { s: '**2.** Wahrscheinlichkeit je Zahl: Anzahl durch $6$, dann kürzen', go: 'zaehlen' },
            { s: '**3.** Baum zeichnen: erst Stufe $1$, dann an **jedes** Ende Stufe $2$', go: 'stufe2' },
            { s: '**4.** Pfadregel: entlang eines Weges **malnehmen**', go: 'pfad' },
            { s: '**5.** Summenregel: alle passenden Wege **addieren**', go: 'summe' }
        ];

        function sizeRezept(m, tall) { return tall ? { w: 520, h: 900 } : { w: 860, h: 600 }; }

        function drawRezept(m, W) {
            const mw = W - 68;
            const mh = 58 + richH(MERKSATZ, 24, mw) + 22;
            plate(10, 10, W - 20, mh, 'rgba(245, 194, 66, 0.7)');
            label('MERKSATZ', 34, 38, 13, C.orange, 'left');
            rich(MERKSATZ, 34, 60, 24, '#ffffff', { maxW: mw });
            let y = mh + 40;
            label('DAS REZEPT IN FÜNF SCHRITTEN', 20, y, 13, C.cyan, 'left');
            y += 20;
            RECIPE.forEach((r, i) => {
                const hi = S.recipeHi === i;
                const th = richH(r.s, 19, W - 130);
                const rowH = Math.max(58, th + 26);
                roundRect(10, y, W - 20, rowH, 12);
                ctx.fillStyle = hi ? 'rgba(245, 194, 66, 0.16)' : 'rgba(10, 24, 48, 0.72)';
                ctx.fill();
                ctx.strokeStyle = hi ? C.orange : 'rgba(0, 210, 255, 0.22)';
                ctx.lineWidth = hi ? 2 : 1.2;
                ctx.stroke();
                rich(r.s, 30, y + (rowH - th) / 2, 19, hi ? '#ffffff' : C.text, { maxW: W - 130 });
                ctx.font = '600 22px Outfit, sans-serif';
                ctx.fillStyle = C.cyan;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('→', W - 44, y + rowH / 2);
                addHit(10, y, W - 20, rowH, () => jumpToView(r.go));
                y += rowH + 12;
            });
        }

        /* ------------------------------------------------------- Simulation */
        function simReset(m) {
            S.sim = { key: m.key, n: 0, a: 0, b: 0, d: 0, hx: [], ha: [], hb: [], running: false, until: 0 };
        }

        function simRun(count) {
            const m = model();
            if (S.sim.key !== m.key) simReset(m);
            const sm = S.sim, fa = m.A.faces, fb = m.B.faces;
            for (let i = 0; i < count && sm.n < 1e7; i++) {
                const a = fa[Math.floor(Math.random() * 6)], b = fb[Math.floor(Math.random() * 6)];
                sm.n++;
                if (a > b) sm.a++; else if (a < b) sm.b++; else sm.d++;
                const lastX = sm.hx.length ? sm.hx[sm.hx.length - 1] : 0;
                if (sm.n <= 200 || sm.n >= lastX * 1.01) {
                    sm.hx.push(sm.n);
                    sm.ha.push(sm.a / sm.n);
                    sm.hb.push(sm.b / sm.n);
                }
            }
        }

        function simToggle(on) {
            const m = model();
            if (S.sim.key !== m.key) simReset(m);
            S.sim.running = on != null ? on : !S.sim.running;
            if (S.sim.running) kick();
            refreshPanelLive();
        }

        function sizeSim(m, tall) { return tall ? { w: 540, h: 900 } : { w: 980, h: 480 }; }

        function drawChart(m, x, y, w, h) {
            plate(x, y, w, h);
            const L = x + 62, R = x + w - 64, T = y + 30, B = y + h - 58;
            const sm = S.sim.key === m.key ? S.sim : null;
            [0, 0.25, 0.5, 0.75, 1].forEach(v => {
                const yy = B - v * (B - T);
                line(L, yy, R, yy, 'rgba(157, 232, 255, 0.12)', 1);
                tex(v === 0 ? '0' : (v === 1 ? '1' : decTex(v, 2)), L - 10, yy, 14, C.soft, { align: 'right', valign: 'middle' });
            });
            const nMax = Math.max(10, Math.pow(10, Math.ceil(Math.log10(Math.max(10, sm ? sm.n : 10)))));
            const X = n => L + Math.log10(n) / Math.log10(nMax) * (R - L);
            for (let p = 1; p <= nMax; p *= 10) {
                const xx = X(p);
                line(xx, T, xx, B, 'rgba(157, 232, 255, 0.12)', 1);
                tex(intTex(p), xx, B + 20, 14, C.soft, { align: 'center', valign: 'middle' });
            }
            label('RUNDEN', (L + R) / 2, B + 44, 10, C.soft, 'center', 400);
            const yP = v => B - v * (B - T);
            const yA = yP(valF(m.pA)), yB = yP(valF(m.pB));
            line(L, yA, R, yA, 'rgba(160, 212, 70, 0.75)', 1.6, [8, 6]);
            line(L, yB, R, yB, 'rgba(224, 106, 94, 0.75)', 1.6, [8, 6]);
            const sep = Math.abs(yA - yB) < 34 ? (yA <= yB ? -1 : 1) * (17 - Math.abs(yA - yB) / 2) : 0;
            tex(fr(m.pA), R + 10, yA + sep, 16, C.greenHi, { valign: 'middle' });
            tex(fr(m.pB), R + 10, yB - sep, 16, C.redHi, { valign: 'middle' });
            if (!sm || !sm.hx.length) return;
            [[sm.ha, C.greenHi], [sm.hb, C.redHi]].forEach(([ys, col]) => {
                ctx.beginPath();
                sm.hx.forEach((n, i) => {
                    const px = X(n), py = yP(ys[i]);
                    if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
                });
                ctx.strokeStyle = col;
                ctx.lineWidth = 2.2;
                ctx.lineJoin = 'round';
                ctx.stroke();
            });
        }

        function drawSim(m, W, H, tall) {
            addHit(0, 0, W, H, () => simToggle());
            const sm = S.sim.key === m.key ? S.sim : { n: 0, a: 0, b: 0, d: 0 };
            const pw = tall ? W - 20 : 330, ph = tall ? 390 : H - 20;
            plate(10, 10, pw, ph);
            label('SIMULATION', 30, 36, 12, C.orange, 'left');
            let yy = 56;
            const row = (s, col, size = 18) => { yy += rich(s, 30, yy, size, col, { maxW: pw - 40 }) + 12; };
            row('Runden: $' + intTex(sm.n) + '$', '#ffffff');
            row('**' + m.A.name + '** gewinnt: $' + intTex(sm.a) + '$', C.greenHi);
            row('**' + m.B.name + '** gewinnt: $' + intTex(sm.b) + '$', C.redHi);
            if (m.draws.length) row('unentschieden: $' + intTex(sm.d) + '$', C.soft);
            yy += 6;
            label('RELATIVE HÄUFIGKEIT', 30, yy + 6, 10, C.soft, 'left', 400);
            yy += 20;
            const rel = sm.n ? sm.a / sm.n : 0;
            row(sm.n ? '$\\frac{' + intTex(sm.a) + '}{' + intTex(sm.n) + '} \\approx ' + decTex(rel, 3) + '$' : '$-$', C.greenHi, 20);
            label('WAHRSCHEINLICHKEIT', 30, yy + 6, 10, C.soft, 'left', 400);
            yy += 20;
            row('$' + fr(m.pA) + ' \\approx ' + decTex(valF(m.pA), 3) + '$', C.greenHi, 20);
            if (sm.n) row('Abweichung: $' + decTex(Math.abs(rel - valF(m.pA)), 3) + '$', C.soft, 16);
            if (tall) drawChart(m, 10, ph + 30, W - 20, H - ph - 40);

        /* ------------------------------------------------------ Efron-Würfel */
        const EFRON_POS = { A: [0, 0], B: [1, 0], C: [1, 1], D: [0, 1] };
        const EFRON_ARROWS = ['AB', 'BC', 'CD', 'DA'];

        function efronModel(pair) {
            return buildModel({ a: { name: 'Würfel ' + pair[0], faces: EFRON[pair[0]] }, b: { name: 'Würfel ' + pair[1], faces: EFRON[pair[1]] } });
        }

        function sizeEfron(m, tall) { return tall ? { w: 540, h: 960 } : { w: 920, h: 560 }; }

        function drawEfron(m, W, H, tall) {
            const s = 30, netW = 3 * s, netH = 4 * s;
            const pos = k => {
                const [c, r] = EFRON_POS[k];
                return { x: 30 + c * 380, y: 56 + r * 330 };
            };
            const models = {};
            EFRON_ARROWS.forEach(p => { models[p] = efronModel(p); });
            ['A', 'B', 'C', 'D'].forEach(k => {
                const p = pos(k);
                const pm = efronModel(k + 'A');
                label('WÜRFEL ' + k, p.x + netW / 2, p.y - 22, 13, S.efron.indexOf(k) >= 0 ? C.orange : C.cyan, 'center');
                drawNet(p.x, p.y, s, 'A', pm, {});
            });
            EFRON_ARROWS.forEach(pair => {
                const a = pos(pair[0]), b = pos(pair[1]);
                const ax = a.x + netW / 2, ay = a.y + netH / 2, bx = b.x + netW / 2, by = b.y + netH / 2;
                const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy);
                const ux = dx / len, uy = dy / len, cut = Math.abs(ux) > 0.5 ? 92 : 104;
                const x1 = ax + ux * cut, y1 = ay + uy * cut, x2 = bx - ux * cut, y2 = by - uy * cut;
                const on = S.efron === pair;
                const col = on ? C.orange : 'rgba(157, 232, 255, 0.75)';
                line(x1, y1, x2, y2, col, on ? 3.4 : 2);
                ctx.beginPath();
                ctx.moveTo(x2, y2);
                ctx.lineTo(x2 - ux * 16 - uy * 9, y2 - uy * 16 + ux * 9);
                ctx.lineTo(x2 - ux * 16 + uy * 9, y2 - uy * 16 - ux * 9);
                ctx.closePath();
                ctx.fillStyle = col;
                ctx.fill();
                const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
                tex(fr(models[pair].pA), mx, my, 22, on ? C.orange : '#ffffff', { align: 'center', valign: 'middle', bg: C.labelBg, edge: col });
                addHit(mx - 50, my - 40, 100, 80, () => pickEfron(pair));
            });
            ctx.font = '600 17px Outfit, sans-serif';
            ctx.fillStyle = C.orange;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('Wer zuerst wählt, verliert!', 30 + 190 + netW / 2, 56 + 165 + netH / 2);

            const px = tall ? 10 : 560, py = tall ? 560 : 10, pw = tall ? W - 20 : W - 570, ph = tall ? H - 570 : H - 20;

            row('Würfel gibt es seit mindestens $5000$ Jahren, schon im alten Orient wurde gewürfelt.', C.text);
            row('Der Statistiker **Bradley Efron** erfand vier Würfel: A schlägt B, B schlägt C, C schlägt D und D wieder A, jedes Mal mit $\\frac{2}{3}$.', C.text);
            row('Solche Würfel heißen **nicht-transitiv**: Zu jedem Würfel gibt es einen besseren.', C.text);
            const pm = models[S.efron];
            yy += 4;
            label('WÜRFEL ' + S.efron[0] + ' GEGEN WÜRFEL ' + S.efron[1], px + 20, yy + 6, 11, C.orange, 'left');

            Solita.on = false;

            clearTimeout(Solita.timer);

            if (!Solita.on) return;

                    Solita.held = true;
                    refreshPanelLive();
                    return;

                if (S.step >= STATIONS.length - 1) { solitaStop(); return; }
                // let the last picture stand for a moment before the page turns
                clearTimeout(Solita.timer);
                Solita.timer = setTimeout(() => { if (Solita.on) gotoStep(S.step + 1); }, PAUSE_STATION);
                return;

            const clip = Solita.queue[Solita.pos];
            if (st.onClip) st.onClip(clip);

        function resetStationState() {
            S.rulesHi = -1;
            S.focus = null;
            S.recipeHi = -1;
            S.sel = 0;
            S.countHi = { A: null, B: null };
            S.merge = { die: 'B', grouped: true, u: 1, t0: 0, from: 1 };
            S.showSolution = false;
            if (S.sim.running) S.sim.running = false;
            closePicker();
        }

        function gotoStep(i) {
            const next = clamp(i, 0, STATIONS.length - 1);
            if (next === S.step && S.mode === 'rundgang') return;
            clearTimeout(Solita.timer);
            S.step = next;
            resetStationState();
            buildUI();
            render();
            if (Solita.on) playStation();
            else if (Solita.held) { Solita.held = false; refreshPanelLive(); }
            dbg('Station ' + (S.step + 1) + ': ' + STATIONS[S.step].short);
        }

        function setView(k) {
            if (!VIEWS[k]) return;
            S.view = k;
            resetStationState();
            buildUI();
            render();
        }

        function stepBy(d) {
            if (S.mode === 'rundgang') { gotoStep(S.step + d); return; }
            const i = LAB_VIEWS.indexOf(S.view);
            setView(LAB_VIEWS[(i + d + LAB_VIEWS.length) % LAB_VIEWS.length]);
        }

        function jumpToView(k) {
            if (S.mode === 'rundgang') {
                const i = STATIONS.findIndex(s => s.view === k);
                if (i >= 0) gotoStep(i);
            } else if (LAB_VIEWS.indexOf(k) >= 0) setView(k);
        }

        function setMode(mode) {
            if (mode === S.mode) return;
            solitaStop();
            S.mode = mode;
            resetStationState();
            buildUI();
            render();
        }

        function setSolution(v) {
            S.showSolution = v;
            buildUI();
            render();
            if (v && Solita.held) solitaStart();
            else if (!v && Solita.on) solitaStop();
        }

        function onDiceChanged() {
            S.last = null;
            S.anim = null;
            S.sel = 0;
            S.countHi = { A: null, B: null };
            S.sim.running = false;
            buildUI();
            render();
            dbg('Würfel: ' + S.lab.a.name + ' [' + S.lab.a.faces.join(',') + '] gegen ' + S.lab.b.name + ' [' + S.lab.b.faces.join(',') + ']');
        }

        function setPreset(id) {
            if (!PRESETS[id]) return;
            S.lab = presetDice(id);
            S.labPreset = id;
            onDiceChanged();
        }

        function randomDice() {
            const one = () => {
                const pool = [1, 2, 3, 4, 5, 6, 7, 8, 9].sort(() => Math.random() - 0.5);
                const vals = pool.slice(0, 2 + Math.floor(Math.random() * 2));
                const faces = vals.slice();
                while (faces.length < 6) faces.push(vals[Math.floor(Math.random() * vals.length)]);
                return faces.sort(() => Math.random() - 0.5);
            };
            S.lab = { a: { name: S.lab.a.name, faces: one() }, b: { name: S.lab.b.name, faces: one() } };
            S.labPreset = 'eigene';
            onDiceChanged();
        }

        function swapDice() {
            S.lab = { a: S.lab.b, b: S.lab.a };
            S.labPreset = 'eigene';
            onDiceChanged();
        }

        function pickEfron(pair) {
            S.efron = pair;
            if (S.mode === 'labor') {
                S.lab = presetDice('efron' + pair);
                S.labPreset = 'efron' + pair;
                onDiceChanged();
            } else render();
        }

        /* --------------------------------------------------------- Face picker */
        function openPicker(key, idx, h) {
            if (S.mode !== 'labor') return;
            const pk = document.getElementById('ws-pick');
            const die = key === 'A' ? S.lab.a : S.lab.b;
            pk.innerHTML = '';
            for (let v = 0; v <= 9; v++) {
                const b = document.createElement('button');
                b.type = 'button';
                if (v === die.faces[idx]) b.className = 'on';
                b.innerHTML = katexStr(String(v));
                b.addEventListener('click', e => {
                    e.stopPropagation();
                    die.faces[idx] = v;
                    S.labPreset = 'eigene';
                    closePicker();
                    onDiceChanged();
                });
                pk.appendChild(b);
            }
            pk.hidden = false;
            const cw = container.clientWidth, chh = container.clientHeight;
            const pw = pk.offsetWidth, ph = pk.offsetHeight;
            let x = VIEW.ox + (h.x + h.w) * VIEW.sc + 8;
            if (x + pw > cw - 8) x = VIEW.ox + h.x * VIEW.sc - pw - 8;
            const y = VIEW.oy + h.y * VIEW.sc;
            pk.style.left = clamp(x, 8, Math.max(8, cw - pw - 8)) + 'px';
            pk.style.top = clamp(y, 8, Math.max(8, chh - ph - 8)) + 'px';
        }

        function closePicker() {
            const pk = document.getElementById('ws-pick');
            if (pk) pk.hidden = true;
        }

        document.addEventListener('pointerdown', ev => {
            const pk = document.getElementById('ws-pick');
            if (pk && !pk.hidden && !pk.contains(ev.target) && ev.target !== canvas) closePicker();
        });

        /* ================================================================= UI */
        function katexStr(src, display) {
            if (!window.katex) return src;
            try { return katex.renderToString(src, { throwOnError: false, displayMode: !!display }); }
            catch (e) { return src; }
        }

        // $...$ inside HTML becomes KaTeX
        function texHTML(html) {
            if (!window.katex) return html;
            return html.replace(/\$([^$]+)\$/g, (_, src) => katexStr(src));
        }

        const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };

        function showResult() {
            if (S.mode === 'labor') return true;
            const st = STATIONS[S.step];
            if (st.id === 'zwilling') return S.showSolution;
            return S.step >= STATIONS.findIndex(s => s.id === 'summe');
        }

                CyberUI.createDropdown('ws-view', LAB_VIEWS.map(k => ({ id: k, label: viewName(k).toUpperCase() })), setView, S.view);
                on('ws-prev', 'click', () => stepBy(-1));
                on('ws-next', 'click', () => stepBy(1));
            }

            const vk = viewKey();
            const ctxHTML = contextCard(vk);
            if (ctxHTML) CyberUI.createCard('ui-container', viewName(vk), ctxHTML, 'rgb(121, 158, 49)');
            on('ws-roll', 'click', rollDice);
            on('ws-score0', 'click', () => { S.score = { key: '', n: 0, A: 0, B: 0, D: 0 }; S.last = null; render(); });
            if (document.getElementById('ws-mdie')) {
                const m = model();
                CyberUI.createRadioGroup('ws-mdie', null, [
                    { label: dieTitle(m.A.name).toUpperCase(), value: 'A' },

                ], S.merge.die, v => { S.merge.die = v; render(); });

            if (showResult()) {
                CyberUI.createCard('ui-container', T('card_result', 'Ergebnis'), '<div class="ws-res" id="ws-result"></div>', 'rgb(160, 212, 70)');
            }

            CyberUI.createCard('ui-container', T('card_keys', 'Tasten'), '<div class="ws-note" style="margin-top:0">' + (S.mode === 'rundgang'
                ? T('keys_tour', '<b>◀ ▶</b> Station, <b>Leertaste</b> würfeln, <b>s</b> Solita, <b>m</b> Labor, <b>z</b> zusammenfassen, <b>d</b> Dauerlauf, <b>l</b> Lösung, Ziffern wählen den Fehler.')
                : T('keys_lab', '<b>◀ ▶</b> Ansicht, <b>Leertaste</b> würfeln, <b>m</b> Rundgang, <b>z</b> zusammenfassen, <b>d</b> Dauerlauf, Ziffern wählen den Fehler.')) + '</div>');

        // Cheap updates that do not rebuild the panel
        function refreshPanelLive() {
            const m = model();
            const set = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };
            if (S.mode === 'rundgang') {

                        : (Solita.held ? T('btn_solita_solution', '▶ ZUR LÖSUNG') : T('btn_solita', '▶ SOLITA ERKLÄRT'));

                        : T('solita_off', 'Solita liest den Rundgang mit ihrer Stimme aus dem Deck vor.')));
            } else {
                set('ws-count', (LAB_VIEWS.indexOf(S.view) + 1) + ' / ' + LAB_VIEWS.length);
                const line1 = d => '<div><b>' + d.name + ':</b> ' + katexStr(d.faces.slice().sort((a, b) => a - b).join(',\\;')) + '</div>';
                set('ws-dice', line1(m.A) + line1(m.B));
            }
            const mt = document.getElementById('ws-mtoggle');
            if (mt) mt.textContent = S.merge.grouped ? T('btn_unmerge', 'SECHS ÄSTE ZEIGEN') : T('btn_merge', 'ZUSAMMENFASSEN');
            const sr = document.getElementById('ws-simrun');
            if (sr) {
                sr.textContent = S.sim.running ? T('btn_simstop', 'ANHALTEN') : T('btn_simrun', 'DAUERLAUF');
                sr.classList.toggle('ws-on', S.sim.running);
            }
            const res = document.getElementById('ws-result');
            if (res) {
                const row = (cls, who, f) => '<div class="' + cls + '">' +
                    katexStr('P(\\text{' + who + '}) = ' + fr(f) + ' ' + pctEq(f)) + '</div>';
                let html = row('ws-a', m.A.name + ' gewinnt', m.pA) + row('ws-b', m.B.name + ' gewinnt', m.pB);
                if (m.nD) html += row('ws-d', 'unentschieden', m.pD);

        }

        function renderCoach() {
            const box = document.getElementById('math-coach-box');
            if (box) box.classList.add('visible');
            const titleEl = document.getElementById('coach-title-slot');
            const body = document.getElementById('coach-content');
            let title, html;
            const m = model();
            if (S.mode === 'rundgang') {
                const st = STATIONS[S.step];
                title = T('st_' + st.id + '_title', st.title);
                html = (st.id === 'zwilling' && S.showSolution)
                    ? T('st_zwilling_solution', st.solutionBody)
                    : T('st_' + st.id + '_body', st.body);
            } else {
                title = viewName(S.view);
                html = LAB_TEXT[S.view] ? T('lab_' + S.view, LAB_TEXT[S.view], {
                    a: m.A.name, b: m.B.name, gA: gen(m.A.name), gB: gen(m.B.name), pA: fr(m.pA)
                }) : '';
            }
            // Keep the collapse button of coach-box.js: only the text span changes
            if (titleEl) {
                let span = titleEl.querySelector('.ws-ct');
                if (!span) {
                    span = document.createElement('span');
                    span.className = 'ws-ct';
                    titleEl.insertBefore(span, titleEl.firstChild);
                }
                span.textContent = title.toUpperCase();
            }
            if (body) body.innerHTML = texHTML(html);
        }

        /* ============================================================= RENDER */
        let VIEW = { ox: 0, oy: 0, sc: 1 };

        // The coach box floats top left over the stage - the view goes right of it or
        // below it, whichever lets it grow bigger. Measured on every frame.
        function stageRegions(rect) {
            // top: room for the canvas branding in the top right corner
            const pad = 14, top = 60;
            const full = { x: pad, y: top, w: rect.width - 2 * pad, h: rect.height - top - pad };
            const box = document.getElementById('math-coach-box');
            if (!box || !box.classList.contains('visible')) return [full];
            const b = box.getBoundingClientRect();
            const bx = b.right - rect.left, by = b.bottom - rect.top;
            const out = [];
            const right = { x: bx + pad, y: top, w: rect.width - bx - 2 * pad, h: rect.height - top - pad };
            const below = { x: pad, y: by + pad, w: rect.width - 2 * pad, h: rect.height - by - 2 * pad };
            [right, below].forEach(r => { if (r.w > 160 && r.h > 160) out.push(r); });
            return out.length ? out : [full];
        }

        function render() {
            const rect = container.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, rect.width, rect.height);
            if (rect.width < 20 || rect.height < 20) return;
            const m = model();
            const V = VIEWS[viewKey()];
            let best = null;
            stageRegions(rect).forEach(r => [false, true].forEach(tall => {
                const sz = V.size(m, tall);
                const sc = Math.min(r.w / sz.w, r.h / sz.h, 1.6);
                if (!best || sc > best.sc + 0.001) best = { r, tall, sz, sc };
            }));
            const ox = best.r.x + (best.r.w - best.sz.w * best.sc) / 2;
            const oy = best.r.y + Math.max(0, (best.r.h - best.sz.h * best.sc) / 2);
            VIEW = { ox, oy, sc: best.sc };
            hits.length = 0;
            ctx.setTransform(dpr * best.sc, 0, 0, dpr * best.sc, dpr * ox, dpr * oy);
            try {
                V.draw(m, best.sz.w, best.sz.h, best.tall, performance.now());
            } catch (err) {
                dbg('Zeichenfehler in ' + viewKey() + ': ' + err.message);
            }
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        let rafId = 0;

        function kick() {
            if (!rafId) rafId = requestAnimationFrame(tick);
        }

        function tick(now) {
            rafId = 0;
            let more = false;
            if (S.anim) {
                if (now - S.anim.t0 >= ROLL.total) finishRoll();
                else more = true;
            }
            if (S.merge.t0) {
                if (now - S.merge.t0 > MERGE_MS) S.merge.t0 = 0;
                more = true;   // one more frame draws the final state
            }
            if (S.sim.running) {
                simRun(clamp(Math.round(S.sim.n * 0.03), 1, 20000));
                if (S.sim.n >= 1e7) { S.sim.running = false; refreshPanelLive(); } else more = true;
            }
            render();
            if (more) kick();
        }

        /* -------------------------------------------------------------- Input */
        function hitAt(ev) {
            const r = canvas.getBoundingClientRect();
            const x = (ev.clientX - r.left - VIEW.ox) / VIEW.sc;
            const y = (ev.clientY - r.top - VIEW.oy) / VIEW.sc;
            for (let i = hits.length - 1; i >= 0; i--) {
                const h = hits[i];
                if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) return h;
            }
            return null;
        }

        canvas.addEventListener('pointerdown', ev => {
            const pk = document.getElementById('ws-pick');
            if (!pk.hidden) { closePicker(); return; }
            const h = hitAt(ev);
            if (h) { ev.preventDefault(); h.fn(h); }
        });

        canvas.addEventListener('pointermove', ev => {
            const h = hitAt(ev);
            canvas.style.cursor = h ? h.cursor : 'default';
        });

        window.addEventListener('keydown', ev => {
            if (ev.metaKey || ev.ctrlKey || ev.altKey) return;   // Cmd-Shift-R belongs to the browser
            const t = ev.target;
            if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
            const k = ev.key, vk = viewKey();
            let done = true;
            if (k === 'ArrowRight') stepBy(1);
            else if (k === 'ArrowLeft') stepBy(-1);
            else if (k === ' ') {
                if (vk === 'spiel' || vk === 'netze' || vk === 'zweistufig') rollDice();
                else if (vk === 'sim') { simRun(1); render(); }
                else if (vk === 'merge') toggleMerge();
                else done = false;
            }
            else if (k === 'm') setMode(S.mode === 'labor' ? 'rundgang' : 'labor');
            else if (k === 's' && S.mode === 'rundgang') { if (Solita.on) solitaStop(); else if (Solita.held) setSolution(true); else solitaStart(); }
            else if (k === 'l' && vk === 'zwilling') setSolution(!S.showSolution);
            else if (k === 'z' && vk === 'merge') toggleMerge();
            else if (k === 'd' && vk === 'sim') simToggle();
            else if (/^[1-5]$/.test(k) && vk === 'fehler') { S.err = parseInt(k, 10) - 1; refreshErrRadio(); render(); }
            else if (k === 'Escape') closePicker();
            else done = false;
            if (done) ev.preventDefault();
        });

        /* -------------------------------------------------------------- Setup */
        function resizeCanvasToContainer() {
            const dpr = window.devicePixelRatio || 1;
            const rect = container.getBoundingClientRect();
            const w = Math.max(1, rect.width);
            const h = Math.max(1, rect.height);
            canvas.width = Math.floor(w * dpr);
            canvas.height = Math.floor(h * dpr);
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
        }

        function init() {
            resizeCanvasToContainer();
            render();
        }

        // Canvas text needs the fonts loaded - measured with a fallback font the TeX would sit wrong
        function fontsChanged() {
            texCache.clear();
            init();
        }

        buildUI();
        window.addEventListener('resize', init);
        if (window.ResizeObserver) {
            new ResizeObserver(() => init()).observe(container);
            new ResizeObserver(() => render()).observe(document.getElementById('math-coach-box'));
        }
        Promise.all(['20px KaTeX_Main', 'bold 20px KaTeX_Main', 'italic 20px KaTeX_Math', '400 20px Outfit',
            '600 20px Outfit', '700 20px Orbitron', '400 20px Orbitron'].map(f => document.fonts.load(f).catch(() => null)))
            .then(fontsChanged);
        document.fonts.ready.then(fontsChanged);
        // KaTeX arrives with defer: panel and coach box get their formulas then
        document.addEventListener('DOMContentLoaded', () => { buildUI(); render(); });
        window.addEventListener('load', () => { buildUI(); fontsChanged(); });
        init();
        dbg('Würfelspiel-Labor bereit');
    </script>
</body>

</html>
