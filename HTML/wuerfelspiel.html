<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOC ALVERS MATHE-LABORE | Das Würfelspiel</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="resources/favicon.svg">
    <link rel="icon" type="image/png" sizes="256x256" href="resources/favicon.png">
    <link rel="stylesheet" href="js/cyber-layout.css">
    <link rel="stylesheet" href="js/buttons-ultra.css">
    <link rel="stylesheet" href="js/cyber-lab-overrides.css">
    <link rel="stylesheet" href="js/branding.styles.extracted.css">
    <link rel="stylesheet" href="js/lab-shell-minimal.css">
    <!-- Local KaTeX, same copy the decks use: works in class without the CDN -->
    <link rel="stylesheet" href="morpheus/vendor/katex/katex.min.css">
    <script defer src="morpheus/vendor/katex/katex.min.js"></script>
    <style>
        /* Readouts, hint boxes and the face picker - everything else comes from the central layout */

        /* The shared box carries no offsets - every lab places it itself. */
        #math-coach-box {
            left: 24px;
            top: 24px;
            max-width: calc(100% - 48px);
            box-sizing: border-box;
        }

        #coach-content .katex { font-size: 1.08em; }

        [hidden] { display: none !important; }

        .ws-note {
            margin-top: 9px;
            font-size: 0.76rem;
            line-height: 1.45;
            color: #cfe0f5;
            border-left: 2px solid rgba(245, 194, 66, 0.65);
            padding-left: 9px;
        }

        .ws-note .katex { font-size: 1.05em; }

        .ws-btns { display: flex; flex-wrap: wrap; gap: 7px; }

        .ws-btns .cyber-btn {
            flex: 1 1 auto;
            width: auto;
            min-height: 40px;
            padding: 8px 12px !important;
            font-size: 0.66rem !important;
            letter-spacing: 0.5px !important;
        }

        .ws-btns .cyber-btn.ws-on {
            border-color: rgb(245, 194, 66) !important;
            color: rgb(245, 194, 66) !important;
            box-shadow: 0 0 12px rgba(245, 194, 66, 0.35);
        }

        .ws-res {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.95rem;
            color: #dbe8f7;
        }

        .ws-res .ws-a { color: rgb(160, 212, 70); }
        .ws-res .ws-b { color: #e06a5e; }
        .ws-res .ws-d { color: #9fb4d6; }

        .ws-dice { display: flex; flex-direction: column; gap: 6px; font-size: 0.8rem; color: #cfe0f5; }

        #canvas { touch-action: none; }

        /* Face picker: tap a face of a die net in the lab, choose its new number */
        #ws-pick {
            position: absolute;
            z-index: 30;
            display: grid;
            grid-template-columns: repeat(5, 42px);
            gap: 6px;
            padding: 10px;
            background: rgba(8, 18, 38, 0.94);
            border: 1px solid rgba(0, 210, 255, 0.4);
            border-radius: 14px;
            box-shadow: 0 10px 34px rgba(0, 0, 0, 0.5);
        }

        #ws-pick button {
            height: 42px;
            border-radius: 9px;
            border: 1px solid rgba(157, 232, 255, 0.35);
            background: rgba(20, 40, 72, 0.9);
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
        }

        #ws-pick button:hover { border-color: #9de8ff; background: rgba(0, 110, 160, 0.55); }

        #ws-pick button.on { border-color: rgb(245, 194, 66); color: rgb(245, 194, 66); }
    </style>
</head>

<body>

            </div>

            <div id="ws-pick" hidden></div>
        </div>
    </main>

    <script src="js/cyber-left-chrome.js"></script>
    <script src="js/branding/briefings.js"></script>
    <script src="js/branding/overlays.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/branding/nav.js"></script>
    <script src="js/branding.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/coach-box.js"></script>
    <script>
        function toggleSidebar() {
            const panel = document.getElementById('side-panel');
            panel.classList.toggle('collapsed');
            if (window.CyberLeftChrome && typeof CyberLeftChrome.publishResolvedScale === 'function') {
                CyberLeftChrome.publishResolvedScale();
            }
            setTimeout(() => {
                window.dispatchEvent(new Event('resize'));
                if (typeof init === 'function') init();
                if (window.CyberLeftChrome && typeof CyberLeftChrome.publishResolvedScale === 'function') {
                    CyberLeftChrome.publishResolvedScale();
                }
            }, 400);
        }

        // CyberI18n.get() returns the key itself when it is missing - only getOr() gives a fallback.
        // Placeholders like {a} are filled in the translation and in the German fallback alike.
        const T = (k, fb, rep) => {
            let s = (typeof CyberI18n !== 'undefined' && CyberI18n.getOr)
                ? CyberI18n.getOr('wuerfel.' + k, fb) : fb;
            if (rep) Object.keys(rep).forEach(p => { s = s.split('{' + p + '}').join(rep[p]); });
            return s;
        };

        function dbg(m) { try { if (window.DebugWindow) DebugWindow.log('🎲 ' + m); } catch (e) { } }

        CyberBranding.init({
            useExternalStyles: true,
            title: CyberI18n.get('ui.coach_title'),
            subtitle: T('subtitle', 'Das Würfelspiel'),
        });
        CyberUI.init();

        if (window.CyberLeftChrome && typeof CyberLeftChrome.configure === 'function') {
            CyberLeftChrome.configure({ viewportOnlyZoom: true });
        }

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');

        /* ------------------------------------------------------------ Colours */
        // House palette: lambda orange, upsilon red, phi green
        const C = {
            orange: 'rgb(245, 194, 66)',
            red: 'rgb(176, 36, 24)',
            green: 'rgb(121, 158, 49)',
            greenHi: 'rgb(160, 212, 70)',
            redHi: '#e06a5e',
            cyan: '#9de8ff',
            neon: '#00d2ff',
            text: '#dbe8f7',
            soft: '#9fb4d6',
            branch: 'rgba(157, 232, 255, 0.8)',
            mutedLine: 'rgba(159, 180, 214, 0.3)',
            plate: 'rgba(8, 18, 38, 0.72)',
            plateEdge: 'rgba(0, 210, 255, 0.22)',
            labelBg: 'rgba(6, 14, 30, 0.9)'
        };

        // Equal numbers share a colour. Same order as the deck figures:
        // Lena 3 orange, 5 green, 7 blue - Mia 4 blue, 6 red.
        const TINTS = {
            A: ['245, 194, 66', '121, 158, 49', '90, 150, 255', '180, 120, 255', '0, 210, 255', '255, 120, 170'],
            B: ['90, 150, 255', '224, 106, 94', '180, 120, 255', '0, 210, 255', '245, 194, 66', '121, 158, 49']
        };

        /* ------------------------------------------------------------- Dice */
        // Faces in net order: three on top, then the column below the middle one.
        // Opposite faces: top0-top2, top1-col1, col0-col2.
        const OPP = [2, 4, 0, 5, 1, 3];

        const PRESETS = {
            deck: { label: 'Deck: Lena gegen Mia', a: { name: 'Lena', faces: [3, 5, 3, 7, 5, 7] }, b: { name: 'Mia', faces: [4, 6, 4, 4, 6, 4] } },
            zwilling: { label: 'Zwillingsaufgabe: Paul gegen Jonas', a: { name: 'Paul', faces: [1, 5, 1, 6, 5, 6] }, b: { name: 'Jonas', faces: [2, 4, 2, 4, 2, 4] } },
            normal: { label: 'Zwei normale Spielwürfel', a: { name: 'Anna', faces: [2, 1, 5, 3, 6, 4] }, b: { name: 'Ben', faces: [2, 1, 5, 3, 6, 4] } },
            efronAB: { label: 'Efron: A gegen B', efron: 'AB' },
            efronBC: { label: 'Efron: B gegen C', efron: 'BC' },
            efronCD: { label: 'Efron: C gegen D', efron: 'CD' },
            efronDA: { label: 'Efron: D gegen A', efron: 'DA' }
        };

        // Bradley Efron's four non-transitive dice: A beats B, B beats C, C beats D, D beats A - each with 2/3
        const EFRON = { A: [4, 0, 4, 4, 0, 4], B: [3, 3, 3, 3, 3, 3], C: [2, 6, 2, 2, 6, 2], D: [5, 1, 5, 1, 5, 1] };

        function presetDice(id) {
            const p = PRESETS[id];
            if (p.efron) {
                const x = p.efron[0], y = p.efron[1];
                return { a: { name: 'Würfel ' + x, faces: EFRON[x].slice() }, b: { name: 'Würfel ' + y, faces: EFRON[y].slice() } };
            }
            return { a: { name: p.a.name, faces: p.a.faces.slice() }, b: { name: p.b.name, faces: p.b.faces.slice() } };
        }

        // German genitive for the die titles: Lenas, Jonas', but "Würfel A" stays as it is
        const isDieName = n => /^Würfel /.test(n);
        const gen = n => isDieName(n) ? n : (/[sxzß]$/.test(n) ? n + '’' : n + 's');
        const dieTitle = n => isDieName(n) ? n : gen(n) + ' Würfel';
        const WORDS = ['null', 'eine', 'zwei', 'drei', 'vier', 'fünf', 'sechs'];
        const WORDS_M = ['kein', 'ein', 'zwei', 'drei', 'vier', 'fünf', 'sechs'];

        /* ------------------------------------------------------------ Fractions */
        const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
        const F = (p, q) => { if (p === 0) return { p: 0, q: 1 }; const g = gcd(p, q) || 1; return { p: p / g, q: q / g }; };
        const addF = (x, y) => F(x.p * y.q + y.p * x.q, x.q * y.q);
        const mulF = (x, y) => F(x.p * y.p, x.q * y.q);
        const valF = f => f.p / f.q;
        const eqF = (x, y) => x.p === y.p && x.q === y.q;

        // TeX of a fraction: 1 stays 1, 2/9 becomes \frac{2}{9}
        const fr = f => f.q === 1 ? String(f.p) : '\\frac{' + f.p + '}{' + f.q + '}';

        // German decimals in TeX: 55{,}6
        function decTex(x, digits) {
            return x.toFixed(digits).replace('.', '{,}');
        }

        // "\approx 55{,}6\,\%" or "= 50\,\%" when one decimal is exact
        function pctEq(f) {
            const exact = (f.p * 1000) % f.q === 0;
            let s = decTex(100 * valF(f), 1);
            if (exact) s = s.replace(/\{,\}0$/, '');
            return (exact ? '= ' : '\\approx ') + s + '\\,\\%';
        }

        function pctTex(f) {
            return pctEq(f).replace(/^(= |\\approx )/, '');
        }

        // Big counts get a thin space every three digits: 12\,345
        function intTex(n) {
            const s = String(n);
            return s.length <= 4 ? s : s.replace(/\B(?=(\d{3})+(?!\d))/g, '\\,');
        }

        /* ---------------------------------------------------------------- Model */
        function groups(faces) {
            const m = new Map();
            faces.forEach(v => m.set(v, (m.get(v) || 0) + 1));
            return [...m.entries()].sort((x, y) => x[0] - y[0]).map(([v, c], i) => ({ v, c, i, f: F(c, 6) }));
        }

        let modelCache = { key: '', m: null };

        function buildModel(dice) {
            const key = JSON.stringify(dice);
            if (modelCache.key === key) return modelCache.m;
            const GA = groups(dice.a.faces), GB = groups(dice.b.faces);
            const paths = [];
            GA.forEach((ga, i) => GB.forEach((gb, j) => {
                const w = ga.v > gb.v ? 'A' : (ga.v < gb.v ? 'B' : 'D');
                paths.push({ i, j, k: paths.length, a: ga.v, b: gb.v, ca: ga.c, cb: gb.c, n36: ga.c * gb.c, f: F(ga.c * gb.c, 36), w });
            }));
            const n36 = w => paths.filter(p => p.w === w).reduce((s, p) => s + p.n36, 0);
            const m = {
                key, A: dice.a, B: dice.b, GA, GB, paths,
                winA: paths.filter(p => p.w === 'A'),
                winB: paths.filter(p => p.w === 'B'),
                draws: paths.filter(p => p.w === 'D'),
                nA: n36('A'), nB: n36('B'), nD: n36('D')
            };
            m.pA = F(m.nA, 36);
            m.pB = F(m.nB, 36);
            m.pD = F(m.nD, 36);
            modelCache = { key, m };
            return m;
        }

        // A sum of path probabilities as TeX pieces, one piece per term so long sums can wrap.
        // Up to three terms are written out (2/9 + 2/9 + 1/9), longer sums are grouped (4 · 1/6).
        function sumPieces(fracs) {
            if (!fracs.length) return ['0'];
            if (fracs.length <= 3) return fracs.map(fr);
            const order = [], count = new Map();
            fracs.forEach(f => {
                const k = f.p + '/' + f.q;
                if (!count.has(k)) { count.set(k, 0); order.push(f); }
                count.set(k, count.get(k) + 1);
            });
            return order.map(f => {
                const c = count.get(f.p + '/' + f.q);
                return c === 1 ? fr(f) : c + ' \\cdot ' + fr(f);
            });
        }

        const sumF = fracs => fracs.reduce((s, f) => addF(s, f), F(0, 1));

        // "$\frac29 +$ $\frac29 +$ $\frac19 =$ $\frac59$" - operators trail their term so a line
        // break never leaves a lonely "+" at the start of a line
        function sumUnits(fracs, opts = {}) {
            const pieces = sumPieces(fracs);
            const res = opts.result || sumF(fracs);
            const out = pieces.map((p, i) => '$' + p + (i < pieces.length - 1 ? ' +' : '') + '$');
            const single = fracs.length === 1 && pieces[0] === fr(res);
            if (!single) {
                out[out.length - 1] = out[out.length - 1].replace(/\$$/, ' =$');
                out.push('$' + fr(res) + '$');
            }
            if (opts.pct) out[out.length - 1] = out[out.length - 1].replace(/\$$/, ' ' + pctEq(res) + '$');
            return out.join(' ');
        }

        /* ----------------------------------------------------------- Canvas TeX */
        // A small TeX subset drawn with KaTeX's own fonts, so every number on the stage looks
        // exactly like the KaTeX in the coach box: digits, italic letters, \frac, \cdot,
        // \approx, \mid, \text{}, \mathbf{}, {,} and the usual spaces.
        const SYM = {
            cdot: '⋅', approx: '≈', mid: '∣', neq: '≠', le: '≤', ge: '≥', times: '×', to: '→',
            ldots: '…', lt: '<', gt: '>', pm: '±', Rightarrow: '⇒'
        };
        const REL = new Set(['=', '≈', '≠', '≤', '≥', '<', '>', '→', '⇒', '∣']);
        const BIN = new Set(['+', '−', '⋅', '×', '±']);

        function texParse(src) {
            const out = [];
            let i = 0;
            const readGroup = () => {
                while (src[i] === ' ') i++;
                if (src[i] !== '{') return src[i++] || '';
                let depth = 0;
                const start = i + 1;
                for (; i < src.length; i++) {
                    if (src[i] === '{') depth++;
                    else if (src[i] === '}' && --depth === 0) { i++; return src.slice(start, i - 1); }
                }
                return src.slice(start);
            };
            const ch = (s, font, cls) => out.push({ k: 'ch', s, font, cls });
            while (i < src.length) {
                const c = src[i];
                if (c === ' ') { i++; continue; }
                if (c === '\\') {
                    const mm = /^\\([a-zA-Z]+|.)/.exec(src.slice(i));
                    const name = mm ? mm[1] : '';
                    i += mm ? mm[0].length : 1;
                    if (name === 'frac' || name === 'tfrac' || name === 'dfrac') {
                        const n = readGroup(), d = readGroup();
                        out.push({ k: 'frac', num: texParse(n), den: texParse(d) });
                    } else if (name === 'text') {
                        out.push({ k: 'text', s: readGroup(), cls: 'ord' });
                    } else if (name === 'mathbf') {
                        const mark = list => list.forEach(a => { a.bold = true; if (a.k === 'frac') { mark(a.num); mark(a.den); } });
                        const inner = texParse(readGroup());
                        mark(inner);
                        inner.forEach(a => out.push(a));
                    } else if (name === ',') out.push({ k: 'space', em: 0.167 });
                    else if (name === ':') out.push({ k: 'space', em: 0.222 });
                    else if (name === ';') out.push({ k: 'space', em: 0.278 });
                    else if (name === 'quad') out.push({ k: 'space', em: 1 });
                    else if (name === '%') ch('%', 'main', 'ord');
                    else if (SYM[name]) {
                        const s = SYM[name];
                        ch(s, 'main', REL.has(s) ? 'rel' : (BIN.has(s) ? 'bin' : 'ord'));
                    } else ch(name, 'main', 'ord');
                    continue;
                }
                if (c === '{') {
                    // plain group - {,} is a decimal comma without the space after punctuation
                    texParse(readGroup()).forEach(a => { if (a.cls === 'punct') a.cls = 'ord'; out.push(a); });
                    continue;
                }
                i++;
                if (/[0-9.]/.test(c)) ch(c, 'main', 'ord');
                else if (/[A-Za-z]/.test(c)) ch(c, 'math', 'ord');
                else if (c === '-') ch('−', 'main', 'bin');
                else if (c === '+') ch('+', 'main', 'bin');
                else if (c === '=' || c === '<' || c === '>') ch(c, 'main', 'rel');
                else if (c === ',' || c === ';') ch(c, 'main', 'punct');
                else if (c === '(' || c === '[') ch(c, 'main', 'open');
                else if (c === ')' || c === ']') ch(c, 'main', 'close');
                else ch(c, 'main', REL.has(c) ? 'rel' : (BIN.has(c) ? 'bin' : 'ord'));
            }
            return out;
        }

        function texFont(a, size) {
            const w = a.bold ? 'bold ' : '';
            if (a.k === 'ch' && a.font === 'math') return w + 'italic ' + size + 'px KaTeX_Math, "Times New Roman", serif';
            return w + size + 'px KaTeX_Main, "Times New Roman", serif';
        }

        function layoutAtoms(atoms, size) {
            const items = [];
            let x = 0, asc = 0.7 * size, desc = 0.05 * size, prev = null;
            atoms.forEach(a => {
                if (a.k === 'space') { x += a.em * size; return; }
                let cls = a.k === 'frac' ? 'ord' : (a.cls || 'ord');
                if (cls === 'bin' && (!prev || prev === 'bin' || prev === 'rel' || prev === 'open' || prev === 'punct')) cls = 'ord';
                if (prev) {
                    if ((cls === 'rel' && prev !== 'open') || (prev === 'rel' && cls !== 'close')) x += 0.278 * size;
                    else if (cls === 'bin' || prev === 'bin') x += 0.222 * size;
                    else if (prev === 'punct') x += 0.167 * size;
                }
                if (a.k === 'frac') {
                    const fs = size * 0.8;
                    const N = layoutAtoms(a.num, fs), D = layoutAtoms(a.den, fs);
                    const pad = 0.12 * size, t = Math.max(1, 0.055 * size), gap = 0.14 * size, axis = -0.25 * size;
                    const w = Math.max(N.w, D.w) + 2 * pad;
                    const nb = axis - t / 2 - gap - N.desc;
                    const db = axis + t / 2 + gap + D.asc;
                    items.push({ kind: 'frac', x, w, N, D, nb, db, t, axis, pad });
                    asc = Math.max(asc, -(nb - N.asc));
                    desc = Math.max(desc, db + D.desc);
                    x += w;
                } else {
                    const font = texFont(a, size);
                    ctx.font = font;
                    const w = ctx.measureText(a.s).width;
                    items.push({ kind: 'ch', x, s: a.s, font });
                    if (/[()\[\]∣|gjpqy,;]/.test(a.s)) desc = Math.max(desc, 0.25 * size);
                    if (/[()\[\]∣|]/.test(a.s)) asc = Math.max(asc, 0.75 * size);
                    x += w;
                }
                prev = cls;
            });
            return { items, w: x, asc, desc };
        }

        const texCache = new Map();

        function texLayout(src, size) {
            const key = size + '|' + src;
            let L = texCache.get(key);
            if (!L) {
                L = layoutAtoms(texParse(src), size);
                if (texCache.size > 4000) texCache.clear();
                texCache.set(key, L);
            }
            return L;
        }

        function drawLayout(L, x0, base, color) {
            ctx.textBaseline = 'alphabetic';
            ctx.textAlign = 'left';
            L.items.forEach(it => {
                if (it.kind === 'ch') {
                    ctx.font = it.font;
                    ctx.fillStyle = color;
                    ctx.fillText(it.s, x0 + it.x, base);
                } else {
                    drawLayout(it.N, x0 + it.x + (it.w - it.N.w) / 2, base + it.nb, color);
                    drawLayout(it.D, x0 + it.x + (it.w - it.D.w) / 2, base + it.db, color);
                    ctx.fillStyle = color;
                    ctx.fillRect(x0 + it.x + it.pad * 0.5, base + it.axis - it.t / 2, it.w - it.pad, it.t);
                }
            });
        }

        // Draw TeX at (x, y). align: left | center | right, valign: baseline | middle | top
        function tex(src, x, y, size, color, o = {}) {
            const L = texLayout(String(src), size);
            let x0 = x;
            if (o.align === 'center') x0 = x - L.w / 2;
            else if (o.align === 'right') x0 = x - L.w;
            let base = y;
            if (o.valign === 'middle') base = y + (L.asc - L.desc) / 2;
            else if (o.valign === 'top') base = y + L.asc;
            if (o.bg) {
                const px = 0.28 * size, py = 0.16 * size;
                roundRect(x0 - px, base - L.asc - py, L.w + 2 * px, L.asc + L.desc + 2 * py, 0.3 * size);
                ctx.fillStyle = o.bg;
                ctx.fill();
                if (o.edge) { ctx.strokeStyle = o.edge; ctx.lineWidth = 1.2; ctx.stroke(); }
            }
            drawLayout(L, x0, base, color);
            return { x: x0, w: L.w, top: base - L.asc, bottom: base + L.desc, base };
        }

        /* ------------------------------------------------------------ Rich text */
        // Outfit words with $math$ inside and **bold**, wrapped at a width. A "unit" is
        // everything between two spaces, so "$4$-mal" never breaks apart.
        function richUnits(str) {
            const segs = [];
            let bold = false, buf = '';
            const flush = () => { if (buf) { segs.push({ t: 'text', s: buf, bold }); buf = ''; } };
            for (let i = 0; i < str.length;) {
                if (str[i] === '$') {
                    flush();
                    const j = str.indexOf('$', i + 1);
                    segs.push({ t: 'math', s: str.slice(i + 1, j < 0 ? str.length : j), bold });
                    i = j < 0 ? str.length : j + 1;
                } else if (str.startsWith('**', i)) {
                    flush(); bold = !bold; i += 2;
                } else buf += str[i++];
            }
            flush();
            const units = [];
            let cur = [];
            const push = () => { if (cur.length) { units.push(cur); cur = []; } };
            segs.forEach(sg => {
                if (sg.t === 'math') { cur.push(sg); return; }
                sg.s.split(/(\s+)/).forEach(p => {
                    if (!p) return;
                    if (/^\s+$/.test(p)) { push(); if (p.indexOf('\n') >= 0) units.push('BR'); }
                    else cur.push({ t: 'text', s: p, bold: sg.bold });
                });
            });
            push();
            return units;
        }

        function richLayout(str, size, maxW = 1e9, o = {}) {
            const wordFont = b => (b ? '600 ' : '400 ') + size + 'px Outfit, sans-serif';
            ctx.font = wordFont(false);
            const sp = ctx.measureText(' ').width;
            const lines = [];
            const fresh = () => ({ parts: [], w: 0, asc: 0.78 * size, desc: 0.24 * size });
            let cur = fresh();
            richUnits(String(str)).forEach(u => {
                if (u === 'BR') { lines.push(cur); cur = fresh(); return; }
                const parts = u.map(p => {
                    if (p.t === 'math') {
                        const L = texLayout(p.bold ? '\\mathbf{' + p.s + '}' : p.s, size * (o.mathScale || 1.12));
                        return { t: 'm', L, w: L.w };
                    }
                    ctx.font = wordFont(p.bold);
                    return { t: 'w', s: p.s, font: wordFont(p.bold), w: ctx.measureText(p.s).width };
                });
                const uw = parts.reduce((s, p) => s + p.w, 0);
                if (cur.parts.length && cur.w + sp + uw > maxW) { lines.push(cur); cur = fresh(); }
                if (cur.parts.length) cur.w += sp;
                parts.forEach(p => {
                    p.x = cur.w;
                    cur.parts.push(p);
                    cur.w += p.w;
                    if (p.t === 'm') { cur.asc = Math.max(cur.asc, p.L.asc); cur.desc = Math.max(cur.desc, p.L.desc); }
                });
            });
            lines.push(cur);
            const gap = (o.lineGap != null ? o.lineGap : 0.32) * size;
            let h = 0, w = 0;
            lines.forEach((l, i) => { h += l.asc + l.desc + (i ? gap : 0); w = Math.max(w, l.w); });
            return { lines, w, h, gap };
        }

        // y is the top of the block; returns its height
        function rich(str, x, y, size, color, o = {}) {
            const R = richLayout(str, size, o.maxW, o);
            let top = y;
            R.lines.forEach(l => {
                const base = top + l.asc;
                const x0 = o.align === 'center' ? x - l.w / 2 : (o.align === 'right' ? x - l.w : x);
                l.parts.forEach(p => {
                    if (p.t === 'm') drawLayout(p.L, x0 + p.x, base, color);
                    else {
                        ctx.font = p.font;
                        ctx.fillStyle = color;
                        ctx.textAlign = 'left';
                        ctx.textBaseline = 'alphabetic';
                        ctx.fillText(p.s, x0 + p.x, base);
                    }
                });
                top = base + l.desc + R.gap;
            });
            return R.h;
        }

        const richH = (str, size, maxW, o = {}) => richLayout(str, size, maxW, o).h;

        /* ----------------------------------------------------------- Primitives */
        function roundRect(x, y, w, h, r) {
            r = Math.max(0, Math.min(r, w / 2, h / 2));
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        function plate(x, y, w, h, edge) {
            roundRect(x, y, w, h, 16);
            ctx.fillStyle = C.plate;
            ctx.fill();
            ctx.strokeStyle = edge || C.plateEdge;
            ctx.lineWidth = edge ? 1.8 : 1.2;
            ctx.stroke();
        }

        // Orbitron for headers and labels - never for numbers in the content
        function label(text, x, y, size, color, align = 'left', weight = 700) {
            ctx.font = weight + ' ' + size + 'px Orbitron, sans-serif';
            ctx.fillStyle = color;
            ctx.textAlign = align;
            ctx.textBaseline = 'middle';
            ctx.fillText(text, x, y);
        }

        function line(x1, y1, x2, y2, color, width, dash) {
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.lineCap = 'round';
            if (dash) ctx.setLineDash(dash);
            ctx.stroke();
            if (dash) ctx.setLineDash([]);
        }

        function dot(x, y, r, fill, edge) {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fillStyle = fill;
            ctx.fill();
            if (edge) { ctx.strokeStyle = edge; ctx.lineWidth = 1.4; ctx.stroke(); }
        }

        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const ease = u => u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;

        /* ----------------------------------------------------------------- Hits */
        // Every view registers its tap targets while drawing, in design coordinates.
        // An offset stack keeps sub-drawings (a tree inside a view) simple.
        const hits = [];
        const offs = [{ x: 0, y: 0 }];

        function addHit(x, y, w, h, fn, cursor = 'pointer') {
            const o = offs[offs.length - 1];
            hits.push({ x: x + o.x, y: y + o.y, w, h, fn, cursor });
        }

        function withOffset(x, y, fn) {
            const o = offs[offs.length - 1];
            offs.push({ x: o.x + x, y: o.y + y });
            ctx.save();
            ctx.translate(x, y);
            try { fn(); } finally { ctx.restore(); offs.pop(); }
        }

        /* ---------------------------------------------------------------- State */
        const S = {
            mode: 'rundgang',          // rundgang (the deck, station by station) | labor (own dice)
            step: 0,                   // rundgang: current station
            view: 'spiel',             // labor: current view
            lab: presetDice('deck'),   // labor: the dice being edited
            labPreset: 'deck',
            anim: null,                // running roll
            last: null,                // last finished roll { ia, ib, key }
            score: { key: '', n: 0, A: 0, B: 0, D: 0 },
            sel: 0,                    // selected path (path rule, table)
            err: 0,                    // typical errors: which one
            merge: { die: 'B', grouped: true, u: 1, t0: 0, from: 1 },
            countHi: { A: null, B: null },
            focus: null,               // 'A' | 'B' - Solita points at one die
            recipeHi: -1,
            rulesHi: -1,
            sim: { key: '', n: 0, a: 0, b: 0, d: 0, hx: [], ha: [], hb: [], running: false, until: 0 },
            efron: 'AB',
            showSolution: false
        };

        function diceNow() {
            if (S.mode === 'labor') return S.lab;
            const st = STATIONS[S.step];
            return presetDice(st.dice || 'deck');
        }

        const model = () => buildModel(diceNow());

        function tintOf(key, m, v) {
            const G = key === 'A' ? m.GA : m.GB;
            const i = Math.max(0, G.findIndex(g => g.v === v));
            return TINTS[key][i % TINTS[key].length];
        }

        /* ----------------------------------------------------------------- Roll */
        // Lena rolls first, then Mia - the two stages, one after the other
        const ROLL = { A: [0, 650], B: [760, 1410], total: 1520 };

        function rollDice() {
            const m = model();
            S.anim = {
                t0: performance.now(),
                ia: Math.floor(Math.random() * 6),
                ib: Math.floor(Math.random() * 6),
                seed: Math.floor(Math.random() * 997),
                key: m.key
            };
            closePicker();
            kick();
        }

        function finishRoll() {
            const an = S.anim;
            S.anim = null;
            const m = model();
            if (!an || an.key !== m.key) return;
            S.last = { ia: an.ia, ib: an.ib, key: an.key };
            if (S.score.key !== m.key) S.score = { key: m.key, n: 0, A: 0, B: 0, D: 0 };
            const a = m.A.faces[an.ia], b = m.B.faces[an.ib];
            S.score.n++;
            S.score[a > b ? 'A' : (a < b ? 'B' : 'D')]++;
            dbg('Wurf ' + S.score.n + ': ' + m.A.name + ' ' + a + ' - ' + m.B.name + ' ' + b);
            refreshPanelLive();
        }

        // What a die shows right now: waiting, tumbling (random faces) or landed
        function dieShown(key, m, now) {
            const lastOk = S.last && S.last.key === m.key;
            const idle = lastOk ? (key === 'A' ? S.last.ia : S.last.ib) : 1;
            const an = S.anim;
            if (!an || an.key !== m.key) return { idx: idle, phase: lastOk ? 'done' : 'idle', p: 1 };
            const t = now - an.t0;
            const [s0, s1] = ROLL[key];
            const fin = key === 'A' ? an.ia : an.ib;
            if (t < s0) return { idx: idle, phase: 'wait', p: 0 };
            if (t >= s1) return { idx: fin, phase: 'done', p: 1 };
            const flick = Math.floor(t / 85) * 7 + an.seed + (key === 'A' ? 0 : 3);
            return { idx: (flick * 2654435761 >>> 0) % 6, phase: 'roll', p: (t - s0) / (s1 - s0) };
        }

        function rollOutcome(m) {
            if (!S.last || S.last.key !== m.key || S.anim) return null;
            const a = m.A.faces[S.last.ia], b = m.B.faces[S.last.ib];
            const i = m.GA.findIndex(g => g.v === a), j = m.GB.findIndex(g => g.v === b);
            return { a, b, i, j, k: i * m.GB.length + j, w: a > b ? 'A' : (a < b ? 'B' : 'D') };
        }

        /* --------------------------------------------------------------- Cube */
        // An isometric die: top face = the face that lies on top, the two visible sides are
        // real neighbours of it on the net (never its opposite face).
        function drawCube(cx, cy, s, key, m, idx, o = {}) {
            const die = key === 'A' ? m.A : m.B;
            const k = 0.866;
            const T0 = [cx, cy - s / 2], T1 = [cx + k * s, cy], T2 = [cx, cy + s / 2], T3 = [cx - k * s, cy];
            const down = p => [p[0], p[1] + s];
            const all = [0, 1, 2, 3, 4, 5];
            const fl = all.find(j => j !== idx && j !== OPP[idx]);
            const fri = all.find(j => j !== idx && j !== OPP[idx] && j !== fl && j !== OPP[fl]);
            const vec = (a, b) => [b[0] - a[0], b[1] - a[1]];
            const faces = [
                { pts: [T0, T1, T2, T3], idx, shade: 0, O: T0, u: vec(T0, T1), v: vec(T0, T3) },
                { pts: [T3, T2, down(T2), down(T3)], idx: fl, shade: 0.3, O: T3, u: vec(T3, T2), v: [0, s] },
                { pts: [T2, T1, down(T1), down(T2)], idx: fri, shade: 0.5, O: T2, u: vec(T2, T1), v: [0, s] }
            ];
            faces.forEach(f => {
                const val = die.faces[f.idx];
                const tint = tintOf(key, m, val);
                ctx.beginPath();
                f.pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
                ctx.closePath();
                ctx.fillStyle = '#0d1b33';
                ctx.fill();
                ctx.fillStyle = 'rgba(' + tint + ', ' + (0.66 - f.shade * 0.4).toFixed(2) + ')';
                ctx.fill();
                ctx.fillStyle = 'rgba(0, 0, 0, ' + f.shade * 0.55 + ')';
                ctx.fill();
                ctx.strokeStyle = o.glow ? C.orange : 'rgba(225, 240, 255, 0.92)';
                ctx.lineWidth = o.glow ? 3 : 2.2;
                ctx.lineJoin = 'round';
                ctx.stroke();
                ctx.save();
                ctx.transform(f.u[0] / 100, f.u[1] / 100, f.v[0] / 100, f.v[1] / 100, f.O[0], f.O[1]);
                tex(String(val), 50, 50, 54, f.shade ? 'rgba(255, 255, 255, 0.78)' : '#ffffff', { align: 'center', valign: 'middle' });
                ctx.restore();
            });
        }

        // Cube with tumble: bounces and wobbles while rolling, a soft shadow below
        function drawRollingCube(cx, cy, s, key, m, now, o = {}) {
            const st = dieShown(key, m, now);
            const p = st.p;
            const lift = st.phase === 'roll' ? Math.abs(Math.sin(p * Math.PI * 2.5)) * (1 - p) * 0.55 * s : 0;
            const rot = st.phase === 'roll' ? Math.sin(p * 17) * (1 - p) * 0.3 : 0;
            const baseY = cy + 1.5 * s + 0.12 * s;
            ctx.beginPath();
            ctx.ellipse(cx, baseY, 0.95 * s * (1 - lift / (2 * s)), 0.14 * s, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 0, 0, ' + (0.35 - lift / (4 * s)).toFixed(3) + ')';
            ctx.fill();
            ctx.save();
            ctx.translate(cx, cy + s);
            ctx.rotate(rot);
            ctx.translate(-cx, -(cy + s));
            drawCube(cx, cy - lift, s, key, m, st.idx, { glow: o.glow && st.phase === 'done' });
            ctx.restore();
            return st;
        }

        /* ---------------------------------------------------------------- Nets */
        function netCells(x, y, s) {
            return [[x, y], [x + s, y], [x + 2 * s, y], [x + s, y + s], [x + s, y + 2 * s], [x + s, y + 3 * s]];
        }

        // T-shaped net: three faces on top, three below the middle one (like the deck)
        function drawNet(x, y, s, key, m, o = {}) {
            const die = key === 'A' ? m.A : m.B;
            netCells(x, y, s).forEach(([cx, cy], idx) => {
                const v = die.faces[idx], tint = tintOf(key, m, v);
                const g = Math.max(1.5, s * 0.045);
                const lit = o.lit === idx, hl = o.hl != null && o.hl === v;
                roundRect(cx + g, cy + g, s - 2 * g, s - 2 * g, s * 0.14);
                ctx.fillStyle = '#0c1a31';
                ctx.fill();
                ctx.fillStyle = 'rgba(' + tint + ', ' + (lit || hl ? 0.75 : 0.42) + ')';
                ctx.fill();
                if (lit) {
                    ctx.save();
                    ctx.shadowColor = C.orange;
                    ctx.shadowBlur = 18;
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = Math.max(2.5, s * 0.06);
                    ctx.stroke();
                    ctx.restore();
                } else {
                    ctx.strokeStyle = hl ? 'rgb(' + tint + ')' : 'rgba(200, 225, 255, 0.6)';
                    ctx.lineWidth = hl ? Math.max(2.5, s * 0.06) : 1.3;
                    ctx.stroke();
                }
                tex(String(v), cx + s / 2, cy + s / 2, s * 0.46, '#ffffff', { align: 'center', valign: 'middle' });
                if (o.edit) addHit(cx, cy, s, s, h => openPicker(key, idx, h));
            });
        }

        // "$3$, $5$ und $7$ je $2$-mal" or "$4$ steht $4$-mal drauf, $6$ steht $2$-mal drauf"
        function countSentence(G) {
            const join = list => list.length === 1 ? list[0]
                : list.slice(0, -1).join(', ') + ' und ' + list[list.length - 1];
            if (G.length === 1) return '$' + G[0].v + '$ auf allen $6$ Flächen';
            if (G.every(g => g.c === G[0].c)) return join(G.map(g => '$' + g.v + '$')) + ' je $' + G[0].c + '$-mal';
            return join(G.map(g => '$' + g.v + '$: $' + g.c + '$-mal'));
        }

        /* ---------------------------------------------------------------- Tree */
        function treeGeom(m, o) {
            const nA = m.GA.length, nB = m.GB.length;
            const st1 = o.stage === 1;
            const X0 = 24, X1 = 220, X2 = st1 ? 220 : 430;
            const head = o.head != null ? o.head : 44;
            const L = st1 ? nA : nA * nB;
            const gap = st1 ? clamp(340 / nA, 52, 110) : (L <= 6 ? 58 : L <= 9 ? 48 : L <= 16 ? 38 : L <= 25 ? 31 : 26);
            const gapG = st1 ? 0 : (L <= 9 ? 16 : 8);
            const nodes1 = [], leaves = [];
            let y = head + gap / 2;
            m.GA.forEach((ga, i) => {
                if (st1) { nodes1.push({ i, y }); y += gap; return; }
                const y0 = y;
                m.GB.forEach((gb, j) => { leaves.push({ i, j, k: i * nB + j, y }); y += gap; });
                nodes1.push({ i, y: (y0 + y - gap) / 2 });
                y += gapG;
            });
            const bottom = (st1 ? y : y - gapG) - gap / 2;
            const rootY = (nodes1[0].y + nodes1[nodes1.length - 1].y) / 2;
            const fs = gap >= 50 ? 18 : gap >= 40 ? 16 : gap >= 32 ? 14 : 12;
            const k = fs / 18;
            const colW = { path: 112 * k + 10, p: 78 * k + 6, pct: 104 * k + 6 };
            let cx = X2 + (st1 ? 84 : 72);
            const colX = {};
            (o.cols || []).forEach(c => { colX[c] = cx + colW[c] / 2; cx += colW[c]; });
            const tagX = cx + 4;
            const w = Math.max(cx + 6, X2 + 80) + (o.tagRoom ? 100 : 0);
            const h = bottom + (o.legend ? 42 : 10);
            return { X0, X1, X2, head, nodes1, leaves, rootY, gap, fs, colX, colW, tagX, w, h, st1, bottom };
        }

        // Fraction on a branch: above the line when it climbs, below when it falls
        function branchLabel(x1, y1, x2, y2, src, size, color, t) {
            const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
            const px = x1 + dx * t, py = y1 + dy * t;
            const L = texLayout(src, size);
            let nx, ny;
            if (Math.abs(dy) < 0.5) { nx = 0; ny = -1; }
            else if (dy < 0) { nx = dy / len; ny = -dx / len; }
            else { nx = -dy / len; ny = dx / len; }
            const hw = L.w / 2 + 0.28 * size, hh = (L.asc + L.desc) / 2 + 0.16 * size;
            const dist = hh * Math.abs(ny) + hw * Math.abs(nx) + 3;
            tex(src, px + nx * dist, py + ny * dist, size, color, { align: 'center', valign: 'middle', bg: C.labelBg });
        }

        function drawTree(m, g, o = {}) {
            const H = Object.assign({
                s1: '1. Stufe: ' + m.A.name, s2: '2. Stufe: ' + m.B.name,
                path: 'Pfad', p: 'Wahrsch.', pct: 'in %'
            }, o.headers || {});
            const sel = (o.sel != null && o.sel >= 0 && !g.st1) ? m.paths[o.sel] : null;
            const rows = g.st1
                ? g.nodes1.map(n => ({ y: n.y, f: m.GA[n.i].f, p: null, k: -1 }))
                : g.leaves.map(l => ({ y: l.y, f: m.paths[l.k].f, p: m.paths[l.k], k: l.k }));

            if (o.bands) {
                roundRect(g.X0 - 14, 4, g.X1 - g.X0 + 24, g.bottom + 4, 14);
                ctx.fillStyle = 'rgba(245, 194, 66, 0.07)';
                ctx.fill();
                roundRect(g.X1 + 16, 4, g.X2 - g.X1 + 40, g.bottom + 4, 14);
                ctx.fillStyle = 'rgba(0, 210, 255, 0.07)';
                ctx.fill();
            }

            label(H.s1, g.st1 ? g.X1 : (g.X0 + g.X1) / 2 + 20, 20, 12, C.orange, 'center');
            if (!g.st1) label(H.s2, (g.X1 + g.X2) / 2 + 30, 20, 12, C.cyan, 'center');
            Object.keys(g.colX).forEach(c => label(H[c], g.colX[c], 20, 11, C.soft, 'center', 400));

            // row highlights: the selected path and the path of the last roll
            const band = (r, fill, edge) => {
                roundRect(g.X2 - 22, r.y - g.gap / 2 + 3, g.w - g.X2 + 18 - (o.tagRoom ? 100 : 0), g.gap - 6, 10);
                ctx.fillStyle = fill;
                ctx.fill();
                ctx.strokeStyle = edge;
                ctx.lineWidth = 1.2;
                ctx.stroke();
            };
            if (sel) band(rows.find(r => r.k === sel.k), 'rgba(245, 194, 66, 0.10)', 'rgba(245, 194, 66, 0.5)');
            if (o.glowK != null && o.glowK >= 0) {
                const r = rows.find(q => q.k === o.glowK);
                if (r) band(r, 'rgba(0, 210, 255, 0.10)', 'rgba(157, 232, 255, 0.55)');
            }

            g.nodes1.forEach(n => {
                const on = (sel && sel.i === n.i) || (o.selI === n.i);
                line(g.X0, g.rootY, g.X1, n.y, on ? C.orange : C.branch, on ? 3.6 : 2);
            });
            if (!g.st1) {
                g.leaves.forEach(l => {
                    const p = m.paths[l.k], n = g.nodes1[l.i];
                    let col = C.branch, w = 1.7, dash = null;
                    if (o.win) {
                        if (p.w === 'A') { col = C.green; w = 2.8; } else { col = C.mutedLine; w = 1.4; }
                    }
                    const d = o.decor ? o.decor(p) : null;
                    if (d && d.line) { col = d.line; w = d.width || 2.6; dash = d.dash || null; }
                    if (sel && sel.k === l.k) { col = C.orange; w = 3.6; dash = null; }
                    line(g.X1, n.y, g.X2, l.y, col, w, dash);
                });
            }

            if (o.walk) {
                const n = g.nodes1[o.walk.i];
                const t1 = clamp(o.walk.t, 0, 1);
                const ex = g.X0 + (g.X1 - g.X0) * t1, ey = g.rootY + (n.y - g.rootY) * t1;
                line(g.X0, g.rootY, ex, ey, C.orange, 4);
                let px = ex, py = ey;
                if (!g.st1 && o.walk.t > 1) {
                    const leaf = g.leaves.find(l => l.i === o.walk.i && l.j === o.walk.j);
                    const t2 = clamp(o.walk.t - 1, 0, 1);
                    px = g.X1 + (g.X2 - g.X1) * t2;
                    py = n.y + (leaf.y - n.y) * t2;
                    line(g.X1, n.y, px, py, C.orange, 4);
                }
                ctx.save();
                ctx.shadowColor = C.orange;
                ctx.shadowBlur = 16;
                dot(px, py, 8, C.orange, '#ffffff');
                ctx.restore();
            }

            if (o.probs !== false) {
                g.nodes1.forEach(n => {
                    branchLabel(g.X0, g.rootY, g.X1, n.y, fr(m.GA[n.i].f), g.fs + 3, C.text, 0.5);
                });
                if (!g.st1) {
                    g.leaves.forEach(l => {
                        const gb = m.GB[l.j], n = g.nodes1[l.i];
                        const ov = o.labelB ? o.labelB(gb) : null;
                        branchLabel(g.X1, n.y, g.X2, l.y, ov ? ov.tex : fr(gb.f), g.fs + 1, ov ? ov.color : C.text, 0.58);
                    });
                }
            }

            dot(g.X0, g.rootY, 5.5, C.neon, '#ffffff');
            g.nodes1.forEach(n => {
                const ga = m.GA[n.i];
                dot(g.X1, n.y, 6.5, 'rgb(' + TINTS.A[n.i % 6] + ')', '#ffffff');
                if (g.st1) tex(String(ga.v), g.X1 + 14, n.y, g.fs + 3, '#ffffff', { valign: 'middle' });
                else tex(String(ga.v), g.X1 - 4, n.y - 14, g.fs + 2, '#ffffff', { align: 'right', bg: C.labelBg });
            });
            g.leaves.forEach(l => {
                const p = m.paths[l.k], gb = m.GB[l.j];
                dot(g.X2, l.y, 5.5, 'rgb(' + TINTS.B[l.j % 6] + ')', '#ffffff');
                tex(String(gb.v), g.X2 + 13, l.y, g.fs + 1, o.win && p.w === 'A' ? C.greenHi : '#ffffff', { valign: 'middle' });
            });

            rows.forEach(r => {
                const d = r.p && o.decor ? o.decor(r.p) : null;
                const col = (d && d.text) ? d.text : (o.win && r.p && r.p.w === 'A' ? C.greenHi : C.text);
                const mid = { align: 'center', valign: 'middle' };
                if (g.colX.path && r.p) tex('(' + r.p.a + ' \\mid ' + r.p.b + ')', g.colX.path, r.y, g.fs - 1, col, mid);
                if (g.colX.p) {
                    const ov = (r.p && o.pTex) ? o.pTex(r.p) : null;
                    tex(ov ? ov.tex : fr(r.f), g.colX.p, r.y, g.fs + 3, ov ? ov.color : col, mid);
                }
                if (g.colX.pct) tex(pctTex(r.f), g.colX.pct, r.y, g.fs - 2, col, mid);
                if (d && d.tag) {
                    ctx.font = '600 ' + (g.fs - 2) + 'px Outfit, sans-serif';
                    ctx.fillStyle = d.line || C.redHi;
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(d.tag, g.tagX, r.y);
                }
                if (o.onRow && r.k >= 0) addHit(g.X1 + 40, r.y - g.gap / 2, g.w - g.X1 - 40, g.gap, () => o.onRow(r.k));
            });

            if (o.legend && m.winA.length) {
                rich('grün: **' + m.A.name + '** gewinnt', g.X0, g.bottom + 14, 15, C.greenHi);
            }
        }

        /* ============================================================== VIEWS */
        // Every view has a design size (landscape and, where it helps, portrait) and draws in
        // design coordinates. render() scales it into the free part of the stage.

        /* ------------------------------------------------------- Das Spiel */
        function sizeSpiel(m, tall) { return tall ? { w: 520, h: 900 } : { w: 940, h: 570 }; }

        function drawChips(items, cx, y, maxW, hiIdx) {
            const size = 16, padX = 14, h = 36, arrow = 30;
            ctx.font = '600 ' + size + 'px Outfit, sans-serif';
            const ws = items.map(t => ctx.measureText(t).width + 2 * padX);
            const total = ws.reduce((s, w) => s + w, 0) + arrow * (items.length - 1);
            const row = total <= maxW;
            let x = cx - total / 2, yy = y;
            items.forEach((t, i) => {
                const w = ws[i];
                const x0 = row ? x : cx - w / 2;
                roundRect(x0, yy, w, h, h / 2);
                const on = i === hiIdx;
                ctx.fillStyle = on ? 'rgba(245, 194, 66, 0.22)' : 'rgba(10, 24, 48, 0.8)';
                ctx.fill();
                ctx.strokeStyle = on ? C.orange : 'rgba(157, 232, 255, 0.35)';
                ctx.lineWidth = on ? 2 : 1.2;
                ctx.stroke();
                ctx.font = '600 ' + size + 'px Outfit, sans-serif';
                ctx.fillStyle = on ? C.orange : C.text;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(t, x0 + w / 2, yy + h / 2 + 1);
                if (i < items.length - 1) {
                    ctx.fillStyle = C.soft;
                    if (row) ctx.fillText('→', x0 + w + arrow / 2, yy + h / 2 + 1);
                    else ctx.fillText('↓', cx, yy + h + 11);
                }
                if (row) x += w + arrow; else yy += h + 22;
            });
            return row ? h : yy - y - 22;
        }

        function drawSpiel(m, W, H, tall, now) {
            addHit(0, 0, W, H, () => rollDice());
            const s = 108;
            const pA = tall ? [W / 2, 140] : [240, 180];
            const pB = tall ? [W / 2, 500] : [700, 180];
            const out = rollOutcome(m);
            label(m.A.name.toUpperCase(), pA[0], pA[1] - s / 2 - 42, 20, C.orange, 'center');
            label(m.B.name.toUpperCase(), pB[0], pB[1] - s / 2 - 42, 20, C.cyan, 'center');
            drawRollingCube(pA[0], pA[1], s, 'A', m, now, { glow: out && out.w === 'A' });
            drawRollingCube(pB[0], pB[1], s, 'B', m, now, { glow: out && out.w === 'B' });

            const symY = tall ? 360 : pA[1] + s / 2 + 10;
            if (out) {
                tex(out.w === 'A' ? '>' : (out.w === 'B' ? '<' : '='), W / 2, symY, 76,
                    out.w === 'A' ? C.greenHi : (out.w === 'B' ? C.redHi : C.soft), { align: 'center', valign: 'middle' });
            } else {
                tex('?', W / 2, symY, 64, 'rgba(157, 180, 214, 0.5)', { align: 'center', valign: 'middle' });
            }

            let msg, col = C.text, phase = -1;
            const an = S.anim && S.anim.key === m.key ? S.anim : null;
            if (an) {
                const t = now - an.t0;
                phase = t < ROLL.B[0] ? 0 : 1;
                msg = (phase === 0 ? m.A.name : m.B.name) + ' würfelt ...';
                col = C.soft;
            } else if (out) {
                phase = 2;
                msg = out.w === 'D' ? 'Unentschieden!' : (out.w === 'A' ? m.A.name : m.B.name) + ' gewinnt!';
                col = out.w === 'A' ? C.greenHi : (out.w === 'B' ? C.redHi : C.soft);
            } else {
                msg = 'Tippen zum Würfeln';
                col = C.soft;
            }
            const yRes = tall ? 740 : 410;
            label(msg.toUpperCase(), W / 2, yRes, 22, col, 'center');

            const hi = S.rulesHi >= 0 ? S.rulesHi : phase;
            const chipsY = yRes + 34;
            const ch = drawChips([m.A.name + ' würfelt', 'dann ' + m.B.name, 'größere Zahl gewinnt'], W / 2, chipsY, W - 40, hi);

            const sc = S.score;
            if (sc.key === m.key && sc.n > 0) {
                let str = 'Runden: $' + intTex(sc.n) + '$ · **' + m.A.name + '**: $' + intTex(sc.A) + '$ · **' + m.B.name + '**: $' + intTex(sc.B) + '$';
                if (sc.D) str += ' · unentschieden: $' + intTex(sc.D) + '$';
                rich(str, W / 2, chipsY + ch + 20, 16, C.soft, { align: 'center', maxW: W - 40 });
            }
        }

        /* ---------------------------------------------------- Die Würfelnetze */
        function sizeNetze(m, tall) { return tall ? { w: 420, h: 880 } : { w: 800, h: 480 }; }

        function drawNetze(m, W, H, tall, now) {
            addHit(0, 0, W, H, () => rollDice());
            const s = 64;
            const nets = tall
                ? [['A', W / 2 - 1.5 * s, 62], ['B', W / 2 - 1.5 * s, 472]]
                : [['A', 40, 62], ['B', W - 40 - 3 * s, 62]];
            nets.forEach(([key, x, y]) => {
                const die = key === 'A' ? m.A : m.B, G = key === 'A' ? m.GA : m.GB;
                label(dieTitle(die.name).toUpperCase(), x + 1.5 * s, y - 28, 14, key === 'A' ? C.orange : C.cyan, 'center');
                const st = dieShown(key, m, now);
                drawNet(x, y, s, key, m, {
                    lit: (st.phase === 'done' || st.phase === 'roll') ? st.idx : null,
                    hl: S.countHi[key],
                    edit: S.mode === 'labor'
                });
                rich(countSentence(G), x + 1.5 * s, y + 4 * s + 18, 16, C.text, { align: 'center', maxW: 3.8 * s });
            });
            if (!tall) {
                drawRollingCube(W / 2, 108, 42, 'A', m, now, {});
                drawRollingCube(W / 2, 262, 42, 'B', m, now, {});
                label(m.A.name.toUpperCase(), W / 2, 50, 11, C.orange, 'center');
                label(m.B.name.toUpperCase(), W / 2, 206, 11, C.cyan, 'center');
            }
            const note = S.mode === 'labor'
                ? 'Gleiche Zahlen, gleiche Farbe. **Fläche antippen:** neue Zahl wählen.'
                : 'Gleiche Zahlen, gleiche Farbe. **Tippen:** würfeln, die obere Fläche leuchtet.';
            rich(note, W / 2, H - 36, 15, C.soft, { align: 'center', maxW: W - 30 });
        }

        /* ------------------------------------------------------- Zweistufig */
        const TREE_Z = m => ({
            stage: 2, cols: ['path'], head: 112, bands: true, probs: false,
            headers: { s1: 'Stufe 1: ' + gen(m.A.name) + ' Wurf', s2: 'Stufe 2: ' + gen(m.B.name) + ' Wurf', path: 'Ausgang' }
        });

        function sizeZweistufig(m) {
            const g = treeGeom(m, TREE_Z(m));
            return { w: g.w + 10, h: g.h + 60 };
        }

        function drawZweistufig(m, W, H, tall, now) {
            addHit(0, 0, W, H, () => rollDice());
            const o = TREE_Z(m);
            const g = treeGeom(m, o);
            const an = S.anim && S.anim.key === m.key ? S.anim : null;
            if (an) {
                const t = now - an.t0;
                const tw = t < ROLL.A[1] ? t / ROLL.A[1] : (t < ROLL.B[0] ? 1 : 1 + (t - ROLL.B[0]) / (ROLL.B[1] - ROLL.B[0]));
                const a = m.A.faces[an.ia], b = m.B.faces[an.ib];
                o.walk = { i: m.GA.findIndex(x => x.v === a), j: m.GB.findIndex(x => x.v === b), t: clamp(tw, 0, 2) };
            }
            const out = rollOutcome(m);
            if (out) { o.sel = out.k; }
            drawTree(m, g, o);
            drawRollingCube((g.X0 + g.X1) / 2 + 20, 58, 22, 'A', m, now, {});
            drawRollingCube((g.X1 + g.X2) / 2 + 30, 58, 22, 'B', m, now, {});
            let str;
            if (out) {
                str = 'Ausgang $(' + out.a + ' \\mid ' + out.b + ')$: ' +
                    (out.w === 'D' ? '**unentschieden**' : '**' + (out.w === 'A' ? m.A.name : m.B.name) + '** gewinnt');
            } else {
                str = an ? 'Der Weg entsteht Stufe für Stufe ...' : '**Tippen:** würfeln und den Weg verfolgen';
            }
            rich(str, 24, g.h + 12, 17, out ? (out.w === 'A' ? C.greenHi : (out.w === 'B' ? C.redHi : C.soft)) : C.soft, { maxW: W - 40 });
        }

        /* ----------------------------------------------------- Die Würfel lesen */
        function countWarn(G) {
            if (G.length < 2 || G.every(g => g.c === G[0].c)) return null;
            const big = G.reduce((x, g) => g.c > x.c ? g : x, G[0]);
            const naive = F(1, G.length);
            if (eqF(big.f, naive)) return null;
            return '**Achtung:** Die $' + big.v + '$ steht **$' + big.c + '$-mal** drauf, also $' + fr(big.f) +
                '$ und nicht $' + fr(naive) + '$!';
        }

        const COUNT_W = 450;

        function countBlockH(m, key) {
            const G = key === 'A' ? m.GA : m.GB;
            return 62 + 26 + 46 * G.length + 14 + 34 + (countWarn(G) ? 58 : 0);
        }

        function drawCountBlock(m, key, x, y) {
            const w = COUNT_W;
            const die = key === 'A' ? m.A : m.B, G = key === 'A' ? m.GA : m.GB;
            const colr = key === 'A' ? C.orange : C.cyan;
            const hB = countBlockH(m, key);
            if (S.focus === key) {
                roundRect(x - 14, y - 12, w + 28, hB + 12, 16);
                ctx.strokeStyle = 'rgba(245, 194, 66, 0.75)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            label(dieTitle(die.name).toUpperCase(), x, y + 10, 14, colr, 'left');
            rich('sechs Flächen, ' + (G.length === 1 ? 'eine Zahl' : WORDS[G.length] + ' Zahlen'), x, y + 26, 15, C.soft);
            const s = 24;
            drawNet(x + w - 3 * s, y, s, key, m, { hl: S.countHi[key], edit: S.mode === 'labor' });

            const cw = [72, 138, w - 3 * s - 20 - 210];
            const ty = y + 62;
            label('Zahl', x + cw[0] / 2, ty + 10, 10, C.soft, 'center', 400);
            label('wie oft?', x + cw[0] + 8, ty + 10, 10, C.soft, 'left', 400);
            label('Wahrscheinlichkeit', x + cw[0] + cw[1], ty + 10, 10, C.soft, 'left', 400);
            line(x, ty + 24, x + cw[0] + cw[1] + cw[2], ty + 24, 'rgba(157, 232, 255, 0.3)', 1);
            G.forEach((gg, r) => {
                const ry = ty + 26 + r * 46, cy = ry + 23;
                const tint = TINTS[key][r % 6];
                const hi = S.countHi[key] === gg.v;
                if (hi) {
                    roundRect(x - 6, ry + 2, cw[0] + cw[1] + cw[2] + 12, 42, 9);
                    ctx.fillStyle = 'rgba(' + tint + ', 0.18)';
                    ctx.fill();
                }
                roundRect(x + 12, ry + 7, 48, 32, 7);
                ctx.fillStyle = 'rgba(' + tint + ', 0.45)';
                ctx.fill();
                ctx.strokeStyle = 'rgb(' + tint + ')';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                tex(String(gg.v), x + 36, cy, 20, '#ffffff', { align: 'center', valign: 'middle' });
                const str = '$' + gg.c + '$-mal von $6$';
                rich(str, x + cw[0] + 8, cy - richH(str, 16) / 2, 16, C.text);
                const raw = '\\frac{' + gg.c + '}{6}';
                tex(eqF(gg.f, { p: gg.c, q: 6 }) ? raw : raw + ' = ' + fr(gg.f), x + cw[0] + cw[1], cy, 18, C.text, { valign: 'middle' });
                addHit(x - 6, ry, w + 12, 46, () => { S.countHi[key] = hi ? null : gg.v; render(); });
            });
            let yy = ty + 26 + 46 * G.length + 14;
            rich('Kontrolle: ' + sumUnits(G.map(g => g.f)), x, yy, 16, C.greenHi, { maxW: w });
            yy += 34;
            const warn = countWarn(G);
            if (warn) rich(warn, x, yy, 16, C.redHi, { maxW: w });
        }

        function sizeZaehlen(m, tall) {
            const hA = countBlockH(m, 'A'), hB = countBlockH(m, 'B');
            return tall ? { w: COUNT_W + 30, h: hA + hB + 70 } : { w: 2 * COUNT_W + 80, h: Math.max(hA, hB) + 30 };
        }

        function drawZaehlen(m, W, H, tall) {
            if (tall) {
                drawCountBlock(m, 'A', 15, 20);
                drawCountBlock(m, 'B', 15, 20 + countBlockH(m, 'A') + 40);
            } else {
                drawCountBlock(m, 'A', 20, 20);
                drawCountBlock(m, 'B', W - COUNT_W - 20, 20);
            }
        }

        /* ----------------------------------------------- Äste zusammenfassen */
        const MERGE_MS = 650;

        function mergeU(now) {
            const mg = S.merge, target = mg.grouped ? 1 : 0;
            if (!mg.t0) return target;
            const p = (now - mg.t0) / MERGE_MS;
            if (p >= 1) { mg.t0 = 0; return target; }
            return mg.from + (target - mg.from) * ease(p);
        }

        function toggleMerge(grouped) {
            const now = performance.now();
            const cur = mergeU(now);
            S.merge.grouped = grouped != null ? grouped : !S.merge.grouped;
            S.merge.from = cur;
            S.merge.t0 = now;
            kick();
            refreshPanelLive();
        }

        function sizeMerge(m, tall) { return tall ? { w: 470, h: 900 } : { w: 920, h: 480 }; }

        function drawMerge(m, W, H, tall, now) {
            addHit(0, 0, W, H, () => toggleMerge());
            const key = S.merge.die;
            const die = key === 'A' ? m.A : m.B, G = key === 'A' ? m.GA : m.GB;
            const u = mergeU(now);
            const top = 84, span = 360, X0 = 36, X1 = 300, rootY = top + span / 2;
            const sorted = die.faces.slice().sort((a, b) => a - b);
            const y6 = i => top + (i + 0.5) * span / 6;
            const yG = gi => top + (gi + 0.5) * span / G.length;
            const words = G.length === 1 ? 'EIN AST' : WORDS[G.length].toUpperCase() + ' ÄSTE';
            label(dieTitle(die.name).toUpperCase(), 20, 22, 14, key === 'A' ? C.orange : C.cyan, 'left');
            label(u < 0.5 ? 'SECHS ÄSTE, JE EIN SECHSTEL' : words + ', GLEICHE ZAHLEN ZUSAMMEN', 20, 50, 12, C.soft, 'left', 400);

            const ys = sorted.map((v, i) => {
                const gi = G.findIndex(g => g.v === v);
                return { v, gi, y: y6(i) + (yG(gi) - y6(i)) * u };
            });
            ys.forEach(b => line(X0, rootY, X1, b.y, 'rgba(' + TINTS[key][b.gi % 6] + ', 0.95)', 2.2 + 1.4 * u));
            dot(X0, rootY, 5.5, C.neon, '#ffffff');
            if (u === 0) {
                ys.forEach(b => branchLabel(X0, rootY, X1, b.y, '\\frac{1}{6}', 15, C.text, 0.66));
            } else if (u === 1) {
                G.forEach((g, gi) => branchLabel(X0, rootY, X1, yG(gi), fr(g.f), 18, C.text, 0.55));
            }
            const drawn = new Set();
            ys.forEach(b => {
                const k = u === 1 ? 'g' + b.gi : 'f' + b.y.toFixed(1);
                if (drawn.has(k)) return;
                drawn.add(k);
                dot(X1, b.y, 6, 'rgb(' + TINTS[key][b.gi % 6] + ')', '#ffffff');
                tex(String(b.v), X1 + 14, b.y, 19, '#ffffff', { valign: 'middle' });
            });

            const px = tall ? 20 : 420, py = tall ? top + span + 40 : 70, pw = tall ? W - 40 : W - 440;
            plate(px, py, pw, tall ? H - py - 20 : 380);
            label('SECHSTEL ADDIEREN', px + 20, py + 26, 12, C.orange, 'left');
            let yy = py + 50;
            G.forEach((g, gi) => {
                let s;
                if (g.c === 1) s = '$' + g.v + '$: $\\frac{1}{6}$';
                else {
                    s = '$' + g.v + '$: $' + Array(g.c).fill('\\frac{1}{6}').join(' + ') + ' = \\frac{' + g.c + '}{6}' +
                        (eqF(g.f, { p: g.c, q: 6 }) ? '' : ' = ' + fr(g.f)) + '$';
                }
                yy += rich(s, px + 20, yy, 18, 'rgb(' + TINTS[key][gi % 6] + ')', { maxW: pw - 40 }) + 12;
            });
            yy += 6;
            yy += rich('zusammen: ' + sumUnits(G.map(g => g.f)), px + 20, yy, 18, C.greenHi, { maxW: pw - 40 }) + 14;
            rich('Die Äste, die an **einem Punkt** starten, ergeben zusammen immer $1$.', px + 20, yy, 16, C.soft, { maxW: pw - 40 });
        }

        /* ------------------------------------------------------ Stufe 1 und 2 */
        const TREE_1 = { stage: 1, cols: ['p', 'pct'] };

        function sizeStufe1(m) {
            const g = treeGeom(m, TREE_1);
            return { w: g.w + 10, h: g.h + 50 };
        }

        function drawStufe1(m, W, H) {
            const g = treeGeom(m, TREE_1);
            drawTree(m, g, TREE_1);
            rich('Kontrolle: ' + sumUnits(m.GA.map(x => x.f)), 24, g.h + 8, 17, C.greenHi, { maxW: W - 40 });
        }

        const TREE_2 = { stage: 2, cols: [] };

        function stufe2Lines(m) {
            const nA = m.GA.length, nB = m.GB.length;
            const list = m.GB.map(x => '$' + fr(x.f) + '$ bei der $' + x.v + '$');
            return [
                'An **jedes** Ende von Stufe $1$ kommen ' + gen(m.B.name) + ' Äste.',
                'Überall dieselben: ' + list.join(', ') + '.',
                'Die Würfe sind **unabhängig**: ' + gen(m.A.name) + ' Ergebnis ändert nichts an ' + gen(m.B.name) + ' Würfel.',
                '$' + nA + ' \\cdot ' + nB + ' = ' + nA * nB + '$ **Wege** durch den Baum'
            ];
        }

        function sizeStufe2(m, tall) {
            const g = treeGeom(m, TREE_2);
            return tall ? { w: Math.max(g.w, 440) + 20, h: g.h + 330 } : { w: g.w + 400, h: Math.max(g.h, 360) + 10 };
        }

        function drawStufe2(m, W, H, tall) {
            const g = treeGeom(m, TREE_2);
            drawTree(m, g, TREE_2);
            const px = tall ? 16 : g.w + 30, py = tall ? g.h + 10 : 30;
            const pw = tall ? W - 32 : W - g.w - 40;
            plate(px, py, pw, tall ? H - py - 10 : 330);
            label('STUFE 2', px + 20, py + 26, 12, C.cyan, 'left');
            let yy = py + 50;
            stufe2Lines(m).forEach((s, i) => {
                yy += rich(s, px + 20, yy, i === 3 ? 22 : 17, i === 3 ? C.orange : C.text, { maxW: pw - 40 }) + 16;
            });
        }

        /* -------------------------------------------------------- Pfadregel */
        const TREE_P = { stage: 2, cols: ['path', 'p', 'pct'], legend: true };

        function sizePfad(m, tall) {
            const g = treeGeom(m, TREE_P);
            return tall ? { w: g.w + 20, h: g.h + 330 } : { w: g.w + 390, h: Math.max(g.h, 360) + 10 };
        }

        function allPathsLine(m) {
            return 'alle Wege: ' + sumUnits(m.paths.map(p => p.f));
        }

        function drawPfad(m, W, H, tall) {
            if (S.sel == null || S.sel < 0 || S.sel >= m.paths.length) S.sel = 0;
            const g = treeGeom(m, TREE_P);
            drawTree(m, g, Object.assign({ win: true, sel: S.sel, onRow: k => { S.sel = k; render(); } }, TREE_P));
            const p = m.paths[S.sel];
            const px = tall ? 16 : g.w + 24, py = tall ? g.h + 10 : 30;
            const pw = tall ? W - 32 : W - g.w - 34;
            plate(px, py, pw, tall ? H - py - 10 : 340, 'rgba(245, 194, 66, 0.55)');
            label('PFADREGEL', px + 20, py + 26, 12, C.orange, 'left');
            rich('Weg $(' + p.a + ' \\mid ' + p.b + ')$: alle Äste **malnehmen**', px + 20, py + 46, 16, C.soft, { maxW: pw - 40 });
            tex(fr(F(p.ca, 6)) + ' \\cdot ' + fr(F(p.cb, 6)) + ' = ' + fr(p.f), px + 20, py + 120, 32, '#ffffff');
            tex(pctEq(p.f), px + 20, py + 170, 22, C.text);
            const who = p.w === 'D' ? 'unentschieden' : '**' + (p.w === 'A' ? m.A.name : m.B.name) + '** gewinnt';
            rich('Auf diesem Weg: ' + who, px + 20, py + 190, 16, p.w === 'A' ? C.greenHi : (p.w === 'B' ? C.redHi : C.soft), { maxW: pw - 40 });
            label('KONTROLLE', px + 20, py + 246, 11, C.soft, 'left', 400);
            rich(allPathsLine(m), px + 20, py + 262, 17, C.greenHi, { maxW: pw - 40 });
        }

        /* ------------------------------------------------------ Wer gewinnt? */
        function tableGeom(m) {
            const L = m.paths.length;
            const rh = L <= 9 ? 46 : L <= 16 ? 36 : 28;
            const fs = rh >= 46 ? 18 : rh >= 36 ? 15 : 13;
            const cols = [
                { h: 'Weg', w: 130 }, { h: m.A.name, w: 100 }, { h: m.B.name, w: 100 },
                { h: 'Wer gewinnt?', w: 180 }, { h: 'Wahrsch.', w: 120 }
            ];
            const w = cols.reduce((s, c) => s + c.w, 0);
            return { rh, fs, cols, w, h: 50 + L * rh + 80 };
        }

        function sizeTabelle(m) {
            const t = tableGeom(m);
            return { w: t.w + 40, h: t.h + 20 };
        }

        function drawTabelle(m, W) {
            const t = tableGeom(m);
            const x0 = 20, y0 = 16;
            let cx = x0;
            t.cols.forEach(c => { label(c.h.toUpperCase(), cx + c.w / 2, y0 + 18, 11, C.soft, 'center', 400); cx += c.w; });
            line(x0, y0 + 40, x0 + t.w, y0 + 40, 'rgba(157, 232, 255, 0.4)', 1.2);
            m.paths.forEach((p, r) => {
                const ry = y0 + 44 + r * t.rh, cy = ry + t.rh / 2;
                if (r % 2) { ctx.fillStyle = 'rgba(157, 232, 255, 0.04)'; ctx.fillRect(x0, ry, t.w, t.rh); }
                let x = x0;
                const cell = i => { const c = t.cols[i]; const cxm = x + c.w / 2; x += c.w; return cxm; };
                const winCol = p.w === 'A' ? C.greenHi : (p.w === 'B' ? C.redHi : C.soft);
                tex('\\mathbf{(' + p.a + ' \\mid ' + p.b + ')}', cell(0), cy, t.fs, '#ffffff', { align: 'center', valign: 'middle' });
                tex(String(p.a), cell(1), cy, t.fs, C.text, { align: 'center', valign: 'middle' });
                tex(String(p.b), cell(2), cy, t.fs, C.text, { align: 'center', valign: 'middle' });
                const wx = x, ww = t.cols[3].w;
                roundRect(wx + 12, ry + 5, ww - 24, t.rh - 10, 8);
                ctx.fillStyle = p.w === 'A' ? 'rgba(121, 158, 49, 0.30)' : (p.w === 'B' ? 'rgba(176, 36, 24, 0.28)' : 'rgba(159, 180, 214, 0.14)');
                ctx.fill();
                ctx.font = '600 ' + (t.fs - 1) + 'px Outfit, sans-serif';
                ctx.fillStyle = winCol;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(p.w === 'D' ? 'unentschieden' : (p.w === 'A' ? m.A.name : m.B.name), cell(3), cy + 1);
                tex(fr(p.f), cell(4), cy, t.fs, C.text, { align: 'center', valign: 'middle' });
                if (S.sel === p.k) {
                    roundRect(x0 - 4, ry + 1, t.w + 8, t.rh - 2, 9);
                    ctx.strokeStyle = C.orange;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
                addHit(x0, ry, t.w, t.rh, () => { S.sel = p.k; render(); });
            });
            const yb = y0 + 44 + m.paths.length * t.rh + 16;
            const list = m.winA.map(p => '$(' + p.a + ' \\mid ' + p.b + ')$').join(', ');
            const str = m.winA.length
                ? '**' + m.A.name + '** gewinnt auf $' + m.winA.length + '$ ' + (m.winA.length === 1 ? 'Weg' : 'Wegen') + ': ' + list
                : '**' + m.A.name + '** gewinnt auf keinem Weg.';
            rich(str, x0, yb, 17, C.greenHi, { maxW: t.w });
        }

        /* ----------------------------------------------------- Summenregel */
        const TREE_S = { stage: 2, cols: ['path', 'p'], legend: true };

        function sizeSumme(m, tall) {
            const g = treeGeom(m, TREE_S);
            return tall ? { w: Math.max(g.w, 460) + 20, h: g.h + 470 } : { w: g.w + 470, h: Math.max(g.h, 470) + 10 };
        }

        // The whole result, cut into equal parts: 5 green and 4 red cells of 9
        function drawBar(m, x, y, w) {
            const q = 36 / gcd(gcd(gcd(m.nA, m.nB), m.nD), 36);
            const parts = [[m.nA * q / 36, 'rgba(121, 158, 49, 0.9)'], [m.nB * q / 36, 'rgba(224, 106, 94, 0.85)'], [m.nD * q / 36, 'rgba(159, 180, 214, 0.5)']];
            const cells = [];
            parts.forEach(([n, col]) => { for (let i = 0; i < n; i++) cells.push(col); });
            const gap = q <= 12 ? 4 : (q <= 36 ? 2 : 0);
            const cw = (w - gap * (q - 1)) / q;
            cells.forEach((col, i) => {
                roundRect(x + i * (cw + gap), y, cw, 26, Math.min(5, cw / 3));
                ctx.fillStyle = col;
                ctx.fill();
            });
            return q;
        }

        function summeLines(m) {
            const L = [];
            const eq = (who, list, res) => '$P(\\text{' + who + '}) =$ ' + sumUnits(list.map(p => p.f), { result: res, pct: true });
            L.push({ s: eq(m.A.name + ' gewinnt', m.winA, m.pA), c: C.greenHi, size: 19 });
            L.push({ s: 'Gegenprobe: ' + eq(m.B.name + ' gewinnt', m.winB, m.pB), c: C.redHi, size: 17 });
            if (m.draws.length) L.push({ s: eq('unentschieden', m.draws, m.pD), c: C.soft, size: 17 });
            const tot = [m.pA, m.pB].concat(m.draws.length ? [m.pD] : []);
            L.push({ s: 'Kontrolle: $' + tot.map(fr).join(' + ') + ' = 1$', c: C.text, size: 17 });
            L.push({
                s: m.draws.length
                    ? 'Gleiche Zahlen auf beiden Würfeln: **Unentschieden** ist möglich.'
                    : 'Kein Unentschieden: Die Würfel haben **keine gemeinsame Zahl**.',
                c: C.soft, size: 15
            });
            return L;
        }

        function drawSumme(m, W, H, tall) {
            const g = treeGeom(m, TREE_S);
            drawTree(m, g, Object.assign({ win: true }, TREE_S));
            const px = tall ? 16 : g.w + 24, py = tall ? g.h + 10 : 20;
            const pw = tall ? W - 32 : W - g.w - 34;
            plate(px, py, pw, tall ? H - py - 10 : 450, 'rgba(121, 158, 49, 0.55)');
            label('SUMMENREGEL', px + 20, py + 26, 12, C.greenHi, 'left');
            rich('Alle Wege zum selben Ereignis **addieren**', px + 20, py + 44, 16, C.soft, { maxW: pw - 40 });
            let yy = py + 84;
            summeLines(m).forEach(l => { yy += rich(l.s, px + 20, yy, l.size, l.c, { maxW: pw - 40 }) + 16; });
            const q = drawBar(m, px + 20, yy + 4, pw - 40);
            if (q <= 36) {
                rich('$' + m.nA * q / 36 + '$ von $' + q + '$ gleich großen Teilen für **' + m.A.name + '**', px + 20, yy + 40, 15, C.soft, { maxW: pw - 40 });
            }
        }

        /* --------------------------------------------------- Typische Fehler */
        const ERR_KEYS = ['gleich', 'addiert', 'vergessen', 'multipliziert', 'einweg'];
        const ERR_LABELS = ['FALSCHE AST-WAHRSCHEINLICHKEIT', 'ENTLANG ADDIERT', 'WEG VERGESSEN', 'WEGE MULTIPLIZIERT', 'NUR EIN WEG'];

        // Every error is computed on the dice at hand, so the lab shows the same mistakes
        // on any pair - for Lena and Mia it reproduces the deck slide word for word.
        function errorCase(m, e) {
            const A = m.A.name, B = m.B.name;
            const P = who => '$P(\\text{' + who + ' gewinnt}) =$ ';
            const right = P(A) + sumUnits(m.winA.map(p => p.f), { result: m.pA });
            const noWin = !m.winA.length;
            switch (ERR_KEYS[e]) {
                case 'gleich': {
                    const nB = m.GB.length;
                    const naive = F(1, nB);
                    const big = m.GB.reduce((x, g) => g.c > x.c ? g : x, m.GB[0]);
                    const wrongP = p => mulF(F(p.ca, 6), naive);
                    const wrongWin = m.winA.map(wrongP);
                    return {
                        title: gen(B) + ' $' + big.v + '$ mit $' + fr(naive) + '$ statt $' + fr(big.f) + '$',
                        applies: !eqF(big.f, naive),
                        labelB: () => ({ tex: fr(naive), color: C.redHi }),
                        pTex: p => ({ tex: fr(wrongP(p)), color: C.redHi }),
                        wrong: [P(A) + sumUnits(wrongWin)],
                        right: [right],
                        why: 'Nicht die verschiedenen Zahlen zählen, sondern die **Flächen**: Die $' + big.v + '$ steht auf $' + big.c + '$ von $6$ Flächen.'
                    };
                }
                case 'addiert': {
                    const p0 = m.paths[0];
                    const add = p => addF(F(p.ca, 6), F(p.cb, 6));
                    const all = sumF(m.paths.map(add));
                    return {
                        title: 'Entlang eines Weges **addiert** statt multipliziert',
                        applies: true,
                        pTex: p => ({ tex: fr(add(p)), color: C.redHi }),
                        wrong: ['Weg $(' + p0.a + ' \\mid ' + p0.b + ')$: $' + fr(F(p0.ca, 6)) + ' + ' + fr(F(p0.cb, 6)) + ' = ' + fr(add(p0)) + '$',
                            'alle Wege zusammen: $' + fr(all) + '$'],
                        right: ['Weg $(' + p0.a + ' \\mid ' + p0.b + ')$: $' + fr(F(p0.ca, 6)) + ' \\cdot ' + fr(F(p0.cb, 6)) + ' = ' + fr(p0.f) + '$',
                            'alle Wege zusammen: $1$'],
                        why: 'Alle Wege zusammen müssen $1$ ergeben. Entlang eines Weges wird **multipliziert**.'
                    };
                }
                case 'vergessen': {
                    const f = m.winA.slice().sort((x, y) => (x.b - y.b) || (x.a - y.a)).pop();
                    const rest = m.winA.filter(p => p !== f);
                    return {
                        title: f ? 'Den Weg $\\mathbf{(' + f.a + ' \\mid ' + f.b + ')}$ vergessen' : 'Einen Weg vergessen',
                        applies: m.winA.length >= 2,
                        decor: p => (f && p.k === f.k) ? { line: C.redHi, dash: [7, 6], width: 2.6, text: C.redHi, tag: 'vergessen' } : null,
                        wrong: [P(A) + sumUnits(rest.map(p => p.f))],
                        right: [right],
                        why: f ? 'Die $' + f.a + '$ ist größer als die $' + f.b + '$, also gehört auch dieser Weg dazu.' : ''
                    };
                }
                case 'multipliziert': {
                    const prod = m.winA.reduce((s, p) => mulF(s, p.f), F(1, 1));
                    const big = prod.q > 1e9;
                    return {
                        title: 'Die Wege für ' + gen(A) + ' Sieg **multipliziert** statt addiert',
                        applies: m.winA.length >= 2,
                        decor: p => p.w === 'A' ? { line: C.redHi, width: 2.6, text: C.redHi } : null,
                        wrong: [P(A) + '$' + m.winA.map(p => fr(p.f)).join(' \\cdot ') + (big ? ' \\approx 0' : ' = ' + fr(prod) + ' ' + pctEq(prod)) + '$'],
                        right: [right],
                        why: 'Verschiedene Wege schließen sich aus: Sie werden **addiert**. Malnehmen macht das Ergebnis nur kleiner.'
                    };
                }
                default: {
                    const one = m.winA[0];
                    return {
                        title: 'Nur **einen** Weg genommen statt alle',
                        applies: m.winA.length >= 2,
                        decor: p => (p.w === 'A' && one && p.k !== one.k) ? { line: C.redHi, dash: [7, 6], width: 2.6, text: C.redHi, tag: 'fehlt' } : null,
                        wrong: one ? [P(A) + '$' + fr(one.f) + ' ' + pctEq(one.f) + '$'] : [],
                        right: [right],
                        why: '**' + A + '** gewinnt auf $' + m.winA.length + '$ Wegen, und alle gehören in die Summe.'
                    };
                }
            }
        }

        const TREE_F = { stage: 2, cols: ['path', 'p'], tagRoom: true };

        function sizeFehler(m, tall) {
            const g = treeGeom(m, TREE_F);
            return tall ? { w: Math.max(g.w, 470) + 20, h: g.h + 440 } : { w: g.w + 470, h: Math.max(g.h, 440) + 10 };
        }

        function drawFehler(m, W, H, tall) {
            const E = errorCase(m, S.err);
            const g = treeGeom(m, TREE_F);
