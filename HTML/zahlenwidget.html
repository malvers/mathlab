<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOC ALVERS MATHE-LABORE | Zahlen-Widget</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="js/cyber-clock.css">
    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-pink: #ff00ff;
            --bg-dark: #0a0f19;
            --border-color: rgba(0, 210, 255, 0.4);
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            gap: 40px;
        }

        .showcase-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 40px;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.1);
        }

        /* the central digits widget (js/cyber-clock.js) in the showcase size */
        .cyber-digits {
            --cc-size: 1.8rem;
            --cc-dw: 24px;
            --cc-h: 44px;
            --cc-sw: 10px;
            --cc-digit: var(--neon-blue);
            --cc-shadow: 0 0 15px rgba(0, 210, 255, 0.6);
        }

        .label {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .control-panel {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            background: transparent;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 8px 16px;
            font-family: 'Orbitron';
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }

        button:hover {
            background: var(--neon-blue);
            color: black;
            box-shadow: 0 0 15px var(--neon-blue);
        }
    </style>
    <link rel="icon" type="image/svg+xml" href="resources/favicon.svg">
    <link rel="icon" type="image/png" sizes="256x256" href="resources/favicon.png">
</head>
<body>

    <div class="showcase-container">
        <div>
            <div class="label">Fitness Value</div>
            <div id="widget-fitness" class="cyber-digits"></div>
        </div>

        <div>
            <div class="label">Sigma Strategy</div>
            <div id="widget-sigma" class="cyber-digits"></div>
        </div>

        <div>
            <div class="label">Generations</div>
            <div id="widget-gen" class="cyber-digits"></div>
        </div>

        <div class="control-panel">
            <button onclick="randomize()">RANDOMIZE DATA</button>
            <button onclick="toggleAuto()">TOGGLE AUTO-RUN</button>
        </div>
    </div>

    <script src="js/cyber-clock.js"></script>
    <script>
        /* the showcase uses the widget as every page does: CyberClock.digits(id, value, opts) */
        function updateCyberWidget(containerId, value, decimals, minDigits) {
            CyberClock.digits(containerId, value, { decimals: decimals, minDigits: minDigits });
        }

        // --- DEMO LOGIC ---
        let autoRun = false;
        let genCount = 1245;

        function randomize() {
            updateCyberWidget('widget-fitness', Math.random() * 9999, 2, 4);
            updateCyberWidget('widget-sigma', Math.random() * 20, 3, 2);
            updateCyberWidget('widget-gen', genCount++, 0, 5);
        }

        function toggleAuto() {
            autoRun = !autoRun;
            if (autoRun) runLoop();
        }

        function runLoop() {
            if (!autoRun) return;
            randomize();
            setTimeout(runLoop, 100);
        }

        // Initialisierung
        window.onload = () => {
            updateCyberWidget('widget-fitness', 8888.27, 2, 4);
            updateCyberWidget('widget-sigma', 0.045, 3, 2);
            updateCyberWidget('widget-gen', 968, 0, 5);
        };
    </script>
</body>
</html>
