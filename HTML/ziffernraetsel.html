    <script>
        function toggleSidebar() {
            const panel = document.getElementById('side-panel');
            panel.classList.toggle('collapsed');
            if (window.CyberLeftChrome && typeof CyberLeftChrome.publishResolvedScale === 'function') {
                CyberLeftChrome.publishResolvedScale();
            }
            setTimeout(() => {
                window.dispatchEvent(new Event('resize'));
                if (window.CyberLeftChrome && typeof CyberLeftChrome.publishResolvedScale === 'function') {
                    CyberLeftChrome.publishResolvedScale();
                }
            }, 400);
        }

        CyberBranding.init({
            useExternalStyles: true,
            title: CyberI18n.get('ui.coach_title'),
            subtitle: 'Ziffernrätsel',
        });
        // worked through on a tablet and at the board as well - the explanation column stacks under the board
        // below 900px, so only a genuinely tiny screen gets the warning
        CyberUI.init({ screenWarning: false });
        CyberUI.ensureScreenWarning({
            minWidth: 360, minHeight: 480,
            message: 'Für das Ziffernrätsel-Labor ist der Bildschirm sehr klein – quer halten hilft.',
        });
        if (window.CyberLeftChrome && typeof CyberLeftChrome.configure === 'function') {
            CyberLeftChrome.configure({ viewportOnlyZoom: true });
        }
        // on a narrow screen the board needs the room more than the controls do (0 is no screen, see trigonometrie)
        if (window.innerWidth > 0 && window.innerWidth < 900) document.getElementById('side-panel').classList.add('collapsed');
    </script>
    <script src="js/ziffernraetsel.js"></script>
