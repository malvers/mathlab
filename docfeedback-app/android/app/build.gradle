apply plugin: 'com.android.application'

// DocFeedback: the class's feedback (js/buzzer.js) on Doc's phone - one WebView on rueckmeldung.html?c=<code>
// (Doc, 10.11.2026: "eine App für das Feedback-Tool ... nicht verstanden, zu langsam, zu schnell ... auf dem Phone")
android {
    namespace 'de.docalvers.docfeedback'
    compileSdk 34

    defaultConfig {
        applicationId 'de.docalvers.docfeedback'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
