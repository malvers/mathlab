apply plugin: 'com.android.application'

android {
    namespace 'de.docalvers.docfit'
    compileSdk 34
    defaultConfig {
        applicationId 'de.docalvers.docfit'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
        // only the Pixel's ABI: Vosk's native library is ~9 MB per ABI
        ndk { abiFilters 'arm64-v8a' }
    }
    // the "Fasting" tab: the page in ../../web/fasting goes into the assets as fasting/ - its data file
    // (web/fasting/private/) is health data, gitignored, written by ../../tools/fasting_from_excel.py
    sourceSets {
        main { assets.srcDirs += ['../../web'] }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // offline speech recognition (Kaldi), with a closed grammar it is a keyword spotter: "DocFit" and "Stopp"
    implementation 'com.alphacephei:vosk-android:0.3.47@aar'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    // the list of times with swipe to delete
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    testImplementation 'junit:junit:4.13.2'
    // Android's org.json is only a stub in local unit tests: the real one for the storage tests (WeighingsTest)
    testImplementation 'org.json:json:20240303'
}

// Every APK must carry the Vosk model at assets/model-de (MainActivity: StorageService.unpack(..., "model-de", ...)).
// It is gitignored (~45 MB, ../build.sh fetches it); a build without it installs fine but the stopwatch only says
// "Spracherkennung fehlt" - happened on 21.11.2026 with builds from a fresh checkout, where the model's files landed
// in assets/ itself instead of assets/model-de/. So the build stops here, loudly, before anything is compiled.
def voskModelId = file('src/main/assets/model-de/uuid')
tasks.register('checkVoskModel') {
    doLast {
        if (!voskModelId.isFile()) {
            throw new GradleException("Vosk model missing: ${voskModelId} not found. Run docfit-app/build.sh (it puts "
                    + "vosk-model-small-de-0.15 into app/src/main/assets/model-de) - without it DocFit has no voice control.")
        }
        if (file('src/main/assets/am').exists() || file('src/main/assets/uuid').exists()) {
            throw new GradleException("Vosk model files lie directly in app/src/main/assets/ - they belong in "
                    + "app/src/main/assets/model-de/.")
        }
    }
}
tasks.named('preBuild') { dependsOn 'checkVoskModel' }
