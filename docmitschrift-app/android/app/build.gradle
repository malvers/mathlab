apply plugin: 'com.android.application'

android {
    namespace 'de.docalvers.docmitschrift'
    compileSdk 34

    defaultConfig {
        applicationId 'de.docalvers.docmitschrift'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        // the Mac fetches the recordings with "adb run-as", which only works for a debuggable app
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
