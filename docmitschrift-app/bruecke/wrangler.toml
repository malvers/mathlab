# DocMitschrift bridge (worker.js). Deploy: cd docmitschrift-app/bruecke && npx wrangler@4.40.0 deploy
# The tokens are Worker secrets (PHONE_TOKEN, MAC_TOKEN), set by ../bruecke.mjs einrichten - never here.
name = "docmitschrift-bruecke"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "docmitschrift"
