<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- adaptive-icon foreground: gold three-pointed star + ring, inside the safe zone
       (outer radius ~308 of 512) so the adaptive mask never clips it. Transparent background.
       Star = three filled bars (rects) rotated 120 deg, meeting at the centre. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3d0"/>
      <stop offset="45%" stop-color="#e7c873"/>
      <stop offset="100%" stop-color="#9c7a2e"/>
    </linearGradient>
  </defs>
  <circle cx="512" cy="512" r="290" fill="none" stroke="url(#gold)" stroke-width="36"/>
  <g fill="url(#gold)">
    <rect x="491" y="250" width="42" height="262" rx="21"/>
    <rect x="491" y="250" width="42" height="262" rx="21" transform="rotate(120 512 512)"/>
    <rect x="491" y="250" width="42" height="262" rx="21" transform="rotate(240 512 512)"/>
  </g>
</svg>
