<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Solita app icon — a glowing "sol" orb with radiating voice/sound-wave arcs (she listens + speaks).
       Brand gold rgb(245,194,66) on deep dark-blue (rule: never #000). 512px master → mipmap densities. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="78%">
      <stop offset="0%" stop-color="#102a58"/>
      <stop offset="100%" stop-color="#08142a"/>
    </radialGradient>
    <radialGradient id="orb" cx="42%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#ffe79a"/>
      <stop offset="50%" stop-color="#f5c242"/>
      <stop offset="100%" stop-color="#dd8c1c"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- radiating sound-wave arcs (voice) — symmetric, fading outward -->
  <g fill="none" stroke="#f5c242" stroke-linecap="round" filter="url(#glow)">
    <path d="M326.7 171.7 A110 110 0 0 1 326.7 340.3" stroke-width="13" opacity="0.9"/>
    <path d="M352.4 141.1 A150 150 0 0 1 352.4 370.9" stroke-width="11" opacity="0.55"/>
    <path d="M185.3 171.7 A110 110 0 0 0 185.3 340.3" stroke-width="13" opacity="0.9"/>
    <path d="M159.6 141.1 A150 150 0 0 0 159.6 370.9" stroke-width="11" opacity="0.55"/>
  </g>

  <!-- the sol orb -->
  <circle cx="256" cy="256" r="66" fill="url(#orb)" filter="url(#glow)"/>
  <circle cx="236" cy="236" r="20" fill="#fff4d6" opacity="0.65"/>
</svg>
