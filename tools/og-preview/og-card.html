<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>OG card template</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <style>
        /* Central card template for all link previews (Open Graph).
           Rendered head-less at exactly 1200x630 by make-og.mjs. */
        :root {
            --deep: rgb(8, 20, 42);
            --deep2: rgb(14, 36, 78);
            --gold: rgb(245, 194, 66);
            --ink: #e8f0ff;
            --muted: #8fa8cc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 1200px;
            height: 630px;
            overflow: hidden;
            background: var(--deep);
        }

        .card {
            position: relative;
            width: 1200px;
            height: 630px;
            display: grid;
            grid-template-columns: 500px 700px;
            background: radial-gradient(120% 140% at 0% 0%, var(--deep2) 0%, var(--deep) 62%);
            color: var(--ink);
        }

        /* ---- left: text panel ---- */
        .panel {
            position: relative;
            z-index: 3;
            padding: 54px 40px 46px 58px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand img {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            flex: 0 0 auto;
        }

        .brand span {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 17px;
            letter-spacing: 0.09em;
            line-height: 1.25;
            color: var(--muted);
            text-transform: uppercase;
        }

        .mid { padding-right: 6px; }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 58px;
            line-height: 1.06;
            letter-spacing: 0.005em;
            color: #fff;
            text-wrap: balance;
        }

        .rule {
            width: 108px;
            height: 5px;
            margin: 24px 0 20px;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--gold), rgba(245, 194, 66, 0));
        }

        .tagline {
            font-family: 'Outfit', sans-serif;
            font-weight: 300;
            font-size: 25px;
            line-height: 1.34;
            color: var(--muted);
        }

        .foot {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 400;
            font-size: 19px;
            letter-spacing: 0.14em;
            color: var(--gold);
        }

        .foot .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--gold);
            box-shadow: 0 0 14px rgba(245, 194, 66, .9);
        }

        /* ---- right: lab screenshot ---- */
        .shot {
            position: relative;
            overflow: hidden;
        }

        .shot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        /* Soft fade from the panel into the screenshot, so any lab blends in. */
        .shot::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                linear-gradient(90deg, var(--deep) 0%, rgba(8, 20, 42, .82) 12%, rgba(8, 20, 42, .10) 42%, rgba(8, 20, 42, 0) 68%),
                linear-gradient(0deg, rgba(8, 20, 42, .55) 0%, rgba(8, 20, 42, 0) 38%);
        }

        /* ---- full: a deck's title slide edge to edge, it carries its own title ----
           Only the wordmark stays, on a dark pill so it reads on any slide; the slide's footer is cut at the bottom. */
        .card.full { display: block; }
        .card.full .shot { position: absolute; inset: 0; }
        .card.full .shot img { object-position: top center; }
        .card.full .shot::after { background: none; }
        .card.full .panel { position: absolute; top: 0; left: 0; padding: 30px 0 0 34px; }
        .card.full .mid, .card.full .foot { display: none; }
        .card.full .brand {
            padding: 9px 18px 9px 9px;
            border-radius: 16px;
            background: rgba(8, 20, 42, .62);
            box-shadow: 0 0 0 1px rgba(143, 168, 204, .18);
        }
        .card.full .brand img { width: 44px; height: 44px; border-radius: 10px; }
        .card.full .brand span { font-size: 15px; color: #cfdcf2; }

        /* ---- bare: a page that is no lab (The Real Salary), its hero alone, no wordmark ---- */
        .card.full.bare .panel { display: none; }

        /* ---- brandcard: the site's default card (resources/og/default.jpg) for every page without a card of its own.
           Everything sits in the middle 630x630, so a messenger that crops the picture to a square tile (WhatsApp, the
           small Signal layout) still shows the whole lambda with the wordmark; the sides are only background. ---- */
        .brandcard-only { display: none; }
        .card.brandcard { display: block; }
        .card.brandcard .panel, .card.brandcard .shot { display: none; }
        .card.brandcard .brandcard-only { display: flex; }
        .card.brandcard {
            background:
                radial-gradient(circle at 50% 44%, rgba(245, 194, 66, .16) 0%, rgba(245, 194, 66, 0) 23%),
                radial-gradient(70% 90% at 50% 44%, var(--deep2) 0%, var(--deep) 70%);
        }
        /* faint rings around the logo and a sparse star field, both fading out towards the edges */
        .bc-rings {
            position: absolute; inset: 0;
            background: repeating-radial-gradient(circle at 50% 44%, rgba(0, 210, 255, 0) 0 58px, rgba(0, 210, 255, .10) 59px 60px);
            -webkit-mask-image: radial-gradient(circle at 50% 44%, #000 18%, transparent 62%);
            mask-image: radial-gradient(circle at 50% 44%, #000 18%, transparent 62%);
        }
        .bc-stars { position: absolute; inset: 0; }
        .bc-stars i { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #cfe0ff; }
        .bc-center {
            position: absolute; left: 50%; top: 0; width: 630px; height: 630px; transform: translateX(-50%);
            flex-direction: column; align-items: center; justify-content: center; text-align: center;
        }
        .bc-logo {
            width: 232px; height: 232px; border-radius: 50px;
            box-shadow: 0 0 0 1px rgba(245, 194, 66, .35), 0 18px 60px rgba(0, 0, 0, .45), 0 0 90px rgba(245, 194, 66, .28);
        }
        .bc-name {
            margin-top: 40px;
            font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 38px; line-height: 1.22;
            letter-spacing: 0.08em; text-transform: uppercase; color: #fff;
        }
        .bc-url {
            margin-top: 22px; display: flex; align-items: center; gap: 12px;
            font-family: 'Orbitron', sans-serif; font-weight: 400; font-size: 21px; letter-spacing: 0.14em; color: var(--gold);
        }
        .bc-url .dot {
            width: 9px; height: 9px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 14px rgba(245, 194, 66, .9);
        }

        /* Thin accent edge along the bottom of the whole card. */
        .card::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--gold) 0%, rgb(176, 36, 24) 48%, rgb(121, 158, 49) 100%);
            z-index: 4;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="panel">
            <div class="brand">
                <img id="og-logo" alt="">
                <span>Doc Alvers<br>Mathe-Labore</span>
            </div>
            <div class="mid">
                <h1 id="og-title">Titel</h1>
                <div class="rule"></div>
                <p class="tagline" id="og-tagline"></p>
            </div>
            <div class="foot"><span class="dot"></span><span>docalvers.de</span></div>
        </div>
        <div class="shot"><img id="og-shot" alt=""></div>
        <div class="bc-rings brandcard-only"></div>
        <div class="bc-stars brandcard-only" id="bc-stars"></div>
        <div class="bc-center brandcard-only">
            <img class="bc-logo" id="bc-logo" alt="">
            <div class="bc-name">Doc Alvers<br>Mathe-Labore</div>
            <div class="bc-url"><span class="dot"></span><span>docalvers.de</span></div>
        </div>
    </div>

    <script>
        // Called by make-og.mjs with { title, tagline, shot, logo, full, bare, brandcard } (images as data URIs).
        window.ogFill = function (data) {
            document.querySelector('.card').classList.toggle('full', !!data.full);
            document.querySelector('.card').classList.toggle('bare', !!data.bare);
            document.querySelector('.card').classList.toggle('brandcard', !!data.brandcard);
            if (data.brandcard) {
                if (data.logo) document.getElementById('bc-logo').src = data.logo;
                // a fixed pseudo-random star field (same picture on every run), thinner near the middle
                const box = document.getElementById('bc-stars');
                let seed = 7;
                const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
                for (let i = 0; i < 170; i++) {
                    const x = rnd() * 1200, y = rnd() * 630, d = Math.hypot((x - 600) / 1.4, y - 277);
                    if (d < 250 && rnd() < 0.8) continue;
                    const s = document.createElement('i');
                    const r = rnd() < 0.12 ? 3 : 2;
                    s.style.cssText = `left:${x.toFixed(1)}px;top:${y.toFixed(1)}px;width:${r}px;height:${r}px;opacity:${(0.25 + rnd() * 0.6).toFixed(2)}`;
                    box.appendChild(s);
                }
                return;
            }
            document.getElementById('og-title').textContent = data.title || '';
            document.getElementById('og-tagline').textContent = data.tagline || '';
            if (data.shot) document.getElementById('og-shot').src = data.shot;
            if (data.logo) document.getElementById('og-logo').src = data.logo;

            // Shrink the headline until it fits its box (long lab names).
            const h1 = document.getElementById('og-title');
            const box = document.querySelector('.mid');
            let size = 58;
            h1.style.fontSize = size + 'px';
            while (size > 30 && (h1.scrollHeight > 210 || box.scrollHeight > box.clientHeight)) {
                size -= 2;
                h1.style.fontSize = size + 'px';
            }
        };
    </script>
</body>

</html>
