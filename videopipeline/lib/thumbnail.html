<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>thumbnail</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap">
<style>
/* Central YouTube thumbnail layout (1280x720) for every film of the pipeline - driven by lib/thumbnail.mjs.
   Text block top left (brand, title, subtitle), film material as "pieces" cut out of ONE film frame.
   Without pieces the whole frame lies full-bleed under a scrim (hero mode). */
:root {
    --orange: rgb(245, 194, 66);
    --bg: rgb(4, 17, 38);
    --sub: rgb(170, 200, 235);
    --edge: rgba(120, 170, 255, 0.28);
}
html, body { margin: 0; }
body { width: 1280px; height: 720px; overflow: hidden; position: relative; font-family: Orbitron, sans-serif; color: #fff;
    background:
        radial-gradient(ellipse at 0% 0%, rgb(12, 38, 78) 0%, transparent 55%),
        radial-gradient(ellipse at 100% 0%, rgb(10, 28, 56) 0%, transparent 40%),
        var(--bg); }

.piece { position: absolute; box-sizing: border-box; background-repeat: no-repeat; }
.piece.border { border: 1px solid var(--edge); border-radius: 16px; }
.piece.border.fade-bottom { border-bottom: 0; border-radius: 16px 16px 0 0; }

/* hero mode: the frame fills the canvas, the scrim keeps the text readable */
#scrim { position: absolute; inset: 0; display: none; }   /* gradient is set in build(): it ends below the text block */
body.hero #scrim { display: block; }

#text { position: absolute; left: 44px; top: 40px; }
#brand { padding-left: 4px; font-weight: 500; font-size: 22px; line-height: 27px; letter-spacing: 0.2em; color: var(--orange); }
#title { margin: 15px 0 0; font-weight: 700; font-size: 78px; line-height: 1.1; letter-spacing: 0.005em; white-space: nowrap;
    text-shadow: 0 4px 28px rgba(4, 17, 38, 0.9); }
#title em { font-style: normal; color: var(--orange); }
#sub { margin-top: 14px; padding-left: 4px; font-weight: 500; font-size: 25px; line-height: 31px; letter-spacing: 0.06em; color: var(--sub);
    white-space: nowrap; text-shadow: 0 2px 14px rgba(4, 17, 38, 0.9); }
</style>
</head>
<body>
<div id="pieces"></div>
<div id="scrim"></div>
<div id="text">
    <div id="brand"></div>
    <h1 id="title"></h1>
    <div id="sub"></div>
</div>
<script>
// Load the frame, paint out what must not be seen (mouse pointer), hand back a blob URL plus its size.
async function prepareFrame(dataUrl, erase) {
    const img = new Image();
    img.src = dataUrl;
    await img.decode();
    const cv = document.createElement('canvas');
    cv.width = img.naturalWidth; cv.height = img.naturalHeight;
    const g = cv.getContext('2d');
    g.drawImage(img, 0, 0);
    for (const r of erase || []) {
        // fill with the colour just outside the rectangle - only meant for flat surroundings
        const p = g.getImageData(Math.max(0, r.x - 3), Math.max(0, r.y - 3), 1, 1).data;
        g.fillStyle = `rgb(${p[0]}, ${p[1]}, ${p[2]})`;
        g.fillRect(r.x, r.y, r.w, r.h);
    }
    const blob = await new Promise(res => cv.toBlob(res, 'image/png'));
    return { url: URL.createObjectURL(blob), w: cv.width, h: cv.height };
}

// Shrink a one-line-per-row element until its widest row fits.
function fit(el, maxWidth, minPx) {
    let px = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > maxWidth && px > minPx) { px -= 1; el.style.fontSize = px + 'px'; }
    if (el.id === 'sub') el.style.lineHeight = Math.round(px * 1.24) + 'px';
    return px;
}

const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

window.build = async function (cfg) {
    const frame = await prepareFrame(cfg.frame, cfg.erase);
    const hero = !cfg.pieces || !cfg.pieces.length;
    document.body.classList.toggle('hero', hero);
    const pieces = hero ? [{ sx: 0, sy: 0, sw: frame.w, sh: frame.h, x: 0, y: 0, w: 1280 }] : cfg.pieces;

    const host = document.getElementById('pieces');
    for (const p of pieces) {
        const k = p.w / p.sw;                                  // frame pixel -> canvas pixel
        const d = document.createElement('div');
        d.className = 'piece' + (p.border ? ' border' : '') + (p.fadeBottom ? ' fade-bottom' : '');
        d.style.cssText = `left:${p.x}px; top:${p.y}px; width:${p.w}px; height:${p.sh * k}px;` +
            `background-image:url(${frame.url}); background-size:${frame.w * k}px auto;` +
            `background-position:${-p.sx * k}px ${-p.sy * k}px;`;
        const masks = [];
        if (p.fadeBottom) masks.push(`linear-gradient(to bottom, #000 ${p.fadeBottom * 100}%, transparent 100%)`);
        if (p.fadeSides) masks.push(`linear-gradient(to right, transparent 0, #000 ${p.fadeSides}px, #000 calc(100% - ${p.fadeSides}px), transparent 100%)`);
        if (masks.length) {
            d.style.webkitMaskImage = d.style.maskImage = masks.join(', ');
            d.style.webkitMaskComposite = 'source-in';
            d.style.maskComposite = 'intersect';
        }
        host.appendChild(d);
    }

    document.getElementById('brand').textContent = cfg.brand;
    // *…* marks the accent colour inside a title line
    document.getElementById('title').innerHTML = cfg.title.map(l => esc(l).replace(/\*(.+?)\*/g, '<em>$1</em>')).join('<br>');
    document.getElementById('sub').textContent = cfg.sub || '';
    const room = cfg.textWidth || (hero ? 1100 : 852);
    // fonts load lazily - ask for both cuts explicitly, otherwise fit() measures the fallback font
    await Promise.all([document.fonts.load('700 78px Orbitron'), document.fonts.load('500 25px Orbitron')]);
    await document.fonts.ready;
    const titlePx = fit(document.getElementById('title'), room, 40);
    const subPx = fit(document.getElementById('sub'), room, 16);
    const textBottom = Math.round(document.getElementById('text').getBoundingClientRect().bottom);
    // hero: dark band behind the text only, the rest of the frame stays clear
    document.getElementById('scrim').style.background = `linear-gradient(to bottom, rgba(4, 17, 38, 0.94) 0,` +
        ` rgba(4, 17, 38, 0.9) ${textBottom + 12}px, rgba(4, 17, 38, 0) ${textBottom + 130}px)`;
    return {
        orbitron: document.fonts.check('700 78px Orbitron') && document.fonts.check('500 25px Orbitron'),
        titlePx, subPx, textBottom,
    };
};
</script>
</body>
</html>
